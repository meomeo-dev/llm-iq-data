<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#def2fa" />
      <stop offset="70%" stop-color="#fff8ed" />
      <stop offset="100%" stop-color="#f5e1c4" />
    </linearGradient>

    <!-- Pelican Plumage Gradient -->
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Beak Upper Gradient -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <!-- Gular Pouch Gradient -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="70%" stop-color="#f77f00" />
      <stop offset="100%" stop-color="#d62828" />
    </linearGradient>

    <!-- Bicycle Frame Metallic Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06d6a0" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#046c4e" />
    </linearGradient>

    <!-- Chrome / Metal Gradient -->
    <linearGradient id="chromeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Wheel Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Ground Shadow Filter -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(51, 65, 85, 0.35)" />
      <stop offset="70%" stop-color="rgba(51, 65, 85, 0.15)" />
      <stop offset="100%" stop-color="rgba(51, 65, 85, 0)" />
    </radialGradient>
  </defs>

  <style>
    .spoke { stroke: #94a3b8; stroke-width: 1.5; opacity: 0.7; }
  </style>

  <!-- Sky & Ground Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Road / Pathway -->
  <path d="M 0 510 Q 400 495 800 510 L 800 600 L 0 600 Z" fill="#e2e8f0" />
  <line x1="0" y1="512" x2="800" y2="512" stroke="#cbd5e1" stroke-width="3" />
  
  <!-- Motion Breeze Lines -->
  <line x1="80" y1="210" x2="20" y2="210" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
  <line x1="110" y1="230" x2="40" y2="230" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />
  <line x1="90" y1="250" x2="50" y2="250" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" />
  <line x1="130" y1="360" x2="60" y2="360" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  <line x1="100" y1="380" x2="30" y2="380" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" />

  <!-- Road dashed center marking -->
  <line x1="0" y1="550" x2="800" y2="550" stroke="#ffffff" stroke-width="4" stroke-dasharray="35 25" opacity="0.8" />

  <!-- Ground Shadows -->
  <ellipse cx="270" cy="515" rx="85" ry="16" fill="url(#groundShadow)" />
  <ellipse cx="570" cy="515" rx="85" ry="16" fill="url(#groundShadow)" />
  <ellipse cx="420" cy="520" rx="140" ry="18" fill="url(#groundShadow)" />

  <!-- ================= BICYCLE BACK WHEEL ================= -->
  <g id="back-wheel">
    <circle cx="270" cy="450" r="75" stroke="#1e293b" stroke-width="16" fill="none" />
    <circle cx="270" cy="450" r="82" stroke="#334155" stroke-width="2" fill="none" />
    <circle cx="270" cy="450" r="67" stroke="url(#rimGrad)" stroke-width="5" fill="none" />
    
    <!-- Spokes -->
    <line x1="270" y1="383" x2="270" y2="517" class="spoke" />
    <line x1="203" y1="450" x2="337" y2="450" class="spoke" />
    <line x1="223" y1="403" x2="317" y2="497" class="spoke" />
    <line x1="223" y1="497" x2="317" y2="403" class="spoke" />
    <line x1="209" y1="425" x2="331" y2="475" class="spoke" />
    <line x1="209" y1="475" x2="331" y2="425" class="spoke" />
    <line x1="245" y1="389" x2="295" y2="511" class="spoke" />
    <line x1="295" y1="389" x2="245" y2="511" class="spoke" />

    <!-- Hub & Cassette -->
    <circle cx="270" cy="450" r="14" fill="#64748b" />
    <circle cx="270" cy="450" r="7" fill="#cbd5e1" />
  </g>

  <!-- ================= BICYCLE FRONT WHEEL ================= -->
  <g id="front-wheel">
    <circle cx="570" cy="450" r="75" stroke="#1e293b" stroke-width="16" fill="none" />
    <circle cx="570" cy="450" r="82" stroke="#334155" stroke-width="2" fill="none" />
    <circle cx="570" cy="450" r="67" stroke="url(#rimGrad)" stroke-width="5" fill="none" />

    <!-- Spokes -->
    <line x1="570" y1="383" x2="570" y2="517" class="spoke" />
    <line x1="503" y1="450" x2="637" y2="450" class="spoke" />
    <line x1="523" y1="403" x2="617" y2="497" class="spoke" />
    <line x1="523" y1="497" x2="617" y2="403" class="spoke" />
    <line x1="509" y1="425" x2="631" y2="475" class="spoke" />
    <line x1="509" y1="475" x2="631" y2="425" class="spoke" />
    <line x1="545" y1="389" x2="595" y2="511" class="spoke" />
    <line x1="595" y1="389" x2="545" y2="511" class="spoke" />

    <!-- Hub -->
    <circle cx="570" cy="450" r="12" fill="#64748b" />
    <circle cx="570" cy="450" r="6" fill="#cbd5e1" />
  </g>

  <!-- ================= BICYCLE FRAMEWORK & GEARS ================= -->
  <g id="bike-frame">
    <!-- Rear Stays -->
    <line x1="270" y1="450" x2="420" y2="450" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="270" y1="450" x2="350" y2="330" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" />

    <!-- Chain Loop -->
    <path d="M 270 450 L 420 435 A 25 25 0 0 1 420 465 L 270 458 Z" 
          stroke="#475569" stroke-width="4" fill="none" stroke-dasharray="5 3" />

    <!-- Front Chainring Cog -->
    <circle cx="420" cy="450" r="23" fill="#334155" />
    <circle cx="420" cy="450" r="17" fill="#64748b" />
    <circle cx="420" cy="450" r="8" fill="#1e293b" />

    <!-- Main Triangle Tubes -->
    <line x1="420" y1="450" x2="520" y2="300" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" />
    <line x1="420" y1="450" x2="350" y2="310" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" />
    <line x1="350" y1="330" x2="515" y2="300" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" />

    <!-- Seatpost & Saddle -->
    <line x1="350" y1="330" x2="340" y2="280" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 310 278 C 320 273 345 272 365 275 C 375 277 380 282 375 288 C 370 293 355 292 342 291 C 325 290 315 287 310 278 Z" 
          fill="#854d0e" stroke="#583101" stroke-width="2" />

    <!-- Front Fork & Stem -->
    <line x1="570" y1="450" x2="520" y2="300" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="520" y1="300" x2="510" y2="265" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Handlebars -->
    <path d="M 510 265 L 515 240 L 535 240" fill="none" stroke="url(#chromeGrad)" stroke-width="7" stroke-linecap="round" />
    <path d="M 535 240 Q 560 238 550 260" fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round" />
    <path d="M 545 255 L 555 268" stroke="#854d0e" stroke-width="8" stroke-linecap="round" />
    <!-- Bell -->
    <circle cx="522" cy="233" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <circle cx="524" cy="231" r="2" fill="#fff" />
  </g>

  <!-- Far/Left Pedal Assembly -->
  <g id="left-pedal">
    <line x1="420" y1="450" x2="385" y2="395" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
    <rect x="370" y="390" width="26" height="8" rx="3" fill="#1e293b" transform="rotate(-15 385 395)" />
    <!-- Far webbed foot -->
    <path d="M 365 395 Q 380 380 405 388 Q 410 402 385 407 Z" fill="#ea580c" opacity="0.8" />
  </g>

  <!-- ================= PELICAN ================= -->
  <g id="pelican">
    <!-- Tail feathers -->
    <path d="M 270 280 C 240 285 220 270 205 285 C 225 295 240 300 275 295 Z" fill="#cbd5e1" />
    <path d="M 280 270 C 255 260 230 255 210 265 C 230 280 255 285 285 280 Z" fill="#94a3b8" />

    <!-- Left Leg -->
    <path d="M 330 330 Q 345 375 385 395" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Body / Torso -->
    <path d="M 270 275 C 265 240 300 200 360 210 C 420 220 445 260 435 320 C 425 365 370 375 320 360 C 280 345 272 305 270 275 Z" 
          fill="url(#featherGrad)" stroke="#cbd5e1" stroke-width="2" />
    <path d="M 380 240 Q 425 280 395 335 Q 380 300 375 265 Z" fill="#ffffff" opacity="0.6" />

    <!-- Right Leg -->
    <path d="M 350 335 Q 370 370 410 410" fill="none" stroke="#ea580c" stroke-width="9" stroke-linecap="round" />
    <path d="M 410 410 L 445 490" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" />
    
    <!-- Near/Right Pedal Assembly -->
    <g id="right-pedal">
      <line x1="420" y1="450" x2="455" y2="505" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" />
      <rect x="440" y="500" width="30" height="9" rx="3" fill="#0f172a" />
      <circle cx="420" cy="450" r="5" fill="#f8fafc" />
    </g>

    <!-- Right Webbed Foot on pedal -->
    <g id="right-foot">
      <path d="M 440 488 C 455 490 480 495 495 500 C 475 510 455 515 435 506 C 430 498 433 490 440 488 Z" fill="#f97316" />
      <path d="M 445 495 L 485 501 M 445 500 L 480 508 M 445 492 L 475 494" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Curved Neck -->
    <path d="M 370 225 C 380 180 405 130 450 125 C 485 120 505 140 490 175 C 475 210 440 230 410 240 Z" 
          fill="url(#featherGrad)" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Head & Crest -->
    <path d="M 450 135 C 455 105 485 95 515 105 C 540 115 545 140 535 160 C 515 175 470 170 450 135 Z" 
          fill="url(#featherGrad)" />
    <path d="M 465 110 C 445 95 430 100 420 108 C 435 115 448 116 460 120 Z" fill="#e2e8f0" />
    <path d="M 470 120 C 450 112 435 118 425 126 C 440 128 455 127 468 128 Z" fill="#cbd5e1" />

    <!-- Eye Group -->
    <ellipse cx="505" cy="125" rx="8" ry="9" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
    <circle cx="507" cy="124" r="4.5" fill="#0f172a" />
    <circle cx="509" cy="122" r="1.8" fill="#ffffff" />
    <path d="M 496 117 Q 508 113 518 118" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Gular Pouch -->
    <path d="M 495 160 C 520 195 565 240 600 230 C 625 220 625 180 595 155 C 570 148 545 150 495 160 Z" 
          fill="url(#pouchGrad)" stroke="#c2410c" stroke-width="2" />
    <path d="M 525 170 Q 560 215 595 210" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.6" />

    <!-- Fish Tail Peeking Out -->
    <g id="sneaky-fish" transform="translate(590, 160) rotate(-15)">
      <path d="M 12 0 C 25 -10 35 -15 42 -12 C 40 -3 30 2 35 10 C 25 8 18 5 12 0 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
      <line x1="33" y1="-5" x2="22" y2="-2" stroke="#0284c7" stroke-width="1" />
      <circle cx="36" cy="-7" r="1" fill="#fff" />
    </g>

    <!-- Upper Beak Bill -->
    <path d="M 520 135 L 670 148 C 685 150 690 156 680 162 C 655 170 580 168 515 155 Z" 
          fill="url(#beakGrad)" stroke="#d97706" stroke-width="2" />
    <path d="M 670 148 Q 688 152 682 163 Q 675 162 670 155 Z" fill="#b45309" />
    <line x1="530" y1="139" x2="665" y2="151" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="535" cy="138" rx="3" ry="1" fill="#78350f" />

    <!-- Wing Steering Handlebar -->
    <path d="M 310 260 C 330 220 380 230 420 265 C 455 295 490 280 540 258 C 525 272 505 285 470 295 C 430 305 380 345 325 330 C 300 310 300 280 310 260 Z" 
          fill="url(#featherGrad)" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M 345 250 C 375 255 410 280 435 315 C 410 320 370 320 340 300 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 535 252 C 552 248 558 258 550 268 C 540 270 535 260 535 252 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Cycling Cap -->
    <g id="cycling-cap">
      <path d="M 465 110 C 475 88 515 82 535 105 C 525 115 500 115 465 110 Z" fill="url(#capGrad)" />
      <path d="M 488 94 C 496 90 510 93 516 109 L 507 110 C 502 99 494 98 488 94 Z" fill="#ffffff" />
      <path d="M 530 102 C 545 92 560 92 562 100 C 550 108 535 108 530 102 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="498" cy="90" r="3.5" fill="#fef08a" />
    </g>

    <!-- Fluttering Scarf -->
    <g id="scarf">
      <path d="M 425 220 C 435 225 445 228 450 220 C 445 210 435 210 425 220 Z" fill="#dc2626" />
      <path d="M 426 216 C 395 210 380 190 350 195 C 370 208 395 220 424 223 Z" fill="#ef4444" />
      <path d="M 428 220 C 390 225 365 205 340 215 C 365 230 400 235 425 225 Z" fill="#dc2626" />
      <circle cx="365" cy="202" r="2.5" fill="#ffffff" />
      <circle cx="390" cy="210" r="2.5" fill="#ffffff" />
      <circle cx="410" cy="218" r="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Front Basket with Baguette -->
  <g id="front-basket" transform="translate(545, 235)">
    <path d="M 0 10 L 35 10 L 30 35 L 5 35 Z" fill="#d97706" stroke="#92400e" stroke-width="2" />
    <line x1="8" y1="18" x2="27" y2="18" stroke="#b45309" stroke-width="1.5" />
    <line x1="7" y1="26" x2="28" y2="26" stroke="#b45309" stroke-width="1.5" />
    <path d="M 12 12 Q 22 -12 28 -20 Q 35 -16 28 8 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <line x1="21" y1="-12" x2="25" y2="-9" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Motion Dust -->
  <g id="dust-clouds" opacity="0.6">
    <circle cx="175" cy="495" r="10" fill="#cbd5e1" />
    <circle cx="155" cy="498" r="7" fill="#cbd5e1" />
    <circle cx="140" cy="503" r="5" fill="#e2e8f0" />
    <circle cx="185" cy="505" r="8" fill="#e2e8f0" />
  </g>
</svg>