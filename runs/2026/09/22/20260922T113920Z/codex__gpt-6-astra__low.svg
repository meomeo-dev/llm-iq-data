<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a long orange bill rides a teal bicycle beside the sea.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#dff3f4"/>
      <stop offset="1" stop-color="#fff8e8"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd078"/>
      <stop offset="1" stop-color="#f3a146"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="28" fill="url(#sky)"/>
  <circle cx="664" cy="105" r="47" fill="#ffd887"/>
  <path d="M0 383 Q130 362 264 383 T530 383 T800 378 V491 H0Z"
        fill="#a9d9d9"/>
  <path d="M42 411h106m69-13h77m311 15h115"
        fill="none" stroke="#e6f6ee" stroke-width="5" stroke-linecap="round"/>
  <path d="M0 462 Q224 442 419 468 T800 459 V600 H0Z" fill="#f1dfbd"/>
  <ellipse cx="403" cy="518" rx="258" ry="18" fill="#d8c6a6" opacity=".5"/>

  <!-- Bicycle wheels and spokes -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#8fa5a7" stroke-width="2.5">
      <path d="M242 433v160m-80-80h160m-137-57 114 114m-114 0 114-114"
            transform="translate(0 -80)"/>
      <path d="M573 353v160m-80-80h160m-137-57 114 114m-114 0 114-114"/>
    </g>
    <g stroke="#293e49" stroke-width="12">
      <circle cx="242" cy="433" r="84"/>
      <circle cx="573" cy="433" r="84"/>
    </g>
    <g stroke="#faf4e4" stroke-width="3">
      <circle cx="242" cy="433" r="75"/>
      <circle cx="573" cy="433" r="75"/>
    </g>

    <!-- Far foot and pedal -->
    <path d="m396 311 30 48-38 43" stroke="#d98835" stroke-width="13"/>
    <path d="m388 397 29 9-36 6Z" fill="#e89b40" stroke="#293e49" stroke-width="3"/>
    <path d="m378 426 25-24m-10 0h25" stroke="#293e49" stroke-width="6"/>

    <!-- Teal frame -->
    <path d="m242 433 80-138 56 138H242l-6 0m86-138h191L378 433"
          stroke="#238b91" stroke-width="11"/>
    <path d="m513 295 60 138m-65-154-11-40 33-19"
          stroke="#293e49" stroke-width="8"/>
    <path d="m504 257 43-17 10 13" stroke="#293e49" stroke-width="9"/>
    <path d="m322 295-10-32" stroke="#293e49" stroke-width="7"/>
    <path d="M287 263h53" stroke="#293e49" stroke-width="13"/>
    <circle cx="378" cy="433" r="19" fill="#d9e7df" stroke="#293e49" stroke-width="5"/>
    <path d="m378 433 29 24m-14 0h31" stroke="#293e49" stroke-width="6"/>
    <circle cx="242" cy="433" r="7" fill="#293e49"/>
    <circle cx="573" cy="433" r="7" fill="#293e49"/>
  </g>

  <!-- Pelican tail, body, and curved neck -->
  <g stroke="#293e49" stroke-width="4" stroke-linejoin="round">
    <path d="m310 245-62-36 22 44-35-7 69 43Z" fill="#e1e9e3"/>
    <path d="M291 222
             C324 197 376 210 408 245
             C433 253 448 233 439 210
             C427 182 403 159 410 125
             C416 96 451 87 475 104
             C494 117 493 143 477 160
             C468 170 474 193 492 220
             C524 270 491 315 447 325
             C404 337 345 318 312 291
             C287 272 275 241 291 222Z"
          fill="#fffdf3"/>
    <path d="M306 239
             C331 224 380 238 413 285
             C376 306 334 287 306 239Z"
          fill="#e2e9e3"/>
    <path d="M323 246q28 11 49 34m-35-40q27 9 46 31"
          fill="none" stroke="#b1c2bf" stroke-width="3" stroke-linecap="round"/>

    <!-- Bill and hanging throat pouch -->
    <path d="M474 140 634 157
             C593 185 532 202 490 168Z"
          fill="url(#pouch)"/>
    <path d="M475 131 646 151
             Q654 154 644 159
             L477 150Z"
          fill="#f5ad46"/>
    <path d="m489 149 137 8" fill="none" stroke="#dc8838" stroke-width="2"/>
  </g>

  <!-- Eye and little crest -->
  <circle cx="459" cy="125" r="6" fill="#293e49"/>
  <circle cx="461" cy="123" r="2" fill="#fff"/>
  <path d="m423 104-12-14m22 9-3-17"
        stroke="#293e49" stroke-width="4" stroke-linecap="round"/>

  <!-- Near leg, webbed foot, and wing reaching the handlebar -->
  <g stroke="#293e49" stroke-linecap="round" stroke-linejoin="round">
    <path d="m372 311-14 51 47 76"
          fill="none" stroke="#e5a047" stroke-width="15"/>
    <path d="m400 432 33 19-12 7-32-8Z"
          fill="#f4b44f" stroke-width="3"/>
    <path d="M437 255q33-5 57-18l16 10"
          fill="none" stroke-width="16"/>
    <path d="M437 252q33-5 57-18l16 10"
          fill="none" stroke="#fffdf3" stroke-width="11"/>
  </g>

  <!-- Breeze -->
  <g fill="none" stroke="#78b4bd" stroke-width="4" stroke-linecap="round">
    <path d="M163 259h66m-89 22h67m-31 23h41"/>
    <path d="M91 136q12-13 24 0 12-13 24 0"/>
  </g>
</svg>