<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0d8ef"/>
      <stop offset="55%" stop-color="#e4f4fb"/>
      <stop offset="75%" stop-color="#fed6a3"/>
      <stop offset="100%" stop-color="#ffb58a"/>
    </linearGradient>

    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#368da8"/>
      <stop offset="100%" stop-color="#185066"/>
    </linearGradient>

    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="100%" stop-color="#ff9e42"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d63031"/>
      <stop offset="50%" stop-color="#e17055"/>
      <stop offset="100%" stop-color="#b71540"/>
    </linearGradient>

    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f2f6"/>
      <stop offset="50%" stop-color="#a4b0be"/>
      <stop offset="100%" stop-color="#747d8c"/>
    </linearGradient>

    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#f9ca24"/>
      <stop offset="55%" stop-color="#f0932b"/>
      <stop offset="100%" stop-color="#eb4d4b"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#d35400"/>
      <stop offset="50%" stop-color="#b33939"/>
      <stop offset="100%" stop-color="#801e1e"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84817a"/>
      <stop offset="40%" stop-color="#535c68"/>
      <stop offset="100%" stop-color="#2f3542"/>
    </linearGradient>

    <linearGradient id="wingGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#795548"/>
      <stop offset="50%" stop-color="#4e342e"/>
      <stop offset="100%" stop-color="#2d1d19"/>
    </linearGradient>

    <!-- Wheel Definition centered at (0,0) -->
    <g id="bicycle-wheel">
      <!-- Outer Tire & Rim -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#222" stroke-width="16"/>
      <circle cx="0" cy="0" r="102" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="8 6"/>
      <circle cx="0" cy="0" r="96" fill="none" stroke="url(#metalGrad)" stroke-width="7"/>
      <!-- Hub -->
      <circle cx="0" cy="0" r="14" fill="url(#metalGrad)" stroke="#57606f" stroke-width="2"/>
      <!-- Spokes (16 spokes: 8 crossing lines) -->
      <g stroke="#ced6e0" stroke-width="1.8" opacity="0.85">
        <line x1="0" y1="-96" x2="0" y2="96"/>
        <line x1="-96" y1="0" x2="96" y2="0"/>
        <line x1="-67.88" y1="-67.88" x2="67.88" y2="67.88"/>
        <line x1="-67.88" y1="67.88" x2="67.88" y2="-67.88"/>
        <line x1="-36.74" y1="-88.69" x2="36.74" y2="88.69"/>
        <line x1="-88.69" y1="-36.74" x2="88.69" y2="36.74"/>
        <line x1="-88.69" y1="36.74" x2="88.69" y2="-36.74"/>
        <line x1="-36.74" y1="88.69" x2="36.74" y2="-88.69"/>
      </g>
      <circle cx="0" cy="0" r="6" fill="#2f3542"/>
    </g>
  </defs>

  <style><![CDATA[
    /* CSS animations and bounce subtleties */
    @keyframes coastBreeze {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }
    @keyframes birdBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(0.6deg); }
      50% { transform: translateY(1.5px) rotate(0deg); }
      75% { transform: translateY(-3.5px) rotate(-0.5deg); }
    }
    @keyframes pouchPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02) rotate(-0.8deg); }
    }
    .ground-line {
      stroke-dasharray: 40 25;
      animation: groundScroll 0.75s linear infinite;
    }
    @keyframes groundScroll {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -65; }
    }
    .pelican-torso {
      transform-origin: 460px 380px;
      animation: birdBob 1.6s ease-in-out infinite;
    }
    .throat-pouch {
      transform-origin: 590px 220px;
      animation: pouchPulse 2s ease-in-out infinite;
    }
  ]]></style>

  <!-- ================= BACKGROUND ================= -->
  <rect x="0" y="0" width="1000" height="700" fill="url(#skyGrad)"/>

  <!-- Coastal Sun -->
  <circle cx="200" cy="240" r="110" fill="url(#sunGrad)" opacity="0.6"/>

  <!-- Distant Ocean & Coast -->
  <path d="M0 450 Q 250 435, 500 445 T 1000 440 L 1000 490 L 0 490 Z" fill="url(#seaGrad)" opacity="0.75"/>
  <ellipse cx="140" cy="465" rx="70" ry="12" fill="#2d6073" opacity="0.4"/>
  <ellipse cx="650" cy="460" rx="110" ry="14" fill="#2d6073" opacity="0.3"/>

  <!-- Pier / Boardwalk & Road -->
  <rect x="0" y="485" width="1000" height="15" fill="#c8d6e5"/>
  <rect x="0" y="500" width="1000" height="200" fill="#718093"/>
  <line x1="0" y1="504" x2="1000" y2="504" stroke="#dcdde1" stroke-width="4"/>

  <!-- Animated Boardwalk Planks / Road Markings -->
  <line class="ground-line" x1="0" y1="610" x2="1000" y2="610" stroke="#fbc531" stroke-width="6"/>
  <line class="ground-line" x1="0" y1="520" x2="1000" y2="520" stroke="#57606f" stroke-width="2"/>

  <!-- ================= BICYCLE (REAR LAYER) ================= -->
  <!-- Back / Left Leg (Far side, behind bike frame) -->
  <!-- BB Spindle at (500, 480). Crank length = 44. Left pedal crank is at angle 180° when Right is at 0°.
       Left Hip: (450, 375).
       Left Foot keyframes (anticlockwise circular path around 500,480):
         0.00s: Foot at (456, 480) [Crank back]   -> Hip (450,375), Foot (456,480) -> Knee at (418, 435)
         0.40s: Foot at (500, 524) [Crank bottom] -> Hip (450,375), Foot (500,524) -> Knee at (490, 452)
         0.80s: Foot at (544, 480) [Crank front]  -> Hip (450,375), Foot (544,480) -> Knee at (522, 420)
         1.20s: Foot at (500, 436) [Crank top]    -> Hip (450,375), Foot (500,436) -> Knee at (464, 396)
         1.60s: Foot at (456, 480)
  -->
  <g id="left-leg-assembly" opacity="0.88">
    <!-- Left Thigh & Shin -->
    <path id="left-leg-path" fill="none" stroke="#8854d0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
          d="M 450 375 Q 418 435 456 480">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
               values="M 450 375 Q 418 435 456 480;
                       M 450 375 Q 490 452 500 524;
                       M 450 375 Q 522 420 544 480;
                       M 450 375 Q 464 396 500 436;
                       M 450 375 Q 418 435 456 480"/>
    </path>
    <!-- Left Webbed Foot -->
    <g id="left-foot">
      <path d="M -16 -6 L 16 0 L -8 10 Z" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite"
                        values="456 480; 500 524; 544 480; 500 436; 456 480"/>
    </g>
  </g>

  <!-- Far-side Crank & Pedal (180 deg offset from drive crank) -->
  <g id="left-crank-system" transform="translate(500, 480)">
    <g>
      <!-- Rotates around (0,0) which is (500,480) -->
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="1.6s" repeatCount="indefinite"/>
      <!-- Crank arm -->
      <rect x="-6" y="-6" width="50" height="12" rx="6" fill="#747d8c" stroke="#2f3542" stroke-width="1.5"/>
      <!-- Pedal spindle & body at (44, 0) -->
      <g transform="translate(44, 0)">
        <!-- Counter-rotate pedal to keep it horizontal -->
        <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="1.6s" repeatCount="indefinite" additive="sum"/>
        <rect x="-16" y="-5" width="32" height="10" rx="3" fill="#2f3542" stroke="#111" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <!-- Rear Wheel (Axle at 280, 500) -->
  <g transform="translate(280, 500)">
    <use href="#bicycle-wheel">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Front Wheel (Axle at 740, 500) -->
  <g transform="translate(740, 500)">
    <use href="#bicycle-wheel">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Bicycle Frame & Structural Components -->
  <!-- Geometrical Nodes:
       Rear Dropouts / Axle : (280, 500)
       Front Dropouts / Axle: (740, 500)
       Bottom Bracket (BB)  : (500, 480)
       Seat Lug / Cluster   : (430, 320)
       Head Tube (Top)      : (670, 290)
       Head Tube (Bottom)   : (690, 360)
  -->
  <g id="bicycle-frame">
    <!-- Chain & Rear Sprocket -->
    <path d="M 280 500 L 500 460 L 500 500 L 280 500 Z" fill="none" stroke="#2f3542" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="280" cy="500" r="22" fill="none" stroke="url(#metalGrad)" stroke-width="5"/>

    <!-- Rear Triangle: Chainstay (Rear Axle to BB) -->
    <line x1="280" y1="500" x2="500" y2="480" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Rear Triangle: Seatstay (Rear Axle to Seat Lug) -->
    <line x1="280" y1="500" x2="430" y2="320" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round"/>

    <!-- Main Triangle: Seat Tube (BB to Seat Lug) -->
    <line x1="500" y1="480" x2="430" y2="320" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Main Triangle: Down Tube (BB to Head Tube Bottom) -->
    <line x1="500" y1="480" x2="690" y2="360" stroke="url(#frameGrad)" stroke-width="15" stroke-linecap="round"/>

    <!-- Main Triangle: Top Tube (Seat Lug to Head Tube Top) -->
    <line x1="430" y1="320" x2="670" y2="290" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/>

    <!-- Head Tube -->
    <line x1="670" y1="290" x2="690" y2="360" stroke="url(#frameGrad)" stroke-width="17" stroke-linecap="round"/>

    <!-- Front Fork (Head Tube Bottom down to Front Axle) -->
    <path d="M 690 360 L 728 460 Q 735 488 740 500" fill="none" stroke="url(#metalGrad)" stroke-width="11" stroke-linecap="round"/>

    <!-- Seat Post & Saddle -->
    <line x1="430" y1="320" x2="415" y2="280" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Sleek Racing/Touring Saddle -->
    <path d="M 370 280 C 390 270, 440 270, 465 285 C 455 292, 420 292, 400 286 Z" fill="#2d3436" stroke="#1e272e" stroke-width="2"/>

    <!-- Stem & Handlebars -->
    <!-- Stem rising from head tube -->
    <path d="M 670 290 L 660 250 L 685 245" fill="none" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Swept Cruiser / Commuter Handlebars -->
    <path d="M 685 245 C 670 240, 630 250, 620 265" fill="none" stroke="#2d3436" stroke-width="11" stroke-linecap="round"/>
    <!-- Handlebar Grip -->
    <path d="M 632 258 L 618 268" fill="none" stroke="#d63031" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- ================= PELICAN (SEATED & RIDING) ================= -->
  <!-- Pelican Group with gentle organic bobbing -->
  <g class="pelican-torso">
    <!-- Tail Feathers -->
    <path d="M 360 335 C 330 335, 310 365, 340 375 C 365 385, 395 380, 405 355 Z" fill="#3d3d3d"/>
    <path d="M 345 350 C 320 355, 305 380, 335 390 C 360 398, 385 385, 395 365 Z" fill="#2f3542"/>

    <!-- Main Body & Plump Torso -->
    <path d="M 400 350 C 390 310, 430 270, 470 280 C 515 290, 545 340, 535 380 C 525 415, 470 425, 425 410 C 400 400, 395 375, 400 350 Z"
          fill="url(#bodyGrad)" stroke="#2f3542" stroke-width="2"/>

    <!-- Breast / Belly feathers (Mottled Silver-Brown) -->
    <path d="M 450 300 C 485 315, 520 345, 515 385 C 505 415, 460 415, 435 400 C 470 380, 475 330, 450 300 Z"
          fill="#a4b0be" opacity="0.4"/>

    <!-- Elegant Curved Neck -->
    <!-- S-curve typical of resting/gliding pelican -->
    <path d="M 480 290 C 510 260, 530 200, 555 170 C 570 150, 605 150, 615 170 C 625 185, 615 215, 580 240 C 555 255, 535 290, 520 315 Z"
          fill="#57606f"/>

    <!-- Neck Back Stripe (Characteristic dark chestnut wash of breeding Brown Pelican) -->
    <path d="M 495 275 C 520 250, 535 200, 560 170 C 570 158, 590 155, 595 165 C 575 190, 550 240, 525 295 Z"
          fill="#3d2314"/>

    <!-- Head & Pale Yellow Crown -->
    <ellipse cx="612" cy="165" rx="30" ry="24" fill="#f1f2f6"/>
    <!-- Yellow Crest Cap -->
    <path d="M 590 162 C 595 145, 620 142, 638 155 C 628 150, 608 152, 598 165 Z" fill="#fed330"/>

    <!-- Eye Patch & Keen Marine Eye -->
    <ellipse cx="625" cy="160" rx="4.5" ry="4.5" fill="#f5f6fa"/>
    <circle cx="626" cy="160" r="2.5" fill="#00d2d3"/>
    <circle cx="626.5" cy="159.5" r="1.2" fill="#111"/>
    <circle cx="627.5" cy="158.5" r="0.6" fill="#fff"/>
    <!-- Brown Eye Surround -->
    <path d="M 618 162 C 620 152, 632 152, 636 160" fill="none" stroke="#795548" stroke-width="1.8"/>

    <!-- Giant Beak & Gular Pouch -->
    <!-- Large Pouch (Sagging pouch) -->
    <path class="throat-pouch"
          d="M 622 176 C 640 210, 670 260, 715 260 C 740 260, 725 210, 710 190 Z"
          fill="url(#pouchGrad)" opacity="0.95"/>
    <path d="M 635 185 C 655 215, 680 245, 715 250" fill="none" stroke="#e17055" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Upper Maxilla / Bill (Sturdy, hooked tip) -->
    <path d="M 625 163 L 780 185 C 792 188, 796 195, 788 198 L 624 180 Z" fill="url(#beakGrad)"/>
    <!-- Beak Hook -->
    <path d="M 783 186 Q 794 189 790 200 Q 782 198 782 191 Z" fill="#d63031"/>
    <!-- Culmen Ridge -->
    <line x1="626" y1="165" x2="782" y2="186" stroke="#fed330" stroke-width="2"/>

    <!-- Lower Beak Jaw -->
    <path d="M 624 179 L 785 196 L 730 215 C 690 210, 650 195, 624 180 Z" fill="#eb4d4b" opacity="0.85"/>

    <!-- Pelican Folded Wing (Detailed Layered Coverts & Primaries) -->
    <!-- Base Wing Shadow -->
    <path d="M 435 295 C 470 290, 520 320, 525 365 C 510 405, 450 415, 410 375 C 400 350, 410 310, 435 295 Z"
          fill="url(#wingGrad)"/>

    <!-- Secondary Scapulars -->
    <path d="M 430 310 C 470 305, 505 330, 505 365 C 490 395, 445 400, 420 370 Z" fill="#6d4c41"/>

    <!-- Tertiary Feathers / Wing Bars -->
    <path d="M 440 325 C 475 320, 495 340, 495 370 C 480 390, 445 385, 430 365 Z" fill="#8d6e63"/>
    <path d="M 425 345 L 490 370 M 420 358 L 480 380 M 415 372 L 465 390"
          stroke="#3e2723" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Pelican's Far Wing / Arm Steering the Handlebar -->
    <!-- Wing extension reaching forward down to grip at (620, 265) -->
    <path d="M 495 325 C 530 310, 580 270, 625 264 C 615 273, 575 315, 515 345 Z"
          fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
    <path d="M 618 260 C 625 260, 632 265, 625 272 C 618 274, 612 268, 618 260 Z" fill="#2d1d19"/>
  </g>

  <!-- ================= BICYCLE (FRONT LAYER) & RIGHT LEG ================= -->
  <!-- Drive Train: Chainring at (500, 480) -->
  <g transform="translate(500, 480)">
    <!-- Large 52T Chainring -->
    <circle cx="0" cy="0" r="32" fill="#2f3542" stroke="url(#metalGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="7 5"/>
    <!-- Chainring 5-Arm Spider -->
    <g stroke="url(#metalGrad)" stroke-width="4">
      <line x1="0" y1="-28" x2="0" y2="28"/>
      <line x1="-26.6" y1="-8.6" x2="26.6" y2="8.6"/>
      <line x1="-16.4" y1="22.6" x2="16.4" y2="-22.6"/>
    </g>
  </g>

  <!-- Near-Side Right Leg & Crank Mechanism (Exact Mathematical Synchronization) -->
  <!--
       Hip Joint: (460, 380)
       Crank Hub: (500, 480), Radius: 44.
       Pedal Position Formula:
         x = 500 + 44 * cos(θ)
         y = 480 + 44 * sin(θ)
       When θ rotates 0° -> 90° -> 180° -> 270° -> 360°:
         0°  (Top/Front)   : (544, 480) -> Hip(460,380), Foot(544,480) -> Knee flexes forward: Q 532 415
         90° (Bottom Dead) : (500, 524) -> Hip(460,380), Foot(500,524) -> Leg reaches down   : Q 498 448
         180°(Back)        : (456, 480) -> Hip(460,380), Foot(456,480) -> Leg folds back     : Q 425 432
         270°(Top Dead)    : (500, 436) -> Hip(460,380), Foot(500,436) -> Leg tucked up      : Q 470 395
         360°(Front)       : (544, 480)
  -->
  <g id="right-leg-assembly">
    <!-- Right Thigh & Shin -->
    <path id="right-leg-path" fill="none" stroke="#f39c12" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"
          d="M 460 380 Q 532 415 544 480">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
               values="M 460 380 Q 532 415 544 480;
                       M 460 380 Q 498 448 500 524;
                       M 460 380 Q 425 432 456 480;
                       M 460 380 Q 470 395 500 436;
                       M 460 380 Q 532 415 544 480"/>
    </path>

    <!-- Right Webbed Foot firmly grasping pedal -->
    <g id="right-foot">
      <path d="M -18 -8 L 18 0 L -10 12 Z" fill="#f39c12" stroke="#d35400" stroke-width="2"/>
      <line x1="-12" y1="-2" x2="16" y2="0" stroke="#d35400" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite"
                        values="544 480; 500 524; 456 480; 500 436; 544 480"/>
    </g>
  </g>

  <!-- Near-Side Crank & Pedal (Revolving around 500, 480) -->
  <g id="right-crank-system" transform="translate(500, 480)">
    <g>
      <!-- Clockwise 360 degree rotation -->
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <!-- Sturdy Alloy Crank Arm -->
      <rect x="-8" y="-7" width="56" height="14" rx="7" fill="url(#metalGrad)" stroke="#57606f" stroke-width="1.8"/>
      <!-- Crank Cap -->
      <circle cx="0" cy="0" r="10" fill="#2f3542" stroke="#ced6e0" stroke-width="2"/>

      <!-- Pedal Assembly at crank end (x = 44) -->
      <g transform="translate(44, 0)">
        <!-- Counter-rotation keeps pedal platform upright under the foot -->
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite" additive="sum"/>
        <!-- Pedal Axle Pin -->
        <circle cx="0" cy="0" r="4" fill="#a4b0be"/>
        <!-- Platform Pedal -->
        <rect x="-18" y="-6" width="36" height="12" rx="3.5" fill="#1e272e" stroke="#f1f2f6" stroke-width="1.8"/>
        <!-- Reflector -->
        <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#ffa801"/>
      </g>
    </g>
  </g>

  <!-- Foreground details: Bottom bracket shell & highlights -->
  <circle cx="500" cy="480" r="6" fill="#1e272e"/>

  <!-- Speed lines indicating forward motion -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45">
    <line x1="200" y1="360" x2="130" y2="360">
      <animate attributeName="x1" values="240; 120; 240" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="170; 50; 170" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="410" x2="90" y2="410">
      <animate attributeName="x1" values="200; 100; 200" dur="0.75s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="110; 20; 110" dur="0.75s" repeatCount="indefinite"/>
    </line>
    <line x1="220" y1="310" x2="150" y2="310">
      <animate attributeName="x1" values="250; 140; 250" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="180; 70; 180" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>