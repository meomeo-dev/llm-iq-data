<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <!-- Sky background -->
  <rect width="400" height="350" fill="#87CEEB"/>

  <!-- Ground -->
  <rect x="0" y="300" width="400" height="50" fill="#8B7355"/>
  <rect x="0" y="295" width="400" height="8" fill="#A0855B"/>

  <!-- === BICYCLE === -->
  <!-- Rear wheel -->
  <circle cx="130" cy="265" r="48" fill="none" stroke="#2C2C2C" stroke-width="6"/>
  <circle cx="130" cy="265" r="6" fill="#2C2C2C"/>
  <!-- Rear spokes -->
  <line x1="130" y1="217" x2="130" y2="313" stroke="#555" stroke-width="2"/>
  <line x1="82" y1="265" x2="178" y2="265" stroke="#555" stroke-width="2"/>
  <line x1="96" y1="231" x2="164" y2="299" stroke="#555" stroke-width="2"/>
  <line x1="96" y1="299" x2="164" y2="231" stroke="#555" stroke-width="2"/>

  <!-- Front wheel -->
  <circle cx="290" cy="265" r="48" fill="none" stroke="#2C2C2C" stroke-width="6"/>
  <circle cx="290" cy="265" r="6" fill="#2C2C2C"/>
  <!-- Front spokes -->
  <line x1="290" y1="217" x2="290" y2="313" stroke="#555" stroke-width="2"/>
  <line x1="242" y1="265" x2="338" y2="265" stroke="#555" stroke-width="2"/>
  <line x1="256" y1="231" x2="324" y2="299" stroke="#555" stroke-width="2"/>
  <line x1="256" y1="299" x2="324" y2="231" stroke="#555" stroke-width="2"/>

  <!-- Frame: chain stay (rear axle to bottom bracket) -->
  <line x1="130" y1="265" x2="210" y2="255" stroke="#C0392B" stroke-width="5"/>
  <!-- Frame: seat stay (rear axle to seat tube top) -->
  <line x1="130" y1="265" x2="195" y2="200" stroke="#C0392B" stroke-width="5"/>
  <!-- Frame: seat tube -->
  <line x1="195" y1="200" x2="210" y2="255" stroke="#C0392B" stroke-width="5"/>
  <!-- Frame: down tube (head tube to bottom bracket) -->
  <line x1="270" y1="210" x2="210" y2="255" stroke="#C0392B" stroke-width="5"/>
  <!-- Frame: top tube -->
  <line x1="195" y1="200" x2="270" y2="210" stroke="#C0392B" stroke-width="5"/>
  <!-- Fork (head tube to front axle) -->
  <line x1="270" y1="210" x2="290" y2="265" stroke="#C0392B" stroke-width="5"/>

  <!-- Bottom bracket / pedal hub -->
  <circle cx="210" cy="255" r="8" fill="#888"/>
  <!-- Crank arm -->
  <line x1="210" y1="255" x2="228" y2="272" stroke="#555" stroke-width="5"/>
  <circle cx="228" cy="272" r="5" fill="#333"/>
  <!-- Chain ring -->
  <circle cx="210" cy="255" r="18" fill="none" stroke="#888" stroke-width="3"/>

  <!-- Seat post -->
  <line x1="195" y1="200" x2="192" y2="178" stroke="#555" stroke-width="4"/>
  <!-- Saddle -->
  <ellipse cx="192" cy="175" rx="22" ry="7" fill="#222"/>

  <!-- Handlebars stem -->
  <line x1="270" y1="210" x2="275" y2="188" stroke="#555" stroke-width="4"/>
  <!-- Handlebar crossbar -->
  <line x1="258" y1="186" x2="292" y2="186" stroke="#555" stroke-width="4"/>
  <circle cx="258" cy="186" r="4" fill="#333"/>
  <circle cx="292" cy="186" r="4" fill="#333"/>

  <!-- === PELICAN BODY === -->
  <!-- Body -->
  <ellipse cx="200" cy="190" rx="55" ry="38" fill="white" stroke="#CCC" stroke-width="1.5"/>

  <!-- Wing (left, folded) -->
  <ellipse cx="158" cy="195" rx="30" ry="16" fill="#E8E8E8" stroke="#CCC" stroke-width="1" transform="rotate(-15,158,195)"/>
  <!-- Wing feather detail -->
  <line x1="140" y1="200" x2="183" y2="192" stroke="#BBB" stroke-width="1"/>
  <line x1="142" y1="205" x2="183" y2="196" stroke="#BBB" stroke-width="1"/>

  <!-- Wing (right, folded) -->
  <ellipse cx="242" cy="195" rx="30" ry="16" fill="#E8E8E8" stroke="#CCC" stroke-width="1" transform="rotate(15,242,195)"/>
  <line x1="217" y1="192" x2="260" y2="200" stroke="#BBB" stroke-width="1"/>
  <line x1="217" y1="196" x2="260" y2="205" stroke="#BBB" stroke-width="1"/>

  <!-- Tail feathers -->
  <ellipse cx="145" cy="200" rx="18" ry="8" fill="white" stroke="#CCC" stroke-width="1" transform="rotate(20,145,200)"/>

  <!-- Neck -->
  <path d="M200,155 Q215,130 210,108" fill="none" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <path d="M200,155 Q215,130 210,108" fill="none" stroke="#DDD" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="210" cy="100" rx="24" ry="21" fill="white" stroke="#CCC" stroke-width="1.5"/>

  <!-- Eye -->
  <circle cx="220" cy="95" r="7" fill="#FFD700"/>
  <circle cx="222" cy="95" r="4" fill="#1A1A1A"/>
  <circle cx="223" cy="93" r="1.2" fill="white"/>

  <!-- Beak (upper mandible) -->
  <path d="M228,102 Q255,108 265,116 Q255,118 228,112 Z" fill="#F4A460" stroke="#CC8844" stroke-width="1"/>
  <!-- Beak (lower mandible / pouch) -->
  <path d="M228,112 Q255,118 265,116 Q260,130 240,135 Q228,132 228,112 Z" fill="#DEB887" stroke="#CC8844" stroke-width="1"/>
  <!-- Pouch detail -->
  <ellipse cx="247" cy="124" rx="14" ry="9" fill="#C8A882" opacity="0.5"/>

  <!-- Pelican feet on pedals -->
  <!-- Left leg -->
  <path d="M185,225 Q182,240 210,255" fill="none" stroke="#F4A460" stroke-width="4" stroke-linecap="round"/>
  <!-- Left foot -->
  <path d="M210,255 L220,252 M210,255 L216,260 M210,255 L207,264" stroke="#F4A460" stroke-width="3" stroke-linecap="round"/>

  <!-- Right leg (other side) -->
  <path d="M215,225 Q218,238 228,272" fill="none" stroke="#F4A460" stroke-width="4" stroke-linecap="round"/>
  <!-- Right foot on pedal -->
  <path d="M228,272 L238,270 M228,272 L234,277 M228,272 L225,281" stroke="#F4A460" stroke-width="3" stroke-linecap="round"/>

  <!-- Helmet (sporty!) -->
  <path d="M188,85 Q190,62 210,60 Q232,60 234,82" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
  <path d="M188,85 Q200,78 222,85" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
  <!-- Helmet vents -->
  <line x1="196" y1="75" x2="198" y2="85" stroke="#C0392B" stroke-width="2"/>
  <line x1="205" y1="71" x2="207" y2="82" stroke="#C0392B" stroke-width="2"/>
  <line x1="214" y1="71" x2="216" y2="82" stroke="#C0392B" stroke-width="2"/>
  <line x1="222" y1="73" x2="223" y2="84" stroke="#C0392B" stroke-width="2"/>

  <!-- Motion lines -->
  <line x1="50" y1="255" x2="80" y2="255" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="265" x2="78" y2="265" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="55" y1="275" x2="80" y2="275" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Sun -->
  <circle cx="355" cy="45" r="28" fill="#FFD700" opacity="0.9"/>
  <line x1="355" y1="8" x2="355" y2="0" stroke="#FFD700" stroke-width="3"/>
  <line x1="355" y1="82" x2="355" y2="90" stroke="#FFD700" stroke-width="3"/>
  <line x1="318" y1="45" x2="310" y2="45" stroke="#FFD700" stroke-width="3"/>
  <line x1="383" y1="45" x2="390" y2="45" stroke="#FFD700" stroke-width="3"/>
</svg>