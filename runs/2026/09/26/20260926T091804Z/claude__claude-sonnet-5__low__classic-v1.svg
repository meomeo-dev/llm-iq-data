<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#bfe3f5"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#9bd18a" stroke-width="4"/>

  <!-- bicycle -->
  <g stroke="#333" stroke-width="4" fill="none">
    <circle cx="140" cy="220" r="35"/>
    <circle cx="280" cy="220" r="35"/>
    <line x1="140" y1="220" x2="200" y2="160"/>
    <line x1="200" y1="160" x2="280" y2="220"/>
    <line x1="200" y1="160" x2="170" y2="220"/>
    <line x1="170" y1="220" x2="280" y2="220"/>
    <line x1="200" y1="160" x2="200" y2="130"/>
    <line x1="190" y1="130" x2="210" y2="130"/>
    <line x1="170" y1="220" x2="150" y2="200"/>
    <line x1="150" y1="200" x2="180" y2="195"/>
  </g>

  <!-- pelican body -->
  <g>
    <ellipse cx="205" cy="110" rx="35" ry="28" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
    <!-- neck and head -->
    <path d="M230 95 Q255 70 250 50 Q248 40 238 42 Q230 44 232 55 Q234 65 220 80"
          fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="248" cy="48" r="14" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
    <!-- beak -->
    <path d="M260 46 L290 52 L262 58 Z" fill="#e8a33d" stroke="#333" stroke-width="2"/>
    <path d="M262 52 Q275 60 262 58" fill="#f4c07a" stroke="#333" stroke-width="1"/>
    <!-- eye -->
    <circle cx="252" cy="44" r="2" fill="#333"/>
    <!-- wing -->
    <path d="M195 95 Q170 105 175 130 Q195 125 205 105 Z" fill="#dcdcdc" stroke="#333" stroke-width="2"/>
    <!-- tail -->
    <path d="M172 100 L155 95 L172 112 Z" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
    <!-- legs to pedals -->
    <line x1="195" y1="130" x2="190" y2="170" stroke="#e8a33d" stroke-width="4"/>
    <line x1="215" y1="130" x2="210" y2="175" stroke="#e8a33d" stroke-width="4"/>
    <!-- feet on pedals -->
    <circle cx="190" cy="172" r="4" fill="#e8a33d"/>
    <circle cx="210" cy="177" r="4" fill="#e8a33d"/>
  </g>
</svg>