<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#94a3b8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glass Body Translucency Gradient -->
    <linearGradient id="glassWallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="8%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="92%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glass Thick Base Gradient -->
    <linearGradient id="glassBaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.9" />
    </linearGradient>

    <!-- Water Column Gradient -->
    <linearGradient id="waterVolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="20%" stop-color="#7dd3fc" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.55" />
    </linearGradient>

    <!-- Water Surface Meniscus Gradient -->
    <radialGradient id="meniscusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#e0f2fe" stop-opacity="0.2" />
      <stop offset="90%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.75" />
    </radialGradient>

    <!-- Ice Cube Gradients -->
    <!-- Submerged Ice (softer, refracted, tinted cyan) -->
    <linearGradient id="subIceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="subIceGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.45" />
    </linearGradient>

    <!-- Exposed Ice (crisp white, high refraction) -->
    <linearGradient id="expIceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#f0f9ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="expIceSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Caustics & Reflection Filters -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="submergedDistort" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="900" fill="url(#bgGrad)" />

  <!-- Studio Surface Horizon & Reflection Base -->
  <path d="M 0,660 L 800,660 L 800,900 L 0,900 Z" fill="url(#tableGrad)" />
  <line x1="0" y1="660" x2="800" y2="660" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Cast Shadows and Caustic Glow under Glass -->
  <g id="shadows-caustics">
    <!-- Ambient Shadow -->
    <ellipse cx="400" cy="740" rx="190" ry="32" fill="#334155" fill-opacity="0.35" filter="url(#shadowBlur)" />
    <!-- Core Contact Shadow -->
    <ellipse cx="400" cy="735" rx="145" ry="18" fill="#0f172a" fill-opacity="0.5" filter="url(#softBlur)" />
    <!-- Caustic Focus Pool -->
    <ellipse cx="420" cy="738" rx="90" ry="14" fill="#38bdf8" fill-opacity="0.45" filter="url(#softBlur)" />
    <ellipse cx="425" cy="737" rx="55" ry="7" fill="#ffffff" fill-opacity="0.75" filter="url(#softBlur)" />
  </g>

  <!-- ==================== BACK OF GLASS ==================== -->
  <!-- Glass Rim Back Arc -->
  <path d="M 230,220 A 170,30 0 0,1 570,220" fill="none" stroke="url(#rimGrad)" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Back Inner Glass Wall Tone -->
  <path d="M 230,220 L 250,710 A 150,22 0 0,0 550,710 L 570,220 Z" fill="#0284c7" fill-opacity="0.03" />

  <!-- ==================== WATER VOLUME ==================== -->
  <!-- Submerged Body of Water (Half Filled cylinder: level at Y=460) -->
  <g id="water-bulk">
    <!-- Main Liquid Bulk -->
    <path d="M 238,460 
             L 252,710 
             A 148,22 0 0,0 548,710 
             L 562,460 
             A 162,25 0 0,1 238,460 Z" 
          fill="url(#waterVolGrad)" />
    
    <!-- Deep Water Caustics / Internal Refraction Bands -->
    <path d="M 265,475 Q 330,680 400,695 T 535,475" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.3" filter="url(#softBlur)" />
    <path d="M 290,490 Q 360,650 430,665 T 510,490" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.25" filter="url(#softBlur)" />
  </g>

  <!-- ==================== SUBMERGED ICE SECTIONS (~90% OF VOLUME) ==================== -->
  <!-- 
    Buoyancy Note:
    Ice Cube Height approx 85-95px.
    Exposed crown above meniscus: 8-10px (~10% total volume).
    Submerged underwater: 75-85px (~90% total volume).
  -->
  <g id="ice-submerged" filter="url(#submergedDistort)">
    
    <!-- CUBE 1 (Left-Center, resting angled) Total Height: 90px | Submerged: 81px below Y=460 -->
    <g id="cube1-underwater">
      <!-- Deep submerged body down to Y=542 -->
      <polygon points="285,460 360,460 380,525 310,542 270,495" fill="url(#subIceGrad1)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
      <polygon points="310,542 380,525 392,460 360,460" fill="url(#subIceGrad2)" />
      <!-- Internal Ice Fractures & Air Bubbles -->
      <path d="M 305,480 Q 335,510 325,530" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
      <path d="M 330,470 L 355,515" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="2,5" stroke-opacity="0.8" />
      <circle cx="340" cy="495" r="3" fill="#ffffff" fill-opacity="0.6" />
      <circle cx="360" cy="505" r="2" fill="#ffffff" fill-opacity="0.5" />
      <circle cx="315" cy="510" r="1.5" fill="#ffffff" fill-opacity="0.7" />
    </g>

    <!-- CUBE 2 (Center-Right, tilted toward viewer) Total Height: 95px | Submerged: 86px below Y=460 -->
    <g id="cube2-underwater">
      <!-- Main underwater bulk down to Y=550 -->
      <polygon points="375,460 480,460 470,535 395,550 360,480" fill="url(#subIceGrad2)" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.7" />
      <polygon points="395,550 470,535 480,460 450,460" fill="url(#subIceGrad1)" />
      <!-- Internal Stress Planes / Bubbles -->
      <line x1="390" y1="475" x2="435" y2="535" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.7" />
      <line x1="420" y1="470" x2="400" y2="520" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.8" />
      <circle cx="410" cy="485" r="2.5" fill="#ffffff" fill-opacity="0.8" />
      <circle cx="445" cy="495" r="3.5" fill="#ffffff" fill-opacity="0.6" />
      <circle cx="430" cy="525" r="1.5" fill="#ffffff" fill-opacity="0.6" />
    </g>

    <!-- CUBE 3 (Background/Slightly right, partially obscured) Total Height: 80px | Submerged: 72px below Y=455 -->
    <g id="cube3-underwater">
      <polygon points="460,455 530,455 520,522 470,528 450,475" fill="url(#subIceGrad1)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
      <!-- Subtle internal veiled core -->
      <ellipse cx="485" cy="485" rx="18" ry="25" fill="#ffffff" fill-opacity="0.25" filter="url(#softBlur)" />
      <circle cx="480" cy="495" r="2" fill="#ffffff" fill-opacity="0.7" />
      <circle cx="495" cy="475" r="1.5" fill="#ffffff" fill-opacity="0.6" />
    </g>

  </g>

  <!-- ==================== WATER SURFACE / MENISCUS ELLIPSE ==================== -->
  <g id="water-meniscus">
    <!-- Outer Ellipse representing water surface disc -->
    <ellipse cx="400" cy="460" rx="162" ry="25" fill="url(#meniscusGrad)" />
    
    <!-- Meniscus Wet Contact Ring against glass walls -->
    <ellipse cx="400" cy="460" rx="162" ry="25" fill="none" stroke="#bae6fd" stroke-width="3" stroke-opacity="0.75" />
    <ellipse cx="400" cy="460" rx="160.5" ry="23.5" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.8" />
    
    <!-- Meniscus contact line in foreground -->
    <path d="M 238,460 A 162,25 0 0,0 562,460" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9" />

    <!-- Capillary wet water edges hugging the floating ice cubes -->
    <!-- Cube 1 meniscus ring -->
    <path d="M 275,463 Q 320,466 370,462" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <!-- Cube 2 meniscus ring -->
    <path d="M 368,462 Q 425,467 485,462" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
  </g>

  <!-- ==================== EXPOSED ICE SECTIONS (~10% OF VOLUME) ==================== -->
  <!-- Only 8-10px peaking cleanly above water surface level Y=460 -->
  <g id="ice-exposed">

    <!-- CUBE 3 EXPOSED TIP (Peaking roughly 8px above Y=455) -->
    <g id="cube3-tip">
      <polygon points="460,455 490,448 530,452 505,456" fill="url(#expIceTop)" stroke="#ffffff" stroke-width="1" />
      <polygon points="460,455 505,456 500,458 458,457" fill="url(#expIceSide)" />
      <!-- Sharp specular edge -->
      <polyline points="460,455 490,448 530,452" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- CUBE 1 EXPOSED APEX (Submerged 81px, Exposed 9px: Top plane at Y=451, Water line at Y=460) -->
    <g id="cube1-tip">
      <!-- Facet Top -->
      <polygon points="295,452 345,450 365,455 315,458" fill="url(#expIceTop)" stroke="#f0f9ff" stroke-width="0.8" />
      <!-- Facet Left Exposed Strip -->
      <polygon points="285,460 295,452 315,458 305,462" fill="url(#expIceSide)" />
      <!-- Facet Right Exposed Strip -->
      <polygon points="315,458 365,455 372,460 320,462" fill="#bae6fd" fill-opacity="0.8" />
      <!-- Sparkling Sunburst Highlight -->
      <circle cx="315" cy="454" r="1.5" fill="#ffffff" />
      <line x1="295" y1="452" x2="345" y2="450" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <line x1="345" y1="450" x2="365" y2="455" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- CUBE 2 EXPOSED APEX (Submerged 86px, Exposed ~10px: Top plane at Y=450, Water line at Y=460) -->
    <g id="cube2-tip">
      <!-- Facet Top -->
      <polygon points="380,453 440,449 475,454 415,458" fill="url(#expIceTop)" stroke="#ffffff" stroke-width="1" />
      <!-- Facet Front Exposed Strip -->
      <polygon points="415,458 475,454 480,460 418,463" fill="url(#expIceSide)" />
      <!-- Facet Left Exposed Strip -->
      <polygon points="375,460 380,453 415,458 410,463" fill="#e0f2fe" fill-opacity="0.85" />
      <!-- Glint Highlights -->
      <polyline points="380,453 440,449 475,454" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="440" cy="449" r="2" fill="#ffffff" />
    </g>

  </g>

  <!-- ==================== FRONT OF GLASS & LIQUID OVERLAYS ==================== -->
  <g id="glass-front">
    <!-- Cylindrical Glass Body Transparency Overlay -->
    <path d="M 230,220 
             L 250,710 
             A 150,22 0 0,0 550,710 
             L 570,220 
             A 170,30 0 0,1 230,220 Z" 
          fill="url(#glassWallGrad)" />

    <!-- Heavy Solid Base of Cylindrical Tumbler -->
    <path d="M 250,710 
             A 150,22 0 0,0 550,710 
             L 550,735 
             A 150,22 0 0,1 250,735 Z" 
          fill="url(#glassBaseGrad)" />

    <!-- Base Inner Curvature Highlight -->
    <ellipse cx="400" cy="710" rx="148" ry="19" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.7" />
    <!-- Bottom Outer Rim Highlight -->
    <ellipse cx="400" cy="735" rx="150" ry="22" fill="none" stroke="#bae6fd" stroke-width="3" stroke-opacity="0.9" />
    <path d="M 280,750 A 130,15 0 0,0 520,750" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" />

    <!-- Left Primary Glass Glare (Sharp vertical studio softbox reflection) -->
    <path d="M 242,230 
             L 260,705 
             Q 264,712 268,705 
             L 254,230 
             Q 248,222 242,230 Z" 
          fill="#ffffff" fill-opacity="0.65" filter="url(#softBlur)" />

    <path d="M 247,235 L 261,695" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    
    <!-- Secondary Narrow Reflection Strip -->
    <path d="M 262,250 L 273,680" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- Right Side Diffused Rim Reflection -->
    <path d="M 558,230 
             L 542,705 
             Q 538,712 534,705 
             L 546,230 
             Q 552,222 558,230 Z" 
          fill="#38bdf8" fill-opacity="0.3" filter="url(#softBlur)" />
    <path d="M 553,235 L 539,695" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />

    <!-- Front Rim Lip of Glass (Top Meniscus of Glass Opening) -->
    <path d="M 230,220 A 170,30 0 0,0 570,220" fill="none" stroke="url(#rimGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 233,221 A 167,27 0 0,0 567,221" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.95" />

    <!-- Subtle Condensation Droplets near Water Level (Cold Ice Water Effect) -->
    <g id="condensation" fill="#ffffff" fill-opacity="0.7">
      <ellipse cx="258" cy="475" rx="2" ry="3" />
      <ellipse cx="264" cy="510" rx="1.5" ry="2" />
      <ellipse cx="252" cy="530" rx="2" ry="2.5" />
      <circle cx="260" cy="545" r="1.5" />
      <ellipse cx="542" cy="480" rx="2" ry="3" />
      <circle cx="538" cy="515" r="1.5" />
      <ellipse cx="546" cy="535" rx="1.5" ry="2.5" />
    </g>
  </g>
</svg>