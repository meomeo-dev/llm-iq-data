<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Subtle drop shadow to lift the impossible object -->
    <filter id="tribar-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b0f19" flood-opacity="0.35" />
    </filter>

    <!-- Linear gradients for subtle depth across faces while retaining crisp 3-tone shading -->
    <!-- Top-facing highlights (Orientation 1) -->
    <linearGradient id="top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfefe"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Right-facing midtones (Orientation 2) -->
    <linearGradient id="right-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Bottom/Left-facing deep shadow (Orientation 3) -->
    <linearGradient id="left-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #0f172a; }
    .face-top { fill: url(#top-grad); }
    .face-right { fill: url(#right-grad); }
    .face-bottom { fill: url(#left-grad); }
    .edge-line {
      stroke: #0f172a;
      stroke-width: 2.5;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="800" height="800" />

  <!-- Impossible Tribar Structure -->
  <g filter="url(#tribar-shadow)" class="edge-line">
    
    <!-- ==========================================
         LAYER 1: TOP-FACING SURFACES (HIGHLIGHT)
         ========================================== -->
    <!-- Top Face A: Runs continuously along the bottom beam and turns up into the right vertex -->
    <polygon class="face-top" points="
      200,560 
      600,560 
      530,600 
      130,600
    "/>

    <!-- Top Face B: Inner horizontal facet connecting bottom-left inner turn to inner-right fold -->
    <polygon class="face-top" points="
      270,520 
      470,520 
      400,560 
      200,560
    "/>

    <!-- Top Face C: Slanted top surface capping the top corner apex -->
    <polygon class="face-top" points="
      400,140 
      470,180 
      400,220 
      330,180
    "/>


    <!-- ==========================================
         LAYER 2: RIGHT-FACING SURFACES (MIDTONE)
         ========================================== -->
    <!-- Right Face A: Outer right diagonal column extending from top apex down to bottom right -->
    <polygon class="face-right" points="
      470,180 
      670,520 
      600,560 
      400,220
    "/>

    <!-- Right Face B: Left inner column face descending into the impossible junction -->
    <polygon class="face-right" points="
      330,300 
      400,340 
      270,560 
      200,520
    "/>

    <!-- Right Face C: Transverse end-cap face at the lower left inner corner -->
    <polygon class="face-right" points="
      200,560 
      270,520 
      270,560 
      200,600
    "/>


    <!-- ==========================================
         LAYER 3: LEFT/BOTTOM-FACING SURFACES (SHADOW)
         ========================================== -->
    <!-- Shadow Face A: Long outer left edge descending from top apex to bottom-left corner -->
    <polygon class="face-bottom" points="
      400,140 
      330,180 
      130,520 
      130,600 
      200,560 
      200,260
    "/>

    <!-- Shadow Face B: Central impossible beam running diagonally under the apex -->
    <polygon class="face-bottom" points="
      400,220 
      330,260 
      330,380 
      400,340
    "/>

    <!-- Shadow Face C: Bottom underside edge running under the right beam corner -->
    <polygon class="face-bottom" points="
      600,560 
      670,520 
      600,600 
      530,600
    "/>

  </g>

  <!-- Precise Seam Enhancement: Overlaid crisp inner vertices to complete the optical illusion -->
  <g fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Apex corner junction lines -->
    <line x1="400" y1="140" x2="400" y2="220" />
    <line x1="330" y1="180" x2="400" y2="220" />
    <line x1="470" y1="180" x2="400" y2="220" />

    <!-- Right corner junction lines -->
    <line x1="600" y1="560" x2="670" y2="520" />
    <line x1="600" y1="560" x2="530" y2="600" />
    <line x1="530" y1="600" x2="600" y2="600" />
    <line x1="600" y1="600" x2="670" y2="520" />

    <!-- Bottom-left corner junction lines -->
    <line x1="130" y1="520" x2="130" y2="600" />
    <line x1="130" y1="600" x2="200" y2="560" />
    <line x1="130" y1="600" x2="530" y2="600" />

    <!-- Central impossible intersection edges -->
    <line x1="330" y1="300" x2="400" y2="340" />
    <line x1="400" y1="340" x2="400" y2="220" />
    <line x1="270" y1="520" x2="470" y2="520" />
    <line x1="470" y1="520" x2="400" y2="560" />
    <line x1="400" y1="560" x2="200" y2="560" />
    <line x1="200" y1="560" x2="200" y2="600" />
    <line x1="270" y1="520" x2="270" y2="560" />
  </g>
</svg>