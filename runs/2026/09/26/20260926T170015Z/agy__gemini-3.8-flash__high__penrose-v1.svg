<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background styling -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1f2633"/>
      <stop offset="60%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>

    <!-- Subtle floor ambient shadow -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Tonal Shading Gradients for Crisp 3D Depth -->
    <!-- 1. Top Faces: Bright highlight with clean isotropic illumination -->
    <linearGradient id="topFaceGrad" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#dce5ef"/>
      <stop offset="50%" stop-color="#edf2f7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- 2. Right-Facing Faces: Medium tone with crisp specular roll-off -->
    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fa2b7"/>
      <stop offset="50%" stop-color="#76899e"/>
      <stop offset="100%" stop-color="#5c6e82"/>
    </linearGradient>

    <!-- 3. Bottom/Left-Facing Faces: Deep core shadow with ambient bounce -->
    <linearGradient id="leftFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#344151"/>
      <stop offset="50%" stop-color="#232d39"/>
      <stop offset="100%" stop-color="#161c24"/>
    </linearGradient>

    <!-- Inner ambient occlusion gradients for joint junctions -->
    <linearGradient id="jointShadow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1000" fill="url(#bgGrad)"/>

  <!-- Soft Isometric Ground Shadow -->
  <ellipse cx="500" cy="855" rx="360" ry="68" fill="url(#floorShadow)"/>

  <!-- Main Tribar Group Centered at (500, 500) -->
  <g id="penrose-tribar" shape-rendering="geometricPrecision">

    <!-- ================================================================= -->
    <!-- FACE 1: TOP-FACING SURFACES (Light Highlight)                     -->
    <!-- Forms the upper shelf of the bottom bar and travels up the right -->
    <!-- ================================================================= -->
    <path id="face-top"
          d="M 500.0, 110.0
             L 863.7, 740.0
             L 736.6, 740.0
             L 500.0, 330.2
             L 372.9, 550.3
             L 309.3, 440.1
             Z"
          fill="url(#topFaceGrad)"
          stroke="#edf2f7"
          stroke-width="1"
          stroke-linejoin="round"/>

    <!-- ================================================================= -->
    <!-- FACE 2: RIGHT-FACING SURFACES (Medium Tone)                      -->
    <!-- Extends along the right beam and locks through the top apex joint -->
    <!-- ================================================================= -->
    <path id="face-right"
          d="M 136.3, 740.0
             L 500.0, 110.0
             L 563.6, 220.2
             L 372.9, 550.3
             L 627.1, 550.3
             L 690.7, 660.5
             Z"
          fill="url(#rightFaceGrad)"
          stroke="#76899e"
          stroke-width="1"
          stroke-linejoin="round"/>

    <!-- ================================================================= -->
    <!-- FACE 3: BOTTOM / LEFT-FACING SURFACES (Deep Shadow)              -->
    <!-- Underneath the horizontal span and along the outer left column   -->
    <!-- ================================================================= -->
    <path id="face-left"
          d="M 863.7, 740.0
             L 136.3, 740.0
             L 199.9, 629.8
             L 627.1, 629.8
             L 500.0, 409.7
             L 563.6, 299.5
             Z"
          fill="url(#leftFaceGrad)"
          stroke="#232d39"
          stroke-width="1"
          stroke-linejoin="round"/>

    <!-- ================================================================= -->
    <!-- INNER INTERNAL JOINT SEAMS (Crisp Optical Ridges)                 -->
    <!-- Subtle edge delineation ensuring sharp planar transitions         -->
    <!-- ================================================================= -->
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round">
      <!-- Apex inner mitre -->
      <line x1="500.0" y1="110.0" x2="500.0" y2="330.2" stroke-opacity="0.2"/>
      <!-- Right corner internal seam -->
      <line x1="863.7" y1="740.0" x2="736.6" y2="740.0" stroke-opacity="0.25"/>
      <!-- Left corner internal boundary -->
      <line x1="136.3" y1="740.0" x2="199.9" y2="629.8" stroke-opacity="0.15"/>
    </g>

    <!-- Subtle AO contact shadow on re-entrant vertices -->
    <polygon points="500.0,330.2 563.6,299.5 500.0,409.7" fill="#000000" opacity="0.18"/>
    <polygon points="372.9,550.3 309.3,440.1 372.9,475.0" fill="#000000" opacity="0.12"/>
    <polygon points="627.1,550.3 690.7,660.5 627.1,629.8" fill="#000000" opacity="0.15"/>

  </g>
</svg>