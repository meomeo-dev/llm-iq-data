<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Drop shadow for depth -->
    <filter id="clock-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    
    <!-- Subtle hand shadow -->
    <filter id="hand-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Bezel gradients -->
    <linearGradient id="rim-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="50%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Reusable tick marks -->
    <!-- Minute tick (small) -->
    <line id="min-tick" x1="300" y1="92" x2="300" y2="100" stroke="#777777" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hour tick (prominent) -->
    <line id="hour-tick" x1="300" y1="88" x2="300" y2="104" stroke="#1c1c1c" stroke-width="5" stroke-linecap="round"/>
  </defs>

  <style>
    .dial-numeral {
      font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
      font-size: 38px;
      font-weight: 700;
      fill: #1c1c1c;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Outer Bezel & Case -->
  <circle cx="300" cy="300" r="275" fill="url(#rim-gradient)" filter="url(#clock-shadow)"/>
  <circle cx="300" cy="300" r="252" fill="#bcbcbc"/>
  <circle cx="300" cy="300" r="248" fill="url(#inner-bevel)"/>
  <!-- Dial Face -->
  <circle cx="300" cy="300" r="244" fill="#faf9f6"/>

  <!-- Dial Perimeter Ticks -->
  <g id="ticks">
    <!-- Minute ticks (all 60 positions except 5-minute intervals) -->
    <!-- 1 to 4 -->
    <use href="#min-tick" transform="rotate(6 300 300)"/>
    <use href="#min-tick" transform="rotate(12 300 300)"/>
    <use href="#min-tick" transform="rotate(18 300 300)"/>
    <use href="#min-tick" transform="rotate(24 300 300)"/>
    <!-- 6 to 9 -->
    <use href="#min-tick" transform="rotate(36 300 300)"/>
    <use href="#min-tick" transform="rotate(42 300 300)"/>
    <use href="#min-tick" transform="rotate(48 300 300)"/>
    <use href="#min-tick" transform="rotate(54 300 300)"/>
    <!-- 11 to 14 -->
    <use href="#min-tick" transform="rotate(66 300 300)"/>
    <use href="#min-tick" transform="rotate(72 300 300)"/>
    <use href="#min-tick" transform="rotate(78 300 300)"/>
    <use href="#min-tick" transform="rotate(84 300 300)"/>
    <!-- 16 to 19 -->
    <use href="#min-tick" transform="rotate(96 300 300)"/>
    <use href="#min-tick" transform="rotate(102 300 300)"/>
    <use href="#min-tick" transform="rotate(108 300 300)"/>
    <use href="#min-tick" transform="rotate(114 300 300)"/>
    <!-- 21 to 24 -->
    <use href="#min-tick" transform="rotate(126 300 300)"/>
    <use href="#min-tick" transform="rotate(132 300 300)"/>
    <use href="#min-tick" transform="rotate(138 300 300)"/>
    <use href="#min-tick" transform="rotate(144 300 300)"/>
    <!-- 26 to 29 -->
    <use href="#min-tick" transform="rotate(156 300 300)"/>
    <use href="#min-tick" transform="rotate(162 300 300)"/>
    <use href="#min-tick" transform="rotate(168 300 300)"/>
    <use href="#min-tick" transform="rotate(174 300 300)"/>
    <!-- 31 to 34 -->
    <use href="#min-tick" transform="rotate(186 300 300)"/>
    <use href="#min-tick" transform="rotate(192 300 300)"/>
    <use href="#min-tick" transform="rotate(198 300 300)"/>
    <use href="#min-tick" transform="rotate(204 300 300)"/>
    <!-- 36 to 39 -->
    <use href="#min-tick" transform="rotate(216 300 300)"/>
    <use href="#min-tick" transform="rotate(222 300 300)"/>
    <use href="#min-tick" transform="rotate(228 300 300)"/>
    <use href="#min-tick" transform="rotate(234 300 300)"/>
    <!-- 41 to 44 -->
    <use href="#min-tick" transform="rotate(246 300 300)"/>
    <use href="#min-tick" transform="rotate(252 300 300)"/>
    <use href="#min-tick" transform="rotate(258 300 300)"/>
    <use href="#min-tick" transform="rotate(264 300 300)"/>
    <!-- 46 to 49 -->
    <use href="#min-tick" transform="rotate(276 300 300)"/>
    <use href="#min-tick" transform="rotate(282 300 300)"/>
    <use href="#min-tick" transform="rotate(288 300 300)"/>
    <use href="#min-tick" transform="rotate(294 300 300)"/>
    <!-- 51 to 54 -->
    <use href="#min-tick" transform="rotate(306 300 300)"/>
    <use href="#min-tick" transform="rotate(312 300 300)"/>
    <use href="#min-tick" transform="rotate(318 300 300)"/>
    <use href="#min-tick" transform="rotate(324 300 300)"/>
    <!-- 56 to 59 -->
    <use href="#min-tick" transform="rotate(336 300 300)"/>
    <use href="#min-tick" transform="rotate(342 300 300)"/>
    <use href="#min-tick" transform="rotate(348 300 300)"/>
    <use href="#min-tick" transform="rotate(354 300 300)"/>

    <!-- 12 Major Hour Ticks -->
    <use href="#hour-tick" transform="rotate(0 300 300)"/>
    <use href="#hour-tick" transform="rotate(30 300 300)"/>
    <use href="#hour-tick" transform="rotate(60 300 300)"/>
    <use href="#hour-tick" transform="rotate(90 300 300)"/>
    <use href="#hour-tick" transform="rotate(120 300 300)"/>
    <use href="#hour-tick" transform="rotate(150 300 300)"/>
    <use href="#hour-tick" transform="rotate(180 300 300)"/>
    <use href="#hour-tick" transform="rotate(210 300 300)"/>
    <use href="#hour-tick" transform="rotate(240 300 300)"/>
    <use href="#hour-tick" transform="rotate(270 300 300)"/>
    <use href="#hour-tick" transform="rotate(300 300 300)"/>
    <use href="#hour-tick" transform="rotate(330 300 300)"/>
  </g>

  <!-- Hour Numerals (Radius = 158px from center (300, 300)) -->
  <!-- x = 300 + 158 * sin(θ), y = 300 - 158 * cos(θ) -->
  <g class="dial-numeral">
    <!-- 12 o'clock (0°) -->
    <text x="300" y="142">12</text>
    <!-- 1 o'clock (30°) -->
    <text x="379" y="163">1</text>
    <!-- 2 o'clock (60°) -->
    <text x="436.8" y="221">2</text>
    <!-- 3 o'clock (90°) -->
    <text x="458" y="300">3</text>
    <!-- 4 o'clock (120°) -->
    <text x="436.8" y="379">4</text>
    <!-- 5 o'clock (150°) -->
    <text x="379" y="437">5</text>
    <!-- 6 o'clock (180°) -->
    <text x="300" y="458">6</text>
    <!-- 7 o'clock (210°) -->
    <text x="221" y="437">7</text>
    <!-- 8 o'clock (240°) -->
    <text x="163.2" y="379">8</text>
    <!-- 9 o'clock (270°) -->
    <text x="142" y="300">9</text>
    <!-- 10 o'clock (300°) -->
    <text x="163.2" y="221">10</text>
    <!-- 11 o'clock (330°) -->
    <text x="221" y="163">11</text>
  </g>

  <!-- Brand / Sub-text -->
  <text x="300" y="235" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#888888" letter-spacing="3" text-anchor="middle">CHRONOMETER</text>

  <!-- HANDS SECTION -->

  <!-- Hour Hand: 3:45 -> Angle = 3 * 30° + 45 * 0.5° = 90° + 22.5° = 112.5° -->
  <g id="hour-hand" filter="url(#hand-shadow)" transform="rotate(112.5 300 300)">
    <!-- Tapered wider hand, length = 125px -->
    <path d="M 293 325 
             L 294 185 
             L 300 175 
             L 306 185 
             L 307 325 
             Z" 
          fill="#1c1c1c"/>
  </g>

  <!-- Minute Hand: 45 min -> Angle = 45 * 6° = 270° (pointing directly at 9) -->
  <g id="minute-hand" filter="url(#hand-shadow)" transform="rotate(270 300 300)">
    <!-- Sleeker, longer hand extending into the tick ring, length = 188px -->
    <path d="M 295.5 330 
             L 297 122 
             L 300 112 
             L 303 122 
             L 304.5 330 
             Z" 
          fill="#2b2b2b"/>
  </g>

  <!-- Second Hand: 00s -> Angle = 0° (pointing straight up at 12) -->
  <g id="second-hand" filter="url(#hand-shadow)" transform="rotate(0 300 300)">
    <!-- Thin red needle hand with counter-balance tail -->
    <line x1="300" y1="355" x2="300" y2="100" stroke="#d91e18" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tail counterweight disc -->
    <circle cx="300" cy="335" r="5" fill="#d91e18"/>
  </g>

  <!-- Central Mounting Pin / Cap Assembly -->
  <circle cx="300" cy="300" r="11" fill="#1c1c1c"/>
  <circle cx="300" cy="300" r="6" fill="#d91e18"/>
  <circle cx="300" cy="300" r="2.5" fill="#ffffff" opacity="0.8"/>
</svg>