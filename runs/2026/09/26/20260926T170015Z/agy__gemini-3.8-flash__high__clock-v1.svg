<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Clock Outer Drop Shadow -->
    <filter id="clockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0b0f19" flood-opacity="0.35" />
    </filter>

    <!-- Hands Drop Shadow -->
    <filter id="handShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.28" />
    </filter>

    <!-- Second Hand Drop Shadow -->
    <filter id="secondShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.22" />
    </filter>

    <!-- Outer Bezel Metallic Gradient -->
    <linearGradient id="outerBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a404d" />
      <stop offset="30%" stop-color="#1e222a" />
      <stop offset="70%" stop-color="#12151b" />
      <stop offset="100%" stop-color="#2d333e" />
    </linearGradient>

    <!-- Bezel Chamfer Highlight Gradient -->
    <linearGradient id="chamferGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#566173" />
      <stop offset="50%" stop-color="#20242c" />
      <stop offset="100%" stop-color="#6b788e" />
    </linearGradient>

    <!-- Dial Face Subtle Radial Gradient -->
    <radialGradient id="dialGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#faf8f5" />
      <stop offset="100%" stop-color="#eae5db" />
    </radialGradient>

    <!-- Inner Bezel Wall Rim Shadow -->
    <radialGradient id="rimShadow" cx="50%" cy="50%" r="50%">
      <stop offset="86%" stop-color="#000000" stop-opacity="0" />
      <stop offset="95%" stop-color="#000000" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32" />
    </radialGradient>

    <!-- Brass Center Pin Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6714" />
    </linearGradient>

    <!-- Subtle Glass Sheen Gradient -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Reusable Group of 4 Minute Ticks (Between Hours) -->
    <g id="minTicks4">
      <line x1="300" y1="70" x2="300" y2="84" stroke="#4a5568" stroke-width="1.4" stroke-linecap="round" transform="rotate(6 300 300)" />
      <line x1="300" y1="70" x2="300" y2="84" stroke="#4a5568" stroke-width="1.4" stroke-linecap="round" transform="rotate(12 300 300)" />
      <line x1="300" y1="70" x2="300" y2="84" stroke="#4a5568" stroke-width="1.4" stroke-linecap="round" transform="rotate(18 300 300)" />
      <line x1="300" y1="70" x2="300" y2="84" stroke="#4a5568" stroke-width="1.4" stroke-linecap="round" transform="rotate(24 300 300)" />
    </g>

    <!-- Reusable Major Hour Tick Line -->
    <line id="hourTick" x1="300" y1="67" x2="300" y2="87" stroke="#1a202c" stroke-width="4.5" stroke-linecap="round" />
  </defs>

  <!-- ==================== CLOCK CASE & BEZEL ==================== -->
  <!-- Outer Bezel with Drop Shadow -->
  <circle cx="300" cy="300" r="282" fill="url(#outerBezelGrad)" filter="url(#clockShadow)" />

  <!-- Outer Stepped Groove -->
  <circle cx="300" cy="300" r="267" fill="none" stroke="url(#chamferGrad)" stroke-width="2.5" />

  <!-- Inner Bezel Slope -->
  <circle cx="300" cy="300" r="265" fill="#1b1e25" />
  <circle cx="300" cy="300" r="248" fill="none" stroke="#333945" stroke-width="1.5" />

  <!-- ==================== DIAL FACE ==================== -->
  <!-- Main Dial Plate -->
  <circle cx="300" cy="300" r="245" fill="url(#dialGrad)" />

  <!-- Perimeter Recess Shadow -->
  <circle cx="300" cy="300" r="245" fill="url(#rimShadow)" />

  <!-- ==================== RAILROAD CHAPTER RING ==================== -->
  <circle cx="300" cy="300" r="230" fill="none" stroke="#2d3748" stroke-width="1.2" />
  <circle cx="300" cy="300" r="216" fill="none" stroke="#2d3748" stroke-width="1.2" />

  <!-- ==================== MINUTE TICK MARKS (48 TICKS) ==================== -->
  <use href="#minTicks4" xlink:href="#minTicks4" />
  <use href="#minTicks4" xlink:href="#minTicks4" transform="rotate(30 300 300)" />
  <use href="#minTicks4" xlink:href="#minTicks4" transform="rotate(60 300 300)" />
  <use href="#minTicks4" xlink:href="#minTicks4" transform="rotate(90 300 300)" />
  <use href="#minTicks4" xlink:href="#minTicks4" transform="rotate(120 300 300)" />
  <use href="#minTicks4" xlink:href="#minTicks4" transform="rotate(150 300 300)" />
  <use href="#minTicks4" xlink:href="#minTicks4" transform="rotate(180 300 300)" />
  <use href="#minTicks4" xlink:href="#minTicks4" transform="rotate(210 300 300)" />
  <use href="#minTicks4" xlink:href="#minTicks4" transform="rotate(240 300 300)" />
  <use href="#minTicks4" xlink:href="#minTicks4" transform="rotate(270 300 300)" />
  <use href="#minTicks4" xlink:href="#minTicks4" transform="rotate(300 300 300)" />
  <use href="#minTicks4" xlink:href="#minTicks4" transform="rotate(330 300 300)" />

  <!-- ==================== HOUR TICK MARKS (12 TICKS) ==================== -->
  <use href="#hourTick" xlink:href="#hourTick" />
  <use href="#hourTick" xlink:href="#hourTick" transform="rotate(30 300 300)" />
  <use href="#hourTick" xlink:href="#hourTick" transform="rotate(60 300 300)" />
  <use href="#hourTick" xlink:href="#hourTick" transform="rotate(90 300 300)" />
  <use href="#hourTick" xlink:href="#hourTick" transform="rotate(120 300 300)" />
  <use href="#hourTick" xlink:href="#hourTick" transform="rotate(150 300 300)" />
  <use href="#hourTick" xlink:href="#hourTick" transform="rotate(180 300 300)" />
  <use href="#hourTick" xlink:href="#hourTick" transform="rotate(210 300 300)" />
  <use href="#hourTick" xlink:href="#hourTick" transform="rotate(240 300 300)" />
  <use href="#hourTick" xlink:href="#hourTick" transform="rotate(270 300 300)" />
  <use href="#hourTick" xlink:href="#hourTick" transform="rotate(300 300 300)" />
  <use href="#hourTick" xlink:href="#hourTick" transform="rotate(330 300 300)" />

  <!-- ==================== HOUR NUMERALS (1 TO 12) ==================== -->
  <g font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="34" font-weight="bold" fill="#1a202c" text-anchor="middle" dominant-baseline="central">
    <!-- 12: top center (r = 180) -->
    <text x="300" y="120">12</text>
    <!-- 1: 30° -->
    <text x="390" y="144.1">1</text>
    <!-- 2: 60° -->
    <text x="455.9" y="210">2</text>
    <!-- 3: 90° -->
    <text x="480" y="300">3</text>
    <!-- 4: 120° -->
    <text x="455.9" y="390">4</text>
    <!-- 5: 150° -->
    <text x="390" y="455.9">5</text>
    <!-- 6: 180° -->
    <text x="300" y="480">6</text>
    <!-- 7: 210° -->
    <text x="210" y="455.9">7</text>
    <!-- 8: 240° -->
    <text x="144.1" y="390">8</text>
    <!-- 9: 270° -->
    <text x="120" y="300">9</text>
    <!-- 10: 300° -->
    <text x="144.1" y="210">10</text>
    <!-- 11: 330° -->
    <text x="210" y="144.1">11</text>
  </g>

  <!-- ==================== CLASSIC DIAL INSCRIPTIONS ==================== -->
  <text x="300" y="215" font-family="Georgia, serif" font-size="11" font-weight="bold" letter-spacing="3" fill="#64748b" text-anchor="middle">REGULATOR</text>
  <text x="300" y="385" font-family="Georgia, serif" font-size="9" font-weight="bold" letter-spacing="2" fill="#78889b" text-anchor="middle">PRECISION QUARTZ</text>
  <text x="300" y="504" font-family="sans-serif" font-size="6.5" font-weight="600" letter-spacing="1" fill="#94a3b8" text-anchor="middle">SWISS MOVT</text>

  <!-- ==================== SUBTLE GLASS REFLECTION ==================== -->
  <path d="M 128 175 A 245 245 0 0 1 425 95 A 240 240 0 0 0 128 175 Z" fill="url(#glassSheen)" pointer-events="none" />

  <!-- ==================== CLOCK HANDS ==================== -->
  <!-- 
    HOUR HAND:
    Time: 3:45. 45 minutes elapsed = 45/60 = 0.75 of an hour.
    Angle: 3 o'clock (90°) + 0.75 * 30° = 112.5° (precisely 3/4 between 3 and 4).
    Shape: Shorter (length 132px) and wider (width 13px) beveled sword hand.
  -->
  <g transform="rotate(112.5 300 300)" filter="url(#handShadow)">
    <!-- Counterbalance Tail -->
    <path d="M 295 300 L 297 325 L 300 329 L 303 325 L 305 300 Z" fill="#1b212b" />
    <!-- Left Facet (Lighted) -->
    <path d="M 300 168 L 293.5 225 L 295 300 L 300 300 Z" fill="#333e4f" />
    <!-- Right Facet (Shaded) -->
    <path d="M 300 168 L 306.5 225 L 305 300 L 300 300 Z" fill="#181d26" />
    <!-- Ridge Highlight -->
    <line x1="300" y1="168" x2="300" y2="300" stroke="#4a5568" stroke-width="0.5" />
  </g>

  <!-- 
    MINUTE HAND:
    Time: :45 minutes.
    Angle: Directly at 9 o'clock = 270° from 12 o'clock top.
    Shape: Longer (length 212px, reaching minute track) and sleeker (width 7px).
  -->
  <g transform="rotate(270 300 300)" filter="url(#handShadow)">
    <!-- Counterbalance Tail -->
    <path d="M 297 300 L 298 332 L 300 338 L 302 332 L 303 300 Z" fill="#1b212b" />
    <!-- Left Facet (Lighted) -->
    <path d="M 300 88 L 296.5 160 L 297 300 L 300 300 Z" fill="#333e4f" />
    <!-- Right Facet (Shaded) -->
    <path d="M 300 88 L 303.5 160 L 303 300 L 300 300 Z" fill="#181d26" />
    <!-- Ridge Highlight -->
    <line x1="300" y1="88" x2="300" y2="300" stroke="#4a5568" stroke-width="0.5" />
  </g>

  <!-- 
    SECOND HAND:
    Angle: Pointing directly at 12 o'clock = 0°.
    Shape: Thin red needle with counterweight ring and tail.
  -->
  <g transform="rotate(0 300 300)" filter="url(#secondShadow)">
    <!-- Tail Extension -->
    <line x1="300" y1="300" x2="300" y2="346" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" />
    <!-- Counterweight Disc -->
    <circle cx="300" cy="330" r="5" fill="#dc2626" />
    <circle cx="300" cy="330" r="2.2" fill="#faf8f5" />
    <!-- Slender Forward Needle -->
    <line x1="300" y1="300" x2="300" y2="74" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" />
    <!-- Needle Arrowhead Tip -->
    <polygon points="299,94 300,72 301,94" fill="#dc2626" />
    <!-- Red Base Pivot Hub -->
    <circle cx="300" cy="300" r="5" fill="#dc2626" />
  </g>

  <!-- ==================== CENTRAL MOUNTING PIN ==================== -->
  <!-- Brass Washer / Collar -->
  <circle cx="300" cy="300" r="8.5" fill="url(#brassGrad)" stroke="#876412" stroke-width="0.75" />

  <!-- Metallic Center Cap -->
  <circle cx="300" cy="300" r="4.2" fill="#1a1e24" stroke="#000000" stroke-width="0.5" />

  <!-- Specular Reflection Highlight -->
  <circle cx="298.6" cy="298.6" r="1.3" fill="#ffffff" opacity="0.85" />
</svg>