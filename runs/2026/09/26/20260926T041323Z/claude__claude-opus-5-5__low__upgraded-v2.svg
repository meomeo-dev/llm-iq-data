<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e8f6fb"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9a94"/>
      <stop offset="1" stop-color="#4a4038"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#5a1f18"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e27a"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#sky)"/>
  <rect y="455" width="600" height="45" fill="#c9b27c"/>
  <line x1="0" y1="455" x2="600" y2="455" stroke="#a88f58" stroke-width="2"/>

  <!-- Rear wheel -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="95" y1="380" x2="245" y2="380"/>
    <line x1="170" y1="305" x2="170" y2="455"/>
    <line x1="117" y1="327" x2="223" y2="433"/>
    <line x1="223" y1="327" x2="117" y2="433"/>
    <line x1="101" y1="351" x2="239" y2="409"/>
    <line x1="101" y1="409" x2="239" y2="351"/>
    <line x1="141" y1="311" x2="199" y2="449"/>
    <line x1="199" y1="311" x2="141" y2="449"/>
  </g>
  <circle cx="170" cy="380" r="75" fill="none" stroke="#222" stroke-width="8"/>
  <circle cx="170" cy="380" r="70" fill="none" stroke="#888" stroke-width="2"/>
  <circle cx="170" cy="380" r="7" fill="#555"/>

  <!-- Front wheel -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="355" y1="380" x2="505" y2="380"/>
    <line x1="430" y1="305" x2="430" y2="455"/>
    <line x1="377" y1="327" x2="483" y2="433"/>
    <line x1="483" y1="327" x2="377" y2="433"/>
    <line x1="361" y1="351" x2="499" y2="409"/>
    <line x1="361" y1="409" x2="499" y2="351"/>
    <line x1="401" y1="311" x2="459" y2="449"/>
    <line x1="459" y1="311" x2="401" y2="449"/>
  </g>
  <circle cx="430" cy="380" r="75" fill="none" stroke="#222" stroke-width="8"/>
  <circle cx="430" cy="380" r="70" fill="none" stroke="#888" stroke-width="2"/>
  <circle cx="430" cy="380" r="7" fill="#555"/>

  <!-- Frame (diamond) -->
  <g stroke="#1f6fb2" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="290" y1="380" x2="262" y2="262"/>   <!-- seat tube -->
    <line x1="262" y1="262" x2="398" y2="262"/>   <!-- top tube -->
    <line x1="290" y1="380" x2="392" y2="292"/>   <!-- down tube -->
    <line x1="398" y1="258" x2="390" y2="294"/>   <!-- head tube -->
    <line x1="290" y1="380" x2="170" y2="380"/>   <!-- chainstay -->
    <line x1="264" y1="268" x2="170" y2="380"/>   <!-- seat stay -->
    <line x1="392" y1="292" x2="430" y2="380"/>   <!-- fork -->
  </g>
  <!-- Seat post & saddle -->
  <line x1="262" y1="262" x2="257" y2="240" stroke="#999" stroke-width="5"/>
  <path d="M232 236 Q255 229 280 236 L276 243 Q255 240 236 243 Z" fill="#222"/>
  <!-- Stem & handlebar -->
  <line x1="398" y1="258" x2="403" y2="232" stroke="#999" stroke-width="5"/>
  <path d="M403 232 Q425 226 428 242 Q426 254 414 254" stroke="#222" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Chainring and chain -->
  <circle cx="290" cy="380" r="18" fill="none" stroke="#444" stroke-width="4"/>
  <path d="M290 362 L170 373 M290 398 L170 387" stroke="#666" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- Far leg (behind), pedal up -->
  <path d="M268 238 L305 300 L270 352" stroke="#3a3a3a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="290" y1="380" x2="268" y2="355" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <rect x="256" y="351" width="24" height="7" rx="2" fill="#222"/>
  <path d="M258 350 l-10 4 M268 350 l-6 8 M274 350 l6 6" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>

  <!-- Pelican body -->
  <ellipse cx="275" cy="205" rx="85" ry="48" transform="rotate(-18 275 205)" fill="url(#body)" stroke="#2e2822" stroke-width="2"/>
  <!-- Tail feathers -->
  <path d="M195 225 L160 238 L170 226 L155 226 L190 212 Z" fill="#3b332c" stroke="#221c17" stroke-width="1.5"/>
  <!-- Dark breeding belly -->
  <path d="M215 240 Q275 262 345 212 Q320 250 260 256 Q228 254 215 240 Z" fill="#2b241f"/>

  <!-- Near leg, pedal down -->
  <path d="M275 240 L325 330 L312 404" stroke="#2f2f2f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="290" y1="380" x2="312" y2="405" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <rect x="300" y="402" width="26" height="7" rx="2" fill="#222"/>
  <path d="M302 402 l-10 4 M312 402 l-4 9 M320 402 l8 6" stroke="#2f2f2f" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Wing with feathers -->
  <path d="M215 180 Q280 150 345 180 Q360 200 350 215 Q300 228 240 220 Q210 205 215 180 Z" fill="#7d7a72" stroke="#3a342e" stroke-width="2"/>
  <g fill="none" stroke="#4d463e" stroke-width="1.6">
    <path d="M240 190 q8 8 16 0 q8 8 16 0 q8 8 16 0 q8 8 16 0 q8 8 16 0"/>
    <path d="M232 203 q8 8 16 0 q8 8 16 0 q8 8 16 0 q8 8 16 0 q8 8 16 0 q8 8 16 0"/>
  </g>
  <!-- Primaries (dark flight feathers) -->
  <path d="M225 212 L180 222 L230 218 L185 232 L240 222 Z" fill="#231e1a"/>
  <!-- Wing reaching to handlebar -->
  <path d="M335 195 Q380 210 412 246" stroke="#6e6a62" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M345 202 l6 10 M362 212 l5 10 M378 223 l4 10" stroke="#3a342e" stroke-width="1.5"/>
  <circle cx="414" cy="248" r="7" fill="#5a544c"/>

  <!-- Neck: chestnut hindneck (breeding) with white foreneck stripe -->
  <path d="M320 170 Q330 120 360 100 L392 108 Q360 130 352 180 Z" fill="#6b2f1a" stroke="#3d1a0e" stroke-width="1.5"/>
  <path d="M345 176 Q355 132 388 112 L394 118 Q366 140 356 180 Z" fill="#f5f2ea"/>
  <g stroke="#4a1f10" stroke-width="1.2" fill="none">
    <path d="M330 160 q5 -4 10 0 M334 145 q5 -4 10 0 M340 130 q5 -4 10 0 M348 116 q5 -4 10 0"/>
  </g>

  <!-- Head: white with yellow crown -->
  <ellipse cx="385" cy="98" rx="30" ry="22" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <path d="M358 92 Q380 68 410 86 Q390 82 360 96 Z" fill="url(#crown)"/>
  <path d="M360 90 Q382 74 408 84" stroke="#e8c64a" stroke-width="3" fill="none"/>
  <!-- Eye with pale iris and pink eye ring -->
  <circle cx="394" cy="95" r="5.5" fill="#f4a3a3"/>
  <circle cx="394" cy="95" r="3.5" fill="#e8f1f6"/>
  <circle cx="394" cy="95" r="1.6" fill="#111"/>

  <!-- Bill (upper mandible) -->
  <path d="M405 98 L545 128 Q553 132 545 136 L405 112 Z" fill="#b7a58a" stroke="#6b5c46" stroke-width="1.5"/>
  <path d="M535 127 Q556 130 548 140 L538 136 Z" fill="#c0392b"/>
  <line x1="410" y1="104" x2="535" y2="129" stroke="#8a785e" stroke-width="1"/>
  <!-- Large gular pouch -->
  <path d="M405 112 L545 136 Q520 160 470 172 Q420 178 395 150 Q388 128 405 112 Z" fill="url(#pouch)" stroke="#3b140f" stroke-width="1.5"/>
  <path d="M420 135 Q470 150 525 142 M415 150 Q460 165 505 155" stroke="#8e2a20" stroke-width="1.2" fill="none"/>

  <text x="300" y="485" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5a4a2a">California brown pelican, breeding plumage</text>
</svg>