<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f0"/>
      <stop offset="1" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7fa8"/>
      <stop offset="1" stop-color="#6fb0c9"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2463a"/>
      <stop offset="0.6" stop-color="#c32a22"/>
      <stop offset="1" stop-color="#861a16"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b2a6"/>
      <stop offset="1" stop-color="#8a8277"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e4b3c"/>
      <stop offset="1" stop-color="#3b2e25"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2d4f5a"/>
    </marker>
    <g id="wheel">
      <circle r="100" fill="none" stroke="#1e1e1e" stroke-width="9"/>
      <circle r="93" fill="none" stroke="#b5b5b5" stroke-width="3"/>
      <g stroke="#d4d4d4" stroke-width="1.3">
        <line x1="-93" y1="0" x2="93" y2="0"/>
        <line x1="-89.8" y1="-24.1" x2="89.8" y2="24.1"/>
        <line x1="-80.5" y1="-46.5" x2="80.5" y2="46.5"/>
        <line x1="-65.8" y1="-65.8" x2="65.8" y2="65.8"/>
        <line x1="-46.5" y1="-80.5" x2="46.5" y2="80.5"/>
        <line x1="-24.1" y1="-89.8" x2="24.1" y2="89.8"/>
        <line x1="0" y1="-93" x2="0" y2="93"/>
        <line x1="24.1" y1="-89.8" x2="-24.1" y2="89.8"/>
        <line x1="46.5" y1="-80.5" x2="-46.5" y2="80.5"/>
        <line x1="65.8" y1="-65.8" x2="-65.8" y2="65.8"/>
        <line x1="80.5" y1="-46.5" x2="-80.5" y2="46.5"/>
        <line x1="89.8" y1="-24.1" x2="-89.8" y2="24.1"/>
      </g>
      <circle r="9" fill="#8c8c8c" stroke="#444" stroke-width="2"/>
      <circle r="3" fill="#333"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="42" fill="#ffd98a"/>
  <path d="M90,80 q15,-12 30,0 q15,-12 30,0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M600,170 q20,-14 40,0 q20,-14 40,0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <rect y="360" width="800" height="120" fill="url(#sea)"/>
  <path d="M0,380 q20,-6 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0" fill="none" stroke="#cfe9f2" stroke-width="2" opacity="0.7"/>
  <rect y="470" width="800" height="130" fill="#e8d3a8"/>
  <rect y="530" width="800" height="70" fill="#8b8782"/>
  <g stroke="#f3f0e6" stroke-width="5">
    <line x1="20" y1="570" x2="80" y2="570"/>
    <line x1="160" y1="570" x2="220" y2="570"/>
    <line x1="300" y1="570" x2="360" y2="570"/>
    <line x1="440" y1="570" x2="500" y2="570"/>
    <line x1="580" y1="570" x2="640" y2="570"/>
    <line x1="720" y1="570" x2="780" y2="570"/>
  </g>
  <ellipse cx="410" cy="542" rx="230" ry="9" fill="#000" opacity="0.2"/>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="70" y1="330" x2="140" y2="330"/>
    <line x1="50" y1="380" x2="140" y2="380"/>
    <line x1="80" y1="430" x2="145" y2="430"/>
    <line x1="150" y1="250" x2="230" y2="250"/>
    <line x1="170" y1="285" x2="235" y2="285"/>
  </g>

  <!-- Far wing (behind bike) reaching to handlebar -->
  <path d="M420,232 C470,238 508,262 530,288 L522,296 C498,282 462,268 425,260 Z" fill="#6f675d"/>

  <!-- Far leg (behind frame) -->
  <path d="M378,298 L420,360 L372,418" fill="none" stroke="#262220" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Far crank arm & pedal -->
  <line x1="400" y1="450" x2="370" y2="422" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <rect x="359" y="419" width="22" height="7" rx="2" fill="#333"/>
  <path d="M372,414 L394,418 L388,424 L382,421 L377,426 L371,422 L361,425 Z" fill="#1f1b19"/>

  <!-- Wheels -->
  <use href="#wheel" transform="translate(260,440)"/>
  <use href="#wheel" transform="translate(560,440) rotate(7)"/>

  <!-- Chain & cog -->
  <circle cx="260" cy="440" r="10" fill="none" stroke="#555" stroke-width="3"/>
  <line x1="260" y1="430" x2="400" y2="428" stroke="#444" stroke-width="2.5"/>
  <line x1="260" y1="450" x2="400" y2="472" stroke="#444" stroke-width="2.5"/>

  <!-- Frame -->
  <g stroke="#1f7a8c" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="260" y1="440" x2="400" y2="450"/>
    <line x1="260" y1="440" x2="368" y2="338"/>
    <line x1="400" y1="450" x2="362" y2="318"/>
    <line x1="366" y1="332" x2="522" y2="330"/>
    <line x1="400" y1="450" x2="528" y2="360"/>
  </g>
  <line x1="520" y1="322" x2="530" y2="362" stroke="#16606e" stroke-width="13" stroke-linecap="round"/>
  <path d="M529,358 Q548,400 560,440" fill="none" stroke="#1f7a8c" stroke-width="7" stroke-linecap="round"/>
  <!-- Seat post & saddle -->
  <line x1="362" y1="318" x2="356" y2="298" stroke="#9a9a9a" stroke-width="6"/>
  <path d="M332,296 Q355,286 388,293 L385,301 Q356,299 336,303 Z" fill="#1a1a1a"/>
  <!-- Stem & handlebar -->
  <line x1="520" y1="322" x2="516" y2="298" stroke="#9a9a9a" stroke-width="6" stroke-linecap="round"/>
  <path d="M506,299 Q526,292 550,296" fill="none" stroke="#9a9a9a" stroke-width="6" stroke-linecap="round"/>
  <rect x="536" y="291" width="22" height="9" rx="4" fill="#111"/>

  <!-- Chainring -->
  <circle cx="400" cy="450" r="22" fill="none" stroke="#666" stroke-width="4"/>
  <circle cx="400" cy="450" r="6" fill="#444"/>

  <!-- Pedaling rotation indicator -->
  <path d="M439.8,416.6 A52,52 0 0 1 426,495" fill="none" stroke="#2d4f5a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- Tail -->
  <path d="M304,250 L258,258 L262,266 L252,272 L262,278 L300,280 Z" fill="#3a312a"/>
  <g stroke="#221c18" stroke-width="1.2">
    <line x1="300" y1="258" x2="262" y2="263"/>
    <line x1="300" y1="266" x2="258" y2="272"/>
    <line x1="300" y1="274" x2="264" y2="277"/>
  </g>

  <!-- Body (dark brown underparts) -->
  <path d="M300,255 C310,215 380,200 430,215 C460,225 468,265 452,292 C432,320 380,324 345,312 C320,302 304,282 300,255 Z" fill="url(#belly)"/>
  <g stroke="#2a211b" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <path d="M340,300 l10,6"/><path d="M360,302 l10,6"/><path d="M380,303 l10,6"/>
    <path d="M400,302 l10,6"/><path d="M420,298 l10,6"/><path d="M350,292 l10,6"/>
    <path d="M395,294 l10,6"/><path d="M435,288 l8,6"/>
  </g>

  <!-- Near wing (silvery-gray, extended to handlebar) -->
  <path d="M298,258 C320,228 380,212 425,220 C465,228 505,255 538,284 L546,292 L536,300 C515,296 495,292 470,292 C440,292 410,294 380,292 C350,290 320,282 298,270 Z" fill="url(#wingGrad)" stroke="#5f584f" stroke-width="1.5"/>
  <!-- Covert feathers -->
  <g fill="none" stroke="#6a6258" stroke-width="1.4">
    <path d="M342,238 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0"/>
    <path d="M318,254 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0"/>
    <path d="M322,270 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0 q7,7 14,0"/>
  </g>
  <g stroke="#d8d2c8" stroke-width="1" opacity="0.7">
    <line x1="349" y1="232" x2="349" y2="240"/><line x1="377" y1="230" x2="377" y2="240"/>
    <line x1="405" y1="228" x2="405" y2="240"/><line x1="339" y1="248" x2="339" y2="256"/>
    <line x1="381" y1="247" x2="381" y2="256"/><line x1="423" y1="247" x2="423" y2="256"/>
    <line x1="455" y1="249" x2="455" y2="256"/><line x1="357" y1="263" x2="357" y2="272"/>
    <line x1="413" y1="263" x2="413" y2="272"/><line x1="469" y1="264" x2="469" y2="272"/>
  </g>
  <!-- Secondary flight feathers -->
  <g fill="#3f3833" stroke="#231e1a" stroke-width="1">
    <ellipse cx="322" cy="280" rx="14" ry="5" transform="rotate(20 322 280)"/>
    <ellipse cx="346" cy="286" rx="14" ry="5" transform="rotate(12 346 286)"/>
    <ellipse cx="370" cy="290" rx="14" ry="5" transform="rotate(6 370 290)"/>
    <ellipse cx="394" cy="292" rx="14" ry="5"/>
    <ellipse cx="418" cy="292" rx="14" ry="5"/>
    <ellipse cx="442" cy="291" rx="14" ry="5"/>
    <ellipse cx="466" cy="291" rx="14" ry="5"/>
    <ellipse cx="490" cy="293" rx="14" ry="5"/>
  </g>
  <!-- Primary feathers gripping the handlebar -->
  <g fill="#2b2522" stroke="#141110" stroke-width="1">
    <path d="M506,272 C528,276 546,284 552,300 C546,303 540,298 536,292 C526,284 516,282 504,280 Z"/>
    <path d="M514,264 C536,268 554,280 560,296 C555,299 550,294 546,288 C536,278 524,274 512,272 Z"/>
    <path d="M500,282 C520,286 536,292 540,304 C534,306 528,300 524,296 C516,292 508,290 498,289 Z"/>
  </g>

  <!-- Near leg pushing the pedal -->
  <path d="M396,298 L445,383 L434,468" fill="none" stroke="#3a3533" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#5a5451" stroke-width="1">
    <line x1="440" y1="400" x2="446" y2="402"/><line x1="438" y1="420" x2="444" y2="422"/>
    <line x1="437" y1="440" x2="443" y2="442"/>
  </g>
  <!-- Near crank arm & pedal -->
  <line x1="400" y1="450" x2="430" y2="478" stroke="#777" stroke-width="7" stroke-linecap="round"/>
  <rect x="419" y="476" width="24" height="7" rx="2" fill="#333"/>
  <!-- Near webbed foot on pedal -->
  <path d="M432,464 L460,470 L453,476 L447,473 L441,478 L435,474 L422,478 Z" fill="#221e1c"/>

  <!-- Neck: chestnut hindneck (breeding) -->
  <path d="M420,228 C400,195 425,160 462,138 L492,150 C470,175 455,200 470,235 C475,255 468,270 455,282 C440,270 428,250 420,228 Z" fill="#5e2814"/>
  <g stroke="#8a4424" stroke-width="1.5" stroke-linecap="round">
    <path d="M430,200 l8,4"/><path d="M436,180 l8,4"/><path d="M446,162 l8,4"/>
    <path d="M428,220 l8,4"/><path d="M440,245 l8,4"/><path d="M435,232 l8,4"/>
  </g>
  <!-- White neck stripe -->
  <path d="M488,151 C465,176 450,200 464,236 C469,254 464,268 452,279 L442,271 C452,262 455,250 451,238 C436,204 448,174 474,146 Z" fill="#fbf8f0"/>
  <!-- Yellow breast patch at base of foreneck -->
  <ellipse cx="452" cy="268" rx="7" ry="10" fill="#f0cf6a" opacity="0.9"/>

  <!-- Head -->
  <ellipse cx="482" cy="132" rx="26" ry="20" fill="#fbf7ec"/>
  <!-- Yellow crown -->
  <path d="M458,126 C463,106 496,104 507,120 C494,116 474,117 458,126 Z" fill="#f2c94c"/>
  <!-- Short nape crest -->
  <path d="M460,126 L444,120 L450,128 L442,132 L458,136 Z" fill="#5e2814"/>
  <g stroke="#d9d2c0" stroke-width="1">
    <path d="M466,140 l6,-3"/><path d="M470,146 l6,-3"/><path d="M476,142 l6,-3"/>
  </g>

  <!-- Gular pouch (bright red, breeding) -->
  <path d="M500,140 C545,156 590,176 628,190 C615,212 580,234 545,230 C515,226 494,190 490,152 Z" fill="url(#pouch)" stroke="#6e1612" stroke-width="1.5"/>
  <g fill="none" stroke="#7a1a15" stroke-width="1.2" opacity="0.6">
    <path d="M510,170 C530,195 555,210 585,212"/>
    <path d="M520,160 C540,180 570,195 605,198"/>
    <path d="M505,185 C520,210 545,222 565,224"/>
  </g>
  <!-- Upper mandible -->
  <path d="M498,121 C540,130 600,160 640,182 C648,186 650,194 644,198 C640,192 635,190 628,188 C590,175 540,155 500,141 Z" fill="#cbb699" stroke="#7d6c56" stroke-width="1.2"/>
  <path d="M500,124 C545,133 600,162 637,183" fill="none" stroke="#d2605a" stroke-width="2.5"/>
  <!-- Hooked tip -->
  <path d="M630,183 C646,185 653,194 645,202 C642,195 637,192 628,190 Z" fill="#e06b2e" stroke="#9c4418" stroke-width="1"/>

  <!-- Eye: pale iris, pink bare skin -->
  <ellipse cx="489" cy="127" rx="8" ry="6" fill="#e9a397"/>
  <circle cx="489" cy="127" r="4" fill="#eef3f5" stroke="#c9564b" stroke-width="1.2"/>
  <circle cx="489.5" cy="127" r="1.8" fill="#111"/>
</svg>