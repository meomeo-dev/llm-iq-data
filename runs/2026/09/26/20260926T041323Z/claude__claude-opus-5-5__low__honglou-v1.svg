<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d2"/>
      <stop offset="1" stop-color="#ddd0b4"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d3dc"/>
      <stop offset="1" stop-color="#eef1f3"/>
    </linearGradient>
    <radialGradient id="jade" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#bff0d8"/>
      <stop offset="0.55" stop-color="#8fd3f0"/>
      <stop offset="0.75" stop-color="#e6a8d8"/>
      <stop offset="1" stop-color="#f3d27a"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.6" stop-color="#e2b33c"/>
      <stop offset="1" stop-color="#a87a14"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff6d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 墙面 -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="0" width="800" height="26" fill="#6b3a2a"/>

  <!-- 窗 -->
  <rect x="60" y="60" width="230" height="200" fill="url(#sky)"/>
  <g fill="#ffffff">
    <path d="M60 230 Q120 210 180 225 T290 220 L290 260 L60 260 Z" fill="#f7f8fa"/>
    <circle cx="90" cy="90" r="2.2"/><circle cx="130" cy="120" r="1.6"/><circle cx="170" cy="80" r="2"/>
    <circle cx="210" cy="140" r="2.4"/><circle cx="250" cy="100" r="1.8"/><circle cx="110" cy="170" r="2"/>
    <circle cx="160" cy="190" r="1.5"/><circle cx="230" cy="190" r="2.1"/><circle cx="270" cy="160" r="1.6"/>
    <circle cx="80" cy="140" r="1.7"/><circle cx="190" cy="110" r="1.4"/><circle cx="140" cy="70" r="1.5"/>
  </g>
  <!-- 窗外梅枝 -->
  <path d="M290 120 Q240 130 200 160 Q180 175 150 178" stroke="#4a3328" stroke-width="4" fill="none"/>
  <path d="M220 148 Q215 128 225 110" stroke="#4a3328" stroke-width="2.5" fill="none"/>
  <g fill="#c8324a"><circle cx="200" cy="158" r="4"/><circle cx="226" cy="112" r="3.5"/><circle cx="160" cy="176" r="3.5"/><circle cx="250" cy="134" r="3.5"/></g>
  <!-- 窗棂 -->
  <g stroke="#6b3a2a" stroke-width="5" fill="none">
    <rect x="60" y="60" width="230" height="200"/>
    <line x1="175" y1="60" x2="175" y2="260"/>
    <line x1="60" y1="126" x2="290" y2="126"/>
    <line x1="60" y1="193" x2="290" y2="193"/>
  </g>
  <g stroke="#6b3a2a" stroke-width="1.5" opacity="0.6">
    <line x1="117" y1="60" x2="117" y2="260"/><line x1="233" y1="60" x2="233" y2="260"/>
  </g>

  <!-- 墙上字画 -->
  <rect x="560" y="50" width="110" height="190" fill="#f6efdc" stroke="#7a5a3a" stroke-width="3"/>
  <path d="M580 200 Q600 150 620 170 Q640 120 655 140" stroke="#8a8a80" stroke-width="2" fill="none"/>
  <path d="M575 210 L660 210" stroke="#9aa0a0" stroke-width="1"/>
  <g fill="#333"><rect x="600" y="70" width="4" height="40"/><rect x="620" y="75" width="4" height="30"/></g>
  <rect x="555" y="44" width="120" height="8" fill="#5a3a22"/>

  <!-- 炕 -->
  <rect x="330" y="360" width="470" height="240" fill="#8a5a3a"/>
  <rect x="330" y="340" width="470" height="30" fill="#a86f44"/>
  <rect x="330" y="330" width="470" height="18" fill="#c9a36a"/>
  <!-- 炕褥 -->
  <rect x="340" y="310" width="460" height="30" rx="6" fill="#a8b8a0"/>
  <!-- 炕桌 -->
  <rect x="470" y="290" width="90" height="12" fill="#6b3a2a"/>
  <rect x="478" y="302" width="8" height="18" fill="#6b3a2a"/><rect x="544" y="302" width="8" height="18" fill="#6b3a2a"/>
  <path d="M495 276 Q500 262 510 276 Z" fill="#e8e4d8"/>
  <rect x="496" y="276" width="14" height="14" fill="#e8e4d8" stroke="#6a88a0" stroke-width="1"/>
  <ellipse cx="535" cy="288" rx="14" ry="4" fill="#c8c0b0"/>
  <!-- 手炉 -->
  <ellipse cx="740" cy="330" rx="20" ry="8" fill="#b08a3a"/>
  <rect x="720" y="315" width="40" height="15" fill="#c9a24a"/>
  <ellipse cx="740" cy="315" rx="20" ry="6" fill="#d8b860"/>
  <!-- 地面 -->
  <rect x="0" y="470" width="330" height="130" fill="#b9a68a"/>
  <line x1="0" y1="470" x2="330" y2="470" stroke="#8a7658" stroke-width="3"/>

  <!-- 宝钗 坐炕 -->
  <g>
    <!-- 裙 葱黄 -->
    <path d="M540 330 Q520 260 560 230 L640 230 Q690 270 680 335 Z" fill="#dfd48a"/>
    <!-- 蜜合色袄 -->
    <path d="M565 170 Q545 180 540 250 L660 250 Q655 180 635 170 Z" fill="#e8cfa0"/>
    <!-- 玫瑰紫比肩褂 -->
    <path d="M572 172 Q560 200 562 250 L638 250 Q640 200 628 172 L612 168 L600 200 L588 168 Z" fill="#9a4a78"/>
    <path d="M572 172 L588 168 L600 200 L612 168 L628 172" stroke="#f0e2c8" stroke-width="3" fill="none"/>
    <!-- 手臂 托锁 -->
    <path d="M575 185 Q540 210 565 222 Q585 215 598 205" stroke="#e8cfa0" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M628 185 Q650 215 625 228 Q612 220 605 212" stroke="#e8cfa0" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="598" cy="206" r="7" fill="#f7e4d2"/>
    <circle cx="606" cy="210" r="7" fill="#f7e4d2"/>
    <!-- 颈 -->
    <rect x="592" y="148" width="16" height="22" fill="#f7e4d2"/>
    <!-- 璎珞链 -->
    <path d="M588 168 Q600 190 602 196 M612 168 Q604 190 602 196" stroke="#d4a52a" stroke-width="1.8" fill="none"/>
    <!-- 金锁 -->
    <circle cx="602" cy="200" r="16" fill="url(#glow)"/>
    <path d="M590 196 Q602 188 614 196 L612 206 Q602 212 592 206 Z" fill="url(#gold)" stroke="#8a6010" stroke-width="1"/>
    <!-- 头 银盆面 -->
    <ellipse cx="600" cy="128" rx="25" ry="28" fill="#fbeadb"/>
    <path d="M574 125 Q572 88 600 86 Q630 88 627 125 Q622 104 600 102 Q580 104 574 125 Z" fill="#1e1a1a"/>
    <ellipse cx="600" cy="84" rx="18" ry="11" fill="#1e1a1a"/>
    <rect x="612" y="78" width="14" height="3" fill="#c9a24a" transform="rotate(-20 612 78)"/>
    <!-- 水杏眼 低看 -->
    <path d="M585 128 Q590 132 595 128" stroke="#2a1e1e" stroke-width="2" fill="none"/>
    <path d="M606 128 Q611 132 616 128" stroke="#2a1e1e" stroke-width="2" fill="none"/>
    <path d="M584 121 Q590 118 596 121 M605 121 Q611 118 617 121" stroke="#3a2a2a" stroke-width="1.2" fill="none"/>
    <path d="M596 145 Q600 147 604 145" stroke="#c0505a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="586" cy="138" rx="5" ry="3" fill="#f2b8b0" opacity="0.5"/>
    <ellipse cx="615" cy="138" rx="5" ry="3" fill="#f2b8b0" opacity="0.5"/>
  </g>

  <!-- 宝玉 -->
  <g>
    <!-- 靴 -->
    <path d="M395 560 L430 560 L430 540 L400 540 Z" fill="#222"/>
    <path d="M445 560 L480 560 L476 540 L446 540 Z" fill="#222"/>
    <!-- 下摆 -->
    <path d="M385 350 L480 350 L490 545 L390 545 Z" fill="#b8323a"/>
    <!-- 大红箭袖 -->
    <path d="M395 215 Q375 230 380 360 L490 360 Q495 240 470 215 Z" fill="#c8323a"/>
    <path d="M400 290 Q435 280 470 290" stroke="#e8c070" stroke-width="3" fill="none"/>
    <!-- 石青貂裘排穗褂 -->
    <path d="M405 215 Q392 260 398 320 L470 320 Q478 260 462 215 L433 212 Z" fill="#2e4a6a"/>
    <g stroke="#e8c070" stroke-width="2"><line x1="400" y1="320" x2="400" y2="332"/><line x1="415" y1="320" x2="415" y2="332"/><line x1="430" y1="320" x2="430" y2="332"/><line x1="445" y1="320" x2="445" y2="332"/><line x1="460" y1="320" x2="460" y2="332"/></g>
    <!-- 伸出递玉手臂 -->
    <path d="M460 230 Q505 245 535 220" stroke="#c8323a" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="545" cy="215" r="8" fill="#f7e4d2"/>
    <!-- 通灵宝玉 -->
    <path d="M545 215 Q550 200 555 190" stroke="#e6b030" stroke-width="1.5" fill="none"/>
    <circle cx="560" cy="205" r="20" fill="url(#glow)"/>
    <ellipse cx="560" cy="210" rx="9" ry="12" fill="url(#jade)" stroke="#9ab" stroke-width="0.8"/>
    <path d="M560 222 L556 232 M560 222 L564 232 M560 222 L560 234" stroke="#d04050" stroke-width="1.5"/>
    <!-- 另一手 -->
    <path d="M405 235 Q390 280 410 300" stroke="#c8323a" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="413" cy="302" r="7" fill="#f7e4d2"/>
    <!-- 颈头 -->
    <rect x="426" y="190" width="16" height="25" fill="#f7e4d2"/>
    <ellipse cx="438" cy="168" rx="24" ry="27" fill="#fbeadb" transform="rotate(12 438 168)"/>
    <path d="M414 165 Q412 132 440 130 Q466 134 462 160 Q450 146 430 150 Z" fill="#1e1a1a"/>
    <!-- 束发嵌宝紫金冠 -->
    <path d="M428 136 L436 118 L444 126 L452 116 L454 138 Z" fill="#d4a52a" stroke="#8a6010"/>
    <circle cx="442" cy="130" r="3" fill="#d0304a"/>
    <!-- 二龙抢珠抹额 -->
    <path d="M415 152 Q440 142 463 155" stroke="#d4a52a" stroke-width="4" fill="none"/>
    <circle cx="440" cy="147" r="2.5" fill="#fff"/>
    <!-- 五官 侧向宝钗 -->
    <path d="M440 168 Q445 171 450 168" stroke="#2a1e1e" stroke-width="2" fill="none"/>
    <path d="M425 166 Q429 169 433 166" stroke="#2a1e1e" stroke-width="2" fill="none"/>
    <path d="M438 185 Q444 189 450 184" stroke="#c0505a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="452" cy="178" rx="5" ry="3" fill="#f2b8b0" opacity="0.5"/>
  </g>

  <!-- 莺儿 -->
  <g>
    <path d="M700 470 Q695 360 715 300 L775 300 Q795 360 790 470 Z" fill="#8fb0a0"/>
    <path d="M712 250 Q700 280 708 330 L782 330 Q790 280 778 250 Z" fill="#e89a8a"/>
    <!-- 抿嘴掩口之手 -->
    <path d="M718 265 Q705 240 735 222" stroke="#e89a8a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="738" cy="220" r="6" fill="#f7e4d2"/>
    <rect x="738" y="226" width="14" height="24" fill="#f7e4d2"/>
    <ellipse cx="745" cy="205" rx="21" ry="24" fill="#fbeadb"/>
    <path d="M724 202 Q722 172 745 170 Q770 172 766 202 Q760 184 745 184 Q730 184 724 202 Z" fill="#1e1a1a"/>
    <circle cx="727" cy="178" r="9" fill="#1e1a1a"/>
    <circle cx="763" cy="178" r="9" fill="#1e1a1a"/>
    <circle cx="727" cy="178" r="3" fill="#d04050"/>
    <circle cx="763" cy="178" r="3" fill="#d04050"/>
    <!-- 眯眼笑 -->
    <path d="M733 202 Q737 198 741 202 M750 202 Q754 198 758 202" stroke="#2a1e1e" stroke-width="2" fill="none"/>
    <ellipse cx="757" cy="212" rx="4" ry="2.5" fill="#f2a0a0" opacity="0.7"/>
  </g>

  <!-- 题字 -->
  <g font-family="serif" fill="#6b3a2a">
    <text x="40" y="310" font-size="20">比通灵金莺微露意</text>
    <text x="40" y="336" font-size="13" fill="#8a6a4a">梨香院 · 冬日细雪</text>
  </g>
  <rect x="40" y="346" width="22" height="22" fill="#b8323a"/>
  <text x="44" y="362" font-size="12" font-family="serif" fill="#fff">红</text>
</svg>