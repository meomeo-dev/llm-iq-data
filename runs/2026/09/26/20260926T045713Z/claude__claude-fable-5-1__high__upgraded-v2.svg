  <circle cx="370" cy="430" r="24" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="370" cy="430" r="6" fill="#333"/>

  <!-- Pelican tail feathers -->
  <path d="M265 208 L200 226 L205 237 L266 224 Z" fill="#7D7267" stroke="#4E463E" stroke-width="1"/>
  <path d="M262 218 L198 244 L208 251 L264 233 Z" fill="#6A6055" stroke="#4E463E" stroke-width="1"/>
  <path d="M258 226 L210 258 L221 261 L262 241 Z" fill="#574D43" stroke="#3E362E" stroke-width="1"/>

  <!-- Pelican body -->
  <ellipse cx="340" cy="195" rx="95" ry="58" transform="rotate(-12 340 195)" fill="#8C8074"/>
  <g clip-path="url(#bodyClip)">
    <!-- dark brown belly -->
    <ellipse cx="330" cy="240" rx="105" ry="48" fill="#4B3A2E"/>
    <!-- feather scallops -->
    <g fill="none" stroke="#CFC7BB" stroke-width="1.4" opacity="0.85">
      <path d="M255 158 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0"/>
      <path d="M246 172 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0"/>
      <path d="M246 186 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0"/>
      <path d="M237 200 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0"/>
    </g>
    <g fill="none" stroke="#6B5A4C" stroke-width="1.4" opacity="0.9">
      <path d="M246 216 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0"/>
      <path d="M255 230 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0"/>
      <path d="M264 244 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0 a9 7 0 0 0 18 0"/>
    </g>
  </g>

  <!-- Neck: dark chestnut hindneck with white foreneck stripe, yellow chest patch -->
  <path d="M395 178 C428 168 428 120 458 103" fill="none" stroke="#5A2A1A" stroke-width="30" stroke-linecap="round"/>
  <path d="M404 187 C437 177 437 128 466 111" fill="none" stroke="#F2EEE6" stroke-width="9" stroke-linecap="round"/>
  <g stroke="#7A3A26" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M400 168 C412 162 420 150 424 138"/>
    <path d="M410 158 C420 150 426 140 430 128"/>
    <path d="M422 150 C430 142 436 130 440 118"/>
  </g>
  <ellipse cx="412" cy="182" rx="10" ry="8" fill="#E8D27A"/>

  <!-- Head: white with pale yellow crown, chestnut nape -->
  <circle cx="468" cy="95" r="27" fill="#F4EFE3"/>
  <g clip-path="url(#headClip)">
    <ellipse cx="464" cy="74" rx="24" ry="12" fill="#EEDC8C"/>
    <circle cx="450" cy="106" r="15" fill="#5A2A1A"/>
  </g>
  <circle cx="480" cy="88" r="7.5" fill="#D9A6A0"/>
  <circle cx="480" cy="88" r="5.5" fill="#E9DDA0"/>
  <circle cx="481" cy="88" r="3" fill="#111"/>
  <circle cx="482" cy="86.5" r="1" fill="#fff"/>

  <!-- Bill: upper mandible -->
  <path d="M490 84 L626 134 Q632 138 626 143 L490 104 Z" fill="#A39C8E" stroke="#6E675C" stroke-width="1.5"/>
  <path d="M612 129 L626 134 Q632 138 626 143 L614 140 Z" fill="#D6603A"/>
  <line x1="492" y1="86" x2="622" y2="135" stroke="#7E776B" stroke-width="1.2"/>
  <!-- Bill: lower mandible with large red gular pouch -->
  <path d="M490 104 L624 143 C606 174 565 198 528 188 C505 180 492 140 490 104 Z" fill="#C93B2E" stroke="#8A2419" stroke-width="1.5"/>
  <path d="M500 118 C506 150 518 172 540 180 C558 184 580 176 600 158" fill="none" stroke="#E0604F" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="492" y1="106" x2="622" y2="143" stroke="#7A6A62" stroke-width="2"/>

  <!-- Near wing reaching forward to grip the handlebar -->
  <path d="M360 172 C405 180 450 210 478 242 L470 252 C445 236 405 228 355 228 C345 210 345 185 360 172 Z" fill="#6F655A" stroke="#4E463E" stroke-width="1.5"/>
  <g fill="none" stroke="#4E463E" stroke-width="1.3" opacity="0.9">
    <path d="M362 184 C395 190 425 205 452 228"/>
    <path d="M358 198 C392 203 420 214 446 236"/>
    <path d="M356 212 C388 216 414 224 438 240"/>
  </g>
  <g fill="none" stroke="#BFB6A9" stroke-width="1.2" opacity="0.8">
    <path d="M372 178 a8 6 0 0 0 16 0 a8 6 0 0 0 16 0 a8 6 0 0 0 16 0 a8 6 0 0 0 16 0"/>
    <path d="M366 192 a8 6 0 0 0 16 0 a8 6 0 0 0 16 0 a8 6 0 0 0 16 0 a8 6 0 0 0 16 0 a8 6 0 0 0 16 0"/>
  </g>
  <!-- primary feathers fanning around the grip -->
  <g stroke="#4E463E" stroke-width="7" stroke-linecap="round">
    <line x1="440" y1="214" x2="482" y2="236"/>
    <line x1="438" y1="222" x2="478" y2="250"/>
    <line x1="432" y1="229" x2="468" y2="260"/>
    <line x1="424" y1="234" x2="454" y2="262"/>
  </g>

  <!-- Near leg pedaling, near crank, pedal and webbed foot -->
  <polyline points="352,252 395,345 400,460" fill="none" stroke="#4A4A4A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="370" y1="430" x2="400" y2="460" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <rect x="386" y="457" width="28" height="7" rx="2" fill="#1A1A1A" transform="rotate(-10 400 460)"/>
  <path d="M388 463 L424 455 L422 468 L406 474 Z" fill="#3F3F3F"/>
  <g stroke="#2A2A2A" stroke-width="1.2">
    <line x1="396" y1="464" x2="422" y2="457"/>
    <line x1="398" y1="470" x2="423" y2="462"/>
  </g>
</svg>