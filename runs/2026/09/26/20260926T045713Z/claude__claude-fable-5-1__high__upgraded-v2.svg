    <circle cx="600" cy="440" r="80" fill="none" stroke="#222" stroke-width="10"/>
    <circle cx="600" cy="440" r="72" fill="none" stroke="#999" stroke-width="3"/>
    <g stroke="#777" stroke-width="1.6">
      <line x1="600" y1="368" x2="600" y2="512"/>
      <line x1="600" y1="368" x2="600" y2="512" transform="rotate(22.5 600 440)"/>
      <line x1="600" y1="368" x2="600" y2="512" transform="rotate(45 600 440)"/>
      <line x1="600" y1="368" x2="600" y2="512" transform="rotate(67.5 600 440)"/>
      <line x1="600" y1="368" x2="600" y2="512" transform="rotate(90 600 440)"/>
      <line x1="600" y1="368" x2="600" y2="512" transform="rotate(112.5 600 440)"/>
      <line x1="600" y1="368" x2="600" y2="512" transform="rotate(135 600 440)"/>
