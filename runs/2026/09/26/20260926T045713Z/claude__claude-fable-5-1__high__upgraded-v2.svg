<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE3F5"/>
      <stop offset="1" stop-color="#EAF5FB"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <ellipse cx="340" cy="195" rx="95" ry="58" transform="rotate(-12 340 195)"/>
    </clipPath>
    <clipPath id="headClip">
      <circle cx="468" cy="95" r="27"/>
    </clipPath>
  </defs>

  <!-- Background: sky, sun, sea, sand -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="700" cy="80" r="40" fill="#FFE9A3"/>
  <rect x="0" y="430" width="800" height="90" fill="#5AA5CC"/>
  <path d="M0 455 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#8CC6E3" stroke-width="2"/>
  <path d="M0 490 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#8CC6E3" stroke-width="2"/>
  <rect x="0" y="520" width="800" height="80" fill="#E5D5A8"/>
  <ellipse cx="400" cy="522" rx="270" ry="9" fill="#000" opacity="0.15"/>

  <!-- Rear wheel -->
  <g>
    <circle cx="200" cy="440" r="80" fill="none" stroke="#222" stroke-width="10"/>
    <circle cx="200" cy="440" r="72" fill="none" stroke="#999" stroke-width="3"/>
    <g stroke="#777" stroke-width="1.6">
      <line x1="200" y1="368" x2="200" y2="512"/>
      <line x1="200" y1="368" x2="200" y2="512" transform="rotate(22.5 200 440)"/>
      <line x1="200" y1="368" x2="200" y2="512" transform="rotate(45 200 440)"/>
      <line x1="200" y1="368" x2="200" y2="512" transform="rotate(67.5 200 440)"/>
      <line x1="200" y1="368" x2="200" y2="512" transform="rotate(90 200 440)"/>
      <line x1="200" y1="368" x2="200" y2="512" transform="rotate(112.5 200 440)"/>
      <line x1="200" y1="368" x2="200" y2="512" transform="rotate(135 200 440)"/>
      <line x1="200" y1="368" x2="200" y2="512" transform="rotate(157.5 200 440)"/>
    </g>
    <circle cx="200" cy="440" r="7" fill="#444"/>
    <circle cx="200" cy="440" r="10" fill="none" stroke="#333" stroke-width="3"/>
  </g>

  <!-- Front wheel -->
