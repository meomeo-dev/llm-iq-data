  <!-- Far leg, far crank and far pedal (behind frame) -->
  <line x1="370" y1="430" x2="340" y2="400" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <polyline points="340,250 375,325 340,400" fill="none" stroke="#2F2F2F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="326" y="397" width="28" height="7" rx="2" fill="#1A1A1A" transform="rotate(-10 340 400)"/>
  <path d="M328 403 L358 396 L357 407 L344 412 Z" fill="#2F2F2F"/>

