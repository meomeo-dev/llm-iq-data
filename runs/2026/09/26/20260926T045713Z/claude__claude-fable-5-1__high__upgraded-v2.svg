  <line x1="200" y1="430" x2="370" y2="406" stroke="#333" stroke-width="3" stroke-dasharray="4 2"/>
  <line x1="200" y1="450" x2="370" y2="454" stroke="#333" stroke-width="3" stroke-dasharray="4 2"/>

  <!-- Frame -->
  <g fill="none" stroke="#1E5AA8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M370 430 L330 280 L520 272 L533 318 Z"/>
    <path d="M330 280 L200 440 L370 430"/>
    <path d="M533 318 Q560 380 600 440"/>
    <path d="M330 280 L324 250"/>
