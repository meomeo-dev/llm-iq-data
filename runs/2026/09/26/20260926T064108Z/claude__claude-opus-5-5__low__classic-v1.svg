<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#bfe6ff"/>
  <rect y="240" width="400" height="60" fill="#8cc56b"/>
  <!-- Bicycle -->
  <g stroke="#333" stroke-width="4" fill="none">
    <circle cx="110" cy="220" r="45"/>
    <circle cx="290" cy="220" r="45"/>
    <path d="M110 220 L175 220 L240 160 L160 160 Z"/>
    <path d="M175 220 L150 145"/>
    <path d="M290 220 L250 135 L270 125"/>
  </g>
  <g stroke="#333" stroke-width="3">
    <line x1="140" y1="145" x2="165" y2="145"/>
    <circle cx="175" cy="220" r="8" fill="#666"/>
    <line x1="175" y1="220" x2="190" y2="238"/>
  </g>
  <!-- Pelican body -->
  <ellipse cx="170" cy="115" rx="50" ry="35" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <path d="M130 105 Q110 95 120 130 Q140 125 150 115 Z" fill="#ddd" stroke="#999"/>
  <!-- Wing reaching handlebar -->
  <path d="M180 110 Q230 110 262 128" stroke="#ccc" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Leg to pedal -->
  <path d="M170 145 L185 190 L190 238" stroke="#f0a030" stroke-width="5" fill="none"/>
  <path d="M182 238 L200 238" stroke="#f0a030" stroke-width="5"/>
  <!-- Neck and head -->
  <path d="M200 100 Q215 70 205 50" stroke="#fafafa" stroke-width="16" fill="none" stroke-linecap="round"/>
  <circle cx="208" cy="45" r="16" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <circle cx="213" cy="41" r="3" fill="#000"/>
  <!-- Beak and pouch -->
  <path d="M220 42 L290 55 L222 52 Z" fill="#f5b83d" stroke="#c98a1a" stroke-width="1.5"/>
  <path d="M222 52 Q255 80 288 56" fill="#f7c96a" stroke="#c98a1a" stroke-width="1.5"/>
  <!-- Sun -->
  <circle cx="350" cy="50" r="25" fill="#ffd84d"/>
</svg>