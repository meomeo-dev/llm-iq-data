<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background & lighting gradients -->
    <radialGradient id="skyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="55%" stop-color="#e3f4f6" />
      <stop offset="100%" stop-color="#cde9ed" />
    </radialGradient>
    
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2c99b" />
      <stop offset="40%" stop-color="#d4b47d" />
      <stop offset="100%" stop-color="#b09360" />
    </linearGradient>

    <!-- Pelican plumage shading -->
    <linearGradient id="bodyGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e6ecf2" />
      <stop offset="100%" stop-color="#c5d1dc" />
    </linearGradient>

    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d9e2ea" />
      <stop offset="100%" stop-color="#7b8d9e" />
    </linearGradient>

    <linearGradient id="flightFeathers" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#566573" />
      <stop offset="100%" stop-color="#2c3e50" />
    </linearGradient>

    <!-- Beak & pouch gradients -->
    <linearGradient id="beakTopGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff9f43" />
      <stop offset="60%" stop-color="#ff793f" />
      <stop offset="100%" stop-color="#e65c00" />
    </linearGradient>

    <linearGradient id="pouchGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#feca57" />
      <stop offset="50%" stop-color="#ff9f43" />
      <stop offset="100%" stop-color="#ee5253" />
    </linearGradient>

    <!-- Bike gradients -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1dd1a1" />
      <stop offset="50%" stop-color="#10ac84" />
      <stop offset="100%" stop-color="#097457" />
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e0e0e0" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#bdc3c7" />
      <stop offset="100%" stop-color="#7f8c8d" />
    </linearGradient>

    <radialGradient id="rubberGrad" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#2d3436" />
      <stop offset="100%" stop-color="#1e2324" />
    </radialGradient>

    <!-- Soft shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.25" />
    </filter>
    <filter id="groundShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" />
    </filter>
  </defs>

  <!-- Sky Backdrop Circle -->
  <rect width="900" height="650" fill="#f8fcfe" />
  <circle cx="450" cy="300" r="280" fill="url(#skyGlow)" />

  <!-- Speed / Breeze Wind Lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M 60,180 Q 120,180 180,180" />
    <path d="M 120,220 Q 200,215 270,225" />
    <path d="M 40,300 Q 110,300 160,300" />
    <path d="M 80,420 Q 150,420 200,420" />
    <path d="M 760,150 Q 810,155 860,150" />
    <path d="M 720,240 Q 770,240 820,240" />
  </g>

  <!-- Coastal Ground / Seaside Path -->
  <path d="M 0,510 Q 250,495 500,510 T 900,505 L 900,650 L 0,650 Z" fill="url(#groundGrad)" />
  <path d="M 0,515 C 300,510 600,525 900,515" stroke="#f5e1b8" stroke-width="4" fill="none" opacity="0.7" />

  <!-- Road Dust & Pebble Details -->
  <g fill="#a2834f" opacity="0.6">
    <ellipse cx="220" cy="565" rx="5" ry="2" />
    <ellipse cx="280" cy="580" rx="8" ry="3" />
    <ellipse cx="640" cy="570" rx="6" ry="2.5" />
    <ellipse cx="720" cy="560" rx="4" ry="1.5" />
    <ellipse cx="440" cy="590" rx="9" ry="3" />
  </g>

  <!-- Soft Ground Shadows Under Wheels & Pedals -->
  <g fill="#4e3c23" opacity="0.4" filter="url(#groundShadow)">
    <ellipse cx="255" cy="535" rx="75" ry="14" />
    <ellipse cx="655" cy="535" rx="75" ry="14" />
    <ellipse cx="460" cy="538" rx="100" ry="16" />
  </g>

  <!-- ================= BICYCLE (Back Elements) ================= -->

  <!-- Rear Wheel -->
  <g id="rear-wheel">
    <circle cx="255" cy="440" r="85" fill="none" stroke="url(#rubberGrad)" stroke-width="16" />
    <circle cx="255" cy="440" r="77" fill="none" stroke="#f1f2f6" stroke-width="4" />
    <!-- Spokes -->
    <g stroke="url(#metalGrad)" stroke-width="1.5" opacity="0.75">
      <line x1="255" y1="363" x2="255" y2="517" />
      <line x1="178" y1="440" x2="332" y2="440" />
      <line x1="200" y1="385" x2="310" y2="495" />
      <line x1="200" y1="495" x2="310" y2="385" />
      <line x1="181" y1="410" x2="329" y2="470" />
      <line x1="181" y1="470" x2="329" y2="410" />
      <line x1="225" y1="366" x2="285" y2="514" />
      <line x1="285" y1="366" x2="225" y2="514" />
    </g>
    <circle cx="255" cy="440" r="14" fill="url(#metalGrad)" />
    <!-- Rear Mudguard/Fender -->
    <path d="M 170,430 A 95,95 0 0,1 290,348" stroke="#10ac84" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M 255,440 L 195,370" stroke="#a4b0be" stroke-width="2.5" />
  </g>

  <!-- Front Wheel -->
  <g id="front-wheel">
    <circle cx="655" cy="440" r="85" fill="none" stroke="url(#rubberGrad)" stroke-width="16" />
    <circle cx="655" cy="440" r="77" fill="none" stroke="#f1f2f6" stroke-width="4" />
    <!-- Spokes -->
    <g stroke="url(#metalGrad)" stroke-width="1.5" opacity="0.75">
      <line x1="655" y1="363" x2="655" y2="517" />
      <line x1="578" y1="440" x2="732" y2="440" />
      <line x1="600" y1="385" x2="710" y2="495" />
      <line x1="600" y1="495" x2="710" y2="385" />
      <line x1="581" y1="410" x2="729" y2="470" />
      <line x1="581" y1="470" x2="729" y2="410" />
      <line x1="625" y1="366" x2="685" y2="514" />
      <line x1="685" y1="366" x2="625" y2="514" />
    </g>
    <circle cx="655" cy="440" r="14" fill="url(#metalGrad)" />
    <!-- Front Mudguard/Fender -->
    <path d="M 580,390 A 95,95 0 0,1 715,380" stroke="#10ac84" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M 655,440 L 610,355" stroke="#a4b0be" stroke-width="2.5" />
  </g>

  <!-- Left/Far Pedal and Crank -->
  <g id="far-pedal">
    <line x1="455" y1="440" x2="420" y2="390" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round" />
    <rect x="402" y="385" width="26" height="8" rx="3" fill="#2d3436" transform="rotate(-15 415 389)" />
  </g>

  <!-- ================= PELICAN BODY (Behind bike frame/front arm) ================= -->

  <!-- Tail Feathers -->
  <g id="pelican-tail">
    <path d="M 270,335 C 230,335 200,345 190,360 C 205,370 230,375 270,365 Z" fill="#95a5a6" />
    <path d="M 280,340 C 240,350 215,365 210,380 C 230,385 255,380 290,365 Z" fill="#7f8c8d" />
  </g>

  <!-- Pelican Left Leg (Reaching down to far pedal) -->
  <g id="pelican-left-leg">
    <path d="M 370,370 L 415,385" stroke="#f39c12" stroke-width="9" stroke-linecap="round" />
    <!-- Webbed foot gripping pedal -->
    <path d="M 405,380 L 430,375 L 435,395 L 415,398 Z" fill="#e67e22" />
  </g>

  <!-- Pelican Torso -->
  <path id="pelican-body" d="M 300,340 C 280,280 340,240 400,240 C 450,240 470,270 480,320 C 490,370 440,410 380,410 C 330,410 310,380 300,340 Z" fill="url(#bodyGrad)" filter="url(#shadow)" />

  <!-- Rump & Feather Fluff Texture -->
  <path d="M 295,350 C 310,365 325,370 340,365" stroke="#bdc3c7" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 315,375 C 335,388 355,388 375,380" stroke="#bdc3c7" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Pelican Neck & Head -->
  <g id="pelican-neck-head">
    <!-- Graceful curved neck -->
    <path d="M 425,260 C 445,210 470,165 520,150 C 560,138 590,165 570,210 C 555,245 490,275 460,285 Z" fill="url(#bodyGrad)" />
    
    <!-- Head Crest / Tuft Feathers at back of head -->
    <path d="M 525,145 C 500,135 480,140 460,130 C 485,150 505,153 525,153 Z" fill="#e4ecf0" />
    <path d="M 530,140 C 505,120 485,125 470,115 C 495,135 515,140 535,145 Z" fill="#d0dbe5" />

    <!-- Head Dome -->
    <path d="M 515,150 C 530,120 575,120 600,145 C 615,160 610,185 585,195 C 560,205 525,190 515,150 Z" fill="url(#bodyGrad)" />

    <!-- Flirty/Determined Eye -->
    <ellipse cx="570" cy="155" rx="10" ry="12" fill="#ffffff" />
    <ellipse cx="573" cy="155" rx="6" ry="7" fill="#2c3e50" />
    <!-- Eye Highlights -->
    <circle cx="571" cy="152" r="2.5" fill="#ffffff" />
    <circle cx="575" cy="158" r="1" fill="#ffffff" />
    <!-- Eyebrow (giving a confident, joyful look) -->
    <path d="M 558,144 Q 572,138 584,146" fill="none" stroke="#e67e22" stroke-width="3" stroke-linecap="round" />

    <!-- Huge Pelican Pouch and Beak -->
    <!-- Large Gular Pouch (sagging happily with air/breeze) -->
    <path d="M 590,195 C 610,230 650,290 700,280 C 740,272 755,230 760,195 C 700,205 640,200 590,195 Z" fill="url(#pouchGrad)" opacity="0.95" />
    <!-- Subtle pouch stretch veins/striations -->
    <g fill="none" stroke="#d63031" stroke-width="1.2" opacity="0.3">
      <path d="M 640,205 Q 670,255 705,275" />
      <path d="M 665,203 Q 695,245 730,255" />
      <path d="M 615,205 Q 640,250 670,275" />
    </g>

    <!-- Upper Beak (Hooked tip) -->
    <path d="M 580,170 L 785,185 C 800,186 810,192 805,200 C 795,210 780,200 760,195 L 585,192 Z" fill="url(#beakTopGrad)" stroke="#d35400" stroke-width="1.5" />
    <!-- Downward hook at tip of top beak -->
    <path d="M 795,186 Q 810,190 806,205 Q 798,207 792,197 Z" fill="#c0392b" />
    <!-- Nostril -->
    <line x1="605" y1="176" x2="635" y2="178" stroke="#d35400" stroke-width="2" stroke-linecap="round" />

    <!-- Stylish Cyclist Cap on Pelican! -->
    <g id="cycling-cap">
      <!-- Cap Dome -->
      <path d="M 528,142 C 530,110 575,108 598,135 C 570,135 545,138 528,142 Z" fill="#e74c3c" />
      <path d="M 555,110 C 565,110 572,125 572,136 L 558,136 Z" fill="#ffffff" />
      <!-- Cap Visor/Brim (Flipped up retro style) -->
      <path d="M 593,133 Q 625,123 620,138 Q 595,142 588,137 Z" fill="#c0392b" stroke="#962d22" stroke-width="1" />
      <!-- Tiny ribbon bow fluttering behind -->
      <path d="M 528,138 Q 510,135 498,142 Q 512,145 526,143" fill="#e74c3c" />
      <path d="M 527,141 Q 505,146 496,156 Q 514,152 525,145" fill="#c0392b" />
    </g>
  </g>

  <!-- ================= BICYCLE (Main Frame & Components) ================= -->

  <!-- Saddle / Seat -->
  <g id="bike-seat">
    <path d="M 330,340 L 370,410" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round" />
    <!-- Vintage leather spring saddle -->
    <path d="M 305,335 C 315,330 365,330 380,340 C 370,350 355,348 335,346 C 320,346 310,344 305,335 Z" fill="#5d4037" />
    <circle cx="320" cy="344" r="3.5" fill="#d7ccc8" />
  </g>

  <!-- Bike Frame Diamond -->
  <g id="bike-frame" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear stays (hub to seat, hub to bottom bracket) -->
    <line x1="255" y1="440" x2="350" y2="350" stroke="#10ac84" stroke-width="9" />
    <line x1="255" y1="440" x2="455" y2="440" stroke="#10ac84" stroke-width="9" />

    <!-- Seat tube -->
    <line x1="350" y1="350" x2="455" y2="440" stroke="url(#frameGrad)" stroke-width="11" />

    <!-- Down tube -->
    <line x1="455" y1="440" x2="590" y2="280" stroke="url(#frameGrad)" stroke-width="11" />

    <!-- Top tube (slightly sloping retro cruiser style) -->
    <line x1="345" y1="358" x2="585" y2="295" stroke="url(#frameGrad)" stroke-width="10" />

    <!-- Head tube -->
    <line x1="590" y1="275" x2="602" y2="330" stroke="url(#frameGrad)" stroke-width="12" />

    <!-- Front Fork -->
    <line x1="602" y1="330" x2="655" y2="440" stroke="#10ac84" stroke-width="9" />
  </g>

  <!-- Chainset, Bottom Bracket & Chain -->
  <g id="bike-drive">
    <!-- Chain loop -->
    <path d="M 255,440 L 455,425 A 25,25 0 0,1 455,455 L 255,448 Z" fill="none" stroke="#57606f" stroke-width="4" />
    <!-- Front chainring sprocket -->
    <circle cx="455" cy="440" r="23" fill="none" stroke="url(#metalGrad)" stroke-width="6" stroke-dasharray="6,3" />
    <circle cx="455" cy="440" r="14" fill="#747d8c" />
    <circle cx="455" cy="440" r="6" fill="#2f3542" />
  </g>

  <!-- Handlebars & Stem -->
  <g id="handlebars">
    <!-- Stem extending upwards from head tube -->
    <path d="M 590,285 L 585,230" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round" />
    <!-- Swept-back cruiser handlebars -->
    <path d="M 585,230 C 565,225 540,230 520,250" fill="none" stroke="url(#metalGrad)" stroke-width="9" stroke-linecap="round" />
    <!-- Right side handlebar bar curve -->
    <path d="M 585,230 C 600,225 615,235 625,255" fill="none" stroke="url(#metalGrad)" stroke-width="9" stroke-linecap="round" />
    <!-- Rubber Grips -->
    <path d="M 525,245 L 512,258" stroke="#2d3436" stroke-width="11" stroke-linecap="round" />
    <!-- Vintage Brass Bell -->
    <circle cx="598" cy="225" r="8" fill="#f1c40f" />
    <circle cx="600" cy="223" r="3" fill="#f39c12" />
    <rect x="604" y="228" width="5" height="3" fill="#e67e22" rx="1" />
  </g>

  <!-- Front Wicker Basket with a Treat! -->
  <g id="basket" transform="translate(615, 250)">
    <!-- Basket Body -->
    <path d="M 0,15 L 12,70 L 68,70 L 78,15 Z" fill="#d2a679" stroke="#8a5d3b" stroke-width="2" />
    <!-- Wicker Weave Texture -->
    <path d="M 4,28 L 74,28 M 7,42 L 71,42 M 10,56 L 69,56" stroke="#b08359" stroke-width="2" />
    <path d="M 18,17 L 23,68 M 38,16 L 40,68 M 58,17 L 55,68" stroke="#b08359" stroke-width="2" />
    <!-- Basket Rim -->
    <rect x="-3" y="11" width="84" height="7" rx="3" fill="#8a5d3b" />
    <!-- Support Brackets -->
    <line x1="12" y1="65" x2="-15" y2="78" stroke="#7f8c8d" stroke-width="3" />
    <line x1="5" y1="20" x2="-25" y2="20" stroke="#7f8c8d" stroke-width="3" />

    <!-- A fresh snack fish popping out of the basket! -->
    <g id="fish-in-basket" transform="translate(35, 10) rotate(-25)">
      <!-- Fish Body -->
      <path d="M -5,0 C 15,-15 35,-5 45,5 C 35,15 15,20 -5,0 Z" fill="#70a1ff" />
      <path d="M 35,5 C 45,-8 55,-10 50,5 C 55,20 45,18 35,5 Z" fill="#1e90ff" />
      <!-- Fish Belly -->
      <path d="M 0,2 C 15,8 30,8 40,5 C 30,15 15,18 0,2 Z" fill="#eccc68" />
      <!-- Eye -->
      <circle cx="10" cy="-2" r="3" fill="#ffffff" />
      <circle cx="10" cy="-2" r="1.5" fill="#2f3542" />
      <!-- Tiny bubbles -->
      <circle cx="5" cy="-15" r="2.5" fill="#ffffff" opacity="0.6" />
      <circle cx="12" cy="-24" r="1.5" fill="#ffffff" opacity="0.6" />
    </g>
  </g>

  <!-- Near Pedal & Crank (Forward) -->
  <g id="near-pedal">
    <!-- Crank Arm -->
    <line x1="455" y1="440" x2="485" y2="495" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Pedal Axle & Platform -->
    <circle cx="485" cy="495" r="5" fill="#2d3436" />
    <rect x="468" y="492" width="34" height="10" rx="3" fill="#2f3542" transform="rotate(10 485 497)" />
    <!-- Pedal Reflector (Safety first!) -->
    <rect x="475" y="496" width="20" height="3" rx="1.5" fill="#ffa502" transform="rotate(10 485 497)" />
  </g>

  <!-- Pelican Right Leg & Webbed Foot (Powering the near pedal) -->
  <g id="pelican-right-leg">
    <!-- Thigh / Joint -->
    <path d="M 390,385 C 420,390 440,410 445,435" fill="none" stroke="url(#bodyGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Lower Leg (Orange tarsus) -->
    <line x1="445" y1="430" x2="480" y2="488" stroke="#f39c12" stroke-width="9" stroke-linecap="round" />
    <!-- Ankle joint -->
    <circle cx="480" cy="488" r="5" fill="#e67e22" />
    <!-- Big Orange Webbed Foot wrapping over pedal -->
    <path d="M 465,488 C 475,485 498,485 510,490 C 515,496 505,504 490,504 C 475,504 465,498 465,488 Z" fill="#e67e22" />
    <path d="M 470,490 L 512,492 M 473,495 L 507,500" stroke="#d35400" stroke-width="1.5" />
  </g>

  <!-- ================= PELICAN WING (Foreground: steering the bike) ================= -->
  <g id="pelican-wing" filter="url(#shadow)">
    <!-- Main Wing Fold / Upper Arm -->
    <path d="M 370,270 C 330,285 320,335 340,365 C 375,370 415,340 450,320 C 470,310 495,285 530,265 Z" fill="url(#wingGrad)" />

    <!-- Wing Tip Feathers (Primary feathers wrapping forward onto handlebar grip) -->
    <!-- Feather layers -->
    <path d="M 360,345 C 390,360 440,335 480,310 C 515,290 535,270 540,255 C 530,250 510,265 470,290 C 430,315 385,340 360,345 Z" fill="#95a5a6" />
    
    <path d="M 380,335 C 410,345 460,315 500,285 C 530,265 548,245 540,242 C 525,242 500,260 460,285 C 420,310 395,330 380,335 Z" fill="url(#flightFeathers)" />

    <!-- "Hand" Feathers / Feather Tips Dexterously Gripping Left Handlebar -->
    <g fill="#34495e">
      <!-- Feather fingers clutching grip -->
      <path d="M 525,248 C 532,240 542,242 540,252 C 538,258 530,260 523,256 Z" />
      <path d="M 520,253 C 528,247 538,250 535,260 C 532,266 524,267 517,262 Z" />
      <path d="M 515,260 C 522,255 532,258 528,268 C 525,273 518,274 512,269 Z" />
    </g>

    <!-- Scarf / Bandana Flying in the Wind (Adds dynamic coastal cyclist flair!) -->
    <g id="scarf">
      <!-- Neck knot -->
      <ellipse cx="495" cy="245" rx="14" ry="9" fill="#00d2d3" transform="rotate(-15 495 245)" />
      <circle cx="493" cy="246" r="4.5" fill="#01a3a4" />
      <!-- Flowing scarf tails fluttering backwards -->
      <path d="M 485,248 C 450,250 420,230 380,232 C 415,242 440,265 480,255 Z" fill="#00d2d3" />
      <path d="M 488,252 C 455,262 430,252 395,260 C 430,270 460,275 485,258 Z" fill="#54a0ff" />
      <!-- Polka dots on scarf -->
      <circle cx="460" cy="246" r="2.5" fill="#ffffff" />
      <circle cx="425" cy="238" r="2" fill="#ffffff" />
      <circle cx="450" cy="262" r="2" fill="#ffffff" />
      <circle cx="420" cy="260" r="2" fill="#ffffff" />
    </g>
  </g>

  <!-- Speed Motion Effects / Wind Swirls around Pelican -->
  <g fill="none" stroke="#2e86de" stroke-width="2" stroke-linecap="round" opacity="0.3">
    <!-- Wheel motion arcs -->
    <path d="M 195,390 A 65,65 0 0,1 235,375" />
    <path d="M 285,505 A 65,65 0 0,1 245,505" />
    <path d="M 595,390 A 65,65 0 0,1 635,375" />
    <path d="M 685,505 A 65,65 0 0,1 645,505" />
    <!-- Air swirl behind tail -->
    <path d="M 180,335 C 160,330 150,345 165,355 C 180,360 195,350 175,342" stroke="#54a0ff" stroke-width="2.5" />
  </g>
</svg>