<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf2f6"/>
      <stop offset="65%" stop-color="#eafafb"/>
      <stop offset="100%" stop-color="#fff7eb"/>
    </linearGradient>
    
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffec99"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>

    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3cfbb"/>
      <stop offset="25%" stop-color="#6ea88c"/>
      <stop offset="100%" stop-color="#4d7c66"/>
    </linearGradient>

    <!-- Shading Gradients -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa94d"/>
      <stop offset="70%" stop-color="#ff922b"/>
      <stop offset="100%" stop-color="#f76707"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="50%" stop-color="#ffa94d"/>
      <stop offset="100%" stop-color="#fd7e14"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#e9ecef"/>
      <stop offset="100%" stop-color="#ced4da"/>
    </linearGradient>

    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="60%" stop-color="#dee2e6"/>
      <stop offset="100%" stop-color="#adb5bd"/>
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9ecef"/>
      <stop offset="50%" stop-color="#adb5bd"/>
      <stop offset="100%" stop-color="#495057"/>
    </linearGradient>

    <linearGradient id="bikeFrameGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#fa5252"/>
      <stop offset="100%" stop-color="#c92a2a"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky & Environment -->
  <rect width="800" height="600" fill="url(#skyGrad)" />
  <circle cx="680" cy="130" r="70" fill="url(#sunGrad)" opacity="0.8" filter="url(#softGlow)"/>

  <!-- Distant Hills -->
  <path d="M-50,480 Q120,400 320,440 T720,420 Q780,430 850,450 L850,600 L-50,600 Z" fill="#b2d8c3" opacity="0.6"/>
  <path d="M-50,470 Q200,430 450,470 T850,450 L850,600 L-50,600 Z" fill="#88c4a6" opacity="0.7"/>

  <!-- Road & Path -->
  <rect x="-10" y="470" width="820" height="140" fill="url(#groundGrad)"/>
  <path d="M-10,470 L810,470" stroke="#ffd166" stroke-width="6" stroke-dasharray="25,20" opacity="0.6"/>
  <path d="M-10,490 Q400,480 810,490 L810,540 Q400,530 -10,540 Z" fill="#406954" opacity="0.4"/>

  <!-- Ground Shadows -->
  <ellipse cx="250" cy="512" rx="65" ry="14" fill="#2b4739" opacity="0.45" />
  <ellipse cx="530" cy="512" rx="65" ry="14" fill="#2b4739" opacity="0.45" />
  <ellipse cx="390" cy="520" rx="90" ry="18" fill="#2b4739" opacity="0.35" />

  <!-- ==================== BICYCLE (Back parts) ==================== -->
  
  <!-- Back Wheel -->
  <g id="back-wheel">
    <circle cx="250" cy="450" r="62" stroke="#212529" stroke-width="12" fill="none" />
    <circle cx="250" cy="450" r="56" stroke="#adb5bd" stroke-width="4" fill="none" />
    <!-- Spokes -->
    <path d="M250,394 L250,506 M194,450 L306,450 M211,411 L289,489 M211,489 L289,411" stroke="#ced4da" stroke-width="1.8"/>
    <path d="M228,398 L272,502 M198,428 L302,472 M202,472 L298,428 M228,502 L272,398" stroke="#ced4da" stroke-width="1.5" opacity="0.8"/>
    <circle cx="250" cy="450" r="10" fill="url(#metalGrad)" />
  </g>

  <!-- Front Wheel -->
  <g id="front-wheel">
    <circle cx="530" cy="450" r="62" stroke="#212529" stroke-width="12" fill="none" />
    <circle cx="530" cy="450" r="56" stroke="#adb5bd" stroke-width="4" fill="none" />
    <!-- Spokes -->
    <path d="M530,394 L530,506 M474,450 L586,450 M491,411 L569,489 M491,489 L569,411" stroke="#ced4da" stroke-width="1.8"/>
    <path d="M508,398 L552,502 M478,428 L582,472 M482,472 L578,428 M508,502 L552,398" stroke="#ced4da" stroke-width="1.5" opacity="0.8"/>
    <circle cx="530" cy="450" r="10" fill="url(#metalGrad)" />
  </g>

  <!-- Left Pedal & Crank (Up/Backwards position) -->
  <g id="left-pedal">
    <line x1="375" y1="450" x2="340" y2="405" stroke="#adb5bd" stroke-width="7" stroke-linecap="round"/>
    <polygon points="325,405 355,405 352,398 322,398" fill="#343a40"/>
  </g>

  <!-- Far Leg (Left Leg & Webbed Foot) -->
  <g id="left-leg">
    <path d="M365,340 Q335,370 338,402" fill="none" stroke="#f76707" stroke-width="10" stroke-linecap="round"/>
    <!-- Webbed foot gripping pedal -->
    <path d="M322,402 Q340,396 355,400 C352,408 340,412 322,406 Z" fill="#fd7e14"/>
  </g>

  <!-- Bicycle Frame -->
  <g id="bike-frame" filter="url(#dropShadow)">
    <!-- Rear Dropouts to Seat & Chainstays -->
    <line x1="250" y1="450" x2="350" y2="330" stroke="url(#bikeFrameGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="250" y1="450" x2="375" y2="450" stroke="url(#bikeFrameGrad)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Main Triangle -->
    <line x1="375" y1="450" x2="350" y2="330" stroke="url(#bikeFrameGrad)" stroke-width="10" stroke-linecap="round"/> <!-- Seat Tube -->
    <line x1="375" y1="450" x2="480" y2="350" stroke="url(#bikeFrameGrad)" stroke-width="9" stroke-linecap="round"/> <!-- Down Tube -->
    <line x1="350" y1="330" x2="470" y2="320" stroke="url(#bikeFrameGrad)" stroke-width="9" stroke-linecap="round"/> <!-- Top Tube -->

    <!-- Fork & Head Tube -->
    <line x1="470" y1="320" x2="485" y2="365" stroke="url(#bikeFrameGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="480" y1="340" x2="530" y2="450" stroke="url(#bikeFrameGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Handlebar Stem & Handlebars -->
    <line x1="470" y1="320" x2="462" y2="280" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M462,280 C475,275 490,265 480,245 C475,238 460,245 450,250" fill="none" stroke="#343a40" stroke-width="7" stroke-linecap="round"/>

    <!-- Bicycle Bell -->
    <circle cx="482" cy="245" r="7" fill="#ffd43b"/>
    <ellipse cx="481" cy="243" rx="4" ry="2" fill="#fff" opacity="0.6"/>

    <!-- Saddle post & Seat -->
    <line x1="350" y1="330" x2="353" y2="295" stroke="url(#metalGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M315,295 C335,290 380,290 385,302 C385,310 370,312 355,308 C340,305 320,310 315,295 Z" fill="#212529"/>

    <!-- Chainring & Chain -->
    <circle cx="375" cy="450" r="22" fill="none" stroke="#adb5bd" stroke-width="5"/>
    <path d="M250,442 L375,432 M250,458 L375,468" stroke="#495057" stroke-width="3" stroke-dasharray="5,3"/>
  </g>

  <!-- ==================== PELICAN ==================== -->

  <!-- Tail Feathers -->
  <path d="M305,270 C280,270 260,255 250,265 C245,270 255,285 270,288 C260,292 265,302 285,298 C295,305 315,305 325,290 Z" fill="#ced4da" filter="url(#dropShadow)"/>

  <!-- Pelican Body -->
  <path d="M320,290 C310,230 360,195 400,205 C420,210 435,235 435,275 C435,335 390,345 350,340 C325,335 322,310 320,290 Z" fill="url(#bodyGrad)" filter="url(#dropShadow)"/>

  <!-- Pelican Neck & Head -->
  <path d="M395,215 Q430,200 425,140 Q425,100 455,95 Q485,95 480,135 Q475,185 425,235 Z" fill="url(#bodyGrad)"/>

  <!-- Head Crest Feather Details -->
  <path d="M450,95 Q435,80 425,85 Q435,95 445,102 Q425,92 418,102 Q432,108 446,112" fill="none" stroke="#ced4da" stroke-width="4" stroke-linecap="round"/>

  <!-- Pouch / Large Beak Underbag -->
  <path d="M480,120 Q565,130 600,165 C580,230 490,260 450,170 Z" fill="url(#pouchGrad)" filter="url(#dropShadow)"/>
  
  <!-- Subtle Pouch Texture Ribs -->
  <path d="M485,145 Q530,175 540,210" stroke="#f76707" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M495,135 Q550,165 570,185" stroke="#f76707" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Upper Beak (Hooked tip) -->
  <path d="M465,105 Q550,120 605,140 Q620,143 615,152 Q590,155 470,130 Z" fill="url(#beakGrad)"/>
  <!-- Hook Tip -->
  <path d="M605,140 Q618,145 615,156 Q610,162 602,154 Z" fill="#d9480f"/>
  <!-- Beak Center Ridge -->
  <path d="M467,107 Q550,123 605,141" stroke="#ffe8cc" stroke-width="2" fill="none"/>

  <!-- Cheek & Eye -->
  <circle cx="462" cy="115" r="7" fill="#f8f9fa"/>
  <circle cx="463" cy="115" r="4.5" fill="#212529"/>
  <circle cx="465" cy="113" r="1.5" fill="#ffffff"/> <!-- Sparkle -->

  <!-- Pelican Sailor/Captain Hat (Extra character & whimsy) -->
  <g id="sailor-cap">
    <ellipse cx="458" cy="92" rx="20" ry="7" fill="#1864ab" transform="rotate(-12 458 92)"/>
    <path d="M440,90 Q455,60 472,83 Q455,86 440,90 Z" fill="#f8f9fa" transform="rotate(-12 458 92)"/>
    <path d="M455,93 L478,88" stroke="#f59f00" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Small Anchor emblem on cap -->
    <circle cx="456" cy="83" r="2" fill="#ffd43b"/>
  </g>

  <!-- Flapping/Pedaling Front Leg (Right Leg) -->
  <g id="right-leg">
    <!-- Hip to Knee, Knee to Ankle -->
    <path d="M375,325 Q420,380 405,445" fill="none" stroke="#fd7e14" stroke-width="11" stroke-linecap="round"/>
    
    <!-- Right Pedal & Crank (Forward/Downwards) -->
    <line x1="375" y1="450" x2="405" y2="485" stroke="#ced4da" stroke-width="7" stroke-linecap="round"/>
    <polygon points="392,488 422,488 418,482 388,482" fill="#212529"/>
    
    <!-- Big Orange Webbed Foot pushing pedal -->
    <path d="M390,465 Q405,460 422,482 C415,492 395,496 385,485 C380,480 380,470 390,465 Z" fill="#f76707"/>
    <!-- Claws/Toes detail -->
    <path d="M422,482 L428,487 M416,488 L420,494 M402,492 L402,498" stroke="#d9480f" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Big Wing steering handlebars -->
  <!-- Wing base and layered feathers -->
  <g id="wing" filter="url(#dropShadow)">
    <path d="M345,245 C355,200 425,250 458,260 C445,295 410,335 345,305 C335,290 340,265 345,245 Z" fill="url(#wingGrad)"/>
    
    <!-- Primary Feathers reaching out to grip handlebars -->
    <path d="M420,260 Q455,255 470,256 C468,265 450,274 425,274 Z" fill="#ced4da"/>
    <path d="M405,280 Q450,270 472,268 C465,280 435,290 400,292 Z" fill="#adb5bd"/>
    <path d="M380,298 Q425,295 448,292 C435,305 405,310 370,305 Z" fill="#868e96"/>
    
    <!-- Hand/Wing Tip wrapping handlebar -->
    <path d="M463,250 Q478,248 474,260 Q460,265 456,254 Z" fill="#e9ecef"/>
  </g>

  <!-- Cute details: Little fish peeking out of the pouch! -->
  <g id="surprised-fish">
    <path d="M540,145 C548,135 565,138 565,148 C560,158 545,155 540,145 Z" fill="#4dabf7"/>
    <!-- Fish tail -->
    <polygon points="563,147 574,140 572,154" fill="#339af0"/>
    <!-- Fish Eye -->
    <circle cx="546" cy="143" r="2.5" fill="#fff"/>
    <circle cx="546" cy="143" r="1.2" fill="#000"/>
    <circle cx="547" cy="142" r="0.4" fill="#fff"/>
    <!-- Fish mouth (surprised 'o') -->
    <circle cx="541" cy="147" r="1" fill="#1864ab"/>
  </g>

  <!-- Speed lines & motion dust behind bicycle -->
  <g id="motion" stroke="#adb5bd" stroke-linecap="round" opacity="0.6">
    <line x1="160" y1="440" x2="110" y2="440" stroke-width="3" stroke-dasharray="10,15"/>
    <line x1="175" y1="460" x2="135" y2="460" stroke-width="2.5"/>
    <line x1="150" y1="480" x2="90" y2="480" stroke-width="3" stroke-dasharray="15,10"/>
    <!-- Puff of dust -->
    <circle cx="175" cy="505" r="6" fill="#dee2e6" stroke="none" opacity="0.5"/>
    <circle cx="162" cy="508" r="9" fill="#dee2e6" stroke="none" opacity="0.4"/>
    <circle cx="145" cy="510" r="12" fill="#dee2e6" stroke="none" opacity="0.3"/>
  </g>
</svg>