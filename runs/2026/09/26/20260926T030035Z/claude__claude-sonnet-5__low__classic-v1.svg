<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#bfe9ff"/>
  <rect y="250" width="400" height="50" fill="#8fce8f"/>

  <!-- bicycle wheels -->
  <circle cx="130" cy="230" r="40" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="280" cy="230" r="40" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="130" cy="230" r="4" fill="#333"/>
  <circle cx="280" cy="230" r="4" fill="#333"/>

  <!-- spokes -->
  <line x1="130" y1="230" x2="130" y2="190" stroke="#333" stroke-width="1"/>
  <line x1="130" y1="230" x2="130" y2="270" stroke="#333" stroke-width="1"/>
  <line x1="130" y1="230" x2="95" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="130" y1="230" x2="165" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="230" x2="280" y2="190" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="230" x2="280" y2="270" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="230" x2="245" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="230" x2="315" y2="230" stroke="#333" stroke-width="1"/>

  <!-- bike frame -->
  <line x1="130" y1="230" x2="200" y2="180" stroke="#444" stroke-width="5"/>
  <line x1="200" y1="180" x2="280" y2="230" stroke="#444" stroke-width="5"/>
  <line x1="200" y1="180" x2="220" y2="230" stroke="#444" stroke-width="5"/>
  <line x1="220" y1="230" x2="280" y2="230" stroke="#444" stroke-width="5"/>
  <line x1="130" y1="230" x2="220" y2="230" stroke="#444" stroke-width="5"/>
  <line x1="200" y1="180" x2="195" y2="150" stroke="#444" stroke-width="5"/>
  <!-- seat post -->
  <line x1="220" y1="230" x2="205" y2="165" stroke="#444" stroke-width="5"/>
  <ellipse cx="205" cy="163" rx="14" ry="5" fill="#333"/>
  <!-- handlebar -->
  <line x1="195" y1="150" x2="175" y2="148" stroke="#444" stroke-width="5"/>
  <line x1="195" y1="150" x2="195" y2="135" stroke="#444" stroke-width="5"/>
  <!-- pedal crank -->
  <circle cx="220" cy="230" r="8" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="220" y1="230" x2="238" y2="245" stroke="#333" stroke-width="4"/>
  <line x1="220" y1="230" x2="202" y2="215" stroke="#333" stroke-width="4"/>

  <!-- pelican body -->
  <ellipse cx="205" cy="120" rx="35" ry="28" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <!-- pelican leg to pedal -->
  <line x1="210" y1="145" x2="220" y2="218" stroke="#e8a33d" stroke-width="5"/>
  <line x1="195" y1="145" x2="202" y2="207" stroke="#e8a33d" stroke-width="5"/>

  <!-- pelican neck -->
  <path d="M 175 105 Q 150 70 165 45" fill="none" stroke="#f2f2f2" stroke-width="18" stroke-linecap="round"/>
  <!-- pelican head -->
  <circle cx="163" cy="40" r="15" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <!-- beak -->
  <path d="M 148 40 Q 100 32 95 45 Q 100 52 148 48 Z" fill="#e8a33d" stroke="#c97f1f" stroke-width="1"/>
  <path d="M 100 45 Q 120 55 148 48" fill="none" stroke="#c97f1f" stroke-width="1"/>
  <!-- eye -->
  <circle cx="167" cy="37" r="2.5" fill="#333"/>

  <!-- wing -->
  <path d="M 200 100 Q 235 105 245 140 Q 215 135 195 118 Z" fill="#dcdcdc" stroke="#999" stroke-width="1"/>

  <!-- tail -->
  <path d="M 238 128 Q 260 130 262 142 Q 245 145 232 138 Z" fill="#dcdcdc" stroke="#999" stroke-width="1"/>

  <!-- back leg -->
  <line x1="195" y1="145" x2="185" y2="218" stroke="#e8a33d" stroke-width="5" opacity="0.85"/>
</svg>