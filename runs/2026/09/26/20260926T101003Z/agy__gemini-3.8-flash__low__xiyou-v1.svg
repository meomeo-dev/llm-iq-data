<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- 背景渐变：左侧火海炼狱，右侧墨云暴雨 -->
    <linearGradient id="bgSky" x1="0%" y1="30%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#3d0300" />
      <stop offset="25%" stop-color="#7a1400" />
      <stop offset="48%" stop-color="#b83800" />
      <stop offset="55%" stop-color="#1c2c3d" />
      <stop offset="75%" stop-color="#0f1923" />
      <stop offset="100%" stop-color="#050a10" />
    </linearGradient>

    <!-- 火山岩石质感渐变 -->
    <linearGradient id="fireMountainGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="30%" stop-color="#8a1c03" />
      <stop offset="70%" stop-color="#3e0c03" />
      <stop offset="100%" stop-color="#1f0502" />
    </linearGradient>

    <linearGradient id="quenchedMountainGrad" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#455a64" />
      <stop offset="40%" stop-color="#263238" />
      <stop offset="80%" stop-color="#151d22" />
      <stop offset="100%" stop-color="#0c1114" />
    </linearGradient>

    <!-- 烈焰渐变 -->
    <linearGradient id="flameGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff1a00" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ff7700" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#ffdd00" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="flameGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d50000" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff9100" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffee55" stop-opacity="0" />
    </linearGradient>

    <!-- 芭蕉扇叶面翠光与神力渐变 -->
    <linearGradient id="fanLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7ffeb" />
      <stop offset="25%" stop-color="#1de9b6" />
      <stop offset="60%" stop-color="#00bfa5" />
      <stop offset="90%" stop-color="#004d40" />
      <stop offset="100%" stop-color="#00251a" />
    </linearGradient>

    <!-- 金箍棒与金属光泽 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="50%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#d84315" />
    </linearGradient>

    <!-- 狂风气浪冲击光效 -->
    <linearGradient id="galeBlast" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e0f7fa" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#80deea" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00b0ff" stop-opacity="0" />
    </linearGradient>

    <!-- 暴雨雨线样式 -->
    <pattern id="rainPattern" width="40" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <line x1="10" y1="0" x2="10" y2="45" stroke="#80d8ff" stroke-width="1.8" stroke-opacity="0.65" stroke-linecap="round" />
      <line x1="30" y1="30" x2="30" y2="75" stroke="#b388ff" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round" />
      <line x1="20" y1="15" x2="20" y2="55" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" />
    </pattern>

    <!-- 烟气水汽滤镜 -->
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="heatHaze" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- 虎皮裙纹理 -->
    <pattern id="tigerPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#f57c00" />
      <path d="M0,5 Q10,12 5,20 Q12,18 10,30 L16,30 Q14,20 22,12 Q12,10 12,0 L7,0 Q8,8 0,5 Z" fill="#212121" />
      <path d="M18,0 Q24,10 30,8 L30,3 Q23,5 22,0 Z" fill="#212121" />
    </pattern>
  </defs>

  <!-- 1. 背景天空层：阴阳两割裂 -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#bgSky)" />

  <!-- 2. 火焰山背景山体脉络（寸草不生、犬牙交错） -->
  <!-- 左侧：烈火熔岩焦山 -->
  <g id="fireMountains">
    <!-- 远山烈焰 -->
    <polygon points="-50,650 60,320 180,480 320,240 450,490 560,330 650,650" fill="url(#fireMountainGrad)" opacity="0.9" />
    <path d="M 0,380 Q 90,260 160,360 T 320,210 T 480,350 T 600,280 L 600,650 L 0,650 Z" fill="#4a0f03" opacity="0.6" />
    <!-- 喷薄而出的炽热山体裂缝 -->
    <path d="M110,410 Q140,490 130,580 M310,300 Q280,420 330,550 M440,420 Q480,480 430,600" stroke="#ffab00" stroke-width="4" fill="none" filter="url(#glowEffect)" />
    <!-- 冲天火舌群 -->
    <g filter="url(#heatHaze)">
      <path d="M-20,450 Q30,220 80,380 Q140,150 180,360 Q260,110 310,330 Q370,180 440,360 Q500,130 560,380 L600,650 L-50,650 Z" fill="url(#flameGrad1)" opacity="0.75" />
      <path d="M30,480 Q90,280 140,420 Q200,210 260,400 Q340,170 390,410 Q450,260 520,430 L550,650 L0,650 Z" fill="url(#flameGrad2)" />
    </g>
  </g>

  <!-- 右侧：熄灭冷却的黑石山岭与暴雨洗刷 -->
  <g id="quenchedMountains">
    <!-- 熄灭的山峦，寸草不生的冷硬黑褐色岩壁 -->
    <polygon points="580,650 670,300 780,450 890,220 1020,430 1140,260 1250,650" fill="url(#quenchedMountainGrad)" />
    <polygon points="620,650 720,380 840,510 960,310 1100,520 1220,390 1250,650" fill="#1b242a" opacity="0.8" />
    <!-- 冷却岩石上的雨水反光白线 -->
    <path d="M670,320 L690,460 L660,600 M890,240 L870,410 L910,590 M1140,280 L1120,440 L1160,610" stroke="#90caf9" stroke-width="2.5" stroke-dasharray="8,4" fill="none" opacity="0.6" />
  </g>

  <!-- 3. 右半部及中央上空：翻滚的狂暴乌云 -->
  <g id="thunderClouds">
    <!-- 浓重水汽与翻滚墨云 -->
    <path d="M480,60 Q530,-10 610,30 Q680,-30 780,10 Q860,-20 940,30 Q1040,-10 1120,50 Q1220,30 1240,130 Q1260,230 1170,270 Q1080,310 980,260 Q910,300 830,260 Q760,320 670,270 Q580,290 530,230 Q470,230 460,160 Q440,90 480,60 Z" fill="#101721" />
    <path d="M530,80 Q620,20 720,70 Q800,10 890,60 Q980,30 1060,90 Q1150,80 1180,170 Q1120,230 1000,200 Q920,240 820,200 Q740,250 640,200 Q560,220 520,160 Z" fill="#1e293b" opacity="0.85" />
    <path d="M580,110 Q660,50 750,100 Q840,60 930,110 Q1020,90 1090,150 Q990,190 900,160 Q810,200 720,160 Q640,190 580,140 Z" fill="#334155" opacity="0.5" />
    
    <!-- 云层中窜动的雷电紫光 -->
    <path d="M720,90 L750,150 L730,170 L780,240" stroke="#e040fb" stroke-width="3" fill="none" filter="url(#glowEffect)" opacity="0.7" />
    <path d="M960,70 L930,140 L955,160 L910,230" stroke="#80d8ff" stroke-width="2.5" fill="none" filter="url(#glowEffect)" opacity="0.8" />
  </g>

  <!-- 4. 倾盆大雨层（笼罩右侧半幅画面，向左倾泻浇灌） -->
  <rect x="520" y="80" width="680" height="720" fill="url(#rainPattern)" />
  <!-- 水汽蒸腾雾气（水火交界处的大量白色腾腾蒸汽） -->
  <g id="steamMist" filter="url(#glowEffect)">
    <ellipse cx="530" cy="450" rx="90" ry="240" fill="#ffffff" opacity="0.28" transform="rotate(-15, 530, 450)" />
    <ellipse cx="560" cy="380" rx="140" ry="180" fill="#cfd8dc" opacity="0.35" />
    <path d="M490,680 Q440,550 510,420 Q560,320 520,200 Q580,280 620,400 Q650,560 550,680 Z" fill="#eceff1" opacity="0.45" />
  </g>

  <!-- 5. 巨大芭蕉扇与扇动出的神风飓风（中心视觉焦点） -->
  <g id="divineGale">
    <!-- 扇风产生的多重弧形激波气浪 -->
    <path d="M480,250 C300,280 180,380 50,550" stroke="url(#galeBlast)" stroke-width="48" stroke-linecap="round" fill="none" opacity="0.6" filter="url(#glowEffect)" />
    <path d="M520,180 C320,230 150,370 0,620" stroke="#b2ebf2" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M540,290 C390,340 250,460 120,680" stroke="#e0f7fa" stroke-width="14" stroke-dasharray="25,15" stroke-linecap="round" fill="none" opacity="0.85" />
    <!-- 被飓风席卷刮倒压制的烈火残片与火星 -->
    <circle cx="210" cy="420" r="7" fill="#ffff00" filter="url(#glowEffect)" />
    <circle cx="160" cy="470" r="5" fill="#ff5722" filter="url(#glowEffect)" />
    <circle cx="290" cy="360" r="8" fill="#fff" filter="url(#glowEffect)" />
    <circle cx="110" cy="540" r="4" fill="#ffab00" />
    <circle cx="80" cy="480" r="6" fill="#ff3d00" />
  </g>

  <!-- 6. 齐天大圣孙悟空 与 比人还高的巨大芭蕉宝扇 -->
  <!-- 地面基岩：悟空立足的险峻岩台 -->
  <polygon points="340,780 430,610 620,600 700,780" fill="#1c1917" stroke="#374151" stroke-width="4" />
  <polygon points="410,615 480,680 560,610" fill="#0f0e0e" />

  <g id="sunWukongAndFan">
    <!-- 飘逸的金色祥云与风带，缠绕大圣足底 -->
    <path d="M380,640 Q430,590 510,630 Q580,590 620,640 Q560,650 490,645 Z" fill="#ffb300" opacity="0.7" filter="url(#glowEffect)" />

    <!-- 巨大芭蕉宝扇主体（高度逾越人体，斜跨天地） -->
    <!-- 芭蕉扇长柄（青灵神竹木质地，包镶金箍金鐏） -->
    <line x1="680" y1="200" x2="430" y2="600" stroke="#4e342e" stroke-width="18" stroke-linecap="round" />
    <line x1="680" y1="200" x2="430" y2="600" stroke="#8d6e63" stroke-width="6" stroke-linecap="round" />
    <!-- 扇柄首尾金箍饰件 -->
    <line x1="450" y1="568" x2="435" y2="592" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="square" />
    <line x1="660" y1="232" x2="645" y2="256" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="square" />

    <!-- 巨型芭蕉叶片轮廓（巨大典雅的蕉叶形体，七宝垂珠纹） -->
    <!-- 扇体辉光背底 -->
    <path d="M 640,240 
             C 500,100  500,-40  720,20 
             C 860,60   960,180  880,330 
             C 800,450  690,400  600,280 Z" 
          fill="#64ffda" opacity="0.3" filter="url(#glowEffect)" />

    <!-- 叶面本尊 -->
    <path d="M 630,250 
             C 510,110  520,-20  710,30 
             C 840,70   930,180  855,320 
             C 780,430  680,390  600,280 Z" 
          fill="url(#fanLeafGrad)" stroke="#a7ffeb" stroke-width="5" />

    <!-- 芭蕉叶主叶脉（通体晶莹翡翠金线） -->
    <path d="M625,260 Q710,180 770,100" stroke="#e0f2f1" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- 优雅舒展的各侧分叶脉 -->
    <path d="M650,225 C600,200 560,180 540,140" stroke="#80cbc4" stroke-width="3.5" fill="none" />
    <path d="M680,185 C610,140 570,110 560,60" stroke="#80cbc4" stroke-width="3.5" fill="none" />
    <path d="M720,135 C680,90 660,50 680,10" stroke="#80cbc4" stroke-width="3.5" fill="none" />
    <path d="M740,115 C770,80 810,60 840,40" stroke="#80cbc4" stroke-width="3.5" fill="none" />
    <path d="M710,165 C760,150 820,160 860,130" stroke="#80cbc4" stroke-width="3.5" fill="none" />
    <path d="M670,215 C730,220 800,250 830,240" stroke="#80cbc4" stroke-width="3.5" fill="none" />
    <path d="M635,250 C680,280 740,330 760,360" stroke="#80cbc4" stroke-width="3.5" fill="none" />

    <!-- 叶沿装饰太阴宝珠坠穗 -->
    <circle cx="715" cy="28" r="9" fill="#e0f7fa" stroke="#004d40" stroke-width="2" filter="url(#glowEffect)" />
    <path d="M715,37 L715,65" stroke="#ffeb3b" stroke-width="2" />
    <circle cx="855" cy="320" r="7" fill="#e0f7fa" stroke="#004d40" stroke-width="2" />

    <!-- 孙悟空角色身姿：下盘扎稳，侧身蓄力全力挥扇之雄姿 -->
    
    <!-- 齐天大圣威武红披风（迎着风暴烈火狂烈飞扬） -->
    <path d="M470,440 C420,410 330,420 270,390 C320,460 350,550 370,620 C400,560 440,510 470,470 Z" fill="#b71c1c" opacity="0.95" />
    <path d="M465,445 C410,430 330,445 280,420 C330,480 370,550 380,610 Z" fill="#e53935" />

    <!-- 猴尾巴（灵活卷曲） -->
    <path d="M430,530 C380,530 360,490 340,510 C320,530 350,560 380,550" stroke="#795548" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- 双腿肌肉与战靴（弓步沉稳立地） -->
    <!-- 右腿在后撑地 -->
    <path d="M450,530 L405,625 L380,625 L435,520 Z" fill="#bf360c" />
    <!-- 左腿在前屈膝 -->
    <path d="M475,530 L520,625 L555,625 L495,520 Z" fill="#d84315" />
    <!-- 藕丝步云乌金靴 -->
    <path d="M375,615 L415,615 L410,635 L370,635 Z" fill="#212121" stroke="#fbc02d" stroke-width="1.5" />
    <path d="M520,615 L565,615 L560,635 L515,635 Z" fill="#212121" stroke="#fbc02d" stroke-width="1.5" />

    <!-- 经典虎皮裙（豹斑虎纹，明黄与墨黑条纹） -->
    <path d="M430,490 L515,490 L535,565 L410,565 Z" fill="url(#tigerPattern)" stroke="#e65100" stroke-width="1.5" />
    <!-- 丝绦腰带（红色神绸系扣下垂） -->
    <rect x="435" y="485" width="80" height="12" rx="4" fill="#d50000" />
    <path d="M465,497 L460,560 L475,560 L478,497 Z" fill="#b71c1c" />
    <circle cx="475" cy="491" r="7" fill="url(#goldGrad)" />

    <!-- 躯干：鹅黄武僧锦衣与锁子黄金甲内衬 -->
    <path d="M450,420 L510,415 L495,495 L440,495 Z" fill="#fbc02d" />
    <!-- 护胸金甲与束带 -->
    <path d="M460,425 Q485,445 505,425 L495,475 Q475,485 455,475 Z" fill="#ff6f00" stroke="#ffe082" stroke-width="1" />

    <!-- 头部特征与神采 -->
    <!-- 金色猴毛面颊与颈项 -->
    <path d="M480,380 C470,360 470,335 490,325 C515,315 540,330 535,360 C530,385 505,395 480,380 Z" fill="#8d6e63" />
    <!-- 脸部经典心形红润“美猴王”面纹 -->
    <path d="M495,330 C485,335 485,350 495,360 C505,350 515,350 520,335 C520,325 505,325 495,330 Z" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1.5" />
    <!-- 炯炯火眼金睛（金光爆射） -->
    <circle cx="493" cy="342" r="3.5" fill="#ffff00" stroke="#e65100" stroke-width="1" />
    <circle cx="508" cy="340" r="3.5" fill="#ffff00" stroke="#e65100" stroke-width="1" />
    <path d="M495,342 L420,320" stroke="#fff176" stroke-width="2" opacity="0.6" filter="url(#glowEffect)" />
    <!-- 坚毅面部神情 -->
    <path d="M498,354 Q503,358 508,353" stroke="#b71c1c" stroke-width="2" fill="none" />

    <!-- 头戴标志性金箍（紧箍儿耀眼生辉） -->
    <path d="M480,334 C490,320 520,318 530,330" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#glowEffect)" />
    <!-- 纯金箍正中祥云弧扣 -->
    <path d="M498,327 Q503,320 508,327 Q503,331 498,327 Z" fill="#ffe082" stroke="#f57f17" stroke-width="1" />

    <!-- 紧握巨扇的长臂（充满神力的肌肉线条，双手握杆） -->
    <!-- 后臂与手握柄 -->
    <path d="M455,425 L500,430 L540,405 L525,390 Z" fill="#8d6e63" />
    <circle cx="542" cy="402" r="10" fill="#ffb74d" />
    <!-- 前臂前探抡动（双手合抱，全力挥动） -->
    <path d="M485,435 L560,435 L585,370 L565,360 Z" fill="#8d6e63" stroke="#5d4037" stroke-width="1" />
    <circle cx="583" cy="368" r="11" fill="#ffb74d" />
    <!-- 腕戴黄金护腕 -->
    <rect x="568" y="375" width="16" height="8" rx="2" fill="url(#goldGrad)" transform="rotate(-30, 576, 379)" />
  </g>

  <!-- 7. 前景飞溅水火冲击波与天地分界交融线 -->
  <g id="elementalClash">
    <!-- 左侧红炽火焰余烬随风飘扬 -->
    <circle cx="480" cy="500" r="3" fill="#ffeb3b" />
    <circle cx="360" cy="450" r="4.5" fill="#ff5722" />
    <circle cx="430" cy="380" r="2.5" fill="#ff9800" />
    
    <!-- 右侧奔流直下的倾盆暴雨与地面积水激荡的白浪水花 -->
    <path d="M600,640 Q630,620 670,645 T740,635 T830,645 L900,660 L590,660 Z" fill="#b0bec5" opacity="0.6" />
    <path d="M620,635 C630,605 650,605 660,635" stroke="#e0f7fa" stroke-width="3" fill="none" />
    <path d="M720,630 C730,595 750,595 760,630" stroke="#e0f7fa" stroke-width="3" fill="none" />
    <path d="M840,638 C850,610 870,610 880,638" stroke="#e0f7fa" stroke-width="3" fill="none" />
  </g>

  <!-- 8. 画卷典雅外框与环境渐晕暗角 -->
  <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#261208" stroke-width="16" />
  <rect x="12" y="12" width="1176" height="776" fill="none" stroke="#fbc02d" stroke-width="2" stroke-opacity="0.5" />
</svg>