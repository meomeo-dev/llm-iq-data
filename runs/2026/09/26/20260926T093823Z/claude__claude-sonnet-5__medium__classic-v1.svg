<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#bde6f9"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#7ab84f" stroke-width="4"/>

  <!-- bicycle wheels -->
  <circle cx="130" cy="220" r="40" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="270" cy="220" r="40" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="130" cy="220" r="4" fill="#333"/>
  <circle cx="270" cy="220" r="4" fill="#333"/>

  <!-- spokes -->
  <line x1="130" y1="220" x2="130" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="130" y1="220" x2="130" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="130" y1="220" x2="95" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="130" y1="220" x2="165" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="270" y1="220" x2="270" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="270" y1="220" x2="270" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="270" y1="220" x2="235" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="270" y1="220" x2="305" y2="220" stroke="#333" stroke-width="2"/>

  <!-- frame -->
  <line x1="130" y1="220" x2="200" y2="150" stroke="#444" stroke-width="5"/>
  <line x1="200" y1="150" x2="270" y2="220" stroke="#444" stroke-width="5"/>
  <line x1="130" y1="220" x2="220" y2="220" stroke="#444" stroke-width="5"/>
  <line x1="220" y1="220" x2="270" y2="220" stroke="#444" stroke-width="5"/>
  <line x1="200" y1="150" x2="220" y2="220" stroke="#444" stroke-width="5"/>

  <!-- seat post and seat -->
  <line x1="200" y1="150" x2="190" y2="120" stroke="#444" stroke-width="5"/>
  <ellipse cx="185" cy="115" rx="15" ry="5" fill="#333"/>

  <!-- handlebar post and bars -->
  <line x1="270" y1="220" x2="255" y2="140" stroke="#444" stroke-width="5"/>
  <line x1="235" y1="135" x2="270" y2="135" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- pedal crank -->
  <circle cx="220" cy="220" r="8" fill="#555"/>
  <line x1="220" y1="220" x2="235" y2="235" stroke="#333" stroke-width="3"/>
  <line x1="220" y1="220" x2="205" y2="205" stroke="#333" stroke-width="3"/>

  <!-- pelican body -->
  <ellipse cx="200" cy="100" rx="38" ry="28" fill="#f5f5f5" stroke="#333" stroke-width="2"/>

  <!-- pelican tail -->
  <path d="M 165 105 L 140 95 L 165 120 Z" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/>

  <!-- pelican leg to pedal -->
  <line x1="205" y1="120" x2="210" y2="205" stroke="#e8a33d" stroke-width="4"/>

  <!-- pelican neck -->
  <path d="M 225 85 Q 250 60 245 40" fill="none" stroke="#f5f5f5" stroke-width="14" stroke-linecap="round"/>
  <path d="M 225 85 Q 250 60 245 40" fill="none" stroke="#333" stroke-width="2"/>

  <!-- pelican head -->
  <circle cx="248" cy="35" r="14" fill="#f5f5f5" stroke="#333" stroke-width="2"/>

  <!-- pelican beak with pouch -->
  <path d="M 262 33 L 300 40 Q 305 46 300 50 L 262 44 Z" fill="#e8a33d" stroke="#333" stroke-width="1.5"/>
  <path d="M 262 44 Q 280 55 262 50 Z" fill="#d68f2b" stroke="#333" stroke-width="1"/>

  <!-- eye -->
  <circle cx="252" cy="32" r="2" fill="#000"/>

  <!-- wing gripping handlebar -->
  <path d="M 195 95 Q 240 90 255 130" fill="none" stroke="#ccc" stroke-width="10" stroke-linecap="round"/>
  <path d="M 195 95 Q 240 90 255 130" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- clouds -->
  <ellipse cx="60" cy="50" rx="25" ry="12" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="80" cy="55" rx="20" ry="10" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="330" cy="70" rx="30" ry="14" fill="#ffffff" opacity="0.8"/>
</svg>