<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <!-- Sky background -->
  <rect width="400" height="350" fill="#87CEEB"/>
  <!-- Ground -->
  <rect y="300" width="400" height="50" fill="#8BC34A"/>

  <!-- === BICYCLE === -->
  <!-- Rear wheel -->
  <circle cx="120" cy="270" r="50" fill="none" stroke="#333" stroke-width="6"/>
  <!-- Rear wheel spokes -->
  <line x1="120" y1="220" x2="120" y2="320" stroke="#555" stroke-width="2"/>
  <line x1="70" y1="270" x2="170" y2="270" stroke="#555" stroke-width="2"/>
  <line x1="85" y1="235" x2="155" y2="305" stroke="#555" stroke-width="2"/>
  <line x1="155" y1="235" x2="85" y2="305" stroke="#555" stroke-width="2"/>
  <!-- Rear hub -->
  <circle cx="120" cy="270" r="7" fill="#555"/>

  <!-- Front wheel -->
  <circle cx="280" cy="270" r="50" fill="none" stroke="#333" stroke-width="6"/>
  <!-- Front wheel spokes -->
  <line x1="280" y1="220" x2="280" y2="320" stroke="#555" stroke-width="2"/>
  <line x1="230" y1="270" x2="330" y2="270" stroke="#555" stroke-width="2"/>
  <line x1="245" y1="235" x2="315" y2="305" stroke="#555" stroke-width="2"/>
  <line x1="315" y1="235" x2="245" y2="305" stroke="#555" stroke-width="2"/>
  <!-- Front hub -->
  <circle cx="280" cy="270" r="7" fill="#555"/>

  <!-- Frame - main triangle -->
  <!-- Seat tube (vertical) -->
  <line x1="165" y1="200" x2="140" y2="270" stroke="#E53935" stroke-width="7" stroke-linecap="round"/>
  <!-- Top tube -->
  <line x1="165" y1="200" x2="245" y2="195" stroke="#E53935" stroke-width="7" stroke-linecap="round"/>
  <!-- Down tube -->
  <line x1="200" y1="265" x2="245" y2="195" stroke="#E53935" stroke-width="7" stroke-linecap="round"/>
  <!-- Chain stay -->
  <line x1="140" y1="270" x2="200" y2="265" stroke="#E53935" stroke-width="7" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="245" y1="195" x2="280" y2="270" stroke="#C62828" stroke-width="6" stroke-linecap="round"/>
  <!-- Rear stay -->
  <line x1="165" y1="200" x2="120" y2="270" stroke="#E53935" stroke-width="5" stroke-linecap="round"/>

  <!-- Crank / pedal area -->
  <circle cx="200" cy="265" r="12" fill="#555"/>
  <!-- Pedal arm -->
  <line x1="200" y1="265" x2="188" y2="280" stroke="#333" stroke-width="4"/>
  <rect x="180" y="278" width="16" height="5" rx="2" fill="#333"/>

  <!-- Handlebar stem -->
  <line x1="245" y1="195" x2="255" y2="175" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="240" y1="172" x2="270" y2="172" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- Seat post -->
  <line x1="165" y1="200" x2="168" y2="180" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="168" cy="177" rx="22" ry="7" fill="#333"/>

  <!-- === PELICAN === -->
  <!-- Body -->
  <ellipse cx="175" cy="160" rx="42" ry="32" fill="white" stroke="#DDD" stroke-width="1"/>

  <!-- Wing (left, folded back) -->
  <ellipse cx="145" cy="162" rx="18" ry="10" fill="#E0E0E0" transform="rotate(-20,145,162)"/>

  <!-- Tail feathers -->
  <ellipse cx="130" cy="170" rx="20" ry="7" fill="#BDBDBD" transform="rotate(20,130,170)"/>

  <!-- Neck -->
  <path d="M 195 140 Q 215 120 210 100" stroke="white" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Neck outline -->
  <path d="M 195 140 Q 215 120 210 100" stroke="#DDD" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.3"/>

  <!-- Head -->
  <circle cx="210" cy="92" r="22" fill="white" stroke="#DDD" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="220" cy="86" r="5" fill="#1A237E"/>
  <circle cx="222" cy="84" r="2" fill="white"/>

  <!-- Beak upper (long pelican beak) -->
  <path d="M 225 92 L 270 104 L 265 108 L 222 99 Z" fill="#FF8F00"/>
  <!-- Beak lower / pouch -->
  <path d="M 225 96 Q 248 118 265 108 L 270 104 Q 248 122 222 102 Z" fill="#FFB300" opacity="0.8"/>
  <!-- Pouch detail -->
  <path d="M 228 100 Q 248 116 263 108" stroke="#E65100" stroke-width="1.5" fill="none"/>

  <!-- Legs -->
  <!-- Left leg -->
  <line x1="168" y1="188" x2="185" y2="225" stroke="#FF8F00" stroke-width="5" stroke-linecap="round"/>
  <line x1="185" y1="225" x2="190" y2="250" stroke="#FF8F00" stroke-width="4" stroke-linecap="round"/>
  <!-- Left foot on pedal area -->
  <line x1="190" y1="250" x2="178" y2="258" stroke="#FF8F00" stroke-width="3"/>
  <line x1="190" y1="250" x2="200" y2="256" stroke="#FF8F00" stroke-width="3"/>

  <!-- Right leg (forward, on pedal) -->
  <line x1="178" y1="186" x2="200" y2="210" stroke="#FF8F00" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="210" x2="205" y2="240" stroke="#FF8F00" stroke-width="4" stroke-linecap="round"/>
  <!-- Foot on pedal -->
  <rect x="197" y="238" width="18" height="5" rx="2" fill="#FF8F00"/>

  <!-- Arms / Wings gripping handlebar -->
  <!-- Right wing arm toward handlebar -->
  <path d="M 200 148 Q 230 148 253 170" stroke="white" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 200 148 Q 230 148 253 170" stroke="#DDD" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- Wing tip at handlebar -->
  <ellipse cx="255" cy="172" rx="10" ry="5" fill="#E0E0E0" transform="rotate(-10,255,172)"/>

  <!-- Hat (jaunty cycling cap) -->
  <ellipse cx="210" cy="74" rx="22" ry="6" fill="#1565C0"/>
  <rect x="190" y="60" width="36" height="15" rx="8" fill="#1565C0"/>
  <!-- Cap brim -->
  <rect x="225" y="72" width="18" height="4" rx="2" fill="#0D47A1"/>

  <!-- Motion lines -->
  <line x1="50" y1="230" x2="20" y2="230" stroke="#90CAF9" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="55" y1="245" x2="15" y2="245" stroke="#90CAF9" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="60" y1="260" x2="25" y2="260" stroke="#90CAF9" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- Sun -->
  <circle cx="350" cy="45" r="28" fill="#FDD835"/>
  <line x1="350" y1="5" x2="350" y2="15" stroke="#FDD835" stroke-width="3"/>
  <line x1="350" y1="75" x2="350" y2="85" stroke="#FDD835" stroke-width="3"/>
  <line x1="310" y1="45" x2="320" y2="45" stroke="#FDD835" stroke-width="3"/>
  <line x1="380" y1="45" x2="390" y2="45" stroke="#FDD835" stroke-width="3"/>
  <line x1="322" y1="17" x2="329" y2="24" stroke="#FDD835" stroke-width="3"/>
  <line x1="371" y1="66" x2="378" y2="73" stroke="#FDD835" stroke-width="3"/>
  <line x1="378" y1="17" x2="371" y2="24" stroke="#FDD835" stroke-width="3"/>
  <line x1="329" y1="66" x2="322" y2="73" stroke="#FDD835" stroke-width="3"/>
</svg>