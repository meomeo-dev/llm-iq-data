<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">真假美猴王：灵山雷音寺前</title>
  <desc id="desc">云头之上，两位一模一样的孙悟空挥棒缠斗。下方如来端坐莲台，手托金色钵盂，诸佛与罗汉分列两旁。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#f9d99c"/>
      <stop offset=".52" stop-color="#eaa86e"/>
      <stop offset="1" stop-color="#b96155"/>
    </linearGradient>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#fff0a4"/>
      <stop offset=".5" stop-color="#e6a92e"/>
      <stop offset="1" stop-color="#a55c17"/>
    </linearGradient>
    <linearGradient id="robe" x2="0" y2="1">
      <stop stop-color="#ffe287"/>
      <stop offset="1" stop-color="#c9822b"/>
    </linearGradient>
    <linearGradient id="cloud" x2="0" y2="1">
      <stop stop-color="#fff6df"/>
      <stop offset="1" stop-color="#dcae9a"/>
    </linearGradient>
    <pattern id="brocade" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M14 3l4 7-4 7-4-7zM0 17l4 5-4 5m28-10l-4 5 4 5" fill="none" stroke="#a34d30" stroke-width="1.5" opacity=".55"/>
    </pattern>
    <g id="monkey">
      <!-- tail -->
      <path d="M-50 14C-92 2-97 37-75 44c13 4 25-5 19-15-4-6-12-4-13 1" fill="none" stroke="#8e4b27" stroke-width="8" stroke-linecap="round"/>
      <!-- legs -->
      <path d="M-10 42l-27 34-23-5-5 10 34 12 38-35M15 43l14 34 26 7 1 11-39-3-29-36" fill="none" stroke="#b66536" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-61 78l-16 1-4 8 22 7M52 80l15 5 1 9-21-1" fill="#352b36" stroke="#6e3924" stroke-width="3"/>
      <!-- body -->
      <path d="M-19 0Q0-13 21 0l12 48q-31 17-64 0z" fill="#d98932" stroke="#63351f" stroke-width="3"/>
      <path d="M-21 21q22 8 47 0l7 28q-31 15-61 0z" fill="url(#brocade)" opacity=".9"/>
      <!-- tiger skirt -->
      <path d="M-32 39Q0 49 32 39l15 26q-19 14-48 8-27 2-47-8z" fill="#e9c264" stroke="#603c2c" stroke-width="3"/>
      <path d="M-29 46l11 7-10 11m22-15l8 9-10 13m22-19l-2 10 12 5m-53-3l10 7m36-25l-8 8 13 3" fill="none" stroke="#392b27" stroke-width="3"/>
      <!-- arms -->
      <path d="M-19 7l-25-18-19-27M20 8l29-14 23-27" fill="none" stroke="#b66536" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-64-38l-7-9M73-33l7-9" stroke="#d8904c" stroke-width="9" stroke-linecap="round"/>
      <!-- head and ears -->
      <circle cx="0" cy="-26" r="23" fill="#c9783e" stroke="#60351f" stroke-width="3"/>
      <circle cx="-22" cy="-27" r="9" fill="#cf8049" stroke="#60351f" stroke-width="3"/>
      <circle cx="22" cy="-27" r="9" fill="#cf8049" stroke="#60351f" stroke-width="3"/>
      <path d="M-13-27q13-15 27 0l-3 13q-10 10-21 0z" fill="#f4c98e"/>
      <ellipse cx="-8" cy="-30" rx="3" ry="4" fill="#211b20"/>
      <ellipse cx="8" cy="-30" rx="3" ry="4" fill="#211b20"/>
      <path d="M-4-20l4 3 4-3M-9-12q9 6 18 0" fill="none" stroke="#632e24" stroke-width="2"/>
      <!-- golden headband -->
      <path d="M-21-41q20-13 42 0l-2 8q-19-9-38 0z" fill="url(#gold)" stroke="#8b5318" stroke-width="2"/>
      <circle cx="0" cy="-43" r="4" fill="#fff0a0"/>
    </g>
    <g id="arhat">
      <circle cx="0" cy="0" r="15" fill="#d49a70" stroke="#624433" stroke-width="2"/>
      <path d="M-12-3q12-16 24 0v5h-24z" fill="#b95f47"/>
      <path d="M-21 64q1-41 21-44 21 4 22 44z" fill="#647d76" stroke="#4f4c48" stroke-width="2"/>
      <path d="M-17 37q17 9 34 0M-10 56l10-20 10 20" fill="none" stroke="#c5b18d" stroke-width="2"/>
    </g>
    <g id="buddha">
      <path d="M-58 85q-55 20-67 62h250q-12-42-67-62z" fill="url(#robe)" stroke="#89541e" stroke-width="4"/>
      <path d="M-94 133q44-30 94-4 50-26 94 4" fill="none" stroke="#fff0af" stroke-width="4" opacity=".75"/>
      <path d="M-29 47q29-18 58 0l15 38q-44 30-88 0z" fill="#e0a543" stroke="#89541e" stroke-width="3"/>
      <!-- hands -->
      <path d="M19 49q30-10 44 7l-7 12q-17-7-35 5" fill="none" stroke="#cc8d63" stroke-width="12" stroke-linecap="round"/>
      <path d="M49 48q-9-18 3-26 11-7 18 2 4 8-2 19" fill="none" stroke="#cc8d63" stroke-width="10" stroke-linecap="round"/>
      <!-- alms bowl -->
      <path d="M47 9q23-10 43 0l-5 19q-17 11-34 0z" fill="url(#gold)" stroke="#8a531e" stroke-width="3"/>
      <ellipse cx="68" cy="9" rx="22" ry="7" fill="#ffe98d" stroke="#a66b1e" stroke-width="3"/>
      <!-- neck and face -->
      <path d="M-14-4h28v22h-28z" fill="#c9875c"/>
      <ellipse cy="-34" rx="36" ry="40" fill="#d29a6e" stroke="#735038" stroke-width="3"/>
      <path d="M-36-42q5-40 36-37 34 2 38 37-17-13-38-13-20 0-36 13z" fill="#342b2a"/>
      <path d="M-8-50q8-12 16 0" fill="none" stroke="#d49b6e" stroke-width="8" stroke-linecap="round"/>
      <path d="M-17-32h7m20 0h7M-5-19q5 4 10 0" fill="none" stroke="#573a30" stroke-width="2.5"/>
      <circle cx="-14" cy="-33" r="2.5" fill="#282124"/>
      <circle cx="14" cy="-33" r="2.5" fill="#282124"/>
      <path d="M-3-29l3 6 3-6" fill="none" stroke="#915c44" stroke-width="2"/>
      <circle cy="-75" r="5" fill="#f3d46b"/>
    </g>
  </defs>

  <!-- Lingshan dawn -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="600" cy="150" r="92" fill="#ffe9aa" opacity=".52"/>
  <path d="M0 333q125-119 257-18 88-83 187-7 91-108 207-6 93-95 191-9 140-105 358 32v111H0z" fill="#8a6670" opacity=".34"/>
  <path d="M0 370q156-97 277-7 126-102 258 1 115-90 235-5 151-100 263-2 108-64 167-19v93H0z" fill="#c77b69" opacity=".4"/>

  <!-- Temple of Thunder Sound -->
  <g stroke="#754333" stroke-width="5" stroke-linejoin="round">
    <path d="M392 183h416v17H392z" fill="#8e4639"/>
    <path d="M410 143h380l-38 32H448z" fill="#bf6245"/>
    <path d="M390 143l210-91 210 91z" fill="#a54337"/>
    <path d="M421 138l179-76 179 76" fill="none" stroke="#f3c774" stroke-width="7"/>
    <path d="M463 178v121m274-121v121M454 225h292v12H454z" fill="#d79a55"/>
    <path d="M476 184h248v115H476z" fill="#713d3a"/>
    <path d="M493 202h214v97H493z" fill="#b56a48"/>
    <path d="M574 299v-65q26-37 52 0v65z" fill="#392d38"/>
    <path d="M461 226h278" fill="none" stroke="#f5cc75" stroke-width="4"/>
    <path d="M430 179h340" fill="none" stroke="#f5cc75" stroke-width="3"/>
    <path d="M600 50v-22m0 22l-12-14m12 14l12-14" fill="none" stroke="#f7d978" stroke-width="4"/>
  </g>
  <text x="600" y="213" text-anchor="middle" fill="#ffe7a4" font-size="21" font-family="serif" letter-spacing="5">大雄宝殿</text>
  <path d="M373 310h454" stroke="#ffe5a4" stroke-width="2" opacity=".7"/>

  <!-- distant celestial attendants -->
  <g fill="#ffe1a0" opacity=".8">
    <circle cx="351" cy="253" r="5"/><circle cx="849" cy="253" r="5"/>
    <path d="M344 265q7-12 14 0v27h-14zm494 0q7-12 14 0v27h-14z"/>
    <path d="M336 274l-19 20h20m513-20l19 20h-20" fill="none" stroke="#ffe1a0" stroke-width="4"/>
  </g>

  <!-- Buddha's lotus throne -->
  <g transform="translate(600 522)">
    <path d="M-119 106q-122 14-145 77h528q-23-63-145-77z" fill="#8d4b50" stroke="#63373c" stroke-width="5"/>
    <path d="M-226 183q226-33 452 0v30h-452z" fill="#d39a53" stroke="#71452e" stroke-width="4"/>
    <path d="M-205 184q21-34 42 0 21-42 42 0 21-48 42 0 21-53 42 0 21-53 42 0 21-53 42 0 21-48 42 0 21-42 42 0 21-34 42 0" fill="#e0a95e" stroke="#8b5838" stroke-width="3"/>
    <path d="M-190 211h380" stroke="#f5d586" stroke-width="3"/>
    <circle cx="0" cy="168" r="8" fill="#ffe39a"/>
  </g>
  <g transform="translate(600 477) scale(1.32)">
    <use href="#buddha"/>
  </g>

  <!-- assembly of Buddhas and arhats -->
  <g opacity=".96">
    <g transform="translate(143 461) scale(.88)"><use href="#arhat"/></g>
    <g transform="translate(233 430) scale(.98)"><use href="#arhat"/></g>
    <g transform="translate(333 459) scale(.83)"><use href="#arhat"/></g>
    <g transform="translate(867 459) scale(.83)"><use href="#arhat"/></g>
    <g transform="translate(967 430) scale(.98)"><use href="#arhat"/></g>
    <g transform="translate(1057 461) scale(.88)"><use href="#arhat"/></g>
    <g fill="#f8dd9b" stroke="#9c623d" stroke-width="3">
      <circle cx="143" cy="425" r="11"/><circle cx="233" cy="391" r="12"/>
      <circle cx="333" cy="425" r="10"/><circle cx="867" cy="425" r="10"/>
      <circle cx="967" cy="391" r="12"/><circle cx="1057" cy="425" r="11"/>
    </g>
    <path d="M95 536h272M833 536h272" stroke="#f4c879" stroke-width="3" opacity=".7"/>
  </g>

  <!-- clouds carrying the combatants -->
  <g fill="url(#cloud)" stroke="#b97d70" stroke-width="3">
    <path d="M85 373q-10-31 22-39 8-37 50-25 19-43 64-17 34-39 72-6 45-23 69 18 44-5 55 34 20 25-9 41H123q-46 1-38-6z"/>
    <path d="M678 375q-10-31 22-39 8-37 50-25 19-43 64-17 34-39 72-6 45-23 69 18 44-5 55 34 20 25-9 41H716q-46 1-38-6z"/>
    <path d="M133 391q30-28 64 1 31-33 65 0 31-26 61 2m401-3q30-28 64 1 31-33 65 0 31-26 61 2" fill="none" stroke="#fff0dc" stroke-width="5"/>
  </g>

  <!-- crossed iron staves -->
  <g stroke-linecap="round">
    <path d="M327 246L532 389" stroke="#302a37" stroke-width="13"/>
    <path d="M327 246L532 389" stroke="#d9a74d" stroke-width="5"/>
    <path d="M836 245L652 388" stroke="#302a37" stroke-width="13"/>
    <path d="M836 245L652 388" stroke="#d9a74d" stroke-width="5"/>
    <path d="M317 238l20 14m185 126l20 14M826 238l20 14m-204 123l20 14" stroke="#ffe19a" stroke-width="5"/>
  </g>

  <!-- identical Monkey Kings; mirror one to show their symmetry -->
  <g transform="translate(390 300) rotate(-18) scale(1.03)">
    <use href="#monkey"/>
  </g>
  <g transform="translate(810 300) rotate(18) scale(-1.03 1.03)">
    <use href="#monkey"/>
  </g>

  <!-- motion curls and sparks -->
  <g fill="none" stroke="#fff0bd" stroke-width="4" stroke-linecap="round">
    <path d="M555 286q-23-22-4-41 14-15 30-2"/>
    <path d="M647 278q26-22 7-41-14-15-30-2"/>
    <path d="M583 241l8-13 8 13 13 5-13 5-8 13-8-13-13-5z"/>
    <path d="M607 312l7-12 7 12 12 5-12 5-7 12-7-12-12-5z"/>
  </g>
  <g fill="#fff4c8">
    <circle cx="565" cy="264" r="4"/><circle cx="636" cy="256" r="4"/>
    <circle cx="599" cy="224" r="3"/><circle cx="617" cy="329" r="3"/>
  </g>

  <!-- ornamental foreground cloud banks -->
  <g fill="#f7e0bc" opacity=".83">
    <path d="M0 692q39-34 78 0 33-39 69 0 43-32 77 2 44-31 79 0 43-36 76 1v105H0z"/>
    <path d="M821 698q39-34 78 0 33-39 69 0 43-32 77 2 44-31 79 0 43-36 76 1v99H821z"/>
  </g>
  <path d="M0 774q125-34 251 0t251 0 251 0 251 0 196 0" fill="none" stroke="#ae6257" stroke-width="4" opacity=".55"/>
</svg>