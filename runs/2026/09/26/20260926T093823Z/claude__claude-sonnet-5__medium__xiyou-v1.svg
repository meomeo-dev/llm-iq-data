<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff0ff"/>
      <stop offset="55%" stop-color="#f5eeda"/>
      <stop offset="100%" stop-color="#f9e7c9"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c9"/>
      <stop offset="70%" stop-color="#ffe07a"/>
      <stop offset="100%" stop-color="#ffcf4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#d99e2b"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9743b"/>
      <stop offset="100%" stop-color="#7a4f22"/>
    </linearGradient>
  </defs>

  <!-- 背景天空 -->
  <rect x="0" y="0" width="800" height="1000" fill="url(#sky)"/>

  <!-- 远山剪影 -->
  <path d="M0,300 Q120,220 240,290 Q360,230 480,300 Q600,240 720,300 L800,320 L800,420 L0,420 Z"
        fill="#c9d9e6" opacity="0.6"/>

  <!-- 雷音寺殿宇 -->
  <g opacity="0.9">
    <path d="M260,150 L400,60 L540,150 Z" fill="#8a2e2e"/>
    <path d="M240,150 L560,150 L560,175 L240,175 Z" fill="#5c1f1f"/>
    <rect x="300" y="175" width="200" height="90" fill="#a8402f"/>
    <rect x="300" y="175" width="200" height="10" fill="#e8c060"/>
    <path d="M330,265 L330,220 L470,220 L470,265" fill="none" stroke="#5c1f1f" stroke-width="4"/>
    <rect x="380" y="220" width="40" height="45" fill="#5c1f1f"/>
    <text x="400" y="140" text-anchor="middle" font-size="18" fill="#e8c060" font-family="serif">雷音寺</text>
  </g>

  <!-- 祥云背景大团 -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="330" rx="90" ry="34"/>
    <ellipse cx="230" cy="310" rx="70" ry="28"/>
    <ellipse cx="620" cy="330" rx="95" ry="34"/>
    <ellipse cx="560" cy="310" rx="65" ry="26"/>
    <ellipse cx="400" cy="360" rx="120" ry="30"/>
  </g>

  <!-- ============ 上方：二猴缠斗于云头 ============ -->
  <g>
    <!-- 脚下云朵 -->
    <g fill="#ffffff" stroke="#dfe6ee" stroke-width="2">
      <ellipse cx="330" cy="470" rx="80" ry="26"/>
      <ellipse cx="280" cy="480" rx="55" ry="20"/>
      <ellipse cx="470" cy="470" rx="80" ry="26"/>
      <ellipse cx="520" cy="480" rx="55" ry="20"/>
      <ellipse cx="400" cy="485" rx="70" ry="22"/>
    </g>

    <!-- 猴王甲：左侧，攻势前倾 -->
    <g transform="translate(330,455)">
      <!-- 铁棒 -->
      <g transform="rotate(-35)">
        <rect x="-4" y="-140" width="8" height="200" fill="#2b2b2b"/>
        <rect x="-9" y="-146" width="18" height="14" rx="3" fill="url(#gold)"/>
        <rect x="-9" y="58" width="18" height="14" rx="3" fill="url(#gold)"/>
      </g>
      <!-- 虎皮裙 -->
      <path d="M-26,20 L26,20 L20,58 L-20,58 Z" fill="#e8892f"/>
      <path d="M-26,20 L26,20 L20,58 L-20,58 Z" fill="none" stroke="#3b2a1a" stroke-width="3"
            stroke-dasharray="6,6"/>
      <!-- 身体 -->
      <path d="M-22,-4 Q0,-18 22,-4 L18,24 Q0,32 -18,24 Z" fill="url(#fur)"/>
      <!-- 手臂 -->
      <path d="M-20,0 L-42,-30" stroke="url(#fur)" stroke-width="10" stroke-linecap="round"/>
      <path d="M20,0 L38,20" stroke="url(#fur)" stroke-width="10" stroke-linecap="round"/>
      <!-- 尾巴 -->
      <path d="M18,20 Q46,10 40,-16" stroke="url(#fur)" stroke-width="7" fill="none"
            stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="0" cy="-30" r="17" fill="url(#fur)"/>
      <!-- 金箍 -->
      <path d="M-15,-33 Q0,-42 15,-33" stroke="#d9a520" stroke-width="4" fill="none"/>
      <!-- 脸部简化 -->
      <circle cx="-6" cy="-30" r="2" fill="#2b1a0d"/>
      <circle cx="6" cy="-30" r="2" fill="#2b1a0d"/>
      <path d="M-5,-22 Q0,-19 5,-22" stroke="#2b1a0d" stroke-width="1.5" fill="none"/>
    </g>

    <!-- 猴王乙：右侧，与甲一模一样，对称迎战 -->
    <g transform="translate(470,455) scale(-1,1)">
      <g transform="rotate(-35)">
        <rect x="-4" y="-140" width="8" height="200" fill="#2b2b2b"/>
        <rect x="-9" y="-146" width="18" height="14" rx="3" fill="url(#gold)"/>
        <rect x="-9" y="58" width="18" height="14" rx="3" fill="url(#gold)"/>
      </g>
      <path d="M-26,20 L26,20 L20,58 L-20,58 Z" fill="#e8892f"/>
      <path d="M-26,20 L26,20 L20,58 L-20,58 Z" fill="none" stroke="#3b2a1a" stroke-width="3"
            stroke-dasharray="6,6"/>
      <path d="M-22,-4 Q0,-18 22,-4 L18,24 Q0,32 -18,24 Z" fill="url(#fur)"/>
      <path d="M-20,0 L-42,-30" stroke="url(#fur)" stroke-width="10" stroke-linecap="round"/>
      <path d="M20,0 L38,20" stroke="url(#fur)" stroke-width="10" stroke-linecap="round"/>
      <path d="M18,20 Q46,10 40,-16" stroke="url(#fur)" stroke-width="7" fill="none"
            stroke-linecap="round"/>
      <circle cx="0" cy="-30" r="17" fill="url(#fur)"/>
      <path d="M-15,-33 Q0,-42 15,-33" stroke="#d9a520" stroke-width="4" fill="none"/>
      <circle cx="-6" cy="-30" r="2" fill="#2b1a0d"/>
      <circle cx="6" cy="-30" r="2" fill="#2b1a0d"/>
      <path d="M-5,-22 Q0,-19 5,-22" stroke="#2b1a0d" stroke-width="1.5" fill="none"/>
    </g>

    <!-- 棒棒相击的火星 -->
    <g fill="#ffd24d" opacity="0.9">
      <path d="M400,405 l6,-10 l6,10 l-6,-2 z"/>
      <path d="M395,415 l5,-8 l5,8 l-5,-1 z"/>
      <path d="M408,415 l5,-8 l5,8 l-5,-1 z"/>
    </g>
  </g>

  <!-- ============ 下方：莲台如来 ============ -->
  <g transform="translate(400,760)">
    <!-- 背光 -->
    <circle cx="0" cy="-60" r="160" fill="url(#halo)"/>

    <!-- 莲台 -->
    <g>
      <ellipse cx="0" cy="140" rx="150" ry="26" fill="#c9d9e6" opacity="0.5"/>
      <g fill="#f6c9d8" stroke="#d98fae" stroke-width="2">
        <path d="M-140,120 Q-110,70 -70,110 Q-100,120 -140,120 Z"/>
        <path d="M-100,130 Q-60,80 -20,120 Q-60,132 -100,130 Z"/>
        <path d="M-60,138 Q-20,90 20,138 Q-20,150 -60,138 Z"/>
        <path d="M20,120 Q60,80 100,130 Q60,132 20,120 Z"/>
        <path d="M70,110 Q110,70 140,120 Q100,120 70,110 Z"/>
      </g>
      <ellipse cx="0" cy="112" rx="110" ry="18" fill="#fbe4ea"/>
    </g>

    <!-- 如来本尊 -->
    <g transform="translate(0,10)">
      <!-- 法袍 -->
      <path d="M-60,90 Q0,110 60,90 L48,5 Q0,-14 -48,5 Z" fill="url(#gold)"/>
      <path d="M-48,5 Q0,20 48,5" fill="none" stroke="#b5791f" stroke-width="2"/>
      <!-- 结跏趺坐的双腿 -->
      <path d="M-60,90 Q0,118 60,90 L54,70 Q0,96 -54,70 Z" fill="#e0aa3d"/>
      <!-- 双手托钵 -->
      <path d="M-30,40 Q0,58 30,40" stroke="url(#fur)" stroke-width="0" fill="none"/>
      <ellipse cx="0" cy="46" rx="26" ry="10" fill="url(#gold)" stroke="#a8781e" stroke-width="2"/>
      <ellipse cx="0" cy="40" rx="20" ry="7" fill="#fff2c2"/>
      <path d="M-24,44 Q-34,20 -16,-2" stroke="#e0aa3d" stroke-width="9" fill="none"
            stroke-linecap="round"/>
      <path d="M24,44 Q34,20 16,-2" stroke="#e0aa3d" stroke-width="9" fill="none"
            stroke-linecap="round"/>
      <!-- 身躯 -->
      <path d="M-40,5 Q0,-10 40,5 L34,40 Q0,54 -34,40 Z" fill="#e0aa3d"/>
      <!-- 头部与螺髻 -->
      <circle cx="0" cy="-30" r="22" fill="#e0aa3d"/>
      <circle cx="0" cy="-50" r="7" fill="#c98f22"/>
      <path d="M-14,-30 a14,14 0 0,0 28,0" fill="none" stroke="#a8781e" stroke-width="1.5"/>
      <circle cx="-7" cy="-32" r="2" fill="#3b2a1a"/>
      <circle cx="7" cy="-32" r="2" fill="#3b2a1a"/>
      <circle cx="0" cy="-38" r="1.6" fill="#7a3b1e"/>
      <path d="M-8,-22 Q0,-18 8,-22" stroke="#3b2a1a" stroke-width="1.5" fill="none"/>
    </g>
  </g>

  <!-- ============ 两侧：诸佛与罗汉 ============ -->
  <g>
    <!-- 简化的佛/罗汉造型：圆头 + 袍身 + 小背光 -->
    <!-- 左侧一排 -->
    <g transform="translate(150,780)">
      <circle cx="0" cy="0" r="34" fill="url(#halo)" opacity="0.7"/>
      <path d="M-22,40 Q0,55 22,40 L18,0 Q0,-8 -18,0 Z" fill="#8fb7a0"/>
      <circle cx="0" cy="-18" r="13" fill="#e0aa3d"/>
      <circle cx="-4" cy="-19" r="1.3" fill="#3b2a1a"/>
      <circle cx="4" cy="-19" r="1.3" fill="#3b2a1a"/>
    </g>
    <g transform="translate(220,830)">
      <circle cx="0" cy="0" r="30" fill="url(#halo)" opacity="0.7"/>
      <path d="M-20,36 Q0,50 20,36 L16,0 Q0,-8 -16,0 Z" fill="#c98f6a"/>
      <circle cx="0" cy="-16" r="12" fill="#e0aa3d"/>
      <circle cx="-4" cy="-17" r="1.2" fill="#3b2a1a"/>
      <circle cx="4" cy="-17" r="1.2" fill="#3b2a1a"/>
    </g>
    <g transform="translate(110,860)">
      <circle cx="0" cy="0" r="28" fill="url(#halo)" opacity="0.6"/>
      <path d="M-18,32 Q0,45 18,32 L14,0 Q0,-6 -14,0 Z" fill="#7a95b7"/>
      <circle cx="0" cy="-14" r="11" fill="#e0aa3d"/>
      <circle cx="-3" cy="-15" r="1.1" fill="#3b2a1a"/>
      <circle cx="3" cy="-15" r="1.1" fill="#3b2a1a"/>
    </g>
    <g transform="translate(260,875)">
      <circle cx="0" cy="0" r="26" fill="url(#halo)" opacity="0.6"/>
      <path d="M-17,30 Q0,42 17,30 L13,0 Q0,-6 -13,0 Z" fill="#b78f5c"/>
      <circle cx="0" cy="-13" r="10" fill="#e0aa3d"/>
      <circle cx="-3" cy="-14" r="1" fill="#3b2a1a"/>
      <circle cx="3" cy="-14" r="1" fill="#3b2a1a"/>
    </g>

    <!-- 右侧一排 -->
    <g transform="translate(650,780)">
      <circle cx="0" cy="0" r="34" fill="url(#halo)" opacity="0.7"/>
      <path d="M-22,40 Q0,55 22,40 L18,0 Q0,-8 -18,0 Z" fill="#8fb7a0"/>
      <circle cx="0" cy="-18" r="13" fill="#e0aa3d"/>
      <circle cx="-4" cy="-19" r="1.3" fill="#3b2a1a"/>
      <circle cx="4" cy="-19" r="1.3" fill="#3b2a1a"/>
    </g>
    <g transform="translate(580,830)">
      <circle cx="0" cy="0" r="30" fill="url(#halo)" opacity="0.7"/>
      <path d="M-20,36 Q0,50 20,36 L16,0 Q0,-8 -16,0 Z" fill="#c98f6a"/>
      <circle cx="0" cy="-16" r="12" fill="#e0aa3d"/>
      <circle cx="-4" cy="-17" r="1.2" fill="#3b2a1a"/>
      <circle cx="4" cy="-17" r="1.2" fill="#3b2a1a"/>
    </g>
    <g transform="translate(690,860)">
      <circle cx="0" cy="0" r="28" fill="url(#halo)" opacity="0.6"/>
      <path d="M-18,32 Q0,45 18,32 L14,0 Q0,-6 -14,0 Z" fill="#7a95b7"/>
      <circle cx="0" cy="-14" r="11" fill="#e0aa3d"/>
      <circle cx="-3" cy="-15" r="1.1" fill="#3b2a1a"/>
      <circle cx="3" cy="-15" r="1.1" fill="#3b2a1a"/>
    </g>
    <g transform="translate(540,875)">
      <circle cx="0" cy="0" r="26" fill="url(#halo)" opacity="0.6"/>
      <path d="M-17,30 Q0,42 17,30 L13,0 Q0,-6 -13,0 Z" fill="#b78f5c"/>
      <circle cx="0" cy="-13" r="10" fill="#e0aa3d"/>
      <circle cx="-3" cy="-14" r="1" fill="#3b2a1a"/>
      <circle cx="3" cy="-14" r="1" fill="#3b2a1a"/>
    </g>
  </g>

  <!-- 前景祥云收尾 -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="60" cy="950" rx="100" ry="28"/>
    <ellipse cx="740" cy="950" rx="100" ry="28"/>
    <ellipse cx="400" cy="970" rx="180" ry="24"/>
  </g>
</svg>