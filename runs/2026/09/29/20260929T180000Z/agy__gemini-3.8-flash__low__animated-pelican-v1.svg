<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8e3" />
      <stop offset="55%" stop-color="#cdebf7" />
      <stop offset="100%" stop-color="#fff5eb" />
    </linearGradient>

    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe680" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffaa44" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#737982" />
      <stop offset="15%" stop-color="#555a60" />
      <stop offset="100%" stop-color="#373c42" />
    </linearGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d63426" />
      <stop offset="50%" stop-color="#f04d3d" />
      <stop offset="100%" stop-color="#a82317" />
    </linearGradient>

    <linearGradient id="metallic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f3f5" />
      <stop offset="50%" stop-color="#c5ccd1" />
      <stop offset="100%" stop-color="#89939a" />
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e89838" />
      <stop offset="70%" stop-color="#cf651b" />
      <stop offset="100%" stop-color="#963d09" />
    </linearGradient>

    <!-- Spoked Wheel Definition (Center at 0, 0, Radius 95) -->
    <g id="bicycle-wheel">
      <!-- Shadow & Tire -->
      <circle cx="0" cy="0" r="95" fill="none" stroke="#25272a" stroke-width="14" />
      <!-- Rim -->
      <circle cx="0" cy="0" r="88" fill="none" stroke="#dbe1e6" stroke-width="4" />
      <!-- Spokes (16 Spokes) -->
      <g stroke="#bcc3c9" stroke-width="1.8" opacity="0.85">
        <line x1="0" y1="-88" x2="0" y2="88" />
        <line x1="-88" y1="0" x2="88" y2="0" />
        <line x1="-62.2" y1="-62.2" x2="62.2" y2="62.2" />
        <line x1="62.2" y1="-62.2" x2="-62.2" y2="62.2" />
        <line x1="-33.7" y1="-81.3" x2="33.7" y2="81.3" />
        <line x1="33.7" y1="-81.3" x2="-33.7" y2="81.3" />
        <line x1="-81.3" y1="-33.7" x2="81.3" y2="33.7" />
        <line x1="81.3" y1="-33.7" x2="-81.3" y2="33.7" />
      </g>
      <!-- Hub & Axle Nut -->
      <circle cx="0" cy="0" r="14" fill="url(#metallic)" stroke="#4a525a" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#2d3238" />
      <circle cx="0" cy="0" r="2" fill="#fff" />
      <!-- Valve Stem for visible realistic spin reference -->
      <rect x="-2" y="-83" width="4" height="10" rx="1.5" fill="#bfa332" />
    </g>
  </defs>

  <style><![CDATA[
    /* CSS Timing: 1.5s per cycle */
    :root {
      --pedal-speed: 1.4s;
    }

    /* Wheel continuous spin (clockwise) */
    .wheel-rotate-rear {
      transform-origin: 270px 470px;
      animation: wheel-spin var(--pedal-speed) linear infinite;
    }
    .wheel-rotate-front {
      transform-origin: 670px 470px;
      animation: wheel-spin var(--pedal-speed) linear infinite;
    }
    @keyframes wheel-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Crank axle rotation centered at (450, 470) */
    .crankset {
      transform-origin: 450px 470px;
      animation: crank-spin var(--pedal-speed) linear infinite;
    }
    @keyframes crank-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Keep pedals horizontal while orbiting */
    .pedal-counter-1 {
      transform-origin: 450px 525px;
      animation: pedal-counter-spin var(--pedal-speed) linear infinite;
    }
    .pedal-counter-2 {
      transform-origin: 450px 415px;
      animation: pedal-counter-spin var(--pedal-speed) linear infinite;
    }
    @keyframes pedal-counter-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    /* Ground stripes scrolling left to simulate movement */
    .ground-line {
      stroke-dasharray: 60 140;
      animation: ground-move 0.7s linear infinite;
    }
    @keyframes ground-move {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -200; }
    }

    /* Pelican torso subtle rhythmic cadence */
    .pelican-torso {
      animation: body-bounce var(--pedal-speed) ease-in-out infinite;
      transform-origin: 360px 290px;
    }
    @keyframes body-bounce {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(3px) rotate(0.8deg); }
      50% { transform: translateY(-1px) rotate(-0.4deg); }
      75% { transform: translateY(3.5px) rotate(0.6deg); }
    }

    /* Wind flutter on scarf / throat crest */
    .crest-flutter {
      animation: crest-wave 0.4s ease-in-out infinite alternate;
      transform-origin: 420px 145px;
    }
    @keyframes crest-wave {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-5deg) skewX(4deg); }
    }
  ]]></style>

  <!-- ================= BACKGROUND & SCENERY ================= -->
  <rect x="0" y="0" width="1000" height="650" fill="url(#skyGrad)" />
  <circle cx="830" cy="170" r="110" fill="url(#sunGrad)" />

  <!-- Distant Coastal Hills -->
  <path d="M 0,440 Q 180,380 390,420 T 780,410 Q 890,390 1000,430 L 1000,560 L 0,560 Z" fill="#9dbf9e" opacity="0.65" />
  <path d="M 0,460 Q 220,430 450,455 T 860,445 Q 940,435 1000,460 L 1000,565 L 0,565 Z" fill="#78997a" opacity="0.75" />

  <!-- Road & Shoulder -->
  <rect x="0" y="525" width="1000" height="125" fill="url(#roadGrad)" />
  <line x1="0" y1="525" x2="1000" y2="525" stroke="#e0d5aa" stroke-width="6" />
  <line x1="0" y1="585" x2="1000" y2="585" stroke="#fce300" stroke-width="7" class="ground-line" />
  <line x1="0" y1="646" x2="1000" y2="646" stroke="#22252a" stroke-width="8" />

  <!-- Ground Shadows under Wheels -->
  <ellipse cx="270" cy="565" rx="80" ry="11" fill="#1b2126" opacity="0.4" />
  <ellipse cx="670" cy="565" rx="80" ry="11" fill="#1b2126" opacity="0.4" />
  <ellipse cx="460" cy="568" rx="60" ry="8" fill="#1b2126" opacity="0.25" />

  <!-- ================= BICYCLE (REAR LAYER) ================= -->
  <!-- Left/Far Pedal Assembly & Far Leg -->
  <g class="crankset">
    <!-- Far Crank Arm (pointing up at phase 0: 450,470 -> 450,415) -->
    <line x1="450" y1="470" x2="450" y2="415" stroke="#5a636a" stroke-width="8" stroke-linecap="round" />
    <circle cx="450" cy="415" r="5" fill="#32373b" />
    <!-- Far Pedal -->
    <g class="pedal-counter-2">
      <rect x="432" y="411" width="36" height="8" rx="3" fill="#2d3339" stroke="#111" stroke-width="1.5" />
      <line x1="436" y1="415" x2="464" y2="415" stroke="#f39c12" stroke-width="2" />
    </g>
  </g>

  <!-- Far Leg (Left Leg): Animates between hip (385, 345) and far pedal (orbits 450, 470 R=55, phase 180 deg) -->
  <!-- Path data morphs seamlessly across the 4 key quarter-phases -->
  <path fill="none" stroke="#2c302e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
      values="M 385 345 Q 405 380 450 415;
              M 385 345 Q 475 425 505 470;
              M 385 345 Q 480 480 450 525;
              M 385 345 Q 390 440 395 470;
              M 385 345 Q 405 380 450 415" />
  </path>
  <!-- Far Webbed Foot on Far Pedal -->
  <path fill="#e67e22" stroke="#a04000" stroke-width="1.5">
    <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
      values="M 432 413 L 468 408 L 476 418 L 442 418 Z;
              M 487 468 L 523 463 L 531 473 L 497 473 Z;
              M 432 523 L 468 518 L 476 528 L 442 528 Z;
              M 377 468 L 413 463 L 421 473 L 387 473 Z;
              M 432 413 L 468 408 L 476 418 L 442 418 Z" />
  </path>

  <!-- Rear Wheel (Axle at 270, 470) -->
  <g class="wheel-rotate-rear">
    <use href="#bicycle-wheel" x="270" y="470" />
  </g>

  <!-- Front Wheel (Axle at 670, 470) -->
  <g class="wheel-rotate-front">
    <use href="#bicycle-wheel" x="670" y="470" />
  </g>

  <!-- ================= BICYCLE MAIN FRAME ================= -->
  <!-- Drive Train: Chainstay & Rear Cog & Chain -->
  <line x1="270" y1="470" x2="450" y2="470" stroke="#252a2e" stroke-width="7" stroke-linecap="round" />
  <!-- Rear Cassette Cog -->
  <circle cx="270" cy="470" r="19" fill="#95a5a6" stroke="#464c52" stroke-width="2" />
  <!-- Bike Chain -->
  <path d="M 270 451 L 450 442 A 28 28 0 0 1 450 498 L 270 489 A 19 19 0 0 1 270 451 Z" 
        fill="none" stroke="#2c3437" stroke-width="3.5" stroke-dasharray="7,4" />

  <!-- Diamond Frame Tubes -->
  <!-- Seat Stay: Rear dropouts (270,470) to Seat lug (370,305) -->
  <line x1="270" y1="470" x2="370" y2="305" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" />
  
  <!-- Seat Tube: Bottom Bracket (450,470) to Seat lug (370,305) -->
  <line x1="450" y1="470" x2="370" y2="305" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" />
  
  <!-- Down Tube: Bottom Bracket (450,470) to Head Tube bottom (605,320) -->
  <line x1="450" y1="470" x2="605" y2="320" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" />
  
  <!-- Top Tube: Seat lug (370,305) to Head Tube top (590,270) -->
  <line x1="370" y1="305" x2="590" y2="270" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" />
  
  <!-- Head Tube (590,270) to (605,320) -->
  <line x1="590" y1="260" x2="608" y2="330" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Front Fork: From Head Tube through front dropout (670,470) -->
  <line x1="605" y1="320" x2="670" y2="470" stroke="url(#metallic)" stroke-width="9" stroke-linecap="round" />

  <!-- Seat Post & Saddle -->
  <line x1="370" y1="305" x2="363" y2="275" stroke="url(#metallic)" stroke-width="8" stroke-linecap="round" />
  <!-- Ergonomic Road/Cruiser Saddle -->
  <path d="M 330 270 Q 360 262 395 272 C 405 275 398 284 380 284 C 355 284 335 288 330 270 Z" 
        fill="#2c2825" stroke="#12100e" stroke-width="2" />

  <!-- Handlebar Stem and Cruiser Handlebar -->
  <path d="M 590 260 L 585 228 L 565 220" fill="none" stroke="url(#metallic)" stroke-width="7" stroke-linecap="round" />
  <!-- Handlebars with Grips swept back toward pelican -->
  <path d="M 550 226 Q 570 215 605 222 Q 575 238 545 242" fill="none" stroke="#d5dbe0" stroke-width="6" stroke-linecap="round" />
  <rect x="536" y="238" width="16" height="8" rx="3" fill="#1b1c1e" transform="rotate(-8 544 242)" />

  <!-- Front Chainring (Centered at 450,470, radius 28) -->
  <circle cx="450" cy="470" r="28" fill="url(#metallic)" stroke="#393e43" stroke-width="3" />
  <!-- Chainring decorative weight reduction holes -->
  <circle cx="450" cy="454" r="5" fill="#393e43" />
  <circle cx="466" cy="470" r="5" fill="#393e43" />
  <circle cx="450" cy="486" r="5" fill="#393e43" />
  <circle cx="434" cy="470" r="5" fill="#393e43" />


  <!-- ================= CALIFORNIA BROWN PELICAN ================= -->
  <g class="pelican-torso">
    <!-- Tail Feathers -->
    <path d="M 315 275 C 290 280 270 295 260 315 C 275 310 295 305 320 295 Z" fill="#4a423d" stroke="#2b2622" stroke-width="1.5" />
    <path d="M 318 285 C 295 295 275 315 268 335 C 285 325 305 315 328 305 Z" fill="#5c534d" />

    <!-- Main Torso / Body (Brown Pelican mottled grayish-brown body) -->
    <path d="M 325 272 C 345 235 400 245 425 285 C 445 320 440 375 390 380 C 350 385 320 345 325 272 Z" 
          fill="#635952" stroke="#3b342e" stroke-width="2" />
    
    <!-- Wing (Folded at side, layered plumage) -->
    <!-- Primary covert feathers -->
    <path d="M 338 275 C 380 265 425 305 405 360 C 380 365 350 345 338 275 Z" 
          fill="#4c443e" stroke="#36302c" stroke-width="1.5" />
    <!-- Wing highlight edge / silvery-grey mantle -->
    <path d="M 345 270 C 375 265 410 288 412 320 C 390 318 360 305 345 270 Z" 
          fill="#837970" opacity="0.85" />
    <path d="M 345 290 C 375 290 395 315 385 350 C 365 345 350 325 345 290 Z" 
          fill="#3b3530" />

    <!-- Majestic Neck (White back of neck, chestnut/brown front stripe of breeding plumage) -->
    <!-- Back of neck (graceful white S-curve) -->
    <path d="M 405 265 C 415 230 400 170 425 130 C 440 130 455 160 440 210 C 432 235 435 255 425 275 Z" 
          fill="#f8f9fa" stroke="#d5dcde" stroke-width="1.5" />
    <!-- Chestnut/Mahogany throat stripe -->
    <path d="M 425 155 C 438 185 430 220 422 250 C 427 252 433 248 435 238 C 442 205 448 175 435 152 Z" 
          fill="#5a2916" />

    <!-- Head and Crown (Straw-yellow crown characteristic of adult Pelecanus occidentalis) -->
    <ellipse cx="438" cy="125" rx="20" ry="16" fill="#fdfefe" />
    <!-- Golden Yellow Crown -->
    <path d="M 426 122 C 430 110 448 108 454 118 C 450 128 435 130 426 122 Z" fill="#ffd13b" stroke="#e0aa1b" stroke-width="1" />
    <!-- Nape Feathers Crest -->
    <path class="crest-flutter" d="M 424 122 C 410 124 402 135 408 148 C 418 142 422 135 425 128 Z" fill="#7a2e16" />

    <!-- Pelican Eye: Bright straw/light blue eye with dark pupil -->
    <circle cx="446" cy="122" r="5" fill="#f4ebd0" stroke="#756143" stroke-width="1" />
    <circle cx="447" cy="122" r="2.8" fill="#1b2832" />
    <circle cx="448.2" cy="120.8" r="0.9" fill="#ffffff" />

    <!-- Big Pelican Bill & Pouched Gular -->
    <!-- Massive Upper Beak (long, greyish with horn-colored nail tip hook) -->
    <path d="M 452 118 L 575 135 C 585 137 588 143 578 145 L 452 136 Z" 
          fill="#a4b2b8" stroke="#49555b" stroke-width="1.5" />
    <!-- Hook at beak tip -->
    <path d="M 575 135 Q 587 138 584 147 Q 577 146 575 141 Z" fill="#cf532b" />
    <line x1="456" y1="126" x2="574" y2="139" stroke="#5a686e" stroke-width="1.2" />

    <!-- Expansive Gular Pouch (Rich ochre/orange throat pouch) -->
    <path d="M 452 136 C 475 155 520 168 555 144 L 450 134 Z" 
          fill="url(#pouchGrad)" opacity="0.95" stroke="#a6430d" stroke-width="1.5" />
    <path d="M 452 136 Q 495 158 535 145" fill="none" stroke="#f39c12" stroke-width="1" opacity="0.6" />

    <!-- Pelican Wing/Arm reaching comfortably to Handlebars -->
    <!-- Upper arm & Forearm -->
    <path d="M 395 285 Q 465 260 525 245" fill="none" stroke="#524a44" stroke-width="14" stroke-linecap="round" />
    <!-- Wing covert feathers overlay -->
    <path d="M 390 280 Q 450 258 510 246" fill="none" stroke="#756b62" stroke-width="7" stroke-linecap="round" />
    <!-- Pelican Wingtip "Hand" gripping handlebar grip at (545, 242) -->
    <path d="M 515 246 C 528 240 546 238 550 246 C 546 253 530 256 518 252 Z" 
          fill="#322c28" stroke="#1f1a17" stroke-width="1.5" />
  </g>


  <!-- ================= FOREGROUND CRANK & NEAR LEG ================= -->
  <!-- Near Crank Assembly (Front/Right) -->
  <g class="crankset">
    <!-- Near Crank Arm (pointing down at phase 0: 450,470 -> 450,525) -->
    <line x1="450" y1="470" x2="450" y2="525" stroke="url(#metallic)" stroke-width="9" stroke-linecap="round" />
    <circle cx="450" cy="525" r="5" fill="#32373b" />
    <!-- Near Pedal (stays level via reverse rotation) -->
    <g class="pedal-counter-1">
      <rect x="430" y="520" width="40" height="9" rx="3" fill="#1e2226" stroke="#090a0a" stroke-width="1.5" />
      <line x1="435" y1="524.5" x2="465" y2="524.5" stroke="#f39c12" stroke-width="2.5" />
    </g>
  </g>

  <!-- Near Leg (Right Leg): Seated at Hip (370, 350) to Near Pedal (orbits 450, 470 R=55, phase 0 deg) -->
  <!-- Perfectly synchronized 4-point smooth kinematic cycle matching the crank arm revolution -->
  <path fill="none" stroke="#1d201e" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
      values="M 370 350 Q 455 465 450 525;
              M 370 350 Q 380 435 395 470;
              M 370 350 Q 400 375 450 415;
              M 370 350 Q 465 420 505 470;
              M 370 350 Q 455 465 450 525" />
  </path>
  <!-- Thigh Feathers highlight overlay -->
  <path fill="none" stroke="#484039" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
      values="M 370 350 Q 410 405 430 460;
              M 370 350 Q 375 395 385 435;
              M 370 350 Q 385 365 415 390;
              M 370 350 Q 415 385 450 430;
              M 370 350 Q 410 405 430 460" />
  </path>
  <!-- Near Webbed Foot clamped onto Near Pedal -->
  <path fill="#f39c12" stroke="#b95e04" stroke-width="1.5">
    <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
      values="M 428 522 L 468 517 L 477 528 L 438 528 Z;
              M 373 467 L 413 462 L 422 473 L 383 473 Z;
              M 428 412 L 468 407 L 477 418 L 438 418 Z;
              M 483 467 L 523 462 L 532 473 L 493 473 Z;
              M 428 522 L 468 517 L 477 528 L 438 528 Z" />
  </path>

  <!-- Bottom Bracket Axle Cap -->
  <circle cx="450" cy="470" r="11" fill="url(#metallic)" stroke="#1a1c1e" stroke-width="2.5" />
  <circle cx="450" cy="470" r="4" fill="#111315" />

</svg>