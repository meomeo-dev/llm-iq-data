<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="Animated California brown pelican riding a bicycle">
  <title>California brown pelican riding a bicycle</title>
  <desc>A brown pelican pedals a bicycle while both wheels and the crank rotate continuously.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9f2"/>
      <stop offset="1" stop-color="#f5d9a4"/>
    </linearGradient>
    <linearGradient id="bodyBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c5738"/>
      <stop offset="1" stop-color="#4a2d25"/>
    </linearGradient>
    <linearGradient id="wingBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a86c42"/>
      <stop offset="1" stop-color="#593528"/>
    </linearGradient>
    <style><![CDATA[
      .outline { stroke: #30201d; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .thin-outline { stroke: #30201d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .frame { fill: none; stroke: #d34d32; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .metal { fill: none; stroke: #343a40; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #66727a; stroke-width: 3; opacity: .9; }
    ]]></style>
  </defs>

  <rect width="900" height="600" fill="url(#sky)"/>
  <path d="M0 455 C170 425 270 470 430 447 C600 423 725 455 900 430 L900 600 L0 600 Z" fill="#d5b46f"/>
  <path d="M0 500 C180 470 310 515 480 488 C650 462 770 498 900 475" fill="none" stroke="#a67c4e" stroke-width="6" opacity=".55"/>
  <path d="M0 548 C170 515 320 557 505 530 C690 503 775 538 900 520" fill="none" stroke="#a67c4e" stroke-width="5" opacity=".45"/>

  <!-- Bicycle wheels -->
  <g aria-label="rear wheel">
    <circle cx="230" cy="420" r="111" fill="#f4eee1" stroke="#303840" stroke-width="11"/>
    <circle cx="230" cy="420" r="13" fill="#303840"/>
    <g>
      <path class="spoke" d="M230 420 L230 309"/>
      <path class="spoke" d="M230 420 L230 531"/>
      <path class="spoke" d="M230 420 L119 420"/>
      <path class="spoke" d="M230 420 L341 420"/>
      <path class="spoke" d="M230 420 L152 342"/>
      <path class="spoke" d="M230 420 L308 342"/>
      <path class="spoke" d="M230 420 L152 498"/>
      <path class="spoke" d="M230 420 L308 498"/>
      <path class="spoke" d="M230 420 L179 319"/>
      <path class="spoke" d="M230 420 L281 521"/>
      <path class="spoke" d="M230 420 L129 471"/>
      <path class="spoke" d="M230 420 L331 369"/>
    </g>
    <animateTransform attributeName="transform" attributeType="XML"
      type="rotate" from="0 230 420" to="360 230 420"
      dur="1.6s" repeatCount="indefinite"/>
  </g>

  <g aria-label="front wheel">
    <circle cx="700" cy="420" r="111" fill="#f4eee1" stroke="#303840" stroke-width="11"/>
    <circle cx="700" cy="420" r="13" fill="#303840"/>
    <g>
      <path class="spoke" d="M700 420 L700 309"/>
      <path class="spoke" d="M700 420 L700 531"/>
      <path class="spoke" d="M700 420 L589 420"/>
      <path class="spoke" d="M700 420 L811 420"/>
      <path class="spoke" d="M700 420 L622 342"/>
      <path class="spoke" d="M700 420 L778 342"/>
      <path class="spoke" d="M700 420 L622 498"/>
      <path class="spoke" d="M700 420 L778 498"/>
      <path class="spoke" d="M700 420 L649 319"/>
      <path class="spoke" d="M700 420 L751 521"/>
      <path class="spoke" d="M700 420 L599 471"/>
      <path class="spoke" d="M700 420 L801 369"/>
    </g>
    <animateTransform attributeName="transform" attributeType="XML"
      type="rotate" from="0 700 420" to="360 700 420"
      dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- Bicycle frame -->
  <g aria-label="bicycle frame">
    <path class="frame" d="M230 420 L380 300 L470 420 L230 420 Z"/>
    <path class="frame" d="M380 300 L600 300 L470 420 L380 300 Z"/>
    <path class="frame" d="M600 300 L700 420"/>
    <path class="frame" d="M600 300 L700 420 L690 420"/>
    <path class="frame" d="M380 300 L365 260"/>
    <path class="frame" d="M365 260 L425 260"/>
    <path class="frame" d="M600 300 L615 245"/>
    <path class="frame" d="M615 245 L665 245"/>
    <path class="frame" d="M665 245 C680 245 691 251 700 263"/>
    <path class="metal" d="M615 245 L598 220"/>
    <path class="metal" d="M598 220 L640 220"/>
    <path class="metal" d="M640 220 L665 245"/>
    <path class="metal" d="M380 300 L365 260"/>
    <path class="metal" d="M350 260 L410 260"/>
    <ellipse cx="380" cy="300" rx="52" ry="10" fill="#292326" transform="rotate(-4 380 300)"/>
    <circle cx="470" cy="420" r="18" fill="#343a40"/>
  </g>

  <!-- Crank and pedals -->
  <g aria-label="rotating crank">
    <path d="M470 420 L505 385" stroke="#303840" stroke-width="9" stroke-linecap="round"/>
    <path d="M505 385 L538 385" stroke="#303840" stroke-width="7" stroke-linecap="round"/>
    <path d="M470 420 L438 455" stroke="#303840" stroke-width="9" stroke-linecap="round"/>
    <path d="M438 455 L405 455" stroke="#303840" stroke-width="7" stroke-linecap="round"/>
    <circle cx="470" cy="420" r="9" fill="#d34d32"/>
    <animateTransform attributeName="transform" attributeType="XML"
      type="rotate" from="0 470 420" to="360 470 420"
      dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- Pelican body -->
  <g aria-label="California brown pelican">
    <ellipse cx="420" cy="245" rx="105" ry="86" fill="url(#bodyBrown)" class="outline" transform="rotate(-12 420 245)"/>
    <path d="M358 245 C385 278 439 291 494 262 C477 315 427 336 382 304 C353 284 344 262 358 245 Z"
      fill="#f1dfc2" class="thin-outline"/>
    <path d="M370 217 C390 177 441 174 477 204 C448 193 419 202 400 230 Z"
      fill="#c38a59" class="thin-outline"/>
    <path d="M403 180 C424 143 473 138 504 166 C520 181 523 204 508 224 C487 192 450 179 403 180 Z"
      fill="#714532" class="outline"/>
    <circle cx="472" cy="173" r="9" fill="#f2c34f" class="thin-outline"/>
    <circle cx="474" cy="174" r="3.5" fill="#1d1d1d"/>
    <path d="M501 195 C554 190 608 205 652 228 C613 246 559 250 500 224 Z"
      fill="#e8a956" class="outline"/>
    <path d="M548 210 C580 215 616 224 652 228 C626 239 594 240 560 234 Z"
      fill="#c97b3c" class="thin-outline"/>
    <path d="M385 210 C420 218 455 246 464 282 C425 275 393 253 375 229 Z"
      fill="url(#wingBrown)" class="outline"/>
    <path d="M395 224 C420 235 438 250 450 271" fill="none" stroke="#d79a64" stroke-width="7" opacity=".75"/>
    <path d="M414 284 C409 300 407 312 410 326" fill="none" stroke="#30201d" stroke-width="9" stroke-linecap="round"/>
    <path d="M410 326 C424 334 438 333 450 326" fill="none" stroke="#30201d" stroke-width="8" stroke-linecap="round"/>

    <!-- rear leg -->
    <g>
      <path d="M410 318 L445 369" fill="none" stroke="#d58b4c" stroke-width="16" stroke-linecap="round"/>
      <path d="M445 369 L438 455" fill="none" stroke="#d58b4c" stroke-width="13" stroke-linecap="round"/>
      <path d="M438 455 L405 455" fill="none" stroke="#e8a956" stroke-width="9" stroke-linecap="round"/>
      <animateTransform attributeName="transform" attributeType="XML"
        type="rotate" values="-25 410 318;25 410 318;-25 410 318"
        dur="1.6s" repeatCount="indefinite"/>
    </g>

    <!-- front leg -->
    <g>
      <path d="M433 318 L470 365" fill="none" stroke="#e09a56" stroke-width="16" stroke-linecap="round"/>
      <path d="M470 365 L505 385" fill="none" stroke="#e09a56" stroke-width="13" stroke-linecap="round"/>
      <path d="M505 385 L538 385" fill="none" stroke="#f0b765" stroke-width="9" stroke-linecap="round"/>
      <animateTransform attributeName="transform" attributeType="XML"
        type="rotate" values="25 433 318;-25 433 318;25 433 318"
        dur="1.6s" repeatCount="indefinite"/>
    </g>

    <path d="M377 315 C390 326 407 333 425 333" fill="none" stroke="#30201d" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="470" cy="540" rx="340" ry="21" fill="#6f543d" opacity=".28"/>
</svg>