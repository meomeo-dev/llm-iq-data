<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">California brown pelican riding a bicycle</title>
  <desc id="desc">A brown pelican pedals a red bicycle with smoothly rotating spoked wheels and crank.</desc>

  <defs>
    <g id="wheel">
      <circle r="91" fill="#f5f0e5" stroke="#263746" stroke-width="8"/>
      <circle r="82" fill="none" stroke="#84949a" stroke-width="2"/>
      <g stroke="#71818a" stroke-width="2">
        <path d="M0-82V82M-82 0H82M-58-58L58 58M58-58L-58 58"/>
        <path d="M-31-76L31 76M31-76L-31 76M-76-31L76 31M76-31L-76 31"/>
        <path d="M-76-31L76 31M-76 31L76-31M-31-76L31 76M31-76L-31 76"/>
      </g>
      <circle r="10" fill="#d44d35" stroke="#263746" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
    </g>
  </defs>

  <rect width="800" height="520" fill="#dcecf0"/>
  <path d="M0 383H800V520H0Z" fill="#e9e2cf"/>
  <path d="M0 383H800" stroke="#879b87" stroke-width="4"/>
  <circle cx="680" cy="93" r="42" fill="#eab85e"/>

  <g fill="none" stroke="#bd4938" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 330L330 330L405 205L190 330"/>
    <path d="M330 330L468 330L405 205"/>
    <path d="M405 205L486 205"/>
    <path d="M190 330L167 187M146 187H190"/>
    <path d="M461 205L484 174Q489 169 497 173L505 180"/>
  </g>
  <path d="M228 183H286Q293 183 293 190V198H218V190Q218 183 228 183Z" fill="#263746"/>
  <path d="M406 205L428 173H464" fill="none" stroke="#263746" stroke-width="7" stroke-linecap="round"/>
  <path d="M448 171H472" stroke="#263746" stroke-width="8" stroke-linecap="round"/>

  <g transform="translate(190 330)">
    <use href="#wheel"/>
  </g>
  <g transform="translate(468 330)">
    <use href="#wheel"/>
  </g>

  <g transform="translate(330 330)" stroke="#263746" stroke-linecap="round">
    <circle r="13" fill="#f5f0e5" stroke-width="5"/>
    <g stroke-width="7">
      <path d="M0 0L0-39"/>
      <path d="M0 0L0 39"/>
    </g>
    <g stroke="#d44d35" stroke-width="8" stroke-linecap="round">
      <path d="M0-39H26"/>
      <path d="M0 39H-26"/>
    </g>
    <g fill="#263746" stroke="none">
      <rect x="18" y="-44" width="19" height="10" rx="3"/>
      <rect x="-37" y="34" width="19" height="10" rx="3"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Seated pelican, with its feet tracking the two rotating pedals. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Tail feathers -->
    <path d="M300 147Q260 130 246 146Q274 151 296 163Z" fill="#604334" stroke="#3d302a" stroke-width="4"/>
    <path d="M299 153Q264 151 253 169Q279 165 303 166Z" fill="#76513b" stroke="#3d302a" stroke-width="4"/>

    <!-- Body -->
    <path d="M296 113Q332 87 371 103Q398 114 396 148Q392 181 351 193Q315 198 293 170Q278 147 296 113Z" fill="#79543d" stroke="#3d302a" stroke-width="5"/>
    <path d="M308 143Q337 120 371 133Q380 137 382 150Q360 153 344 173Q324 180 309 162Z" fill="#d8d0b8" stroke="#6a5445" stroke-width="3"/>
    <path d="M328 116Q347 106 369 118Q350 122 339 138Q327 132 328 116Z" fill="#543d32" stroke="none"/>

    <!-- Neck and head -->
    <path d="M339 126Q347 101 365 82Q379 67 396 73Q408 81 398 98Q390 108 382 129L371 145" fill="none" stroke="#6c4936" stroke-width="21"/>
    <path d="M365 85Q362 63 379 47Q395 33 414 43Q429 52 421 70Q412 85 393 91Z" fill="#81583e" stroke="#3d302a" stroke-width="4"/>
    <path d="M404 70Q429 72 460 85Q468 90 459 96Q434 100 398 88Z" fill="#d59b43" stroke="#7e562b" stroke-width="4"/>
    <path d="M412 86Q438 96 455 105Q461 111 455 116Q436 113 405 96Z" fill="#d36d49" stroke="#8b4937" stroke-width="3"/>
    <circle cx="406" cy="55" r="4" fill="#fff6e6"/>
    <circle cx="407" cy="55" r="2" fill="#263746" stroke="none"/>

    <!-- Hips and legs: paired leg cycles are timed with the crank. -->
    <path d="M345 178Q330 207 330 245" fill="none" stroke="#d59b43" stroke-width="12"/>
    <path d="M330 245L330 291Q330 310 330 330" fill="none" stroke="#d59b43" stroke-width="10"/>
    <path d="M330 330L355 330" fill="none" stroke="#d36d49" stroke-width="8"/>
    <path d="M355 330L367 330" fill="none" stroke="#263746" stroke-width="5"/>
    <animateTransform attributeName="transform" type="rotate" values="-8 330 178;8 330 178;-8 330 178" dur="2s" repeatCount="indefinite"/>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M342 177Q366 194 372 218L348 260" fill="none" stroke="#d59b43" stroke-width="11"/>
    <path d="M348 260L330 291L330 330" fill="none" stroke="#d59b43" stroke-width="10"/>
    <path d="M330 330L305 330" fill="none" stroke="#d36d49" stroke-width="8"/>
    <path d="M305 330L293 330" fill="none" stroke="#263746" stroke-width="5"/>
    <animateTransform attributeName="transform" type="rotate" values="8 330 178;-8 330 178;8 330 178" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Front leg and wing resting naturally over the frame. -->
  <path d="M358 179Q388 197 411 207" fill="none" stroke="#d59b43" stroke-width="9" stroke-linecap="round"/>
  <path d="M411 207L421 205" fill="none" stroke="#d36d49" stroke-width="7" stroke-linecap="round"/>
  <path d="M305 126Q334 105 360 125Q339 142 314 157Q301 151 305 126Z" fill="#654535" stroke="#3d302a" stroke-width="3"/>

  <path d="M90 422H710" stroke="#b0a78f" stroke-width="3"/>
  <path d="M120 422l-10 14m70-14-10 14m430-14-10 14m70-14-10 14" stroke="#b0a78f" stroke-width="3"/>
</svg>