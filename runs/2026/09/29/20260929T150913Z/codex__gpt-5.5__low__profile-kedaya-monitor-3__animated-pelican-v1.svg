<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Animated California brown pelican riding a bicycle</title>
  <desc id="desc">A California brown pelican pedals a bicycle while both wheels and the crank rotate continuously.</desc>

  <rect width="800" height="600" fill="#f4efe6"/>

  <g stroke="#252b31" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rotating rear wheel -->
    <g>
      <circle cx="190" cy="430" r="82" fill="#d8dde0" stroke-width="8"/>
      <g stroke="#7e8b91" stroke-width="2">
        <line x1="190" y1="430" x2="190" y2="348"/>
        <line x1="190" y1="430" x2="190" y2="512"/>
        <line x1="190" y1="430" x2="108" y2="430"/>
        <line x1="190" y1="430" x2="272" y2="430"/>
        <line x1="190" y1="430" x2="132" y2="372"/>
        <line x1="190" y1="430" x2="248" y2="372"/>
        <line x1="190" y1="430" x2="132" y2="488"/>
        <line x1="190" y1="430" x2="248" y2="488"/>
      </g>
      <circle cx="190" cy="430" r="7" fill="#252b31" stroke="none"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 190 430" to="360 190 430" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- Rotating front wheel -->
    <g>
      <circle cx="600" cy="430" r="82" fill="#d8dde0" stroke-width="8"/>
      <g stroke="#7e8b91" stroke-width="2">
        <line x1="600" y1="430" x2="600" y2="348"/>
        <line x1="600" y1="430" x2="600" y2="512"/>
        <line x1="600" y1="430" x2="518" y2="430"/>
        <line x1="600" y1="430" x2="682" y2="430"/>
        <line x1="600" y1="430" x2="542" y2="372"/>
        <line x1="600" y1="430" x2="658" y2="372"/>
        <line x1="600" y1="430" x2="542" y2="488"/>
        <line x1="600" y1="430" x2="658" y2="488"/>
      </g>
      <circle cx="600" cy="430" r="7" fill="#252b31" stroke="none"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 600 430" to="360 600 430" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- Bicycle frame -->
    <g fill="none" stroke="#c45132" stroke-width="12">
      <path d="M190 430 L300 300 L405 430 L190 430 Z"/>
      <path d="M300 300 L520 320 L405 430 Z"/>
      <path d="M405 430 L520 320 L600 430"/>
    </g>

    <!-- Head tube and fork -->
    <path d="M520 320 L540 430 L600 430" fill="none" stroke="#c45132" stroke-width="12"/>
    <path d="M520 320 L505 270" fill="none" stroke="#252b31" stroke-width="9"/>

    <!-- Handlebar -->
    <path d="M505 270 C510 245 532 238 558 246 L590 260 C603 266 604 279 593 287"
      fill="none" stroke="#252b31" stroke-width="9"/>
    <path d="M558 246 L582 232" fill="none" stroke="#252b31" stroke-width="8"/>

    <!-- Seat post and saddle -->
    <path d="M300 300 L292 255" fill="none" stroke="#252b31" stroke-width="8"/>
    <path d="M260 250 Q292 237 325 250" fill="none" stroke="#252b31" stroke-width="12"/>

    <!-- Chain -->
    <ellipse cx="297" cy="430" rx="35" ry="12" fill="none" stroke="#707b80" stroke-width="3"/>
    <path d="M297 418 L405 418 M297 442 L405 442" fill="none" stroke="#707b80" stroke-width="3"/>

    <!-- Crank and pedals -->
    <g>
      <circle cx="405" cy="430" r="11" fill="#252b31" stroke="none"/>
      <g stroke="#252b31" stroke-width="8">
        <line x1="405" y1="430" x2="405" y2="348"/>
        <line x1="405" y1="430" x2="405" y2="512"/>
      </g>
      <g fill="none" stroke="#252b31" stroke-width="7">
        <path d="M392 348 H418"/>
        <path d="M392 512 H418"/>
      </g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 405 430" to="360 405 430" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- Pelican body -->
    <g>
      <ellipse cx="310" cy="205" rx="78" ry="96" fill="#765044" stroke-width="5"/>
      <path d="M265 175 C250 214 258 278 303 300 C340 318 373 292 374 247 C375 205 351 176 315 163 Z"
        fill="#8d6250" stroke-width="5"/>
      <path d="M278 250 C300 269 329 275 355 264" fill="none" stroke="#b8876b" stroke-width="10"/>

      <!-- White neck -->
      <path d="M300 160 C286 126 294 91 321 74 C346 58 380 70 387 99 C394 126 373 150 350 166"
        fill="#f4f0e7" stroke-width="5"/>

      <!-- Head -->
      <ellipse cx="351" cy="76" rx="48" ry="42" fill="#785347" stroke-width="5"/>
      <circle cx="369" cy="67" r="6" fill="#171b1e" stroke="none"/>

      <!-- Beak and pouch -->
      <path d="M383 83 C444 82 493 101 526 119 C487 140 435 142 388 116 Z"
        fill="#b88039" stroke-width="5"/>
      <path d="M389 113 C430 137 474 137 510 121 C477 167 422 165 382 125 Z"
        fill="#d9a768" stroke-width="5"/>
      <path d="M392 115 C430 120 465 122 506 119" fill="none" stroke="#7e552d" stroke-width="3"/>

      <!-- Wing -->
      <path d="M265 173 C303 151 350 174 360 218 C347 242 315 245 286 225 Z"
        fill="#63453d" stroke-width="5"/>
      <path d="M284 185 C310 199 329 214 344 231" fill="none" stroke="#a87962" stroke-width="5"/>

      <!-- Tail -->
      <path d="M255 254 L205 281 L270 284" fill="#63453d" stroke-width="5"/>

      <!-- Pelican legs, animated in phase with crank -->
      <g fill="none" stroke="#d18d43" stroke-width="12">
        <path d="M278 302 Q334 350 405 512">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
            calcMode="spline"
            keyTimes="0;0.25;0.5;0.75;1"
            keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
            values="M278 302 Q334 350 405 512;
                    M278 302 Q350 335 447 430;
                    M278 302 Q325 325 405 348;
                    M278 302 Q300 350 363 430;
                    M278 302 Q334 350 405 512"/>
        </path>
        <path d="M321 302 Q350 340 405 348">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
            calcMode="spline"
            keyTimes="0;0.25;0.5;0.75;1"
            keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
            values="M321 302 Q350 340 405 348;
                    M321 302 Q300 350 363 430;
                    M321 302 Q350 325 405 512;
                    M321 302 Q370 335 447 430;
                    M321 302 Q350 340 405 348"/>
        </path>
      </g>

      <!-- Feet remain visually attached to revolving pedals -->
      <g fill="none" stroke="#d18d43" stroke-width="9">
        <path d="M397 505 L428 512">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
            calcMode="spline"
            keyTimes="0;0.25;0.5;0.75;1"
            keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
            values="M397 505 L428 512;
                    M438 423 L465 430;
                    M397 341 L428 348;
                    M356 423 L383 430;
                    M397 505 L428 512"/>
        </path>
        <path d="M397 341 L428 348">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
            calcMode="spline"
            keyTimes="0;0.25;0.5;0.75;1"
            keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
            values="M397 341 L428 348;
                    M356 423 L383 430;
                    M397 505 L428 512;
                    M438 423 L465 430;
                    M397 341 L428 348"/>
        </path>
      </g>
    </g>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="400" cy="520" rx="275" ry="16" fill="#c8c0b4" opacity="0.45"/>
</svg>