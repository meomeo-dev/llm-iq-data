<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Sky & Scenery Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#72bde8"/>
      <stop offset="50%" stop-color="#bce3f5"/>
      <stop offset="78%" stop-color="#fcedc7"/>
      <stop offset="100%" stop-color="#f5caa6"/>
    </linearGradient>

    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a7b9b"/>
      <stop offset="100%" stop-color="#194f68"/>
    </linearGradient>

    <!-- Bicycle & Metal Gradients -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9381e"/>
      <stop offset="50%" stop-color="#ff5733"/>
      <stop offset="100%" stop-color="#c0290f"/>
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6dadf"/>
      <stop offset="50%" stop-color="#8a95a5"/>
      <stop offset="100%" stop-color="#565f6d"/>
    </linearGradient>

    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="90%" stop-color="#silver" stop-opacity="0"/>
      <stop offset="92%" stop-color="#e0e8f0"/>
      <stop offset="100%" stop-color="#88929e"/>
    </radialGradient>

    <!-- Pelican Gradients -->
    <linearGradient id="pelicanBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#6e5849"/>
      <stop offset="45%" stop-color="#534034"/>
      <stop offset="100%" stop-color="#30241d"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e08244"/>
      <stop offset="70%" stop-color="#be5422"/>
      <stop offset="100%" stop-color="#7d3110"/>
    </linearGradient>

    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffd054"/>
      <stop offset="70%" stop-color="#f0902a"/>
      <stop offset="100%" stop-color="#b83812"/>
    </linearGradient>

    <!-- Wheel Definition (Center at 0,0 for clean rotation) -->
    <g id="bicycleWheel">
      <!-- Tire Rubber -->
      <circle cx="0" cy="0" r="108" fill="none" stroke="#252526" stroke-width="15"/>
      <circle cx="0" cy="0" r="113" fill="none" stroke="#181819" stroke-width="3" stroke-dasharray="6,4"/>
      <!-- Rim -->
      <circle cx="0" cy="0" r="101" fill="none" stroke="url(#metalGrad)" stroke-width="7"/>
      <circle cx="0" cy="0" r="97.5" fill="none" stroke="#485361" stroke-width="1.5"/>
      <!-- 16 Radial & Cross Spokes -->
      <g stroke="#bcc5cf" stroke-width="1.6" opacity="0.85">
        <line x1="0" y1="-98" x2="0" y2="98"/>
        <line x1="-98" y1="0" x2="98" y2="0"/>
        <line x1="-69.3" y1="-69.3" x2="69.3" y2="69.3"/>
        <line x1="-69.3" y1="69.3" x2="69.3" y2="-69.3"/>
        <line x1="-37.5" y1="-90.5" x2="37.5" y2="90.5"/>
        <line x1="37.5" y1="-90.5" x2="-37.5" y2="90.5"/>
        <line x1="-90.5" y1="-37.5" x2="90.5" y2="37.5"/>
        <line x1="-90.5" y1="37.5" x2="90.5" y2="-37.5"/>
      </g>
      <!-- Hub -->
      <circle cx="0" cy="0" r="15" fill="url(#metalGrad)"/>
      <circle cx="0" cy="0" r="7" fill="#1b2026"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.6"/>
    </g>
  </defs>

  <style><![CDATA[
    /* Smooth CSS Keyframe Animations */
    @keyframes wheelRoll {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes crankCycle {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterPedal {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes pelicanBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25%      { transform: translateY(-3px) rotate(0.4deg); }
      50%      { transform: translateY(1px) rotate(0deg); }
      75%      { transform: translateY(-2px) rotate(-0.3deg); }
    }
    @keyframes rightLegMotion {
      0%   { transform: rotate(10deg); }
      25%  { transform: rotate(26deg); }
      50%  { transform: rotate(4deg); }
      75%  { transform: rotate(-16deg); }
      100% { transform: rotate(10deg); }
    }
    @keyframes rightShinMotion {
      0%   { transform: rotate(-18deg); }
      25%  { transform: rotate(10deg); }
      50%  { transform: rotate(24deg); }
      75%  { transform: rotate(-6deg); }
      100% { transform: rotate(-18deg); }
    }
    @keyframes leftLegMotion {
      0%   { transform: rotate(4deg); }
      25%  { transform: rotate(-16deg); }
      50%  { transform: rotate(10deg); }
      75%  { transform: rotate(26deg); }
      100% { transform: rotate(4deg); }
    }
    @keyframes leftShinMotion {
      0%   { transform: rotate(24deg); }
      25%  { transform: rotate(-6deg); }
      50%  { transform: rotate(-18deg); }
      75%  { transform: rotate(10deg); }
      100% { transform: rotate(24deg); }
    }

    /* Assigning Animation Classes */
    .wheel-rotate {
      animation: wheelRoll 1.6s linear infinite;
    }
    .crank-rotate {
      animation: crankCycle 1.6s linear infinite;
      transform-origin: 510px 485px;
    }
    .counter-pedal {
      animation: counterPedal 1.6s linear infinite;
    }
    .pelican-rider {
      animation: pelicanBob 1.6s ease-in-out infinite;
      transform-origin: 430px 310px;
    }
    .anim-r-thigh {
      animation: rightLegMotion 1.6s ease-in-out infinite;
      transform-origin: 450px 355px;
    }
    .anim-r-shin {
      animation: rightShinMotion 1.6s ease-in-out infinite;
      transform-origin: 498px 432px;
    }
    .anim-l-thigh {
      animation: leftLegMotion 1.6s ease-in-out infinite;
      transform-origin: 442px 352px;
    }
    .anim-l-shin {
      animation: leftShinMotion 1.6s ease-in-out infinite;
      transform-origin: 478px 425px;
    }
    .ocean-wave {
      animation: waveShift 4s ease-in-out infinite alternate;
    }
    @keyframes waveShift {
      from { transform: translateX(0px); }
      to   { transform: translateX(-30px); }
    }
  ]]></style>

  <!-- ================= BACKGROUND & ENVIRONMENT ================= -->
  <rect x="0" y="0" width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Coastal Sun -->
  <circle cx="780" cy="180" r="65" fill="#fff5d0" opacity="0.6"/>
  <circle cx="780" cy="180" r="85" fill="#fce4a6" opacity="0.3"/>

  <!-- Pacific Ocean & Horizon -->
  <path d="M0,450 Q250,442 500,448 T1000,445 L1000,650 L0,650 Z" fill="url(#oceanGrad)"/>
  <!-- Shoreline Waves -->
  <g class="ocean-wave" opacity="0.4" stroke="#ffffff" stroke-width="2.5" fill="none">
    <path d="M-50,460 C150,450 350,470 550,458 C750,448 950,466 1100,458"/>
    <path d="M-50,478 C120,468 380,488 600,475 C800,465 980,482 1100,474"/>
  </g>

  <!-- Wooden Pier Ground -->
  <rect x="0" y="565" width="1000" height="85" fill="#69513d"/>
  <rect x="0" y="565" width="1000" height="12" fill="#876b53"/>
  <!-- Pier Planks Markings -->
  <g stroke="#483728" stroke-width="2.5" opacity="0.75">
    <line x1="80" y1="565" x2="80" y2="650"/>
    <line x1="170" y1="565" x2="170" y2="650"/>
    <line x1="260" y1="565" x2="260" y2="650"/>
    <line x1="350" y1="565" x2="350" y2="650"/>
    <line x1="440" y1="565" x2="440" y2="650"/>
    <line x1="530" y1="565" x2="530" y2="650"/>
    <line x1="620" y1="565" x2="620" y2="650"/>
    <line x1="710" y1="565" x2="710" y2="650"/>
    <line x1="800" y1="565" x2="800" y2="650"/>
    <line x1="890" y1="565" x2="890" y2="650"/>
    <line x1="980" y1="565" x2="980" y2="650"/>
  </g>

  <!-- Distant Pier Railing -->
  <g stroke="#a68a70" stroke-width="5" opacity="0.6">
    <line x1="0" y1="490" x2="1000" y2="490"/>
    <line x1="0" y1="525" x2="1000" y2="525"/>
    <!-- Posts -->
    <path d="M70,480 L70,565 M210,480 L210,565 M350,480 L350,565 M490,480 L490,565 M630,480 L630,565 M770,480 L770,565 M910,480 L910,565" stroke-width="8"/>
  </g>

  <!-- Bicycle Ground Shadow -->
  <ellipse cx="505" cy="580" rx="340" ry="16" fill="#2c1d11" opacity="0.35"/>


  <!-- ================= BICYCLE LAYER (REAR) ================= -->
  <!-- Left/Far Pedal Assembly (180 deg out of phase from right pedal) -->
  <g class="crank-rotate">
    <!-- Far Crank Arm (pointing up/left at 0 deg) -->
    <line x1="510" y1="485" x2="475" y2="445" stroke="#485361" stroke-width="9" stroke-linecap="round"/>
    <!-- Far Pedal Spindle & Body -->
    <g transform="translate(475, 445)">
      <g class="counter-pedal">
        <rect x="-14" y="-5" width="28" height="10" rx="3" fill="#22252a"/>
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#88929e" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- Left/Far Leg (behind bike frame & body) -->
  <g class="pelican-rider">
    <g class="anim-l-thigh">
      <!-- Upper Leg -->
      <path d="M442,352 Q468,390 478,425" fill="none" stroke="#7a5528" stroke-width="12" stroke-linecap="round"/>
      <g class="anim-l-shin">
        <!-- Shin -->
        <path d="M478,425 L475,445" fill="none" stroke="#a37336" stroke-width="8" stroke-linecap="round"/>
        <!-- Webbed Foot resting on pedal -->
        <path d="M475,445 L453,447 L460,453 L477,449 Z" fill="#443525"/>
      </g>
    </g>
  </g>

  <!-- REAR WHEEL: Axle at (260, 485) -->
  <g transform="translate(260, 485)">
    <g class="wheel-rotate">
      <use href="#bicycleWheel"/>
    </g>
  </g>

  <!-- FRONT WHEEL: Axle at (750, 485) -->
  <g transform="translate(750, 485)">
    <g class="wheel-rotate">
      <use href="#bicycleWheel"/>
    </g>
  </g>

  <!-- ================= BICYCLE MAIN FRAME ================= -->
  <!-- Diamond Frame Geometry:
       Rear Dropouts: (260, 485)
       Bottom Bracket (BB): (510, 485)
       Seat Lug: (430, 315)
       Head Tube Bottom: (680, 335), Head Tube Top: (665, 275)
       Front Dropouts/Fork End: (750, 485)
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear Triangle: Chain stays & Seat stays -->
    <path d="M260,485 L510,485" stroke="#94200c" stroke-width="10"/> <!-- Chainstay -->
    <path d="M260,485 L430,315" stroke="url(#frameGrad)" stroke-width="9"/> <!-- Seatstay -->

    <!-- Main Triangle -->
    <path d="M510,485 L430,315" stroke="url(#frameGrad)" stroke-width="12"/> <!-- Seat Tube -->
    <path d="M510,485 L675,325" stroke="url(#frameGrad)" stroke-width="13"/> <!-- Down Tube -->
    <path d="M430,315 L665,275" stroke="url(#frameGrad)" stroke-width="11"/> <!-- Top Tube -->

    <!-- Front Fork & Steerer -->
    <path d="M665,275 L680,335" stroke="url(#frameGrad)" stroke-width="14"/> <!-- Head Tube -->
    <path d="M680,335 L750,485" stroke="url(#frameGrad)" stroke-width="9"/> <!-- Front Fork -->

    <!-- Drive Chain -->
    <path d="M260,485 C320,472 440,472 510,473 C440,497 320,497 260,485 Z" 
          stroke="#252a30" stroke-width="4.5" fill="none" stroke-dasharray="7,3"/>

    <!-- Handlebar Stem & Swept Cruiser Bar -->
    <path d="M665,275 L657,225" stroke="url(#metalGrad)" stroke-width="9"/> <!-- Quill Stem -->
    <path d="M657,225 Q640,223 625,235 Q615,245 610,265" stroke="url(#metalGrad)" stroke-width="8"/> <!-- Handlebar -->
    <!-- Rubber Handlebar Grip -->
    <path d="M613,253 L609,268" stroke="#1f2329" stroke-width="11" stroke-linecap="round"/>

    <!-- Seat Post & Cruiser Saddle -->
    <line x1="430" y1="315" x2="422" y2="280" stroke="url(#metalGrad)" stroke-width="8"/>
    <!-- Saddle Body -->
    <path d="M380,277 C395,268 440,268 458,280 C445,290 415,292 380,277 Z" fill="#2a1f18" stroke="#150f0b" stroke-width="2"/>
    <!-- Saddle Spring Support -->
    <path d="M395,283 Q405,295 415,285" stroke="url(#metalGrad)" stroke-width="4" fill="none"/>
  </g>


  <!-- ================= BICYCLE CRANKSET (FOREGROUND) ================= -->
  <!-- Bottom Bracket Axle at (510, 485) -->
  <g class="crank-rotate">
    <!-- Large Front Chainring / Sprocket -->
    <circle cx="510" cy="485" r="28" fill="url(#metalGrad)" stroke="#39414d" stroke-width="2"/>
    <circle cx="510" cy="485" r="16" fill="#1b2026"/>
    <!-- Sprocket Cutouts -->
    <circle cx="510" cy="465" r="4.5" fill="#fcedc7"/>
    <circle cx="527" cy="477" r="4.5" fill="#fcedc7"/>
    <circle cx="523" cy="499" r="4.5" fill="#fcedc7"/>
    <circle cx="497" cy="499" r="4.5" fill="#fcedc7"/>
    <circle cx="493" cy="477" r="4.5" fill="#fcedc7"/>

    <!-- Right/Near Crank Arm (pointing down/right at 0 deg, 55px length) -->
    <line x1="510" y1="485" x2="545" y2="525" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="510" cy="485" r="7" fill="#2d333b"/>

    <!-- Right Pedal (stays horizontal via counter-rotation) -->
    <g transform="translate(545, 525)">
      <g class="counter-pedal">
        <!-- Pedal Axle Cap -->
        <circle cx="0" cy="0" r="4" fill="#667280"/>
        <!-- Pedal Platform -->
        <rect x="-16" y="-6" width="32" height="12" rx="3.5" fill="#1b1c1e" stroke="#525c68" stroke-width="1.5"/>
        <!-- Pedal Amber Reflector -->
        <rect x="-9" y="-2" width="18" height="4" rx="1" fill="#f39c12"/>
      </g>
    </g>
  </g>


  <!-- ================= THE PELICAN (RIDER) ================= -->
  <g class="pelican-rider">
    <!-- Tail Feathers -->
    <path d="M340,325 C310,335 295,350 315,360 C335,368 365,345 375,335 Z" fill="#3a2e26" stroke="#251c16" stroke-width="1.5"/>
    <path d="M350,330 C325,345 310,365 330,370 C348,373 375,350 385,338 Z" fill="#4d3e33"/>

    <!-- Main Torso & Body -->
    <!-- California brown pelicans have a rich grayish-brown body with silver-streaked mantle -->
    <path d="M365,330 C360,285 410,230 460,230 C500,230 520,270 510,315 C500,360 455,375 410,370 C380,368 367,355 365,330 Z" 
          fill="url(#pelicanBody)" stroke="#221913" stroke-width="2"/>
    
    <!-- Feather Texture / Wing Coverts on Body -->
    <path d="M405,275 C425,260 465,265 480,290 C490,310 475,345 440,355 C410,365 390,340 395,310 Z" 
          fill="#44352b" opacity="0.75"/>
    <path d="M420,290 Q450,295 465,325" stroke="#837263" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M405,310 Q435,315 450,345" stroke="#837263" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Pelican Neck (S-curve characteristic of Pelecanus occidentalis) -->
    <!-- Dark rich chestnut brown hindneck in breeding plumage -->
    <path d="M480,245 C495,220 500,165 520,135 C535,115 565,100 585,112 C598,120 600,135 590,155 C575,185 540,210 525,250 Z" 
          fill="#3b2b22" stroke="#221913" stroke-width="1.5"/>
    <!-- White / Pale Yellow Stripe along Neck Side -->
    <path d="M570,118 C580,125 575,150 560,175 C545,200 515,225 500,250 L488,245 C508,215 538,190 550,168 C562,145 565,125 558,118 Z" 
          fill="#f7f2dc" opacity="0.95"/>

    <!-- Pelican Head -->
    <!-- Yellow/Straw crest on crown -->
    <path d="M570,115 C565,95 585,75 615,75 C635,75 650,90 648,110 C640,128 610,135 585,128 Z" fill="#fae896"/>
    <!-- Head Nape Tufts -->
    <path d="M570,105 C555,100 545,108 550,118 C558,122 568,118 575,112 Z" fill="#dfbe61"/>

    <!-- Pelican Eye -->
    <circle cx="625" cy="98" r="6" fill="#0d1b2a"/>
    <circle cx="627" cy="96" r="2" fill="#ffffff"/>
    <!-- Eye Ring (Light blue / pinkish bare skin around eye) -->
    <circle cx="625" cy="98" r="8.5" fill="none" stroke="#7eb8da" stroke-width="2"/>

    <!-- Huge Beak & Gular Pouch -->
    <!-- Huge Distensible Gular Pouch -->
    <path d="M635,115 C660,150 710,195 765,155 C778,145 770,128 750,122 Z" 
          fill="url(#pouchGrad)" stroke="#682506" stroke-width="1.8"/>
    <!-- Pouch Vascular Texture Lines -->
    <path d="M660,128 Q700,168 745,140" fill="none" stroke="#e67e22" stroke-width="1.2" opacity="0.6"/>
    <path d="M675,125 Q715,160 755,133" fill="none" stroke="#e67e22" stroke-width="1.2" opacity="0.6"/>

    <!-- Upper Mandible (Long beak with hooked tip) -->
    <path d="M630,102 L795,122 C810,124 815,129 808,133 C795,136 785,130 770,127 L635,115 Z" 
          fill="url(#billGrad)" stroke="#6e2508" stroke-width="1.5"/>
    <!-- Hook at tip of beak (nail) -->
    <path d="M800,123 Q812,126 806,136 Q800,133 798,127 Z" fill="#7a1f09"/>
    <!-- Culmen Ridge -->
    <line x1="632" y1="104" x2="798" y2="124" stroke="#fff1a8" stroke-width="2"/>

    <!-- Pelican Wing (Bent forward, holding handlebar) -->
    <!-- Shoulder & Upper Arm -->
    <path d="M430,270 C465,245 520,240 550,265 C565,278 570,300 550,315 C525,325 480,310 445,310 Z" 
          fill="#534033" stroke="#2a1f18" stroke-width="2"/>
    <!-- Forearm extending down to handlebar -->
    <path d="M550,265 C575,260 600,250 610,258 C615,264 610,275 595,285 C575,298 545,305 535,300 Z" 
          fill="#3b2b22"/>
    <!-- Wing Flight Feathers wrapping around Handlebar Grip -->
    <path d="M598,252 C610,250 619,255 617,264 C613,275 604,277 594,273 Z" fill="#241b15" stroke="#130e0b" stroke-width="1.5"/>
    <path d="M604,257 C615,257 622,263 618,272 C614,279 607,279 598,275 Z" fill="#1b140f"/>

    <!-- Stylish Coast Cap (Casual coastal vibe) -->
    <path d="M580,82 C595,68 625,68 642,78 L665,82 C670,84 668,89 655,89 L635,87 C625,89 590,92 580,82 Z" fill="#1b4965"/>
    <ellipse cx="612" cy="77" rx="22" ry="7" fill="#2b698b"/>

    <!-- Right/Near Leg (pedaling front cycle) -->
    <!-- Hip Joint at (450, 355) -->
    <g class="anim-r-thigh">
      <!-- Muscular Thigh -->
      <path d="M450,355 Q485,395 498,432" fill="none" stroke="#8a6130" stroke-width="15" stroke-linecap="round"/>
      <path d="M448,355 Q478,390 492,425" fill="none" stroke="#a47842" stroke-width="7" stroke-linecap="round"/>
      
      <!-- Knee to Ankle / Tarsus -->
      <g class="anim-r-shin">
        <!-- Bare Leg / Tarsus (scaled dark yellowish-gray) -->
        <path d="M498,432 L545,525" fill="none" stroke="#bf8b43" stroke-width="9" stroke-linecap="round"/>
        <path d="M501,438 L543,520" fill="none" stroke="#e0aa57" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Large Webbed Pelican Foot on Pedal (Ankle at 545, 525) -->
        <!-- Big Totipalmate Foot firmly planted on pedal platform -->
        <g transform="translate(545, 525)">
          <path d="M-10,-5 L22,-5 C32,2 30,12 18,14 L-12,8 Z" fill="#36291a" stroke="#1e160e" stroke-width="1.5"/>
          <!-- Three Large Webbed Toes & Claws pointing forward -->
          <path d="M12,-5 L35,-1 L25,6 L32,10 L18,13" fill="#4d3b27" stroke="#22180d" stroke-width="1.2"/>
          <!-- Long Curved Claws -->
          <path d="M35,-1 L39,2 L34,4 M32,10 L36,13 L31,14" stroke="#120c06" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

</svg>