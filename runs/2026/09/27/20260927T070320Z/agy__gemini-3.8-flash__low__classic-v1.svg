<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <!-- Ground / Path Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="10%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#3f6212" />
    </linearGradient>

    <!-- Road / Track Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Bicycle Frame Gradient (Vintage Teal) -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- Metallic Chrome Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Tire Gradient -->
    <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
      <stop offset="80%" stop-color="#334155" />
      <stop offset="90%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Pelican Pouch Gradient -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Pelican Body Gradient -->
    <linearGradient id="pelicanBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
    
    <!-- Cast Shadow under Wheels -->
    <filter id="groundShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <!-- Reusable Spoke Def -->
    <g id="wheelSpokes">
      <line x1="0" y1="-75" x2="0" y2="75" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>
      <line x1="-75" y1="0" x2="75" y2="0" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>
      <line x1="-53" y1="-53" x2="53" y2="53" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>
      <line x1="-53" y1="53" x2="53" y2="-53" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>
      <line x1="-28" y1="-69" x2="28" y2="69" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>
      <line x1="-69" y1="-28" x2="69" y2="28" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>
      <line x1="-69" y1="28" x2="69" y2="-28" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>
      <line x1="-28" y1="69" x2="28" y2="-69" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- Fully Assembled Wheel -->
    <g id="bicycleWheel">
      <!-- Outer Rubber Tire -->
      <circle cx="0" cy="0" r="85" fill="none" stroke="url(#tireGrad)" stroke-width="16" />
      <!-- Inner Rim -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="url(#metalGrad)" stroke-width="3" />
      <!-- Spokes -->
      <use href="#wheelSpokes" />
      <!-- Wheel Hub -->
      <circle cx="0" cy="0" r="9" fill="url(#metalGrad)" />
      <circle cx="0" cy="0" r="4" fill="#475569" />
    </g>
  </defs>

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)" />

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.75">
    <path d="M 90,130 Q 110,100 140,110 Q 170,90 200,110 Q 230,110 240,130 Q 250,150 230,170 Q 200,180 120,170 Q 80,160 90,130 Z" />
    <path d="M 600,90 Q 620,70 650,80 Q 670,60 700,75 Q 730,75 735,95 Q 750,110 730,125 Q 700,135 640,130 Q 590,120 600,90 Z" opacity="0.6" />
  </g>

  <!-- Distant Hills -->
  <path d="M -50,480 Q 120,380 320,440 T 700,430 Q 770,440 850,460 L 850,600 L -50,600 Z" fill="#86efac" opacity="0.7" />
  <path d="M -20,470 Q 180,410 380,460 T 820,450 L 850,600 L -50,600 Z" fill="#4ade80" opacity="0.5" />

  <!-- Ground & Road -->
  <rect x="0" y="470" width="800" height="130" fill="url(#groundGrad)" />
  <path d="M 0,510 L 800,510 L 800,580 L 0,580 Z" fill="url(#roadGrad)" />
  <!-- Road Markings (Speed dashes) -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" stroke-dasharray="30 40">
    <line x1="10" y1="545" x2="790" y2="545" />
  </g>

  <!-- Motion Lines behind Pelican & Bike -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.4">
    <line x1="80" y1="260" x2="160" y2="260" />
    <line x1="60" y1="290" x2="130" y2="290" stroke-width="2" />
    <line x1="110" y1="330" x2="170" y2="330" stroke-width="3" />
    <line x1="150" y1="460" x2="200" y2="460" />
  </g>

  <!-- BICYCLE AND RIDER GROUP -->
  <g id="pelicanOnBicycle" transform="translate(40, -10)">

    <!-- Cast Shadows on Ground -->
    <ellipse cx="230" cy="545" rx="85" ry="12" fill="#0f172a" opacity="0.25" filter="url(#groundShadow)" />
    <ellipse cx="500" cy="545" rx="85" ry="12" fill="#0f172a" opacity="0.25" filter="url(#groundShadow)" />
    <ellipse cx="360" cy="545" rx="140" ry="14" fill="#0f172a" opacity="0.2" filter="url(#groundShadow)" />

    <!-- Back Wheel -->
    <g transform="translate(230, 460)">
      <use href="#bicycleWheel" />
    </g>

    <!-- Front Wheel -->
    <g transform="translate(500, 460)">
      <use href="#bicycleWheel" />
    </g>

    <!-- BICYCLE FRAME -->
    <!-- Rear Mudguard/Fender -->
    <path d="M 150,445 A 92 92 0 0 1 295,395" fill="none" stroke="#0891b2" stroke-width="8" stroke-linecap="round"/>
    <path d="M 230,460 L 155,445" stroke="#94a3b8" stroke-width="3" />

    <!-- Bicycle Chainstay & Seatstay -->
    <!-- Dropouts to Bottom Bracket (Chainstay) -->
    <line x1="230" y1="460" x2="335" y2="460" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Dropouts to Seat Junction (Seatstay) -->
    <line x1="230" y1="460" x2="295" y2="340" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Bottom Bracket Assembly (Chainring) -->
    <circle cx="335" cy="460" r="26" fill="url(#metalGrad)" stroke="#475569" stroke-width="2"/>
    <circle cx="335" cy="460" r="16" fill="#0e7490" />

    <!-- Main Triangle -->
    <!-- Seat Tube -->
    <line x1="295" y1="340" x2="335" y2="460" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Down Tube -->
    <line x1="460" y1="315" x2="335" y2="460" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Top Tube -->
    <line x1="295" y1="340" x2="455" y2="315" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Head Tube -->
    <line x1="467" y1="295" x2="455" y2="335" stroke="url(#frameGrad)" stroke-width="15" stroke-linecap="square"/>

    <!-- Front Fork -->
    <line x1="458" y1="325" x2="500" y2="460" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Drive Chain -->
    <path d="M 230,453 L 335,442 A 18 18 0 0 1 345,475 L 230,467 Z" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="4 2" />

    <!-- Left Pedal Arm & Pedal (Back side) -->
    <line x1="335" y1="460" x2="375" y2="520" stroke="url(#metalGrad)" stroke-width="7" stroke-linecap="round"/>
    <rect x="360" y="517" width="28" height="7" rx="3.5" fill="#334155" />

    <!-- Seat Post & Saddle -->
    <line x1="295" y1="340" x2="285" y2="305" stroke="url(#metalGrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- Comfy Bicycle Seat -->
    <path d="M 250,305 C 265,302 275,295 305,295 C 325,295 335,305 325,312 C 315,318 300,312 285,313 C 270,314 255,316 250,305 Z" fill="#78350f" filter="url(#dropShadow)" />

    <!-- Stem & Handlebars -->
    <!-- Handlebar Quill Stem -->
    <path d="M 465,300 L 472,245 L 455,243" fill="none" stroke="url(#metalGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Swept-back Cruiser Handlebars -->
    <path d="M 445,255 C 475,240 480,225 450,220 C 430,215 415,225 410,235" fill="none" stroke="url(#metalGrad)" stroke-width="7" stroke-linecap="round" />
    <path d="M 412,233 L 405,243" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/> <!-- Grip -->

    <!-- Ding-Dong Bicycle Bell -->
    <circle cx="462" cy="225" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <circle cx="464" cy="223" r="2" fill="#fff" opacity="0.6"/>

    <!-- Front Basket (Optional delightful touch for pelican) -->
    <g id="basket" transform="translate(480, 245)">
      <!-- Mount Brackets -->
      <line x1="0" y1="40" x2="-20" y2="70" stroke="url(#metalGrad)" stroke-width="3" />
      <line x1="-5" y1="10" x2="-15" y2="10" stroke="url(#metalGrad)" stroke-width="3" />
      <!-- Wicker Basket Body -->
      <path d="M 0,0 L 55,-5 L 45,45 L 5,42 Z" fill="#d97706" opacity="0.8" rx="4"/>
      <!-- Basket Weave Lines -->
      <path d="M 3,12 L 51,7 M 5,26 L 47,22 M 6,37 L 43,34" stroke="#92400e" stroke-width="2"/>
      <path d="M 15,-1 L 15,42 M 30,-3 L 28,43 M 43,-4 L 38,44" stroke="#92400e" stroke-width="2"/>
      <!-- A little freshly caught fish peeking out of basket -->
      <path d="M 20,5 C 28,-15 42,-5 35,5 Z" fill="#94a3b8" />
      <circle cx="28" cy="-5" r="1.5" fill="#000" />
      <path d="M 35,-5 L 44,-10 L 41,-1 Z" fill="#64748b" /> <!-- Tail fin -->
    </g>

    <!-- PELICAN CHARACTER -->

    <!-- Tail Feathers -->
    <g id="pelicanTail" transform="translate(230, 240)">
      <path d="M 15,30 C -15,40 -25,20 -30,5 C -15,10 0,20 15,30 Z" fill="#cbd5e1" />
      <path d="M 25,35 C -5,55 -20,40 -25,20 C -10,22 10,28 25,35 Z" fill="#94a3b8" />
    </g>

    <!-- Left Leg (Far side) -->
    <g id="farLeg">
      <!-- Thigh -->
      <path d="M 310,270 L 330,345" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" />
      <!-- Shin -->
      <path d="M 330,345 L 375,410" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" />
      <!-- Webbed Foot on Back Pedal -->
      <path d="M 365,405 L 395,415 L 385,425 L 355,415 Z" fill="#d97706" />
    </g>

    <!-- Pelican Torso / Body -->
    <path d="M 260,250 C 240,190 310,130 380,140 C 420,145 440,180 430,230 C 420,290 370,330 300,310 C 270,300 265,275 260,250 Z" 
          fill="url(#pelicanBodyGrad)" filter="url(#dropShadow)"/>

    <!-- Left Wing (Resting gracefully backward/side) -->
    <path d="M 285,185 C 240,210 220,260 210,300 C 235,300 270,280 300,260 C 330,240 345,205 320,185 C 305,175 295,180 285,185 Z" 
          fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Wing Feathers Details -->
    <path d="M 225,285 C 255,270 285,250 305,230" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 245,285 C 275,270 295,255 315,235" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Pelican Neck & Head -->
    <!-- S-curved Neck -->
    <path d="M 385,160 C 410,145 425,100 405,65 C 390,40 430,10 470,25 C 495,35 505,65 480,95 C 460,120 445,160 420,185 Z" 
          fill="url(#pelicanBodyGrad)" />

    <!-- Head Details: Feathers tuft / crest -->
    <path d="M 435,25 C 420,5 395,5 390,15 C 405,18 415,28 425,32 Z" fill="#e2e8f0" />
    <path d="M 445,20 C 435,-2 410,-2 405,8 C 420,10 430,18 438,24 Z" fill="#cbd5e1" />

    <!-- Stylish Boater Hat / Cap for whimsical flair -->
    <g id="strawHat" transform="translate(435, 10) rotate(8)">
      <!-- Hat Base/Brim -->
      <ellipse cx="25" cy="15" rx="35" ry="9" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <!-- Crown -->
      <path d="M 6,12 L 10,-8 L 40,-8 L 44,12 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
      <!-- Navy Ribbon Band -->
      <path d="M 8,10 L 9,3 L 41,3 L 42,10 Z" fill="#0284c7" />
      <path d="M 41,8 L 52,14 L 46,16 L 50,22 L 40,12 Z" fill="#0369a1" /> <!-- Ribbon Tails -->
    </g>

    <!-- Eye Area -->
    <!-- Pinkish/yellow bare skin patch around eye -->
    <path d="M 465,45 C 480,42 490,52 485,65 C 475,70 460,65 460,55 C 460,48 462,46 465,45 Z" fill="#fed7aa" />
    <!-- Eye Ball -->
    <ellipse cx="473" cy="54" rx="6" ry="7" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
    <!-- Pupil & Catchlight -->
    <circle cx="475" cy="54" r="3.5" fill="#0f172a" />
    <circle cx="477" cy="52" r="1.2" fill="#ffffff" />
    <!-- Cheerful Brow -->
    <path d="M 466,46 C 472,42 480,44 484,48" stroke="#9a3412" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- GIANT PELICAN BEAK & POUCH -->
    <g id="beakAndPouch">
      <!-- Lower Bill Elastic Gular Pouch -->
      <!-- Dynamic scoop shape curved downward full of wind/character -->
      <path d="M 485,77 C 520,95 550,150 600,150 C 650,150 670,105 690,75 C 625,90 535,80 485,77 Z" 
            fill="url(#pouchGrad)" opacity="0.95" filter="url(#dropShadow)"/>

      <!-- Pouch Depth Shadow and Texture Creases -->
      <path d="M 525,90 Q 570,135 625,130" stroke="#ea580c" stroke-width="2" fill="none" opacity="0.4" />
      <path d="M 560,95 Q 590,140 645,115" stroke="#ea580c" stroke-width="2" fill="none" opacity="0.4" />

      <!-- Lower Jaw Bone Structure -->
      <path d="M 480,72 L 690,73 C 696,73 700,76 695,80 L 680,82 C 610,85 530,83 480,78 Z" fill="#d97706" />

      <!-- Upper Beak (Hooked tip) -->
      <path d="M 470,52 C 500,50 600,55 700,68 C 710,70 715,75 712,80 C 708,83 702,80 695,76 C 600,67 510,63 470,60 Z" 
            fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>

      <!-- Sharp Down-curved Beak Nail (Hook) -->
      <path d="M 700,68 Q 715,72 712,83 Q 706,86 702,78 Z" fill="#b45309" />

      <!-- Nostril Ridge -->
      <path d="M 495,57 Q 560,60 620,65" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Right Wing / Arm (Reaching forward to Handlebars) -->
    <!-- Shoulder / Bicep -->
    <path d="M 380,210 C 395,195 425,195 440,215 C 445,225 435,240 415,245 C 390,250 375,230 380,210 Z" fill="#f8fafc" />
    <!-- Wing Primary Forearm extending to grip -->
    <path d="M 425,215 C 440,215 450,225 440,238 L 418,245 C 410,245 410,235 415,225 Z" fill="#e2e8f0" />
    <!-- Wing Feathers "Fingers" wrapping handlebars -->
    <path d="M 405,240 C 400,245 400,253 408,255 C 414,256 420,248 420,242 Z" fill="#cbd5e1" />
    <path d="M 412,242 C 408,248 409,256 416,257 C 422,258 426,252 424,244 Z" fill="#94a3b8" />

    <!-- Right Leg & Foot (Pedaling down, near side) -->
    <g id="nearLeg">
      <!-- Thigh / Hip Joint -->
      <ellipse cx="325" cy="305" rx="28" ry="18" fill="#f1f5f9" transform="rotate(-30 325 305)" />
      
      <!-- Upper Leg Bone -->
      <path d="M 330,315 L 305,395" stroke="#f59e0b" stroke-width="9" stroke-linecap="round" />
      <!-- Knee Joint -->
      <circle cx="305" cy="395" r="6" fill="#d97706" />
      <!-- Lower Leg -->
      <path d="M 305,395 L 315,465" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
      
      <!-- Right Pedal & Crank Arm -->
      <line x1="335" y1="460" x2="310" y2="475" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round"/>
      <rect x="290" y="470" width="30" height="9" rx="4" fill="#1e293b" />

      <!-- Webbed Foot (Firmly planted on the near pedal) -->
      <!-- Ankle -->
      <circle cx="315" cy="465" r="5" fill="#d97706" />
      <!-- Large Webbed Bird Foot -->
      <path d="M 315,465 L 285,472 C 275,472 275,462 285,460 L 310,460 Z" fill="#f59e0b" />
      <path d="M 315,465 L 290,477 C 280,480 275,470 288,467 L 315,465 Z" fill="#d97706" />
      <path d="M 315,465 L 310,480 C 300,485 295,475 305,470 Z" fill="#b45309" />
    </g>

  </g>

  <!-- FOREGROUND ACCENTS & DETAIL -->
  <!-- Flying insects / Breeze swirls -->
  <g stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3">
    <path d="M 720,200 Q 740,190 730,180 T 710,190" />
    <path d="M 120,490 Q 140,485 135,475" />
  </g>

  <!-- Flower / Grass Tufts on roadside -->
  <g transform="translate(680, 560)">
    <path d="M -5,10 Q 0,-15 10,-20 Q 5,0 0,10" fill="#4d7c0f" />
    <path d="M -10,10 Q -15,-10 -25,-12 Q -15,2 -10,10" fill="#3f6212" />
    <circle cx="10" cy="-22" r="5" fill="#f43f5e" />
    <circle cx="10" cy="-22" r="2" fill="#fef08a" />
  </g>
  <g transform="translate(110, 565)">
    <path d="M 0,5 Q 10,-15 18,-18 Q 8,-3 0,5" fill="#4d7c0f" />
    <circle cx="18" cy="-20" r="4.5" fill="#fbbf24" />
    <circle cx="18" cy="-20" r="1.5" fill="#ffffff" />
  </g>
</svg>