<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <rect width="600" height="420" fill="#cfe9f7"/>
  <rect y="390" width="600" height="30" fill="#c9b27c"/>
  <line x1="0" y1="390" x2="600" y2="390" stroke="#8a7440" stroke-width="2"/>

  <!-- Rear wheel -->
  <g>
    <circle cx="180" cy="330" r="60" fill="none" stroke="#222" stroke-width="7"/>
    <circle cx="180" cy="330" r="55" fill="none" stroke="#777" stroke-width="2"/>
    <g stroke="#999" stroke-width="1.5">
      <line x1="180" y1="275" x2="180" y2="385"/>
      <line x1="125" y1="330" x2="235" y2="330"/>
      <line x1="141" y1="291" x2="219" y2="369"/>
      <line x1="141" y1="369" x2="219" y2="291"/>
      <line x1="159" y1="279" x2="201" y2="381"/>
      <line x1="129" y1="351" x2="231" y2="309"/>
      <line x1="201" y1="279" x2="159" y2="381"/>
      <line x1="129" y1="309" x2="231" y2="351"/>
    </g>
    <circle cx="180" cy="330" r="6" fill="#444"/>
    <animateTransform attributeName="transform" type="rotate" from="0 180 330" to="360 180 330" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- Front wheel -->
  <g>
    <circle cx="420" cy="330" r="60" fill="none" stroke="#222" stroke-width="7"/>
    <circle cx="420" cy="330" r="55" fill="none" stroke="#777" stroke-width="2"/>
    <g stroke="#999" stroke-width="1.5">
      <line x1="420" y1="275" x2="420" y2="385"/>
      <line x1="365" y1="330" x2="475" y2="330"/>
      <line x1="381" y1="291" x2="459" y2="369"/>
      <line x1="381" y1="369" x2="459" y2="291"/>
      <line x1="399" y1="279" x2="441" y2="381"/>
      <line x1="369" y1="351" x2="471" y2="309"/>
      <line x1="441" y1="279" x2="399" y2="381"/>
      <line x1="369" y1="309" x2="471" y2="351"/>
    </g>
    <circle cx="420" cy="330" r="6" fill="#444"/>
    <animateTransform attributeName="transform" type="rotate" from="0 420 330" to="360 420 330" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- Far leg (behind frame), 180° out of phase -->
  <polyline fill="none" stroke="#e0a030" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"
    points="282,255 297,284.5 272,330">
    <animate attributeName="points" dur="1s" repeatCount="indefinite"
      values="282,255 297,284.5 272,330;282,255 301.1,274.6 280.2,310.2;282,255 311,270.5 300,302;282,255 320.9,274.6 319.8,310.2;282,255 325,284.5 328,330;282,255 320.9,294.4 319.8,349.8;282,255 311,298.5 300,358;282,255 301.1,294.4 280.2,349.8;282,255 297,284.5 272,330"/>
  </polyline>

  <!-- Frame -->
  <g stroke="#c0392b" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="300" y1="330" x2="280" y2="245"/>
    <line x1="282" y1="252" x2="395" y2="255"/>
    <line x1="300" y1="330" x2="398" y2="270"/>
    <line x1="300" y1="330" x2="180" y2="330"/>
    <line x1="282" y1="252" x2="180" y2="330"/>
    <line x1="395" y1="250" x2="400" y2="275"/>
  </g>
  <line x1="400" y1="270" x2="420" y2="330" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <!-- Handlebar -->
  <path d="M395,252 L390,228 L412,224 Q422,224 420,236" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- Saddle -->
  <line x1="280" y1="245" x2="279" y2="238" stroke="#333" stroke-width="4"/>
  <path d="M258,236 Q280,228 298,236 Q280,242 258,236 Z" fill="#222"/>
  <!-- Chainring -->
  <circle cx="300" cy="330" r="16" fill="none" stroke="#555" stroke-width="3"/>

  <!-- Pelican body -->
  <g>
    <ellipse cx="290" cy="212" rx="55" ry="34" fill="#7a6a58"/>
    <path d="M240,205 Q270,180 330,195 Q310,230 250,228 Z" fill="#5a4b3c"/>
    <path d="M245,210 L215,222 L250,222 Z" fill="#3e3228"/>
    <!-- Neck -->
    <path d="M325,200 Q350,190 345,165 Q340,145 355,140" fill="none" stroke="#6e4a34" stroke-width="16" stroke-linecap="round"/>
    <path d="M330,196 Q352,185 347,165" fill="none" stroke="#f4f1e8" stroke-width="5" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="360" cy="140" rx="17" ry="13" fill="#f4f1e8"/>
    <ellipse cx="355" cy="131" rx="12" ry="6" fill="#f2d27a"/>
    <circle cx="364" cy="137" r="2.8" fill="#111"/>
    <!-- Bill and pouch -->
    <path d="M372,138 L445,158 L372,146 Z" fill="#d88a4a"/>
    <path d="M372,146 L443,160 Q410,185 375,158 Z" fill="#8a3a2a"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="0.5s" repeatCount="indefinite"/>
  </g>
  <!-- Wing reaching to handlebar -->
  <path d="M320,205 Q360,215 392,228" fill="none" stroke="#5a4b3c" stroke-width="9" stroke-linecap="round"/>

  <!-- Crank arms and pedals -->
  <g>
    <line x1="300" y1="330" x2="328" y2="330" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <line x1="300" y1="330" x2="272" y2="330" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <rect x="322" y="327" width="12" height="6" fill="#111"/>
    <rect x="266" y="327" width="12" height="6" fill="#444"/>
    <circle cx="300" cy="330" r="4" fill="#ccc"/>
    <animateTransform attributeName="transform" type="rotate" from="0 300 330" to="360 300 330" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- Near leg, foot tracks pedal -->
  <polyline fill="none" stroke="#f0b040" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
    points="282,255 325,284.5 328,330">
    <animate attributeName="points" dur="1s" repeatCount="indefinite"
      values="282,255 325,284.5 328,330;282,255 320.9,294.4 319.8,349.8;282,255 311,298.5 300,358;282,255 301.1,294.4 280.2,349.8;282,255 297,284.5 272,330;282,255 301.1,274.6 280.2,310.2;282,255 311,270.5 300,302;282,255 320.9,274.6 319.8,310.2;282,255 325,284.5 328,330"/>
  </polyline>
  <!-- Thigh feathers covering hip -->
  <ellipse cx="285" cy="240" rx="18" ry="14" fill="#6a5a48"/>
</svg>