<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec5ec"/>
      <stop offset="1" stop-color="#e6f2fa"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f86b8"/>
      <stop offset="1" stop-color="#7cb7dc"/>
    </linearGradient>
    <g id="wheel">
      <circle r="94" fill="none" stroke="#222" stroke-width="9"/>
      <circle r="88" fill="none" stroke="#d9d9d9" stroke-width="5"/>
      <g stroke="#b5b5b5" stroke-width="2">
        <line x1="86" y1="0" x2="-86" y2="0"/>
        <line x1="74.5" y1="43" x2="-74.5" y2="-43"/>
        <line x1="43" y1="74.5" x2="-43" y2="-74.5"/>
        <line x1="0" y1="86" x2="0" y2="-86"/>
        <line x1="-43" y1="74.5" x2="43" y2="-74.5"/>
        <line x1="-74.5" y1="43" x2="74.5" y2="-43"/>
      </g>
      <circle cy="-60" r="4" fill="#ff8a1f"/>
      <circle r="9" fill="#666" stroke="#333" stroke-width="2"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="690" cy="80" r="38" fill="#ffd66b"/>
  <rect x="0" y="330" width="800" height="146" fill="url(#sea)"/>
  <path d="M0,340 Q40,334 80,340 T160,340 T240,340 T320,340 T400,340 T480,340 T560,340 T640,340 T720,340 T800,340" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="0" y="476" width="800" height="24" fill="#c9b28a"/>
  <line x1="0" y1="488" x2="800" y2="488" stroke="#a48c62" stroke-width="3" stroke-dasharray="30 30">
    <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="0.5s" repeatCount="indefinite"/>
  </line>

  <!-- far leg (behind body and frame) -->
  <polyline fill="none" stroke="#2e2a26" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
            points="305,262 370.1,331.2 298,385">
    <animate attributeName="points" dur="2s" repeatCount="indefinite"
      values="305,262 370.1,331.2 298,385;
              305,262 387.5,309.1 310.3,355.3;
              305,262 399.1,275.1 340,343;
              305,262 399.6,270.4 369.7,355.3;
              305,262 393.8,295.8 382,385;
              305,262 376.1,325 369.7,414.7;
              305,262 360.2,339.3 340,427;
              305,262 359.9,339.5 310.3,414.7;
              305,262 370.1,331.2 298,385"/>
  </polyline>

  <!-- far crank arm, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 340 385" to="360 340 385" dur="2s" repeatCount="indefinite"/>
    <line x1="340" y1="385" x2="298" y2="385" stroke="#555" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(298,385)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-13" y="-4" width="26" height="8" rx="2" fill="#333"/>
        <polygon points="-8,-4 12,-4 18,-9 10,-13 -2,-12 -10,-8" fill="#262320"/>
      </g>
    </g>
  </g>

  <!-- wheels -->
  <g transform="translate(200,380)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(560,380)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- frame -->
  <g stroke="#c8322b" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="200" y1="380" x2="340" y2="385"/>   <!-- chain stay -->
    <line x1="200" y1="380" x2="302" y2="250"/>   <!-- seat stay -->
    <line x1="302" y1="250" x2="340" y2="385"/>   <!-- seat tube -->
    <line x1="302" y1="250" x2="492" y2="238"/>   <!-- top tube -->
    <line x1="340" y1="385" x2="500" y2="268"/>   <!-- down tube -->
    <line x1="492" y1="238" x2="500" y2="268"/>   <!-- head tube -->
    <path d="M500,268 Q520,320 560,380"/>         <!-- fork -->
  </g>
  <!-- seat post, saddle, stem, handlebar -->
  <line x1="302" y1="250" x2="300" y2="240" stroke="#444" stroke-width="5"/>
  <path d="M262,244 Q290,232 330,236 L328,246 Q295,250 266,250 Z" fill="#2b2b2b"/>
  <line x1="492" y1="238" x2="488" y2="214" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <line x1="466" y1="214" x2="522" y2="214" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <line x1="508" y1="214" x2="522" y2="214" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
  <!-- rear cog and chain -->
  <circle cx="200" cy="380" r="10" fill="#777" stroke="#333" stroke-width="2"/>
  <g stroke="#333" stroke-width="3" stroke-dasharray="4 3">
    <line x1="200" y1="370" x2="340" y2="363">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="340" y1="407" x2="200" y2="390">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- pelican -->
  <polygon points="242,192 196,236 208,248 250,222" fill="#4a3a2e"/>
  <ellipse cx="300" cy="200" rx="68" ry="50" fill="#7a6858" stroke="#4a3a2e" stroke-width="2"/>
  <ellipse cx="292" cy="190" rx="54" ry="28" fill="#5e4d3f" transform="rotate(-12 292 190)"/>
  <g stroke="#4a3a2e" stroke-width="1.5" fill="none">
    <path d="M250,200 q20,-6 40,-2"/>
    <path d="M262,212 q22,-6 44,-2"/>
    <path d="M276,224 q18,-5 36,-1"/>
  </g>
  <!-- neck -->
  <path d="M345,175 C372,160 358,120 392,104" fill="none" stroke="#5a3a2b" stroke-width="26" stroke-linecap="round"/>
  <path d="M345,175 C372,160 358,120 392,104" fill="none" stroke="#f1e6cf" stroke-width="10" stroke-linecap="round" stroke-opacity="0.35"/>
  <!-- head -->
  <circle cx="398" cy="98" r="23" fill="#f4eedd" stroke="#c9b98f" stroke-width="1.5"/>
  <path d="M377,90 Q398,66 420,92 Q398,82 377,90 Z" fill="#e8d27a"/>
  <!-- bill and pouch -->
  <path d="M412,106 L442,142 L512,122 L412,96 Z" fill="#9c6b5a" stroke="#6e4a3c" stroke-width="1.5"/>
  <polygon points="410,95 516,113 517,121 410,105" fill="#a9a59a" stroke="#6b6860" stroke-width="1.5"/>
  <circle cx="515" cy="117" r="3.5" fill="#d9822b"/>
  <circle cx="405" cy="93" r="4" fill="#111"/>
  <circle cx="406.5" cy="91.5" r="1.3" fill="#fff"/>
  <!-- wing reaching to handlebar -->
  <polygon points="320,160 348,150 470,206 496,213 492,222 462,219 336,186" fill="#7a6858" stroke="#4a3a2e" stroke-width="2" stroke-linejoin="round"/>

  <!-- near leg -->
  <polyline fill="none" stroke="#4d4740" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
            points="305,262 393.8,295.8 382,385">
    <animate attributeName="points" dur="2s" repeatCount="indefinite"
      values="305,262 393.8,295.8 382,385;
              305,262 376.1,325 369.7,414.7;
              305,262 360.2,339.3 340,427;
              305,262 359.9,339.5 310.3,414.7;
              305,262 370.1,331.2 298,385;
              305,262 387.5,309.1 310.3,355.3;
              305,262 399.1,275.1 340,343;
              305,262 399.6,270.4 369.7,355.3;
              305,262 393.8,295.8 382,385"/>
  </polyline>
  <!-- thigh feathers covering the hip joint -->
  <ellipse cx="312" cy="254" rx="22" ry="13" fill="#7a6858" stroke="#4a3a2e" stroke-width="1.5"/>

  <!-- chainring, near crank arm, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 340 385" to="360 340 385" dur="2s" repeatCount="indefinite"/>
    <circle cx="340" cy="385" r="22" fill="none" stroke="#333" stroke-width="5" stroke-dasharray="5 3"/>
    <circle cx="340" cy="385" r="6" fill="#222"/>
    <line x1="340" y1="385" x2="382" y2="385" stroke="#666" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(382,385)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-13" y="-4" width="26" height="8" rx="2" fill="#333"/>
        <polygon points="-8,-4 12,-4 18,-9 10,-13 -2,-12 -10,-8" fill="#3a3632"/>
      </g>
    </g>
  </g>
</svg>