<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd6ee"/>
      <stop offset="1" stop-color="#fde9c8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f93bd"/>
      <stop offset="1" stop-color="#6cc0d8"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#1d1d1d" stroke-width="8"/>
      <circle r="64.5" fill="none" stroke="#c9ccd1" stroke-width="3"/>
      <path d="M-63 0 L63 0 M-58.2 -24.11 L58.2 24.11 M-44.55 -44.55 L44.55 44.55 M-24.11 -58.2 L24.11 58.2 M0 -63 L0 63 M24.11 -58.2 L-24.11 58.2 M44.55 -44.55 L-44.55 44.55 M58.2 -24.11 L-58.2 24.11" stroke="#9aa0a6" stroke-width="1.4" fill="none"/>
      <rect x="34" y="-3" width="10" height="6" rx="1.5" fill="#f08a24"/>
      <circle r="7" fill="#8a8f95"/>
      <circle r="2.8" fill="#333"/>
    </g>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="420" fill="url(#sky)"/>
  <circle cx="500" cy="70" r="34" fill="#ffd66b" opacity="0.9"/>
  <rect x="0" y="285" width="600" height="85" fill="url(#sea)"/>
  <path d="M0 305 Q15 300 30 305 T60 305 T90 305 T120 305 T150 305 T180 305 T210 305 T240 305 T270 305 T300 305 T330 305 T360 305 T390 305 T420 305 T450 305 T480 305 T510 305 T540 305 T570 305 T600 305 T630 305 T660 305" fill="none" stroke="#bfe7f2" stroke-width="2" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-60 0" dur="3s" repeatCount="indefinite"/>
  </path>
  <rect x="0" y="368" width="600" height="52" fill="#e3cf9f"/>
  <line x1="0" y1="388" x2="600" y2="388" stroke="#c4a877" stroke-width="4" stroke-dasharray="50 60">
    <animate attributeName="stroke-dashoffset" from="0" to="110" dur="0.2s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="300" cy="375" rx="175" ry="6" fill="#000" opacity="0.15"/>

  <!-- Far leg (behind the bike) -->
  <path d="M265 195 L309.9 251.3 L262 305" fill="none" stroke="#2a2522" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M265 195 L309.9 251.3 L262 305;M265 195 L319 242.6 L265.75 291;M265 195 L327.6 230.6 L276 280.75;M265 195 L332.8 219.1 L290 277;M265 195 L334.1 215.3 L304 280.75;M265 195 L332 221.2 L314.25 291;M265 195 L325.9 233.4 L318 305;M265 195 L314.8 247 L314.25 319;M265 195 L301.1 257.3 L304 329.25;M265 195 L293.6 261.1 L290 333;M265 195 L295.9 260 L276 329.25;M265 195 L302 256.8 L265.75 319;M265 195 L309.9 251.3 L262 305"/>
  </path>

  <!-- Far crank arm, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 290 305" to="360 290 305" dur="1.2s" repeatCount="indefinite"/>
    <line x1="290" y1="305" x2="262" y2="305" stroke="#2f2f2f" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 262 305" to="-360 262 305" dur="1.2s" repeatCount="indefinite"/>
      <g transform="translate(262 305)">
        <rect x="-10" y="-2" width="20" height="5" rx="1" fill="#2b2b2b"/>
        <path d="M-7 -2 Q-6 -8 0 -7 L16 -6 L13 -3 L18 -2 Z" fill="#221e1b"/>
      </g>
    </g>
  </g>

  <!-- Wheels -->
  <g transform="translate(180 300)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(420 300)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Rear cog -->
  <g transform="translate(180 300)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      <circle r="10.5" fill="none" stroke="#6b6b6b" stroke-width="3" stroke-dasharray="2 1.7"/>
    </g>
  </g>

  <!-- Chain -->
  <path d="M180 289.5 L290 289 A16 16 0 0 1 290 321 L180 310.5 A10.5 10.5 0 0 1 180 289.5 Z" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="0" to="-70" dur="0.835s" repeatCount="indefinite"/>
  </path>

  <!-- Frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 300 L290 305" stroke="#1f7a8c" stroke-width="6"/>
    <path d="M180 300 L268 222" stroke="#1f7a8c" stroke-width="5"/>
    <path d="M290 305 L266 214" stroke="#1f7a8c" stroke-width="7"/>
    <path d="M268 224 L394 214" stroke="#1f7a8c" stroke-width="7"/>
    <path d="M290 305 L398 232" stroke="#1f7a8c" stroke-width="8"/>
    <path d="M399 236 Q412 272 420 300" stroke="#1f7a8c" stroke-width="6"/>
    <path d="M391 204 L400 240" stroke="#17606e" stroke-width="10"/>
    <path d="M266 214 L263 203" stroke="#b5b8bc" stroke-width="5"/>
    <path d="M392 206 L393 190" stroke="#555" stroke-width="5"/>
    <path d="M393 190 Q384 186 376 188 Q368 190 370 199" stroke="#444" stroke-width="5"/>
    <path d="M369.5 193 L370.5 203" stroke="#111" stroke-width="7"/>
  </g>
  <circle cx="180" cy="300" r="4" fill="#333"/>
  <circle cx="420" cy="300" r="4" fill="#333"/>

  <!-- Saddle -->
  <path d="M243 199 Q256 194 284 200 Q285 205 276 206 L256 206 Q245 205 243 199 Z" fill="#222"/>

  <!-- Chainring -->
  <g transform="translate(290 305)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="16.5" fill="none" stroke="#6b6b6b" stroke-width="3" stroke-dasharray="2 1.6"/>
      <circle r="14" fill="none" stroke="#9a9ea3" stroke-width="2"/>
      <path d="M0 -13 L0 13 M-11.3 -6.5 L11.3 6.5 M-11.3 6.5 L11.3 -6.5" stroke="#9a9ea3" stroke-width="2"/>
    </g>
  </g>

  <!-- Near leg -->
  <path d="M265 195 L325.9 233.4 L318 305" fill="none" stroke="#3d3632" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M265 195 L325.9 233.4 L318 305;M265 195 L314.8 247 L314.25 319;M265 195 L301.1 257.3 L304 329.25;M265 195 L293.6 261.1 L290 333;M265 195 L295.9 260 L276 329.25;M265 195 L302 256.8 L265.75 319;M265 195 L309.9 251.3 L262 305;M265 195 L319 242.6 L265.75 291;M265 195 L327.6 230.6 L276 280.75;M265 195 L332.8 219.1 L290 277;M265 195 L334.1 215.3 L304 280.75;M265 195 L332 221.2 L314.25 291;M265 195 L325.9 233.4 L318 305"/>
  </path>

  <!-- Pelican -->
  <path d="M232 166 L198 175 L203 182 L234 188 Z" fill="#4f4238"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 303 152;-4 303 152;0 303 152" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="0.6s" repeatCount="indefinite"/>
    <path d="M300 155 C318 140 300 112 318 92" fill="none" stroke="#5b3522" stroke-width="20" stroke-linecap="round"/>
    <path d="M309 152 C326 136 309 112 326 94" fill="none" stroke="#f3efe6" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="324" cy="86" rx="17" ry="13" fill="#f7f2e4"/>
    <ellipse cx="320" cy="76" rx="11" ry="5" fill="#f0cf5a"/>
    <path d="M338 90 L414 114 Q390 134 350 112 Q342 104 338 96 Z" fill="#b3261e" stroke="#7e1a14" stroke-width="1.2"/>
    <path d="M336 80 L414 106 Q424 110 417 116 L338 90 Z" fill="#c8b89a" stroke="#8f8068" stroke-width="1"/>
    <path d="M410 105 Q425 108 419 118 L414 114 Z" fill="#d0522c"/>
    <circle cx="331" cy="83" r="3.6" fill="#f2a7a0"/>
    <circle cx="331" cy="83" r="2.6" fill="#fff4c9"/>
    <circle cx="331.5" cy="83" r="1.5" fill="#1a1a1a"/>
  </g>
  <ellipse cx="272" cy="168" rx="50" ry="30" transform="rotate(-8 272 168)" fill="#6e5d4e"/>
  <path d="M236 160 Q260 138 300 142 Q340 150 378 184 Q370 192 360 188 Q330 178 300 180 Q260 186 236 172 Z" fill="#a09383"/>
  <path d="M236 172 Q260 188 300 182 Q330 180 360 188 L374 193 Q340 197 300 195 Q258 197 234 179 Z" fill="#3b302a"/>
  <g fill="none" stroke="#7c7062" stroke-width="1.5" stroke-linecap="round">
    <path d="M258 158 Q275 152 292 156"/>
    <path d="M270 168 Q290 162 312 168"/>
    <path d="M300 160 Q322 162 342 172"/>
  </g>

  <!-- Near crank arm, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 290 305" to="360 290 305" dur="1.2s" repeatCount="indefinite"/>
    <line x1="290" y1="305" x2="318" y2="305" stroke="#3d3d3d" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 318 305" to="-360 318 305" dur="1.2s" repeatCount="indefinite"/>
      <g transform="translate(318 305)">
        <rect x="-10" y="-2" width="20" height="5" rx="1" fill="#333"/>
        <path d="M-7 -2 Q-6 -8 0 -7 L16 -6 L13 -3 L18 -2 Z" fill="#3a3530"/>
      </g>
    </g>
  </g>
  <circle cx="290" cy="305" r="4.5" fill="#bfc3c7" stroke="#555" stroke-width="1.5"/>
</svg>