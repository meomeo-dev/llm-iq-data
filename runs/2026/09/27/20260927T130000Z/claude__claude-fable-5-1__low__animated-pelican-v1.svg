<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f7"/>
      <stop offset="1" stop-color="#eaf6fc"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <rect y="400" width="800" height="100" fill="#8fb36a"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#5f7f44" stroke-width="3"/>

  <!-- far (left) leg, behind frame -->
  <path fill="none" stroke="#e0a03a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
        d="M350,185 L406.7,273.3 L335,350 l14,2">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M350,185 L406.7,273.3 L335,350 l14,2;
              M350,185 L425.7,257.8 L345.3,325.3 l14,2;
              M350,185 L440.9,237.6 L370,315 l14,2;
              M350,185 L443.8,232.4 L394.7,325.3 l14,2;
              M350,185 L433.3,248.9 L405,350 l14,2;
              M350,185 L410.4,270.9 L394.7,374.7 l14,2;
              M350,185 L390.2,282.0 L370,385 l14,2;
              M350,185 L392.7,281.0 L345.3,374.7 l14,2;
              M350,185 L406.7,273.3 L335,350 l14,2"/>
  </path>

  <!-- rear wheel -->
  <g>
    <circle cx="220" cy="330" r="70" fill="none" stroke="#222" stroke-width="8"/>
    <circle cx="220" cy="330" r="64" fill="none" stroke="#999" stroke-width="2"/>
    <g stroke="#777" stroke-width="2">
      <line x1="220" y1="266" x2="220" y2="394"/>
      <line x1="156" y1="330" x2="284" y2="330"/>
      <line x1="174.7" y1="284.7" x2="265.3" y2="375.3"/>
      <line x1="174.7" y1="375.3" x2="265.3" y2="284.7"/>
      <line x1="195.5" y1="270.9" x2="244.5" y2="389.1"/>
      <line x1="160.9" y1="305.5" x2="279.1" y2="354.5"/>
      <line x1="160.9" y1="354.5" x2="279.1" y2="305.5"/>
      <line x1="195.5" y1="389.1" x2="244.5" y2="270.9"/>
    </g>
    <circle cx="220" cy="330" r="10" fill="#444"/>
    <animateTransform attributeName="transform" type="rotate" from="0 220 330" to="360 220 330" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- front wheel -->
  <g>
    <circle cx="560" cy="330" r="70" fill="none" stroke="#222" stroke-width="8"/>
    <circle cx="560" cy="330" r="64" fill="none" stroke="#999" stroke-width="2"/>
    <g stroke="#777" stroke-width="2">
      <line x1="560" y1="266" x2="560" y2="394"/>
      <line x1="496" y1="330" x2="624" y2="330"/>
      <line x1="514.7" y1="284.7" x2="605.3" y2="375.3"/>
      <line x1="514.7" y1="375.3" x2="605.3" y2="284.7"/>
      <line x1="535.5" y1="270.9" x2="584.5" y2="389.1"/>
      <line x1="500.9" y1="305.5" x2="619.1" y2="354.5"/>
      <line x1="500.9" y1="354.5" x2="619.1" y2="305.5"/>
      <line x1="535.5" y1="389.1" x2="584.5" y2="270.9"/>
    </g>
    <circle cx="560" cy="330" r="10" fill="#444"/>
    <animateTransform attributeName="transform" type="rotate" from="0 560 330" to="360 560 330" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="3" fill="none">
    <line x1="220" y1="320" x2="370" y2="328"/>
    <line x1="220" y1="340" x2="370" y2="372"/>
    <circle cx="220" cy="330" r="10"/>
  </g>

  <!-- frame -->
  <g stroke="#c8102e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="370" y1="350" x2="330" y2="220"/>   <!-- seat tube -->
    <line x1="370" y1="350" x2="500" y2="250"/>   <!-- down tube -->
    <line x1="330" y1="220" x2="510" y2="220"/>   <!-- top tube -->
    <line x1="510" y1="220" x2="500" y2="250"/>   <!-- head tube -->
    <line x1="500" y1="250" x2="560" y2="330"/>   <!-- fork -->
    <line x1="370" y1="350" x2="220" y2="330"/>   <!-- chainstay -->
    <line x1="330" y1="220" x2="220" y2="330"/>   <!-- seat stay -->
  </g>
  <line x1="330" y1="220" x2="322" y2="193" stroke="#333" stroke-width="6"/>   <!-- seat post -->
  <path d="M292,194 q28,-12 60,-5 l0,6 q-32,5 -60,1 z" fill="#222"/>            <!-- saddle -->
  <line x1="512" y1="215" x2="522" y2="196" stroke="#333" stroke-width="6"/>   <!-- stem -->
  <path d="M522,196 q-4,-16 -26,-18" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/> <!-- handlebar -->

  <!-- crank, chainring and pedals -->
  <g>
    <circle cx="370" cy="350" r="22" fill="none" stroke="#333" stroke-width="5"/>
    <line x1="370" y1="350" x2="405" y2="350" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <line x1="370" y1="350" x2="335" y2="350" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <circle cx="370" cy="350" r="6" fill="#555"/>
    <g>
      <rect x="395" y="346" width="20" height="8" rx="2" fill="#111"/>
      <animateTransform attributeName="transform" type="rotate" from="360 405 350" to="0 405 350" dur="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="325" y="346" width="20" height="8" rx="2" fill="#111"/>
      <animateTransform attributeName="transform" type="rotate" from="360 335 350" to="0 335 350" dur="2s" repeatCount="indefinite"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 370 350" to="360 370 350" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- pelican body -->
  <path d="M250,140 q-25,-8 -40,-2 q22,10 40,12 z" fill="#5a3f26"/>            <!-- tail -->
  <ellipse cx="320" cy="150" rx="64" ry="44" fill="#6b4a2b" transform="rotate(-10 320 150)"/>
  <path d="M275,135 q40,-25 95,-5 q-30,30 -80,28 z" fill="#8a6a45"/>            <!-- wing feathers -->
  <path d="M350,140 q80,10 150,38" fill="none" stroke="#5a3f26" stroke-width="16" stroke-linecap="round"/> <!-- wing to handlebar -->
  <path d="M350,140 q80,10 150,38" fill="none" stroke="#7d5a37" stroke-width="8" stroke-linecap="round"/>

  <!-- neck and head -->
  <path d="M355,125 q35,-10 40,-45 q3,-15 12,-18" fill="none" stroke="#f3ead6" stroke-width="22" stroke-linecap="round"/>
  <circle cx="408" cy="68" r="21" fill="#f3ead6"/>
  <path d="M395,50 q15,-8 30,0 q-15,6 -30,0 z" fill="#c9a34e"/>                <!-- yellow crown -->
  <circle cx="416" cy="62" r="3.5" fill="#222"/>
  <circle cx="417" cy="61" r="1.2" fill="#fff"/>
  <!-- bill with pouch -->
  <path d="M420,60 L535,86 L532,92 L420,74 z" fill="#d9a066" stroke="#a86a2a" stroke-width="1.5"/>
  <path d="M420,74 L532,92 q-50,22 -110,6 z" fill="#e8b98a" stroke="#a86a2a" stroke-width="1.5"/>
  <line x1="420" y1="74" x2="532" y2="92" stroke="#a86a2a" stroke-width="1.5"/>

  <!-- near (right) leg, in front of frame -->
  <path fill="none" stroke="#f0b444" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
        d="M350,185 L433.3,248.9 L405,350 l14,2">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M350,185 L433.3,248.9 L405,350 l14,2;
              M350,185 L410.4,270.9 L394.7,374.7 l14,2;
              M350,185 L390.2,282.0 L370,385 l14,2;
              M350,185 L392.7,281.0 L345.3,374.7 l14,2;
              M350,185 L406.7,273.3 L335,350 l14,2;
              M350,185 L425.7,257.8 L345.3,325.3 l14,2;
              M350,185 L440.9,237.6 L370,315 l14,2;
              M350,185 L443.8,232.4 L394.7,325.3 l14,2;
              M350,185 L433.3,248.9 L405,350 l14,2"/>
  </path>
</svg>