<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background glow & sci-fi space gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b112c"/>
      <stop offset="60%" stop-color="#050714"/>
      <stop offset="100%" stop-color="#010206"/>
    </radialGradient>

    <!-- Track Lighting Gradients -->
    <linearGradient id="backRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="twistGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="frontRibbonGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="80%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shared 2D Projection Centerline Path (Figure-8 Möbius loop) -->
    <!-- Length approx 1800 units; smooth Bezier lemniscate with twist in center bridge -->
    <path id="mobiusCenterline" d="M 500,325 C 570,375 720,470 850,390 C 970,310 930,170 780,180 C 650,190 560,270 500,325 C 440,380 350,460 220,470 C 70,480 30,340 150,260 C 280,180 430,275 500,325 Z"/>

    <!-- Reusable Rover Graphic Model -->
    <g id="roverVehicle">
      <!-- Thruster Trail / Engine Flare -->
      <ellipse cx="-28" cy="0" rx="10" ry="4" fill="#38bdf8" filter="url(#intenseGlow)" opacity="0.8">
        <animate attributeName="rx" values="8;13;8" dur="0.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="0.25s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Chassis Drop Shadow / Ground Glow -->
      <ellipse cx="0" cy="5" rx="24" ry="7" fill="#00f5ff" opacity="0.4" filter="url(#neonGlow)"/>

      <!-- Main Hull Suspension / Wheels Base -->
      <rect x="-20" y="-8" width="8" height="16" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="12" y="-8" width="8" height="16" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Aerodynamic Main Chassis -->
      <path d="M -22,-6 L 6,-6 L 22,-2 L 25,0 L 22,2 L 6,6 L -22,6 L -24,3 L -24,-3 Z" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>

      <!-- Neon Energy Body Stripe -->
      <path d="M -16,-2 L 14,-2 L 18,0 L 14,2 L -16,2 Z" fill="#38bdf8" filter="url(#neonGlow)"/>

      <!-- Cockpit Canopy Glass -->
      <path d="M -6,-4 L 8,-4 L 14,0 L 8,4 L -6,4 Z" fill="#0284c7">
        <animate attributeName="fill" values="#0284c7;#06b6d4;#38bdf8;#0284c7" dur="4s" repeatCount="indefinite"/>
      </path>

      <!-- Sensor Mast / Headlight Array -->
      <circle cx="20" cy="0" r="2.5" fill="#f43f5e" filter="url(#neonGlow)"/>
      <polygon points="22,-1 38,-7 38,7 22,1" fill="#38bdf8" opacity="0.15"/>
    </g>
  </defs>

  <style><![CDATA[
    .star { fill: #ffffff; opacity: 0.3; }
    .track-grid { stroke: rgba(255, 255, 255, 0.12); stroke-dasharray: 4 12; fill: none; }
    .center-rail { stroke: #00f0ff; stroke-width: 2.5; fill: none; stroke-dasharray: 10 14; opacity: 0.85; filter: url(#neonGlow); }
  ]]></style>

  <!-- Deep Cosmic Ambient Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)"/>

  <!-- Starfield background particles -->
  <g id="starfield">
    <circle cx="120" cy="80" r="1.5" class="star"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="140" r="1" class="star"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="90" r="1.8" class="star"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="70" r="1.2" class="star"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="120" r="2" class="star"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="540" r="1.2" class="star"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="580" r="1.6" class="star"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="560" r="1" class="star"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="530" r="1.5" class="star"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Ambient Perspective Grids and Rings -->
  <ellipse cx="500" cy="325" rx="440" ry="210" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="8 12"/>
  <ellipse cx="500" cy="325" rx="360" ry="170" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.08"/>

  <!-- ======================================================== -->
  <!-- LAYER 1: BACKSTAGE TRACK (Occluded Background Loop)      -->
  <!-- ======================================================== -->
  <g id="backgroundTrack">
    <!-- Right back-lobe outer ribbon (underneath layer) -->
    <path d="M 500,325 C 620,240 700,165 790,165 C 930,165 980,290 870,380 C 780,450 630,370 500,325 Z"
          fill="none" stroke="url(#backRibbonGrad)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left back-lobe under-ribbon -->
    <path d="M 500,325 C 380,410 300,485 210,485 C 70,485 20,360 130,270 C 220,200 370,280 500,325 Z"
          fill="none" stroke="url(#backRibbonGrad)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dimensional lateral guide ridges (Back) -->
    <path d="M 500,325 C 620,240 700,165 790,165 C 930,165 980,290 870,380"
          class="track-grid" stroke-width="1.5"/>
    <path d="M 500,325 C 380,410 300,485 210,485 C 70,485 20,360 130,270"
          class="track-grid" stroke-width="1.5"/>
  </g>

  <!-- ======================================================== -->
  <!-- LAYER 2: OCCLUDED ROVER PASS (When Behind Front Ribbons)  -->
  <!-- Active during rear quadrant transitions                   -->
  <!-- ======================================================== -->
  <g id="roverBackgroundOcclusion">
    <g id="roverBackInstance">
      <!-- Rover Traversal along Möbius Path -->
      <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
        <mpath href="#mobiusCenterline"/>
      </animateMotion>

      <!-- 720° Topological Transformation: Flip & Scale for Perspective + Inversion -->
      <!-- Circuit 1 (0s-8s): Starts normal, twists into upside-down (scaleY: 1 -> -1) -->
      <!-- Circuit 2 (8s-16s): Inverted, twists back into right-side up (scaleY: -1 -> 1) -->
      <!-- In Layer 2, opacity is 1 only when passing behind the front loops -->
      <animateTransform attributeName="transform" type="scale"
        values="
          1.0  1.0;
          1.25 0.7;
          0.85 0.3;
          0.7 -0.5;
          0.9 -1.0;
          1.3 -0.8;
          0.9 -0.2;
          0.75 0.5;
          1.0  1.0"
        keyTimes="0; 0.15; 0.35; 0.50; 0.65; 0.75; 0.88; 0.95; 1"
        dur="16s" repeatCount="indefinite"/>

      <!-- Layer Visibility Window (Visible when z-index < front elements) -->
      <animate attributeName="opacity"
        values="
          0;
          0;
          1;
          0;
          0;
          0;
          1;
          0;
          0"
        keyTimes="0; 0.22; 0.30; 0.44; 0.68; 0.76; 0.84; 0.92; 1"
        dur="16s" repeatCount="indefinite"/>

      <use href="#roverVehicle"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- LAYER 3: FOREGROUND TRACK WITH 3D HALF-TWIST TOPOLOGY    -->
  <!-- Continuous ribbon demonstrating single-sided twist       -->
  <!-- ======================================================== -->
  <g id="foregroundTrack">
    <!-- Left Fore-Ribbon Loop (High Saturation & Clarity) -->
    <path d="M 500,325 C 440,380 350,460 220,470 C 70,480 30,340 150,260 C 230,207 330,225 425,275"
          fill="none" stroke="url(#frontRibbonGrad)" stroke-width="56" stroke-linecap="round"/>

    <!-- Right Fore-Ribbon Loop -->
    <path d="M 500,325 C 560,270 650,190 780,180 C 930,170 970,310 850,390 C 770,443 670,425 575,375"
          fill="none" stroke="url(#frontRibbonGrad)" stroke-width="56" stroke-linecap="round"/>

    <!-- 3D Möbius Half-Twist Intersection Bridge (Isometric Ribbon Rotation) -->
    <!-- Gradient & bevel illusion depicting the ribbon twisting 180° upon itself -->
    <g id="mobiusTwistChamber">
      <!-- Upper folding facet -->
      <path d="M 430,280 C 470,300 485,335 500,350 C 515,365 540,360 570,340 C 550,310 525,290 500,295 C 470,300 445,285 430,280 Z"
            fill="url(#twistGrad)" opacity="0.95"/>
      <!-- Lower inverted facet meeting the twist line -->
      <path d="M 430,330 C 465,345 490,320 500,305 C 515,290 535,305 570,370 C 540,380 520,355 500,345 C 475,335 450,340 430,330 Z"
            fill="#1e1b4b" opacity="0.85"/>
      <!-- Sharp edge twist line defining single continuous edge -->
      <path d="M 430,280 Q 500,370 570,340" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlow)"/>
      <path d="M 430,330 Q 500,280 570,370" fill="none" stroke="#ec4899" stroke-width="1.8" filter="url(#neonGlow)" opacity="0.8"/>
    </g>

    <!-- Translucent Center Magnetic Luminescent Rail Guide -->
    <use href="#mobiusCenterline" class="center-rail"/>

    <!-- Track Lateral Curvature Ribs (Transverse gridlines proving ribbon continuity) -->
    <path d="M 195,445 L 205,495 M 130,420 L 150,465 M 80,365 L 120,385 M 85,295 L 125,305 M 140,240 L 165,275 M 230,225 L 245,270"
          stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35"/>
    <path d="M 805,205 L 795,155 M 870,230 L 850,185 M 920,285 L 880,265 M 915,355 L 875,345 M 860,410 L 835,375 M 770,425 L 755,380"
          stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35"/>
  </g>

  <!-- ======================================================== -->
  <!-- LAYER 4: FOREGROUND ROVER PASS (Overlapping & Crisp)      -->
  <!-- ======================================================== -->
  <g id="roverForegroundOcclusion">
    <g id="roverFrontInstance">
      <!-- Synchronized Traversal along Möbius Path -->
      <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
        <mpath href="#mobiusCenterline"/>
      </animateMotion>

      <!-- 720° Topological Transformation: Flip & Scale for Perspective + Inversion -->
      <!-- Smoothly mirrors and restores scaleY across the 16s (2-cycle) period -->
      <animateTransform attributeName="transform" type="scale"
        values="
          1.0  1.0;
          1.25 0.7;
          0.85 0.3;
          0.7 -0.5;
          0.9 -1.0;
          1.3 -0.8;
          0.9 -0.2;
          0.75 0.5;
          1.0  1.0"
        keyTimes="0; 0.15; 0.35; 0.50; 0.65; 0.75; 0.88; 0.95; 1"
        dur="16s" repeatCount="indefinite"/>

      <!-- Layer Visibility Window (Visible in foreground front arcs) -->
      <animate attributeName="opacity"
        values="
          1;
          1;
          0;
          1;
          1;
          1;
          0;
          1;
          1"
        keyTimes="0; 0.22; 0.30; 0.44; 0.68; 0.76; 0.84; 0.92; 1"
        dur="16s" repeatCount="indefinite"/>

      <use href="#roverVehicle"/>
    </g>
  </g>

  <!-- Telemetry HUD & Status Overlay (Vector HUD Graphics) -->
  <g id="telemetryHUD" transform="translate(40, 40)" opacity="0.85">
    <rect width="210" height="95" rx="8" fill="#090d21" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="18" cy="22" r="5" fill="#22c55e" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">MÖBIUS ROVER // V-720</text>
    <text x="18" y="50" fill="#94a3b8" font-family="monospace" font-size="10">CYCLE: <tspan fill="#38bdf8">720° CONTINUOUS</tspan></text>
    <text x="18" y="66" fill="#94a3b8" font-family="monospace" font-size="10">ORIENTATION:
      <tspan fill="#ec4899">
        <animate attributeName="fill" values="#38bdf8;#38bdf8;#ec4899;#ec4899;#38bdf8" keyTimes="0;0.45;0.55;0.95;1" dur="16s" repeatCount="indefinite"/>
      </tspan>
    </text>
    <text x="96" y="66" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">
      <!-- Dynamic HUD Label Swapping -->
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.50;0.98;1" dur="16s" repeatCount="indefinite"/>
      OUTER (0°-360°)
    </text>
    <text x="96" y="66" fill="#ec4899" font-family="monospace" font-size="10" font-weight="bold" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.52;0.98;1" dur="16s" repeatCount="indefinite"/>
      INNER (-180° INV)
    </text>
    <rect x="18" y="78" width="174" height="4" rx="2" fill="#1e293b"/>
    <rect x="18" y="78" width="0" height="4" rx="2" fill="#38bdf8">
      <animate attributeName="width" values="0;174" dur="16s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Speed Dust Particle Accents around Twist Zone -->
  <g id="sparkles">
    <circle cx="500" cy="325" r="1" fill="#ffffff">
      <animate attributeName="r" values="0;3;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="315" r="1.5" fill="#38bdf8">
      <animate attributeName="cy" values="320;305;320" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="525" cy="340" r="1.5" fill="#f43f5e">
      <animate attributeName="cy" values="335;355;335" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>