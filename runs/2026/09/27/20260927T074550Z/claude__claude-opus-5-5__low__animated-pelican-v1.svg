<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <g id="wheel">
      <circle r="60" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="55" fill="none" stroke="#888" stroke-width="1.5"/>
      <g stroke="#999" stroke-width="1.5">
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="-55" y1="0" x2="55" y2="0"/>
        <line x1="-38.9" y1="-38.9" x2="38.9" y2="38.9"/>
        <line x1="-38.9" y1="38.9" x2="38.9" y2="-38.9"/>
        <line x1="-21" y1="-50.8" x2="21" y2="50.8"/>
        <line x1="-50.8" y1="-21" x2="50.8" y2="21"/>
        <line x1="-21" y1="50.8" x2="21" y2="-50.8"/>
        <line x1="-50.8" y1="21" x2="50.8" y2="-21"/>
      </g>
      <circle r="6" fill="#555"/>
    </g>
  </defs>

  <rect width="600" height="420" fill="#cfe9f7"/>
  <rect y="400" width="600" height="20" fill="#9c8b6e"/>

  <!-- Rear wheel -->
  <g transform="translate(200,340)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- Front wheel -->
  <g transform="translate(420,340)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Far leg (180° out of phase) -->
  <path fill="none" stroke="#e08a2e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"
        d="M282,240 L316.1,289.3 L272,330">
    <animate attributeName="d" dur="1s" repeatCount="indefinite" values="
      M282,240 L316.1,289.3 L272,330;
      M282,240 L329.7,276.3 L280.2,310.2;
      M282,240 L339.6,256.9 L300,302;
      M282,240 L340.4,253.8 L319.8,310.2;
      M282,240 L333.8,270.3 L328,330;
      M282,240 L315.2,290.0 L319.8,349.8;
      M282,240 L297.1,298.1 L300,358;
      M282,240 L305.3,295.3 L280.2,349.8;
      M282,240 L316.1,289.3 L272,330"/>
  </path>

  <!-- Frame -->
  <g stroke="#c0392b" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="200" y1="340" x2="300" y2="330"/>
    <line x1="200" y1="340" x2="280" y2="255"/>
    <line x1="300" y1="330" x2="280" y2="255"/>
    <line x1="280" y1="255" x2="395" y2="258"/>
    <line x1="300" y1="330" x2="398" y2="268"/>
    <line x1="392" y1="245" x2="400" y2="272"/>
  </g>
  <line x1="400" y1="268" x2="420" y2="340" stroke="#777" stroke-width="6" stroke-linecap="round"/>
  <!-- Seat post & saddle -->
  <line x1="280" y1="255" x2="276" y2="240" stroke="#555" stroke-width="5"/>
  <path d="M258,238 Q276,232 296,238 L292,244 Q276,242 262,244 Z" fill="#222"/>
  <!-- Stem & handlebar -->
  <line x1="392" y1="245" x2="388" y2="228" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <path d="M370,226 L392,226 Q406,228 404,242" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>

  <!-- Chainring -->
  <circle cx="300" cy="330" r="14" fill="none" stroke="#444" stroke-width="4"/>

  <!-- Crank arms & pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 300 330" to="360 300 330" dur="1s" repeatCount="indefinite"/>
    <line x1="300" y1="330" x2="328" y2="330" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <line x1="300" y1="330" x2="272" y2="330" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <g>
      <rect x="320" y="327" width="16" height="6" rx="2" fill="#111"/>
      <animateTransform attributeName="transform" type="rotate" from="0 328 330" to="-360 328 330" dur="1s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="264" y="327" width="16" height="6" rx="2" fill="#111"/>
      <animateTransform attributeName="transform" type="rotate" from="0 272 330" to="-360 272 330" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>
  <circle cx="300" cy="330" r="5" fill="#666"/>

  <!-- Pelican body -->
  <path d="M225,215 Q240,180 300,185 Q350,190 355,215 Q350,245 300,250 Q250,250 225,215 Z" fill="#7a5a3c"/>
  <path d="M225,215 L195,225 L228,228 Z" fill="#4a3522"/>
  <!-- Wing reaching to handlebar -->
  <path d="M255,205 Q300,195 340,210 Q370,220 382,228 Q350,232 300,228 Q265,225 255,205 Z" fill="#5a4029" stroke="#3b2a1a" stroke-width="1.5"/>
  <path d="M270,212 Q300,208 330,216" fill="none" stroke="#3b2a1a" stroke-width="1.5"/>
  <!-- Neck -->
  <path d="M330,195 Q345,150 330,120 Q325,105 340,95" fill="none" stroke="#6b3a24" stroke-width="18" stroke-linecap="round"/>
  <path d="M338,190 Q352,150 338,120" fill="none" stroke="#f3efe6" stroke-width="5" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="345" cy="92" rx="18" ry="14" fill="#f5f0dc"/>
  <ellipse cx="342" cy="84" rx="12" ry="6" fill="#f2d25a"/>
  <circle cx="350" cy="89" r="3" fill="#111"/>
  <circle cx="351" cy="88" r="1" fill="#fff"/>
  <!-- Bill and pouch -->
  <path d="M358,88 L440,104 L436,110 L360,100 Z" fill="#c9a86a"/>
  <path d="M360,100 L436,110 Q410,132 372,118 Q362,112 360,100 Z" fill="#b8373a"/>
  <path d="M436,104 L446,110 L436,112 Z" fill="#e36a3c"/>

  <!-- Near leg -->
  <path fill="none" stroke="#f0a040" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M282,240 L333.8,270.3 L328,330">
    <animate attributeName="d" dur="1s" repeatCount="indefinite" values="
      M282,240 L333.8,270.3 L328,330;
      M282,240 L315.2,290.0 L319.8,349.8;
      M282,240 L297.1,298.1 L300,358;
      M282,240 L305.3,295.3 L280.2,349.8;
      M282,240 L316.1,289.3 L272,330;
      M282,240 L329.7,276.3 L280.2,310.2;
      M282,240 L339.6,256.9 L300,302;
      M282,240 L340.4,253.8 L319.8,310.2;
      M282,240 L333.8,270.3 L328,330"/>
  </path>
  <circle cx="282" cy="240" r="8" fill="#7a5a3c"/>
</svg>