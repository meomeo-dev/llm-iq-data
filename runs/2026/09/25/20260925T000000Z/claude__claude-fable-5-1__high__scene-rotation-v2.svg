      <path d="M 150 60 C 170 130 140 190 165 250 C 185 300 150 330 160 370"/>
      <path d="M 400 -60 C 420 20 380 80 410 150 C 430 200 400 240 420 300"/>
      <path d="M 700 110 C 680 180 730 240 700 310 C 680 370 720 420 700 470"/>
      <path d="M 620 30 C 640 100 600 160 630 220"/>
      <path d="M 0 170 C 40 200 30 260 60 300"/>
      <path d="M 800 170 C 770 210 790 280 760 330"/>
      <path d="M 520 118 C 530 160 500 200 515 240"/>
    </g>
    <g fill="#3d2c17">
      <use href="#leaf" transform="translate(70 150) rotate(30)"/>
      <use href="#leaf" transform="translate(58 200) rotate(-40)"/>
      <use href="#leaf" transform="translate(66 260) rotate(20)"/>
      <use href="#leaf" transform="translate(50 320) rotate(-60)"/>
      <use href="#leaf" transform="translate(80 380) rotate(40)"/>
      <use href="#leaf" transform="translate(60 440) rotate(-30)"/>
      <use href="#leaf" transform="translate(162 100) rotate(35)"/>
      <use href="#leaf" transform="translate(140 160) rotate(-45)"/>
      <use href="#leaf" transform="translate(168 220) rotate(25)"/>
      <use href="#leaf" transform="translate(150 290) rotate(-50)"/>
      <use href="#leaf" transform="translate(170 340) rotate(50)"/>
      <use href="#leaf" transform="translate(412 0) rotate(30)"/>
      <use href="#leaf" transform="translate(386 60) rotate(-40)"/>
      <use href="#leaf" transform="translate(405 120) rotate(30)"/>
      <use href="#leaf" transform="translate(426 180) rotate(-30)"/>
      <use href="#leaf" transform="translate(396 240) rotate(45)"/>
      <use href="#leaf" transform="translate(418 285) rotate(-55)"/>
      <use href="#leaf" transform="translate(690 150) rotate(-30)"/>
      <use href="#leaf" transform="translate(722 220) rotate(40)"/>
      <use href="#leaf" transform="translate(700 280) rotate(-45)"/>
      <use href="#leaf" transform="translate(684 350) rotate(30)"/>
      <use href="#leaf" transform="translate(716 410) rotate(-35)"/>
      <use href="#leaf" transform="translate(700 455) rotate(40)"/>
      <use href="#leaf" transform="translate(632 70) rotate(-30)"/>
      <use href="#leaf" transform="translate(608 140) rotate(40)"/>
      <use href="#leaf" transform="translate(626 200) rotate(-50)"/>
      <use href="#leaf" transform="translate(30 190) rotate(50)"/>
      <use href="#leaf" transform="translate(40 250) rotate(-30)"/>
      <use href="#leaf" transform="translate(775 210) rotate(-50)"/>
      <use href="#leaf" transform="translate(785 280) rotate(40)"/>
      <use href="#leaf" transform="translate(524 150) rotate(30)"/>
      <use href="#leaf" transform="translate(504 200) rotate(-40)"/>
    </g>

    <!-- collapsed planting bench, right side -->
    <g fill="#231809">
      <polygon points="600,470 760,470 770,455 700,430 590,438"/>
      <rect x="605" y="455" width="8" height="30"/>
      <rect x="748" y="452" width="8" height="34"/>
    </g>
    <g fill="#2f2110">
      <path d="M 640 470 q 10 -30 30 -10 q 5 -25 22 -5 q 10 -20 20 5 q -5 25 -20 10 Z"/>
    </g>

    <!-- undergrowth on the floor -->
    <g fill="#241809">
      <path d="M -60 560 C -20 470 30 500 40 540 C 70 490 110 520 100 560 C 140 530 170 560 150 585 Z"/>
      <path d="M 560 560 C 590 500 630 520 640 555 C 660 520 720 530 720 570 C 760 550 800 570 790 600 L 560 600 Z"/>
      <path d="M 240 520 C 250 490 280 495 285 520 C 300 500 320 510 315 530 Z"/>
    </g>
    <g fill="#3a2914">
      <path d="M 0 540 C 10 505 40 510 42 540 Z"/>
      <path d="M 90 545 C 100 512 128 518 128 548 Z"/>
      <path d="M 610 550 C 620 520 650 525 648 552 Z"/>
      <path d="M 690 560 C 700 528 730 532 728 562 Z"/>
    </g>

    <!-- fallen glass shards catching the light -->
    <g fill="#c9b58c" opacity="0.7">
      <polygon points="330,498 352,504 336,512"/>
      <polygon points="372,520 390,516 384,530"/>
      <polygon points="520,512 540,520 522,526"/>
      <polygon points="470,540 486,544 478,552"/>
    </g>

    <!-- ground shadow -->
    <ellipse cx="446" cy="532" rx="66" ry="9" fill="#0d0803" opacity="0.6"/>

    <!-- ========== capybara on a unicycle ========== -->
    <!-- far hind leg -->
    <path d="M 420 392 Q 402 430 418 465" stroke="#5c4228" stroke-width="10" stroke-linecap="round" fill="none"/>
    <ellipse cx="416" cy="467" rx="9" ry="5" fill="#5c4228"/>
    <!-- far crank + pedal -->
    <line x1="440" y1="485" x2="418" y2="465" stroke="#6b5233" stroke-width="4" stroke-linecap="round"/>
    <rect x="410" y="463" width="16" height="5" rx="1" fill="#6b5233" transform="rotate(-20 418 465)"/>

    <!-- wheel -->
    <circle cx="440" cy="485" r="45" fill="none" stroke="#1c1309" stroke-width="8"/>
    <circle cx="440" cy="485" r="37" fill="none" stroke="#a3845a" stroke-width="2.5"/>
    <g stroke="#a3845a" stroke-width="1.4" opacity="0.9">
      <line x1="440" y1="448" x2="440" y2="522"/>
      <line x1="403" y1="485" x2="477" y2="485"/>
      <line x1="414" y1="459" x2="466" y2="511"/>
      <line x1="466" y1="459" x2="414" y2="511"/>
      <line x1="421" y1="452" x2="459" y2="518"/>
      <line x1="459" y1="452" x2="421" y2="518"/>
      <line x1="407" y1="466" x2="473" y2="504"/>
      <line x1="473" y1="466" x2="407" y2="504"/>
    </g>
    <circle cx="440" cy="485" r="6" fill="#a3845a"/>
    <!-- fork and seat -->
    <line x1="433" y1="485" x2="433" y2="420" stroke="#8a6c45" stroke-width="3.5"/>
    <line x1="447" y1="485" x2="447" y2="420" stroke="#8a6c45" stroke-width="3.5"/>
    <rect x="429" y="416" width="22" height="7" rx="2" fill="#8a6c45"/>
    <line x1="440" y1="418" x2="440" y2="396" stroke="#8a6c45" stroke-width="5"/>
    <ellipse cx="440" cy="394" rx="22" ry="7" fill="#3a2a15"/>

    <!-- body -->
    <ellipse cx="452" cy="355" rx="64" ry="44" transform="rotate(-10 452 355)" fill="#8a6742"/>
    <ellipse cx="446" cy="372" rx="44" ry="22" transform="rotate(-10 446 372)" fill="#a07d52" opacity="0.65"/>
    <ellipse cx="500" cy="330" rx="22" ry="20" fill="#8a6742"/>
    <!-- head -->
    <path d="M 500 300 L 545 296 Q 566 300 568 318 L 566 340 Q 562 352 548 352 L 522 350 Q 498 348 496 325 Z" fill="#8a6742"/>
    <ellipse cx="522" cy="293" rx="7" ry="9" fill="#5a4128"/>
    <ellipse cx="507" cy="296" rx="8" ry="10" fill="#6f5233"/>
    <ellipse cx="508" cy="297" rx="4" ry="6" fill="#4a3520"/>
    <circle cx="532" cy="316" r="4" fill="#1a1208"/>
    <circle cx="533.5" cy="314.5" r="1.3" fill="#f2e6cc"/>
    <path d="M 522 306 L 542 309" stroke="#4a3520" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="560" cy="322" r="2.2" fill="#3a2a15"/>
    <path d="M 552 340 Q 560 344 566 338" stroke="#4a3520" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- moonlight rim on head and back -->
    <path d="M 395 338 Q 440 298 505 316" stroke="#e6d2ab" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M 502 300 Q 540 291 566 306" stroke="#e6d2ab" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>

    <!-- near hind leg on the down pedal -->
    <ellipse cx="432" cy="382" rx="24" ry="18" fill="#7f5f3c"/>
    <path d="M 440 395 Q 462 440 462 500" stroke="#7a5a38" stroke-width="11" stroke-linecap="round" fill="none"/>
    <line x1="440" y1="485" x2="462" y2="505" stroke="#8a6c45" stroke-width="4" stroke-linecap="round"/>
    <rect x="455" y="503" width="16" height="5" rx="1" fill="#8a6c45" transform="rotate(-20 463 505)"/>
    <ellipse cx="464" cy="503" rx="10" ry="5" fill="#7a5a38"/>

    <!-- front legs held out for balance -->
    <path d="M 492 362 Q 506 380 508 398" stroke="#5c4228" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 500 360 Q 520 372 528 392" stroke="#7a5a38" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="530" cy="395" r="6.5" fill="#7a5a38"/>
    <circle cx="509" cy="400" r="6" fill="#5c4228"/>
  </g>

  <!-- vignette -->
  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>