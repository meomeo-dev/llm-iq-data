      <line x1="80" y1="200" x2="-80" y2="140"/>
      <line x1="144" y1="172" x2="16" y2="98"/>
      <line x1="208" y1="144" x2="112" y2="56"/>
      <line x1="272" y1="116" x2="208" y2="14"/>
      <line x1="336" y1="88" x2="304" y2="-28"/>
      <line x1="400" y1="60" x2="400" y2="-70"/>
      <line x1="464" y1="88" x2="496" y2="-28"/>
      <line x1="528" y1="116" x2="592" y2="14"/>
      <line x1="592" y1="144" x2="688" y2="56"/>
      <line x1="656" y1="172" x2="784" y2="98"/>
      <line x1="720" y1="200" x2="880" y2="140"/>
      <polyline points="0,170 400,-5 800,170"/>
      <polyline points="-80,140 400,-70 880,140"/>
      <line x1="0" y1="170" x2="0" y2="508"/>
      <line x1="800" y1="170" x2="800" y2="508"/>
      <line x1="80" y1="470" x2="-80" y2="545"/>
      <line x1="720" y1="470" x2="880" y2="545"/>
      <line x1="80" y1="250" x2="-80" y2="215"/>
      <line x1="80" y1="300" x2="-80" y2="290"/>
      <line x1="80" y1="350" x2="-80" y2="365"/>
      <line x1="80" y1="400" x2="-80" y2="440"/>
      <line x1="720" y1="250" x2="880" y2="215"/>
      <line x1="720" y1="300" x2="880" y2="290"/>
      <line x1="720" y1="350" x2="880" y2="365"/>
      <line x1="720" y1="400" x2="880" y2="440"/>
    </g>

    <!-- glass shards still hanging in the broken roof pane -->
    <g fill="#c9b58c" opacity="0.5">
      <polygon points="200,20 222,26 214,48"/>
      <polygon points="314,44 306,70 296,50"/>
      <polygon points="258,102 248,88 270,92"/>
    </g>

    <!-- moonlight beams -->
    <polygon points="205,28 300,28 600,530 400,548" fill="url(#beam)"/>
    <polygon points="296,30 328,30 700,522 636,534" fill="url(#beam)" opacity="0.5"/>
    <polygon points="546,258 588,258 620,470 560,470" fill="url(#beam)" opacity="0.35"/>

    <!-- dust motes in the light -->
    <g fill="#f3e6c4" opacity="0.55">
      <circle cx="310" cy="150" r="1.4"/>
      <circle cx="340" cy="210" r="1"/>
      <circle cx="372" cy="240" r="1.6"/>
      <circle cx="360" cy="300" r="1"/>
      <circle cx="405" cy="330" r="1.3"/>
      <circle cx="430" cy="270" r="1"/>
      <circle cx="470" cy="400" r="1.5"/>
      <circle cx="500" cy="440" r="1"/>
      <circle cx="330" cy="120" r="1.2"/>
      <circle cx="390" cy="180" r="1"/>
      <circle cx="520" cy="470" r="1.4"/>
      <circle cx="455" cy="210" r="1"/>
      <circle cx="540" cy="380" r="1.1"/>
