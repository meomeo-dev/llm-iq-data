<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1e0f"/>
      <stop offset="1" stop-color="#4d3822"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2b17"/>
      <stop offset="1" stop-color="#1a1108"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e6c4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f3e6c4" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7ecd2" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#f7ecd2" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f7ecd2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f0904" stop-opacity="0.9"/>
    </radialGradient>
    <g id="leaf">
      <path d="M0 0 C 6 -10 18 -10 22 0 C 18 10 6 10 0 0 Z"/>
      <path d="M2 0 L 20 0" stroke="#2a1d0e" stroke-width="1" fill="none"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#1a1208"/>

  <!-- Dutch-angle scene -->
  <g transform="rotate(-11 400 300) translate(400 300) scale(1.28) translate(-400 -300)">

    <!-- night sky beyond the glass -->
    <rect x="-300" y="-300" width="1400" height="1200" fill="url(#sky)"/>

    <!-- floor -->
    <rect x="-300" y="470" width="1400" height="600" fill="url(#floor)"/>
    <g stroke="#2a1c0d" stroke-width="2" fill="none" opacity="0.8">
      <path d="M 80 470 L -140 630"/>
      <path d="M 240 470 L 112 660"/>
      <path d="M 400 470 L 400 660"/>
      <path d="M 560 470 L 688 660"/>
      <path d="M 720 470 L 940 630"/>
      <path d="M -60 507 L 860 507"/>
      <path d="M -160 545 L 960 545"/>
      <path d="M -300 590 L 1100 590"/>
    </g>

    <!-- grime on all glass -->
    <polygon points="-300,-300 1100,-300 1100,470 -300,470" fill="#2b1e0f" opacity="0.5"/>

    <!-- broken panes: moonlit sky showing through -->
    <polygon points="200,20 235,3 290,8 314,44 304,90 258,102 214,82 194,52" fill="#8a6b45" opacity="0.55"/>
    <polygon points="530,252 590,255 586,298 562,286 546,300 532,281" fill="#7d6240" opacity="0.6"/>
    <polygon points="150,300 205,302 200,345 178,332 160,350 148,326" fill="#7d6240" opacity="0.5"/>
    <polygon points="-70,220 -20,235 -25,285 -60,270" fill="#7d6240" opacity="0.4"/>

    <!-- moon -->
    <circle cx="250" cy="50" r="110" fill="url(#moonglow)"/>
    <circle cx="250" cy="50" r="34" fill="#f4e8cd"/>
    <circle cx="238" cy="42" r="6" fill="#dccbaa" opacity="0.7"/>
    <circle cx="262" cy="60" r="4" fill="#dccbaa" opacity="0.7"/>
    <circle cx="255" cy="36" r="3" fill="#dccbaa" opacity="0.6"/>

    <!-- greenhouse frame: end gable wall -->
    <g stroke="#1c1309" stroke-width="3.5" fill="none" stroke-linecap="round">
      <polygon points="80,470 80,200 400,60 720,200 720,470"/>
      <line x1="144" y1="172" x2="144" y2="470"/>
      <line x1="208" y1="144" x2="208" y2="470"/>
      <line x1="272" y1="116" x2="272" y2="470"/>
      <line x1="336" y1="88" x2="336" y2="470"/>
      <line x1="400" y1="60" x2="400" y2="470"/>
      <line x1="464" y1="88" x2="464" y2="470"/>
      <line x1="528" y1="116" x2="528" y2="470"/>
      <line x1="592" y1="144" x2="592" y2="470"/>
      <line x1="656" y1="172" x2="656" y2="470"/>
      <line x1="80" y1="250" x2="720" y2="250"/>
      <line x1="80" y1="300" x2="720" y2="300"/>
      <line x1="80" y1="350" x2="720" y2="350"/>
      <line x1="80" y1="400" x2="720" y2="400"/>
      <line x1="80" y1="450" x2="720" y2="450"/>
      <line x1="80" y1="200" x2="720" y2="200"/>
      <line x1="194" y1="150" x2="606" y2="150"/>
      <line x1="309" y1="100" x2="491" y2="100"/>
