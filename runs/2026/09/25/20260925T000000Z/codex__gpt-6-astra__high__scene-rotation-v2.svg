<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
  <title id="title">Still Growing</title>
  <desc id="desc">A determined capybara rides a unicycle through an abandoned greenhouse.
    Everything tilts at a Dutch angle. Sepia moonlight pours through broken glass,
    illuminating tangled vines, weathered ironwork, and a small new shoot.</desc>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#241b14"/>
      <stop offset="0.6" stop-color="#4f3c28"/>
      <stop offset="1" stop-color="#201a13"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop stop-color="#f5dfb0" stop-opacity=".6"/>
      <stop offset=".35" stop-color="#d4b783" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d4b783" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c9ad7c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#94744b" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2=".2" y2="1">
      <stop stop-color="#ffe7b5" stop-opacity=".4"/>
      <stop offset="1" stop-color="#f5d69b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#695035"/>
      <stop offset="1" stop-color="#2b2118"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="1" x2=".85" y2=".1">
      <stop stop-color="#735033"/>
      <stop offset=".55" stop-color="#a47a4c"/>
      <stop offset="1" stop-color="#dab17a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="1" x2=".7" y2="0">
      <stop stop-color="#aa7d4f"/>
      <stop offset="1" stop-color="#e1bd87"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4b3927"/>
      <stop offset=".5" stop-color="#e0c38f"/>
      <stop offset="1" stop-color="#755a39"/>
    </linearGradient>
    <radialGradient id="vignette">
      <stop offset=".55" stop-color="#17130e" stop-opacity="0"/>
      <stop offset="1" stop-color="#17130e" stop-opacity=".65"/>
    </radialGradient>
    <pattern id="grain" width="37" height="43" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="9" r=".7" fill="#f2d8a9" opacity=".13"/>
      <circle cx="23" cy="30" r=".8" fill="#130e09" opacity=".2"/>
      <path d="M12 35h3M29 14h2" stroke="#e9c991" stroke-opacity=".09"/>
    </pattern>
    <g id="leaf">
      <path d="M0 0C-19-2-26-20-24-32C-7-30 5-17 0 0Z" fill="#78623e"/>
      <path d="M0 0-19-25" fill="none" stroke="#b89a64" stroke-width="1.3"/>
    </g>
    <g id="darkLeaf">
      <path d="M0 0C-23-1-34-21-30-39C-8-34 7-18 0 0Z" fill="#352e1d"/>
      <path d="M0 0-23-31" stroke="#74603c" stroke-width="1.2"/>
    </g>
    <g id="fern" fill="none" stroke-linecap="round">
      <path d="M0 0Q-8-64 15-125" stroke="#7d6943" stroke-width="3"/>
      <path d="M-1-15Q-33-20-43-40M-2-29Q24-30 36-46
        M-2-43Q-31-48-39-68M0-58Q29-58 39-79
        M3-72Q-20-80-23-97M7-87Q30-88 37-108
        M11-103Q-2-109 0-122" stroke="#655536" stroke-width="7"/>
      <path d="M-1-15-38-35M-2-29 31-42M-2-43-34-62
        M0-58 34-73M3-72-19-91M7-87 33-102"
        stroke="#a38a56" stroke-width="1"/>
    </g>
  </defs>

  <rect width="900" height="1000" fill="url(#night)"/>
  <circle cx="649" cy="176" r="240" fill="url(#moonGlow)"/>

