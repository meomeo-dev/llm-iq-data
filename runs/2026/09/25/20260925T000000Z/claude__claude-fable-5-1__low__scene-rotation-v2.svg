<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f14"/>
      <stop offset="1" stop-color="#4a3826"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d5b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8d5b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#f3e6c8"/>
      <stop offset="1" stop-color="#f3e6c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9ad80" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c9ad80" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="800" height="600"/></clipPath>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Dutch angle: whole scene rotated -->
  <g clip-path="url(#frame)">
  <g transform="rotate(-12 400 300) scale(1.25) translate(-80 -60)">

    <!-- Moon -->
    <circle cx="640" cy="60" r="70" fill="url(#moon)"/>
    <circle cx="640" cy="60" r="34" fill="#f6ead0"/>

    <!-- Back wall + glass panes -->
    <rect x="40" y="40" width="720" height="360" fill="#3b2c1c"/>
    <g stroke="#1f160d" stroke-width="6" fill="#4d3b27">
      <rect x="60" y="60" width="130" height="150"/>
      <rect x="200" y="60" width="130" height="150"/>
      <rect x="340" y="60" width="130" height="150"/>
      <rect x="480" y="60" width="130" height="150"/>
      <rect x="620" y="60" width="120" height="150"/>
      <rect x="60" y="220" width="130" height="150"/>
      <rect x="200" y="220" width="130" height="150"/>
      <rect x="340" y="220" width="130" height="150"/>
      <rect x="480" y="220" width="130" height="150"/>
      <rect x="620" y="220" width="120" height="150"/>
    </g>
    <!-- Broken panes: bright sky showing through jagged holes -->
    <g fill="#8a7050">
      <polygon points="350,70 460,66 455,130 420,110 400,160 360,140 345,120"/>
      <polygon points="490,225 600,222 598,300 560,270 545,330 505,300 488,260"/>
      <polygon points="210,230 300,228 290,280 260,262 240,300 215,275"/>
      <polygon points="630,70 735,66 732,140 700,110 690,150 640,130"/>
    </g>
    <!-- Cracks -->
    <g stroke="#1f160d" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M80 100 L130 140 L110 190 M130 140 L170 120"/>
      <path d="M500 80 L540 130 L600 150 M540 130 L560 200"/>
      <path d="M640 260 L680 300 L660 350 M680 300 L720 280"/>
    </g>

    <!-- Roof ridge -->
    <polygon points="20,45 400,-40 780,45" fill="#2e2214" stroke="#1f160d" stroke-width="4"/>
    <g stroke="#1f160d" stroke-width="3">
      <line x1="120" y1="45" x2="400" y2="-20"/>
      <line x1="240" y1="45" x2="400" y2="-20"/>
      <line x1="560" y1="45" x2="400" y2="-20"/>
      <line x1="680" y1="45" x2="400" y2="-20"/>
    </g>

    <!-- Moonlight beams through broken panes -->
    <g opacity="0.9">
      <polygon points="350,70 460,66 560,470 300,470" fill="url(#beam)"/>
      <polygon points="490,225 600,222 700,470 500,470" fill="url(#beam)" opacity="0.7"/>
      <polygon points="210,230 300,228 330,470 150,470" fill="url(#beam)" opacity="0.5"/>
    </g>

    <!-- Floor -->
    <rect x="0" y="400" width="800" height="200" fill="#3a2b1a"/>
    <g stroke="#2a1d10" stroke-width="2">
      <line x1="0" y1="430" x2="800" y2="430"/>
      <line x1="0" y1="465" x2="800" y2="465"/>
      <line x1="0" y1="505" x2="800" y2="505"/>
      <line x1="0" y1="550" x2="800" y2="550"/>
      <line x1="100" y1="400" x2="20" y2="600"/>
      <line x1="300" y1="400" x2="260" y2="600"/>
      <line x1="500" y1="400" x2="540" y2="600"/>
      <line x1="700" y1="400" x2="780" y2="600"/>
    </g>
    <ellipse cx="420" cy="480" rx="220" ry="60" fill="url(#floorglow)"/>

    <!-- Broken pots and debris -->
    <g fill="#2a1d10">
      <path d="M90 400 l60 0 l-8 -40 l-44 0 z"/>
      <path d="M160 400 l40 0 l-5 -25 l-30 0 z"/>
      <path d="M680 405 l55 0 l-10 -35 l-35 0 z"/>
      <polygon points="230,395 250,380 265,398"/>
    </g>

    <!-- Vines: hanging from roof and crawling walls -->
    <g stroke="#1c1409" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M60 40 C 70 120, 40 180, 70 260 S 60 380, 90 400"/>
      <path d="M180 40 C 200 100, 160 150, 190 220 S 200 320, 170 370"/>
      <path d="M740 40 C 720 110, 760 170, 730 250 S 740 350, 700 400"/>
      <path d="M620 40 C 640 90, 600 130, 630 190"/>
      <path d="M400 -20 C 380 40, 430 80, 400 150 S 420 240, 390 280"/>
      <path d="M0 200 C 60 190, 90 240, 150 230 S 260 260, 300 240"/>
      <path d="M800 320 C 740 300, 700 350, 640 330 S 560 350, 520 330"/>
    </g>
    <!-- Leaves -->
    <g fill="#241a0e">
      <ellipse cx="72" cy="120" rx="14" ry="7" transform="rotate(-30 72 120)"/>
      <ellipse cx="52" cy="200" rx="14" ry="7" transform="rotate(20 52 200)"/>
      <ellipse cx="78" cy="300" rx="14" ry="7" transform="rotate(-40 78 300)"/>
      <ellipse cx="192" cy="110" rx="13" ry="6" transform="rotate(30 192 110)"/>
      <ellipse cx="170" cy="180" rx="13" ry="6" transform="rotate(-20 170 180)"/>
      <ellipse cx="200" cy="300" rx="13" ry="6" transform="rotate(40 200 300)"/>
      <ellipse cx="728" cy="120" rx="14" ry="7" transform="rotate(30 728 120)"/>
      <ellipse cx="752" cy="210" rx="14" ry="7" transform="rotate(-25 752 210)"/>
      <ellipse cx="722" cy="320" rx="14" ry="7" transform="rotate(35 722 320)"/>
      <ellipse cx="612" cy="100" rx="12" ry="6" transform="rotate(-30 612 100)"/>
      <ellipse cx="410" cy="60" rx="12" ry="6" transform="rotate(25 410 60)"/>
      <ellipse cx="392" cy="200" rx="12" ry="6" transform="rotate(-35 392 200)"/>
      <ellipse cx="120" cy="215" rx="13" ry="6" transform="rotate(15 120 215)"/>
      <ellipse cx="240" cy="250" rx="13" ry="6" transform="rotate(-15 240 250)"/>
      <ellipse cx="680" cy="325" rx="13" ry="6" transform="rotate(20 680 325)"/>
      <ellipse cx="580" cy="340" rx="13" ry="6" transform="rotate(-20 580 340)"/>
    </g>

    <!-- Shadow of capybara -->
    <ellipse cx="430" cy="470" rx="90" ry="14" fill="#1c1409" opacity="0.7"/>

    <!-- Unicycle -->
    <g transform="translate(410 0)">
      <circle cx="0" cy="425" r="42" fill="none" stroke="#1c1409" stroke-width="7"/>
      <circle cx="0" cy="425" r="34" fill="none" stroke="#8a7050" stroke-width="2"/>
      <g stroke="#a48a60" stroke-width="2.5">
        <line x1="0" y1="391" x2="0" y2="459"/>
        <line x1="-34" y1="425" x2="34" y2="425"/>
        <line x1="-24" y1="401" x2="24" y2="449"/>
        <line x1="24" y1="401" x2="-24" y2="449"/>
      </g>
      <circle cx="0" cy="425" r="6" fill="#1c1409"/>
      <!-- fork and seat post -->
      <path d="M-12 418 L-6 340 L6 340 L12 418" fill="#2a1d10" stroke="#1c1409" stroke-width="2"/>
      <rect x="-3" y="300" width="6" height="45" fill="#1c1409"/>
      <path d="M-22 302 Q0 292 22 302 L18 310 L-18 310 Z" fill="#1c1409"/>
      <!-- pedals and cranks -->
      <line x1="0" y1="425" x2="20" y2="448" stroke="#1c1409" stroke-width="4"/>
      <line x1="0" y1="425" x2="-20" y2="402" stroke="#1c1409" stroke-width="4"/>
      <rect x="14" y="445" width="16" height="6" fill="#1c1409"/>
      <rect x="-30" y="399" width="16" height="6" fill="#1c1409"/>
    </g>

    <!-- Capybara -->
    <g transform="translate(410 0)">
      <!-- back leg (bent, on rear pedal) -->
      <path d="M-25 300 Q-45 340 -30 380 Q-28 395 -22 402" fill="none" stroke="#5a4127" stroke-width="16" stroke-linecap="round"/>
      <!-- body -->
      <ellipse cx="0" cy="250" rx="72" ry="52" fill="#7a5a38"/>
      <ellipse cx="-10" cy="262" rx="58" ry="36" fill="#8c6a44"/>
      <!-- front leg (extended to front pedal) -->
      <path d="M20 290 Q30 360 22 400 L22 445" fill="none" stroke="#6b4c2c" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="22" cy="447" rx="12" ry="6" fill="#4a3320"/>
      <!-- arms out for balance -->
      <path d="M-40 230 Q-100 200 -140 215" fill="none" stroke="#6b4c2c" stroke-width="14" stroke-linecap="round"/>
      <path d="M40 220 Q100 190 150 175" fill="none" stroke="#6b4c2c" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="-142" cy="216" rx="10" ry="6" fill="#4a3320"/>
      <ellipse cx="152" cy="174" rx="10" ry="6" fill="#4a3320"/>
      <!-- head -->
      <g transform="translate(55 190) rotate(-8)">
        <path d="M-40 -10 Q-45 -45 -5 -48 Q40 -50 60 -20 Q72 5 55 22 Q30 38 -10 32 Q-42 26 -40 -10 Z" fill="#8c6a44"/>
        <path d="M20 -10 Q45 -12 60 -8 Q72 5 55 22 Q35 30 22 20 Z" fill="#7a5a38"/>
        <!-- ears -->
        <ellipse cx="-25" cy="-42" rx="11" ry="9" fill="#6b4c2c"/>
        <ellipse cx="-24" cy="-42" rx="6" ry="5" fill="#4a3320"/>
        <ellipse cx="8" cy="-48" rx="11" ry="9" fill="#6b4c2c"/>
        <ellipse cx="9" cy="-48" rx="6" ry="5" fill="#4a3320"/>
        <!-- eye: determined, slightly narrowed, catching moonlight -->
        <ellipse cx="8" cy="-14" rx="8" ry="6" fill="#1c1409"/>
        <circle cx="10" cy="-16" r="2.2" fill="#f6ead0"/>
        <path d="M-2 -22 L18 -20" stroke="#4a3320" stroke-width="3" stroke-linecap="round"/>
        <!-- nostrils and mouth -->
        <ellipse cx="58" cy="-2" rx="3" ry="2" fill="#1c1409"/>
        <path d="M46 14 Q54 20 62 12" fill="none" stroke="#3a2914" stroke-width="2.5" stroke-linecap="round"/>
        <!-- whiskers -->
        <g stroke="#c9ad80" stroke-width="1" opacity="0.7">
          <line x1="50" y1="4" x2="80" y2="-2"/>
          <line x1="50" y1="8" x2="82" y2="10"/>
          <line x1="48" y1="12" x2="78" y2="20"/>
        </g>
      </g>
      <!-- moonlight rim on back -->
      <path d="M-60 215 Q-20 195 30 205" fill="none" stroke="#e8d5b0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <path d="M-20 165 Q10 150 45 158" fill="none" stroke="#e8d5b0" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Dust motes in the moonbeam -->
    <g fill="#f6ead0" opacity="0.7">
      <circle cx="380" cy="150" r="1.5"/>
      <circle cx="420" cy="210" r="1.2"/>
      <circle cx="455" cy="180" r="1.8"/>
      <circle cx="400" cy="300" r="1.3"/>
      <circle cx="470" cy="330" r="1.5"/>
      <circle cx="360" cy="380" r="1.2"/>
      <circle cx="520" cy="280" r="1.4"/>
      <circle cx="560" cy="400" r="1.6"/>
      <circle cx="260" cy="320" r="1.2"/>
      <circle cx="300" cy="420" r="1.4"/>
    </g>

    <!-- Small hopeful sprout in moonlight on the floor -->
    <g transform="translate(560 455)">
      <path d="M0 0 Q2 -18 0 -32" fill="none" stroke="#c9ad80" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="-8" cy="-26" rx="9" ry="4" transform="rotate(-30 -8 -26)" fill="#c9ad80"/>
      <ellipse cx="8" cy="-32" rx="9" ry="4" transform="rotate(30 8 -32)" fill="#c9ad80"/>
    </g>

  </g>
  </g>

  <!-- Vignette -->
  <rect width="800" height="600" fill="none" stroke="#1a1208" stroke-width="80" opacity="0.45"/>
</svg>