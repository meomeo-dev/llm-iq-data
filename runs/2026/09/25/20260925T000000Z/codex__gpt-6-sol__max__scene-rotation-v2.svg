<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700"
     viewBox="0 0 1000 700" role="img"
     aria-labelledby="title description">
  <title id="title">Capybara riding a unicycle through an abandoned greenhouse</title>
  <desc id="description">
    A determined capybara pedals through an overgrown greenhouse. The scene
    tilts at a Dutch angle, and sepia moonlight enters through broken panes.
  </desc>

  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#1c1713"/>
      <stop offset=".55" stop-color="#403429"/>
      <stop offset="1" stop-color="#6c5841"/>
    </linearGradient>
    <linearGradient id="ground" x2="0" y2="1">
      <stop stop-color="#604c38"/>
      <stop offset="1" stop-color="#211b16"/>
    </linearGradient>
    <linearGradient id="moonbeam" x2=".4" y2="1">
      <stop stop-color="#f4dcac" stop-opacity=".38"/>
      <stop offset="1" stop-color="#e5c590" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop stop-color="#f4dfb8" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#e8cfa0" stop-opacity=".2"/>
      <stop offset="1" stop-color="#e8cfa0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2=".3" y2="1">
      <stop stop-color="#d2b486"/>
      <stop offset=".58" stop-color="#a5835e"/>
      <stop offset="1" stop-color="#6c4f38"/>
    </linearGradient>
    <linearGradient id="face" x2="0" y2="1">
      <stop stop-color="#ceb084"/>
      <stop offset="1" stop-color="#8f6d4d"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="#191510"/>
  <g transform="rotate(-8 500 350)">
    <!-- Greenhouse, seen through its crooked outer frame. -->
    <path d="M25 270 500 24 975 270V700H25Z" fill="url(#night)"/>
    <circle cx="755" cy="150" r="158" fill="url(#moonGlow)"/>
    <circle cx="755" cy="150" r="44" fill="#e6d1a9"/>
    <circle cx="742" cy="139" r="9" fill="#bda57f" opacity=".3"/>
    <circle cx="770" cy="164" r="5" fill="#bda57f" opacity=".28"/>

    <!-- Light falls through gaps in the right-hand roof. -->
    <path d="m675 135 118 57 90 508H285Z" fill="url(#moonbeam)"/>
    <path d="m722 155 34 18 44 527H620Z" fill="#f2d6a5"
          opacity=".08"/>

    <!-- Distant frame and panes. -->
    <path d="M128 342 500 153 872 342M128 342v262m744-262v262"
          fill="none" stroke="#241d17" stroke-width="15"/>
    <path d="M500 153v460M285 263v327m430-327v327M128 405h744"
          fill="none" stroke="#30261d" stroke-width="9"/>
    <path d="M129 342 285 263 285 405H129Zm156-79 215-110v252H285Z"
          fill="#d4b887" opacity=".045"/>
    <path d="M500 153 715 263v142H500Z" fill="#e6c995" opacity=".075"/>
    <path d="m715 263 157 79v63H715Z" fill="#c5a779" opacity=".05"/>

    <!-- Near rafters and broken glass. -->
    <path d="M25 270 500 24 975 270M25 270v430m950-430v430M500 24v214"
          fill="none" stroke="#17130f" stroke-width="24"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 270 500 24 975 270M25 270v430m950-430v430"
          fill="none" stroke="#8e7050" stroke-width="3" opacity=".55"/>
    <path d="M188 186 188 305m156-200v230m312-230v230m156-149v119
             M82 239l418-114 418 114"
          fill="none" stroke="#35291e" stroke-width="12"/>
    <path d="m188 186 156-81-4 116-47-14-24 35-81 25Z
             m156-81 156-81v111l-52 11-22-22-82 16Z
             m156-81 156 81-54 22-33-15-69 22Z"
          fill="#e7ce9f" opacity=".065" stroke="#d9bf91"
          stroke-width="2"/>
    <path d="m656 105 156 81-42 28-17-41-31 14-23-37-43 21Z"
          fill="#ead3a5" opacity=".1" stroke="#e8d0a0"
          stroke-width="2"/>
    <path d="m813 187 105 52-60-5-20-23-25 10Z"
          fill="#ead3a5" opacity=".09" stroke="#e8d0a0"
          stroke-width="2"/>
    <path d="m676 158 27 9-8 43 31-20-10 50
             m93-28 18 17-32 10 25 15"
          fill="none" stroke="#e5c99a" stroke-width="3"
          opacity=".55"/>

    <!-- Long-neglected floor and planting beds. -->
    <path d="M25 564q245-51 475 6 230-57 475-6v136H25Z"
          fill="url(#ground)"/>
    <path d="M363 561 159 700m467-139 215 139M500 571v129"
          stroke="#a18460" stroke-width="3" opacity=".35"/>
    <path d="M33 601q180-32 336-15m269 0q160-19 329 13
             M80 651q145-30 259-13m322 2q128-20 278 13"
          fill="none" stroke="#271e17" stroke-width="5" opacity=".75"/>
    <path d="m64 556 21-70 67 11 17 70m663-2 16-75 67-13 27 85"
          fill="#3c3024" stroke="#1b1712" stroke-width="8"/>
    <path d="M90 489q38 9 65 4m698-1q34 0 60-15"
          fill="none" stroke="#b08e65" stroke-width="4" opacity=".5"/>

    <!-- Vines climb the posts and reach across the roof. -->
    <g fill="none" stroke="#25231a" stroke-width="11"
       stroke-linecap="round">
      <path d="M29 689q80-108 59-225T55 265q-24-75 60-109t144-40"/>
      <path d="M969 700q-64-84-48-168t-7-170q-21-75 1-132"/>
      <path d="M482 25q-41 60-15 112t-24 88"/>
    </g>
    <g fill="none" stroke="#766746" stroke-width="3"
       stroke-linecap="round" opacity=".72">
      <path d="M29 689q80-108 59-225T55 265q-24-75 60-109t144-40"/>
      <path d="M969 700q-64-84-48-168t-7-170q-21-75 1-132"/>
      <path d="M482 25q-41 60-15 112t-24 88"/>
    </g>
    <g fill="#625a3d" stroke="#222018" stroke-width="2">
      <ellipse cx="75" cy="541" rx="17" ry="7" transform="rotate(-43 75 541)"/>
      <ellipse cx="103" cy="497" rx="20" ry="8" transform="rotate(35 103 497)"/>
      <ellipse cx="49" cy="428" rx="17" ry="7" transform="rotate(-35 49 428)"/>
      <ellipse cx="87" cy="370" rx="19" ry="8" transform="rotate(42 87 370)"/>
      <ellipse cx="52" cy="299" rx="17" ry="7" transform="rotate(-42 52 299)"/>
      <ellipse cx="103" cy="166" rx="19" ry="8" transform="rotate(38 103 166)"/>
      <ellipse cx="200" cy="132" rx="20" ry="8" transform="rotate(-28 200 132)"/>
      <ellipse cx="933" cy="594" rx="18" ry="8" transform="rotate(39 933 594)"/>
      <ellipse cx="901" cy="526" rx="19" ry="8" transform="rotate(-43 901 526)"/>
      <ellipse cx="930" cy="452" rx="20" ry="8" transform="rotate(36 930 452)"/>
      <ellipse cx="907" cy="381" rx="17" ry="7" transform="rotate(-37 907 381)"/>
      <ellipse cx="930" cy="293" rx="19" ry="8" transform="rotate(45 930 293)"/>
      <ellipse cx="457" cy="101" rx="17" ry="7" transform="rotate(-35 457 101)"/>
      <ellipse cx="483" cy="153" rx="18" ry="7" transform="rotate(38 483 153)"/>
    </g>
    <path d="M122 555q-11-43 13-61m-5 61q17-29 39-29
             M856 565q8-48-17-68m22 67q-8-32-36-35"
          fill="none" stroke="#27291c" stroke-width="7"
          stroke-linecap="round"/>

    <!-- The unicycle casts a narrow shadow across the path. -->
    <ellipse cx="530" cy="668" rx="184" ry="20" fill="#15120e"
             opacity=".55"/>

    <!-- Wheel, spokes, fork, saddle and pedals. -->
    <circle cx="529" cy="558" r="100" fill="none"
            stroke="#17130f" stroke-width="18"/>
    <circle cx="529" cy="558" r="91" fill="none"
            stroke="#c4a678" stroke-width="3"/>
    <g stroke="#ad9069" stroke-width="2" opacity=".7">
      <path d="M529 558V464m0 94 66-66m-66 66h94m-94 0 66 66
               m-66-66v94m0-94-66 66m66-66h-94m94 0-66-66"/>
      <path d="m529 558 36-87m-36 87 87-36m-87 36 87 36m-87-36 36 87
               m-36-87-36 87m36-87-87 36m87-36-87-36m87 36-36-87"/>
    </g>
    <path d="M514 483 506 555m33-72 8 72M526 425v72"
          fill="none" stroke="#1d1813" stroke-width="12"
          stroke-linecap="round"/>
    <path d="M514 483 506 555m33-72 8 72M526 425v72"
          fill="none" stroke="#aa8860" stroke-width="3"/>
    <path d="M474 427q33-20 99-5l10 12q-53 17-106 5Z"
          fill="#33271d" stroke="#17130f" stroke-width="5"/>
    <path d="m494 430 53-6" stroke="#d0ad7b" stroke-width="3"
          stroke-linecap="round"/>
    <path d="m490 581 78-46" stroke="#1d1813" stroke-width="10"
          stroke-linecap="round"/>
    <path d="m477 582 28-3m49-45 29-3" stroke="#17130f"
          stroke-width="12" stroke-linecap="round"/>
    <circle cx="529" cy="558" r="12" fill="#c19d6e"
            stroke="#1b1612" stroke-width="5"/>

    <!-- Far leg reaches the lower pedal. -->
    <path d="M459 387q-32 27-25 70l36 68 12 56 25-5
             q-2-49-18-72l-17-57 31-34Z"
          fill="#785a3e" stroke="#34271d" stroke-width="7"/>
    <path d="M476 570q13-9 33 3l8 13q-22 12-45 4Z"
          fill="#79593d" stroke="#34271d" stroke-width="6"/>

    <!-- Capybara body, lit along its back. -->
    <path d="M365 335q5-57 69-78 58-19 132 0
             78 19 107 65 22 36 1 77
             -23 46-96 55-94 13-161-20
             -59-29-52-99Z"
          fill="url(#fur)" stroke="#302219" stroke-width="9"
          stroke-linejoin="round"/>
    <path d="M387 310q32-42 95-46 107-9 164 57"
          fill="none" stroke="#e8c995" stroke-width="9"
          stroke-linecap="round" opacity=".7"/>
    <path d="M395 370q13 45 77 66m-66-95q35-23 67-9
             m95-43q46 19 60 58"
          fill="none" stroke="#6e4f36" stroke-width="5"
          stroke-linecap="round" opacity=".55"/>
    <path d="m411 337 13-8m3 40 15-7m55-82 11-6
             m68 24 14-7m-30 130 16-5"
          stroke="#e3c18b" stroke-width="3" stroke-linecap="round"
          opacity=".5"/>

    <!-- Near leg presses the raised pedal. -->
    <path d="M541 408q42-6 57 30 12 28-1 49l-28 47-30-11
             24-55-37-31Z"
          fill="#99734e" stroke="#3a291d" stroke-width="8"
          stroke-linejoin="round"/>
    <path d="M550 520q21-7 35 10l7 13q-18 12-48-1Z"
          fill="#a37a51" stroke="#38281c" stroke-width="6"/>
    <path d="m574 535 5 8m-14-9 4 10" stroke="#493320"
          stroke-width="3" stroke-linecap="round"/>

    <!-- Outstretched foreleg keeps balance. -->
    <path d="M634 367q24-14 41 9l21 39 30 4q16 2 14 13
             -4 12-23 12l-48-7q-21-8-37-42Z"
          fill="#a27c55" stroke="#3d2a1d" stroke-width="7"
          stroke-linejoin="round"/>
    <path d="m722 424 13 4m-20 3 17 5" stroke="#4d3725"
          stroke-width="3" stroke-linecap="round"/>

    <!-- Blunt muzzle, small ear, bright eye and determined brow. -->
    <path d="M617 319q18-35 65-38 45-3 66 26
             l27 25q16 16 1 32l-25 12
             q-12 23-47 26-51 4-76-27
             -19-24-11-56Z"
          fill="url(#face)" stroke="#302219" stroke-width="8"
          stroke-linejoin="round"/>
    <path d="M640 298q-9-24 8-32 19-5 27 17l-4 24Z"
          fill="#a9855e" stroke="#302219" stroke-width="7"/>
    <path d="M650 289q1-11 10-10" fill="none"
          stroke="#5d422e" stroke-width="5" stroke-linecap="round"/>
    <path d="M689 323q10-10 24-9" fill="none"
          stroke="#4a3323" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="705" cy="332" rx="6" ry="8" fill="#231a14"/>
    <circle cx="707" cy="329" r="2" fill="#f3dfb7"/>
    <path d="M734 347q18-8 31-1" fill="none"
          stroke="#6d4b31" stroke-width="4" stroke-linecap="round"/>
    <path d="M764 339q12 2 11 12-4 10-18 11
             -12-6-7-16Z"
          fill="#38271d"/>
    <path d="M738 376q15 7 27-2" fill="none"
          stroke="#5c3d29" stroke-width="4" stroke-linecap="round"/>
    <path d="m751 366 22 2m-27 7 19 7" stroke="#d8b789"
          stroke-width="2" stroke-linecap="round" opacity=".65"/>

    <!-- A little new growth catches the same light. -->
    <path d="M806 647q-2-35 13-52" fill="none"
          stroke="#b99d70" stroke-width="4" stroke-linecap="round"/>
    <path d="M815 615q-26-25-38-7 14 17 38 7Z
             M816 606q9-27 28-25-1 21-28 25Z"
          fill="#9c9267" stroke="#3d3827" stroke-width="3"/>
    <circle cx="819" cy="591" r="3" fill="#e7d0a2"/>
  </g>
</svg>