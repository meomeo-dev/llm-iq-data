<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc">
  <title id="title">Capybara riding a unicycle through an abandoned greenhouse</title>
  <desc id="desc">A determined capybara rides toward moonlight beneath broken glass and overgrown vines in a tilted sepia scene.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#211a16"/>
      <stop offset=".55" stop-color="#49382a"/>
      <stop offset="1" stop-color="#70563a"/>
    </linearGradient>
    <linearGradient id="glass" x2=".8" y2="1">
      <stop stop-color="#cbb48a" stop-opacity=".32"/>
      <stop offset="1" stop-color="#d7bb85" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#f3ddb0" stop-opacity=".42"/>
      <stop offset="1" stop-color="#f3ddb0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#b38b59"/>
      <stop offset=".55" stop-color="#8b6745"/>
      <stop offset="1" stop-color="#5c422f"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop stop-color="#f3ddb0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f3ddb0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="scene">
      <rect x="-80" y="-90" width="1184" height="948"/>
    </clipPath>
    <g id="leaf" fill="#322c20" stroke="#947b50" stroke-width="1.2">
      <path d="M0 0 Q-18-18-30-9 Q-23 8 0 0Z"/>
      <path d="M0 0 Q16-23 31-19 Q25-2 0 0Z"/>
    </g>
  </defs>

  <rect width="1024" height="768" fill="#1c1714"/>
  <g clip-path="url(#scene)" transform="rotate(-8 512 384)">
    <rect x="-80" y="-90" width="1184" height="948" fill="url(#night)"/>

    <!-- Moon beyond the broken roof -->
    <circle cx="792" cy="110" r="148" fill="url(#moonGlow)"/>
    <circle cx="792" cy="110" r="43" fill="#ead5aa"/>
    <circle cx="777" cy="99" r="7" fill="#b7a17d" opacity=".45"/>
    <circle cx="808" cy="123" r="11" fill="#b7a17d" opacity=".3"/>

    <!-- Greenhouse ribs and fractured glazing -->
    <path d="M-120 345 241 55 511-104 781 55 1144 345"
          fill="none" stroke="#171712" stroke-width="27" stroke-linejoin="round"/>
    <path d="M-120 345 241 55 511-104 781 55 1144 345"
          fill="none" stroke="#a18a62" stroke-width="4" stroke-linejoin="round"/>
    <path d="M241 55v590M511-104v690M781 55v590
             M-60 325v380M1084 325v380"
          fill="none" stroke="#201e18" stroke-width="19"/>
    <path d="M241 55v590M511-104v690M781 55v590
             M-60 325v380M1084 325v380"
          fill="none" stroke="#9b835b" stroke-width="3" opacity=".75"/>
    <path d="M-80 345h1184M-80 480h1184M-80 610h1184"
          fill="none" stroke="#211f19" stroke-width="17"/>
    <path d="M-80 345h1184M-80 480h1184M-80 610h1184"
          fill="none" stroke="#8c7653" stroke-width="2"/>

    <path d="M-52 333 238 82v249ZM259 77 493-68v399H259ZM530-67
             761 76v255H530ZM788 81l280 250H788Z"
          fill="url(#glass)"/>
    <path d="M790 85 856 141 824 196 875 180 923 220 900 260
             997 331H788Z"
          fill="#d7bb85" opacity=".09"/>
    <path d="M762 78 722 154 750 190 707 230 760 279M262 91
             319 151 290 202 346 262 316 330"
          fill="none" stroke="#d5bc8d" stroke-width="2" opacity=".45"/>
    <path d="m856 141-20 30 19-7 11 12 9-38M900 260l-10 34
             34-9-8-20"
          fill="#221e19" stroke="#bfa67c" stroke-width="2"/>

    <!-- Shafts of light and floor -->
    <path d="M775 96 875 166 735 735 360 735Z" fill="url(#beam)"/>
    <path d="M830 145 905 205 913 715 734 715Z"
          fill="#e3c893" opacity=".07"/>
    <ellipse cx="621" cy="631" rx="285" ry="110"
             fill="#e6c890" opacity=".17" filter="url(#soft)"/>
    <path d="M-80 602Q504 532 1104 601v260H-80Z" fill="#4b3b2a"/>
    <path d="M-80 609Q490 548 1104 608M-80 687Q490 611 1104 688
             M135 610-57 858M362 579l-82 279M619 571l92 287
             M861 592l274 266"
          fill="none" stroke="#a2875d" stroke-width="3" opacity=".34"/>
    <ellipse cx="519" cy="714" rx="179" ry="26" fill="#211d18" opacity=".65"/>

    <!-- Vines climbing the frame -->
    <g fill="none" stroke="#29291d" stroke-linecap="round">
      <path d="M25 700Q83 589 46 490T106 280Q144 224 134 138"
            stroke-width="17"/>
      <path d="M1010 722Q925 630 989 516T935 287Q895 214 936 112"
            stroke-width="19"/>
      <path d="M251 55Q215 142 258 207T213 350Q184 435 254 501"
            stroke-width="10"/>
      <path d="M786 51Q816 149 758 225T797 362" stroke-width="10"/>
    </g>
    <g>
      <use href="#leaf" transform="translate(52 565) rotate(-30) scale(1.4)"/>
      <use href="#leaf" transform="translate(75 452) rotate(35) scale(1.2)"/>
      <use href="#leaf" transform="translate(83 339) rotate(-50) scale(1.5)"/>
      <use href="#leaf" transform="translate(130 229) rotate(20) scale(1.1)"/>
      <use href="#leaf" transform="translate(970 600) rotate(155) scale(1.5)"/>
      <use href="#leaf" transform="translate(981 481) rotate(205) scale(1.3)"/>
      <use href="#leaf" transform="translate(951 341) rotate(140) scale(1.6)"/>
      <use href="#leaf" transform="translate(239 167) rotate(-20)"/>
      <use href="#leaf" transform="translate(225 353) rotate(40) scale(1.2)"/>
      <use href="#leaf" transform="translate(774 224) rotate(170)"/>
      <use href="#leaf" transform="translate(789 337) rotate(125)"/>
    </g>
    <g fill="#2b291d" stroke="#a18a60" stroke-width="2">
      <path d="M-20 660q30-125 73 0 28-96 55 0 35-73 58 0Z"/>
      <path d="M861 663q25-96 51 0 38-147 71 0 27-82 58 0Z"/>
      <path d="M137 643q24-73 42 0 22-107 49 0 24-64 41 0Z"/>
    </g>

    <!-- Unicycle -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <circle cx="515" cy="627" r="96" fill="#29231c"
              stroke="#c0a475" stroke-width="7"/>
      <circle cx="515" cy="627" r="82" fill="none"
              stroke="#8d7754" stroke-width="3"/>
      <g stroke="#9c835d" stroke-width="2" opacity=".8">
        <path d="M515 535v184M423 627h184M450 562l130 130
                 M450 692l130-130M480 541l70 172M550 541l-70 172
                 M429 592l172 70M429 662l172-70"/>
      </g>
      <circle cx="515" cy="627" r="15" fill="#a78a5f"
              stroke="#251f19" stroke-width="5"/>
      <path d="M494 506 500 627M536 504 530 627"
            fill="none" stroke="#211e19" stroke-width="12"/>
      <path d="M494 506 500 627M536 504 530 627"
            fill="none" stroke="#b59b6c" stroke-width="3"/>
      <path d="M515 627 475 657M515 627l42-35"
            fill="none" stroke="#be9f71" stroke-width="8"/>
      <path d="M458 657h39M541 592h39" stroke="#241f19" stroke-width="11"/>
      <path d="M473 493q31-15 76-1l-8 14q-37 10-68-1Z"
            fill="#2b221c" stroke="#b79a6c" stroke-width="3"/>
    </g>

    <!-- Capybara, leaning into the ride -->
    <g stroke="#3d2c22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M436 447Q425 497 465 516l12 121q-6 12-19 17
               13 13 39 5l7-23-1-143Z"
            fill="#78563b" stroke-width="6"/>
      <path d="M523 453q10 36 27 55l13 68q-7 9-22 13
               15 13 39 3l5-20-10-81-17-50Z"
            fill="#9b714b" stroke-width="6"/>
      <path d="M390 400q-3-60 61-84 62-25 128 13
               38 23 43 65 1 66-63 85-65 20-127-1
               -44-15-42-78Z"
            fill="url(#fur)" stroke-width="7"/>
      <path d="M400 369q26-39 78-42 48-3 83 21"
            fill="none" stroke="#dcc08a" stroke-width="6" opacity=".65"/>
      <path d="M563 352q22-52 72-54 44-2 57 47l-3 43
               q-8 42-56 49-40 5-66-27Z"
            fill="url(#fur)" stroke-width="7"/>
      <path d="M599 309q-8-30 13-38 24-5 29 31Z"
            fill="#805c40" stroke-width="6"/>
      <path d="M609 291q10-10 17 5"
            fill="none" stroke="#d5ad7b" stroke-width="4"/>
      <path d="M659 345q28-18 51 1 22 20 9 45
               -10 21-54 22-34-1-43-18"
            fill="#a87b50" stroke-width="6"/>
      <ellipse cx="709" cy="360" rx="11" ry="8" fill="#3d2c22"/>
      <path d="M688 390q11 11 24 3"
            fill="none" stroke="#4d3428" stroke-width="4"/>
      <path d="M644 343q13-9 24-1"
            fill="none" stroke="#3d2c22" stroke-width="5"/>
      <circle cx="656" cy="357" r="5" fill="#211b17" stroke="none"/>
      <circle cx="658" cy="355" r="1.5" fill="#ead1a5" stroke="none"/>
      <path d="M571 425q10 29 32 45l48-8q11-5 10-17
               15 13 2 28-10 12-59 17-39-9-56-48"
            fill="#946b48" stroke-width="6"/>
      <path d="M631 430q31 1 52-17"
            fill="none" stroke="#cba879" stroke-width="4" opacity=".7"/>
      <path d="M431 467q53 25 110 5"
            fill="none" stroke="#5b3f2e" stroke-width="4" opacity=".6"/>
    </g>

    <!-- A small opening ahead -->
    <path d="M720 554q74-42 132-9" fill="none"
          stroke="#e1c591" stroke-width="3" opacity=".6"/>
    <g fill="#d8bd8b" opacity=".8">
      <circle cx="771" cy="454" r="2"/>
      <circle cx="805" cy="404" r="1.5"/>
      <circle cx="739" cy="495" r="1.5"/>
      <circle cx="826" cy="475" r="2"/>
    </g>
  </g>
</svg>