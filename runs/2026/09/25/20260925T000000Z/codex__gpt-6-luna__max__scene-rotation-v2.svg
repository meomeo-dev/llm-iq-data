      <path d="M218 250 500 104 782 250"/>
      <path d="M153 249V532M302 174V529M500 74V533M698 173V529M847 249V532"/>
      <path d="M142 347H858M119 451H881"/>
    </g>

    <!-- Floor -->
    <path d="M91 493 905 493 977 709 23 709Z" fill="url(#earth)"/>
    <path d="M91 493 905 493M23 709 977 709" fill="none" stroke="#94704a" stroke-width="5" opacity=".75"/>
    <g fill="none" stroke="#967650" stroke-width="2" opacity=".31">
      <path d="M500 493 500 710"/>
      <path d="M365 493 235 709M635 493 765 709"/>
      <path d="M129 541H871M79 594H921M48 648H952"/>
