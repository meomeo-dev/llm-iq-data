    <circle cx="561" cy="230" r="1.2" fill="#f1d9a4"/>
    <path d="M577 256q8-7 15-1-1 9-10 9-7-1-5-8Z" fill="#302016"/>
    <path d="M548 273q11 4 22-1" fill="none" stroke="#634229" stroke-width="2.5"/>
    <g fill="none" stroke="#62452c" stroke-width="1.5" opacity=".82">
