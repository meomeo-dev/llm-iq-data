    <g fill="none" stroke="#6e5a37" stroke-width="5" stroke-linecap="round">
      <path d="M80 565q-10-52 9-79m-5 51q-30-23-36-43m42 29q20-29 41-35"/>
      <path d="M881 573q10-54-11-84m5 58q30-22 37-44m-42 30q-20-29-41-36"/>
      <path d="M232 621q-5-53 15-77m-13 47q-23-20-37-19m41 6q18-23 37-26"/>
      <path d="M766 629q4-55-16-81m13 49q22-20 37-20m-41 7q-18-24-37-27"/>
      <path d="M934 641q-2-38 12-57m-11 38q-18-15-30-15m32 4q14-17 26-19"/>
      <path d="M91 652q2-37-12-57m10 38q18-15 30-15m-32 4q-14-17-26-19"/>
