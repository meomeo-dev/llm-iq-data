      <circle cx="500" cy="528" r="9" fill="#d4b27a" stroke="#4b3521" stroke-width="4"/>
      <path d="M500 528 499 438" stroke="#715332" stroke-width="10" stroke-linecap="round"/>
      <path d="M499 438 498 426" stroke="#3a281b" stroke-width="13" stroke-linecap="round"/>
      <path d="M482 422q17-8 34 1l-2 10q-16 6-33-1Z"
