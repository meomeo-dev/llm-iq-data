      <path d="M521 386q23 4 32 27l20 48q8 19-5 30-15 7-26-8l-29-49Z"/>
      <path d="M430 458q-18 9-20 30l-1 33q11 9 29 2l9-30q6-23-17-35Z"/>
      <path d="M558 455q19 7 26 26l12 31q-8 14-25 12l-20-28q-13-19 7-41Z"/>
    </g>
    <g fill="#d0aa73" stroke="#50351f" stroke-width="3">
      <path d="M407 514q17-9 31 0l7 12q-13 12-34 3Z"/>
      <path d="M570 510q17-7 31 2l8 13q-14 10-33 0Z"/>
    </g>
    <g stroke="#5b3d24" stroke-width="2" stroke-linecap="round">
      <path d="m414 525-2 8m10-7-1 8m10-7v8m142-18 2 8m10-10 3 8m9-7 4 7"/>
