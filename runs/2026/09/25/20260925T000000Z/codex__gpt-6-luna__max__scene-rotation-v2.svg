    <!-- Unicycle wheel and frame -->
    <g>
      <circle cx="500" cy="528" r="82" fill="#261d15" stroke="#392719" stroke-width="12"/>
      <circle cx="500" cy="528" r="73" fill="none" stroke="#c0a071" stroke-width="3" opacity=".88"/>
      <circle cx="500" cy="528" r="65" fill="none" stroke="#775a37" stroke-width="2"/>
      <g stroke="#b89764" stroke-width="2" opacity=".79">
