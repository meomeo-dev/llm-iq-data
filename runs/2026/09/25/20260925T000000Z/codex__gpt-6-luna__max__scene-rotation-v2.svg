      <path d="M420 528h-28m188 0h28" stroke="#6f4e2e" stroke-width="8" stroke-linecap="round"/>
      <path d="M393 528h-18m225 0h18" stroke="#c5a06c" stroke-width="5" stroke-linecap="round"/>
