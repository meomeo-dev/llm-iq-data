    <!-- Soft pool of moonlight behind the rider -->
    <ellipse cx="510" cy="466" rx="137" ry="24" fill="#e9cf99" opacity=".19" filter="url(#smallGlow)"/>
    <ellipse cx="510" cy="466" rx="98" ry="11" fill="#f1d7a1" opacity=".18"/>
