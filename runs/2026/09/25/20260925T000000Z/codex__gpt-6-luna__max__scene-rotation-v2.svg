      <path d="M293 231q-22-15-28 5 15 17 28-5Zm15-37q-7-24 14-25 13 18-14 25Zm384 38q22-15 28 5-15 17-28-5Zm-12-38q7-24-14-25-13 18 14 25Z"/>
