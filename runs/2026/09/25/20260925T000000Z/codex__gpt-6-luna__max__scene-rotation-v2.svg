<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="title description">
  <title id="title">Capybara riding a unicycle in an overgrown greenhouse</title>
  <desc id="description">A determined capybara balances on a unicycle beneath broken greenhouse panes as moonlight falls through climbing vines. The sepia scene is tilted at a Dutch angle and carries a hopeful mood.</desc>

  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop offset="0" stop-color="#21170f"/>
      <stop offset="0.56" stop-color="#493321"/>
      <stop offset="1" stop-color="#20160f"/>
    </linearGradient>
    <linearGradient id="glass" x2="0.9" y2="1">
      <stop stop-color="#d7b77b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6b4b2c" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="moonbeam" x2="0.25" y2="1">
      <stop stop-color="#f4dfae" stop-opacity=".56"/>
      <stop offset="1" stop-color="#e2bd7c" stop-opacity=".01"/>
    </linearGradient>
    <linearGradient id="fur" x2="0.9" y2="1">
      <stop stop-color="#b58a58"/>
      <stop offset=".52" stop-color="#8e633d"/>
      <stop offset="1" stop-color="#62432d"/>
    </linearGradient>
    <linearGradient id="furLight" x2="0" y2="1">
      <stop stop-color="#d0a36c"/>
      <stop offset="1" stop-color="#a8794b"/>
    </linearGradient>
    <linearGradient id="earth" x2="0" y2="1">
      <stop stop-color="#665039"/>
      <stop offset="1" stop-color="#2a2017"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop stop-color="#fff0c4"/>
      <stop offset=".7" stop-color="#ead49f"/>
      <stop offset="1" stop-color="#c39b60"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="smallGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="url(#night)"/>
  <circle cx="770" cy="103" r="76" fill="#edcf91" opacity=".13" filter="url(#softGlow)"/>

  <g transform="rotate(-6 500 350)">
    <!-- Greenhouse silhouette and night beyond the panes -->
    <path d="M95 253 500 48 905 253 905 545 95 545Z"
          fill="#342518" stroke="#8a6944" stroke-width="13" stroke-linejoin="round"/>
    <path d="M118 252 500 63 882 252 882 529 118 529Z"
          fill="#5e472f" opacity=".34"/>
    <path d="M150 248 500 79 850 248 850 518 150 518Z"
          fill="url(#glass)" stroke="#b08b59" stroke-opacity=".63" stroke-width="3"/>

    <!-- Moon behind the broken roof -->
    <circle cx="760" cy="137" r="39" fill="url(#moon)"/>
    <circle cx="760" cy="137" r="54" fill="#efd7a6" opacity=".2" filter="url(#smallGlow)"/>
    <path d="M747 115q7-7 14 0m-29 31q8-5 15 1m31 17q8-5 14 1"
          fill="none" stroke="#a87c46" stroke-opacity=".42" stroke-width="2"/>

    <!-- Moonlight shafts through a missing roof section -->
    <path d="M678 91 790 85 679 485 450 485Z" fill="url(#moonbeam)" opacity=".68"/>
    <path d="M744 94 793 91 756 470 620 470Z" fill="url(#moonbeam)" opacity=".43"/>
    <path d="M692 89 749 91 560 429 478 429Z"
          fill="#f3dcaa" opacity=".13" filter="url(#softGlow)"/>

