<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
  <title id="title">Still Growing</title>
  <desc id="desc">A determined capybara rides a unicycle through an abandoned greenhouse. Vines cover tilted ironwork, and sepia moonlight streams through shattered roof panes onto a small new plant.</desc>
  <defs>
    <linearGradient id="night" x2="0.2" y2="1">
      <stop stop-color="#211b16"/>
      <stop offset="1" stop-color="#67513a"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dbc096"/>
      <stop offset=".45" stop-color="#ad875d"/>
      <stop offset="1" stop-color="#715237"/>
    </linearGradient>
    <linearGradient id="muzzle" x2=".9" y2="1">
      <stop stop-color="#e2c69b"/>
      <stop offset="1" stop-color="#ac8459"/>
    </linearGradient>
    <linearGradient id="beam" x2="0" y2="1">
      <stop stop-color="#f5dfae" stop-opacity=".34"/>
      <stop offset="1" stop-color="#f5dfae" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#f5ddb0" stop-opacity=".24"/>
      <stop offset="1" stop-color="#f5ddb0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tiles" width="160" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 0H160V90H0Z M80 0V90" fill="none" stroke="#b99a70" stroke-opacity=".16" stroke-width="2"/>
    </pattern>
    <g id="leaf">
