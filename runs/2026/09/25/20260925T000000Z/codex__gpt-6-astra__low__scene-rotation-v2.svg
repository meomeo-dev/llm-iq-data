      <path d="M0 0L7-44" fill="none" stroke="#b99d6b" stroke-opacity=".55"/>
    </g>
    <g id="smallLeaf">
      <path d="M0 0Q-27-7-25-29Q-2-30 0 0Z" fill="#887047" stroke="#b39a69" stroke-width="1"/>
    </g>
    <filter id="soft">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="960" height="960" fill="#241d17"/>
  <g transform="rotate(-10 480 480)">
