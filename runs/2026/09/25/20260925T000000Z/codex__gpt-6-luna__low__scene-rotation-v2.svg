<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Capybara on a unicycle in an abandoned greenhouse</title>
  <desc id="desc">A determined capybara rides a unicycle through a vine-covered greenhouse as moonlight streams through broken panes. Sepia monochrome, tilted composition.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#e4d2a8"/>
      <stop offset="1" stop-color="#8c7654"/>
    </linearGradient>
    <linearGradient id="beam" x2="0.8" y2="1">
      <stop stop-color="#fff1c9" stop-opacity=".68"/>
      <stop offset="1" stop-color="#f1dbad" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop stop-color="#fff4d8"/>
      <stop offset="1" stop-color="#d7c295"/>
    </radialGradient>
    <pattern id="ground" width="32" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q9 13 18 19T36 17" fill="none" stroke="#4d4030" stroke-opacity=".26" stroke-width="2"/>
    </pattern>
    <clipPath id="scene">
      <rect x="0" y="0" width="900" height="700" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#scene)">
    <rect width="900" height="700" fill="#30291f"/>
    <g transform="rotate(-8 450 350)">
      <rect x="-80" y="-80" width="1080" height="850" fill="url(#sky)"/>

      <!-- Moonlit broken greenhouse roof -->
      <circle cx="694" cy="102" r="43" fill="url(#moon)"/>
      <path d="M100 320 L250 70 L790 35 L960 300" fill="none" stroke="#493d2c" stroke-width="16"/>
      <path d="M250 70 L790 35 M325 66 L365 309 M485 56 L520 287 M650 45 L680 270 M790 35 L845 285"
            fill="none" stroke="#493d2c" stroke-width="10"/>
      <path d="M252 83 L355 80 L369 214 L280 224Z M376 77 L490 69 L505 205 L385 212Z
               M506 68 L638 58 L655 193 L519 201Z M663 56 L777 47 L807 187 L674 192Z"
            fill="#b8a47b" fill-opacity=".26" stroke="#ead9b0" stroke-opacity=".55" stroke-width="3"/>
      <!-- Missing panes and shards -->
      <path d="M278 235 L352 231 L322 181Z M530 214 L601 207 L571 161Z M708 205 L768 202 L740 153Z"
            fill="#30291f" fill-opacity=".65"/>
      <path d="M350 230 l18 -35 8 31 M601 206 l15 -34 8 32 M768 201 l17 -26 6 31"
            fill="none" stroke="#eee0bf" stroke-width="3" opacity=".75"/>

      <!-- Moonlight shafts -->
      <path d="M653 120 L746 120 L542 558 L368 558Z" fill="url(#beam)"/>
      <path d="M752 125 L800 130 L655 516 L550 516Z" fill="url(#beam)" opacity=".56"/>
      <path d="M662 135 L690 138 L514 510 L465 510Z" fill="#fff3d1" opacity=".13"/>

      <!-- Rear greenhouse frame -->
      <path d="M100 320 L100 590 M250 70 L250 590 M790 35 L790 590 M960 300 L960 590"
            stroke="#433827" stroke-width="13" fill="none"/>
      <path d="M100 410 L960 410 M100 505 L960 505" stroke="#5e4c35" stroke-width="7"/>

      <!-- Vines climbing frame -->
      <g fill="none" stroke="#55462f" stroke-width="8" stroke-linecap="round">
        <path d="M106 590 C90 505 145 482 120 411 S151 313 203 282 S229 188 248 157"/>
        <path d="M256 587 C310 532 258 480 305 433 S291 344 339 302 S355 222 347 170"/>
        <path d="M785 587 C742 520 806 474 770 425 S817 352 790 304 S829 218 814 156"/>
        <path d="M920 584 C875 521 934 479 902 432 S933 363 900 320"/>
        <path d="M110 447 C205 427 198 373 276 366 S337 322 390 314"/>
      </g>
      <g fill="#786341" stroke="#463a29" stroke-width="2">
        <path d="M151 373 Q115 332 98 367 Q122 403 151 373Z"/>
        <path d="M190 301 Q154 264 138 303 Q162 334 190 301Z"/>
        <path d="M224 251 Q265 220 289 252 Q262 279 224 251Z"/>
        <path d="M302 445 Q262 408 247 444 Q275 475 302 445Z"/>
        <path d="M340 347 Q376 313 394 347 Q367 375 340 347Z"/>
        <path d="M774 392 Q733 354 716 390 Q743 424 774 392Z"/>
        <path d="M809 308 Q849 274 866 308 Q837 338 809 308Z"/>
        <path d="M887 460 Q850 422 832 457 Q861 488 887 460Z"/>
        <path d="M903 345 Q935 314 953 347 Q928 374 903 345Z"/>
      </g>

      <!-- Ground -->
      <path d="M-70 555 Q220 508 445 548 T980 520 L980 760 L-70 760Z" fill="#756044"/>
      <path d="M-70 555 Q220 508 445 548 T980 520 L980 760 L-70 760Z" fill="url(#ground)"/>
      <path d="M-50 610 Q170 565 332 607 M603 619 Q746 563 957 586" fill="none" stroke="#c1a77a" stroke-width="4" opacity=".48"/>

      <!-- Potted greenhouse plants -->
      <path d="M124 548 L212 548 L200 620 L139 620Z" fill="#594733" stroke="#30291f" stroke-width="4"/>
      <path d="M130 549 Q168 528 207 549" fill="#3e3426"/>
      <path d="M168 545 C149 500 162 466 149 436 M168 535 C193 494 193 469 217 450 M166 531 C133 496 118 478 119 455"
            fill="none" stroke="#55452e" stroke-width="7"/>
      <g fill="#88704a">
        <ellipse cx="148" cy="463" rx="20" ry="9" transform="rotate(30 148 463)"/>
        <ellipse cx="214" cy="452" rx="22" ry="9" transform="rotate(-25 214 452)"/>
        <ellipse cx="124" cy="475" rx="18" ry="8" transform="rotate(25 124 475)"/>
      </g>

      <!-- Unicycle wheel and frame -->
      <circle cx="473" cy="546" r="73" fill="#3d3326" stroke="#d2b98a" stroke-width="9"/>
      <circle cx="473" cy="546" r="59" fill="none" stroke="#8f7954" stroke-width="3"/>
      <circle cx="473" cy="546" r="9" fill="#e0c99c"/>
      <g stroke="#c8ad7b" stroke-width="3" opacity=".85">
        <path d="M473 487 V605 M414 546 H532 M432 505 L514 587 M514 505 L432 587"/>
      </g>
      <path d="M473 546 L449 442 L490 424" fill="none" stroke="#30291f" stroke-width="11" stroke-linecap="round"/>
      <path d="M453 435 L497 428" stroke="#d7c092" stroke-width="8" stroke-linecap="round"/>
      <path d="M444 451 L472 451" stroke="#d7c092" stroke-width="8" stroke-linecap="round"/>

      <!-- Capybara: legs behind body -->
      <path d="M423 410 Q399 446 414 484 L433 490 Q445 462 452 433Z" fill="#71563a" stroke="#392f23" stroke-width="4"/>
      <path d="M489 402 Q518 431 507 468 L489 479 Q470 447 465 421Z" fill="#8a6944" stroke="#392f23" stroke-width="4"/>
      <path d="M414 480 Q426 478 438 486 L433 497 Q416 499 407 491Z" fill="#392f23"/>
      <path d="M489 470 Q504 462 515 470 L513 481 Q496 487 485 481Z" fill="#392f23"/>

      <!-- Capybara body -->
      <ellipse cx="462" cy="365" rx="88" ry="67" fill="#96764d" stroke="#392f23" stroke-width="5"/>
      <path d="M394 363 Q415 317 465 317 Q506 321 535 355 Q503 386 460 392 Q420 391 394 363Z"
            fill="#a8895c" opacity=".7"/>
      <path d="M428 415 Q456 430 481 415" fill="none" stroke="#4b3a29" stroke-width="6" stroke-linecap="round"/>

      <!-- Head, ear, muzzle -->
      <path d="M500 331 Q511 292 547 286 Q576 282 595 303 L608 331 Q598 352 574 357 L526 354Z"
            fill="#a8895c" stroke="#392f23" stroke-width="5"/>
      <ellipse cx="548" cy="289" rx="10" ry="8" fill="#6f5438" stroke="#392f23" stroke-width="3"/>
      <path d="M577 315 Q604 305 621 321 Q633 333 618 345 Q598 356 575 344Z"
            fill="#c1a276" stroke="#392f23" stroke-width="4"/>
      <ellipse cx="623" cy="327" rx="8" ry="6" fill="#30291f"/>
      <circle cx="580" cy="310" r="4.5" fill="#211d17"/>
      <path d="M579 319 Q587 329 597 326" fill="none" stroke="#493a2a" stroke-width="3" stroke-linecap="round"/>
      <path d="M541 296 Q532 304 536 313" fill="none" stroke="#493a2a" stroke-width="3"/>

      <!-- Determined brows and whiskers -->
      <path d="M568 301 L583 298" stroke="#392f23" stroke-width="4" stroke-linecap="round"/>
      <g stroke="#ddd0ae" stroke-width="2" opacity=".75">
        <path d="M612 336 L645 333 M610 341 L642 347 M610 330 L638 319"/>
      </g>

      <!-- Reaching arm -->
      <path d="M514 352 Q488 374 471 401 Q465 412 475 420 Q484 424 492 414 L535 379Z"
            fill="#a8895c" stroke="#392f23" stroke-width="5"/>
      <path d="M470 399 Q464 410 474 417 L487 410" fill="none" stroke="#392f23" stroke-width="4"/>

      <!-- Far arm holding balance -->
      <path d="M500 366 Q528 376 541 409 Q545 420 534 424 Q524 425 519 414 L490 390Z"
            fill="#806241" stroke="#392f23" stroke-width="5"/>
      <path d="M533 412 Q545 418 539 428" fill="none" stroke="#392f23" stroke-width="4"/>

      <!-- Forward pedal foot -->
      <path d="M475 421 Q492 418 500 428 L494 437 L476 435Z" fill="#3c3022" stroke="#d0b585" stroke-width="2"/>
      <circle cx="490" cy="424" r="5" fill="#d0b585"/>

      <!-- Floating dust and hopeful glint -->
      <g fill="#f4e5c2" opacity=".8">
        <circle cx="335" cy="270" r="2.5"/>
        <circle cx="374" cy="296" r="1.8"/>
        <circle cx="654" cy="390" r="2.2"/>
        <circle cx="600" cy="463" r="1.8"/>
        <path d="M340 333 l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
        <path d="M683 274 l2 6 6 2-6 2-2 6-2-6-6-2 6-2Z"/>
      </g>

      <!-- Foreground weeds and greenhouse debris -->
      <g fill="none" stroke="#3d3325" stroke-width="5" stroke-linecap="round">
        <path d="M38 630 Q61 594 73 566 M51 617 Q33 595 24 590 M66 590 Q89 579 99 558"/>
        <path d="M777 624 Q754 592 752 564 M764 607 Q786 589 800 582 M752 584 Q731 565 729 548"/>
      </g>
      <g fill="#8b7148">
        <ellipse cx="26" cy="589" rx="16" ry="7" transform="rotate(30 26 589)"/>
        <ellipse cx="94" cy="562" rx="17" ry="7" transform="rotate(-32 94 562)"/>
        <ellipse cx="800" cy="583" rx="18" ry="7" transform="rotate(-23 800 583)"/>
      </g>
      <path d="M287 595 l34 -24 13 7 -30 26Z M666 560 l27 13 -8 9 -30 -12Z"
            fill="#ddd0ad" opacity=".68"/>
    </g>

    <!-- Frame vignette -->
    <rect x="10" y="10" width="880" height="680" rx="13" fill="none" stroke="#ddc59a" stroke-opacity=".55" stroke-width="3"/>
    <rect width="900" height="700" fill="none" stroke="#1d1913" stroke-opacity=".35" stroke-width="40"/>
  </g>
</svg>