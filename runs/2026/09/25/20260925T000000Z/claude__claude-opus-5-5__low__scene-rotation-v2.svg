<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbf0d6"/>
      <stop offset="0.6" stop-color="#e9d3a6"/>
      <stop offset="1" stop-color="#e9d3a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d10"/>
      <stop offset="1" stop-color="#5a4127"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e6c2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6e6c2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4f31"/>
      <stop offset="1" stop-color="#2a1c0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3dfb4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f3dfb4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="#1e140a"/>

  <!-- 荷兰角：整个场景倾斜 -->
  <g transform="rotate(-9 400 300)">
    <rect x="-150" y="-150" width="1100" height="900" fill="url(#sky)"/>
    <circle cx="560" cy="90" r="120" fill="url(#moon)"/>
    <circle cx="560" cy="90" r="42" fill="#f8ecd0"/>

    <!-- 温室框架：拱形与格栅 -->
    <g stroke="#1a110a" stroke-width="7" fill="none">
      <path d="M-60 460 L-60 170 Q400 -120 860 170 L860 460"/>
      <path d="M100 460 L100 95"/><path d="M260 460 L260 40"/>
      <path d="M420 460 L420 25"/><path d="M580 460 L580 45"/>
      <path d="M740 460 L740 110"/>
      <path d="M-60 300 L860 300"/><path d="M-60 200 Q400 -60 860 200"/>
    </g>
    <!-- 残存玻璃 -->
    <g fill="#8a6b45" opacity="0.35">
      <rect x="-56" y="304" width="152" height="152"/>
      <polygon points="104,304 256,304 256,456 180,456 150,380 104,420"/>
      <rect x="584" y="304" width="152" height="152"/>
      <polygon points="264,200 416,160 416,296 330,296 300,240 264,280"/>
    </g>
    <!-- 裂纹 -->
    <g stroke="#d9c49a" stroke-width="1.2" opacity="0.6" fill="none">
      <path d="M150 380 L130 330 M150 380 L200 350 M150 380 L170 440"/>
      <path d="M300 240 L280 210 M300 240 L350 220 M300 240 L320 290"/>
    </g>

    <!-- 月光光束 -->
    <polygon points="430,40 580,50 700,520 260,520" fill="url(#beam)"/>
    <polygon points="600,70 720,110 800,520 640,520" fill="url(#beam)" opacity="0.6"/>

    <!-- 地面 -->
    <rect x="-150" y="455" width="1100" height="300" fill="url(#floor)"/>
    <ellipse cx="430" cy="490" rx="200" ry="30" fill="url(#glow)"/>
    <g fill="#c9ad7c" opacity="0.5">
      <polygon points="320,480 340,476 332,486"/>
      <polygon points="520,495 548,490 536,500"/>
      <polygon points="610,470 625,468 618,478"/>
    </g>

    <!-- 藤蔓 -->
    <g stroke="#3a2915" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M100 460 C80 400 130 350 95 290 C70 240 120 190 100 120"/>
      <path d="M740 460 C770 390 715 330 745 260 C770 200 720 160 740 110"/>
      <path d="M-60 180 C60 130 120 150 200 90 C260 50 330 60 420 30"/>
      <path d="M260 40 C290 110 230 150 262 230"/>
    </g>
    <g fill="#4a3620">
      <ellipse cx="92" cy="330" rx="12" ry="6" transform="rotate(-30 92 330)"/>
      <ellipse cx="112" cy="250" rx="12" ry="6" transform="rotate(30 112 250)"/>
      <ellipse cx="96" cy="170" rx="12" ry="6" transform="rotate(-20 96 170)"/>
      <ellipse cx="752" cy="300" rx="12" ry="6" transform="rotate(25 752 300)"/>
      <ellipse cx="730" cy="220" rx="12" ry="6" transform="rotate(-25 730 220)"/>
      <ellipse cx="150" cy="125" rx="12" ry="6" transform="rotate(-15 150 125)"/>
      <ellipse cx="330" cy="60" rx="12" ry="6" transform="rotate(10 330 60)"/>
      <ellipse cx="255" cy="150" rx="11" ry="5" transform="rotate(40 255 150)"/>
      <ellipse cx="60" cy="440" rx="18" ry="9"/>
      <ellipse cx="770" cy="445" rx="20" ry="9"/>
    </g>

    <!-- 独轮车 -->
    <g>
      <circle cx="430" cy="440" r="48" fill="none" stroke="#1a110a" stroke-width="9"/>
      <circle cx="430" cy="440" r="48" fill="none" stroke="#e8d3a8" stroke-width="1.5" opacity="0.5"/>
      <g stroke="#3a2915" stroke-width="2">
        <line x1="430" y1="392" x2="430" y2="488"/>
        <line x1="382" y1="440" x2="478" y2="440"/>
        <line x1="396" y1="406" x2="464" y2="474"/>
        <line x1="464" y1="406" x2="396" y2="474"/>
      </g>
      <circle cx="430" cy="440" r="6" fill="#1a110a"/>
      <line x1="430" y1="440" x2="430" y2="340" stroke="#1a110a" stroke-width="7"/>
      <line x1="430" y1="440" x2="450" y2="455" stroke="#1a110a" stroke-width="4"/>
      <rect x="446" y="452" width="16" height="6" fill="#1a110a"/>
      <line x1="430" y1="440" x2="410" y2="425" stroke="#1a110a" stroke-width="4"/>
      <ellipse cx="430" cy="338" rx="26" ry="7" fill="#2a1c0e"/>
    </g>

    <!-- 水豚 -->
    <g>
      <!-- 腿 -->
      <path d="M445 360 Q460 400 452 452" stroke="#5c4228" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M415 360 Q400 400 408 424" stroke="#4a331d" stroke-width="16" fill="none" stroke-linecap="round"/>
      <!-- 身体 -->
      <ellipse cx="428" cy="300" rx="72" ry="52" fill="#7a5a36"/>
      <ellipse cx="450" cy="280" rx="38" ry="24" fill="#a58458" opacity="0.6"/>
      <!-- 手臂向前伸，保持平衡 -->
      <path d="M470 290 Q510 270 530 250" stroke="#6b4e2f" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M385 290 Q350 270 335 245" stroke="#5c4228" stroke-width="14" fill="none" stroke-linecap="round"/>
      <!-- 头 -->
      <path d="M470 250 Q480 200 540 205 Q585 210 588 240 Q590 268 550 274 Q500 280 470 270 Z" fill="#7a5a36"/>
      <rect x="560" y="222" width="30" height="40" rx="14" fill="#6b4e2f"/>
      <ellipse cx="582" cy="232" rx="3" ry="2" fill="#1a110a"/>
      <!-- 耳 -->
      <ellipse cx="490" cy="212" rx="9" ry="7" fill="#4a331d"/>
      <!-- 坚定的眼睛与眉 -->
      <circle cx="530" cy="228" r="5" fill="#1a110a"/>
      <circle cx="532" cy="226" r="1.6" fill="#f8ecd0"/>
      <path d="M520 216 L540 220" stroke="#1a110a" stroke-width="3" stroke-linecap="round"/>
      <!-- 微笑 -->
      <path d="M568 258 Q576 264 584 258" stroke="#1a110a" stroke-width="2" fill="none"/>
      <!-- 月光轮廓光 -->
      <path d="M475 245 Q485 205 540 208 Q580 212 585 238" stroke="#f3e2bb" stroke-width="2.5" fill="none" opacity="0.8"/>
      <path d="M380 270 Q410 245 460 250" stroke="#f3e2bb" stroke-width="2.5" fill="none" opacity="0.7"/>
      <!-- 头上一片叶子，象征希望 -->
      <path d="M505 205 Q515 180 535 188 Q525 206 505 205 Z" fill="#c9ad7c"/>
      <path d="M505 205 L528 191" stroke="#5c4228" stroke-width="1"/>
    </g>

    <!-- 飘浮的尘埃 -->
    <g fill="#f6e6c2">
      <circle cx="500" cy="140" r="1.8" opacity="0.8"/>
      <circle cx="540" cy="330" r="1.4" opacity="0.6"/>
      <circle cx="610" cy="200" r="2" opacity="0.7"/>
      <circle cx="470" cy="380" r="1.2" opacity="0.5"/>
      <circle cx="650" cy="380" r="1.6" opacity="0.6"/>
      <circle cx="580" cy="120" r="1.3" opacity="0.7"/>
    </g>
  </g>

  <!-- 暗角 -->
  <rect width="800" height="600" fill="none" stroke="#120b05" stroke-width="60" opacity="0.6"/>
</svg>