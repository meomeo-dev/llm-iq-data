<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120b06"/>
      <stop offset="1" stop-color="#2a1d12"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e4632"/>
      <stop offset="1" stop-color="#34261a"/>
    </linearGradient>
    <linearGradient id="holeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a110a"/>
      <stop offset="1" stop-color="#2e2014"/>
    </linearGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f2d1c"/>
      <stop offset="1" stop-color="#1c130b"/>
    </linearGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ead0" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#e8d5b0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e8d5b0" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5ead0" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#e8d5b0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e8d5b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poolG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0e0bd" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f0e0bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="furG" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b08a5c"/>
      <stop offset="0.5" stop-color="#7a5a3a"/>
      <stop offset="1" stop-color="#46321f"/>
    </linearGradient>
    <linearGradient id="headG" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bf9a6a"/>
      <stop offset="0.6" stop-color="#86653f"/>
      <stop offset="1" stop-color="#5a4029"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.72">
      <stop offset="0.55" stop-color="#120b06" stop-opacity="0"/>
      <stop offset="1" stop-color="#120b06" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="bricks" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#3d2b1a"/>
      <path d="M0 0.5 H40 M0 10.5 H40 M10 0 V10 M30 10 V20" stroke="#24180e" stroke-width="1.5"/>
    </pattern>
    <clipPath id="houseClip">
      <path d="M -150 440 L -150 260 Q 400 -120 950 260 L 950 440 Z"/>
    </clipPath>
    <clipPath id="moonHoleClip">
      <polygon points="505,150 530,118 548,135 575,95 600,128 628,110 640,160 612,175 630,210 590,200 560,230 540,195 512,205"/>
    </clipPath>
    <g id="leafA">
      <path d="M0 0 C6 -8 18 -8 24 0 C18 8 6 8 0 0 Z" fill="#5a4029"/>
      <path d="M1 0 H21" stroke="#2e2014" stroke-width="0.8"/>
    </g>
    <g id="leafB">
      <path d="M0 0 C6 -8 18 -8 24 0 C18 8 6 8 0 0 Z" fill="#8a6a44"/>
      <path d="M1 0 H21" stroke="#4a3522" stroke-width="0.8"/>
    </g>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.13  0 0 0 0 0.07  0.4 0 0 0 0"/>
    </filter>
  </defs>

  <!-- Dutch-angle world -->
  <g transform="rotate(-12 400 300)">
    <!-- night sky outside -->
    <rect x="-400" y="-400" width="1600" height="1400" fill="url(#skyG)"/>
    <g fill="#e8d5b0">
      <circle cx="80" cy="20" r="1.2"/><circle cx="220" cy="-20" r="1"/>
      <circle cx="640" cy="-10" r="1.3"/><circle cx="760" cy="60" r="1"/>
      <circle cx="420" cy="-60" r="1.1"/><circle cx="900" cy="120" r="1.2"/>
    </g>

    <!-- greenhouse end wall -->
    <g clip-path="url(#houseClip)">
      <rect x="-200" y="-150" width="1200" height="620" fill="url(#glassG)"/>
      <!-- broken panes -->
      <polygon points="505,150 530,118 548,135 575,95 600,128 628,110 640,160 612,175 630,210 590,200 560,230 540,195 512,205" fill="url(#holeG)"/>
      <polygon points="80,180 110,160 118,195 150,185 135,230 100,240 90,210" fill="url(#holeG)"/>
      <polygon points="700,300 740,290 735,320 748,345 710,340" fill="url(#holeG)"/>
      <polygon points="250,120 275,110 280,135 262,150" fill="url(#holeG)"/>
      <g fill="#e8d5b0">
        <circle cx="620" cy="140" r="1"/><circle cx="110" cy="200" r="1"/>
        <circle cx="725" cy="310" r="0.9"/><circle cx="520" cy="185" r="0.9"/>
      </g>
      <!-- moon seen through the hole -->
      <g clip-path="url(#moonHoleClip)">
        <circle cx="575" cy="160" r="30" fill="#f5ead0"/>
        <circle cx="565" cy="152" r="6" fill="#e2cfa6"/>
        <circle cx="586" cy="170" r="4" fill="#e2cfa6"/>
        <circle cx="580" cy="148" r="2.5" fill="#e2cfa6"/>
      </g>
      <circle cx="575" cy="160" r="170" fill="url(#moonGlow)"/>
      <!-- cracks -->
      <path d="M505 150 L470 138 L455 146 M512 205 L486 236 M640 160 L684 148 M630 210 L662 242 M150 185 L180 176 M135 230 L150 262 M748 345 L770 372 M280 135 L305 142"
            stroke="#d9c39a" stroke-width="1" stroke-opacity="0.55" fill="none"/>
      <!-- glazing bars -->
      <g stroke="#1e140c" stroke-width="6">
        <path d="M-150 -150 V440 M-60 -150 V440 M30 -150 V440 M120 -150 V440 M210 -150 V440 M300 -150 V440 M390 -150 V440 M480 -150 V440 M570 -150 V440 M660 -150 V440 M750 -150 V440 M840 -150 V440 M930 -150 V440"/>
        <path d="M-150 260 H950 M-150 355 H950"/>
      </g>
      <g stroke="#1e140c" stroke-width="2.5">
        <path d="M-150 175 H950 M-150 95 H950 M-150 305 H950 M-150 400 H950"/>
      </g>
      <path d="M -150 280 Q 400 -90 950 280" stroke="#1e140c" stroke-width="7" fill="none"/>
    </g>
    <path d="M -150 260 Q 400 -120 950 260" stroke="#1e140c" stroke-width="12" fill="none"/>
    <path d="M -150 262 Q 400 -116 950 262" stroke="#c9a878" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>

    <!-- brick knee wall -->
    <rect x="-300" y="440" width="1400" height="62" fill="url(#bricks)"/>
    <rect x="-300" y="436" width="1400" height="8" fill="#2a1d12"/>

    <!-- floor -->
    <rect x="-300" y="500" width="1400" height="600" fill="url(#floorG)"/>
    <g stroke="#1c130b" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M-300 530 H1100 M-300 572 H1100 M-300 632 H1100 M-300 710 H1100"/>
      <path d="M400 500 V800 M300 500 L140 800 M200 500 L-120 800 M500 500 L660 800 M600 500 L920 800"/>
    </g>

    <!-- vines -->
    <g fill="none" stroke-linecap="round">
      <path d="M -120 520 C -80 420, -40 380, -60 300 S -20 160, 60 120 S 180 60, 260 90" stroke="#3a2a1b" stroke-width="5"/>
      <path d="M 930 520 C 880 430, 900 360, 860 300 S 800 200, 760 160 S 680 110, 640 90" stroke="#3a2a1b" stroke-width="5"/>
      <path d="M 300 70 C 310 120, 290 160, 305 210 S 330 260, 318 300" stroke="#4a3522" stroke-width="3"/>
      <path d="M 700 110 C 690 160, 715 200, 700 250 S 680 290, 692 330" stroke="#4a3522" stroke-width="3"/>
      <path d="M 60 505 C 120 470, 170 490, 210 455 S 270 450, 300 470" stroke="#4a3522" stroke-width="3"/>
      <path d="M -100 250 Q 400 -100 900 250" stroke="#4a3522" stroke-width="2" stroke-dasharray="40 14 70 20"/>
      <path d="M 150 80 C 140 110, 165 130, 150 160" stroke="#4a3522" stroke-width="2"/>
      <path d="M 820 200 C 835 230, 810 260, 826 290" stroke="#4a3522" stroke-width="2"/>
    </g>
    <g>
      <use href="#leafA" transform="translate(-80 420) rotate(-120)"/>
      <use href="#leafB" transform="translate(-55 360) rotate(20) scale(0.9)"/>
      <use href="#leafA" transform="translate(-60 300) rotate(-150) scale(1.1)"/>
      <use href="#leafB" transform="translate(-40 220) rotate(-30)"/>
      <use href="#leafA" transform="translate(0 160) rotate(-100) scale(0.9)"/>
      <use href="#leafB" transform="translate(60 120) rotate(40)"/>
      <use href="#leafA" transform="translate(120 95) rotate(-60) scale(1.1)"/>
      <use href="#leafB" transform="translate(190 75) rotate(70) scale(0.85)"/>
      <use href="#leafA" transform="translate(250 88) rotate(-20)"/>
      <use href="#leafA" transform="translate(890 420) rotate(-60)"/>
      <use href="#leafB" transform="translate(880 350) rotate(160) scale(0.9)"/>
      <use href="#leafA" transform="translate(860 300) rotate(-40) scale(1.1)"/>
      <use href="#leafB" transform="translate(820 230) rotate(200)"/>
      <use href="#leafA" transform="translate(770 165) rotate(-80)"/>
      <use href="#leafB" transform="translate(700 115) rotate(130) scale(0.9)"/>
      <use href="#leafA" transform="translate(650 92) rotate(-150)"/>
      <use href="#leafB" transform="translate(305 120) rotate(30) scale(0.8)"/>
      <use href="#leafA" transform="translate(296 165) rotate(160) scale(0.9)"/>
      <use href="#leafB" transform="translate(308 215) rotate(20) scale(0.8)"/>
      <use href="#leafA" transform="translate(325 255) rotate(150) scale(0.85)"/>
      <use href="#leafB" transform="translate(318 298) rotate(80) scale(0.9)"/>
      <use href="#leafA" transform="translate(695 160) rotate(160) scale(0.8)"/>
      <use href="#leafB" transform="translate(708 205) rotate(10) scale(0.85)"/>
      <use href="#leafA" transform="translate(697 250) rotate(190) scale(0.8)"/>
      <use href="#leafB" transform="translate(692 330) rotate(95) scale(0.9)"/>
      <use href="#leafA" transform="translate(100 482) rotate(-70)"/>
      <use href="#leafB" transform="translate(160 480) rotate(-120) scale(0.9)"/>
      <use href="#leafA" transform="translate(210 458) rotate(-40)"/>
      <use href="#leafB" transform="translate(260 452) rotate(-150) scale(0.85)"/>
      <use href="#leafA" transform="translate(150 160) rotate(90) scale(0.7)"/>
      <use href="#leafB" transform="translate(826 290) rotate(80) scale(0.7)"/>
      <use href="#leafA" transform="translate(400 -2) rotate(-90) scale(0.8)"/>
      <use href="#leafB" transform="translate(520 22) rotate(60) scale(0.8)"/>
    </g>

    <!-- potting bench and debris -->
    <g>
      <rect x="-140" y="418" width="330" height="12" fill="#4a3522"/>
      <rect x="-140" y="418" width="330" height="3" fill="#8a6a44" opacity="0.6"/>
      <rect x="-40" y="430" width="10" height="90" fill="#2e2014"/>
      <rect x="170" y="430" width="10" height="90" fill="#2e2014"/>
      <path d="M10 418 L16 388 L48 388 L54 418 Z" fill="#6b4e30"/>
      <rect x="12" y="383" width="40" height="7" fill="#7a5a3a"/>
      <path d="M32 384 C28 360, 40 350, 34 332 M32 384 C40 368, 52 366, 56 354" stroke="#3a2a1b" stroke-width="2" fill="none"/>
      <path d="M90 418 L95 396 L121 396 L126 418 Z" fill="#5a4029"/>
      <rect x="92" y="392" width="32" height="6" fill="#6b4e30"/>
      <!-- toppled pot -->
      <path d="M150 548 L186 528 L200 556 L166 572 Z" fill="#6b4e30"/>
      <ellipse cx="193" cy="541" rx="6" ry="16" transform="rotate(-28 193 541)" fill="#3a2a1b"/>
      <path d="M198 548 C 215 552, 232 560, 250 558 C 232 566, 212 564, 196 560 Z" fill="#2a1d12"/>
      <!-- glass shards -->
      <g fill="#e8d5b0" opacity="0.6">
        <polygon points="290,560 302,552 298,566"/>
        <polygon points="520,580 536,574 528,590"/>
        <polygon points="610,545 622,540 618,552"/>
        <polygon points="240,600 252,590 256,606"/>
        <polygon points="660,600 680,596 670,610"/>
        <polygon points="340,620 350,612 356,626"/>
      </g>
    </g>

    <!-- moonbeams -->
    <g style="mix-blend-mode:screen">
      <polygon points="505,170 640,165 540,575 265,575" fill="url(#beamG)"/>
      <polygon points="250,120 280,135 110,440 60,420" fill="url(#beamG)" opacity="0.7"/>
      <polygon points="85,185 145,190 -40,520 -110,480" fill="url(#beamG)" opacity="0.6"/>
      <polygon points="700,300 748,345 640,560 580,540" fill="url(#beamG)" opacity="0.6"/>
    </g>
    <ellipse cx="400" cy="530" rx="170" ry="32" fill="url(#poolG)"/>
    <g fill="#f5ead0">
      <circle cx="470" cy="260" r="1.4" opacity="0.7"/><circle cx="440" cy="330" r="1" opacity="0.6"/>
      <circle cx="520" cy="300" r="1.2" opacity="0.5"/><circle cx="360" cy="440" r="1" opacity="0.6"/>
      <circle cx="500" cy="420" r="1.3" opacity="0.5"/><circle cx="540" cy="220" r="1" opacity="0.7"/>
      <circle cx="330" cy="500" r="1.2" opacity="0.5"/>
    </g>

    <!-- hopeful sprout -->
    <g>
      <path d="M520 520 C 520 508, 522 500, 518 490" stroke="#8a6a44" stroke-width="2.5" fill="none"/>
      <path d="M519 498 C 508 488, 498 492, 496 498 C 506 502, 514 502, 519 498 Z" fill="#c9a878"/>
      <path d="M519 494 C 528 482, 540 484, 542 490 C 534 496, 526 497, 519 494 Z" fill="#e2cfa6"/>
      <ellipse cx="520" cy="522" rx="12" ry="3" fill="#2a1d12" opacity="0.6"/>
    </g>

    <!-- motion lines -->
    <g stroke="#c9a878" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M330 450 C 318 452, 305 452, 290 448"/>
      <path d="M335 480 C 318 482, 300 482, 280 478"/>
      <path d="M340 505 C 326 507, 312 507, 298 504"/>
    </g>

    <!-- shadow -->
    <ellipse cx="398" cy="520" rx="62" ry="8" fill="#120b06" opacity="0.7"/>

    <!-- capybara on unicycle -->
    <g>
      <!-- far leg -->
      <path d="M370 370 C392 372, 395 400, 390 430 C388 455, 390 472, 392 484 L378 486 C376 470, 372 450, 370 430 C362 405, 355 380, 370 370 Z" fill="#46321f"/>
      <line x1="400" y1="470" x2="386" y2="487" stroke="#1e140c" stroke-width="4"/>
      <rect x="376" y="484" width="20" height="5" rx="1.5" fill="#1e140c"/>
      <ellipse cx="386" cy="484" rx="11" ry="5" fill="#2a1d12"/>

      <!-- wheel -->
      <circle cx="400" cy="470" r="48" fill="none" stroke="#1e140c" stroke-width="9"/>
      <circle cx="400" cy="470" r="42" fill="none" stroke="#7a5a3a" stroke-width="2"/>
      <g stroke="#a07c52" stroke-width="1.2">
        <line x1="358" y1="470" x2="442" y2="470"/>
        <line x1="400" y1="428" x2="400" y2="512"/>
        <line x1="370.3" y1="440.3" x2="429.7" y2="499.7"/>
        <line x1="429.7" y1="440.3" x2="370.3" y2="499.7"/>
        <line x1="438.8" y1="486.1" x2="361.2" y2="453.9"/>
        <line x1="438.8" y1="453.9" x2="361.2" y2="486.1"/>
        <line x1="416.1" y1="508.8" x2="383.9" y2="431.2"/>
        <line x1="383.9" y1="508.8" x2="416.1" y2="431.2"/>
      </g>
      <path d="M428 431 A 48 48 0 0 1 447 458" stroke="#f0e0bd" stroke-width="2.5" fill="none" opacity="0.75"/>

      <!-- seat post and saddle -->
      <line x1="397" y1="392" x2="400" y2="470" stroke="#2a1d12" stroke-width="6"/>
      <circle cx="400" cy="470" r="6" fill="#5a4029" stroke="#1e140c" stroke-width="2"/>
      <path d="M372 390 C380 382, 412 382, 422 388 C418 396, 380 397, 372 390 Z" fill="#1e140c"/>

      <!-- body -->
      <path d="M330 360 C320 310, 360 285, 420 290 C465 293, 490 315, 485 345 C480 380, 440 395, 395 392 C355 390, 335 380, 330 360 Z" fill="url(#furG)"/>
      <path d="M345 305 C 380 284, 440 284, 478 310" stroke="#f0e0bd" stroke-width="2.2" fill="none" opacity="0.6"/>
      <g stroke="#3a2a1b" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
        <path d="M360 330 l-6 5 M380 318 l-6 5 M400 335 l-6 5 M420 318 l-6 5 M440 332 l-6 5 M370 355 l-6 5 M410 358 l-6 5 M450 352 l-6 5 M390 375 l-6 4"/>
      </g>

      <!-- near crank and leg -->
      <line x1="400" y1="470" x2="414" y2="453" stroke="#1e140c" stroke-width="4"/>
      <rect x="404" y="451" width="20" height="5" rx="1.5" fill="#1e140c"/>
      <path d="M415 360 C440 365, 445 395, 432 420 C425 435, 422 448, 420 452 L406 452 C408 440, 410 425, 412 405 C405 390, 400 370, 415 360 Z" fill="#6b4e30"/>
      <path d="M432 372 C 442 390, 440 405, 432 420" stroke="#e8d5b0" stroke-width="1.5" fill="none" opacity="0.5"/>
      <ellipse cx="414" cy="451" rx="12" ry="5" fill="#2a1d12"/>

      <!-- front leg reaching forward -->
      <path d="M462 328 C482 330, 500 343, 510 356 L499 365 C489 355, 476 350, 458 346 Z" fill="#6b4e30"/>
      <ellipse cx="506" cy="362" rx="7" ry="5" fill="#2a1d12"/>

      <!-- scarf tails fluttering behind -->
      <path d="M460 296 C430 276, 398 268, 366 258 L352 268 L360 250 C392 250, 432 258, 466 286 Z" fill="#c9a878"/>
      <path d="M458 304 C432 294, 404 292, 378 286 L370 296 C400 300, 430 306, 456 314 Z" fill="#a07c52"/>

      <!-- head -->
      <path d="M455 300 C455 272, 480 258, 510 262 C540 266, 560 280, 562 300 C564 318, 552 330, 532 330 C510 330, 480 330, 468 322 C458 316, 455 310, 455 300 Z" fill="url(#headG)"/>
      <ellipse cx="546" cy="306" rx="17" ry="19" fill="#6b4e30"/>
      <ellipse cx="554" cy="296" rx="3.5" ry="2.2" fill="#1a110a" transform="rotate(-20 554 296)"/>
      <path d="M538 319 q8 5 17 0" stroke="#1a110a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M470 276 C490 261, 525 258, 552 276" stroke="#f0e0bd" stroke-width="2" fill="none" opacity="0.7"/>
      <ellipse cx="484" cy="268" rx="8" ry="6" transform="rotate(-25 484 268)" fill="#4a3522"/>
      <ellipse cx="485" cy="268" rx="4" ry="3" transform="rotate(-25 485 268)" fill="#2a1d12"/>
      <!-- determined eye gazing up at the moon -->
      <ellipse cx="515" cy="284" rx="4.8" ry="4.2" fill="#1a110a"/>
      <circle cx="517" cy="282" r="1.5" fill="#f5ead0"/>
      <path d="M503 274 L526 279" stroke="#1a110a" stroke-width="2.6" stroke-linecap="round"/>
      <g stroke="#2a1d12" stroke-width="0.8" opacity="0.7">
        <path d="M535 312 l-12 2 M536 316 l-11 5"/>
      </g>

      <!-- scarf knot -->
      <path d="M452 296 C462 288, 478 290, 486 304 C481 318, 462 320, 452 312 Z" fill="#c9a878"/>
      <path d="M458 298 C466 296, 474 298, 480 304" stroke="#6b4e30" stroke-width="1" fill="none"/>
    </g>
  </g>

  <!-- film grain and vignette -->
  <rect width="800" height="600" filter="url(#grain)" opacity="0.5"/>
  <rect width="800" height="600" fill="url(#vignette)"/>
  <rect width="800" height="600" fill="#704214" opacity="0.08"/>
</svg>