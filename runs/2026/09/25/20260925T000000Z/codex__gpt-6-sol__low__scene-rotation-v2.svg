<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Capybara riding a unicycle in an abandoned greenhouse</title>
  <desc id="desc">A determined capybara pedals through an overgrown greenhouse. Moonlight enters through broken panes in a tilted sepia scene.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#211810"/>
      <stop offset="1" stop-color="#594532"/>
    </linearGradient>
    <linearGradient id="moonbeam" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#f5e5bb" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f5e5bb" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#f5e4bd" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f5e4bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="floor" width="78" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 43H78M39 0V43" fill="none" stroke="#a4885e" stroke-opacity=".22" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="900" height="650" fill="url(#night)"/>
  <g transform="rotate(-11 450 325)">
    <circle cx="675" cy="112" r="134" fill="url(#glow)"/>
    <circle cx="675" cy="112" r="49" fill="#ead9ad"/>
    <path d="M572 145 735 123 505 620 165 620Z" fill="url(#moonbeam)"/>

    <!-- Greenhouse frame and damaged glazing -->
    <path d="M70 560V145L450-48l380 193v415" fill="none" stroke="#19140f" stroke-width="28" stroke-linejoin="round"/>
    <path d="M74 160 450-33 826 160M450-33V557M74 160H826M74 360H826M260 65V556M640 65V556"
          fill="none" stroke="#a88b60" stroke-width="9" opacity=".8"/>
    <path d="m85 171 162-82v66l-67 48 39-12-61 94H85Zm195-96 155-79v155H280Zm182-76 163 79v73H462Zm180 89 169 82v89l-83-38-36 25 19-49-69-24Z"
          fill="#b59a71" opacity=".13" stroke="#d1b588" stroke-width="3"/>
    <path d="m527 162 59 13-30 35 20 24-56 52 17-60-28-11Zm194 14 57 29-34 8-12 45-37-31 20-12Z"
          fill="#ead9ad" opacity=".38"/>
    <path d="M0 555H900V650H0Z" fill="#493624"/>
    <path d="M0 555H900V650H0Z" fill="url(#floor)"/>
    <path d="M0 559H900" stroke="#c5a77b" stroke-opacity=".4" stroke-width="5"/>

    <!-- Encroaching vines -->
    <g fill="none" stroke="#211b13" stroke-linecap="round">
      <path d="M80 120c66 70-41 126 39 188s-2 119 42 241M822 87c-68 81 28 131-58 202s20 147-57 240"
            stroke-width="12"/>
      <path d="M92 252q69-48 103-12M116 307q-49-57-94-42M129 420q64-42 104-6M774 280q-75-51-119 1M759 360q59-61 116-32M723 487q-68-56-116-17"
            stroke-width="5"/>
    </g>
    <g fill="#302719" stroke="#9b8059" stroke-width="2">
      <path d="M176 238q-48-53-69-10 27 29 69 10ZM137 275q-57 10-45 51 36 6 45-51ZM224 411q-46-55-72-19 27 35 72 19ZM651 277q43-57 75-23-20 39-75 23ZM859 329q-48-41-70-4 35 28 70 4ZM609 470q42-54 75-18-20 36-75 18Z"/>
    </g>
    <path d="M75 557q38-100 68 0m620 0q42-118 88 0M4 568q58-80 92 0m714 0q52-88 96 0"
          fill="#272116" stroke="#856d4d" stroke-width="3"/>

    <!-- Unicycle -->
    <ellipse cx="454" cy="563" rx="98" ry="17" fill="#1b160f" opacity=".45"/>
    <circle cx="455" cy="535" r="77" fill="none" stroke="#201a13" stroke-width="19"/>
    <circle cx="455" cy="535" r="77" fill="none" stroke="#cfb083" stroke-width="5"/>
    <circle cx="455" cy="535" r="10" fill="#d4b68a"/>
    <g stroke="#ac9168" stroke-width="2.5">
      <path d="M455 458v154m-77-77h154m-132-55 109 109m0-109L400 589"/>
    </g>
    <path d="M455 535 438 393m-37 0h76" fill="none" stroke="#241b13" stroke-width="13" stroke-linecap="round"/>
    <path d="M455 535 477 551m0 0 34 8M455 535l-24-20m0 0-32-8"
          fill="none" stroke="#281e15" stroke-width="9" stroke-linecap="round"/>

    <!-- Capybara body, feet, and face -->
    <path d="M346 383q-22-48 5-83 32-45 122-46 85 0 118 56 15 35-5 69-41 46-131 49-78 0-109-45Z"
          fill="#806044" stroke="#291d14" stroke-width="7"/>
    <path d="M363 339q23-52 104-56 87-5 112 46-70-27-134 7-48 25-82 3Z"
          fill="#a17b54" opacity=".55"/>
    <path d="M374 390q-12 30 17 42l38-8 25-31M503 395q3 31 29 38l32-23"
          fill="none" stroke="#352419" stroke-width="19" stroke-linecap="round"/>
    <path d="M430 423q-4 29 21 38l25-6M531 431q6 22 25 29l24-2"
          fill="none" stroke="#6b4d34" stroke-width="19" stroke-linecap="round"/>
    <path d="M483 454q-5 22-6 97m75-92q-8 27-41 100"
          fill="none" stroke="#4c3423" stroke-width="15" stroke-linecap="round"/>
    <path d="M564 311q30-15 52-1 22 11 19 37-5 20-24 25l-52-7Z"
          fill="#97704c" stroke="#291d14" stroke-width="6"/>
    <ellipse cx="606" cy="332" rx="34" ry="21" fill="#b28a60" stroke="#4b3424" stroke-width="4"/>
    <circle cx="625" cy="327" r="5" fill="#271b13"/>
    <path d="M604 344q13 8 26-1" fill="none" stroke="#4b3424" stroke-width="3" stroke-linecap="round"/>
    <path d="M567 302q-7-31 11-37 23-3 25 30" fill="#8d6947" stroke="#35251a" stroke-width="6"/>
    <path d="M575 289q5-12 15-5" fill="none" stroke="#c4a276" stroke-width="4"/>
    <circle cx="588" cy="316" r="5" fill="#1d1711"/>
    <path d="M583 309q7-6 15-2" fill="none" stroke="#38271a" stroke-width="4" stroke-linecap="round"/>
    <path d="M610 349q-25 17-48 3" fill="none" stroke="#e0bf8b" stroke-opacity=".65" stroke-width="3"/>

    <!-- Small growth reaching toward the light -->
    <path d="M684 558q-8-70 19-102m-17 67q-39-38-64-23m69-8q18-33 51-30"
          fill="none" stroke="#211b13" stroke-width="6" stroke-linecap="round"/>
    <path d="M622 500q30-10 43 14-25 10-43-14Zm81-45q-5 34-34 39 1-30 34-39Zm39 7q-16 26-45 25 12-26 45-25Z"
          fill="#aa8c61" stroke="#302519" stroke-width="3"/>
    <g fill="#f1ddb1" opacity=".75">
      <circle cx="684" cy="393" r="3"/><circle cx="714" cy="421" r="2"/>
      <circle cx="645" cy="441" r="2"/><circle cx="753" cy="380" r="2"/>
    </g>
  </g>
</svg>