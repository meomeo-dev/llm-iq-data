<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Capybara riding a unicycle in an abandoned greenhouse</title>
  <desc id="desc">A determined capybara rides a unicycle through an overgrown greenhouse. Moonlight streams through broken glass in a tilted sepia scene.</desc>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#211b16"/>
      <stop offset="0.58" stop-color="#51402f"/>
      <stop offset="1" stop-color="#8b704e"/>
    </linearGradient>
    <linearGradient id="moonbeam" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f7e6bd" stop-opacity=".62"/>
      <stop offset="1" stop-color="#e8cf9c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd9564"/>
      <stop offset="1" stop-color="#725239"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e7c6" stop-opacity=".3"/>
      <stop offset="1" stop-color="#c2a477" stop-opacity=".04"/>
    </linearGradient>
    <pattern id="floorLines" width="54" height="34" patternUnits="userSpaceOnUse" patternTransform="skewX(-24)">
      <path d="M0 0H54M0 0V34" fill="none" stroke="#c1a276" stroke-opacity=".18" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
  </defs>

  <rect width="900" height="700" fill="#17130f"/>
  <g transform="rotate(-6 450 350)">
    <rect x="-70" y="-60" width="1040" height="830" fill="url(#night)"/>

    <!-- Moonlit glass roof -->
    <circle cx="667" cy="122" r="64" fill="#f1dcb3" opacity=".14" filter="url(#softGlow)"/>
    <circle cx="667" cy="122" r="33" fill="#ead9b8" opacity=".86"/>
    <path d="M640 114q13-17 31-11M657 137q16 8 28-2" fill="none" stroke="#b39a73" stroke-width="3" opacity=".45"/>
    <path d="M626 151L506 410 813 431 692 149Z" fill="url(#moonbeam)"/>
    <path d="M673 154L591 425 742 429 688 153Z" fill="#fff0d0" opacity=".09"/>

    <!-- Greenhouse frame -->
    <path d="M70 395V201L430 35 815 194V420" fill="none" stroke="#392d22" stroke-width="18" stroke-linejoin="round"/>
    <path d="M70 201L430 35 815 194M70 201L430 222 815 194M430 35V222" fill="none" stroke="#9a7950" stroke-width="7" opacity=".82"/>
    <path d="M97 196L97 380M178 159L178 384M260 122L260 390M345 80L345 389M520 74L520 388M610 112L610 393M708 147L708 397M786 181L786 402" fill="none" stroke="#806344" stroke-width="5" opacity=".8"/>
    <path d="M79 214L420 227 798 204M81 291L429 300 804 285M79 366L430 372 811 360" fill="none" stroke="#806344" stroke-width="4" opacity=".72"/>

    <!-- Broken panes -->
    <path d="M275 113L338 84 330 157 284 150Z" fill="url(#glass)" stroke="#c9b28b" stroke-width="2"/>
    <path d="M284 150L309 127 330 157M309 127L338 84" fill="none" stroke="#e4d1aa" stroke-width="1.5" opacity=".75"/>
    <path d="M526 80L600 109 567 167 520 148Z" fill="url(#glass)" stroke="#c9b28b" stroke-width="2"/>
    <path d="M526 80L550 126 567 167M550 126L600 109" fill="none" stroke="#e4d1aa" stroke-width="1.5" opacity=".8"/>
    <path d="M704 151L779 183 729 222 698 201Z" fill="url(#glass)" stroke="#c9b28b" stroke-width="2"/>
    <path d="M704 151L720 190 729 222M720 190L779 183" fill="none" stroke="#e4d1aa" stroke-width="1.5" opacity=".7"/>
    <path d="M120 204L166 207 148 256 112 247Z" fill="url(#glass)" stroke="#c9b28b" stroke-width="2"/>
    <path d="M120 204L136 229 112 247" fill="none" stroke="#e4d1aa" stroke-width="1.5" opacity=".7"/>

    <!-- Vines climbing the frame -->
    <g fill="none" stroke="#6b7045" stroke-width="5" stroke-linecap="round">
      <path d="M75 409C108 359 89 318 122 285S155 237 145 193"/>
      <path d="M781 413C750 360 776 325 748 294S741 247 767 216"/>
      <path d="M219 386C198 345 225 324 208 296S190 267 209 238"/>
      <path d="M580 390C603 356 579 337 610 309S641 273 626 244"/>
      <path d="M111 304C163 295 165 269 204 270M754 327C715 317 700 292 665 291"/>
      <path d="M362 390C344 363 358 347 339 323M477 380C494 353 481 331 505 311"/>
    </g>
    <g fill="#818254" stroke="#424532" stroke-width="1.5">
      <path d="M110 293q-27-24-34-3 14 17 34 3ZM148 249q-26-23-31 1 16 16 31-1ZM119 329q-27-14-27 8 17 12 27-8ZM200 275q-8-28-27-16 3 20 27 16ZM759 304q28-20 32 3-17 15-32-3ZM737 277q7-28 25-16-2 20-25 16ZM767 355q25-17 31 5-15 15-31-5ZM633 298q5-28 24-17-1 20-24 17ZM348 336q-23-18-30 2 14 15 30-2ZM500 327q19-23 30-5-10 18-30 5Z"/>
      <path d="M176 239q-20-22-29-5 11 17 29 5ZM705 292q-22-16-30 4 14 13 30-4ZM616 253q21-20 30-2-12 16-30 2ZM95 373q-21-18-29 1 14 14 29-1Z"/>
    </g>

    <!-- Shadowed greenhouse floor -->
    <path d="M-20 395L920 404 975 760-30 760Z" fill="#30251b"/>
    <path d="M-20 395L920 404 975 760-30 760Z" fill="url(#floorLines)"/>
    <path d="M0 516Q200 481 398 513T900 510M0 631Q198 598 450 633T900 610" fill="none" stroke="#70583b" stroke-opacity=".35" stroke-width="2"/>
    <g fill="#666443" opacity=".9">
      <path d="M62 412q20-34 39-5-4 27-30 26ZM138 430q26-35 42-4-8 29-34 28ZM800 423q-18-33-39-5 5 26 32 25ZM724 435q-26-34-42-3 8 28 34 27Z"/>
      <path d="M287 441q17-22 31-2-7 20-24 21ZM582 438q19-24 33-4-6 22-25 23Z"/>
    </g>

    <!-- Unicycle wheel and frame -->
    <ellipse cx="449" cy="567" rx="118" ry="20" fill="#17120e" opacity=".45"/>
    <circle cx="450" cy="526" r="104" fill="#241b14" stroke="#c2a477" stroke-width="7"/>
    <circle cx="450" cy="526" r="94" fill="none" stroke="#806345" stroke-width="3"/>
    <g stroke="#b79a6d" stroke-width="2" opacity=".78">
      <path d="M450 422V630M346 526H554M376 452L524 600M524 452L376 600"/>
      <path d="M410 430L490 622M546 486L354 566M355 486L545 566M489 430L411 622"/>
    </g>
    <circle cx="450" cy="526" r="10" fill="#d5bd8d" stroke="#59422d" stroke-width="4"/>
    <path d="M446 523L421 418 478 418 454 523" fill="none" stroke="#b18b59" stroke-width="7" stroke-linejoin="round"/>
    <path d="M410 418Q450 406 490 418L487 430Q450 421 413 430Z" fill="#4a3525" stroke="#c5a16b" stroke-width="3"/>
    <path d="M416 523H484M416 523l-10 14M484 523l10 14" fill="none" stroke="#4f3b29" stroke-width="6" stroke-linecap="round"/>
    <path d="M401 540h15M484 540h15" stroke="#c8a66d" stroke-width="4" stroke-linecap="round"/>

    <!-- Capybara: legs, body, and arms -->
    <path d="M413 361Q389 391 386 427L406 461 424 449 421 422 447 393Z" fill="#8d6947" stroke="#38281d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M467 366Q490 392 492 423L474 454 457 445 463 418 441 393Z" fill="#77573a" stroke="#38281d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M398 447L416 453 411 465Q405 470 394 463ZM461 444L478 449 483 463Q476 470 465 463Z" fill="#39281c"/>
    <path d="M390 325Q406 298 451 302 491 305 507 337L496 382Q472 407 425 393 391 384 382 356Z" fill="url(#fur)" stroke="#38281d" stroke-width="5"/>
    <path d="M397 340Q414 322 439 324M469 327Q487 334 493 351" fill="none" stroke="#d0a875" stroke-width="5" stroke-linecap="round" opacity=".75"/>
    <path d="M403 350Q389 380 366 404L379 415 420 389M483 350Q506 372 527 393L514 405 475 384" fill="none" stroke="#986f48" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M365 404l15 7M527 393l-13 12" stroke="#422f20" stroke-width="5" stroke-linecap="round"/>

    <!-- Head and expressive face -->
    <path d="M399 310Q389 291 398 273L418 259 455 262Q479 269 489 288L484 316Q473 333 447 337L414 329Z" fill="#bd9463" stroke="#38281d" stroke-width="5"/>
    <path d="M407 273Q398 255 411 247 427 247 428 268Z" fill="#8d6744" stroke="#38281d" stroke-width="4"/>
    <path d="M407 260Q413 253 420 260" fill="none" stroke="#d5ad79" stroke-width="3"/>
    <path d="M458 271Q472 253 484 265 489 276 476 285Z" fill="#916a45" stroke="#38281d" stroke-width="4"/>
    <path d="M414 294Q428 282 445 291L448 310Q439 320 418 313Z" fill="#d2aa77"/>
    <path d="M445 294Q462 281 476 293L473 311Q461 320 447 311Z" fill="#d2aa77"/>
    <ellipse cx="429" cy="284" rx="4.5" ry="5.5" fill="#241912"/>
    <ellipse cx="465" cy="284" rx="4.5" ry="5.5" fill="#241912"/>
    <path d="M432 304Q450 297 468 305 465 326 450 329 435 325 432 304Z" fill="#8b6140" stroke="#60432c" stroke-width="2"/>
    <ellipse cx="450" cy="306" rx="8" ry="5" fill="#302017"/>
    <path d="M439 320Q450 326 462 319" fill="none" stroke="#563b29" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M413 278Q426 268 439 277M452 275Q465 267 477 278" fill="none" stroke="#6b4b31" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Determination and hope in the moonlit air -->
    <path d="M347 259q-12-11-20 1M538 266q13-12 23 0M562 225l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z" fill="#ead8b6" opacity=".68"/>
    <path d="M337 282l-5 8M553 289l7 7" stroke="#d9c59f" stroke-width="2" opacity=".7"/>
  </g>
</svg>