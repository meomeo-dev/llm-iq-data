    <path d="M520 236 Q548 226 580 236" stroke="#4a3f3f" stroke-width="2" fill="none"/>
    <ellipse cx="508" cy="252" rx="11" ry="19" fill="#4a3a38"/>
    <circle cx="506" cy="245" r="3" fill="#0a0808"/>
    <circle cx="506" cy="259" r="3" fill="#0a0808"/>
    <path d="M512 268 Q542 284 588 274" stroke="#0d0a0a" stroke-width="2" fill="none"/>
    <polygon points="526,268 531,288 538,268" fill="#eee6d2"/>
    <polygon points="548,272 553,292 560,272" fill="#eee6d2"/>
    <!-- 眼睛与凶眉 -->
    <path d="M562 214 Q578 206 592 214" stroke="#0a0808" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M602 208 Q618 200 634 210" stroke="#0a0808" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="577" cy="226" rx="7" ry="5.5" fill="#f0d060"/>
    <ellipse cx="617" cy="222" rx="7" ry="5.5" fill="#f0d060"/>
    <circle cx="575" cy="226" r="3" fill="#0a0808"/>
    <circle cx="615" cy="222" r="3" fill="#0a0808"/>
    <circle cx="574" cy="224.5" r="0.9" fill="#fff"/>
    <circle cx="614" cy="220.5" r="0.9" fill="#fff"/>
