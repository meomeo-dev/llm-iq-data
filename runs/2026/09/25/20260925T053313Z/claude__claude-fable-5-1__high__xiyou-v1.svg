      <path d="M215 405 Q205 470 200 528"/>
      <path d="M240 405 Q238 470 236 528"/>
      <path d="M265 405 Q272 470 276 528"/>
    </g>
    <ellipse cx="205" cy="531" rx="13" ry="5" fill="#3a1a22"/>
    <ellipse cx="268" cy="531" rx="13" ry="5" fill="#3a1a22"/>
    <path d="M205 402 L200 320 Q205 300 240 296 Q275 300 280 320 L275 402 Z" fill="#e89aa6"/>
    <path d="M240 300 L262 340 L268 335 L246 298 Z" fill="#f6d9dd"/>
    <path d="M240 300 L218 340 L212 335 L234 298 Z" fill="#f6d9dd"/>
    <rect x="203" y="350" width="74" height="14" fill="#6b1f2a"/>
    <path d="M200 330 Q180 370 205 395 Q235 385 262 395 Q290 370 278 330 Q260 355 240 350 Q220 355 200 330 Z" fill="#e89aa6"/>
    <path d="M222 388 Q240 380 258 388 Q242 398 222 388 Z" fill="#f2d6c0"/>
