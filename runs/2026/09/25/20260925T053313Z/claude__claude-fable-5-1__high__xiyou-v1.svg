    <path d="M664 340 Q690 320 690 280 L708 286 Q706 334 678 364 Z" fill="url(#cloth)"/>
    <circle cx="694" cy="262" r="12" fill="#3a2b24"/>
    <path d="M684 256 L680 250 M686 265 L678 266 M690 272 L684 278" stroke="#3a2b24" stroke-width="4" stroke-linecap="round"/>

    <!-- 大耳 -->
