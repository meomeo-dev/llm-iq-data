  <!-- 灌进屋里的风沙 -->
  <g stroke="#cfc8b4" stroke-opacity="0.28" fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M540 300 q-40 10 -80 -4 t-70 8"/>
    <path d="M545 370 q-45 -12 -90 4 t-70 -6"/>
    <path d="M540 450 q-40 14 -85 0 t-65 8"/>
  </g>
  <g fill="#d9c9a2" fill-opacity="0.45">
    <circle cx="470" cy="290" r="1.2"/><circle cx="440" cy="360" r="1.3"/><circle cx="500" cy="410" r="1.1"/>
    <circle cx="455" cy="480" r="1.2"/><circle cx="420" cy="320" r="1"/><circle cx="510" cy="250" r="1.2"/>
  </g>
  <polygon points="452,300 460,296 462,304 454,308" fill="#5f5a52" stroke="#2a2724" stroke-width="1"/>

  <!-- 题记 -->
  <text x="400" y="591" font-family="serif" font-size="14" fill="#8a7a66" text-anchor="middle">西游记 · 第十八回 · 高老庄</text>
</svg>