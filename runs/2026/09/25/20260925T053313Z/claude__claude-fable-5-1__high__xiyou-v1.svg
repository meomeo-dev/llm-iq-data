  <!-- 门框与门槛 -->
  <rect x="522" y="122" width="196" height="440" fill="none" stroke="#4a2f1c" stroke-width="16"/>
  <rect x="514" y="554" width="212" height="14" fill="#5a3d25"/>

  <!-- 被推开的门扇（向屋内荡开） -->
  <g>
    <polygon points="530,130 472,112 472,572 530,555" fill="url(#wood)"/>
    <polygon points="522,150 482,138 482,330 522,335" fill="none" stroke="#2c1a0e" stroke-width="3"/>
    <polygon points="522,352 482,352 482,545 522,535" fill="none" stroke="#2c1a0e" stroke-width="3"/>
    <circle cx="486" cy="345" r="7" fill="none" stroke="#b7791f" stroke-width="3"/>
  </g>

  <!-- 猪妖：黑脸短毛、长嘴大耳，青蓝粗布长衫、花布手巾，扛九齿钉钯 -->
  <g>
    <!-- 钉钯木柄（身后斜向肩上） -->
    <line x1="540" y1="540" x2="735" y2="175" stroke="#7a4a20" stroke-width="10" stroke-linecap="round"/>
    <line x1="540" y1="540" x2="735" y2="175" stroke="#c98a3e" stroke-width="3" stroke-linecap="round"/>
    <!-- 九齿钉钯头 -->
    <g transform="translate(735 175) rotate(-62)">
      <rect x="-6" y="-54" width="12" height="108" rx="3" fill="#b7791f" stroke="#5a3a10" stroke-width="1.5"/>
      <g stroke="#e0b04a" stroke-width="4" stroke-linecap="round">
        <line x1="6" y1="-48" x2="34" y2="-48"/>
        <line x1="6" y1="-36" x2="34" y2="-36"/>
        <line x1="6" y1="-24" x2="34" y2="-24"/>
        <line x1="6" y1="-12" x2="34" y2="-12"/>
        <line x1="6" y1="0" x2="34" y2="0"/>
        <line x1="6" y1="12" x2="34" y2="12"/>
        <line x1="6" y1="24" x2="34" y2="24"/>
        <line x1="6" y1="36" x2="34" y2="36"/>
        <line x1="6" y1="48" x2="34" y2="48"/>
      </g>
    </g>

    <!-- 双脚 -->
    <ellipse cx="572" cy="553" rx="26" ry="10" fill="#141010"/>
    <ellipse cx="652" cy="553" rx="26" ry="10" fill="#141010"/>
    <!-- 脖子 -->
    <rect x="588" y="270" width="48" height="60" fill="#1c1717"/>
    <!-- 青蓝色粗布长衫 -->
    <path d="M545 330 Q612 298 678 330 L702 547 L520 547 Z" fill="url(#robe)"/>
    <path d="M545 330 Q612 298 678 330 L702 547 L520 547 Z" fill="url(#cloth)"/>
    <ellipse cx="612" cy="475" rx="72" ry="58" fill="#5aa0c0" fill-opacity="0.18"/>
    <path d="M612 322 L584 420" stroke="#0e2431" stroke-width="3" fill="none"/>
    <path d="M612 322 L640 420" stroke="#0e2431" stroke-width="3" fill="none"/>
    <path d="M534 400 L606 400" stroke="#0e2431" stroke-width="2" fill="none"/>
    <rect x="532" y="418" width="160" height="18" fill="#1a1a1a"/>
    <circle cx="612" cy="427" r="8" fill="#2c2c2c" stroke="#0a0a0a" stroke-width="1.5"/>
    <path d="M612 435 Q600 470 606 500" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M612 435 Q626 470 620 500" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- 左臂：推门 -->
