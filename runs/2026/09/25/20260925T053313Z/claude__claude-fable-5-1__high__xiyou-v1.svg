  <g>
    <path d="M195 400 Q180 470 175 530 L300 530 Q300 470 285 400 Z" fill="#c9566a"/>
    <path d="M175 530 Q235 545 300 530 L300 522 Q235 538 175 522 Z" fill="#8f2f42"/>
