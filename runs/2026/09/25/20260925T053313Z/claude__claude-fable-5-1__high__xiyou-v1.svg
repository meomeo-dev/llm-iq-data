      <path d="M710 450 q-50 -12 -95 6 t-85 -6"/>
      <path d="M710 520 q-45 15 -90 -3 t-90 8"/>
    </g>
    <g fill="#d9c9a2" fill-opacity="0.7">
      <circle cx="560" cy="180" r="1.4"/><circle cx="590" cy="150" r="1.2"/><circle cx="640" cy="170" r="1.6"/>
      <circle cx="680" cy="215" r="1.2"/><circle cx="545" cy="245" r="1.5"/><circle cx="600" cy="265" r="1.3"/>
      <circle cx="660" cy="280" r="1.5"/><circle cx="700" cy="335" r="1.2"/><circle cx="570" cy="330" r="1.4"/>
      <circle cx="620" cy="350" r="1.6"/><circle cx="690" cy="410" r="1.3"/><circle cx="555" cy="420" r="1.2"/>
      <circle cx="605" cy="470" r="1.5"/><circle cx="675" cy="490" r="1.4"/><circle cx="540" cy="500" r="1.2"/>
      <circle cx="630" cy="535" r="1.3"/><circle cx="700" cy="545" r="1.5"/><circle cx="575" cy="215" r="1.1"/>
      <circle cx="655" cy="240" r="1.2"/><circle cx="585" cy="395" r="1.4"/>
    </g>
    <g fill="#5f5a52" stroke="#2a2724" stroke-width="1">
