      <path d="M214 262 Q214 228 240 228 Q266 228 266 262 Q262 242 240 241 Q218 242 214 262 Z" fill="#161010"/>
      <circle cx="262" cy="232" r="3" fill="#e0b64a"/>
      <line x1="262" y1="232" x2="286" y2="220" stroke="#e0b64a" stroke-width="2"/>
      <!-- 眉眼：眉梢上挑，眼睛微眯斜视，金色眼珠 -->
      <path d="M224 252 Q233 246 243 252" fill="none" stroke="#2a1a14" stroke-width="1.6"/>
      <path d="M248 250 Q257 244 266 251" fill="none" stroke="#2a1a14" stroke-width="1.6"/>
      <path d="M226 262 Q233 256 241 261" fill="none" stroke="#2a1a14" stroke-width="1.6"/>
      <path d="M248 260 Q255 254 262 259" fill="none" stroke="#2a1a14" stroke-width="1.6"/>
      <ellipse cx="238" cy="262" rx="3.4" ry="2.6" fill="#c98a1e"/>
      <ellipse cx="258" cy="260" rx="3.4" ry="2.6" fill="#c98a1e"/>
      <circle cx="239.8" cy="261.5" r="1.5" fill="#120a08"/>
      <circle cx="259.8" cy="259.5" r="1.5" fill="#120a08"/>
      <circle cx="240.6" cy="260.8" r="0.5" fill="#fff"/>
      <circle cx="260.6" cy="258.8" r="0.5" fill="#fff"/>
      <path d="M228 264 Q234 266 242 264" fill="none" stroke="#2a1a14" stroke-width="1"/>
      <path d="M250 263 Q256 265 263 262" fill="none" stroke="#2a1a14" stroke-width="1"/>
      <path d="M246 268 Q249 274 244 276" fill="none" stroke="#c9967e" stroke-width="1.2"/>
      <path d="M236 283 Q246 288 256 281" fill="none" stroke="#b04a55" stroke-width="1.6"/>
      <circle cx="228" cy="276" r="5" fill="#f2a5a0" fill-opacity="0.45"/>
    </g>
  </g>

  <!-- 小几与油灯：火苗被风吹得歪向一侧 -->
  <g>
    <circle cx="422" cy="392" r="120" fill="url(#glow)"/>
    <rect x="392" y="430" width="62" height="8" fill="#5a3d25"/>
    <rect x="398" y="438" width="6" height="34" fill="#3b2415"/>
    <rect x="442" y="438" width="6" height="34" fill="#3b2415"/>
    <path d="M412 428 L432 428 L428 412 L416 412 Z" fill="#8a6a3a"/>
    <rect x="418" y="404" width="8" height="8" fill="#6b4c2a"/>
    <path d="M422 408 Q408 392 414 378 Q416 388 422 380 Q430 392 422 408 Z" fill="url(#flame)"/>
  </g>

  <!-- 门外：夜空、狂风、飞沙走石 -->
  <rect x="530" y="130" width="180" height="425" fill="url(#sky)"/>
  <g clip-path="url(#doorway)">
    <circle cx="680" cy="190" r="22" fill="#d8d3b8" fill-opacity="0.3"/>
    <path d="M530 300 Q600 250 710 320 L710 555 L530 555 Z" fill="#5a4a36" fill-opacity="0.35"/>
