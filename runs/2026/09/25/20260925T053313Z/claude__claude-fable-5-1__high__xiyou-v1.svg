<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>西游记·第十八回·高老庄：猪妖夜推闺房门</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f1a"/>
      <stop offset="1" stop-color="#17100d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a20"/>
      <stop offset="1" stop-color="#1a120d"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090c18"/>
      <stop offset="1" stop-color="#23212a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb84d" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ff9a2e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx="0.5" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#fff5c2"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e2521b" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7a95"/>
      <stop offset="1" stop-color="#1e4052"/>
    </linearGradient>
    <pattern id="cloth" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0b1f2b" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>
    <pattern id="flowers" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.2" fill="#ffe08a"/>
      <circle cx="7" cy="3.5" r="1.4" fill="#fff3c4"/>
      <circle cx="10.5" cy="7" r="1.4" fill="#fff3c4"/>
      <circle cx="7" cy="10.5" r="1.4" fill="#fff3c4"/>
      <circle cx="3.5" cy="7" r="1.4" fill="#fff3c4"/>
    </pattern>
    <linearGradient id="curtain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2230"/>
      <stop offset="1" stop-color="#3a0d16"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2f1c"/>
      <stop offset="0.5" stop-color="#6b4526"/>
      <stop offset="1" stop-color="#3b2415"/>
    </linearGradient>
    <clipPath id="doorway"><rect x="530" y="130" width="180" height="425"/></clipPath>
  </defs>

  <!-- 室内：墙、地板、房梁 -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="470" width="800" height="130" fill="url(#floor)"/>
  <g stroke="#0f0a07" stroke-width="1.5">
    <line x1="0" y1="470" x2="800" y2="470"/>
    <line x1="0" y1="505" x2="800" y2="505"/>
    <line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="0" y1="575" x2="800" y2="575"/>
  </g>
  <rect x="0" y="40" width="800" height="22" fill="#3b2415"/>
  <rect x="0" y="62" width="800" height="4" fill="#1a100a"/>

  <!-- 左上窗棂：窗纸外风声 -->
  <g>
    <rect x="60" y="90" width="130" height="130" fill="#20263a"/>
    <g stroke="#8a93a8" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M62 110 q30 -8 60 4 t60 -6"/>
      <path d="M62 150 q35 10 65 -4 t60 6"/>
      <path d="M62 195 q30 -10 60 2 t62 -4"/>
    </g>
    <g stroke="#5a3d25" stroke-width="4">
      <line x1="60" y1="133" x2="190" y2="133"/>
      <line x1="60" y1="176" x2="190" y2="176"/>
      <line x1="103" y1="90" x2="103" y2="220"/>
      <line x1="146" y1="90" x2="146" y2="220"/>
    </g>
    <rect x="56" y="86" width="138" height="138" fill="none" stroke="#5a3d25" stroke-width="8"/>
  </g>

  <!-- 架子床 -->
  <g>
    <rect x="70" y="150" width="330" height="18" fill="url(#wood)"/>
    <rect x="70" y="150" width="12" height="320" fill="#3b2415"/>
    <rect x="388" y="150" width="12" height="320" fill="#3b2415"/>
    <rect x="82" y="168" width="306" height="232" fill="#2b0d14"/>
    <path d="M82 168 L150 168 Q120 260 140 330 Q150 380 110 400 L82 400 Z" fill="url(#curtain)"/>
    <path d="M388 168 L330 168 Q355 250 340 320 Q332 370 370 400 L388 400 Z" fill="url(#curtain)"/>
    <g stroke="#a33a4a" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M100 175 Q95 280 105 395"/>
      <path d="M120 175 Q112 270 125 395"/>
      <path d="M370 175 Q375 280 365 395"/>
      <path d="M350 175 Q358 270 348 395"/>
    </g>
    <path d="M82 168 L388 168 L388 190 Q350 178 310 192 Q270 178 235 192 Q200 178 160 192 Q120 178 82 190 Z" fill="#8a2a38"/>
    <rect x="82" y="422" width="306" height="48" fill="#4a2f1c"/>
    <rect x="82" y="400" width="306" height="22" fill="#7d5a3a"/>
    <rect x="82" y="396" width="306" height="10" rx="3" fill="#c9b08a"/>
    <rect x="100" y="372" width="80" height="26" rx="8" fill="#b7455a"/>
  </g>

