    <path d="M552 338 Q520 340 492 330 L486 352 Q520 364 556 364 Z" fill="url(#cloth)"/>
    <circle cx="484" cy="341" r="11" fill="#3a2b24"/>
    <path d="M476 336 L470 330 M476 341 L468 339 M477 347 L469 350" stroke="#3a2b24" stroke-width="4" stroke-linecap="round"/>
    <!-- 右臂：扛钯 -->
