    <path d="M560 204 Q534 178 526 204 Q532 226 552 220 Z" fill="#5a3c3c"/>
    <path d="M658 196 Q702 156 716 198 Q708 240 666 228 Z" fill="#1e1a1a"/>
    <path d="M664 202 Q692 176 700 204 Q694 228 672 220 Z" fill="#5a3c3c"/>
    <!-- 黑脸 -->
    <ellipse cx="612" cy="232" rx="56" ry="50" fill="#1e1a1a"/>
    <!-- 短毛 -->
    <g stroke="#3d3434" stroke-width="2" stroke-linecap="round">
      <line x1="648" y1="262" x2="656" y2="270"/>
      <line x1="656" y1="252" x2="666" y2="258"/>
      <line x1="640" y1="272" x2="646" y2="282"/>
      <line x1="662" y1="240" x2="672" y2="242"/>
      <line x1="600" y1="278" x2="602" y2="288"/>
      <line x1="620" y1="280" x2="624" y2="290"/>
      <line x1="560" y1="238" x2="552" y2="242"/>
    </g>
    <!-- 长嘴 -->
