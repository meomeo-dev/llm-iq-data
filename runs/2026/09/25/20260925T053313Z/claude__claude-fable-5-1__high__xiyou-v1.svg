    <path d="M588 358 Q560 350 548 372" stroke="#0a0a0d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g stroke="#cfc8b4" stroke-opacity="0.5" fill="none" stroke-width="1.8" stroke-linecap="round">
      <path d="M710 160 q-40 10 -80 -5 t-80 8"/>
      <path d="M710 230 q-50 20 -95 0 t-85 12"/>
      <path d="M710 300 q-45 -15 -90 5 t-90 -8"/>
