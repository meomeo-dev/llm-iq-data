<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd4ee"/>
      <stop offset="1" stop-color="#fdf0d8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7a194"/>
      <stop offset="1" stop-color="#6b645a"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cdc8bb"/>
      <stop offset="1" stop-color="#8c8578"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9352a"/>
      <stop offset="0.45" stop-color="#b8362c"/>
      <stop offset="1" stop-color="#6f5b3f"/>
    </linearGradient>
    <linearGradient id="billGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4c3b3"/>
      <stop offset="0.6" stop-color="#c99a80"/>
      <stop offset="1" stop-color="#d0583a"/>
    </linearGradient>
    <g id="spokes" stroke="#d3d7da" stroke-width="1.6">
