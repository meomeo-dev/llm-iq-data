      <line x1="-92" y1="0" x2="92" y2="0" transform="rotate(112.5)"/>
      <line x1="-92" y1="0" x2="92" y2="0" transform="rotate(135)"/>
      <line x1="-92" y1="0" x2="92" y2="0" transform="rotate(157.5)"/>
    </g>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e0602e"/>
