      <line x1="-92" y1="0" x2="92" y2="0" transform="rotate(22.5)"/>
      <line x1="-92" y1="0" x2="92" y2="0" transform="rotate(45)"/>
      <line x1="-92" y1="0" x2="92" y2="0" transform="rotate(67.5)"/>
