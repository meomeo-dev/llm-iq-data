<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="100%" height="100%">
  <defs>
    <!-- Sepia Gradients & Filters -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#2d1c10" stop-opacity="0"/>
      <stop offset="85%" stop-color="#180e07" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e0703" stop-opacity="0.95"/>
    </radialGradient>

    <linearGradient id="nightSky" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#140d07"/>
      <stop offset="50%" stop-color="#24170d"/>
      <stop offset="100%" stop-color="#342315"/>
    </linearGradient>

    <!-- Moonlight shaft gradients -->
    <linearGradient id="moonBeam1" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#faeed9" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ecd2ad" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#c99f6e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a37648" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="moonBeam2" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff4e3" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#f2d7b5" stop-opacity="0.38"/>
      <stop offset="80%" stop-color="#cf9f6c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8d6237" stop-opacity="0"/>
    </linearGradient>

    <!-- Shading gradients -->
    <linearGradient id="capyBodyGrad" x1="25%" y1="15%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ebd4b6"/>
      <stop offset="25%" stop-color="#c89f72"/>
      <stop offset="60%" stop-color="#875833"/>
      <stop offset="100%" stop-color="#462914"/>
    </linearGradient>

    <linearGradient id="capySnoutGrad" x1="30%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#faedd7"/>
      <stop offset="40%" stop-color="#be9366"/>
      <stop offset="85%" stop-color="#673f1f"/>
      <stop offset="100%" stop-color="#3c220f"/>
    </linearGradient>

    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#553a25"/>
      <stop offset="40%" stop-color="#372213"/>
      <stop offset="100%" stop-color="#1d1007"/>
    </linearGradient>

    <pattern id="dirtyGlass" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 20 L40 0 M10 60 L60 10 M0 50 L30 60" stroke="#715132" stroke-width="0.7" stroke-opacity="0.25"/>
      <circle cx="25" cy="25" r="1.5" fill="#583c22" fill-opacity="0.2"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="bokehBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Deep Sepia Atmosphere Background -->
  <rect width="900" height="1100" fill="url(#nightSky)"/>

  <!-- Dutch-Angle Rotated Greenhouse Scene (12 deg) -->
  <g transform="rotate(-12 450 550)">

    <!-- Distant Background Greenhouse Wall & Broken Panes -->
    <g id="greenhouse-backdrop" opacity="0.85">
      <polygon points="120,40 280,10 260,210 140,180" fill="#2b1b0e"/>
      <polygon points="320,5 470,-15 440,170 300,195" fill="#3f2b18"/>
      <polygon points="510,-20 680,-40 640,140 480,165" fill="#322010"/>
      <polygon points="720,-45 880,-65 830,120 670,140" fill="#25160b"/>

      <!-- Open vault sky opening -->
      <polygon points="260,20 420,-10 390,140 240,160" fill="#edd6b6" fill-opacity="0.28"/>
      <polygon points="430,-10 590,-30 550,120 400,135" fill="#fae8cc" fill-opacity="0.4"/>

      <!-- Crescent moon through broken roof -->
      <path d="M 470,25 A 28 28 0 1 0 495,65 A 24 24 0 1 1 470,25 Z" fill="#fff7ec" opacity="0.6" filter="url(#softGlow)"/>

      <!-- Glass panes -->
      <polygon points="140,220 270,200 240,420 120,430" fill="url(#dirtyGlass)"/>
      <polygon points="140,220 270,200 240,420 120,430" fill="#4d3521" fill-opacity="0.35"/>
      <polygon points="280,195 440,170 410,390 250,410" fill="#664629" fill-opacity="0.25"/>
      <polygon points="450,165 620,140 580,360 420,385" fill="#52361d" fill-opacity="0.35"/>
      <polygon points="630,135 790,110 740,330 590,355" fill="url(#dirtyGlass)"/>
      <polygon points="630,135 790,110 740,330 590,355" fill="#422915" fill-opacity="0.4"/>

      <!-- Jagged glass shards -->
      <polygon points="280,195 350,185 320,280 290,260" fill="#dfbe96" fill-opacity="0.3"/>
      <polygon points="440,170 410,250 430,280 470,200" fill="#fae2bf" fill-opacity="0.35"/>
      <polygon points="420,385 460,330 520,370" fill="#eed5b2" fill-opacity="0.25"/>
      <polygon points="130,410 180,360 160,425" fill="#cba275" fill-opacity="0.3"/>
      
      <!-- Crack lines in glass -->
      <path d="M290,260 L340,310 L370,290 M340,310 L330,370 M430,280 L480,290 L510,260 M480,290 L490,340" 
            stroke="#faead0" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>

      <!-- Arched ribs and iron mullions -->
      <path d="M 80,480 C 100,200 240,20 480,-20 C 720,-60 880,100 930,420" fill="none" stroke="#2a1a0e" stroke-width="18"/>
      <path d="M 120,530 C 140,280 270,110 500,70 C 720,30 840,160 890,460" fill="none" stroke="#382414" stroke-width="12"/>
      <line x1="260" y1="10" x2="210" y2="700" stroke="#25160c" stroke-width="9"/>
      <line x1="430" y1="-20" x2="380" y2="720" stroke="#2d1c10" stroke-width="11"/>
      <line x1="610" y1="-40" x2="560" y2="740" stroke="#28180d" stroke-width="9"/>
      <line x1="50" y1="210" x2="900" y2="100" stroke="#311e11" stroke-width="8"/>
      <line x1="30" y1="410" x2="920" y2="300" stroke="#26160b" stroke-width="10"/>
    </g>

    <!-- Overgrown Vines & Tendrils -->
    <g id="background-vines">
      <path d="M260,10 Q280,90 250,160 T270,270 T240,370" fill="none" stroke="#382413" stroke-width="4"/>
      <path d="M420,-20 Q390,70 430,150 T400,280 T420,400" fill="none" stroke="#4a311b" stroke-width="5"/>
      <path d="M240,120 C220,100 200,120 210,140 C215,160 250,150 240,120 Z" fill="#3a2514"/>
      <path d="M260,150 C280,130 300,150 285,170 C270,190 250,175 260,150 Z" fill="#4d331c"/>
      <path d="M275,220 C295,200 310,230 290,250 C270,260 260,235 275,220 Z" fill="#543920"/>
      <path d="M80,410 Q140,390 210,405 T350,380 T500,360 T680,330 T850,295" fill="none" stroke="#3c2615" stroke-width="4.5"/>
    </g>

    <!-- Parapet / Elevated Overgrown Pathway -->
    <g id="parapet-track">
      <polygon points="-50,860 980,710 1000,1200 -50,1200" fill="#150c06"/>
      <polygon points="-20,830 960,670 960,740 -20,910" fill="#24160c"/>
      <polygon points="-50,830 980,670 960,640 -50,790" fill="#442e1b"/>
      <path d="M-30,810 L950,650" stroke="#5a3d24" stroke-width="4"/>
      <path d="M300,765 L330,775 L350,760 L380,770" stroke="#180e07" stroke-width="3.5" fill="none"/>
      <!-- Crevice weeds and moss -->
      <path d="M490,728 Q500,695 480,680 Q505,690 505,725" fill="#71502b"/>
      <path d="M515,722 Q525,685 540,695 Q530,710 528,720" fill="#886237"/>
      <!-- Shards reflecting light on the ledge -->
      <polygon points="360,755 385,750 375,760" fill="#f4dfc2" fill-opacity="0.6"/>
      <polygon points="560,715 578,710 585,720 568,722" fill="#fff3e0" fill-opacity="0.75"/>
    </g>

    <!-- Volumetric Moonlight Rays -->
    <g id="moonlight-beams" style="mix-blend-mode: screen;">
      <polygon points="260,-20 580,-40 760,850 160,950" fill="url(#moonBeam1)"/>
      <polygon points="370,-30 520,-40 680,820 330,860" fill="url(#moonBeam2)"/>
      <polygon points="280,10 340,5 560,820 460,840" fill="url(#moonBeam1)" opacity="0.7"/>
    </g>

    <!-- Floating Spores / Dust Motes -->
    <g id="dust-motes" opacity="0.75">
      <circle cx="340" cy="220" r="2.5" fill="#fff8ed" filter="url(#softGlow)"/>
      <circle cx="480" cy="260" r="3.2" fill="#fff4e1" opacity="0.9" filter="url(#softGlow)"/>
      <circle cx="450" cy="380" r="2.2" fill="#fff7eb"/>
      <circle cx="530" cy="340" r="2.8" fill="#fff8ed" filter="url(#softGlow)"/>
      <circle cx="480" cy="460" r="3.5" fill="#fffbee" opacity="0.85" filter="url(#softGlow)"/>
      <circle cx="510" cy="580" r="3" fill="#fff8ec" filter="url(#softGlow)"/>
      <circle cx="410" cy="290" r="9" fill="#fae3c3" opacity="0.18" filter="url(#bokehBlur)"/>
      <circle cx="520" cy="440" r="14" fill="#fff2dc" opacity="0.15" filter="url(#bokehBlur)"/>
    </g>

    <!-- Capybara Riding the Unicycle -->
    <g id="hero-capybara-unicycle">
      <!-- Shadow on the parapet -->
      <ellipse cx="495" cy="735" rx="55" ry="14" fill="#130b06" opacity="0.85" transform="rotate(-8 495 735)"/>

      <!-- Unicycle -->
      <g id="unicycle">
        <circle cx="480" cy="650" r="82" fill="none" stroke="#22150c" stroke-width="15"/>
        <circle cx="480" cy="650" r="82" fill="none" stroke="#362214" stroke-width="11"/>
        <circle cx="480" cy="650" r="88" fill="none" stroke="#503520" stroke-width="2" stroke-dasharray="4 6"/>
        <circle cx="480" cy="650" r="74" fill="none" stroke="#a47a4f" stroke-width="4"/>
        <circle cx="480" cy="650" r="72" fill="#1e130a" fill-opacity="0.6"/>

        <!-- Spokes -->
        <g stroke="#eed5b5" stroke-width="1.3" opacity="0.75">
          <line x1="480" y1="650" x2="480" y2="576"/><line x1="480" y1="650" x2="480" y2="724"/>
          <line x1="480" y1="650" x2="406" y2="650"/><line x1="480" y1="650" x2="554" y2="650"/>
          <line x1="480" y1="650" x2="428" y2="598"/><line x1="480" y1="650" x2="532" y2="702"/>
          <line x1="480" y1="650" x2="532" y2="598"/><line x1="480" y1="650" x2="428" y2="702"/>
        </g>

        <!-- Hub -->
        <circle cx="480" cy="650" r="14" fill="#442a18"/>
        <circle cx="480" cy="650" r="9" fill="#cfa475"/>
        <circle cx="480" cy="650" r="4" fill="#fff0da"/>

        <!-- Frame, seatpost & saddle -->
        <path d="M472,646 L468,545 L476,515 L484,515 L492,545 L488,646" fill="url(#ironGrad)"/>
        <path d="M474,640 L470,545 L477,517" stroke="#faedd9" stroke-width="1.8" fill="none" opacity="0.8"/>
        <rect x="475" y="470" width="10" height="48" rx="3" fill="#674528"/>
        <rect x="477" y="470" width="3" height="48" fill="#f8e5cc" opacity="0.85"/>
        <path d="M435,465 C445,475 465,478 480,477 C495,478 515,475 528,460 C535,452 525,442 510,448 C495,453 465,453 450,448 C435,442 425,455 435,465 Z" fill="#2e1a0e"/>
        <path d="M438,458 C450,467 470,470 480,469 C495,470 512,465 522,454" stroke="#faedd8" stroke-width="1.2" fill="none" opacity="0.7"/>
        
        <!-- Cranks & Pedals -->
        <line x1="480" y1="650" x2="455" y2="685" stroke="#7e5936" stroke-width="5" stroke-linecap="round"/>
        <polygon points="440,683 465,677 468,690 443,696" fill="#422917"/>
        <line x1="480" y1="650" x2="508" y2="615" stroke="#c2986c" stroke-width="5" stroke-linecap="round"/>
        <polygon points="498,610 526,603 529,617 501,624" fill="#301d10"/>
        <line x1="500" y1="607" x2="525" y2="602" stroke="#fff4e3" stroke-width="1.8"/>
      </g>

      <!-- Capybara Character -->
      <g id="capybara">
        <!-- Back leg -->
        <path d="M455,420 C440,440 435,475 442,510 C445,525 440,545 445,565 C447,575 435,665 445,683" 
              stroke="#593b22" stroke-width="26" stroke-linecap="round" fill="none"/>
        <ellipse cx="448" cy="682" rx="14" ry="9" fill="#382212" transform="rotate(-10 448 682)"/>

        <!-- Stout Body -->
        <path d="M420,440 C390,430 370,390 380,330 C390,270 430,240 480,240 C520,240 550,265 565,300 C585,345 570,410 540,440 C515,465 445,465 420,440 Z" 
              fill="url(#capyBodyGrad)"/>
        <path d="M410,410 C425,445 450,460 480,458 C515,455 540,435 550,410 C530,440 495,448 465,445 C435,442 418,425 410,410 Z" fill="#2e1a0d" opacity="0.6"/>

        <!-- Fore leg pedaling -->
        <path d="M485,380 C520,380 545,410 540,450 C535,490 515,530 508,570 C505,585 510,602 512,612" 
              stroke="url(#capyBodyGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>
        <path d="M528,435 C528,470 512,515 505,560" stroke="#f6dfc2" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8"/>
        <path d="M500,608 C505,600 520,598 528,605 C535,612 525,622 512,624 C502,625 496,616 500,608 Z" fill="#3c2414"/>

        <!-- Balancer Arms (Paws outstretched with poise) -->
        <path d="M435,280 C395,285 365,270 345,255" stroke="url(#capyBodyGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
        <circle cx="342" cy="254" r="9" fill="#442a17"/>

        <path d="M510,275 C545,285 585,280 615,260" stroke="url(#capyBodyGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>
        <path d="M515,268 C550,277 585,272 615,254" stroke="#fff0dc" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9"/>
        <circle cx="618" cy="258" r="9.5" fill="#4a2e19"/>

        <!-- Noble Head & Profile -->
        <g id="capybara-head" transform="rotate(-6 510 190)">
          <path d="M465,235 C480,205 500,195 520,195 C550,195 565,225 560,255 Z" fill="#694326"/>
          <!-- Boxy muzzle -->
          <path d="M470,175 C470,140 500,120 545,120 C585,120 625,135 645,160 C660,180 665,210 655,230 C645,245 615,255 580,255 C530,255 480,245 468,220 C462,205 470,185 470,175 Z" 
                fill="url(#capySnoutGrad)"/>
          
          <ellipse cx="642" cy="180" rx="4" ry="7" fill="#180e07" transform="rotate(15 642 180)"/>
          <!-- Mouth with calm hopeful smile -->
          <path d="M645,208 C635,212 618,212 605,210" stroke="#23140a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          
          <!-- Eye with starry moonbeam reflection -->
          <ellipse cx="560" cy="155" rx="9" ry="7.5" fill="#150c06" transform="rotate(-5 560 155)"/>
          <path d="M548,150 C555,144 568,145 574,151" stroke="#ecd1af" stroke-width="2.8" stroke-linecap="round" fill="none"/>
          <circle cx="563" cy="152" r="3.2" fill="#ffffff" filter="url(#softGlow)"/>

          <!-- Alert Ear -->
          <path d="M482,145 C475,125 490,110 505,120 C515,128 510,150 495,152 Z" fill="#4e311b"/>
          <path d="M480,146 C472,126 488,108 506,118" stroke="#faedd9" stroke-width="2.5" fill="none" opacity="0.85"/>

          <!-- Moonlight highlight across bridge of snout -->
          <path d="M510,121 C545,121 590,135 635,160 C648,168 655,180 652,190" 
                stroke="#fff4e3" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95"/>

          <!-- Whiskers -->
          <path d="M632,204 Q655,202 675,208" stroke="#faecda" stroke-width="1.2" stroke-linecap="round" opacity="0.75" fill="none"/>
          <path d="M636,213 Q660,216 680,225" stroke="#ecd1b0" stroke-width="1" stroke-linecap="round" opacity="0.65" fill="none"/>
        </g>

        <!-- Back rimlight -->
        <path d="M472,175 C450,220 420,265 405,310 C390,360 405,410 430,445" 
              stroke="#fff5e4" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75"/>
      </g>
    </g>

    <!-- Foreground Silhouettes & Hanging Vines -->
    <g id="foreground-elements">
      <path d="M720,-50 Q750,80 730,190 T760,340 T720,490" fill="none" stroke="#22140a" stroke-width="8"/>
      <path d="M720,60 C760,40 790,65 770,95 C750,120 710,105 720,60 Z" fill="#29180c"/>
      <path d="M740,150 C790,130 820,165 795,200 C770,230 725,210 740,150 Z" fill="#331e0f"/>
      <path d="M740,150 C760,140 790,155 780,185" stroke="#a67749" stroke-width="2" fill="none" opacity="0.4"/>
      
      <!-- Bottom-left foreground fern silhouettes -->
      <path d="M20,950 C50,870 120,850 150,890 C120,930 70,950 20,950 Z" fill="#170d06"/>
      <path d="M80,980 C130,900 200,890 220,940 C180,970 130,980 80,980 Z" fill="#1c1008"/>
      <circle cx="145" cy="885" r="2.5" fill="#faebd7" opacity="0.8"/>
    </g>
  </g>

  <!-- Sepia Tone Vignette Overlay -->
  <rect width="900" height="1100" fill="url(#vignette)" pointer-events="none"/>
  <rect width="900" height="1100" fill="#7a4e27" opacity="0.06" style="mix-blend-mode: color-burn;" pointer-events="none"/>
</svg>