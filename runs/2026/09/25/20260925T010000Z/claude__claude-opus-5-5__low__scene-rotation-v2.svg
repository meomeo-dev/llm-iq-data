<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d10"/>
      <stop offset="1" stop-color="#5a4128"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e2c0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3e2c0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4dc"/>
      <stop offset="0.6" stop-color="#f0dcb0"/>
      <stop offset="1" stop-color="#f0dcb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#140c05" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b08452"/>
      <stop offset="1" stop-color="#6e4c2a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="#1e140a"/>

  <!-- 荷兰角：整个场景倾斜 -->
  <g transform="rotate(-9 400 400)">
    <rect x="-150" y="-150" width="1100" height="1100" fill="url(#sky)"/>

    <!-- 月亮 -->
    <circle cx="560" cy="150" r="110" fill="url(#moon)" opacity="0.6"/>
    <circle cx="560" cy="150" r="48" fill="#f7e8c8"/>
    <circle cx="545" cy="140" r="8" fill="#e2cda2"/>
    <circle cx="575" cy="165" r="5" fill="#e2cda2"/>

    <!-- 温室框架 -->
    <g stroke="#1a1008" stroke-width="7" fill="none">
      <path d="M40 760 L40 300 L400 60 L760 300 L760 760"/>
      <line x1="220" y1="180" x2="220" y2="760"/>
      <line x1="400" y1="60" x2="400" y2="760"/>
      <line x1="580" y1="180" x2="580" y2="760"/>
      <line x1="40" y1="450" x2="760" y2="450"/>
      <line x1="40" y1="600" x2="760" y2="600"/>
      <line x1="130" y1="240" x2="130" y2="760"/>
      <line x1="670" y1="240" x2="670" y2="760"/>
    </g>
    <!-- 残存玻璃 -->
    <g fill="#8a6a44" opacity="0.28">
      <polygon points="44,302 126,248 126,446 44,446"/>
      <polygon points="224,184 300,134 330,200 280,300 224,280"/>
      <polygon points="674,244 756,302 756,446 674,446"/>
      <polygon points="134,454 216,454 216,520 170,596 134,596"/>
      <polygon points="584,454 666,454 666,596 620,596 600,530"/>
    </g>
    <!-- 裂片边缘 -->
    <g stroke="#d8c09a" stroke-width="1.5" fill="none" opacity="0.6">
      <path d="M300 134 L330 200 L280 300"/>
      <path d="M216 520 L170 596"/>
      <path d="M666 596 L620 596 L600 530"/>
    </g>

    <!-- 月光光束 -->
    <g>
      <polygon points="470,110 620,110 700,780 360,780" fill="url(#beam)"/>
      <polygon points="330,150 400,120 470,780 290,780" fill="url(#beam)" opacity="0.6"/>
    </g>

    <!-- 地面 -->
    <path d="M-100 700 Q400 680 900 705 L900 900 L-100 900 Z" fill="#2e1f11"/>
    <g fill="#e8d4ae" opacity="0.5">
      <polygon points="220,715 240,708 236,722"/>
      <polygon points="560,720 585,712 575,728"/>
      <polygon points="610,730 622,724 628,736"/>
    </g>
    <ellipse cx="420" cy="722" rx="120" ry="14" fill="#140c05" opacity="0.6"/>

    <!-- 藤蔓 -->
    <g stroke="#2d2412" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M40 760 C60 640 20 560 70 470 S60 330 130 250"/>
      <path d="M760 760 C730 650 780 560 720 470 S740 330 660 250 S560 170 500 120"/>
      <path d="M130 250 C200 220 250 170 320 130"/>
      <path d="M220 600 C250 560 200 520 240 470"/>
    </g>
    <g fill="#3e3219">
      <ellipse cx="55" cy="620" rx="16" ry="8" transform="rotate(-30 55 620)"/>
      <ellipse cx="72" cy="480" rx="15" ry="7" transform="rotate(20 72 480)"/>
      <ellipse cx="100" cy="330" rx="14" ry="7" transform="rotate(-40 100 330)"/>
      <ellipse cx="180" cy="228" rx="14" ry="7" transform="rotate(10 180 228)"/>
      <ellipse cx="270" cy="160" rx="13" ry="6" transform="rotate(-25 270 160)"/>
      <ellipse cx="745" cy="640" rx="16" ry="8" transform="rotate(30 745 640)"/>
      <ellipse cx="725" cy="470" rx="15" ry="7" transform="rotate(-20 725 470)"/>
      <ellipse cx="700" cy="300" rx="14" ry="7" transform="rotate(35 700 300)"/>
      <ellipse cx="560" cy="165" rx="13" ry="6" transform="rotate(-15 560 165)"/>
      <ellipse cx="235" cy="530" rx="12" ry="6" transform="rotate(40 235 530)"/>
    </g>
    <!-- 垂下的藤 -->
    <g stroke="#2d2412" stroke-width="3" fill="none">
      <path d="M400 62 C395 120 410 160 398 210"/>
      <path d="M580 182 C575 240 590 270 578 320"/>
    </g>
    <!-- 地上的破花盆 -->
    <path d="M110 720 L150 720 L144 690 L116 690 Z" fill="#4a3320"/>
    <path d="M125 690 C120 660 135 650 130 630" stroke="#3e3219" stroke-width="3" fill="none"/>

    <!-- 独轮车 -->
    <g>
      <circle cx="420" cy="660" r="58" fill="none" stroke="#1a1008" stroke-width="10"/>
      <circle cx="420" cy="660" r="58" fill="none" stroke="#a88658" stroke-width="2"/>
      <g stroke="#3a2814" stroke-width="2">
        <line x1="420" y1="602" x2="420" y2="718"/>
        <line x1="362" y1="660" x2="478" y2="660"/>
        <line x1="379" y1="619" x2="461" y2="701"/>
        <line x1="461" y1="619" x2="379" y2="701"/>
      </g>
      <circle cx="420" cy="660" r="7" fill="#c9a676"/>
      <line x1="420" y1="660" x2="414" y2="520" stroke="#2a1b0d" stroke-width="8"/>
      <!-- 曲柄与踏板 -->
      <line x1="420" y1="660" x2="445" y2="685" stroke="#2a1b0d" stroke-width="5"/>
      <line x1="420" y1="660" x2="395" y2="635" stroke="#2a1b0d" stroke-width="5"/>
      <rect x="438" y="682" width="20" height="6" fill="#2a1b0d"/>
      <rect x="383" y="631" width="20" height="6" fill="#2a1b0d"/>
      <path d="M385 515 Q414 502 448 515 Q420 526 385 515 Z" fill="#241609"/>
    </g>

    <!-- 水豚 -->
    <g>
      <!-- 后腿 -->
      <path d="M430 520 Q455 580 450 682" stroke="#6e4c2a" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M400 515 Q380 575 394 632" stroke="#5e3f22" stroke-width="18" fill="none" stroke-linecap="round"/>
      <!-- 身体 -->
      <ellipse cx="412" cy="455" rx="72" ry="78" fill="url(#fur)" transform="rotate(-8 412 455)"/>
      <!-- 月光轮廓光 -->
      <path d="M455 395 Q490 440 478 510" stroke="#f3e2c0" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
      <!-- 前臂张开保持平衡 -->
      <path d="M370 430 Q330 420 300 395" stroke="#7a5532" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M455 425 Q500 410 525 380" stroke="#8a6440" stroke-width="16" fill="none" stroke-linecap="round"/>
      <!-- 头部 -->
      <g transform="rotate(-6 430 350)">
        <rect x="370" y="310" width="120" height="78" rx="36" fill="#9a7246"/>
        <rect x="440" y="325" width="62" height="58" rx="24" fill="#8a6440"/>
        <ellipse cx="395" cy="308" rx="11" ry="9" fill="#6e4c2a"/>
        <ellipse cx="420" cy="304" rx="10" ry="8" fill="#6e4c2a"/>
        <!-- 坚定的眼神 -->
        <circle cx="447" cy="337" r="6" fill="#1a1008"/>
        <circle cx="449" cy="335" r="2" fill="#f7e8c8"/>
        <path d="M437 326 L458 329" stroke="#2a1b0d" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="494" cy="344" rx="5" ry="3.5" fill="#2a1b0d"/>
        <!-- 微笑 -->
        <path d="M478 366 Q488 372 497 364" stroke="#2a1b0d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M470 318 Q495 322 502 345" stroke="#f3e2c0" stroke-width="3" fill="none" opacity="0.7"/>
      </g>
      <!-- 小围巾，飘向身后 -->
      <path d="M395 385 Q430 400 468 382" stroke="#c9a676" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M398 388 Q360 395 330 380 Q350 405 385 400" fill="#c9a676"/>
    </g>

    <!-- 飘浮的尘埃 -->
    <g fill="#f7e8c8">
      <circle cx="520" cy="300" r="2" opacity="0.8"/>
      <circle cx="560" cy="420" r="1.5" opacity="0.6"/>
      <circle cx="600" cy="520" r="2" opacity="0.7"/>
      <circle cx="500" cy="560" r="1.2" opacity="0.6"/>
      <circle cx="640" cy="360" r="1.5" opacity="0.5"/>
      <circle cx="380" cy="250" r="1.5" opacity="0.5"/>
    </g>
  </g>

  <rect width="800" height="800" fill="url(#vignette)"/>
  <rect width="800" height="800" fill="#704214" opacity="0.12"/>
</svg>