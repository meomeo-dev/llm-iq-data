<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Capybara riding a unicycle in a moonlit abandoned greenhouse</title>
  <defs>
    <radialGradient id="sky" gradientUnits="userSpaceOnUse" cx="672" cy="72" r="720">
      <stop offset="0" stop-color="#6a4f33"/>
      <stop offset="0.3" stop-color="#34251a"/>
      <stop offset="1" stop-color="#120c07"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#f4e6c4" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#e3cc9c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e3cc9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonFace" cx="0.4" cy="0.4">
      <stop offset="0" stop-color="#fbf1da"/>
      <stop offset="1" stop-color="#e2c998"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e3b8" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#e8d2a0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8d2a0" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e140c"/>
      <stop offset="1" stop-color="#3b2a1a"/>
    </linearGradient>
    <radialGradient id="pool">
      <stop offset="0" stop-color="#f1dfb3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f1dfb3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b48a58"/>
      <stop offset="0.55" stop-color="#8a6440"/>
      <stop offset="1" stop-color="#5a3e25"/>
    </linearGradient>
    <linearGradient id="scarf" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#d9bf8f"/>
      <stop offset="1" stop-color="#9c7c50"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#0d0804" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d0804" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="glass" patternUnits="userSpaceOnUse" x="-150" y="20" width="110" height="140">
      <rect width="110" height="140" fill="#3a2918" opacity="0.82"/>
      <path d="M14 132 L62 10 M30 136 L70 34" stroke="#9a7c55" stroke-width="2" opacity="0.22"/>
    </pattern>
    <pattern id="frame" patternUnits="userSpaceOnUse" x="-150" y="20" width="110" height="140">
      <rect width="110" height="140" fill="none" stroke="#120b06" stroke-width="8"/>
      <line x1="0" y1="70" x2="110" y2="70" stroke="#120b06" stroke-width="3"/>
      <line x1="4" y1="4" x2="106" y2="4" stroke="#6b5234" stroke-width="1" opacity="0.5"/>
    </pattern>
    <mask id="breaks" maskUnits="userSpaceOnUse" x="-300" y="-300" width="1400" height="1000">
      <rect x="-300" y="-300" width="1400" height="1000" fill="#fff"/>
      <g fill="#000">
        <polygon points="626,26 724,26 724,58 708,78 720,102 690,112 672,138 655,118 630,128 640,90 627,70"/>
        <polygon points="514,-60 560,-116 612,-100 590,-50 616,-10 570,14 548,-20 520,10"/>
        <polygon points="734,166 800,164 790,200 834,230 806,260 760,230 736,250"/>
        <polygon points="430,60 470,40 500,70 475,100 440,120 452,85"/>
        <polygon points="184,170 230,166 250,200 220,230 190,212"/>
      </g>
    </mask>
    <path id="leaf" d="M0 0 C5 -9 16 -9 22 0 C16 7 5 7 0 0 Z"/>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.17  0 0 0 0 0.09  0.9 0 0 0 -0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#120c07"/>

  <!-- Dutch angle: whole world tilted -->
  <g transform="rotate(-9 400 300)">
    <!-- night sky beyond the glass -->
    <rect x="-300" y="-300" width="1400" height="1300" fill="url(#sky)"/>
    <circle cx="672" cy="72" r="120" fill="url(#moonGlow)"/>
    <circle cx="672" cy="72" r="30" fill="url(#moonFace)"/>
    <circle cx="662" cy="64" r="6" fill="#d6bb88" opacity="0.5"/>
    <circle cx="682" cy="84" r="4" fill="#d6bb88" opacity="0.45"/>
    <circle cx="684" cy="62" r="3" fill="#d6bb88" opacity="0.4"/>

    <!-- glass wall with broken panes -->
    <rect x="-300" y="-120" width="1400" height="560" fill="url(#glass)" mask="url(#breaks)"/>
    <g fill="none" stroke="#e3cc9c" stroke-width="1.4" opacity="0.75" stroke-linejoin="bevel">
      <polygon points="626,26 724,26 724,58 708,78 720,102 690,112 672,138 655,118 630,128 640,90 627,70"/>
      <polygon points="514,-60 560,-116 612,-100 590,-50 616,-10 570,14 548,-20 520,10"/>
      <polygon points="734,166 800,164 790,200 834,230 806,260 760,230 736,250"/>
      <polygon points="430,60 470,40 500,70 475,100 440,120 452,85"/>
      <polygon points="184,170 230,166 250,200 220,230 190,212"/>
    </g>
    <rect x="-300" y="-120" width="1400" height="560" fill="url(#frame)"/>
    <!-- eave beam and rafters -->
    <rect x="-300" y="14" width="1400" height="12" fill="#120b06"/>
    <path d="M-150 20 L180 -140 M950 20 L620 -140" stroke="#120b06" stroke-width="10"/>
    <line x1="-300" y1="15" x2="1100" y2="15" stroke="#7a5d3c" stroke-width="1.2" opacity="0.6"/>

    <!-- moonbeams -->
    <g filter="url(#soft)">
      <polygon points="626,30 724,40 560,620 350,620" fill="url(#beam)"/>
      <polygon points="514,-60 612,-60 300,620 190,620" fill="url(#beam)" opacity="0.55"/>
      <polygon points="736,200 834,230 660,620 560,620" fill="url(#beam)" opacity="0.6"/>
      <polygon points="432,60 498,70 262,620 205,620" fill="url(#beam)" opacity="0.45"/>
      <polygon points="186,170 248,200 120,620 70,620" fill="url(#beam)" opacity="0.35"/>
    </g>

    <!-- floor -->
    <rect x="-300" y="440" width="1400" height="500" fill="url(#floor)"/>
    <rect x="-300" y="432" width="1400" height="16" fill="#24180e"/>
    <line x1="-300" y1="432" x2="1100" y2="432" stroke="#8a6d48" stroke-width="1" opacity="0.5"/>
    <g stroke="#120b06" stroke-width="2" opacity="0.8">
      <line x1="-300" y1="500" x2="1100" y2="500"/>
      <line x1="-300" y1="580" x2="1100" y2="580"/>
      <line x1="-300" y1="690" x2="1100" y2="690"/>
      <line x1="0" y1="448" x2="-240" y2="900"/>
      <line x1="200" y1="448" x2="90" y2="900"/>
      <line x1="400" y1="448" x2="420" y2="900"/>
      <line x1="600" y1="448" x2="750" y2="900"/>
      <line x1="800" y1="448" x2="1080" y2="900"/>
    </g>
    <path d="M250 520 L280 540 L270 560 L300 578 M620 600 L650 590 L668 610" stroke="#0d0804" stroke-width="1.5" fill="none"/>
    <ellipse cx="450" cy="540" rx="190" ry="44" fill="url(#pool)"/>
    <ellipse cx="620" cy="600" rx="120" ry="26" fill="url(#pool)" opacity="0.5"/>

    <!-- floor glass shards -->
    <g fill="#e8d2a0" opacity="0.75">
      <polygon points="300,530 314,524 308,536"/>
      <polygon points="520,560 540,552 532,566"/>
      <polygon points="610,520 622,514 620,528"/>
      <polygon points="360,590 372,586 364,598"/>
      <polygon points="680,560 700,556 690,570"/>
      <polygon points="230,500 240,496 238,506"/>
    </g>

    <!-- potting bench, left -->
    <g>
      <rect x="10" y="380" width="210" height="12" fill="#2a1c10"/>
      <rect x="22" y="392" width="9" height="80" fill="#1e140b"/>
      <rect x="198" y="392" width="9" height="80" fill="#1e140b"/>
      <rect x="22" y="440" width="185" height="6" fill="#1e140b"/>
      <path d="M40 346 L84 346 L77 380 L47 380 Z" fill="#6b4a2b"/>
      <rect x="37" y="342" width="50" height="7" fill="#7d5a36"/>
      <path d="M120 372 L158 356 L168 376 L132 386 Z" fill="#5e4128"/>
      <path d="M150 370 L178 364 L172 380" fill="#4a3320"/>
      <path d="M62 346 C52 320 76 300 62 272 M68 346 C84 322 74 300 92 286" stroke="#2c1f12" stroke-width="3" fill="none"/>
      <path d="M80 360 C110 392 92 424 118 470 M160 376 C176 410 160 436 176 470" stroke="#2c1f12" stroke-width="3" fill="none"/>
      <g fill="#5a4226">
        <use href="#leaf" transform="translate(62 300) rotate(-120) scale(0.7)"/>
        <use href="#leaf" transform="translate(88 292) rotate(-30) scale(0.7)"/>
        <use href="#leaf" transform="translate(100 400) rotate(60) scale(0.8)"/>
        <use href="#leaf" transform="translate(102 430) rotate(150) scale(0.7)"/>
        <use href="#leaf" transform="translate(168 420) rotate(20) scale(0.7)"/>
        <use href="#leaf" transform="translate(166 450) rotate(160) scale(0.7)"/>
      </g>
    </g>

    <!-- watering can, right -->
    <g fill="#2a1d12">
      <rect x="700" y="440" width="52" height="40" rx="6"/>
      <path d="M752 452 L790 430 L794 436 L756 462 Z"/>
      <path d="M708 440 C712 418 740 418 744 440" fill="none" stroke="#2a1d12" stroke-width="5"/>
      <path d="M702 444 L702 474" stroke="#a8875a" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- vines -->
    <g fill="none" stroke="#2c1f12" stroke-linecap="round">
      <path d="M-40 440 C-60 360 -10 320 -40 240 S-20 120 -50 40 S-30 -60 -60 -120" stroke-width="5"/>
      <path d="M900 440 C870 360 910 300 880 220 S900 100 860 20 S880 -80 840 -130" stroke-width="5"/>
      <path d="M-150 25 C0 8 100 48 250 22 S450 44 540 20" stroke-width="4"/>
      <path d="M150 24 C170 80 130 110 160 170 S150 240 172 280" stroke-width="3"/>
      <path d="M330 30 C340 70 316 100 334 140" stroke-width="2.5"/>
      <path d="M780 24 C760 70 800 110 772 170 S790 220 780 250" stroke-width="3"/>
      <path d="M-40 300 C0 290 30 320 70 300" stroke-width="3"/>
      <path d="M880 330 C850 320 830 350 800 340" stroke-width="3"/>
    </g>
    <g fill="#4a3620">
      <use href="#leaf" transform="translate(-44 400) rotate(-150)"/>
      <use href="#leaf" transform="translate(-36 360) rotate(-20)"/>
      <use href="#leaf" transform="translate(-30 280) rotate(-160)"/>
      <use href="#leaf" transform="translate(-40 200) rotate(-30)"/>
      <use href="#leaf" transform="translate(-40 130) rotate(-170)"/>
      <use href="#leaf" transform="translate(-44 60) rotate(-40)"/>
      <use href="#leaf" transform="translate(-40 -20) rotate(-150)"/>
      <use href="#leaf" transform="translate(40 18) rotate(80)"/>
      <use href="#leaf" transform="translate(100 34) rotate(110)"/>
      <use href="#leaf" transform="translate(210 26) rotate(70)"/>
      <use href="#leaf" transform="translate(280 22) rotate(100)"/>
      <use href="#leaf" transform="translate(390 38) rotate(80)"/>
      <use href="#leaf" transform="translate(470 30) rotate(120)"/>
      <use href="#leaf" transform="translate(156 90) rotate(20)"/>
      <use href="#leaf" transform="translate(146 140) rotate(160)"/>
      <use href="#leaf" transform="translate(160 210) rotate(30)"/>
      <use href="#leaf" transform="translate(166 262) rotate(120)"/>
      <use href="#leaf" transform="translate(330 90) rotate(150) scale(0.8)"/>
      <use href="#leaf" transform="translate(30 306) rotate(-60) scale(0.8)"/>
      <use href="#leaf" transform="translate(890 380) rotate(-20)"/>
      <use href="#leaf" transform="translate(884 300) rotate(-170)"/>
      <use href="#leaf" transform="translate(892 220) rotate(-20)"/>
      <use href="#leaf" transform="translate(876 150) rotate(-160)"/>
      <use href="#leaf" transform="translate(866 60) rotate(-30)"/>
      <use href="#leaf" transform="translate(830 336) rotate(-110) scale(0.8)"/>
    </g>
    <g fill="#b8966a">
      <use href="#leaf" transform="translate(776 90) rotate(20)"/>
      <use href="#leaf" transform="translate(782 140) rotate(150)"/>
      <use href="#leaf" transform="translate(780 210) rotate(40)"/>
      <use href="#leaf" transform="translate(540 20) rotate(100) scale(0.9)"/>
      <use href="#leaf" transform="translate(620 26) rotate(70) scale(0.8)"/>
      <use href="#leaf" transform="translate(326 124) rotate(30) scale(0.8)"/>
    </g>

    <!-- dust motes in moonlight -->
    <g fill="#f4e6c4">
      <circle cx="600" cy="200" r="1.6" opacity="0.8"/>
      <circle cx="660" cy="150" r="1.2" opacity="0.6"/>
      <circle cx="560" cy="300" r="1.8" opacity="0.7"/>
      <circle cx="620" cy="280" r="1.1" opacity="0.6"/>
      <circle cx="530" cy="360" r="1.4" opacity="0.7"/>
      <circle cx="580" cy="420" r="1.2" opacity="0.5"/>
      <circle cx="505" cy="470" r="1.6" opacity="0.6"/>
      <circle cx="450" cy="200" r="1" opacity="0.4"/>
      <circle cx="700" cy="330" r="1.3" opacity="0.5"/>
    </g>

    <!-- hopeful sprout ahead in the light -->
    <g>
      <path d="M578 502 L608 502 L603 528 L583 528 Z" fill="#7d5a36"/>
      <path d="M592 502 L596 512 L590 520" stroke="#2a1d12" stroke-width="1.2" fill="none"/>
      <rect x="575" y="498" width="36" height="6" fill="#8a6440"/>
      <path d="M593 498 C592 486 596 478 594 468" stroke="#3a2a17" stroke-width="2" fill="none"/>
      <use href="#leaf" transform="translate(594 474) rotate(-30) scale(0.6)" fill="#d9bf8f"/>
      <use href="#leaf" transform="translate(594 480) rotate(-160) scale(0.55)" fill="#c2a270"/>
    </g>

    <!-- capybara on a unicycle -->
    <g>
      <ellipse cx="428" cy="520" rx="64" ry="8" fill="#0d0804" opacity="0.7"/>
      <!-- motion lines -->
      <g stroke="#e3cc9c" stroke-width="2" stroke-linecap="round" opacity="0.45">
        <line x1="330" y1="452" x2="360" y2="452"/>
        <line x1="318" y1="472" x2="356" y2="472"/>
        <line x1="332" y1="492" x2="362" y2="492"/>
      </g>

      <!-- far limbs -->
      <path d="M404 338 C394 380 396 420 402 446" stroke="#4a3320" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M396 294 C376 284 356 276 338 262" stroke="#4a3320" stroke-width="14" stroke-linecap="round" fill="none"/>

      <!-- scarf tail flying back -->
      <path d="M470 276 C440 270 400 262 360 250 C340 244 318 250 296 238 C314 262 346 264 370 270 C400 278 440 292 470 298 Z" fill="url(#scarf)"/>
      <path d="M330 250 L342 262 M352 254 L362 266" stroke="#6b4a2b" stroke-width="3"/>

      <!-- unicycle -->
      <circle cx="420" cy="470" r="48" fill="none" stroke="#120b06" stroke-width="10"/>
      <circle cx="420" cy="470" r="41" fill="none" stroke="#b89868" stroke-width="2"/>
      <g stroke="#9c7c50" stroke-width="1.3">
        <line x1="420" y1="429" x2="420" y2="511"/>
        <line x1="379" y1="470" x2="461" y2="470"/>
        <line x1="391" y1="441" x2="449" y2="499"/>
        <line x1="449" y1="441" x2="391" y2="499"/>
      </g>
      <path d="M452 440 A44 44 0 0 1 462 478" stroke="#f4e6c4" stroke-width="2.5" fill="none" opacity="0.8"/>
      <path d="M412 470 L406 360 M428 470 L422 360" stroke="#2a1d12" stroke-width="5" stroke-linecap="round"/>
      <rect x="403" y="356" width="22" height="8" rx="2" fill="#2a1d12"/>
      <circle cx="420" cy="470" r="6" fill="#d9bf8f"/>
      <line x1="420" y1="470" x2="402" y2="446" stroke="#2a1d12" stroke-width="4"/>
      <line x1="420" y1="470" x2="440" y2="492" stroke="#3a2716" stroke-width="4"/>
      <rect x="392" y="442" width="18" height="5" rx="2" fill="#120b06"/>
      <rect x="431" y="490" width="18" height="5" rx="2" fill="#120b06"/>
      <ellipse cx="412" cy="350" rx="28" ry="8" fill="#3a2716" transform="rotate(-6 412 350)"/>

      <!-- body -->
      <ellipse cx="422" cy="306" rx="72" ry="50" fill="url(#fur)" transform="rotate(-15 422 306)"/>
      <path d="M368 290 C390 258 440 246 480 260" stroke="#f1dfb3" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
      <path d="M380 310 C392 300 402 300 412 306 M396 326 C408 318 420 318 430 324" stroke="#5a3e25" stroke-width="1.5" fill="none" opacity="0.7"/>

      <!-- near hind leg to pedal -->
      <path d="M426 334 C446 376 452 430 440 486" stroke="#7a5836" stroke-width="18" stroke-linecap="round" fill="none"/>
      <ellipse cx="442" cy="490" rx="12" ry="6" fill="#4a3320"/>

      <!-- head -->
      <path d="M470 236 C478 214 504 206 528 212 C548 217 560 230 562 250 C564 270 552 282 532 284 L500 288 C480 290 466 278 462 262 Z" fill="url(#fur)"/>
      <ellipse cx="548" cy="258" rx="14" ry="20" fill="#5e4128" opacity="0.45"/>
      <path d="M480 224 C495 210 522 208 542 216 C552 222 558 232 560 244" stroke="#f4e6c4" stroke-width="2.5" fill="none" opacity="0.85" stroke-linecap="round"/>
      <ellipse cx="478" cy="220" rx="7" ry="9" fill="#4a3320" transform="rotate(-20 478 220)"/>
      <ellipse cx="479" cy="221" rx="3" ry="5" fill="#7a5836" transform="rotate(-20 479 221)"/>
      <circle cx="512" cy="238" r="4.4" fill="#120b06"/>
      <circle cx="513.6" cy="236.4" r="1.4" fill="#f4e6c4"/>
      <path d="M502 228 L522 232" stroke="#2a1d12" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="554" cy="244" rx="2.6" ry="1.8" fill="#120b06"/>
      <path d="M552 268 Q543 273 534 268" stroke="#2a1d12" stroke-width="1.8" fill="none" stroke-linecap="round"/>

      <!-- scarf band around neck -->
      <path d="M464 268 Q484 284 502 286 L500 298 Q478 296 460 282 Z" fill="#d9bf8f"/>
      <path d="M470 276 L474 290 M484 282 L486 294" stroke="#8a6440" stroke-width="2"/>

      <!-- near front leg reaching toward the light -->
      <path d="M466 304 C490 306 512 298 534 290" stroke="#8a6440" stroke-width="15" stroke-linecap="round" fill="none"/>
      <ellipse cx="538" cy="289" rx="9" ry="6" fill="#5e4128" transform="rotate(-20 538 289)"/>
      <path d="M476 298 C496 298 514 292 530 284" stroke="#f1dfb3" stroke-width="1.8" fill="none" opacity="0.6"/>
    </g>
  </g>

  <!-- film grain and vignette -->
  <rect width="800" height="600" filter="url(#grain)" opacity="0.5"/>
  <rect width="800" height="600" fill="url(#vignette)"/>
  <rect width="800" height="600" fill="#a0784a" opacity="0.08"/>
</svg>