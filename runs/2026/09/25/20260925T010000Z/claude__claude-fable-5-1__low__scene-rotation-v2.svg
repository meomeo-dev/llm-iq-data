<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a130b"/>
      <stop offset="1" stop-color="#3a2a17"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e2b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3e2b8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff5dc"/>
      <stop offset="0.7" stop-color="#e9d3a2"/>
      <stop offset="1" stop-color="#e9d3a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3620"/>
      <stop offset="1" stop-color="#241a0e"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- whole scene tilted for Dutch angle -->
  <g transform="rotate(-12 400 300)">
    <!-- floor -->
    <rect x="-200" y="420" width="1200" height="400" fill="url(#floor)"/>
    <line x1="-200" y1="420" x2="1000" y2="420" stroke="#5a4426" stroke-width="2"/>

    <!-- back wall glass frames -->
    <g stroke="#6b5232" stroke-width="5" fill="#2c2114">
      <rect x="-100" y="40" width="1000" height="380"/>
    </g>
    <g stroke="#6b5232" stroke-width="4">
      <line x1="-100" y1="140" x2="900" y2="140"/>
      <line x1="-100" y1="240" x2="900" y2="240"/>
      <line x1="-100" y1="330" x2="900" y2="330"/>
      <line x1="0" y1="40" x2="0" y2="420"/>
      <line x1="120" y1="40" x2="120" y2="420"/>
      <line x1="240" y1="40" x2="240" y2="420"/>
      <line x1="360" y1="40" x2="360" y2="420"/>
      <line x1="480" y1="40" x2="480" y2="420"/>
      <line x1="600" y1="40" x2="600" y2="420"/>
      <line x1="720" y1="40" x2="720" y2="420"/>
      <line x1="840" y1="40" x2="840" y2="420"/>
    </g>

    <!-- sloped roof ribs -->
    <g stroke="#6b5232" stroke-width="6" fill="none">
      <path d="M-100 40 L400 -120 L900 40"/>
      <path d="M0 40 L400 -90"/>
      <path d="M120 40 L400 -60"/>
      <path d="M240 40 L400 -30"/>
      <path d="M560 40 L400 -30"/>
      <path d="M680 40 L400 -60"/>
      <path d="M800 40 L400 -90"/>
    </g>

    <!-- moon seen through a broken pane -->
    <circle cx="520" cy="90" r="70" fill="url(#moon)"/>
    <circle cx="520" cy="90" r="38" fill="#fff3d6"/>

    <!-- broken pane shards -->
    <g fill="#5a4a30" stroke="#8a7048" stroke-width="2">
      <path d="M480 40 L560 40 L545 75 L500 95 Z" fill="#2c2114"/>
      <path d="M480 140 L520 105 L560 140 Z"/>
      <path d="M600 40 L640 40 L610 90 Z"/>
      <path d="M360 240 L420 240 L390 275 Z"/>
    </g>

    <!-- moonlight beams -->
    <g>
      <polygon points="490,50 560,50 720,600 300,600" fill="url(#beam)"/>
      <polygon points="600,45 640,45 900,600 780,600" fill="url(#beam)" opacity="0.6"/>
      <polygon points="360,240 420,240 470,600 250,600" fill="url(#beam)" opacity="0.4"/>
    </g>

    <!-- vines -->
    <g fill="none" stroke="#4d3a1e" stroke-width="5" stroke-linecap="round">
      <path d="M-60 40 Q-20 160 40 200 T80 360 T30 470"/>
      <path d="M120 40 Q160 120 130 190 T170 320 T140 420"/>
      <path d="M840 40 Q790 130 830 230 T760 380 T800 470"/>
      <path d="M720 40 Q740 110 690 150 T720 270"/>
      <path d="M-100 300 Q60 280 180 330 T420 300"/>
    </g>
    <g fill="#5e4a26">
      <ellipse cx="30" cy="180" rx="14" ry="8" transform="rotate(-30 30 180)"/>
      <ellipse cx="70" cy="290" rx="14" ry="8" transform="rotate(20 70 290)"/>
      <ellipse cx="140" cy="150" rx="12" ry="7" transform="rotate(40 140 150)"/>
      <ellipse cx="160" cy="260" rx="14" ry="8" transform="rotate(-10 160 260)"/>
      <ellipse cx="810" cy="180" rx="14" ry="8" transform="rotate(30 810 180)"/>
      <ellipse cx="790" cy="330" rx="14" ry="8" transform="rotate(-25 790 330)"/>
      <ellipse cx="700" cy="120" rx="12" ry="7" transform="rotate(50 700 120)"/>
      <ellipse cx="110" cy="320" rx="12" ry="7" transform="rotate(10 110 320)"/>
      <ellipse cx="300" cy="310" rx="12" ry="7" transform="rotate(-15 300 310)"/>
    </g>

    <!-- scattered pots and debris -->
    <g fill="#3b2c16" stroke="#5a4426" stroke-width="2">
      <path d="M60 470 L90 470 L84 510 L66 510 Z"/>
      <path d="M700 460 L740 460 L732 505 L708 505 Z"/>
      <path d="M760 480 L800 470 L805 490 L765 500 Z"/>
    </g>

    <!-- shadow -->
    <ellipse cx="410" cy="505" rx="90" ry="14" fill="#120c05" opacity="0.6"/>

    <!-- unicycle -->
    <g transform="translate(410 460)">
      <circle cx="0" cy="0" r="46" fill="none" stroke="#c9ad7a" stroke-width="7"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#8a7048" stroke-width="2"/>
      <g stroke="#b89a68" stroke-width="2">
        <line x1="0" y1="-40" x2="0" y2="40"/>
        <line x1="-40" y1="0" x2="40" y2="0"/>
        <line x1="-28" y1="-28" x2="28" y2="28"/>
        <line x1="28" y1="-28" x2="-28" y2="28"/>
      </g>
      <circle cx="0" cy="0" r="6" fill="#d8bc86"/>
      <!-- fork -->
      <path d="M-10 0 L-10 -70 L10 -70 L10 0" fill="none" stroke="#c9ad7a" stroke-width="6"/>
      <line x1="0" y1="-70" x2="0" y2="-118" stroke="#c9ad7a" stroke-width="7"/>
      <!-- seat -->
      <path d="M-24 -122 Q0 -132 24 -122 L20 -114 L-20 -114 Z" fill="#a0824f"/>
      <!-- pedals -->
      <line x1="0" y1="0" x2="22" y2="18" stroke="#d8bc86" stroke-width="4"/>
      <rect x="18" y="14" width="16" height="6" fill="#d8bc86"/>
      <line x1="0" y1="0" x2="-22" y2="-18" stroke="#d8bc86" stroke-width="4"/>
      <rect x="-34" y="-22" width="16" height="6" fill="#d8bc86"/>
    </g>

    <!-- capybara -->
    <g transform="translate(410 330)">
      <!-- rear leg -->
      <path d="M-30 20 Q-40 80 -10 105 L-2 98 Q-20 70 -12 26 Z" fill="#7a5f3a"/>
      <!-- body -->
      <ellipse cx="0" cy="0" rx="78" ry="48" fill="#a58455"/>
      <ellipse cx="-10" cy="12" rx="60" ry="30" fill="#96774a"/>
      <!-- highlight from moonlight -->
      <ellipse cx="18" cy="-20" rx="40" ry="16" fill="#c9ad7a" opacity="0.45"/>
      <!-- front leg on pedal -->
      <path d="M40 24 Q54 90 32 112 L22 108 Q38 80 26 30 Z" fill="#8c6d42"/>
      <!-- head -->
      <g transform="translate(70 -30) rotate(-8)">
        <ellipse cx="0" cy="0" rx="38" ry="30" fill="#a58455"/>
        <ellipse cx="22" cy="6" rx="24" ry="18" fill="#96774a"/>
        <ellipse cx="34" cy="2" rx="12" ry="9" fill="#b89a68"/>
        <circle cx="38" cy="0" r="3" fill="#2a1d0e"/>
        <circle cx="41" cy="2" r="2" fill="#2a1d0e"/>
        <!-- ear -->
        <ellipse cx="-14" cy="-24" rx="9" ry="12" fill="#8c6d42"/>
        <ellipse cx="-14" cy="-22" rx="5" ry="7" fill="#6b5232"/>
        <!-- determined eye -->
        <ellipse cx="8" cy="-8" rx="7" ry="6" fill="#f3e2b8"/>
        <circle cx="10" cy="-7" r="4" fill="#1a130b"/>
        <circle cx="11.5" cy="-8.5" r="1.5" fill="#fff5dc"/>
        <path d="M0 -17 L16 -13" stroke="#2a1d0e" stroke-width="3" stroke-linecap="round"/>
        <!-- resolute mouth -->
        <path d="M32 12 Q40 14 44 10" fill="none" stroke="#2a1d0e" stroke-width="2"/>
      </g>
      <!-- fore arm reaching forward -->
      <path d="M50 -4 Q86 4 98 -10 L96 -18 Q80 -8 48 -14 Z" fill="#8c6d42"/>
    </g>

    <!-- floating dust in the light -->
    <g fill="#f3e2b8" opacity="0.7">
      <circle cx="500" cy="210" r="2"/>
      <circle cx="540" cy="260" r="1.5"/>
      <circle cx="470" cy="300" r="2"/>
      <circle cx="590" cy="330" r="1.5"/>
      <circle cx="520" cy="380" r="2"/>
      <circle cx="640" cy="400" r="1.5"/>
      <circle cx="380" cy="360" r="1.5"/>
      <circle cx="560" cy="440" r="2"/>
    </g>
  </g>

  <!-- sepia vignette -->
  <rect width="800" height="600" fill="none" stroke="#0e0904" stroke-width="80" opacity="0.5"/>
  <rect width="800" height="600" fill="#5a3f1e" opacity="0.12"/>
</svg>