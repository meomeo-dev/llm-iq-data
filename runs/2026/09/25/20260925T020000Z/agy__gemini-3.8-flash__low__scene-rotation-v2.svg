<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Sepia Color Gradients & Filters -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140e0a" />
      <stop offset="45%" stop-color="#241a12" />
      <stop offset="80%" stop-color="#1a110a" />
      <stop offset="100%" stop-color="#0c0805" />
    </linearGradient>

    <!-- Moonlight Beam Gradients -->
    <linearGradient id="moonBeam1" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f5e8d7" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#dfcaa9" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#af9472" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4a3b2c" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="moonBeam2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#fff6eb" stop-opacity="0.75" />
      <stop offset="25%" stop-color="#edd5b6" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#bfa27e" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#3d2e20" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="moonBeam3" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#eddcc6" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#cbb18f" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#5a4432" stop-opacity="0.0" />
    </linearGradient>

    <!-- Capybara Shading Gradients -->
    <linearGradient id="capyFur" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#d8ba95" />
      <stop offset="25%" stop-color="#b4936d" />
      <stop offset="65%" stop-color="#735438" />
      <stop offset="100%" stop-color="#3d2a1a" />
    </linearGradient>

    <linearGradient id="capyHighlight" x1="10%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ecd6bc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a4825d" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="snoutGrad" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#8a6948" />
      <stop offset="60%" stop-color="#4e3521" />
      <stop offset="100%" stop-color="#2a1a0f" />
    </linearGradient>

    <!-- Unicycle Gradients -->
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2e2cf" />
      <stop offset="35%" stop-color="#8c7358" />
      <stop offset="70%" stop-color="#3b2b1d" />
      <stop offset="100%" stop-color="#a89074" />
    </linearGradient>

    <radialGradient id="tireTread" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#211710" />
      <stop offset="90%" stop-color="#38291c" />
      <stop offset="100%" stop-color="#140d08" />
    </radialGradient>

    <radialGradient id="moonGlow" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#fffbf5" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#ecd8bc" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#ba9c79" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2d2015" stop-opacity="0.0" />
    </radialGradient>

    <!-- Atmosphere Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="mistBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
    <filter id="bokehBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>

    <!-- Vine Cluster -->
    <g id="leafCluster">
      <path d="M0,0 C-10,-5 -14,-18 0,-25 C14,-18 10,-5 0,0 Z" fill="#4d3b2a" />
      <path d="M0,0 C-7,-3 -10,-12 0,-18 C10,-12 7,-3 0,0 Z" fill="#7d6347" opacity="0.7" />
      <path d="M0,0 L0,-22" stroke="#2b1e13" stroke-width="1" />
      <path d="M-8,-10 C-18,-15 -22,-28 -8,-32 C1,-28 -1,-15 -8,-10 Z" fill="#3a2b1c" />
      <path d="M9,-8 C19,-12 24,-24 12,-30 C1,-26 2,-13 9,-8 Z" fill="#5c4530" />
    </g>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- DUTCH-ANGLE WRAPPER: Rotated -8.5° for dynamic diagonal composition -->
  <g id="dutch-angle-scene" transform="rotate(-8.5 500 520) translate(0 -15)">

    <!-- Background Greenhouse Arches & Framework -->
    <g id="greenhouse-background">
      <path d="M -150,-100 L 1150,-100 L 1150,1150 L -150,1150 Z" fill="#17100b" opacity="0.5" />
      <path d="M -50,600 C 50,200 450,-50 950,-20 L 950,900 L -50,900 Z" fill="none" stroke="#2c1f15" stroke-width="14" opacity="0.6" />
      <path d="M 80,700 C 180,300 550,80 1050,100" fill="none" stroke="#251b13" stroke-width="10" opacity="0.5" />
      <path d="M 220,800 C 320,400 680,180 1150,220" fill="none" stroke="#1f150e" stroke-width="8" opacity="0.4" />

      <g stroke="#35261a" stroke-width="4" opacity="0.45">
        <line x1="200" y1="50" x2="100" y2="750" />
        <line x1="380" y1="20" x2="300" y2="780" />
        <line x1="560" y1="0" x2="500" y2="800" />
        <line x1="740" y1="0" x2="700" y2="820" />
        <line x1="920" y1="10" x2="900" y2="850" />
        <path d="M 0,220 Q 500,120 1000,160" fill="none" />
        <path d="M 0,380 Q 500,280 1000,320" fill="none" />
        <path d="M 0,540 Q 500,440 1000,480" fill="none" />
      </g>
    </g>

    <!-- Broken Glass Panes & Glinting Shards -->
    <g id="glass-panes">
      <polygon points="210,60 370,30 360,135 240,150" fill="#9c8466" opacity="0.18" />
      <polygon points="570,8 730,8 715,110 560,110" fill="#c4ad8e" opacity="0.22" />
      <polygon points="40,240 185,210 160,340 30,350" fill="#8f7659" opacity="0.14" />
      <polygon points="380,170 540,150 510,270 360,265" fill="#dec7a6" opacity="0.25" />
      
      <!-- Jagged fragments -->
      <polygon points="200,50 260,52 230,120" fill="#eed9bd" opacity="0.4" stroke="#fff8ee" stroke-width="0.8" />
      <polygon points="380,20 340,90 380,110" fill="#d2bb9c" opacity="0.35" stroke="#eedac0" stroke-width="0.7" />
      <polygon points="560,5 610,75 580,95 555,40" fill="#fff1df" opacity="0.45" stroke="#fffcf7" stroke-width="1" />
      <polygon points="740,0 710,60 745,80" fill="#cbbb9c" opacity="0.3" />
      <polygon points="190,215 240,230 205,310 175,270" fill="#eed8bb" opacity="0.35" stroke="#fff2e0" stroke-width="0.8" />
    </g>

    <!-- Volumetric Moonlight Beams -->
    <g id="moonlight-shafts" style="mix-blend-mode: screen;">
      <polygon points="180,-120 350,-120 720,950 420,950" fill="url(#moonBeam1)" />
      <polygon points="510,-100 680,-100 860,950 580,950" fill="url(#moonBeam2)" />
      <polygon points="-30,-80 120,-80 490,920 280,920" fill="url(#moonBeam3)" />

      <ellipse cx="580" cy="-20" rx="220" ry="120" fill="url(#moonGlow)" filter="url(#softGlow)" />
      <ellipse cx="280" cy="-40" rx="180" ry="90" fill="url(#moonGlow)" filter="url(#mistBlur)" />
    </g>

    <!-- Overgrown Vines & Tendrils -->
    <g id="distant-vines">
      <path d="M-50,80 Q 200,180 350,140 T 700,120 T 1050,200" fill="none" stroke="#21170f" stroke-width="12" />
      <path d="M80,-30 Q 150,150 180,300 T 160,600" fill="none" stroke="#1d130a" stroke-width="8" />
      <path d="M520,-50 Q 550,120 530,280 T 570,550" fill="none" stroke="#2b1d13" stroke-width="6" />
      <path d="M780,-20 Q 750,180 820,380 T 890,700" fill="none" stroke="#1a110a" stroke-width="9" />

      <use href="#leafCluster" x="180" y="240" transform="scale(1.4) rotate(15)" />
      <use href="#leafCluster" x="320" y="160" transform="scale(1.8) rotate(-25)" />
      <use href="#leafCluster" x="530" y="210" transform="scale(1.3) rotate(40)" />
      <use href="#leafCluster" x="720" y="140" transform="scale(1.7) rotate(-10)" />
      <use href="#leafCluster" x="850" y="290" transform="scale(1.5) rotate(35)" />

      <g stroke="#3e2d1d" stroke-width="1.8" opacity="0.75" fill="none">
        <path d="M220,180 C210,260 240,320 225,400 C215,460 230,500 220,560" />
        <path d="M350,150 C370,240 340,330 365,420 C380,480 360,530 370,590" />
        <path d="M740,150 C760,250 735,340 755,440 C770,520 745,580 750,640" />
      </g>
    </g>

    <!-- Cracked Floor & Overgrown Ferns -->
    <g id="greenhouse-floor">
      <path d="M -100,750 L 1100,730 L 1150,1080 L -120,1080 Z" fill="#1b120b" />
      
      <g stroke="#0f0905" stroke-width="5" opacity="0.8">
        <line x1="-50" y1="760" x2="-120" y2="1080" />
        <line x1="120" y1="755" x2="30" y2="1080" />
        <line x1="300" y1="750" x2="220" y2="1080" />
        <line x1="490" y1="745" x2="430" y2="1080" />
        <line x1="680" y1="740" x2="670" y2="1080" />
        <line x1="860" y1="735" x2="890" y2="1080" />
        <line x1="1040" y1="732" x2="1110" y2="1080" />
        <path d="M -80,810 Q 500,800 1120,780" fill="none" />
        <path d="M -100,890 Q 500,875 1130,855" fill="none" />
        <path d="M -110,980 Q 500,965 1140,945" fill="none" />
      </g>

      <ellipse cx="525" cy="855" rx="210" ry="65" fill="#f0deca" opacity="0.22" filter="url(#softGlow)" />
      <ellipse cx="530" cy="855" rx="130" ry="38" fill="#fff5ea" opacity="0.3" filter="url(#softGlow)" />

      <!-- Fern clusters bursting through stone -->
      <g transform="translate(140, 830) scale(1.1)">
        <path d="M0,0 C-30,-30 -40,-80 -10,-120 C-5,-75 0,-30 0,0" fill="#322416" />
        <path d="M0,0 C10,-35 25,-75 60,-100 C40,-65 20,-30 0,0" fill="#4d3925" />
        <path d="M0,0 C-15,-40 -10,-95 20,-135 C15,-85 8,-40 0,0" fill="#694f35" />
      </g>
      <g transform="translate(770, 810) scale(1.2)">
        <path d="M0,0 C30,-35 45,-80 20,-130 C10,-80 5,-35 0,0" fill="#38291a" />
        <path d="M0,0 C-15,-40 -35,-85 -70,-110 C-45,-75 -20,-35 0,0" fill="#523d29" />
        <path d="M0,0 C10,-45 5,-105 -25,-145 C-15,-95 -5,-45 0,0" fill="#75583c" />
      </g>
    </g>

    <!-- The Unicycle -->
    <g id="unicycle">
      <ellipse cx="565" cy="860" rx="80" ry="22" fill="#0d0805" opacity="0.8" filter="url(#softGlow)" />
      
      <!-- Tire & Rim -->
      <circle cx="515" cy="740" r="115" fill="none" stroke="url(#tireTread)" stroke-width="22" />
      <circle cx="515" cy="740" r="124" fill="none" stroke="#100b07" stroke-dasharray="3 7" stroke-width="4" />
      <circle cx="515" cy="740" r="103" fill="none" stroke="url(#metalRim)" stroke-width="7" />

      <!-- Spokes -->
      <g stroke="#eedcc8" stroke-width="1.6" opacity="0.75">
        <line x1="515" y1="740" x2="515" y2="640" />
        <line x1="515" y1="740" x2="515" y2="840" />
        <line x1="515" y1="740" x2="415" y2="740" />
        <line x1="515" y1="740" x2="615" y2="740" />
        <line x1="515" y1="740" x2="444" y2="669" />
        <line x1="515" y1="740" x2="586" y2="811" />
        <line x1="515" y1="740" x2="444" y2="811" />
        <line x1="515" y1="740" x2="586" y2="669" />
        <line x1="510" y1="735" x2="476" y2="646" stroke="#bda282" />
        <line x1="520" y1="735" x2="554" y2="646" stroke="#bda282" />
        <line x1="520" y1="745" x2="554" y2="834" stroke="#bda282" />
        <line x1="510" y1="745" x2="476" y2="834" stroke="#bda282" />
      </g>

      <circle cx="515" cy="740" r="16" fill="url(#metalRim)" stroke="#22170f" stroke-width="2" />
      <circle cx="515" cy="740" r="7" fill="#f7ead8" />

      <!-- Cranks and Pedals -->
      <line x1="515" y1="740" x2="475" y2="785" stroke="#332418" stroke-width="9" stroke-linecap="round" />
      <rect x="455" y="780" width="36" height="12" rx="4" transform="rotate(-10 473 786)" fill="#2b1f16" stroke="#c0a587" stroke-width="1.5" />

      <line x1="515" y1="740" x2="560" y2="690" stroke="#1d130a" stroke-width="10" stroke-linecap="round" />
      <line x1="515" y1="740" x2="560" y2="690" stroke="#c9b093" stroke-width="6" stroke-linecap="round" />
      <rect x="545" y="680" width="38" height="14" rx="4" transform="rotate(-15 564 687)" fill="#443222" stroke="#faecdc" stroke-width="2" />

      <!-- Fork & Seatpost -->
      <path d="M 508,735 L 512,545" stroke="#483626" stroke-width="7" stroke-linecap="round" />
      <path d="M 522,735 L 518,545" stroke="#94795d" stroke-width="7" stroke-linecap="round" />
      <path d="M 521,732 L 518,545" stroke="#f6e8d6" stroke-width="2.5" stroke-linecap="round" />
      <line x1="515" y1="535" x2="515" y2="475" stroke="#7a624a" stroke-width="10" />
      <line x1="517" y1="535" x2="517" y2="475" stroke="#fff4e4" stroke-width="2.5" />

      <!-- Saddle -->
      <path d="M 445,465 C 475,480 550,478 585,450 C 592,456 580,474 555,483 C 525,494 480,492 445,476 Z" fill="#352417" stroke="#735539" stroke-width="2" />
      <path d="M 448,464 C 475,476 545,474 582,448 C 575,455 540,467 512,467 C 480,467 458,458 448,464 Z" fill="#c7ad8f" opacity="0.65" />
    </g>

    <!-- The Capybara -->
    <g id="capybara-rider">
      <!-- Left leg -->
      <g id="left-leg">
        <path d="M 490,440 C 460,460 445,510 465,560 C 475,580 495,600 500,620 Z" fill="#4d3725" />
        <path d="M 495,610 L 465,770 L 490,782 L 510,765 L 505,620 Z" fill="#3d2a1b" />
        <ellipse cx="468" cy="780" rx="9" ry="5" fill="#2a1c11" stroke="#5d432d" stroke-width="1" />
      </g>

      <!-- Barrel Body -->
      <g id="torso">
        <path d="M 460,460 C 440,430 445,340 475,290 C 510,240 575,245 615,290 C 650,335 655,410 635,465 C 610,500 540,510 495,495 Z" fill="url(#capyFur)" />
        <path d="M 470,455 C 455,420 460,350 480,310 C 490,360 485,430 515,480 Z" fill="#2c1d12" opacity="0.65" />
        <path d="M 545,280 C 585,305 635,360 625,430 C 605,440 575,370 545,330 Z" fill="url(#capyHighlight)" opacity="0.7" />
      </g>

      <!-- Right Leg (Foreground on high pedal) -->
      <g id="right-leg">
        <path d="M 525,430 C 510,470 515,530 550,565 C 575,590 600,610 590,640 C 575,610 555,595 540,560 Z" fill="#755639" />
        <path d="M 550,565 C 575,595 590,625 580,660 L 550,685 L 535,660 Z" fill="#8f6b49" />
        <path d="M 548,560 C 570,590 582,620 575,655" fill="none" stroke="#fff1de" stroke-width="3.5" stroke-linecap="round" />
        <ellipse cx="563" cy="689" rx="6.5" ry="4" fill="#b99978" />
        <ellipse cx="574" cy="691" rx="6" ry="4" fill="#d8bc9d" />
      </g>

      <!-- Head & Soulful Resolute Expression -->
      <g id="head" transform="rotate(-6 570 230)">
        <path d="M 525,280 C 505,245 525,185 555,165 C 595,140 680,150 715,190 C 735,212 745,245 735,275 C 725,295 700,310 655,310 Z" fill="url(#capyFur)" />
        <path d="M 650,185 C 685,190 735,205 738,245 C 740,270 725,290 690,295 C 655,298 635,295 625,275 Z" fill="url(#snoutGrad)" />
        
        <!-- Nostril & Breath -->
        <ellipse cx="722" cy="245" rx="6.5" ry="4.5" transform="rotate(-15 722 245)" fill="#150c07" />
        <path d="M 735,245 C 760,240 775,225 795,228 C 775,236 760,248 738,252 Z" fill="#ebd7bf" opacity="0.3" filter="url(#softGlow)" />

        <!-- Resolute mouth -->
        <path d="M 732,265 C 715,272 685,273 665,268" fill="none" stroke="#1f140c" stroke-width="3" stroke-linecap="round" />

        <!-- Ear with Moonlight Edge -->
        <path d="M 535,185 C 525,160 545,140 560,152 C 570,162 565,185 550,192 Z" fill="#422e1e" stroke="#22170f" stroke-width="2" />
        <path d="M 532,175 C 532,155 548,143 562,154" fill="none" stroke="#fff4e5" stroke-width="2.5" stroke-linecap="round" />

        <!-- Hopeful Eye with Star-Like Moon Catchlights -->
        <ellipse cx="633" cy="204" rx="13" ry="9.5" transform="rotate(8 633 204)" fill="#120b07" stroke="#3d2b1c" stroke-width="2" />
        <ellipse cx="634" cy="203" rx="8" ry="6.5" fill="#5a3d25" />
        <ellipse cx="635" cy="203" rx="5" ry="5" fill="#0d0704" />
        <circle cx="637" cy="200" r="3.2" fill="#ffffff" />
        <circle cx="642" cy="203" r="1.5" fill="#f8ece0" />
        <path d="M 619,200 C 628,194 641,195 649,202" fill="none" stroke="#ecd7be" stroke-width="2" stroke-linecap="round" />

        <!-- Fine Whiskers -->
        <g stroke="#f5e8d6" stroke-width="1.2" opacity="0.75" fill="none">
          <path d="M 705,255 C 725,255 750,250 770,240" />
          <path d="M 710,260 C 735,263 760,260 780,255" />
          <path d="M 705,265 C 730,272 755,275 775,275" />
        </g>

        <!-- Strong Moonlight Rim Light on Snout and Crown -->
        <path d="M 558,155 C 595,140 675,148 715,190 C 735,212 743,240 738,260" fill="none" stroke="#fffaf2" stroke-width="4.5" stroke-linecap="round" filter="url(#softGlow)" />
        <path d="M 560,157 C 595,142 675,150 713,190 C 732,212 740,240 735,258" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Gracefully Balanced Arms -->
      <g id="right-arm">
        <path d="M 570,330 C 600,350 635,375 660,395 C 655,408 640,418 620,405 C 595,385 570,365 555,345 Z" fill="#886646" />
        <path d="M 625,400 C 648,412 675,420 700,415 C 705,425 695,435 675,435 C 650,435 630,420 615,405 Z" fill="#ad8c69" />
        <ellipse cx="712" cy="425" rx="5" ry="3.5" transform="rotate(25 712 425)" fill="#eedbc6" />
        <ellipse cx="720" cy="431" rx="4.5" ry="3" transform="rotate(15 720 431)" fill="#fff5ea" />
        <path d="M 570,330 C 605,355 645,385 698,414" fill="none" stroke="#fff8ee" stroke-width="3.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- Foreground Leaves, Vines & Framing Vignette -->
    <g id="foreground-overgrowth">
      <path d="M-80,-60 Q 250,50 600,-40 Q 900,-100 1100,-40" fill="none" stroke="#120c07" stroke-width="32" />
      <g transform="translate(40, 20) scale(1.6) rotate(35)">
        <path d="M0,0 C30,-30 90,-40 140,-10 C160,20 130,70 80,80 Z" fill="#1b120a" stroke="#0e0804" stroke-width="2" />
        <ellipse cx="70" cy="15" rx="14" ry="4" transform="rotate(-20 70 15)" fill="#251a11" />
      </g>
      <g transform="translate(-40, 950) scale(1.8) rotate(-15)">
        <path d="M0,0 C40,-50 90,-90 160,-120 C110,-70 60,-30 0,0" fill="#0d0805" />
      </g>
    </g>

    <!-- Floating Dust Motes & Spores in the Light Beam -->
    <g id="spores-and-motes">
      <circle cx="560" cy="180" r="3.5" fill="#fff7ed" opacity="0.8" filter="url(#softGlow)" />
      <circle cx="610" cy="150" r="2" fill="#fff9f0" opacity="0.9" />
      <circle cx="640" cy="290" r="3" fill="#fff5e8" opacity="0.85" filter="url(#softGlow)" />
      <circle cx="580" cy="520" r="3.5" fill="#fffaee" opacity="0.9" filter="url(#softGlow)" />
      <circle cx="490" cy="640" r="3.2" fill="#fff6ea" opacity="0.85" />
      <circle cx="600" cy="730" r="3" fill="#fff5e8" opacity="0.8" filter="url(#softGlow)" />
      <circle cx="470" cy="830" r="3" fill="#fff5ea" opacity="0.8" />
      
      <!-- Out of focus bokeh -->
      <circle cx="380" cy="280" r="12" fill="#edd6bc" opacity="0.18" filter="url(#bokehBlur)" />
      <circle cx="690" cy="220" r="16" fill="#fcf0e1" opacity="0.22" filter="url(#bokehBlur)" />
      <circle cx="630" cy="480" r="18" fill="#fff4e6" opacity="0.2" filter="url(#bokehBlur)" />
    </g>
  </g>

  <!-- Final Antique Sepia Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="45%" stop-color="#000000" stop-opacity="0" />
    <stop offset="85%" stop-color="#120c07" stop-opacity="0.55" />
    <stop offset="100%" stop-color="#080402" stop-opacity="0.88" />
  </radialGradient>
  <rect width="1000" height="1000" fill="url(#vignette)" pointer-events="none" />
</svg>