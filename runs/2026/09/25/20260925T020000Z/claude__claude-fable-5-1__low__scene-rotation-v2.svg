<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f14"/>
      <stop offset="1" stop-color="#4a3826"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2c1c"/>
      <stop offset="1" stop-color="#1d150c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e2c0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f1e2c0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.7" stop-color="#f0dcb0"/>
      <stop offset="1" stop-color="#f0dcb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8865a"/>
      <stop offset="1" stop-color="#5c4328"/>
    </linearGradient>
  </defs>

  <!-- background outside of tilt so nothing shows through -->
  <rect width="800" height="600" fill="#1d150c"/>

  <!-- Dutch angle: whole scene rotated -->
  <g transform="rotate(-12 400 300) scale(1.3) translate(-92 -69)">
    <rect x="-100" y="-100" width="1000" height="420" fill="url(#sky)"/>
    <rect x="-100" y="320" width="1000" height="400" fill="url(#floor)"/>

    <!-- moon -->
    <circle cx="560" cy="70" r="46" fill="url(#moon)"/>
    <circle cx="560" cy="70" r="30" fill="#fff3d6"/>

    <!-- back wall of glass panes -->
    <g stroke="#7a6142" stroke-width="3" fill="#5a4630" fill-opacity="0.35">
      <rect x="80" y="60" width="90" height="70"/>
      <rect x="180" y="60" width="90" height="70"/>
      <rect x="280" y="60" width="90" height="70"/>
      <rect x="380" y="60" width="90" height="70"/>
      <rect x="480" y="60" width="90" height="70"/>
      <rect x="580" y="60" width="90" height="70"/>
      <rect x="80" y="140" width="90" height="70"/>
      <rect x="180" y="140" width="90" height="70"/>
      <rect x="280" y="140" width="90" height="70"/>
      <rect x="380" y="140" width="90" height="70"/>
      <rect x="480" y="140" width="90" height="70"/>
      <rect x="580" y="140" width="90" height="70"/>
      <rect x="80" y="220" width="90" height="100"/>
      <rect x="180" y="220" width="90" height="100"/>
      <rect x="280" y="220" width="90" height="100"/>
      <rect x="380" y="220" width="90" height="100"/>
      <rect x="480" y="220" width="90" height="100"/>
      <rect x="580" y="220" width="90" height="100"/>
    </g>
    <!-- broken panes: jagged holes revealing lighter sky -->
    <g fill="#c9b389" fill-opacity="0.5" stroke="#e8d7b0" stroke-width="1.5">
      <polygon points="500,62 560,66 566,100 540,128 512,120 486,96"/>
      <polygon points="392,142 450,146 462,190 430,208 400,196 384,170"/>
      <polygon points="600,144 660,150 664,200 630,206 604,190"/>
      <polygon points="192,224 250,230 258,280 230,300 200,290 186,256"/>
    </g>
    <!-- cracks -->
    <g stroke="#e8d7b0" stroke-width="1" fill="none" opacity="0.8">
      <path d="M520 100 L470 130 L440 125"/>
      <path d="M540 128 L560 160 L556 190"/>
      <path d="M430 208 L410 250 L420 300"/>
      <path d="M300 160 L330 190 L315 215 M310 190 L340 200"/>
    </g>

    <!-- roof beams -->
    <g stroke="#6b5438" stroke-width="5" fill="none">
      <path d="M-40 60 L820 60"/>
      <path d="M-40 -20 L380 -70 L820 -20"/>
      <path d="M120 60 L120 -40 M280 60 L280 -60 M460 60 L460 -60 M640 60 L640 -40"/>
    </g>

    <!-- moonbeams through broken panes -->
    <g fill="url(#beam)">
      <polygon points="486,96 566,100 700,560 430,560"/>
      <polygon points="384,170 462,190 560,560 300,560"/>
      <polygon points="600,150 664,200 820,520 700,560"/>
    </g>

    <!-- floor tiles / cracks -->
    <g stroke="#2a1f12" stroke-width="2" fill="none" opacity="0.7">
      <path d="M-100 380 L900 380 M-100 440 L900 440 M-100 510 L900 510"/>
      <path d="M100 320 L-20 600 M300 320 L260 600 M500 320 L540 600 M700 320 L820 600"/>
    </g>
    <!-- light pool on floor -->
    <ellipse cx="520" cy="470" rx="230" ry="60" fill="#e9d6ac" opacity="0.18"/>

    <!-- vines -->
    <g stroke="#3f3120" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M-20 -20 C60 80, 20 180, 90 260 S60 380, 120 460"/>
      <path d="M120 -60 C160 40, 110 120, 170 200"/>
      <path d="M820 -30 C740 60, 780 160, 700 240 S760 360, 690 440"/>
      <path d="M640 -40 C600 60, 660 120, 620 200"/>
      <path d="M380 -70 C400 20, 340 60, 360 140"/>
    </g>
    <g stroke="#2e2416" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M40 60 C80 100, 60 160, 110 200"/>
      <path d="M740 80 C700 130, 740 180, 700 220"/>
      <path d="M-40 200 C40 240, 20 320, 80 340"/>
      <path d="M820 200 C760 240, 800 330, 740 360"/>
    </g>
    <!-- leaves -->
    <g fill="#4d3c25">
      <ellipse cx="60" cy="90" rx="14" ry="7" transform="rotate(-30 60 90)"/>
      <ellipse cx="30" cy="150" rx="14" ry="7" transform="rotate(20 30 150)"/>
      <ellipse cx="90" cy="240" rx="14" ry="7" transform="rotate(-40 90 240)"/>
      <ellipse cx="110" cy="360" rx="14" ry="7" transform="rotate(30 110 360)"/>
      <ellipse cx="160" cy="120" rx="12" ry="6" transform="rotate(-20 160 120)"/>
      <ellipse cx="750" cy="100" rx="14" ry="7" transform="rotate(40 750 100)"/>
      <ellipse cx="720" cy="200" rx="14" ry="7" transform="rotate(-30 720 200)"/>
      <ellipse cx="700" cy="330" rx="14" ry="7" transform="rotate(20 700 330)"/>
      <ellipse cx="640" cy="150" rx="12" ry="6" transform="rotate(50 640 150)"/>
      <ellipse cx="350" cy="60" rx="12" ry="6" transform="rotate(-50 350 60)"/>
      <ellipse cx="770" cy="380" rx="14" ry="7" transform="rotate(-10 770 380)"/>
    </g>
    <!-- fallen pots -->
    <g fill="#3a2b19" stroke="#2a1f12" stroke-width="2">
      <path d="M40 470 l60 -6 l-8 40 l-44 4 z"/>
      <path d="M690 500 l50 10 l-6 30 l-40 -8 z"/>
    </g>

    <!-- CAPYBARA ON UNICYCLE -->
    <g transform="translate(400 300)">
      <!-- wheel -->
      <circle cx="0" cy="150" r="46" fill="none" stroke="#2a1f12" stroke-width="10"/>
      <circle cx="0" cy="150" r="46" fill="none" stroke="#8a6d47" stroke-width="4"/>
      <g stroke="#8a6d47" stroke-width="3">
        <line x1="0" y1="104" x2="0" y2="196"/>
        <line x1="-46" y1="150" x2="46" y2="150"/>
        <line x1="-33" y1="117" x2="33" y2="183"/>
        <line x1="33" y1="117" x2="-33" y2="183"/>
      </g>
      <circle cx="0" cy="150" r="7" fill="#6b5438"/>
      <!-- pedals -->
      <line x1="0" y1="150" x2="22" y2="128" stroke="#8a6d47" stroke-width="4"/>
      <line x1="0" y1="150" x2="-22" y2="172" stroke="#8a6d47" stroke-width="4"/>
      <rect x="18" y="122" width="16" height="7" rx="2" fill="#4a3826"/>
      <rect x="-34" y="169" width="16" height="7" rx="2" fill="#4a3826"/>
      <!-- fork + seat post -->
      <path d="M-12 150 L-6 70 M12 150 L6 70" stroke="#8a6d47" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="72" x2="0" y2="40" stroke="#8a6d47" stroke-width="6"/>
      <ellipse cx="0" cy="38" rx="20" ry="7" fill="#3a2b19"/>

      <!-- back leg (behind body) -->
      <path d="M-20 20 L-26 100 L-30 168" stroke="#5c4328" stroke-width="12" stroke-linecap="round" fill="none"/>
      <!-- body -->
      <ellipse cx="-2" cy="-10" rx="58" ry="44" fill="url(#fur)" stroke="#2a1f12" stroke-width="3"/>
      <!-- fur texture -->
      <g stroke="#7a5f3c" stroke-width="2" opacity="0.6" fill="none">
        <path d="M-40 -20 l6 8 M-28 -35 l6 8 M-14 -44 l5 8 M-30 5 l6 8 M-14 15 l6 8 M10 -40 l5 8 M26 -20 l6 8 M6 10 l6 8"/>
      </g>
      <!-- front leg -->
      <path d="M14 22 L18 80 L22 126" stroke="#8a6b44" stroke-width="12" stroke-linecap="round" fill="none"/>
      <!-- arms out for balance -->
      <path d="M-40 -18 L-90 -48" stroke="#8a6b44" stroke-width="10" stroke-linecap="round"/>
      <path d="M40 -12 L86 -46" stroke="#8a6b44" stroke-width="10" stroke-linecap="round"/>
      <!-- head, leaning forward -->
      <g transform="translate(46 -46) rotate(8)">
        <path d="M-30 -20 C-20 -40, 30 -42, 44 -18 C52 -4, 46 20, 26 26 C0 32, -30 26, -34 4 Z" fill="url(#fur)" stroke="#2a1f12" stroke-width="3"/>
        <!-- ears -->
        <ellipse cx="-16" cy="-30" rx="8" ry="10" fill="#7a5f3c" stroke="#2a1f12" stroke-width="2"/>
        <ellipse cx="8" cy="-34" rx="8" ry="10" fill="#7a5f3c" stroke="#2a1f12" stroke-width="2"/>
        <!-- eye: determined -->
        <ellipse cx="14" cy="-8" rx="5" ry="4" fill="#1d150c"/>
        <circle cx="15.5" cy="-9.5" r="1.4" fill="#fff3d6"/>
        <path d="M6 -16 L22 -12" stroke="#2a1f12" stroke-width="3" stroke-linecap="round"/>
        <!-- nose & mouth -->
        <ellipse cx="42" cy="-6" rx="7" ry="5" fill="#3a2b19"/>
        <path d="M30 12 q8 4 14 -2" stroke="#2a1f12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      <!-- highlight rim from moonlight -->
      <path d="M-30 -48 C0 -60, 34 -56, 54 -40" stroke="#f1e2c0" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
      <path d="M30 -58 C60 -70, 90 -68, 98 -56" stroke="#f1e2c0" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"/>
      <!-- ground shadow -->
      <ellipse cx="-10" cy="200" rx="60" ry="10" fill="#0e0a05" opacity="0.5"/>
    </g>

    <!-- dust motes in the beams -->
    <g fill="#f7ead0" opacity="0.7">
      <circle cx="470" cy="220" r="1.5"/><circle cx="520" cy="300" r="1.2"/>
      <circle cx="560" cy="180" r="1.6"/><circle cx="600" cy="340" r="1.3"/>
      <circle cx="500" cy="400" r="1.4"/><circle cx="440" cy="330" r="1.1"/>
      <circle cx="640" cy="260" r="1.5"/><circle cx="580" cy="440" r="1.2"/>
      <circle cx="530" cy="130" r="1.3"/><circle cx="660" cy="420" r="1.4"/>
    </g>
  </g>

  <!-- sepia tint and vignette -->
  <rect width="800" height="600" fill="#6b4f2a" opacity="0.18"/>
  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>