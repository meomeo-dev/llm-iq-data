<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Capybara riding a unicycle in a moonlit abandoned greenhouse</title>
  <defs>
    <radialGradient id="sky" cx="245" cy="135" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a6a46"/>
      <stop offset="0.3" stop-color="#3f2d1b"/>
      <stop offset="1" stop-color="#110a05"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fbf0da" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbf0da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fbf0da" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fbf0da" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1f12"/>
      <stop offset="1" stop-color="#0f0904"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfa979"/>
      <stop offset="0.5" stop-color="#8a6844"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="furHead" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e0c091"/>
      <stop offset="1" stop-color="#76573a"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="0.55" stop-color="#0b0703" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0703" stop-opacity="0.9"/>
    </radialGradient>
    <pattern id="brick" width="40" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 13.5 H40 M0 7 H40 M20 0 V7 M0 7 V14 M40 7 V14" stroke="#120b06" stroke-width="1.2" fill="none"/>
    </pattern>
    <clipPath id="houseClip">
      <path d="M-200 270 L-60 270 Q400 -220 860 270 L1000 270 L1000 380 L-200 380 Z"/>
    </clipPath>
    <clipPath id="floorClip">
      <rect x="-200" y="420" width="1200" height="520"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.32  0 0 0 0 0.23  0 0 0 0 0.13  0.35 0 0 0 -0.1"/>
    </filter>
    <path id="leaf" d="M0 0 C5 -7 14 -7 20 0 C14 7 5 7 0 0 Z"/>
    <g id="frameLines">
      <path d="M-100 -200 V380 M0 -200 V380 M100 -200 V380 M200 -200 V380 M300 -200 V380
               M400 -200 V380 M500 -200 V380 M600 -200 V380 M700 -200 V380 M800 -200 V380
               M900 -200 V380 M-200 180 H1000 M-200 270 H1000"/>
    </g>
  </defs>

  <g transform="rotate(-9 400 300)">
    <!-- 夜空与月亮 -->
    <rect x="-200" y="-200" width="1200" height="1120" fill="url(#sky)"/>
    <circle cx="245" cy="135" r="120" fill="url(#moonGlow)"/>
    <circle cx="245" cy="135" r="34" fill="#f6e8cc"/>
    <circle cx="234" cy="126" r="7" fill="#e2cfa8" opacity="0.7"/>
    <circle cx="256" cy="146" r="5" fill="#e2cfa8" opacity="0.6"/>
    <circle cx="250" cy="120" r="3" fill="#e2cfa8" opacity="0.6"/>

    <!-- 脏污玻璃（偶奇规则挖出破洞） -->
    <g clip-path="url(#houseClip)">
      <path fill="#2b1d11" fill-opacity="0.74" fill-rule="evenodd" d="
        M-200 -200 H1000 V380 H-200 Z
        M204 178 L210 150 L203 122 L218 100 L240 96 L262 84 L290 98 L296 128 L292 160 L298 178 L270 172 L252 180 L232 172 Z
        M306 184 L340 184 L352 200 L334 222 L360 240 L318 262 L312 230 Z
        M104 274 L196 274 L190 300 L160 292 L150 330 L128 310 L104 340 Z
        M504 184 L596 184 L596 214 L570 204 L556 240 L534 212 L504 230 Z
        M604 376 L620 330 L650 290 L672 318 L696 300 L696 376 Z"/>
      <g fill="none" stroke="#efdcb8" stroke-width="1.2" opacity="0.55">
        <path d="M204 178 L210 150 L203 122 L218 100 L240 96 L262 84 L290 98 L296 128 L292 160 L298 178 L270 172 L252 180 L232 172 Z"/>
        <path d="M306 184 L340 184 L352 200 L334 222 L360 240 L318 262 L312 230 Z"/>
        <path d="M104 274 L196 274 L190 300 L160 292 L150 330 L128 310 L104 340 Z"/>
        <path d="M504 184 L596 184 L596 214 L570 204 L556 240 L534 212 L504 230 Z"/>
        <path d="M604 376 L620 330 L650 290 L672 318 L696 300 L696 376 Z"/>
      </g>
      <use href="#frameLines" stroke="#150d07" stroke-width="7" fill="none"/>
      <use href="#frameLines" stroke="#7a5a3a" stroke-width="1.2" fill="none" opacity="0.6" transform="translate(-3 -2)"/>
    </g>

    <!-- 拱顶外的暗部与拱肋 -->
    <path d="M-200 -200 L1000 -200 L1000 270 L860 270 Q400 -220 -60 270 L-200 270 Z" fill="#100a05"/>
    <path d="M-60 270 Q400 -220 860 270" fill="none" stroke="#1a110a" stroke-width="12"/>
    <path d="M-60 270 Q400 -220 860 270" fill="none" stroke="#8a6a46" stroke-width="1.5" opacity="0.6" transform="translate(-2 4)"/>

    <!-- 矮墙 -->
    <rect x="-200" y="380" width="1200" height="40" fill="#22170d"/>
    <rect x="-200" y="380" width="1200" height="40" fill="url(#brick)" opacity="0.8"/>
    <rect x="-200" y="376" width="1200" height="6" fill="#3d2a19"/>

    <!-- 地面 -->
    <rect x="-200" y="420" width="1200" height="520" fill="url(#floorGrad)"/>
    <g clip-path="url(#floorClip)" stroke="#0c0703" stroke-width="1.5" opacity="0.85" fill="none">
      <path d="M400 300 L-560 940 M400 300 L-320 940 M400 300 L-80 940 M400 300 L160 940
               M400 300 L400 940 M400 300 L640 940 M400 300 L880 940 M400 300 L1120 940 M400 300 L1360 940"/>
      <path d="M-200 434 H1000 M-200 452 H1000 M-200 478 H1000 M-200 514 H1000
               M-200 562 H1000 M-200 628 H1000 M-200 715 H1000"/>
      <path d="M240 520 L262 540 L255 560 L280 585" stroke="#070402"/>
      <path d="M600 600 L620 588 L648 596 L668 580" stroke="#070402"/>
    </g>

    <!-- 月光光束 -->
    <g filter="url(#soft)">
      <path d="M206 150 L292 100 L700 640 L450 650 Z" fill="url(#beam)"/>
      <path d="M104 330 L196 276 L470 660 L290 660 Z" fill="url(#beam)" opacity="0.7"/>
      <path d="M506 196 L594 190 L840 600 L720 620 Z" fill="url(#beam)" opacity="0.55"/>
      <path d="M308 190 L350 204 L520 640 L430 645 Z" fill="url(#beam)" opacity="0.45"/>
    </g>
    <ellipse cx="480" cy="592" rx="175" ry="34" fill="#f3e3c3" opacity="0.16" filter="url(#soft)"/>
    <ellipse cx="350" cy="580" rx="95" ry="20" fill="#f3e3c3" opacity="0.13" filter="url(#soft)"/>

    <!-- 墙面藤蔓 -->
    <g fill="none" stroke="#24180d" stroke-width="4" stroke-linecap="round">
      <path d="M90 420 C110 380 80 340 102 300 C120 262 86 230 104 190 C118 160 96 120 120 90 C140 66 170 70 190 58"/>
      <path d="M560 45 C548 90 575 120 560 160 C548 195 572 225 562 260 C556 280 566 300 560 318 C556 330 566 336 572 328"/>
      <path d="M600 420 C640 395 690 410 720 385 C750 360 790 380 830 350"/>
      <path d="M340 40 C352 80 330 110 344 150 C352 172 340 190 346 206 C348 214 356 214 356 206"/>
      <path d="M-40 200 C20 150 60 170 100 130"/>
      <path d="M-20 420 C10 400 30 410 60 390"/>
    </g>
    <g fill="#2e2013">
      <use href="#leaf" transform="translate(98 398) rotate(-30)"/>
      <use href="#leaf" transform="translate(92 360) rotate(200)"/>
      <use href="#leaf" transform="translate(104 318) rotate(-40)"/>
      <use href="#leaf" transform="translate(100 280) rotate(170)"/>
      <use href="#leaf" transform="translate(96 236) rotate(-20)"/>
      <use href="#leaf" transform="translate(108 196) rotate(190)"/>
      <use href="#leaf" transform="translate(112 140) rotate(-50)"/>
      <use href="#leaf" transform="translate(150 70) rotate(-80)"/>
      <use href="#leaf" transform="translate(560 90) rotate(160)"/>
      <use href="#leaf" transform="translate(566 130) rotate(10)"/>
      <use href="#leaf" transform="translate(556 180) rotate(200)"/>
      <use href="#leaf" transform="translate(566 230) rotate(20)"/>
      <use href="#leaf" transform="translate(560 280) rotate(170)"/>
      <use href="#leaf" transform="translate(344 90) rotate(20)"/>
      <use href="#leaf" transform="translate(340 140) rotate(190)"/>
      <use href="#leaf" transform="translate(346 186) rotate(-10)"/>
      <use href="#leaf" transform="translate(660 402) rotate(-120)"/>
      <use href="#leaf" transform="translate(720 386) rotate(-60)"/>
      <use href="#leaf" transform="translate(780 372) rotate(-130)"/>
      <use href="#leaf" transform="translate(30 168) rotate(-70)"/>
      <use href="#leaf" transform="translate(20 404) rotate(-60)"/>
    </g>
    <g fill="#8a6a46" opacity="0.8">
      <use href="#leaf" transform="translate(206 150) rotate(-60) scale(0.8)"/>
      <use href="#leaf" transform="translate(300 180) rotate(40) scale(0.7)"/>
      <use href="#leaf" transform="translate(112 290) rotate(-150) scale(0.8)"/>
      <use href="#leaf" transform="translate(548 200) rotate(120) scale(0.7)"/>
    </g>

    <!-- 工作台与花盆 -->
    <g>
      <rect x="610" y="448" width="240" height="10" fill="#24180d"/>
      <rect x="610" y="447" width="240" height="2" fill="#9a7650" opacity="0.7"/>
      <rect x="624" y="458" width="9" height="84" fill="#1a110a"/>
      <rect x="800" y="458" width="9" height="84" fill="#1a110a"/>
      <path d="M640 420 L684 420 L678 448 L646 448 Z" fill="#3a2818"/>
      <rect x="637" y="416" width="50" height="7" fill="#4a3320"/>
      <path d="M662 416 C660 390 646 376 632 372 M664 416 C670 396 686 388 700 392" stroke="#2a1c10" stroke-width="2" fill="none"/>
      <path d="M704 430 L732 430 L728 448 L708 448 Z" fill="#33231a"/>
      <rect x="702" y="427" width="32" height="5" fill="#4a3320"/>
      <path d="M760 436 L800 424 L806 444 L768 448 Z" fill="#2e1f12"/>
    </g>

    <!-- 倾倒的花盆 -->
    <g transform="translate(170 588) rotate(-72)">
      <path d="M-22 -30 L22 -30 L16 20 L-16 20 Z" fill="#3e2b1a"/>
      <rect x="-25" y="-36" width="50" height="8" fill="#5a4028"/>
      <path d="M-22 -30 L-16 20" stroke="#9a7650" stroke-width="1.2" opacity="0.6"/>
    </g>
    <ellipse cx="214" cy="602" rx="34" ry="8" fill="#1a110a"/>
    <path d="M232 604 L246 596 L252 606 Z M258 612 L270 606 L268 616 Z" fill="#4a3320"/>

    <!-- 地面碎玻璃 -->
    <g fill="#efdcb8">
      <path d="M270 606 L284 598 L280 610 Z" opacity="0.75"/>
      <path d="M560 598 L574 594 L566 604 Z" opacity="0.6"/>
      <path d="M640 620 L660 612 L652 626 Z" opacity="0.7"/>
      <path d="M190 520 L200 514 L198 524 Z" opacity="0.5"/>
      <path d="M380 612 L392 606 L390 616 Z" opacity="0.6"/>
    </g>

    <!-- 投影 -->
    <ellipse cx="505" cy="572" rx="95" ry="10" fill="#070402" opacity="0.7"/>

    <!-- 独轮车与卡皮巴拉 -->
    <g>
      <!-- 远侧后腿与踏板 -->
      <path d="M455 435 C450 460 432 482 420 500" stroke="#3a2818" stroke-width="16" stroke-linecap="round" fill="none"/>
      <line x1="440" y1="520" x2="418" y2="502" stroke="#1a110a" stroke-width="5" stroke-linecap="round"/>
      <rect x="406" y="498" width="22" height="6" rx="2" fill="#1a110a"/>
      <ellipse cx="416" cy="500" rx="11" ry="6" fill="#2e1f12"/>

      <!-- 车轮 -->
      <circle cx="440" cy="520" r="48" fill="none" stroke="#120b06" stroke-width="8"/>
      <circle cx="440" cy="520" r="42" fill="none" stroke="#6e4f33" stroke-width="2"/>
      <g stroke="#6e4f33" stroke-width="1.3">
        <line x1="440" y1="478" x2="440" y2="562"/>
        <line x1="398" y1="520" x2="482" y2="520"/>
        <line x1="410" y1="490" x2="470" y2="550"/>
        <line x1="470" y1="490" x2="410" y2="550"/>
      </g>
      <path d="M399 496 A48 48 0 0 1 440 472" fill="none" stroke="#efdcb8" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="440" cy="520" r="6" fill="#2a1c10" stroke="#9a7650" stroke-width="1.5"/>

      <!-- 车叉与座椅 -->
      <line x1="440" y1="520" x2="447" y2="440" stroke="#1f150c" stroke-width="7" stroke-linecap="round"/>
      <line x1="437" y1="515" x2="444" y2="444" stroke="#c6a47a" stroke-width="1.3" opacity="0.8"/>
      <ellipse cx="449" cy="438" rx="25" ry="6" fill="#1a110a"/>

      <!-- 身体 -->
      <path d="M395 400 C385 360 410 330 460 328 C510 326 542 350 542 386 C542 420 515 442 470 444 C425 446 402 430 395 400 Z" fill="url(#fur)"/>
      <g stroke="#3a2818" stroke-width="1.3" fill="none" opacity="0.5" stroke-linecap="round">
        <path d="M470 356 q6 4 12 2"/><path d="M500 372 q6 4 12 2"/><path d="M455 380 q6 4 12 2"/>
        <path d="M515 400 q5 4 10 2"/><path d="M480 410 q6 4 12 2"/><path d="M430 368 q6 4 12 2"/>
      </g>
      <path d="M420 336 C440 328 480 325 512 334" stroke="#f3e3c3" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round"/>

      <!-- 飘动的围巾尾 -->
      <path d="M414 352 C450 330 490 336 520 318 C540 306 556 312 574 298 C568 320 548 332 530 338 C500 350 460 354 420 370 Z" fill="#c9a878"/>
      <path d="M470 344 L476 356 M510 330 L516 342" stroke="#6e4f33" stroke-width="2"/>

      <!-- 近侧后腿与踏板 -->
      <line x1="440" y1="520" x2="462" y2="540" stroke="#1a110a" stroke-width="5" stroke-linecap="round"/>
      <path d="M488 428 C500 460 486 502 464 536" stroke="#6a4c30" stroke-width="18" stroke-linecap="round" fill="none"/>
      <rect x="450" y="538" width="24" height="6" rx="2" fill="#120b06"/>
      <ellipse cx="460" cy="537" rx="13" ry="6" fill="#4a3320"/>

      <!-- 前臂 -->
      <path d="M418 392 C400 404 386 404 372 396" stroke="#4a3320" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M432 402 C416 420 398 424 382 418" stroke="#9a7650" stroke-width="13" stroke-linecap="round" fill="none"/>
      <ellipse cx="378" cy="417" rx="7" ry="5" fill="#b08a5e"/>

      <!-- 头部 -->
      <path d="M412 356 C412 330 392 312 360 308 C332 305 310 312 300 328 C292 342 296 360 310 368 C328 378 362 382 390 380 C406 378 412 370 412 356 Z" fill="url(#furHead)"/>
      <path d="M303 332 C312 316 332 309 356 309 C380 310 400 322 408 344" stroke="#fbf0da" stroke-width="2.5" fill="none" opacity="0.8" stroke-linecap="round"/>
      <path d="M378 318 C377 305 393 303 395 314 C393 321 384 323 378 318 Z" fill="#5a4028"/>
      <use href="#leaf" transform="translate(390 310) rotate(-115) scale(0.9)" fill="#9a7650"/>
      <ellipse cx="304" cy="334" rx="7" ry="9" fill="#2a1c10"/>
      <path d="M300 336 q3 3 6 0" stroke="#0e0904" stroke-width="1.5" fill="none"/>
      <path d="M300 356 Q312 364 326 360" stroke="#3a2818" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M330 372 C350 379 372 379 394 372" stroke="#5a4028" stroke-width="1.2" fill="none" opacity="0.6"/>
      <path d="M335 321 Q345 316 355 322" stroke="#1a110a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <ellipse cx="344" cy="328" rx="4.2" ry="3.6" fill="#120b06"/>
      <circle cx="342.6" cy="326.6" r="1.3" fill="#fbf0da"/>

      <!-- 围巾结 -->
      <path d="M398 346 C410 352 420 366 418 388 C412 392 404 390 400 386 C402 370 396 358 390 352 Z" fill="#dcc398"/>
      <path d="M402 356 L412 360 M404 372 L416 374" stroke="#6e4f33" stroke-width="2"/>
    </g>

    <!-- 运动线与尘埃 -->
    <g stroke="#e8d3ae" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round">
      <path d="M556 400 q18 -4 34 2"/><path d="M552 430 q22 -4 44 2"/><path d="M548 460 q16 -3 30 1"/>
    </g>
    <circle cx="505" cy="560" r="7" fill="#c6a47a" opacity="0.25"/>
    <circle cx="522" cy="552" r="5" fill="#c6a47a" opacity="0.2"/>
    <circle cx="536" cy="560" r="4" fill="#c6a47a" opacity="0.15"/>

    <!-- 月光下的新芽 -->
    <circle cx="333" cy="530" r="16" fill="#fbf0da" opacity="0.2" filter="url(#soft)"/>
    <path d="M332 572 C330 556 336 546 333 532" stroke="#9a7650" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M333 550 C322 542 314 544 310 550 C318 554 326 554 333 550 Z" fill="#c6a47a"/>
    <path d="M334 542 C344 532 354 534 358 540 C350 546 342 546 334 542 Z" fill="#d9bf92"/>
    <circle cx="333" cy="530" r="3.8" fill="#fbf0da"/>

    <!-- 光束中的微尘 -->
    <g fill="#fbf0da">
      <circle cx="300" cy="220" r="1.5" opacity="0.7"/><circle cx="340" cy="270" r="1" opacity="0.6"/>
      <circle cx="380" cy="240" r="1.8" opacity="0.5"/><circle cx="420" cy="300" r="1.2" opacity="0.7"/>
      <circle cx="360" cy="330" r="1" opacity="0.6"/><circle cx="500" cy="300" r="1.5" opacity="0.5"/>
      <circle cx="250" cy="420" r="1.3" opacity="0.6"/><circle cx="290" cy="470" r="1" opacity="0.5"/>
      <circle cx="620" cy="300" r="1.4" opacity="0.5"/><circle cx="460" cy="250" r="1" opacity="0.6"/>
    </g>

    <!-- 前景藤叶 -->
    <path d="M720 -60 C740 40 700 90 730 160 C750 210 720 250 740 300" stroke="#0c0703" stroke-width="6" fill="none"/>
    <g fill="#0c0703">
      <use href="#leaf" transform="translate(730 40) rotate(150) scale(2.2)"/>
      <use href="#leaf" transform="translate(722 120) rotate(20) scale(2)"/>
      <use href="#leaf" transform="translate(738 200) rotate(170) scale(2.3)"/>
      <use href="#leaf" transform="translate(736 280) rotate(30) scale(1.8)"/>
      <use href="#leaf" transform="translate(-20 650) rotate(-50) scale(6)"/>
      <use href="#leaf" transform="translate(20 680) rotate(-80) scale(5)"/>
      <use href="#leaf" transform="translate(-40 590) rotate(-20) scale(4.5)"/>
      <use href="#leaf" transform="translate(760 690) rotate(-110) scale(5.5)"/>
      <use href="#leaf" transform="translate(830 640) rotate(-150) scale(5)"/>
      <use href="#leaf" transform="translate(700 700) rotate(-70) scale(4)"/>
    </g>
  </g>

  <!-- 胶片颗粒与暗角 -->
  <rect width="800" height="600" filter="url(#grain)"/>
  <rect width="800" height="600" fill="url(#vig)"/>
</svg>