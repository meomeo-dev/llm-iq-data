      <stop offset="1" stop-color="#3e2e1b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b3822"/>
      <stop offset="1" stop-color="#170f07"/>
