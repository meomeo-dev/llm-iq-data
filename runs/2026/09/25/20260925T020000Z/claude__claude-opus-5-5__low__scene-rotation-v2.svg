<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="moon" cx="0.75" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#f3e6c8"/>
      <stop offset="0.4" stop-color="#8a6f4a"/>
      <stop offset="1" stop-color="#2a1e12"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff4d8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#b08a5a"/>
      <stop offset="1" stop-color="#5a3f22"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#1e150c"/>
  <g transform="rotate(-9 400 300)">
    <rect x="-100" y="-100" width="1000" height="800" fill="url(#moon)"/>
    <!-- greenhouse frame -->
    <g stroke="#3a2a18" stroke-width="7" fill="none">
      <path d="M40 520 V200 L400 40 L760 200 V520"/>
      <path d="M160 520 V147 M280 520 V93 M520 520 V93 M640 520 V147"/>
      <path d="M40 300 H760 M40 410 H760"/>
      <path d="M400 40 V520"/>
    </g>
    <!-- broken panes -->
    <g fill="#e8d6ae" opacity="0.18">
      <path d="M160 147 L280 93 V300 H160Z"/>
      <path d="M520 93 L640 147 V300 H580 L560 230 L540 260Z"/>
      <path d="M40 410 H160 V520 H40Z"/>
    </g>
    <g stroke="#d9c49a" stroke-width="1.5" opacity="0.6" fill="none">
      <path d="M580 300 L560 230 L540 260 L520 200"/>
      <path d="M400 40 L430 120 L410 170 M430 120 L470 140"/>
    </g>
    <!-- moonbeams -->
    <path d="M560 100 L650 110 L520 600 L300 600Z" fill="url(#beam)"/>
    <path d="M420 80 L470 85 L330 600 L220 600Z" fill="url(#beam)" opacity="0.6"/>
    <!-- vines -->
    <g stroke="#4a3620" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M40 520 C80 420 20 350 90 280 S100 160 170 150"/>
      <path d="M760 520 C700 430 780 360 700 280 S690 180 620 150"/>
      <path d="M280 93 C300 150 250 170 290 230"/>
    </g>
    <g fill="#5c4428">
      <ellipse cx="70" cy="440" rx="14" ry="7" transform="rotate(-30 70 440)"/>
      <ellipse cx="95" cy="300" rx="14" ry="7" transform="rotate(30 95 300)"/>
      <ellipse cx="140" cy="165" rx="12" ry="6"/>
      <ellipse cx="735" cy="430" rx="14" ry="7" transform="rotate(30 735 430)"/>
      <ellipse cx="705" cy="300" rx="14" ry="7" transform="rotate(-30 705 300)"/>
      <ellipse cx="290" cy="200" rx="10" ry="5" transform="rotate(40 290 200)"/>
    </g>
    <!-- floor -->
    <rect x="-100" y="520" width="1000" height="200" fill="#2e2114"/>
    <g fill="#d9c49a" opacity="0.5">
      <path d="M300 560 l20 -6 l6 10Z"/><path d="M480 575 l14 -8 l8 12Z"/>
    </g>
    <!-- unicycle -->
    <g stroke="#1a120a" stroke-width="5" fill="none">
      <circle cx="400" cy="470" r="50"/>
      <path d="M400 420 V520 M350 470 H450 M365 435 L435 505 M435 435 L365 505" stroke-width="2"/>
      <path d="M400 470 V340"/>
      <path d="M400 470 L425 480 M400 470 L375 460" stroke-width="4"/>
    </g>
    <rect x="375" y="330" width="50" height="12" rx="6" fill="#1a120a"/>
    <!-- capybara -->
    <ellipse cx="400" cy="300" rx="70" ry="52" fill="url(#fur)"/>
    <path d="M385 340 L372 460 M418 340 L428 482" stroke="#4a331b" stroke-width="14" stroke-linecap="round"/>
    <rect x="410" y="210" width="95" height="62" rx="30" fill="url(#fur)"/>
    <rect x="470" y="228" width="40" height="42" rx="16" fill="#6b4e2c"/>
    <ellipse cx="505" cy="240" rx="4" ry="3" fill="#1a120a"/>
    <circle cx="455" cy="232" r="5" fill="#1a120a"/>
    <circle cx="457" cy="230" r="1.6" fill="#f3e6c8"/>
    <path d="M447 222 L464 225" stroke="#1a120a" stroke-width="3"/>
    <ellipse cx="428" cy="212" rx="10" ry="7" fill="#4a331b"/>
    <path d="M488 260 Q498 265 506 258" stroke="#1a120a" stroke-width="2" fill="none"/>
    <path d="M440 300 Q480 290 500 250" stroke="#4a331b" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- moon rim light -->
    <path d="M450 260 Q470 290 460 320" stroke="#f3e6c8" stroke-width="3" opacity="0.5" fill="none"/>
    <path d="M470 212 Q490 208 505 222" stroke="#f3e6c8" stroke-width="3" opacity="0.6" fill="none"/>
  </g>
  <!-- moon through broken glass -->
  <circle cx="690" cy="70" r="30" fill="#fbf1d8" opacity="0.9"/>
</svg>