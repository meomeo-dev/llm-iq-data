<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f5"/>
      <stop offset="1" stop-color="#f4f1e4"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d42a33"/>
      <stop offset="0.6" stop-color="#b33a2e"/>
      <stop offset="1" stop-color="#5f5a3a"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3c8cc"/>
      <stop offset="1" stop-color="#8e949a"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="560" fill="url(#sky)"/>
  <circle cx="690" cy="80" r="40" fill="#fbe7a1"/>
  <rect x="0" y="510" width="800" height="50" fill="#c9b88f"/>
  <line x1="0" y1="510" x2="800" y2="510" stroke="#a8946a" stroke-width="3"/>

  <!-- 后轮 -->
  <g stroke-linecap="round">
    <circle cx="200" cy="420" r="90" fill="none" stroke="#222" stroke-width="10"/>
    <circle cx="200" cy="420" r="82" fill="none" stroke="#9a9a9a" stroke-width="3"/>
    <g stroke="#b5b5b5" stroke-width="1.5">
      <line x1="118" y1="420" x2="282" y2="420"/>
      <line x1="200" y1="338" x2="200" y2="502"/>
      <line x1="129" y1="379" x2="271" y2="461"/>
      <line x1="129" y1="461" x2="271" y2="379"/>
      <line x1="159" y1="349" x2="241" y2="491"/>
      <line x1="159" y1="491" x2="241" y2="349"/>
    </g>
    <circle cx="200" cy="420" r="7" fill="#555"/>
  </g>

  <!-- 前轮（与后轮同尺寸） -->
  <g stroke-linecap="round">
    <circle cx="560" cy="420" r="90" fill="none" stroke="#222" stroke-width="10"/>
    <circle cx="560" cy="420" r="82" fill="none" stroke="#9a9a9a" stroke-width="3"/>
    <g stroke="#b5b5b5" stroke-width="1.5">
      <line x1="478" y1="420" x2="642" y2="420"/>
      <line x1="560" y1="338" x2="560" y2="502"/>
      <line x1="489" y1="379" x2="631" y2="461"/>
      <line x1="489" y1="461" x2="631" y2="379"/>
      <line x1="519" y1="349" x2="601" y2="491"/>
      <line x1="519" y1="491" x2="601" y2="349"/>
    </g>
    <circle cx="560" cy="420" r="7" fill="#555"/>
  </g>

  <!-- 远侧腿与踏板 -->
  <path d="M322 250 L348 330" stroke="#3b2f28" stroke-width="16" stroke-linecap="round"/>
  <path d="M348 330 L336 392" stroke="#2f2f2f" stroke-width="9" stroke-linecap="round"/>
  <line x1="360" y1="430" x2="335" y2="395" stroke="#666" stroke-width="7" stroke-linecap="round"/>
  <rect x="320" y="390" width="30" height="9" rx="2" fill="#444"/>
  <path d="M318 390 L352 388 L348 380 L322 382 Z" fill="#2a2a2a"/>

  <!-- 后齿轮 -->
  <circle cx="200" cy="420" r="13" fill="none" stroke="#777" stroke-width="4" stroke-dasharray="3 2"/>

  <!-- 链条 -->
  <g stroke="#4a4a4a" stroke-width="4" stroke-dasharray="5 2" fill="none">
    <line x1="200" y1="407" x2="360" y2="400"/>
    <line x1="200" y1="433" x2="360" y2="460"/>
  </g>

  <!-- 车架：后三角 + 主三角 -->
  <g stroke="#1f7a8c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="200" y1="420" x2="360" y2="430"/>
    <line x1="200" y1="420" x2="330" y2="285"/>
    <!-- 主三角：座管、上管、下管 -->
    <path d="M360 430 L330 285 L525 290 L535 325 Z"/>
    <!-- 前叉 -->
    <path d="M535 325 Q548 380 560 420"/>
  </g>
  <line x1="330" y1="285" x2="325" y2="265" stroke="#aaa" stroke-width="7"/>
  <line x1="525" y1="290" x2="520" y2="262" stroke="#aaa" stroke-width="7"/>
  <path d="M505 262 L545 258 Q562 258 560 280" stroke="#333" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M290 262 Q325 252 352 262 Q325 272 290 268 Z" fill="#2b2b2b"/>

  <!-- 牙盘 -->
  <circle cx="360" cy="430" r="30" fill="none" stroke="#888" stroke-width="6" stroke-dasharray="4 3"/>
  <circle cx="360" cy="430" r="22" fill="#cfcfcf" stroke="#777" stroke-width="2"/>
  <circle cx="360" cy="430" r="6" fill="#555"/>

  <!-- 鹈鹕：尾部与身体 -->
  <path d="M258 212 L218 222 L226 232 L252 244 Z" fill="#2e2824"/>
  <ellipse cx="335" cy="225" rx="88" ry="52" fill="#4f4036" transform="rotate(-12 335 225)"/>

  <!-- 收拢的翅膀 -->
  <path d="M412 178 Q350 162 290 184 Q245 204 232 242 L270 234 Q322 236 372 224 Q408 208 412 178 Z" fill="url(#wingGrad)" stroke="#6d7277" stroke-width="1.5"/>
  <path d="M292 198 Q252 214 228 246 L262 236 Q280 222 300 214 Z" fill="#2c2826"/>
  <g stroke="#6d7277" stroke-width="1.2" fill="none">
    <path d="M390 190 Q360 200 330 204"/>
    <path d="M378 204 Q345 214 310 218"/>
    <path d="M395 178 Q365 186 335 190"/>
  </g>

  <!-- 伸向车把的翅膀 -->
  <path d="M400 192 Q468 212 514 250 L524 264 Q500 266 468 244 Q430 224 394 216 Z" fill="url(#wingGrad)" stroke="#6d7277" stroke-width="1.5"/>
  <path d="M492 238 L524 262 Q508 266 486 250 Z" fill="#2c2826"/>

  <!-- 颈部：栗色后颈与白色颈纹 -->
  <path d="M405 192 C448 170 418 128 455 104" stroke="#5a2616" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M418 196 C458 172 432 134 466 112" stroke="#f6f3ea" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- 头部：白色头部与黄色头顶 -->
  <ellipse cx="470" cy="98" rx="30" ry="23" fill="#f7f5ee"/>
  <ellipse cx="466" cy="82" rx="22" ry="9" fill="#f2cf3e"/>
  <path d="M446 84 Q440 74 452 70" stroke="#e8c02e" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- 喉囊 -->
  <path d="M492 104 L640 141 Q600 172 540 152 Q505 140 492 114 Z" fill="url(#pouch)"/>

  <!-- 上喙，喙尖带钩 -->
  <path d="M488 90 L646 131 Q660 136 652 146 L641 141 L492 104 Z" fill="#b3a58e" stroke="#7c705e" stroke-width="1.5"/>
  <path d="M632 133 L646 131 Q660 136 652 146 L641 141 Z" fill="#d6452a"/>
  <line x1="494" y1="97" x2="636" y2="134" stroke="#8a7d68" stroke-width="1"/>

  <!-- 眼睛 -->
  <circle cx="483" cy="95" r="6.5" fill="#e0697a"/>
  <circle cx="483" cy="95" r="4" fill="#eef3ee"/>
  <circle cx="483.5" cy="95" r="1.8" fill="#111"/>

  <!-- 近侧腿、足蹼与踏板 -->
  <path d="M348 255 L382 338" stroke="#3b2f28" stroke-width="18" stroke-linecap="round"/>
  <path d="M382 338 L386 452" stroke="#333" stroke-width="10" stroke-linecap="round"/>
  <line x1="360" y1="430" x2="386" y2="465" stroke="#777" stroke-width="7" stroke-linecap="round"/>
  <path d="M366 456 L408 452 L404 462 L370 464 Z" fill="#2a2a2a"/>
  <g stroke="#1c1c1c" stroke-width="1.2">
    <line x1="386" y1="452" x2="372" y2="461"/>
    <line x1="386" y1="452" x2="390" y2="462"/>
    <line x1="386" y1="452" x2="403" y2="457"/>
  </g>
  <rect x="371" y="463" width="30" height="9" rx="2" fill="#444"/>
</svg>