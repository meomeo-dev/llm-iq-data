<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <rect width="560" height="400" fill="#dff1fb"/>
  <rect y="355" width="560" height="45" fill="#cdb98f"/>

  <!-- Wheels (equal radius 60) -->
  <g fill="none" stroke="#222" stroke-width="6">
    <circle cx="150" cy="295" r="60"/>
    <circle cx="410" cy="295" r="60"/>
  </g>
  <g stroke="#888" stroke-width="1.5">
    <path d="M150 235V355M90 295H210M108 253L192 337M108 337L192 253"/>
    <path d="M410 235V355M350 295H470M368 253L452 337M368 337L452 253"/>
  </g>
  <circle cx="150" cy="295" r="5" fill="#444"/>
  <circle cx="410" cy="295" r="5" fill="#444"/>

  <!-- Chain: chainring (r18) at BB, cog (r8) at rear hub -->
  <circle cx="265" cy="295" r="18" fill="none" stroke="#555" stroke-width="4"/>
  <circle cx="150" cy="295" r="8" fill="none" stroke="#555" stroke-width="3"/>
  <path d="M150 287L265 277M150 303L265 313" stroke="#333" stroke-width="2.5"
        stroke-dasharray="4 2"/>

  <!-- Frame: main triangle (seat tube, top tube, down tube) + rear triangle -->
  <g stroke="#c0392b" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M265 295L240 190L375 195Z"/>
    <path d="M265 295L150 295L240 190"/>
    <path d="M375 195L410 295"/>
  </g>
  <!-- Handlebar and seat -->
  <path d="M375 195L368 170L392 162" stroke="#333" stroke-width="5" fill="none"
        stroke-linecap="round"/>
  <path d="M240 190L236 176" stroke="#333" stroke-width="5"/>
  <ellipse cx="236" cy="173" rx="20" ry="6" fill="#222"/>

  <!-- Far leg and pedal -->
  <path d="M225 165L248 240L285 318" stroke="#3a3a3a" stroke-width="6" fill="none"
        stroke-linecap="round"/>
  <path d="M265 295L285 318" stroke="#666" stroke-width="4"/>
  <rect x="274" y="316" width="22" height="6" fill="#222"/>
  <path d="M278 316l14 0l4 6l-18 0z" fill="#3a3a3a"/>

  <!-- Body: grey-brown with silver-streaked wing -->
  <ellipse cx="225" cy="140" rx="68" ry="42" fill="#6b6259" transform="rotate(-12 225 140)"/>
  <path d="M170 125Q225 95 285 125Q250 160 175 160Z" fill="#8f8a84"/>
  <path d="M185 130Q230 115 270 130M190 142Q232 128 265 142" stroke="#c9c5bf"
        stroke-width="2" fill="none"/>
  <path d="M160 150L128 165L165 162Z" fill="#3e3833"/>

  <!-- Near leg and pedal -->
  <path d="M235 170L275 235L245 272" stroke="#2e2e2e" stroke-width="7" fill="none"
        stroke-linecap="round"/>
  <path d="M265 295L245 272" stroke="#666" stroke-width="4"/>
  <rect x="233" y="268" width="22" height="6" fill="#222"/>
  <path d="M236 268l16 0l6 6l-24 0z" fill="#2e2e2e"/>

  <!-- Neck: dark chestnut hindneck, white foreneck stripe -->
  <path d="M265 115Q300 80 292 45L312 42Q325 90 285 128Z" fill="#5a2e1c"/>
  <path d="M312 42Q322 85 290 122L284 118Q312 82 304 44Z" fill="#f4f1ea"/>

  <!-- Head: white face, yellow crown -->
  <ellipse cx="305" cy="40" rx="22" ry="17" fill="#f7f5ee"/>
  <path d="M286 33Q302 16 322 30Q305 25 288 36Z" fill="#f2c230"/>
  <circle cx="312" cy="37" r="3.2" fill="#dfe7ef"/>
  <circle cx="312" cy="37" r="1.5" fill="#111"/>
  <!-- Pink skin at eye -->
  <circle cx="312" cy="37" r="5" fill="none" stroke="#e79aa0" stroke-width="1.5"/>

  <!-- Bill with bright red gular pouch, gripping handlebar -->
  <path d="M322 38L395 58L398 64L322 46Z" fill="#c9a26b"/>
  <path d="M398 64l6 4l-7 1z" fill="#d94a2b"/>
  <path d="M322 46Q350 80 395 64L322 46Z" fill="#d7262e"/>
  <path d="M330 52Q355 70 388 63" stroke="#9e1b22" stroke-width="1.5" fill="none"/>
  <path d="M392 162Q398 110 396 66" stroke="#555" stroke-width="2"
        stroke-dasharray="3 3" fill="none" opacity="0"/>
  <!-- Wingtip reaching the handlebar -->
  <path d="M280 125Q340 140 388 162L380 170Q330 155 275 140Z" fill="#6b6259"/>
</svg>