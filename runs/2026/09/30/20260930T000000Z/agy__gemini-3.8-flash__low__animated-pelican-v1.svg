<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80d0f7"/>
      <stop offset="60%" stop-color="#caeaff"/>
      <stop offset="100%" stop-color="#fed6a6"/>
    </linearGradient>

    <!-- Ground gradient -->
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0cfba"/>
      <stop offset="25%" stop-color="#a49380"/>
      <stop offset="100%" stop-color="#6b5b48"/>
    </linearGradient>

    <!-- Metallic bicycle frame gradient -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7f50"/>
      <stop offset="45%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9a1024"/>
    </linearGradient>

    <!-- Chrome metal gradient -->
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>

    <!-- Rim gradient -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Pelican pouch gradient -->
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8a145"/>
      <stop offset="60%" stop-color="#d95d2c"/>
      <stop offset="100%" stop-color="#aa3318"/>
    </linearGradient>

    <!-- Pelican plumage gradient -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8d7764"/>
      <stop offset="50%" stop-color="#5a4d41"/>
      <stop offset="100%" stop-color="#352c24"/>
    </linearGradient>

    <!-- Pelican neck gradient -->
    <linearGradient id="neckGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2e2b"/>
      <stop offset="70%" stop-color="#221917"/>
      <stop offset="100%" stop-color="#140f0e"/>
    </linearGradient>

    <!-- Reusable Spoked Wheel (Radius ~110px) -->
    <g id="spoked-wheel">
      <!-- Outer Rubber Tire -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#24292e" stroke-width="14"/>
      <!-- Tire Tread Detailing (dashed line) -->
      <circle cx="0" cy="0" r="115" fill="none" stroke="#161b22" stroke-width="2" stroke-dasharray="4 6"/>
      <!-- Metal Rim -->
      <circle cx="0" cy="0" r="102" fill="none" stroke="url(#rimGrad)" stroke-width="6"/>
      <circle cx="0" cy="0" r="99" fill="none" stroke="#334155" stroke-width="1.5"/>
      
      <!-- Spokes (16 spoked pattern) -->
      <g stroke="#cbd5e1" stroke-width="1.6" opacity="0.9">
        <line x1="0" y1="-99" x2="0" y2="99"/>
        <line x1="-99" y1="0" x2="99" y2="0"/>
        <line x1="-70" y1="-70" x2="70" y2="70"/>
        <line x1="-70" y1="70" x2="70" y2="-70"/>
        <line x1="-91.4" y1="-37.9" x2="91.4" y2="37.9"/>
        <line x1="-91.4" y1="37.9" x2="91.4" y2="-37.9"/>
        <line x1="-37.9" y1="-91.4" x2="37.9" y2="91.4"/>
        <line x1="-37.9" y1="91.4" x2="37.9" y2="-91.4"/>
      </g>

      <!-- Center Hub -->
      <circle cx="0" cy="0" r="16" fill="url(#chromeGrad)" stroke="#374151" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#1e293b"/>
    </g>

    <!-- Wheel Shadow Filter -->
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style><![CDATA[
    /* CSS animations with hardware-acceleration support */
    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes crankRev {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pedalCounterRev {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes roadMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -240; }
    }

    @keyframes pelicanBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25%      { transform: translateY(-3px) rotate(0.6deg); }
      50%      { transform: translateY(2px) rotate(-0.3deg); }
      75%      { transform: translateY(-2px) rotate(0.4deg); }
    }

    @keyframes rightThighMotion {
      0%   { transform: rotate(26deg); }
      25%  { transform: rotate(8deg); }
      50%  { transform: rotate(-12deg); }
      75%  { transform: rotate(7deg); }
      100% { transform: rotate(26deg); }
    }

    @keyframes rightShinMotion {
      0%   { transform: rotate(-36deg); }
      25%  { transform: rotate(-10deg); }
      50%  { transform: rotate(18deg); }
      75%  { transform: rotate(-5deg); }
      100% { transform: rotate(-36deg); }
    }

    @keyframes leftThighMotion {
      0%   { transform: rotate(-12deg); }
      25%  { transform: rotate(7deg); }
      50%  { transform: rotate(26deg); }
      75%  { transform: rotate(8deg); }
      100% { transform: rotate(-12deg); }
    }

    @keyframes leftShinMotion {
      0%   { transform: rotate(18deg); }
      25%  { transform: rotate(-5deg); }
      50%  { transform: rotate(-36deg); }
      75%  { transform: rotate(-10deg); }
      100% { transform: rotate(18deg); }
    }

    .anim-wheel-rear {
      transform-origin: 260px 480px;
      animation: spinWheel 1.4s linear infinite;
    }

    .anim-wheel-front {
      transform-origin: 740px 480px;
      animation: spinWheel 1.4s linear infinite;
    }

    .anim-crankset {
      transform-origin: 490px 480px;
      animation: crankRev 1.4s linear infinite;
    }

    .anim-pedal-counter {
      animation: pedalCounterRev 1.4s linear infinite;
    }

    .anim-pelican-torso {
      transform-origin: 425px 335px;
      animation: pelicanBob 1.4s ease-in-out infinite;
    }

    .anim-thigh-r {
      transform-origin: 435px 345px;
      animation: rightThighMotion 1.4s ease-in-out infinite;
    }

    .anim-shin-r {
      transform-origin: 472px 425px;
      animation: rightShinMotion 1.4s ease-in-out infinite;
    }

    .anim-thigh-l {
      transform-origin: 435px 345px;
      animation: leftThighMotion 1.4s ease-in-out infinite;
    }

    .anim-shin-l {
      transform-origin: 472px 425px;
      animation: leftShinMotion 1.4s ease-in-out infinite;
    }

    .road-lines {
      stroke-dasharray: 60 60;
      animation: roadMove 0.7s linear infinite;
    }
  ]]></style>

  <!-- ================= BACKGROUND & ENVIRONMENT ================= -->
  <!-- Sky -->
  <rect x="0" y="0" width="1000" height="490" fill="url(#skyGrad)"/>
  
  <!-- Coastal distant headland / bluffs -->
  <path d="M0 380 Q 150 330, 320 370 T 650 360 T 1000 345 L 1000 490 L 0 490 Z" fill="#607d8b" opacity="0.45"/>
  <path d="M0 400 Q 200 370, 480 405 T 850 395 T 1000 390 L 1000 490 L 0 490 Z" fill="#475569" opacity="0.3"/>

  <!-- Road / Pier Floor -->
  <rect x="0" y="490" width="1000" height="160" fill="url(#roadGrad)"/>
  <line x1="0" y1="492" x2="1000" y2="492" stroke="#d5c4af" stroke-width="4"/>
  <line x1="0" y1="565" x2="1000" y2="565" stroke="#ffffff" stroke-width="4" stroke-opacity="0.8" class="road-lines"/>
  
  <!-- Ambient shadows cast by bicycle -->
  <ellipse cx="260" cy="588" rx="80" ry="14" fill="url(#shadowG)"/>
  <ellipse cx="740" cy="588" rx="80" ry="14" fill="url(#shadowG)"/>
  <ellipse cx="490" cy="590" rx="140" ry="16" fill="url(#shadowG)"/>

  <!-- ================= BICYCLE LAYER (BACK) ================= -->
  <!-- Rear Wheel -->
  <g class="anim-wheel-rear">
    <use href="#spoked-wheel" x="260" y="480"/>
  </g>

  <!-- Left (Far) Crank, Pedal & Left Leg (Rendered Behind Bicycle Frame) -->
  <g>
    <!-- Left Leg Group (behind frame) -->
    <g class="anim-thigh-l">
      <!-- Left Thigh -->
      <line x1="435" y1="345" x2="472" y2="425" stroke="#715d4d" stroke-width="20" stroke-linecap="round"/>
      <line x1="435" y1="345" x2="472" y2="425" stroke="#483b31" stroke-width="12" stroke-linecap="round"/>

      <!-- Left Shin & Foot -->
      <g class="anim-shin-l">
        <line x1="472" y1="425" x2="450" y2="515" stroke="#d97706" stroke-width="11" stroke-linecap="round"/>
        <!-- Left Pelican Webbed Foot -->
        <path d="M450 515 L 430 523 L 415 528 L 417 517 L 448 512 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Crank spindle group for left pedal -->
    <g class="anim-crankset">
      <!-- Left Crank Arm (180 deg offset from right crank) -->
      <line x1="490" y1="480" x2="452" y2="518" stroke="#475569" stroke-width="11" stroke-linecap="round"/>
      <line x1="490" y1="480" x2="452" y2="518" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
      <!-- Left Pedal Platform (counter-rotates so it stays level) -->
      <g transform="translate(452, 518)">
        <g class="anim-pedal-counter">
          <rect x="-16" y="-4" width="32" height="8" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= BICYCLE MAIN FRAME ================= -->
  <!-- 
      Geometry:
      - Rear Dropout: (260, 480)
      - Bottom Bracket: (490, 480)
      - Seat Lug: (415, 335)
      - Head Tube: Bottom (680, 310) to Top (695, 250)
      - Front Fork Dropouts: (740, 480) up to Head Tube Base (680, 310)
  -->
  <g>
    <!-- Chain & Rear Stays Underneath -->
    <!-- Chain loop -->
    <path d="M 260 480 L 490 458 L 515 480 L 490 502 L 260 495 Z" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="6 3"/>
    
    <!-- Chain Stay (Rear hub to BB) -->
    <line x1="260" y1="480" x2="490" y2="480" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Seat Stay (Rear hub to Seat lug) -->
    <line x1="260" y1="480" x2="415" y2="335" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/>

    <!-- Front Fork (Front dropout to Head tube lower) -->
    <line x1="740" y1="480" x2="680" y2="310" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="740" y1="480" x2="680" y2="310" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Seat Tube (Bottom Bracket to Seat Lug) -->
    <line x1="490" y1="480" x2="415" y2="335" stroke="url(#frameGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Down Tube (Head Tube bottom to Bottom Bracket) -->
    <line x1="680" y1="310" x2="490" y2="480" stroke="url(#frameGrad)" stroke-width="18" stroke-linecap="round"/>
    <!-- Highlight sheen on down tube -->
    <line x1="675" y1="312" x2="493" y2="474" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

    <!-- Top Tube (Head Tube upper to Seat Lug) -->
    <line x1="688" y1="275" x2="415" y2="335" stroke="url(#frameGrad)" stroke-width="15" stroke-linecap="round"/>
    <line x1="685" y1="272" x2="418" y2="332" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Head Tube -->
    <line x1="680" y1="310" x2="698" y2="245" stroke="url(#frameGrad)" stroke-width="20" stroke-linecap="round"/>

    <!-- Seat Post & Saddle -->
    <line x1="415" y1="335" x2="395" y2="295" stroke="url(#chromeGrad)" stroke-width="11" stroke-linecap="round"/>
    <!-- Saddle Seat (racing vintage shape) -->
    <path d="M 355 293 C 375 285, 420 286, 440 295 C 445 297, 435 306, 410 306 C 385 306, 360 305, 355 293 Z" fill="#2d1a12" stroke="#120a07" stroke-width="2"/>
    <path d="M 370 290 Q 405 290 425 295" stroke="#8d5b4c" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Handlebar Stem & Classic Drop/Cruiser Handlebar -->
    <!-- Stem -->
    <path d="M 694 255 L 702 210 L 685 210" fill="none" stroke="url(#chromeGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Swept Cruiser Handlebars -->
    <path d="M 685 210 Q 645 208, 625 240 Q 618 250, 630 256" fill="none" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Handlebar Grip -->
    <path d="M 632 245 L 626 256" stroke="#1f2937" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Front Wheel (positioned in front of fork dropout) -->
  <g class="anim-wheel-front">
    <use href="#spoked-wheel" x="740" y="480"/>
  </g>

  <!-- Front Dropout Bolt -->
  <circle cx="740" cy="480" r="7" fill="url(#chromeGrad)" stroke="#1f2937" stroke-width="2"/>

  <!-- ================= PELICAN (SEATED BIRD) ================= -->
  <!-- Pelican Torso, Wings, Neck and Head (animated with gentle riding bob) -->
  <g class="anim-pelican-torso">
    <!-- Tail feathers -->
    <path d="M 330 305 Q 310 325 345 340 Q 375 340 395 325 Z" fill="#4a3e35" stroke="#2b231d" stroke-width="2"/>
    
    <!-- Main Body / Torso -->
    <path d="M 360 290 C 340 250, 390 205, 455 215 C 495 220, 520 255, 510 305 C 500 345, 440 355, 385 345 C 365 340, 355 315, 360 290 Z" fill="url(#bodyGrad)" stroke="#261e18" stroke-width="2.5"/>

    <!-- Wing Coverts & Feathers Detail -->
    <path d="M 385 235 C 430 230, 485 260, 480 310 C 475 335, 430 345, 395 340 C 375 330, 370 295, 385 235 Z" fill="#4d3f35" stroke="#231a14" stroke-width="1.5"/>
    <path d="M 405 255 C 445 255, 470 280, 465 320" fill="none" stroke="#715d4d" stroke-width="2.5" stroke-dasharray="4 8"/>
    <path d="M 390 275 C 430 275, 455 300, 448 333" fill="none" stroke="#8d7764" stroke-width="2" stroke-dasharray="5 7"/>

    <!-- Folded Forewing & Arm reaching down to handlebar -->
    <!-- Primary Wing Joint leading down to gripping feather tip -->
    <path d="M 455 240 C 510 245, 570 240, 630 250" fill="none" stroke="#5a4d41" stroke-width="18" stroke-linecap="round"/>
    <path d="M 455 240 C 510 245, 570 240, 630 250" fill="none" stroke="#7f6b5b" stroke-width="8" stroke-linecap="round"/>
    <!-- Wing tip gripping handlebar -->
    <path d="M 622 242 Q 638 252 626 260 Q 616 252 622 242 Z" fill="#2d221b"/>

    <!-- Neck Curve (California Brown Pelican's rich dark chestnut-brown neck) -->
    <!-- Smooth S-curve upward -->
    <path d="M 480 230 C 505 180, 520 120, 565 105 C 590 98, 605 108, 605 125 C 605 155, 565 170, 545 205 C 535 220, 525 240, 500 248 Z" fill="url(#neckGrad)"/>
    
    <!-- White Stripe along side of neck (characteristic breeding plumage of brown pelican) -->
    <path d="M 590 120 C 585 145, 555 168, 542 195 C 532 212, 520 230, 498 238" fill="none" stroke="#f8fafc" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Pelican Head (Straw-yellow crown / crest & white face) -->
    <!-- Pale yellow crest -->
    <path d="M 565 105 C 570 75, 615 70, 635 90 C 645 100, 635 120, 610 122 C 585 124, 570 115, 565 105 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <!-- Head feather tufts -->
    <path d="M 575 88 Q 560 75 580 72 Q 600 70 615 78" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Eye Area & Eye -->
    <circle cx="618" cy="98" r="9" fill="#e2e8f0"/>
    <circle cx="620" cy="98" r="4.5" fill="#0f172a"/>
    <circle cx="621.5" cy="96.5" r="1.5" fill="#ffffff"/> <!-- Catchlight -->
    <path d="M 610 90 Q 622 88 630 92" fill="none" stroke="#475569" stroke-width="1.5"/>

    <!-- Huge Pelican Bill & Pouch -->
    <!-- Upper Maxilla (Bill) -->
    <path d="M 625 96 L 775 126 C 785 128, 790 134, 780 137 L 625 116 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <!-- Upper bill ridge (horn yellow tip and hook) -->
    <path d="M 630 97 L 778 127 Q 788 130 784 136 Q 776 133 765 127 L 630 102 Z" fill="#fbbf24"/>
    <path d="M 782 131 Q 787 136 779 138" stroke="#b45309" stroke-width="2" fill="none"/> <!-- Hook -->

    <!-- Gular Pouch (Expansive sag pouch underneath beak) -->
    <path d="M 625 116 C 655 160, 715 195, 755 137 L 625 116 Z" fill="url(#pouchGrad)" stroke="#b91c1c" stroke-width="2"/>
    <!-- Subtle elastic skin wrinkles on pouch -->
    <path d="M 645 125 Q 675 162 705 145" fill="none" stroke="#ef4444" stroke-width="1.2" opacity="0.6"/>
    <path d="M 670 128 Q 700 162 730 140" fill="none" stroke="#ef4444" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- ================= FOREGROUND CRANK, RIGHT LEG & RIGHT PEDAL ================= -->
  <!-- 
       Bottom Bracket Center: (490, 480)
       Crank Length: 54px.
       Right leg attaches at hip: (435, 345)
  -->
  <g>
    <!-- Right Thigh & Knee -->
    <g class="anim-thigh-r">
      <!-- Right Thigh -->
      <line x1="435" y1="345" x2="472" y2="425" stroke="#8d7764" stroke-width="22" stroke-linecap="round"/>
      <line x1="435" y1="345" x2="472" y2="425" stroke="#5a4d41" stroke-width="15" stroke-linecap="round"/>
      <!-- Hip joint feathering cover -->
      <circle cx="435" cy="345" r="16" fill="#5a4d41"/>

      <!-- Right Shin & Foot -->
      <g class="anim-shin-r">
        <!-- Knee Cap -->
        <circle cx="472" cy="425" r="10" fill="#78350f"/>
        <!-- Orange/Amber Pelican Leg Bone -->
        <line x1="472" y1="425" x2="528" y2="442" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
        <line x1="472" y1="425" x2="528" y2="442" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>

        <!-- Right Webbed Foot grasping the pedal -->
        <path d="M 520 435 L 555 439 C 560 443, 552 452, 545 453 L 512 447 Z" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
        <path d="M 525 437 L 558 445" stroke="#b45309" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Foreground Crank Disc & Right Pedal System -->
    <g class="anim-crankset">
      <!-- Chainring Disc (Outer gear with teeth simulation) -->
      <circle cx="490" cy="480" r="34" fill="#334155" stroke="#64748b" stroke-width="3" stroke-dasharray="5 3"/>
      <circle cx="490" cy="480" r="26" fill="url(#chromeGrad)" stroke="#1e293b" stroke-width="2"/>
      
      <!-- Cutout detailing on chainring -->
      <circle cx="490" cy="463" r="5" fill="#0f172a"/>
      <circle cx="505" cy="488" r="5" fill="#0f172a"/>
      <circle cx="475" cy="488" r="5" fill="#0f172a"/>

      <!-- Right Crank Arm (pointing toward pedal spindle at 528, 442 -> dx=+38, dy=-38) -->
      <line x1="490" y1="480" x2="528" y2="442" stroke="#475569" stroke-width="13" stroke-linecap="round"/>
      <line x1="490" y1="480" x2="528" y2="442" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
      <circle cx="528" cy="442" r="6" fill="#1e293b"/>

      <!-- Right Pedal Platform (Counter-rotates to stay horizontal) -->
      <g transform="translate(528, 442)">
        <g class="anim-pedal-counter">
          <!-- Reflector insert -->
          <rect x="-16" y="-5" width="32" height="10" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect x="-10" y="-2" width="20" height="4" rx="1" fill="#f59e0b"/>
        </g>
      </g>
    </g>

    <!-- Bottom Bracket Center Axis Bolt -->
    <circle cx="490" cy="480" r="11" fill="url(#chromeGrad)" stroke="#1e293b" stroke-width="2"/>
    <circle cx="490" cy="480" r="4" fill="#0f172a"/>
  </g>
</svg>