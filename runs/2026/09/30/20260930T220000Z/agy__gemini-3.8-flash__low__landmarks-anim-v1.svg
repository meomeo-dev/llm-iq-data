<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#edf2f7" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Plinth Shadow Filter -->
    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="22" flood-color="#1e293b" flood-opacity="0.25" />
    </filter>

    <filter id="shadow-mountain" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.2  0 0 0 0 0.22  0 0 0 0.45 0" />
      <feOffset dx="15" dy="18" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>

    <!-- Base / Water Gradients -->
    <linearGradient id="plinth-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="plinth-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>

    <radialGradient id="water-surface" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#56b4bd" />
      <stop offset="45%" stop-color="#3f9fa8" />
      <stop offset="85%" stop-color="#277b84" />
      <stop offset="100%" stop-color="#1b5a61" />
    </radialGradient>

    <linearGradient id="water-shallow" x1="30%" y1="70%" x2="50%" y2="40%">
      <stop offset="0%" stop-color="#72c7ce" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#3f9fa8" stop-opacity="0" />
    </linearGradient>

    <!-- Mountain Rock Gradients -->
    <linearGradient id="sugarloaf-lit" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#b5b0a8" />
      <stop offset="35%" stop-color="#9e9992" />
      <stop offset="80%" stop-color="#837e78" />
    </linearGradient>

    <linearGradient id="sugarloaf-shadow" x1="10%" y1="30%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#6e6b69" />
      <stop offset="50%" stop-color="#555457" />
      <stop offset="100%" stop-color="#3e3f45" />
    </linearGradient>

    <linearGradient id="urca-green-lit" x1="30%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#68ab63" />
      <stop offset="50%" stop-color="#4f8a4b" />
      <stop offset="100%" stop-color="#3b6938" />
    </linearGradient>

    <linearGradient id="urca-green-shade" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#3a6737" />
      <stop offset="100%" stop-color="#244222" />
    </linearGradient>

    <!-- Station & Building Gradients -->
    <linearGradient id="wall-lit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d9dee4" />
    </linearGradient>
    <linearGradient id="wall-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Cable Car Def -->
    <g id="cable-car-unit">
      <!-- Hanger Arm -->
      <path d="M 0,-15 L 0,-6 L -4,0 L 4,0 L 0,-6" fill="#475569" />
      <circle cx="0" cy="-15" r="2" fill="#1e293b" />
      <!-- Bubble Cabin Body -->
      <rect x="-7" y="0" width="14" height="11" rx="3.5" fill="#f59e0b" stroke="#d97706" stroke-width="0.75" />
      <!-- Glass wrap -->
      <rect x="-5.5" y="2.5" width="11" height="5" rx="1.5" fill="#1e293b" opacity="0.8" />
      <rect x="-4.5" y="3.5" width="4.5" height="3" rx="0.5" fill="#bae6fd" opacity="0.85" />
      <!-- Cabin base shadow -->
      <path d="M -5,11 L 5,11 L 4,12 L -4,12 Z" fill="#92400e" />
    </g>

    <!-- Reusable Urban Block Component -->
    <g id="city-block-a">
      <path d="M 0,0 L 8,-4 L 16,0 L 8,4 Z" fill="#f8fafc" />
      <path d="M 0,0 L 8,4 L 8,14 L 0,10 Z" fill="#cbd5e1" />
      <path d="M 8,4 L 16,0 L 16,10 L 8,14 Z" fill="#94a3b8" />
    </g>
    <g id="city-block-b">
      <path d="M 0,0 L 6,-3 L 12,0 L 6,3 Z" fill="#fed7aa" />
      <path d="M 0,0 L 6,3 L 6,8 L 0,5 Z" fill="#fba16c" />
      <path d="M 6,3 L 12,0 L 12,5 L 6,8 Z" fill="#dd6b20" />
    </g>
  </defs>

  <style><![CDATA[
    .fade-peninsula { opacity: 0.95; }
    .wake-track { stroke-dasharray: 4, 3; animation: wakePulse 3s linear infinite; }
    @keyframes wakePulse {
      0% { stroke-dashoffset: 0; opacity: 0.7; }
      50% { opacity: 0.25; }
      100% { stroke-dashoffset: -14; opacity: 0.7; }
    }
  ]]></style>

  <!-- Canvas Background -->
  <rect width="1000" height="800" fill="url(#studio-bg)" />

  <!-- Display Plinth Base Shadow -->
  <ellipse cx="500" cy="540" rx="420" ry="175" fill="#0f172a" opacity="0.18" filter="url(#shadow-soft)" />
  <ellipse cx="500" cy="535" rx="405" ry="168" fill="#1e293b" opacity="0.12" />

  <!-- Cylindrical Display Plinth (Side Wall) -->
  <path d="M 100,520 C 100,615 279,690 500,690 C 721,690 900,615 900,520 L 900,555 C 900,650 721,725 500,725 C 279,725 100,650 100,555 Z" fill="url(#plinth-side)" />

  <!-- Plinth Edge Bevel Highlight -->
  <ellipse cx="500" cy="520" rx="402" ry="167" fill="none" stroke="url(#plinth-rim)" stroke-width="2.5" />

  <!-- Plinth Top Surface (Sea Water) -->
  <ellipse cx="500" cy="520" rx="400" ry="165" fill="url(#water-surface)" />

  <!-- Island / Peninsula Group -->
  <g class="fade-peninsula">
    <!-- Mountain Cast Shadows on Sea -->
    <path d="M 370,515 C 430,520 540,550 590,565 C 640,580 730,555 770,535 C 720,515 620,490 530,480 Z" fill="#123d44" opacity="0.45" filter="url(#shadow-soft)" />
    <path d="M 570,440 C 660,455 760,490 810,505 C 800,480 730,445 660,430 Z" fill="#10363c" opacity="0.5" filter="url(#shadow-soft)" />

    <!-- Shallow Water Halo Around Shore -->
    <path d="M 160,535 C 220,590 380,595 440,555 C 470,535 510,535 560,510 C 620,480 660,430 640,410 C 580,395 500,405 460,430 C 400,435 340,455 270,470 C 200,485 140,510 160,535 Z" fill="url(#water-shallow)" />

    <!-- Sandy Beach (Front shore of peninsula) -->
    <path d="M 195,530 C 230,555 310,570 375,562 C 405,558 435,548 450,535 C 445,531 430,528 405,530 C 350,535 285,530 220,515 C 205,518 198,525 195,530 Z" fill="#e5c386" />
    <path d="M 215,528 C 270,545 340,548 395,544 C 425,541 438,536 442,533 C 425,527 385,526 345,526 C 280,526 230,520 215,528 Z" fill="#f3deb3" />

    <!-- Urban Base Ground (Low Peninsula Landmass) -->
    <path d="M 215,524 C 270,540 370,545 425,530 C 455,522 470,505 470,490 C 470,470 410,460 360,462 C 290,465 235,480 205,502 C 198,508 202,518 215,524 Z" fill="#7ba374" />

    <!-- Coastal Road / Embankment Edge -->
    <path d="M 205,526 C 265,546 360,550 420,536" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Low City Blocks (Front Urban Area, heights <= 18px << Urca's 100px) -->
    <!-- Row 1: Foreground near beach -->
    <use href="#city-block-a" x="225" y="515" />
    <use href="#city-block-b" x="242" y="520" />
    <use href="#city-block-a" x="258" y="523" transform="scale(0.85) translate(40, 75)" />
    <use href="#city-block-b" x="282" y="525" />
    <use href="#city-block-a" x="302" y="526" />
    <use href="#city-block-b" x="325" y="527" transform="scale(1.1) translate(-25, -23)" />
    <use href="#city-block-a" x="350" y="525" />
    <use href="#city-block-b" x="375" y="522" />
    <use href="#city-block-a" x="398" y="516" />

    <!-- Row 2: Mid-depth street blocks -->
    <use href="#city-block-b" x="235" y="502" />
    <use href="#city-block-a" x="255" y="507" />
    <use href="#city-block-b" x="275" y="510" transform="scale(0.9) translate(30, 48)" />
    <use href="#city-block-a" x="298" y="512" />
    <use href="#city-block-a" x="318" y="513" />
    <use href="#city-block-b" x="340" y="512" />
    <use href="#city-block-a" x="365" y="508" />
    <use href="#city-block-b" x="388" y="503" />

    <!-- Row 3: Blocks closer to mountain base -->
    <use href="#city-block-a" x="250" y="492" />
    <use href="#city-block-b" x="272" y="496" />
    <use href="#city-block-a" x="292" y="498" />
    <use href="#city-block-b" x="315" y="499" />
    <use href="#city-block-a" x="338" y="497" />
    <use href="#city-block-b" x="362" y="494" />

    <!-- Trees dotted amongst city blocks -->
    <circle cx="250" cy="516" r="3.5" fill="#3b6938" />
    <circle cx="273" cy="522" r="3" fill="#4f8a4b" />
    <circle cx="295" cy="527" r="3.5" fill="#2d522a" />
    <circle cx="340" cy="527" r="4" fill="#3b6938" />
    <circle cx="392" cy="521" r="3.5" fill="#4f8a4b" />
    <circle cx="310" cy="506" r="3" fill="#3b6938" />
    <circle cx="332" cy="505" r="3" fill="#2d522a" />

    <!-- Ground Cable Station (Praia Vermelha Station) -->
    <g id="station-ground" transform="translate(378, 492)">
      <!-- Ambient Shadow -->
      <ellipse cx="14" cy="18" rx="16" ry="6" fill="#1e293b" opacity="0.35" />
      <!-- Building Walls -->
      <path d="M 0,8 L 14,0 L 28,7 L 14,15 Z" fill="url(#wall-lit)" />
      <path d="M 0,8 L 14,15 L 14,24 L 0,17 Z" fill="url(#wall-shadow)" />
      <path d="M 14,15 L 28,7 L 28,16 L 14,24 Z" fill="#64748b" />
      <!-- Terminal Cable Portal (Dark interior) -->
      <path d="M 16,11 L 24,7 L 24,12 L 16,16 Z" fill="#0f172a" />
    </g>

    <!-- MOUNTAIN 1: MORRO DA URCA (Low Mountain) -->
    <!-- Urca Base: x: 380-550, Peak: x: 470, y: 395 (Height approx 105px) -->
    <g id="morro-da-urca">
      <!-- Ambient Occlusion Base -->
      <ellipse cx="465" cy="495" rx="75" ry="24" fill="#1b381a" opacity="0.6" filter="url(#shadow-soft)" />

      <!-- Shadow Side (Southeast slope) -->
      <path d="M 465,395 C 495,397 535,425 548,460 C 555,478 545,496 525,502 C 485,508 455,495 440,490 Z" fill="url(#urca-green-shade)" />

      <!-- Lit Side (Northwest slope facing top-left light) -->
      <path d="M 465,395 C 440,396 410,415 395,445 C 382,470 390,490 415,500 C 440,505 455,495 470,490 C 468,445 466,415 465,395 Z" fill="url(#urca-green-lit)" />

      <!-- Rounded summit crest & rock terraces -->
      <path d="M 440,403 C 455,395 478,395 490,402 C 480,408 452,408 440,403 Z" fill="#82b87c" />

      <!-- Dense vegetation clumping textures -->
      <circle cx="430" cy="445" r="14" fill="#3f753c" opacity="0.7" />
      <circle cx="445" cy="435" r="12" fill="#589953" opacity="0.6" />
      <circle cx="420" cy="465" r="16" fill="#3b6938" opacity="0.7" />
      <circle cx="452" cy="460" r="15" fill="#4d8749" opacity="0.5" />
      <circle cx="485" cy="435" r="15" fill="#2d522a" opacity="0.7" />
      <circle cx="510" cy="455" r="16" fill="#244222" opacity="0.8" />
      <circle cx="495" cy="475" r="18" fill="#1f381d" opacity="0.8" />

      <!-- Subtle rock ribs poking through green -->
      <path d="M 432,450 Q 436,465 440,478" stroke="#78736d" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
      <path d="M 458,442 Q 460,458 462,472" stroke="#6b6661" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

      <!-- Urca Summit Station -->
      <g id="station-urca" transform="translate(460, 390)">
        <rect x="-8" y="0" width="16" height="7" rx="1.5" fill="url(#wall-lit)" />
        <rect x="0" y="0" width="8" height="7" rx="1" fill="url(#wall-shadow)" />
        <!-- Viewing terrace platform -->
        <path d="M -11,7 L 11,7 L 9,9 L -9,9 Z" fill="#475569" />
        <!-- Cable entrance openings -->
        <rect x="-6" y="2" width="3" height="3" fill="#0f172a" />
        <rect x="3" y="2" width="3" height="3" fill="#0f172a" />
      </g>
    </g>

    <!-- INTERMEDIATE SADDLE / RIDGE (Col between Urca and Sugarloaf) -->
    <path d="M 520,470 C 538,460 555,455 575,452 C 585,465 570,480 540,485 Z" fill="#2c5329" />
    <circle cx="550" cy="465" r="9" fill="#1e3b1c" />
    <circle cx="562" cy="460" r="8" fill="#2d522a" />

    <!-- MOUNTAIN 2: PÃO DE AÇÚCAR (Sugarloaf Main Peak) -->
    <!-- Proportions: Height ~ 190px (1.8x of Urca ~105px), Vertical monolithic dome, rising directly from water -->
    <!-- Peak Top: x: 620, y: 205. Summit width: ~55px. Base width: ~110px (x: 565 to 675) -->
    <g id="pao-de-acucar" filter="url(#shadow-mountain)">
      <!-- Ambient water occlusion at mountain foot -->
      <ellipse cx="620" cy="452" rx="60" ry="18" fill="#0c2b30" opacity="0.7" />

      <!-- Base Vegetation Skirt (Only at foot and fissures) -->
      <path d="M 560,455 C 570,440 585,435 595,445 C 605,430 625,432 638,442 C 650,430 668,435 680,452 C 650,465 590,468 560,455 Z" fill="#1e3e1b" />
      <path d="M 568,452 C 580,444 595,442 605,448 C 615,440 630,440 642,447 C 655,442 665,446 672,454 Z" fill="#345e30" />

      <!-- Sugarloaf Main Monolith Body: Shadow / Backlight mass (East & South face) -->
      <path d="M 622,205 C 638,206 652,213 658,228 C 672,260 678,320 676,375 C 674,410 678,435 675,452 C 642,458 625,455 615,452 C 616,390 618,310 620,240 Z" fill="url(#sugarloaf-shadow)" />

      <!-- Sugarloaf Main Monolith Body: Lit Face (North & West face receiving NW light) -->
      <path d="M 622,205 C 605,206 592,214 584,232 C 570,265 564,325 565,380 C 566,415 562,438 565,452 C 585,456 605,455 615,452 C 618,390 619,305 622,205 Z" fill="url(#sugarloaf-lit)" />

      <!-- Rounded Top Dome Crest Highlight -->
      <path d="M 592,224 C 606,207 636,207 650,222 C 640,215 604,215 592,224 Z" fill="#dedad4" />

      <!-- Weathering Vertical Flutes / Grooves (Lit Face details as required) -->
      <g opacity="0.45">
        <path d="M 592,238 C 588,275 583,330 584,385 C 584,410 582,435 581,446" stroke="#dedad4" stroke-width="1.75" stroke-linecap="round" fill="none" />
        <path d="M 602,228 C 600,268 596,335 597,395 C 598,420 596,440 595,450" stroke="#f1efe9" stroke-width="2" stroke-linecap="round" fill="none" />
        <path d="M 612,220 C 611,260 609,325 610,390 C 611,415 610,438 609,450" stroke="#e5e2dc" stroke-width="1.5" stroke-linecap="round" fill="none" />
        <!-- Rock Joint Shadow Crevice -->
        <path d="M 606,245 C 605,285 602,340 603,400" stroke="#5d5a56" stroke-width="1.2" stroke-linecap="round" fill="none" />
      </g>

      <!-- Hanging vegetation in rock fissures -->
      <path d="M 586,340 Q 588,348 587,355" stroke="#3b6938" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <circle cx="587" cy="342" r="2.5" fill="#4f8a4b" />
      <path d="M 603,370 Q 604,380 602,388" stroke="#2d522a" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="603" cy="374" r="3" fill="#3b6938" />
      <circle cx="616" cy="395" r="2.5" fill="#2d522a" />

      <!-- Peak Base Edge Ambient Shade -->
      <path d="M 565,450 C 595,457 645,457 675,450 C 674,454 644,461 565,454 Z" fill="#1e293b" opacity="0.6" />

      <!-- Sugarloaf Summit Minimalist Station -->
      <g id="station-sugarloaf" transform="translate(620, 202)">
        <!-- Terrace Plinth -->
        <path d="M -12,5 L 12,5 L 10,8 L -10,8 Z" fill="#334155" />
        <!-- Station Structure -->
        <rect x="-8" y="-2" width="16" height="7" rx="1.5" fill="url(#wall-lit)" />
        <rect x="0" y="-2" width="8" height="7" rx="1" fill="url(#wall-shadow)" />
        <!-- Lookout Bay Window / Cable Ingress -->
        <rect x="-6" y="0" width="4" height="3" fill="#0f172a" />
        <!-- Observation Railing Top -->
        <line x1="-9" y1="-2" x2="9" y2="-2" stroke="#94a3b8" stroke-width="0.8" />
      </g>
    </g>

    <!-- CABLE CAR SYSTEM (2 Sections, Parallel Fine Lines, 2 Suspended Cabins) -->
    <g id="cable-system">
      <!-- SECTION 1: Beach Station (392, 500) to Urca Summit (455, 395) -->
      <!-- Track Cable Pair -->
      <line x1="392" y1="499" x2="455" y2="394" stroke="#475569" stroke-width="0.9" opacity="0.85" />
      <line x1="394" y1="501" x2="457" y2="396" stroke="#334155" stroke-width="0.9" opacity="0.85" />

      <!-- Section 1 Moving Cable Car -->
      <g>
        <use href="#cable-car-unit">
          <animateMotion path="M 400,488 L 448,408" dur="8s" repeatCount="indefinite" rotate="auto" />
        </use>
      </g>

      <!-- SECTION 2: Urca Summit (465, 393) to Sugarloaf Top (614, 204) - Steeper Slope -->
      <!-- Track Cable Pair -->
      <line x1="465" y1="392" x2="614" y2="203" stroke="#475569" stroke-width="0.85" opacity="0.85" />
      <line x1="467" y1="394" x2="616" y2="205" stroke="#334155" stroke-width="0.85" opacity="0.85" />

      <!-- Section 2 Moving Cable Car (Ascending & Descending smoothly) -->
      <g>
        <use href="#cable-car-unit">
          <animateMotion path="M 605,215 L 475,380" dur="11s" repeatCount="indefinite" rotate="auto" />
        </use>
      </g>
    </g>

    <!-- MARITIME DETAILS: Sailboats & Wakes on Water Surface -->
    <!-- Sailboat 1 (Foreground Left, Moving leisurely across Guanabara Bay) -->
    <g id="sailboat-1">
      <!-- Motion path for boat 1 -->
      <animateMotion path="M 280,600 C 320,590 370,585 430,595 C 370,585 320,590 280,600 Z" dur="12s" repeatCount="indefinite" rotate="auto" />
      <!-- Water Wake -->
      <path d="M -18,1 C -35,5 -50,9 -65,12 M -18,1 C -35,-2 -50,-5 -65,-7" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6" class="wake-track" />
      <!-- Hull Shadow -->
      <ellipse cx="0" cy="3" rx="10" ry="3" fill="#0f172a" opacity="0.35" />
      <!-- Hull -->
      <path d="M -10,1 L 11,1 C 13,1 11,4 8,5 L -8,5 C -11,4 -12,1 -10,1 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5" />
      <!-- Deck cabin -->
      <rect x="-3" y="-1" width="6" height="2" rx="0.5" fill="#b91c1c" />
      <!-- White Sail -->
      <path d="M 1,-1 L 1,-16 L 8,-2 Z" fill="#ffffff" />
      <path d="M -0.5,-1 L -0.5,-14 L -6,-2 Z" fill="#e2e8f0" />
      <!-- Mast -->
      <line x1="0.5" y1="1" x2="0.5" y2="-17" stroke="#475569" stroke-width="0.7" />
    </g>

    <!-- Sailboat 2 (Distanced Right, Smaller Scale) -->
    <g id="sailboat-2" transform="translate(730, 480)">
      <!-- Subtle Floating Bobbing Animation -->
      <animateTransform attributeName="transform" type="translate" values="730,480; 736,478; 730,480" dur="7s" repeatCount="indefinite" />
      <!-- Faint Wake -->
      <path d="M -12,0 C -22,3 -32,5 -42,7 M -12,0 C -22,-2 -32,-3 -42,-4" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.45" class="wake-track" />
      <!-- Hull Shadow -->
      <ellipse cx="0" cy="2" rx="7" ry="2" fill="#0f172a" opacity="0.25" />
      <!-- Hull -->
      <path d="M -7,1 L 7,1 C 8,1 7,3 5,4 L -5,4 C -7,3 -8,1 -7,1 Z" fill="#f1f5f9" />
      <!-- Main Sail -->
      <path d="M 0.5,-1 L 0.5,-12 L 6,-2 Z" fill="#ffffff" opacity="0.95" />
      <path d="M -0.5,-1 L -0.5,-10 L -4,-2 Z" fill="#cbd5e1" opacity="0.9" />
    </g>
  </g>
</svg>