<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600">
  <rect width="400" height="300" fill="#dff1fb"/>
  <rect y="255" width="400" height="45" fill="#b9d9a0"/>
  <line x1="0" y1="255" x2="400" y2="255" stroke="#8fb878" stroke-width="2"/>

  <!-- far leg -->
  <polyline fill="none" stroke="#c98a2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="172,125 220,151 172,187">
    <animate attributeName="points" dur="1.6s" repeatCount="indefinite" calcMode="linear"
      values="172,125 202,171 172,223;172,125 202,171 172,187;172,125 220,151 172,187;172,125 227,132 190,180;172,125 227,130 208,187;172,125 223,146 215,205;172,125 212,163 208,223;172,125 202,171 190,230;172,125 202,171 172,223"/>
  </polyline>
  <g>
    <line x1="190" y1="205" x2="190" y2="180" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <rect x="182" y="177" width="16" height="6" rx="2" fill="#222"/>
    <animateTransform attributeName="transform" type="rotate" from="180 190 205" to="540 190 205" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- wheels -->
  <g>
    <circle cx="100" cy="200" r="55" fill="none" stroke="#222" stroke-width="5"/>
    <circle cx="100" cy="200" r="50" fill="none" stroke="#999" stroke-width="1"/>
    <g stroke="#777" stroke-width="1.5">
      <line x1="100" y1="150" x2="100" y2="250"/><line x1="50" y1="200" x2="150" y2="200"/>
      <line x1="64.6" y1="164.6" x2="135.4" y2="235.4"/><line x1="135.4" y1="164.6" x2="64.6" y2="235.4"/>
      <line x1="75" y1="156.7" x2="125" y2="243.3"/><line x1="125" y1="156.7" x2="75" y2="243.3"/>
    </g>
    <circle cx="100" cy="200" r="6" fill="#333"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 200" to="360 100 200" dur="1s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="300" cy="200" r="55" fill="none" stroke="#222" stroke-width="5"/>
    <circle cx="300" cy="200" r="50" fill="none" stroke="#999" stroke-width="1"/>
    <g stroke="#777" stroke-width="1.5">
      <line x1="300" y1="150" x2="300" y2="250"/><line x1="250" y1="200" x2="350" y2="200"/>
      <line x1="264.6" y1="164.6" x2="335.4" y2="235.4"/><line x1="335.4" y1="164.6" x2="264.6" y2="235.4"/>
      <line x1="275" y1="156.7" x2="325" y2="243.3"/><line x1="325" y1="156.7" x2="275" y2="243.3"/>
    </g>
    <circle cx="300" cy="200" r="6" fill="#333"/>
    <animateTransform attributeName="transform" type="rotate" from="0 300 200" to="360 300 200" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- frame -->
  <g stroke="#c0392b" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="100" y1="200" x2="190" y2="205"/>
    <line x1="100" y1="200" x2="166" y2="125"/>
    <line x1="166" y1="125" x2="190" y2="205"/>
    <line x1="166" y1="128" x2="268" y2="134"/>
    <line x1="190" y1="205" x2="264" y2="150"/>
    <line x1="266" y1="126" x2="266" y2="154"/>
    <line x1="264" y1="150" x2="300" y2="200"/>
  </g>
  <g stroke="#222" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="266" y1="126" x2="262" y2="106"/>
    <path d="M262 106 L282 104 Q292 104 290 114"/>
    <line x1="166" y1="125" x2="164" y2="116"/>
  </g>
  <path d="M148 113 Q165 108 186 114 Q184 120 166 120 Q152 120 148 113Z" fill="#222"/>
  <circle cx="190" cy="205" r="8" fill="#555"/>

  <!-- near crank -->
  <g>
    <line x1="190" y1="205" x2="215" y2="205" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <rect x="207" y="202" width="16" height="6" rx="2" fill="#222"/>
    <animateTransform attributeName="transform" type="rotate" from="0 190 205" to="360 190 205" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- pelican tail and body -->
  <path d="M135 110 L108 120 L112 100 Z" fill="#5b4636"/>
  <ellipse cx="165" cy="102" rx="38" ry="24" fill="#7a6455" transform="rotate(-8 165 102)"/>
  <path d="M140 100 Q165 88 195 100" fill="none" stroke="#9c8676" stroke-width="3"/>
  <!-- neck -->
  <path d="M192 92 Q214 86 210 66 Q206 52 222 50" fill="none" stroke="#f4efe6" stroke-width="12" stroke-linecap="round"/>
  <path d="M188 88 Q206 80 200 66" fill="none" stroke="#4a3a2e" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <!-- head, bill -->
  <circle cx="226" cy="50" r="11" fill="#f7f2e8"/>
  <path d="M218 42 Q226 34 236 44 Q228 40 218 46Z" fill="#f2c94c"/>
  <path d="M234 46 L296 62 L234 58 Z" fill="#a89b86"/>
  <path d="M234 57 Q262 82 296 63 L234 58Z" fill="#d9b66b"/>
  <circle cx="230" cy="48" r="2.2" fill="#111"/>
  <!-- arm reaching handlebar -->
  <path d="M185 98 Q225 112 260 106" fill="none" stroke="#5b4636" stroke-width="9" stroke-linecap="round"/>

  <!-- near leg -->
  <polyline fill="none" stroke="#e0a030" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="172,125 223,146 215,205">
    <animate attributeName="points" dur="1.6s" repeatCount="indefinite" calcMode="linear"
      values="172,125 223,146 215,205;172,125 212,163 208,223;172,125 202,171 190,230;172,125 202,171 172,223;172,125 210,165 165,205;172,125 220,151 172,187;172,125 227,132 190,180;172,125 227,130 208,187;172,125 223,146 215,205"/>
  </polyline>
  <circle cx="172" cy="125" r="6" fill="#7a6455"/>
</svg>