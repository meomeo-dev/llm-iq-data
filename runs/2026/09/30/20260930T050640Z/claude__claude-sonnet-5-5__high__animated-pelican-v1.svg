<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc8f0"/>
      <stop offset="1" stop-color="#fdebd0"/>
    </linearGradient>
    <g id="wheel">
      <circle r="77" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="71" fill="none" stroke="#b8bcc2" stroke-width="2.5"/>
      <g stroke="#9aa0a6" stroke-width="1.2">
        <line x1="-71" x2="71"/>
        <line x1="-71" x2="71" transform="rotate(22.5)"/>
        <line x1="-71" x2="71" transform="rotate(45)"/>
        <line x1="-71" x2="71" transform="rotate(67.5)"/>
        <line x1="-71" x2="71" transform="rotate(90)"/>
        <line x1="-71" x2="71" transform="rotate(112.5)"/>
        <line x1="-71" x2="71" transform="rotate(135)"/>
        <line x1="-71" x2="71" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#666"/>
      <circle r="3" fill="#ddd"/>
      <circle cx="0" cy="-66" r="3.2" fill="#ff8a00"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="36" fill="#ffd35a"/>
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="900 0" to="-250 0" dur="40s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="80" rx="46" ry="14"/>
      <ellipse cx="28" cy="70" rx="30" ry="14"/>
      <ellipse cx="-26" cy="72" rx="26" ry="11"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="1100 0" to="-50 0" dur="60s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="140" rx="54" ry="15"/>
      <ellipse cx="30" cy="130" rx="34" ry="14"/>
      <ellipse cx="-30" cy="132" rx="28" ry="11"/>
    </g>
  </g>
  <path d="M0,320 L90,270 L170,310 L260,255 L360,315 L450,280 L560,318 L660,268 L800,320 L800,340 L0,340 Z" fill="#8fa9b8"/>
  <rect x="0" y="330" width="800" height="101" fill="#3f93b8"/>
  <rect x="0" y="330" width="800" height="6" fill="#7cc0dc"/>
  <rect x="0" y="431" width="800" height="69" fill="#d8c294"/>
  <rect x="0" y="431" width="800" height="34" fill="#55595e"/>
  <g fill="#f4f1e6">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="0.5s" repeatCount="indefinite"/>
    <rect x="0" y="446" width="70" height="5"/>
    <rect x="160" y="446" width="70" height="5"/>
    <rect x="320" y="446" width="70" height="5"/>
    <rect x="480" y="446" width="70" height="5"/>
    <rect x="640" y="446" width="70" height="5"/>
    <rect x="800" y="446" width="70" height="5"/>
    <rect x="960" y="446" width="70" height="5"/>
  </g>
  <ellipse cx="400" cy="433" rx="210" ry="6" fill="#000000" opacity="0.25"/>

  <!-- Wheels -->
  <g transform="translate(250 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.57s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.57s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>

  <!-- Far crank, pedal, foot (behind frame) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 400 360" to="540 400 360" dur="1.3s" repeatCount="indefinite"/>
    <line x1="400" y1="360" x2="360" y2="360" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 360 360" to="-540 360 360" dur="1.3s" repeatCount="indefinite"/>
      <rect x="348" y="358" width="24" height="5" rx="2" fill="#1c1c1c"/>
      <path d="M355,358 Q362,350 368,353 L379,357 Z" fill="#3a3a3a"/>
    </g>
  </g>

  <!-- Far leg -->
  <path d="M372,232 L429,299.1 L360,360" fill="none" stroke="#333333" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.3s" repeatCount="indefinite" values="M372,232 L429,299.1 L360,360;M372,232 L440.6,287.1 L365.4,340;M372,232 L452.2,268.3 L380,325.4;M372,232 L458.4,248.9 L400,320;M372,232 L459.4,242.2 L420,325.4;M372,232 L457.9,251 L434.6,340;M372,232 L451.9,268.8 L440,360;M372,232 L439.8,288.2 L434.6,380;M372,232 L424.4,302.7 L420,394.6;M372,232 L414.4,309.1 L400,400;M372,232 L414.2,309.2 L380,394.6;M372,232 L419.8,305.9 L365.4,380;M372,232 L429,299.1 L360,360"/>
  </path>

  <!-- Chain and rear cog -->
  <g stroke="#2a2a2a" stroke-width="2.5" fill="none">
    <line x1="400" y1="338" x2="250" y2="342"/>
    <line x1="400" y1="382" x2="250" y2="358"/>
    <circle cx="250" cy="350" r="8" stroke-dasharray="3 2"/>
  </g>

  <!-- Frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="250,350 400,360"/>
    <polyline points="250,350 368,250"/>
    <polyline points="400,360 368,250"/>
    <polyline points="368,250 510,242"/>
    <polyline points="400,360 517,265"/>
    <polyline points="508,238 520,268"/>
    <polyline points="516,262 550,350" stroke="#2a2a2a" stroke-width="6"/>
  </g>
  <g fill="none" stroke="#2a2a2a" stroke-linecap="round" stroke-linejoin="round">
    <line x1="366" y1="248" x2="364" y2="236" stroke-width="5"/>
    <polyline points="507,240 505,226 530,224 541,228 541,240" stroke-width="5"/>
  </g>
  <circle cx="400" cy="360" r="8" fill="#444"/>

  <!-- Saddle -->
  <path d="M336,238 Q340,228 366,231 L392,236 Q396,241 388,243 L342,245 Q333,245 336,238 Z" fill="#2b2b2b"/>

  <!-- Pelican tail and body -->
  <path d="M316,198 L258,240 L282,250 L326,222 Z" fill="#4e4034"/>
  <ellipse cx="360" cy="195" rx="62" ry="38" transform="rotate(-22 360 195)" fill="#7d6b58"/>
  <path d="M320,205 Q350,232 392,222" fill="none" stroke="#5e4c3c" stroke-width="3" stroke-linecap="round"/>
  <path d="M330,190 Q360,205 395,196" fill="none" stroke="#9a8770" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="372" cy="223" r="15" fill="#6d5c4b"/>

  <!-- Neck -->
  <path d="M383,172 C385,140 398,120 424,112" fill="none" stroke="#5b3a24" stroke-width="9" stroke-linecap="round"/>
  <path d="M396,182 C397,150 411,135 432,126" fill="none" stroke="#f3ecd8" stroke-width="20" stroke-linecap="round"/>

  <!-- Head and beak -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 415 150;2 415 150;-2 415 150" dur="0.65s" repeatCount="indefinite"/>
    <path d="M448,126 C475,132 505,146 524,148 C500,168 465,160 446,138 Z" fill="#a89a78"/>
    <path d="M446,110 C480,118 510,130 528,144 L524,148 C500,142 470,132 446,126 Z" fill="#cbbd99"/>
    <path d="M522,142 Q533,144 528,153 Q526,148 520,148 Z" fill="#6b5a3a"/>
    <circle cx="440" cy="121" r="16" fill="#f7f1e0"/>
    <ellipse cx="436" cy="109" rx="13" ry="6" fill="#f2d675" transform="rotate(-12 436 109)"/>
    <circle cx="447" cy="117" r="3" fill="#111"/>
    <circle cx="448" cy="116" r="0.9" fill="#fff"/>
  </g>

  <!-- Wing gripping handlebar -->
  <path d="M362,178 Q420,172 470,205 L530,222 L525,236 Q470,232 430,222 Q390,216 358,204 Z" fill="#8a7862"/>
  <path d="M400,190 Q440,196 470,212" fill="none" stroke="#5e4c3c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M420,200 Q450,208 478,220" fill="none" stroke="#5e4c3c" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="531" cy="227" rx="10" ry="6.5" fill="#3f3229"/>

  <!-- Near chainring and crank arm -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 360" to="360 400 360" dur="1.3s" repeatCount="indefinite"/>
    <circle cx="400" cy="360" r="22" fill="none" stroke="#3a3a3a" stroke-width="4" stroke-dasharray="4 2"/>
    <line x1="400" y1="360" x2="440" y2="360" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round"/>
  </g>
  <circle cx="400" cy="360" r="6" fill="#777"/>

  <!-- Near leg -->
  <path d="M372,232 L451.9,268.8 L440,360" fill="none" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.3s" repeatCount="indefinite" values="M372,232 L451.9,268.8 L440,360;M372,232 L439.8,288.2 L434.6,380;M372,232 L424.4,302.7 L420,394.6;M372,232 L414.4,309.1 L400,400;M372,232 L414.2,309.2 L380,394.6;M372,232 L419.8,305.9 L365.4,380;M372,232 L429,299.1 L360,360;M372,232 L440.6,287.1 L365.4,340;M372,232 L452.2,268.3 L380,325.4;M372,232 L458.4,248.9 L400,320;M372,232 L459.4,242.2 L420,325.4;M372,232 L457.9,251 L434.6,340;M372,232 L451.9,268.8 L440,360"/>
  </path>
  <circle cx="372" cy="230" r="10" fill="#6d5c4b"/>

  <!-- Near pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 360" to="360 400 360" dur="1.3s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 440 360" to="-360 440 360" dur="1.3s" repeatCount="indefinite"/>
      <rect x="428" y="358" width="24" height="5" rx="2" fill="#1c1c1c"/>
      <path d="M435,358 Q442,350 448,353 L459,357 Z" fill="#555555"/>
    </g>
  </g>
</svg>