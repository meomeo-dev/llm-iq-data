<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* Wheel rotation around axle centers */
      .rear-wheel-spin {
        transform-origin: 220px 420px;
        animation: spin-cw 1.6s linear infinite;
      }
      .front-wheel-spin {
        transform-origin: 660px 420px;
        animation: spin-cw 1.6s linear infinite;
      }
      @keyframes spin-cw {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Crankset rotation around bottom bracket (420px, 420px) */
      .crank-assembly {
        transform-origin: 420px 420px;
        animation: spin-cw 1.6s linear infinite;
      }

      /* Counter-rotate pedals so they stay horizontal */
      .pedal-counter-right {
        transform-origin: 470px 420px;
        animation: spin-ccw 1.6s linear infinite;
      }
      .pedal-counter-left {
        transform-origin: 370px 420px;
        animation: spin-ccw 1.6s linear infinite;
      }
      @keyframes spin-ccw {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }

      /* Leg animations synchronized with pedal revolute (T = 1.6s) */
      /* Right leg (near side) attached to right pedal: reaches forward/down at 0s */
      .right-thigh {
        transform-origin: 395px 290px;
        animation: right-thigh-anim 1.6s ease-in-out infinite;
      }
      .right-shin {
        transform-origin: 440px 345px;
        animation: right-shin-anim 1.6s ease-in-out infinite;
      }
      @keyframes right-thigh-anim {
        0%   { transform: rotate(16deg); }
        25%  { transform: rotate(26deg); }
        50%  { transform: rotate(10deg); }
        75%  { transform: rotate(-4deg); }
        100% { transform: rotate(16deg); }
      }
      @keyframes right-shin-anim {
        0%   { transform: rotate(-18deg); }
        25%  { transform: rotate(-38deg); }
        50%  { transform: rotate(-8deg); }
        75%  { transform: rotate(14deg); }
        100% { transform: rotate(-18deg); }
      }

      /* Left leg (far side) in exact opposite phase (offset 0.8s) */
      .left-thigh {
        transform-origin: 390px 288px;
        animation: left-thigh-anim 1.6s ease-in-out infinite;
      }
      .left-shin {
        transform-origin: 435px 343px;
        animation: left-shin-anim 1.6s ease-in-out infinite;
      }
      @keyframes left-thigh-anim {
        0%   { transform: rotate(10deg); }
        25%  { transform: rotate(-4deg); }
        50%  { transform: rotate(16deg); }
        75%  { transform: rotate(26deg); }
        100% { transform: rotate(10deg); }
      }
      @keyframes left-shin-anim {
        0%   { transform: rotate(-8deg); }
        25%  { transform: rotate(14deg); }
        50%  { transform: rotate(-18deg); }
        75%  { transform: rotate(-38deg); }
        100% { transform: rotate(-8deg); }
      }

      /* Gentle riding bob for pelican body & pouch */
      .rider-bob {
        animation: bob-anim 0.8s ease-in-out infinite alternate;
      }
      @keyframes bob-anim {
        0%   { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-4px) rotate(0.6deg); }
      }

      /* Subtle breeze on scarf and pouch */
      .flutter {
        animation: flutter-anim 0.4s ease-in-out infinite alternate;
        transform-origin: 510px 145px;
      }
      @keyframes flutter-anim {
        0%   { transform: rotate(-2deg); }
        100% { transform: rotate(3deg); }
      }

      /* Road dashes movement */
      .road-dashes {
        stroke-dasharray: 45 35;
        animation: road-run 0.7s linear infinite;
      }
      @keyframes road-run {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 80; }
      }
    ]]></style>

    <!-- Linear Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faebd7"/>
      <stop offset="45%" stop-color="#ffe4c4"/>
      <stop offset="75%" stop-color="#ffd8a8"/>
      <stop offset="100%" stop-color="#fed194"/>
    </linearGradient>

    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a7b9b"/>
      <stop offset="50%" stop-color="#216583"/>
      <stop offset="100%" stop-color="#184b61"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00a896"/>
      <stop offset="50%" stop-color="#028090"/>
      <stop offset="100%" stop-color="#056676"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6d6d6"/>
      <stop offset="50%" stop-color="#efefef"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e27b58"/>
      <stop offset="50%" stop-color="#cc5a36"/>
      <stop offset="100%" stop-color="#aa3a18"/>
    </linearGradient>

    <linearGradient id="billGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c99738"/>
      <stop offset="65%" stop-color="#e5b242"/>
      <stop offset="90%" stop-color="#9a3e25"/>
      <stop offset="100%" stop-color="#5a1e12"/>
    </linearGradient>

    <linearGradient id="pelicanBrown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e5446"/>
      <stop offset="50%" stop-color="#553f34"/>
      <stop offset="100%" stop-color="#3d2c24"/>
    </linearGradient>

    <!-- Wheel Definition (Axle at 0,0) -->
    <g id="spoked-wheel">
      <!-- Rubber Tire -->
      <circle cx="0" cy="0" r="94" fill="none" stroke="#262626" stroke-width="15"/>
      <circle cx="0" cy="0" r="99" fill="none" stroke="#171717" stroke-width="3"/>
      <!-- Metal Rim -->
      <circle cx="0" cy="0" r="86" fill="none" stroke="url(#rimGrad)" stroke-width="6"/>
      <!-- Inner Rim shadow -->
      <circle cx="0" cy="0" r="83" fill="none" stroke="#888888" stroke-width="1"/>
      <!-- Spokes (16 spokes: 8 cross diameters) -->
      <g stroke="#dcdcdc" stroke-width="1.6" opacity="0.85">
        <line x1="0" y1="-84" x2="0" y2="84"/>
        <line x1="-84" y1="0" x2="84" y2="0"/>
        <line x1="-59.4" y1="-59.4" x2="59.4" y2="59.4"/>
        <line x1="-59.4" y1="59.4" x2="59.4" y2="-59.4"/>
        <line x1="-77.6" y1="-32.1" x2="77.6" y2="32.1"/>
        <line x1="-32.1" y1="-77.6" x2="32.1" y2="77.6"/>
        <line x1="-77.6" y1="32.1" x2="77.6" y2="-32.1"/>
        <line x1="-32.1" y1="77.6" x2="32.1" y2="-77.6"/>
      </g>
      <!-- Hub -->
      <circle cx="0" cy="0" r="12" fill="#555555"/>
      <circle cx="0" cy="0" r="6" fill="#dddddd"/>
      <!-- Valve Stem -->
      <line x1="0" y1="-75" x2="0" y2="-84" stroke="#e0af22" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- BACKGROUND: Coastal California Beach Setting -->
  <rect x="0" y="0" width="900" height="430" fill="url(#skyGrad)"/>
  <!-- Distant Sun -->
  <circle cx="780" cy="110" r="60" fill="#fff7d6" opacity="0.6"/>
  <circle cx="780" cy="110" r="45" fill="#ffffff" opacity="0.75"/>
  <!-- Ocean Horizon -->
  <rect x="0" y="300" width="900" height="130" fill="url(#oceanGrad)"/>
  <!-- Soft Distant Headland / Cliffs -->
  <path d="M0 300 Q140 275 320 295 T640 300 L900 300 L900 330 L0 330 Z" fill="#698579" opacity="0.45"/>
  <path d="M0 320 Q200 310 450 325 T900 320 L900 345 L0 345 Z" fill="#1b4d63" opacity="0.7"/>

  <!-- Seaside Promenade & Ground -->
  <rect x="0" y="430" width="900" height="170" fill="#dfbe8c"/> <!-- Sandy shoulder -->
  <rect x="0" y="475" width="900" height="125" fill="#43494b"/> <!-- Asphalt Bike Path -->
  <!-- Curbside -->
  <line x1="0" y1="475" x2="900" y2="475" stroke="#b8a686" stroke-width="5"/>
  <!-- Animated Moving Dashed Center Line -->
  <line x1="0" y1="535" x2="900" y2="535" stroke="#ffd13b" stroke-width="6" class="road-dashes"/>

  <!-- Cast Shadows of Wheels and Pelican -->
  <ellipse cx="220" cy="522" rx="70" ry="12" fill="#2d3032" opacity="0.45"/>
  <ellipse cx="660" cy="522" rx="70" ry="12" fill="#2d3032" opacity="0.45"/>
  <ellipse cx="440" cy="524" rx="140" ry="16" fill="#2d3032" opacity="0.3"/>

  <!-- ==================== BICYCLE (FAR-SIDE ELEMENTS) ==================== -->
  <!-- Left/Far Pedal & Crank (180 deg out of phase with right pedal) -->
  <g class="crank-assembly">
    <!-- Left crank pointing backward/left at 0 deg phase: from (420,420) to (370,420) -->
    <line x1="420" y1="420" x2="370" y2="420" stroke="#777777" stroke-width="7" stroke-linecap="round"/>
    <!-- Left Pedal body (counter rotates) -->
    <g class="pedal-counter-left">
      <rect x="354" y="415" width="32" height="10" rx="3" fill="#222222"/>
      <rect x="358" y="417" width="24" height="6" rx="2" fill="#f39c12"/>
    </g>
  </g>

  <!-- LEFT / FAR-SIDE PELICAN LEG (behind bike frame & body) -->
  <g opacity="0.85">
    <!-- Left Thigh hinged at pelvis (390, 288) -->
    <g class="left-thigh">
      <path d="M390 288 L435 343" stroke="#4a372c" stroke-width="20" stroke-linecap="round"/>
      <!-- Left Shin hinged at knee (435, 343) -->
      <g class="left-shin">
        <path d="M435 343 L370 420" stroke="#525b62" stroke-width="10" stroke-linecap="round"/>
        <!-- Left Webbed Foot on Far Pedal -->
        <path d="M360 417 L385 417 L390 423 L355 423 Z" fill="#2f353b"/>
      </g>
    </g>
  </g>

  <!-- ==================== ROTATING WHEELS ==================== -->
  <!-- Rear Wheel at (220, 420) -->
  <g class="rear-wheel-spin">
    <use href="#spoked-wheel" x="220" y="420"/>
  </g>

  <!-- Front Wheel at (660, 420) -->
  <g class="front-wheel-spin">
    <use href="#spoked-wheel" x="660" y="420"/>
  </g>

  <!-- ==================== BICYCLE FRAMEWORK ==================== -->
  <!-- Bottom Bracket is at (420, 420) -->
  <!-- Rear Axle is at (220, 420) -->
  <!-- Front Axle is at (660, 420) -->
  <!-- Seat Junction / Lug is at (380, 285) -->
  <!-- Head Tube Top is at (590, 240), Bottom is at (610, 305) -->

  <!-- Rear Chainstay & Seatstay -->
  <line x1="220" y1="420" x2="420" y2="420" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round"/> <!-- Chain stay -->
  <line x1="220" y1="420" x2="380" y2="285" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/> <!-- Seat stay -->

  <!-- Rear Fender / Mudguard -->
  <path d="M180 420 A98 98 0 0 1 350 330" fill="none" stroke="#00a896" stroke-width="6" stroke-linecap="round"/>
  <!-- Fender stays -->
  <line x1="220" y1="420" x2="195" y2="350" stroke="#999999" stroke-width="2.5"/>
  <line x1="220" y1="420" x2="270" y2="330" stroke="#999999" stroke-width="2.5"/>

  <!-- Drive Chain -->
  <path d="M220 420 L420 406 M420 434 L220 420" stroke="#333333" stroke-width="4.5" stroke-dasharray="6 3"/>

  <!-- Main Diamond Frame Tubes -->
  <line x1="420" y1="420" x2="380" y2="285" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/> <!-- Seat tube -->
  <line x1="420" y1="420" x2="605" y2="295" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/> <!-- Down tube -->
  <line x1="380" y1="285" x2="590" y2="245" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/> <!-- Top tube -->

  <!-- Head Tube -->
  <line x1="590" y1="240" x2="612" y2="310" stroke="url(#frameGrad)" stroke-width="15" stroke-linecap="round"/>

  <!-- Front Fork from Headtube Bottom to Front Axle -->
  <line x1="612" y1="310" x2="660" y2="420" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round"/>
  <!-- Front Fender / Mudguard -->
  <path d="M585 365 A98 98 0 0 1 680 340" fill="none" stroke="#00a896" stroke-width="6" stroke-linecap="round"/>

  <!-- Seat Post & Saddle -->
  <line x1="380" y1="285" x2="372" y2="245" stroke="#cccccc" stroke-width="10" stroke-linecap="round"/>
  <!-- Saddle: Anatomical Touring Leather Seat -->
  <path d="M335 242 Q370 236 405 244 Q410 248 395 251 Q370 248 340 252 C332 252 330 245 335 242 Z" fill="#3a1e12"/>
  <path d="M336 244 Q370 239 400 246" stroke="#25120a" stroke-width="2" fill="none"/>
  <circle cx="345" cy="248" r="1.5" fill="#c49a45"/>
  <circle cx="355" cy="247" r="1.5" fill="#c49a45"/>

  <!-- Stem & Cruiser Handlebars -->
  <line x1="590" y1="240" x2="585" y2="200" stroke="#cccccc" stroke-width="10" stroke-linecap="round"/> <!-- Quill Stem -->
  <path d="M585 200 Q595 195 605 200 Q615 210 575 220" fill="none" stroke="#dcdcdc" stroke-width="8" stroke-linecap="round"/> <!-- Handlebar curve -->
  <!-- Handgrips -->
  <line x1="570" y1="221" x2="555" y2="223" stroke="#3a1e12" stroke-width="9" stroke-linecap="round"/>
  <!-- Vintage Brass Bell -->
  <circle cx="598" cy="194" r="7" fill="#d4af37"/>
  <path d="M598 194 L592 188" stroke="#aa820a" stroke-width="2"/>

  <!-- ==================== PELICAN RIDER ==================== -->
  <g class="rider-bob">
    <!-- Tail Feathers -->
    <path d="M335 255 Q305 260 290 280 Q320 278 350 270 Z" fill="#3c2c23"/>
    <path d="M330 262 Q295 272 282 292 Q315 288 345 277 Z" fill="#2d1f18"/>

    <!-- Brown Pelican Torso / Body -->
    <!-- California brown pelicans have silver-grey barred mantle, dark chestnut underparts -->
    <path d="M350 250 C335 200 375 160 435 170 C480 178 500 220 480 275 C460 315 390 315 350 250 Z" fill="url(#pelicanBrown)"/>

    <!-- Wing Layers (Detailed feather striations) -->
    <path d="M360 225 C390 190 460 195 470 240 C455 275 405 285 360 225 Z" fill="#7d6a5d" stroke="#3c2c23" stroke-width="1.5"/>
    <path d="M375 240 C410 215 455 220 460 255 C445 280 405 285 375 240 Z" fill="#918174"/>
    <!-- Wing primary feather tips -->
    <path d="M360 255 L320 290 Q345 285 365 265 Z" fill="#2a1d17"/>
    <path d="M370 262 L332 300 Q355 292 375 270 Z" fill="#201510"/>

    <!-- Pelican S-Curved Neck -->
    <!-- White sides and chestnut nape for breeding season California Brown Pelican -->
    <path d="M435 175 C450 145 470 115 500 110 C525 105 535 125 515 145 C495 165 475 185 465 210 Z" fill="#e8ded1"/>
    <!-- Chestnut/Mahogany back of the neck -->
    <path d="M435 175 C445 148 465 120 495 110 C480 125 460 160 455 190 Z" fill="#4d1f14"/>

    <!-- Pelican Head -->
    <!-- Pale yellow crown -->
    <ellipse cx="515" cy="105" rx="22" ry="16" fill="#f4e5a9" transform="rotate(-8 515 105)"/>
    <path d="M500 115 Q520 85 538 108 Z" fill="#faecc2"/>

    <!-- Intelligent Pelican Eye -->
    <circle cx="524" cy="103" r="5.5" fill="#f5f5f5"/>
    <circle cx="525" cy="103" r="3.2" fill="#0881a3"/> <!-- California brown pelicans have lovely pale blue/hazel eyes -->
    <circle cx="525" cy="103" r="1.6" fill="#090909"/>
    <circle cx="526" cy="101" r="0.8" fill="#ffffff"/> <!-- Sparkle -->

    <!-- Giant Bill & Distinctive Throat Pouch -->
    <!-- Upper Bill / Culmen -->
    <path d="M530 102 L685 130 C690 131 692 135 685 137 L532 120 Z" fill="url(#billGrad)"/>
    <!-- Bill Hook (Nail) at tip -->
    <path d="M685 130 Q693 133 688 141 Q683 140 684 133 Z" fill="#3a0e05"/>
    <!-- Distal ridge line -->
    <line x1="535" y1="108" x2="680" y2="133" stroke="#e08e28" stroke-width="1.5"/>

    <!-- Expandable Pouch (Gular Sac) -->
    <g class="flutter">
      <!-- Pouch stretching from lower bill back along the throat -->
      <path d="M532 120 Q610 132 682 137 C650 185 580 205 512 145 Z" fill="url(#pouchGrad)" opacity="0.94"/>
      <!-- Vascular & Texture striations on pouch -->
      <path d="M545 135 Q590 160 635 145" fill="none" stroke="#90260e" stroke-width="1.2" opacity="0.6"/>
      <path d="M530 130 Q575 168 620 148" fill="none" stroke="#90260e" stroke-width="1.2" opacity="0.6"/>
      <path d="M525 140 Q565 178 600 152" fill="none" stroke="#90260e" stroke-width="1.2" opacity="0.6"/>
    </g>

    <!-- Jaunty Red Cycling Scarf -->
    <path d="M470 155 Q490 140 515 150 Q485 170 470 155 Z" fill="#d90429"/>
    <!-- Scarf Tails blowing backwards in wind -->
    <path d="M472 156 Q445 150 425 158 Q440 168 470 162 Z" fill="#ef233c"/>
    <path d="M472 160 Q450 165 435 180 Q450 182 471 166 Z" fill="#d90429"/>

    <!-- Pelican Arms / Wings gripping the handlebar -->
    <!-- Upper arm from shoulder to elbow -->
    <path d="M440 205 Q495 200 520 225" stroke="#5d4638" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Forearm leading directly to handlebar grip at (562, 222) -->
    <path d="M520 225 L565 222" stroke="#4c382c" stroke-width="13" stroke-linecap="round" fill="none"/>
    <!-- Wing Feather 'Fingers' curled naturally over the handlebars -->
    <path d="M558 215 Q568 213 572 222 Q566 229 556 226 Z" fill="#2d1f18"/>
    <path d="M562 216 Q572 215 575 224 Q568 230 560 227 Z" fill="#1b120d"/>
  </g>

  <!-- ==================== FOREGROUND: CRANKSET & RIGHT LEG ==================== -->
  <!-- Bottom Bracket Housing & Chainring (420, 420) -->
  <circle cx="420" cy="420" r="30" fill="#1b1b1b" stroke="#777777" stroke-width="2"/>
  <!-- Chainring teeth / cutouts -->
  <circle cx="420" cy="420" r="23" fill="none" stroke="#aaaaaa" stroke-width="5" stroke-dasharray="7 5"/>
  <circle cx="420" cy="420" r="14" fill="#333333"/>

  <!-- Rotating Crank Assembly (Right/Near side) -->
  <g class="crank-assembly">
    <!-- Right crank arm pointing forward/right: from (420,420) to (470,420) -->
    <line x1="420" y1="420" x2="470" y2="420" stroke="#cccccc" stroke-width="8" stroke-linecap="round"/>
    <circle cx="420" cy="420" r="7" fill="#ffffff"/>
    <circle cx="470" cy="420" r="4.5" fill="#555555"/>

    <!-- Right Pedal (counter rotates so it stays level) -->
    <g class="pedal-counter-right">
      <rect x="454" y="415" width="32" height="10" rx="3" fill="#111111"/>
      <rect x="458" y="417" width="24" height="6" rx="2" fill="#f39c12"/>
      <!-- Small pedal reflector -->
      <line x1="460" y1="420" x2="480" y2="420" stroke="#ffffff" stroke-width="1.5"/>
    </g>
  </g>

  <!-- RIGHT / FOREGROUND PELICAN LEG (Articulated & animated in sync) -->
  <!-- Hip joint located at (395, 290) -->
  <g class="right-thigh">
    <!-- Thigh Segment -->
    <path d="M395 290 L440 345" stroke="#5d4638" stroke-width="22" stroke-linecap="round"/>
    <path d="M395 290 L440 345" stroke="#755a49" stroke-width="14" stroke-linecap="round"/>

    <!-- Knee Joint & Shin Segment -->
    <g class="right-shin">
      <!-- Dark slate bird shin/tarsus -->
      <path d="M440 345 L470 420" stroke="#363d44" stroke-width="11" stroke-linecap="round"/>
      <circle cx="440" cy="345" r="7" fill="#464e56"/>

      <!-- Large Webbed Pelican Foot resting firmly on the right pedal -->
      <path d="M455 416 L490 415 L496 422 L450 422 Z" fill="#1f2327"/>
      <!-- Webbing and Claws -->
      <path d="M465 416 L494 419" stroke="#101214" stroke-width="1.8"/>
      <path d="M460 419 L492 422" stroke="#101214" stroke-width="1.8"/>
      <!-- Claws gripping front of pedal -->
      <path d="M495 417 L499 420 L494 423" fill="#08090a"/>
    </g>
  </g>

  <!-- Front Headlight Mounted on Headtube -->
  <path d="M608 265 L622 258 L622 276 Z" fill="#333333"/>
  <ellipse cx="622" cy="267" rx="3" ry="8" fill="#fff7d6"/>
  <!-- Light Beam effect -->
  <polygon points="625,267 780,240 780,310 625,270" fill="#ffffdd" opacity="0.18"/>
</svg>