<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F4FF"/>
    </radialGradient>
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="100%" stop-color="#444"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#skyGrad)"/>

  <!-- Ground -->
  <rect x="0" y="330" width="500" height="70" fill="#8BC34A"/>
  <rect x="0" y="330" width="500" height="8" fill="#6A9E3A"/>

  <!-- ===================== BICYCLE ===================== -->

  <!-- Rear Wheel -->
  <circle cx="165" cy="305" r="62" fill="none" stroke="#333" stroke-width="8"/>
  <circle cx="165" cy="305" r="10" fill="#555"/>
  <!-- Spokes rear -->
  <line x1="165" y1="243" x2="165" y2="367" stroke="#666" stroke-width="2.5"/>
  <line x1="103" y1="305" x2="227" y2="305" stroke="#666" stroke-width="2.5"/>
  <line x1="121" y1="261" x2="209" y2="349" stroke="#666" stroke-width="2.5"/>
  <line x1="209" y1="261" x2="121" y2="349" stroke="#666" stroke-width="2.5"/>
  <line x1="103" y1="283" x2="227" y2="327" stroke="#666" stroke-width="2"/>
  <line x1="103" y1="327" x2="227" y2="283" stroke="#666" stroke-width="2"/>

  <!-- Front Wheel -->
  <circle cx="335" cy="305" r="62" fill="none" stroke="#333" stroke-width="8"/>
  <circle cx="335" cy="305" r="10" fill="#555"/>
  <!-- Spokes front -->
  <line x1="335" y1="243" x2="335" y2="367" stroke="#666" stroke-width="2.5"/>
  <line x1="273" y1="305" x2="397" y2="305" stroke="#666" stroke-width="2.5"/>
  <line x1="291" y1="261" x2="379" y2="349" stroke="#666" stroke-width="2.5"/>
  <line x1="379" y1="261" x2="291" y2="349" stroke="#666" stroke-width="2.5"/>
  <line x1="273" y1="283" x2="397" y2="327" stroke="#666" stroke-width="2"/>
  <line x1="273" y1="327" x2="397" y2="283" stroke="#666" stroke-width="2"/>

  <!-- Chain ring -->
  <circle cx="240" cy="305" r="22" fill="none" stroke="#888" stroke-width="5"/>
  <circle cx="240" cy="305" r="6" fill="#888"/>

  <!-- Chain (simplified) -->
  <path d="M240 283 Q290 270 335 295" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="5,3"/>

  <!-- Frame: bottom bracket to rear dropout -->
  <line x1="240" y1="305" x2="165" y2="305" stroke="#C0392B" stroke-width="7" stroke-linecap="round"/>
  <!-- Frame: seat tube -->
  <line x1="240" y1="305" x2="220" y2="210" stroke="#C0392B" stroke-width="7" stroke-linecap="round"/>
  <!-- Frame: top tube -->
  <line x1="220" y1="210" x2="305" y2="218" stroke="#C0392B" stroke-width="7" stroke-linecap="round"/>
  <!-- Frame: down tube -->
  <line x1="240" y1="305" x2="305" y2="218" stroke="#E74C3C" stroke-width="6" stroke-linecap="round"/>
  <!-- Frame: chain stay -->
  <line x1="240" y1="305" x2="165" y2="305" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>
  <!-- Frame: seat stay -->
  <line x1="220" y1="210" x2="165" y2="305" stroke="#E74C3C" stroke-width="5" stroke-linecap="round"/>
  <!-- Frame: fork -->
  <line x1="305" y1="218" x2="335" y2="305" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>

  <!-- Seat post -->
  <line x1="220" y1="210" x2="215" y2="185" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="215" cy="182" rx="28" ry="7" fill="#333"/>

  <!-- Handlebar stem -->
  <line x1="305" y1="218" x2="312" y2="195" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebar -->
  <path d="M300 192 Q312 188 322 195" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round"/>

  <!-- Pedals (crank) -->
  <line x1="240" y1="305" x2="256" y2="323" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <rect x="252" y="323" width="18" height="6" rx="2" fill="#555" transform="rotate(-10 261 326)"/>
  <line x1="240" y1="305" x2="224" y2="287" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <rect x="210" y="281" width="18" height="6" rx="2" fill="#555" transform="rotate(-10 219 284)"/>

  <!-- ===================== PELICAN ===================== -->

  <!-- Body -->
  <ellipse cx="240" cy="195" rx="48" ry="32" fill="white" stroke="#ddd" stroke-width="1.5"/>

  <!-- Wing (left/back) -->
  <path d="M200 198 Q170 175 155 190 Q165 215 200 210 Z" fill="#c8d8e8" stroke="#aac" stroke-width="1"/>

  <!-- Wing (right/front) slightly visible -->
  <path d="M278 195 Q300 175 315 185 Q310 210 280 208 Z" fill="#d8e8f5" stroke="#aac" stroke-width="1"/>

  <!-- Tail feathers -->
  <path d="M192 212 Q175 230 168 240 Q180 238 192 228 Q200 240 202 248 Q210 235 205 220 Z" fill="white" stroke="#ccc" stroke-width="1"/>

  <!-- Neck -->
  <path d="M272 178 Q285 155 280 130 Q275 115 265 110" fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M272 178 Q285 155 280 130 Q275 115 265 110" fill="none" stroke="#ddd" stroke-width="18" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="262" cy="105" r="24" fill="white" stroke="#ddd" stroke-width="1.5"/>

  <!-- Eye -->
  <circle cx="272" cy="100" r="6" fill="#FFD700" stroke="#333" stroke-width="1.5"/>
  <circle cx="274" cy="99" r="3" fill="#111"/>
  <circle cx="275" cy="98" r="1" fill="white"/>

  <!-- Beak (upper mandible - long pelican beak) -->
  <path d="M280 108 Q310 112 340 118 Q345 122 340 126 Q310 124 280 120 Z" fill="#F4A836" stroke="#D4881A" stroke-width="1"/>

  <!-- Beak pouch -->
  <path d="M282 120 Q310 124 340 126 Q344 132 338 138 Q308 135 282 128 Z" fill="#F4C068" stroke="#D4881A" stroke-width="1"/>

  <!-- Beak tip hook -->
  <path d="M340 118 Q350 120 348 128 Q345 134 338 138" fill="none" stroke="#D4881A" stroke-width="2" stroke-linecap="round"/>

  <!-- Nostril -->
  <ellipse cx="308" cy="113" rx="5" ry="2" fill="#D4881A" opacity="0.5"/>

  <!-- Head stripe / cap -->
  <path d="M248 88 Q262 78 276 85 Q278 92 275 98 Q262 94 249 97 Z" fill="#c8d8e8" opacity="0.6"/>

  <!-- Feet / Legs on pedals -->
  <!-- Left leg -->
  <path d="M210 218 Q205 250 224 287" fill="none" stroke="#F4A836" stroke-width="5" stroke-linecap="round"/>
  <!-- Left foot -->
  <ellipse cx="222" cy="289" rx="12" ry="5" fill="#F4A836" stroke="#D4881A" stroke-width="1" transform="rotate(-20 222 289)"/>

  <!-- Right leg -->
  <path d="M250 220 Q255 255 256 325" fill="none" stroke="#F4A836" stroke-width="5" stroke-linecap="round"/>
  <!-- Right foot -->
  <ellipse cx="257" cy="327" rx="12" ry="5" fill="#F4A836" stroke="#D4881A" stroke-width="1" transform="rotate(10 257 327)"/>

  <!-- Wing detail lines -->
  <path d="M205 202 Q185 198 162 195" fill="none" stroke="#aab8cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M205 207 Q185 205 165 204" fill="none" stroke="#aab8cc" stroke-width="1" stroke-linecap="round"/>

  <!-- Motion lines (speed lines) -->
  <line x1="80" y1="255" x2="115" y2="255" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="68" y1="270" x2="110" y2="270" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="75" y1="285" x2="112" y2="285" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Title text -->
  <text x="250" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#4a7a2a" font-style="italic">🚴 Pedro the Pelican</text>
</svg>