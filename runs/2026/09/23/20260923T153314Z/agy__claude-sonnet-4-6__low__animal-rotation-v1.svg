<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F4FF;stop-opacity:1" />
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7EC850;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A9E38;stop-opacity:1" />
    </linearGradient>
    <!-- Wheel gradient -->
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#222;stop-opacity:1" />
    </radialGradient>
    <!-- Pangolin body gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8A96E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A07840;stop-opacity:1" />
    </linearGradient>
    <!-- Scale color -->
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6230;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B4820;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#sky)" />

  <!-- Sun -->
  <circle cx="530" cy="60" r="40" fill="#FFE066" opacity="0.9"/>
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="3" opacity="0.7">
    <line x1="530" y1="10" x2="530" y2="0"/>
    <line x1="530" y1="110" x2="530" y2="120"/>
    <line x1="480" y1="60" x2="470" y2="60"/>
    <line x1="580" y1="60" x2="590" y2="60"/>
    <line x1="494" y1="24" x2="487" y2="17"/>
    <line x1="566" y1="96" x2="573" y2="103"/>
    <line x1="566" y1="24" x2="573" y2="17"/>
    <line x1="494" y1="96" x2="487" y2="103"/>
  </g>

  <!-- Clouds -->
  <g fill="white" opacity="0.85">
    <ellipse cx="80" cy="70" rx="40" ry="20"/>
    <ellipse cx="110" cy="60" rx="35" ry="22"/>
    <ellipse cx="55" cy="65" rx="28" ry="16"/>
    <ellipse cx="250" cy="50" rx="35" ry="18"/>
    <ellipse cx="280" cy="42" rx="30" ry="20"/>
    <ellipse cx="225" cy="48" rx="25" ry="14"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="330" width="600" height="70" fill="url(#ground)" />
  <!-- Road -->
  <rect x="0" y="340" width="600" height="20" fill="#999" />
  <rect x="0" y="348" width="600" height="4" fill="#bbb" opacity="0.5"/>
  <!-- Road dashes -->
  <g fill="#FFE" opacity="0.8">
    <rect x="20" y="349" width="60" height="3" rx="1"/>
    <rect x="120" y="349" width="60" height="3" rx="1"/>
    <rect x="220" y="349" width="60" height="3" rx="1"/>
    <rect x="320" y="349" width="60" height="3" rx="1"/>
    <rect x="420" y="349" width="60" height="3" rx="1"/>
    <rect x="520" y="349" width="60" height="3" rx="1"/>
  </g>

  <!-- =========== BICYCLE =========== -->
  <!-- Wheel radius = 65, centers at y=275 -->

  <!-- Rear wheel spokes -->
  <g stroke="#555" stroke-width="1.5" opacity="0.7">
    <line x1="170" y1="275" x2="170" y2="210"/>
    <line x1="170" y1="275" x2="170" y2="340"/>
    <line x1="170" y1="275" x2="105" y2="275"/>
    <line x1="170" y1="275" x2="235" y2="275"/>
    <line x1="170" y1="275" x2="124" y2="229"/>
    <line x1="170" y1="275" x2="216" y2="321"/>
    <line x1="170" y1="275" x2="216" y2="229"/>
    <line x1="170" y1="275" x2="124" y2="321"/>
  </g>
  <!-- Rear wheel -->
  <circle cx="170" cy="275" r="65" fill="none" stroke="#222" stroke-width="8"/>
  <circle cx="170" cy="275" r="5" fill="#555"/>
  <!-- Rear tire highlight -->
  <circle cx="170" cy="275" r="65" fill="none" stroke="#555" stroke-width="2" opacity="0.3"/>

  <!-- Front wheel spokes -->
  <g stroke="#555" stroke-width="1.5" opacity="0.7">
    <line x1="390" y1="275" x2="390" y2="210"/>
    <line x1="390" y1="275" x2="390" y2="340"/>
    <line x1="390" y1="275" x2="325" y2="275"/>
    <line x1="390" y1="275" x2="455" y2="275"/>
    <line x1="390" y1="275" x2="344" y2="229"/>
    <line x1="390" y1="275" x2="436" y2="321"/>
    <line x1="390" y1="275" x2="436" y2="229"/>
    <line x1="390" y1="275" x2="344" y2="321"/>
  </g>
  <!-- Front wheel -->
  <circle cx="390" cy="275" r="65" fill="none" stroke="#222" stroke-width="8"/>
  <circle cx="390" cy="275" r="5" fill="#555"/>
  <circle cx="390" cy="275" r="65" fill="none" stroke="#555" stroke-width="2" opacity="0.3"/>

  <!-- Bicycle frame -->
  <!-- Chain stay (rear axle to bottom bracket) -->
  <line x1="170" y1="275" x2="280" y2="255" stroke="#E03030" stroke-width="6" stroke-linecap="round"/>
  <!-- Seat stay -->
  <line x1="170" y1="275" x2="255" y2="190" stroke="#E03030" stroke-width="5" stroke-linecap="round"/>
  <!-- Seat tube -->
  <line x1="255" y1="190" x2="280" y2="255" stroke="#E03030" stroke-width="7" stroke-linecap="round"/>
  <!-- Down tube (BB to head tube) -->
  <line x1="280" y1="255" x2="360" y2="200" stroke="#E03030" stroke-width="7" stroke-linecap="round"/>
  <!-- Top tube -->
  <line x1="255" y1="190" x2="360" y2="200" stroke="#E03030" stroke-width="6" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="360" y1="200" x2="390" y2="275" stroke="#E03030" stroke-width="6" stroke-linecap="round"/>
  <!-- Head tube -->
  <line x1="355" y1="195" x2="370" y2="210" stroke="#C02020" stroke-width="9" stroke-linecap="round"/>

  <!-- Bottom bracket -->
  <circle cx="280" cy="255" r="10" fill="#C02020"/>
  <!-- Crank arm -->
  <line x1="280" y1="255" x2="300" y2="275" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <line x1="280" y1="255" x2="260" y2="235" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <!-- Pedals -->
  <rect x="295" y="273" width="20" height="6" rx="2" fill="#444"/>
  <rect x="243" y="230" width="20" height="6" rx="2" fill="#444"/>

  <!-- Chain ring -->
  <circle cx="280" cy="255" r="22" fill="none" stroke="#888" stroke-width="3"/>

  <!-- Handlebar stem -->
  <line x1="362" y1="198" x2="362" y2="175" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <!-- Handlebars -->
  <line x1="340" y1="175" x2="385" y2="175" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <!-- Handlebar grips -->
  <circle cx="340" cy="175" r="6" fill="#333"/>
  <circle cx="385" cy="175" r="6" fill="#333"/>

  <!-- Seat post -->
  <line x1="255" y1="190" x2="252" y2="160" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="248" cy="158" rx="28" ry="9" fill="#333"/>
  <ellipse cx="248" cy="155" rx="28" ry="7" fill="#555"/>

  <!-- =========== PANGOLIN =========== -->

  <!-- Tail (curving behind) -->
  <path d="M 220 240 Q 185 260 175 290 Q 168 310 180 325 Q 190 335 200 320 Q 208 308 200 295 Q 195 282 205 275" 
        fill="none" stroke="url(#bodyGrad)" stroke-width="18" stroke-linecap="round"/>
  <!-- Tail scales pattern -->
  <path d="M 220 240 Q 185 260 175 290 Q 168 310 180 325 Q 190 335 200 320 Q 208 308 200 295 Q 195 282 205 275" 
        fill="none" stroke="url(#scaleGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="12 6"/>

  <!-- Body base -->
  <ellipse cx="262" cy="205" rx="58" ry="38" fill="url(#bodyGrad)"/>

  <!-- Scales on body (overlapping arc shapes) -->
  <!-- Row 1 (bottom) -->
  <path d="M 215 225 Q 228 208 242 222" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <path d="M 232 228 Q 245 211 259 225" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <path d="M 249 229 Q 262 212 276 226" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <path d="M 266 226 Q 279 209 293 223" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <path d="M 281 220 Q 294 203 308 217" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <!-- Row 2 -->
  <path d="M 218 211 Q 231 194 245 208" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <path d="M 235 214 Q 248 197 262 211" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <path d="M 252 215 Q 265 198 279 212" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <path d="M 268 211 Q 281 194 295 208" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <!-- Row 3 -->
  <path d="M 224 198 Q 237 181 251 195" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <path d="M 241 199 Q 254 182 268 196" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <path d="M 257 198 Q 270 181 284 195" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>

  <!-- Belly (lighter underside) -->
  <ellipse cx="248" cy="220" rx="28" ry="16" fill="#E8C888" opacity="0.6"/>

  <!-- Neck -->
  <path d="M 305 195 Q 325 180 335 175" stroke="url(#bodyGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Neck scales -->
  <path d="M 305 195 Q 325 180 335 175" stroke="url(#scaleGrad)" stroke-width="16" stroke-linecap="round" fill="none" stroke-dasharray="10 5"/>

  <!-- Head -->
  <ellipse cx="348" cy="168" rx="32" ry="22" fill="#C8A96E"/>
  <!-- Head scales -->
  <path d="M 320 162 Q 335 148 350 162" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>
  <path d="M 338 157 Q 353 143 368 157" fill="url(#scaleGrad)" stroke="#5A3010" stroke-width="1"/>

  <!-- Snout (long pointy) -->
  <path d="M 370 168 Q 400 165 420 162 Q 405 170 370 174 Z" fill="#B89058"/>
  <!-- Nostril -->
  <circle cx="416" cy="163" r="3" fill="#8B6030"/>

  <!-- Eye -->
  <circle cx="355" cy="162" r="6" fill="#1A1A1A"/>
  <circle cx="357" cy="160" r="2" fill="white" opacity="0.7"/>

  <!-- Ear nub -->
  <ellipse cx="342" cy="150" rx="7" ry="5" fill="#A07840" transform="rotate(-20, 342, 150)"/>

  <!-- Front right leg / arm (gripping handlebar) -->
  <!-- Upper arm -->
  <path d="M 305 195 Q 330 185 345 178" stroke="#A07840" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Forearm reaching to left handlebar -->
  <path d="M 345 178 Q 355 175 342 175" stroke="#A07840" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Paw/claws -->
  <path d="M 340 175 Q 335 170 332 175 Q 335 180 340 178" fill="#8B6030"/>
  <line x1="332" y1="172" x2="329" y2="168" stroke="#5A3010" stroke-width="2"/>
  <line x1="335" y1="170" x2="333" y2="165" stroke="#5A3010" stroke-width="2"/>
  <line x1="338" y1="169" x2="337" y2="164" stroke="#5A3010" stroke-width="2"/>

  <!-- Front left leg / arm (other handlebar) -->
  <path d="M 310 198 Q 350 190 375 178" stroke="#A07840" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M 375 178 Q 385 175 387 175" stroke="#A07840" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Paw -->
  <path d="M 385 175 Q 390 170 393 175 Q 390 180 385 178" fill="#8B6030"/>
  <line x1="393" y1="172" x2="396" y2="168" stroke="#5A3010" stroke-width="2"/>
  <line x1="390" y1="170" x2="392" y2="165" stroke="#5A3010" stroke-width="2"/>
  <line x1="387" y1="169" x2="388" y2="164" stroke="#5A3010" stroke-width="2"/>

  <!-- Hind leg (on pedal) -->
  <path d="M 240 235 Q 255 255 270 265 Q 285 272 298 275" stroke="#A07840" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- Hind foot -->
  <path d="M 295 275 Q 308 272 312 278 Q 305 283 295 280 Z" fill="#8B6030"/>
  <line x1="312" y1="276" x2="316" y2="271" stroke="#5A3010" stroke-width="2"/>
  <line x1="309" y1="273" x2="313" y2="268" stroke="#5A3010" stroke-width="2"/>

  <!-- Other hind leg (up on other pedal) -->
  <path d="M 232 232 Q 245 242 252 248 Q 258 252 260 238" stroke="#A07840" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 257 237 Q 265 232 268 238 Q 263 244 257 242 Z" fill="#8B6030"/>
  <line x1="268" y1="236" x2="272" y2="231" stroke="#5A3010" stroke-width="2"/>
  <line x1="265" y1="233" x2="268" y2="228" stroke="#5A3010" stroke-width="2"/>

  <!-- Helmet! -->
  <ellipse cx="348" cy="152" rx="34" ry="18" fill="#FF6B35"/>
  <!-- Helmet straps -->
  <path d="M 320 158 Q 318 165 322 170" stroke="#CC4A15" stroke-width="2" fill="none"/>
  <path d="M 376 158 Q 378 165 374 170" stroke="#CC4A15" stroke-width="2" fill="none"/>
  <!-- Helmet vent lines -->
  <line x1="330" y1="140" x2="328" y2="152" stroke="#CC4A15" stroke-width="2"/>
  <line x1="340" y1="137" x2="339" y2="150" stroke="#CC4A15" stroke-width="2"/>
  <line x1="350" y1="136" x2="350" y2="149" stroke="#CC4A15" stroke-width="2"/>
  <line x1="360" y1="137" x2="361" y2="150" stroke="#CC4A15" stroke-width="2"/>

  <!-- Speed lines -->
  <g stroke="#AADDFF" stroke-width="2" opacity="0.6" stroke-linecap="round">
    <line x1="60" y1="230" x2="100" y2="230"/>
    <line x1="40" y1="250" x2="95" y2="250"/>
    <line x1="55" y1="270" x2="100" y2="270"/>
    <line x1="70" y1="210" x2="105" y2="210"/>
  </g>

  <!-- Little butterfly decoration -->
  <g transform="translate(450, 120) rotate(-15)">
    <path d="M0,0 Q-15,-20 -25,-5 Q-15,5 0,0" fill="#FF99CC" opacity="0.8"/>
    <path d="M0,0 Q15,-20 25,-5 Q15,5 0,0" fill="#FF99CC" opacity="0.8"/>
    <path d="M0,0 Q-12,15 -20,5 Q-12,-2 0,0" fill="#FFBB44" opacity="0.8"/>
    <path d="M0,0 Q12,15 20,5 Q12,-2 0,0" fill="#FFBB44" opacity="0.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#444" stroke-width="1.5"/>
  </g>

  <!-- Title text -->
  <text x="300" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#444" font-style="italic">
    "Pangolin's Sunday Ride"
  </text>
</svg>