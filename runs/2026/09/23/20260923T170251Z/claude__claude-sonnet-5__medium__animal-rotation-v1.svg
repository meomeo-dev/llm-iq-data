<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="400" fill="#bfe8f5"/>
  <rect x="0" y="330" width="500" height="70" fill="#d9c98a"/>

  <!-- Bicycle -->
  <g stroke="#333" stroke-width="4" fill="none">
    <circle cx="160" cy="320" r="45"/>
    <circle cx="340" cy="320" r="45"/>
    <line x1="160" y1="320" x2="250" y2="240"/>
    <line x1="250" y1="240" x2="340" y2="320"/>
    <line x1="250" y1="240" x2="200" y2="320"/>
    <line x1="200" y1="320" x2="160" y2="320"/>
    <line x1="200" y1="320" x2="340" y2="320"/>
    <line x1="250" y1="240" x2="255" y2="200"/>
    <line x1="235" y1="200" x2="270" y2="200"/>
    <line x1="200" y1="320" x2="185" y2="280"/>
    <line x1="185" y1="280" x2="215" y2="270"/>
  </g>
  <circle cx="160" cy="320" r="4" fill="#333"/>
  <circle cx="340" cy="320" r="4" fill="#333"/>
  <circle cx="250" cy="240" r="4" fill="#333"/>

  <!-- pedal -->
  <line x1="200" y1="320" x2="215" y2="335" stroke="#333" stroke-width="4"/>
  <circle cx="215" cy="335" r="6" fill="#333"/>

  <!-- Flamingo -->
  <g>
    <!-- back leg -->
    <path d="M 220 300 Q 210 330 200 335" stroke="#e8578a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="240" cy="240" rx="55" ry="38" fill="#ff8fb3"/>
    <!-- wing detail -->
    <path d="M 210 225 Q 245 215 270 235 Q 245 250 210 245 Z" fill="#ff6fa0"/>
    <!-- front leg (on pedal) -->
    <path d="M 225 275 Q 218 305 215 333" stroke="#e8578a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- tail feathers -->
    <path d="M 290 235 Q 320 225 330 210" stroke="#ff8fb3" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- neck -->
    <path d="M 200 215 Q 175 170 195 130 Q 205 110 190 95" stroke="#ff8fb3" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="188" cy="90" r="16" fill="#ff8fb3"/>
    <!-- beak -->
    <path d="M 175 88 Q 150 92 148 98 Q 152 102 176 100 Z" fill="#333"/>
    <path d="M 175 88 Q 150 92 148 98" fill="none" stroke="#222" stroke-width="1"/>
    <circle cx="150" cy="93" r="1.5" fill="#fff"/>
    <!-- eye -->
    <circle cx="192" cy="85" r="2.5" fill="#222"/>
    <!-- arm/wing holding handlebar -->
    <path d="M 215 235 Q 215 260 255 205" stroke="#ff6fa0" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- handlebar grip under flamingo wing -->
  <circle cx="255" cy="200" r="5" fill="#555"/>

  <!-- ground shadow -->
  <ellipse cx="250" cy="368" rx="120" ry="10" fill="#00000022"/>
</svg>