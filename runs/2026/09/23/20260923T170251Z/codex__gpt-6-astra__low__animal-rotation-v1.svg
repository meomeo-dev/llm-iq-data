<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"
     viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">A flamingo riding a bicycle</title>
  <desc id="desc">
    A pink flamingo with a gracefully curved neck pedals a turquoise bicycle
    beneath a golden sun.
  </desc>

  <defs>
    <linearGradient id="bodyPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9bb5"/>
      <stop offset="1" stop-color="#ec5287"/>
    </linearGradient>
    <linearGradient id="wingPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f879a1"/>
      <stop offset="1" stop-color="#db3f75"/>
    </linearGradient>
  </defs>

  <!-- Warm afternoon backdrop -->
  <rect width="800" height="600" rx="28" fill="#fff7e9"/>
  <circle cx="636" cy="117" r="53" fill="#f7cf70"/>
  <path d="M98 471 Q390 449 703 473"
        fill="none" stroke="#e8dfcb" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="401" cy="477" rx="254" ry="16" fill="#ede4d2"/>

  <!-- Wheels -->
  <g fill="#fffaf0" stroke="#293d49" stroke-width="10">
    <circle cx="238" cy="382" r="91"/>
    <circle cx="558" cy="382" r="91"/>
  </g>
  <g fill="none" stroke="#a9c0be" stroke-width="2">
    <circle cx="238" cy="382" r="79"/>
    <circle cx="558" cy="382" r="79"/>
    <path d="M238 303V461 M159 382H317
             M182 326L294 438 M182 438L294 326
             M558 303V461 M479 382H637
             M502 326L614 438 M502 438L614 326"/>
  </g>

  <!-- Far leg and pedal -->
  <path d="M345 240 L414 283 L366 366"
        fill="none" stroke="#cb4b72" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M366 366 L390 371"
        fill="none" stroke="#cb4b72" stroke-width="10" stroke-linecap="round"/>
  <path d="M356 376H391" stroke="#293d49" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#269eaa" stroke-width="10"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 382 L323 286 L390 382 Z"/>
    <path d="M323 286 L503 286 L390 382"/>
    <path d="M503 286 L558 382"/>
    <path d="M323 286 L313 260"/>
    <path d="M503 286 L492 247"/>
  </g>
  <path d="M491 248 L484 222 L518 213 Q535 209 537 224"
        fill="none" stroke="#293d49" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M519 213 Q535 209 537 224"
        fill="none" stroke="#c78b59" stroke-width="10" stroke-linecap="round"/>
  <path d="M290 259 Q309 251 339 257"
        fill="none" stroke="#293d49" stroke-width="13" stroke-linecap="round"/>

  <!-- Hubs, chainring, and chain -->
  <g fill="#fff7e9" stroke="#293d49" stroke-width="5">
    <circle cx="238" cy="382" r="8"/>
    <circle cx="558" cy="382" r="8"/>
    <circle cx="390" cy="382" r="22"/>
  </g>
  <path d="M238 370 L389 359 M238 394 L390 405"
        stroke="#53666b" stroke-width="3" fill="none"/>
  <path d="M390 382 L423 405" stroke="#293d49"
        stroke-width="7" stroke-linecap="round"/>
  <path d="M408 409H444" stroke="#293d49" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Flamingo neck, curving up from its body -->
  <path d="M359 215
           C417 215 430 180 400 151
           C374 126 376 92 403 80
           C420 73 438 79 447 92"
        fill="none" stroke="#ed638e" stroke-width="29"
        stroke-linecap="round"/>
  <path d="M360 209
           C409 210 420 179 393 153
           C369 126 377 95 402 85"
        fill="none" stroke="#ffadc2" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Body and swept tail -->
  <path d="M287 197 L246 169 L259 204 L238 195
           Q257 232 302 246
           C329 264 376 250 388 225
           C397 205 371 184 340 185
           Q309 181 287 197Z"
        fill="url(#bodyPink)"/>
  <path d="M281 205
           C305 192 347 195 365 214
           C347 242 306 243 281 205Z"
        fill="url(#wingPink)"/>
  <g fill="none" stroke="#ffadc2" stroke-width="3" stroke-linecap="round">
    <path d="M299 208 Q321 224 346 217"/>
    <path d="M297 218 Q315 232 335 228"/>
  </g>

  <!-- Near leg: bent knee and foot resting on the pedal -->
  <path d="M331 244 L310 309 L427 397"
        fill="none" stroke="#ed7290" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="311" cy="309" r="7" fill="#e96186"/>
  <path d="M426 397 L438 403 L416 403"
        fill="none" stroke="#ed7290" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head and distinctive bent, black-tipped bill -->
  <ellipse cx="440" cy="92" rx="28" ry="22"
           transform="rotate(12 440 92)" fill="#ff9bb5"/>
  <path d="M459 91
           Q485 92 489 109
           L484 135
           Q469 126 467 112
           L453 106Z"
        fill="#ffe6cb"/>
  <path d="M470 116 L487 117 L484 135
           Q474 130 470 116Z"
        fill="#263944"/>
  <path d="M459 104 Q474 106 481 117"
        fill="none" stroke="#b3797f" stroke-width="2"/>
  <circle cx="446" cy="89" r="5.5" fill="#fff8ed"/>
  <circle cx="447" cy="89" r="3" fill="#263944"/>
  <circle cx="448" cy="88" r="1" fill="#ffffff"/>

  <!-- Small signs of motion -->
  <g fill="none" stroke="#d4bfa0" stroke-width="4" stroke-linecap="round">
    <path d="M109 343H145"/>
    <path d="M94 358H131"/>
    <path d="M117 373H134"/>
  </g>
  <g fill="#91aa83">
    <path d="M659 470 Q655 453 646 450 Q647 464 659 470Z"/>
    <path d="M660 470 Q664 448 675 444 Q674 461 660 470Z"/>
  </g>
</svg>