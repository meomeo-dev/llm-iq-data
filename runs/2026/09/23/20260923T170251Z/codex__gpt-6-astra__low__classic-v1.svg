    <circle cx="581" cy="489" r="99"/>
  </g>
  <g fill="none" stroke="#b3bfc0" stroke-width="2.5">
    <circle cx="231" cy="489" r="86"/>
    <circle cx="581" cy="489" r="86"/>
    <path d="M231 403v172m-86-86h172m-147-61 122 122m-122 0 122-122"/>
    <path d="M581 403v172m-86-86h172m-147-61 122 122m-122 0 122-122"/>
  </g>

