<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a long golden bill pedals a teal bicycle beside the sea.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#dff3f4"/>
      <stop offset="1" stop-color="#fff7e5"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd577"/>
      <stop offset="1" stop-color="#eea447"/>
    </linearGradient>
  </defs>

  <rect width="800" height="700" rx="32" fill="url(#sky)"/>
  <circle cx="652" cy="116" r="53" fill="#ffdc8a"/>
  <g fill="#fff" opacity=".8">
    <path d="M74 143c-4-21 20-35 37-24 6-33 56-34 67-4 25-10 48 8 43 28Z"/>
    <path d="M513 202c-2-16 16-27 30-19 9-26 46-24 52 1 19-7 38 5 36 18Z"/>
  </g>
  <path d="M0 448Q105 427 213 448T420 448T628 448T800 448V565H0Z" fill="#a6dadd"/>
  <g fill="none" stroke="#e8f6ef" stroke-width="4" stroke-linecap="round">
