    <path d="m231 489 94-155 67 155H231l128-121h164L392 489" stroke="#329a9c" stroke-width="8"/>
    <path d="m581 489-58-121-15-50" stroke="#254550" stroke-width="12"/>
    <path d="m581 489-58-121-15-50" stroke="#329a9c" stroke-width="7"/>
    <path d="m325 334-12-31" stroke="#53616a" stroke-width="9"/>
    <path d="m508 318-7-26h47q24 0 22 20" stroke="#53616a" stroke-width="8"/>
    <path d="M547 292h17q17 0 14 17" stroke="#293f48" stroke-width="11"/>
