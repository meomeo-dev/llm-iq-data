  <path d="m414 482-8 27 46 1q4-7-10-12l-14-5Z" fill="#f4bd4f" stroke="#384951" stroke-width="3" stroke-linejoin="round"/>
  <path d="m424 496 5 10m4-7 7 8" stroke="#ce8b35" stroke-width="2" stroke-linecap="round"/>

