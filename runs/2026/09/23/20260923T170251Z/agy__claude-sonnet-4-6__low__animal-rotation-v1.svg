<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <!-- Background -->
  <rect width="600" height="480" fill="white"/>

  <!-- Ground / path -->
  <ellipse cx="300" cy="430" rx="220" ry="18" fill="#4aada8" opacity="0.5"/>

  <!-- Small ground flowers -->
  <g transform="translate(80, 418)">
    <circle cx="0" cy="0" r="5" fill="#FF9AAE"/>
    <circle cx="0" cy="-9" r="4" fill="#FF6B8A"/>
    <line x1="0" y1="0" x2="0" y2="12" stroke="#4a7c4a" stroke-width="2"/>
  </g>
  <g transform="translate(490, 415)">
    <circle cx="0" cy="0" r="4" fill="#FFD166"/>
    <circle cx="0" cy="-8" r="3.5" fill="#FF9AAE"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#4a7c4a" stroke-width="2"/>
  </g>
  <g transform="translate(510, 420)">
    <circle cx="0" cy="0" r="3.5" fill="#6BC5F8"/>
    <line x1="0" y1="0" x2="0" y2="9" stroke="#4a7c4a" stroke-width="2"/>
  </g>

  <!-- Small sparkles -->
  <g fill="#FF9AAE" font-size="14">
    <text x="478" y="350">✦</text>
    <text x="110" y="360">✦</text>
  </g>

  <!-- === BICYCLE === -->

  <!-- Rear wheel -->
  <circle cx="195" cy="375" r="80" fill="none" stroke="#222" stroke-width="6"/>
  <circle cx="195" cy="375" r="70" fill="none" stroke="#E8873A" stroke-width="12"/>
  <circle cx="195" cy="375" r="12" fill="#555"/>
  <!-- Rear spokes -->
  <g stroke="#333" stroke-width="2">
    <line x1="195" y1="305" x2="195" y2="445"/>
    <line x1="125" y1="375" x2="265" y2="375"/>
    <line x1="146" y1="326" x2="244" y2="424"/>
    <line x1="244" y1="326" x2="146" y2="424"/>
    <line x1="130" y1="350" x2="260" y2="400"/>
    <line x1="130" y1="400" x2="260" y2="350"/>
    <line x1="165" y1="308" x2="225" y2="442"/>
    <line x1="225" y1="308" x2="165" y2="442"/>
  </g>

  <!-- Front wheel -->
  <circle cx="420" cy="375" r="80" fill="none" stroke="#222" stroke-width="6"/>
  <circle cx="420" cy="375" r="70" fill="none" stroke="#E8873A" stroke-width="12"/>
  <circle cx="420" cy="375" r="12" fill="#555"/>
  <!-- Front spokes -->
  <g stroke="#333" stroke-width="2">
    <line x1="420" y1="305" x2="420" y2="445"/>
    <line x1="350" y1="375" x2="490" y2="375"/>
    <line x1="371" y1="326" x2="469" y2="424"/>
    <line x1="469" y1="326" x2="371" y2="424"/>
    <line x1="355" y1="350" x2="485" y2="400"/>
    <line x1="355" y1="400" x2="485" y2="350"/>
    <line x1="390" y1="308" x2="450" y2="442"/>
    <line x1="450" y1="308" x2="390" y2="442"/>
  </g>

  <!-- Fenders -->
  <!-- Rear fender -->
  <path d="M 130,345 A 80,80 0 0 1 260,345" fill="none" stroke="#E8873A" stroke-width="10" stroke-linecap="round"/>
  <!-- Front fender -->
  <path d="M 355,345 A 80,80 0 0 1 485,345" fill="none" stroke="#E8873A" stroke-width="10" stroke-linecap="round"/>

  <!-- Bicycle frame -->
  <!-- Chain stay (rear axle to bottom bracket) -->
  <line x1="195" y1="375" x2="307" y2="375" stroke="#4aada8" stroke-width="9" stroke-linecap="round"/>
  <!-- Seat tube (bottom bracket to seat) -->
  <line x1="307" y1="375" x2="280" y2="290" stroke="#4aada8" stroke-width="9" stroke-linecap="round"/>
  <!-- Top tube / down tube (seat to head tube) -->
  <line x1="280" y1="290" x2="390" y2="290" stroke="#4aada8" stroke-width="9" stroke-linecap="round"/>
  <!-- Down tube (bottom bracket to head tube) -->
  <line x1="307" y1="375" x2="400" y2="300" stroke="#4aada8" stroke-width="9" stroke-linecap="round"/>
  <!-- Seat stay (rear axle to seat tube top) -->
  <line x1="195" y1="375" x2="280" y2="290" stroke="#4aada8" stroke-width="7" stroke-linecap="round"/>
  <!-- Fork (head tube to front axle) -->
  <line x1="400" y1="300" x2="420" y2="375" stroke="#4aada8" stroke-width="9" stroke-linecap="round"/>
  <!-- Head tube -->
  <rect x="393" y="290" width="16" height="35" rx="6" fill="#4aada8"/>

  <!-- Rear rack -->
  <rect x="180" y="268" width="90" height="10" rx="5" fill="#4aada8"/>
  <line x1="185" y1="278" x2="195" y2="290" stroke="#4aada8" stroke-width="6" stroke-linecap="round"/>
  <line x1="262" y1="278" x2="280" y2="290" stroke="#4aada8" stroke-width="6" stroke-linecap="round"/>

  <!-- Seat -->
  <ellipse cx="275" cy="285" rx="30" ry="10" fill="#8B4513"/>
  <rect x="271" y="285" width="8" height="12" rx="3" fill="#6B3410"/>

  <!-- Pedals & crank -->
  <circle cx="307" cy="375" r="14" fill="#666"/>
  <line x1="293" y1="380" x2="321" y2="370" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <rect x="280" y="378" width="13" height="6" rx="2" fill="#333"/>
  <rect x="318" y="366" width="13" height="6" rx="2" fill="#333"/>

  <!-- Chain -->
  <ellipse cx="260" cy="375" rx="55" ry="8" fill="none" stroke="#555" stroke-width="3" opacity="0.6"/>

  <!-- Handlebar stem -->
  <line x1="400" y1="295" x2="415" y2="265" stroke="#888" stroke-width="7" stroke-linecap="round"/>
  <!-- Handlebars -->
  <line x1="400" y1="265" x2="435" y2="265" stroke="#888" stroke-width="7" stroke-linecap="round"/>
  <!-- Bell -->
  <circle cx="427" cy="260" r="7" fill="#ccc" stroke="#888" stroke-width="2"/>

  <!-- === BASKET === -->
  <!-- Basket body -->
  <rect x="434" y="255" width="65" height="50" rx="5" fill="#C8912A"/>
  <!-- Basket weave lines -->
  <g stroke="#A07020" stroke-width="1.5" opacity="0.7">
    <line x1="434" y1="268" x2="499" y2="268"/>
    <line x1="434" y1="280" x2="499" y2="280"/>
    <line x1="434" y1="292" x2="499" y2="292"/>
    <line x1="448" y1="255" x2="448" y2="305"/>
    <line x1="461" y1="255" x2="461" y2="305"/>
    <line x1="474" y1="255" x2="474" y2="305"/>
    <line x1="487" y1="255" x2="487" y2="305"/>
  </g>
  <!-- Basket rim -->
  <rect x="430" y="252" width="73" height="10" rx="4" fill="#B07820" stroke="#8B6010" stroke-width="1"/>

  <!-- Flowers in basket -->
  <!-- Leaves -->
  <ellipse cx="450" cy="245" rx="12" ry="7" fill="#4a9a4a" transform="rotate(-20,450,245)"/>
  <ellipse cx="478" cy="240" rx="14" ry="7" fill="#5aaa5a" transform="rotate(10,478,240)"/>
  <ellipse cx="500" cy="247" rx="10" ry="6" fill="#4a9a4a" transform="rotate(-10,500,247)"/>
  <!-- Yellow flower -->
  <circle cx="456" cy="238" r="12" fill="#FFD166"/>
  <circle cx="456" cy="238" r="7" fill="#FF9900"/>
  <!-- Pink flower -->
  <circle cx="475" cy="232" r="10" fill="#FF9AAE"/>
  <circle cx="475" cy="232" r="6" fill="#FF6B8A"/>
  <!-- Blue flower -->
  <circle cx="492" cy="240" r="9" fill="#6BC5F8"/>
  <circle cx="492" cy="240" r="5" fill="#4AABF8"/>
  <!-- Small yellow flower -->
  <circle cx="463" cy="225" r="7" fill="#FFE566"/>
  <circle cx="463" cy="225" r="4" fill="#FFB900"/>

  <!-- === FLAMINGO === -->

  <!-- Flamingo legs -->
  <!-- Left leg (on pedal) -->
  <path d="M 270,285 Q 285,330 295,375" stroke="#F08080" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Right leg (on other pedal) -->
  <path d="M 278,290 Q 310,340 320,370" stroke="#F08080" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Feet on pedals -->
  <ellipse cx="296" cy="378" rx="16" ry="7" fill="#FF9090" transform="rotate(-10,296,378)"/>
  <ellipse cx="322" cy="372" rx="16" ry="7" fill="#FF9090" transform="rotate(10,322,372)"/>

  <!-- Flamingo body -->
  <ellipse cx="300" cy="260" rx="65" ry="55" fill="#F4A0A0"/>
  <!-- Wing feather detail -->
  <path d="M 250,270 Q 230,300 245,330 Q 265,310 270,280 Z" fill="#F08080"/>
  <path d="M 260,275 Q 240,305 252,330 Q 268,312 272,282 Z" fill="#F4A0A0"/>
  <!-- Body shading -->
  <ellipse cx="310" cy="255" rx="50" ry="42" fill="#F9B8B8" opacity="0.5"/>

  <!-- Flamingo neck -->
  <path d="M 330,220 Q 360,190 370,160 Q 375,130 360,110" stroke="#F4A0A0" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Neck highlight -->
  <path d="M 334,220 Q 364,190 373,160 Q 378,132 363,113" stroke="#F9C8C8" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Flamingo head -->
  <circle cx="355" cy="105" r="35" fill="#F4A0A0"/>
  <!-- Head highlight -->
  <circle cx="360" cy="98" r="22" fill="#F9C8C8" opacity="0.5"/>
  <!-- Eye -->
  <circle cx="372" cy="100" r="7" fill="#222"/>
  <circle cx="374" cy="98" r="3" fill="white"/>
  <!-- Cheek blush -->
  <circle cx="365" cy="110" r="8" fill="#FF8080" opacity="0.4"/>

  <!-- Beak -->
  <path d="M 385,105 Q 415,112 408,122 Q 395,128 382,118 Z" fill="#222"/>
  <path d="M 385,105 Q 415,112 410,116 Q 398,118 384,110 Z" fill="#F4A0A0"/>

  <!-- === FLOWER CROWN === -->
  <!-- Leaves in crown -->
  <ellipse cx="338" cy="75" rx="10" ry="6" fill="#4a9a4a" transform="rotate(-30,338,75)"/>
  <ellipse cx="368" cy="70" rx="10" ry="6" fill="#5aaa5a" transform="rotate(15,368,70)"/>
  <!-- Pink flower -->
  <circle cx="345" cy="72" r="9" fill="#FF9AAE"/>
  <circle cx="345" cy="72" r="5" fill="#FF6B8A"/>
  <!-- Yellow flower -->
  <circle cx="360" cy="68" r="8" fill="#FFD166"/>
  <circle cx="360" cy="68" r="4" fill="#FF9900"/>
  <!-- Blue accent -->
  <circle cx="373" cy="73" r="7" fill="#6BC5F8"/>
  <circle cx="373" cy="73" r="4" fill="#4AABF8"/>
  <!-- Small pink petals -->
  <circle cx="350" cy="64" r="5" fill="#FFB8C8"/>
  <circle cx="365" cy="62" r="4" fill="#FF9AAE"/>

  <!-- Rear light on bike -->
  <circle cx="180" cy="350" r="7" fill="#FF4444" opacity="0.9"/>
</svg>