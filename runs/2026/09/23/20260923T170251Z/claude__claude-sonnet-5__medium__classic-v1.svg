<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#bfe6f5"/>
  <rect x="0" y="280" width="500" height="70" fill="#9ad18a"/>

  <!-- bicycle wheels -->
  <circle cx="150" cy="270" r="45" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="330" cy="270" r="45" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="150" cy="270" r="5" fill="#333"/>
  <circle cx="330" cy="270" r="5" fill="#333"/>

  <!-- spokes -->
  <g stroke="#666" stroke-width="1.5">
    <line x1="150" y1="270" x2="150" y2="225"/>
    <line x1="150" y1="270" x2="150" y2="315"/>
    <line x1="150" y1="270" x2="105" y2="270"/>
    <line x1="150" y1="270" x2="195" y2="270"/>
    <line x1="150" y1="270" x2="182" y2="238"/>
    <line x1="150" y1="270" x2="118" y2="302"/>
    <line x1="150" y1="270" x2="182" y2="302"/>
    <line x1="150" y1="270" x2="118" y2="238"/>

    <line x1="330" y1="270" x2="330" y2="225"/>
    <line x1="330" y1="270" x2="330" y2="315"/>
    <line x1="330" y1="270" x2="285" y2="270"/>
    <line x1="330" y1="270" x2="375" y2="270"/>
    <line x1="330" y1="270" x2="362" y2="238"/>
    <line x1="330" y1="270" x2="298" y2="302"/>
    <line x1="330" y1="270" x2="362" y2="302"/>
    <line x1="330" y1="270" x2="298" y2="238"/>
  </g>

  <!-- bike frame -->
  <g stroke="#c0392b" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="150" y1="270" x2="235" y2="200"/>
    <line x1="235" y1="200" x2="330" y2="270"/>
    <line x1="235" y1="200" x2="270" y2="270"/>
    <line x1="270" y1="270" x2="330" y2="270"/>
    <line x1="235" y1="200" x2="225" y2="160"/>
    <line x1="150" y1="270" x2="270" y2="270"/>
  </g>

  <!-- seat -->
  <rect x="212" y="150" width="26" height="8" rx="3" fill="#333"/>
  <line x1="225" y1="158" x2="225" y2="185" stroke="#333" stroke-width="4"/>

  <!-- handlebar -->
  <line x1="270" y1="270" x2="290" y2="175" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <line x1="270" y1="160" x2="315" y2="160" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- pedal crank -->
  <circle cx="270" cy="270" r="8" fill="#444"/>
  <line x1="270" y1="270" x2="255" y2="295" stroke="#333" stroke-width="4"/>
  <line x1="270" y1="270" x2="285" y2="245" stroke="#333" stroke-width="4"/>

  <!-- pelican body -->
  <g>
    <!-- legs -->
    <line x1="255" y1="230" x2="252" y2="295" stroke="#e67e22" stroke-width="5"/>
    <line x1="280" y1="225" x2="283" y2="245" stroke="#e67e22" stroke-width="5"/>

    <!-- tail -->
    <path d="M 250 165 Q 220 175 210 160" fill="none" stroke="#f2f2f2" stroke-width="10" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="255" cy="150" rx="55" ry="42" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>

    <!-- wing -->
    <path d="M 235 120 Q 200 130 190 175 Q 225 165 250 145 Z" fill="#e0e0e0" stroke="#bbb" stroke-width="2"/>

    <!-- neck -->
    <path d="M 295 130 Q 330 105 320 70 Q 315 60 305 65 Q 300 90 280 105 Z" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>

    <!-- head -->
    <circle cx="318" cy="62" r="20" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>

    <!-- eye -->
    <circle cx="325" cy="56" r="2.5" fill="#222"/>

    <!-- beak (upper) -->
    <path d="M 336 60 Q 385 58 400 68 Q 385 74 336 72 Z" fill="#e8a33d" stroke="#c9852a" stroke-width="1.5"/>
    <!-- beak pouch -->
    <path d="M 336 72 Q 375 82 390 78 Q 375 90 340 82 Z" fill="#f0b95c"/>
  </g>

  <!-- ground line -->
  <line x1="0" y1="315" x2="500" y2="315" stroke="#7ab86a" stroke-width="2"/>
</svg>