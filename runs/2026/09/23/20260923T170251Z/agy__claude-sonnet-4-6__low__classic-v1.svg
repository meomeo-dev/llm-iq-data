<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F4FF"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6DBF67"/>
      <stop offset="100%" stop-color="#4A9444"/>
    </linearGradient>
    <!-- Wheel gradient -->
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="none"/>
      <stop offset="100%" stop-color="#333"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="430" cy="60" r="38" fill="#FFE066" opacity="0.9"/>
  <circle cx="430" cy="60" r="28" fill="#FFD700"/>

  <!-- Clouds -->
  <g opacity="0.85">
    <ellipse cx="80" cy="70" rx="38" ry="18" fill="white"/>
    <ellipse cx="110" cy="60" rx="28" ry="20" fill="white"/>
    <ellipse cx="55" cy="65" rx="22" ry="15" fill="white"/>
  </g>
  <g opacity="0.75">
    <ellipse cx="310" cy="50" rx="32" ry="15" fill="white"/>
    <ellipse cx="338" cy="42" rx="22" ry="17" fill="white"/>
    <ellipse cx="288" cy="46" rx="18" ry="13" fill="white"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="330" width="500" height="70" fill="url(#groundGrad)"/>
  <!-- Road/path -->
  <rect x="0" y="318" width="500" height="20" fill="#C8B89A" opacity="0.7" rx="3"/>
  <!-- Road dashes -->
  <rect x="30"  y="325" width="40" height="5" fill="white" opacity="0.6" rx="2"/>
  <rect x="120" y="325" width="40" height="5" fill="white" opacity="0.6" rx="2"/>
  <rect x="210" y="325" width="40" height="5" fill="white" opacity="0.6" rx="2"/>
  <rect x="300" y="325" width="40" height="5" fill="white" opacity="0.6" rx="2"/>
  <rect x="390" y="325" width="40" height="5" fill="white" opacity="0.6" rx="2"/>

  <!-- ======= BICYCLE ======= -->
  <!-- Rear wheel -->
  <circle cx="165" cy="300" r="58" fill="none" stroke="#222" stroke-width="7"/>
  <circle cx="165" cy="300" r="10" fill="#444"/>
  <!-- Rear spokes -->
  <line x1="165" y1="242" x2="165" y2="358" stroke="#555" stroke-width="2.5"/>
  <line x1="107" y1="300" x2="223" y2="300" stroke="#555" stroke-width="2.5"/>
  <line x1="124" y1="259" x2="206" y2="341" stroke="#555" stroke-width="2.5"/>
  <line x1="206" y1="259" x2="124" y2="341" stroke="#555" stroke-width="2.5"/>
  <line x1="124" y1="300" x2="165" y2="242" stroke="#555" stroke-width="2"/>
  <line x1="206" y1="300" x2="165" y2="358" stroke="#555" stroke-width="2"/>

  <!-- Front wheel -->
  <circle cx="335" cy="300" r="58" fill="none" stroke="#222" stroke-width="7"/>
  <circle cx="335" cy="300" r="10" fill="#444"/>
  <!-- Front spokes -->
  <line x1="335" y1="242" x2="335" y2="358" stroke="#555" stroke-width="2.5"/>
  <line x1="277" y1="300" x2="393" y2="300" stroke="#555" stroke-width="2.5"/>
  <line x1="294" y1="259" x2="376" y2="341" stroke="#555" stroke-width="2.5"/>
  <line x1="376" y1="259" x2="294" y2="341" stroke="#555" stroke-width="2.5"/>

  <!-- Bike frame -->
  <!-- Chain stay (rear axle to bottom bracket) -->
  <line x1="165" y1="300" x2="250" y2="270" stroke="#E84040" stroke-width="8" stroke-linecap="round"/>
  <!-- Seat stay (rear axle to seat tube top) -->
  <line x1="165" y1="300" x2="230" y2="210" stroke="#E84040" stroke-width="7" stroke-linecap="round"/>
  <!-- Down tube (head tube to bottom bracket) -->
  <line x1="305" y1="220" x2="250" y2="270" stroke="#E84040" stroke-width="8" stroke-linecap="round"/>
  <!-- Seat tube (bottom bracket to seat) -->
  <line x1="250" y1="270" x2="230" y2="210" stroke="#E84040" stroke-width="8" stroke-linecap="round"/>
  <!-- Top tube (head tube to seat tube) -->
  <line x1="230" y1="210" x2="305" y2="220" stroke="#E84040" stroke-width="8" stroke-linecap="round"/>
  <!-- Fork (head tube to front axle) -->
  <line x1="305" y1="220" x2="335" y2="300" stroke="#E84040" stroke-width="7" stroke-linecap="round"/>
  <!-- Head tube -->
  <line x1="305" y1="215" x2="310" y2="230" stroke="#CC2222" stroke-width="11" stroke-linecap="round"/>

  <!-- Handlebar stem -->
  <line x1="308" y1="218" x2="315" y2="200" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <!-- Handlebars (horizontal bar) -->
  <line x1="300" y1="198" x2="330" y2="198" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <!-- Handlebar grips -->
  <circle cx="300" cy="198" r="5" fill="#222"/>
  <circle cx="330" cy="198" r="5" fill="#222"/>

  <!-- Seat post -->
  <line x1="232" y1="212" x2="228" y2="188" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <!-- Saddle -->
  <ellipse cx="224" cy="185" rx="22" ry="7" fill="#333" rx="22"/>

  <!-- Pedal crank & pedals -->
  <circle cx="250" cy="270" r="10" fill="#555"/>
  <line x1="240" y1="262" x2="260" y2="278" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <rect x="228" y="258" width="16" height="6" fill="#222" rx="2"/>
  <rect x="258" y="276" width="16" height="6" fill="#222" rx="2"/>

  <!-- ======= PELICAN ======= -->
  <!-- Body -->
  <ellipse cx="240" cy="195" rx="52" ry="38" fill="white" stroke="#DDD" stroke-width="1.5"/>

  <!-- Wing (left, tucked) -->
  <ellipse cx="215" cy="205" rx="28" ry="14" fill="#E8E8E8" stroke="#CCC" stroke-width="1" transform="rotate(-15, 215, 205)"/>

  <!-- Wing (right, slightly raised for fun) -->
  <ellipse cx="268" cy="197" rx="30" ry="13" fill="#E0E0E0" stroke="#CCC" stroke-width="1" transform="rotate(10, 268, 197)"/>

  <!-- Tail feathers -->
  <ellipse cx="192" cy="210" rx="22" ry="10" fill="#DCDCDC" stroke="#CCC" stroke-width="1" transform="rotate(-30, 192, 210)"/>

  <!-- Neck -->
  <path d="M 250 168 Q 255 140 260 120 Q 263 108 258 100" fill="none" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Neck outline -->
  <path d="M 250 168 Q 255 140 260 120 Q 263 108 258 100" fill="none" stroke="#DDD" stroke-width="24" stroke-linecap="round" opacity="0.3"/>

  <!-- Head -->
  <ellipse cx="258" cy="94" rx="26" ry="22" fill="white" stroke="#DDD" stroke-width="1.5"/>

  <!-- Eye -->
  <circle cx="268" cy="88" r="7" fill="#FFCC00"/>
  <circle cx="270" cy="87" r="4" fill="#1A1A1A"/>
  <circle cx="272" cy="85" r="1.5" fill="white"/>

  <!-- Beak (upper mandible) -->
  <path d="M 272 96 Q 310 98 320 102 Q 310 108 272 108 Z" fill="#F4A835" stroke="#D4881A" stroke-width="1"/>
  <!-- Pouch -->
  <path d="M 272 106 Q 305 115 315 118 Q 300 130 272 126 Z" fill="#F4C060" stroke="#D4881A" stroke-width="1" opacity="0.9"/>
  <!-- Beak tip hook -->
  <path d="M 318 102 Q 328 102 325 108 Q 318 110 315 108 Z" fill="#D4881A"/>

  <!-- Nostril dot -->
  <circle cx="292" cy="99" r="2.5" fill="#D4881A" opacity="0.7"/>

  <!-- Legs (on pedals) -->
  <!-- Left leg -->
  <line x1="228" y1="222" x2="236" y2="258" stroke="#F4A835" stroke-width="6" stroke-linecap="round"/>
  <!-- Left foot -->
  <ellipse cx="234" cy="262" rx="10" ry="4" fill="#D4881A" transform="rotate(-20, 234, 262)"/>

  <!-- Right leg -->
  <line x1="252" y1="225" x2="262" y2="276" stroke="#F4A835" stroke-width="6" stroke-linecap="round"/>
  <!-- Right foot -->
  <ellipse cx="264" cy="280" rx="10" ry="4" fill="#D4881A" transform="rotate(15, 264, 280)"/>

  <!-- Motion lines (speed effect) -->
  <line x1="60" y1="260" x2="100" y2="260" stroke="#AAA" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="50" y1="275" x2="95"  y2="275" stroke="#AAA" stroke-width="2"   stroke-linecap="round" opacity="0.5"/>
  <line x1="65" y1="290" x2="98"  y2="290" stroke="#AAA" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Title / fun label -->
  <text x="250" y="378" font-family="Georgia, serif" font-size="15" fill="#555" text-anchor="middle" font-style="italic">🚴 Pelican Express 🦢</text>
</svg>