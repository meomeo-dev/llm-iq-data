<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican in the Library Aisle</title>
  <desc id="desc">A mischievous pelican rides a bicycle high above the viewer in a narrow library aisle, seen from below. Towering shelves converge overhead. A single lemon-yellow desk lamp casts a sharp beam.</desc>

  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#fff2a6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff2a6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="page">
      <rect width="800" height="800"/>
    </clipPath>
  </defs>

  <g clip-path="url(#page)" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <rect width="800" height="800" fill="#f8f7f2"/>

    <!-- Narrow aisle walls, seen from directly below -->
    <path d="M0 0H800L514 345H286Z" fill="#111"/>
    <path d="M0 0L286 345V800H0Z" fill="#171717"/>
    <path d="M800 0L514 345V800H800Z" fill="#202020"/>
    <path d="M286 345H514V800H286Z" fill="#f8f7f2" stroke="none"/>

    <!-- Shelf rails converge toward the tiny vanishing point -->
    <g fill="none" stroke="#aaa" stroke-width="5">
      <path d="M0 130L286 382M0 270L286 467M0 420L286 552M0 580L286 640M0 735L286 728"/>
      <path d="M800 130L514 382M800 270L514 467M800 420L514 552M800 580L514 640M800 735L514 728"/>
    </g>
    <g fill="none" stroke="#555" stroke-width="2">
      <path d="M0 0L286 345M800 0L514 345"/>
      <path d="M70 0L310 345M730 0L490 345"/>
    </g>

    <!-- Books on left shelf -->
    <g stroke-width="3">
      <path d="M18 42L76 54V145L18 132Z" fill="#eee"/>
      <path d="M82 55L132 70V194L82 179Z" fill="#999"/>
      <path d="M139 72L194 93V248L139 227Z" fill="#ddd"/>
      <path d="M201 96L244 114V282L201 266Z" fill="#777"/>
      <path d="M34 166L92 180V264L34 251Z" fill="#777"/>
      <path d="M101 184L155 204V303L101 286Z" fill="#eee"/>
      <path d="M164 210L218 230V324L164 306Z" fill="#aaa"/>
      <path d="M13 300L76 313V389L13 376Z" fill="#ccc"/>
      <path d="M86 317L145 337V415L86 397Z" fill="#888"/>
      <path d="M153 343L205 361V438L153 420Z" fill="#eee"/>
      <path d="M25 450L87 463V522L25 511Z" fill="#aaa"/>
      <path d="M96 468L150 482V540L96 528Z" fill="#ddd"/>
    </g>

    <!-- Books on right shelf -->
    <g stroke-width="3">
      <path d="M724 50L782 37V133L724 147Z" fill="#ddd"/>
      <path d="M666 69L716 55V180L666 194Z" fill="#888"/>
      <path d="M608 92L661 74V229L608 247Z" fill="#eee"/>
      <path d="M556 113L600 98V266L556 282Z" fill="#777"/>
      <path d="M709 177L767 163V251L709 266Z" fill="#999"/>
      <path d="M645 201L699 184V286L645 303Z" fill="#eee"/>
      <path d="M581 228L634 209V307L581 324Z" fill="#aaa"/>
      <path d="M724 310L787 294V375L724 390Z" fill="#ccc"/>
      <path d="M658 334L714 316V398L658 415Z" fill="#888"/>
