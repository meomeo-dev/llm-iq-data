    <circle cx="400" cy="486" r="12" fill="#f5dc49" stroke="#111" stroke-width="5"/>
    <path d="M381 386L421 386" stroke="#111" stroke-width="10"/>

    <!-- Pelican body, swept wings, neck, and head -->
    <path d="M371 376C352 343 357 302 383 282C407 264 448 272 461 301C472 325 454 355 430 373Z" fill="#fff" stroke="#111" stroke-width="7"/>
    <path d="M389 323C355 300 333 305 319 334C345 331 357 351 366 371C380 365 391 348 389 323Z" fill="#222" stroke="#111" stroke-width="5"/>
    <path d="M429 320C453 296 478 301 490 329C470 326 457 345 449 363C435 355 427 339 429 320Z" fill="#222" stroke="#111" stroke-width="5"/>
