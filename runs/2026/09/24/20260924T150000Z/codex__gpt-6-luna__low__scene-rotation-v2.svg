    <path d="M434 244Q440 248 445 244" fill="none" stroke="#111" stroke-width="2"/>
    <path d="M465 286Q482 290 489 284" fill="none" stroke="#111" stroke-width="2"/>
    <path d="M319 603Q333 588 348 603M529 602Q544 587 559 602" fill="none" stroke="#111" stroke-width="3"/>

    <!-- A sharply lit patch below the rider -->
    <path d="M401 554L455 554L498 800H348Z" fill="#f5dc49" opacity=".22" stroke="none"/>
  </g>
</svg>