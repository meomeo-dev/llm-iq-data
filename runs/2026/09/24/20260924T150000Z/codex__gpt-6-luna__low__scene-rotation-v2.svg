    <circle cx="438" cy="232" r="4.5" fill="#111" stroke="none"/>
    <path d="M434 220Q446 211 456 221" fill="none" stroke="#111" stroke-width="3"/>
    <!-- Tiny jaunty cap -->
    <path d="M403 220Q424 195 452 207L463 218Q435 212 414 230Z" fill="#111" stroke="#111" stroke-width="4"/>
    <path d="M450 210L468 207" stroke="#111" stroke-width="4"/>

    <!-- Legs pedaling -->
    <path d="M388 365L383 398L400 425M431 365L443 392L421 420" fill="none" stroke="#111" stroke-width="8"/>
    <path d="M390 398L372 403M444 391L461 386" fill="none" stroke="#111" stroke-width="7"/>
    <path d="M374 403L364 413M462 386L474 393" fill="none" stroke="#111" stroke-width="5"/>

    <!-- Comic motion marks and sly grin -->
