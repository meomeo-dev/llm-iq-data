<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">The pelican took the library aisle</title>
  <desc id="desc">A mischievous pelican rides a bicycle between towering bookshelves, seen from a worm's-eye view. A desk lamp casts hard black-and-white shadows; the pelican's beak is lemon yellow.</desc>
  <defs>
    <clipPath id="page">
      <rect width="800" height="1000"/>
    </clipPath>
    <pattern id="books" width="74" height="108" patternUnits="userSpaceOnUse">
      <rect width="74" height="108" fill="#fff"/>
      <path d="M0 4H74M0 102H74" stroke="#111" stroke-width="7"/>
      <path d="M5 8V97M17 8V97M34 8V97M49 8V97M68 8V97" stroke="#111" stroke-width="3"/>
      <path d="M8 23h6m-6 8h6m13 21h9m-9 7h9m18-34h7m-7 7h7M6 79h9m36-4h12" stroke="#111" stroke-width="2"/>
      <path d="M20 12l11 82M37 13l9 81" fill="none" stroke="#111" stroke-width="2"/>
    </pattern>
    <pattern id="floor" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 0H80M0 0V80" stroke="#111" stroke-width="5"/>
    </pattern>
  </defs>

  <g clip-path="url(#page)">
    <rect width="800" height="1000" fill="#fff"/>

    <!-- Shelves rise and narrow toward the ceiling. -->
    <path d="M0 0H258L352 475 0 1000Z" fill="url(#books)" stroke="#111" stroke-width="12"/>
    <path d="M800 0H542L448 475 800 1000Z" fill="url(#books)" stroke="#111" stroke-width="12"/>
    <path d="M0 0 352 475M800 0 448 475M0 1000 352 475M800 1000 448 475" fill="none" stroke="#111" stroke-width="11"/>
    <path d="M0 185 314 295M0 423 337 395M0 690 348 467M800 185 486 295M800 423 463 395M800 690 452 467" fill="none" stroke="#111" stroke-width="13"/>
    <path d="M352 475 258 0H542L448 475Z" fill="#fff" stroke="#111" stroke-width="10"/>
    <path d="M258 0 400 475 542 0M330 0 400 475 470 0M400 0V475" fill="none" stroke="#111" stroke-width="3"/>
    <path d="M0 1000 352 475H448L800 1000Z" fill="url(#floor)" stroke="#111" stroke-width="9"/>
    <path d="M0 1000 400 475 800 1000M150 1000 400 475 650 1000M0 820H800M0 610H800" fill="none" stroke="#111" stroke-width="5"/>

    <!-- One lamp hangs over the aisle. -->
    <path d="M400 0V158" stroke="#111" stroke-width="12"/>
    <circle cx="400" cy="162" r="16" fill="#111"/>
    <path d="M342 172 458 172 486 226H314Z" fill="#111"/>
    <path d="M326 225H474L451 242H349Z" fill="#fff" stroke="#111" stroke-width="8"/>
    <path d="M353 246 241 559M447 246 582 585" stroke="#111" stroke-width="4"/>
    <path d="M321 245 104 704M479 245 701 704" stroke="#111" stroke-width="2"/>
    <path d="M154 833 394 515 628 832 514 1000H273Z" fill="#111" opacity=".13"/>

    <!-- Oversized wheels put the viewer beneath the bicycle. -->
    <ellipse cx="225" cy="760" rx="171" ry="190" fill="#fff" stroke="#111" stroke-width="17"/>
    <ellipse cx="610" cy="774" rx="165" ry="184" fill="#fff" stroke="#111" stroke-width="17"/>
    <ellipse cx="225" cy="760" rx="148" ry="166" fill="none" stroke="#111" stroke-width="3"/>
    <ellipse cx="610" cy="774" rx="142" ry="161" fill="none" stroke="#111" stroke-width="3"/>
    <g stroke="#111" stroke-width="3">
      <path d="M225 760 225 576M225 760 104 635M225 760 56 760M225 760 105 890M225 760 225 950M225 760 346 890M225 760 395 760M225 760 344 630"/>
      <path d="M610 774 610 592M610 774 492 648M610 774 445 774M610 774 493 904M610 774 610 958M610 774 727 904M610 774 775 774M610 774 727 646"/>
    </g>
    <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
      <path d="M225 760 353 635 439 777 225 760 377 525 610 774 439 777 377 525" stroke-width="15"/>
      <path d="M377 525 359 490H311M610 774 552 566 533 536M502 536H573" stroke-width="13"/>
      <path d="M440 777 486 814M486 814H538M440 777 399 738M399 738H355" stroke-width="10"/>
    </g>
    <circle cx="225" cy="760" r="20" fill="#111"/>
    <circle cx="610" cy="774" r="20" fill="#111"/>
    <circle cx="440" cy="777" r="23" fill="#fff" stroke="#111" stroke-width="9"/>

    <!-- The rider leans into a delightfully bad idea. -->
    <path d="M365 492Q295 443 305 350Q314 274 387 261Q455 253 477 324Q494 389 442 441L416 501Z" fill="#fff" stroke="#111" stroke-width="10"/>
    <path d="M351 365Q292 351 262 395Q243 433 293 457Q328 473 374 441" fill="#fff" stroke="#111" stroke-width="9"/>
    <path d="M278 400Q314 413 348 394M269 430Q312 443 358 421" fill="none" stroke="#111" stroke-width="5"/>
    <path d="M380 490 346 568 290 604M409 493 448 566 513 548" fill="none" stroke="#111" stroke-width="19" stroke-linecap="round"/>
    <path d="M280 607 261 624M519 548 534 535" stroke="#111" stroke-width="16" stroke-linecap="round"/>
    <path d="M407 279Q411 219 465 205Q519 192 535 239Q547 279 500 308L465 336" fill="#fff" stroke="#111" stroke-width="10"/>
    <path d="M430 225Q409 189 423 172M455 212Q450 176 464 164M482 213Q489 179 506 174" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
    <circle cx="489" cy="250" r="19" fill="#fff" stroke="#111" stroke-width="6"/>
    <circle cx="496" cy="245" r="7" fill="#111"/>
    <path d="M477 221Q500 208 518 221" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>

    <!-- Lemon yellow is the only color in the scene. -->
    <path d="M505 280Q574 267 676 312Q621 330 539 333Q553 367 521 391Q476 408 448 370Q479 369 498 341Z" fill="#f4df32" stroke="#111" stroke-width="10" stroke-linejoin="round"/>
    <path d="M535 331Q589 322 644 315M472 371Q506 380 527 350" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <path d="M652 306 671 311 652 319" fill="#111"/>

    <path d="M327 494Q339 481 359 484M391 506Q416 499 437 513" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
    <path d="M92 526l-18-22m29 34-27-8m648 15 21-22m-29 32 29-7" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>