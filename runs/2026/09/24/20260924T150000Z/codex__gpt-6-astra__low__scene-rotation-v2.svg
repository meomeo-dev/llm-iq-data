<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"
  viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">A little trouble in the stacks</title>
  <desc id="desc">
    Worm's-eye view of a mischievous pelican riding a bicycle over the viewer
    in a narrow library aisle. Towering black and white bookshelves converge
    overhead. One desk lamp casts a hard-edged light, and the pelican's bill
    is the sole lemon-yellow accent.
  </desc>

  <defs>
    <pattern id="paper" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 9 9 0" stroke="#000" stroke-width=".5" opacity=".12"/>
    </pattern>
    <pattern id="spines" width="76" height="150" patternUnits="userSpaceOnUse">
      <rect width="76" height="150" fill="#fff"/>
      <path d="M0 0V150M17 0V150M29 0V150M58 0V150M72 0V150"
        stroke="#000" stroke-width="5"/>
      <path d="M5 18H12M5 26H12M34 34H52M34 40H52M34 119H52
        M62 12H68M62 135H68" stroke="#000" stroke-width="3"/>
      <path d="M20 0H26V150H20Z" fill="#000"/>
    </pattern>
    <clipPath id="leftBooks">
      <path d="M0 0H316L366 312 261 1000H0Z"/>
    </clipPath>
    <clipPath id="rightBooks">
      <path d="M800 0H484L434 312 539 1000H800Z"/>
    </clipPath>
    <g id="wheel">
      <ellipse rx="108" ry="168" fill="#fff" stroke="#000" stroke-width="19"/>
      <ellipse rx="92" ry="150" fill="none" stroke="#000" stroke-width="2"/>
      <g stroke="#000" stroke-width="2">
        <path d="M0-150V150M-92 0H92M-66-106 66 106M66-106-66 106
          M-35-139 35 139M35-139-35 139M-85-57 85 57M85-57-85 57"/>
      </g>
      <ellipse rx="15" ry="22" fill="#000"/>
      <path d="M-96 91Q-119 6-84-100" fill="none" stroke="#fff"
        stroke-width="4"/>
    </g>
  </defs>

  <!-- The ceiling is the distant end of a steep, vertical perspective. -->
  <rect width="800" height="1000" fill="#000"/>
  <path d="M315 0H485L437 314 532 1000H268L363 314Z" fill="#fff"/>
  <path d="M338 0 378 309 320 1000H480L422 309 462 0Z" fill="url(#paper)"/>
  <path d="M386 0 395 248M414 0 405 248" stroke="#000" stroke-width="2"/>
  <path d="M374 110H426M381 167H419M387 211H413"
    fill="none" stroke="#000" stroke-width="3"/>

  <!-- Tall shelf faces, with diminishing book rows above the rider. -->
  <g clip-path="url(#leftBooks)">
    <path d="M0 0H316L366 312 261 1000H0Z" fill="#fff"/>
    <g fill="url(#spines)" stroke="#000" stroke-width="5">
      <path d="M-40 52 318 205 333 239-40 132Z"/>
      <path d="M-40 161 337 257 349 285-40 280Z"/>
      <path d="M-40 318 350 307 342 348-40 476Z"/>
      <path d="M-40 520 331 390 314 463-40 714Z"/>
      <path d="M-40 785 301 517 280 627-40 1007Z"/>
      <path d="M40 1040 264 711 239 897 163 1040Z"/>
    </g>
    <g fill="#000">
      <path d="M0 124 336 239 342 256 0 157Z"/>
      <path d="M0 280 352 285 353 301 0 316Z"/>
      <path d="M0 465 342 348 338 374 0 509Z"/>
      <path d="M0 693 315 463 307 499 0 756Z"/>
      <path d="M0 979 281 627 273 680 52 1000Z"/>
    </g>
    <path d="M80 0 355 305 182 1000H222L364 308 116 0Z" fill="#000"/>
    <path d="M0 0 342 300 30 1000H0L330 301Z" fill="#000"/>
  </g>

  <g clip-path="url(#rightBooks)">
    <path d="M800 0H484L434 312 539 1000H800Z" fill="#fff"/>
    <g fill="url(#spines)" stroke="#000" stroke-width="5">
      <path d="M840 52 482 205 467 239 840 132Z"/>
      <path d="M840 161 463 257 451 285 840 280Z"/>
      <path d="M840 318 450 307 458 348 840 476Z"/>
      <path d="M840 520 469 390 486 463 840 714Z"/>
      <path d="M840 785 499 517 520 627 840 1007Z"/>
      <path d="M760 1040 536 711 561 897 637 1040Z"/>
    </g>
    <g fill="#000">
      <path d="M800 124 464 239 458 256 800 157Z"/>
      <path d="M800 280 448 285 447 301 800 316Z"/>
      <path d="M800 465 458 348 462 374 800 509Z"/>
      <path d="M800 693 485 463 493 499 800 756Z"/>
      <path d="M800 979 519 627 527 680 748 1000Z"/>
    </g>
    <path d="M720 0 445 305 618 1000H578L436 308 684 0Z" fill="#000"/>
    <path d="M800 0 458 300 770 1000H800L470 301Z" fill="#000"/>
  </g>

  <!-- A single lamp and its sharply bounded cone of light. -->
  <path d="M651 343 137 797 555 1000Z" fill="#fff" opacity=".18"/>
  <g stroke="#fff" stroke-linejoin="round">
    <path d="M766 502 733 493 758 447 716 385 680 368"
      fill="none" stroke-width="12"/>
    <path d="M766 502 733 493 758 447 716 385 680 368"
      fill="none" stroke="#000" stroke-width="6"/>
    <circle cx="758" cy="447" r="10" fill="#000" stroke-width="3"/>
    <path d="M689 330Q727 349 707 382L644 366Z"
      fill="#000" stroke-width="4"/>
    <path d="m644 366 63 16q-23 17-63-16Z" fill="#fff" stroke-width="3"/>
    <circle cx="673" cy="377" r="6" fill="#fff" stroke="none"/>
    <path d="m705 391 13 10m-30-3 3 15m-32-26-13 9"
      fill="none" stroke-width="2"/>
  </g>

  <!-- An airborne book adds a tiny, silent library catastrophe. -->
  <g transform="translate(198 381) rotate(-24)"
    stroke="#000" stroke-linejoin="round">
    <path d="M-56-32Q-22-41 0-20 26-39 60-30L48 37Q21 27 0 45
      -24 26-54 31Z" fill="#000" stroke-width="5"/>
    <path d="M-51-38Q-23-44 0-24 25-44 55-35L46 27Q23 19 0 37
      -24 18-48 24Z" fill="#fff" stroke-width="3"/>
    <path d="M0-24V37M-39-21-12-12M-38-12-12-3M-36-3-13 6
      M12-11 42-23M12-2 40-14M12 7 38-5" fill="none" stroke-width="2"/>
  </g>
  <path d="M142 388q-26 8-29 31m36-12q-14 10-12 23"
    fill="none" stroke="#fff" stroke-width="3"/>

  <!-- The bicycle looms over the camera; both tire undersides dominate. -->
  <g transform="translate(238 791) rotate(-19)">
    <use href="#wheel"/>
  </g>
  <g transform="translate(590 746) rotate(-19)">
    <use href="#wheel"/>
  </g>

  <g stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M238 791 337 596 427 793 238 791 493 596 427 793
      M337 596H493M493 596 590 746" stroke="#fff" stroke-width="22"/>
    <path d="M238 791 337 596 427 793 238 791 493 596 427 793
      M337 596H493M493 596 590 746" stroke="#000" stroke-width="12"/>
    <path d="M493 596 469 531 526 510Q550 503 555 523"
      stroke="#fff" stroke-width="18"/>
    <path d="M493 596 469 531 526 510Q550 503 555 523"
      stroke="#000" stroke-width="9"/>
    <path d="m337 596-13-42" stroke="#fff" stroke-width="16"/>
    <path d="m337 596-13-42" stroke="#000" stroke-width="8"/>
    <path d="M287 552Q322 535 352 549L342 565H294Z"
      fill="#000" stroke="#fff" stroke-width="3"/>
    <ellipse cx="427" cy="793" rx="35" ry="44"
      fill="#fff" stroke="#000" stroke-width="7"/>
    <ellipse cx="427" cy="793" rx="25" ry="34"
      stroke="#000" stroke-width="2"/>
    <path d="m427 793 51-43m-51 43-45 40" stroke="#000" stroke-width="9"/>
    <path d="m461 749 39 4m-136 79 37 8" stroke="#000" stroke-width="13"/>
  </g>

  <!-- Pelican: oversized belly, tucked wings, crooked grin, determined feet. -->
  <path d="M311 502 259 563 321 546 301 582 356 542"
    fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M347 547Q315 599 354 648L382 814 408 823 393 642
    Q390 596 416 563Z" fill="#fff" stroke="#000" stroke-width="7"/>
  <path d="M419 543Q468 576 441 630L471 711 497 728 486 744
    451 736 415 640Q395 587 385 568Z"
    fill="#fff" stroke="#000" stroke-width="7"/>
  <path d="m382 810-25 25 55 14 10-12-15-21Z
    M470 712 26 1 26 30-62-5Z"
    fill="#000" stroke="#fff" stroke-width="3"/>

  <path d="M340 365Q293 403 304 478 310 562 380 590
    448 606 480 545 507 488 456 424L423 366Z"
    fill="#fff" stroke="#000" stroke-width="8"/>
  <path d="M311 449Q306 530 373 570 415 591 450 560
    388 555 356 498Z" fill="#000"/>
  <path d="M338 434Q364 410 395 444L478 500 460 523
    Q414 516 378 481L348 475Z"
    fill="#fff" stroke="#000" stroke-width="6"/>
  <path d="m400 461 59 45m-68-29 49 35m-58-21 34 23"
    fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <path d="M460 500q18-10 31 8l-7 24-22-8Z"
    fill="#fff" stroke="#000" stroke-width="5"/>

  <!-- The curved throat is seen from directly beneath the enormous bill. -->
  <path d="M347 410Q366 367 352 324 328 271 354 237
    383 204 425 225 460 244 449 285 425 318 411 350
    412 383 437 421Q398 450 347 410Z"
    fill="#fff" stroke="#000" stroke-width="7"/>
  <path d="M367 308Q397 321 424 293 396 351 410 393
    L388 408Q376 357 367 308Z" fill="#000"/>

  <!-- One lemon-yellow accent, confined to the bill and throat pouch. -->
  <path d="M415 265Q490 249 601 288L631 308
    Q568 314 456 317 421 324 409 293Z"
    fill="#f4ed35" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <path d="M420 286Q491 297 631 308M438 307Q477 311 488 296"
    fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <path d="M431 274 443 277" stroke="#000" stroke-width="4"
    stroke-linecap="round"/>

  <path d="M353 240 340 211 365 226 365 200 384 223"
    fill="#fff" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="402" cy="256" rx="18" ry="21" fill="#fff"
    stroke="#000" stroke-width="4"/>
  <ellipse cx="410" cy="260" rx="6" ry="10" fill="#000"/>
  <circle cx="412" cy="257" r="2" fill="#fff"/>
  <path d="m382 242 37 6" stroke="#000" stroke-width="7"
    stroke-linecap="round"/>
  <path d="M363 276q10 8 19 0" fill="none" stroke="#000" stroke-width="3"/>

  <!-- Tire chatter and near-miss marks. -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="m95 687-18 54m7-13-9 45M693 770l15-54m-4 85 13-40"
      stroke-width="4"/>
    <path d="m168 980-12 13m50-7-3 10m450-110 15 21m-1-57 19 13"
      stroke-width="3"/>
  </g>

  <g transform="translate(54 581) rotate(-26)">
    <rect x="-9" y="-26" width="130" height="41" fill="#fff"
      stroke="#000" stroke-width="4"/>
    <text x="56" y="2" text-anchor="middle"
      font-family="monospace" font-size="23" font-weight="bold" fill="#000">
      SILENCE
    </text>
  </g>
  <path d="M536 473q16-16 26 0m-32-12q23-26 43-2"
    fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="540" cy="503" rx="12" ry="8" fill="#fff"
    stroke="#000" stroke-width="4"/>

  <rect x="9" y="9" width="782" height="982" fill="none"
    stroke="#fff" stroke-width="2"/>
</svg>