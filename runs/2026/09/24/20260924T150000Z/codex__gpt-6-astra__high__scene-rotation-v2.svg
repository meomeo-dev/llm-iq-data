             patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 0V12" fill="none" stroke="#111" stroke-width="3"/>
    </pattern>
    <pattern id="fineHatching" width="7" height="7"
             patternUnits="userSpaceOnUse" patternTransform="rotate(-32)">
      <path d="M0 0V7" fill="none" stroke="#111" stroke-width="1.5"/>
    </pattern>
    <g id="wheel">
