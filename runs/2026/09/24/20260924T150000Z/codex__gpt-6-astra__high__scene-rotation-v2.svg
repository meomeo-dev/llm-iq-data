<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100"
     viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">A very overdue pelican</title>
  <desc id="desc">
    Black-and-white comic illustration viewed from beneath a pelican riding a
    bicycle overhead in a narrow library aisle. Towering bookshelves converge
    toward the ceiling. A single lemon-yellow desk lamp throws a hard cone of
    light across the bird, bicycle, and books.
  </desc>
