<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5E642" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#F5E642" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5E642" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="800" height="800"/></clipPath>
  </defs>

  <!-- 夜色天花板 -->
  <rect width="800" height="800" fill="#0a0a0a"/>

  <g clip-path="url(#frame)">
    <!-- 左侧书架：从下往上向灭点收拢 -->
    <polygon points="0,800 0,0 130,0 330,380 330,420" fill="#161616"/>
    <!-- 右侧书架 -->
    <polygon points="800,800 800,0 670,0 470,380 470,420" fill="#161616"/>

    <!-- 左侧层板与书脊（透视线） -->
    <g stroke="#3a3a3a" stroke-width="3" fill="none">
      <line x1="0" y1="720" x2="330" y2="415"/>
      <line x1="0" y1="600" x2="330" y2="405"/>
      <line x1="0" y1="470" x2="332" y2="396"/>
      <line x1="0" y1="330" x2="335" y2="388"/>
      <line x1="0" y1="190" x2="338" y2="382"/>
      <line x1="40" y1="60" x2="342" y2="378"/>
      <line x1="120" y1="0" x2="345" y2="375"/>
    </g>
    <g stroke="#3a3a3a" stroke-width="3" fill="none">
      <line x1="800" y1="720" x2="470" y2="415"/>
      <line x1="800" y1="600" x2="470" y2="405"/>
      <line x1="800" y1="470" x2="468" y2="396"/>
      <line x1="800" y1="330" x2="465" y2="388"/>
      <line x1="800" y1="190" x2="462" y2="382"/>
      <line x1="760" y1="60" x2="458" y2="378"/>
      <line x1="680" y1="0" x2="455" y2="375"/>
    </g>

    <!-- 书脊：左侧近处 -->
    <g fill="#f2f2f2">
      <polygon points="0,790 0,730 40,700 40,760"/>
      <polygon points="50,750 50,690 90,662 90,722"/>
      <polygon points="0,590 0,540 60,525 60,570"/>
      <polygon points="110,545 110,500 150,492 150,532"/>
      <polygon points="0,460 0,420 80,412 80,448"/>
      <polygon points="0,320 0,270 90,290 90,335"/>
      <polygon points="120,210 120,170 180,200 180,238"/>
      <polygon points="30,180 30,130 100,150 100,195"/>
      <polygon points="150,60 150,20 210,60 210,98"/>
    </g>
    <g fill="#d0d0d0">
      <polygon points="100,720 100,680 130,662 130,700"/>
      <polygon points="180,640 180,600 230,585 230,622"/>
      <polygon points="70,555 70,515 105,508 105,545"/>
      <polygon points="170,470 170,435 220,428 220,460"/>
      <polygon points="200,300 200,268 250,290 250,322"/>
      <polygon points="230,130 230,100 270,130 270,160"/>
    </g>
    <!-- 书脊：右侧 -->
    <g fill="#f2f2f2">
      <polygon points="800,790 800,730 760,700 760,760"/>
      <polygon points="740,740 740,680 700,652 700,712"/>
      <polygon points="800,600 800,550 730,538 730,585"/>
      <polygon points="690,555 690,510 650,502 650,542"/>
      <polygon points="800,450 800,410 720,404 720,440"/>
      <polygon points="800,310 800,260 700,282 700,328"/>
      <polygon points="660,210 660,170 600,200 600,238"/>
      <polygon points="760,170 760,120 690,140 690,185"/>
      <polygon points="630,60 630,20 570,60 570,98"/>
    </g>
    <g fill="#d0d0d0">
      <polygon points="700,735 700,695 670,677 670,715"/>
      <polygon points="620,630 620,590 570,575 570,612"/>
      <polygon points="730,545 730,505 695,498 695,535"/>
      <polygon points="630,470 630,435 580,428 580,460"/>
      <polygon points="600,300 600,268 550,290 550,322"/>
      <polygon points="570,130 570,100 530,130 530,160"/>
    </g>

    <!-- 天花板缝隙（远端，两架之间） -->
    <polygon points="330,380 470,380 455,375 345,375" fill="#222"/>
    <rect x="345" y="0" width="110" height="378" fill="#111"/>

    <!-- 台灯：唯一光源，从右上探出，射向仰视者 -->
    <circle cx="560" cy="150" r="260" fill="url(#lampGlow)"/>
    <line x1="800" y1="40" x2="640" y2="110" stroke="#f2f2f2" stroke-width="10" stroke-linecap="round"/>
    <path d="M600 150 L680 90 L700 120 L640 190 Z" fill="#0a0a0a" stroke="#f2f2f2" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="620" cy="170" rx="34" ry="22" transform="rotate(-38 620 170)" fill="#F5E642"/>

    <!-- 硬光投影：鹈鹕与车的剪影落在左架上 -->
    <g fill="#000" opacity="0.85" transform="translate(-95 60) skewX(-18)">
      <circle cx="300" cy="500" r="80"/>
      <circle cx="460" cy="420" r="72"/>
      <ellipse cx="400" cy="380" rx="70" ry="40"/>
      <ellipse cx="380" cy="300" rx="42" ry="60"/>
    </g>

    <!-- 自行车：从下往上看的底面 -->
    <g stroke="#f2f2f2" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 后轮 -->
      <circle cx="300" cy="560" r="90"/>
      <circle cx="300" cy="560" r="10" fill="#f2f2f2"/>
      <!-- 前轮 -->
      <circle cx="520" cy="470" r="82"/>
      <circle cx="520" cy="470" r="10" fill="#f2f2f2"/>
      <!-- 车架 -->
      <path d="M300 560 L400 460 L520 470"/>
      <path d="M400 460 L420 560 L300 560"/>
      <path d="M420 560 L470 590"/>
      <!-- 曲柄与脚踏 -->
      <circle cx="420" cy="560" r="20"/>
      <line x1="420" y1="560" x2="400" y2="610"/>
      <line x1="420" y1="560" x2="445" y2="512"/>
      <rect x="386" y="606" width="34" height="10" fill="#0a0a0a" transform="rotate(-20 403 611)"/>
      <!-- 龙头 -->
      <path d="M520 470 L560 420"/>
      <path d="M535 405 Q560 400 590 430"/>
    </g>
    <!-- 轮辐 -->
    <g stroke="#9a9a9a" stroke-width="2">
      <g transform="translate(300 560)">
        <line x1="0" y1="-90" x2="0" y2="90"/><line x1="-90" y1="0" x2="90" y2="0"/>
        <line x1="-64" y1="-64" x2="64" y2="64"/><line x1="64" y1="-64" x2="-64" y2="64"/>
        <line x1="-34" y1="-83" x2="34" y2="83"/><line x1="34" y1="-83" x2="-34" y2="83"/>
        <line x1="-83" y1="-34" x2="83" y2="34"/><line x1="83" y1="-34" x2="-83" y2="34"/>
      </g>
      <g transform="translate(520 470)">
        <line x1="0" y1="-82" x2="0" y2="82"/><line x1="-82" y1="0" x2="82" y2="0"/>
        <line x1="-58" y1="-58" x2="58" y2="58"/><line x1="58" y1="-58" x2="-58" y2="58"/>
        <line x1="-31" y1="-76" x2="31" y2="76"/><line x1="31" y1="-76" x2="-31" y2="76"/>
        <line x1="-76" y1="-31" x2="76" y2="31"/><line x1="76" y1="-31" x2="-76" y2="31"/>
      </g>
    </g>

    <!-- 鹈鹕：从底下仰视，肚皮朝观者，探头俯视偷笑 -->
    <!-- 蹼足踩在脚踏上 -->
    <path d="M395 600 L360 640 L385 632 L378 668 L400 636 L420 660 L415 625 Z" fill="#f2f2f2" stroke="#0a0a0a" stroke-width="3"/>
    <!-- 身体（肚皮） -->
    <ellipse cx="400" cy="420" rx="120" ry="150" fill="#f2f2f2"/>
    <ellipse cx="400" cy="430" rx="85" ry="110" fill="#e6e6e6"/>
    <!-- 翅膀抓龙头 -->
    <path d="M300 380 Q220 330 240 250 Q290 320 330 330 Z" fill="#f2f2f2" stroke="#0a0a0a" stroke-width="3"/>
    <path d="M500 380 Q560 350 560 420 Q540 410 520 400 Z" fill="#f2f2f2" stroke="#0a0a0a" stroke-width="3"/>
    <path d="M540 420 Q580 395 590 430" fill="none" stroke="#0a0a0a" stroke-width="4"/>
    <!-- 尾羽 -->
    <path d="M350 560 L330 610 L370 590 L390 630 L410 585 L440 620 L445 560 Z" fill="#f2f2f2" stroke="#0a0a0a" stroke-width="3"/>
    <!-- 颈与头 -->
    <path d="M370 290 Q360 220 400 190 Q440 220 430 290 Z" fill="#f2f2f2"/>
    <circle cx="400" cy="180" r="62" fill="#f2f2f2"/>
    <!-- 眼睛，斜视观者 -->
    <circle cx="372" cy="170" r="16" fill="#fff" stroke="#0a0a0a" stroke-width="3"/>
    <circle cx="428" cy="170" r="16" fill="#fff" stroke="#0a0a0a" stroke-width="3"/>
    <circle cx="378" cy="176" r="8" fill="#0a0a0a"/>
    <circle cx="434" cy="176" r="8" fill="#0a0a0a"/>
    <!-- 挑起的眉毛 -->
    <path d="M352 148 Q372 138 392 150" fill="none" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
    <path d="M408 152 Q432 132 452 146" fill="none" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
    <!-- 喙：长嘴向下压向镜头，坏笑 -->
    <path d="M362 200 L400 340 L438 200 Z" fill="#f2f2f2" stroke="#0a0a0a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M370 212 Q400 232 430 212" fill="none" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"/>
    <!-- 喉囊里藏的一本偷来的书 -->
    <path d="M380 240 L420 240 L412 300 L388 300 Z" fill="#0a0a0a"/>
    <rect x="390" y="248" width="20" height="44" fill="#F5E642"/>
    <line x1="400" y1="248" x2="400" y2="292" stroke="#0a0a0a" stroke-width="2"/>

    <!-- 硬光高光：黄色勾边落在朝向灯的一侧 -->
    <g fill="none" stroke="#F5E642" stroke-width="5" stroke-linecap="round">
      <path d="M455 300 Q510 340 512 420"/>
      <path d="M440 140 Q458 160 456 190"/>
      <path d="M560 400 Q585 460 555 520"/>
    </g>

    <!-- 掉落的书页，被灯照亮 -->
    <g fill="#f2f2f2">
      <polygon points="210,320 250,300 262,340 222,360" transform="rotate(12 236 330)"/>
      <polygon points="600,620 630,600 640,640 610,660" transform="rotate(-25 620 630)"/>
      <polygon points="180,120 205,105 215,135 190,150"/>
    </g>
    <line x1="220" y1="325" x2="250" y2="312" stroke="#bbb" stroke-width="2"/>
    <line x1="224" y1="337" x2="254" y2="324" stroke="#bbb" stroke-width="2"/>

    <!-- 底部提示：仰视者的地板阴影 -->
    <ellipse cx="400" cy="810" rx="260" ry="40" fill="#000"/>
  </g>
</svg>