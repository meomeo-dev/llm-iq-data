<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#111"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a2a2a" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- deep ceiling void -->
  <rect width="600" height="800" fill="#050505"/>
  <!-- sliver of ceiling at vanishing point -->
  <polygon points="270,40 330,40 340,70 260,70" fill="#1c1c1c"/>

  <!-- left bookshelf wall converging upward -->
  <polygon points="0,0 260,70 270,40 0,-400 0,800 120,800" fill="#141414"/>
  <polygon points="0,800 260,70 0,0" fill="#1a1a1a"/>
  <!-- right bookshelf wall -->
  <polygon points="600,800 340,70 600,0" fill="#e8e8e8"/>
  <polygon points="600,0 340,70 330,40 600,-400" fill="#cfcfcf"/>

  <!-- left shelf boards (lines converging) -->
  <g stroke="#3a3a3a" stroke-width="3">
    <line x1="0" y1="760" x2="258" y2="80"/>
    <line x1="0" y1="560" x2="255" y2="78"/>
    <line x1="0" y1="380" x2="252" y2="76"/>
    <line x1="0" y1="220" x2="250" y2="74"/>
    <line x1="0" y1="90" x2="248" y2="72"/>
  </g>
  <!-- left books (dark side, spines) -->
  <g fill="#262626" stroke="#000" stroke-width="1">
    <polygon points="10,740 40,660 60,650 30,735"/>
    <polygon points="45,650 70,590 85,585 60,645"/>
    <polygon points="90,560 110,510 125,505 105,555"/>
    <polygon points="20,540 45,470 62,462 38,530"/>
    <polygon points="70,440 95,380 110,375 85,432"/>
    <polygon points="130,380 150,330 162,325 142,372"/>
    <polygon points="40,330 60,280 74,274 55,322"/>
    <polygon points="160,260 175,225 185,222 170,255"/>
    <polygon points="100,230 118,190 128,186 110,224"/>
    <polygon points="200,170 212,140 220,138 208,165"/>
  </g>

  <!-- right shelf boards -->
  <g stroke="#111" stroke-width="3">
    <line x1="600" y1="760" x2="342" y2="80"/>
    <line x1="600" y1="560" x2="345" y2="78"/>
    <line x1="600" y1="380" x2="348" y2="76"/>
    <line x1="600" y1="220" x2="350" y2="74"/>
    <line x1="600" y1="90" x2="352" y2="72"/>
  </g>
  <!-- right books (lit side) with hard shadows -->
  <g stroke="#000" stroke-width="1.5">
    <polygon points="590,740 560,660 540,650 570,735" fill="#fff"/>
    <polygon points="555,650 530,590 515,585 540,645" fill="#bbb"/>
    <polygon points="510,560 490,510 475,505 495,555" fill="#fff"/>
    <polygon points="580,540 555,470 538,462 562,530" fill="#999"/>
    <polygon points="530,440 505,380 490,375 515,432" fill="#fff"/>
    <polygon points="470,380 450,330 438,325 458,372" fill="#ccc"/>
    <polygon points="560,330 540,280 526,274 545,322" fill="#fff"/>
    <polygon points="440,260 425,225 415,222 430,255" fill="#aaa"/>
    <polygon points="500,230 482,190 472,186 490,224" fill="#fff"/>
    <polygon points="400,170 388,140 380,138 392,165" fill="#ddd"/>
  </g>

  <!-- hard shadow from lamp across right wall -->
  <polygon points="600,470 470,300 430,330 600,640" fill="#000" opacity="0.55"/>

  <!-- plank bridging the aisle overhead -->
  <polygon points="150,300 450,280 455,300 148,322" fill="#dcdcdc" stroke="#000" stroke-width="3"/>
  <polygon points="148,322 455,300 455,308 148,332" fill="#222"/>

  <!-- PELICAN ON BICYCLE (seen from below, on the plank) -->
  <g stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- wheels -->
    <ellipse cx="240" cy="270" rx="38" ry="14" fill="none" stroke="#fff" stroke-width="5"/>
    <ellipse cx="370" cy="262" rx="38" ry="14" fill="none" stroke="#fff" stroke-width="5"/>
    <ellipse cx="240" cy="270" rx="38" ry="14" fill="none"/>
    <ellipse cx="370" cy="262" rx="38" ry="14" fill="none"/>
    <!-- frame -->
    <polyline points="240,270 295,250 370,262 330,225 295,250" fill="none" stroke="#fff" stroke-width="5"/>
    <polyline points="240,270 295,250 370,262 330,225 295,250" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="330" y1="225" x2="345" y2="205" stroke="#fff" stroke-width="4"/>
    <line x1="335" y1="205" x2="358" y2="200" stroke="#fff" stroke-width="4"/>
    <!-- belly & body (underside view) -->
    <ellipse cx="290" cy="200" rx="62" ry="40" fill="#fff"/>
    <!-- wing tips flapping for balance -->
    <path d="M240,190 Q170,150 150,190 Q200,185 238,210 Z" fill="#fff"/>
    <path d="M340,185 Q400,120 440,150 Q390,165 345,210 Z" fill="#fff"/>
    <path d="M150,190 L165,178 M160,195 L178,184" stroke-width="3"/>
    <!-- legs pedalling -->
    <polyline points="280,235 275,255 290,262" fill="none" stroke-width="5"/>
    <polyline points="305,235 312,248 300,255" fill="none" stroke-width="5"/>
    <!-- neck curving over handlebar -->
    <path d="M330,180 Q370,150 360,120" fill="none" stroke="#fff" stroke-width="18"/>
    <path d="M330,180 Q370,150 360,120" fill="none" stroke-width="2"/>
    <!-- head -->
    <circle cx="358" cy="115" r="18" fill="#fff"/>
    <!-- mischievous eye with raised brow -->
    <circle cx="364" cy="110" r="4" fill="#000"/>
    <path d="M356,100 L372,96" stroke-width="3"/>
    <!-- beak + pouch: the lemon-yellow accent -->
    <path d="M372,116 L470,140 L372,124 Z" fill="#FFF44F"/>
    <path d="M374,124 Q420,170 466,141 L372,124 Z" fill="#FFF44F"/>
    <!-- a stolen book peeking from the pouch -->
    <rect x="405" y="132" width="22" height="14" fill="#fff" transform="rotate(12 416 139)"/>
  </g>

  <!-- pelican's hard shadow on plank underside -->
  <ellipse cx="300" cy="316" rx="80" ry="6" fill="#000" opacity="0.7"/>

  <!-- DESK LAMP clamped to left shelf, hard point light -->
  <g stroke="#000" stroke-width="4" stroke-linejoin="round">
    <rect x="60" y="470" width="30" height="16" fill="#fff"/>
    <line x1="75" y1="470" x2="120" y2="420" stroke="#fff" stroke-width="6"/>
    <line x1="120" y1="420" x2="150" y2="460" stroke="#fff" stroke-width="6"/>
    <circle cx="120" cy="420" r="5" fill="#000" stroke="#fff" stroke-width="2"/>
    <path d="M140,450 L180,440 L172,485 Z" fill="#fff"/>
  </g>
  <!-- light cone -->
  <polygon points="176,462 600,300 600,700" fill="#fff" opacity="0.12"/>
  <circle cx="172" cy="465" r="40" fill="url(#glow)"/>
  <circle cx="172" cy="465" r="6" fill="#fff"/>

  <!-- falling pages, comic motion -->
  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="200" y="420" width="26" height="18" transform="rotate(-20 213 429)"/>
    <rect x="330" y="520" width="22" height="16" transform="rotate(30 341 528)"/>
    <rect x="260" y="640" width="30" height="20" transform="rotate(-8 275 650)"/>
  </g>
  <g stroke="#fff" stroke-width="2" fill="none">
    <path d="M180,300 l-20,4 M185,312 l-24,6"/>
    <path d="M470,285 q10,-8 20,0"/>
  </g>
</svg>