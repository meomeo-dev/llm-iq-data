<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">The library aisle getaway</title>
  <desc id="desc">A mischievous pelican pedals a bicycle above a worm's-eye view of towering library shelves. A desk lamp casts a sharp lemon-yellow beam.</desc>

  <defs>
    <g id="shelf">
      <path d="M0 0H318L243 1100H0Z" fill="#000" stroke="#fff" stroke-width="9"/>
      <path d="M34 0 19 1100M123 0 105 1100M224 0 194 1100" fill="none" stroke="#fff" stroke-width="3"/>

      <g fill="none" stroke="#fff" stroke-linecap="square">
        <path d="M20 33 17 193M48 18 44 190M75 39 71 188M100 12 97 186M147 27 142 182M177 9 172 180M204 37 199 178M245 19 239 174M276 30 269 170" stroke-width="6"/>
        <path d="M27 264 23 376M61 245 56 372M89 260 84 369M133 239 126 364M160 260 154 361M189 246 182 357M231 256 222 352M264 240 255 348" stroke-width="7"/>
        <path d="M19 459 13 590M52 444 45 584M81 464 73 579M117 437 108 573M153 456 144 567M190 443 179 561M226 452 215 555M259 439 248 550" stroke-width="7"/>
        <path d="M23 691 15 831M58 668 48 821M96 686 84 813M130 659 118 805M169 676 155 795M207 656 192 784M239 669 225 777" stroke-width="8"/>
        <path d="M20 971 12 1084M59 948 48 1080M98 966 85 1075M137 938 122 1070M175 952 159 1065M214 930 199 1059" stroke-width="9"/>
      </g>

      <g fill="#fff">
        <path d="M0 204 305 175 303 199 0 235Z"/>
        <path d="M0 397 291 360 289 390 0 436Z"/>
        <path d="M0 617 276 568 274 604 0 667Z"/>
        <path d="M0 880 258 810 255 854 0 950Z"/>
      </g>
      <g fill="none" stroke="#000" stroke-width="5">
        <path d="M0 214 304 185M0 409 290 374M0 630 275 585M0 898 257 829"/>
      </g>
    </g>

    <g id="wheel" fill="none" stroke="#fff">
      <circle r="100" stroke-width="9"/>
      <circle r="89" stroke-width="2"/>
      <g stroke-width="1.8">
        <path d="M0-89V89M-89 0H89M-63-63 63 63M63-63-63 63"/>
        <path d="M-34-82 34 82M34-82-34 82M-82-34 82 34M82-34-82 34"/>
        <path d="M-82 34 82-34M82 34-82-34M-34 82 34-82M34 82-34-82"/>
      </g>
      <circle r="9" fill="#fff" stroke="#000" stroke-width="3"/>
    </g>
  </defs>

  <rect width="900" height="1100" fill="#000"/>
  <use href="#shelf"/>
  <use href="#shelf" transform="translate(900 0) scale(-1 1)"/>

  <!-- Ceiling lines rise toward the point directly overhead. -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M318 0 450 177 582 0M305 183 450 177 595 183" stroke-width="4"/>
    <path d="M302 385 450 177 598 385M275 608 450 177 625 608" stroke-width="2" opacity=".75"/>
    <path d="M243 1100 450 177 657 1100" stroke-width="3"/>
  </g>

  <!-- One articulated desk lamp supplies the hard-edged light. -->
  <path d="M335 253 891 1005 0 1067Z" fill="#ffe34d" opacity=".12"/>
  <path d="M335 253 891 1005M335 253 0 1067" fill="none" stroke="#ffe34d" stroke-width="3"/>
  <g stroke="#fff" stroke-linejoin="round" stroke-linecap="round">
    <path d="M71 191H161L173 204H57Z" fill="#000" stroke-width="7"/>
    <path d="M112 187 158 88 271 153" fill="none" stroke-width="13"/>
    <path d="M112 187 158 88 271 153" fill="none" stroke="#000" stroke-width="4"/>
    <circle cx="158" cy="88" r="11" fill="#000" stroke-width="5"/>
    <circle cx="271" cy="153" r="10" fill="#000" stroke-width="5"/>
    <path d="M267 155 350 203 335 251 241 199Z" fill="#000" stroke-width="7"/>
    <path d="M250 202 334 247" fill="none" stroke="#ffe34d" stroke-width="8"/>
    <circle cx="335" cy="251" r="9" fill="#ffe34d" stroke="#000" stroke-width="3"/>
  </g>

  <!-- Wheels loom over the viewer. -->
  <use href="#wheel" transform="translate(210 850) scale(1.72 1.52)"/>
  <use href="#wheel" transform="translate(718 778) scale(1.47 1.30)"/>

  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 850 390 631 471 803 210 850M390 631 623 625 471 803M623 625 718 778" stroke-width="15"/>
    <path d="M390 631 380 583M623 625 640 535" stroke-width="12"/>
    <path d="M337 579Q378 566 421 579L409 593H345Z" fill="#fff" stroke="#000" stroke-width="6"/>
    <path d="M638 537Q669 515 686 532Q697 546 678 552" stroke-width="12"/>
    <circle cx="471" cy="803" r="36" fill="#000" stroke-width="8"/>
    <path d="M471 803 440 761M471 803 502 844" stroke-width="9"/>
    <path d="M414 760H463M479 845H529" stroke-width="11"/>
  </g>

  <!-- Tail, body, neck, and a wing with comic-book feather marks. -->
  <g stroke="#000" stroke-linejoin="round" stroke-linecap="round">
    <path d="M392 518 309 506 359 542 300 555 391 568Z" fill="#fff" stroke-width="8"/>
    <path d="M518 448C503 402 508 353 535 317 545 282 574 268 591 285 598 309 569 339 564 368 576 405 579 434 561 467Z" fill="#fff" stroke-width="9"/>
    <path d="M370 473C352 415 390 376 458 387 517 396 558 448 576 513 595 581 548 631 481 629 414 627 374 572 370 473Z" fill="#fff" stroke-width="9"/>
    <path d="M397 453C429 405 506 416 537 481 519 549 467 567 425 536 398 516 389 486 397 453Z" fill="#000" stroke="#fff" stroke-width="6"/>
    <path d="M420 473Q462 450 501 484M429 500Q464 482 513 507M441 525Q470 515 500 530" fill="none" stroke="#fff" stroke-width="5"/>
  </g>

  <!-- Bent legs and webbed feet land on opposite pedals. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M426 595Q402 654 428 685L440 761M528 593Q558 650 547 689L502 844" stroke="#000" stroke-width="34"/>
    <path d="M426 595Q402 654 428 685L440 761M528 593Q558 650 547 689L502 844" stroke="#fff" stroke-width="20"/>
    <path d="M440 759 414 745 418 775 460 781 474 769M502 843 477 829 481 860 523 865 538 851" fill="#fff" stroke="#000" stroke-width="6"/>
  </g>

  <!-- The oversized bill and lemon-yellow pouch identify the rider. -->
  <g stroke="#000" stroke-linejoin="round" stroke-linecap="round">
    <path d="M548 321Q548 272 590 268Q637 267 649 313Q656 351 620 367Q578 382 552 351Q544 340 548 321Z" fill="#fff" stroke-width="9"/>
    <path d="M633 343 784 363Q812 370 793 385L648 371Z" fill="#fff" stroke-width="8"/>
    <path d="M646 370Q710 387 789 384 780 452 742 477 708 497 677 468 649 440 646 370Z" fill="#ffe34d" stroke-width="8"/>
    <path d="M656 385Q714 410 770 398" fill="none" stroke-width="5"/>
    <path d="M563 277 548 252 580 269 586 240 602 269" fill="#fff" stroke-width="7"/>
  </g>

  <!-- One arched brow and a sideways glance set the mood. -->
  <path d="M598 301Q622 286 639 297" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="619" cy="315" rx="8" ry="13" fill="#000"/>
  <circle cx="622" cy="310" r="3" fill="#fff"/>
  <path d="M566 341Q580 350 594 343" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- Crisp speed marks and a startled book complete the comic scene. -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M42 661Q103 623 171 627M51 691Q96 666 139 666M737 581Q801 565 850 601M769 612Q815 608 847 633" stroke-width="5"/>
    <path d="M329 917Q374 942 398 985M346 900Q393 914 421 942" stroke-width="3"/>
  </g>
  <path d="M735 193 766 178 790 193 817 181V238L791 253 765 238 735 251Z" fill="#fff" stroke="#000" stroke-width="6"/>
  <path d="M791 193V252M749 204 778 198M802 205 811 201" fill="none" stroke="#000" stroke-width="3"/>
  <path d="M708 145 714 160 730 166 714 172 708 188 701 172 686 166 701 160Z" fill="#fff"/>
</svg>