    <path d="M543 340q37 85 117-5-14 96-83 113-52-8-53-105Z" fill="#fff" stroke-width="9"/>
    <path d="M543 341q75 18 117-6" fill="none" stroke-width="5"/>
    <circle cx="524" cy="300" r="15" fill="#fff" stroke-width="5"/>
    <circle cx="530" cy="301" r="6" fill="#111" stroke="none"/>
