  <!-- Sharp comic shadows and a little motion. -->
  <g fill="none" stroke="#111" stroke-linecap="round">
    <path d="m75 556-33-23m39 54-47-9m652-49 41-30m-30 60 55-9" stroke-width="7"/>
    <path d="M326 823q69 28 125 0m-95 22q43 17 73 7" stroke-width="4"/>
