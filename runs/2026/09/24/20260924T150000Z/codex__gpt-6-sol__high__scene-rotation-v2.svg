<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pelican cycling through a library aisle</title>
  <desc id="desc">A comic black-and-white worm's-eye view between towering bookshelves. A single lemon-yellow desk lamp shines on a pelican riding a bicycle overhead.</desc>

  <rect width="800" height="1000" fill="#fff"/>

  <!-- Bookshelves rise toward the narrow opening overhead. -->
  <g fill="none" stroke="#111" stroke-linejoin="round">
    <path d="M0 0 326 126 281 1000H0Z" fill="#111"/>
    <path d="M800 0 474 126 519 1000h281Z" fill="#111"/>
    <path d="M20 31 305 145 261 963H20Z" fill="#fff" stroke-width="12"/>
    <path d="M780 31 495 145 539 963h241Z" fill="#fff" stroke-width="12"/>

    <g stroke-width="10">
      <path d="M20 270 298 293M20 490 289 507M20 710 278 718M20 900 265 897"/>
      <path d="M780 270 502 293M780 490 511 507M780 710 522 718M780 900 535 897"/>
    </g>

    <!-- Uneven book spines make the shelves feel crowded. -->
    <g stroke-width="5">
      <path d="M40 69 43 270M72 83 76 274M103 97 105 277M137 110 133 280M169 123 168 283M199 136 201 285M236 150 233 289M269 163 265 292"/>
      <path d="M760 69 757 270M728 83 724 274M697 97 695 277M663 110 667 280M631 123 632 283M601 136 599 285M564 150 567 289M531 163 535 292"/>
