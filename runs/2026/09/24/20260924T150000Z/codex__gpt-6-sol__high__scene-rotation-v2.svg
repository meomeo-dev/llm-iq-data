  <g stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="222" cy="733" rx="116" ry="167" transform="rotate(-18 222 733)" fill="#fff" stroke-width="15"/>
    <ellipse cx="583" cy="733" rx="116" ry="167" transform="rotate(18 583 733)" fill="#fff" stroke-width="15"/>
    <g fill="none" stroke-width="3">
      <path d="M222 733 167 583M222 733 255 571M222 733 319 632M222 733 331 781M222 733 262 897M222 733 149 867M222 733 109 711"/>
