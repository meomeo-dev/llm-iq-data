      <path d="m357 516-33-57m-24 0h72"/>
      <path d="m522 439 63-20m-63 20-40-21"/>
    </g>
    <circle cx="448" cy="733" r="33" fill="#fff" stroke-width="10"/>
    <circle cx="448" cy="733" r="9" fill="#111" stroke="none"/>
    <path d="m448 733 30 72 42 4m-72-76-32-67-45-5" fill="none" stroke-width="10"/>
    <path d="M501 811h45M346 659h46" fill="none" stroke-width="12"/>
  </g>

