      <path d="M39 503 40 709M78 506 77 712M119 510 119 714M158 513 160 716M201 515 201 718M243 518 243 719"/>
      <path d="M761 503 760 709M722 506 723 712M681 510 681 714M642 513 640 716M599 515 599 718M557 518 557 719"/>
      <path d="M42 725 42 897M88 728 86 898M130 730 132 899M177 730 176 899M225 732 222 898"/>
      <path d="M758 725 758 897M712 728 714 898M670 730 668 899M623 730 624 899M575 732 578 898"/>
    </g>
    <g stroke-width="3">
      <path d="M0 0 326 126M800 0 474 126M281 1000 326 126M519 1000 474 126"/>
      <path d="M330 0 382 132M470 0 418 132M400 0v126"/>
    </g>
  </g>

  <!-- One hard point light: the bulb is the only color. -->
  <g stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <path d="M594 190 664 115 711 139M664 115l-18-47" fill="none" stroke-width="11"/>
    <circle cx="664" cy="115" r="9" fill="#111"/>
    <path d="m552 168 64-33 30 58-69 23Z" fill="#fff" stroke-width="8"/>
    <circle cx="580" cy="218" r="18" fill="#f4e12b" stroke-width="6"/>
    <path d="M567 232 363 649M594 231 676 641" fill="none" stroke-width="3"/>
    <path d="M543 217 350 407M614 219 701 410" fill="none" stroke-width="2"/>
  </g>

