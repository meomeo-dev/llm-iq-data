<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">The Midnight Library Ride</title>
  <desc id="desc">A mischievous pelican pedals a bicycle above a narrow library aisle, seen from directly below. Towering black and white bookshelves frame the view, and one lemon-yellow desk lamp casts a hard pool of light.</desc>

  <rect width="800" height="1000" fill="#fff"/>

  <!-- The upward view: shelves rise on either side and close in overhead. -->
  <path d="M0 0H800L590 290 520 1000H0Z" fill="#111"/>
  <path d="M800 0H0L210 290 280 1000H800Z" fill="#111" opacity="0"/>
  <path d="M800 0 590 290 520 1000H800Z" fill="#111"/>
  <path d="M0 0 210 290 280 1000H0Z" fill="#111"/>

  <!-- Narrow ceiling opening, with the shelves converging toward it. -->
  <path d="M210 290 315 116H485L590 290 520 1000H280Z" fill="#f7f7f7"/>
  <path d="M315 116 400 0 485 116Z" fill="#111"/>
  <path d="M334 119 400 33 466 119Z" fill="#fff"/>

  <!-- Left shelf uprights and repeated shelf edges. -->
  <path d="M0 0 210 290M78 0 258 290M0 0V1000M280 1000 210 290"
        fill="none" stroke="#fff" stroke-width="9"/>
  <path d="M0 230 223 302M0 365 237 434M0 510 251 570M0 665 266 716M0 830 276 870"
        fill="none" stroke="#fff" stroke-width="12"/>
  <path d="M16 236 205 296M18 371 222 429M18 516 238 565M18 671 251 711M18 836 263 866"
        fill="none" stroke="#888" stroke-width="2"/>

  <!-- Books on the left, compressed by the extreme upward perspective. -->
  <g fill="#fff" stroke="#111" stroke-width="3">
    <path d="M13 174 42 181 42 228 13 220Z"/>
    <path d="M45 181 73 188 72 236 45 229Z"/>
    <path d="M77 188 108 196 108 244 76 237Z"/>
    <path d="M111 197 140 204 140 252 110 245Z"/>
    <path d="M143 205 174 214 174 261 143 253Z"/>
    <path d="M176 214 205 222 205 270 176 262Z"/>
    <path d="M12 306 43 314 43 360 12 352Z"/>
    <path d="M46 315 77 324 77 370 45 362Z"/>
    <path d="M80 325 111 334 111 379 79 371Z"/>
    <path d="M114 335 145 344 144 389 113 380Z"/>
    <path d="M148 345 179 354 178 398 146 390Z"/>
    <path d="M181 355 219 365 218 408 179 399Z"/>
    <path d="M12 454 47 462 47 506 12 498Z"/>
    <path d="M51 463 86 472 86 516 50 507Z"/>
    <path d="M90 473 125 482 125 526 89 517Z"/>
    <path d="M129 483 164 492 164 536 128 527Z"/>
    <path d="M168 493 207 503 207 545 167 537Z"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2">
    <path d="M20 187 20 218M52 194 52 227M84 201 84 235M118 210 118 244M151 219 151 252M184 228 184 261"/>
    <path d="M20 319 20 350M55 329 55 360M89 339 89 369M123 349 123 379M157 359 157 389M191 369 191 398"/>
    <path d="M21 466 21 496M60 475 60 505M99 485 99 515M138 495 138 525M177 505 177 534"/>
  </g>

  <!-- Books on the right. -->
  <g fill="#fff" stroke="#111" stroke-width="3">
    <path d="M595 222 626 214 626 262 595 270Z"/>
    <path d="M629 213 659 205 659 253 629 261Z"/>
    <path d="M662 204 693 196 693 244 662 252Z"/>
    <path d="M696 195 727 187 727 235 696 243Z"/>
    <path d="M730 186 761 178 761 226 730 234Z"/>
    <path d="M595 365 631 355 631 399 595 408Z"/>
    <path d="M635 354 670 344 670 390 634 399Z"/>
    <path d="M674 343 709 333 709 380 673 389Z"/>
    <path d="M713 332 748 322 748 370 712 379Z"/>
    <path d="M752 321 788 311 788 360 751 369Z"/>
    <path d="M593 503 629 493 629 537 593 545Z"/>
    <path d="M633 492 670 482 670 527 632 536Z"/>
    <path d="M674 481 711 471 711 516 673 526Z"/>
    <path d="M715 470 752 460 752 506 714 515Z"/>
    <path d="M756 459 793 449 793 496 755 505Z"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2">
    <path d="M618 220 618 263M652 211 652 254M685 202 685 245M719 193 719 236M753 184 753 227"/>
    <path d="M623 363 623 400M662 352 662 390M701 341 701 380M740 330 740 369M780 319 780 359"/>
    <path d="M621 500 621 538M662 489 662 527M703 478 703 516M744 467 744 506M784 456 784 496"/>
  </g>

  <!-- One overhead lamp: the only lemon-yellow accent. -->
  <path d="M399 0V105" stroke="#111" stroke-width="7"/>
  <path d="M367 105Q400 78 433 105L424 134Q400 146 376 134Z"
        fill="#111" stroke="#111" stroke-width="4"/>
  <path d="M377 125Q400 113 423 125L418 140Q400 149 382 140Z"
        fill="#f4df28" stroke="#111" stroke-width="3"/>
  <path d="M383 145 288 358M417 145 512 358M400 151V377"
        fill="none" stroke="#111" stroke-width="2"/>
  <path d="M387 151 332 320M413 151 468 320"
        fill="none" stroke="#fff" stroke-width="2"/>

  <!-- Pelican and bicycle seen from underneath. -->
  <g transform="translate(400 532) rotate(-9)">
    <!-- Bicycle wheels -->
    <circle cx="-142" cy="68" r="91" fill="none" stroke="#111" stroke-width="12"/>
    <circle cx="145" cy="68" r="91" fill="none" stroke="#111" stroke-width="12"/>
    <circle cx="-142" cy="68" r="79" fill="none" stroke="#777" stroke-width="2"/>
    <circle cx="145" cy="68" r="79" fill="none" stroke="#777" stroke-width="2"/>

    <!-- Spokes -->
    <g stroke="#777" stroke-width="2">
      <path d="M-142 -16V152M-226 68H-58M-201 9-83 127M-201 127-83 9"/>
      <path d="M145 -16V152M61 68H229M86 9 204 127M86 127 204 9"/>
    </g>

    <!-- Frame, fork, handlebar, and crank -->
    <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-142 68-44 68 15 5 145 68 15 5 3 68-142 68"
            stroke-width="10"/>
      <path d="M145 68 178 0 202 -7M178 0 156 -17"
            stroke-width="8"/>
      <path d="M-44 68-58 3M-76 2-39 2M-58 3-35 -8"
            stroke-width="8"/>
      <path d="M3 68 26 92M3 68-18 45"
            stroke-width="7"/>
      <circle cx="3" cy="68" r="12" fill="#fff" stroke-width="6"/>
      <path d="M-18 45-38 43M26 92 46 94" stroke-width="6"/>
    </g>

    <!-- Pelican body, belly, and wing -->
    <path d="M-56 -104Q-39 -174 41 -173Q112 -170 130 -113
             Q147 -66 100 -31L31 -19Q-35 -28 -56 -104Z"
          fill="#fff" stroke="#111" stroke-width="8"/>
    <path d="M-28 -92Q5 -130 53 -126Q89 -123 109 -91
             Q82 -58 31 -51Q-9 -54 -28 -92Z"
          fill="#111" stroke="#111" stroke-width="5"/>
    <path d="M-16 -88Q20 -112 57 -106Q80 -102 94 -85
             Q65 -67 28 -67Q3 -69 -16 -88Z"
          fill="#fff"/>

    <!-- Long neck and comic head -->
    <path d="M63 -147Q75 -207 108 -246L147 -226
             Q118 -188 111 -144Z"
          fill="#fff" stroke="#111" stroke-width="8"/>
    <path d="M92 -234Q105 -285 155 -284Q202 -282 209 -242
             Q213 -209 176 -195Q134 -186 108 -207Z"
          fill="#fff" stroke="#111" stroke-width="8"/>
    <path d="M181 -249Q239 -265 287 -244Q247 -220 188 -220Z"
          fill="#111" stroke="#111" stroke-width="6"/>
    <path d="M187 -224Q228 -230 263 -219Q243 -182 210 -177
             Q184 -180 176 -198Z"
          fill="#fff" stroke="#111" stroke-width="6"/>
    <path d="M190 -220Q222 -222 249 -217"
          fill="none" stroke="#111" stroke-width="3"/>

    <!-- Expressive eye and feather tuft -->
    <circle cx="164" cy="-252" r="12" fill="#111"/>
    <circle cx="168" cy="-256" r="3" fill="#fff"/>
    <path d="M123 -279Q104 -309 124 -322M139 -281Q132 -315 151 -326M154 -281Q160 -307 177 -314"
          fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>

    <!-- Pedaling legs -->
    <path d="M32 -25Q4 6 -27 26L-50 39M75 -28Q91 2 53 31L35 47"
          fill="none" stroke="#111" stroke-width="11" stroke-linecap="round"/>
    <path d="M-50 39-72 41M35 47 55 54"
          fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>

    <!-- Wing feathers -->
    <path d="M-23 -102Q-1 -122 22 -125M-8 -79Q19 -101 45 -105M8 -60Q35 -81 61 -83"
          fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

    <!-- Little motion marks -->
    <path d="M-264 -15l-30 -10M-270 8l-34 0M253 24l32 -11"
          fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Small comic punctuation in the open aisle. -->
  <path d="M326 701q-17 17 0 32M477 703q17 17 0 32"
        fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <path d="M390 786q10 -14 20 0t20 0"
        fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
</svg>