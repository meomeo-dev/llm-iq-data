<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700"
     viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">
    A cheerful white pelican with a long orange bill rides a teal bicycle
    along a seaside path, its webbed feet on the pedals.
  </desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#dff3f3"/>
      <stop offset="1" stop-color="#fff9e9"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd176"/>
      <stop offset="1" stop-color="#f39a51"/>
    </linearGradient>
  </defs>

  <!-- Seaside backdrop -->
  <rect width="900" height="700" rx="32" fill="url(#sky)"/>
  <circle cx="728" cy="135" r="57" fill="#ffda88"/>
  <g fill="#fff" opacity=".8">
    <path d="M90 152c-8-24 22-43 43-28 5-32 55-37 66-5
             26-12 49 8 44 33Z"/>
    <path d="M573 92c-5-17 16-30 31-20 9-24 43-23 51 2
             19-5 33 6 31 18Z"/>
  </g>
  <path d="M0 440q115-20 230 0t230 0t230 0t210 0v128H0Z"
        fill="#b5ded9"/>
  <g fill="none" stroke="#eaf7ef" stroke-width="4" stroke-linecap="round">
    <path d="M38 479h93m45 23h66m423-24h89m35 29h60"/>
    <path d="M49 524h51m647 4h75"/>
  </g>
  <path d="M0 556q235-18 450 0t450 0v144H0Z" fill="#eedebc"/>
  <path d="M0 612q380-14 900 0" fill="none" stroke="#dfcba5"
        stroke-width="3"/>
  <ellipse cx="451" cy="604" rx="300" ry="22" fill="#b9aa8a" opacity=".23"/>

  <!-- Wheels and spokes -->
  <g fill="#f8f7ec" stroke="#263e46" stroke-width="12">
    <circle cx="269" cy="487" r="111"/>
    <circle cx="648" cy="487" r="111"/>
  </g>
  <g fill="none" stroke="#a6babb" stroke-width="2.5">
    <circle cx="269" cy="487" r="96"/>
    <circle cx="648" cy="487" r="96"/>
    <path d="M269 391v192m-96-96h192m-164-68 136 136m-136 0 136-136
             M648 391v192m-96-96h192m-164-68 136 136m-136 0 136-136"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m269 487 102-155 70 155H269l139-134h175L441 487"
          stroke="#207c80" stroke-width="13"/>
    <path d="m583 353 65 134m-65-134-18-51 34-35h30"
          stroke="#207c80" stroke-width="12"/>
    <path d="m371 332-13-37" stroke="#647a7c" stroke-width="9"/>
    <path d="M330 295h66" stroke="#283e46" stroke-width="17"/>
    <path d="M603 266h31q18 0 18 16" stroke="#283e46" stroke-width="10"/>
    <path d="M625 277q-31 37-18 90" stroke="#526d70" stroke-width="3"/>
    <path d="M268 487h173" stroke="#526d70" stroke-width="5"/>
  </g>
  <g fill="#e5c899" stroke="#344e53" stroke-width="5">
    <circle cx="269" cy="487" r="10"/>
    <circle cx="648" cy="487" r="10"/>
    <circle cx="441" cy="487" r="23"/>
  </g>
  <path d="m412 452 29 35 35 31" fill="none" stroke="#344e53"
        stroke-width="7" stroke-linecap="round"/>
  <g stroke="#263e46" stroke-width="9" stroke-linecap="round">
    <path d="M393 455h37"/>
    <path d="M459 521h39"/>
  </g>

  <!-- Far leg and webbed foot -->
  <path d="m383 321 19 70 9 52" fill="none" stroke="#de8d41"
        stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m407 438-22 14 16 2 11-4 16 4 12-7-21-12Z"
        fill="#eda34d" stroke="#965e35" stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Tail, body, and long curved neck -->
  <path d="m324 272-64-38 17 46-24-8q28 42 77 39"
        fill="#e6e9df" stroke="#334b51" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M305 244
           C322 212 368 203 410 212
           C439 218 453 208 457 180
           L461 144
           C464 110 489 91 518 96
           C551 101 562 130 549 154
           C538 173 520 182 517 207
           C513 241 524 272 502 301
           C477 336 418 351 364 331
           C320 315 295 283 305 244Z"
        fill="#fffdf2" stroke="#334b51" stroke-width="4.5"/>

  <!-- Feather shading -->
  <path d="M308 273q31 62 107 52 47-4 71-29-43 18-75 7
           -52-20-74-59-23 4-29 29Z" fill="#dce5df"/>
  <path d="M482 181q-9 59 12 86" fill="none" stroke="#dce5df"
        stroke-width="13" stroke-linecap="round"/>

  <!-- Near leg and foot -->
  <path d="m419 329 42 68-13 77 28 34"
        fill="none" stroke="#eea34a" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m470 501-12 17 15-2 12 5 12-4 20 1-9-12-25-8Z"
        fill="#ffb952" stroke="#965e35" stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Wing reaching the handlebars -->
  <path d="M357 236
           C391 217 415 231 447 246
           C488 265 536 261 593 258
           Q612 258 617 269
           Q605 281 585 282
           C518 296 466 300 419 285
           Q377 275 357 236Z"
        fill="#f1f2e8" stroke="#334b51" stroke-width="4"
        stroke-linejoin="round"/>
  <g fill="none" stroke="#aebfb8" stroke-width="3" stroke-linecap="round">
    <path d="M400 249q72 39 180 23"/>
    <path d="M397 261q48 26 102 24"/>
  </g>

  <!-- Pelican throat pouch and long bill -->
  <path d="M536 149 732 166
           Q678 211 610 213
           Q558 213 533 167Z"
        fill="url(#pouch)" stroke="#334b51" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M538 143q92 1 194 23l-195 1Z"
        fill="#ffc25a" stroke="#334b51" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M556 178q48 34 114 11" fill="none" stroke="#e7924a"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M535 144q-9 15-1 28" fill="none" stroke="#334b51"
        stroke-width="3" stroke-linecap="round"/>

  <!-- Face and crest -->
  <circle cx="515" cy="130" r="10" fill="#f7d984"/>
  <circle cx="517" cy="130" r="5.5" fill="#253d46"/>
  <circle cx="519" cy="128" r="1.8" fill="#fff"/>
  <path d="M499 110q11-7 21-3" fill="none" stroke="#334b51"
        stroke-width="3" stroke-linecap="round"/>
  <path d="m478 107-5-19 17 11 1-20 13 17"
        fill="#fffdf2" stroke="#334b51" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Red neckerchief fluttering in the breeze -->
  <path d="m458 194 59 16-4 16-59-16Z"
        fill="#e46d58" stroke="#334b51" stroke-width="3"/>
  <path d="M457 201q-39-16-66-4l18 13-23 17q45 0 72-17Z"
        fill="#e46d58" stroke="#334b51" stroke-width="3"
        stroke-linejoin="round"/>
  <circle cx="457" cy="205" r="9" fill="#f4886b"
          stroke="#334b51" stroke-width="3"/>

  <!-- Motion accents -->
  <g fill="none" stroke="#739c9c" stroke-width="4" stroke-linecap="round">
    <path d="M155 327h57m-74 22h44m-44 91h-31"/>
    <path d="m770 562 13-8m-5 23h18"/>
  </g>
  <g fill="#c5b287">
    <ellipse cx="159" cy="636" rx="13" ry="3"/>
    <ellipse cx="716" cy="643" rx="18" ry="3"/>
    <ellipse cx="746" cy="627" rx="7" ry="2.5"/>
  </g>
</svg>