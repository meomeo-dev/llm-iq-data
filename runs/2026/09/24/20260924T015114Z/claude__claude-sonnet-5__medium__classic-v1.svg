<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#bfe9ff"/>
  <rect x="0" y="280" width="500" height="70" fill="#8fce7a"/>

  <!-- bicycle wheels -->
  <circle cx="160" cy="270" r="45" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="340" cy="270" r="45" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="160" cy="270" r="4" fill="#333"/>
  <circle cx="340" cy="270" r="4" fill="#333"/>

  <!-- spokes -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="160" y1="270" x2="160" y2="225"/>
    <line x1="160" y1="270" x2="160" y2="315"/>
    <line x1="160" y1="270" x2="115" y2="270"/>
    <line x1="160" y1="270" x2="205" y2="270"/>
    <line x1="160" y1="270" x2="128" y2="238"/>
    <line x1="160" y1="270" x2="192" y2="302"/>
    <line x1="160" y1="270" x2="128" y2="302"/>
    <line x1="160" y1="270" x2="192" y2="238"/>

    <line x1="340" y1="270" x2="340" y2="225"/>
    <line x1="340" y1="270" x2="340" y2="315"/>
    <line x1="340" y1="270" x2="295" y2="270"/>
    <line x1="340" y1="270" x2="385" y2="270"/>
    <line x1="340" y1="270" x2="308" y2="238"/>
    <line x1="340" y1="270" x2="372" y2="302"/>
    <line x1="340" y1="270" x2="308" y2="302"/>
    <line x1="340" y1="270" x2="372" y2="238"/>
  </g>

  <!-- frame -->
  <g stroke="#555" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="160" y1="270" x2="240" y2="200"/>
    <line x1="240" y1="200" x2="340" y2="270"/>
    <line x1="240" y1="200" x2="220" y2="270"/>
    <line x1="220" y1="270" x2="160" y2="270"/>
    <line x1="220" y1="270" x2="340" y2="270"/>
    <line x1="240" y1="200" x2="255" y2="150"/>
    <line x1="220" y1="270" x2="215" y2="200"/>
  </g>

  <!-- pedal & seat -->
  <circle cx="220" cy="270" r="6" fill="#555"/>
  <rect x="205" y="192" width="30" height="8" rx="4" fill="#663311"/>

  <!-- handlebar -->
  <line x1="255" y1="150" x2="285" y2="150" stroke="#555" stroke-width="6" stroke-linecap="round"/>

  <!-- pelican body -->
  <ellipse cx="245" cy="150" rx="55" ry="38" fill="#f2f2f2" stroke="#ccc" stroke-width="2"/>

  <!-- pelican wing -->
  <path d="M 220 130 Q 180 120 190 165 Q 220 165 235 150 Z" fill="#dedede" stroke="#bbb" stroke-width="1.5"/>

  <!-- pelican tail -->
  <path d="M 295 150 Q 320 140 315 165 Q 300 165 292 158 Z" fill="#e0e0e0"/>

  <!-- pelican legs to pedal & seat -->
  <line x1="250" y1="185" x2="220" y2="264" stroke="#e8a33d" stroke-width="5" stroke-linecap="round"/>
  <line x1="230" y1="185" x2="205" y2="195" stroke="#e8a33d" stroke-width="5" stroke-linecap="round"/>

  <!-- pelican neck & head -->
  <path d="M 275 125 Q 300 90 330 95 Q 340 97 335 108 Q 315 108 300 130 Z" fill="#f2f2f2" stroke="#ccc" stroke-width="2"/>
  <circle cx="325" cy="100" r="16" fill="#f2f2f2" stroke="#ccc" stroke-width="2"/>

  <!-- pelican beak & pouch -->
  <path d="M 340 98 Q 385 100 388 112 Q 385 122 355 118 Q 345 112 340 98 Z" fill="#f5a623" stroke="#d18c1a" stroke-width="1.5"/>
  <path d="M 345 112 Q 370 122 383 113 Q 375 128 350 122 Z" fill="#f7c873"/>

  <!-- eye -->
  <circle cx="330" cy="96" r="2.5" fill="#333"/>

  <!-- pelican arm/wing gripping handlebar -->
  <path d="M 260 140 Q 270 155 275 150" stroke="#e0e0e0" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ground shadow -->
  <ellipse cx="250" cy="318" rx="120" ry="10" fill="#000" opacity="0.1"/>
</svg>