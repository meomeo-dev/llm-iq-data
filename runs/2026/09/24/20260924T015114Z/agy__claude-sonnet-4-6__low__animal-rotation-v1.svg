<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F4FF"/>
    </radialGradient>
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F5DEB3"/>
      <stop offset="100%" stop-color="#DEB887"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="500" height="380" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <g opacity="0.85">
    <ellipse cx="80" cy="60" rx="40" ry="22" fill="white"/>
    <ellipse cx="110" cy="50" rx="30" ry="20" fill="white"/>
    <ellipse cx="55" cy="65" rx="25" ry="16" fill="white"/>
  </g>
  <g opacity="0.75">
    <ellipse cx="380" cy="80" rx="45" ry="24" fill="white"/>
    <ellipse cx="415" cy="68" rx="32" ry="21" fill="white"/>
    <ellipse cx="355" cy="85" rx="28" ry="17" fill="white"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="310" width="500" height="70" fill="#6db33f"/>
  <rect x="0" y="310" width="500" height="12" fill="#5aa232"/>
  <!-- Road -->
  <rect x="0" y="300" width="500" height="22" fill="#888"/>
  <rect x="0" y="309" width="500" height="4" fill="#777"/>
  <!-- Road dashes -->
  <rect x="30"  y="309" width="50" height="4" fill="#FFD700"/>
  <rect x="140" y="309" width="50" height="4" fill="#FFD700"/>
  <rect x="250" y="309" width="50" height="4" fill="#FFD700"/>
  <rect x="360" y="309" width="50" height="4" fill="#FFD700"/>

  <!-- ======================== BICYCLE ======================== -->
  <!-- Rear wheel -->
  <circle cx="195" cy="280" r="58" fill="none" stroke="url(#wheelGrad)" stroke-width="10" filter="url(#shadow)"/>
  <circle cx="195" cy="280" r="52" fill="none" stroke="#444" stroke-width="2"/>
  <!-- Rear spokes -->
  <g stroke="#666" stroke-width="2">
    <line x1="195" y1="228" x2="195" y2="332"/>
    <line x1="143" y1="280" x2="247" y2="280"/>
    <line x1="159" y1="244" x2="231" y2="316"/>
    <line x1="231" y1="244" x2="159" y2="316"/>
  </g>
  <circle cx="195" cy="280" r="8" fill="#333" stroke="#666" stroke-width="2"/>
  <circle cx="195" cy="280" r="4" fill="#aaa"/>

  <!-- Front wheel -->
  <circle cx="345" cy="280" r="58" fill="none" stroke="url(#wheelGrad)" stroke-width="10" filter="url(#shadow)"/>
  <circle cx="345" cy="280" r="52" fill="none" stroke="#444" stroke-width="2"/>
  <!-- Front spokes -->
  <g stroke="#666" stroke-width="2">
    <line x1="345" y1="228" x2="345" y2="332"/>
    <line x1="293" y1="280" x2="397" y2="280"/>
    <line x1="309" y1="244" x2="381" y2="316"/>
    <line x1="381" y1="244" x2="309" y2="316"/>
  </g>
  <circle cx="345" cy="280" r="8" fill="#333" stroke="#666" stroke-width="2"/>
  <circle cx="345" cy="280" r="4" fill="#aaa"/>

  <!-- Tires highlight -->
  <circle cx="195" cy="280" r="58" fill="none" stroke="white" stroke-width="2" opacity="0.15"/>
  <circle cx="345" cy="280" r="58" fill="none" stroke="white" stroke-width="2" opacity="0.15"/>

  <!-- Frame: seat stay (rear hub to seat tube) -->
  <line x1="195" y1="280" x2="248" y2="210" stroke="#e63946" stroke-width="7" stroke-linecap="round"/>
  <!-- Chain stay (rear hub to bottom bracket) -->
  <line x1="195" y1="280" x2="265" y2="258" stroke="#e63946" stroke-width="7" stroke-linecap="round"/>
  <!-- Bottom bracket -->
  <circle cx="265" cy="258" r="10" fill="#c1121f" stroke="#a00" stroke-width="2"/>
  <!-- Down tube (head tube to bottom bracket) -->
  <line x1="320" y1="195" x2="265" y2="258" stroke="#e63946" stroke-width="7" stroke-linecap="round"/>
  <!-- Seat tube -->
  <line x1="248" y1="210" x2="265" y2="258" stroke="#e63946" stroke-width="7" stroke-linecap="round"/>
  <!-- Top tube -->
  <line x1="248" y1="210" x2="320" y2="195" stroke="#e63946" stroke-width="7" stroke-linecap="round"/>
  <!-- Fork (head tube to front hub) -->
  <line x1="320" y1="195" x2="345" y2="280" stroke="#e63946" stroke-width="7" stroke-linecap="round"/>
  <!-- Head tube -->
  <rect x="314" y="185" width="12" height="28" rx="5" fill="#c1121f" stroke="#900" stroke-width="1.5"/>

  <!-- Seat post -->
  <line x1="248" y1="210" x2="240" y2="185" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <!-- Saddle -->
  <ellipse cx="236" cy="182" rx="28" ry="9" fill="#222" stroke="#111" stroke-width="2"/>
  <ellipse cx="236" cy="180" rx="26" ry="7" fill="#333"/>

  <!-- Handlebar stem -->
  <line x1="320" y1="192" x2="338" y2="168" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="325" y1="162" x2="355" y2="165" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <!-- Handlebar grips -->
  <ellipse cx="325" cy="162" rx="6" ry="4" fill="#111"/>
  <ellipse cx="355" cy="165" rx="6" ry="4" fill="#111"/>

  <!-- Pedal arm -->
  <line x1="265" y1="258" x2="275" y2="275" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <rect x="272" y="273" width="20" height="6" rx="3" fill="#333"/>

  <!-- ======================== HEDGEHOG ======================== -->
  <!-- Body -->
  <ellipse cx="240" cy="198" rx="52" ry="40" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Belly -->
  <ellipse cx="228" cy="210" rx="28" ry="22" fill="url(#bellyGrad)"/>

  <!-- Spines on back (arcing over the body) -->
  <g stroke="#5D3A1A" stroke-width="2" stroke-linecap="round">
    <!-- Row 1 - top spines -->
    <line x1="250" y1="163" x2="268" y2="138"/>
    <line x1="265" y1="166" x2="285" y2="143"/>
    <line x1="278" y1="172" x2="300" y2="152"/>
    <line x1="288" y1="180" x2="312" y2="163"/>
    <line x1="237" y1="162" x2="253" y2="136"/>
    <line x1="224" y1="163" x2="237" y2="137"/>
    <!-- Row 2 - mid spines -->
    <line x1="210" y1="168" x2="218" y2="142"/>
    <line x1="293" y1="188" x2="318" y2="175"/>
    <line x1="286" y1="196" x2="312" y2="187"/>
    <line x1="200" y1="178" x2="204" y2="153"/>
    <!-- Row 3 - lower spines -->
    <line x1="193" y1="190" x2="193" y2="165"/>
    <line x1="191" y1="203" x2="188" y2="178"/>
    <line x1="285" y1="207" x2="308" y2="203"/>
    <!-- Row 4 - tip spines -->
    <line x1="197" y1="216" x2="190" y2="192"/>
    <line x1="279" y1="216" x2="300" y2="215"/>
  </g>
  <!-- Spine tips (lighter color) -->
  <g stroke="#A0522D" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="260" y1="150" x2="268" y2="138"/>
    <line x1="277" y1="154" x2="285" y2="143"/>
    <line x1="292" y1="162" x2="300" y2="152"/>
    <line x1="303" y1="172" x2="312" y2="163"/>
    <line x1="245" y1="148" x2="253" y2="136"/>
    <line x1="231" y1="149" x2="237" y2="137"/>
    <line x1="213" y1="152" x2="218" y2="142"/>
    <line x1="308" y1="183" x2="318" y2="175"/>
  </g>

  <!-- Head -->
  <ellipse cx="200" cy="193" rx="35" ry="30" fill="#c8a96e" filter="url(#shadow)"/>
  <ellipse cx="200" cy="193" rx="35" ry="30" fill="url(#bodyGrad)"/>

  <!-- Snout -->
  <ellipse cx="175" cy="200" rx="18" ry="13" fill="#DEB887"/>
  <ellipse cx="171" cy="202" rx="10" ry="7" fill="#c8a06e"/>

  <!-- Nose -->
  <ellipse cx="164" cy="199" rx="7" ry="5" fill="#3d1a00"/>
  <ellipse cx="162" cy="198" rx="3" ry="2" fill="#5a2500"/>
  <!-- Nose shine -->
  <ellipse cx="162" cy="197" rx="2" ry="1.5" fill="white" opacity="0.5"/>

  <!-- Eye -->
  <circle cx="184" cy="186" r="9" fill="#1a0a00"/>
  <circle cx="184" cy="186" r="7" fill="#111"/>
  <!-- Eye shine -->
  <circle cx="187" cy="183" r="3" fill="white"/>
  <circle cx="186" cy="184" r="1.5" fill="white" opacity="0.6"/>

  <!-- Ear -->
  <ellipse cx="203" cy="168" rx="10" ry="12" fill="#c8a96e" transform="rotate(-15,203,168)"/>
  <ellipse cx="203" cy="169" rx="6" ry="8" fill="#e8c090" transform="rotate(-15,203,169)"/>

  <!-- Mouth / smile -->
  <path d="M 168 205 Q 173 211 180 207" stroke="#5D3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <g stroke="#5D3A1A" stroke-width="1.2" opacity="0.7" stroke-linecap="round">
    <line x1="163" y1="196" x2="140" y2="190"/>
    <line x1="163" y1="199" x2="139" y2="199"/>
    <line x1="163" y1="202" x2="141" y2="207"/>
    <line x1="163" y1="196" x2="155" y2="185"/>
  </g>

  <!-- Arms / paws holding handlebars -->
  <!-- Left arm (to handlebar) -->
  <path d="M 182 208 Q 260 215 335 165" stroke="#c8a96e" stroke-width="9" fill="none" stroke-linecap="round"/>
  <ellipse cx="337" cy="164" rx="10" ry="7" fill="#DEB887" transform="rotate(-10,337,164)"/>
  <!-- Right arm (to handlebar) -->
  <path d="M 182 215 Q 255 225 353 168" stroke="#c8a96e" stroke-width="9" fill="none" stroke-linecap="round"/>
  <ellipse cx="355" cy="167" rx="10" ry="7" fill="#DEB887" transform="rotate(-5,355,167)"/>

  <!-- Legs on pedals -->
  <!-- Right leg -->
  <path d="M 218 228 Q 255 255 275 275" stroke="#c8a96e" stroke-width="9" fill="none" stroke-linecap="round"/>
  <ellipse cx="276" cy="277" rx="11" ry="7" fill="#DEB887"/>
  <!-- Left leg -->
  <path d="M 218 235 Q 240 250 255 265" stroke="#c8a96e" stroke-width="8" fill="none" stroke-linecap="round"/>
  <ellipse cx="252" cy="267" rx="9" ry="6" fill="#DEB887"/>

  <!-- Helmet -->
  <ellipse cx="200" cy="170" rx="36" ry="22" fill="#FFD700"/>
  <ellipse cx="200" cy="175" rx="38" ry="10" fill="#FFC200"/>
  <!-- Helmet stripes -->
  <path d="M 172 155 Q 200 148 228 155" stroke="white" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 167 163 Q 200 155 233 163" stroke="white" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round"/>
  <!-- Helmet chin strap -->
  <path d="M 165 178 Q 168 192 175 197" stroke="#cc9900" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Speed lines -->
  <g stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="100" y1="220" x2="140" y2="220"/>
    <line x1="90"  y1="235" x2="138" y2="235"/>
    <line x1="105" y1="250" x2="142" y2="250"/>
    <line x1="80"  y1="265" x2="140" y2="265"/>
  </g>

  <!-- Sun -->
  <circle cx="450" cy="55" r="30" fill="#FFE135" opacity="0.9"/>
  <g stroke="#FFE135" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="450" y1="15" x2="450" y2="5"/>
    <line x1="450" y1="95" x2="450" y2="105"/>
    <line x1="410" y1="55" x2="400" y2="55"/>
    <line x1="490" y1="55" x2="500" y2="55"/>
    <line x1="422" y1="27" x2="415" y2="20"/>
    <line x1="478" y1="83" x2="485" y2="90"/>
    <line x1="478" y1="27" x2="485" y2="20"/>
    <line x1="422" y1="83" x2="415" y2="90"/>
  </g>
</svg>