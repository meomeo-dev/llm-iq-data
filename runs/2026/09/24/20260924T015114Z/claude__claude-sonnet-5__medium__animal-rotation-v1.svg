<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect x="0" y="0" width="400" height="300" fill="#bfe6f5"/>
  <rect x="0" y="230" width="400" height="70" fill="#8bc47e"/>

  <!-- sun -->
  <circle cx="350" cy="50" r="25" fill="#ffd93d"/>

  <!-- bicycle wheels -->
  <circle cx="120" cy="220" r="45" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="280" cy="220" r="45" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="120" cy="220" r="6" fill="#333"/>
  <circle cx="280" cy="220" r="6" fill="#333"/>

  <!-- spokes -->
  <g stroke="#666" stroke-width="2">
    <line x1="120" y1="220" x2="120" y2="175"/>
    <line x1="120" y1="220" x2="120" y2="265"/>
    <line x1="120" y1="220" x2="80" y2="220"/>
    <line x1="120" y1="220" x2="160" y2="220"/>
    <line x1="120" y1="220" x2="90" y2="190"/>
    <line x1="120" y1="220" x2="150" y2="250"/>
    <line x1="120" y1="220" x2="150" y2="190"/>
    <line x1="120" y1="220" x2="90" y2="250"/>

    <line x1="280" y1="220" x2="280" y2="175"/>
    <line x1="280" y1="220" x2="280" y2="265"/>
    <line x1="280" y1="220" x2="240" y2="220"/>
    <line x1="280" y1="220" x2="320" y2="220"/>
    <line x1="280" y1="220" x2="250" y2="190"/>
    <line x1="280" y1="220" x2="310" y2="250"/>
    <line x1="280" y1="220" x2="310" y2="190"/>
    <line x1="280" y1="220" x2="250" y2="250"/>
  </g>

  <!-- bicycle frame -->
  <g stroke="#c0392b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="120" y1="220" x2="190" y2="150"/>
    <line x1="190" y1="150" x2="280" y2="220"/>
    <line x1="190" y1="150" x2="230" y2="150"/>
    <line x1="230" y1="150" x2="280" y2="220"/>
    <line x1="120" y1="220" x2="230" y2="150"/>
    <line x1="230" y1="150" x2="220" y2="110"/>
  </g>

  <!-- seat -->
  <rect x="175" y="140" width="26" height="8" rx="3" fill="#333"/>
  <line x1="190" y1="148" x2="190" y2="150" stroke="#333" stroke-width="4"/>

  <!-- handlebar -->
  <line x1="220" y1="110" x2="240" y2="110" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="220" y1="110" x2="218" y2="120" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- pedal/crank -->
  <circle cx="200" cy="220" r="8" fill="#555"/>
  <line x1="200" y1="220" x2="215" y2="235" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="220" x2="185" y2="205" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <rect x="210" y="232" width="14" height="5" rx="2" fill="#333"/>
  <rect x="176" y="200" width="14" height="5" rx="2" fill="#333"/>

  <!-- hedgehog body -->
  <g>
    <!-- legs -->
    <line x1="205" y1="175" x2="215" y2="235" stroke="#8a5a3b" stroke-width="7" stroke-linecap="round"/>
    <line x1="195" y1="180" x2="188" y2="205" stroke="#8a5a3b" stroke-width="7" stroke-linecap="round"/>

    <!-- arm to handlebar -->
    <line x1="200" y1="140" x2="222" y2="112" stroke="#8a5a3b" stroke-width="7" stroke-linecap="round"/>

    <!-- torso -->
    <ellipse cx="195" cy="150" rx="38" ry="26" fill="#a9713f"/>

    <!-- spikes on back -->
    <g fill="#7a4c28">
      <polygon points="165,130 158,118 172,122"/>
      <polygon points="172,120 165,106 180,112"/>
      <polygon points="182,113 176,99 190,106"/>
      <polygon points="194,109 189,95 202,103"/>
      <polygon points="206,110 202,96 214,105"/>
      <polygon points="216,116 213,102 226,112"/>
      <polygon points="160,142 152,132 166,132"/>
      <polygon points="158,155 148,148 163,146"/>
    </g>

    <!-- head -->
    <ellipse cx="228" cy="132" rx="20" ry="17" fill="#c68a52"/>
    <!-- snout -->
    <ellipse cx="246" cy="138" rx="9" ry="6" fill="#8a5a3b"/>
    <circle cx="253" cy="138" r="2" fill="#222"/>
    <!-- eye -->
    <circle cx="232" cy="127" r="3" fill="#222"/>
    <!-- ear -->
    <ellipse cx="216" cy="118" rx="5" ry="7" fill="#8a5a3b"/>

    <!-- feet -->
    <ellipse cx="217" cy="238" rx="9" ry="5" fill="#5c3a22"/>
    <ellipse cx="187" cy="207" rx="9" ry="5" fill="#5c3a22"/>
  </g>
</svg>