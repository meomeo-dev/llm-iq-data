<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F4FF;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#222;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="500" height="400" fill="url(#skyGrad)" rx="12"/>

  <!-- Ground -->
  <ellipse cx="250" cy="390" rx="240" ry="18" fill="#A8D5A2" opacity="0.5"/>
  <rect x="10" y="375" width="480" height="30" fill="#A8D5A2" rx="6"/>

  <!-- === BICYCLE === -->

  <!-- Rear Wheel -->
  <circle cx="160" cy="310" r="65" fill="none" stroke="url(#wheelGrad)" stroke-width="10"/>
  <circle cx="160" cy="310" r="6" fill="#444"/>
  <!-- Rear spokes -->
  <g stroke="#666" stroke-width="2">
    <line x1="160" y1="245" x2="160" y2="375"/>
    <line x1="95" y1="310" x2="225" y2="310"/>
    <line x1="114" y1="264" x2="206" y2="356"/>
    <line x1="206" y1="264" x2="114" y2="356"/>
    <line x1="113" y1="333" x2="207" y2="287"/>
    <line x1="113" y1="287" x2="207" y2="333"/>
  </g>

  <!-- Front Wheel -->
  <circle cx="340" cy="310" r="65" fill="none" stroke="url(#wheelGrad)" stroke-width="10"/>
  <circle cx="340" cy="310" r="6" fill="#444"/>
  <!-- Front spokes -->
  <g stroke="#666" stroke-width="2">
    <line x1="340" y1="245" x2="340" y2="375"/>
    <line x1="275" y1="310" x2="405" y2="310"/>
    <line x1="294" y1="264" x2="386" y2="356"/>
    <line x1="386" y1="264" x2="294" y2="356"/>
    <line x1="293" y1="333" x2="387" y2="287"/>
    <line x1="293" y1="287" x2="387" y2="333"/>
  </g>

  <!-- Bicycle frame -->
  <!-- Seat tube -->
  <line x1="215" y1="245" x2="220" y2="310" stroke="#E05C2A" stroke-width="8" stroke-linecap="round"/>
  <!-- Down tube -->
  <line x1="215" y1="245" x2="280" y2="310" stroke="#E05C2A" stroke-width="8" stroke-linecap="round"/>
  <!-- Top tube -->
  <line x1="215" y1="245" x2="305" y2="230" stroke="#E05C2A" stroke-width="8" stroke-linecap="round"/>
  <!-- Chain stay -->
  <line x1="220" y1="310" x2="160" y2="310" stroke="#E05C2A" stroke-width="7" stroke-linecap="round"/>
  <!-- Seat stay -->
  <line x1="215" y1="245" x2="160" y2="310" stroke="#C04A1A" stroke-width="6" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="305" y1="230" x2="340" y2="310" stroke="#E05C2A" stroke-width="8" stroke-linecap="round"/>
  <!-- Fork top -->
  <line x1="305" y1="230" x2="310" y2="200" stroke="#E05C2A" stroke-width="8" stroke-linecap="round"/>

  <!-- Handlebars -->
  <line x1="310" y1="200" x2="330" y2="195" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <line x1="310" y1="200" x2="325" y2="210" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <!-- Handlebar grips -->
  <circle cx="330" cy="195" r="5" fill="#222"/>
  <circle cx="325" cy="210" r="5" fill="#222"/>

  <!-- Seat post -->
  <line x1="215" y1="245" x2="210" y2="220" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="205" cy="218" rx="22" ry="8" fill="#333" stroke="#222" stroke-width="2"/>

  <!-- Crankset / Pedal area -->
  <circle cx="240" cy="310" r="14" fill="#555" stroke="#333" stroke-width="3"/>
  <!-- Pedal arm 1 -->
  <line x1="240" y1="310" x2="255" y2="330" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <rect x="250" y="328" width="16" height="6" rx="3" fill="#333" transform="rotate(45 258 331)"/>
  <!-- Pedal arm 2 -->
  <line x1="240" y1="310" x2="225" y2="290" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <rect x="210" y="282" width="16" height="6" rx="3" fill="#333"/>

  <!-- Chain (simplified) -->
  <path d="M240 310 Q200 340 160 310" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="5,3"/>

  <!-- === PELICAN === -->

  <!-- Body -->
  <ellipse cx="225" cy="230" rx="55" ry="38" fill="white" stroke="#DDD" stroke-width="1.5"/>

  <!-- Wing (left/back) -->
  <ellipse cx="200" cy="238" rx="40" ry="16" fill="#E8E8E8" stroke="#CCC" stroke-width="1" transform="rotate(-15 200 238)"/>

  <!-- Wing (right/front, raised slightly for riding pose) -->
  <path d="M240 218 Q275 195 285 210 Q265 225 245 228 Z" fill="#E8E8E8" stroke="#CCC" stroke-width="1.5"/>

  <!-- Tail feathers -->
  <path d="M172 238 Q155 250 160 262 Q170 248 178 252 Q172 240 185 240 Z" fill="#DDD" stroke="#CCC" stroke-width="1"/>

  <!-- Neck -->
  <path d="M270 215 Q290 195 285 170 Q282 155 278 148" stroke="white" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M270 215 Q290 195 285 170 Q282 155 278 148" stroke="#EEE" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="276" cy="140" r="28" fill="white" stroke="#EEE" stroke-width="1.5"/>

  <!-- Eye -->
  <circle cx="286" cy="133" r="8" fill="#FFA500"/>
  <circle cx="288" cy="133" r="5" fill="#222"/>
  <circle cx="290" cy="131" r="2" fill="white"/>

  <!-- Beak (upper mandible) -->
  <path d="M295 140 Q330 145 350 155 Q330 152 295 150 Z" fill="#F4A830" stroke="#D4881A" stroke-width="1.5"/>
  <!-- Beak (lower mandible / pouch) -->
  <path d="M295 150 Q330 152 350 155 Q325 165 295 158 Z" fill="#F4A830" stroke="#D4881A" stroke-width="1.5"/>
  <!-- Pouch -->
  <path d="M296 153 Q315 172 295 175 Q285 168 295 153 Z" fill="#F9C46A" stroke="#D4881A" stroke-width="1"/>

  <!-- Beak hook tip -->
  <path d="M348 154 Q356 157 350 162 Q344 158 348 154 Z" fill="#C87A10"/>

  <!-- Legs (on pedals) -->
  <!-- Left leg -->
  <path d="M215 265 Q200 290 225 295 Q235 305 255 330" stroke="#F4A830" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Left foot on pedal -->
  <ellipse cx="256" cy="333" rx="12" ry="5" fill="#F4A830" stroke="#D4881A" stroke-width="1.5" transform="rotate(45 256 333)"/>

  <!-- Right leg -->
  <path d="M230 268 Q238 285 232 295 Q228 305 218 288" stroke="#F4A830" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Right foot on pedal -->
  <ellipse cx="217" cy="285" rx="12" ry="5" fill="#F4A830" stroke="#D4881A" stroke-width="1.5"/>

  <!-- Wind lines for motion effect -->
  <g stroke="#B0D8F0" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="60" y1="220" x2="105" y2="220"/>
    <line x1="50" y1="235" x2="100" y2="235"/>
    <line x1="65" y1="250" x2="108" y2="250"/>
    <line x1="55" y1="265" x2="95" y2="265"/>
  </g>

  <!-- Small birds in background -->
  <path d="M80 80 Q85 75 90 80" fill="none" stroke="#89B4CC" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 65 Q116 59 122 65" fill="none" stroke="#89B4CC" stroke-width="2" stroke-linecap="round"/>
  <path d="M55 100 Q61 94 67 100" fill="none" stroke="#89B4CC" stroke-width="2" stroke-linecap="round"/>

  <!-- Sun -->
  <circle cx="430" cy="70" r="35" fill="#FFD966" opacity="0.85"/>
  <g stroke="#FFD966" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="430" y1="25" x2="430" y2="15"/>
    <line x1="430" y1="115" x2="430" y2="125"/>
    <line x1="385" y1="70" x2="375" y2="70"/>
    <line x1="475" y1="70" x2="485" y2="70"/>
    <line x1="398" y1="38" x2="391" y2="31"/>
    <line x1="462" y1="102" x2="469" y2="109"/>
    <line x1="462" y1="38" x2="469" y2="31"/>
    <line x1="398" y1="102" x2="391" y2="109"/>
  </g>

  <!-- Title text -->
  <text x="250" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#556B2F" font-style="italic">Pelican on the go! 🚲</text>
</svg>