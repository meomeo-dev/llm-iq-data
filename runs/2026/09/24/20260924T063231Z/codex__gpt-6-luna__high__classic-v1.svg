<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican pedals a blue bicycle along a sunny path.</desc>

  <rect width="800" height="500" rx="28" fill="#e9f7fb"/>
  <circle cx="660" cy="95" r="48" fill="#ffd76a"/>
  <path d="M0 345 Q180 290 350 342 T800 325 V500 H0Z" fill="#c8e8c4"/>
  <path d="M0 390 Q190 360 390 390 T800 370" fill="none" stroke="#a2d39a" stroke-width="8" stroke-linecap="round"/>

  <!-- Bicycle wheels -->
  <g fill="none" stroke="#253c50" stroke-width="9">
    <circle cx="220" cy="350" r="82"/>
    <circle cx="580" cy="350" r="82"/>
  </g>
  <g stroke="#8aa3ad" stroke-width="3">
    <path d="M220 268V432M138 350H302M162 292L278 408M278 292L162 408"/>
    <path d="M580 268V432M498 350H662M522 292L638 408M638 292L522 408"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#3185a5" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <path d="M220 350L335 350L405 250L300 250L220 350"/>
    <path d="M335 350L455 350L405 250"/>
    <path d="M455 350L580 350"/>
    <path d="M405 250L420 230"/>
    <path d="M300 250L276 250"/>
  </g>
  <circle cx="335" cy="350" r="14" fill="#253c50"/>
  <path d="M335 350L365 373M335 350L305 329" stroke="#253c50" stroke-width="7" stroke-linecap="round"/>
  <path d="M294 245H330M407 230L433 230" stroke="#253c50" stroke-width="9" stroke-linecap="round"/>
  <path d="M580 350L588 245" stroke="#253c50" stroke-width="8" stroke-linecap="round"/>
  <path d="M558 242H614" stroke="#253c50" stroke-width="9" stroke-linecap="round"/>

  <!-- Pelican body -->
  <ellipse cx="398" cy="190" rx="89" ry="66" fill="#fffdf7" stroke="#253c50" stroke-width="5"/>
  <path d="M353 178 Q398 143 452 172 Q440 220 382 235 Q354 218 353 178Z" fill="#d8e5e8" stroke="#253c50" stroke-width="4"/>
  <path d="M374 188 Q408 168 435 184 Q416 204 382 208Z" fill="#fffdf7"/>

  <!-- Neck and head -->
  <path d="M423 176 Q460 151 458 120 Q455 93 479 79" fill="none" stroke="#fffdf7" stroke-width="25" stroke-linecap="round"/>
  <path d="M423 176 Q460 151 458 120 Q455 93 479 79" fill="none" stroke="#253c50" stroke-width="5" stroke-linecap="round"/>
  <circle cx="493" cy="75" r="37" fill="#fffdf7" stroke="#253c50" stroke-width="5"/>
  <circle cx="505" cy="67" r="5.5" fill="#253c50"/>
  <circle cx="507" cy="65" r="1.8" fill="#fff"/>
  <path d="M522 78 Q584 67 644 86 Q605 111 542 103 Q525 98 522 78Z" fill="#f2a63b" stroke="#253c50" stroke-width="5" stroke-linejoin="round"/>
  <path d="M542 102 Q589 105 627 88 Q602 129 558 128 Q540 122 542 102Z" fill="#f3aa50" stroke="#253c50" stroke-width="5" stroke-linejoin="round"/>
  <path d="M544 103 Q573 105 593 100" fill="none" stroke="#d97834" stroke-width="3" stroke-linecap="round"/>
  <path d="M484 39 Q491 27 501 39" fill="none" stroke="#e8b34b" stroke-width="5" stroke-linecap="round"/>

  <!-- Feet and legs reaching the pedals -->
