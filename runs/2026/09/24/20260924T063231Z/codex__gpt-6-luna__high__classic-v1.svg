  <path d="M428 226 Q441 267 438 298 L420 321" fill="none" stroke="#e89a3b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M361 313 Q372 320 382 315" fill="none" stroke="#e89a3b" stroke-width="8" stroke-linecap="round"/>
  <path d="M420 321 Q408 326 400 319" fill="none" stroke="#e89a3b" stroke-width="8" stroke-linecap="round"/>

  <!-- Small motion marks -->
  <path d="M105 173H155M88 198H135M680 217H725" stroke="#8dbdc9" stroke-width="6" stroke-linecap="round"/>
  <path d="M174 127l12-10M192 143l14-7M689 149l12-10" stroke="#8dbdc9" stroke-width="5" stroke-linecap="round"/>
</svg>