<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="title description">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="description">
    A white pelican with a long orange beak pedals a teal bicycle beneath
    a blue sky.
  </desc>

  <rect width="800" height="560" fill="#d9f2fa"/>
  <circle cx="695" cy="83" r="42" fill="#ffe7a3"/>
  <g fill="#fff" opacity=".85">
    <ellipse cx="128" cy="105" rx="66" ry="22"/>
    <ellipse cx="170" cy="98" rx="45" ry="27"/>
    <ellipse cx="612" cy="115" rx="52" ry="17"/>
  </g>
  <path d="M0 473 Q180 440 360 476 T800 467 V560 H0Z" fill="#bfe6ce"/>
  <path d="M0 526 H800" stroke="#719d85" stroke-width="5"/>

  <!-- Wheels -->
  <g fill="none" stroke-linecap="round">
    <g transform="translate(213 431)">
      <circle r="91" stroke="#283e51" stroke-width="12"/>
      <circle r="75" stroke="#fff" stroke-width="3"/>
      <path d="M0-75V75 M-75 0H75 M-53-53L53 53 M53-53L-53 53"
            stroke="#8ba9b7" stroke-width="2"/>
      <circle r="10" fill="#f7faf7" stroke="#283e51" stroke-width="4"/>
    </g>
    <g transform="translate(585 431)">
      <circle r="91" stroke="#283e51" stroke-width="12"/>
      <circle r="75" stroke="#fff" stroke-width="3"/>
      <path d="M0-75V75 M-75 0H75 M-53-53L53 53 M53-53L-53 53"
            stroke="#8ba9b7" stroke-width="2"/>
      <circle r="10" fill="#f7faf7" stroke="#283e51" stroke-width="4"/>
    </g>
  </g>

  <!-- Bicycle -->
  <g fill="none" stroke="#178f98" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M213 431 367 335 392 431 213 431
             M367 335 500 337 392 431"/>
    <path d="M500 337 585 431"/>
  </g>
  <path d="M500 337 519 276 Q523 265 537 267 L555 273"
        fill="none" stroke="#283e51" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M353 337 Q373 329 393 337"
        fill="none" stroke="#283e51" stroke-width="11"
        stroke-linecap="round"/>
  <circle cx="392" cy="431" r="21" fill="#f7faf7"
          stroke="#283e51" stroke-width="5"/>
  <path d="M392 431 418 453 M392 431 366 409"
        stroke="#283e51" stroke-width="6" stroke-linecap="round"/>
  <path d="M409 453h24 M354 409h24"
        stroke="#283e51" stroke-width="8" stroke-linecap="round"/>

  <!-- Tail and legs -->
  <path d="M286 275 Q251 251 229 255 Q247 275 265 280
           Q233 278 216 294 Q257 302 292 289Z"
        fill="#e9f2f1" stroke="#668a9a" stroke-width="3"/>
  <path d="M356 319 Q364 359 369 390 L366 409"
        fill="none" stroke="#e6a657" stroke-width="14"
        stroke-linecap="round"/>
  <path d="M395 319 Q405 357 409 392 L420 449"
        fill="none" stroke="#e6a657" stroke-width="15"
        stroke-linecap="round"/>
  <path d="M405 453 Q423 446 438 454 Q426 464 408 460Z"
        fill="#e6a657" stroke="#bd7b3f" stroke-width="2"/>

  <!-- Pelican body and neck -->
  <ellipse cx="354" cy="278" rx="105" ry="66"
           fill="#fffdf5" stroke="#668a9a" stroke-width="4"/>
  <path d="M412 267
           C454 246 446 216 444 187
           C442 153 458 126 489 122
           C516 119 539 139 540 164
           C541 184 527 198 510 199
           C492 200 481 187 473 177
           C479 221 497 256 466 290
           Q444 303 412 267Z"
        fill="#fffdf5" stroke="#668a9a" stroke-width="4"/>
  <path d="M451 190 Q449 245 421 267"
        fill="none" stroke="#d6e6e7" stroke-width="13"
        stroke-linecap="round"/>

  <!-- Bill and pouch -->
  <path d="M517 184 Q600 194 697 182
           Q685 240 634 259
           Q571 278 517 184Z"
        fill="#ee9a56" stroke="#bd6c38" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M515 174 Q609 158 703 175
           Q716 178 708 186
           Q622 201 519 190Z"
        fill="#ffc15d" stroke="#bd6c38" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M563 196 Q622 211 672 193"
        fill="none" stroke="#cf7d42" stroke-width="3"
        stroke-linecap="round"/>

  <!-- Face -->
  <circle cx="501" cy="156" r="8" fill="#283e51"/>
  <circle cx="498" cy="153" r="2.5" fill="#fff"/>
  <path d="M475 126 Q469 113 474 104
           M485 123 Q484 110 492 102"
        fill="none" stroke="#fffdf5" stroke-width="10"
        stroke-linecap="round"/>

  <!-- Wing reaching the handlebar -->
  <path d="M328 254
           Q370 234 411 250
           Q452 263 479 283
           Q499 286 515 275
           Q525 280 519 291
           Q498 310 474 303
           Q430 303 398 291
           Q365 301 339 282Z"
        fill="#dbe9ea" stroke="#668a9a" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M353 267 Q406 285 455 289
           M373 249 Q418 265 465 285"
        fill="none" stroke="#9bb8bf" stroke-width="3"
        stroke-linecap="round"/>
  <path d="M512 278 Q522 271 531 277"
        fill="none" stroke="#fffdf5" stroke-width="12"
        stroke-linecap="round"/>
</svg>