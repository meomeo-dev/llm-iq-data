<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">A sloth riding a bicycle</title>
  <desc id="desc">A cheerful sloth pedals a blue bicycle along a sunny path.</desc>

  <rect width="800" height="600" fill="#eaf7f2"/>
  <circle cx="660" cy="105" r="48" fill="#ffd166"/>
  <path d="M0 405 Q160 350 320 405 T640 405 T960 405 V600 H0Z" fill="#b7dfb0"/>
  <path d="M0 455 Q180 410 360 455 T720 455 T1080 455" fill="none" stroke="#93c995" stroke-width="5"/>

  <!-- Bicycle wheels -->
  <g fill="none" stroke="#334155" stroke-width="9">
    <circle cx="230" cy="430" r="82"/>
    <circle cx="565" cy="430" r="82"/>
  </g>
  <g stroke="#94a3b8" stroke-width="3">
    <path d="M230 348V512M148 430H312M172 372L288 488M288 372L172 488"/>
    <path d="M565 348V512M483 430H647M507 372L623 488M623 372L507 488"/>
  </g>
  <!-- Frame -->
  <g fill="none" stroke="#2a9d8f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 430L345 430L405 325L315 325L230 430"/>
    <path d="M345 430L455 430L405 325"/>
    <path d="M455 430L565 430"/>
    <path d="M315 325L280 325M455 430L470 390L510 390"/>
  </g>
  <circle cx="345" cy="430" r="16" fill="#f4a261"/>
  <path d="M330 430H360M345 415V445" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <path d="M300 311H330" stroke="#334155" stroke-width="8" stroke-linecap="round"/>

  <!-- Sloth body -->
  <ellipse cx="402" cy="258" rx="70" ry="84" fill="#9b7653"/>
  <ellipse cx="402" cy="275" rx="43" ry="53" fill="#d9bd91"/>
  <path d="M350 210Q365 185 385 198M450 210Q437 185 418 198" fill="none" stroke="#6d5039" stroke-width="12" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="402" cy="155" r="72" fill="#a9825d"/>
  <ellipse cx="402" cy="169" rx="51" ry="42" fill="#efe1c6"/>
  <ellipse cx="377" cy="151" rx="15" ry="21" fill="#6b5546"/>
  <ellipse cx="427" cy="151" rx="15" ry="21" fill="#6b5546"/>
  <circle cx="380" cy="153" r="5" fill="#1f2937"/>
  <circle cx="424" cy="153" r="5" fill="#1f2937"/>
  <ellipse cx="402" cy="174" rx="9" ry="7" fill="#3b302a"/>
  <path d="M389 189Q402 199 415 189" fill="none" stroke="#6b5546" stroke-width="4" stroke-linecap="round"/>
  <path d="M342 128Q351 92 382 91M462 128Q451 92 422 91" fill="none" stroke="#6d5039" stroke-width="10" stroke-linecap="round"/>

  <!-- Arms reaching handlebars -->
  <path d="M357 222Q330 255 310 300L280 318" fill="none" stroke="#9b7653" stroke-width="24" stroke-linecap="round"/>
  <path d="M447 221Q476 246 487 290L500 315" fill="none" stroke="#9b7653" stroke-width="24" stroke-linecap="round"/>
  <path d="M280 318Q273 324 280 330Q288 335 295 326" fill="none" stroke="#6d5039" stroke-width="8" stroke-linecap="round"/>
  <path d="M500 315Q508 320 505 328Q501 335 494 328" fill="none" stroke="#6d5039" stroke-width="8" stroke-linecap="round"/>

  <!-- Legs pedaling -->
  <path d="M374 319Q357 357 356 391L345 421" fill="none" stroke="#9b7653" stroke-width="27" stroke-linecap="round"/>
  <path d="M430 319Q456 348 474 370L455 419" fill="none" stroke="#9b7653" stroke-width="27" stroke-linecap="round"/>
  <path d="M345 421Q335 432 344 440L364 439" fill="none" stroke="#6d5039" stroke-width="10" stroke-linecap="round"/>
  <path d="M455 419Q465 429 477 424L482 411" fill="none" stroke="#6d5039" stroke-width="10" stroke-linecap="round"/>

  <!-- Motion marks and birds -->
  <path d="M92 250H145M70 275H118M660 280H710" stroke="#70a9a1" stroke-width="6" stroke-linecap="round"/>
  <path d="M570 180Q585 162 600 180Q615 162 630 180" fill="none" stroke="#70a9a1" stroke-width="5" stroke-linecap="round"/>
</svg>