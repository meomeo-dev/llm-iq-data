<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="640" height="440" fill="url(#sky)"/>
  <circle cx="540" cy="80" r="42" fill="#ffd966"/>
  <ellipse cx="120" cy="90" rx="60" ry="22" fill="#fff" opacity="0.9"/>
  <ellipse cx="160" cy="80" rx="45" ry="18" fill="#fff" opacity="0.9"/>
  <ellipse cx="400" cy="130" rx="50" ry="18" fill="#fff" opacity="0.8"/>
  <rect x="0" y="360" width="640" height="80" fill="#7fbf5f"/>
  <rect x="0" y="352" width="640" height="10" fill="#5a9e44"/>

  <!-- 自行车（bicycle） -->
  <g stroke="#333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 后轮 -->
    <circle cx="180" cy="320" r="58"/>
    <circle cx="180" cy="320" r="8" fill="#333"/>
    <g stroke-width="2">
      <line x1="180" y1="262" x2="180" y2="378"/>
      <line x1="122" y1="320" x2="238" y2="320"/>
      <line x1="139" y1="279" x2="221" y2="361"/>
      <line x1="221" y1="279" x2="139" y2="361"/>
    </g>
    <!-- 前轮 -->
    <circle cx="460" cy="320" r="58"/>
    <circle cx="460" cy="320" r="8" fill="#333"/>
    <g stroke-width="2">
      <line x1="460" y1="262" x2="460" y2="378"/>
      <line x1="402" y1="320" x2="518" y2="320"/>
      <line x1="419" y1="279" x2="501" y2="361"/>
      <line x1="501" y1="279" x2="419" y2="361"/>
    </g>
    <!-- 车架（frame） -->
    <g stroke="#d33a2c" stroke-width="7">
      <line x1="180" y1="320" x2="300" y2="320"/>
      <line x1="300" y1="320" x2="260" y2="215"/>
      <line x1="180" y1="320" x2="260" y2="215"/>
      <line x1="260" y1="215" x2="410" y2="215"/>
      <line x1="410" y1="215" x2="460" y2="320"/>
      <line x1="300" y1="320" x2="410" y2="215"/>
      <line x1="260" y1="215" x2="250" y2="190"/>
      <line x1="410" y1="215" x2="420" y2="180"/>
    </g>
    <!-- 车座与车把 -->
    <path d="M225 188 Q250 178 280 190" stroke="#333" stroke-width="9"/>
    <path d="M400 180 Q430 165 455 178" stroke="#333" stroke-width="7"/>
    <!-- 曲柄与脚踏 -->
    <circle cx="300" cy="320" r="14" fill="#666"/>
    <line x1="300" y1="320" x2="325" y2="350"/>
    <line x1="300" y1="320" x2="275" y2="290"/>
    <line x1="315" y1="350" x2="340" y2="350" stroke-width="7"/>
    <line x1="262" y1="290" x2="286" y2="290" stroke-width="7"/>
    <!-- 链条 -->
    <ellipse cx="240" cy="320" rx="62" ry="15" stroke="#555" stroke-width="3" stroke-dasharray="5 4"/>
  </g>

  <!-- 鹈鹕（pelican） -->
  <g>
    <!-- 身体 -->
    <ellipse cx="275" cy="175" rx="70" ry="48" fill="#f5f2ea" stroke="#333" stroke-width="3"/>
    <!-- 尾羽 -->
    <path d="M210 165 L170 150 L185 178 L165 190 L205 190 Z" fill="#e6e1d5" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <!-- 翅膀（抓向车把） -->
    <path d="M280 165 Q350 150 410 178" fill="none" stroke="#333" stroke-width="12" stroke-linecap="round"/>
    <path d="M280 165 Q350 150 410 178" fill="none" stroke="#f5f2ea" stroke-width="7" stroke-linecap="round"/>
    <!-- 腿 -->
    <path d="M285 215 L300 265 L275 290" fill="none" stroke="#f0a020" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M295 220 L318 300 L325 350" fill="none" stroke="#f0a020" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M262 292 L290 292 M312 352 L342 352" stroke="#f0a020" stroke-width="7" stroke-linecap="round"/>
    <!-- 脖子 -->
    <path d="M300 140 Q305 95 335 85" fill="none" stroke="#333" stroke-width="30" stroke-linecap="round"/>
    <path d="M300 140 Q305 95 335 85" fill="none" stroke="#f5f2ea" stroke-width="24" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="345" cy="80" r="28" fill="#f5f2ea" stroke="#333" stroke-width="3"/>
    <!-- 上喙 -->
    <path d="M362 72 L470 82 L365 92 Z" fill="#f4a531" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <!-- 喉囊（gular pouch） -->
    <path d="M365 92 L470 82 Q450 118 400 122 Q372 118 365 92 Z" fill="#ffc46b" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <!-- 眼睛 -->
    <circle cx="352" cy="72" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="354" cy="73" r="3" fill="#111"/>
    <!-- 头冠羽 -->
    <path d="M330 56 Q322 40 335 44 Q340 32 348 46" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 运动线 -->
  <g stroke="#7a9cc0" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="240" x2="110" y2="240"/>
    <line x1="40" y1="270" x2="105" y2="270"/>
    <line x1="70" y1="300" x2="115" y2="300"/>
  </g>
</svg>