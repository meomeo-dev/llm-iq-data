    <circle cx="476" cy="327" r="267" fill="#e4efea"/>
    <circle cx="731" cy="160" r="88" fill="#f8d894" opacity=".35"/>
    <circle cx="731" cy="160" r="65" fill="#f3c86e"/>

    <g fill="#fffdf3">
      <path d="M124 198c0-14 12-25 27-24 8-23 42-25 54-4
               19-5 38 7 38 28Z"/>
      <path d="M649 91c1-11 11-19 23-17 10-17 36-14 42 5
               13-1 23 4 27 12Z"/>
    </g>

    <g fill="none" stroke="#739895" stroke-width="3.5">
      <path d="M159 269q12-13 24 0 12-13 24 0"/>
      <path d="M760 318q10-11 20 0 10-11 20 0"/>
      <path d="M797 287q7-8 14 0 7-8 14 0"/>
