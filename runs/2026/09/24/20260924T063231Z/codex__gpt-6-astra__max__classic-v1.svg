<svg xmlns="http://www.w3.org/2000/svg"
     width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="description">
    A cheerful white pelican with a long golden bill pedals a teal bicycle
    along a sunny seaside path, resting its wing on the handlebars.
  </desc>

  <defs>
    <linearGradient id="feathers" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffef5"/>
      <stop offset="1" stop-color="#e9ebdf"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd478"/>
      <stop offset="1" stop-color="#efa34d"/>
    </linearGradient>
    <g id="wheel">
      <circle r="108" fill="#fbf6e8" stroke="#263f43" stroke-width="14"/>
      <circle r="98" fill="none" stroke="#c0cdc3" stroke-width="3"/>
      <g stroke="#a6b8b2" stroke-width="2">
        <path d="M0-97V97 M-97 0H97"/>
        <path d="M-68.6-68.6L68.6 68.6 M-68.6 68.6L68.6-68.6"/>
        <path d="M-37.1-89.6L37.1 89.6 M-89.6-37.1L89.6 37.1"/>
        <path d="M-89.6 37.1L89.6-37.1 M-37.1 89.6L37.1-89.6"/>
      </g>
      <circle r="10" fill="#e9b867" stroke="#263f43" stroke-width="4"/>
      <path d="M-77-61A98 98 0 0 1-28-94"
            fill="none" stroke="#fffdf3" stroke-width="4"/>
    </g>
  </defs>

  <rect width="960" height="720" rx="28" fill="#fbf3e2"/>

