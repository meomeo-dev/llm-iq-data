<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <rect width="400" height="320" fill="#dff1fb"/>
  <rect y="270" width="400" height="50" fill="#9ccc65"/>
  <!-- wheels -->
  <g fill="none" stroke="#333" stroke-width="6">
    <circle cx="110" cy="240" r="45"/>
    <circle cx="290" cy="240" r="45"/>
  </g>
  <g stroke="#999" stroke-width="2">
    <line x1="110" y1="195" x2="110" y2="285"/><line x1="65" y1="240" x2="155" y2="240"/>
    <line x1="290" y1="195" x2="290" y2="285"/><line x1="245" y1="240" x2="335" y2="240"/>
  </g>
  <!-- frame -->
  <g fill="none" stroke="#d32f2f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="110,240 180,240 160,170 110,240"/>
    <polyline points="180,240 265,170 160,170"/>
    <line x1="265" y1="170" x2="290" y2="240"/>
    <line x1="265" y1="170" x2="258" y2="140"/>
  </g>
  <path d="M245 138 h28" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <rect x="145" y="160" width="32" height="8" rx="4" fill="#333"/>
  <circle cx="180" cy="240" r="9" fill="#555"/>
  <!-- legs -->
  <path d="M165 160 Q185 205 190 225" stroke="#8d6e52" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M160 160 Q160 215 172 252" stroke="#7a5c43" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="180" cy="125" rx="38" ry="48" fill="#8d6e52" transform="rotate(20 180 125)"/>
  <ellipse cx="188" cy="130" rx="20" ry="30" fill="#b89a7c" transform="rotate(20 188 130)"/>
  <!-- arm -->
  <path d="M195 105 Q230 115 252 138" stroke="#7a5c43" stroke-width="14" fill="none" stroke-linecap="round"/>
  <g stroke="#f5f0e0" stroke-width="3" stroke-linecap="round">
    <line x1="252" y1="138" x2="260" y2="146"/><line x1="255" y1="135" x2="264" y2="141"/>
  </g>
  <!-- head -->
  <circle cx="215" cy="72" r="32" fill="#8d6e52"/>
  <ellipse cx="218" cy="76" rx="25" ry="20" fill="#e8d6b8"/>
  <ellipse cx="206" cy="72" rx="9" ry="6" fill="#4e342e" transform="rotate(-15 206 72)"/>
  <ellipse cx="230" cy="72" rx="9" ry="6" fill="#4e342e" transform="rotate(15 230 72)"/>
  <circle cx="207" cy="72" r="2.5" fill="#fff"/>
  <circle cx="229" cy="72" r="2.5" fill="#fff"/>
  <ellipse cx="218" cy="82" rx="4" ry="3" fill="#3e2723"/>
  <path d="M211 88 Q218 94 225 88" stroke="#3e2723" stroke-width="2" fill="none"/>
