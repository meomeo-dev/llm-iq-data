<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#e8f4fb"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#7a8a6a" stroke-width="3"/>
  <!-- wheels -->
  <circle cx="110" cy="230" r="40" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="290" cy="230" r="40" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="110" cy="230" r="5" fill="#333"/>
  <circle cx="290" cy="230" r="5" fill="#333"/>
  <!-- frame -->
  <path d="M110 230 L170 160 L250 160 L290 230 L200 230 L170 160 M200 230 L240 160" fill="none" stroke="#c0392b" stroke-width="5" stroke-linejoin="round"/>
  <line x1="250" y1="160" x2="262" y2="130" stroke="#c0392b" stroke-width="5"/>
  <line x1="245" y1="128" x2="285" y2="128" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="165" y1="150" x2="200" y2="150" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <!-- pedals -->
  <circle cx="200" cy="230" r="8" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="200" y1="230" x2="215" y2="245" stroke="#333" stroke-width="4"/>
  <line x1="200" y1="230" x2="185" y2="215" stroke="#333" stroke-width="4"/>
  <!-- pelican body -->
  <ellipse cx="185" cy="115" rx="45" ry="30" fill="#fff" stroke="#555" stroke-width="2"/>
  <path d="M150 105 Q120 130 145 140 Q165 130 160 110 Z" fill="#eee" stroke="#555" stroke-width="2"/>
  <!-- legs -->
  <path d="M195 140 Q200 190 215 245" fill="none" stroke="#f39c12" stroke-width="5" stroke-linecap="round"/>
  <path d="M180 140 Q175 180 185 215" fill="none" stroke="#f39c12" stroke-width="5" stroke-linecap="round"/>
  <!-- neck and head -->
  <path d="M215 100 Q240 70 235 55" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <path d="M215 100 Q240 70 235 55" fill="none" stroke="#555" stroke-width="18" stroke-linecap="round" opacity="0.25"/>
  <circle cx="240" cy="50" r="17" fill="#fff" stroke="#555" stroke-width="2"/>
  <circle cx="247" cy="45" r="3" fill="#222"/>
  <!-- beak with pouch -->
  <path d="M252 52 L310 60 L252 66 Z" fill="#f5a623" stroke="#c77d00" stroke-width="2"/>
  <path d="M252 66 Q275 95 308 61" fill="#f7b955" stroke="#c77d00" stroke-width="2"/>
  <!-- wing on handlebar -->
  <path d="M205 110 Q240 105 265 128" fill="none" stroke="#ddd" stroke-width="10" stroke-linecap="round"/>
  <path d="M205 110 Q240 105 265 128" fill="none" stroke="#555" stroke-width="12" stroke-linecap="round" opacity="0.2"/>
</svg>