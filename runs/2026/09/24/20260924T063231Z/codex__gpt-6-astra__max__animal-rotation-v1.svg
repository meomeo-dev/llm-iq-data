<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="650" viewBox="0 0 900 650"
     role="img" aria-labelledby="title description">
  <title id="title">A sloth riding a bicycle</title>
  <desc id="description">
    A smiling, shaggy brown sloth pedals a teal bicycle beneath a golden sun,
    with long arms reaching the handlebars and curved claws holding the grip.
  </desc>

  <defs>
    <linearGradient id="fur" x1="0%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#bd976c"/>
      <stop offset="100%" stop-color="#9a724f"/>
    </linearGradient>

    <g id="wheel">
      <circle r="106" fill="#fff9ed" stroke="#344b46" stroke-width="14"/>
      <circle r="96" fill="none" stroke="#ceceb4" stroke-width="3"/>
