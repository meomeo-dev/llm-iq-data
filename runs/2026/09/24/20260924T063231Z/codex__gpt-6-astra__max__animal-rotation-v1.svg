        <path d="M0-94V94 M-94 0H94"/>
        <path d="M-81-47L81 47 M-47-81L47 81"/>
        <path d="M47-81L-47 81 M81-47L-81 47"/>
      </g>
      <circle r="10" fill="#fff1cc" stroke="#344b46" stroke-width="4"/>
      <circle r="3" fill="#344b46"/>
      <path d="M-70-77A104 104 0 0 1 53-89"
            fill="none" stroke="#64746a" stroke-width="3"
            stroke-linecap="round"/>
    </g>
  </defs>

