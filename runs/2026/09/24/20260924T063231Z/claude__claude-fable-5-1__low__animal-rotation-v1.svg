<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- sky and ground -->
  <rect width="400" height="300" fill="#cfe8f7"/>
  <rect y="230" width="400" height="70" fill="#8fbf6a"/>
  <line x1="0" y1="232" x2="400" y2="232" stroke="#6a9a4a" stroke-width="2"/>

  <!-- wheels -->
  <g fill="none" stroke="#333" stroke-width="5">
    <circle cx="100" cy="220" r="42"/>
    <circle cx="300" cy="220" r="42"/>
  </g>
  <g stroke="#777" stroke-width="2">
    <line x1="100" y1="178" x2="100" y2="262"/>
    <line x1="58" y1="220" x2="142" y2="220"/>
    <line x1="70" y1="190" x2="130" y2="250"/>
    <line x1="130" y1="190" x2="70" y2="250"/>
    <line x1="300" y1="178" x2="300" y2="262"/>
    <line x1="258" y1="220" x2="342" y2="220"/>
    <line x1="270" y1="190" x2="330" y2="250"/>
    <line x1="330" y1="190" x2="270" y2="250"/>
  </g>
  <circle cx="100" cy="220" r="5" fill="#333"/>
  <circle cx="300" cy="220" r="5" fill="#333"/>

  <!-- frame -->
  <g fill="none" stroke="#d9534f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="100,220 160,140 250,140 300,220"/>
    <polyline points="160,140 195,220 300,220"/>
    <line x1="195" y1="220" x2="100" y2="220"/>
    <line x1="250" y1="140" x2="275" y2="105"/>
    <line x1="160" y1="140" x2="150" y2="115"/>
  </g>
  <!-- handlebar and saddle -->
  <line x1="258" y1="105" x2="292" y2="105" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <rect x="132" y="108" width="36" height="10" rx="5" fill="#333"/>
  <!-- pedals -->
  <circle cx="195" cy="220" r="9" fill="#555"/>
  <line x1="195" y1="220" x2="212" y2="238" stroke="#333" stroke-width="4"/>
  <rect x="206" y="234" width="16" height="6" rx="2" fill="#333"/>
  <line x1="195" y1="220" x2="178" y2="202" stroke="#333" stroke-width="4"/>
  <rect x="170" y="198" width="16" height="6" rx="2" fill="#333"/>

  <!-- sloth body -->
  <ellipse cx="185" cy="120" rx="34" ry="46" fill="#a08a66" transform="rotate(-15 185 120)"/>
  <!-- legs -->
  <path d="M175 150 Q170 190 182 202" stroke="#8c7654" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M195 152 Q210 200 214 236" stroke="#8c7654" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- arms reaching handlebar -->
  <path d="M205 100 Q240 90 268 105" stroke="#8c7654" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M200 115 Q245 110 280 106" stroke="#8c7654" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- claws -->
  <g stroke="#3b2f1e" stroke-width="3" stroke-linecap="round">
    <line x1="268" y1="105" x2="272" y2="116"/>
    <line x1="274" y1="104" x2="278" y2="115"/>
    <line x1="280" y1="106" x2="284" y2="116"/>
  </g>

  <!-- head -->
  <circle cx="215" cy="72" r="30" fill="#b09b78"/>
  <ellipse cx="215" cy="80" rx="22" ry="16" fill="#e2d4b8"/>
  <!-- eye patches -->
  <ellipse cx="204" cy="70" rx="9" ry="6" fill="#4a3a26" transform="rotate(-20 204 70)"/>
  <ellipse cx="228" cy="68" rx="9" ry="6" fill="#4a3a26" transform="rotate(20 228 68)"/>
  <circle cx="205" cy="70" r="3" fill="#000"/>
  <circle cx="227" cy="68" r="3" fill="#000"/>
  <circle cx="206" cy="69" r="1" fill="#fff"/>
  <circle cx="228" cy="67" r="1" fill="#fff"/>
  <!-- nose and smile -->
  <ellipse cx="216" cy="82" rx="5" ry="3.5" fill="#3b2f1e"/>
  <path d="M205 90 Q216 98 227 90" stroke="#3b2f1e" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- motion lines -->
  <g stroke="#7aa" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="150" x2="50" y2="150"/>
    <line x1="10" y1="170" x2="45" y2="170"/>
    <line x1="25" y1="190" x2="55" y2="190"/>
  </g>
</svg>