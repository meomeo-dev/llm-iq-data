<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican pedals a blue bicycle along a sunny path.</desc>

  <rect width="800" height="600" fill="#eaf7fb"/>
  <circle cx="664" cy="104" r="48" fill="#ffd66b"/>
  <path d="M0 430 Q170 398 330 426 T800 414 V600 H0Z" fill="#c8e8bd"/>
  <path d="M0 486 Q210 455 400 480 T800 464 V600 H0Z" fill="#9ed09a"/>
  <path d="M0 520 Q190 494 410 520 T800 504" fill="none" stroke="#f8f0cf" stroke-width="12" stroke-linecap="round"/>

  <!-- Bicycle wheels -->
  <g fill="none" stroke="#344c5a" stroke-width="8">
    <circle cx="245" cy="420" r="78"/>
    <circle cx="555" cy="420" r="78"/>
  </g>
  <g fill="none" stroke="#83b8d4" stroke-width="3">
    <circle cx="245" cy="420" r="68"/>
    <circle cx="555" cy="420" r="68"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#2387a8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 420 L344 310 L414 420 L245 420"/>
    <path d="M344 310 L470 310 L414 420 L555 420"/>
    <path d="M470 310 L555 420"/>
    <path d="M328 302 L360 302"/>
    <path d="M470 310 L488 286 L517 286"/>
  </g>
  <circle cx="414" cy="420" r="17" fill="#f5b942" stroke="#344c5a" stroke-width="5"/>
  <path d="M394 420 H434 M414 400 V440" stroke="#344c5a" stroke-width="5" stroke-linecap="round"/>
  <path d="M233 330 H280" stroke="#344c5a" stroke-width="9" stroke-linecap="round"/>
  <path d="M544 310 L566 294" stroke="#344c5a" stroke-width="8" stroke-linecap="round"/>

  <!-- Pelican body -->
  <ellipse cx="405" cy="245" rx="91" ry="105" fill="#f8fbf6" stroke="#344c5a" stroke-width="6"/>
  <path d="M360 272 Q404 302 450 270 Q447 323 402 337 Q368 317 360 272Z" fill="#f0b64f"/>
  <path d="M373 271 Q404 288 438 270" fill="none" stroke="#d88a35" stroke-width="4"/>

  <!-- Pelican neck and head -->
  <path d="M363 244 Q339 188 369 145 Q389 119 427 131 Q456 140 458 168 Q456 193 430 203 L438 250"
        fill="#f8fbf6" stroke="#344c5a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="414" cy="151" r="47" fill="#f8fbf6" stroke="#344c5a" stroke-width="6"/>
  <circle cx="430" cy="142" r="6" fill="#263b49"/>
  <circle cx="432" cy="140" r="2" fill="#fff"/>

  <!-- Beak and pouch -->
  <path d="M448 158 Q502 153 548 174 Q505 195 457 184Z" fill="#ef9d37" stroke="#344c5a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M459 181 Q493 205 528 180 Q518 230 485 232 Q462 220 459 181Z"
        fill="#f5b24a" stroke="#344c5a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M473 194 Q493 205 516 193" fill="none" stroke="#dc8533" stroke-width="3"/>

  <!-- Wing -->
  <path d="M350 237 Q386 206 426 233 Q409 279 367 285 Q346 270 350 237Z"
        fill="#dce9e9" stroke="#344c5a" stroke-width="5"/>
  <path d="M365 248 Q389 247 407 262 M361 262 Q382 264 395 276"
        fill="none" stroke="#9cb4b8" stroke-width="4" stroke-linecap="round"/>

  <!-- Legs pedaling -->
  <path d="M389 322 L353 365 L414 420" fill="none" stroke="#ef9d37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M425 321 L458 365 L414 420" fill="none" stroke="#ef9d37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M345 365 L329 370 M458 365 L476 370" stroke="#344c5a" stroke-width="7" stroke-linecap="round"/>

  <!-- Hand on handlebar -->
  <path d="M438 247 Q468 257 493 287" fill="none" stroke="#f8fbf6" stroke-width="17" stroke-linecap="round"/>
  <path d="M438 247 Q468 257 493 287" fill="none" stroke="#344c5a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="493" cy="287" r="8" fill="#ef9d37"/>

  <!-- Small motion marks -->
  <path d="M115 282 H164 M98 306 H143 M635 322 H680" stroke="#78b5c6" stroke-width="6" stroke-linecap="round"/>
</svg>