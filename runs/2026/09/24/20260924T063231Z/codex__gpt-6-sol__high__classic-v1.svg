<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican pedals a blue bicycle along a sunny path.</desc>

  <rect width="800" height="600" fill="#e9f7fa"/>
  <circle cx="684" cy="91" r="47" fill="#ffd67a"/>
  <g fill="#fff" opacity=".9">
    <ellipse cx="125" cy="105" rx="55" ry="19"/>
    <ellipse cx="165" cy="99" rx="42" ry="24"/>
    <ellipse cx="598" cy="132" rx="46" ry="15"/>
    <ellipse cx="630" cy="126" rx="35" ry="20"/>
  </g>
  <path d="M0 548 Q205 535 400 549 T800 545 V600 H0Z" fill="#dcebc8"/>
  <path d="M0 554 H800" stroke="#8aa87d" stroke-width="4"/>

  <!-- Wheels -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#44596a">
      <circle cx="240" cy="450" r="102" stroke-width="11"/>
      <circle cx="560" cy="450" r="102" stroke-width="11"/>
    </g>
    <g stroke="#a2bac4" stroke-width="2">
      <path d="M240 348V552 M138 450H342 M168 378L312 522 M168 522L312 378
               M560 348V552 M458 450H662 M488 378L632 522 M488 522L632 378"/>
    </g>
    <g stroke="#637f8d" stroke-width="5">
      <circle cx="240" cy="450" r="9" fill="#eef7f7"/>
      <circle cx="560" cy="450" r="9" fill="#eef7f7"/>
    </g>
  </g>

  <!-- Bicycle -->
  <g fill="none" stroke="#2386a6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 450 353 352 400 450 240 450 M353 352H490L400 450"/>
    <path d="M490 352 560 450"/>
  </g>
  <path d="M344 349H407" stroke="#334d5d" stroke-width="13" stroke-linecap="round"/>
  <path d="M490 352 500 323 532 319 542 333" fill="none"
        stroke="#334d5d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M532 319 542 333" stroke="#f49a55" stroke-width="11" stroke-linecap="round"/>
  <circle cx="400" cy="450" r="23" fill="#e9f7fa" stroke="#334d5d" stroke-width="6"/>
  <path d="M400 450 430 430 M400 450 370 470" stroke="#334d5d"
        stroke-width="7" stroke-linecap="round"/>
  <path d="M417 431H448 M355 470H385" stroke="#334d5d"
