  <!-- Legs and webbed feet -->
  <g fill="none" stroke="#e7a24f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M386 313 395 380 430 429"/>
    <path d="M356 315 342 389 369 469"/>
  </g>
  <g fill="#efad5c" stroke="#ce8240" stroke-width="3" stroke-linejoin="round">
    <path d="M420 426 Q438 419 451 428 L464 441 446 438 437 443 426 437Z"/>
    <path d="M359 466 Q375 459 388 467 L401 479 383 476 374 481 363 475Z"/>
  </g>

  <!-- Tail, body, and neck -->
  <path d="M301 274 242 254 266 290 239 299 307 310Z"
        fill="#d5e3e4" stroke="#78939b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M422 285 Q449 259 449 229 Q437 185 451 160
           Q464 136 487 145 Q513 153 508 176
           Q480 179 482 200 Q493 257 452 301Z"
        fill="#eef3ec" stroke="#78939b" stroke-width="4"/>
  <ellipse cx="376" cy="276" rx="101" ry="68"
           fill="#f5f6ee" stroke="#78939b" stroke-width="4"/>
  <path d="M315 264 Q359 235 425 263 Q414 314 361 320
           Q331 306 315 264Z"
        fill="#d9e7e5" stroke="#78939b" stroke-width="4"/>
  <path d="M336 279 Q368 293 406 274 M349 298 Q377 309 402 293"
        fill="none" stroke="#a9c2c4" stroke-width="4" stroke-linecap="round"/>

  <!-- Head and pouch -->
  <circle cx="479" cy="162" r="37" fill="#f5f6ee" stroke="#78939b" stroke-width="4"/>
  <path d="M512 182 Q593 177 678 184
           Q662 238 612 266 Q568 282 534 247
           Q515 228 512 182Z"
        fill="#efa759" stroke="#bf7846" stroke-width="4" stroke-linejoin="round"/>
  <path d="M506 172 Q593 164 686 178 Q699 182 688 190
           Q597 195 512 189Z"
        fill="#f8c477" stroke="#bf7846" stroke-width="4" stroke-linejoin="round"/>
  <path d="M544 239 Q591 264 645 220" fill="none"
        stroke="#dc8e50" stroke-width="4" stroke-linecap="round"/>
  <circle cx="489" cy="151" r="6" fill="#263e4b"/>
  <circle cx="491" cy="149" r="2" fill="#fff"/>
  <path d="M473 138 Q486 131 497 138" fill="none"
        stroke="#78939b" stroke-width="3" stroke-linecap="round"/>
