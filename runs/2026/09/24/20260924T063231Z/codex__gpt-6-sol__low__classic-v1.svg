<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A white pelican with an orange beak pedals a blue bicycle under a sunny sky.</desc>

  <rect width="800" height="560" fill="#dff4ff"/>
  <circle cx="668" cy="95" r="48" fill="#ffd66b"/>
  <path d="M0 455 Q200 425 400 455 T800 455 V560 H0Z" fill="#b8dfa8"/>

  <!-- Bicycle -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="218" cy="425" r="83" stroke="#263a4a" stroke-width="12"/>
    <circle cx="590" cy="425" r="83" stroke="#263a4a" stroke-width="12"/>
    <circle cx="218" cy="425" r="70" stroke="#f8fcff" stroke-width="3"/>
    <circle cx="590" cy="425" r="70" stroke="#f8fcff" stroke-width="3"/>

    <path d="M218 425 310 303 402 425 218 425
             M310 303 501 303 402 425
             M501 303 590 425"
          stroke="#3289b6" stroke-width="15"/>
    <path d="M288 303h68 M500 303l-17-49h63"
          stroke="#263a4a" stroke-width="11"/>
    <path d="M546 254q17 0 20 17" stroke="#263a4a" stroke-width="9"/>
    <circle cx="402" cy="425" r="17" fill="#263a4a" stroke="#263a4a"/>
    <path d="M402 425l42 25h33 M402 425l-39-27h-30"
          stroke="#263a4a" stroke-width="8"/>
  </g>

  <!-- Pelican -->
  <path d="M334 300q-37-42-22-104 11-47 62-58 45-10 74 27
           31 39 17 91-7 27-19 48z"
        fill="#fffdf3" stroke="#334452" stroke-width="6"/>
  <path d="M363 165q-38-48-14-95 17-32 51-31 37 1 48 33
           9 26-6 54l-22 54z"
        fill="#fffdf3" stroke="#334452" stroke-width="6"/>

  <!-- Beak and pouch -->
  <path d="M426 106q75-6 154 17-61 20-144 16z"
        fill="#f5a63d" stroke="#334452" stroke-width="5"/>
  <path d="M436 138q48 35 111 10-9 57-55 66-47 5-56-76z"
        fill="#f6bb61" stroke="#334452" stroke-width="5"/>
  <circle cx="417" cy="91" r="8" fill="#253541"/>
  <circle cx="420" cy="88" r="2.5" fill="#fff"/>

  <!-- Wing and tail -->
  <path d="M379 186q73-9 87 56 7 46-34 67-52 4-85-39
           45 5 74-20-43 5-65-14"
        fill="#e7edf0" stroke="#334452" stroke-width="6"/>
  <path d="M326 264q-39-9-74-42 11 50 62 77z"
        fill="#fffdf3" stroke="#334452" stroke-width="6"/>

  <!-- Legs on pedals -->
  <g fill="none" stroke="#eca044" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M378 298q-15 36 10 61l56 91"/>
    <path d="M414 299q35 41 10 70l-61 29"/>
  </g>
  <path d="M477 450h-33 M363 398h-30"
        stroke="#334452" stroke-width="10" stroke-linecap="round"/>
</svg>