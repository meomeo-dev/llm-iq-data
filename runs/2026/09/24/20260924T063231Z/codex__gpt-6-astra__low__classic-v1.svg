<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a long orange bill pedals a teal bicycle along a sunny seaside path.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#d9f3f3"/>
      <stop offset="1" stop-color="#fff7df"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffcf76"/>
      <stop offset="1" stop-color="#ee9753"/>
    </linearGradient>
    <linearGradient id="feathers" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7e6"/>
    </linearGradient>
    <g id="wheel">
      <circle r="106" fill="#fffdf4" fill-opacity=".55" stroke="#263e49" stroke-width="13"/>
      <circle r="95" fill="none" stroke="#a6bbc0" stroke-width="3"/>
      <g stroke="#9eb5b9" stroke-width="2">
        <path d="M-94 0H94M0-94V94M-66-66L66 66M-66 66L66-66"/>
        <path d="M-87-36L87 36M-87 36L87-36M-36-87L36 87M-36 87L36-87"/>
      </g>
      <circle r="11" fill="#f8ce7b" stroke="#263e49" stroke-width="4"/>
    </g>
  </defs>

  <!-- Sea air and a quiet coastal path -->
  <rect width="900" height="700" rx="28" fill="url(#sky)"/>
  <circle cx="738" cy="125" r="53" fill="#ffd986"/>
  <g fill="#ffffff" opacity=".8">
    <path d="M92 147c-8-24 25-42 44-25 7-35 58-37 69-3 27-10 47 10 44 28Z"/>
    <path d="M572 91c-4-16 16-27 29-18 9-24 44-20 48 4 19-4 30 5 32 14Z"/>
  </g>
  <path d="M0 440Q160 421 318 443T630 442T900 431V566H0Z" fill="#a9dcd7"/>
  <g fill="none" stroke="#e4f5e9" stroke-width="4" stroke-linecap="round">
    <path d="M52 479h101m30-19h56m451 18h105m-66 30h61"/>
  </g>
  <path d="M0 547Q222 523 455 550T900 539V700H0Z" fill="#efdcb5"/>
  <path d="M0 592Q233 569 467 596T900 586" fill="none" stroke="#fff1d2" stroke-width="6"/>
  <ellipse cx="455" cy="628" rx="319" ry="22" fill="#b59e79" opacity=".2"/>

  <!-- Bicycle wheels and frame -->
  <use href="#wheel" x="267" y="516"/>
  <use href="#wheel" x="649" y="516"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M267 516L359 358L451 516Z" stroke="#263e49" stroke-width="14"/>
    <path d="M359 358L582 354L451 516M582 354L649 516" stroke="#263e49" stroke-width="14"/>
    <path d="M267 516L359 358L451 516Z" stroke="#239b9e" stroke-width="8"/>
    <path d="M359 358L582 354L451 516M582 354L649 516" stroke="#239b9e" stroke-width="8"/>
    <path d="M359 358L345 325" stroke="#526b72" stroke-width="9"/>
    <path d="M582 354L566 301L600 282L624 289" stroke="#526b72" stroke-width="9"/>
    <path d="M611 285L631 291" stroke="#263e49" stroke-width="12"/>
    <path d="M620 299Q657 346 629 406" stroke="#526b72" stroke-width="3"/>
  </g>
  <path d="M315 321Q341 312 374 320Q386 324 376 332H320Q309 332 315 321Z" fill="#704c3e" stroke="#263e49" stroke-width="4"/>
  <circle cx="451" cy="516" r="26" fill="#e7ece2" stroke="#526b72" stroke-width="5"/>
  <circle cx="451" cy="516" r="16" fill="none" stroke="#9cacaa" stroke-width="3"/>
  <path d="M267 506L451 490M267 527L451 542" fill="none" stroke="#526b72" stroke-width="3"/>

  <!-- Far leg and pedal -->
  <path d="M401 337L445 387L416 457" fill="none" stroke="#ce843d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M416 449L397 461Q415 471 439 461L431 451Z" fill="#e8a14e" stroke="#754e32" stroke-width="3"/>
  <path d="M451 516L419 464" stroke="#526b72" stroke-width="7" stroke-linecap="round"/>
  <path d="M400 466H438" stroke="#263e49" stroke-width="9" stroke-linecap="round"/>

  <!-- Pelican tail and body -->
  <path d="M332 275L251 247L271 278L246 275Q278 307 327 318Z" fill="#e7efeb" stroke="#344b54" stroke-width="4" stroke-linejoin="round"/>
  <path d="M319 235C340 214 390 205 432 221C460 232 475 259 463 297C451 335 408 355 360 337C317 322 297 274 319 235Z" fill="url(#feathers)" stroke="#344b54" stroke-width="4"/>

  <!-- Curving neck -->
  <path d="M411 242C448 226 454 206 450 174C446 143 455 111 484 101C515 91 540 108 540 132C540 155 518 168 502 184C485 202 500 230 483 258C472 278 448 287 432 278" fill="url(#feathers)" stroke="#344b54" stroke-width="4" stroke-linecap="round"/>
  <path d="M467 164Q468 194 459 213" fill="none" stroke="#c9dbdb" stroke-width="9" stroke-linecap="round"/>

  <!-- Long bill and soft throat pouch -->
  <path d="M517 140L713 154C677 188 607 211 561 191C539 181 525 161 517 140Z" fill="url(#pouch)" stroke="#754e32" stroke-width="4" stroke-linejoin="round"/>
  <path d="M519 133Q601 132 717 151Q725 153 713 159L521 150Z" fill="#f9bd50" stroke="#754e32" stroke-width="4" stroke-linejoin="round"/>
  <path d="M544 158Q593 181 664 167" fill="none" stroke="#ffe0a0" stroke-width="4" stroke-linecap="round"/>

  <!-- Eye, brow, and swept crown feathers -->
  <path d="M466 107L462 88L479 99L484 80L494 97" fill="#ffffff" stroke="#344b54" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="509" cy="126" rx="12" ry="14" fill="#fffdf0"/>
  <circle cx="513" cy="127" r="6" fill="#263e49"/>
  <circle cx="515" cy="124" r="2" fill="#ffffff"/>
  <path d="M499 108Q508 103 517 109" fill="none" stroke="#344b54" stroke-width="3" stroke-linecap="round"/>

  <!-- A little red scarf streaming behind -->
  <path d="M454 200Q469 212 491 211L488 226Q466 228 449 214Z" fill="#de6555" stroke="#8a443d" stroke-width="3"/>
  <path d="M452 208Q420 187 379 199L390 209L374 218Q421 208 449 222Z" fill="#e87861" stroke="#8a443d" stroke-width="3" stroke-linejoin="round"/>

  <!-- Wing reaching the handlebars -->
  <path d="M353 252C384 240 417 259 443 277C474 298 518 295 560 281Q576 279 578 290C555 313 508 327 465 319C426 313 398 301 375 296" fill="url(#feathers)" stroke="#344b54" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#b1c6c8" stroke-width="3" stroke-linecap="round">
    <path d="M378 267Q417 295 456 303"/>
    <path d="M374 279Q404 301 430 306"/>
    <path d="M512 308L554 294"/>
  </g>

  <!-- Near leg, webbed foot, and crank -->
  <path d="M377 333L365 396L454 446L482 540" fill="none" stroke="#754e32" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M377 333L365 396L454 446L482 540" fill="none" stroke="#eda44e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M479 531Q489 535 493 541L517 551Q523 557 513 561H472Q461 556 468 547Z" fill="#f4b45d" stroke="#754e32" stroke-width="3" stroke-linejoin="round"/>
  <path d="M451 516L486 565" stroke="#526b72" stroke-width="7" stroke-linecap="round"/>
  <path d="M467 566H510" stroke="#263e49" stroke-width="9" stroke-linecap="round"/>
  <circle cx="451" cy="516" r="6" fill="#263e49"/>

  <!-- Bell and a few passing breezes -->
  <path d="M590 282Q589 266 603 267Q617 269 613 283Z" fill="#f5c463" stroke="#344b54" stroke-width="3"/>
  <g fill="none" stroke="#76b6b7" stroke-width="4" stroke-linecap="round">
    <path d="M170 337h65m-90 22h54m-16 25h51"/>
    <path d="M615 253l7-9m3 19l12-3"/>
  </g>
  <g fill="#cbaf7d">
    <ellipse cx="113" cy="633" rx="6" ry="3"/>
    <ellipse cx="746" cy="661" rx="8" ry="3"/>
    <ellipse cx="785" cy="611" rx="5" ry="2"/>
  </g>
</svg>