<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="骑自行车的鹈鹕">
  <title>骑自行车的鹈鹕</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
  </defs>

  <!-- 天空、太阳、云 -->
  <rect width="800" height="520" fill="url(#sky)"/>
  <circle cx="700" cy="82" r="54" fill="#ffe58a" opacity="0.55"/>
  <circle cx="700" cy="82" r="40" fill="#ffd95a"/>
  <g fill="#fff" opacity="0.92">
    <ellipse cx="120" cy="94" rx="44" ry="18"/>
    <ellipse cx="98" cy="84" rx="24" ry="16"/>
    <ellipse cx="140" cy="80" rx="28" ry="20"/>
    <ellipse cx="660" cy="194" rx="46" ry="16"/>
    <ellipse cx="640" cy="184" rx="24" ry="14"/>
    <ellipse cx="682" cy="180" rx="30" ry="18"/>
  </g>

  <!-- 路面、草地与投影 -->
  <rect x="0" y="450" width="800" height="32" fill="#8a8a8a"/>
  <line x1="0" y1="466" x2="800" y2="466" stroke="#f4d35e" stroke-width="3" stroke-dasharray="28 20"/>
  <rect x="0" y="482" width="800" height="38" fill="#7fc36b"/>
  <ellipse cx="360" cy="452" rx="230" ry="7" fill="#000" opacity="0.18"/>

  <!-- 速度线 -->
  <g stroke="#7fa9c9" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="55" y1="300" x2="115" y2="300"/>
    <line x1="40" y1="332" x2="110" y2="332"/>
    <line x1="60" y1="364" x2="112" y2="364"/>
  </g>

  <!-- 后轮 -->
  <g transform="translate(200 380)">
    <circle r="70" fill="none" stroke="#222" stroke-width="9"/>
    <circle r="61" fill="none" stroke="#8f8f8f" stroke-width="3"/>
    <g stroke="#a8a8a8" stroke-width="2">
      <line x1="-60" y1="0" x2="60" y2="0"/>
      <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(30)"/>
      <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(60)"/>
      <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(90)"/>
      <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(120)"/>
      <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(150)"/>
    </g>
    <circle r="9" fill="#444"/>
  </g>
  <!-- 前轮 -->
  <g transform="translate(520 380)">
    <circle r="70" fill="none" stroke="#222" stroke-width="9"/>
    <circle r="61" fill="none" stroke="#8f8f8f" stroke-width="3"/>
    <g stroke="#a8a8a8" stroke-width="2">
      <line x1="-60" y1="0" x2="60" y2="0"/>
      <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(30)"/>
      <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(60)"/>
      <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(90)"/>
      <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(120)"/>
      <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(150)"/>
    </g>
    <circle r="9" fill="#444"/>
  </g>

  <!-- 链条与飞轮 -->
  <circle cx="200" cy="380" r="10" fill="none" stroke="#444" stroke-width="4"/>
  <line x1="345" y1="361" x2="200" y2="370" stroke="#555" stroke-width="3" stroke-dasharray="5 3"/>
  <line x1="345" y1="409" x2="200" y2="390" stroke="#555" stroke-width="3" stroke-dasharray="5 3"/>

  <!-- 远侧曲柄、脚踏、腿与脚（画在车架后面） -->
  <line x1="345" y1="385" x2="316" y2="368" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <rect x="304" y="365" width="24" height="7" rx="2" fill="#333"/>
  <path d="M 318 236 L 298 305 L 317 358" fill="none" stroke="#6b3f10" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 318 236 L 298 305 L 317 358" fill="none" stroke="#d88c30" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 300 356 L 336 356 L 340 366 L 294 366 Z" fill="#d88c30" stroke="#6b3f10" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 牙盘 -->
  <circle cx="345" cy="385" r="24" fill="none" stroke="#444" stroke-width="5"/>
  <circle cx="345" cy="385" r="6" fill="#444"/>

  <!-- 车架、前叉、车把、座管与车座 -->
  <path d="M 345 385 L 300 255 L 458 250 L 472 292 Z M 345 385 L 200 380 L 300 255" fill="none" stroke="#d7263d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="472" y1="292" x2="520" y2="380" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <line x1="458" y1="250" x2="453" y2="237" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <path d="M 453 237 C 446 230, 432 228, 418 232" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <line x1="420" y1="231" x2="410" y2="234" stroke="#222" stroke-width="10" stroke-linecap="round"/>
  <line x1="300" y1="255" x2="295" y2="241" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <path d="M 250 238 C 250 232, 262 230, 280 232 L 320 236 C 326 237, 326 244, 318 245 L 258 246 C 250 246, 248 242, 250 238 Z" fill="#222"/>

  <!-- 近侧曲柄与脚踏 -->
  <line x1="345" y1="385" x2="374" y2="402" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <rect x="362" y="399" width="24" height="7" rx="2" fill="#222"/>

  <!-- 近侧腿与脚 -->
  <path d="M 338 236 L 350 320 L 375 393" fill="none" stroke="#7a4a10" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 338 236 L 350 320 L 375 393" fill="none" stroke="#f0a040" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 356 390 L 394 390 L 399 400 L 351 400 Z" fill="#f0a040" stroke="#7a4a10" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 366 391 L 364 399 M 378 391 L 379 399" fill="none" stroke="#7a4a10" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 鹈鹕：头冠、身体（含颈、头、尾羽） -->
  <path d="M 442 78 L 424 70 L 438 64 L 428 54 L 450 72 Z" fill="#f7f7f2" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 192 168 L 250 150 C 280 125, 340 120, 375 135 C 400 118, 420 95, 440 75 C 450 65, 470 65, 480 78 C 490 90, 490 108, 482 118 C 470 130, 455 132, 445 128 C 425 140, 412 158, 402 178 C 396 205, 384 238, 340 250 C 300 258, 260 245, 235 225 C 225 215, 215 200, 218 194 L 200 198 L 210 186 L 194 184 L 208 176 Z" fill="#f7f7f2" stroke="#333" stroke-width="3" stroke-linejoin="round"/>

  <!-- 翅膀（搭在车把上） -->
  <path d="M 300 152 C 350 140, 410 175, 434 218 C 432 230, 418 234, 408 226 C 380 198, 330 192, 292 180 C 280 170, 285 156, 300 152 Z" fill="#e6e6dd" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 326 176 L 398 214 M 340 160 L 420 212" fill="none" stroke="#a9a9a2" stroke-width="2" stroke-linecap="round"/>

  <!-- 喉囊与喙 -->
  <path d="M 478 102 C 472 150, 530 184, 600 124 L 596 116 Z" fill="#f6c15c" stroke="#8a5a1a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 478 84 C 520 88, 572 100, 604 116 L 606 122 L 600 126 C 562 114, 520 108, 478 104 Z" fill="#f4a83a" stroke="#8a5a1a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 488 92 C 525 96, 566 106, 592 117" fill="none" stroke="#d18f3a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 眼睛 -->
  <circle cx="463" cy="93" r="5.5" fill="#222"/>
  <circle cx="465" cy="91" r="1.8" fill="#fff"/>
</svg>