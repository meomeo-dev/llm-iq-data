<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="65%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FFF176" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFEE58" stop-opacity="0"/>
    </radialGradient>

    <!-- Sloth Fur Gradients -->
    <linearGradient id="furBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C826A"/>
      <stop offset="60%" stop-color="#846C56"/>
      <stop offset="100%" stop-color="#6E5642"/>
    </linearGradient>

    <linearGradient id="furLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFEBE9"/>
      <stop offset="100%" stop-color="#D7CCC8"/>
    </linearGradient>

    <linearGradient id="eyeMaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>

    <!-- Bicycle Frame Gradients -->
    <linearGradient id="bikeFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="50%" stop-color="#F4511E"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="50%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>

    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="50%" stop-color="#BCAAA4"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1B5E20" flood-opacity="0.2"/>
    </filter>

    <filter id="groundShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Environment & Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Soft Warm Sun / Backdrop circle -->
  <circle cx="680" cy="120" r="110" fill="url(#sunGlow)"/>

  <!-- Distant Foliage Hills -->
  <path d="M-50,490 Q90,440 260,470 T620,450 T850,480 L850,600 L-50,600 Z" fill="#81C784" opacity="0.6"/>
  <path d="M-50,520 Q120,490 350,510 T750,500 T850,520 L850,600 L-50,600 Z" fill="#66BB6A" opacity="0.5"/>

  <!-- Ground Path / Road -->
  <path d="M-20,530 Q200,525 400,530 T820,530 L820,600 L-20,600 Z" fill="#C5E1A5"/>
  <path d="M-20,545 Q250,540 500,545 T820,545 L820,600 L-20,600 Z" fill="#AED581"/>

  <!-- Speed lines (deliberately slow & whimsical) -->
  <g stroke="#90A4AE" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="160" y1="280" x2="130" y2="280" stroke-dasharray="6,4"/>
    <line x1="180" y1="310" x2="140" y2="310" stroke-dasharray="4,6"/>
    <line x1="150" y1="340" x2="120" y2="340"/>
  </g>

  <!-- Ground Shadows for Wheels -->
  <ellipse cx="270" cy="535" rx="75" ry="12" fill="#558B2F" opacity="0.4" filter="url(#groundShadow)"/>
  <ellipse cx="540" cy="535" rx="75" ry="12" fill="#558B2F" opacity="0.4" filter="url(#groundShadow)"/>

  <!-- ==================== BICYCLE ==================== -->
  <g id="bicycle">
    <!-- Back Wheel -->
    <g id="backWheel">
      <circle cx="270" cy="460" r="75" fill="none" stroke="#37474F" stroke-width="14"/>
      <circle cx="270" cy="460" r="70" fill="none" stroke="#ECEFF1" stroke-width="2" opacity="0.8"/>
      <circle cx="270" cy="460" r="66" fill="none" stroke="url(#rimGrad)" stroke-width="5"/>
      <g stroke="#B0BEC5" stroke-width="1.8" opacity="0.85">
        <line x1="270" y1="395" x2="270" y2="525"/>
        <line x1="205" y1="460" x2="335" y2="460"/>
        <line x1="224" y1="414" x2="316" y2="506"/>
        <line x1="224" y1="506" x2="316" y2="414"/>
        <line x1="212" y1="435" x2="328" y2="485"/>
        <line x1="212" y1="485" x2="328" y2="435"/>
        <line x1="245" y1="402" x2="295" y2="518"/>
        <line x1="295" y1="402" x2="245" y2="518"/>
      </g>
      <circle cx="270" cy="460" r="10" fill="#455A64"/>
      <circle cx="270" cy="460" r="5" fill="#CFD8DC"/>
    </g>

    <!-- Front Wheel -->
    <g id="frontWheel">
      <circle cx="540" cy="460" r="75" fill="none" stroke="#37474F" stroke-width="14"/>
      <circle cx="540" cy="460" r="70" fill="none" stroke="#ECEFF1" stroke-width="2" opacity="0.8"/>
      <circle cx="540" cy="460" r="66" fill="none" stroke="url(#rimGrad)" stroke-width="5"/>
      <g stroke="#B0BEC5" stroke-width="1.8" opacity="0.85">
        <line x1="540" y1="395" x2="540" y2="525"/>
        <line x1="475" y1="460" x2="605" y2="460"/>
        <line x1="494" y1="414" x2="586" y2="506"/>
        <line x1="494" y1="506" x2="586" y2="414"/>
        <line x1="482" y1="435" x2="598" y2="485"/>
        <line x1="482" y1="485" x2="598" y2="435"/>
        <line x1="515" y1="402" x2="565" y2="518"/>
        <line x1="565" y1="402" x2="515" y2="518"/>
      </g>
      <circle cx="540" cy="460" r="10" fill="#455A64"/>
      <circle cx="540" cy="460" r="5" fill="#CFD8DC"/>
    </g>

    <!-- Bicycle Frame (Vintage Step-Through Style) -->
    <g id="frame" stroke-linecap="round" stroke-linejoin="round">
      <line x1="270" y1="460" x2="390" y2="460" stroke="url(#bikeFrame)" stroke-width="10"/>
      <line x1="270" y1="460" x2="355" y2="355" stroke="url(#bikeFrame)" stroke-width="9"/>
      <line x1="355" y1="355" x2="390" y2="460" stroke="url(#bikeFrame)" stroke-width="10"/>
      <line x1="355" y1="355" x2="345" y2="320" stroke="#78909C" stroke-width="8"/>
      
      <path d="M355,360 Q430,420 500,340" fill="none" stroke="url(#bikeFrame)" stroke-width="10"/>
      <path d="M390,460 Q450,470 500,340" fill="none" stroke="url(#bikeFrame)" stroke-width="10"/>
      
      <line x1="500" y1="340" x2="540" y2="460" stroke="url(#bikeFrame)" stroke-width="10"/>
      <line x1="500" y1="340" x2="492" y2="285" stroke="#78909C" stroke-width="8"/>
      
      <path d="M470,290 Q495,280 520,300" fill="none" stroke="#546E7A" stroke-width="8" stroke-linecap="round"/>
      <path d="M465,290 L455,295" stroke="#37474F" stroke-width="10" stroke-linecap="round"/>

      <!-- Saddle -->
      <path d="M320,320 C320,312 335,310 355,310 C375,310 385,316 380,324 C375,330 355,332 335,330 Z" fill="#4E342E"/>
      <path d="M322,322 C330,317 345,315 365,315" stroke="#6D4C41" stroke-width="2" fill="none"/>
      
      <!-- Chain and Crankset -->
      <circle cx="390" cy="460" r="22" fill="#B0BEC5" stroke="#37474F" stroke-width="3"/>
      <line x1="270" y1="460" x2="390" y2="460" stroke="#455A64" stroke-width="3" stroke-dasharray="5,4"/>
      <circle cx="390" cy="460" r="6" fill="#263238"/>

      <!-- Left / Back Pedal Assembly -->
      <line x1="390" y1="460" x2="425" y2="415" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
      <rect x="415" y="407" width="20" height="7" rx="3" fill="#37474F"/>

      <!-- Front Wicker Basket -->
      <g id="basket" transform="translate(495, 275)">
        <path d="M10,15 L45,15 L40,55 L15,55 Z" fill="url(#basketGrad)" stroke="#5D4037" stroke-width="2"/>
        <path d="M12,25 L43,25 M13,35 L42,35 M14,45 L41,45" stroke="#6D4C41" stroke-width="1.8"/>
        <path d="M20,15 L22,55 M30,15 L30,55 M38,15 L36,55" stroke="#6D4C41" stroke-width="1.8"/>
        <rect x="12" y="18" width="5" height="12" rx="2" fill="#3E2723"/>
        <circle cx="28" cy="12" r="7" fill="#E91E63"/>
        <circle cx="28" cy="12" r="3" fill="#FFF176"/>
        <path d="M22,14 Q28,4 34,14 Q42,18 34,22 Q28,26 22,22 Q16,18 22,14 Z" fill="#F06292" opacity="0.85"/>
        <path d="M35,16 Q48,5 45,22 Z" fill="#4CAF50"/>
        <path d="M15,18 Q8,5 22,10 Z" fill="#66BB6A"/>
      </g>

      <!-- Handlebar Bell -->
      <ellipse cx="505" cy="275" rx="7" ry="6" fill="#FFD54F" stroke="#F57F17" stroke-width="1.5"/>
      <rect x="500" y="278" width="4" height="4" fill="#FFA000"/>
    </g>
  </g>

  <!-- ==================== THE SLOTH ==================== -->
  <g id="sloth" filter="url(#shadow)">
    <!-- Back Leg -->
    <g id="backLeg">
      <path d="M365,370 Q390,395 425,415" fill="none" stroke="url(#furBody)" stroke-width="26" stroke-linecap="round"/>
      <path d="M422,410 Q430,412 432,418 M426,413 Q434,417 435,423 M420,417 Q428,421 428,427" 
            stroke="#ECEFF1" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Torso -->
    <path d="M340,340 C325,300 365,225 420,230 C470,235 480,310 440,365 C410,400 355,385 340,340 Z" 
          fill="url(#furBody)"/>
    <path d="M370,335 C360,290 395,250 430,255 C455,260 460,305 440,345 C420,380 380,375 370,335 Z" 
          fill="url(#furLight)" opacity="0.6"/>

    <!-- Front Leg -->
    <g id="frontLeg">
      <path d="M390,360 Q360,440 375,475" fill="none" stroke="url(#furBody)" stroke-width="28" stroke-linecap="round"/>
      <line x1="390" y1="460" x2="370" y2="485" stroke="#546E7A" stroke-width="6" stroke-linecap="round"/>
      <rect x="355" y="480" width="22" height="7" rx="3" fill="#263238"/>
      <path d="M362,476 C362,488 358,495 356,498" stroke="#ECEFF1" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M368,477 C368,490 365,497 363,501" stroke="#ECEFF1" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M374,476 C374,489 372,496 370,499" stroke="#ECEFF1" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Far Arm -->
    <path d="M420,270 Q450,265 480,290" fill="none" stroke="#755E49" stroke-width="20" stroke-linecap="round"/>

    <!-- Head -->
    <g id="head" transform="translate(440, 200)">
      <circle cx="30" cy="30" r="38" fill="url(#furBody)"/>
      <ellipse cx="14" cy="38" rx="14" ry="12" fill="url(#furBody)"/>
      <ellipse cx="46" cy="38" rx="14" ry="12" fill="url(#furBody)"/>

      <!-- Facial Mask -->
      <path d="M12,28 C10,12 50,12 48,28 C50,46 38,55 30,55 C22,55 10,46 12,28 Z" fill="url(#furLight)"/>

      <!-- Eye Patches & Happy Eyes -->
      <path d="M14,25 Q20,29 27,27 Q22,34 16,33 Z" fill="url(#eyeMaskGrad)"/>
      <ellipse cx="21" cy="28" rx="7" ry="5" fill="url(#eyeMaskGrad)" transform="rotate(-10 21 28)"/>
      <path d="M46,25 Q40,29 33,27 Q38,34 44,33 Z" fill="url(#eyeMaskGrad)"/>
      <ellipse cx="39" cy="28" rx="7" ry="5" fill="url(#eyeMaskGrad)" transform="rotate(10 39 28)"/>

      <path d="M17,29 Q21,34 25,29" fill="none" stroke="#212121" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M35,29 Q39,34 43,29" fill="none" stroke="#212121" stroke-width="2.5" stroke-linecap="round"/>

      <ellipse cx="14" cy="38" rx="5" ry="3.5" fill="#FF8A80" opacity="0.6"/>
      <ellipse cx="46" cy="38" rx="5" ry="3.5" fill="#FF8A80" opacity="0.6"/>

      <!-- Nose & Smile -->
      <ellipse cx="30" cy="38" rx="6" ry="4.5" fill="#3E2723"/>
      <ellipse cx="29" cy="37" rx="2" ry="1.2" fill="#8D6E63"/>
      <path d="M25,43 Q30,49 35,43" fill="none" stroke="#271914" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Cycling Cap / Helmet -->
      <path d="M2,18 Q30,-6 58,18 Q45,10 15,10 Z" fill="#00897B"/>
      <path d="M6,16 C10,0 50,0 54,16 Z" fill="#26A69A"/>
      <path d="M38,15 Q56,12 66,20 Q50,22 36,17 Z" fill="#004D40"/>
      <circle cx="30" cy="3" r="3.5" fill="#FFF59D"/>
      <path d="M8,18 Q12,42 22,48" fill="none" stroke="#004D40" stroke-width="2" stroke-dasharray="3,1"/>
    </g>

    <!-- Near Arm & Claws -->
    <g id="nearArm">
      <path d="M410,290 Q445,310 475,302" fill="none" stroke="url(#furBody)" stroke-width="24" stroke-linecap="round"/>
      <g stroke="#ECEFF1" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M472,295 Q483,298 480,310"/>
        <path d="M476,298 Q487,302 484,314"/>
        <path d="M480,302 Q491,306 488,318"/>
      </g>
    </g>

    <path d="M310,210 Q325,195 340,205 Q330,220 310,210 Z" fill="#81C784" opacity="0.8"/>
    <path d="M280,240 Q295,230 305,242 Q295,252 280,240 Z" fill="#AED581" opacity="0.7"/>
  </g>

  <!-- Fenders -->
  <path d="M475,435 Q530,375 585,420" fill="none" stroke="#FF7043" stroke-width="7" opacity="0.9" stroke-linecap="round"/>
  <path d="M205,435 Q260,375 315,420" fill="none" stroke="#FF7043" stroke-width="7" opacity="0.9" stroke-linecap="round"/>

  <!-- Plaque -->
  <g transform="translate(400, 575)">
    <rect x="-110" y="-18" width="220" height="26" rx="13" fill="#2E7D32" opacity="0.85"/>
    <text text-anchor="middle" y="0" font-family="'Nunito', 'Segoe UI', -apple-system, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF" letter-spacing="1.5">
      CRUISING SPEED • 0.2 MPH
    </text>
  </g>
</svg>