<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- 天空与地面 -->
  <rect width="400" height="300" fill="#dff1ff"/>
  <circle cx="345" cy="50" r="24" fill="#ffd84d"/>
  <g fill="#ffffff">
    <ellipse cx="80" cy="50" rx="30" ry="12"/>
    <ellipse cx="105" cy="44" rx="22" ry="11"/>
    <ellipse cx="250" cy="30" rx="24" ry="9"/>
  </g>
  <rect y="270" width="400" height="30" fill="#8fcf72"/>
  <line x1="0" y1="270" x2="400" y2="270" stroke="#6aa853" stroke-width="2"/>

  <!-- 车轮 -->
  <g fill="none" stroke="#333" stroke-width="5">
    <circle cx="110" cy="220" r="48"/>
    <circle cx="290" cy="220" r="48"/>
  </g>
  <g stroke="#888" stroke-width="1.5">
    <line x1="110" y1="172" x2="110" y2="268"/>
    <line x1="62" y1="220" x2="158" y2="220"/>
    <line x1="76" y1="186" x2="144" y2="254"/>
    <line x1="76" y1="254" x2="144" y2="186"/>
    <line x1="290" y1="172" x2="290" y2="268"/>
    <line x1="242" y1="220" x2="338" y2="220"/>
    <line x1="256" y1="186" x2="324" y2="254"/>
    <line x1="256" y1="254" x2="324" y2="186"/>
  </g>
  <circle cx="110" cy="220" r="5" fill="#555"/>
  <circle cx="290" cy="220" r="5" fill="#555"/>

  <!-- 车架 -->
  <g stroke="#d7263d" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="110" y1="220" x2="190" y2="220"/>
    <line x1="110" y1="220" x2="172" y2="152"/>
    <line x1="190" y1="220" x2="170" y2="146"/>
    <line x1="172" y1="152" x2="264" y2="146"/>
    <line x1="190" y1="220" x2="267" y2="158"/>
    <line x1="265" y1="140" x2="290" y2="220"/>
  </g>
  <!-- 车把与车座 -->
  <g stroke="#333" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="265" y1="142" x2="262" y2="126"/>
    <path d="M250 128 Q262 120 278 124"/>
  </g>
  <path d="M152 145 Q170 138 188 144 L184 150 Q168 147 156 150 Z" fill="#222"/>

  <!-- 曲柄与踏板 -->
  <circle cx="190" cy="220" r="10" fill="none" stroke="#555" stroke-width="3"/>
  <line x1="175" y1="206" x2="205" y2="234" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <rect x="197" y="231" width="16" height="5" rx="2" fill="#222"/>
  <rect x="167" y="203" width="16" height="5" rx="2" fill="#222"/>

  <!-- 后侧腿 -->
  <g stroke="#f08a24" stroke-width="5" stroke-linecap="round" fill="none">
    <polyline points="176,140 194,172 176,204"/>
  </g>
  <path d="M168 205 L186 205 L178 199 Z" fill="#f08a24"/>

  <!-- 鹈鹕身体 -->
  <path d="M132 112 L112 104 L118 120 L136 124 Z" fill="#cfd6dc"/>
  <ellipse cx="178" cy="122" rx="44" ry="27" fill="#f7f7f5" stroke="#b9c0c6" stroke-width="2"
           transform="rotate(-10 178 122)"/>
  <!-- 颈部 -->
  <path d="M196 108 C214 98 212 80 226 66 L240 72 C228 86 228 104 212 120 Z"
        fill="#f7f7f5" stroke="#b9c0c6" stroke-width="2"/>
  <!-- 翅膀伸向车把 -->
  <path d="M150 112 C170 98 205 104 230 116 L260 124 L256 130 L226 126 C200 132 168 132 150 124 Z"
        fill="#aeb8c1" stroke="#8a96a1" stroke-width="2"/>
  <path d="M160 120 L186 118 M168 126 L196 124" stroke="#8a96a1" stroke-width="1.5"/>

  <!-- 前侧腿 -->
  <g stroke="#f08a24" stroke-width="5" stroke-linecap="round" fill="none">
    <polyline points="190,142 218,182 205,232"/>
  </g>
  <path d="M196 233 L216 233 L207 226 Z" fill="#f08a24"/>

  <!-- 头部 -->
  <circle cx="235" cy="60" r="16" fill="#f7f7f5" stroke="#b9c0c6" stroke-width="2"/>
  <path d="M226 46 Q222 36 232 40 Q236 32 240 44" fill="#f2e6a8"/>
  <!-- 喙与喉囊 -->
  <path d="M247 66 Q285 90 318 76 L320 72 Q290 76 248 72 Z" fill="#f0a93a" stroke="#c77d1a" stroke-width="1.5"/>
  <path d="M246 56 L322 70 L318 76 L247 66 Z" fill="#ffc94d" stroke="#c77d1a" stroke-width="1.5"/>
  <circle cx="239" cy="56" r="3.2" fill="#222"/>
  <circle cx="240" cy="55" r="1" fill="#fff"/>

  <!-- 速度线 -->
  <g stroke="#9bb7cc" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="180" x2="50" y2="180"/>
    <line x1="10" y1="205" x2="48" y2="205"/>
    <line x1="25" y1="230" x2="52" y2="230"/>
  </g>
</svg>