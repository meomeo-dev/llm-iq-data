<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a68f6d"/>
      <stop offset="1" stop-color="#7c6a4f"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#2b2b2b" stroke-width="10"/>
      <circle r="62" fill="none" stroke="#c9c9c9" stroke-width="4"/>
      <g stroke="#9a9a9a" stroke-width="2">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="0" y1="-62" x2="0" y2="62"/>
        <line x1="-44" y1="-44" x2="44" y2="44"/>
        <line x1="-44" y1="44" x2="44" y2="-44"/>
        <line x1="-57" y1="-24" x2="57" y2="24"/>
        <line x1="-57" y1="24" x2="57" y2="-24"/>
        <line x1="-24" y1="-57" x2="24" y2="57"/>
        <line x1="-24" y1="57" x2="24" y2="-57"/>
      </g>
      <circle r="8" fill="#555"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="690" cy="80" r="42" fill="#ffd966"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="130" cy="90" rx="50" ry="22"/>
    <ellipse cx="165" cy="78" rx="38" ry="26"/>
    <ellipse cx="95" cy="82" rx="30" ry="20"/>
    <ellipse cx="560" cy="130" rx="40" ry="18"/>
    <ellipse cx="588" cy="120" rx="30" ry="20"/>
  </g>
  <rect x="0" y="430" width="800" height="70" fill="#8fc46a"/>
  <path d="M0 430 Q400 420 800 430 L800 440 Q400 432 0 440 Z" fill="#6da84e"/>

  <!-- 慢速动感线 -->
  <g stroke="#7fb3d5" stroke-width="3" stroke-linecap="round">
    <line x1="90" y1="340" x2="130" y2="340"/>
    <line x1="70" y1="365" x2="120" y2="365"/>
    <line x1="100" y1="390" x2="135" y2="390"/>
  </g>

  <!-- 后轮 -->
  <use href="#wheel" x="220" y="360"/>

  <!-- 远侧手臂与腿（在车架之后） -->
  <g fill="none" stroke="#6b5a42" stroke-width="20" stroke-linecap="round">
    <path d="M375 132 C 420 132, 470 168, 508 212"/>
    <path d="M340 222 C 318 272, 340 330, 372 346"/>
  </g>

  <!-- 车架 -->
  <g fill="none" stroke="#d9534f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <line x1="220" y1="360" x2="400" y2="370"/>
    <line x1="220" y1="360" x2="370" y2="250"/>
    <line x1="400" y1="370" x2="370" y2="250"/>
    <line x1="400" y1="370" x2="525" y2="255"/>
    <line x1="370" y1="250" x2="525" y2="255"/>
    <line x1="525" y1="255" x2="580" y2="360"/>
  </g>
  <line x1="525" y1="255" x2="540" y2="215" stroke="#b23b37" stroke-width="12" stroke-linecap="round"/>
  <!-- 车把 -->
  <line x1="540" y1="215" x2="546" y2="198" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <line x1="546" y1="198" x2="508" y2="208" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="512" cy="207" rx="9" ry="6" fill="#222"/>
  <!-- 座管与车座 -->
  <line x1="370" y1="250" x2="362" y2="226" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <path d="M332 226 Q364 214 398 222 L392 234 Q364 232 338 236 Z" fill="#333"/>

  <!-- 链条与牙盘 -->
  <circle cx="220" cy="360" r="10" fill="none" stroke="#444" stroke-width="4"/>
  <line x1="400" y1="344" x2="220" y2="350" stroke="#555" stroke-width="3"/>
  <line x1="400" y1="396" x2="220" y2="370" stroke="#555" stroke-width="3"/>
  <circle cx="400" cy="370" r="26" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="400" cy="370" r="7" fill="#333"/>
  <line x1="400" y1="370" x2="372" y2="348" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <rect x="360" y="344" width="22" height="7" rx="2" fill="#222"/>

  <!-- 前轮 -->
  <use href="#wheel" x="580" y="360"/>

  <!-- 树懒身体 -->
  <ellipse cx="348" cy="165" rx="50" ry="72" transform="rotate(-12 348 165)" fill="url(#fur)"/>
  <ellipse cx="358" cy="175" rx="30" ry="48" transform="rotate(-12 358 175)" fill="#c4ad88" opacity="0.7"/>
  <!-- 毛发纹理 -->
  <g stroke="#5f4e38" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="308" y1="150" x2="298" y2="162"/>
    <line x1="312" y1="185" x2="301" y2="196"/>
    <line x1="322" y1="215" x2="313" y2="228"/>
    <line x1="392" y1="120" x2="402" y2="110"/>
    <line x1="398" y1="150" x2="410" y2="144"/>
  </g>

  <!-- 头部 -->
  <circle cx="385" cy="82" r="42" fill="url(#fur)"/>
  <g stroke="#5f4e38" stroke-width="2.5" stroke-linecap="round">
    <line x1="366" y1="44" x2="360" y2="34"/>
    <line x1="380" y1="41" x2="378" y2="30"/>
    <line x1="395" y1="41" x2="399" y2="30"/>
    <line x1="408" y1="46" x2="416" y2="38"/>
  </g>
  <ellipse cx="390" cy="88" rx="33" ry="29" fill="#dcc8a6"/>
  <!-- 眼纹 -->
  <ellipse cx="371" cy="84" rx="13" ry="6" transform="rotate(25 371 84)" fill="#4a3728"/>
  <ellipse cx="408" cy="82" rx="13" ry="6" transform="rotate(-25 408 82)" fill="#4a3728"/>
  <!-- 眼睛 -->
  <circle cx="375" cy="82" r="4" fill="#111"/>
  <circle cx="376.5" cy="80.5" r="1.3" fill="#fff"/>
  <circle cx="405" cy="80" r="4" fill="#111"/>
  <circle cx="406.5" cy="78.5" r="1.3" fill="#fff"/>
  <!-- 鼻子与微笑 -->
  <ellipse cx="392" cy="97" rx="6.5" ry="4.5" fill="#3b2a1e"/>
  <path d="M376 106 Q392 118 410 104" fill="none" stroke="#3b2a1e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 近侧手臂与腿（在车架之前） -->
  <g fill="none" stroke="url(#fur)" stroke-width="22" stroke-linecap="round">
    <path d="M388 126 C 432 120, 482 150, 516 204"/>
    <path d="M348 214 C 362 290, 400 332, 428 388"/>
  </g>
  <!-- 爪子 -->
  <g fill="none" stroke="#3b2a1e" stroke-width="3" stroke-linecap="round">
    <path d="M516 204 q 10 -6 16 2"/>
    <path d="M518 210 q 12 -2 16 6"/>
    <path d="M516 215 q 10 2 12 10"/>
    <path d="M430 388 q 12 -2 16 6"/>
    <path d="M430 393 q 12 2 14 10"/>
    <path d="M426 397 q 8 6 6 14"/>
  </g>
  <!-- 近侧曲柄与脚踏 -->
  <line x1="400" y1="370" x2="428" y2="392" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <rect x="417" y="389" width="22" height="7" rx="2" fill="#222"/>

  <!-- 超车的蜗牛 -->
  <g transform="translate(700 428)">
    <path d="M-22 0 Q-24 -10 -10 -10 L6 -10 Q14 -8 12 0 Z" fill="#c9a86a"/>
    <circle cx="-8" cy="-14" r="11" fill="#b5651d"/>
    <path d="M-8 -14 m-6 0 a6 6 0 1 1 12 0 a3 3 0 1 1 -6 0" fill="none" stroke="#7a3f0f" stroke-width="2"/>
    <line x1="8" y1="-10" x2="12" y2="-20" stroke="#c9a86a" stroke-width="2"/>
    <line x1="4" y1="-10" x2="6" y2="-20" stroke="#c9a86a" stroke-width="2"/>
    <circle cx="12" cy="-21" r="1.5" fill="#333"/>
    <circle cx="6" cy="-21" r="1.5" fill="#333"/>
  </g>
</svg>