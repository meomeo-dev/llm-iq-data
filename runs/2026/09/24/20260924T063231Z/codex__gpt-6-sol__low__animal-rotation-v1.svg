<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Sloth riding a bicycle</title>
  <desc id="desc">A smiling brown sloth pedals a blue bicycle beneath a sunny sky.</desc>

  <rect width="800" height="600" fill="#dff5f6"/>
  <circle cx="680" cy="105" r="48" fill="#ffd66b"/>
  <path d="M0 485 Q200 455 400 485 T800 480 V600 H0Z" fill="#bfe7b4"/>

  <!-- Bicycle wheels -->
  <g fill="none" stroke="#364550" stroke-width="12">
    <circle cx="205" cy="445" r="96"/>
    <circle cx="595" cy="445" r="96"/>
  </g>
  <g stroke="#8ca4a7" stroke-width="3">
    <path d="M205 349v192 M109 445h192 M137 377l136 136 M137 513l136-136"/>
    <path d="M595 349v192 M499 445h192 M527 377l136 136 M527 513l136-136"/>
  </g>

  <!-- Bicycle frame and controls -->
  <g fill="none" stroke="#268aa5" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M205 445l135-146 93 146H205l188-146 40 146 162 0-54-166"/>
    <path d="M340 299h55 M541 279l-15-43h64"/>
  </g>
  <path d="M320 287h61" stroke="#364550" stroke-width="12" stroke-linecap="round"/>
  <circle cx="433" cy="445" r="17" fill="#364550"/>
  <path d="M433 445l48 31 M433 445l-48-31" stroke="#364550" stroke-width="9" stroke-linecap="round"/>
  <path d="M463 476h36 M367 414h36" stroke="#364550" stroke-width="8" stroke-linecap="round"/>

  <!-- Sloth's body and legs -->
  <ellipse cx="389" cy="244" rx="87" ry="112" transform="rotate(-18 389 244)" fill="#8b654f"/>
  <ellipse cx="401" cy="250" rx="52" ry="74" transform="rotate(-18 401 250)" fill="#b99a78"/>
  <g fill="none" stroke="#76513f" stroke-width="30" stroke-linecap="round">
    <path d="M352 316q-18 53 31 96"/>
    <path d="M414 320q31 67 66 147"/>
  </g>
  <g fill="#e5cfaa" stroke="#76513f" stroke-width="5">
    <ellipse cx="385" cy="412" rx="22" ry="15" transform="rotate(24 385 412)"/>
    <ellipse cx="482" cy="469" rx="23" ry="15" transform="rotate(24 482 469)"/>
  </g>

  <!-- Arms reaching the handlebar -->
  <g fill="none" stroke="#8b654f" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M438 201q55 22 92 61l24-24"/>
    <path d="M423 231q42 41 91 45l39-38"/>
  </g>
  <g fill="#e5cfaa" stroke="#76513f" stroke-width="4">
    <ellipse cx="559" cy="235" rx="17" ry="12" transform="rotate(-26 559 235)"/>
    <ellipse cx="551" cy="241" rx="17" ry="12" transform="rotate(-26 551 241)"/>
  </g>

  <!-- Sloth's head -->
  <circle cx="350" cy="145" r="79" fill="#8b654f"/>
  <ellipse cx="350" cy="155" rx="63" ry="67" fill="#e5cfaa"/>
  <ellipse cx="321" cy="143" rx="23" ry="30" transform="rotate(22 321 143)" fill="#ad826a"/>
  <ellipse cx="378" cy="143" rx="23" ry="30" transform="rotate(-22 378 143)" fill="#ad826a"/>
  <circle cx="326" cy="141" r="7" fill="#302b2b"/>
  <circle cx="375" cy="141" r="7" fill="#302b2b"/>
  <ellipse cx="351" cy="169" rx="14" ry="10" fill="#493735"/>
  <path d="M333 189q18 19 37 0" fill="none" stroke="#493735" stroke-width="5" stroke-linecap="round"/>
  <circle cx="294" cy="110" r="17" fill="#8b654f"/>
  <circle cx="406" cy="110" r="17" fill="#8b654f"/>
</svg>