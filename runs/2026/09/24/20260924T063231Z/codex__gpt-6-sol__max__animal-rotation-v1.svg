<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="600" viewBox="0 0 800 600"
     role="img" aria-labelledby="title description">
  <title id="title">Sloth riding a bicycle</title>
  <desc id="description">
    A smiling sloth in a blue helmet pedals a coral bicycle through
    a sunny landscape.
  </desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#c9eff4"/>
      <stop offset="1" stop-color="#f4f9e9"/>
    </linearGradient>
    <linearGradient id="fur" x2="0.8" y2="1">
      <stop offset="0" stop-color="#a77b57"/>
      <stop offset="1" stop-color="#765139"/>
    </linearGradient>
    <linearGradient id="face" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f6e6c6"/>
      <stop offset="1" stop-color="#ddc49e"/>
    </linearGradient>
  </defs>

  <!-- Sunny landscape -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="674" cy="103" r="48" fill="#ffe6a1"/>
  <circle cx="674" cy="103" r="61" fill="#ffe6a1" opacity=".22"/>

  <g fill="#fff" opacity=".8">
    <path d="M83 123c8-18 35-22 48-7 16-11 39-2 42 16h-91c-11 0-13-8 1-9z"/>
    <path d="M552 188c8-15 27-19 39-7 16-10 37-2 40 14h-79c-10 0-10-6 0-7z"/>
  </g>

  <path d="M0 442Q147 369 292 433T570 424T800 419V548H0Z"
        fill="#bddcc3"/>
  <path d="M0 484Q174 432 331 484T652 465T800 479V548H0Z"
        fill="#93c5a5"/>
  <path d="M0 540H800V600H0Z" fill="#667c80"/>
  <path d="M0 540H800" stroke="#e8f1df" stroke-width="5"/>
  <path d="M24 576h82m90 0h82m90 0h82m90 0h82m90 0h82"
        stroke="#e4eeeb" stroke-width="5" stroke-linecap="round"
        opacity=".8"/>

  <!-- Motion marks -->
  <g fill="none" stroke="#83b7ae" stroke-width="5"
     stroke-linecap="round" opacity=".7">
    <path d="M94 389h59M75 409h70M104 429h39"/>
  </g>

  <!-- Wheels -->
  <g fill="none" stroke-linecap="round">
    <g transform="translate(230 452)">
      <circle r="87" stroke="#29434b" stroke-width="10"/>
      <circle r="77" stroke="#d5e5e1" stroke-width="3"/>
      <path d="M0-77V77M-77 0H77
               M-54-54L54 54M54-54L-54 54
               M-38-67L38 67M38-67L-38 67
               M-67-38L67 38M67-38L-67 38"
            stroke="#a7c2c0" stroke-width="2"/>
      <circle r="10" fill="#344b50" stroke="#f5eee0" stroke-width="4"/>
    </g>
    <g transform="translate(572 452)">
      <circle r="87" stroke="#29434b" stroke-width="10"/>
      <circle r="77" stroke="#d5e5e1" stroke-width="3"/>
      <path d="M0-77V77M-77 0H77
               M-54-54L54 54M54-54L-54 54
               M-38-67L38 67M38-67L-38 67
               M-67-38L67 38M67-38L-67 38"
            stroke="#a7c2c0" stroke-width="2"/>
      <circle r="10" fill="#344b50" stroke="#f5eee0" stroke-width="4"/>
    </g>
  </g>

  <!-- Far leg and arm -->
  <path d="M371 314Q342 355 341 385Q340 403 361 428"
        fill="none" stroke="#654630" stroke-width="31"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M387 242Q458 251 477 278L525 313"
        fill="none" stroke="#715037" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bicycle -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 452L353 336 390 452 230 452
             M353 336L515 344
             M390 452L531 388
             M515 344L531 388"
          stroke="#f16f58" stroke-width="11"/>
    <path d="M531 388L572 452"
          stroke="#e45d4d" stroke-width="12"/>
    <path d="M353 336L346 313"
          stroke="#526168" stroke-width="9"/>
    <path d="M515 344L505 310 542 307Q556 307 555 324"
          stroke="#526168" stroke-width="9"/>
    <path d="M531 307h17"
          stroke="#263d45" stroke-width="12"/>
  </g>
  <path d="M319 317Q349 310 380 317Q374 328 355 329h-25Q320 329 319 317Z"
        fill="#34484e"/>

  <!-- Crank and pedals -->
  <g fill="none" stroke="#40565b" stroke-linecap="round">
    <path d="M390 452L361 428M390 452L418 475"
          stroke-width="8"/>
    <path d="M347 428h28M402 479h39"
          stroke-width="9"/>
  </g>
  <circle cx="390" cy="452" r="13" fill="#eef1e3"
          stroke="#40565b" stroke-width="5"/>

  <!-- Near leg -->
  <path d="M390 315Q440 338 444 378L418 465"
        fill="none" stroke="#80593e" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="419" cy="466" rx="22" ry="13"
           transform="rotate(-18 419 466)" fill="#80593e"/>
  <g fill="none" stroke="#efe0bc" stroke-width="5"
     stroke-linecap="round">
    <path d="M423 468q5 7 12 9M415 471q3 8 9 11M407 470q1 7 6 11"/>
    <path d="M356 427q3 7 9 9M350 428q1 7 6 10"/>
  </g>

  <!-- Sloth's body -->
  <ellipse cx="371" cy="269" rx="72" ry="88"
           transform="rotate(-23 371 269)" fill="url(#fur)"/>
  <ellipse cx="385" cy="281" rx="44" ry="60"
           transform="rotate(-23 385 281)" fill="#c69c70"/>
  <g fill="none" stroke="#e0b68a" stroke-width="4"
     stroke-linecap="round" opacity=".7">
    <path d="M389 248q18 9 23 27M369 281q19 13 23 31M363 315q10 8 15 10"/>
  </g>

  <!-- Neck scarf -->
  <path d="M338 232Q355 230 370 242L356 259Q343 251 330 253Z"
        fill="#f4bb61"/>
  <path d="M341 241Q301 242 267 226L284 250Q306 262 340 252Z"
        fill="#e9a84e"/>
  <path d="M287 243l-13 4 9-15" fill="#f7cd7c"/>

  <!-- Head and ears -->
  <circle cx="260" cy="187" r="20" fill="#805a3e"/>
  <circle cx="365" cy="181" r="18" fill="#805a3e"/>
  <ellipse cx="312" cy="187" rx="68" ry="64"
           transform="rotate(-12 312 187)" fill="url(#fur)"/>
  <ellipse cx="315" cy="195" rx="52" ry="48"
           transform="rotate(-12 315 195)" fill="url(#face)"/>

  <!-- Eye markings and happy face -->
  <ellipse cx="292" cy="186" rx="19" ry="24"
           transform="rotate(24 292 186)" fill="#765641"/>
  <ellipse cx="338" cy="184" rx="19" ry="24"
           transform="rotate(-22 338 184)" fill="#765641"/>
  <g fill="#263b3e">
    <ellipse cx="298" cy="190" rx="5" ry="6"/>
    <ellipse cx="337" cy="188" rx="5" ry="6"/>
  </g>
  <g fill="#fff">
    <circle cx="300" cy="188" r="1.8"/>
    <circle cx="339" cy="186" r="1.8"/>
  </g>
  <path d="M309 208q9-7 18 0q-2 9-9 10q-7-1-9-10Z"
        fill="#493c36"/>
  <path d="M306 222q12 16 28-2"
        fill="none" stroke="#684838" stroke-width="3.5"
        stroke-linecap="round"/>
  <circle cx="279" cy="215" r="5" fill="#e9ae9c" opacity=".65"/>
  <circle cx="351" cy="209" r="5" fill="#e9ae9c" opacity=".65"/>

  <!-- Helmet -->
  <path d="M255 157Q258 111 305 105Q353 98 372 143L367 155
           Q326 138 259 168Z"
        fill="#4b9aaf"/>
  <path d="M259 158Q316 137 368 150"
        fill="none" stroke="#29687d" stroke-width="10"
        stroke-linecap="round"/>
  <path d="M294 116q-8 9-10 21M323 112q5 9 7 20"
        fill="none" stroke="#a8d9d9" stroke-width="5"
        stroke-linecap="round"/>
  <path d="M365 155q12 35-11 65"
        fill="none" stroke="#315d67" stroke-width="3"/>
  <circle cx="354" cy="221" r="4" fill="#315d67"/>

  <!-- Near arm and gripping claws -->
  <path d="M374 247Q408 267 435 286Q467 303 521 308"
        fill="none" stroke="#946947" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="524" cy="309" rx="19" ry="14"
           transform="rotate(-12 524 309)" fill="#946947"/>
  <g fill="none" stroke="#f4e4c4" stroke-width="5"
     stroke-linecap="round">
    <path d="M529 308q9 2 11 12M521 310q7 5 7 13M513 310q5 5 5 12"/>
  </g>
</svg>