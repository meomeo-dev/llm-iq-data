<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"
     role="img" aria-labelledby="title desc">
  <title id="title">A sloth riding a bicycle</title>
  <desc id="desc">A cheerful sloth pedals an orange bicycle along a sunny path.</desc>

  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a87951"/>
      <stop offset="1" stop-color="#765037"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f5dfb8"/>
      <stop offset="1" stop-color="#dfbd8d"/>
    </linearGradient>
    <linearGradient id="bike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f39a58"/>
      <stop offset="1" stop-color="#dd6542"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#f8f0dd"/>
  <circle cx="655" cy="115" r="54" fill="#f2c76f"/>
  <circle cx="655" cy="115" r="69" fill="#f2c76f" opacity=".16"/>

  <path d="M0 345 Q128 270 263 335 T530 326 T800 310 V600 H0Z"
        fill="#dce5c9"/>
  <path d="M0 385 Q170 330 350 382 T800 360 V600 H0Z" fill="#c3d5b2"/>
  <path d="M0 468 Q180 441 380 466 T800 450 V600 H0Z" fill="#a9c394"/>
  <path d="M0 514 Q190 496 402 517 T800 500" fill="none"
        stroke="#8eae7c" stroke-width="4" opacity=".55"/>

  <g fill="#78996b" opacity=".8">
    <path d="M72 354q-18-38-2-61 25 21 12 54 18-40 43-40-2 31-41 51z"/>
    <path d="M710 344q-18-34-4-57 25 19 14 50 17-35 39-37-2 29-38 48z"/>
    <path d="M119 408q-14-29-2-47 19 16 11 41 14-29 32-30-2 23-31 40z"/>
  </g>
  <g fill="none" stroke="#78996b" stroke-width="5" stroke-linecap="round">
    <path d="M108 391v35M742 378v47M151 420v26"/>
  </g>

  <ellipse cx="405" cy="489" rx="268" ry="22" fill="#556d4d" opacity=".18"/>

  <!-- Bicycle wheels -->
  <g fill="none" stroke-linecap="round">
    <g transform="translate(225 420)">
      <circle r="105" stroke="#294c49" stroke-width="15"/>
      <circle r="91" stroke="#f1c36d" stroke-width="3"/>
      <g stroke="#6f8a78" stroke-width="2" opacity=".8">
        <path d="M0 0V-91M0 0L64-64M0 0H91M0 0L64 64"/>
        <path d="M0 0V91M0 0L-64 64M0 0H-91M0 0L-64-64"/>
        <path d="M0 0L35-84M0 0L84-35M0 0L84 35M0 0L35 84"/>
        <path d="M0 0L-35 84M0 0L-84 35M0 0L-84-35M0 0L-35-84"/>
      </g>
      <circle r="8" fill="#e87948" stroke="#294c49" stroke-width="4"/>
    </g>
    <g transform="translate(585 420)">
      <circle r="105" stroke="#294c49" stroke-width="15"/>
      <circle r="91" stroke="#f1c36d" stroke-width="3"/>
      <g stroke="#6f8a78" stroke-width="2" opacity=".8">
        <path d="M0 0V-91M0 0L64-64M0 0H91M0 0L64 64"/>
        <path d="M0 0V91M0 0L-64 64M0 0H-91M0 0L-64-64"/>
        <path d="M0 0L35-84M0 0L84-35M0 0L84 35M0 0L35 84"/>
        <path d="M0 0L-35 84M0 0L-84 35M0 0L-84-35M0 0L-35-84"/>
      </g>
      <circle r="8" fill="#e87948" stroke="#294c49" stroke-width="4"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="url(#bike)" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M225 420L357 319L405 420L225 420"/>
    <path d="M357 319L500 310L405 420"/>
    <path d="M500 310L585 420"/>
    <path d="M357 319L369 291"/>
  </g>
  <path d="M225 420L405 420" fill="none" stroke="#8e5945"
        stroke-width="4" opacity=".65"/>
  <circle cx="405" cy="420" r="28" fill="#f8f0dd"
          stroke="#dd7048" stroke-width="7"/>
  <circle cx="405" cy="420" r="7" fill="#294c49"/>
  <path d="M225 420L405 420M405 420L357 319"
        fill="none" stroke="#6f5140" stroke-width="3" opacity=".55"/>

  <!-- Seat and handlebar stem -->
  <path d="M357 319L369 291" stroke="#294c49" stroke-width="8"
        stroke-linecap="round"/>
  <path d="M337 289Q359 281 382 288" fill="none" stroke="#294c49"
        stroke-width="12" stroke-linecap="round"/>
  <path d="M500 310L513 278L530 260" fill="none" stroke="#294c49"
        stroke-width="8" stroke-linecap="round"/>
  <path d="M514 262Q540 252 566 258" fill="none" stroke="#294c49"
        stroke-width="8" stroke-linecap="round"/>

  <!-- Sloth legs -->
  <path d="M376 269C350 294 351 322 370 344C385 361 401 375 407 394"
        fill="none" stroke="#654630" stroke-width="30" stroke-linecap="round"/>
  <path d="M376 269C350 294 351 322 370 344C385 361 401 375 407 394"
        fill="none" stroke="url(#fur)" stroke-width="23" stroke-linecap="round"/>
  <path d="M406 270C434 294 437 319 426 345C416 368 410 392 414 439"
        fill="none" stroke="#654630" stroke-width="29" stroke-linecap="round"/>
  <path d="M406 270C434 294 437 319 426 345C416 368 410 392 414 439"
        fill="none" stroke="url(#fur)" stroke-width="22" stroke-linecap="round"/>

  <path d="M398 389Q409 382 421 388L429 399Q418 407 404 402Z"
        fill="#d4ac78" stroke="#654630" stroke-width="4"/>
  <path d="M405 434Q416 429 426 435L433 447Q422 454 410 448Z"
        fill="#d4ac78" stroke="#654630" stroke-width="4"/>

  <!-- Sloth body -->
  <path d="M373 204
           Q394 188 421 203
           Q447 219 444 256
           Q442 290 424 310
           Q402 329 372 308
           Q349 290 353 257
           Q355 226 373 204Z"
        fill="url(#fur)" stroke="#654630" stroke-width="6"/>
  <path d="M378 229Q394 218 417 226Q433 238 431 264
           Q426 286 404 296Q379 289 370 270Q367 246 378 229Z"
        fill="#bc9066" opacity=".75"/>
  <g fill="none" stroke="#d3aa7c" stroke-width="3" stroke-linecap="round"
     opacity=".8">
    <path d="M365 244l-8 8M365 259l-9 7M370 279l-7 8"/>
    <path d="M435 238l8 7M439 256l8 5M432 281l8 7"/>
    <path d="M383 300l-3 9M399 304v9M416 299l4 9"/>
  </g>

  <!-- Long arms reaching to the handlebars -->
  <path d="M374 218C390 232 427 236 462 250C486 260 505 267 527 265"
        fill="none" stroke="#654630" stroke-width="23" stroke-linecap="round"/>
  <path d="M374 218C390 232 427 236 462 250C486 260 505 267 527 265"
        fill="none" stroke="url(#fur)" stroke-width="16" stroke-linecap="round"/>
  <path d="M425 216C446 226 468 225 490 237C514 249 535 260 556 261"
        fill="none" stroke="#654630" stroke-width="22" stroke-linecap="round"/>
  <path d="M425 216C446 226 468 225 490 237C514 249 535 260 556 261"
        fill="none" stroke="url(#fur)" stroke-width="15" stroke-linecap="round"/>

  <!-- Sloth head and face -->
  <ellipse cx="400" cy="158" rx="46" ry="51" fill="url(#fur)"
           stroke="#654630" stroke-width="6"/>
  <ellipse cx="365" cy="161" rx="11" ry="14" fill="#8b6244"/>
  <ellipse cx="435" cy="160" rx="10" ry="13" fill="#8b6244"/>
  <path d="M374 145Q383 126 402 127Q422 127 430 147
           Q431 173 415 187Q400 199 384 185Q370 171 374 145Z"
        fill="url(#face)"/>
  <path d="M379 151Q386 139 395 145Q399 152 395 163
           Q388 168 381 162Z" fill="#6b4937"/>
  <path d="M406 145Q416 139 422 150Q423 160 416 165
           Q407 165 404 158Z" fill="#6b4937"/>
  <ellipse cx="389" cy="154" rx="3.5" ry="4.5" fill="#242d2a"/>
  <ellipse cx="414" cy="154" rx="3.5" ry="4.5" fill="#242d2a"/>
  <ellipse cx="389" cy="153" rx="1.2" ry="1.5" fill="#fff4dc"/>
  <ellipse cx="414" cy="153" rx="1.2" ry="1.5" fill="#fff4dc"/>
  <path d="M395 166Q401 160 407 166Q406 173 401 174Q396 173 395 166Z"
        fill="#45352d"/>
  <path d="M401 174Q399 180 394 181M401 174Q404 180 409 180"
        fill="none" stroke="#76533c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M369 144q-7 5-7 12M432 143q7 5 7 12"
        fill="none" stroke="#d7b48b" stroke-width="3" stroke-linecap="round"/>

  <!-- Hands curled around the grips -->
  <g fill="#b1845d" stroke="#654630" stroke-width="3">
    <ellipse cx="528" cy="264" rx="10" ry="8"/>
    <ellipse cx="557" cy="261" rx="10" ry="8"/>
  </g>
  <g fill="none" stroke="#f0d0a0" stroke-width="2.5" stroke-linecap="round">
    <path d="M523 260l-2-5M529 259l-1-6M534 260l1-5"/>
    <path d="M552 258l-2-5M558 257l-1-5M563 258l2-4"/>
  </g>

  <!-- Crank and pedals -->
  <path d="M405 420L405 385M405 420L405 455"
        fill="none" stroke="#294c49" stroke-width="7" stroke-linecap="round"/>
  <path d="M390 383h30M390 453h30" stroke="#294c49"
        stroke-width="7" stroke-linecap="round"/>
  <circle cx="405" cy="420" r="9" fill="#f1c36d" stroke="#294c49"
          stroke-width="4"/>

  <!-- Small frame highlights -->
  <path d="M238 411L351 324M413 411L493 314"
        fill="none" stroke="#ffc27d" stroke-width="3"
        stroke-linecap="round" opacity=".8"/>
</svg>