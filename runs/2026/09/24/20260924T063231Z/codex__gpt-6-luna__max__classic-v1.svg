<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican pedals a teal bicycle beneath a warm sun.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f4e9"/>
      <stop offset="1" stop-color="#e9f0e7"/>
    </linearGradient>
  </defs>

  <rect width="840" height="560" fill="url(#sky)"/>
  <circle cx="706" cy="93" r="39" fill="#f5c76c"/>
  <path d="M0 520 H840" stroke="#b6c7b9" stroke-width="3"/>
  <ellipse cx="426" cy="515" rx="260" ry="13" fill="#d6ded2"/>

  <!-- Bicycle wheels -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#aab8b7" stroke-width="2">
      <path d="M230 420L230 320M230 420L280 333M230 420L317 370M230 420L330 420
        M230 420L317 470M230 420L280 507M230 420L230 520M230 420L180 507
        M230 420L143 470M230 420L130 420M230 420L143 370M230 420L180 333"/>
      <path d="M620 420L620 320M620 420L670 333M620 420L707 370M620 420L720 420
        M620 420L707 470M620 420L670 507M620 420L620 520M620 420L570 507
        M620 420L533 470M620 420L520 420M620 420L533 370M620 420L570 333"/>
    </g>
    <g stroke="#263a40">
      <circle cx="230" cy="420" r="100" stroke-width="11"/>
      <circle cx="620" cy="420" r="100" stroke-width="11"/>
      <circle cx="230" cy="420" r="89" stroke="#718681" stroke-width="2"/>
      <circle cx="620" cy="420" r="89" stroke="#718681" stroke-width="2"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#187c78" stroke-width="9" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M230 420L363 290L410 420L230 420"/>
    <path d="M363 290L545 290L410 420"/>
    <path d="M545 290L620 420"/>
  </g>

  <g fill="none" stroke="#263a40" stroke-width="7" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M363 290L347 252"/>
    <path d="M545 290L557 247L578 231"/>
    <path d="M557 247L600 247"/>
    <path d="M578 231Q594 226 600 247"/>
  </g>

  <path d="M326 249Q349 239 383 247L387 256Q352 261 329 257Z"
        fill="#34464b"/>
  <path d="M410 420L446 384M410 420L374 456"
        fill="none" stroke="#263a40" stroke-width="7" stroke-linecap="round"/>
  <circle cx="410" cy="420" r="13" fill="#f2b64e" stroke="#263a40" stroke-width="5"/>
  <path d="M438 379L456 397M366 449L384 467"
        fill="none" stroke="#263a40" stroke-width="6" stroke-linecap="round"/>

  <g fill="#263a40">
    <circle cx="230" cy="420" r="8"/>
    <circle cx="620" cy="420" r="8"/>
  </g>

  <!-- Pelican legs and feet -->
  <g fill="none" stroke="#dc873b" stroke-width="7" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M418 239L426 309L446 382"/>
    <path d="M386 239L400 315L374 453"/>
  </g>
  <g fill="#dc873b" stroke="#263a40" stroke-width="3" stroke-linejoin="round">
    <path d="M444 379Q451 376 457 383L465 389L451 392L441 388Z"/>
    <path d="M372 449Q379 446 384 452L392 462L377 462L369 457Z"/>
  </g>
  <path d="M450 386L456 393M377 455L384 463"
        fill="none" stroke="#f6cf79" stroke-width="2" stroke-linecap="round"/>

  <!-- Pelican neck and tail -->
  <path d="M437 199Q449 160 452 139Q456 116 476 108Q493 103 503 119
    Q483 133 484 158Q486 185 461 211Z"
        fill="#f7f0df" stroke="#263a40" stroke-width="5" stroke-linejoin="round"/>
  <path d="M322 192L285 176Q295 198 282 219L324 220Z"
        fill="#647b7c" stroke="#263a40" stroke-width="5" stroke-linejoin="round"/>

  <!-- Body and wing -->
  <ellipse cx="394" cy="198" rx="92" ry="59"
           fill="#f7f0df" stroke="#263a40" stroke-width="5"/>
  <path d="M326 190Q369 145 423 165Q446 174 457 199
    Q432 232 382 233Q348 229 326 211Z"
        fill="#718789" stroke="#263a40" stroke-width="4" stroke-linejoin="round"/>
  <path d="M352 205Q382 221 420 211M365 184Q395 199 430 190"
        fill="none" stroke="#a9b8b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M310 193Q295 200 289 211"
        fill="none" stroke="#d8d1bf" stroke-width="3" stroke-linecap="round"/>

  <!-- Head and bill -->
  <circle cx="480" cy="111" r="23" fill="#f7f0df"
          stroke="#263a40" stroke-width="5"/>
  <path d="M497 107Q554 99 649 117Q608 129 528 128
    Q540 142 568 150Q542 158 514 132Z"
        fill="#e9a143" stroke="#263a40" stroke-width="4" stroke-linejoin="round"/>
  <path d="M505 111Q566 106 632 117"
        fill="none" stroke="#f7cb70" stroke-width="3" stroke-linecap="round"/>
  <circle cx="486" cy="105" r="4.5" fill="#263a40"/>
  <circle cx="487" cy="104" r="1.5" fill="#fff9ed"/>
</svg>