<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">A sloth riding a bicycle</title>
  <desc id="desc">A smiling brown sloth pedals a teal bicycle beneath a warm sun, with a leafy basket on the handlebars.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#edf7ee"/>
      <stop offset="1" stop-color="#fff8e8"/>
    </linearGradient>
    <linearGradient id="fur" x2="1" y2="1">
      <stop stop-color="#b89470"/>
      <stop offset="1" stop-color="#8b674e"/>
    </linearGradient>
    <pattern id="weave" width="14" height="12" patternUnits="userSpaceOnUse">
      <rect width="14" height="12" fill="#d9ac73"/>
      <path d="M0 6h14M7 0v12" fill="none" stroke="#b88751" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" rx="32" fill="url(#sky)"/>
  <circle cx="652" cy="112" r="49" fill="#f7d985"/>
  <g fill="#fff" opacity=".8">
    <path d="M91 118a24 24 0 0 1 45-12 32 32 0 0 1 61 11 19 19 0 0 1-1 38H95a19 19 0 0 1-4-37Z"/>
    <path d="M475 78a18 18 0 0 1 34-9 24 24 0 0 1 46 8 14 14 0 0 1-1 28h-77a14 14 0 0 1-2-27Z"/>
  </g>

  <path d="M0 437Q139 382 277 439T544 428T800 432V600H0Z" fill="#d9e8c9"/>
  <path d="M0 493Q171 461 371 491T800 475V600H0Z" fill="#c3d8ad"/>
  <path d="M0 528Q356 497 800 526" fill="none" stroke="#f3e7c9" stroke-width="53"/>
  <ellipse cx="397" cy="503" rx="260" ry="16" fill="#658a6a" opacity=".16"/>

  <!-- Wheels and spokes -->
  <g fill="#fffdf5" stroke="#354d49" stroke-width="12">
    <circle cx="228" cy="407" r="94"/>
    <circle cx="551" cy="407" r="94"/>
  </g>
  <g fill="none" stroke="#b7c9bd" stroke-width="2.5">
    <circle cx="228" cy="407" r="81"/>
    <circle cx="551" cy="407" r="81"/>
    <path d="M228 326v162m-81-81h162m-138-57 114 114m-114 0 114-114
             M551 326v162m-81-81h162m-138-57 114 114m-114 0 114-114"/>
  </g>

  <!-- Far leg and pedal -->
  <path d="M346 273Q411 302 421 342L397 373" fill="none" stroke="#73553f" stroke-width="33" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M372 410l29-39" stroke="#64766b" stroke-width="7"/>
  <path d="M384 373h32" stroke="#354d49" stroke-width="8" stroke-linecap="round"/>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M228 407 316 290 372 410 228 407 488 301 372 410" stroke="#258d86" stroke-width="12"/>
    <path d="m488 301 63 106M480 277l8 24M316 290l-9-27" stroke="#258d86" stroke-width="12"/>
    <path d="m480 279-13-40 29-11" stroke="#526c62" stroke-width="9"/>
    <path d="m492 229 22-5" stroke="#354d49" stroke-width="12"/>
    <path d="M279 264h58" stroke="#354d49" stroke-width="14"/>
    <path d="M489 251q50 15 36 64" stroke="#526c62" stroke-width="2.5"/>
    <path d="M228 407h144" stroke="#496c61" stroke-width="4"/>
  </g>
  <g fill="#f6ce75" stroke="#354d49" stroke-width="4">
    <circle cx="228" cy="407" r="8"/>
    <circle cx="551" cy="407" r="8"/>
    <circle cx="372" cy="410" r="19"/>
  </g>

  <!-- Sloth's body -->
  <path d="M304 171C347 157 373 190 380 229c8 39-12 67-44 66-35-1-68-33-69-66-1-26 13-47 37-58Z" fill="url(#fur)" stroke="#73543f" stroke-width="4"/>
  <path d="M316 202c31-10 49 21 47 46-1 22-17 33-36 22-21-13-29-53-11-68Z" fill="#c7ab86"/>

  <!-- Arm reaching to the handlebars -->
  <path d="M339 194Q376 235 415 242L481 238" fill="none" stroke="#73543f" stroke-width="32" stroke-linecap="round"/>
  <path d="M339 191Q375 230 415 237L480 234" fill="none" stroke="#a78360" stroke-width="25" stroke-linecap="round"/>
  <g fill="none" stroke="#f4e6cb" stroke-width="5" stroke-linecap="round">
    <path d="M474 230q14 3 11 14"/>
    <path d="M481 228q14 3 11 14"/>
    <path d="M488 227q13 3 10 13"/>
  </g>

  <!-- Near leg resting on the low pedal -->
  <path d="M326 276Q296 314 330 352L386 429" fill="none" stroke="#73543f" stroke-width="37" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M328 276Q302 315 336 350L391 426" fill="none" stroke="#ad8965" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m372 410 29 32" stroke="#526c62" stroke-width="7"/>
  <path d="M384 443h40" stroke="#354d49" stroke-width="9" stroke-linecap="round"/>
  <path d="M385 426q11 9 24 7" fill="none" stroke="#ad8965" stroke-width="20" stroke-linecap="round"/>
  <g fill="none" stroke="#f4e6cb" stroke-width="4" stroke-linecap="round">
    <path d="m402 430 8 9m-1-11 8 9m-1-12 7 8"/>
  </g>

  <!-- Round head and facial mask -->
  <path d="M250 116q3-19 19-21l-2 13q17-20 36-14l-9 11c40-2 67 25 65 57-2 36-33 60-68 54-36-6-62-33-58-64 2-16 7-28 17-36Z" fill="url(#fur)" stroke="#73543f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M248 150c7-26 31-29 47-13 16-17 43-8 49 15 8 29-16 53-48 53-33-1-56-28-48-55Z" fill="#eee0bf"/>
  <path d="M251 151q16-17 36 4l-21 27q-21-9-15-31Z" fill="#755640"/>
  <path d="M307 155q21-21 35-1 6 23-16 30Z" fill="#755640"/>
  <g fill="none" stroke="#2f3931" stroke-width="4.5" stroke-linecap="round">
    <path d="M260 159q7-7 14 1"/>
    <path d="M317 160q7-7 14 1"/>
    <path d="M282 183q13 13 27 0"/>
  </g>
  <ellipse cx="296" cy="173" rx="10" ry="7" fill="#354039"/>
  <ellipse cx="293" cy="171" rx="3" ry="2" fill="#fff" opacity=".45"/>
  <g fill="#d8997b" opacity=".6">
    <ellipse cx="265" cy="179" rx="7" ry="4"/>
    <ellipse cx="326" cy="180" rx="7" ry="4"/>
  </g>

  <!-- Basket full of greenery -->
  <g fill="none" stroke="#5b8550" stroke-width="4" stroke-linecap="round">
    <path d="M564 284q-15-39 8-67"/>
    <path d="M563 279q26-26 35-41"/>
    <path d="M558 279q-25-20-31-43"/>
  </g>
  <g fill="#78a361">
    <path d="M565 249q-26-5-18-26 22 3 18 26Z"/>
    <path d="M567 232q-4-23 18-24 7 21-18 24Z"/>
    <path d="M579 263q-3-25 21-25 3 22-21 25Z"/>
    <path d="M544 262q-27 0-25-23 24-3 25 23Z"/>
  </g>
  <path d="M519 277h91l-12 58h-66Z" fill="url(#weave)" stroke="#9d754b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M517 277h95" stroke="#e6bf8d" stroke-width="9" stroke-linecap="round"/>
  <path d="M530 287h68" stroke="#f5d8ac" stroke-width="3" opacity=".7"/>

  <!-- Small roadside flowers -->
  <g stroke="#6b945d" stroke-width="3" fill="none">
    <path d="M106 493v-28m0 16-10-7m588 41v-26m0 14 10-8M703 474v-23"/>
  </g>
  <g fill="#fff4d7">
    <circle cx="106" cy="461" r="9"/>
    <circle cx="694" cy="486" r="8"/>
    <circle cx="703" cy="447" r="8"/>
  </g>
  <g fill="#deb05c">
    <circle cx="106" cy="461" r="3"/>
    <circle cx="694" cy="486" r="3"/>
    <circle cx="703" cy="447" r="3"/>
  </g>
</svg>