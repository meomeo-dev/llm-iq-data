<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"
     viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">
    A cheerful white pelican with a long orange bill pedals a teal bicycle
    along a sunny seaside path.
  </desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#e4f5f3"/>
      <stop offset="1" stop-color="#fff8e7"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffcb70"/>
      <stop offset="1" stop-color="#f39a54"/>
    </linearGradient>
  </defs>

  <!-- Seaside afternoon -->
  <rect width="800" height="600" rx="28" fill="url(#sky)"/>
  <circle cx="657" cy="105" r="48" fill="#f9d880"/>
  <g fill="#fff" opacity=".8">
    <path d="M75 139a23 23 0 0 1 40-15 30 30 0 0 1 56 15Z"/>
    <path d="M525 73a17 17 0 0 1 30-10 22 22 0 0 1 41 10Z"/>
  </g>
  <path d="M0 376Q110 364 220 377T440 375T660 377T880 373V474H0Z"
        fill="#a8d9d3"/>
  <g fill="none" stroke="#e6f6ed" stroke-width="3" stroke-linecap="round">
    <path d="M39 403h65m29 14h39m451-22h70m-4 33h47"/>
    <path d="M295 393h55m-322 40h47m638-51h42"/>
  </g>
  <path d="M0 463Q190 447 400 464T800 460V600H0Z" fill="#eddbb5"/>
  <path d="M0 540Q235 514 448 533T800 527" fill="none"
        stroke="#dfc89e" stroke-width="3"/>
  <ellipse cx="406" cy="525" rx="294" ry="17" fill="#c9b78e" opacity=".35"/>

  <!-- Wheels and spokes -->
  <g fill="#f5f5e9" fill-opacity=".45" stroke="#263f46" stroke-width="10">
    <circle cx="235" cy="425" r="94"/>
    <circle cx="574" cy="425" r="94"/>
  </g>
  <g fill="none" stroke="#f8edd8" stroke-width="3">
    <circle cx="235" cy="425" r="85"/>
    <circle cx="574" cy="425" r="85"/>
  </g>
  <g stroke="#769b9b" stroke-width="2" opacity=".8">
    <path d="M235 340v170m-85-85h170m-145-60 120 120m-120 0 120-120"/>
    <path d="m202 347 66 156m-111-111 156 66m-156 0 156-66m-111 111 66-156"/>
    <path d="M574 340v170m-85-85h170m-145-60 120 120m-120 0 120-120"/>
    <path d="m541 347 66 156m-111-111 156 66m-156 0 156-66m-111 111 66-156"/>
  </g>

  <!-- Far leg and pedal -->
  <g stroke="#704c35" stroke-width="4" stroke-linejoin="round">
    <path d="M338 303 322 353 356 405" fill="none"
          stroke="#e6a34e" stroke-width="13" stroke-linecap="round"/>
    <path d="m352 399 28 8-6 12-36-4Z" fill="#efae50"/>
  </g>
  <path d="M350 420h36" stroke="#263f46" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m235 425 108-112 58 112H235l94-93h193L401 425"
          stroke="#176d72" stroke-width="12"/>
    <path d="m235 425 108-112 58 112m-72-93h193"
          stroke="#46b7ac" stroke-width="5"/>
    <path d="m574 425-57-123-7-25" stroke="#176d72" stroke-width="12"/>
    <path d="m574 425-57-123" stroke="#46b7ac" stroke-width="5"/>
    <path d="m343 313-9-24" stroke="#526c6e" stroke-width="8"/>
    <path d="m510 279 26-22h24q16 0 16 15"
          stroke="#526c6e" stroke-width="8"/>
    <path d="M549 257h15q12 0 12 15" stroke="#263f46" stroke-width="10"/>
  </g>
  <path d="M307 284q24-10 55-1 10 4 2 13h-52q-13-3-5-12Z"
        fill="#88573d" stroke="#263f46" stroke-width="4"/>
  <g fill="#e8d9b8" stroke="#263f46" stroke-width="4">
    <circle cx="235" cy="425" r="8"/>
    <circle cx="574" cy="425" r="8"/>
    <circle cx="401" cy="425" r="23"/>
  </g>
  <circle cx="401" cy="425" r="14" fill="#4c9995"/>
  <path d="m365 416 36 9 42-24" fill="none" stroke="#263f46"
        stroke-width="6" stroke-linecap="round"/>

  <!-- Pelican tail, body, and rising neck -->
  <g stroke="#344c51" stroke-width="4" stroke-linejoin="round">
    <path d="m291 244-55-29 20 43-31-4 54 36Z" fill="#dae7df"/>
    <path d="M278 242
             C303 212 357 211 384 232
             C405 220 405 193 397 168
             C383 129 408 99 438 102
             C474 105 485 142 464 169
             C448 191 452 222 438 252
             C425 286 390 306 347 309
             C304 312 266 290 269 261
             Q270 250 278 242Z"
          fill="#fffdf0"/>
    <path d="M278 274q54 41 120 1-18 36-63 33-37-2-57-34Z"
          fill="#e0e9de" stroke="none"/>
  </g>

  <!-- Near leg bends down to the forward pedal -->
  <path d="M368 299 408 343 429 393" fill="none"
        stroke="#704c35" stroke-width="16" stroke-linecap="round"
        stroke-linejoin="round"/>
  <path d="M368 299 408 343 429 393" fill="none"
        stroke="#f1b45b" stroke-width="10" stroke-linecap="round"
        stroke-linejoin="round"/>
  <path d="M423 386q13 2 23 9l17 3-7 10h-37q-7-8 4-22Z"
        fill="#f4b555" stroke="#704c35" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M426 410h39" stroke="#263f46" stroke-width="8"
        stroke-linecap="round"/>

  <!-- A wing reaches the handlebars -->
  <path d="M307 241
           C329 218 362 232 387 247
           Q438 278 524 258
           Q532 265 522 274
           C467 303 413 292 366 276
           Q329 281 307 260"
        fill="#eef2e7" stroke="#344c51" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#a4bcb4" stroke-width="3" stroke-linecap="round">
    <path d="M327 250q48 31 110 31"/>
    <path d="M335 239q37 28 67 31"/>
    <path d="m491 269 25-4"/>
  </g>

  <!-- Long bill and generous throat pouch -->
  <path d="M456 148 631 157
           Q581 177 526 202
           Q492 218 464 181Z"
        fill="url(#pouch)" stroke="#344c51" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M453 138q78 0 178 19-77 11-177 1Z"
        fill="#f8bd50" stroke="#344c51" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M479 170q11 23 35 22" fill="none"
        stroke="#d98447" stroke-width="3" stroke-linecap="round"/>

  <!-- Bright eye and wind-tossed crest -->
  <circle cx="443" cy="131" r="12" fill="#f4d775"/>
  <circle cx="446" cy="130" r="6" fill="#263f46"/>
  <circle cx="448" cy="128" r="2" fill="#fff"/>
  <path d="M428 102q-14-18-26-11m29 11q-5-20-16-22"
        fill="none" stroke="#344c51" stroke-width="4"
        stroke-linecap="round"/>
  <path d="M419 154q-7 29 8 44" fill="none"
        stroke="#b6c9be" stroke-width="3" stroke-linecap="round"/>

  <!-- Motion and roadside details -->
  <g fill="none" stroke="#75aaa5" stroke-width="4" stroke-linecap="round">
    <path d="M168 280h58m-78 18h44m-42 48h30"/>
  </g>
  <g fill="none" stroke="#8eab79" stroke-width="3" stroke-linecap="round">
    <path d="m81 505-5-22m5 22 10-16m631 21-3-24m3 24 13-18"/>
  </g>
  <g fill="#c9b48d">
    <ellipse cx="119" cy="545" rx="6" ry="3"/>
    <ellipse cx="667" cy="558" rx="8" ry="3"/>
    <ellipse cx="493" cy="551" rx="4" ry="2"/>
  </g>
</svg>