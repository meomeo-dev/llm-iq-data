<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700"
     viewBox="0 0 800 700" role="img" aria-labelledby="title desc">
  <title id="title">A sloth riding a bicycle</title>
  <desc id="desc">
    A cheerful, shaggy brown sloth pedals a coral bicycle along a sunny path,
    with long arms reaching the handlebars and three curved claws on each paw.
  </desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#e3f3e9"/>
      <stop offset="1" stop-color="#f7f4dc"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b99a73"/>
      <stop offset="1" stop-color="#80644d"/>
    </linearGradient>
    <linearGradient id="face" x2="0" y2="1">
      <stop stop-color="#f5e9cb"/>
      <stop offset="1" stop-color="#e4cda5"/>
    </linearGradient>
    <g id="wheel">
      <circle r="101" fill="#fffdf3" stroke="#344d4c" stroke-width="13"/>
      <circle r="90" fill="none" stroke="#b4c4b9" stroke-width="3"/>
      <g stroke="#b4c4b9" stroke-width="2">
        <path d="M-89 0H89 M0-89V89"/>
        <path d="M-63-63L63 63 M-63 63L63-63"/>
        <path d="M-82-34L82 34 M-82 34L82-34"/>
        <path d="M-34-82L34 82 M-34 82L34-82"/>
      </g>
      <circle r="11" fill="#f5e7c9" stroke="#344d4c" stroke-width="5"/>
    </g>
  </defs>

  <!-- A quiet afternoon. -->
  <rect width="800" height="700" fill="#fcf8ec"/>
  <rect x="55" y="49" width="690" height="587" rx="180" fill="url(#sky)"/>
  <circle cx="614" cy="175" r="66" fill="#f5d283"/>
  <g fill="#ffffff" opacity=".68">
    <path d="M130 197c-8-20 15-37 31-25 6-27 45-27 53-3
             21-8 37 11 31 28Z"/>
    <path d="M535 104c-3-13 12-23 24-16 10-19 36-15 40 4
             16-5 29 7 25 18h-89Z"/>
  </g>
  <path d="M64 480Q178 418 282 474T500 466T737 473V558H64Z"
        fill="#b9d5b7" opacity=".55"/>
  <path d="M62 566Q303 538 742 567" fill="none"
        stroke="#e7d8b8" stroke-width="33" stroke-linecap="round"/>
  <ellipse cx="411" cy="633" rx="285" ry="16" fill="#d7d5bc" opacity=".55"/>

  <!-- Roadside leaves. -->
  <g stroke="#729979" stroke-width="4" stroke-linecap="round">
    <path d="M97 583l-9-65m10 45 20-30M698 591l16-73" fill="none"/>
    <path d="M90 543c-26-4-29-22-25-31 20 3 28 14 25 31"
          fill="#94b58a" stroke="none"/>
    <path d="M102 557c-1-21 13-32 27-30-1 18-9 27-27 30"
          fill="#7ea682" stroke="none"/>
    <path d="M710 544c-18-8-22-24-17-35 18 5 24 19 17 35"
          fill="#94b58a" stroke="none"/>
    <path d="M712 553c23-2 35-16 34-28-20-1-33 12-34 28"
          fill="#7ea682" stroke="none"/>
  </g>

  <!-- Wheels and bicycle frame. -->
  <use href="#wheel" x="227" y="523"/>
  <use href="#wheel" x="593" y="523"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M227 523L350 421L407 523Z"
          stroke="#a24c42" stroke-width="12"/>
    <path d="M350 421L530 415L407 523"
          stroke="#e87960" stroke-width="12"/>
    <path d="M407 523L350 421" stroke="#ed8d72" stroke-width="12"/>
    <path d="M530 415L593 523" stroke="#e87960" stroke-width="12"/>
    <path d="M530 415L516 373L556 356"
          stroke="#58716b" stroke-width="9"/>
    <path d="M548 358L576 351Q590 350 592 364"
          stroke="#344d4c" stroke-width="12"/>
    <path d="M350 421L341 399" stroke="#58716b" stroke-width="9"/>
    <path d="M314 396Q339 386 371 397" stroke="#344d4c" stroke-width="15"/>
    <path d="M228 523L407 510Q428 513 424 529Q420 540 406 538L228 530Z"
          stroke="#79877a" stroke-width="3"/>
  </g>

  <!-- Far arm and leg. -->
  <path d="M418 310Q444 355 480 379Q511 393 554 365"
        fill="none" stroke="#785e49" stroke-width="30"
        stroke-linecap="round"/>
  <path d="M350 378Q329 427 367 468Q384 493 379 543"
        fill="none" stroke="#785e49" stroke-width="38"
        stroke-linecap="round"/>
  <path d="M372 543q11 12 29 4"
        fill="none" stroke="#785e49" stroke-width="21"
        stroke-linecap="round"/>

  <!-- The sloth's rounded, shaggy body. -->
  <path d="M339 399
           Q309 386 306 353
           L300 343L311 341
           Q304 311 319 283
           L320 268L332 273
           Q346 247 377 245
           L389 235L392 247
           Q427 248 445 274
           Q463 302 444 341
           Q426 378 382 397
           Q359 407 339 399Z"
        fill="url(#fur)" stroke="#715944" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M353 293Q323 333 343 372Q372 389 408 350Q429 323 413 298
           Q389 277 353 293Z"
        fill="#c3a881" opacity=".72"/>

  <!-- Near leg bends toward the forward pedal. -->
  <path d="M367 377Q387 401 433 426Q450 438 433 462L421 482"
        fill="none" stroke="#715944" stroke-width="43"
        stroke-linecap="round"/>
  <path d="M367 375Q387 400 432 426Q447 438 430 460L420 479"
        fill="none" stroke="#a88965" stroke-width="34"
        stroke-linecap="round"/>
  <path d="M417 482Q433 492 449 486"
        fill="none" stroke="#a88965" stroke-width="23"
        stroke-linecap="round"/>

  <!-- Long, relaxed arm reaching the handlebar. -->
  <path d="M415 290Q437 317 465 340Q499 369 558 361"
        fill="none" stroke="#715944" stroke-width="39"
        stroke-linecap="round"/>
  <path d="M415 288Q437 315 465 338Q499 366 559 358"
        fill="none" stroke="#b2946e" stroke-width="31"
        stroke-linecap="round"/>
  <g fill="none" stroke="#eaddbf" stroke-width="5" stroke-linecap="round">
    <path d="M553 356q12 8 6 20"/>
    <path d="M562 354q12 8 6 20"/>
    <path d="M571 352q12 8 6 19"/>
  </g>

  <!-- Little ears behind the face. -->
  <ellipse cx="405" cy="230" rx="19" ry="24" fill="#917153"/>
  <ellipse cx="508" cy="242" rx="18" ry="23" fill="#917153"/>

  <!-- A softly tilted head and characteristic eye patches. -->
  <g transform="rotate(10 457 245)">
    <path d="M393 250Q385 215 407 190
             L412 179L423 185
             L438 172L442 182
             Q478 173 504 195
             L516 196L513 208
             Q531 235 516 265
             Q501 294 462 298
             Q414 299 393 267Z"
          fill="url(#fur)" stroke="#715944" stroke-width="4"
          stroke-linejoin="round"/>
    <path d="M407 228Q411 198 440 204Q455 212 466 204
             Q495 195 507 224Q519 250 496 273
             Q480 287 457 284Q421 284 410 262Q402 247 407 228Z"
          fill="url(#face)"/>
    <path d="M440 221Q420 210 407 231Q408 248 417 258
             Q428 248 445 238Q452 228 440 221Z"
          fill="#695344"/>
    <path d="M477 221Q496 210 509 231Q511 245 502 257
             Q489 247 474 237Q466 227 477 221Z"
          fill="#695344"/>
    <g fill="none" stroke="#2e3731" stroke-width="4.5"
       stroke-linecap="round">
      <path d="M420 233q8-8 16 0"/>
      <path d="M481 233q8-8 16 0"/>
      <path d="M442 258q16 18 33-1"/>
    </g>
    <path d="M448 241Q457 236 467 242Q470 248 459 253Q449 252 448 241Z"
          fill="#34403a"/>
    <ellipse cx="427" cy="253" rx="9" ry="5" fill="#d79c81" opacity=".7"/>
    <ellipse cx="492" cy="252" rx="9" ry="5" fill="#d79c81" opacity=".7"/>
  </g>

  <!-- Fur marks and the pedals beneath the paws. -->
  <g fill="none" stroke="#dac19a" stroke-width="3"
     stroke-linecap="round" opacity=".65">
    <path d="M328 300l-4 13m17-29-5 14m-12 36 2 12"/>
    <path d="M352 355l5 10m16-15 5 10m-25-97 9-4"/>
    <path d="M456 326l7 8m12 9 8 5m-95 64 9 5"/>
  </g>
  <g stroke="#344d4c" stroke-linecap="round">
    <circle cx="407" cy="523" r="20" fill="#f4dfb9" stroke-width="5"/>
    <circle cx="407" cy="523" r="6" fill="#344d4c" stroke="none"/>
    <path d="M407 523L441 493M407 523L380 549"
          fill="none" stroke-width="6"/>
    <path d="M427 496h30M367 553h28" stroke-width="7"/>
  </g>
  <g fill="none" stroke="#f2e4c7" stroke-width="4.5"
     stroke-linecap="round">
    <path d="M434 483q7 4 5 11m2-13q8 5 6 13m2-15q8 5 6 13"/>
    <path d="M384 544q5 3 4 8m4-9q5 3 4 8"/>
  </g>

  <!-- A butterfly keeps the same leisurely pace. -->
  <path d="M632 289Q607 261 618 250Q633 243 640 278
           Q649 249 662 259Q673 273 642 289Z"
        fill="#e9ab67"/>
  <path d="M637 278l5 18" stroke="#725f46" stroke-width="3"
        stroke-linecap="round"/>
  <path d="M657 317q28 15 28-10t29-26"
        fill="none" stroke="#9db49c" stroke-width="2"
        stroke-dasharray="3 8" stroke-linecap="round"/>
</svg>