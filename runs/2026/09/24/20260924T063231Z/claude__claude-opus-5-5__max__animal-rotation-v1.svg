      <stop offset="1" stop-color="#FFF3B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sb-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6D2A6"/>
      <stop offset="1" stop-color="#CFB27E"/>
