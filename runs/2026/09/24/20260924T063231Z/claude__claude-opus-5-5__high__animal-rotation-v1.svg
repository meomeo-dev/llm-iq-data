<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#a8876a"/>
      <stop offset="1" stop-color="#7a5c43"/>
    </radialGradient>
    <g id="spokes">
      <line x1="0" y1="-62" x2="0" y2="62"/>
      <line x1="0" y1="-62" x2="0" y2="62" transform="rotate(30)"/>
      <line x1="0" y1="-62" x2="0" y2="62" transform="rotate(60)"/>
      <line x1="0" y1="-62" x2="0" y2="62" transform="rotate(90)"/>
      <line x1="0" y1="-62" x2="0" y2="62" transform="rotate(120)"/>
      <line x1="0" y1="-62" x2="0" y2="62" transform="rotate(150)"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#sky)"/>
  <circle cx="520" cy="70" r="38" fill="#ffe27a"/>
  <ellipse cx="120" cy="70" rx="55" ry="18" fill="#fff" opacity="0.9"/>
  <ellipse cx="155" cy="58" rx="35" ry="16" fill="#fff" opacity="0.9"/>
  <path d="M0 360 Q150 340 300 358 T600 352 V450 H0 Z" fill="#8cc56b"/>
  <rect x="0" y="378" width="600" height="72" fill="#c9b08a"/>
  <line x1="0" y1="380" x2="600" y2="380" stroke="#a88f6a" stroke-width="3"/>

  <!-- Motion lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="30" y1="260" x2="80" y2="260"/>
    <line x1="15" y1="295" x2="75" y2="295"/>
    <line x1="40" y1="330" x2="85" y2="330"/>
  </g>

  <!-- Far leg (behind bike) -->
  <path d="M250 205 Q305 230 300 250 Q290 275 268 293" fill="none"
        stroke="#6b4e38" stroke-width="22" stroke-linecap="round"/>
  <g stroke="#e9dcc3" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M262 290 q-10 4 -12 14"/>
    <path d="M268 294 q-8 6 -8 16"/>
  </g>

  <!-- Rear wheel -->
  <g transform="translate(170 310)">
    <circle r="68" fill="none" stroke="#2f2f2f" stroke-width="10"/>
    <circle r="62" fill="none" stroke="#b5b5b5" stroke-width="3"/>
    <g stroke="#c8c8c8" stroke-width="1.5"><use href="#spokes"/></g>
    <circle r="7" fill="#666"/>
  </g>
  <!-- Front wheel -->
  <g transform="translate(430 310)">
    <circle r="68" fill="none" stroke="#2f2f2f" stroke-width="10"/>
    <circle r="62" fill="none" stroke="#b5b5b5" stroke-width="3"/>
    <g stroke="#c8c8c8" stroke-width="1.5"><use href="#spokes"/></g>
    <circle r="7" fill="#666"/>
  </g>

  <!-- Frame -->
  <g stroke="#e0463c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M170 310 L290 320 L250 215 Z"/>
    <path d="M250 215 L388 205"/>
    <path d="M290 320 L392 218"/>
    <path d="M388 198 L430 310"/>
  </g>
  <!-- Chain ring and crank -->
  <circle cx="290" cy="320" r="16" fill="none" stroke="#555" stroke-width="4"/>
  <line x1="170" y1="310" x2="290" y2="304" stroke="#555" stroke-width="2"/>
  <line x1="170" y1="310" x2="290" y2="336" stroke="#555" stroke-width="2"/>
  <line x1="266" y1="296" x2="314" y2="344" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <rect x="302" y="340" width="26" height="7" rx="2" fill="#333"/>
  <rect x="254" y="292" width="24" height="6" rx="2" fill="#333"/>
  <!-- Seat post and saddle -->
  <line x1="250" y1="215" x2="245" y2="200" stroke="#888" stroke-width="6"/>
  <path d="M218 196 Q245 188 272 196 Q262 206 230 204 Z" fill="#2f2f2f"/>
  <!-- Stem and handlebar -->
  <line x1="388" y1="200" x2="392" y2="180" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <path d="M378 176 Q398 170 415 180 Q420 186 412 192" fill="none"
        stroke="#444" stroke-width="7" stroke-linecap="round"/>

  <!-- Sloth body -->
  <ellipse cx="258" cy="155" rx="48" ry="62" transform="rotate(18 258 155)" fill="url(#fur)"/>
  <path d="M235 110 q8 20 2 40 M255 120 q6 18 0 38 M275 125 q4 16 -2 34"
        fill="none" stroke="#6b4e38" stroke-width="2" opacity="0.6"/>

  <!-- Near leg -->
  <path d="M268 200 Q330 235 322 262 Q316 300 316 338" fill="none"
        stroke="#7f6048" stroke-width="24" stroke-linecap="round"/>
  <g stroke="#f2e6cf" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M308 340 q-4 8 0 16"/>
    <path d="M316 342 q-2 8 3 15"/>
    <path d="M324 340 q2 8 8 13"/>
  </g>

  <!-- Near arm to handlebar -->
  <path d="M282 128 Q340 150 396 172" fill="none"
        stroke="#846349" stroke-width="22" stroke-linecap="round"/>
  <g stroke="#f2e6cf" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M398 164 q14 4 12 20"/>
    <path d="M404 168 q12 6 8 20"/>
    <path d="M392 168 q12 6 10 20"/>
  </g>

  <!-- Head -->
  <circle cx="305" cy="92" r="44" fill="#8e6d52"/>
  <path d="M268 72 q10 -18 30 -20 M300 50 q12 -4 26 4" fill="none"
        stroke="#6b4e38" stroke-width="3" stroke-linecap="round"/>
  <!-- Face mask -->
  <ellipse cx="312" cy="98" rx="34" ry="28" fill="#eddcbf"/>
  <!-- Eye patches -->
  <ellipse cx="296" cy="96" rx="13" ry="7" transform="rotate(25 296 96)" fill="#4a3526"/>
  <ellipse cx="330" cy="96" rx="13" ry="7" transform="rotate(-25 330 96)" fill="#4a3526"/>
  <circle cx="299" cy="93" r="4" fill="#111"/>
  <circle cx="327" cy="93" r="4" fill="#111"/>
  <circle cx="300.5" cy="91.5" r="1.3" fill="#fff"/>
  <circle cx="328.5" cy="91.5" r="1.3" fill="#fff"/>
  <!-- Nose and smile -->
  <ellipse cx="313" cy="106" rx="7" ry="5" fill="#3a2a1f"/>
  <path d="M302 115 Q313 124 324 115" fill="none" stroke="#3a2a1f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="290" cy="112" r="5" fill="#e8a79a" opacity="0.6"/>
  <circle cx="336" cy="112" r="5" fill="#e8a79a" opacity="0.6"/>

  <!-- Helmet -->
  <path d="M263 78 Q270 38 310 40 Q348 44 350 80 Q306 64 263 78 Z" fill="#3f8fd6"/>
  <path d="M285 50 L292 70 M310 44 L312 66 M333 50 L328 70" stroke="#2c6aa3" stroke-width="3" stroke-linecap="round"/>
  <path d="M348 78 L360 82" stroke="#3f8fd6" stroke-width="5" stroke-linecap="round"/>
</svg>