<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Sloth riding a bicycle</title>
  <desc id="desc">A smiling sloth pedals a teal bicycle along a sunny path.</desc>

  <rect width="800" height="600" fill="#f4f8ee"/>
