<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle in a library aisle</title>
  <desc id="desc">A comic black-and-white worm's-eye view straight up a towering library aisle. A pelican rides a bicycle overhead, lit by a single lemon-yellow desk lamp.</desc>

  <defs>
    <radialGradient id="lampGlow">
      <stop offset="0" stop-color="#fff7bf" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff7bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bookSpines" width="46" height="90" patternUnits="userSpaceOnUse">
      <rect width="46" height="90" fill="#111"/>
      <path d="M2 2h12v86H2zm16 0h10v86H18zm14 0h12v86H32z"
            fill="#f4f4f4" stroke="#111" stroke-width="2"/>
      <path d="M4 16h8M4 20h8M20 70h6M34 27h8M34 31h8"
            stroke="#111" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="#090909"/>
  <circle cx="404" cy="390" r="370" fill="url(#lampGlow)"/>

  <!-- Shelves converge overhead toward the narrow aisle's vanishing point. -->
  <path d="M0 0h265L380 350 0 800z" fill="url(#bookSpines)"/>
  <path d="M800 0H535L420 350l380 450z" fill="url(#bookSpines)"/>
  <path d="M0 0h265l22 18H0zm0 178h326l9 18H0zm0 188h376l3 18H0zm0 180h386v18H0z"
        fill="#050505" stroke="#eee" stroke-width="5"/>
  <path d="M800 0H535l-22 18h287zm0 178H474l-9 18h335zm0 188H424l-3 18h379zm0 180H414v18h386z"
        fill="#050505" stroke="#eee" stroke-width="5"/>

  <!-- Desk lamp: the sole lemon-yellow accent and hard point source. -->
  <path d="M99 113h60l-22 34h-16z" fill="#f3e34a" stroke="#fff" stroke-width="4"/>
  <path d="M129 147v35l37 21" fill="none" stroke="#fff" stroke-width="7"/>
  <circle cx="129" cy="144" r="7" fill="#fff"/>
  <path d="M137 145L397 359M127 154L397 359M146 152L397 359"
        fill="none" stroke="#fff" stroke-width="2" opacity=".85"/>

  <!-- Bicycle wheels, foreshortened into a dramatic overhead angle. -->
  <g fill="none" stroke="#f5f5f5" stroke-width="8">
    <ellipse cx="305" cy="491" rx="111" ry="78"/>
    <ellipse cx="530" cy="460" rx="111" ry="78"/>
    <path d="M305 491l90-86 66 65-156 21 66-65 159 34-69-34"/>
    <path d="M395 405l-9-21m-18 0h39m97 41h42m-15-12 15 12-16 11"/>
  </g>
  <g fill="#fff">
    <circle cx="305" cy="491" r="9"/>
    <circle cx="530" cy="460" r="9"/>
    <circle cx="395" cy="405" r="8"/>
    <circle cx="461" cy="470" r="8"/>
  </g>

  <!-- Pelican, leaning forward with a ridiculous, delighted expression. -->
  <path d="M357 367q-18-62 24-94 46-32 93 2 26 19 13 58l-27 53-77 11z"
        fill="#f8f8f8" stroke="#080808" stroke-width="9"/>
  <path d="M418 282q14-67 91-64 47 2 67 36-38 3-56 26-31 33-76 24z"
        fill="#fff" stroke="#080808" stroke-width="9"/>
  <path d="M496 278q62-30 132-4-24 19-64 25-40 6-75-3z"
        fill="#f8f8f8" stroke="#080808" stroke-width="8"/>
  <path d="M488 288q60-12 135 6-37 43-87 37-33-3-55-22z"
        fill="#fff" stroke="#080808" stroke-width="8"/>
  <path d="M499 299q57-4 107 1-25 22-61 22-30 0-46-12z"
        fill="#111"/>
  <circle cx="475" cy="262" r="8" fill="#080808"/>
  <path d="M445 245q16-13 31-3" fill="none" stroke="#080808" stroke-width="5"/>
  <path d="M388 359l-31 49m89-42 17 53" fill="none" stroke="#080808" stroke-width="12"/>
  <path d="M353 407l-18 3m128 9 20 8" stroke="#080808" stroke-width="9" stroke-linecap="round"/>
  <path d="M355 405l36-1m91 17 27-4" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M371 321q-17-22-24-4m-4 3 15-3" fill="none" stroke="#080808" stroke-width="5"/>

  <!-- Motion marks and comic punctuation. -->
  <path d="M233 423l-42-16m54 39-51-4m392-76 42-20m-32 39 51-8"
        stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M635 248l7-18m15 28 18-11" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="618" y="218" fill="#fff" font-family="sans-serif" font-size="36"
        font-weight="bold" transform="rotate(12 618 218)">!</text>
</svg>