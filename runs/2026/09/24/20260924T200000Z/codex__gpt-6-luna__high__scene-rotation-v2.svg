<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">The Library Pelican’s Midnight Ride</title>
  <desc id="desc">A mischievous pelican rides a bicycle above a narrow library aisle, seen from directly below. Towering bookshelves frame the view, and a desk lamp casts a sharp lemon-yellow beam.</desc>

  <rect width="1000" height="1000" fill="#fff"/>
  <path d="M0 0H1000V1000H0Z" fill="#111"/>
  <path d="M500 458 40 0h920Z" fill="#fff"/>

  <!-- Bookshelves rise around the narrow shaft of the aisle. -->
  <g stroke="#111" stroke-width="12" stroke-linejoin="round">
    <path d="M0 0h320l172 448-65 150L0 812Z" fill="#fff"/>
    <path d="M1000 0H680L508 448l65 150 427 214Z" fill="#fff"/>
    <path d="M0 150 362 174 404 240 0 224Z" fill="#111"/>
    <path d="M0 330 422 337 447 401 0 410Z" fill="#111"/>
    <path d="M0 538 402 500 428 565 0 630Z" fill="#111"/>
    <path d="M1000 150 638 174 596 240 1000 224Z" fill="#111"/>
    <path d="M1000 330 578 337 553 401 1000 410Z" fill="#111"/>
    <path d="M1000 538 598 500 572 565 1000 630Z" fill="#111"/>
  </g>

  <!-- Dense book spines, angled toward the overhead opening. -->
  <g fill="#fff" stroke="#111" stroke-width="7">
    <path d="M30 19 76 20l91 126-51-4Z"/>
    <path d="m90 21 48 1 95 130-53-3Z"/>
    <path d="m157 22 43 1 87 132-51-4Z"/>
    <path d="m222 22 52 1 75 136-49-3Z"/>
    <path d="m34 245 53 2 103 82-57-1Z"/>
    <path d="m105 248 46 1 103 82-55-1Z"/>
    <path d="m173 250 55 1 104 81-58-1Z"/>
    <path d="m27 439 53-2 119 95-59 5Z"/>
    <path d="m98 435 48-2 119 95-57 5Z"/>
    <path d="m168 431 52-2 119 94-58 5Z"/>
    <path d="m965 19-46 1-91 126 51-4Z"/>
    <path d="m910 21-48 1-95 130 53-3Z"/>
    <path d="m843 22-43 1-87 132 51-4Z"/>
    <path d="m778 22-52 1-75 136 49-3Z"/>
    <path d="m966 245-53 2-103 82 57-1Z"/>
    <path d="m895 248-46 1-103 82 55-1Z"/>
    <path d="m827 250-55 1-104 81 58-1Z"/>
    <path d="m973 439-53-2-119 95 59 5Z"/>
    <path d="m902 435-48-2-119 95 57 5Z"/>
    <path d="m832 431-52-2-119 94 58 5Z"/>
  </g>

  <!-- Shelf labels and tiny spine marks. -->
  <g fill="#111">
    <path d="M35 95h70v9H35zm79 1h42v8h-42zm96 3h58v8h-58z"/>
    <path d="M30 285h81v9H30zm96 1h62v8h-62zm77 0h72v8h-72z"/>
    <path d="M31 493h69v9H31zm85-4h71v9h-71zm85-4h67v9h-67z"/>
    <path d="M895 95h70v9h-70zm-65 1h42v8h-42zm-96 3h58v8h-58z"/>
    <path d="M889 285h81v9h-81zm-92 1h62v8h62zm-77 0h72v8h-72z"/>
    <path d="M900 493h69v9h-69zm-85-4h71v9h-71zm-85-4h67v9h-67z"/>
  </g>

  <!-- A single desk lamp makes the hard, focused pool of light. -->
  <g stroke="#111" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="m828 0-35 72 42 25 69-70Z" fill="#fff"/>
    <path d="m824 76-67 69m78-62 40 29" fill="none"/>
    <path d="m759 145-28 44" fill="none"/>
    <circle cx="731" cy="193" r="15" fill="#F4D21F"/>
    <path d="M714 214 641 412m105-190 20 207m-47-197-13 183" fill="none" stroke-width="5"/>
  </g>

  <!-- The bike, foreshortened as it passes overhead. -->
  <g stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="377" cy="520" r="102" fill="none"/>
    <circle cx="652" cy="520" r="102" fill="none"/>
    <circle cx="377" cy="520" r="12" fill="#111"/>
    <circle cx="652" cy="520" r="12" fill="#111"/>
    <path d="m377 520 102-124 80 124H377l50-92h132l93 92m-93-92 13-48m-36 0h47" fill="none"/>
    <path d="m464 384 31-8m113 0 30 8" fill="none"/>
    <path d="m535 500 34-27" fill="none"/>
  </g>

  <!-- Pelican rider: long bill, cheeky eye, wings on the handlebars. -->
  <g stroke="#111" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M465 323c-18-48 2-97 47-112 46-15 92 15 94 62 2 37-18 63-47 76l-6 45-75-3-2-37Z" fill="#fff"/>
    <path d="m516 250 172-30-143 63c-18 8-34-13-29-33Z" fill="#fff"/>
    <path d="M528 286q45 35 87 2l-28 67q-42 14-71-17Z" fill="#fff"/>
    <circle cx="562" cy="236" r="9" fill="#111"/>
    <path d="m578 214 21-18m-18 26 24-5" fill="none" stroke-width="7"/>
    <path d="M488 353c-39 0-70 20-91 53 32 11 66 6 99-13m49-4c27 14 53 41 64 69-39 2-71-12-96-40" fill="#fff"/>
    <path d="m513 365-28 67 64 13m32-24-30 55-35-14" fill="none"/>
    <path d="M472 421q30 34 74 12m14-9q31 27 67 12" fill="none" stroke-width="9"/>
  </g>

  <!-- Comic movement and a stolen library book. -->
  <g fill="#111">
    <path d="m284 334 24-8-12 23 31-6-41 34 10-23-28 7Z"/>
    <path d="m704 333 25 7-22 12 28 13-52-3 22-12-25-12Z"/>
    <path d="m429 246 18-16 2 20 22-10-27 35 1-22-24 12Z"/>
  </g>
  <g transform="rotate(-14 713 397)" stroke="#111" stroke-width="8" stroke-linejoin="round">
    <path d="M682 366h63v67h-63z" fill="#fff"/>
    <path d="M695 383h37m-37 14h30m-30 14h34" fill="none" stroke-width="5"/>
  </g>

  <path d="M270 733q230 52 460 0" fill="none" stroke="#111" stroke-width="8" stroke-dasharray="12 20"/>
  <text x="500" y="804" text-anchor="middle" fill="#111"
        font-family="sans-serif" font-size="28" font-weight="900"
        letter-spacing="4">SHHH… PEDAL QUIETLY!</text>
</svg>