<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <clipPath id="frame"><rect width="800" height="800"/></clipPath>
    <pattern id="booksL" width="20" height="60" patternUnits="userSpaceOnUse">
      <rect width="20" height="60" fill="#000"/>
      <rect x="2" y="4" width="16" height="52" fill="#fff"/>
      <rect x="6" y="14" width="8" height="2" fill="#000"/>
      <rect x="6" y="40" width="8" height="2" fill="#000"/>
    </pattern>
  </defs>

  <!-- floor of the void: ceiling seen from below, black -->
  <rect width="800" height="800" fill="#000"/>

  <!-- lamp glow on the ceiling -->
  <circle cx="400" cy="400" r="330" fill="url(#lamp)" opacity="0.9"/>

  <g clip-path="url(#frame)">
    <!-- LEFT shelf tower, converging toward the centre (vanishing point at 400,400) -->
    <polygon points="0,0 0,800 260,540 260,260" fill="#fff"/>
    <polygon points="0,0 0,800 260,540 260,260" fill="none" stroke="#000" stroke-width="6"/>
    <!-- shelf planks converging -->
    <g stroke="#000" stroke-width="5">
      <line x1="0" y1="0" x2="260" y2="260"/>
      <line x1="0" y1="130" x2="260" y2="305"/>
      <line x1="0" y1="260" x2="260" y2="352"/>
      <line x1="0" y1="400" x2="260" y2="400"/>
      <line x1="0" y1="540" x2="260" y2="448"/>
      <line x1="0" y1="670" x2="260" y2="495"/>
      <line x1="0" y1="800" x2="260" y2="540"/>
    </g>
    <!-- book spines on left, rows of alternating black/white blocks -->
    <g fill="#000">
      <rect x="20" y="40" width="30" height="80" transform="skewY(45)"/>
      <rect x="60" y="20" width="22" height="70" transform="skewY(45)"/>
      <rect x="100" y="30" width="26" height="60" transform="skewY(45)"/>
      <rect x="150" y="30" width="20" height="50" transform="skewY(45)"/>
      <rect x="20" y="-160" width="30" height="80" transform="skewY(45) translate(0,340)"/>
      <rect x="70" y="-170" width="24" height="70" transform="skewY(45) translate(0,340)"/>
      <rect x="120" y="-160" width="22" height="55" transform="skewY(45) translate(0,340)"/>
      <rect x="20" y="-330" width="30" height="80" transform="skewY(45) translate(0,680)"/>
      <rect x="70" y="-330" width="26" height="70" transform="skewY(45) translate(0,680)"/>
    </g>
    <g fill="#fff" stroke="#000" stroke-width="3">
      <rect x="30" y="500" width="30" height="110" transform="skewY(-45) translate(0,0)"/>
      <rect x="75" y="560" width="24" height="90" transform="skewY(-45)"/>
      <rect x="120" y="610" width="22" height="70" transform="skewY(-45)"/>
    </g>

    <!-- RIGHT shelf tower -->
    <polygon points="800,0 800,800 540,540 540,260" fill="#fff"/>
    <polygon points="800,0 800,800 540,540 540,260" fill="none" stroke="#000" stroke-width="6"/>
    <g stroke="#000" stroke-width="5">
      <line x1="800" y1="0" x2="540" y2="260"/>
      <line x1="800" y1="130" x2="540" y2="305"/>
      <line x1="800" y1="260" x2="540" y2="352"/>
      <line x1="800" y1="400" x2="540" y2="400"/>
      <line x1="800" y1="540" x2="540" y2="448"/>
      <line x1="800" y1="670" x2="540" y2="495"/>
      <line x1="800" y1="800" x2="540" y2="540"/>
    </g>
    <g fill="#000">
      <rect x="740" y="60" width="30" height="80" transform="skewY(-45) translate(0,740)"/>
      <rect x="700" y="40" width="22" height="70" transform="skewY(-45) translate(0,700)"/>
      <rect x="660" y="50" width="26" height="60" transform="skewY(-45) translate(0,660)"/>
      <rect x="620" y="50" width="20" height="50" transform="skewY(-45) translate(0,620)"/>
      <rect x="745" y="200" width="30" height="80" transform="skewY(-45) translate(0,745)"/>
      <rect x="700" y="190" width="24" height="70" transform="skewY(-45) translate(0,700)"/>
      <rect x="740" y="370" width="30" height="80" transform="skewY(-45) translate(0,740)"/>
      <rect x="690" y="360" width="26" height="70" transform="skewY(-45) translate(0,690)"/>
    </g>

    <!-- a couple of books tumbling off the shelves toward the viewer -->
    <g transform="translate(300 150) rotate(-25)">
      <rect x="-40" y="-14" width="80" height="28" fill="#fff" stroke="#000" stroke-width="4"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#000" stroke-width="2"/>
    </g>
    <g transform="translate(520 660) rotate(35)">
      <rect x="-34" y="-12" width="68" height="24" fill="#000" stroke="#fff" stroke-width="3"/>
    </g>

    <!-- ceiling rectangle at the vanishing end (far ceiling) -->
    <rect x="260" y="260" width="280" height="280" fill="#fff"/>
    <rect x="260" y="260" width="280" height="280" fill="none" stroke="#000" stroke-width="6"/>

    <!-- desk lamp: the single hard light, lemon-yellow accent -->
    <g transform="translate(400 400)">
      <!-- lamp arm coming from the right shelf -->
      <line x1="140" y1="0" x2="60" y2="0" stroke="#000" stroke-width="8" stroke-linecap="round"/>
      <line x1="60" y1="0" x2="20" y2="-40" stroke="#000" stroke-width="8" stroke-linecap="round"/>
      <!-- lamp shade seen from below: circle -->
      <circle cx="0" cy="-40" r="62" fill="#000"/>
      <circle cx="0" cy="-40" r="50" fill="#FFF44F"/>
      <circle cx="0" cy="-40" r="14" fill="#fff"/>
      <!-- yellow light rays -->
      <g stroke="#FFF44F" stroke-width="5" stroke-linecap="round">
        <line x1="-75" y1="-100" x2="-110" y2="-135"/>
        <line x1="75" y1="-100" x2="110" y2="-135"/>
        <line x1="0" y1="-115" x2="0" y2="-160"/>
        <line x1="-95" y1="-40" x2="-140" y2="-40"/>
      </g>
    </g>

    <!-- hard cast shadow of pelican+bike thrown onto the far ceiling, offset from the lamp -->
    <g transform="translate(330 470) scale(1.15 0.9) rotate(8)" fill="#000" opacity="0.85">
      <circle cx="-60" cy="30" r="34"/>
      <circle cx="60" cy="30" r="34"/>
      <ellipse cx="0" cy="-10" rx="48" ry="24"/>
      <ellipse cx="40" cy="-60" rx="20" ry="16"/>
      <path d="M52 -62 L120 -48 L58 -46 Z"/>
    </g>

    <!-- PELICAN ON BICYCLE, seen from directly below -->
    <g transform="translate(400 440)">
      <!-- rear wheel -->
      <g transform="translate(-70 40)">
        <circle r="46" fill="#fff" stroke="#000" stroke-width="8"/>
        <circle r="6" fill="#000"/>
        <g stroke="#000" stroke-width="3">
          <line x1="-42" y1="0" x2="42" y2="0"/>
          <line x1="0" y1="-42" x2="0" y2="42"/>
          <line x1="-30" y1="-30" x2="30" y2="30"/>
          <line x1="-30" y1="30" x2="30" y2="-30"/>
        </g>
      </g>
      <!-- front wheel, turned slightly (mischief) -->
      <g transform="translate(78 40) rotate(-18)">
        <ellipse rx="40" ry="46" fill="#fff" stroke="#000" stroke-width="8"/>
        <circle r="6" fill="#000"/>
        <g stroke="#000" stroke-width="3">
          <line x1="-36" y1="0" x2="36" y2="0"/>
          <line x1="0" y1="-42" x2="0" y2="42"/>
          <line x1="-26" y1="-30" x2="26" y2="30"/>
          <line x1="-26" y1="30" x2="26" y2="-30"/>
        </g>
      </g>
      <!-- frame (underside) -->
      <g stroke="#000" stroke-width="9" stroke-linecap="round" fill="none">
        <line x1="-70" y1="40" x2="0" y2="18"/>
        <line x1="0" y1="18" x2="78" y2="40"/>
        <line x1="0" y1="18" x2="-10" y2="-30"/>
        <line x1="-70" y1="40" x2="-22" y2="-24"/>
      </g>
      <!-- pedals / crank -->
      <circle cx="0" cy="18" r="13" fill="#fff" stroke="#000" stroke-width="6"/>
      <line x1="-16" y1="4" x2="16" y2="32" stroke="#000" stroke-width="6" stroke-linecap="round"/>
      <!-- webbed feet on pedals -->
      <path d="M-30 -4 l-16 -18 l10 4 l-4 -14 l10 8 l2 -14 l8 14 Z" fill="#FFF44F" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
      <path d="M30 40 l16 18 l-10 -4 l4 14 l-10 -8 l-2 14 l-8 -14 Z" fill="#FFF44F" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
      <!-- belly seen from below -->
      <ellipse cx="-4" cy="-42" rx="52" ry="34" fill="#fff" stroke="#000" stroke-width="7"/>
      <!-- wing tips gripping handlebars -->
      <path d="M-40 -60 Q-90 -70 -60 -20" fill="#fff" stroke="#000" stroke-width="6"/>
      <path d="M40 -60 Q100 -74 74 -18" fill="#fff" stroke="#000" stroke-width="6"/>
      <!-- handlebar -->
      <line x1="-60" y1="-20" x2="88" y2="-14" stroke="#000" stroke-width="8" stroke-linecap="round"/>
      <!-- neck and head craning down at the viewer -->
      <path d="M8 -70 Q30 -110 60 -120" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round"/>
      <path d="M8 -70 Q30 -110 60 -120" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
      <circle cx="70" cy="-128" r="26" fill="#fff" stroke="#000" stroke-width="6"/>
      <!-- eye: sly, half-lidded -->
      <circle cx="80" cy="-136" r="7" fill="#000"/>
      <circle cx="82" cy="-138" r="2" fill="#fff"/>
      <path d="M70 -146 q12 -4 22 2" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <!-- big pouch beak, hanging open with a stolen book inside -->
      <path d="M60 -112 L150 -150 L92 -96 Z" fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
      <path d="M60 -112 Q90 -60 118 -110 L92 -96 Z" fill="#FFF44F" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
      <rect x="82" y="-108" width="26" height="12" fill="#000" transform="rotate(-20 95 -102)"/>
    </g>

    <!-- speed lines, comic -->
    <g stroke="#000" stroke-width="4" stroke-linecap="round">
      <line x1="290" y1="560" x2="330" y2="540"/>
      <line x1="280" y1="590" x2="335" y2="565"/>
      <line x1="300" y1="620" x2="345" y2="590"/>
    </g>

    <!-- "SHH!" callout from an offstage librarian, comic -->
    <g transform="translate(120 420)">
      <path d="M-70 -30 h140 v50 h-90 l-20 22 v-22 h-30 Z" fill="#fff" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
      <text x="0" y="6" font-family="Impact, Arial Black, sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#000">SHH!</text>
    </g>
  </g>
</svg>