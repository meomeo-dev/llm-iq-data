<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">A very quiet getaway</title>
  <desc id="desc">A mischievous pelican rides a bicycle overhead in a narrow library aisle. Towering black-and-white bookshelves converge toward the ceiling in an exaggerated worm’s-eye perspective. One articulated desk lamp casts hard light across the bird. Its enormous lemon-yellow bill is the only colored accent.</desc>
