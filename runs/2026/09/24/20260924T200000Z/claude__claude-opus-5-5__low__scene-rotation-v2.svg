<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="lampGlow" cx="300" cy="620" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#bbb" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#777"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="#0a0a0a"/>
  <!-- 顶部天光：过道在高处收成一个点 -->
  <polygon points="255,0 345,0 310,260 290,260" fill="url(#skyFade)"/>

  <!-- 左侧书架，向上方灭点收拢 -->
  <polygon points="0,0 255,0 290,260 0,800" fill="#1c1c1c"/>
  <g stroke="#000" stroke-width="4">
    <line x1="0" y1="700" x2="282" y2="235"/>
    <line x1="0" y1="560" x2="276" y2="200"/>
    <line x1="0" y1="430" x2="271" y2="160"/>
    <line x1="0" y1="310" x2="266" y2="115"/>
    <line x1="0" y1="200" x2="262" y2="70"/>
    <line x1="0" y1="95" x2="258" y2="30"/>
  </g>
  <g fill="#e8e8e8" stroke="#000" stroke-width="2">
    <polygon points="20,690 50,640 62,650 32,700"/>
    <polygon points="70,610 110,545 118,552 80,618"/>
    <polygon points="130,520 160,470 172,478 142,528"/>
    <polygon points="40,420 90,350 100,358 50,428"/>
    <polygon points="150,380 190,318 197,325 158,388"/>
    <polygon points="60,280 110,215 118,222 68,288"/>
    <polygon points="180,230 215,180 222,186 188,236"/>
    <polygon points="200,130 230,95 235,100 205,135"/>
  </g>

  <!-- 右侧书架 -->
  <polygon points="600,0 345,0 310,260 600,800" fill="#1c1c1c"/>
  <g stroke="#000" stroke-width="4">
    <line x1="600" y1="700" x2="318" y2="235"/>
    <line x1="600" y1="560" x2="324" y2="200"/>
    <line x1="600" y1="430" x2="329" y2="160"/>
    <line x1="600" y1="310" x2="334" y2="115"/>
    <line x1="600" y1="200" x2="338" y2="70"/>
    <line x1="600" y1="95" x2="342" y2="30"/>
  </g>
  <g fill="#e8e8e8" stroke="#000" stroke-width="2">
    <polygon points="580,690 550,640 538,650 568,700"/>
    <polygon points="520,600 480,540 470,548 510,608"/>
    <polygon points="460,510 430,462 420,470 450,518"/>
    <polygon points="560,410 510,345 500,352 550,418"/>
    <polygon points="440,370 405,315 398,322 432,378"/>
    <polygon points="540,270 490,210 482,218 532,278"/>
    <polygon points="410,220 380,178 373,184 402,226"/>
    <polygon points="395,125 368,93 362,98 388,130"/>
  </g>
  <!-- 一本书正从上方掉落，喜剧伏笔 -->
  <g transform="rotate(-25 330 140)">
    <rect x="315" y="125" width="30" height="40" fill="#fff" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="125" x2="320" y2="165" stroke="#000" stroke-width="2"/>
  </g>
  <path d="M322 105 q6 -8 12 0 M338 100 q6 -8 12 0" stroke="#fff" stroke-width="2" fill="none"/>

  <!-- 台灯硬光：自下而上的点光源 -->
  <rect width="600" height="800" fill="url(#lampGlow)" style="mix-blend-mode:screen"/>

  <!-- 自行车：从下方仰视，车轮成扁椭圆 -->
  <g stroke="#000" stroke-width="7" fill="none">
    <ellipse cx="300" cy="700" rx="60" ry="22"/>
    <ellipse cx="300" cy="450" rx="42" ry="15"/>
  </g>
  <g stroke="#fff" stroke-width="2" fill="none">
    <ellipse cx="300" cy="700" rx="52" ry="17"/>
    <ellipse cx="300" cy="450" rx="36" ry="11"/>
  </g>
  <g stroke="#000" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="300" y1="700" x2="300" y2="560"/>
    <line x1="300" y1="560" x2="300" y2="450"/>
    <line x1="255" y1="470" x2="345" y2="470"/>
  </g>
  <!-- 曲柄与踏板 -->
  <circle cx="300" cy="580" r="14" fill="#000"/>
  <line x1="265" y1="600" x2="335" y2="560" stroke="#000" stroke-width="6"/>
  <!-- 柠檬黄唯一点缀：车铃 -->
  <circle cx="345" cy="470" r="11" fill="#FFF44F" stroke="#000" stroke-width="3"/>

  <!-- 鹈鹕：从腹部仰视 -->
  <ellipse cx="300" cy="500" rx="95" ry="70" fill="#f4f4f4" stroke="#000" stroke-width="5"/>
  <!-- 蹼足踩踏板 -->
  <path d="M255 600 l-18 14 l14 4 l6 -10 l8 12 z" fill="#000"/>
  <path d="M335 560 l18 14 l-14 4 l-6 -10 l-8 12 z" fill="#000"/>
  <line x1="270" y1="555" x2="258" y2="598" stroke="#000" stroke-width="5"/>
  <line x1="330" y1="555" x2="333" y2="562" stroke="#000" stroke-width="5"/>
  <!-- 翅膀：一只握把，一只得意挥动 -->
  <path d="M210 490 q-40 -10 -55 -40 q30 5 50 -5" fill="#fff" stroke="#000" stroke-width="4"/>
  <path d="M390 480 q60 -60 90 -130 q-30 20 -45 10 q-15 40 -55 70" fill="#fff" stroke="#000" stroke-width="4"/>
  <!-- 长颈与头，从下往上看到下巴与喉囊 -->
  <path d="M285 440 q-10 -60 5 -110 l25 0 q10 55 0 110 z" fill="#fff" stroke="#000" stroke-width="4"/>
  <circle cx="302" cy="320" r="32" fill="#fff" stroke="#000" stroke-width="4"/>
  <!-- 喉囊鼓起：偷偷塞了一本书 -->
  <path d="M290 330 q-35 -80 10 -150 q45 70 12 150 z" fill="#fff" stroke="#000" stroke-width="4"/>
  <rect x="290" y="240" width="22" height="30" fill="#000" transform="rotate(12 301 255)"/>
  <!-- 眼睛：斜睨，一副坏笑 -->
  <circle cx="282" cy="318" r="6" fill="#000"/>
  <circle cx="322" cy="318" r="6" fill="#000"/>
  <path d="M272 306 l18 5 M332 306 l-18 5" stroke="#000" stroke-width="3"/>
  <path d="M286 340 q16 10 32 0" stroke="#000" stroke-width="3" fill="none"/>

  <!-- 台灯：地面上的硬点光源 -->
  <g>
    <polygon points="300,790 240,740 360,740" fill="#000"/>
    <circle cx="300" cy="752" r="8" fill="#fff"/>
  </g>
  <text x="300" y="785" font-family="monospace" font-size="12" fill="#fff" text-anchor="middle">SHHH!</text>
</svg>