  <g fill="none" stroke="#111" stroke-linecap="round">
    <path d="M130 618c-24 11-39 26-47 45m73-19c-27 12-43 30-50 52M644 603c22 11 39 27 51 48m-36-9c24 14 39 29 47 48" stroke-width="7"/>
    <path d="m616 537 15-20m-10 37 25-8" stroke-width="5"/>
  </g>
  <path d="m155 514 26-18 11 45-17-8-13 15Z" fill="#fff" stroke="#111" stroke-width="5"/>
</svg>