<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pelican cycling through a library aisle</title>
  <desc id="desc">A worm's-eye view between towering bookshelves. A mischievous pelican rides a bicycle toward the viewer under one hard desk-lamp light, with a lemon-yellow beak.</desc>

  <rect width="800" height="1000" fill="#fff"/>

  <!-- Shelves converge overhead. -->
  <path d="M0 0H278L360 470 314 1000H0Z" fill="#111"/>
  <path d="M800 0H522L440 470 486 1000H800Z" fill="#111"/>
  <path d="M278 0 360 470 314 1000M522 0 440 470 486 1000" fill="none" stroke="#fff" stroke-width="10"/>

  <g fill="none" stroke="#fff" stroke-width="8">
    <path d="M0 175 305 178M0 385 334 377M0 625 339 601M0 850 324 811"/>
    <path d="M800 175 495 178M800 385 466 377M800 625 461 601M800 850 476 811"/>
  </g>

  <!-- Books, compressed by the steep perspective. -->
  <g fill="#fff">
    <path d="M20 22h25v135H20zm33 7h18v128H53zm28-12h34v140H81zm44 18h17v122h-17zm27-14h27v136h-27zm39 10h15v126h-15zm25-12h36v138h-36z"/>
