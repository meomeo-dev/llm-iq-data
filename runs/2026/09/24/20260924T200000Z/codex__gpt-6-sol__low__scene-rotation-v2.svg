    <path d="M15 414h32v170H15zm47 12h19v158H62zm32-10h38v168H94zm53 17h20v151h-20zm35-13h33v164h-33zm47 8h18v156h-18zm31-12h47v168h-47z"/>
    <path d="M493 416h47v168h-47zm60 12h18v156h-18zm31-8h33v164h-33zm48 13h20v151h-20zm35-17h38v168h-38zm53 10h19v158h-19zm32-12h32v170h-32z"/>
  </g>

  <g fill="none" stroke="#111" stroke-width="3">
    <path d="M27 47v88m66-101v102m71-99v95m73-91v92M565 37v99m76-91v89m66-95v96m57-92v91"/>
    <path d="M28 245v94m74-100v101m80-96v94m71-95v96M546 244v95m76-96v95m76-99v101m74-95v94"/>
  </g>

