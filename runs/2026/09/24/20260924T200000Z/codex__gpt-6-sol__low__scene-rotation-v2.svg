  <path d="M355 174 283 515M445 174 517 515" fill="none" stroke="#111" stroke-width="3"/>

  <!-- Hard shadows race toward the bottom of the aisle. -->
  <path d="M360 470 0 1000h800L440 470Z" fill="#fff"/>
  <path d="M360 470 0 1000h160l221-495ZM440 470l360 530H640L419 505Z" fill="#111"/>
  <path d="M400 489 326 1000h148Z" fill="#111" opacity=".12"/>
  <path d="M314 1000 360 470M486 1000 440 470" fill="none" stroke="#111" stroke-width="6"/>

