<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">The overdue escape</title>
  <desc id="desc">A mischievous pelican rides a bicycle overhead in a narrow library aisle. Towering black and white bookshelves converge above a worm's-eye viewpoint. A single lemon-yellow desk lamp casts hard light and angular shadows.</desc>
  <defs>
    <pattern id="paper" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 9 9 0" stroke="#000" stroke-width=".5" opacity=".1"/>
    </pattern>
    <pattern id="spines" width="49" height="150" patternUnits="userSpaceOnUse">
      <rect width="49" height="150" fill="#fff"/>
      <path d="M2 0V150M17 0V150M23 0V150M44 0V150" stroke="#000" stroke-width="4"/>
      <path d="M5 17H14M26 28H40M5 124H14M26 132H40" stroke="#000" stroke-width="3"/>
      <rect x="27" y="49" width="11" height="49" fill="#000"/>
    </pattern>
    <clipPath id="leftCase">
      <path d="M0 0H298L349 319 263 1000H0Z"/>
    </clipPath>
    <clipPath id="rightCase">
      <path d="M502 0H800V1000H537L451 319Z"/>
    </clipPath>
  </defs>

