<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a bicycle in a library aisle</title>
  <desc id="desc">A mischievous pelican pedals overhead between towering bookshelves. The view looks straight up from the floor. A desk lamp casts a sharp pool of light, with its bulb as the only lemon-yellow accent.</desc>

  <defs>
    <clipPath id="leftShelf">
      <path d="M0 0H298L326 234L279 1000H0Z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M502 0H800V1000H521L474 234Z"/>
    </clipPath>
    <g id="books">
      <path d="M0 0v100m22-100v100m13-100v100m28-100v100m19-100v100m31-100v100m18-100v100m26-100v100m20-100v100m32-100v100m19-100v100m29-100v100m18-100v100m25-100v100"
        fill="none" stroke="#111" stroke-width="6"/>
      <path d="M6 23h12M6 36h12m25-13h13m0 13H43m50-13h12m-12 13h12m37-13h16m-16 13h16m37-13h12m-12 13h12m43-13h13m-13 13h13"
        fill="none" stroke="#111" stroke-width="4"/>
      <path d="M66 0v100m121-100v100m92-100v100"
        fill="none" stroke="#111" stroke-width="11"/>
    </g>
    <g id="spokes" stroke="#111" stroke-width="3">
      <path d="M0-117V117M-117 0H117M-83-83 83 83M83-83-83 83
               M-45-108 45 108M45-108-45 108M-108-45 108 45M108-45-108 45"/>
    </g>
  </defs>

  <!-- The pale ceiling is the small opening far above the viewer. -->
  <rect width="800" height="1000" fill="#fff"/>
  <path d="M298 0H502L474 234H326Z" fill="#111"/>
  <path d="M338 0h124l-12 206H350Z" fill="#fff"/>
  <path d="M400 0v206M350 100h100" fill="none" stroke="#111" stroke-width="10"/>
  <path d="M326 234 279 1000M474 234l47 766" fill="none" stroke="#111" stroke-width="15"/>

  <!-- Shelves rise on both sides, growing wider toward the floor. -->
  <path d="M0 0H298L326 234L279 1000H0Z" fill="#fff" stroke="#111" stroke-width="14"/>
  <path d="M502 0H800V1000H521L474 234Z" fill="#fff" stroke="#111" stroke-width="14"/>

  <g clip-path="url(#leftShelf)">
    <path d="M0 90h310M0 223h323M0 390h315M0 595h304M0 838h290"
      stroke="#111" stroke-width="23"/>
    <g fill="#fff" stroke="#111" stroke-width="5">
      <path d="M-15 2h340v85H-15zM-15 105h340v111H-15z
               M-15 240h340v139H-15zM-15 408h340v174H-15z
               M-15 620h340v204H-15zM-15 859h340v180H-15z"/>
    </g>
    <use href="#books" transform="translate(8 4) scale(.9 .82)"/>
    <use href="#books" transform="translate(2 111) scale(.98 1.02)"/>
    <use href="#books" transform="translate(-6 247) scale(1.06 1.28)"/>
    <use href="#books" transform="translate(-10 415) scale(1.13 1.6)"/>
    <use href="#books" transform="translate(-15 626) scale(1.2 1.91)"/>
    <use href="#books" transform="translate(-20 866) scale(1.3 1.72)"/>
    <path d="M271 0 318 230 273 1000" fill="none" stroke="#111" stroke-width="20"/>
  </g>

  <g clip-path="url(#rightShelf)">
    <path d="M490 90h310M477 223h323M485 390h315M496 595h304M510 838h290"
      stroke="#111" stroke-width="23"/>
    <g fill="#fff" stroke="#111" stroke-width="5">
      <path d="M475 2h340v85H475zM475 105h340v111H475z
               M475 240h340v139H475zM475 408h340v174H475z
               M475 620h340v204H475zM475 859h340v180H475z"/>
    </g>
    <use href="#books" transform="translate(493 4) scale(.9 .82)"/>
    <use href="#books" transform="translate(486 111) scale(.98 1.02)"/>
    <use href="#books" transform="translate(480 247) scale(1.06 1.28)"/>
    <use href="#books" transform="translate(473 415) scale(1.13 1.6)"/>
    <use href="#books" transform="translate(467 626) scale(1.2 1.91)"/>
    <use href="#books" transform="translate(460 866) scale(1.3 1.72)"/>
    <path d="M529 0 482 230 527 1000" fill="none" stroke="#111" stroke-width="20"/>
  </g>

  <!-- A single desk lamp sends a hard-edged beam across the aisle. -->
  <path d="M681 230 434 430 578 591Z" fill="#fff" stroke="#111" stroke-width="5"/>
  <path d="m800 61-87 126M800 175l-64 76" fill="none" stroke="#111" stroke-width="15"/>
  <path d="M689 163q52-21 91 34l-68 81-91-64q19-42 68-51Z"
    fill="#fff" stroke="#111" stroke-width="12"/>
  <path d="m643 223 70 51 28-34-75-53Z" fill="#111"/>
  <circle cx="690" cy="254" r="19" fill="#F4E442" stroke="#111" stroke-width="7"/>

  <!-- Wheels and spokes are seen from underneath. -->
  <g transform="translate(249 701) rotate(-13)">
    <circle r="128" fill="#fff" stroke="#111" stroke-width="23"/>
    <circle r="109" fill="none" stroke="#111" stroke-width="5"/>
    <use href="#spokes"/>
    <circle r="18" fill="#fff" stroke="#111" stroke-width="8"/>
  </g>
  <g transform="translate(563 700) rotate(12)">
    <circle r="128" fill="#fff" stroke="#111" stroke-width="23"/>
    <circle r="109" fill="none" stroke="#111" stroke-width="5"/>
    <use href="#spokes"/>
    <circle r="18" fill="#fff" stroke="#111" stroke-width="8"/>
  </g>

  <!-- Bicycle frame, crank, handlebars, and a tiny bell. -->
  <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <path d="M249 701 355 546 443 699 249 701 390 548 563 700 443 699"
      stroke-width="18"/>
    <path d="M390 548h-35m88 151 89-172 31 173" stroke-width="17"/>
    <path d="M531 527q24-42 57-31l29 26m-31-26 6-30" stroke-width="14"/>
    <path d="M334 529h80" stroke-width="14"/>
    <path d="m443 699 39 47m-39-47-39-46" stroke-width="14"/>
    <path d="m482 746 25 8m-103-101-26-8" stroke-width="11"/>
  </g>
  <circle cx="443" cy="699" r="22" fill="#fff" stroke="#111" stroke-width="9"/>
  <path d="M580 476q15-24 29 0Z" fill="#fff" stroke="#111" stroke-width="7"/>
  <circle cx="596" cy="470" r="4" fill="#111"/>

  <!-- Pelican: broad body, curled neck, long bill, and enormous pouch. -->
  <path d="M327 538q-52-62-39-122 12-57 90-65 81-7 118 65
           17 35-5 75-34 62-112 72-30 4-52-25Z"
    fill="#fff" stroke="#111" stroke-width="13"/>
  <path d="M317 444q32-43 86-36 44 5 64 48-40 5-71 33-36 30-79-45Z"
    fill="#111"/>
  <path d="M322 452q44 16 91-13m-82 33q48 16 91-12"
    fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <path d="M445 445q-10-55 33-92 32-27 33-75 0-20 23-25
           32-7 47 20 13 24-5 45-24 28-36 66-14 47-42 73Z"
    fill="#fff" stroke="#111" stroke-width="12"/>
  <path d="M520 287q-4-38 26-46 36-10 52 21 8 17-3 31Z"
    fill="#fff" stroke="#111" stroke-width="10"/>
  <path d="M567 281q90 0 144 30-71 30-145 22Z"
    fill="#fff" stroke="#111" stroke-width="11" stroke-linejoin="round"/>
  <path d="M566 333q42 58 132-2-18 84-81 85-42 1-51-83Z"
    fill="#fff" stroke="#111" stroke-width="10" stroke-linejoin="round"/>
  <path d="M586 348q37 34 83 8" fill="none" stroke="#111" stroke-width="5"/>
  <path d="M606 301q54 7 83 14" fill="none" stroke="#111" stroke-width="5"/>
  <path d="M535 267q18-18 37-4" fill="none" stroke="#111"
    stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="553" cy="279" rx="8" ry="11" fill="#111"/>
  <circle cx="556" cy="275" r="2.5" fill="#fff"/>
  <path d="M515 252q20-20 50-12" fill="none" stroke="#111"
    stroke-width="8" stroke-linecap="round"/>
  <path d="M492 409q36-13 61 20l40 63" fill="none"
    stroke="#111" stroke-width="20" stroke-linecap="round"/>
  <path d="M586 482q10-4 21 5m-15 5q13-4 22 5" fill="none"
    stroke="#111" stroke-width="6" stroke-linecap="round"/>

  <!-- Webbed feet pump the pedals. -->
  <path d="M351 504q-28 27-20 58l74 89m-53-100q26 35 56 41"
    fill="none" stroke="#111" stroke-width="20" stroke-linecap="round"
    stroke-linejoin="round"/>
  <path d="M376 644q-22-8-38 9l35 16-17 19 52-10 20-29Z"
    fill="#fff" stroke="#111" stroke-width="9" stroke-linejoin="round"/>
  <path d="M446 500q37 20 47 70l-12 166"
    fill="none" stroke="#111" stroke-width="19" stroke-linecap="round"/>
  <path d="M472 734q-19 1-30 20l39 6-10 24 41-19 4-25Z"
    fill="#fff" stroke="#111" stroke-width="9" stroke-linejoin="round"/>

  <!-- Straight ink marks make the sudden ride feel comic and fast. -->
  <g fill="none" stroke="#111" stroke-linecap="round">
    <path d="m137 511-49-20m43 54-67-7m71 40-43 8
             m537-78 47-22m-29 54 65-9"
      stroke-width="8"/>
    <path d="m172 857-34 31m55-17-19 38m449-42 28 38m-2-52 43 31"
      stroke-width="6"/>
  </g>
</svg>