<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <clipPath id="frame"><rect width="800" height="800"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <!-- ceiling far above, seen straight up -->
    <rect width="800" height="800" fill="#0b0b0b"/>
    <!-- lamp glow: hard, concentric, no gradient -->
    <circle cx="400" cy="430" r="330" fill="#1c1c1c"/>
    <circle cx="400" cy="430" r="250" fill="#2a2a2a"/>
    <circle cx="400" cy="430" r="170" fill="#3a3a3a"/>
    <circle cx="400" cy="430" r="110" fill="#5a5a5a"/>
    <circle cx="400" cy="430" r="70" fill="#f5d800"/>

    <!-- LEFT shelf wall, converging upward to the vanishing point (400,430) -->
    <polygon points="0,800 300,800 400,430 0,430" fill="#151515"/>
    <polygon points="0,0 0,430 400,430 300,0" fill="#151515"/>
    <!-- RIGHT shelf wall -->
    <polygon points="800,800 500,800 400,430 800,430" fill="#151515"/>
    <polygon points="800,0 800,430 400,430 500,0" fill="#151515"/>

    <!-- shelf boards receding toward the center (left side) -->
    <g stroke="#ffffff" stroke-width="3" fill="none">
      <line x1="0" y1="760" x2="330" y2="500"/>
      <line x1="0" y1="640" x2="300" y2="480"/>
      <line x1="0" y1="540" x2="270" y2="460"/>
      <line x1="0" y1="330" x2="270" y2="400"/>
      <line x1="0" y1="200" x2="300" y2="380"/>
      <line x1="0" y1="60" x2="330" y2="360"/>
      <!-- right side -->
      <line x1="800" y1="760" x2="470" y2="500"/>
      <line x1="800" y1="640" x2="500" y2="480"/>
      <line x1="800" y1="540" x2="530" y2="460"/>
      <line x1="800" y1="330" x2="530" y2="400"/>
      <line x1="800" y1="200" x2="500" y2="380"/>
      <line x1="800" y1="60" x2="470" y2="360"/>
      <!-- shelf edge rails top/bottom -->
      <line x1="0" y1="800" x2="400" y2="430"/>
      <line x1="0" y1="0" x2="400" y2="430"/>
      <line x1="800" y1="800" x2="400" y2="430"/>
      <line x1="800" y1="0" x2="400" y2="430"/>
    </g>

    <!-- book spines, left wall (white/grey bands with hard lit faces near lamp) -->
    <g fill="#e6e6e6">
      <polygon points="20,745 60,745 200,610 175,605"/>
      <polygon points="70,740 110,740 240,600 215,598"/>
      <polygon points="130,735 160,735 265,590 245,588"/>
      <polygon points="20,625 70,625 215,555 195,552"/>
      <polygon points="90,620 130,620 250,548 230,546"/>
      <polygon points="20,80 60,80 210,265 190,262"/>
      <polygon points="80,75 120,75 245,275 225,272"/>
      <polygon points="140,70 175,70 275,285 258,283"/>
      <polygon points="30,210 75,210 220,335 200,332"/>
      <polygon points="100,205 140,205 250,345 232,343"/>
    </g>
    <g fill="#8a8a8a">
      <polygon points="60,745 70,745 215,612 200,610"/>
      <polygon points="110,740 130,740 255,600 240,600"/>
      <polygon points="70,625 90,625 230,556 215,555"/>
      <polygon points="60,80 80,80 225,268 210,265"/>
      <polygon points="120,75 140,75 258,278 245,275"/>
      <polygon points="75,210 100,210 232,337 220,335"/>
    </g>
    <!-- book spines, right wall -->
    <g fill="#e6e6e6">
      <polygon points="780,745 740,745 600,610 625,605"/>
      <polygon points="730,740 690,740 560,600 585,598"/>
      <polygon points="670,735 640,735 535,590 555,588"/>
      <polygon points="780,625 730,625 585,555 605,552"/>
      <polygon points="710,620 670,620 550,548 570,546"/>
      <polygon points="780,80 740,80 590,265 610,262"/>
      <polygon points="720,75 680,75 555,275 575,272"/>
      <polygon points="660,70 625,70 525,285 542,283"/>
      <polygon points="770,210 725,210 580,335 600,332"/>
      <polygon points="700,205 660,205 550,345 568,343"/>
    </g>
    <g fill="#8a8a8a">
      <polygon points="740,745 730,745 585,612 600,610"/>
      <polygon points="690,740 670,740 545,600 560,600"/>
      <polygon points="730,625 710,625 570,556 585,555"/>
      <polygon points="740,80 720,80 575,268 590,265"/>
      <polygon points="680,75 660,75 542,278 555,275"/>
      <polygon points="725,210 700,210 568,337 580,335"/>
    </g>

    <!-- one lemon-yellow book, tucked on a shelf -->
    <polygon points="45,540 95,540 240,475 225,470" fill="#f5d800"/>

    <!-- desk lamp, gooseneck arching over the aisle from the right, seen from below -->
    <g stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M 790 420 C 700 380, 560 360, 470 400"/>
    </g>
    <path d="M 470 400 L 430 372 L 356 458 L 400 500 Z" fill="#000000" stroke="#ffffff" stroke-width="4"/>
    <ellipse cx="400" cy="435" rx="30" ry="18" fill="#f5d800"/>

    <!-- plank across the shelf tops, seen from below, overlapping the lamp -->
    <polygon points="140,520 660,300 690,330 170,560" fill="#000000" stroke="#ffffff" stroke-width="4"/>
    <!-- hard cast shadow of bike and bird on the plank underside -->
    <ellipse cx="420" cy="420" rx="120" ry="20" transform="rotate(-23 420 420)" fill="#000000"/>

    <!-- BICYCLE: underside view, wheels large, rolling along the plank -->
    <g transform="translate(415 415) rotate(-23)">
      <!-- back wheel -->
      <g transform="translate(-95 0)">
        <ellipse rx="70" ry="24" fill="#000000" stroke="#ffffff" stroke-width="6"/>
        <ellipse rx="52" ry="16" fill="none" stroke="#ffffff" stroke-width="2"/>
        <g stroke="#ffffff" stroke-width="2">
          <line x1="-50" y1="0" x2="50" y2="0"/>
          <line x1="-35" y1="-11" x2="35" y2="11"/>
          <line x1="-35" y1="11" x2="35" y2="-11"/>
          <line x1="0" y1="-16" x2="0" y2="16"/>
        </g>
      </g>
      <!-- front wheel -->
      <g transform="translate(105 0)">
        <ellipse rx="70" ry="24" fill="#000000" stroke="#ffffff" stroke-width="6"/>
        <ellipse rx="52" ry="16" fill="none" stroke="#ffffff" stroke-width="2"/>
        <g stroke="#ffffff" stroke-width="2">
          <line x1="-50" y1="0" x2="50" y2="0"/>
          <line x1="-35" y1="-11" x2="35" y2="11"/>
          <line x1="-35" y1="11" x2="35" y2="-11"/>
          <line x1="0" y1="-16" x2="0" y2="16"/>
        </g>
      </g>
      <!-- frame seen from underneath: down tube, chainstays, bottom bracket -->
      <g stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="-95" y1="0" x2="5" y2="-4"/>
        <line x1="5" y1="-4" x2="105" y2="0"/>
        <line x1="5" y1="-4" x2="40" y2="-60"/>
        <line x1="5" y1="-4" x2="-30" y2="-58"/>
        <line x1="-30" y1="-58" x2="40" y2="-60"/>
      </g>
      <!-- chainring and pedals -->
      <circle cx="5" cy="-4" r="16" fill="#000000" stroke="#ffffff" stroke-width="4"/>
      <circle cx="5" cy="-4" r="4" fill="#ffffff"/>
      <line x1="5" y1="-4" x2="-15" y2="18" stroke="#ffffff" stroke-width="5"/>
      <line x1="5" y1="-4" x2="25" y2="-26" stroke="#ffffff" stroke-width="5"/>
      <rect x="-27" y="14" width="22" height="9" fill="#ffffff"/>
      <rect x="18" y="-33" width="22" height="9" fill="#ffffff"/>
      <!-- pelican's big webbed feet slapping the pedals -->
      <path d="M -16 20 l -22 14 l 8 -12 l -14 8 l 12 -14 l -10 -6 z" fill="#f5d800" stroke="#000000" stroke-width="2"/>
      <path d="M 29 -30 l 22 -14 l -8 12 l 14 -8 l -12 14 l 10 6 z" fill="#f5d800" stroke="#000000" stroke-width="2"/>

      <!-- PELICAN, seen from below: belly, wings gripping bars, huge pouch swinging down -->
      <ellipse cx="5" cy="-70" rx="52" ry="38" fill="#ffffff" stroke="#000000" stroke-width="4"/>
      <!-- belly shading in hard bands (lamp is below/center) -->
      <path d="M -40 -60 Q 5 -20 50 -60 Q 5 -40 -40 -60 Z" fill="#cfcfcf"/>
      <!-- tail feathers -->
      <path d="M -45 -78 l -35 -20 l 8 22 l -28 -4 l 25 16 z" fill="#ffffff" stroke="#000000" stroke-width="3"/>
      <!-- wings splayed wide, tips to the handlebars -->
      <path d="M -20 -95 C -80 -120, -120 -70, -100 -30 L -60 -50 C -70 -70, -50 -85, -20 -95 Z" fill="#ffffff" stroke="#000000" stroke-width="4"/>
      <path d="M 30 -95 C 90 -120, 130 -70, 110 -30 L 70 -50 C 80 -70, 60 -85, 30 -95 Z" fill="#ffffff" stroke="#000000" stroke-width="4"/>
      <!-- handlebars gripped by wingtips -->
      <path d="M -100 -30 Q 5 -10 110 -30" fill="none" stroke="#ffffff" stroke-width="6"/>
      <!-- neck curving forward and down toward the viewer -->
      <path d="M 40 -85 C 70 -110, 95 -95, 90 -60 C 88 -40, 70 -30, 60 -40" fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
      <path d="M 40 -85 C 70 -110, 95 -95, 90 -60 C 88 -40, 70 -30, 60 -40" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
      <!-- head, viewed from beneath the chin -->
      <ellipse cx="62" cy="-40" rx="24" ry="18" fill="#ffffff" stroke="#000000" stroke-width="4"/>
      <!-- pouch: a huge sagging yellow bag pointing straight down at the lamp -->
      <path d="M 44 -34 C 20 20, 60 60, 90 40 C 115 25, 105 -20, 82 -34 Z" fill="#f5d800" stroke="#000000" stroke-width="4"/>
      <!-- top bill ridge -->
      <path d="M 44 -34 L 100 -32" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
      <!-- a stolen book bulging in the pouch -->
      <rect x="55" y="-5" width="30" height="22" transform="rotate(-15 70 6)" fill="#000000" stroke="#ffffff" stroke-width="2"/>
      <!-- eyes peering down over the pouch, sideways mischievous look -->
      <circle cx="50" cy="-50" r="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
      <circle cx="76" cy="-50" r="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
      <circle cx="47" cy="-52" r="3" fill="#000000"/>
      <circle cx="73" cy="-52" r="3" fill="#000000"/>
      <!-- cheeky eyebrows -->
      <path d="M 41 -60 l 14 -6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
      <path d="M 85 -60 l -14 -6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- a couple of books knocked loose, tumbling down toward the viewer -->
    <rect x="250" y="220" width="54" height="36" transform="rotate(35 277 238)" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <rect x="256" y="226" width="42" height="24" transform="rotate(35 277 238)" fill="none" stroke="#000000" stroke-width="2"/>
    <rect x="560" y="620" width="70" height="46" transform="rotate(-50 595 643)" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <rect x="568" y="628" width="54" height="30" transform="rotate(-50 595 643)" fill="none" stroke="#000000" stroke-width="2"/>
    <!-- motion ticks -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <line x1="235" y1="270" x2="222" y2="290"/>
      <line x1="252" y1="282" x2="245" y2="305"/>
      <line x1="640" y1="600" x2="660" y2="585"/>
      <line x1="650" y1="620" x2="672" y2="612"/>
    </g>
    <!-- "SHHH" sign on the plank edge -->
    <rect x="600" y="290" width="70" height="28" transform="rotate(-23 635 304)" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <text x="635" y="311" transform="rotate(-23 635 304)" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">SHHH</text>
  </g>
</svg>