<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Quiet, Please!</title>
  <desc id="desc">A mischievous pelican pedals a bicycle over the viewer in a narrow library aisle. Towering black and white bookshelves converge overhead. A single lemon-yellow desk lamp casts hard light and exaggerated shadows.</desc>
