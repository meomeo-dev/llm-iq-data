<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"
     role="img" aria-labelledby="title description">
  <title id="title">The pelican's library shortcut</title>
  <desc id="description">
    A mischievous pelican pedals a bicycle overhead in a narrow library aisle.
    Towering bookshelves converge around the worm's-eye view. A desk lamp casts
    one sharp lemon-yellow beam across the black-and-white scene.
  </desc>

  <defs>
    <clipPath id="leftShelf">
      <path d="M0 0H438L145 1000H0Z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M562 0H1000V1000H855Z"/>
    </clipPath>

    <g id="books" fill="#111" stroke="#fff" stroke-width="3">
      <rect x="0" y="9" width="24" height="105"/>
      <rect x="25" y="1" width="32" height="113"/>
      <rect x="58" y="14" width="19" height="100"/>
      <rect x="79" y="5" width="37" height="109"/>
      <rect x="118" y="19" width="22" height="95"/>
      <rect x="142" y="0" width="27" height="114"/>
      <rect x="171" y="12" width="35" height="102"/>
      <rect x="208" y="4" width="18" height="110"/>
      <rect x="228" y="17" width="31" height="97"/>
      <rect x="261" y="7" width="26" height="107"/>
      <rect x="289" y="13" width="30" height="101"/>
      <path d="M29 27h23M83 34h27M146 26h19M176 39h25
               M231 43h23M265 29h18" stroke-width="2"/>
      <path d="M29 88h23M83 91h27M146 82h19M176 87h25
               M231 83h23M265 88h18" stroke-width="2"/>
    </g>
  </defs>

  <!-- The white opening tapers to the distant ceiling. -->
  <rect width="1000" height="1000" fill="#111"/>
  <path d="M438 0H562L855 1000H145Z" fill="#fff"/>
  <path d="M438 0 145 1000M562 0 855 1000"
        fill="none" stroke="#111" stroke-width="12"/>
  <path d="M442 35H558M428 82H572M414 133H586"
        fill="none" stroke="#111" stroke-width="5"/>

  <!-- Shelf faces and their receding rows. -->
  <g clip-path="url(#leftShelf)">
    <path d="M0 0H440V1000H0Z" fill="#111"/>
    <g opacity=".94">
      <use href="#books" transform="translate(30 35) scale(1.25 .7)"/>
      <use href="#books" transform="translate(7 159) scale(1.25 .85)"/>
      <use href="#books" transform="translate(-15 317) scale(1.2 1.05)"/>
      <use href="#books" transform="translate(-44 517) scale(1.15 1.35)"/>
      <use href="#books" transform="translate(-75 777) scale(1.1 1.8)"/>
    </g>
    <path d="M0 137 426 137M0 298 383 298M0 502 324 502
             M0 762 250 762"
          fill="none" stroke="#fff" stroke-width="15"/>
    <path d="M13 0 8 1000M112 0 27 1000M432 0 145 1000"
          fill="none" stroke="#fff" stroke-width="5"/>
  </g>

  <g clip-path="url(#rightShelf)">
    <path d="M560 0H1000V1000H560Z" fill="#111"/>
    <g transform="translate(1000 0) scale(-1 1)" opacity=".94">
      <use href="#books" transform="translate(30 35) scale(1.25 .7)"/>
      <use href="#books" transform="translate(7 159) scale(1.25 .85)"/>
      <use href="#books" transform="translate(-15 317) scale(1.2 1.05)"/>
      <use href="#books" transform="translate(-44 517) scale(1.15 1.35)"/>
      <use href="#books" transform="translate(-75 777) scale(1.1 1.8)"/>
    </g>
    <path d="M574 137H1000M617 298H1000M676 502H1000
             M750 762H1000"
          fill="none" stroke="#fff" stroke-width="15"/>
    <path d="M987 0 992 1000M888 0 973 1000M568 0 855 1000"
          fill="none" stroke="#fff" stroke-width="5"/>
  </g>

  <!-- A single hard point light and its crisp beam. -->
  <path d="M747 389 224 930 436 1000Z" fill="#f5e44b"/>
  <path d="M747 389 520 130 569 132Z" fill="#f5e44b"/>
  <g fill="none" stroke="#fff" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M1000 255H927L855 334 789 326" stroke-width="16"/>
    <circle cx="928" cy="255" r="13" fill="#111" stroke-width="6"/>
  </g>
  <path d="M779 307 728 318 704 381 765 397 799 348Z"
        fill="#111" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="747" cy="389" r="13" fill="#f5e44b" stroke="#111"
          stroke-width="5"/>

  <!-- Wheels seen from below, crossing the opening overhead. -->
  <g fill="none" stroke="#111" stroke-linecap="round">
    <ellipse cx="322" cy="735" rx="137" ry="112" stroke-width="20"/>
    <ellipse cx="710" cy="735" rx="137" ry="112" stroke-width="20"/>
    <g stroke-width="3.5">
      <path d="M322 623V847M185 735H459M225 656 419 814
               M225 814 419 656M270 632 374 838M270 838 374 632"/>
      <path d="M710 623V847M573 735H847M613 656 807 814
               M613 814 807 656M658 632 762 838M658 838 762 632"/>
    </g>
  </g>

  <!-- Bicycle frame, fork, saddle, and pedals. -->
  <g fill="none" stroke="#111" stroke-width="16"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M322 735 477 564 519 747 322 735
             M477 564 637 555 519 747M637 555 710 735"/>
    <path d="M477 564 466 529M439 526h71M637 555l29-50h48"/>
    <path d="M519 747 547 786h38M519 747l-34-38h-35"/>
  </g>
  <circle cx="519" cy="747" r="22" fill="#fff" stroke="#111"
          stroke-width="10"/>

  <!-- Pelican: wide wing, long bill, deep pouch, and a sly glance. -->
  <path d="M423 450Q338 374 272 409L324 424 263 447 337 459
           283 485 372 480Q402 510 455 512Z"
        fill="#111" stroke="#111" stroke-width="9"
        stroke-linejoin="round"/>
  <path d="M411 450Q448 397 524 420Q582 435 600 489
           Q576 545 501 551Q431 541 405 495Z"
        fill="#fff" stroke="#111" stroke-width="11"/>
  <path d="M460 454Q493 484 540 487M452 476Q479 507 521 509"
        fill="none" stroke="#111" stroke-width="6"
        stroke-linecap="round"/>
  <path d="M534 440Q580 404 589 354Q599 303 648 314
           Q692 322 688 369Q663 405 624 396Q614 473 575 493Z"
        fill="#fff" stroke="#111" stroke-width="11"
        stroke-linejoin="round"/>
  <path d="M668 347Q747 324 837 355L846 374
           Q757 389 687 374Z"
        fill="#f5e44b" stroke="#111" stroke-width="10"
        stroke-linejoin="round"/>
  <path d="M687 374Q740 396 835 376Q821 450 755 459
           Q709 450 687 374Z"
        fill="#fff" stroke="#111" stroke-width="10"
        stroke-linejoin="round"/>
  <path d="M719 404Q761 427 806 403" fill="none"
        stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="650" cy="344" rx="15" ry="19" fill="#111"/>
  <circle cx="655" cy="339" r="5" fill="#fff"/>
  <path d="M624 316Q649 295 670 316" fill="none"
        stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <path d="M578 482Q626 462 654 506L680 517" fill="none"
        stroke="#111" stroke-width="20" stroke-linecap="round"/>
  <path d="M492 541 510 629 485 709M532 533 563 625 548 785"
        fill="none" stroke="#111" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M449 709h51M548 785h42" fill="none"
        stroke="#111" stroke-width="13" stroke-linecap="round"/>

  <!-- Small comic details emphasize the precarious ride. -->
  <g fill="none" stroke="#111" stroke-width="8"
     stroke-linecap="round">
    <path d="M193 545 171 519M218 527 210 493M810 568l26-22
             M826 600l38-8"/>
  </g>
  <path d="M174 363q15-18 32 0l-3 39q-16 13-29 0Z"
        fill="#fff" stroke="#111" stroke-width="6"
        transform="rotate(-18 190 383)"/>
  <path d="M179 378h20M183 390h12" stroke="#111"
        stroke-width="3" fill="none"/>
</svg>