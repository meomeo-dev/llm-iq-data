<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF44F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF44F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="books" width="30" height="60" patternUnits="userSpaceOnUse">
      <rect width="30" height="60" fill="#111"/>
      <rect x="2" y="4" width="7" height="52" fill="#eee"/>
      <rect x="11" y="10" width="5" height="46" fill="#777"/>
      <rect x="18" y="2" width="9" height="54" fill="#ddd"/>
      <rect x="0" y="56" width="30" height="4" fill="#000"/>
    </pattern>
  </defs>

  <!-- 天花板上的一线天 -->
  <rect width="600" height="800" fill="#000"/>
  <polygon points="250,0 350,0 330,400 270,400" fill="#fafafa"/>

  <!-- 向上汇聚的书架 -->
  <polygon points="0,0 250,0 270,400 250,800 0,800" fill="url(#books)"/>
  <polygon points="600,0 350,0 330,400 350,800 600,800" fill="url(#books)"/>
  <polygon points="0,0 250,0 270,400 250,800 0,800" fill="#000" opacity="0.35"/>
  <polygon points="600,0 350,0 330,400 350,800 600,800" fill="#000" opacity="0.55"/>
  <g stroke="#000" stroke-width="6">
    <line x1="0" y1="200" x2="262" y2="230"/><line x1="600" y1="200" x2="338" y2="230"/>
    <line x1="0" y1="560" x2="262" y2="520"/><line x1="600" y1="560" x2="338" y2="520"/>
  </g>
  <line x1="255" y1="400" x2="345" y2="400" stroke="#fff" stroke-width="3"/>

  <!-- 台灯：唯一的硬点光源 -->
  <polygon points="160,470 300,120 440,470" fill="url(#glow)" opacity="0.6"/>
  <circle cx="160" cy="470" r="60" fill="url(#glow)"/>
  <path d="M120,490 L150,440 L200,460 Z" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="160" cy="470" r="9" fill="#FFF44F"/>
  <line x1="130" y1="490" x2="60" y2="560" stroke="#fff" stroke-width="5"/>

  <!-- 玻璃走道，从下往上看 -->
  <rect x="150" y="250" width="300" height="190" fill="#fff" opacity="0.12" stroke="#fff" stroke-width="2"/>

  <!-- 自行车（仰视） -->
  <g stroke="#fff" stroke-width="5" fill="none">
    <circle cx="220" cy="380" r="45"/>
    <circle cx="380" cy="380" r="45"/>
    <path d="M220,380 L280,380 L340,320 L380,380 M280,380 L260,320 L340,320 M340,320 L350,295"/>
    <path d="M335,295 L368,290" stroke-linecap="round"/>
  </g>

  <!-- 鹈鹕（肚皮朝下，镜头看到的是它的下侧） -->
  <ellipse cx="275" cy="290" rx="60" ry="40" fill="#fff" stroke="#000" stroke-width="3"/>
  <path d="M300,265 Q320,210 345,205" stroke="#fff" stroke-width="16" fill="none"/>
  <circle cx="348" cy="200" r="18" fill="#fff" stroke="#000" stroke-width="3"/>
  <path d="M362,195 L440,215 L362,212 Q390,235 360,215 Z" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="352" cy="195" r="3" fill="#000"/>
  <path d="M340,188 L356,184" stroke="#000" stroke-width="3"/>
  <!-- 偷来的书 -->
  <rect x="400" y="205" width="26" height="18" fill="#000" stroke="#fff" stroke-width="2" transform="rotate(12 413 214)"/>
  <!-- 踩脚踏的腿 -->
  <path d="M265,320 L285,378 M290,320 L270,370" stroke="#000" stroke-width="5"/>
  <!-- 翅膀扶着车把 -->
  <path d="M300,280 Q340,270 355,292" stroke="#000" stroke-width="4" fill="#fff"/>

  <text x="300" y="760" fill="#fff" font-family="monospace" font-size="18" text-anchor="middle">SHHH.</text>
</svg>