<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200"
     viewBox="0 0 1000 1200" fill="none">
  <title>The midnight checkout</title>
  <desc>
    A mischievous pelican bicycles overhead in a narrow library aisle,
    seen from directly below. Towering bookshelves converge toward the
    ceiling. Foreshortened wheels, a round belly, and broad webbed soles
    loom above the viewer. One articulated desk lamp supplies hard light;
    its lemon-yellow bulb is the only colored accent.
  </desc>

