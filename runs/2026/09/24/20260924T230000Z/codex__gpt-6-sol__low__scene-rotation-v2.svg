<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">The library getaway</title>
  <desc id="desc">A mischievous pelican rides a bicycle through a towering library aisle, seen from the floor looking straight up. A lemon-yellow desk lamp casts a hard beam of light.</desc>
  <defs>
    <pattern id="books" width="76" height="132" patternUnits="userSpaceOnUse">
      <rect width="76" height="132" fill="#fff"/>
      <path d="M0 0V132M13 0V132M31 0V132M51 0V132M75 0V132M4 17h7M17 31h10M35 19h12M55 41h15M3 83h8M17 94h10M36 76h11M55 105h14" fill="none" stroke="#111" stroke-width="3"/>
      <path d="M0 130H76" stroke="#111" stroke-width="7"/>
    </pattern>
    <clipPath id="leftShelf"><path d="M0 0H342L302 710 0 1000Z"/></clipPath>
    <clipPath id="rightShelf"><path d="M458 0H800V1000L498 710Z"/></clipPath>
  </defs>

  <rect width="800" height="1000" fill="#fff"/>

  <!-- Shelves rise away from the viewer toward a small patch of ceiling. -->
  <g clip-path="url(#leftShelf)">
    <rect x="0" width="350" height="1000" fill="url(#books)"/>
    <path d="M0 134H350M0 307H340M0 495H324M0 710H306" stroke="#111" stroke-width="15"/>
    <path d="M75 0 135 1000M230 0 245 1000" stroke="#111" stroke-width="9"/>
  </g>
  <g clip-path="url(#rightShelf)">
    <rect x="450" width="350" height="1000" fill="url(#books)"/>
    <path d="M450 134H800M460 307H800M476 495H800M494 710H800" stroke="#111" stroke-width="15"/>
    <path d="M725 0 665 1000M570 0 555 1000" stroke="#111" stroke-width="9"/>
  </g>
  <path d="M342 0 302 710 0 1000M458 0 498 710 800 1000" fill="none" stroke="#111" stroke-width="16"/>
  <path d="M342 0 400 110 458 0M302 710 400 790 498 710" fill="none" stroke="#111" stroke-width="7"/>

  <!-- A single desk lamp, perched impossibly high among the books. -->
  <path d="M717 397 636 346 591 405" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
  <circle cx="636" cy="346" r="11" fill="#111"/>
  <path d="M565 382 611 384 630 425 550 422Z" fill="#fff" stroke="#111" stroke-width="7"/>
  <path d="M551 423H628L671 492 506 477Z" fill="#f5df37" stroke="#111" stroke-width="6"/>
  <path d="M574 430 426 730 673 495" fill="#f5df37" opacity=".23"/>

  <!-- Bicycle wheels loom large from the low viewpoint. -->
  <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="390" cy="846" rx="232" ry="112" stroke-width="17"/>
    <ellipse cx="390" cy="846" rx="204" ry="90" stroke-width="4"/>
    <ellipse cx="414" cy="553" rx="108" ry="64" stroke-width="12"/>
    <ellipse cx="414" cy="553" rx="91" ry="51" stroke-width="3"/>
    <path d="M390 846 316 644 465 654 390 846 542 676 465 654 414 553M316 644 414 553M542 676 414 553" stroke-width="13"/>
    <path d="M328 641h-70m264 16 40-42 71 5m-178 33 22-49h64" stroke-width="11"/>
    <path d="M390 846v-99m-145 99h290m-121-293v-49m-67 49 135 1" stroke-width="3" opacity=".65"/>
    <circle cx="390" cy="846" r="17" fill="#fff" stroke-width="7"/>
    <circle cx="414" cy="553" r="9" fill="#fff" stroke-width="5"/>
  </g>

  <!-- Rider: wing on the bar, feet pedaling, beak tilted in a grin. -->
  <path d="M371 597q-58-79-30-154 18-47 75-49 55 5 68 60l-7 110q-40 57-106 33Z" fill="#fff" stroke="#111" stroke-width="9"/>
  <path d="M359 515q-81-17-107 54 44-27 102 3m95-59q67-2 103 76" fill="#fff" stroke="#111" stroke-width="9" stroke-linecap="round"/>
  <path d="M380 578 338 660l-58 47m164-117 35 99 59 25" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M276 703q-22 2-31 17m296-7q26 4 35 18" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round"/>

  <path d="M377 426q-35-23-27-73 10-60 69-67 50-5 75 41 13 26 2 57l-34 59Z" fill="#fff" stroke="#111" stroke-width="9"/>
  <path d="M461 361q65-15 127 11-53 13-115 18-2 48-36 60-43-3-66-37" fill="#fff" stroke="#111" stroke-width="8" stroke-linejoin="round"/>
  <path d="M474 390q46 1 99-13" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="443" cy="338" r="10" fill="#111"/>
  <circle cx="447" cy="334" r="3" fill="#fff"/>
  <path d="M423 315q23-13 43-3M367 352q-17-17-10-40" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
  <path d="M382 447q24 15 44 2" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>

  <!-- Speed marks and a startled book complete the comic beat. -->
  <path d="M195 627 133 610m62 46-83-6m504 90 73-28m-63 51 80-8" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <g transform="rotate(-24 580 263)">
    <rect x="546" y="222" width="68" height="84" fill="#fff" stroke="#111" stroke-width="6"/>
    <path d="M559 222v84m10-59h30m-30 15h22" fill="none" stroke="#111" stroke-width="4"/>
  </g>
  <path d="m570 184-6-15m30 21 14-12m-52 34-16-2" stroke="#111" stroke-width="5" stroke-linecap="round"/>
</svg>