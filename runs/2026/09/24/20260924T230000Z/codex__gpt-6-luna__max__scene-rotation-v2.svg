<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"
     role="img" aria-labelledby="title desc">
  <title id="title">The Pelican’s Midnight Ride</title>
  <desc id="desc">
    A mischievous pelican pedals a bicycle beneath a hard-lit desk lamp,
    seen looking straight up through a towering library aisle.
  </desc>

  <rect width="1000" height="1000" fill="#000"/>

  <!-- The shelves narrow toward the overhead vanishing point. -->
  <g fill="#fff">
    <path d="M0 0H390L165 1000H0Z"/>
    <path d="M610 0H1000V1000H835Z"/>
  </g>

  <!-- Shelf faces and book rows. -->
  <g fill="#000" stroke="#000" stroke-linejoin="round">
    <path d="M0 185L350 238L346 255L0 205Z"/>
    <path d="M0 435L294 493L290 511L0 455Z"/>
    <path d="M0 690L237 746L233 764L0 710Z"/>
    <path d="M0 895L189 941L185 958L0 915Z"/>

    <path d="M1000 185L650 238L654 255L1000 205Z"/>
    <path d="M1000 435L706 493L710 511L1000 455Z"/>
    <path d="M1000 690L763 746L767 764L1000 710Z"/>
    <path d="M1000 895L811 941L815 958L1000 915Z"/>
  </g>

  <g fill="#000" stroke="#000" stroke-width="3">
    <path d="M18 55L67 62L67 181L18 174Z"/>
    <path d="M73 43L119 51L119 190L73 183Z"/>
    <path d="M125 52L171 58L171 199L125 191Z"/>
    <path d="M178 35L225 43L225 210L178 202Z"/>
    <path d="M231 50L271 56L271 218L231 211Z"/>
    <path d="M277 66L325 73L325 228L277 220Z"/>

    <path d="M15 278L60 287L60 428L15 419Z"/>
    <path d="M67 289L110 298L110 439L67 430Z"/>
    <path d="M117 274L165 284L165 451L117 442Z"/>
    <path d="M172 301L214 309L214 462L172 454Z"/>
    <path d="M221 315L267 324L267 476L221 467Z"/>

    <path d="M0 523L43 533L43 677L0 667Z"/>
    <path d="M49 532L94 543L94 689L49 678Z"/>
    <path d="M101 550L145 560L145 703L101 693Z"/>
    <path d="M151 566L196 577L196 719L151 708Z"/>

    <path d="M0 759L39 768L39 883L0 874Z"/>
    <path d="M46 769L87 780L87 896L46 886Z"/>
    <path d="M94 785L133 795L133 908L94 898Z"/>
    <path d="M141 801L176 810L176 920L141 911Z"/>
  </g>

  <!-- White spine marks suggest worn titles without lettering. -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M31 78V113M31 123V151M87 66V102M87 113V158
             M139 76V121M192 64V99M192 111V168M245 73V108
             M245 119V178M290 88V130M290 141V190"
          stroke-width="4"/>
    <path d="M28 305V342M80 313V359M132 304V355M187 331V371
             M236 346V389M16 548V585M66 556V608M119 573V618
             M167 591V633M15 778V810M62 790V830M110 803V843
             M155 820V851"
          stroke-width="4"/>
    <path d="M20 163L65 170M75 171L117 178M180 190L223 197
             M16 407L59 416M120 431L164 441M0 650L42 660
             M103 678L144 688M0 858L38 868M95 886L132 896"
          stroke-width="3"/>
  </g>

  <!-- Crisp aisle edges and receding shelf lines. -->
  <g fill="none" stroke="#000" stroke-linecap="round">
    <path d="M390 0L165 1000M610 0L835 1000" stroke-width="18"/>
    <path d="M0 185L350 238M0 435L294 493M0 690L237 746
             M0 895L189 941"
          stroke="#fff" stroke-width="5"/>
    <path d="M1000 185L650 238M1000 435L706 493
             M1000 690L763 746M1000 895L811 941"
          stroke="#fff" stroke-width="5"/>
  </g>

  <!-- A hard-edged pool of light from the single desk lamp. -->
  <path d="M632 311L360 715L784 710Z" fill="#fff"/>

  <!-- Lamp, articulated out from the right bookshelf. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M843 226L804 226L772 248"
          fill="none" stroke="#000" stroke-width="30"/>
    <path d="M843 226L804 226L772 248"
          fill="none" stroke="#fff" stroke-width="17"/>
    <circle cx="772" cy="248" r="15" fill="#fff" stroke="#000"
            stroke-width="7"/>
    <path d="M772 248L703 260L647 289"
          fill="none" stroke="#000" stroke-width="28"/>
    <path d="M772 248L703 260L647 289"
          fill="none" stroke="#fff" stroke-width="15"/>
    <circle cx="703" cy="260" r="13" fill="#fff" stroke="#000"
            stroke-width="6"/>

    <path d="M608 270Q632 256 660 272L650 315Q629 303 603 317Z"
          fill="#000" stroke="#fff" stroke-width="8"/>
    <path d="M607 306Q631 295 652 306"
          fill="none" stroke="#fff" stroke-width="5"/>
    <circle cx="629" cy="307" r="9" fill="#F4D21F" stroke="#000"
            stroke-width="3"/>
  </g>

  <!-- Bicycle wheels, foreshortened from directly below. -->
  <g fill="none">
    <g transform="rotate(-7 350 642)">
      <ellipse cx="350" cy="642" rx="108" ry="62"
               stroke="#000" stroke-width="20"/>
      <ellipse cx="350" cy="642" rx="108" ry="62"
               stroke="#fff" stroke-width="11"/>
      <ellipse cx="350" cy="642" rx="91" ry="49"
               stroke="#000" stroke-width="3"/>
      <g stroke="#000" stroke-width="4">
        <path d="M242 642H458M350 580V704M273 606L427 678
                 M273 678L427 606M292 590L408 694M292 694L408 590"/>
      </g>
      <circle cx="350" cy="642" r="9" fill="#fff" stroke="#000"
              stroke-width="4"/>
    </g>

    <g transform="rotate(-7 655 612)">
      <ellipse cx="655" cy="612" rx="108" ry="62"
               stroke="#000" stroke-width="20"/>
      <ellipse cx="655" cy="612" rx="108" ry="62"
               stroke="#fff" stroke-width="11"/>
      <ellipse cx="655" cy="612" rx="91" ry="49"
               stroke="#000" stroke-width="3"/>
      <g stroke="#000" stroke-width="4">
        <path d="M547 612H763M655 550V674M578 576L732 648
                 M578 648L732 576M597 560L713 664M597 664L713 560"/>
      </g>
      <circle cx="655" cy="612" r="9" fill="#fff" stroke="#000"
              stroke-width="4"/>
    </g>
  </g>

  <!-- Frame tubes use black borders so they read in the lamp beam. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 642L442 507L520 620L350 642
             M442 507L592 482L520 620
             M592 482L655 612L520 620"
          stroke="#000" stroke-width="22"/>
    <path d="M350 642L442 507L520 620L350 642
             M442 507L592 482L520 620
             M592 482L655 612L520 620"
          stroke="#fff" stroke-width="11"/>
    <path d="M592 482L610 452L637 450M605 464L627 481"
          stroke="#000" stroke-width="17"/>
    <path d="M592 482L610 452L637 450M605 464L627 481"
          stroke="#fff" stroke-width="8"/>
    <path d="M442 507L424 488L465 492"
          stroke="#000" stroke-width="19"/>
    <path d="M442 507L424 488L465 492"
          stroke="#fff" stroke-width="9"/>
    <path d="M520 620L538 648M504 648H552"
          stroke="#000" stroke-width="15"/>
    <path d="M520 620L538 648M504 648H552"
          stroke="#fff" stroke-width="7"/>
    <circle cx="520" cy="620" r="12" fill="#fff" stroke="#000"
            stroke-width="5"/>
  </g>

  <!-- Webbed feet pump the pedals. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M474 475Q465 525 478 559L516 618
             M510 477Q520 526 548 558L536 646"
          stroke="#000" stroke-width="19"/>
    <path d="M474 475Q465 525 478 559L516 618
             M510 477Q520 526 548 558L536 646"
          stroke="#fff" stroke-width="9"/>
    <path d="M506 615L522 622L515 637L499 629Z
             M529 640L544 642L545 658L527 656Z"
          fill="#fff" stroke="#000" stroke-width="5"/>
    <path d="M515 626L526 630M538 650L550 652"
          stroke="#000" stroke-width="4"/>
  </g>

  <!-- Pelican tail and body. -->
  <path d="M425 422Q393 402 376 419Q397 443 429 449Z"
        fill="#fff" stroke="#000" stroke-width="9"/>
  <path d="M466 379Q430 405 443 458Q451 500 495 514
           Q546 504 560 458Q567 411 532 379Z"
        fill="#fff" stroke="#000" stroke-width="10"/>

  <!-- Wing with comic feather marks. -->
  <path d="M472 408Q500 386 537 409Q535 449 499 472
           Q475 460 461 440Z"
        fill="#000" stroke="#000" stroke-width="7"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="5">
    <path d="M477 432Q493 427 508 410M484 446Q504 439 520 418
             M493 458Q514 449 527 430"/>
  </g>

  <!-- Long neck and head. -->
  <path d="M474 431Q438 393 451 352Q461 320 496 304
           Q521 295 541 313Q518 345 511 379Q507 410 526 432Z"
        fill="#fff" stroke="#000" stroke-width="10"/>
  <ellipse cx="527" cy="317" rx="49" ry="38"
           fill="#fff" stroke="#000" stroke-width="9"/>

  <!-- A lifted brow and sideways glance. -->
  <path d="M535 294Q553 281 567 293"
        fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="544" cy="311" rx="10" ry="13" fill="#000"/>
  <ellipse cx="548" cy="307" rx="3" ry="4" fill="#fff"/>

  <!-- Oversized bill and pouch give the rider its pelican silhouette. -->
  <path d="M566 308Q620 290 711 328Q676 354 625 356
           Q591 356 568 337Z"
        fill="#fff" stroke="#000" stroke-width="9"
        stroke-linejoin="round"/>
  <path d="M568 333Q602 365 647 363Q676 361 697 344
           Q674 382 633 384Q590 380 568 343Z"
        fill="#fff" stroke="#000" stroke-width="9"
        stroke-linejoin="round"/>
  <path d="M578 338Q624 356 676 344"
        fill="none" stroke="#000" stroke-width="5"
        stroke-linecap="round"/>
  <ellipse cx="585" cy="323" rx="5" ry="3" fill="#000"/>

  <!-- A few sharp speed marks sell the wobbling midnight ride. -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <path d="M270 493Q309 477 335 492"/>
    <path d="M243 521Q283 505 310 518"/>
    <path d="M697 433Q724 419 746 430"/>
  </g>
</svg>