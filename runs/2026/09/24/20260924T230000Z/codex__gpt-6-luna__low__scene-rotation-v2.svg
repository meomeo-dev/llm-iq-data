<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle in a library aisle</title>
  <desc id="desc">A comic black-and-white worm’s-eye view straight up between towering bookshelves. A pelican pedals a bicycle beneath a single lemon-yellow desk lamp.</desc>

  <defs>
    <pattern id="book-spines" width="54" height="110" patternUnits="userSpaceOnUse">
      <rect width="54" height="110" fill="#111"/>
      <path d="M3 5h20v45H3zM27 8h23v42H27zM4 59h21v47H4zM29 58h21v48H29z"
            fill="#f6f4ed" stroke="#111" stroke-width="3"/>
      <path d="M8 14h10M8 20h10M32 17h13M32 23h13M9 68h11M33 68h12"
            stroke="#111" stroke-width="2"/>
      <path d="M13 5v45M39 8v42M15 59v47M39 58v48"
            stroke="#111" stroke-width="1"/>
    </pattern>
    <pattern id="shelf-lines" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M0 95H100" stroke="#f6f4ed" stroke-width="8"/>
      <path d="M0 100H100" stroke="#111" stroke-width="4"/>
    </pattern>
    <clipPath id="left-shelf">
      <path d="M0 0H242L350 800H0Z"/>
    </clipPath>
    <clipPath id="right-shelf">
      <path d="M558 0H800V800H450Z"/>
    </clipPath>
    <radialGradient id="beam">
      <stop offset="0" stop-color="#fff" stop-opacity=".96"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="#080808"/>
  <path d="M0 0H242L350 800H0Z" fill="url(#book-spines)" clip-path="url(#left-shelf)"/>
  <path d="M558 0H800V800H450Z" fill="url(#book-spines)" clip-path="url(#right-shelf)"/>
  <path d="M0 0H242L350 800H0Z" fill="url(#shelf-lines)" opacity=".65"/>
  <path d="M558 0H800V800H450Z" fill="url(#shelf-lines)" opacity=".65"/>

  <path d="M0 0L350 800M800 0L450 800" stroke="#f6f4ed" stroke-width="10"/>
  <path d="M350 800L400 690L450 800" fill="#171717" stroke="#f6f4ed" stroke-width="4"/>
  <path d="M0 760L350 690M800 760L450 690" stroke="#f6f4ed" stroke-width="3" opacity=".8"/>

  <!-- One hard point light and its sharply defined cone -->
  <path d="M400 96L250 475H550Z" fill="#fff" opacity=".1"/>
  <ellipse cx="400" cy="380" rx="255" ry="300" fill="url(#beam)"/>
  <path d="M357 89Q400 55 443 89L431 111H369Z" fill="#f6f4ed" stroke="#111" stroke-width="6"/>
  <path d="M369 109H431L419 126H381Z" fill="#111"/>
  <path d="M385 126V148M415 126V148M385 148Q400 159 415 148"
        fill="none" stroke="#f6f4ed" stroke-width="5"/>
  <path d="M375 110H425" stroke="#f2d426" stroke-width="9" stroke-linecap="round"/>
  <circle cx="400" cy="112" r="8" fill="#f2d426"/>

  <!-- Bicycle wheels -->
  <g fill="none" stroke="#111" stroke-width="16">
    <circle cx="282" cy="586" r="104"/>
    <circle cx="529" cy="586" r="104"/>
  </g>
  <g fill="none" stroke="#f6f4ed" stroke-width="5">
    <circle cx="282" cy="586" r="99"/>
    <circle cx="529" cy="586" r="99"/>
  </g>
  <g stroke="#f6f4ed" stroke-width="3" opacity=".9">
    <path d="M282 487V685M183 586H381M212 516L352 656M212 656L352 516"/>
    <path d="M529 487V685M430 586H628M459 516L599 656M459 656L599 516"/>
  </g>
  <g fill="#f6f4ed" stroke="#111" stroke-width="5">
    <circle cx="282" cy="586" r="10"/>
    <circle cx="529" cy="586" r="10"/>
  </g>

  <!-- Frame, fork, pedals, and handlebars -->
  <g fill="none" stroke="#111" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M282 586L377 477L430 586L282 586L342 475"/>
    <path d="M430 586L529 586L483 456"/>
    <path d="M483 456L467 428H513"/>
    <path d="M342 475L321 449H280"/>
    <path d="M377 477L388 449"/>
  </g>
  <g fill="none" stroke="#f6f4ed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M282 586L377 477L430 586L282 586L342 475"/>
    <path d="M430 586L529 586L483 456"/>
    <path d="M483 456L467 428H513"/>
    <path d="M342 475L321 449H280"/>
  </g>
  <circle cx="430" cy="586" r="15" fill="#111" stroke="#f6f4ed" stroke-width="5"/>
  <path d="M430 586L399 617M430 586L465 557M388 617H411M454 557H477"
        stroke="#111" stroke-width="8" stroke-linecap="round"/>

  <!-- Mischievous pelican -->
  <path d="M364 405Q353 345 383 310Q415 276 457 304Q485 325 472 373L454 436L388 449Z"
        fill="#f6f4ed" stroke="#111" stroke-width="9"/>
  <path d="M382 334Q344 301 334 264Q329 241 347 237Q366 233 377 258L408 304Z"
        fill="#111" stroke="#f6f4ed" stroke-width="5"/>
  <path d="M414 307Q407 267 425 245Q437 230 450 241Q462 252 450 270L445 320Z"
        fill="#f6f4ed" stroke="#111" stroke-width="7"/>
  <path d="M427 303Q474 286 518 300Q538 307 532 320Q527 331 506 326L455 342Z"
        fill="#f2d426" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
  <path d="M445 326Q477 327 501 346Q493 366 465 367Q445 359 438 341Z"
        fill="#f2d426" stroke="#111" stroke-width="6"/>
  <path d="M466 341Q483 348 501 346" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="412" cy="286" r="10" fill="#fff" stroke="#111" stroke-width="5"/>
  <circle cx="415" cy="285" r="4" fill="#111"/>
  <path d="M403 270Q414 261 425 270" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <path d="M402 357Q421 379 454 374L443 422L399 423Z" fill="#111"/>
  <path d="M395 436L371 471M451 429L475 451" stroke="#111" stroke-width="13" stroke-linecap="round"/>
  <path d="M371 471L350 468M475 451L490 434" stroke="#f6f4ed" stroke-width="8" stroke-linecap="round"/>
  <path d="M395 438L386 485M448 436L427 478" stroke="#f6f4ed" stroke-width="13" stroke-linecap="round"/>
  <path d="M386 485L405 497M427 478L448 480" stroke="#111" stroke-width="11" stroke-linecap="round"/>
  <path d="M379 382Q392 374 402 385" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <path d="M385 394Q399 403 410 394" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

  <!-- Tiny comic motion marks -->
  <path d="M315 266L298 247M330 250L326 226M492 270L508 252"
        stroke="#f6f4ed" stroke-width="5" stroke-linecap="round"/>
  <path d="M252 720Q400 748 557 720" fill="none" stroke="#f6f4ed" stroke-width="3" opacity=".65"/>
</svg>