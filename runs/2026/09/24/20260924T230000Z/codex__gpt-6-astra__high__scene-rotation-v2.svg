<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100"
     viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">An improper use of the library aisle</title>
  <desc id="desc">
    A mischievous pelican with a lemon-yellow bill rides a bicycle overhead.
    Seen from the bottom of a narrow library aisle, immense black and white
    bookshelves converge above it. A single articulated desk lamp throws
    hard light across the bird, bicycle, and tumbling books.
  </desc>

  <defs>
    <pattern id="hatching" width="12" height="12"
             patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <path d="M0 0V12" stroke="#fff" stroke-width="2"/>
    </pattern>
    <pattern id="bookSpines" width="57" height="180"
             patternUnits="userSpaceOnUse">
      <rect width="57" height="180" fill="#000"/>
      <path d="M3 0V180M24 0V180M31 0V180M53 0V180"
            fill="none" stroke="#fff" stroke-width="2"/>
      <path d="M7 17H20M7 24H20M7 149H20M35 39H49M35 44H49M35 160H49"
            fill="none" stroke="#fff" stroke-width="3"/>
      <rect x="9" y="51" width="9" height="37" fill="#fff"/>
      <path d="M39 70V118M44 70V118" stroke="#fff" stroke-width="2"/>
    </pattern>

    <g id="spokes" fill="none" stroke="#fff" stroke-width="2.5">
      <circle r="164" stroke-width="4"/>
      <circle r="149" stroke-width="2"/>
      <path d="M0-158V158M-158 0H158
               M-112-112L112 112M-112 112L112-112
               M-61-146L61 146M-146-61L146 61
               M-146 61L146-61M-61 146L61-146"/>
      <circle r="18" fill="#000" stroke-width="5"/>
      <circle r="6" fill="#fff" stroke="none"/>
    </g>

    <clipPath id="leftShelf">
      <path d="M0 0H401L439 81 274 1100H0Z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M900 0H503L461 81 712 1100H900Z"/>
    </clipPath>
  </defs>

  <!-- The aisle closes to a vanishing point almost directly overhead. -->
  <rect width="900" height="1100" fill="#000"/>
  <path d="M438 74L185 1100H772L465 74Z" fill="#fff"/>
  <path d="M438 74L317 1100H185Z" fill="#000"/>
  <path d="M465 74L772 1100H723Z" fill="#000"/>
  <path d="M405 0L449 73 494 0M0 0L449 73 900 0"
        fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M430 31L448 61 468 31Z" fill="#fff"/>

  <!-- Left tower: the shelves and book rows are strongly foreshortened. -->
  <g clip-path="url(#leftShelf)">
    <path d="M0 0H401L439 81 274 1100H0Z" fill="#000"/>
    <g fill="url(#bookSpines)" stroke="#fff" stroke-width="2">
      <path d="M0 50L410 91 403 132 0 122Z"/>
      <path d="M0 154L397 157 387 216 0 259Z"/>
      <path d="M0 298L382 246 368 330 0 432Z"/>
      <path d="M0 485L361 370 342 482 0 659Z"/>
      <path d="M0 725L332 529 308 677 0 944Z"/>
      <path d="M0 1034L296 738 252 1009 173 1100H0Z"/>
    </g>
    <g fill="#fff">
      <path d="M0 123L404 132 402 142 0 141Z"/>
      <path d="M0 260L388 216 385 230 0 282Z"/>
      <path d="M0 433L369 330 365 348 0 462Z"/>
      <path d="M0 660L343 482 338 504 0 697Z"/>
      <path d="M0 945L309 677 303 706 0 994Z"/>
    </g>
    <g stroke="#fff" fill="none">
      <path d="M78 0L431 80 211 1100" stroke-width="8"/>
      <path d="M255 0L434 80 256 1100" stroke-width="3"/>
      <path d="M0 590L347 443M0 866L318 622" stroke-width="2"/>
    </g>
    <path d="M0 754L332 540 325 581 0 825Z" fill="url(#hatching)"/>
  </g>

  <!-- Right tower. -->
  <g clip-path="url(#rightShelf)">
    <path d="M900 0H503L461 81 712 1100H900Z" fill="#000"/>
    <g fill="url(#bookSpines)" stroke="#fff" stroke-width="2">
      <path d="M900 44L491 92 501 136 900 116Z"/>
      <path d="M900 147L508 164 523 222 900 254Z"/>
      <path d="M900 295L531 253 551 336 900 430Z"/>
      <path d="M900 478L562 378 590 494 900 658Z"/>
      <path d="M900 725L602 546 640 699 900 945Z"/>
      <path d="M900 1037L654 756 722 1050 770 1100H900Z"/>
    </g>
    <g fill="#fff">
      <path d="M900 117L500 136 503 147 900 139Z"/>
      <path d="M900 255L523 222 527 237 900 281Z"/>
      <path d="M900 431L551 336 556 357 900 463Z"/>
      <path d="M900 659L590 494 597 520 900 697Z"/>
      <path d="M900 946L640 699 648 731 900 995Z"/>
    </g>
    <path d="M825 0L466 81 771 1100" fill="none"
          stroke="#fff" stroke-width="8"/>
    <path d="M638 0L465 81 732 1100" fill="none"
          stroke="#fff" stroke-width="3"/>
  </g>

  <!-- One hard point source; its cone interrupts the dark right-hand shelves. -->
  <path d="M747 235L239 1100H900V748L777 221Z" fill="#fff"/>
  <path d="M784 383L821 521 900 573V542L826 493Z" fill="#000"/>
  <path d="M823 447L870 308 773 178" fill="none"
        stroke="#000" stroke-width="20" stroke-linejoin="round"/>
  <path d="M823 447L870 308 773 178" fill="none"
        stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
  <g stroke="#000" stroke-width="5">
    <path d="M788 448Q830 424 864 447L875 468 790 481Z" fill="#fff"/>
    <circle cx="870" cy="308" r="14" fill="#fff"/>
    <circle cx="870" cy="308" r="4" fill="#000"/>
    <circle cx="773" cy="178" r="11" fill="#fff"/>
    <path d="M738 166Q754 153 770 171L800 214 699 260
             706 204Z" fill="#fff"/>
    <path d="M708 204L738 176 724 226 701 250Z" fill="#000"/>
    <ellipse cx="750" cy="237" rx="55" ry="12"
             transform="rotate(-25 750 237)" fill="#000"/>
    <ellipse cx="750" cy="239" rx="14" ry="7"
             transform="rotate(-25 750 239)" fill="#fff" stroke="none"/>
  </g>

  <!-- A dislodged book, seen from beneath. -->
  <g stroke="#000" stroke-linejoin="round">
    <path d="M172 360L232 332 271 380 211 417Z" fill="#fff" stroke-width="5"/>
    <path d="M172 360L181 380 215 428 211 417Z" fill="#000" stroke-width="4"/>
    <path d="M211 417L271 380 276 390 215 428Z" fill="#fff" stroke-width="4"/>
    <path d="M219 420L268 391M218 415L268 385" fill="none" stroke-width="2"/>
    <path d="M191 366L229 347M197 375L237 354" stroke-width="3"/>
  </g>
  <g fill="none" stroke="#000" stroke-linecap="round">
    <path d="M169 325Q153 302 163 286M188 318Q180 304 185 294"
          stroke-width="4"/>
    <path d="M301 192L308 213M279 207L294 225" stroke-width="5"/>
  </g>

  <!-- Wheels loom above the viewer; the near wheel is enlarged. -->
  <g transform="translate(274 858) rotate(-16) scale(1.03 1.30)">
    <circle r="176" fill="#000"/>
    <circle r="174" fill="none" stroke="#fff" stroke-width="3"/>
    <use href="#spokes"/>
    <path d="M-157-72A173 173 0 0 1 43-167"
          fill="none" stroke="#fff" stroke-width="6"/>
  </g>
  <g transform="translate(666 808) rotate(13) scale(.90 1.18)">
    <circle r="176" fill="#000"/>
    <circle r="174" fill="none" stroke="#fff" stroke-width="3"/>
    <use href="#spokes"/>
    <path d="M-159-60A171 171 0 0 1 70-155"
          fill="none" stroke="#fff" stroke-width="6"/>
  </g>

  <!-- Far pedal and chain, visible below the frame. -->
  <path d="M467 838L541 760" fill="none" stroke="#000" stroke-width="13"/>
  <path d="M528 757L567 765" fill="none" stroke="#000"
        stroke-width="15" stroke-linecap="round"/>
  <path d="M276 838L467 810Q508 831 484 861L280 878Z"
        fill="#000" stroke="#fff" stroke-width="3"/>
  <path d="M285 846L465 819M288 869L473 853"
        fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- The bicycle's two triangles remain readable from the low angle. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M274 858L387 644 472 838 274 858
             M387 644L581 608 472 838
             M581 608L666 808"
          stroke="#000" stroke-width="23"/>
    <path d="M274 858L387 644 472 838 274 858
             M387 644L581 608 472 838
             M581 608L666 808"
          stroke="#fff" stroke-width="10"/>
    <path d="M589 610Q610 696 650 803"
          stroke="#000" stroke-width="9"/>
    <path d="M387 644L371 601M581 608L566 548 613 524"
          stroke="#000" stroke-width="16"/>
    <path d="M387 639L376 610M580 600L570 551 613 530"
          stroke="#fff" stroke-width="5"/>
    <path d="M607 525Q638 512 647 533Q652 551 632 561"
          stroke="#000" stroke-width="14"/>
    <path d="M601 543Q636 587 607 640"
          stroke="#000" stroke-width="3"/>
  </g>
  <path d="M335 596Q359 582 405 593L422 606
           Q393 621 345 614Z" fill="#000" stroke="#fff" stroke-width="3"/>
  <circle cx="472" cy="838" r="36" fill="#000" stroke="#fff" stroke-width="4"/>
  <circle cx="472" cy="838" r="24" fill="none" stroke="#fff"
          stroke-width="3" stroke-dasharray="3 6"/>
  <path d="M472 838L407 907" stroke="#fff" stroke-width="9"/>
  <path d="M384 909L425 922" stroke="#000" stroke-width="16"
        stroke-linecap="round"/>
  <path d="M386 904L426 916" stroke="#fff" stroke-width="3"/>

  <!-- Far leg: a bent knee and webbed foot push the high pedal. -->
  <path d="M427 569Q492 613 477 665L530 739
           553 746 568 766Q541 780 516 761L456 690
           Q428 668 440 637L400 596Z"
        fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <path d="M447 605Q475 637 461 669L534 755 553 759"
        fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/>
  <path d="M529 746L541 762M544 748L552 763"
        stroke="#000" stroke-width="3"/>

  <!-- Pelican body and swept-back tail. -->
  <path d="M343 449L269 470 305 484 245 505 313 513
           274 547 352 542Z" fill="#000" stroke="#fff" stroke-width="3"/>
  <path d="M403 368
           C356 371 321 408 318 466
           C307 536 346 596 407 614
           C454 628 492 596 497 548
           C501 506 473 476 472 443
           L470 380Z"
        fill="#fff" stroke="#000" stroke-width="8"/>
  <path d="M326 456Q322 543 397 570Q450 590 487 551
           Q489 611 430 617Q363 617 331 564
           Q303 518 326 456Z" fill="#000"/>
  <path d="M338 508Q362 546 400 550M344 490Q367 526 391 528"
        fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- Near leg extends toward the viewer, ending in an oversized webbed foot. -->
  <path d="M390 582Q417 591 424 614
           L402 719Q395 737 411 753
           L426 839 454 870
           446 891 417 883 395 894 367 877
           390 851 380 768
           Q361 739 375 705Z"
        fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <path d="M394 612L384 713Q373 740 390 762L403 850 379 876
           395 884 419 867 442 886 448 873 421 844
           408 750Q393 738 402 715L423 618Z" fill="#000"/>
  <path d="M393 856L401 875M413 851L424 875"
        fill="none" stroke="#fff" stroke-width="3"/>

  <!-- Curving neck, cheek, and extravagant pelican pouch. -->
  <path d="M391 412
           C385 370 404 345 405 308
           C380 276 392 229 431 211
           C463 196 500 208 513 237
           C526 267 509 291 493 313
           C475 344 485 379 477 421
           Q439 450 391 412Z"
        fill="#fff" stroke="#000" stroke-width="8"/>
  <path d="M411 309Q444 320 448 342
           Q419 369 419 415L397 414
           Q392 381 408 349Z" fill="#000"/>
  <path d="M494 278L673 309
           C643 355 605 405 554 416
           C523 422 493 393 490 366
           Q485 327 472 305Z"
        fill="#fff" stroke="#000" stroke-width="7"/>
  <path d="M501 332Q516 403 564 401
           Q612 396 655 331
           Q604 417 557 420
           Q506 420 494 371Z" fill="#000"/>
  <path d="M514 329Q532 372 557 381M530 329Q548 361 569 369"
        fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>

  <!-- The only chromatic accent. -->
  <path d="M482 263
           Q536 267 601 284
           L684 305
           Q699 311 680 320
           Q620 331 563 314
           L485 293
           Q472 279 482 263Z"
        fill="#f2e52b" stroke="#000" stroke-width="7"
        stroke-linejoin="round"/>
  <path d="M493 289Q578 308 681 311" fill="none"
        stroke="#000" stroke-width="3"/>
  <path d="M488 278L505 281" stroke="#000" stroke-width="4"
        stroke-linecap="round"/>

  <!-- A conspiratorial eye, raised eyebrow, and unruly crown. -->
  <path d="M440 254Q458 239 477 250Q476 271 458 274
           Q444 271 440 254Z" fill="#fff" stroke="#000" stroke-width="4"/>
  <ellipse cx="467" cy="257" rx="6" ry="10" fill="#000"/>
  <circle cx="469" cy="253" r="2" fill="#fff"/>
  <path d="M438 250L478 248M441 232Q455 220 474 229"
        fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <path d="M418 222L403 200 427 207 425 183 445 202
           456 185 461 205"
        fill="#fff" stroke="#000" stroke-width="5"
        stroke-linejoin="round"/>
  <path d="M473 295Q480 307 494 307" fill="none"
        stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- Wing reaches forward and curls firmly around the handlebar. -->
  <path d="M435 438
           Q461 422 481 450
           L526 515
           Q547 536 587 525
           Q600 519 608 529
           L617 542
           Q617 553 607 554
           L596 543
           Q566 564 533 554
           Q478 539 446 502
           Q419 473 435 438Z"
        fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <path d="M446 470Q481 522 531 543Q565 553 592 536
           L600 546Q567 567 531 554Q479 539 446 502Z" fill="#000"/>
  <path d="M452 449Q472 480 495 501M447 465Q466 493 483 507"
        fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <path d="M596 529L608 543M588 533L600 547"
        stroke="#000" stroke-width="3" stroke-linecap="round"/>

  <!-- Tiny bell and a very inappropriate ring. -->
  <path d="M615 514Q609 493 625 488Q642 490 640 511Z"
        fill="#fff" stroke="#000" stroke-width="4"/>
  <path d="M610 514L645 510M626 488L625 482"
        stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round">
    <path d="M648 482Q661 490 660 502M655 472Q676 484 674 505"/>
    <path d="M603 482Q594 491 598 502"/>
  </g>

  <!-- Comic speed scratches run past the low camera. -->
  <g fill="none" stroke="#000" stroke-linecap="round">
    <path d="M507 986L489 1054M531 1006L524 1042M574 966L604 1032"
          stroke-width="5"/>
    <path d="M110 655L84 690M128 670L113 693M775 633L802 664"
          stroke-width="4"/>
  </g>

  <!-- A rule the rider has clearly interpreted creatively. -->
  <g transform="translate(72 566) rotate(-27)">
    <rect x="-49" y="-34" width="98" height="68"
          fill="#fff" stroke="#000" stroke-width="5"/>
    <path d="M-43-28H43V28H-43Z" fill="none" stroke="#000" stroke-width="2"/>
    <text x="0" y="-5" fill="#000" text-anchor="middle"
          font-family="monospace" font-size="14" font-weight="bold">QUIET</text>
    <text x="0" y="16" fill="#000" text-anchor="middle"
          font-family="monospace" font-size="14" font-weight="bold">PLEASE</text>
  </g>

  <rect x="9" y="9" width="882" height="1082"
        fill="none" stroke="#fff" stroke-width="2"/>
</svg>