  <path d="M347 352q-22 4-32 17m93 5q29 6 54-4" fill="none" stroke="#111" stroke-width="4"/>

  <path d="M184 747q33-18 48 11m-29 29q31-13 48 12M634 407q28-28 52-8m-38 35q31-17 55 2" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <path d="M72 896h142m-125 20h93M616 945h130m-103 20h78" stroke="#111" stroke-width="7" stroke-linecap="round"/>
