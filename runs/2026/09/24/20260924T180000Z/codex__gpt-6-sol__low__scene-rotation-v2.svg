<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">The library aisle getaway</title>
  <desc id="desc">A mischievous pelican rides a bicycle overhead in a towering library aisle, lit by one lemon-yellow desk lamp.</desc>
  <defs>
    <pattern id="books" width="90" height="124" patternUnits="userSpaceOnUse">
      <rect width="90" height="124" fill="#fff"/>
      <path d="M0 0V124M90 0V124M0 40H90M0 84H90" stroke="#111" stroke-width="7"/>
      <path d="M9 6v29m9-29v29m12-29v29m19-29v29m8-29v29m14-29v29M8 48v30m14-30v30m8-30v30m18-30v30m12-30v30m14-30v30M10 91v27m12-27v27m16-27v27m10-27v27m18-27v27" stroke="#111" stroke-width="3"/>
      <path d="M12 18h4m36 0h4M34 62h10m21 0h5M25 105h8m37 0h5" stroke="#111" stroke-width="2"/>
    </pattern>
    <clipPath id="leftShelf"><path d="M0 0H320L370 390 310 1000H0Z"/></clipPath>
    <clipPath id="rightShelf"><path d="M800 0H480L430 390 490 1000H800Z"/></clipPath>
    <radialGradient id="light" cx="50%" cy="42%" r="53%">
      <stop stop-color="#fff8c2"/>
      <stop offset=".25" stop-color="#f4dc43"/>
      <stop offset="1" stop-color="#e2bd16"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="#fff"/>
  <!-- Shelves rise away from the viewer toward the ceiling. -->
  <path d="M0 0H320L370 390 310 1000H0Z M800 0H480L430 390 490 1000H800Z" fill="url(#books)" stroke="#111" stroke-width="12"/>
  <g clip-path="url(#leftShelf)" stroke="#111" fill="none">
    <path d="M0 198 344 265M0 510 337 505M0 835 318 755" stroke-width="15"/>
    <path d="M70 0 120 1000M225 0 260 1000" stroke-width="8"/>
  </g>
  <g clip-path="url(#rightShelf)" stroke="#111" fill="none">
    <path d="M800 198 456 265M800 510 463 505M800 835 482 755" stroke-width="15"/>
    <path d="M730 0 680 1000M575 0 540 1000" stroke-width="8"/>
  </g>
  <path d="M320 0 370 390 310 1000M480 0 430 390 490 1000" fill="none" stroke="#111" stroke-width="13"/>
  <path d="M320 0H480L430 390H370Z" fill="#fff" stroke="#111" stroke-width="10"/>
  <path d="M341 0 383 390m76-390-42 390M330 91h140M344 194h112M357 294h86" fill="none" stroke="#111" stroke-width="5"/>

  <!-- The only color comes from the lamp and its hard pool of light. -->
  <path d="M319 1000 397 384 481 1000Z" fill="#f4dc43" opacity=".2"/>
  <path d="M85 667h116m-57 0-22-67m22 67 32-91m-54 24 28-17 26 5" fill="none" stroke="#111" stroke-width="9" stroke-linejoin="round"/>
  <path d="M149 583q38-25 61 10l-73 18Z" fill="#111"/>
  <path d="M136 611q33 8 74-18l-18 46q-26 15-53 0Z" fill="url(#light)" stroke="#111" stroke-width="7"/>
  <circle cx="164" cy="625" r="7" fill="#111"/>
  <path d="M150 653 273 719" stroke="#111" stroke-width="12"/>

  <!-- Near wheel is oversized for the straight-up perspective. -->
  <g stroke="#111" fill="none">
    <ellipse cx="555" cy="738" rx="178" ry="188" stroke-width="16"/>
    <ellipse cx="555" cy="738" rx="159" ry="169" stroke-width="4"/>
    <ellipse cx="292" cy="468" rx="85" ry="94" stroke-width="13"/>
    <ellipse cx="292" cy="468" rx="72" ry="81" stroke-width="3"/>
