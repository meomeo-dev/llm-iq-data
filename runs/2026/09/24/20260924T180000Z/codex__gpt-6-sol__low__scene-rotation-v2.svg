  <circle cx="292" cy="468" r="11" fill="#fff" stroke="#111" stroke-width="7"/>
  <circle cx="405" cy="635" r="18" fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M405 635 373 588m32 47 35 25m-80-80h28m42 81h37M408 434h57" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>

