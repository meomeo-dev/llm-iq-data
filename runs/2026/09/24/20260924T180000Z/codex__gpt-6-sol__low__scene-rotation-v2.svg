  <path d="M371 518 351 574m78-47 41 38" stroke="#111" stroke-width="12" stroke-linecap="round"/>
  <path d="M335 572h37m83-8h38" stroke="#111" stroke-width="10" stroke-linecap="round"/>
  <path d="M358 324q-2-52 35-67 37-13 63 18 15 18 11 57" fill="#fff" stroke="#111" stroke-width="10"/>
  <path d="M389 262q-6-24 8-38m12 35q0-28 17-41m10 48q9-25 24-30" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
