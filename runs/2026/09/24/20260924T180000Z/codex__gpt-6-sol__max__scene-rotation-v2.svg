<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100"
     role="img" aria-label="A mischievous pelican rides a bicycle through a towering library aisle, seen from below">
  <defs>
    <clipPath id="leftShelf">
      <path d="M0 0 420 125 150 1100H0Z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M900 0 480 125 750 1100h150Z"/>
    </clipPath>
    <pattern id="spines" width="43" height="150"
             patternUnits="userSpaceOnUse">
      <path d="M5 0v150M17 0v150M37 0v150M7 28h9M7 117h9
