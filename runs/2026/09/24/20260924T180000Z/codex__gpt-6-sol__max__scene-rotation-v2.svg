            fill="none" stroke="#111" stroke-width="2.5"/>
      <path d="M26 67h7v16h-7z" fill="none" stroke="#111"
            stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Towering shelves frame the narrow opening overhead. -->
  <rect width="900" height="1100" fill="#111"/>
  <path d="M0 0 420 125 150 1100H0Z
           M900 0 480 125 750 1100h150Z"
        fill="#fff"/>
