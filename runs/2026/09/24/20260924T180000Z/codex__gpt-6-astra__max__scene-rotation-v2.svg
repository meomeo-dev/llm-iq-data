<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="1200" viewBox="0 0 1000 1200"
     role="img" aria-labelledby="title description">
  <title id="title">A very quiet getaway</title>
  <desc id="description">
    A mischievous pelican pedals a bicycle directly above the viewer in a
    narrow library aisle. Towering bookshelves converge around the overhead
    view; the bird's belly, webbed feet, and foreshortened wheels loom close.
    A single articulated desk lamp casts hard, angular shadows. Its lemon
    yellow reflector is the only color in the black and white illustration.
  </desc>

