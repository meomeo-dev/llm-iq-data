<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"
     role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle in a library</title>
  <desc id="desc">
    A winking pelican pedals beneath a desk lamp, framed by towering bookshelves
    in a dramatic worm's-eye view.
  </desc>

  <defs>
    <clipPath id="leftShelf">
      <path d="M0 0H455L230 1000H0Z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M545 0H1000V1000H770Z"/>
    </clipPath>

    <symbol id="book" viewBox="0 0 32 120">
      <path d="M2 4Q15 0 30 4L29 116Q15 112 2 118Z"
            fill="#fff" stroke="#111" stroke-width="3"
            stroke-linejoin="round"/>
      <path d="M7 9L25 7V111L7 114Z" fill="none"
            stroke="#111" stroke-width="2"/>
      <path d="M12 12V111M20 10V112M8 29L24 27M8 91L24 89"
            fill="none" stroke="#111" stroke-width="2"/>
    </symbol>

    <symbol id="darkBook" viewBox="0 0 32 120">
      <path d="M2 4Q15 0 30 4L29 116Q15 112 2 118Z"
            fill="#111" stroke="#fff" stroke-width="3"
            stroke-linejoin="round"/>
      <path d="M7 9L25 7V111L7 114Z" fill="none"
            stroke="#fff" stroke-width="2"/>
      <path d="M12 12V111M20 10V112M8 29L24 27M8 91L24 89"
            fill="none" stroke="#fff" stroke-width="2"/>
    </symbol>

    <g id="bookRow">
      <use href="#book" x="0" width="29" height="112"/>
      <use href="#book" x="30" width="29" height="112"/>
      <use href="#book" x="60" width="29" height="112"/>
      <use href="#darkBook" x="90" width="29" height="112"/>
      <use href="#book" x="120" width="29" height="112"/>
      <use href="#book" x="150" width="29" height="112"/>
      <use href="#book" x="180" width="29" height="112"/>
      <use href="#book" x="210" width="29" height="112"/>
      <use href="#darkBook" x="240" width="29" height="112"/>
      <use href="#book" x="270" width="29" height="112"/>
      <use href="#book" x="300" width="29" height="112"/>
      <use href="#book" x="330" width="29" height="112"/>
      <use href="#book" x="360" width="29" height="112"/>
      <use href="#darkBook" x="390" width="29" height="112"/>
      <use href="#book" x="420" width="29" height="112"/>
      <use href="#book" x="450" width="29" height="112"/>
    </g>
  </defs>

  <rect width="1000" height="1000" fill="#fff"/>

  <path d="M0 0H455L230 1000H0Z" fill="#111"/>
  <path d="M545 0H1000V1000H770Z" fill="#111"/>

  <!-- A sharply bounded beam opens across the dark shelves. -->
  <path d="M505 145L110 1000H890Z" fill="#fff"/>

  <g clip-path="url(#leftShelf)">
    <use href="#bookRow" x="4" y="13"/>
    <use href="#bookRow" x="4" y="174"/>
    <use href="#bookRow" x="4" y="335"/>
    <use href="#bookRow" x="4" y="496"/>
    <use href="#bookRow" x="4" y="657"/>
    <use href="#bookRow" x="4" y="818"/>
  </g>

  <g clip-path="url(#rightShelf)" transform="translate(1000 0) scale(-1 1)">
    <use href="#bookRow" x="4" y="13"/>
    <use href="#bookRow" x="4" y="174"/>
    <use href="#bookRow" x="4" y="335"/>
    <use href="#bookRow" x="4" y="496"/>
    <use href="#bookRow" x="4" y="657"/>
    <use href="#bookRow" x="4" y="818"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#111" stroke-width="20">
      <path d="M0 153L421 139M0 314L385 300M0 475L349 461
               M0 636L313 622M0 797L276 783M0 958L240 944"/>
      <path d="M1000 153L579 139M1000 314L615 300M1000 475L651 461
               M1000 636L687 622M1000 797L724 783M1000 958L760 944"/>
    </g>
    <g stroke="#fff" stroke-width="12">
      <path d="M0 153L421 139M0 314L385 300M0 475L349 461
               M0 636L313 622M0 797L276 783M0 958L240 944"/>
      <path d="M1000 153L579 139M1000 314L615 300M1000 475L651 461
               M1000 636L687 622M1000 797L724 783M1000 958L760 944"/>
    </g>
  </g>

  <path d="M0 0H455L230 1000M1000 0H545L770 1000"
        fill="none" stroke="#fff" stroke-width="8"/>

  <!-- Lamp arm and shade -->
  <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <path d="M908 20Q824 30 749 53L651 71L548 104"
          stroke-width="14"/>
    <path d="M908 20Q824 30 749 53L651 71L548 104"
          stroke="#fff" stroke-width="4"/>
    <circle cx="749" cy="53" r="11" fill="#fff" stroke="#111" stroke-width="7"/>
    <circle cx="651" cy="71" r="11" fill="#fff" stroke="#111" stroke-width="7"/>
    <circle cx="548" cy="104" r="10" fill="#fff" stroke="#111" stroke-width="7"/>
  </g>
  <path d="M476 91Q510 78 542 92L568 138Q510 157 452 138Z"
        fill="#fff" stroke="#111" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="510" cy="140" r="12" fill="#F2E343" stroke="#111" stroke-width="5"/>

  <!-- Speed marks -->
  <g fill="none" stroke="#111" stroke-width="7" stroke-linecap="round">
    <path d="M283 536H239M270 555H222M286 574H249"/>
    <path d="M719 504H761M731 523H779M715 542H753"/>
  </g>

  <!-- Bicycle wheels -->
  <g transform="translate(345 640)">
    <circle r="106" fill="#fff" stroke="#111" stroke-width="14"/>
    <g fill="none" stroke="#111" stroke-width="3">
      <path d="M0-91V91"/>
      <path d="M0-91V91" transform="rotate(30)"/>
      <path d="M0-91V91" transform="rotate(60)"/>
      <path d="M0-91V91" transform="rotate(90)"/>
      <path d="M0-91V91" transform="rotate(120)"/>
      <path d="M0-91V91" transform="rotate(150)"/>
    </g>
    <circle r="91" fill="none" stroke="#111" stroke-width="3"/>
    <circle r="12" fill="#fff" stroke="#111" stroke-width="6"/>
  </g>
  <g transform="translate(655 640)">
    <circle r="106" fill="#fff" stroke="#111" stroke-width="14"/>
    <g fill="none" stroke="#111" stroke-width="3">
      <path d="M0-91V91"/>
      <path d="M0-91V91" transform="rotate(30)"/>
      <path d="M0-91V91" transform="rotate(60)"/>
      <path d="M0-91V91" transform="rotate(90)"/>
      <path d="M0-91V91" transform="rotate(120)"/>
      <path d="M0-91V91" transform="rotate(150)"/>
    </g>
    <circle r="91" fill="none" stroke="#111" stroke-width="3"/>
    <circle r="12" fill="#fff" stroke="#111" stroke-width="6"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="15">
      <path d="M345 640L500 620L655 640L598 442L422 460Z"/>
      <path d="M345 640L422 460M422 460L500 620M598 442L500 620"/>
      <path d="M598 442L620 425L650 428"/>
      <path d="M422 460L397 460L374 467"/>
    </g>
    <g stroke="#fff" stroke-width="5">
      <path d="M345 640L500 620L655 640L598 442L422 460Z"/>
      <path d="M345 640L422 460M422 460L500 620M598 442L500 620"/>
      <path d="M598 442L620 425L650 428"/>
      <path d="M422 460L397 460L374 467"/>
    </g>
  </g>
  <circle cx="500" cy="620" r="27" fill="#fff" stroke="#111" stroke-width="7"/>
  <path d="M500 620L524 592M500 620L480 650"
        fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <path d="M512 585H537M468 655H492"
        fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <path d="M401 452Q421 444 441 451M581 435Q603 426 628 433"
        fill="none" stroke="#111" stroke-width="11" stroke-linecap="round"/>

  <!-- Pelican neck and body -->
  <path d="M472 374Q488 344 490 312Q491 285 512 269L541 279
           Q519 302 518 331L511 379Z"
        fill="#fff" stroke="#111" stroke-width="9" stroke-linejoin="round"/>
  <path d="M407 365Q423 333 463 333Q495 335 510 365
           Q521 390 497 419Q474 447 435 428Q402 412 399 387Z"
        fill="#fff" stroke="#111" stroke-width="10" stroke-linejoin="round"/>

  <!-- Folded wing -->
  <path d="M419 369Q441 348 467 356Q489 363 498 382
           Q478 390 447 414Q427 403 419 369Z"
        fill="#fff" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
  <g fill="none" stroke="#111" stroke-width="4" stroke-linecap="round">
    <path d="M432 376Q449 386 460 401"/>
    <path d="M445 366Q462 379 472 391"/>
    <path d="M459 365Q475 374 484 383"/>
  </g>

  <!-- Pelican's beak and pouch -->
  <path d="M540 257Q609 243 691 269Q703 273 691 282L605 296
           Q601 324 580 346Q559 350 552 324L541 288Z"
        fill="#fff" stroke="#111" stroke-width="9" stroke-linejoin="round"/>

  <!-- Head and mischievous wink -->
  <path d="M495 272Q492 246 512 235Q535 224 553 240
           Q568 254 557 274Q547 294 522 292Q502 290 495 272Z"
        fill="#fff" stroke="#111" stroke-width="9" stroke-linejoin="round"/>
  <path d="M513 258Q524 250 535 258"
        fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <path d="M510 244Q524 237 539 244"
        fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>

  <!-- Pedaling legs -->
  <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <path d="M445 419Q456 449 462 478L495 540L520 588"
          stroke-width="11"/>
    <path d="M477 418Q490 445 487 478L471 531L481 650"
          stroke-width="11"/>
    <path d="M495 540L505 548M471 531L461 536"
          stroke-width="9"/>
  </g>
  <path d="M520 588Q529 580 539 588L537 596L520 596Z"
        fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
  <path d="M481 650Q470 644 463 651L466 660L483 659Z"
        fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/>

  <!-- Wing reaching for the handlebars -->
  <path d="M483 369Q516 363 542 383L585 428"
        fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>
  <path d="M483 369Q516 363 542 383L585 428"
        fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="591" cy="435" r="12" fill="#fff" stroke="#111" stroke-width="6"/>

  <rect x="9" y="9" width="982" height="982" fill="none"
        stroke="#111" stroke-width="14"/>
</svg>