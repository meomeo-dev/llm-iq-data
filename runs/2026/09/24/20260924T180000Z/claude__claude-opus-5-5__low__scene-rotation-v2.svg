<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#FFF44F" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF44F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="books" width="22" height="60" patternUnits="userSpaceOnUse">
      <rect width="22" height="60" fill="#111"/>
      <rect x="2" y="4" width="6" height="54" fill="#fff"/>
      <rect x="10" y="10" width="4" height="48" fill="#888"/>
      <rect x="16" y="2" width="5" height="56" fill="#ddd"/>
    </pattern>
  </defs>

  <!-- ceiling, far above -->
  <rect width="600" height="800" fill="#000"/>
  <polygon points="250,0 350,0 330,120 270,120" fill="#fff"/>

  <!-- left shelf wall converging upward -->
  <polygon points="0,800 0,0 250,0 270,120 200,800" fill="url(#books)"/>
  <g stroke="#fff" stroke-width="4">
    <line x1="0" y1="640" x2="215" y2="660"/>
    <line x1="0" y1="460" x2="230" y2="500"/>
    <line x1="0" y1="290" x2="245" y2="340"/>
    <line x1="0" y1="140" x2="258" y2="200"/>
  </g>
  <!-- right shelf wall -->
  <polygon points="600,800 600,0 350,0 330,120 400,800" fill="url(#books)"/>
  <g stroke="#fff" stroke-width="4">
    <line x1="600" y1="640" x2="385" y2="660"/>
    <line x1="600" y1="460" x2="370" y2="500"/>
    <line x1="600" y1="290" x2="355" y2="340"/>
    <line x1="600" y1="140" x2="342" y2="200"/>
  </g>

  <!-- desk lamp on right shelf, hard point light -->
  <polygon points="380,330 120,800 600,800 600,420" fill="url(#glow)" opacity="0.55"/>
  <g stroke="#fff" stroke-width="5" fill="#000">
    <line x1="420" y1="290" x2="450" y2="240"/>
    <line x1="450" y1="240" x2="400" y2="215"/>
    <polygon points="385,200 420,225 395,250 365,230"/>
  </g>
  <circle cx="385" cy="235" r="9" fill="#FFF44F"/>

  <!-- pelican on bicycle, seen from below, leaping over the aisle -->
  <g transform="translate(300,430) rotate(-12)">
    <!-- hard shadow side -->
    <!-- wheels (from below: thin ellipses) -->
    <ellipse cx="-110" cy="60" rx="18" ry="75" fill="none" stroke="#fff" stroke-width="7"/>
    <ellipse cx="110" cy="60" rx="18" ry="75" fill="none" stroke="#fff" stroke-width="7"/>
    <ellipse cx="-110" cy="60" rx="4" ry="12" fill="#fff"/>
    <ellipse cx="110" cy="60" rx="4" ry="12" fill="#fff"/>
    <!-- frame -->
    <g stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round">
      <polyline points="-110,60 -20,60 30,10 -60,10 -110,60"/>
      <line x1="-20" y1="60" x2="110" y2="60"/>
      <line x1="30" y1="10" x2="110" y2="60"/>
      <line x1="30" y1="10" x2="40" y2="-30"/>
      <line x1="20" y1="-30" x2="60" y2="-30"/>
      <circle cx="-20" cy="60" r="12"/>
    </g>
    <!-- belly of pelican looming overhead -->
    <ellipse cx="-30" cy="-20" rx="95" ry="60" fill="#fff" stroke="#000" stroke-width="4"/>
    <path d="M-80,-10 Q-30,30 20,-10" fill="none" stroke="#000" stroke-width="3"/>
    <!-- wings flung out -->
    <path d="M-100,-40 Q-200,-120 -240,-40 Q-180,-60 -110,-10Z" fill="#fff" stroke="#000" stroke-width="4"/>
    <path d="M30,-50 Q110,-150 170,-110 Q100,-80 40,-20Z" fill="#fff" stroke="#000" stroke-width="4"/>
    <!-- webbed feet on pedals -->
    <path d="M-35,60 l-20,20 l15,0 l5,-10 l5,10 l15,0z" fill="#000" stroke="#fff" stroke-width="3"/>
    <path d="M-5,40 l-10,25 l15,-5 l5,-8 l8,8 l10,-8z" fill="#000" stroke="#fff" stroke-width="3"/>
    <!-- neck and head peeking down at viewer -->
    <path d="M40,-60 Q80,-110 60,-150" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
    <circle cx="60" cy="-155" r="24" fill="#fff" stroke="#000" stroke-width="4"/>
    <!-- mischievous eye and brow -->
    <circle cx="68" cy="-160" r="6" fill="#000"/>
    <circle cx="70" cy="-162" r="2" fill="#fff"/>
    <path d="M55,-176 L80,-168" stroke="#000" stroke-width="4" stroke-linecap="round"/>
    <!-- beak and pouch, grin -->
    <path d="M80,-150 L190,-120 L85,-135Z" fill="#fff" stroke="#000" stroke-width="4"/>
    <path d="M85,-135 Q140,-90 190,-120" fill="#fff" stroke="#000" stroke-width="4"/>
    <path d="M100,-128 Q135,-110 170,-122" fill="none" stroke="#000" stroke-width="2"/>
    <!-- stolen book in pouch -->
    <rect x="120" y="-122" width="30" height="16" fill="#000" transform="rotate(12 135 -114)"/>
  </g>

  <!-- falling books, comic chaos -->
  <g fill="#fff" stroke="#000" stroke-width="3">
    <rect x="140" y="690" width="40" height="55" transform="rotate(-25 160 717)"/>
    <rect x="430" y="650" width="35" height="50" transform="rotate(30 447 675)"/>
  </g>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round">
    <line x1="150" y1="660" x2="140" y2="640"/>
    <line x1="455" y1="620" x2="465" y2="600"/>
  </g>
</svg>