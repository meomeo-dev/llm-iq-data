<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Cyclist</title>
  <desc id="desc">A mischievous pelican rides a bicycle through a towering library aisle, seen from below. A single lemon-yellow desk lamp casts a hard beam overhead.</desc>

  <defs>
    <clipPath id="aisle">
      <path d="M303 38H721L1000 1024H24Z"/>
    </clipPath>
    <pattern id="bookSpines" width="74" height="112" patternUnits="userSpaceOnUse">
      <rect width="74" height="112" fill="#090909"/>
      <path d="M5 5H27V105H5ZM34 10H57V105H34ZM63 0H70V105H63Z"
            fill="#fff"/>
      <path d="M9 19H23M9 24H23M38 28H53M38 33H53M8 89H24M38 91H54"
            fill="none" stroke="#090909" stroke-width="2"/>
      <path d="M15 43v24m34-26v19" stroke="#090909" stroke-width="3"/>
    </pattern>
    <filter id="hardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0"/>
      <feOffset dx="8" dy="10" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".65"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- The dark shaft of the aisle and its towering shelves -->
  <rect width="1024" height="1024" fill="#050505"/>
  <path d="M303 38H721L1000 1024H24Z" fill="#111"/>
  <g clip-path="url(#aisle)" opacity=".96">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bookSpines)"/>
    <path d="M0 94L309 52M0 211L328 169M0 337L349 296M0 472L373 430M0 620L396 579M0 781L425 737M0 957L454 913"
          fill="none" stroke="#fff" stroke-width="13"/>
    <path d="M1024 94L715 52M1024 211L696 169M1024 337L675 296M1024 472L651 430M1024 620L628 579M1024 781L599 737M1024 957L570 913"
          fill="none" stroke="#fff" stroke-width="13"/>
    <path d="M16 0L249 1024M1008 0L775 1024" stroke="#fff" stroke-width="19"/>
    <path d="M60 0L281 1024M965 0L743 1024" stroke="#fff" stroke-width="5" opacity=".8"/>
  </g>
  <path d="M303 38H721L1000 1024H24Z" fill="none" stroke="#fff" stroke-width="12"/>
  <path d="M303 38L24 1024M721 38L1000 1024" stroke="#fff" stroke-width="23"/>

  <!-- The overhead desk lamp: the scene's only lemon-yellow accent -->
  <g stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M787 42L754 117L706 151" fill="none" stroke-width="15"/>
    <circle cx="754" cy="117" r="11" fill="#fff" stroke-width="5"/>
    <path d="M706 151L657 144L637 177L703 194L726 171Z"
          fill="#fff" stroke-width="8"/>
    <path d="M651 176L709 190L704 205L647 190Z"
          fill="#f4db2d" stroke="#090909" stroke-width="5"/>
    <path d="M661 210L591 395L790 395L697 210Z"
          fill="#fff" stroke="none" opacity=".16"/>
    <path d="M673 203L650 282M693 209L733 285"
          fill="none" stroke="#fff" stroke-width="3" opacity=".45"/>
  </g>
  <path d="M787 42L754 117" stroke="#fff" stroke-width="15" stroke-linecap="round"/>

  <!-- Whizz marks -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M251 359l65-30m-83 77l45-19M767 358l-51-19m71 69l-44-15"
          stroke-width="7"/>
    <path d="M272 424l34-14m438 8l34 13" stroke-width="4"/>
  </g>

  <!-- Bicycle, seen from below at a jaunty diagonal -->
  <g filter="url(#hardShadow)" stroke="#090909" stroke-linecap="round"
     stroke-linejoin="round">
    <g fill="none" stroke="#fff">
      <circle cx="340" cy="696" r="132" stroke-width="15"/>
      <circle cx="724" cy="590" r="132" stroke-width="15"/>
      <circle cx="340" cy="696" r="12" fill="#fff" stroke-width="7"/>
      <circle cx="724" cy="590" r="12" fill="#fff" stroke-width="7"/>
      <g stroke-width="4">
        <path d="M340 564V828M208 696H472M247 603L433 789M433 603L247 789"/>
        <path d="M724 458V722M592 590H856M631 497L817 683M817 497L631 683"/>
      </g>
      <path d="M340 696L488 625L568 691L724 590L588 590L488 625L463 737L340 696"
            stroke-width="17"/>
      <path d="M568 691L587 590M552 574L613 574M724 590L772 486L817 481"
            stroke-width="13"/>
      <path d="M453 742L492 750M478 610L520 617"
            stroke-width="14"/>
      <path d="M453 742L476 748M478 610L502 614"
            stroke="#090909" stroke-width="5"/>
    </g>
  </g>

  <!-- Pelican rider: round body, long neck, oversized bill and comic pouch -->
  <g stroke="#090909" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tail feathers -->
    <path d="M416 426L340 390L397 448L318 451L418 476Z"
          fill="#fff" stroke-width="8"/>
    <!-- Body -->
    <path d="M409 407C441 350 530 350 582 396
             C624 434 601 502 539 526
             C482 549 408 510 390 465Z"
          fill="#fff" stroke-width="10"/>
    <!-- Far wing -->
    <path d="M444 407C485 378 546 392 567 425
             C534 420 510 443 490 474
             C470 452 452 432 424 429Z"
          fill="#090909" stroke-width="7"/>
    <path d="M452 418L486 444M471 407L507 434M493 402L527 426"
          fill="none" stroke="#fff" stroke-width="4"/>
    <!-- Long neck -->
    <path d="M511 409C512 352 538 296 566 248
             C580 225 614 230 621 256
             C628 281 604 326 590 365
             L572 431Z"
          fill="#fff" stroke-width="10"/>
    <!-- Head -->
    <path d="M550 251C542 211 562 177 600 170
             C638 163 670 189 672 222
             C674 251 649 273 618 275L580 268Z"
          fill="#fff" stroke-width="9"/>
    <!-- Beak and pouch -->
    <path d="M653 219L774 240L767 260L655 252Z"
          fill="#fff" stroke-width="9"/>
    <path d="M655 248C686 265 736 264 765 253
             C752 292 709 312 671 286
             C657 276 650 262 655 248Z"
          fill="#fff" stroke-width="9"/>
    <!-- Mischievous eye and eyebrow -->
    <ellipse cx="624" cy="207" rx="7" ry="10" fill="#090909" stroke="none"/>
    <path d="M607 187Q628 176 645 190" fill="none" stroke-width="7"/>
    <path d="M689 244L746 250" fill="none" stroke-width="4"/>
    <!-- Jacket bib -->
    <path d="M513 389L564 365L589 406L555 441Z"
          fill="#090909" stroke-width="7"/>
    <path d="M535 393L559 416M550 383L574 405"
          fill="none" stroke="#fff" stroke-width="4"/>
    <!-- Wing on the near side, one hand gripping the handlebar -->
    <path d="M421 414C386 446 393 489 431 508
             C456 521 480 509 495 482
             C470 474 458 450 452 427Z"
          fill="#fff" stroke-width="8"/>
    <path d="M417 459Q443 455 460 470M415 474Q440 471 456 485"
          fill="none" stroke-width="4"/>
    <path d="M452 469L483 488L502 468"
          fill="none" stroke="#fff" stroke-width="12"/>
    <path d="M495 479L509 466"
          fill="none" stroke="#090909" stroke-width="9"/>
    <!-- Legs pedaling -->
    <path d="M478 504L461 568L509 614M548 508L591 555L568 691"
          fill="none" stroke="#fff" stroke-width="13"/>
    <path d="M461 568L449 580M591 555L609 550"
          fill="none" stroke="#fff" stroke-width="9"/>
    <path d="M448 580L468 589M599 550L618 557"
          fill="none" stroke="#090909" stroke-width="5"/>
  </g>

  <!-- Little comic motion burst -->
  <g fill="#fff">
    <path d="M803 333l12-28 7 30 24-17-15 27 29 4-31 8 16 25-26-17-5 31-8-31-21 20 12-29-29-2 30-10-17-22z"/>
    <path d="M227 544l8-20 5 21 18-12-11 18 21 3-22 6 11 18-19-12-4 21-6-21-15 14 9-20-20-2 21-7-12-16z"/>
  </g>
  <text x="512" y="965" text-anchor="middle" fill="#fff"
        font-family="serif" font-size="24" letter-spacing="8">SHHH!</text>
</svg>