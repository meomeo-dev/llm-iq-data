    <circle cx="404" cy="760" r="33" fill="#000" stroke="#fff" stroke-width="4"/>
    <circle cx="404" cy="760" r="22" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M404 760L447 709M404 760L363 811"
          stroke="#000" stroke-width="12"/>
    <path d="M404 760L447 709" stroke="#fff" stroke-width="4"/>
    <path d="M431 710H468M345 813H380"
          stroke="#000" stroke-width="12"/>
  </g>

  <!-- Pelican: belly overhead, folded wing steering, enormous cheeky bill. -->
  <path d="M311 477L248 450 273 495 235 488 292 534 331 523Z"
        fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <path d="M332 511Q340 578 371 615L350 682 359 800
