<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"
     viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">The Library Lane Bandit</title>
  <desc id="desc">
    A mischievous pelican rides a bicycle through a narrow library aisle.
    An extreme low angle looks up past looming wheels toward towering,
    converging bookshelves. A single lemon-yellow desk lamp casts hard
    white light across the otherwise black-and-white scene.
  </desc>
  <defs>
    <pattern id="pages" width="12" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 5H12M0 10H12M0 15H12M0 20H12M0 25H12"
            fill="none" stroke="#000" stroke-width="1"/>
    </pattern>
    <pattern id="spines" width="70" height="130" patternUnits="userSpaceOnUse">
      <rect width="70" height="130" fill="#fff"/>
      <path d="M3 0V130M22 0V130M30 0V130M59 0V130"
            stroke="#000" stroke-width="5"/>
      <path d="M7 15H18M7 22H18M35 104H54M35 111H54"
            stroke="#000" stroke-width="3"/>
      <rect x="35" y="24" width="17" height="40" fill="#000"/>
      <path d="M63 0V130" stroke="#000" stroke-width="8"/>
    </pattern>
    <clipPath id="leftShelf">
      <path d="M0 0H310L347 270 285 1000H0Z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M800 0H490L453 270 515 1000H800Z"/>
    </clipPath>
  </defs>

  <!-- The ceiling is the vanishing field; the shelves close in from below. -->
