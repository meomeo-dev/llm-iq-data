  <!-- A falling book and a hush sign supply the joke. -->
  <g transform="translate(138 399) rotate(-24)">
    <path d="M0 0L68 8 65 85 0  seventy" fill="none"/>
    <path d="M0 0L62 8 70 79 8 69Z"
          fill="#000" stroke="#fff" stroke-width="4"/>
    <path d="M8 7L53 13 60 67 15 61Z"
          fill="url(#pages)" stroke="#fff" stroke-width="3"/>
    <path d="M0 0L8 69 18 76 9 8Z" fill="#fff" stroke="#000" stroke-width="3"/>
  </g>
  <path d="M144 358L158 378M168 346L177 371M195 354L194 376"
        stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(642 105) rotate(12)">
    <rect x="-48" y="-26" width="112" height="54"
          fill="#fff" stroke="#000" stroke-width="5"/>
    <text x="8" y="10" text-anchor="middle" font-family="monospace"
          font-weight="bold" font-size="28" fill="#000">SHH!</text>
  </g>
  <g fill="none" stroke="#000" stroke-width="4" stroke-linecap="round">
