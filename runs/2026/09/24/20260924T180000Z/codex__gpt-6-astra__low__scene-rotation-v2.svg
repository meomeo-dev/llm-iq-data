  <g clip-path="url(#leftShelf)" stroke="#000" stroke-linejoin="round">
    <path d="M0 0H310L347 270 285 1000H0Z" fill="#fff"/>
    <path d="M0 0H298L317 105 0 37Z" fill="url(#spines)" stroke-width="7"/>
    <path d="M0 65L321 126 330 193 0 164Z"
          fill="url(#spines)" stroke-width="7"/>
    <path d="M0 200L333 211 341 268 0 339Z"
          fill="url(#spines)" stroke-width="8"/>
    <path d="M0 382L339 285 329 372 0 564Z"
          fill="url(#spines)" stroke-width="9"/>
    <path d="M0 617L326 393 312 528 0 861Z"
