<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100"
     viewBox="0 0 900 1100" role="img"
     aria-labelledby="title description">
  <title id="title">A Very Improper Library Visitor</title>
  <desc id="description">
    A mischievous pelican pedals a bicycle overhead in a narrow library aisle.
    The worm's-eye perspective sends towering bookshelves toward the ceiling.
    A single desk lamp casts a hard-edged light, with lemon yellow confined
    to its glowing aperture. Everything else is black and white.
  </desc>

