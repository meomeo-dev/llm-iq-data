<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle in a library aisle</title>
  <desc id="desc">A comic black-and-white worm’s-eye view up a narrow library aisle. Towering bookshelves converge overhead around a pelican pedaling a bicycle, lit by one lemon-yellow desk lamp.</desc>

  <defs>
    <pattern id="bookRows" width="86" height="112" patternUnits="userSpaceOnUse">
      <path d="M0 108H86" stroke="#111" stroke-width="5"/>
      <path d="M5 18V101H23V15Z M27 8V101H43V5Z M48 22V101H66V18Z M70 12V101H82V10Z"
            fill="#f7f7f3" stroke="#111" stroke-width="3"/>
      <path d="M9 31H19 M31 25H39 M52 40H62 M73 29H79" stroke="#111" stroke-width="2"/>
      <path d="M9 80H19 M31 78H39 M52 87H62 M73 76H79" stroke="#111" stroke-width="2"/>
    </pattern>
    <clipPath id="leftShelf">
      <path d="M0 0H270L365 1000H0Z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M530 0H800V1000H435Z"/>
    </clipPath>
    <filter id="lampGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#f7f7f3"/>

  <!-- Aisle walls pull toward the high vanishing point. -->
  <path d="M0 0H270L365 1000H0Z" fill="url(#bookRows)" stroke="#111" stroke-width="8"/>
  <path d="M530 0H800V1000H435Z" fill="url(#bookRows)" stroke="#111" stroke-width="8"/>
  <path d="M270 0H530L435 1000H365Z" fill="#fff" stroke="#111" stroke-width="6"/>
  <path d="M270 0L365 1000 M530 0L435 1000" fill="none" stroke="#111" stroke-width="4"/>

  <!-- Floor perspective lines, seen from almost directly below. -->
  <path d="M365 1000L400 270L435 1000 M0 870L400 650L800 870 M0 970L400 730L800 970"
        fill="none" stroke="#111" stroke-width="4"/>
  <path d="M0 0L400 230L800 0" fill="none" stroke="#111" stroke-width="5"/>

  <!-- Single desk lamp and its hard, graphic beam. -->
  <path d="M397 145L250 555L550 555Z" fill="#ffe34f" opacity=".22"/>
  <path d="M391 142L269 530 M409 142L531 530" stroke="#111" stroke-width="3" stroke-dasharray="9 12"/>
  <circle cx="400" cy="155" r="44" fill="#ffe34f" opacity=".38" filter="url(#lampGlow)"/>
  <path d="M400 87V120 M356 139H382 M418 139H444" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <path d="M368 139Q400 105 432 139L421 158H379Z" fill="#ffe34f" stroke="#111" stroke-width="7"/>
  <circle cx="400" cy="162" r="8" fill="#111"/>

  <!-- Exaggerated bicycle wheels, tilted in the overhead perspective. -->
  <g fill="none" stroke="#111" stroke-width="9">
    <ellipse cx="292" cy="704" rx="83" ry="111"/>
    <ellipse cx="526" cy="704" rx="83" ry="111"/>
    <path d="M292 704L395 626L526 704L425 716L395 626L292 704M425 716L526 704"/>
    <path d="M395 626L381 603M366 603H405M526 704L550 653M537 650H563"/>
    <path d="M292 704L292 593M292 704L224 704M292 704L348 790M292 704L236 790
             M526 704L526 593M526 704L594 704M526 704L470 790M526 704L582 790"/>
  </g>
  <circle cx="395" cy="626" r="13" fill="#fff" stroke="#111" stroke-width="7"/>
  <circle cx="425" cy="716" r="13" fill="#fff" stroke="#111" stroke-width="7"/>

  <!-- Pelican, perched comically upright while pedaling. -->
  <path d="M406 420Q445 369 489 411Q516 438 486 489L451 535L389 493Z"
        fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M421 436Q451 408 480 436L455 476L418 471Z" fill="#111"/>
  <path d="M443 405Q427 376 442 337Q455 305 487 312Q518 319 519 351Q520 384 490 414Z"
        fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M489 342Q552 333 596 366Q558 387 497 378Z"
        fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M496 375Q547 383 586 369Q576 416 533 424Q500 414 496 375Z"
        fill="#ffe34f" stroke="#111" stroke-width="7"/>
  <circle cx="489" cy="342" r="6" fill="#111"/>
  <path d="M465 315Q480 286 495 313" fill="none" stroke="#111" stroke-width="6"/>
  <path d="M456 488Q430 523 399 565L425 580L468 524M478 487Q492 535 449 584L474 594L514 536"
        fill="#fff" stroke="#111" stroke-width="8" stroke-linejoin="round"/>
  <path d="M399 565L377 588Q390 602 427 589L425 580M449 584L430 605Q452 617 482 600L474 594"
        fill="#fff" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
  <path d="M431 461L395 626M479 464L526 704" fill="none" stroke="#111" stroke-width="8"/>
  <path d="M424 461L486 461" stroke="#111" stroke-width="7"/>
  <path d="M443 452Q459 443 473 453" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

  <!-- Comic motion marks and a sly wink. -->
  <path d="M332 469L305 452M337 493L305 490M534 455L560 440M541 479L570 479"
        stroke="#111" stroke-width="6" stroke-linecap="round"/>
  <path d="M480 343Q488 336 496 343" fill="none" stroke="#111" stroke-width="3"/>
  <path d="M563 319L576 307M575 333L592 328M561 299L566 282"
        stroke="#111" stroke-width="4" stroke-linecap="round"/>

  <!-- Strong edge shadows keep the aisle narrow and dramatic. -->
  <path d="M0 0H58V1000H0ZM742 0H800V1000H742Z" fill="#111"/>
  <path d="M67 0L146 0L218 1000H143ZM654 0H733L657 1000H582Z"
        fill="#111" opacity=".12"/>
</svg>