<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#e6e6e6"/>
      <stop offset="0.6" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <clipPath id="frame"><rect width="800" height="800"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <!-- dark ceiling / vanishing point -->
    <rect width="800" height="800" fill="#050505"/>
    <circle cx="400" cy="400" r="420" fill="url(#lampGlow)"/>

    <!-- left bookshelf, converging upward to center -->
    <polygon points="0,0 0,800 330,400" fill="#0b0b0b" stroke="#1c1c1c" stroke-width="2"/>
    <g stroke="#2a2a2a" stroke-width="3">
      <line x1="0" y1="60" x2="330" y2="400"/>
      <line x1="0" y1="160" x2="330" y2="400"/>
      <line x1="0" y1="260" x2="330" y2="400"/>
      <line x1="0" y1="360" x2="330" y2="400"/>
      <line x1="0" y1="440" x2="330" y2="400"/>
      <line x1="0" y1="540" x2="330" y2="400"/>
      <line x1="0" y1="640" x2="330" y2="400"/>
      <line x1="0" y1="740" x2="330" y2="400"/>
    </g>
    <!-- left books (rows of spines, lit side toward center) -->
    <g fill="#d9d9d9">
      <polygon points="0,62 0,155 40,180 40,105"/>
      <polygon points="45,108 45,185 80,207 80,140"/>
      <polygon points="85,142 85,209 120,231 120,175"/>
      <polygon points="125,177 125,233 160,254 160,208"/>
      <polygon points="0,262 0,355 40,368 40,285"/>
      <polygon points="45,288 45,370 80,380 80,310"/>
      <polygon points="85,312 85,382 120,390 120,332"/>
      <polygon points="0,442 0,535 40,515 40,432"/>
      <polygon points="45,432 45,513 80,500 80,428"/>
      <polygon points="85,428 85,498 120,488 120,425"/>
      <polygon points="0,642 0,735 40,700 40,615"/>
      <polygon points="45,615 45,698 80,672 80,600"/>
      <polygon points="85,600 85,670 120,650 120,590"/>
    </g>
    <g fill="#111">
      <polygon points="18,70 18,160 26,164 26,74"/>
      <polygon points="60,120 60,195 66,198 66,124"/>
      <polygon points="18,270 18,360 26,362 26,274"/>
      <polygon points="60,300 60,375 66,376 66,304"/>
      <polygon points="18,450 18,530 26,528 26,448"/>
      <polygon points="18,650 18,730 26,722 26,646"/>
      <polygon points="100,610 100,665 106,662 106,608"/>
    </g>

    <!-- right bookshelf -->
    <polygon points="800,0 800,800 470,400" fill="#0b0b0b" stroke="#1c1c1c" stroke-width="2"/>
    <g stroke="#2a2a2a" stroke-width="3">
      <line x1="800" y1="60" x2="470" y2="400"/>
      <line x1="800" y1="160" x2="470" y2="400"/>
      <line x1="800" y1="260" x2="470" y2="400"/>
      <line x1="800" y1="360" x2="470" y2="400"/>
      <line x1="800" y1="440" x2="470" y2="400"/>
      <line x1="800" y1="540" x2="470" y2="400"/>
      <line x1="800" y1="640" x2="470" y2="400"/>
      <line x1="800" y1="740" x2="470" y2="400"/>
    </g>
    <g fill="#d9d9d9">
      <polygon points="800,62 800,155 760,180 760,105"/>
      <polygon points="755,108 755,185 720,207 720,140"/>
      <polygon points="715,142 715,209 680,231 680,175"/>
      <polygon points="675,177 675,233 640,254 640,208"/>
      <polygon points="800,262 800,355 760,368 760,285"/>
      <polygon points="755,288 755,370 720,380 720,310"/>
      <polygon points="715,312 715,382 680,390 680,332"/>
      <polygon points="800,442 800,535 760,515 760,432"/>
      <polygon points="755,432 755,513 720,500 720,428"/>
      <polygon points="715,428 715,498 680,488 680,425"/>
      <polygon points="800,642 800,735 760,700 760,615"/>
      <polygon points="755,615 755,698 720,672 720,600"/>
      <polygon points="715,600 715,670 680,650 680,590"/>
    </g>
    <g fill="#111">
      <polygon points="782,70 782,160 774,164 774,74"/>
      <polygon points="740,120 740,195 734,198 734,124"/>
      <polygon points="782,270 782,360 774,362 774,274"/>
      <polygon points="782,450 782,530 774,528 774,448"/>
      <polygon points="782,650 782,730 774,722 774,646"/>
      <polygon points="700,610 700,665 694,662 694,608"/>
    </g>

    <!-- one lemon-yellow book, precariously sliding off the shelf -->
    <polygon points="600,470 655,465 650,515 598,520" fill="#ffe135" transform="rotate(-18 625 492)"/>

    <!-- ceiling strip between shelves -->
    <polygon points="330,400 470,400 470,400" fill="#000"/>

    <!-- desk lamp overhead (silhouette against glow) -->
    <ellipse cx="400" cy="400" rx="46" ry="46" fill="#ffffff"/>
    <ellipse cx="400" cy="400" rx="24" ry="24" fill="#ffe135" opacity="0.5"/>
    <path d="M400 446 L400 520" stroke="#000" stroke-width="12" stroke-linecap="round"/>
    <path d="M400 520 Q470 560 520 700" stroke="#000" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- shadow of the bike thrown onto the right shelf, elongated -->
    <g fill="#000" opacity="0.6" transform="translate(120 40) skewX(-25)">
      <ellipse cx="560" cy="330" rx="24" ry="70"/>
      <ellipse cx="620" cy="300" rx="24" ry="70"/>
    </g>

    <!-- BICYCLE seen from below: two wheels as fat ellipses, frame between -->
    <g transform="translate(400 500)">
      <!-- rear wheel -->
      <g transform="translate(-95 0)">
        <ellipse cx="0" cy="0" rx="34" ry="88" fill="#000"/>
        <ellipse cx="0" cy="0" rx="26" ry="78" fill="#e0e0e0"/>
        <ellipse cx="0" cy="0" rx="18" ry="66" fill="#000"/>
        <g stroke="#e0e0e0" stroke-width="2">
          <line x1="0" y1="-66" x2="0" y2="66"/>
          <line x1="-16" y1="-30" x2="16" y2="30"/>
          <line x1="16" y1="-30" x2="-16" y2="30"/>
          <line x1="-18" y1="0" x2="18" y2="0"/>
        </g>
        <circle r="6" fill="#e0e0e0"/>
      </g>
      <!-- front wheel, turned a little (comic wobble) -->
      <g transform="translate(95 0) rotate(12)">
        <ellipse cx="0" cy="0" rx="34" ry="88" fill="#000"/>
        <ellipse cx="0" cy="0" rx="26" ry="78" fill="#e0e0e0"/>
        <ellipse cx="0" cy="0" rx="18" ry="66" fill="#000"/>
        <g stroke="#e0e0e0" stroke-width="2">
          <line x1="0" y1="-66" x2="0" y2="66"/>
          <line x1="-16" y1="-30" x2="16" y2="30"/>
          <line x1="16" y1="-30" x2="-16" y2="30"/>
          <line x1="-18" y1="0" x2="18" y2="0"/>
        </g>
        <circle r="6" fill="#e0e0e0"/>
      </g>
      <!-- frame underside: tubes -->
      <g stroke="#e0e0e0" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="-95" y1="0" x2="-10" y2="-20"/>
        <line x1="-95" y1="0" x2="20" y2="30"/>
        <line x1="-10" y1="-20" x2="95" y2="0"/>
        <line x1="20" y1="30" x2="95" y2="0"/>
        <line x1="-10" y1="-20" x2="20" y2="30"/>
      </g>
      <!-- crank + pedals -->
      <circle cx="5" cy="5" r="16" fill="#000" stroke="#e0e0e0" stroke-width="4"/>
      <line x1="5" y1="5" x2="-30" y2="40" stroke="#e0e0e0" stroke-width="6" stroke-linecap="round"/>
      <line x1="5" y1="5" x2="40" y2="-30" stroke="#e0e0e0" stroke-width="6" stroke-linecap="round"/>
      <rect x="-42" y="34" width="24" height="12" fill="#e0e0e0" transform="rotate(-45 -30 40)"/>
      <rect x="28" y="-36" width="24" height="12" fill="#e0e0e0" transform="rotate(-45 40 -30)"/>
    </g>

    <!-- PELICAN from below: belly, webbed feet on pedals, beak peeking over -->
    <g transform="translate(400 500)">
      <!-- webbed feet on the pedals -->
      <g fill="#ffffff" stroke="#000" stroke-width="3" stroke-linejoin="round">
        <path d="M-30 40 l-26 -6 l-6 28 l14 -8 l2 14 l12 -12 l14 8 z"/>
        <path d="M40 -30 l26 6 l6 -28 l-14 8 l-2 -14 l-12 12 l-14 -8 z"/>
      </g>
      <!-- fat white belly over the saddle -->
      <ellipse cx="-30" cy="-60" rx="70" ry="52" fill="#ffffff" stroke="#000" stroke-width="4"/>
      <!-- belly shading toward the far side from the lamp -->
      <path d="M-100 -60 a70 52 0 0 0 40 46 a90 60 0 0 1 -30 -70 z" fill="#000" opacity="0.15"/>
      <!-- wings splayed out gripping handlebars -->
      <path d="M-95 -75 q-60 -30 -80 -110 q40 40 100 60 z" fill="#ffffff" stroke="#000" stroke-width="4"/>
      <path d="M35 -75 q60 -30 80 -110 q-40 40 -100 60 z" fill="#ffffff" stroke="#000" stroke-width="4"/>
      <!-- handlebars, gripped -->
      <path d="M-170 -180 Q-40 -150 100 -180" stroke="#e0e0e0" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- neck and head craning down toward the viewer -->
      <path d="M-30 -110 q10 -60 60 -70" stroke="#000" stroke-width="30" fill="none" stroke-linecap="round"/>
      <path d="M-30 -110 q10 -60 60 -70" stroke="#ffffff" stroke-width="22" fill="none" stroke-linecap="round"/>
      <circle cx="40" cy="-190" r="34" fill="#ffffff" stroke="#000" stroke-width="4"/>
      <!-- big pouch beak, hanging open toward the viewer -->
      <path d="M40 -175 L165 -140 Q120 -100 45 -140 z" fill="#ffe135" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
      <path d="M40 -175 L165 -140" stroke="#000" stroke-width="4"/>
      <path d="M45 -140 Q100 -110 165 -140" stroke="#000" stroke-width="3" fill="none"/>
      <!-- shifty eye looking down at us -->
      <circle cx="30" cy="-198" r="11" fill="#ffffff" stroke="#000" stroke-width="3"/>
      <circle cx="34" cy="-194" r="5" fill="#000"/>
      <path d="M14 -212 q16 -12 34 -6" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- tuft of feathers on the head -->
      <path d="M20 -222 q-6 -18 4 -26 M32 -224 q0 -18 10 -24" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- a stolen book tucked in the pouch, and two loose pages fluttering -->
    <rect x="465" y="345" width="44" height="30" fill="#ffffff" stroke="#000" stroke-width="3" transform="rotate(-20 487 360)"/>
    <path d="M220 620 l30 -12 l6 34 l-30 12 z" fill="#ffffff" stroke="#000" stroke-width="2" transform="rotate(25 238 637)"/>
    <path d="M560 250 l30 -12 l6 34 l-30 12 z" fill="#ffffff" stroke="#000" stroke-width="2" transform="rotate(-40 578 267)"/>

    <!-- hard-edged lamp cone rim on the shelves -->
    <circle cx="400" cy="400" r="230" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>

    <!-- SHH sign hanging from the shelf edge -->
    <g transform="translate(150 300) rotate(-8)">
      <rect x="-40" y="-14" width="80" height="28" fill="#ffffff" stroke="#000" stroke-width="3"/>
      <text x="0" y="7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">SHH!</text>
    </g>
  </g>
</svg>