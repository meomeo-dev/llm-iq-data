          stroke="#000" stroke-width="22"/>
    <path d="M0 445 350 477M0 726 293 695M0 1041 235 940"
          stroke="#fff" stroke-width="4"/>
  </g>

  <g clip-path="url(#rightShelf)">
    <g transform="matrix(.95,-.59,.1,.73,487,196)">
      <rect width="530" height="1500" fill="url(#spines)"/>
      <path d="M0 153H530M0 333H530M0 544H530M0 775H530M0 1040H530
               M0 1310H530" stroke="#000" stroke-width="35"/>
      <path d="M0 140H530M0 320H530M0 531H530M0 762H530M0 1027H530"
            stroke="#fff" stroke-width="3"/>
    </g>
    <path d="M886 0 532 311 708 1100H788L575 326 900 49Z" fill="#000"/>
