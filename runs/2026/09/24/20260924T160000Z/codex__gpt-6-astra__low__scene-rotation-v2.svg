        fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M221 386Q316 393 393 364L480 330
           Q439 387 390 408Q313 440 221 386Z" fill="#000"/>
  <path d="M263 397Q333 419 395 385"
        fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M215 386Q329 341 480 322L493 338Q346 364 215 386Z"
        fill="#fff" stroke="#000" stroke-width="4"/>
  <path d="M266 374 442 340" stroke="#000" stroke-width="2"/>
  <path d="M473 301 465 278 486 291 495 270 505 295"
        fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M484 313Q500 302 514 315" fill="none" stroke="#000" stroke-width="5"/>
  <ellipse cx="499" cy="320" rx="10" ry="12" fill="#fff" stroke="#000" stroke-width="3"/>
  <ellipse cx="494" cy="319" rx="4" ry="6" fill="#000"/>
  <path d="M481 342Q495 350 506 336" fill="none" stroke="#000" stroke-width="3"/>

  <!-- One wing grips the handlebar; webbed feet find the pedals. -->
  <path d="M407 458Q367 478 329 541L310 559
