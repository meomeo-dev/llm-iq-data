<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100"
     viewBox="0 0 900 1100" role="img"
     aria-labelledby="title description">
  <title id="title">The midnight library wheelie</title>
  <desc id="description">
    A mischievous pelican rides a bicycle through a narrow library aisle,
    seen from floor level looking steeply upward. Towering black and white
    bookshelves converge overhead. A single lemon-yellow desk lamp throws
    hard light across the bird, bicycle, and books.
  </desc>

  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"
             patternTransform="rotate(30)">
      <path d="M0 0V10" stroke="#fff" stroke-width="1"/>
    </pattern>
    <pattern id="spines" width="74" height="160" patternUnits="userSpaceOnUse">
      <rect width="74" height="160" fill="#fff"/>
      <path d="M3 0V160M19 0V160M45 0V160M67 0V160"
            fill="none" stroke="#000" stroke-width="5"/>
      <path d="M7 22H15M7 28H15M24 44H40M24 49H40M50 19H62
               M50 24H62M24 128H40M50 137H62"
            stroke="#000" stroke-width="3"/>
      <path d="M31 65V102M56 47V87" stroke="#000" stroke-width="2"/>
    </pattern>
    <clipPath id="leftShelf">
      <path d="M0 0H273L409 257 232 1100H0Z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M666 0H900V1100H683L491 257Z"/>
    </clipPath>
  </defs>

  <!-- The aisle climbs toward a tiny, distant ceiling. -->
  <rect width="900" height="1100" fill="#fff"/>
  <path d="M0 0H273L409 257 232 1100H0ZM666 0H900V1100H683L491 257Z"
        fill="#000"/>
