        fill="none" stroke="#000" stroke-width="8"/>
  <path d="M313 0 425 227H476L624 0M367 0 439 191H464L570 0"
        fill="none" stroke="#000" stroke-width="2"/>
  <path d="M421 242H483M432 212H473" stroke="#000" stroke-width="4"/>

