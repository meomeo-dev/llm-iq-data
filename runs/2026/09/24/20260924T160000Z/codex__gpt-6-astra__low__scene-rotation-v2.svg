  <g clip-path="url(#leftShelf)">
    <g transform="matrix(.95,.58,-.08,.7,-35,-75)">
      <rect width="430" height="1300" fill="url(#spines)"/>
      <path d="M0 151H430M0 325H430M0 511H430M0 720H430M0 963H430
               M0 1220H430" stroke="#000" stroke-width="32"/>
      <path d="M0 140H430M0 314H430M0 500H430M0 709H430M0 952H430"
            stroke="#fff" stroke-width="3"/>
    </g>
    <path d="M13 0 363 311 186 1100H113L325 322 0 49Z" fill="#000"/>
