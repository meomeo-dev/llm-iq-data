<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">The library aisle getaway</title>
  <desc id="desc">A mischievous pelican rides a bicycle above a worm's-eye view of towering library shelves. A single desk lamp casts a sharp lemon-yellow beam.</desc>

  <defs>
    <clipPath id="shelfClip">
      <path d="M0 0H300L87 1000H0Z"/>
    </clipPath>

    <g id="books" fill="none" stroke="#f8f8f4" stroke-width="3" stroke-linejoin="round">
      <path d="M8 110V25h18v85h8V10h25v100h9V32h21v78h8V15h32v95h8V29h20v81h9V8h24v102h8V24h30v86h10V37h17v73h9V14h24v96h9V30h22v80"/>
      <path d="M36 30h21M36 91h21M100 38v51M164 25h20M208 48h12M254 34v54"/>
    </g>

    <g id="shelf">
      <path d="M0 0H300L87 1000H0Z" fill="#111" stroke="#f8f8f4" stroke-width="6"/>
      <g clip-path="url(#shelfClip)">
        <use href="#books" transform="translate(0 20)"/>
        <use href="#books" transform="translate(0 215)"/>
        <use href="#books" transform="translate(0 410)"/>
        <use href="#books" transform="translate(0 605)"/>
        <use href="#books" transform="translate(0 800)"/>
        <g fill="#f8f8f4">
          <path d="M0 160L267 143v20L0 184Z"/>
          <path d="M0 365L225 342v21L0 389Z"/>
          <path d="M0 570L181 540v23L0 596Z"/>
          <path d="M0 775L138 737v25L0 804Z"/>
          <path d="M0 980L94 936v27L0 1000Z"/>
        </g>
        <path d="M43 0L0 215M106 0L0 492M184 0L0 863"
              fill="none" stroke="#f8f8f4" stroke-width="2" opacity=".65"/>
      </g>
      <path d="M300 0L87 1000" fill="none" stroke="#f8f8f4" stroke-width="7"/>
    </g>

    <g id="wheel" fill="none" stroke="#f8f8f4">
      <circle r="123" stroke-width="10"/>
      <circle r="108" stroke-width="2.5"/>
      <path d="M-108 0H108M0-108V108M-76-76L76 76M-76 76L76-76
               M-104-28L104 28M-104 28L104-28
               M-28-104L28 104M28-104L-28 104"
            stroke-width="2" opacity=".8"/>
      <circle r="14" fill="#0a0a0a" stroke-width="5"/>
    </g>
  </defs>

  <rect width="800" height="1000" fill="#0a0a0a"/>

  <!-- Shelves climb away from the viewer toward the ceiling. -->
  <use href="#shelf"/>
  <use href="#shelf" transform="translate(800 0) scale(-1 1)"/>
  <path d="M314 0L400 158 486 0M337 0L400 110 463 0"
        fill="none" stroke="#f8f8f4" stroke-width="4" opacity=".75"/>

  <!-- The lamp is the scene's only colored light. -->
  <path d="M590 186L305 638 625 730Z" fill="#f4e536" opacity=".28"/>
  <path d="M590 186L305 638M590 186L625 730"
        fill="none" stroke="#f4e536" stroke-width="2"/>
  <path d="M786 279L697 224 659 91"
        fill="none" stroke="#f8f8f4" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0a0a0a" stroke="#f8f8f4" stroke-width="6">
    <circle cx="697" cy="224" r="12"/>
    <circle cx="659" cy="91" r="11"/>
    <path d="M659 91C625 98 588 116 571 145L558 176
             Q602 198 648 174L676 137Z"/>
  </g>
  <circle cx="590" cy="184" r="10" fill="#f4e536"/>
  <path d="M555 202l-13 14M610 204l9 18M575 216l-5 19"
        fill="none" stroke="#f8f8f4" stroke-width="3"
        stroke-linecap="round"/>

  <!-- A few books have been startled loose. -->
  <g fill="#0a0a0a" stroke="#f8f8f4" stroke-width="4" stroke-linejoin="round">
    <path d="M155 411l47-20 12 36-47 20Z"/>
    <path d="M657 517l49 15-12 38-49-15Z"/>
  </g>
  <path d="M171 414l10 28M189 406l10 29M665 524l-9 29"
        fill="none" stroke="#f8f8f4" stroke-width="2"/>

  <!-- Bicycle, drawn large as it passes almost overhead. -->
  <use href="#wheel" transform="translate(215 760)"/>
  <use href="#wheel" transform="translate(599 760) scale(1.05)"/>

  <g fill="none" stroke="#0a0a0a" stroke-width="19"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M215 760L346 566 402 748 215 760
             M346 566L542 572 402 748M542 572L599 760"/>
    <path d="M542 572L565 512 623 501q23-2 25 22"/>
  </g>
  <g fill="none" stroke="#f8f8f4" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M215 760L346 566 402 748 215 760
             M346 566L542 572 402 748M542 572L599 760"/>
    <path d="M542 572L565 512 623 501q23-2 25 22"/>
  </g>
  <path d="M303 551q42-14 89 0l-7 13h-77Z"
        fill="#f8f8f4" stroke="#0a0a0a" stroke-width="6"/>
  <path d="M402 748l3-55M402 748l49 34M386 692h39M432 783h41"
        fill="none" stroke="#f8f8f4" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Tail, body, wing, and the pelican's long, S-shaped neck. -->
  <path d="M304 485q-40-7-65-48 3 49 33 73-30-1-50-27
           10 42 58 56Z"
        fill="#f8f8f4" stroke="#0a0a0a" stroke-width="7"
        stroke-linejoin="round"/>
  <path d="M290 474c5-47 39-72 88-69 51 3 82 39 84 86
           3 54-42 84-101 72-45-9-76-46-71-89Z"
        fill="#f8f8f4" stroke="#0a0a0a" stroke-width="8"/>
  <path d="M310 463c35-39 91-29 120 21-36-12-57-2-71 23
           -16 19-34-3-49-44Z"
        fill="#0a0a0a" stroke="#f8f8f4" stroke-width="5"/>
  <path d="M330 460q34-15 62 7M340 482q29-7 46 7"
        fill="none" stroke="#f8f8f4" stroke-width="3"/>

  <!-- One wing reaches for the handlebar. -->
  <path d="M422 476q62-26 125 29l17 5-9 25-23-8
           q-44-25-94-24Z"
        fill="#f8f8f4" stroke="#0a0a0a" stroke-width="8"
        stroke-linejoin="round"/>
  <path d="M551 511l17-15M555 520l23-4"
        fill="none" stroke="#0a0a0a" stroke-width="5"
        stroke-linecap="round"/>

  <path d="M423 270l-15-32 31 19-2-35 25 32"
        fill="#f8f8f4" stroke="#0a0a0a" stroke-width="7"
        stroke-linejoin="round"/>
  <path d="M410 450c18-32 23-58 7-83-20-31-11-63 8-89
           19-28 53-29 70-4 15 21 8 46-13 62
           -21 17-23 34-12 56 16 34 7 68-24 89Z"
        fill="#f8f8f4" stroke="#0a0a0a" stroke-width="8"/>

  <!-- The pouch hangs below a long, cheeky grin of a bill. -->
  <path d="M482 327c62 8 178 18 245 12-11 48-41 107-92 126
           -47 17-101-9-129-48-16-22-22-58-24-90Z"
        fill="#f8f8f4" stroke="#0a0a0a" stroke-width="8"/>
  <path d="M506 356q81 42 177 18M529 405q51 38 105 29"
        fill="none" stroke="#0a0a0a" stroke-width="5"
        stroke-linecap="round"/>
  <path d="M478 306c68-17 163-5 246 22q13 4 10 15
           -95 10-176-2-76-13-76-13Z"
        fill="#f8f8f4" stroke="#0a0a0a" stroke-width="8"
        stroke-linejoin="round"/>
  <path d="M449 280q16-15 37-5" fill="none"
        stroke="#0a0a0a" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="474" cy="294" rx="7" ry="11" fill="#0a0a0a"/>
  <circle cx="476" cy="290" r="2.5" fill="#f8f8f4"/>
  <ellipse cx="522" cy="315" rx="4" ry="3" fill="#0a0a0a"/>

  <!-- Legs and broad webbed feet pump the pedals. -->
  <g fill="none" stroke="#0a0a0a" stroke-width="27"
     stroke-linecap="round">
    <path d="M354 536q10 73 48 151"/>
    <path d="M413 538q37 94 39 234"/>
  </g>
  <g fill="none" stroke="#f8f8f4" stroke-width="16"
     stroke-linecap="round">
    <path d="M354 536q10 73 48 151"/>
    <path d="M413 538q37 94 39 234"/>
  </g>
  <g fill="#f8f8f4" stroke="#0a0a0a" stroke-width="6"
     stroke-linejoin="round">
    <path d="M390 680q14-12 27 5l18 8-13 8 24 5-8 11
             -29-8-13 5Z"/>
    <path d="M440 765q15-12 28 5l20 9-14 8 25 5-9 12
             -29-9-15 4Z"/>
  </g>

  <!-- Sharp motion marks keep the quiet aisle from feeling quiet. -->
  <g fill="none" stroke="#f8f8f4" stroke-width="5"
     stroke-linecap="round">
    <path d="M70 666l-26-19M58 707l-34-7M104 609l-17-27"/>
    <path d="M726 651l30-23M741 698l35-7M712 604l18-31"/>
    <path d="M315 845l-32 24M504 865l31 27"/>
  </g>
</svg>