<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="lampglow" cx="400" cy="120" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="800" height="800"/></clipPath>
  </defs>

  <!-- dark ceiling void -->
  <rect width="800" height="800" fill="#0a0a0a"/>

  <g clip-path="url(#frame)">
    <!-- left shelf wall, converging upward to vanishing point (400,120) -->
    <polygon points="-40,820 300,820 400,120" fill="#1c1c1c"/>
    <!-- right shelf wall -->
    <polygon points="840,820 500,820 400,120" fill="#161616"/>

    <!-- left shelves (radial lines toward vanishing point) -->
    <g stroke="#3a3a3a" stroke-width="4">
      <line x1="400" y1="120" x2="-40" y2="820"/>
      <line x1="400" y1="120" x2="40" y2="820"/>
      <line x1="400" y1="120" x2="120" y2="820"/>
      <line x1="400" y1="120" x2="200" y2="820"/>
      <line x1="400" y1="120" x2="260" y2="820"/>
      <line x1="400" y1="120" x2="300" y2="820"/>
    </g>
    <!-- right shelves -->
    <g stroke="#333333" stroke-width="4">
      <line x1="400" y1="120" x2="840" y2="820"/>
      <line x1="400" y1="120" x2="760" y2="820"/>
      <line x1="400" y1="120" x2="680" y2="820"/>
      <line x1="400" y1="120" x2="600" y2="820"/>
      <line x1="400" y1="120" x2="540" y2="820"/>
      <line x1="400" y1="120" x2="500" y2="820"/>
    </g>

    <!-- book spines, left wall: rows of small rectangles receding -->
    <g fill="#2a2a2a" stroke="#555" stroke-width="1.5">
      <polygon points="60,780 140,780 190,700 120,700"/>
      <polygon points="150,780 210,780 250,700 200,700"/>
      <polygon points="220,780 285,780 305,700 265,700"/>
      <polygon points="130,690 195,690 235,620 180,620"/>
      <polygon points="205,690 262,690 290,620 245,620"/>
      <polygon points="185,610 240,610 270,550 230,550"/>
      <polygon points="248,610 292,610 310,550 278,550"/>
      <polygon points="230,540 275,540 300,490 265,490"/>
      <polygon points="282,540 315,540 330,490 305,490"/>
      <polygon points="270,480 305,480 320,440 295,440"/>
      <polygon points="300,430 330,430 345,395 322,395"/>
    </g>
    <!-- book spines, right wall -->
    <g fill="#242424" stroke="#4a4a4a" stroke-width="1.5">
      <polygon points="740,780 660,780 610,700 680,700"/>
      <polygon points="650,780 590,780 550,700 600,700"/>
      <polygon points="580,780 515,780 495,700 535,700"/>
      <polygon points="670,690 605,690 565,620 620,620"/>
      <polygon points="595,690 538,690 510,620 555,620"/>
      <polygon points="615,610 560,610 530,550 570,550"/>
      <polygon points="552,610 508,610 490,550 522,550"/>
      <polygon points="570,540 525,540 500,490 535,490"/>
      <polygon points="518,540 485,540 470,490 495,490"/>
      <polygon points="530,480 495,480 480,440 505,440"/>
      <polygon points="500,430 470,430 455,395 478,395"/>
    </g>

    <!-- a few pale highlighted spines catching the lamp -->
    <g fill="#d8d8d8">
      <polygon points="275,480 300,480 312,440 292,440"/>
      <polygon points="330,430 345,430 352,395 340,395"/>
      <polygon points="525,480 500,480 490,440 505,440"/>
      <polygon points="470,430 455,430 448,395 460,395"/>
    </g>

    <!-- lamp glow (hard light, single source) -->
    <circle cx="400" cy="120" r="260" fill="url(#lampglow)"/>

    <!-- desk lamp clamped on the top shelf edge, seen from directly below -->
    <g>
      <rect x="392" y="60" width="16" height="200" fill="#111"/>
      <ellipse cx="400" cy="120" rx="70" ry="34" fill="#0d0d0d" stroke="#f2f2f2" stroke-width="3"/>
      <ellipse cx="400" cy="120" rx="46" ry="22" fill="#ffffff"/>
      <ellipse cx="400" cy="120" rx="30" ry="14" fill="#f5e642"/>
      <line x1="400" y1="154" x2="400" y2="240" stroke="#f2f2f2" stroke-width="5"/>
      <line x1="400" y1="240" x2="470" y2="300" stroke="#f2f2f2" stroke-width="5"/>
      <circle cx="470" cy="300" r="7" fill="#f2f2f2"/>
    </g>

    <!-- one heavy book, dislodged, tumbling down toward the viewer -->
    <g transform="rotate(-25 130 330)">
      <rect x="95" y="300" width="70" height="60" fill="#e8e8e8"/>
      <rect x="95" y="300" width="70" height="60" fill="none" stroke="#111" stroke-width="3"/>
      <rect x="95" y="300" width="12" height="60" fill="#111"/>
      <text x="135" y="338" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">SHH</text>
    </g>
    <!-- motion lines -->
    <g stroke="#e8e8e8" stroke-width="2" stroke-linecap="round">
      <line x1="60" y1="290" x2="80" y2="270"/>
      <line x1="50" y1="320" x2="72" y2="305"/>
      <line x1="55" y1="350" x2="78" y2="342"/>
    </g>

    <!-- BICYCLE + PELICAN, seen from below, crossing the gap between shelves -->
    <!-- underside shadow cast on the far shelf face -->
    <ellipse cx="420" cy="545" rx="220" ry="42" fill="#000" opacity="0.6"/>

    <g transform="translate(400 500)">
      <!-- rear wheel (underside: a tire ring, spokes as radial lines) -->
      <g transform="translate(-150 0)">
        <circle r="78" fill="#0a0a0a" stroke="#f2f2f2" stroke-width="12"/>
        <circle r="78" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="10 8"/>
        <g stroke="#f2f2f2" stroke-width="2">
          <line x1="-70" y1="0" x2="70" y2="0"/>
          <line x1="0" y1="-70" x2="0" y2="70"/>
          <line x1="-50" y1="-50" x2="50" y2="50"/>
          <line x1="-50" y1="50" x2="50" y2="-50"/>
          <line x1="-64" y1="-26" x2="64" y2="26"/>
          <line x1="-64" y1="26" x2="64" y2="-26"/>
          <line x1="-26" y1="-64" x2="26" y2="64"/>
          <line x1="-26" y1="64" x2="26" y2="-64"/>
        </g>
        <circle r="10" fill="#f2f2f2"/>
      </g>
      <!-- front wheel -->
      <g transform="translate(160 0)">
        <circle r="78" fill="#0a0a0a" stroke="#f2f2f2" stroke-width="12"/>
        <circle r="78" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="10 8"/>
        <g stroke="#f2f2f2" stroke-width="2">
          <line x1="-70" y1="0" x2="70" y2="0"/>
          <line x1="0" y1="-70" x2="0" y2="70"/>
          <line x1="-50" y1="-50" x2="50" y2="50"/>
          <line x1="-50" y1="50" x2="50" y2="-50"/>
          <line x1="-64" y1="-26" x2="64" y2="26"/>
          <line x1="-64" y1="26" x2="64" y2="-26"/>
          <line x1="-26" y1="-64" x2="26" y2="64"/>
          <line x1="-26" y1="64" x2="26" y2="-64"/>
        </g>
        <circle r="10" fill="#f2f2f2"/>
      </g>

      <!-- frame (bottom bracket, chainstays, down tube) -->
      <g stroke="#f2f2f2" stroke-width="9" stroke-linecap="round" fill="none">
        <line x1="-150" y1="0" x2="-10" y2="0"/>
        <line x1="-10" y1="0" x2="160" y2="0"/>
        <line x1="-10" y1="0" x2="-60" y2="-60"/>
        <line x1="-10" y1="0" x2="120" y2="-40"/>
        <line x1="-60" y1="-60" x2="120" y2="-40"/>
      </g>
      <!-- crank + pedals -->
      <circle cx="-10" cy="0" r="22" fill="#0a0a0a" stroke="#f2f2f2" stroke-width="6"/>
      <line x1="-10" y1="0" x2="-150" y2="0" stroke="#f2f2f2" stroke-width="3" stroke-dasharray="4 4"/>
      <line x1="-10" y1="-30" x2="-10" y2="30" stroke="#f2f2f2" stroke-width="7"/>
      <rect x="-26" y="-40" width="32" height="12" fill="#f2f2f2"/>
      <rect x="-26" y="28" width="32" height="12" fill="#f2f2f2"/>
      <!-- handlebars, foreshortened, plus one bright bell -->
      <line x1="160" y1="-50" x2="160" y2="50" stroke="#f2f2f2" stroke-width="8" stroke-linecap="round"/>
      <circle cx="175" cy="-48" r="9" fill="#f5e642" stroke="#111" stroke-width="2"/>

      <!-- PELICAN from below: belly is a big pale oval, big webbed feet on pedals -->
      <!-- feet (lemon-yellow) -->
      <g fill="#f5e642" stroke="#111" stroke-width="2.5" stroke-linejoin="round">
        <path d="M -30 -46 L -10 -80 L 6 -46 L -6 -52 L -18 -52 Z"/>
        <path d="M -30 46 L -10 80 L 6 46 L -6 52 L -18 52 Z"/>
      </g>
      <!-- legs -->
      <g stroke="#f5e642" stroke-width="8" stroke-linecap="round">
        <line x1="-10" y1="-48" x2="30" y2="-20"/>
        <line x1="-10" y1="48" x2="30" y2="20"/>
      </g>
      <!-- belly -->
      <ellipse cx="55" cy="0" rx="82" ry="58" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
      <!-- underwing tips gripping handlebars -->
      <path d="M 90 -40 Q 150 -70 165 -45" fill="none" stroke="#f2f2f2" stroke-width="14" stroke-linecap="round"/>
      <path d="M 90 40 Q 150 70 165 45" fill="none" stroke="#f2f2f2" stroke-width="14" stroke-linecap="round"/>
      <path d="M 90 -40 Q 150 -70 165 -45" fill="none" stroke="#111" stroke-width="2"/>
      <path d="M 90 40 Q 150 70 165 45" fill="none" stroke="#111" stroke-width="2"/>
      <!-- tail feathers behind -->
      <path d="M -25 -12 L -60 -22 L -50 0 L -60 22 L -25 12 Z" fill="#f2f2f2" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- head craned down toward the viewer, beak wide open (mischief) -->
      <circle cx="140" cy="0" r="30" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
      <!-- eyes: one narrowed, one wide -->
      <circle cx="150" cy="-12" r="7" fill="#111"/>
      <circle cx="152" cy="-14" r="2.5" fill="#fff"/>
      <path d="M 143 14 Q 152 8 160 14" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <!-- brow for smirk -->
      <path d="M 138 -26 L 160 -20" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <!-- beak: upper mandible foreshortened, lower pouch sagging open, lemon yellow -->
      <path d="M 165 -8 L 275 -24 L 262 4 L 168 12 Z" fill="#f5e642" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 168 12 Q 230 90 268 12 L 262 4 Q 225 60 172 8 Z" fill="#f5e642" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <!-- pouch shadow, a small library book stuffed inside, poking out -->
      <path d="M 180 16 Q 230 74 258 12" fill="#111" opacity="0.35"/>
      <rect x="205" y="28" width="34" height="24" fill="#f2f2f2" stroke="#111" stroke-width="2" transform="rotate(12 222 40)"/>
    </g>

    <!-- speech burst -->
    <g transform="translate(610 300)">
      <path d="M -10 0 L 12 -18 L 6 -2 L 40 -10 L 20 6 L 46 18 L 14 14 L 22 38 L 0 20 L -22 36 L -14 12 L -46 14 L -20 0 L -40 -18 L -12 -10 Z" fill="#f2f2f2" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="0" y="7" font-family="Arial Black, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#111">DING!</text>
    </g>

    <!-- shelf lip at the very bottom, the viewer lying on the floor between them -->
    <rect x="0" y="770" width="800" height="30" fill="#050505"/>
    <text x="400" y="792" font-family="Georgia, serif" font-size="12" letter-spacing="4" text-anchor="middle" fill="#3a3a3a">QUIET PLEASE — 828.91 — QUIET PLEASE</text>
  </g>
</svg>