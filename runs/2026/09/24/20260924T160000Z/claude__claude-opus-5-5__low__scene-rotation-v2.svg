<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="lamp" cx="300" cy="610" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.35" stop-color="#bbb"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFF44F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF44F" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- ceiling / sky slit -->
  <rect width="600" height="800" fill="#000"/>
  <polygon points="250,0 350,0 330,300 270,300" fill="#fff"/>
  <!-- left shelf, converging upward -->
  <polygon points="0,800 0,0 250,0 270,300 180,800" fill="url(#lamp)"/>
  <!-- right shelf -->
  <polygon points="600,800 600,0 350,0 330,300 420,800" fill="url(#lamp)"/>
  <!-- shelf planks -->
  <g stroke="#000" stroke-width="5">
    <line x1="0" y1="700" x2="198" y2="700"/><line x1="600" y1="700" x2="402" y2="700"/>
    <line x1="0" y1="560" x2="222" y2="560"/><line x1="600" y1="560" x2="378" y2="560"/>
    <line x1="0" y1="420" x2="246" y2="420"/><line x1="600" y1="420" x2="354" y2="420"/>
    <line x1="0" y1="290" x2="260" y2="290"/><line x1="600" y1="290" x2="340" y2="290"/>
    <line x1="0" y1="180" x2="262" y2="180"/><line x1="600" y1="180" x2="338" y2="180"/>
    <line x1="0" y1="90" x2="256" y2="90"/><line x1="600" y1="90" x2="344" y2="90"/>
  </g>
  <!-- book spines -->
  <g stroke="#000" stroke-width="3">
    <line x1="30" y1="700" x2="30" y2="560"/><line x1="70" y1="700" x2="75" y2="560"/>
    <line x1="120" y1="700" x2="128" y2="560"/><line x1="160" y1="700" x2="176" y2="560"/>
    <line x1="570" y1="700" x2="570" y2="560"/><line x1="530" y1="700" x2="525" y2="560"/>
    <line x1="480" y1="700" x2="472" y2="560"/><line x1="440" y1="700" x2="424" y2="560"/>
    <line x1="40" y1="560" x2="45" y2="420"/><line x1="100" y1="560" x2="110" y2="420"/>
    <line x1="170" y1="560" x2="190" y2="420"/><line x1="560" y1="560" x2="555" y2="420"/>
    <line x1="500" y1="560" x2="490" y2="420"/><line x1="430" y1="560" x2="410" y2="420"/>
    <line x1="60" y1="420" x2="70" y2="290"/><line x1="150" y1="420" x2="170" y2="290"/>
    <line x1="540" y1="420" x2="530" y2="290"/><line x1="450" y1="420" x2="430" y2="290"/>
    <line x1="80" y1="290" x2="95" y2="180"/><line x1="190" y1="290" x2="210" y2="180"/>
    <line x1="520" y1="290" x2="505" y2="180"/><line x1="410" y1="290" x2="390" y2="180"/>
  </g>
  <!-- falling book (mischief) -->
  <g transform="rotate(-25 460 250)">
    <rect x="430" y="230" width="60" height="40" fill="#fff" stroke="#000" stroke-width="4"/>
    <line x1="460" y1="230" x2="460" y2="270" stroke="#000" stroke-width="3"/>
  </g>
  <!-- desk lamp at bottom, pointing up -->
  <polygon points="300,640 120,0 480,0" fill="url(#beam)"/>
  <polygon points="255,700 345,700 320,640 280,640" fill="#000" stroke="#fff" stroke-width="3"/>
  <circle cx="300" cy="645" r="12" fill="#FFF44F"/>
  <line x1="300" y1="700" x2="300" y2="800" stroke="#fff" stroke-width="6"/>
  <!-- pelican on bicycle, seen from below, silhouetted overhead -->
  <g transform="translate(300 330)">
    <!-- wheels -->
    <ellipse cx="-80" cy="40" rx="55" ry="22" fill="none" stroke="#000" stroke-width="8"/>
    <ellipse cx="80" cy="40" rx="55" ry="22" fill="none" stroke="#000" stroke-width="8"/>
    <g stroke="#000" stroke-width="2">
      <line x1="-135" y1="40" x2="-25" y2="40"/><line x1="-80" y1="18" x2="-80" y2="62"/>
      <line x1="25" y1="40" x2="135" y2="40"/><line x1="80" y1="18" x2="80" y2="62"/>
    </g>
    <!-- frame -->
    <polyline points="-80,40 -20,10 40,10 80,40 10,45 -80,40" fill="none" stroke="#000" stroke-width="7"/>
    <line x1="40" y1="10" x2="55" y2="-15" stroke="#000" stroke-width="6"/>
    <line x1="40" y1="-18" x2="72" y2="-12" stroke="#000" stroke-width="6"/>
    <!-- belly (lit from below) -->
    <ellipse cx="-10" cy="-10" rx="70" ry="45" fill="#fff" stroke="#000" stroke-width="5"/>
    <!-- wings flapping -->
    <path d="M-50,-20 Q-150,-90 -170,-20 Q-120,-40 -60,5 Z" fill="#fff" stroke="#000" stroke-width="5"/>
    <path d="M30,-25 Q120,-110 160,-60 Q100,-50 40,0 Z" fill="#fff" stroke="#000" stroke-width="5"/>
    <!-- legs to pedals -->
    <polyline points="-25,25 -15,50 5,45" fill="none" stroke="#000" stroke-width="5"/>
    <polyline points="5,25 25,55 35,48" fill="none" stroke="#000" stroke-width="5"/>
    <!-- neck + head -->
    <path d="M10,-45 Q0,-100 30,-120" fill="none" stroke="#000" stroke-width="22"/>
    <path d="M10,-45 Q0,-100 30,-120" fill="none" stroke="#fff" stroke-width="14"/>
    <circle cx="35" cy="-125" r="22" fill="#fff" stroke="#000" stroke-width="5"/>
    <!-- mischievous eye -->
    <circle cx="42" cy="-130" r="5" fill="#000"/>
    <path d="M32,-142 L52,-136" stroke="#000" stroke-width="4"/>
    <!-- yellow beak and pouch, holding a stolen book -->
    <path d="M52,-125 L150,-150 L140,-138 L55,-115 Z" fill="#FFF44F" stroke="#000" stroke-width="4"/>
    <path d="M55,-115 Q100,-80 140,-138" fill="#FFF44F" stroke="#000" stroke-width="4"/>
    <rect x="88" y="-120" width="26" height="18" fill="#fff" stroke="#000" stroke-width="3" transform="rotate(-15 100 -110)"/>
  </g>
  <!-- motion marks -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="360" x2="80" y2="370"/><line x1="125" y1="385" x2="90" y2="400"/>
  </g>
</svg>