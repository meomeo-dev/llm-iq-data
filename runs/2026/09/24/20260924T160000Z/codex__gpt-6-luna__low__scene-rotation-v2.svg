<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle through a library aisle</title>
  <desc id="desc">A comic, black-and-white worm’s-eye view looking straight up between towering bookshelves. A pelican pedals a bicycle overhead beneath a lemon-yellow desk lamp.</desc>

  <defs>
    <pattern id="bookSpines" width="62" height="92" patternUnits="userSpaceOnUse">
      <rect width="62" height="92" fill="#111"/>
      <path d="M4 0v92M25 0v92M45 0v92M59 0v92" stroke="#eee" stroke-width="2"/>
      <path d="M7 12h14m-14 5h14M28 24h14m-14 5h14M48 67h8m-8 5h8" stroke="#aaa" stroke-width="2"/>
      <path d="M3 45h20M25 58h21M46 16h13" stroke="#fff" stroke-width="4"/>
    </pattern>
    <pattern id="floorLines" width="54" height="54" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v54" stroke="#222" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="beam">
      <path d="M404 118 174 748h452L426 118Z"/>
    </clipPath>
  </defs>

  <rect width="800" height="800" fill="#080808"/>

  <!-- Towering shelves converge around the upward-looking aisle. -->
  <path d="M0 0h250L350 800H0Z" fill="#171717"/>
  <path d="M550 0h250v800H450Z" fill="#171717"/>
  <path d="M12 0h202l91 800H12Z" fill="url(#bookSpines)"/>
  <path d="M586 0h202v800H497Z" fill="url(#bookSpines)"/>

  <!-- Shelf ledges pull the eye toward the narrow opening overhead. -->
  <path d="M0 190 247 212l7 18L0 208Zm0 222 278 24 7 19L0 442Zm0 228 309 24 8 19L0 676Z" fill="#eee"/>
  <path d="m550 212 250-22v18l-247 22Zm-33 224 283-24v18l-280 25Zm-33 228 316-24v19l-313 24Z" fill="#eee"/>

  <!-- Ceiling opening and hard pool of light. -->
  <path d="M250 0h300l-98 170h-104Z" fill="#0d0d0d" stroke="#fff" stroke-width="3"/>
  <path d="M400 44v45" stroke="#fff" stroke-width="5"/>
  <path d="M367 101q33-38 66 0l18 24H350Z" fill="#f2df27" stroke="#fff" stroke-width="4"/>
  <circle cx="400" cy="123" r="9" fill="#fff"/>
  <path d="M404 130 182 748h436L424 130Z" fill="#fff" opacity=".1"/>
  <path d="M404 130 182 748h436L424 130Z" fill="url(#floorLines)" opacity=".35"/>

  <!-- Floor plane visible as a distant, graphic diamond. -->
  <path d="M0 706 400 604 800 706v94H0Z" fill="#ddd"/>
  <path d="M0 706 400 604 800 706v94H0Z" fill="url(#floorLines)"/>
  <path d="M0 706 400 604 800 706" fill="none" stroke="#fff" stroke-width="5"/>

  <!-- Bicycle shadow. -->
  <ellipse cx="406" cy="510" rx="182" ry="32" fill="#000" opacity=".75" filter="url(#shadow)"/>

  <!-- Bicycle, seen from directly below. -->
  <g fill="none" stroke="#f5f5f5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="290" cy="494" r="78"/>
    <circle cx="520" cy="494" r="78"/>
    <path d="m290 494 72-105 66 105h-138l57-82 74 82 18-106"/>
    <path d="M416 389h37m-44-10h42"/>
    <path d="m361 389-27-12m27 12 15-5"/>
    <path d="M407 494h22m-30-9 31 18"/>
  </g>
  <g fill="#f5f5f5">
    <circle cx="407" cy="494" r="12"/>
    <path d="M285 410h38v8h-38z"/>
  </g>

  <!-- Pelican with a cheeky grin, perched astride the frame. -->
  <g stroke="#111" stroke-width="7" stroke-linejoin="round">
    <path d="M365 364q-7-63 33-87 37-21 72 9 21 18 8 49-12 27-55 31-24 2-58-2Z" fill="#fff"/>
    <path d="M390 289q-5-42 18-71 17-21 41-8 23 13 13 40-8 20-31 37Z" fill="#fff"/>
    <path d="M441 253q39-19 94-8l-47 18q-20 9-37 13Z" fill="#fff"/>
    <path d="M453 269q22-8 42-6l-12 31q-17 8-39-1Z" fill="#eee"/>
    <path d="M431 299q7-9 16-2" fill="none" stroke-width="5"/>
    <circle cx="437" cy="296" r="4" fill="#111"/>
    <path d="M404 359q-28 26-31 63m62-54q20 19 35 43" fill="none" stroke-width="13"/>
    <path d="M374 421q-13 12-22 4m116-14q12 8 23 0" fill="none" stroke-width="9"/>
    <path d="M399 339q27 20 59 0" fill="none" stroke-width="5"/>
    <path d="M415 346q16 8 31-2" fill="none" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Flapping scarf and comic motion marks. -->
  <path d="M390 316q-43-16-63-43 31 8 52 2-26-19-32-43 31 27 57 31Z" fill="#f2df27" stroke="#111" stroke-width="6"/>
  <path d="m308 320-31-10m35 28-43 8m333-45 27-20m-34 43 38 1" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Tiny comic flourish. -->
  <path d="M544 335q28-15 40 5-13 22-34 8" fill="#fff" stroke="#111" stroke-width="4"/>
  <circle cx="559" cy="343" r="3" fill="#111"/>
  <path d="M583 322l14-12m-6 27 19-2" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</svg>