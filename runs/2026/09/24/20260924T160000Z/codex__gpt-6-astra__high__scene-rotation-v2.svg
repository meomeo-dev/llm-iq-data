    <text x="66" y="27" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#000">QUIET</text>
    <text x="66" y="49" text-anchor="middle" font-family="monospace" font-size="11" fill="#000">NO CYCLING</text>
