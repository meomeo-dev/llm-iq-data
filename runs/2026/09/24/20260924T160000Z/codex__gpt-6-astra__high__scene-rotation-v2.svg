<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Strictly No Cycling</title>
  <desc id="desc">A mischievous pelican pedals a bicycle overhead in a narrow library aisle. Towering bookshelves converge above the viewer in an exaggerated worm’s-eye perspective. Black and white ink, sharp shadows, and a single lemon-yellow desk-lamp bulb.</desc>

