    <path d="M432 585Q450 625 485 659L530 831
             Q534 845 521 852Q508 856 501 840
             L465 704Q427 691 402 630Z"
          fill="#fff" stroke-width="9"/>
    <path d="M516 839q21-9 38 2l9 15q-25 11-50 1Z"
          fill="#fff" stroke-width="8"/>
    <path d="M403 490q39 16 47 53m-52-31q25 16 31 41"
