    <path d="M17 745v156m40-152 5 155m42-150 6 153m40-149 8 152m42-145 8 147"/>
    <path d="M18 969v116m47-119 5 119m48-121 7 121m46-124 8 124"/>

    <path d="M878 19v123m-25-117-4 120m-24-119-4 121m-22-116-6 119m-22-114-7 117m-25-108-6 111m-20-106-8 109m-24-103-9 107m-19-97-8 100m-18-94-9 97m-18-88-8 91m-19-83-8 86"/>
