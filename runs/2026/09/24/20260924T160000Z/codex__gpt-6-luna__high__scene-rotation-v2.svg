<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Takes the Library Aisle</title>
  <desc id="desc">A mischievous pelican pedals a bicycle beneath a desk lamp, seen from directly below in a towering black and white library aisle.</desc>

  <defs>
    <clipPath id="page">
      <path d="M0 0h900v1200H0z"/>
    </clipPath>
    <clipPath id="leftShelf">
      <path d="M0 0h328L430 1200H0z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M900 0H572L470 1200h430z"/>
    </clipPath>
    <radialGradient id="lampGlow">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".38" stop-color="#fff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#page)">
