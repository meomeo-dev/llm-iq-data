<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="glow" cx="0.18" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#FFF44F" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#FFF44F" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFF44F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="books" width="22" height="40" patternUnits="userSpaceOnUse">
      <rect width="22" height="40" fill="#111"/>
      <rect x="1" y="4" width="6" height="36" fill="#eee"/>
      <rect x="8" y="10" width="5" height="30" fill="#777"/>
      <rect x="14" y="2" width="7" height="38" fill="#ccc"/>
    </pattern>
  </defs>

  <!-- ceiling / sky slit -->
  <rect width="600" height="800" fill="#000"/>
  <polygon points="250,0 350,0 330,120 270,120" fill="#f4f4f4"/>

  <!-- left bookshelf converging up -->
  <polygon points="0,0 250,0 270,120 180,800 0,800" fill="url(#books)"/>
  <g stroke="#000" stroke-width="6">
    <line x1="0" y1="700" x2="193" y2="700"/><line x1="0" y1="560" x2="210" y2="560"/>
    <line x1="0" y1="420" x2="228" y2="420"/><line x1="0" y1="290" x2="245" y2="290"/>
    <line x1="0" y1="180" x2="258" y2="180"/><line x1="0" y1="90" x2="266" y2="90"/>
  </g>
  <!-- right bookshelf -->
  <polygon points="350,0 600,0 600,800 420,800 330,120" fill="url(#books)"/>
  <g stroke="#000" stroke-width="6">
    <line x1="407" y1="700" x2="600" y2="700"/><line x1="390" y1="560" x2="600" y2="560"/>
    <line x1="372" y1="420" x2="600" y2="420"/><line x1="355" y1="290" x2="600" y2="290"/>
    <line x1="342" y1="180" x2="600" y2="180"/><line x1="334" y1="90" x2="600" y2="90"/>
  </g>
  <!-- aisle floor gap seen as dark void -->
  <polygon points="180,800 420,800 330,120 270,120" fill="#0a0a0a"/>

  <!-- glass catwalk overhead -->
  <polygon points="150,330 450,330 470,380 130,380" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="2"/>

  <!-- desk lamp clamped to left shelf: hard point light -->
  <rect x="0" y="0" width="600" height="800" fill="url(#glow)"/>
  <g stroke="#fff" stroke-width="5" fill="none">
    <path d="M40,560 L90,500 L130,520"/>
  </g>
  <rect x="25" y="555" width="40" height="10" fill="#fff"/>
  <path d="M120,505 L160,525 L140,550 Z" fill="#fff"/>
  <circle cx="145" cy="535" r="7" fill="#FFF44F"/>

  <!-- hard shadow of cyclist cast on the right shelf -->
  <path d="M430,300 q60,-40 120,-10 l20,60 q-80,30 -140,-10 Z" fill="#000" opacity="0.8"/>

  <!-- bicycle, seen from beneath through the glass -->
  <g stroke="#fff" stroke-width="5" fill="none">
    <ellipse cx="220" cy="355" rx="48" ry="18"/>
    <ellipse cx="380" cy="355" rx="48" ry="18"/>
    <path d="M220,355 L290,345 L380,355 M290,345 L320,320 L360,322 M290,345 L270,318"/>
    <line x1="352" y1="315" x2="372" y2="328"/>
  </g>
  <circle cx="290" cy="345" r="7" fill="#fff"/>

  <!-- pelican body from below -->
  <ellipse cx="285" cy="290" rx="62" ry="40" fill="#fff" stroke="#000" stroke-width="3"/>
  <!-- webbed feet on pedals -->
  <path d="M270,325 l-12,22 l24,0 Z M305,325 l0,24 l20,-6 Z" fill="#fff" stroke="#000" stroke-width="2"/>
  <!-- wings gripping handlebars -->
  <path d="M320,285 Q360,290 365,318" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M250,280 Q215,250 190,262" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- neck & head leaning over the rail -->
  <path d="M300,258 Q330,210 360,215" stroke="#fff" stroke-width="16" fill="none" stroke-linecap="round"/>
  <circle cx="365" cy="212" r="18" fill="#fff" stroke="#000" stroke-width="3"/>
  <!-- mischievous eye -->
  <circle cx="370" cy="206" r="5" fill="#000"/>
  <path d="M360,196 l16,4" stroke="#000" stroke-width="3"/>
  <!-- beak and pouch stuffed with a stolen book -->
  <path d="M380,212 L470,238 L382,224 Z" fill="#fff" stroke="#000" stroke-width="2"/>
  <path d="M382,224 Q430,275 468,238" fill="#ddd" stroke="#000" stroke-width="2"/>
  <rect x="418" y="238" width="22" height="14" fill="#000" transform="rotate(20 429 245)"/>

  <!-- gap in the shelf where the book used to be -->
  <rect x="520" y="292" width="20" height="32" fill="#000" stroke="#FFF44F" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- motion marks -->
  <g stroke="#fff" stroke-width="2">
    <line x1="120" y1="300" x2="160" y2="300"/><line x1="110" y1="320" x2="150" y2="320"/>
  </g>
</svg>