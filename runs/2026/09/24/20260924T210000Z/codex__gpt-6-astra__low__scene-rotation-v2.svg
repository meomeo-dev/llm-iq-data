             patternTransform="rotate(26)">
      <path d="M0 0V12" stroke="#fff" stroke-width="2"/>
    </pattern>
    <g id="spokes" stroke="#fff" stroke-width="2">
      <path d="M0-145V145M-145 0H145M-103-103L103 103M-103 103L103-103
               M-55-134L55 134M-134-55L134 55M-134 55L134-55
               M-55 134L55-134"/>
    </g>
    <g id="wheel">
