      <circle r="145" fill="#fff" stroke="#080808" stroke-width="5"/>
      <circle r="137" fill="#080808"/>
      <use href="#spokes"/>
      <circle r="19" fill="#fff" stroke="#080808" stroke-width="5"/>
      <circle r="6" fill="#080808"/>
    </g>
  </defs>

