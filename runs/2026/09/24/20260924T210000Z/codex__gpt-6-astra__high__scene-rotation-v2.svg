<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">A Very Overdue Pelican</title>
  <desc id="desc">A mischievous pelican rides a bicycle directly above a floor-level observer in a narrow library aisle. Towering shelves converge toward the ceiling. One desk lamp casts stark shadows across a black-and-white scene, with a single lemon-yellow bill and pouch.</desc>

