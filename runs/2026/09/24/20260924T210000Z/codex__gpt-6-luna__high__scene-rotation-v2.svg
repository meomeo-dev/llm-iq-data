<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">The Midnight Library Ride</title>
  <desc id="desc">A mischievous pelican pedals a bicycle high above a narrow library aisle, seen from the floor looking straight up. A single lemon-yellow desk lamp casts a hard beam through the black-and-white scene.</desc>

  <defs>
    <radialGradient id="night" cx="50%" cy="43%" r="75%">
      <stop offset="0" stop-color="#303030"/>
      <stop offset=".55" stop-color="#111"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="-.55" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="bookLines" width="26" height="42" patternUnits="userSpaceOnUse">
      <path d="M3 4h17v34H3z" fill="#101010" stroke="#8b8b8b" stroke-width="1.5"/>
      <path d="M7 9h9M7 32h9" stroke="#d5d5d5" stroke-width="1"/>
      <path d="M22 7v30" stroke="#fff" stroke-opacity=".3"/>
    </pattern>
    <pattern id="fineBooks" width="19" height="34" patternUnits="userSpaceOnUse">
      <path d="M2 3h13v27H2z" fill="#191919" stroke="#777" stroke-width="1"/>
      <path d="M5 7h7M5 25h7" stroke="#ddd" stroke-width=".8"/>
    </pattern>
    <filter id="softShadow" x="-.3" y="-.3" width="1.6" height="1.6">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#night)"/>

  <!-- Shelves rise around the viewer and converge far overhead. -->
  <path d="M0 0h280L390 390 315 1000H0z" fill="#080808"/>
  <path d="M800 0H520L410 390 485 1000h315z" fill="#080808"/>
  <path d="M0 0h280l110 390-31 63L0 220z" fill="url(#bookLines)"/>
  <path d="M800 0H520L410 390l31 63L800 220z" fill="url(#bookLines)"/>
  <path d="M0 262 364 490l-10 43L0 340z" fill="url(#fineBooks)"/>
  <path d="M800 262 436 490l10 43 354-193z" fill="url(#fineBooks)"/>
  <path d="M0 393 350 557l-8 42L0 466z" fill="url(#bookLines)"/>
  <path d="M800 393 450 557l8 42 342-133z" fill="url(#bookLines)"/>
  <path d="M0 548 337 626l-5 43L0 619z" fill="url(#fineBooks)"/>
  <path d="M800 548 463 626l5 43 332-50z" fill="url(#fineBooks)"/>
  <path d="M0 0 280 0 390 390M800 0 520 0 410 390"
        fill="none" stroke="#e6e6e6" stroke-width="8"/>
  <path d="M0 220 390 453M800 220 410 453M0 340 354 533M800 340 446 533"
        fill="none" stroke="#bbb" stroke-width="5"/>

  <!-- Ceiling geometry emphasizes the straight-up, floor-level viewpoint. -->
  <path d="M280 0h240L410 390 390 390z" fill="#1b1b1b" stroke="#aaa" stroke-width="3"/>
  <path d="M316 0 396 390M484 0 414 390" stroke="#666" stroke-width="2"/>
  <path d="M367 0h66l-22 390h-20z" fill="#0a0a0a"/>
  <path d="M386 65h28v8h-28zM382 142h35v7h-35zM378 226h43v7h-43z"
        fill="#eee" opacity=".65"/>

  <!-- A hard pool of light cuts across the aisle. -->
  <path d="M706 298 390 540 800 714 800 330z" fill="url(#beam)"/>
  <ellipse cx="610" cy="410" rx="102" ry="34" fill="#fff" opacity=".13" filter="url(#softShadow)"/>

  <!-- The desk lamp: the scene's only lemon-yellow accent. -->
  <g transform="translate(694 291) rotate(24)">
    <path d="M0 0 27-51 45-43 25 7" fill="#d8d8d8" stroke="#090909" stroke-width="5"/>
    <path d="M11-62q25-20 51 1l-13 32-46-7z" fill="#171717" stroke="#fff" stroke-width="4"/>
    <path d="M19-57q17-11 33 1l-7 14-30-5z" fill="#f5df45"/>
    <path d="M20 6h36v8H20z" fill="#eee" stroke="#111" stroke-width="3"/>
  </g>

  <!-- Bicycle silhouette, tilted as it sails over the viewer. -->
  <g transform="translate(0 14) rotate(-8 405 500)">
    <ellipse cx="404" cy="591" rx="176" ry="22" fill="#000" opacity=".5" filter="url(#softShadow)"/>
    <g fill="none" stroke="#f4f4f4" stroke-width="8">
      <circle cx="288" cy="520" r="91"/>
      <circle cx="525" cy="520" r="91"/>
    </g>
    <g stroke="#9e9e9e" stroke-width="2" opacity=".8">
      <path d="M288 429v182M197 520h182M224 456l128 128M352 456 224 584"/>
      <path d="M525 429v182M434 520h182M461 456l128 128M589 456 461 584"/>
    </g>
    <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="m288 520 105-84 64 84-169 0 57-117 87 117 47-96"/>
      <path d="m374 319 35 0M446 424l41 0"/>
    </g>
    <circle cx="393" cy="436" r="12" fill="#111" stroke="#fff" stroke-width="5"/>
    <circle cx="288" cy="520" r="8" fill="#fff"/>
    <circle cx="525" cy="520" r="8" fill="#fff"/>
    <path d="m474 424 34 0M355 319l45 0" stroke="#fff" stroke-width="7" stroke-linecap="round"/>

    <!-- Pelican rider: eye, crest, long bill, pouch, and determined little legs. -->
    <g stroke="#101010" stroke-width="5" stroke-linejoin="round">
      <path d="M364 300q-15-44 10-80 24-34 63-20 31 11 33 47l-18 37-50 22z"
            fill="#f6f6f6"/>
      <path d="M383 215q-10-24 7-35M403 201q-2-24 17-32M422 201q9-22 30-22"
            fill="none" stroke="#eee" stroke-width="6" stroke-linecap="round"/>
      <path d="M454 229q43-15 86-5-24 26-80 32z" fill="#fff"/>
      <path d="M455 254q50 0 74 21-35 38-78 3z" fill="#cfcfcf"/>
      <circle cx="440" cy="220" r="5" fill="#111"/>
      <path d="M398 276q-23 34-25 69l52 24 31-38-7-47z" fill="#fafafa"/>
      <path d="M386 338q31 8 65 4l-10 28q-37 1-61-13z" fill="#eee"/>
      <path d="m412 352-28 35 38 4 22-34M450 355l-1 38 29-5-1-37"
            fill="#f5f5f5"/>
      <path d="m380 386-20 9M479 388l22 7" fill="none" stroke-width="7"
            stroke-linecap="round"/>
      <path d="M374 291q-26 3-39 25M463 283q27 10 36 30"
            fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Comic motion marks and a tiny dropped library card. -->
  <path d="m233 366-22-13m35-8-13-20m300 53 23-15m-19 41 28-3"
        fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(556 635) rotate(18)">
    <path d="M0 0h62v42H0z" fill="#eee" stroke="#111" stroke-width="4"/>
    <path d="M9 12h42M9 21h32M9 30h37" stroke="#222" stroke-width="2"/>
    <path d="M47 5h9v7h-9z" fill="#111"/>
  </g>

  <text x="40" y="955" fill="#d9d9d9" font-family="serif" font-size="17"
        letter-spacing="4">AFTER HOURS • QUIET, PLEASE</text>
</svg>