<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE23A" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFE23A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFE23A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="800" height="800"/></clipPath>
  </defs>

  <!-- floor-to-sky: black void above -->
  <rect width="800" height="800" fill="#000"/>

  <g clip-path="url(#frame)">
    <!-- LEFT shelf, receding toward vanishing point (400,120) -->
    <polygon points="0,800 250,800 400,120 0,120" fill="#e8e8e8"/>
    <polygon points="0,800 250,800 400,120" fill="#c9c9c9"/>
    <!-- RIGHT shelf -->
    <polygon points="800,800 550,800 400,120 800,120" fill="#e8e8e8"/>
    <polygon points="800,800 550,800 400,120" fill="#c9c9c9"/>

    <!-- shelf planks converging (left) -->
    <g stroke="#000" stroke-width="10" stroke-linecap="round">
      <line x1="0" y1="700" x2="290" y2="640"/>
      <line x1="0" y1="560" x2="320" y2="500"/>
      <line x1="0" y1="440" x2="345" y2="380"/>
      <line x1="0" y1="340" x2="365" y2="290"/>
      <line x1="0" y1="255" x2="380" y2="215"/>
      <line x1="0" y1="185" x2="392" y2="160"/>
    </g>
    <!-- shelf planks (right) -->
    <g stroke="#000" stroke-width="10" stroke-linecap="round">
      <line x1="800" y1="700" x2="510" y2="640"/>
      <line x1="800" y1="560" x2="480" y2="500"/>
      <line x1="800" y1="440" x2="455" y2="380"/>
      <line x1="800" y1="340" x2="435" y2="290"/>
      <line x1="800" y1="255" x2="420" y2="215"/>
      <line x1="800" y1="185" x2="408" y2="160"/>
    </g>

    <!-- book spines, left -->
    <g fill="#000">
      <rect x="20" y="712" width="34" height="80" transform="skewY(-12)"/>
      <rect x="70" y="710" width="22" height="80" transform="skewY(-12)"/>
      <rect x="110" y="712" width="40" height="76" transform="skewY(-12)"/>
      <rect x="170" y="708" width="26" height="80" transform="skewY(-12)"/>
      <rect x="30" y="590" width="30" height="60" transform="skewY(-12)"/>
      <rect x="80" y="590" width="20" height="62" transform="skewY(-12)"/>
      <rect x="120" y="588" width="36" height="60" transform="skewY(-12)"/>
      <rect x="180" y="586" width="22" height="60" transform="skewY(-12)"/>
      <rect x="230" y="584" width="30" height="58" transform="skewY(-12)"/>
      <rect x="40" y="480" width="24" height="46" transform="skewY(-12)"/>
      <rect x="90" y="478" width="30" height="46" transform="skewY(-12)"/>
      <rect x="140" y="476" width="18" height="46" transform="skewY(-12)"/>
      <rect x="190" y="474" width="34" height="44" transform="skewY(-12)"/>
      <rect x="250" y="472" width="22" height="44" transform="skewY(-12)"/>
      <rect x="60" y="390" width="20" height="34" transform="skewY(-12)"/>
      <rect x="110" y="388" width="26" height="34" transform="skewY(-12)"/>
      <rect x="170" y="386" width="18" height="34" transform="skewY(-12)"/>
      <rect x="220" y="384" width="28" height="32" transform="skewY(-12)"/>
      <rect x="120" y="310" width="16" height="24" transform="skewY(-12)"/>
      <rect x="160" y="308" width="22" height="24" transform="skewY(-12)"/>
      <rect x="210" y="306" width="14" height="24" transform="skewY(-12)"/>
      <rect x="260" y="304" width="20" height="22" transform="skewY(-12)"/>
    </g>
    <!-- book spines, right (mirrored) -->
    <g fill="#000" transform="translate(800,0) scale(-1,1)">
      <rect x="20" y="712" width="34" height="80" transform="skewY(-12)"/>
      <rect x="70" y="710" width="22" height="80" transform="skewY(-12)"/>
      <rect x="110" y="712" width="40" height="76" transform="skewY(-12)"/>
      <rect x="170" y="708" width="26" height="80" transform="skewY(-12)"/>
      <rect x="30" y="590" width="30" height="60" transform="skewY(-12)"/>
      <rect x="80" y="590" width="20" height="62" transform="skewY(-12)"/>
      <rect x="120" y="588" width="36" height="60" transform="skewY(-12)"/>
      <rect x="180" y="586" width="22" height="60" transform="skewY(-12)"/>
      <rect x="230" y="584" width="30" height="58" transform="skewY(-12)"/>
      <rect x="40" y="480" width="24" height="46" transform="skewY(-12)"/>
      <rect x="90" y="478" width="30" height="46" transform="skewY(-12)"/>
      <rect x="140" y="476" width="18" height="46" transform="skewY(-12)"/>
      <rect x="190" y="474" width="34" height="44" transform="skewY(-12)"/>
      <rect x="250" y="472" width="22" height="44" transform="skewY(-12)"/>
      <rect x="60" y="390" width="20" height="34" transform="skewY(-12)"/>
      <rect x="110" y="388" width="26" height="34" transform="skewY(-12)"/>
      <rect x="170" y="386" width="18" height="34" transform="skewY(-12)"/>
      <rect x="220" y="384" width="28" height="32" transform="skewY(-12)"/>
      <rect x="120" y="310" width="16" height="24" transform="skewY(-12)"/>
      <rect x="160" y="308" width="22" height="24" transform="skewY(-12)"/>
      <rect x="210" y="306" width="14" height="24" transform="skewY(-12)"/>
      <rect x="260" y="304" width="20" height="22" transform="skewY(-12)"/>
    </g>

    <!-- one loose book tumbling down toward viewer -->
    <g transform="translate(560,300) rotate(35)">
      <rect x="-22" y="-14" width="44" height="28" fill="#fff" stroke="#000" stroke-width="4"/>
      <line x1="-22" y1="-4" x2="22" y2="-4" stroke="#000" stroke-width="3"/>
    </g>

    <!-- shelf tops meeting at the ceiling edge: the "tightrope" -->
    <line x1="0" y1="120" x2="800" y2="120" stroke="#000" stroke-width="6"/>
    <rect x="0" y="0" width="800" height="118" fill="#000"/>

    <!-- desk lamp: hard point source, top left, tilted down at the pelican -->
    <g transform="translate(150,60)">
      <circle cx="110" cy="70" r="170" fill="url(#lampGlow)"/>
      <line x1="-60" y1="-50" x2="40" y2="30" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <path d="M40,30 L120,-10 L140,50 L60,90 Z" fill="#fff" stroke="#000" stroke-width="3"/>
      <ellipse cx="100" cy="70" rx="42" ry="18" transform="rotate(-27 100 70)" fill="#FFE23A"/>
    </g>
    <!-- hard light beam -->
    <polygon points="250,130 180,110 520,260 560,330" fill="#FFE23A" fill-opacity="0.22"/>

    <!-- cast shadow of pelican+bike on the right shelf face, thrown away from lamp -->
    <g fill="#000" fill-opacity="0.85" transform="translate(470,200) skewX(35) scale(1.25,1.9)">
      <circle cx="0" cy="0" r="16"/>
      <ellipse cx="6" cy="-22" rx="14" ry="10"/>
      <path d="M-8,-22 L-40,-10 L-8,-14 Z"/>
      <circle cx="-18" cy="30" r="13" fill="none" stroke="#000" stroke-width="5"/>
      <circle cx="26" cy="30" r="13" fill="none" stroke="#000" stroke-width="5"/>
    </g>

    <!-- PELICAN ON BICYCLE, seen from below, riding the shelf-top ledge -->
    <g transform="translate(400,175) scale(1.35)">
      <!-- wheels -->
      <g fill="none" stroke="#000" stroke-width="4">
        <circle cx="-38" cy="-2" r="22" fill="#fff"/>
        <circle cx="38" cy="-2" r="22" fill="#fff"/>
        <circle cx="-38" cy="-2" r="3" fill="#000"/>
        <circle cx="38" cy="-2" r="3" fill="#000"/>
        <line x1="-38" y1="-24" x2="-38" y2="20"/>
        <line x1="-60" y1="-2" x2="-16" y2="-2"/>
        <line x1="-53" y1="-17" x2="-23" y2="13"/>
        <line x1="-53" y1="13" x2="-23" y2="-17"/>
        <line x1="38" y1="-24" x2="38" y2="20"/>
        <line x1="16" y1="-2" x2="60" y2="-2"/>
        <line x1="23" y1="-17" x2="53" y2="13"/>
        <line x1="23" y1="13" x2="53" y2="-17"/>
      </g>
      <!-- frame -->
      <g fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-38,-2 L-10,-30 L22,-30 L38,-2"/>
        <path d="M-10,-30 L4,-4 L38,-2"/>
        <path d="M4,-4 L-38,-2"/>
        <line x1="22" y1="-30" x2="30" y2="-46"/>
        <line x1="-10" y1="-30" x2="-16" y2="-44"/>
      </g>
      <!-- handlebar and seat -->
      <line x1="18" y1="-48" x2="42" y2="-48" stroke="#000" stroke-width="5" stroke-linecap="round"/>
      <rect x="-26" y="-50" width="20" height="7" rx="3" fill="#000"/>
      <!-- pedals -->
      <circle cx="4" cy="-4" r="6" fill="#fff" stroke="#000" stroke-width="4"/>
      <line x1="4" y1="-4" x2="14" y2="6" stroke="#000" stroke-width="4"/>
      <line x1="4" y1="-4" x2="-6" y2="-14" stroke="#000" stroke-width="4"/>

      <!-- pelican body (belly toward us, underlit) -->
      <ellipse cx="-4" cy="-70" rx="30" ry="24" fill="#fff" stroke="#000" stroke-width="4"/>
      <!-- lemon highlight from the lamp on the belly -->
      <ellipse cx="-14" cy="-80" rx="12" ry="7" fill="#FFE23A"/>
      <!-- webbed feet on the pedals -->
      <path d="M14,6 l-8,8 l4,-1 l-2,6 l5,-4 l3,5 l1,-6 l5,2 z" fill="#FFE23A" stroke="#000" stroke-width="2"/>
      <path d="M-6,-14 l-9,6 l4,0 l-3,5 l5,-3 l2,5 l2,-5 l5,2 z" fill="#FFE23A" stroke="#000" stroke-width="2"/>
      <!-- legs -->
      <line x1="2" y1="-52" x2="12" y2="4" stroke="#000" stroke-width="4"/>
      <line x1="-8" y1="-52" x2="-6" y2="-14" stroke="#000" stroke-width="4"/>
      <!-- wings gripping handlebar -->
      <path d="M18,-78 Q40,-70 34,-50" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
      <path d="M12,-72 Q30,-66 28,-50" fill="#fff" stroke="#000" stroke-width="3"/>
      <!-- neck -->
      <path d="M6,-90 Q24,-110 30,-130" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
      <path d="M6,-90 Q24,-110 30,-130" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="34" cy="-138" r="15" fill="#fff" stroke="#000" stroke-width="4"/>
      <!-- eye: mischievous half-lid + glint -->
      <circle cx="40" cy="-142" r="5" fill="#000"/>
      <circle cx="42" cy="-144" r="1.6" fill="#fff"/>
      <path d="M33,-148 L47,-146" stroke="#000" stroke-width="3" stroke-linecap="round"/>
      <!-- beak: long, with a stolen book clamped in the pouch -->
      <path d="M46,-136 L100,-124 L48,-118 Z" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
      <path d="M48,-118 Q70,-96 100,-124" fill="#fff" stroke="#000" stroke-width="4"/>
      <rect x="62" y="-121" width="22" height="9" fill="#000" transform="rotate(-8 73 -116)"/>
      <!-- lamp-lit rim on the pouch -->
      <path d="M52,-116 Q70,-100 94,-120" fill="none" stroke="#FFE23A" stroke-width="3" stroke-linecap="round"/>
      <!-- speed lines: it is getting away -->
      <g stroke="#fff" stroke-width="3" stroke-linecap="round">
        <line x1="-70" y1="-60" x2="-95" y2="-58"/>
        <line x1="-72" y1="-75" x2="-100" y2="-78"/>
        <line x1="-60" y1="-92" x2="-88" y2="-100"/>
      </g>
    </g>

    <!-- two tiny books wobbling off the shelf edge, disturbed by the getaway -->
    <g fill="#fff" stroke="#000" stroke-width="3">
      <rect x="240" y="104" width="26" height="16" transform="rotate(-18 253 112)"/>
      <rect x="560" y="106" width="22" height="14" transform="rotate(22 571 113)"/>
    </g>

    <!-- "SHHH" sign on the ceiling ledge, ignored -->
    <g transform="translate(660,40)">
      <rect x="-48" y="-18" width="96" height="36" fill="#fff" stroke="#000" stroke-width="3"/>
      <text x="0" y="8" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#000">SHHH!</text>
    </g>
  </g>
</svg>