<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a bicycle in a library aisle</title>
  <desc id="desc">A mischievous pelican rides a bicycle above a worm’s-eye view of towering black and white bookshelves. A single lemon-yellow lamp lights the scene.</desc>

  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="8%" r="76%">
      <stop offset="0" stop-color="#fff" stop-opacity=".96"/>
      <stop offset=".36" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scene">
      <path d="M0 0H900V1100H0Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#scene)">
    <rect width="900" height="1100" fill="#080808"/>

    <!-- Looking straight up: shelf faces converge toward a narrow strip of ceiling. -->
    <path d="M0 0H344L405 1100H0Z" fill="#f5f5f1"/>
    <path d="M900 0H556L495 1100H900Z" fill="#f5f5f1"/>
    <path d="M344 0H556L495 1100H405Z" fill="#111"/>
    <path d="M0 0H344L405 1100H0Z" fill="url(#lampGlow)" opacity=".5"/>
    <path d="M900 0H556L495 1100H900Z" fill="url(#lampGlow)" opacity=".34"/>

    <!-- Shelf uprights and long receding shelf edges. -->
    <g fill="none" stroke="#111" stroke-width="12">
      <path d="M340 0L400 1100M560 0L500 1100"/>
      <path d="M0 185L355 214M0 385L366 420M0 603L378 643M0 838L391 881"/>
      <path d="M900 185L545 214M900 385L534 420M900 603L522 643M900 838L509 881"/>
    </g>
    <g fill="none" stroke="#777" stroke-width="3">
