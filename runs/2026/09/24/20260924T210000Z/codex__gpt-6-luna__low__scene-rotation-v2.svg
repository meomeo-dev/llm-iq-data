    <g transform="rotate(-5 450 650)" stroke="#080808" stroke-linecap="round" stroke-linejoin="round">
      <g fill="none" stroke-width="10">
        <circle cx="327" cy="760" r="88" fill="#fafafa"/>
        <circle cx="604" cy="760" r="88" fill="#fafafa"/>
        <circle cx="327" cy="760" r="7" fill="#111"/>
        <circle cx="604" cy="760" r="7" fill="#111"/>
