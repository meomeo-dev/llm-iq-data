      <path fill="#fff" d="M890 458l-40 3-3 130 42 2zM833 448l-52-7 8 173 44 1zM767 473l-44-4-9 171 47 4zM704 449l-40 4-1 207 44 4zM647 473l-59-9 3 195 47 2z"/>
