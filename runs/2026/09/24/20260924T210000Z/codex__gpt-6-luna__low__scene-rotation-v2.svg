      <path fill="#fff" d="M895 696l-47-4-7 190 49 3zM830 704l-42-6-8 196 42 4zM769 721l-50-6-4 180 45 8zM703 701l-48 8 8 204 40-3zM636 731l-49-7-13 197 49 8z"/>
      <path fill="#111" d="M891 754l-43-4M829 768l-47-5M768 791l-49-6M704 772l-44 7M631 809l-50-7"/>
    </g>

