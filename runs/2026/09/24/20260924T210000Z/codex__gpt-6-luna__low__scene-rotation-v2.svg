      <path fill="#fff" d="M5 696l47-4 7 190-49 3zM70 704l42-6 8 196-42 4zM131 721l50-6 4 180-45 8zM197 701l48 8-8 204-40-3zM264 731l49-7 13 197-49 8z"/>
      <path fill="#111" d="M9 754l43-4M71 768l47-5M132 791l49-6M196 772l44 7M269 809l50-7"/>
      <path fill="#fff" d="M895 57l-43-4-9 125 44 4zM817 45l-50 4 3 139 49-2zM750 67l-37-8-12 128 39 5zM687 36l-53 8 16 153 49-6zM620 51l-34-3-9 166 35 2z"/>
