      <!-- Long neck and cheeky pelican head. -->
      <path d="M494 445q-9-77 13-129l51 8q-21 58 0 126"
            fill="#fff" stroke-width="9"/>
      <ellipse cx="535" cy="294" rx="72" ry="65" fill="#fff" stroke-width="9"/>
      <path d="M582 297q53-5 95 19-40 39-96 28-29-9-42-21z"
            fill="#fff" stroke-width="8"/>
      <path d="M584 325q47 3 78-8-6 62-62 77-36 6-62-22"
            fill="#fff" stroke-width="8"/>
      <path d="M589 328q37 3 66-6" fill="none" stroke-width="4"/>
      <circle cx="553" cy="282" r="7" fill="#080808" stroke="none"/>
      <path d="M535 265q15-14 29-7" fill="none" stroke-width="5"/>
      <path d="M579 257q17 7 24 20" fill="none" stroke-width="4"/>
      <path d="M492 287q-21-20-31-2" fill="none" stroke-width="7"/>
      <path d="M581 382q-31 14-49-12" fill="none" stroke-width="6"/>

      <!-- Wing and feet on pedals. -->
      <path d="M439 474q42-27 74 7-20 41-62 54l-32-24z"
            fill="#fff" stroke-width="7"/>
      <path d="M450 478q20 18 39 29M445 492q17 18 34 27" fill="none" stroke-width="4"/>
      <path d="M479 590q-17 27-9 58l34 8q9-37-2-66M453 596q-24 20-30 49l29 16q20-29 22-55"
            fill="#fff" stroke-width="7"/>
      <path d="M471 645l-35 5M503 654l-36 3" fill="none" stroke-width="7"/>

      <!-- Mischief lines and flying index card. -->
      <path d="M628 236l29-15M646 258l37-3M633 278l31 10" fill="none" stroke-width="5"/>
      <path d="M359 414q-44-26-62 13l48 35z" fill="#fff" stroke-width="6"/>
      <path d="M310 427l27 5" fill="none" stroke-width="3"/>
    </g>

    <!-- Bold vignette corners keep the view framed like a comic panel. -->
    <path d="M0 0h145L0 145zM900 0H755l145 145zM0 1100V955l145 145zM900 1100V955l-145 145z"
