      <path fill="#fff" d="M18 248l47 2-5 126-46-4zM78 234l36-5 15 150-40 3zM140 251l54-3-4 162-49-5zM212 238l44 5 1 174-45 2zM277 254l39-7 13 184-43 3z"/>
