<svg xmlns="http://www.w3.org/2000/svg"
     width="960" height="1200" viewBox="0 0 960 1200"
     role="img" aria-labelledby="title description">
  <title id="title">Quiet in the Stacks</title>
  <desc id="description">
    A mischievous pelican rides a bicycle directly above the viewer in a narrow
    library aisle. Towering bookshelves converge toward the ceiling in an
    exaggerated worm's-eye perspective. An articulated desk lamp casts a hard
    wedge of light and long shadows. The illustration is black and white with
    a single lemon-yellow accent on the pelican's enormous bill.
  </desc>

