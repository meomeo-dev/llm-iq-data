    <!-- One red scarf, pulled taut by the blizzard. -->
    <path d="M47-244
             C5-254-30-232-76-246
             L-143-255-121-237-150-226
             C-81-207-40-238 18-224L48-227Z"
          fill="#c93648" stroke="#a52a3c" stroke-width="3"
          stroke-linejoin="round"/>
    <path d="M-126-245Q-75-224-33-237"
          fill="none" stroke="#e85a66" stroke-width="3"/>
    <path d="M37-246Q57-247 68-229L56-212
             Q36-216 27-232Z"
          fill="#c93648" stroke="#a52a3c" stroke-width="3"/>

    <!-- Low head, pointed snout, and a focused eye. -->
    <path d="M28-251
             Q50-277 79-262
             Q96-253 109-235
             L151-216
             Q158-211 149-205
             L120-202
             Q99-193 74-208
             L53-210
             Q37-222 28-251Z"
          fill="#c6dfe9" stroke="#365b72" stroke-width="4"
          stroke-linejoin="round"/>
    <path d="M31-250 44-258 57-244 46-234Z
             M48-263 63-266 77-252 63-241Z
             M68-265 83-259 94-245 78-245Z"
          fill="#a4c5d6" stroke="#65889e" stroke-width="2"/>
    <path d="M56-236Q44-246 48-254Q62-258 67-242"
          fill="#a9c9da" stroke="#65889e" stroke-width="2.5"/>
    <path d="M87-236 104-229" fill="none"
          stroke="#365b72" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="96" cy="-229" rx="3.6" ry="4.4" fill="#203f54"/>
    <circle cx="97" cy="-230.5" r="1" fill="#ffffff"/>
    <path d="M145-217 153-213 148-207 143-209Z" fill="#294b62"/>
    <path d="M119-211 138-209" fill="none"
          stroke="#65889e" stroke-width="2" stroke-linecap="round"/>

    <!-- The forelimb reaches forward and grips the handlebar. -->
    <path d="M33-194
             Q49-202 62-184L79-163
             112-184Q120-192 128-186
             L134-178
             Q130-166 119-164L81-141
             Q69-134 58-145L31-173Z"
