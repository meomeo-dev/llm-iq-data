  <path d="M0 358 119 207 168 263 302 93 432 277 511 230
           652 389 766 268 835 311 951 170 1000 243V548H0Z"
        fill="#bbd1de"/>
  <path d="M166 263 302 93 432 277 349 227 313 174
           290 210 269 193 232 269 205 246Z"
        fill="#f3f8fa"/>
  <path d="M769 269 835 311 951 170 1000 243V300
           L957 241 934 259 916 245 851 348Z"
        fill="#edf5f8"/>
  <path d="M0 349 99 300 163 343 241 275 350 401
           428 355 567 467 673 405 773 460 875 365 1000 452
           V621H0Z" fill="#a4c1d2"/>
  <path d="M0 349 99 300 163 343 241 275 350 401
           268 357 241 325 222 352 199 350 159 379 90 340Z"
        fill="#e7f1f6"/>
  <path d="M674 405 773 460 875 365 1000 452 917 421
           879 407 855 435 821 437 777 490Z"
        fill="#d8e8f0"/>

