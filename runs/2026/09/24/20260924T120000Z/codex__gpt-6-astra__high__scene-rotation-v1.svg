    <!-- Small wheels, visible tires, and the scooter deck. -->
    <g stroke="#294b62" stroke-width="5">
      <circle cx="-111" cy="26" r="24" fill="#476c83"/>
      <circle cx="137" cy="26" r="24" fill="#476c83"/>
      <circle cx="-111" cy="26" r="13" fill="#dcecf3" stroke-width="3"/>
      <circle cx="137" cy="26" r="13" fill="#dcecf3" stroke-width="3"/>
    </g>
    <g fill="none" stroke="#7fa5bb" stroke-width="3">
