<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"
     viewBox="0 0 1000 760" role="img"
     aria-labelledby="title description">
  <title id="title">Pangolin riding through a mountain blizzard</title>
  <desc id="description">
    A determined, armored pangolin leans into the wind on a kick scooter,
    descending diagonally across an icy mountain pass. Snow streaks through
    a flat blue and white landscape. A red scarf is the only warm accent.
  </desc>

  <defs>
    <pattern id="scales" width="46" height="44"
             patternUnits="userSpaceOnUse">
      <rect width="46" height="44" fill="#a5c4d4"/>
      <path d="M-23 0 Q0-12 23 0 L18 15 0 29-18 15Z
               M23 0 Q46-12 69 0 L64 15 46 29 28 15Z
               M0 22 Q23 10 46 22 L41 37 23 51 5 37Z"
            fill="#bed7e2" stroke="#65889e" stroke-width="2"/>
      <path d="M-15 3 Q0-3 15 3 M31 3 Q46-3 61 3
               M8 25 Q23 19 38 25"
            fill="none" stroke="#e7f2f6" stroke-width="2"/>
    </pattern>
    <pattern id="tail-scales" width="28" height="28"
             patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <rect width="28" height="28" fill="#9bbccc"/>
      <path d="M-14 0 Q0-7 14 0 L10 10 0 19-10 10Z
               M14 0 Q28-7 42 0 L38 10 28 19 18 10Z
               M0 14 Q14 7 28 14 L24 24 14 33 4 24Z"
            fill="#b8d2df" stroke="#65889e" stroke-width="1.6"/>
    </pattern>
  </defs>

  <!-- Overcast sky and the enclosing mountain pass. -->
  <rect width="1000" height="760" fill="#d9e8ef"/>
  <path d="M0 113 83 141 162 124 258 147 339 132 451 158
