               M105 393 67 402M755 509 719 518M993 431 958 439
               M244 661 204 671M576 662 544 670"/>
    </g>
  </g>

  <g fill="#ffffff">
    <circle cx="124" cy="148" r="3"/>
    <circle cx="398" cy="69" r="2.5"/>
    <circle cx="615" cy="184" r="3"/>
    <circle cx="778" cy="87" r="4"/>
    <circle cx="924" cy="309" r="3"/>
    <circle cx="202" cy="367" r="4"/>
    <circle cx="351" cy="405" r="3"/>
    <circle cx="505" cy="390" r="2.5"/>
    <circle cx="761" cy="463" r="4"/>
