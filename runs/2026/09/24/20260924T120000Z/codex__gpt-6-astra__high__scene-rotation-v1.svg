  <g fill="none" stroke="#f4f9fb" stroke-linecap="round">
    <path d="M-50 286 373 206 M387 266 817 185 M715 341 1050 278"
          stroke-width="23" opacity=".48"/>
    <path d="M-40 415 239 362 M525 377 936 299"
          stroke-width="13" opacity=".56"/>
  </g>

  <!-- The pass slopes downward from left to right. -->
  <path d="M0 437 169 473 307 500 454 538 603 570
           779 613 1000 661V760H0Z" fill="#f4f9fb"/>
  <path d="M0 461 173 499 317 525 458 563 623 600
           802 641 1000 686"
        fill="none" stroke="#c5dce8" stroke-width="9"/>
  <path d="M0 585 167 610 305 648 405 660 568 705 793 741
           865 760H0Z" fill="#dcecf3"/>
  <path d="M0 635 202 670 401 722 536 742 578 760H0Z"
        fill="#c0d9e6"/>
  <path d="M18 471 107 490 135 505 49 486Z
