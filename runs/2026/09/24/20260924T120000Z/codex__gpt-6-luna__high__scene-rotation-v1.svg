<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc">
  <title id="title">Pangolin on a kick scooter in a blizzard</title>
  <desc id="desc">A determined pangolin rides down a steep snowy mountain pass as wind drives snow across the icy blue landscape.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#dcebf1"/>
      <stop offset="1" stop-color="#a9c5d2"/>
    </linearGradient>
    <linearGradient id="slope" x2="0.15" y2="1">
      <stop offset="0" stop-color="#f8fcfd"/>
      <stop offset="1" stop-color="#c5dce5"/>
    </linearGradient>
    <linearGradient id="armor" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7895a3"/>
      <stop offset="1" stop-color="#496776"/>
    </linearGradient>
    <g id="flake" fill="#fff" opacity=".9">
      <path d="M0-7 1.3-1.3 6-4 3-0.5 7 1 1.5 1.2 2.5 6-0.3 2.4-4 6-2 1.2-7 0-1.7-.8-4-5-0.8-1.8Z"/>
    </g>
    <g id="scale">
      <path d="M0 0 Q9-8 18 0 Q16 9 9 12 Q2 9 0 0Z" fill="url(#armor)" stroke="#344f5c" stroke-width="2"/>
      <path d="M3 1 Q9-4 15 1" fill="none" stroke="#b2c8d0" stroke-width="1.5" opacity=".75"/>
    </g>
  </defs>

  <!-- Clouded mountain pass -->
  <rect width="1024" height="768" fill="url(#sky)"/>
  <path d="M0 283 118 151 202 237 337 87 454 229 592 112 735 254 849 119 1024 273V515L0 424Z"
        fill="#91adba" opacity=".55"/>
  <path d="m118 151 36 40-42-12-21 28 27-56Zm219-64 47 58-48-19-30 34 31-73Zm255 25 52 55-49-18-30 30 27-67Zm257 7 53 65-56-29-27 31 30-67Z"
        fill="#edf5f7" opacity=".9"/>
  <path d="M0 354 171 263 288 344 427 242 565 344 725 236 863 346 1024 279V517L0 433Z"
        fill="#b4cbd4" opacity=".78"/>
  <path d="M0 376 156 314 264 383 418 294 570 392 727 290 879 390 1024 332V768H0Z"
        fill="#d5e5ea"/>

  <!-- Wind-carved slope, descending to the right -->
  <path d="M0 339 Q188 382 365 443 Q580 519 760 605 Q911 676 1024 704V768H0Z"
        fill="url(#slope)"/>
  <path d="M0 339 Q188 382 365 443 Q580 519 760 605 Q911 676 1024 704"
        fill="none" stroke="#fff" stroke-width="12" opacity=".88"/>
  <path d="M-40 403 Q210 437 402 511 Q622 594 798 675"
        fill="none" stroke="#a8c6d1" stroke-width="5" opacity=".55"/>
  <path d="M-25 473 Q202 491 370 558" fill="none" stroke="#fff" stroke-width="4" opacity=".75"/>
  <path d="M810 725 Q906 751 1045 758" fill="none" stroke="#a9c6d1" stroke-width="4" opacity=".65"/>

  <!-- Blowing snow -->
  <g fill="none" stroke="#f8fcfd" stroke-linecap="round" opacity=".72">
    <path d="M42 124h169M266 173h97M713 120h190M80 228h226M584 207h146M839 239h145"
          stroke-width="4"/>
    <path d="M-20 192h128M399 144h179M652 278h251M194 287h106M10 556h194M842 501h173"
          stroke-width="3"/>
  </g>
  <g>
    <use href="#flake" x="226" y="123"/>
    <use href="#flake" x="478" y="184"/>
    <use href="#flake" x="790" y="163"/>
    <use href="#flake" x="941" y="204"/>
    <use href="#flake" x="364" y="269" transform="scale(.7) translate(156 115)"/>
    <use href="#flake" x="86" y="300" transform="scale(.8) translate(22 75)"/>
    <use href="#flake" x="882" y="440"/>
    <use href="#flake" x="306" y="364" transform="scale(.65) translate(164 196)"/>
    <use href="#flake" x="982" y="574" transform="scale(.8) translate(246 144)"/>
    <use href="#flake" x="457" y="677"/>
    <use href="#flake" x="152" y="629" transform="scale(.7) translate(65 269)"/>
    <circle cx="251" cy="202" r="4" fill="#fff"/>
    <circle cx="683" cy="155" r="3" fill="#fff"/>
    <circle cx="922" cy="358" r="4" fill="#fff"/>
    <circle cx="355" cy="590" r="3" fill="#fff"/>
    <circle cx="74" cy="683" r="4" fill="#fff"/>
  </g>

  <!-- Scooter wheels and frame -->
  <g stroke="#334f5b" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="581" cy="589" r="25" fill="#526f7c" stroke-width="6"/>
    <circle cx="581" cy="589" r="9" fill="#dcebf0" stroke-width="4"/>
    <circle cx="800" cy="665" r="25" fill="#526f7c" stroke-width="6"/>
    <circle cx="800" cy="665" r="9" fill="#dcebf0" stroke-width="4"/>
    <path d="M581 589 632 608 777 658 800 665" fill="none" stroke-width="12"/>
    <path d="m632 608 15-126" fill="none" stroke-width="10"/>
    <path d="m621 480 50 15" fill="none" stroke-width="9"/>
    <path d="M612 478 635 484M661 493l23 7" fill="none" stroke="#91aeb9" stroke-width="7"/>
  </g>

  <!-- Pangolin tail, curling back into the wind -->
  <path d="M620 486 Q573 451 534 470 Q491 491 476 533 Q463 568 490 580 Q514 590 541 572"
        fill="none" stroke="#354f5b" stroke-width="49" stroke-linecap="round"/>
  <path d="M620 486 Q573 451 534 470 Q491 491 476 533 Q463 568 490 580 Q514 590 541 572"
        fill="none" stroke="url(#armor)" stroke-width="40" stroke-linecap="round"/>
  <g transform="translate(0 0) rotate(-24 532 515)">
    <use href="#scale" x="490" y="485"/>
    <use href="#scale" x="508" y="477"/>
    <use href="#scale" x="526" y="475"/>
    <use href="#scale" x="544" y="481"/>
    <use href="#scale" x="481" y="505"/>
    <use href="#scale" x="499" y="499"/>
    <use href="#scale" x="517" y="497"/>
    <use href="#scale" x="535" y="501"/>
    <use href="#scale" x="476" y="526"/>
    <use href="#scale" x="494" y="520"/>
    <use href="#scale" x="512" y="519"/>
    <use href="#scale" x="530" y="523"/>
    <use href="#scale" x="480" y="547"/>
    <use href="#scale" x="498" y="542"/>
    <use href="#scale" x="516" y="542"/>
  </g>

  <!-- Rear leg and planted foot -->
  <path d="M659 516 Q640 550 649 579 L617 594 Q607 601 616 608 Q638 614 661 601 L687 583 691 542Z"
        fill="#748f9b" stroke="#344f5c" stroke-width="6" stroke-linejoin="round"/>
  <path d="m617 594 28 4-8 12q-16 6-26-2Z" fill="#9eb5be" stroke="#344f5c" stroke-width="4"/>

  <!-- Bent body -->
  <path d="M603 451 Q617 412 669 402 Q714 394 741 424 Q752 450 722 491
           Q697 529 656 535 Q623 522 606 495 Q594 474 603 451Z"
        fill="url(#armor)" stroke="#344f5c" stroke-width="7" stroke-linejoin="round"/>
  <!-- Overlapping armor plates -->
  <g>
    <use href="#scale" x="612" y="429"/>
    <use href="#scale" x="631" y="415"/>
    <use href="#scale" x="650" y="410"/>
    <use href="#scale" x="669" y="411"/>
    <use href="#scale" x="688" y="418"/>
    <use href="#scale" x="705" y="431"/>
    <use href="#scale" x="601" y="450"/>
    <use href="#scale" x="620" y="441"/>
    <use href="#scale" x="639" y="435"/>
    <use href="#scale" x="658" y="435"/>
    <use href="#scale" x="677" y="441"/>
    <use href="#scale" x="696" y="450"/>
    <use href="#scale" x="610" y="471"/>
    <use href="#scale" x="629" y="461"/>
    <use href="#scale" x="648" y="459"/>
    <use href="#scale" x="667" y="463"/>
    <use href="#scale" x="686" y="471"/>
    <use href="#scale" x="625" y="491"/>
    <use href="#scale" x="644" y="484"/>
    <use href="#scale" x="663" y="486"/>
    <use href="#scale" x="681" y="493"/>
    <use href="#scale" x="643" y="511"/>
    <use href="#scale" x="662" y="508"/>
  </g>

  <!-- Scarf: the single red accent -->
  <path d="M683 407 Q701 394 721 409 L738 426 713 439 691 426Z"
        fill="#c94743" stroke="#344f5c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M709 427 Q732 436 751 455 L743 464 Q719 453 699 439Z"
        fill="#c94743" stroke="#344f5c" stroke-width="4" stroke-linejoin="round"/>
  <path d="m744 452 17 9-17 1Z" fill="#c94743" stroke="#344f5c" stroke-width="3"/>

  <!-- Long head and tapered snout, facing downhill -->
  <path d="M680 407 Q685 378 710 363 Q732 350 752 365
           Q765 375 759 391 L812 411 Q821 415 815 422
           Q798 433 764 427 Q748 452 721 448 Q694 442 680 407Z"
        fill="#829da8" stroke="#344f5c" stroke-width="7" stroke-linejoin="round"/>
  <path d="M755 395 Q785 403 812 414" fill="none" stroke="#b8cbd1" stroke-width="4"/>
  <path d="M800 412q7-2 11 2" fill="none" stroke="#344f5c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="730" cy="382" r="5.5" fill="#182f39"/>
  <path d="M720 372 Q731 366 741 373" fill="none" stroke="#d8e6e9" stroke-width="3"/>

  <!-- Front arm reaching for the handlebar -->
  <path d="M692 439 Q666 453 652 474 L637 489 Q633 498 642 502
           Q653 502 666 489 L699 472 Q714 461 715 445Z"
        fill="#7894a0" stroke="#344f5c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M640 488 Q631 480 626 478 Q620 478 620 484 L634 497
           Q638 506 646 501Z"
        fill="#a0b7c0" stroke="#344f5c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M623 480 632 487M628 477 637 484" stroke="#344f5c" stroke-width="3"
        stroke-linecap="round"/>

  <!-- Snow kicked up behind the rear wheel -->
  <path d="M541 610q-38 6-62 0m48 17q-31 5-55-1m90-33q-20-8-34-3"
        fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
  <circle cx="520" cy="603" r="5" fill="#fff"/>
  <circle cx="489" cy="625" r="4" fill="#fff"/>
  <circle cx="548" cy="635" r="3" fill="#fff"/>
</svg>