    <path stroke-width="2" d="M32 393 185 363M226 242l91-18M687 276l167-32M33 620l262-51M731 572l193-37"/>
  </g>
  <g fill="#ffffff" opacity=".88">
    <path d="m64 505 74-15-51 24zM716 431l90-18-64 28zM796 526l99-20-71 30z"/>
    <path d="m218 551 81-17-56 25zM20 367l87-19-64 28z"/>
  </g>

  <!-- Scooter: its deck follows the slope -->
  <g stroke="#234b60" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="371" cy="507" r="30" fill="#284d60" stroke-width="5"/>
    <circle cx="371" cy="507" r="14" fill="#a8c8d6" stroke-width="4"/>
    <circle cx="606" cy="461" r="30" fill="#284d60" stroke-width="5"/>
    <circle cx="606" cy="461" r="14" fill="#a8c8d6" stroke-width="4"/>
    <path d="m373 475 217-43 16 14-5 11-217 43-15-9z" fill="#467286" stroke-width="5"/>
    <path d="m379 476 204-40" fill="none" stroke="#d9eaf0" stroke-width="5"/>
    <path d="m604 459-32-125" fill="none" stroke-width="9"/>
    <path d="m544 332 64-13" fill="none" stroke-width="9"/>
    <path d="m543 332-17 3m82-16 17-4" fill="none" stroke="#163c50" stroke-width="11"/>
  </g>

  <!-- Curled, armored tail -->
  <path d="M380 358 C327 354 286 380 274 423 C263 463 280 494 314 492 C339 490 349 468 337 451 C330 441 317 440 308 446 C305 428 320 409 346 407 L406 396Z"
        fill="#658ba0" stroke="#315b70" stroke-width="5" stroke-linejoin="round"/>
  <path d="M315 492 C286 485 276 456 286 429 M338 452 C322 460 312 469 314 492"
        fill="none" stroke="#d3e4ea" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#315b70" stroke-width="3" opacity=".85">
    <path d="m286 406 29 13 16-28m-44 41 30 10 17-28m-42 43 30 4 14-26m-9-65 23 20 22-23"/>
  </g>

