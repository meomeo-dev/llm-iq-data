<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Pangolin riding a kick scooter through a blizzard</title>
  <desc id="desc">A determined pangolin climbs a diagonal snowy mountain pass on a kick scooter. Wind-driven snow crosses an icy blue landscape, and a red scarf is the only warm accent.</desc>

  <defs>
    <clipPath id="armor">
      <path d="M354 346 C383 305 458 291 515 319 C545 335 551 367 527 394 C504 420 447 430 393 405 C365 392 350 371 354 346Z"/>
    </clipPath>
  </defs>

  <!-- Flat, overcast mountain pass -->
  <path fill="#dceaf0" d="M0 0h960v640H0z"/>
  <path fill="#c8dce6" d="M0 308 104 215l72 48 113-153 134 167 92-94 105 96 115-155 112 130 113-76v462H0z"/>
  <path fill="#e9f2f5" d="m0 355 104-140 72 48 113-153 134 167 92-94 105 96 115-155 112 130 113-76v462H0z"/>
  <path fill="#b6cedb" d="m0 396 148-104 118 54 115-101 118 83 124-112 138 109 94-59 105 77v297H0z"/>
  <path fill="#d9e8ee" d="m0 427 148-135 118 54 115-101 118 83 124-112 138 109 94-59 105 77v297H0z"/>
  <path fill="#f4f8f9" d="m0 530 164-74 142 34 137-99 154 39 145-84 218 24v270H0z"/>
  <path fill="#a9c5d3" d="M0 578 960 390v29L0 606z"/>
  <path fill="#eef6f8" d="M0 594 960 406v234H0z"/>
  <path fill="#d4e5eb" d="m0 630 960-189v199H0z"/>

