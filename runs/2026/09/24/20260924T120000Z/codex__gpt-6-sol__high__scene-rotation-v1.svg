  <path d="M579 267c3-9 9-12 17-9" fill="none" stroke="#c6dce3" stroke-width="3" stroke-linecap="round"/>
  <path d="m648 315 8 1-6 4z" fill="#214658"/>
  <path d="M572 302q11-8 22-2" fill="none" stroke="#24495d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="584" cy="302" r="3.5" fill="#17384c"/>

