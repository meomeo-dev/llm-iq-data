  <path d="M511 330c10-34 36-57 64-56 21 1 36 12 43 29l37 12-35 17-26-3c-10 24-38 35-65 22z"
        fill="#89aeba" stroke="#315b70" stroke-width="5" stroke-linejoin="round"/>
  <path d="m613 303 43 13-36 17-31-5c5-14 12-22 24-25z"
