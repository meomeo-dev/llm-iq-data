        fill="#9bbbc7" stroke="#315b70" stroke-width="4" stroke-linejoin="round"/>
  <path d="M545 327c-3 6-2 12 1 17" fill="none" stroke="#315b70" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Wind and snow in front of the rider -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path stroke-width="5" opacity=".8" d="M29 160 228 121M705 189l219-43M667 372l253-48M50 445l201-36"/>
    <path stroke-width="3" opacity=".9" d="m22 234 127-25m594 72 168-31M82 318l99-19m518 232 182-36"/>
    <path stroke-width="2" d="M190 85 319 62M10 563l129-25m681-135 129-27"/>
  </g>
  <g fill="#ffffff">
    <circle cx="137" cy="177" r="4"/><circle cx="246" cy="349" r="3"/>
    <circle cx="342" cy="179" r="4"/><circle cx="677" cy="111" r="3"/>
    <circle cx="748" cy="368" r="4"/><circle cx="856" cy="207" r="3"/>
    <circle cx="718" cy="568" r="4"/><circle cx="184" cy="583" r="3"/>
  </g>
</svg>