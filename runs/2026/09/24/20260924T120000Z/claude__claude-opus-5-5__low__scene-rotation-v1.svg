<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb4c6"/>
      <stop offset="1" stop-color="#dfe8ef"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#c9d8e4"/>
    </linearGradient>
    <pattern id="flakes" width="60" height="60" patternUnits="userSpaceOnUse"
      patternTransform="rotate(-25)">
      <line x1="5" y1="10" x2="30" y2="10" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <line x1="35" y1="35" x2="52" y2="35" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <line x1="12" y1="50" x2="22" y2="50" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- 远山 -->
  <path d="M0 330 L120 200 L210 280 L330 140 L450 250 L560 170 L680 260 L800 190 L800 600 L0 600Z"
    fill="#b7c8d6" opacity="0.7"/>
  <path d="M0 400 L150 290 L260 360 L400 250 L520 330 L650 260 L800 320 L800 600 L0 600Z"
    fill="#cbd8e3" opacity="0.8"/>

  <!-- 对角斜坡 -->
  <path d="M0 560 L800 300 L800 600 L0 600Z" fill="url(#snow)"/>
  <path d="M0 560 L800 300" stroke="#a9bfd0" stroke-width="3"/>
  <!-- 被风吹起的雪浪 -->
  <path d="M0 575 Q200 520 400 470 T800 330" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.7"/>

  <!-- 路边标杆 -->
  <g stroke="#5c7488" stroke-width="5">
    <line x1="120" y1="522" x2="112" y2="440"/>
    <line x1="660" y1="346" x2="652" y2="270"/>
  </g>

  <!-- 穿山甲与滑板车，与坡度对齐 -->
  <g transform="translate(400 430) rotate(-18)">
    <!-- 滑板车 -->
    <circle cx="-80" cy="28" r="16" fill="#2e4557"/>
    <circle cx="-80" cy="28" r="6" fill="#c9d8e4"/>
    <circle cx="80" cy="28" r="16" fill="#2e4557"/>
    <circle cx="80" cy="28" r="6" fill="#c9d8e4"/>
    <rect x="-90" y="6" width="165" height="10" rx="4" fill="#4a6478"/>
    <line x1="75" y1="12" x2="68" y2="-110" stroke="#4a6478" stroke-width="8" stroke-linecap="round"/>
    <line x1="52" y1="-112" x2="88" y2="-110" stroke="#2e4557" stroke-width="8" stroke-linecap="round"/>

    <!-- 尾巴 -->
    <path d="M-40 -20 Q-110 -10 -125 20 Q-100 10 -70 5Z" fill="#6f8698"/>
    <!-- 身体：鳞片 -->
    <path d="M-50 0 Q-60 -80 10 -95 Q55 -95 55 -45 Q45 0 -50 0Z" fill="#7c93a5"/>
    <g fill="none" stroke="#4f677a" stroke-width="3">
      <path d="M-40 -20 q10 -12 20 0 q10 -12 20 0 q10 -12 20 0 q10 -12 20 0"/>
      <path d="M-40 -42 q10 -12 20 0 q10 -12 20 0 q10 -12 20 0 q10 -12 20 0"/>
      <path d="M-30 -64 q10 -12 20 0 q10 -12 20 0 q10 -12 20 0"/>
      <path d="M-10 -84 q10 -10 18 0 q10 -10 18 0"/>
    </g>
    <!-- 后腿与前臂 -->
    <path d="M-20 -5 L-25 8 L-5 8" stroke="#5a6f80" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M30 -55 Q50 -80 60 -108" stroke="#5a6f80" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- 头部，前倾 -->
    <path d="M40 -80 Q70 -105 110 -92 Q80 -70 50 -60Z" fill="#8ea3b3"/>
    <circle cx="68" cy="-88" r="3.5" fill="#1b2a36"/>
    <path d="M62 -95 L76 -92" stroke="#1b2a36" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 唯一红色：随风飘扬的围巾 -->
    <path d="M35 -72 Q48 -62 58 -68" stroke="#d62828" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M38 -70 Q5 -80 -30 -70 Q-10 -85 -45 -95 Q0 -92 40 -76Z" fill="#d62828"/>
  </g>

  <!-- 暴风雪 -->
  <rect width="800" height="600" fill="url(#flakes)"/>
  <rect width="800" height="600" fill="#e8eff5" opacity="0.18"/>
</svg>