<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d6e2"/>
      <stop offset="1" stop-color="#e8eef4"/>
    </linearGradient>
    <linearGradient id="slope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#d3dfe9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="600"/></clipPath>
  </defs>

  <!-- overcast sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- distant peaks, muted by snow haze -->
  <polygon points="0,300 120,150 220,260 330,90 450,240 560,130 680,220 800,110 800,420 0,420" fill="#aebfd0" opacity="0.6"/>
  <polygon points="0,360 90,250 180,330 300,190 400,320 520,230 640,320 800,200 800,460 0,460" fill="#93a9bf" opacity="0.5"/>

  <!-- main slope, diagonal from upper-left to lower-right -->
  <polygon points="0,260 800,520 800,600 0,600" fill="url(#slope)"/>
  <polygon points="0,300 800,560 800,600 0,600" fill="#c3d3e1" opacity="0.5"/>
  <!-- slope ridge shading -->
  <line x1="0" y1="260" x2="800" y2="520" stroke="#a9bccd" stroke-width="3"/>

  <!-- drift streaks along the slope -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round">
    <line x1="60" y1="330" x2="180" y2="369"/>
    <line x1="260" y1="410" x2="360" y2="442"/>
    <line x1="520" y1="470" x2="640" y2="509"/>
    <line x1="140" y1="440" x2="230" y2="469"/>
    <line x1="400" y1="530" x2="500" y2="562"/>
  </g>

  <!-- pangolin and scooter, rotated to follow the slope -->
  <g transform="translate(400,410) rotate(18)">
    <!-- scooter shadow -->
    <ellipse cx="0" cy="48" rx="95" ry="8" fill="#9fb3c5" opacity="0.5"/>

    <!-- scooter deck -->
    <rect x="-70" y="30" width="110" height="9" rx="4" fill="#3d5a73"/>
    <!-- rear wheel -->
    <circle cx="-72" cy="40" r="12" fill="#243849"/>
    <circle cx="-72" cy="40" r="5" fill="#8fa6b8"/>
    <!-- front wheel -->
    <circle cx="58" cy="40" r="12" fill="#243849"/>
    <circle cx="58" cy="40" r="5" fill="#8fa6b8"/>
    <!-- steering column -->
    <line x1="52" y1="34" x2="80" y2="-60" stroke="#3d5a73" stroke-width="7" stroke-linecap="round"/>
    <!-- handlebar -->
    <line x1="62" y1="-64" x2="98" y2="-56" stroke="#243849" stroke-width="7" stroke-linecap="round"/>

    <!-- pangolin body: hunched forward, tail trailing back -->
    <!-- tail -->
    <path d="M-40,10 C-80,0 -120,20 -150,50 C-118,30 -85,25 -45,26 Z" fill="#6f8ea7"/>
    <!-- body -->
    <ellipse cx="-5" cy="-8" rx="46" ry="30" fill="#7d9bb3"/>
    <!-- scales: overlapping rows -->
    <g fill="#5f7f99" stroke="#dfe9f1" stroke-width="1.2">
      <path d="M-45,-10 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M-30,-22 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M-30,2 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M-14,-30 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M-14,-8 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M-14,10 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M2,-28 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M2,-6 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M18,-22 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M18,0 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M-70,22 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M-92,30 q8,-10 16,0 q-8,10 -16,0Z"/>
      <path d="M-114,38 q8,-10 16,0 q-8,10 -16,0Z"/>
    </g>
    <!-- head, leaning into the wind -->
    <path d="M32,-18 C50,-26 70,-22 84,-12 C72,-2 52,0 34,-2 Z" fill="#8fa9bd"/>
    <circle cx="86" cy="-12" r="2.5" fill="#243849"/>
    <!-- narrowed, determined eye -->
    <line x1="56" y1="-18" x2="66" y2="-16" stroke="#243849" stroke-width="3" stroke-linecap="round"/>
    <!-- arms gripping handlebar -->
    <path d="M20,-4 L70,-56" stroke="#6f8ea7" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="72" cy="-58" r="6" fill="#5f7f99"/>
    <!-- standing foot -->
    <path d="M-20,16 L-22,30" stroke="#6f8ea7" stroke-width="8" stroke-linecap="round"/>
    <!-- pushing foot -->
    <path d="M-2,18 L-4,32" stroke="#6f8ea7" stroke-width="8" stroke-linecap="round"/>

    <!-- the single red accent: scarf whipping back in the wind -->
    <path d="M30,-14 C20,-10 18,-4 26,0 C16,2 12,-4 20,-10 Z" fill="#d2222d"/>
    <path d="M22,-8 C-10,-30 -40,-44 -90,-52 C-50,-36 -20,-24 18,-4 Z" fill="#d2222d"/>
    <path d="M-90,-52 C-100,-58 -112,-56 -120,-48 C-108,-50 -100,-50 -90,-52 Z" fill="#b71c25"/>
  </g>

  <!-- blizzard: diagonal wind streaks -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.55" stroke-linecap="round" clip-path="url(#frame)">
    <line x1="-20" y1="40" x2="90" y2="90"/>
    <line x1="120" y1="20" x2="240" y2="75"/>
    <line x1="300" y1="60" x2="430" y2="120"/>
    <line x1="500" y1="30" x2="620" y2="85"/>
    <line x1="660" y1="90" x2="790" y2="150"/>
    <line x1="40" y1="160" x2="170" y2="220"/>
    <line x1="240" y1="200" x2="360" y2="255"/>
    <line x1="560" y1="180" x2="690" y2="240"/>
    <line x1="80" y1="470" x2="200" y2="525"/>
    <line x1="600" y1="380" x2="730" y2="440"/>
    <line x1="440" y1="300" x2="540" y2="346"/>
  </g>

  <!-- blizzard: driven snow particles -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="40" cy="80" r="3"/><circle cx="130" cy="140" r="2"/>
    <circle cx="210" cy="50" r="2.5"/><circle cx="290" cy="170" r="2"/>
    <circle cx="370" cy="30" r="3"/><circle cx="450" cy="150" r="2"/>
    <circle cx="530" cy="70" r="2.5"/><circle cx="610" cy="200" r="2"/>
    <circle cx="700" cy="40" r="3"/><circle cx="760" cy="260" r="2"/>
    <circle cx="90" cy="250" r="2"/><circle cx="180" cy="380" r="2.5"/>
    <circle cx="330" cy="330" r="2"/><circle cx="480" cy="250" r="3"/>
    <circle cx="640" cy="330" r="2"/><circle cx="720" cy="480" r="2.5"/>
    <circle cx="60" cy="540" r="2"/><circle cx="260" cy="560" r="3"/>
    <circle cx="560" cy="560" r="2"/><circle cx="410" cy="470" r="2"/>
  </g>

  <!-- snow haze veil flattening the light -->
  <rect width="800" height="600" fill="#e6edf3" opacity="0.18"/>
</svg>