<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfdbe5"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
    <linearGradient id="snowGround" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="0.6" stop-color="#e3ecf2"/>
      <stop offset="1" stop-color="#cddbe6"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="scales" width="14" height="12" patternUnits="userSpaceOnUse"
             patternTransform="rotate(90)">
      <rect width="14" height="12" fill="#7f9aae"/>
      <path d="M0 0 Q7 11 14 0 M-7 6 Q0 17 7 6 M7 6 Q14 17 21 6"
            fill="none" stroke="#34495c" stroke-width="1.4"/>
      <path d="M3 1 Q7 6 11 1" fill="none" stroke="#a9bfcf" stroke-width="1"/>
    </pattern>
    <pattern id="snowFar" width="90" height="70" patternUnits="userSpaceOnUse">
      <g stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
        <path d="M82 4 l-14 6 M32 18 l-10 4 M62 38 l-12 5 M12 54 l-9 4 M48 62 l-8 3"/>
      </g>
      <g fill="#ffffff" opacity="0.85">
        <circle cx="20" cy="8" r="1.2"/><circle cx="74" cy="26" r="1"/>
        <circle cx="40" cy="44" r="1.3"/><circle cx="84" cy="58" r="1.1"/>
        <circle cx="6" cy="32" r="1"/>
      </g>
    </pattern>
    <pattern id="snowNear" width="220" height="170" patternUnits="userSpaceOnUse">
      <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
        <path d="M200 10 l-40 16 M92 52 l-34 14 M172 112 l-46 18 M42 132 l-30 12"/>
      </g>
      <g fill="#ffffff">
        <circle cx="30" cy="20" r="3"/><circle cx="140" cy="70" r="2.5"/>
        <circle cx="96" cy="150" r="3.2"/><circle cx="206" cy="160" r="2.2"/>
      </g>
    </pattern>
  </defs>

  <!-- 天空与远山 -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 150 L90 70 L170 120 L260 40 L360 130 L450 90 L560 170 L660 120 L800 210
           L800 600 L0 600 Z" fill="#c3d2de"/>
  <rect width="800" height="600" fill="url(#snowFar)" opacity="0.6"/>

  <!-- 山口岩壁（沿坡向下） -->
  <path d="M0 190 L70 150 L150 175 L230 150 L320 205 L410 195 L500 255 L600 265
           L700 330 L800 360 L800 560 L0 260 Z" fill="#a4b8c8"/>
  <path d="M70 150 L100 200 L150 175 M230 150 L260 215 L320 205 M500 255 L530 300 L600 265
           M700 330 L720 380" fill="none" stroke="#8aa1b3" stroke-width="3"/>
  <path d="M70 150 L90 162 L112 158 L150 175 L130 168 L100 172 Z
           M230 150 L252 166 L285 176 L320 205 L280 186 L250 178 Z
           M500 255 L530 268 L600 265 L560 274 L525 278 Z" fill="#eef4f8"/>

  <!-- 路标杆与岩石 -->
  <g stroke="#34495c" stroke-width="4" stroke-linecap="round">
    <path d="M182 327 L186 262"/>
    <path d="M662 504 L668 388" stroke-width="6"/>
  </g>
  <g stroke="#eef4f8" stroke-width="6">
    <path d="M184 300 L185 290 M665 460 L666 446 M667 420 L667 408"/>
  </g>
  <path d="M95 300 L110 280 L132 276 L150 296 L150 312 L95 312 Z" fill="#56708a"/>
  <path d="M104 286 L110 280 L132 276 L140 284 L120 286 Z" fill="#f4f8fb"/>
  <path d="M520 450 L540 425 L566 430 L580 455 Z" fill="#4e667e"/>
  <path d="M534 432 L540 425 L566 430 L570 438 L548 436 Z" fill="#f4f8fb"/>

  <!-- 斜坡雪面 -->
  <path d="M0 260 L800 560 L800 600 L0 600 Z" fill="url(#snowGround)"/>
  <path d="M0 260 L800 560" stroke="#ffffff" stroke-width="3"/>
  <path d="M0 330 Q200 380 380 470 T800 600" fill="none" stroke="#d3e0ea" stroke-width="10"
        opacity="0.8"/>
  <path d="M0 420 Q180 460 300 540 T560 600" fill="none" stroke="#d3e0ea" stroke-width="14"
        opacity="0.7"/>

  <!-- 骑手（坐标系沿坡旋转） -->
  <g transform="translate(400 410) rotate(20.56)">
    <!-- 车辙与阴影 -->
    <path d="M-480 1 L-80 1" stroke="#c4d4e0" stroke-width="3"/>
    <ellipse cx="0" cy="1" rx="105" ry="5" fill="#b4c6d4" opacity="0.6"/>

    <!-- 速度线 -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M-210 -140 L-290 -140 M-230 -110 L-330 -110 M-205 -80 L-270 -80
               M-240 -40 L-320 -40"/>
    </g>

    <!-- 扬雪 -->
    <g fill="#ffffff">
      <ellipse cx="-112" cy="-8" rx="26" ry="9"/>
      <ellipse cx="-150" cy="-16" rx="16" ry="7" opacity="0.8"/>
      <circle cx="-128" cy="-28" r="6"/>
      <circle cx="-170" cy="-30" r="4" opacity="0.8"/>
      <circle cx="-190" cy="-14" r="3" opacity="0.7"/>
    </g>

    <!-- 尾巴 -->
    <path d="M-28 -62 C-80 -94 -142 -98 -190 -70 C-176 -60 -154 -56 -136 -58
             C-100 -60 -70 -48 -36 -38 Z" fill="url(#scales)" stroke="#34495c"
          stroke-width="2.2" stroke-linejoin="round"/>

    <!-- 滑板车 -->
    <path d="M-98 -22 Q-80 -36 -62 -22" fill="none" stroke="#4a6378" stroke-width="4"/>
    <circle cx="-78" cy="-12" r="13" fill="#1f2d3a"/>
    <circle cx="-78" cy="-12" r="5" fill="#a4b8c8"/>
    <circle cx="74" cy="-12" r="13" fill="#1f2d3a"/>
    <circle cx="74" cy="-12" r="5" fill="#a4b8c8"/>
    <path d="M-94 -27 L64 -27 L70 -18 L-94 -18 Z" fill="#2f4254"/>
    <path d="M-94 -27 L64 -27" stroke="#6f889c" stroke-width="2"/>
    <path d="M72 -16 L57 -142" stroke="#4a6378" stroke-width="6" stroke-linecap="round"/>

    <!-- 远侧后腿 -->
    <path d="M-14 -56 Q-2 -40 6 -28 L18 -28" fill="none" stroke="#5c778c"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 身体 -->
    <g transform="translate(0 -82) rotate(-51)">
      <ellipse rx="64" ry="37" fill="url(#scales)" stroke="#34495c" stroke-width="2.4"/>
      <path d="M-54 16 Q0 46 62 6 Q10 28 -54 16 Z" fill="#cfdce5"/>
    </g>

    <!-- 近侧后腿 -->
    <path d="M-30 -58 Q-44 -36 -26 -28 L-8 -28" fill="none" stroke="#6f8aa0"
          stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-6 -30 l6 2 M-8 -26 l6 1" stroke="#1f2d3a" stroke-width="2"
          stroke-linecap="round"/>

    <!-- 红色围巾飘带（唯一红色） -->
    <path d="M16 -134 C-8 -152 -40 -142 -72 -168 C-62 -152 -84 -148 -108 -154
             C-76 -130 -34 -130 14 -124 Z" fill="#d7263d"/>
    <path d="M12 -128 C-20 -128 -46 -112 -84 -122 C-60 -104 -26 -110 12 -118 Z"
          fill="#b81f33"/>

    <!-- 头部 -->
    <path d="M20 -142 C40 -154 64 -142 86 -118 C66 -115 44 -113 24 -118 Z"
          fill="#b9cad6" stroke="#34495c" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="86" cy="-118.5" r="2.6" fill="#1f2d3a"/>
    <path d="M26 -144 Q30 -152 36 -146" fill="#9fb4c4" stroke="#34495c" stroke-width="1.6"/>
    <ellipse cx="48" cy="-133" rx="3.4" ry="2.2" fill="#1a2733"
             transform="rotate(20 48 -133)"/>
    <path d="M39 -140 L56 -134" stroke="#1a2733" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M64 -122 L74 -121" stroke="#7d93a5" stroke-width="1.4" stroke-linecap="round"/>

    <!-- 围巾颈圈 -->
    <path d="M16 -142 Q30 -128 36 -112 L27 -109 Q20 -124 9 -134 Z" fill="#d7263d"/>

    <!-- 前肢与车把 -->
    <path d="M20 -106 Q46 -110 56 -134" fill="none" stroke="#6f8aa0" stroke-width="10"
          stroke-linecap="round"/>
    <path d="M48 -144 L70 -142" stroke="#1f2d3a" stroke-width="8" stroke-linecap="round"/>
    <path d="M52 -140 q4 -8 8 -4 M58 -139 q4 -8 8 -3" fill="none" stroke="#1f2d3a"
          stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 暴风雪层 -->
  <rect width="800" height="600" fill="url(#haze)"/>
  <rect width="800" height="600" fill="url(#snowFar)"/>
  <rect width="800" height="600" fill="url(#snowNear)"/>
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.9">
    <path d="M760 40 l-70 28 M640 150 l-60 24 M300 60 l-54 22 M120 420 l-66 26
             M720 250 l-50 20 M470 560 l-60 24" stroke-width="3.5"/>
  </g>
  <g fill="#ffffff">
    <circle cx="560" cy="90" r="5"/><circle cx="90" cy="200" r="4"/>
    <circle cx="700" cy="470" r="6"/><circle cx="250" cy="520" r="4.5"/>
    <circle cx="380" cy="230" r="3.5"/>
  </g>
</svg>