<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Pangolin riding a kick scooter through a blizzard</title>
  <desc id="desc">A determined pangolin leans into the wind on a snowy mountain pass. The scooter and road follow a steep diagonal slope. A red scarf is the only warm accent.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bed1da"/>
      <stop offset="1" stop-color="#e8f1f4"/>
    </linearGradient>
    <pattern id="snow" width="150" height="110" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <path d="M8 15h38 M92 38h30 M35 85h55" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".75"/>
      <circle cx="125" cy="87" r="2" fill="#fff"/>
      <circle cx="70" cy="55" r="2" fill="#fff"/>
    </pattern>
    <clipPath id="bodyClip">
      <path d="M397 333C390 269 430 225 492 235c59 10 96 58 89 111-6 42-44 76-91 78-50 2-85-27-93-91Z"/>
    </clipPath>
  </defs>

  <!-- Overcast pass and distant ridges -->
  <path fill="url(#sky)" d="M0 0h960v640H0z"/>
  <path fill="#a8beca" d="M0 352 145 178l80 96 115-168 169 231 99-116 113 138 112-147 127 139v289H0z"/>
  <path fill="#dbe8ed" d="m0 382 145-204 80 96 115-168 169 231 99-116 113 138 112-147 127 139v289H0z"/>
  <path fill="#f6fafb" d="m91 253 54-75 35 42-35-11-23 29Zm205-81 44-66 65 89-53-28-21 26Zm383 101 42-52 44 55-42-18-21 21Zm124-25 30-36 38 43-37-13-17 20Z"/>
  <path fill="#c3d6df" d="M0 433 173 339l122 64 144-127 121 71 167-72 233 123v242H0z"/>
  <path fill="#edf5f7" d="M0 483 173 339l122 64 144-127 121 71 167-72 233 123v242H0z"/>
  <path fill="#b1cad5" opacity=".55" d="m0 477 173-138 122 64 144-127 121 71 167-72 233 123-232-93-172 80-119-77-143 127-124-59Z"/>

  <!-- Pass climbs from lower left to upper right -->
  <path fill="#8daebb" d="M0 601 960 341v299H0z"/>
  <path fill="#d8e8ee" d="M0 625 960 365v275H0z"/>
  <path fill="#f7fbfc" d="M0 640 960 389v60L246 640Z"/>
  <path fill="none" stroke="#fff" stroke-width="8" opacity=".78" d="M20 619 914 381"/>
  <path fill="none" stroke="#9bb9c6" stroke-width="5" stroke-dasharray="55 44" opacity=".55" d="M162 625 960 413"/>
  <path fill="#fff" opacity=".8" d="m0 578 121-31 52 12-138 41Zm742-188 218-58v26l-172 47Z"/>

  <!-- Wind behind the rider -->
  <g fill="none" stroke="#f7fbfc" stroke-linecap="round" opacity=".88">
    <path stroke-width="6" d="M37 280 279 218m-210 94 189-48M8 393l295-77m-248 97 223-58"/>
    <path stroke-width="3" d="M148 191 353 137M43 465l255-67m332-224 241-63m-175 90 224-57"/>
  </g>

  <!-- Scooter wheels and diagonal deck -->
  <g stroke="#385d70" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="406" cy="532" r="39" fill="#d9e8ed" stroke-width="13"/>
    <circle cx="406" cy="532" r="13" fill="#7899a9" stroke-width="5"/>
    <circle cx="708" cy="451" r="39" fill="#d9e8ed" stroke-width="13"/>
    <circle cx="708" cy="451" r="13" fill="#7899a9" stroke-width="5"/>
    <path d="m407 496 297-78 12 19-294 80Z" fill="#5d8294" stroke-width="6"/>
    <path d="m683 422-62-178" fill="none" stroke-width="13"/>
    <path d="m590 249 74-20" fill="none" stroke-width="12"/>
    <path d="m623 244-12-29" fill="none" stroke-width="7"/>
  </g>

  <!-- Tail, trailing low and curling forward -->
  <path d="M420 381c-60 29-115 65-139 120-15 35-5 73 24 81 29 7 47-9 47-25-22 7-39-4-35-25 7-36 68-61 150-86Z"
        fill="#8caebe" stroke="#3d6477" stroke-width="7" stroke-linejoin="round"/>
  <path d="M390 407q-56 53-71 104m94-94q-48 57-54 89m78-81q-33 45-34 70"
        fill="none" stroke="#d9e9ee" stroke-width="8" stroke-linecap="round"/>

  <!-- Pangolin body and overlapping scales -->
  <path d="M397 333C390 269 430 225 492 235c59 10 96 58 89 111-6 42-44 76-91 78-50 2-85-27-93-91Z"
        fill="#83a7b7" stroke="#3d6477" stroke-width="8"/>
  <g clip-path="url(#bodyClip)" fill="#b8d0d9" stroke="#55798a" stroke-width="4">
    <path d="M397 247q29 4 48 34l-34 20q-18-20-25-43Z"/>
    <path d="M444 226q33 11 50 40l-37 21q-12-24-36-39Z"/>
    <path d="M494 232q34 13 48 42l-38 19q-10-23-34-40Z"/>
    <path d="M541 252q31 20 40 48l-40 13q-4-21-24-43Z"/>
    <path d="M387 290q32 2 50 32l-34 21q-17-22-26-39Z"/>
    <path d="M435 283q33 8 51 37l-37 21q-12-23-37-38Z"/>
    <path d="M484 274q33 11 50 39l-38 20q-12-24-35-38Z"/>
    <path d="M532 287q29 16 44 42l-39 17q-9-21-31-40Z"/>
    <path d="M393 337q33 2 53 30l-34 23q-17-21-24-40Z"/>
    <path d="M441 329q35 6 53 35l-36 23q-14-23-38-38Z"/>
    <path d="M491 320q35 9 54 37l-38 22q-14-24-39-39Z"/>
    <path d="M536 331q34 11 48 38l-40 18q-10-21-34-39Z"/>
    <path d="M412 379q29 3 49 29l-33 24q-17-19-27-39Z"/>
    <path d="M457 373q33 5 52 31l-36 23q-13-21-39-36Z"/>
    <path d="M504 369q30 7 48 31l-37 22q-13-20-36-35Z"/>
  </g>

  <!-- Feet planted on the deck -->
  <path d="m459 407-18 53 30 10 26-51m44-12 14 38 35 1-20-58"
        fill="none" stroke="#456d80" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m438 461 35 9 23-5m57-21 39 2 13 10"
        fill="none" stroke="#d3e4e9" stroke-width="11" stroke-linecap="round"/>

  <!-- Neck, head, and long pointed snout -->
  <path d="M521 264c15-31 45-50 77-48 30 2 52 21 55 44 4 22-10 37-32 46l-41 16-46-18Z"
        fill="#9bbbc8" stroke="#3d6477" stroke-width="7"/>
  <path d="M607 247c30 0 54 14 70 25l53 12-52 17-57-5-21-25Z"
        fill="#c5dbe2" stroke="#3d6477" stroke-width="7" stroke-linejoin="round"/>
  <path d="m715 284 14 1-13 6" fill="#3d6477"/>
  <path d="m616 264 20-8" stroke="#31576b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="636" cy="265" r="4" fill="#31576b"/>
  <path d="M549 240q17-35 47-34l-10 35" fill="#b2cbd5" stroke="#3d6477" stroke-width="6"/>

  <!-- One red accent: scarf, pulled hard by the wind -->
  <path d="M549 283q24 12 52 5l-4 22q-27 8-49-5Z" fill="#c4383c"/>
  <path d="M555 295C506 276 451 278 400 297c43-3 72 6 99 21-39 1-70 13-89 28 62-13 119-8 158-38Z"
        fill="#c4383c"/>
  <path d="M486 288q42-2 79 12" fill="none" stroke="#e36768" stroke-width="4" opacity=".7"/>

  <!-- Arms grip the handlebar -->
  <path d="M558 321q25-25 45-45l27-28"
        fill="none" stroke="#3d6477" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M560 319q25-25 45-45l27-28"
        fill="none" stroke="#a8c5d0" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m624 248 15-6" stroke="#3d6477" stroke-width="20" stroke-linecap="round"/>

  <!-- Foreground blizzard -->
  <path fill="url(#snow)" d="M0 0h960v640H0z" opacity=".9"/>
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path stroke-width="5" opacity=".9" d="M30 146 259 89m-206 402 272-69m373-74 234-60"/>
    <path stroke-width="3" opacity=".85" d="M4 221 162 181m638 40 146-37M198 577l147-38"/>
  </g>
</svg>