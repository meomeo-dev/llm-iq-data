<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8db0c9"/>
      <stop offset="1" stop-color="#d3e3ec"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f2f7" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#e9f2f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e9f2f7" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="snowA" width="90" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="8" y1="4" x2="8" y2="26" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
      <line x1="41" y1="30" x2="41" y2="46" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="66" y1="10" x2="66" y2="38" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="52" x2="25" y2="66" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="80" y1="48" x2="80" y2="62" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="snowB" width="130" height="110" patternUnits="userSpaceOnUse" patternTransform="rotate(35) translate(20 40)">
      <line x1="15" y1="0" x2="15" y2="40" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
      <line x1="70" y1="50" x2="70" y2="95" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="110" y1="10" x2="110" y2="45" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="45" cy="80" r="3" fill="#ffffff" fill-opacity="0.6"/>
      <circle cx="95" cy="25" r="2.2" fill="#ffffff" fill-opacity="0.7"/>
    </pattern>
    <g id="sc">
      <path d="M5 -8 Q11 0 5 8 Q-3 9 -8 0 Q-3 -9 5 -8 Z" fill="#a9cde2" stroke="#2f5f80" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g id="pine">
      <path d="M0 0 L-16 0 L0 -46 L16 0 Z" fill="#35607f"/>
      <path d="M-8 -22 L0 -46 L8 -22 Z" fill="#e6f1f7"/>
      <path d="M-13 -6 L-6 -14 L0 -8 L6 -14 L13 -6" fill="none" stroke="#e6f1f7" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- sky and veiled ridges -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 250 L70 190 L130 230 L200 150 L260 200 L330 120 L400 190 L470 140 L540 200 L610 160 L690 220 L760 170 L800 210 L800 600 L0 600 Z" fill="#aac7d9"/>
  <path d="M0 330 L60 280 L120 310 L190 240 L250 290 L310 250 L380 300 L450 260 L520 310 L600 250 L660 300 L730 260 L800 310 L800 600 L0 600 Z" fill="#7ea6c0"/>
  <path d="M176 254 L190 240 L204 254 Z M296 264 L310 250 L324 264 Z M586 264 L600 250 L614 264 Z M718 272 L730 260 L742 272 Z" fill="#d8e7ef"/>
  <rect width="800" height="600" fill="url(#veil)"/>

  <!-- uphill rock wall with pines -->
  <path d="M0 90 L60 130 L110 210 L170 250 L240 330 L300 378 L0 378 Z" fill="#4f7f9f"/>
  <path d="M0 90 L60 130 L110 210 L82 202 L44 152 L0 128 Z" fill="#dfeef6" fill-opacity="0.85"/>
  <path d="M170 250 L240 330 L226 334 L158 262 Z" fill="#dfeef6" fill-opacity="0.7"/>
  <path d="M20 200 L70 260 L40 262 Z" fill="#3b6b8a"/>
  <use xlink:href="#pine" transform="translate(92 184) scale(0.9)"/>
  <use xlink:href="#pine" transform="translate(150 238) scale(1.1)"/>
  <use xlink:href="#pine" transform="translate(205 292) scale(0.8)"/>
  <use xlink:href="#pine" transform="translate(262 372) scale(0.75)"/>

  <!-- snow slope -->
  <path d="M0 280 L800 540 L800 600 L0 600 Z" fill="#e9f2f7"/>
  <path d="M0 280 L800 540 L800 554 L0 294 Z" fill="#f7fbfd"/>
  <ellipse cx="140" cy="356" rx="70" ry="9" fill="#d5e5ee" transform="rotate(18 140 356)"/>
  <ellipse cx="140" cy="350" rx="70" ry="9" fill="#f7fbfd" transform="rotate(18 140 350)"/>
  <ellipse cx="330" cy="476" rx="90" ry="10" fill="#d5e5ee" transform="rotate(18 330 476)"/>
  <ellipse cx="330" cy="470" rx="90" ry="10" fill="#f7fbfd" transform="rotate(18 330 470)"/>
  <ellipse cx="560" cy="511" rx="80" ry="9" fill="#d5e5ee" transform="rotate(18 560 511)"/>
  <ellipse cx="560" cy="505" rx="80" ry="9" fill="#f7fbfd" transform="rotate(18 560 505)"/>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round">
    <path d="M60 330 L200 375"/>
    <path d="M300 440 L420 479"/>
    <path d="M480 470 L640 522"/>
    <path d="M620 560 L720 592"/>
  </g>
  <path d="M10 283 L330 387" fill="none" stroke="#c5d8e4" stroke-width="4" stroke-dasharray="18 12" stroke-linecap="round"/>

  <!-- foreground rock -->
  <path d="M650 600 L690 548 L740 562 L800 516 L800 600 Z" fill="#35607f"/>
  <path d="M690 548 L740 562 L800 516 L800 530 L742 576 L688 562 Z" fill="#eef5f9"/>

  <!-- mid-depth blizzard -->
  <rect width="800" height="600" fill="url(#snowA)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M820 40 C640 90 420 110 180 230" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M830 150 C650 190 480 220 300 330" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M700 -10 C560 60 380 90 100 160" stroke-width="2" stroke-opacity="0.3"/>
  </g>

  <!-- pangolin on scooter, aligned to the slope -->
  <g transform="translate(400 410) rotate(18)">
    <ellipse cx="6" cy="2" rx="100" ry="6" fill="#b9cfdc" fill-opacity="0.45"/>
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7">
      <path d="M-185 -96 L-248 -104"/>
      <path d="M-198 -70 L-272 -78"/>
      <path d="M-180 -44 L-232 -50"/>
    </g>
    <path d="M-76 -4 C-90 -12 -100 -6 -116 -2" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" stroke-linecap="round"/>
    <g fill="#ffffff">
      <circle cx="-84" cy="-8" r="3"/>
      <circle cx="-97" cy="-16" r="2.5"/>
      <circle cx="-110" cy="-7" r="2"/>
      <circle cx="-93" cy="-26" r="1.8"/>
      <circle cx="-122" cy="-18" r="1.5"/>
    </g>

    <!-- scooter -->
    <path d="M-80 -16 A18 18 0 0 1 -50 -28" fill="none" stroke="#24435c" stroke-width="6" stroke-linecap="round"/>
    <rect x="-60" y="-27" width="120" height="9" rx="3" fill="#24435c"/>
    <rect x="-52" y="-30" width="100" height="4" rx="2" fill="#5d8aa8"/>
    <path d="M56 -23 L74 -34" stroke="#24435c" stroke-width="8" stroke-linecap="round"/>
    <path d="M72 -13 L106 -130" stroke="#24435c" stroke-width="7" stroke-linecap="round"/>
    <path d="M92 -132 L120 -132" stroke="#0f2436" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-62" cy="-13" r="13" fill="#1a3448" stroke="#0f2436" stroke-width="2"/>
    <circle cx="-62" cy="-13" r="6" fill="#b9d9ea"/>
    <circle cx="72" cy="-13" r="13" fill="#1a3448" stroke="#0f2436" stroke-width="2"/>
    <circle cx="72" cy="-13" r="6" fill="#b9d9ea"/>

    <!-- tail -->
    <path d="M-54 -58 C-95 -54 -130 -46 -158 -38 C-167 -36 -167 -49 -158 -51 C-130 -60 -95 -80 -54 -80 Z" fill="#6fa3c4" stroke="#24435c" stroke-width="2.5" stroke-linejoin="round"/>
    <use xlink:href="#sc" transform="translate(-76 -70) rotate(-6) scale(0.9)"/>
    <use xlink:href="#sc" transform="translate(-98 -64) rotate(-10) scale(0.85)"/>
    <use xlink:href="#sc" transform="translate(-120 -57) rotate(-14) scale(0.75)"/>
    <use xlink:href="#sc" transform="translate(-141 -50) rotate(-16) scale(0.65)"/>

    <!-- far limbs -->
    <path d="M-28 -68 L-34 -34" stroke="#3b6f8f" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="-36" cy="-31" rx="11" ry="5" fill="#2f5f80"/>
    <path d="M44 -84 L98 -120" stroke="#3b6f8f" stroke-width="9" stroke-linecap="round"/>
    <circle cx="100" cy="-123" r="6" fill="#3b6f8f"/>

    <!-- body and head -->
    <path d="M-58 -58 C-30 -52 10 -52 40 -60 C48 -62 54 -64 60 -66 L100 -72 C92 -80 80 -88 66 -92 C60 -96 56 -98 52 -100 C30 -124 -10 -126 -40 -104 C-50 -96 -56 -88 -58 -80 Z" fill="#6fa3c4" stroke="#24435c" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-52 -60 C-30 -54 10 -54 40 -61 C28 -68 0 -70 -30 -68 Z" fill="#8dbad6"/>
    <g>
      <use xlink:href="#sc" transform="translate(-48 -78) rotate(-60)"/>
      <use xlink:href="#sc" transform="translate(-36 -97) rotate(-45)"/>
      <use xlink:href="#sc" transform="translate(-18 -108) rotate(-20)"/>
      <use xlink:href="#sc" transform="translate(2 -110)"/>
      <use xlink:href="#sc" transform="translate(22 -108) rotate(15)"/>
      <use xlink:href="#sc" transform="translate(40 -100) rotate(35)"/>
      <use xlink:href="#sc" transform="translate(-42 -66) rotate(-60)"/>
      <use xlink:href="#sc" transform="translate(-31 -83) rotate(-45)"/>
      <use xlink:href="#sc" transform="translate(-13 -94) rotate(-20)"/>
      <use xlink:href="#sc" transform="translate(6 -97)"/>
      <use xlink:href="#sc" transform="translate(26 -94) rotate(15)"/>
      <use xlink:href="#sc" transform="translate(44 -85) rotate(35)"/>
      <use xlink:href="#sc" transform="translate(-22 -72) rotate(-30)"/>
      <use xlink:href="#sc" transform="translate(-2 -80) rotate(-5)"/>
      <use xlink:href="#sc" transform="translate(18 -80) rotate(15)"/>
      <use xlink:href="#sc" transform="translate(36 -72) rotate(30)"/>
      <use xlink:href="#sc" transform="translate(60 -92) rotate(45) scale(0.7)"/>
    </g>

    <!-- near hind leg -->
    <path d="M-6 -66 L-14 -34" stroke="#5286a8" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="-14" cy="-31" rx="12" ry="5" fill="#3b6f8f"/>
    <path d="M-4 -33 L3 -31 M-5 -30 L2 -27" stroke="#0f2436" stroke-width="1.5" stroke-linecap="round"/>

    <!-- face: furrowed brow, set jaw -->
    <circle cx="76" cy="-79" r="3" fill="#0f2436"/>
    <circle cx="77" cy="-80" r="1" fill="#ffffff"/>
    <path d="M66 -88 L81 -83" stroke="#0f2436" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M86 -70 L97 -72" stroke="#24435c" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="97" cy="-73" r="1.4" fill="#0f2436"/>

    <!-- near arm gripping the bar -->
    <path d="M50 -86 L102 -124" stroke="#5286a8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="104" cy="-127" r="6.5" fill="#5286a8" stroke="#24435c" stroke-width="1.5"/>
    <path d="M108 -132 Q113 -133 112 -128 M109 -125 Q114 -125 112 -121" fill="none" stroke="#0f2436" stroke-width="1.5" stroke-linecap="round"/>

    <!-- red scarf, the single accent -->
    <path d="M52 -102 C32 -122 6 -130 -25 -140 C-42 -146 -58 -138 -74 -146 C-60 -134 -42 -130 -20 -128 C2 -124 24 -112 46 -92 Z" fill="#d6302e"/>
    <path d="M40 -100 C18 -116 -6 -122 -34 -132" fill="none" stroke="#b3251f" stroke-width="2" stroke-linecap="round"/>
    <path d="M50 -103 Q64 -88 58 -70" fill="none" stroke="#d6302e" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- foreground blizzard -->
  <rect width="800" height="600" fill="url(#snowB)"/>
  <g fill="#ffffff">
    <circle cx="60" cy="80" r="5" fill-opacity="0.6"/>
    <circle cx="130" cy="430" r="6" fill-opacity="0.5"/>
    <circle cx="300" cy="60" r="4" fill-opacity="0.7"/>
    <circle cx="470" cy="150" r="5" fill-opacity="0.55"/>
    <circle cx="560" cy="60" r="7" fill-opacity="0.45"/>
    <circle cx="690" cy="380" r="6" fill-opacity="0.5"/>
    <circle cx="760" cy="120" r="4" fill-opacity="0.65"/>
    <circle cx="220" cy="540" r="7" fill-opacity="0.45"/>
    <circle cx="650" cy="230" r="4" fill-opacity="0.6"/>
    <circle cx="380" cy="565" r="5" fill-opacity="0.5"/>
    <circle cx="720" cy="470" r="8" fill-opacity="0.4"/>
    <circle cx="30" cy="300" r="4" fill-opacity="0.6"/>
    <circle cx="590" cy="420" r="3.5" fill-opacity="0.7"/>
    <circle cx="180" cy="150" r="3" fill-opacity="0.7"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M830 330 C700 360 600 400 420 520" stroke-width="2.5" stroke-opacity="0.35"/>
    <path d="M560 470 C450 500 300 530 120 600" stroke-width="2" stroke-opacity="0.3"/>
    <path d="M300 -10 C230 60 120 100 -10 150" stroke-width="2" stroke-opacity="0.3"/>
  </g>
</svg>