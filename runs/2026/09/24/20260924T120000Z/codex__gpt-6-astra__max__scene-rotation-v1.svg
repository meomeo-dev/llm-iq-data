<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900"
     viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Pangolin at the mountain pass</title>
  <desc id="description">
    An armored pangolin leans determinedly over a kick scooter, descending
    a narrow snowy mountain pass in a blizzard. Its red scarf streams behind
    it against an otherwise icy blue and white landscape.
  </desc>

