      <rect width="1200" height="900"/>
    </clipPath>

    <path id="shell" d="
      M410 506
      C386 465 402 391 447 345
      C480 310 519 302 557 316
      C613 335 650 377 676 418
      C690 442 679 481 654 505
      C631 528 594 545 553 544
      C491 543 439 542 410 506Z"/>

    <path id="tail" d="
      M453 472
      C405 505 334 543 262 537
      C215 534 177 516 147 487
      C162 541 205 576 264 583
      C349 593 434 553 486 518Z"/>

    <path id="scale" d="
