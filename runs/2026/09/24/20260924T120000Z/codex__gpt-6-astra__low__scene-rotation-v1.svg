        fill="#c4d8e4" stroke="#3f657e" stroke-width="4"/>
  <path d="M658 420L660 431M665 420L667 432"
        stroke="#52778d" stroke-width="3"/>

  <!-- Narrow head, pointed snout, and a lowered, determined brow. -->
  <path d="M548 311Q575 283 606 307
           Q622 322 632 344L674 379
           Q681 387 670 391L620 381
