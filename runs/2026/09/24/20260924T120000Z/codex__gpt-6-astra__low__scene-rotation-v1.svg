    <path d="M380 328Q413 272 475 274"
          fill="none" stroke="#d6e6ee" stroke-width="9"/>
    <path d="M381 419Q472 478 568 398L592 455L410 480Z"
          fill="#52768d" opacity=".25"/>
  </g>

  <!-- Reaching arms brace against the handlebars. -->
  <path d="M540 372Q563 364 578 392L598 418L652 419
