        fill="#afc8d8"/>
  <path d="M131 228L94 323L131 305L166 328L181 300Z
           M350 248L287 359L348 319L409 368Z
           M661 292L595 411L658 377L716 398Z
           M930 354L878 427L928 407L967 431Z"
        fill="#eaf3f7"/>
  <path d="M0 365L112 404L195 462L277 480L382 544
           L511 570L655 628L798 648L1000 726V800H0Z"
        fill="#6f93aa"/>
  <path d="M0 354L110 390L205 447L292 464L385 520
           L522 550L667 601L807 635L1000 702V757
           L805 690L655 661L506 610L365 579L272 522
