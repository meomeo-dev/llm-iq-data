<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800"
     viewBox="0 0 1000 800" role="img"
     aria-labelledby="title description">
  <title id="title">Pangolin on a Mountain Pass</title>
  <desc id="description">
    A determined pangolin rides a kick scooter down a steep snowy mountain
    pass in a blizzard. Layered icy blue scales, wind-driven snow, and angular
    mountains surround a single red scarf.
  </desc>

  <defs>
    <pattern id="scales" width=" forty" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0H40V40H0Z" fill="#7395aa"/>
    </pattern>
    <pattern id="armor" width="48" height="38"
             patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <rect width="48" height="38" fill="#7899ad"/>
      <path d="M-24 0Q-21 23 0 32Q21 23 24 0
               M24 0Q27 23 48 32Q69 23 72 0"
            fill="#9ab7c8" stroke="#52768d" stroke-width="2.5"/>
      <path d="M-16 5L0 24L16 5M32 5L48 24L64 5"
            fill="none" stroke="#bdd2de" stroke-width="2"/>
    </pattern>
    <clipPath id="bodyClip">
      <path d="M386 426C364 384 369 321 410 281
               C452 241 514 259 553 295
               C581 320 592 358 579 391
               C563 432 523 456 467 457Z"/>
    </clipPath>
  </defs>

  <!-- The entire landscape falls toward the lower right. -->
  <rect width="1000" height="800" fill="#dce9f0"/>
  <path d="M0 194L102 103L190 214L314 66L447 241
