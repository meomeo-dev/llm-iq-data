        stroke-linejoin="round"/>
  <path d="M608 354L627 360" stroke="#31566e" stroke-width="5"
        stroke-linecap="round"/>
  <path d="M615 361L624 363" stroke="#173f59" stroke-width="4"
        stroke-linecap="round"/>
  <path d="M650 383L665 385" stroke="#52768d" stroke-width="2.5"
        stroke-linecap="round"/>
  <path d="M670 378Q680 384 674 389L666 385Z" fill="#31566e"/>
  <path d="M579 339Q582 328 590 334Q595 342 585 349"
        fill="#9bb8ca" stroke="#5b7f96" stroke-width="3"/>

  <!-- One red accent: a scarf torn sideways by the wind. -->
  <path d="M553 346Q565 365 584 371L575 389
           Q549 382 537 362Z"
        fill="#c73543"/>
  <path d="M544 363C506 355 483 338 454 337
