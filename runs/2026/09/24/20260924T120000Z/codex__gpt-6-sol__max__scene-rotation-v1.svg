<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680"
     role="img" aria-labelledby="title description">
  <title id="title">Pangolin riding a kick scooter through a blizzard</title>
  <desc id="description">
    A determined pangolin climbs a diagonal snowy mountain pass on a kick
    scooter. Wind drives snow across an icy blue landscape, and a red scarf
    is the scene's only warm accent.
  </desc>

  <defs>
    <clipPath id="body-clip">
      <path d="M144-137 C151-177 192-203 251-201
               C304-199 337-171 346-137
               C344-96 304-72 254-69
               C205-66 158-87 140-110 Z"/>
    </clipPath>
    <clipPath id="tail-clip">
      <path d="M161-139 C100-160 42-153 4-126
               C-35-99-47-60-27-34
               C-13-14 10-14 25-26
               C5-24-11-39-8-57
               C-3-91 60-117 146-94 Z"/>
    </clipPath>
    <g id="scale">
      <path d="M0 3 Q16-7 34 2 Q29 18 17 25 Q5 16 0 3 Z"/>
    </g>
  </defs>

  <rect width="1000" height="680" fill="#e9f3f7"/>

  <!-- Distant ridges under flat, overcast light -->
  <path d="M0 327 114 188 224 273 405 87 552 259
           728 127 871 288 1000 177 V510 H0 Z"
        fill="#cadfe8"/>
  <path d="M330 164 405 87 471 164 438 146 416 154
           396 131 375 163 Z"
        fill="#f5fbfd"/>
  <path d="M670 184 728 127 789 188 749 169 728 152
           707 174 Z"
        fill="#f5fbfd"/>
  <path d="M0 439 158 218 311 412 515 187 697 416
           889 191 1000 304 V550 H0 Z"
        fill="#a9c9d7"/>
  <path d="M89 314 158 218 230 318 185 288 163 263
           142 296 Z M451 269 515 187 591 282 545 251
           519 217 491 255 Z M824 276 889 191 961 278
           912 246 888 220 864 258 Z"
        fill="#edf7fa"/>
  <path d="M42 409 155 270 M397 381 510 235 M758 382 884 231"
        fill="none" stroke="#7eaabd" stroke-width="4" opacity=".55"/>

  <!-- The pass rises sharply toward the right -->
  <path d="M0 558 120 522 245 481 385 435 520 391
           650 347 790 303 1000 233 V680 H0 Z"
        fill="#f7fcfe"/>
  <path d="M0 596 1000 270 M0 656 1000 330"
        fill="none" stroke="#d9ebf1" stroke-width="10"/>
  <path d="M0 558 120 522 245 481 385 435 520 391
           650 347 790 303 1000 233"
        fill="none" stroke="#b9d8e3" stroke-width="4"/>
  <path d="M76 571 Q132 547 183 538 M729 374 Q800 340 864 335
           M563 472 Q623 444 677 439"
        fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Snow blown from the upper right -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".9">
    <path d="M160 89 76 119 M342 52 251 86 M620 62 539 92
             M908 63 816 98 M1000 126 906 160
             M259 179 184 205 M754 207 667 239
             M947 385 863 416 M217 391 122 426"
          stroke-width="3"/>
    <path d="M78 236 29 253 M496 125 445 143
             M848 117 798 135 M998 439 937 461
             M438 471 366 496 M826 512 750 538"
          stroke-width="2"/>
  </g>
  <g fill="#ffffff" opacity=".95">
    <circle cx="104" cy="74" r="3"/><circle cx="300" cy="131" r="2"/>
    <circle cx="586" cy="40" r="3"/><circle cx="800" cy="74" r="2"/>
    <circle cx="957" cy="197" r="3"/><circle cx="705" cy="276" r="2"/>
    <circle cx="134" cy="355" r="3"/><circle cx="531" cy="342" r="2"/>
    <circle cx="876" cy="466" r="3"/><circle cx="286" cy="559" r="2"/>
  </g>

  <!-- Scooter and rider follow the grade -->
  <g transform="translate(256 424) rotate(-18)"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Scooter -->
    <circle cx="40" cy="30" r="25" fill="#315d72"/>
    <circle cx="405" cy="30" r="25" fill="#315d72"/>
    <circle cx="40" cy="30" r="12" fill="#d5e9f0"/>
    <circle cx="405" cy="30" r="12" fill="#d5e9f0"/>
    <circle cx="40" cy="30" r="4" fill="#6f9eb1"/>
    <circle cx="405" cy="30" r="4" fill="#6f9eb1"/>
    <path d="M405 30 379-165" fill="none" stroke="#315d72"
          stroke-width="12"/>
    <path d="M347-166 H413" fill="none" stroke="#315d72"
          stroke-width="11"/>
    <path d="M68 1 H366 Q376 1 377 11 L376 19
             Q375 27 365 27 H76 Q66 27 63 19 L62 11
             Q62 2 68 1 Z"
          fill="#6e9db0" stroke="#315d72" stroke-width="4"/>
    <path d="M82 7 H354" fill="none" stroke="#dcecf2"
          stroke-width="4"/>

    <!-- Curled, plated tail -->
    <path d="M161-139 C100-160 42-153 4-126
             C-35-99-47-60-27-34
             C-13-14 10-14 25-26
             C5-24-11-39-8-57
             C-3-91 60-117 146-94 Z"
          fill="#98bfce" stroke="#315d72" stroke-width="4"/>
    <g clip-path="url(#tail-clip)" fill="none"
       stroke="#628fa2" stroke-width="3">
      <path d="M-17-117 6-89 M14-138 39-105 M47-147 70-111
               M82-151 102-108 M116-149 129-99
               M-30-75-4-68 M-24-49 2-48"/>
    </g>

    <!-- Legs braced on the deck -->
    <path d="M180-92 C174-69 151-36 161-10 L184-10
             C186-32 206-59 215-73 Z"
          fill="#88b2c2" stroke="#315d72" stroke-width="4"/>
    <path d="M270-82 C273-53 296-37 299-10 L324-10
             C327-46 311-77 305-94 Z"
          fill="#88b2c2" stroke="#315d72" stroke-width="4"/>
    <path d="M162-12 158 4 Q160 11 183 11 L201 5
             194-8 Z M299-11 296 5 Q302 12 324 11
             L339 5 324-9 Z"
          fill="#a9cbd7" stroke="#315d72" stroke-width="4"/>
    <path d="M179 8 175 13 M189 8 186 13 M317 9 315 14
             M327 8 326 13"
          fill="none" stroke="#315d72" stroke-width="2"/>

    <!-- Rounded body covered with overlapping scales -->
    <path d="M144-137 C151-177 192-203 251-201
             C304-199 337-171 346-137
             C344-96 304-72 254-69
             C205-66 158-87 140-110 Z"
          fill="#9fc6d3"/>
    <g clip-path="url(#body-clip)" fill="#c1dce5"
       stroke="#608fa2" stroke-width="2.5">
      <use href="#scale" x="151" y="-199"/>
      <use href="#scale" x="187" y="-202"/>
      <use href="#scale" x="223" y="-204"/>
      <use href="#scale" x="259" y="-201"/>
      <use href="#scale" x="295" y="-190"/>

      <use href="#scale" x="137" y="-176"/>
      <use href="#scale" x="173" y="-177"/>
      <use href="#scale" x="209" y="-179"/>
      <use href="#scale" x="245" y="-177"/>
      <use href="#scale" x="281" y="-171"/>
      <use href="#scale" x="317" y="-159"/>

      <use href="#scale" x="145" y="-151"/>
      <use href="#scale" x="181" y="-153"/>
      <use href="#scale" x="217" y="-154"/>
      <use href="#scale" x="253" y="-152"/>
      <use href="#scale" x="289" y="-146"/>
      <use href="#scale" x="325" y="-135"/>

      <use href="#scale" x="159" y="-127"/>
      <use href="#scale" x="195" y="-128"/>
      <use href="#scale" x="231" y="-129"/>
      <use href="#scale" x="267" y="-126"/>
      <use href="#scale" x="303" y="-119"/>
    </g>
    <path d="M142-114 C177-95 218-86 261-92
             C306-98 330-116 345-141
             C343-98 302-72 254-69
             C204-66 158-87 142-114 Z"
          fill="#c0dce5"/>
    <path d="M144-137 C151-177 192-203 251-201
             C304-199 337-171 346-137
             C344-96 304-72 254-69
             C205-66 158-87 140-110 Z"
          fill="none" stroke="#315d72" stroke-width="4"/>

    <!-- Scarf tails stream back in the wind -->
    <path d="M318-150 C289-158 271-169 255-184
             L260-162 C280-148 296-138 316-137 Z"
          fill="#d64b52" stroke="#315d72" stroke-width="3"/>
    <path d="M316-142 C292-145 271-141 250-150
             L263-132 C286-128 302-131 319-134 Z"
          fill="#d64b52" stroke="#315d72" stroke-width="3"/>

    <!-- Forelimb grips the handlebar -->
    <path d="M299-127 C326-135 347-150 369-170
             L381-159 C363-138 343-119 314-109 Z"
          fill="#a9ccd8" stroke="#315d72" stroke-width="4"/>

    <!-- Long pointed muzzle, small ear, and focused eye -->
    <path d="M308-162 C329-178 354-176 377-153
             L422-139 Q440-135 439-128
             Q437-122 418-120 L373-116
             Q339-109 317-129 Z"
          fill="#c5dfe7" stroke="#315d72" stroke-width="4"/>
    <path d="M336-158 Q347-167 352-153 Q350-143 340-145 Z"
          fill="#9fc4d1" stroke="#315d72" stroke-width="3"/>
    <circle cx="385" cy="-146" r="4" fill="#254c62"/>
    <path d="M374-155 390-152 M416-124 430-124"
          fill="none" stroke="#315d72" stroke-width="3"/>
    <circle cx="434" cy="-128" r="3" fill="#315d72"/>

    <!-- Scarf knot and gripping claws -->
    <path d="M313-164 Q326-164 339-147 L334-124
             Q324-120 313-133 Q324-145 313-164 Z"
          fill="#d64b52" stroke="#315d72" stroke-width="3"/>
    <path d="M368-168 Q376-178 385-170 L386-160
             Q377-156 370-161 Z"
          fill="#b9d8e2" stroke="#315d72" stroke-width="3"/>
    <path d="M378-160 381-155 M384-161 387-156"
          fill="none" stroke="#315d72" stroke-width="2"/>
  </g>

  <!-- Gusts and loose powder in front of the rider -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M927 270 805 312 M735 433 620 471
             M215 501 116 536 M510 530 404 564"
          stroke-width="5" opacity=".85"/>
    <path d="M697 177 622 202 M367 328 293 354
             M964 565 870 594"
          stroke-width="3" opacity=".95"/>
  </g>
  <path d="M267 468 Q303 450 335 454 M615 354 Q650 337 688 340"
        fill="none" stroke="#ffffff" stroke-width="8"
        stroke-linecap="round"/>
</svg>