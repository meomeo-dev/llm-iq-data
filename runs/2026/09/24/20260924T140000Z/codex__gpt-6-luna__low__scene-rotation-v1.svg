<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">An octopus rides a motorcycle through an autumn village</title>
  <desc id="desc">A gentle, nostalgic dusk scene on a village lane, with amber lantern-lit windows and trees framing a one-point perspective road.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#574454"/>
      <stop offset=".55" stop-color="#bb7056"/>
      <stop offset="1" stop-color="#e7a35f"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#9a6651"/>
      <stop offset="1" stop-color="#443d42"/>
    </linearGradient>
    <linearGradient id="window" x2="0" y2="1">
      <stop stop-color="#ffe3a1"/>
      <stop offset="1" stop-color="#e78a42"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ffd987" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd987" stop-opacity="0"/>
    </radialGradient>
    <g id="leaf">
      <path d="M0 0 C-16-18-14-37 0-47 C14-34 17-15 0 0Z" fill="currentColor"/>
      <path d="M0-2V-38" fill="none" stroke="#f3c17b" stroke-opacity=".55" stroke-width="2"/>
    </g>
    <g id="windowBox">
      <rect width="54" height="67" rx="3" fill="#473a3c"/>
      <rect x="7" y="7" width="40" height="53" rx="2" fill="url(#window)"/>
      <path d="M27 7V60M7 33H47" stroke="#765044" stroke-width="4"/>
      <path d="M-4 0H58L52-9H2Z" fill="#795048"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="605" cy="285" r="155" fill="url(#glow)"/>
  <circle cx="605" cy="285" r="48" fill="#f6c878" opacity=".7"/>
  <path d="M0 365Q160 320 320 364T640 350T960 363T1200 336V505H0Z" fill="#765451" opacity=".65"/>
  <path d="M0 423Q210 382 390 410T790 405T1200 390V540H0Z" fill="#544345" opacity=".72"/>

  <!-- Village buildings converge toward the lane's vanishing point. -->
  <path d="M0 298L314 365V615L0 710Z" fill="#9b5948"/>
  <path d="M0 298L152 213L344 350L314 365Z" fill="#684347"/>
  <path d="M1200 283L882 358V615L1200 696Z" fill="#874b42"/>
  <path d="M1200 283L1054 206L856 343L882 358Z" fill="#5c4143"/>
  <path d="M0 388L314 424M0 497L314 489M882 417L1200 385M882 493L1200 486" stroke="#c17b55" stroke-opacity=".35" stroke-width="6"/>
  <path d="M0 310L314 377M1200 295L882 370" stroke="#e1a36d" stroke-width="9" opacity=".6"/>

  <g opacity=".95">
    <ellipse cx="145" cy="467" rx="93" ry="92" fill="url(#glow)"/>
    <use href="#windowBox" x="77" y="420" transform="scale(1.15) translate(-10 -55)"/>
    <use href="#windowBox" x="205" y="505" transform="scale(.8) translate(51 126)"/>
    <ellipse cx="1057" cy="463" rx="100" ry="90" fill="url(#glow)"/>
    <use href="#windowBox" x="1042" y="409" transform="scale(1.08) translate(-77 -31)"/>
    <use href="#windowBox" x="930" y="508" transform="scale(.8) translate(232 127)"/>
  </g>

  <!-- Lanterns and their pools of light. -->
  <g>
    <circle cx="286" cy="414" r="58" fill="url(#glow)"/>
    <path d="M284 364V401" stroke="#493a3c" stroke-width="5"/>
    <path d="M270 401H298L294 430H274Z" fill="#4c3a3a"/>
    <rect x="276" y="406" width="16" height="18" rx="3" fill="#ffd581"/>
    <circle cx="913" cy="400" r="58" fill="url(#glow)"/>
    <path d="M915 352V389" stroke="#493a3c" stroke-width="5"/>
    <path d="M901 389H929L925 418H905Z" fill="#4c3a3a"/>
    <rect x="907" y="394" width="16" height="18" rx="3" fill="#ffd581"/>
  </g>

  <!-- Tapering village lane, centered on a single vanishing point. -->
  <path d="M0 800L456 449L744 449L1200 800Z" fill="url(#road)"/>
  <path d="M0 800L456 449M1200 800L744 449" fill="none" stroke="#e4ad72" stroke-width="8" opacity=".72"/>
  <path d="M592 490L608 490M575 548L625 548M547 633L653 633M510 745L690 745" stroke="#edc186" stroke-width="7" stroke-linecap="round" opacity=".62"/>

  <!-- Autumn trees frame the street. -->
  <g stroke="#513a39" stroke-linecap="round" fill="none">
    <path d="M66 486Q101 379 116 292M105 393L42 337M110 366L174 302M109 333L79 271" stroke-width="14"/>
    <path d="M1137 470Q1095 360 1087 282M1101 395L1164 340M1090 352L1030 293M1091 322L1122 267" stroke-width="14"/>
  </g>
  <g>
    <use href="#leaf" x="50" y="330" style="color:#d7864e" transform="rotate(-38 50 330) scale(1.4)"/>
    <use href="#leaf" x="112" y="282" style="color:#e4a250" transform="rotate(10 112 282) scale(1.7)"/>
    <use href="#leaf" x="173" y="301" style="color:#a84f3f" transform="rotate(44 173 301) scale(1.4)"/>
    <use href="#leaf" x="80" y="258" style="color:#c96b43" transform="rotate(-30 80 258) scale(1.5)"/>
    <use href="#leaf" x="1150" y="337" style="color:#d17a45" transform="rotate(38 1150 337) scale(1.5)"/>
    <use href="#leaf" x="1088" y="267" style="color:#e1a24f" transform="rotate(-5 1088 267) scale(1.7)"/>
    <use href="#leaf" x="1028" y="289" style="color:#a94d3d" transform="rotate(-42 1028 289) scale(1.4)"/>
    <use href="#leaf" x="1121" y="247" style="color:#c86743" transform="rotate(31 1121 247) scale(1.5)"/>
  </g>

  <!-- Motorcycle: broad wheels, low frame, headlamp, and gentle motion. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <circle cx="478" cy="666" r="67" fill="#302e32" stroke="#241f25" stroke-width="10"/>
    <circle cx="478" cy="666" r="42" fill="#c78d56" stroke="#ead09d" stroke-width="5"/>
    <circle cx="478" cy="666" r="10" fill="#4b3b39"/>
    <circle cx="707" cy="666" r="67" fill="#302e32" stroke="#241f25" stroke-width="10"/>
    <circle cx="707" cy="666" r="42" fill="#c78d56" stroke="#ead09d" stroke-width="5"/>
    <circle cx="707" cy="666" r="10" fill="#4b3b39"/>
    <path d="M478 666L553 591L626 666H520L553 591L651 585L707 666" fill="none" stroke="#b55e43" stroke-width="18"/>
    <path d="M537 581L607 581" stroke="#332d31" stroke-width="19"/>
    <path d="M650 585L667 548L708 542" fill="none" stroke="#302b30" stroke-width="11"/>
    <path d="M699 541L730 541M700 542L689 523" stroke="#302b30" stroke-width="8"/>
    <path d="M707 567L742 575" stroke="#332d31" stroke-width="8"/>
    <circle cx="721" cy="592" r="20" fill="#ffe1a0" stroke="#5c4039" stroke-width="7"/>
    <path d="M456 737H730" stroke="#302d30" stroke-width="8"/>
  </g>

  <!-- Octopus rider: soft mantle, bright eyes, and curling tentacles. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M569 577C534 604 495 586 502 565C507 548 536 557 544 570C551 582 532 600 515 598"
          fill="none" stroke="#bd6655" stroke-width="14"/>
    <path d="M601 570C620 600 596 616 578 608C557 599 571 579 591 585C612 592 621 616 601 629"
          fill="none" stroke="#bd6655" stroke-width="14"/>
    <path d="M629 577C669 605 661 630 637 627C620 625 620 606 636 601C653 596 670 614 663 630"
          fill="none" stroke="#bd6655" stroke-width="14"/>
    <path d="M553 560C535 528 550 494 585 488C617 482 642 506 638 536L627 570Z"
          fill="#cf7860" stroke="#874a49" stroke-width="7"/>
    <path d="M557 531Q585 516 624 531" fill="none" stroke="#e9a078" stroke-width="5" opacity=".8"/>
    <ellipse cx="575" cy="535" rx="7" ry="10" fill="#fff0ca"/>
    <ellipse cx="607" cy="535" rx="7" ry="10" fill="#fff0ca"/>
    <circle cx="577" cy="537" r="3.5" fill="#3b3034"/>
    <circle cx="609" cy="537" r="3.5" fill="#3b3034"/>
    <path d="M584 552Q591 558 598 552" fill="none" stroke="#773e46" stroke-width="3"/>
    <path d="M572 486Q593 468 616 485L624 494Q597 489 575 499Z" fill="#e9b15f" stroke="#8b5945" stroke-width="5"/>
    <path d="M575 495L625 499" stroke="#8b5945" stroke-width="5"/>
    <path d="M623 558L651 580" fill="none" stroke="#bd6655" stroke-width="13"/>
    <circle cx="654" cy="582" r="9" fill="#d78361"/>
    <path d="M548 579L523 573" stroke="#bd6655" stroke-width="12"/>
  </g>

  <!-- Falling leaves and a few stars soften the dusk sky. -->
  <g fill="#f1c27c">
    <circle cx="380" cy="224" r="3"/>
    <circle cx="822" cy="201" r="3"/>
    <circle cx="745" cy="292" r="2.5"/>
    <circle cx="444" cy="304" r="2"/>
  </g>
  <g>
    <use href="#leaf" x="377" y="375" style="color:#e39b4f" transform="rotate(44 377 375) scale(.42)"/>
    <use href="#leaf" x="821" y="331" style="color:#b95140" transform="rotate(-35 821 331) scale(.36)"/>
    <use href="#leaf" x="768" y="429" style="color:#e3a04e" transform="rotate(20 768 429) scale(.3)"/>
  </g>
</svg>