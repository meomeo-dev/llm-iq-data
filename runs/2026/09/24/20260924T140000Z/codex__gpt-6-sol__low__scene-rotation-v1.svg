<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">An octopus riding a motorcycle through an autumn village</title>
  <desc id="desc">At dusk, a smiling octopus rides toward the viewer along a village lane lined with russet trees and glowing cottage windows.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#58435b"/>
      <stop offset=".58" stop-color="#bb715d"/>
      <stop offset="1" stop-color="#edb775"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#956b62"/>
      <stop offset="1" stop-color="#493d42"/>
    </linearGradient>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#d7a87c"/>
      <stop offset="1" stop-color="#9c6755"/>
    </linearGradient>
    <radialGradient id="lamp">
      <stop stop-color="#ffe5a0" stop-opacity=".8"/>
      <stop offset=".35" stop-color="#ffbd65" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffbd65" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="headlight">
      <stop stop-color="#fff5ce" stop-opacity=".95"/>
      <stop offset=".2" stop-color="#ffe4a1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe4a1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cobbles" width="56" height="27" patternUnits="userSpaceOnUse">
