            fill="none" stroke="#d3a087" stroke-opacity=".22" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="900" height="600" fill="url(#sky)"/>
  <circle cx="452" cy="209" r="100" fill="#ffd08c" opacity=".12"/>
  <circle cx="452" cy="209" r="43" fill="#ffdaa2" opacity=".5"/>

