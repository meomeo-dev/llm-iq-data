<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">An octopus rides a motorcycle through an autumn village</title>
  <desc id="desc">A gentle, nostalgic dusk scene with a motorcycle-riding octopus on a lantern-lit village lane, framed by russet trees and cozy cottages.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#343e5b"/>
      <stop offset=".55" stop-color="#b36f61"/>
      <stop offset="1" stop-color="#efb879"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#8a6255"/>
      <stop offset=".48" stop-color="#634b49"/>
      <stop offset="1" stop-color="#393744"/>
    </linearGradient>
    <linearGradient id="house" x2="0" y2="1">
      <stop stop-color="#9c6555"/>
      <stop offset="1" stop-color="#563f48"/>
    </linearGradient>
    <linearGradient id="roof" x2="0" y2="1">
      <stop stop-color="#4a4552"/>
      <stop offset="1" stop-color="#282d3d"/>
    </linearGradient>
    <radialGradient id="lanternGlow">
      <stop stop-color="#ffe7a0" stop-opacity=".9"/>
      <stop offset=".25" stop-color="#ffc96d" stop-opacity=".44"/>
      <stop offset="1" stop-color="#ffb85d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="headGlow">
      <stop stop-color="#fff6c6"/>
      <stop offset=".36" stop-color="#ffda7e"/>
      <stop offset="1" stop-color="#e8994f"/>
    </radialGradient>
    <linearGradient id="octopus" x2=".8" y2="1">
      <stop stop-color="#e5a083"/>
      <stop offset=".6" stop-color="#bf706d"/>
      <stop offset="1" stop-color="#8d5063"/>
    </linearGradient>
    <linearGradient id="bikePaint" x2="0" y2="1">
      <stop stop-color="#e3a05f"/>
      <stop offset=".48" stop-color="#a95248"/>
      <stop offset="1" stop-color="#663c4b"/>
    </linearGradient>
    <linearGradient id="metal" x2="0" y2="1">
      <stop stop-color="#d4c3a5"/>
      <stop offset=".45" stop-color="#797b83"/>
      <stop offset="1" stop-color="#373d4d"/>
    </linearGradient>
    <pattern id="brick" width="42" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10h42M21 0v10M8 10v10" fill="none" stroke="#d29676" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

