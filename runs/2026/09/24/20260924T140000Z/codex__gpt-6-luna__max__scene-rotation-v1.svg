<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">The Lantern Lane Ride</title>
  <desc id="desc">A cheerful octopus rides a vintage motorcycle toward us along a cobbled autumn village lane at dusk. Lanterns glow in russet cottages beneath a plum and amber sky.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#302d4a"/>
      <stop offset=".52" stop-color="#62506a"/>
      <stop offset="1" stop-color="#e39262"/>
    </linearGradient>
    <radialGradient id="horizonGlow">
      <stop stop-color="#ffd18a" stop-opacity=".78"/>
      <stop offset="1" stop-color="#f5a36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x2=".2" y2="1">
      <stop stop-color="#80616a"/>
      <stop offset=".55" stop-color="#70545e"/>
      <stop offset="1" stop-color="#493c4a"/>
    </linearGradient>
    <linearGradient id="leftWall" x2="1" y2=".3">
      <stop stop-color="#733f43"/>
      <stop offset="1" stop-color="#bd7051"/>
    </linearGradient>
    <linearGradient id="rightWall" x2="0" y2=".3">
      <stop stop-color="#743f45"/>
      <stop offset="1" stop-color="#bf7750"/>
    </linearGradient>
    <linearGradient id="roof" x2=".2" y2="1">
      <stop stop-color="#563746"/>
      <stop offset="1" stop-color="#342d40"/>
    </linearGradient>
    <linearGradient id="octopus" x2=".25" y2="1">
      <stop stop-color="#e98b68"/>
      <stop offset="1" stop-color="#aa4f55"/>
    </linearGradient>
    <linearGradient id="bike" x2="0" y2="1">
      <stop stop-color="#66806f"/>
      <stop offset="1" stop-color="#344f50"/>
    </linearGradient>
    <radialGradient id="lampGlow">
      <stop stop-color="#fff4bd" stop-opacity=".92"/>
      <stop offset=".32" stop-color="#ffbd69" stop-opacity=".48"/>
      <stop offset="1" stop-color="#ffb05e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="roofTiles" width="28" height="17" patternUnits="userSpaceOnUse">
      <path d="M0 16 Q7 8 14 16 T28 16" fill="none" stroke="#a46954" stroke-opacity=".48" stroke-width="2"/>
      <path d="M14 0v8" stroke="#322c3d" stroke-opacity=".45"/>
    </pattern>
    <pattern id="brick" width="46" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 0h46M0 12h46M0 24h46M23 0v12M0 12v12M46 12v12"
            fill="none" stroke="#f1ad76" stroke-opacity=".17" stroke-width="1"/>
    </pattern>
  </defs>

