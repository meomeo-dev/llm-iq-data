<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a4a"/>
      <stop offset="0.5" stop-color="#8a4a3c"/>
      <stop offset="1" stop-color="#e8964a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a3a"/>
      <stop offset="1" stop-color="#3e2a22"/>
    </linearGradient>
    <radialGradient id="win" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#f4b64a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="headlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffcf70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="octo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2553f"/>
      <stop offset="1" stop-color="#8f3a2d"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="400" cy="300" r="60" fill="#f7c66b" opacity="0.9"/>
  <circle cx="400" cy="300" r="140" fill="url(#glow)"/>

  <!-- 地面与道路（一点透视，消失点 400,300） -->
  <rect x="0" y="300" width="800" height="300" fill="#4a3324"/>
  <polygon points="400,300 40,600 760,600" fill="url(#road)"/>
  <polygon points="400,300 20,600 130,600" fill="#5a4030"/>
  <polygon points="400,300 670,600 780,600" fill="#5a4030"/>
  <!-- 鹅卵石暗示 -->
  <g stroke="#2e1f18" stroke-width="1" opacity="0.5" fill="none">
    <line x1="400" y1="300" x2="200" y2="600"/>
    <line x1="400" y1="300" x2="300" y2="600"/>
    <line x1="400" y1="300" x2="500" y2="600"/>
    <line x1="400" y1="300" x2="600" y2="600"/>
    <path d="M330 360 L470 360"/><path d="M290 400 L510 400"/>
    <path d="M240 450 L560 450"/><path d="M180 510 L620 510"/>
    <path d="M110 570 L690 570"/>
  </g>

  <!-- 左侧房屋（远到近） -->
  <g>
    <polygon points="340,300 340,250 355,238 370,250 370,300" fill="#6a3a2c"/>
    <rect x="352" y="272" width="8" height="10" fill="url(#win)"/>
    <polygon points="290,300 290,215 320,190 350,215 350,300" fill="#7a4232"/>
    <polygon points="285,218 320,186 355,218" fill="#4a2a20"/>
    <rect x="300" y="240" width="14" height="18" fill="url(#win)"/>
    <rect x="326" y="240" width="14" height="18" fill="url(#win)"/>
    <polygon points="180,330 180,150 240,110 300,150 300,300 240,310" fill="#8a4a36"/>
    <polygon points="170,155 240,102 310,155" fill="#4e2c22"/>
    <rect x="200" y="190" width="24" height="30" fill="url(#win)"/>
    <rect x="252" y="190" width="24" height="30" fill="url(#win)"/>
    <rect x="200" y="250" width="24" height="30" fill="url(#win)"/>
    <rect x="252" y="250" width="24" height="30" fill="url(#win)"/>
    <circle cx="212" cy="205" r="40" fill="url(#glow)"/>
    <circle cx="264" cy="265" r="40" fill="url(#glow)"/>
    <polygon points="0,380 0,60 100,20 180,80 180,340" fill="#9a5540"/>
    <polygon points="-10,66 100,10 190,86" fill="#55302a"/>
    <rect x="40" y="120" width="40" height="50" fill="url(#win)"/>
    <rect x="110" y="140" width="40" height="50" fill="url(#win)"/>
    <rect x="40" y="220" width="40" height="50" fill="url(#win)"/>
    <rect x="110" y="240" width="40" height="50" fill="url(#win)"/>
    <circle cx="60" cy="145" r="60" fill="url(#glow)"/>
    <circle cx="130" cy="265" r="60" fill="url(#glow)"/>
  </g>

  <!-- 右侧房屋 -->
  <g>
    <polygon points="430,300 430,250 445,238 460,250 460,300" fill="#6a3a2c"/>
    <rect x="440" y="272" width="8" height="10" fill="url(#win)"/>
    <polygon points="450,300 450,215 480,190 510,215 510,300" fill="#7a4232"/>
    <polygon points="445,218 480,186 515,218" fill="#4a2a20"/>
    <rect x="460" y="240" width="14" height="18" fill="url(#win)"/>
    <rect x="486" y="240" width="14" height="18" fill="url(#win)"/>
    <polygon points="500,300 500,150 560,110 620,150 620,330 560,310" fill="#8a4a36"/>
    <polygon points="490,155 560,102 630,155" fill="#4e2c22"/>
    <rect x="524" y="190" width="24" height="30" fill="url(#win)"/>
    <rect x="576" y="190" width="24" height="30" fill="url(#win)"/>
    <rect x="524" y="250" width="24" height="30" fill="url(#win)"/>
    <rect x="576" y="250" width="24" height="30" fill="url(#win)"/>
    <circle cx="536" cy="205" r="40" fill="url(#glow)"/>
    <circle cx="588" cy="265" r="40" fill="url(#glow)"/>
    <polygon points="620,340 620,80 700,20 800,60 800,380" fill="#9a5540"/>
    <polygon points="610,86 700,10 810,66" fill="#55302a"/>
    <rect x="650" y="140" width="40" height="50" fill="url(#win)"/>
    <rect x="720" y="120" width="40" height="50" fill="url(#win)"/>
    <rect x="650" y="240" width="40" height="50" fill="url(#win)"/>
    <rect x="720" y="220" width="40" height="50" fill="url(#win)"/>
    <circle cx="670" cy="165" r="60" fill="url(#glow)"/>
    <circle cx="740" cy="245" r="60" fill="url(#glow)"/>
  </g>

  <!-- 街灯 -->
  <g>
    <rect x="158" y="300" width="4" height="90" fill="#2a1a14"/>
    <rect x="150" y="288" width="20" height="16" rx="3" fill="#3a2418"/>
    <rect x="154" y="291" width="12" height="10" fill="#ffe08a"/>
    <circle cx="160" cy="296" r="45" fill="url(#glow)"/>
    <rect x="638" y="300" width="4" height="90" fill="#2a1a14"/>
    <rect x="630" y="288" width="20" height="16" rx="3" fill="#3a2418"/>
    <rect x="634" y="291" width="12" height="10" fill="#ffe08a"/>
    <circle cx="640" cy="296" r="45" fill="url(#glow)"/>
  </g>

  <!-- 落叶 -->
  <g fill="#d9772e" opacity="0.85">
    <ellipse cx="120" cy="420" rx="9" ry="5" transform="rotate(-20 120 420)"/>
    <ellipse cx="90" cy="500" rx="11" ry="6" transform="rotate(30 90 500)"/>
    <ellipse cx="700" cy="440" rx="9" ry="5" transform="rotate(15 700 440)"/>
    <ellipse cx="730" cy="530" rx="12" ry="6" transform="rotate(-35 730 530)"/>
    <ellipse cx="200" cy="560" rx="10" ry="5" fill="#b8532a" transform="rotate(50 200 560)"/>
    <ellipse cx="620" cy="580" rx="10" ry="5" fill="#b8532a" transform="rotate(-50 620 580)"/>
    <ellipse cx="560" cy="230" rx="6" ry="3" transform="rotate(20 560 230)"/>
    <ellipse cx="250" cy="330" rx="6" ry="3" transform="rotate(-40 250 330)"/>
  </g>

  <!-- 摩托车头灯光束 -->
  <polygon points="400,470 300,600 520,600" fill="url(#headlight)"/>

  <!-- 摩托车 -->
  <g>
    <ellipse cx="400" cy="592" rx="120" ry="10" fill="#1e120e" opacity="0.5"/>
    <!-- 后轮 -->
    <circle cx="400" cy="548" r="42" fill="#1a1210"/>
    <circle cx="400" cy="548" r="30" fill="#3a2c26"/>
    <!-- 车身 -->
    <path d="M330 520 Q400 470 470 520 L470 545 L330 545 Z" fill="#7a2f22"/>
    <path d="M345 512 Q400 480 455 512 L455 525 L345 525 Z" fill="#a8412f"/>
    <!-- 前叉与头灯 -->
    <rect x="392" y="455" width="16" height="70" rx="6" fill="#2a1c18"/>
    <circle cx="400" cy="470" r="22" fill="#3b2a24"/>
    <circle cx="400" cy="470" r="16" fill="#ffe9a8"/>
    <circle cx="400" cy="470" r="9" fill="#fff8dc"/>
    <!-- 前轮 -->
    <circle cx="400" cy="560" r="36" fill="#1a1210"/>
    <circle cx="400" cy="560" r="24" fill="#3a2c26"/>
    <circle cx="400" cy="560" r="6" fill="#7a6a5a"/>
    <!-- 车把 -->
    <path d="M330 450 Q400 435 470 450" stroke="#2a1c18" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="330" cy="450" r="7" fill="#c9a24a"/>
    <circle cx="470" cy="450" r="7" fill="#c9a24a"/>
    <!-- 后视镜 -->
    <line x1="345" y1="448" x2="335" y2="420" stroke="#2a1c18" stroke-width="3"/>
    <ellipse cx="333" cy="416" rx="9" ry="6" fill="#d8c7a0"/>
    <line x1="455" y1="448" x2="465" y2="420" stroke="#2a1c18" stroke-width="3"/>
    <ellipse cx="467" cy="416" rx="9" ry="6" fill="#d8c7a0"/>
  </g>

  <!-- 章鱼骑手 -->
  <g>
    <!-- 后方触手（缠住车把与车身） -->
    <g stroke="url(#octo)" stroke-width="12" fill="none" stroke-linecap="round">
      <path d="M375 430 Q340 440 332 455"/>
      <path d="M425 430 Q460 440 468 455"/>
      <path d="M380 445 Q350 480 355 520"/>
      <path d="M420 445 Q450 480 445 520"/>
      <path d="M385 450 Q370 500 390 530"/>
      <path d="M415 450 Q430 500 410 530"/>
    </g>
    <!-- 吸盘 -->
    <g fill="#e8a37a">
      <circle cx="350" cy="440" r="2.5"/><circle cx="338" cy="450" r="2.5"/>
      <circle cx="450" cy="440" r="2.5"/><circle cx="462" cy="450" r="2.5"/>
      <circle cx="360" cy="475" r="2.5"/><circle cx="355" cy="500" r="2.5"/>
      <circle cx="440" cy="475" r="2.5"/><circle cx="445" cy="500" r="2.5"/>
    </g>
    <!-- 头部 -->
    <ellipse cx="400" cy="400" rx="46" ry="52" fill="url(#octo)"/>
    <ellipse cx="385" cy="375" rx="12" ry="8" fill="#d97a5c" opacity="0.5"/>
    <!-- 眼睛 -->
    <ellipse cx="383" cy="405" rx="10" ry="12" fill="#fff6e0"/>
    <ellipse cx="417" cy="405" rx="10" ry="12" fill="#fff6e0"/>
    <circle cx="385" cy="408" r="5" fill="#2a1610"/>
    <circle cx="419" cy="408" r="5" fill="#2a1610"/>
    <circle cx="387" cy="405" r="1.8" fill="#fff"/>
    <circle cx="421" cy="405" r="1.8" fill="#fff"/>
    <!-- 微笑 -->
    <path d="M388 428 Q400 438 412 428" stroke="#3a1a12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- 护目镜推到头顶 -->
    <path d="M356 372 Q400 350 444 372" stroke="#3a2a22" stroke-width="5" fill="none"/>
    <ellipse cx="380" cy="368" rx="13" ry="9" fill="#5a4a3a" stroke="#2a1c18" stroke-width="2"/>
    <ellipse cx="420" cy="368" rx="13" ry="9" fill="#5a4a3a" stroke="#2a1c18" stroke-width="2"/>
    <ellipse cx="376" cy="365" rx="4" ry="2.5" fill="#f4d79a" opacity="0.7"/>
    <!-- 围巾 -->
    <path d="M362 440 Q400 460 438 440 L436 452 Q400 472 364 452 Z" fill="#c98a2e"/>
    <path d="M436 448 Q455 470 445 495" stroke="#c98a2e" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 前景暖色晕染 -->
  <rect width="800" height="600" fill="#e07a3a" opacity="0.06"/>
</svg>