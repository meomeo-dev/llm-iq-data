        <path d="M0-55V55M-55 0H55M-39-39L39 39M-39 39L39-39M-21-51L21 51M-51-21L51 21M-51 21L51-21M-21 51L21-51"/>
      </g>
      <circle r="15" fill="#b6a28a" stroke="#443d3b" stroke-width="5"/>
      <circle r="5" fill="#67564b"/>
      <path d="M-62-33A70 70 0 0 1 76 1" fill="none" stroke="#d5bb98" stroke-width="2" opacity=".4"/>
    </g>
  </defs>

