<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">An Autumn Evening Ride</title>
  <desc id="desc">A cheerful copper-colored octopus rides a vintage motorcycle along a cobbled village lane. Cottages and glowing lanterns recede toward a single vanishing point under a dusky autumn sky.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#61515d"/>
      <stop offset=".55" stop-color="#bc8070"/>
      <stop offset="1" stop-color="#f0bd80"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#b48b72"/>
      <stop offset="1" stop-color="#65514d"/>
    </linearGradient>
    <linearGradient id="plaster" x2="1" y2=".4">
      <stop stop-color="#bf8964"/>
      <stop offset="1" stop-color="#895b4c"/>
    </linearGradient>
    <linearGradient id="octopus" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#eda46f"/>
      <stop offset=".5" stop-color="#c66a4c"/>
      <stop offset="1" stop-color="#924739"/>
    </linearGradient>
    <linearGradient id="tank" x2=".3" y2="1">
      <stop stop-color="#ac684b"/>
      <stop offset=".42" stop-color="#864535"/>
      <stop offset="1" stop-color="#552f2c"/>
    </linearGradient>
    <radialGradient id="window">
      <stop stop-color="#ffe5a0"/>
      <stop offset="1" stop-color="#dd934b"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop stop-color="#ffd797" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd797" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="windowPane">
      <rect width="46" height="62" rx="3" fill="#573c36"/>
      <rect x="5" y="5" width="36" height="51" rx="2" fill="url(#window)"/>
      <path d="M23 5V57M5 30H41" stroke="#79513d" stroke-width="4"/>
      <path d="M7 7L15 9V27L7 31M39 7L31 9V27L39 31" fill="#ffe5b4" opacity=".45"/>
      <path d="M-4 63H50" stroke="#563c34" stroke-width="6"/>
    </g>
    <g id="lantern">
      <path d="M0-23V-15M-13-11L0-20L13-11Z" fill="#493733" stroke="#493733" stroke-width="3"/>
      <rect x="-11" y="-10" width="22" height="29" rx="3" fill="url(#window)" stroke="#493733" stroke-width="3"/>
      <path d="M0-9V18M-14 20H14" stroke="#493733" stroke-width="3"/>
    </g>
    <g id="leaf">
      <path d="M-8 0Q-2-12 9-7Q11 4 0 7Z" fill="currentColor"/>
      <path d="M-8 7L6-4" stroke="#724637" stroke-width="1"/>
    </g>
    <g id="wheel">
