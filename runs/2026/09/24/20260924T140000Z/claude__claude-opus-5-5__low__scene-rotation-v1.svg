<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2340"/>
      <stop offset="0.5" stop-color="#a0473a"/>
      <stop offset="1" stop-color="#f0a152"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a3a"/>
      <stop offset="1" stop-color="#3e2418"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe0a0"/>
      <stop offset="1" stop-color="#f0a152" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="octo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0704a"/>
      <stop offset="1" stop-color="#a8402e"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="400" cy="250" r="120" fill="url(#sun)"/>
  <circle cx="400" cy="252" r="22" fill="#ffd89a" opacity="0.9"/>

  <!-- 远山 -->
  <path d="M0 270 Q150 220 280 255 T520 245 T800 265 V300 H0Z" fill="#6b3a36" opacity="0.7"/>

  <!-- 路面（一点透视，消失点 400,260） -->
  <polygon points="380,260 420,260 800,600 0,600" fill="url(#road)"/>
  <g stroke="#5a3624" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="560" x2="800" y2="560"/>
    <line x1="60" y1="505" x2="740" y2="505"/>
    <line x1="140" y1="440" x2="660" y2="440"/>
    <line x1="220" y1="380" x2="580" y2="380"/>
    <line x1="290" y1="330" x2="510" y2="330"/>
    <line x1="340" y1="295" x2="460" y2="295"/>
  </g>
  <g stroke="#5a3624" stroke-width="1.5" opacity="0.5">
    <line x1="400" y1="260" x2="400" y2="600"/>
    <line x1="400" y1="260" x2="200" y2="600"/>
    <line x1="400" y1="260" x2="600" y2="600"/>
  </g>

  <!-- 左侧房屋 -->
  <polygon points="0,90 250,210 250,330 0,470" fill="#7a3b26"/>
  <polygon points="0,90 250,210 250,200 0,60" fill="#4a2218"/>
  <polygon points="250,210 330,240 330,300 250,330" fill="#8e4a2e"/>
  <polygon points="330,240 370,254 370,278 330,300" fill="#9c5534"/>
  <!-- 左窗 -->
  <g>
    <ellipse cx="70" cy="240" rx="70" ry="70" fill="url(#glow)"/>
    <polygon points="45,190 100,212 100,280 45,300" fill="#ffc85e"/>
    <line x1="72" y1="200" x2="72" y2="290" stroke="#4a2218" stroke-width="3"/>
    <line x1="45" y1="245" x2="100" y2="246" stroke="#4a2218" stroke-width="3"/>
    <ellipse cx="190" cy="265" rx="45" ry="45" fill="url(#glow)"/>
    <polygon points="170,235 210,251 210,295 170,305" fill="#ffc85e"/>
    <ellipse cx="290" cy="268" rx="25" ry="25" fill="url(#glow)"/>
    <polygon points="282,254 302,261 302,282 282,287" fill="#ffc85e"/>
    <polygon points="345,258 358,262 358,276 345,279" fill="#ffc85e"/>
  </g>
  <!-- 左门 -->
  <polygon points="130,300 160,312 160,395 130,410" fill="#3a1a12"/>

  <!-- 右侧房屋 -->
  <polygon points="800,90 550,210 550,330 800,470" fill="#6e3322"/>
  <polygon points="800,90 550,210 550,200 800,60" fill="#40201a"/>
  <polygon points="550,210 470,240 470,300 550,330" fill="#854228"/>
  <polygon points="470,240 430,254 430,278 470,300" fill="#955032"/>
  <g>
    <ellipse cx="730" cy="240" rx="70" ry="70" fill="url(#glow)"/>
    <polygon points="755,190 700,212 700,280 755,300" fill="#ffc85e"/>
    <line x1="728" y1="200" x2="728" y2="290" stroke="#40201a" stroke-width="3"/>
    <line x1="700" y1="246" x2="755" y2="245" stroke="#40201a" stroke-width="3"/>
    <ellipse cx="610" cy="265" rx="45" ry="45" fill="url(#glow)"/>
    <polygon points="630,235 590,251 590,295 630,305" fill="#ffc85e"/>
    <ellipse cx="510" cy="268" rx="25" ry="25" fill="url(#glow)"/>
    <polygon points="518,254 498,261 498,282 518,287" fill="#ffc85e"/>
    <polygon points="455,258 442,262 442,276 455,279" fill="#ffc85e"/>
  </g>

  <!-- 挂灯笼 -->
  <g>
    <line x1="250" y1="215" x2="250" y2="232" stroke="#2a140e" stroke-width="2"/>
    <circle cx="250" cy="240" r="22" fill="url(#glow)"/>
    <ellipse cx="250" cy="240" rx="8" ry="10" fill="#ff9a3c"/>
    <line x1="550" y1="215" x2="550" y2="232" stroke="#2a140e" stroke-width="2"/>
    <circle cx="550" cy="240" r="22" fill="url(#glow)"/>
    <ellipse cx="550" cy="240" rx="8" ry="10" fill="#ff9a3c"/>
  </g>

  <!-- 落叶 -->
  <g>
    <ellipse cx="120" cy="560" rx="7" ry="3" fill="#c8602a" transform="rotate(20 120 560)"/>
    <ellipse cx="680" cy="540" rx="6" ry="3" fill="#e0902e" transform="rotate(-30 680 540)"/>
    <ellipse cx="260" cy="470" rx="5" ry="2.5" fill="#b0452a"/>
    <ellipse cx="560" cy="455" rx="5" ry="2.5" fill="#d8782e" transform="rotate(40 560 455)"/>
    <ellipse cx="330" cy="150" rx="6" ry="3" fill="#e0902e" transform="rotate(35 330 150)"/>
    <ellipse cx="480" cy="120" rx="5" ry="2.5" fill="#c8602a" transform="rotate(-20 480 120)"/>
    <ellipse cx="620" cy="170" rx="5" ry="2.5" fill="#d8782e"/>
  </g>

  <!-- 地面暖光与阴影 -->
  <ellipse cx="400" cy="560" rx="150" ry="18" fill="#2a140e" opacity="0.5"/>

  <!-- 摩托车 -->
  <g>
    <circle cx="300" cy="520" r="42" fill="#1e120e"/>
    <circle cx="300" cy="520" r="24" fill="#5a3a2a"/>
    <circle cx="300" cy="520" r="6" fill="#c9a36a"/>
    <circle cx="510" cy="520" r="42" fill="#1e120e"/>
    <circle cx="510" cy="520" r="24" fill="#5a3a2a"/>
    <circle cx="510" cy="520" r="6" fill="#c9a36a"/>
    <path d="M300 520 L360 470 L460 470 L510 520" fill="none" stroke="#7a2f1e" stroke-width="8" stroke-linejoin="round"/>
    <path d="M340 480 Q400 440 470 470 L450 500 L360 500Z" fill="#9e3a24"/>
    <rect x="370" y="490" width="60" height="22" rx="6" fill="#4a3228"/>
    <path d="M470 470 L500 430" stroke="#3a2a22" stroke-width="6"/>
    <path d="M490 425 L520 420" stroke="#3a2a22" stroke-width="5" stroke-linecap="round"/>
    <circle cx="512" cy="448" r="10" fill="#ffd27a"/>
    <circle cx="512" cy="448" r="30" fill="url(#glow)"/>
    <path d="M300 520 Q290 500 330 486" fill="none" stroke="#c9a36a" stroke-width="4"/>
    <path d="M330 505 L270 505" stroke="#8a8078" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 章鱼 -->
  <g>
    <!-- 触手 -->
    <g fill="none" stroke="url(#octo)" stroke-width="11" stroke-linecap="round">
      <path d="M380 440 Q360 470 340 490 Q330 500 345 505"/>
      <path d="M400 445 Q395 480 380 500"/>
      <path d="M420 445 Q430 480 450 495"/>
      <path d="M435 430 Q470 420 495 425"/>
      <path d="M440 415 Q480 405 510 420"/>
      <path d="M365 430 Q330 440 320 470"/>
    </g>
    <!-- 身体 -->
    <path d="M345 420 Q340 330 405 320 Q470 330 460 420 Q405 450 345 420Z" fill="url(#octo)"/>
    <ellipse cx="385" cy="345" rx="14" ry="8" fill="#f09a70" opacity="0.6"/>
    <!-- 眼睛 -->
    <ellipse cx="385" cy="390" rx="10" ry="12" fill="#fff5e0"/>
    <ellipse cx="425" cy="390" rx="10" ry="12" fill="#fff5e0"/>
    <circle cx="388" cy="393" r="5" fill="#2a140e"/>
    <circle cx="428" cy="393" r="5" fill="#2a140e"/>
    <circle cx="390" cy="390" r="1.5" fill="#fff"/>
    <circle cx="430" cy="390" r="1.5" fill="#fff"/>
    <path d="M395 412 Q405 418 415 412" fill="none" stroke="#5a2016" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="372" cy="408" rx="6" ry="3" fill="#ff8a70" opacity="0.6"/>
    <ellipse cx="438" cy="408" rx="6" ry="3" fill="#ff8a70" opacity="0.6"/>
    <!-- 围巾 -->
    <path d="M350 425 Q405 445 458 425 L455 438 Q405 458 352 438Z" fill="#d9a441"/>
    <path d="M360 432 Q340 450 318 452 L322 462 Q348 460 368 440Z" fill="#d9a441"/>
    <!-- 贝雷帽 -->
    <ellipse cx="405" cy="325" rx="40" ry="12" fill="#6a2a1e"/>
    <circle cx="405" cy="313" r="4" fill="#6a2a1e"/>
  </g>
</svg>