<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">An octopus riding a motorcycle through an autumn village</title>
  <desc id="desc">A gentle, lantern-lit village lane recedes toward the dusk horizon as a cheerful octopus rides past fallen leaves.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#39374a"/>
      <stop offset=".58" stop-color="#985b59"/>
      <stop offset="1" stop-color="#e7a567"/>
    </linearGradient>
    <radialGradient id="horizon">
      <stop stop-color="#ffd995" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ffd995" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#a17465"/>
      <stop offset="1" stop-color="#594a4b"/>
    </linearGradient>
    <linearGradient id="octopus" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#ef9b72"/>
      <stop offset=".55" stop-color="#cb6856"/>
      <stop offset="1" stop-color="#91444b"/>
    </linearGradient>
    <radialGradient id="window">
      <stop stop-color="#fff0ad"/>
      <stop offset=".55" stop-color="#f9bd67"/>
      <stop offset="1" stop-color="#df8549"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Dusk sky and distant ridge -->
  <path fill="url(#sky)" d="M0 0h1000v700H0z"/>
  <ellipse cx="500" cy="352" rx="350" ry="180" fill="url(#horizon)"/>
  <circle cx="704" cy="119" r="34" fill="#ffe0ad" opacity=".2" filter="url(#softGlow)"/>
  <circle cx="704" cy="119" r="21" fill="#ffe6be" opacity=".78"/>
  <path d="M0 325Q100 287 193 319T391 323Q451 339 500 327Q563 306 630 326T814 317Q913 289 1000 318V460H0Z"
        fill="#6d5155" opacity=".55"/>
  <path d="M0 349Q166 323 309 349T500 346Q647 326 781 352T1000 338V470H0Z"
        fill="#784f50" opacity=".62"/>

  <!-- Small houses near the vanishing point -->
  <g stroke="#5c4144" stroke-width="2" stroke-linejoin="round">
    <path d="M423 337l31-25 31 25v61h-62z" fill="#b77a5e"/>
    <path d="M416 339l38-34 38 34z" fill="#714447"/>
    <path d="M515 337l29-23 32 23v64h-61z" fill="#aa705b"/>
    <path d="M507 339l37-32 39 32z" fill="#684149"/>
    <path d="M454 353h12v18h-12zM538 353h13v18h-13z" fill="#ffd490"/>
  </g>

  <!-- Left side of the lane -->
  <g stroke="#694849" stroke-linejoin="round">
    <path d="M0 281l228 33v250L0 616Z" fill="#b77a5a" stroke-width="3"/>
    <path d="M0 245l229 38 31 43L0 288Z" fill="#6d3f43" stroke-width="4"/>
    <path d="M0 277l229 37" fill="none" stroke="#df9a70" stroke-width="4"/>
    <path d="M34 358l61 7v77l-61-10zM135 370l52 6v65l-52-8z"
          fill="#6f4b4b" stroke-width="5"/>
    <path d="M41 364l47 5v64l-47-7zM142 376l38 5v52l-38-6z"
          fill="url(#window)" stroke="#e9b071" stroke-width="2"/>
    <path d="M65 366v65m79-51 34 4m-17-6v52" fill="none"
          stroke="#754948" stroke-width="4"/>
    <path d="M44 472l43 4v91l-43 12z" fill="#724c49" stroke-width="4"/>
    <circle cx="78" cy="524" r="3" fill="#e3b179" stroke="none"/>
    <path d="M241 314l121 17v136l-121 48z" fill="#c08a65" stroke-width="3"/>
    <path d="M230 318l54-55 84 68z" fill="#75454a" stroke-width="4"/>
    <path d="M280 351l34 4v47l-34-2z" fill="url(#window)" stroke-width="4"/>
    <path d="M297 353v47m-16-24 33 2" fill="none" stroke-width="3"/>
    <path d="M334 369l18 2v27l-18-2z" fill="url(#window)" stroke-width="3"/>
    <path d="M371 337l55 5v63l-55 18z" fill="#bd8466" stroke-width="2"/>
    <path d="M365 341l27-27 39 28z" fill="#714449" stroke-width="3"/>
    <path d="M386 356l16 1v26l-16-1z" fill="#ffd398" stroke-width="2"/>
  </g>

  <!-- Right side of the lane -->
  <g stroke="#694849" stroke-linejoin="round">
    <path d="M1000 279L772 314v251l228 48Z" fill="#a86c59" stroke-width="3"/>
    <path d="M1000 245l-229 38-31 43 260-38Z" fill="#713e43" stroke-width="4"/>
    <path d="M1000 277l-229 37" fill="none" stroke="#d58e6a" stroke-width="4"/>
    <path d="M905 365l61-7v74l-61 10zM812 375l52-6v66l-52 8z"
          fill="#704747" stroke-width="5"/>
    <path d="M912 369l47-5v62l-47 8zM819 380l38-5v53l-38 6z"
          fill="url(#window)" stroke="#efae6b" stroke-width="2"/>
    <path d="M936 366v64m-23-30 46-6m-121-16v54" fill="none"
          stroke="#754948" stroke-width="4"/>
    <path d="M918 474l46-5v103l-46-10z" fill="#70494a" stroke-width="4"/>
    <circle cx="928" cy="520" r="3" fill="#e7ae77" stroke="none"/>
    <path d="M759 314l-121 17v136l121 48z" fill="#b7795b" stroke-width="3"/>
    <path d="M770 318l-54-55-84 68z" fill="#694047" stroke-width="4"/>
    <path d="M683 355l35-5v48l-35 5z" fill="url(#window)" stroke-width="4"/>
    <path d="M700 353v47m-16-20 33-4" fill="none" stroke-width="3"/>
    <path d="M650 369l18-2v28l-18 3z" fill="url(#window)" stroke-width="3"/>
    <path d="M629 337l-55 5v63l55 18z" fill="#bb8062" stroke-width="2"/>
    <path d="M635 341l-27-27-39 28z" fill="#6c4146" stroke-width="3"/>
    <path d="M598 357l16-1v26l-16 2z" fill="#ffd398" stroke-width="2"/>
  </g>

  <!-- Window light spilling onto the walls -->
  <g fill="#ffce7a" opacity=".26" filter="url(#glow)">
    <ellipse cx="67" cy="398" rx="45" ry="58"/>
    <ellipse cx="160" cy="406" rx="39" ry="50"/>
    <ellipse cx="297" cy="380" rx="31" ry="42"/>
    <ellipse cx="937" cy="400" rx="45" ry="58"/>
    <ellipse cx="839" cy="406" rx="39" ry="50"/>
    <ellipse cx="701" cy="379" rx="31" ry="42"/>
  </g>

  <!-- Lane, narrowing to a single distant point -->
  <path d="M466 349h68L1000 700H0Z" fill="url(#road)"/>
  <path d="M0 700 466 349h8L47 700Z" fill="#d49b70" opacity=".7"/>
  <path d="M1000 700 534 349h-8l427 351Z" fill="#d49b70" opacity=".7"/>
  <path d="M0 700 466 349M1000 700 534 349" fill="none"
        stroke="#4f4245" stroke-width="6" opacity=".7"/>
  <g fill="none" stroke="#d4ad88" stroke-linecap="round" opacity=".33">
    <path d="M447 373q53 8 106 0" stroke-width="2"/>
    <path d="M405 404q95 11 190 0" stroke-width="2"/>
    <path d="M352 446q148 17 296 0" stroke-width="2"/>
    <path d="M290 494q210 21 420 0" stroke-width="3"/>
    <path d="M208 556q292 29 584 0" stroke-width="3"/>
    <path d="M93 645q407 36 814 0" stroke-width="4"/>
    <path d="M500 355 275 700M500 355 415 700M500 355 585 700M500 355 725 700"
          stroke-width="2"/>
  </g>
  <g fill="#d4a078" opacity=".4">
    <path d="M464 392h18l-8 8h-23zM548 416h22l15 12h-27z"/>
    <path d="M330 474h37l-16 12h-44zM621 474h37l23 13h-45z"/>
    <path d="M172 605h61l-27 18h-73zM739 600h61l36 20h-74z"/>
  </g>

  <!-- Autumn trees frame the village -->
  <g fill="none" stroke="#644348" stroke-linecap="round">
    <path d="M133 472Q122 349 154 257M141 366Q93 308 37 297M148 329Q201 273 257 278"
          stroke-width="16"/>
    <path d="M872 466Q879 351 849 246M867 360Q918 303 976 286M854 324Q812 274 755 278"
          stroke-width="16"/>
  </g>
  <g fill="#9e5a47">
    <circle cx="80" cy="258" r="57"/><circle cx="153" cy="213" r="74"/>
    <circle cx="222" cy="255" r="57"/><circle cx="33" cy="209" r="51"/>
    <circle cx="918" cy="249" r="60"/><circle cx="846" cy="205" r="76"/>
    <circle cx="772" cy="257" r="55"/><circle cx="981" cy="200" r="50"/>
  </g>
  <g fill="#c47a4d" opacity=".88">
    <circle cx="104" cy="210" r="46"/><circle cx="189" cy="198" r="48"/>
    <circle cx="236" cy="275" r="36"/><circle cx="28" cy="260" r="38"/>
    <circle cx="894" cy="208" r="52"/><circle cx="796" cy="222" r="46"/>
    <circle cx="958" cy="270" r="40"/><circle cx="752" cy="282" r="34"/>
  </g>
  <g fill="#e3a15f" opacity=".72">
    <circle cx="67" cy="219" r="29"/><circle cx="161" cy="184" r="38"/>
    <circle cx="215" cy="239" r="26"/><circle cx="936" cy="218" r="34"/>
    <circle cx="827" cy="181" r="38"/><circle cx="781" cy="260" r="25"/>
  </g>

  <!-- Two little street lanterns -->
  <g stroke="#5b4245" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 352v101m0-98 17-9" stroke-width="5" fill="none"/>
    <path d="M670 352v101m0-98-17-9" stroke-width="5" fill="none"/>
    <path d="M340 338h20l-3 24h-14zM640 338h20l-3 24h-14z"
          fill="#efb96c" stroke-width="3"/>
    <path d="M337 338l13-12 13 12M637 338l13-12 13 12"
          fill="none" stroke-width="3"/>
  </g>
  <g fill="#ffd58d" opacity=".5" filter="url(#softGlow)">
    <circle cx="350" cy="349" r="26"/><circle cx="650" cy="349" r="26"/>
  </g>

  <!-- Fallen and drifting leaves -->
  <g fill="#db914f" opacity=".9">
    <path d="M222 528q13-15 24-7-4 17-24 7ZM770 537q-10-17-24-7 6 17 24 7Z"/>
    <path d="M105 628q20-13 31 0-12 16-31 0ZM843 643q-17-17-31-4 11 18 31 4Z"/>
    <path d="M275 597q12-13 23-4-7 14-23 4ZM707 590q-9-16-23-8 5 15 23 8Z"/>
    <path d="M341 342q-5-15 8-21 9 14-8 21ZM748 379q15-9 21 3-12 12-21-3Z"/>
  </g>
  <g fill="#a75845" opacity=".78">
    <path d="M53 662q15-15 28-3-8 17-28 3ZM939 595q-17-13-27 1 12 15 27-1Z"/>
    <path d="M190 463q-2-17 12-20 7 16-12 20ZM809 489q13-14 24-4-6 16-24 4Z"/>
  </g>

  <!-- Motorcycle shadow and the octopus's far tentacles -->
  <ellipse cx="506" cy="637" rx="260" ry="30" fill="#312e38" opacity=".35"/>
  <g fill="none" stroke="#a34e4c" stroke-linecap="round" stroke-linejoin="round">
    <path d="M462 488Q416 479 389 437T397 392Q408 375 424 386" stroke-width="19"/>
    <path d="M477 492Q425 489 379 473T327 493Q327 514 350 515" stroke-width="17"/>
    <path d="M499 485Q548 461 555 411T540 388Q527 391 533 406" stroke-width="18"/>
    <path d="M501 503Q554 510 576 539T560 567Q541 568 539 550" stroke-width="17"/>
  </g>
  <g fill="#e7a078" opacity=".75">
    <circle cx="385" cy="434" r="5"/><circle cx="375" cy="461" r="5"/>
    <circle cx="352" cy="483" r="5"/><circle cx="548" cy="432" r="5"/>
    <circle cx="563" cy="527" r="5"/><circle cx="570" cy="550" r="4"/>
  </g>

  <!-- Motorcycle wheels -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="370" cy="589" r="61" stroke="#342f39" stroke-width="19"/>
    <circle cx="370" cy="589" r="47" stroke="#c58965" stroke-width="5"/>
    <circle cx="370" cy="589" r="11" fill="#e3af77" stroke="#59454a" stroke-width="5"/>
    <path d="M370 542v94m-47-47h94m-80-33 66 66m0-66-66 66"
          stroke="#ba957c" stroke-width="3"/>
    <circle cx="642" cy="589" r="61" stroke="#342f39" stroke-width="19"/>
    <circle cx="642" cy="589" r="47" stroke="#c58965" stroke-width="5"/>
    <circle cx="642" cy="589" r="11" fill="#e3af77" stroke="#59454a" stroke-width="5"/>
    <path d="M642 542v94m-47-47h94m-80-33 66 66m0-66-66 66"
          stroke="#ba957c" stroke-width="3"/>
  </g>

  <!-- Frame and engine -->
  <g fill="none" stroke="#4b3b40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M370 589 449 527 538 529 642 589M449 527l55 68 34-66M504 595H370"
          stroke-width="13"/>
    <path d="M590 492 642 589M605 489l50 100" stroke-width="10"/>
    <path d="M393 611h140" stroke="#c28a64" stroke-width="9"/>
  </g>
  <path d="M413 616h103q23 0 32-11l40-28" fill="none"
        stroke="#d4aa80" stroke-width="9" stroke-linecap="round"/>
  <path d="M446 544h72l29 28-30 31h-67l-26-25z"
        fill="#655057" stroke="#352f3a" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="488" cy="573" r="20" fill="#c99a79" stroke="#4a3a40" stroke-width="6"/>
  <circle cx="488" cy="573" r="8" fill="#ead0a3"/>
  <path d="M426 507q37-14 73 0l-9 18h-61q-12-1-13-9z"
        fill="#3e343b" stroke="#d19b72" stroke-width="4"/>

  <!-- Octopus body and head -->
  <path d="M439 467Q452 449 479 452Q515 454 526 486L514 529
           Q485 544 451 523Q437 503 439 467Z"
        fill="url(#octopus)" stroke="#7f3e48" stroke-width="5"/>
  <path d="M410 421Q399 389 420 364Q439 341 474 344Q512 343 529 373
           Q546 405 524 439Q506 463 480 469Q443 474 421 450Q414 440 410 421Z"
        fill="url(#octopus)" stroke="#813f48" stroke-width="5"/>
  <path d="M420 390Q438 355 475 355Q504 355 521 376"
        fill="none" stroke="#f4b18a" stroke-width="9" opacity=".58"
        stroke-linecap="round"/>

  <!-- Goggles, bright eyes, and a small smile -->
  <path d="M417 404Q467 383 523 403" fill="none"
        stroke="#6c4549" stroke-width="7"/>
  <circle cx="449" cy="413" r="19" fill="#e8b97e" stroke="#704b4d" stroke-width="5"/>
  <circle cx="492" cy="411" r="19" fill="#e8b97e" stroke="#704b4d" stroke-width="5"/>
  <circle cx="449" cy="416" r="12" fill="#fff0d2"/>
  <circle cx="492" cy="414" r="12" fill="#fff0d2"/>
  <circle cx="453" cy="418" r="6" fill="#443944"/>
  <circle cx="496" cy="416" r="6" fill="#443944"/>
  <circle cx="456" cy="414" r="2" fill="#fff"/>
  <circle cx="499" cy="412" r="2" fill="#fff"/>
  <path d="M462 441q15 13 30-2" fill="none" stroke="#7c4149"
        stroke-width="4" stroke-linecap="round"/>
  <circle cx="434" cy="439" r="7" fill="#f2aa87" opacity=".65"/>
  <circle cx="510" cy="437" r="7" fill="#f2aa87" opacity=".5"/>

  <!-- Scarf trailing in the cool dusk air -->
  <path d="M448 462q29 13 62-4l9 15q-36 21-70 5z"
        fill="#e4ab69" stroke="#9e654e" stroke-width="3"/>
  <path d="M499 472q-20 12-55 0-22-8-42-2l30 14q38 22 72 4z"
        fill="#d99758" stroke="#9e654e" stroke-width="3"/>

  <!-- Red fuel tank and handlebars -->
  <path d="M489 512q36-20 75-6l21 19q-32 27-80 21l-22-18z"
        fill="#963f3f" stroke="#4d353b" stroke-width="6"/>
  <path d="M503 518q29-12 55-5" fill="none" stroke="#df8265"
        stroke-width="6" stroke-linecap="round"/>
  <path d="M555 514l43-48h24" fill="none" stroke="#4d383e"
        stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M593 469h34" stroke="#d0a177" stroke-width="7"
        stroke-linecap="round"/>
  <circle cx="599" cy="485" r="18" fill="#f7c985"
          stroke="#6f4b4a" stroke-width="6"/>
  <circle cx="599" cy="485" r="29" fill="#ffd39a" opacity=".4"
          filter="url(#glow)"/>

  <!-- Four near tentacles: a wave, a grip, and two curled around the bike -->
  <g fill="none" stroke="url(#octopus)" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M451 483Q416 461 409 434T430 414" stroke-width="18"/>
    <path d="M472 493Q436 507 420 540T440 565Q457 567 461 549"
          stroke-width="19"/>
    <path d="M500 485Q536 488 566 477T611 466" stroke-width="19"/>
    <path d="M499 506Q535 514 554 540T551 569Q535 571 530 553"
          stroke-width="18"/>
  </g>
  <g fill="#f2bd93" stroke="#b5665b" stroke-width="2">
    <circle cx="420" cy="450" r="5"/><circle cx="427" cy="524" r="5"/>
    <circle cx="423" cy="543" r="5"/><circle cx="442" cy="562" r="4"/>
    <circle cx="536" cy="489" r="5"/><circle cx="558" cy="480" r="5"/>
    <circle cx="584" cy="471" r="4"/><circle cx="539" cy="528" r="5"/>
    <circle cx="551" cy="549" r="5"/>
  </g>

  <!-- Soft foreground leaves -->
  <g fill="#d48650">
    <path d="M267 669q23-18 39-1-12 19-39 1ZM747 664q-20-17-39-1 14 19 39 1Z"/>
    <path d="M147 683q16-10 29 2-15 13-29-2ZM876 681q-17-12-31 2 14 14 31-2Z"/>
  </g>
</svg>