    <radialGradient id="earth-ocean" cx="76%" cy="24%" r="86%">
      <stop offset="0" stop-color="#70b4dc"/>
      <stop offset=".4" stop-color="#347fae"/>
      <stop offset=".76" stop-color="#16456c"/>
      <stop offset="1" stop-color="#061421"/>
    </radialGradient>

    <clipPath id="earth-disc">
      <circle r="80"/>
    </clipPath>

    <path id="ground-edge"
          d="M0 601
             C88 597 153 586 229 590
