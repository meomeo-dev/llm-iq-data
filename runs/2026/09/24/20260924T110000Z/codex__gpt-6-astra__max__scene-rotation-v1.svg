             C510 578 580 578 662 584
             C740 590 805 583 883 582
             C973 575 1034 581 1107 586
             C1185 588 1222 579 1288 575
             C1402 568 1493 583 1600 573
             L1600 1000 H0Z"/>

    <clipPath id="ground-clip">
      <use href="#ground-edge"/>
    </clipPath>

