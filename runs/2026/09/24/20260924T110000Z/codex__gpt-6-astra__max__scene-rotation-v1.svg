<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="1000" viewBox="0 0 1600 1000"
     role="img" aria-labelledby="title description">
  <title id="title">An axolotl rides a tandem bicycle on the Moon</title>
  <desc id="description">
    Beneath an immense, empty black sky, a tiny silver-gray axolotl rides
    the front seat of a tandem bicycle across the lunar surface. The rear
    seat is empty. A blue Earth rises behind the distant ridge. Harsh
    sunlight illuminates the dust and casts long, pitch-black shadows.
  </desc>

