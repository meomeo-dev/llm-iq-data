<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"
     role="img" aria-labelledby="title description">
  <title id="title">An axolotl rides a tandem bicycle on the Moon</title>
  <desc id="description">
    A tiny gray axolotl pedals across a vast, sunlit lunar plain. Earth rises
    above the horizon in a black, empty sky, while long shadows cross the dust.
  </desc>

  <defs>
    <radialGradient id="earth" cx="28%" cy="23%" r="85%">
      <stop offset="0" stop-color="#c6e0ee"/>
      <stop offset=".38" stop-color="#79add0"/>
      <stop offset=".76" stop-color="#376c96"/>
      <stop offset="1" stop-color="#132b43"/>
    </radialGradient>
    <linearGradient id="moon" x2=".18" y2="1">
      <stop offset="0" stop-color="#b8bab7"/>
      <stop offset=".55" stop-color="#939795"/>
      <stop offset="1" stop-color="#6b7070"/>
    </linearGradient>
    <clipPath id="earth-disc">
      <circle cx="967" cy="534" r="62"/>
    </clipPath>
  </defs>

  <rect width="1200" height="800" fill="#020304"/>

  <!-- Earth is still partly below the lunar horizon. -->
  <circle cx="967" cy="534" r="62" fill="url(#earth)"
          stroke="#c7dce8" stroke-width="1.5"/>
  <g clip-path="url(#earth-disc)">
    <path d="M916 506 Q927 491 942 495 L950 502 947 511 957 516
             951 529 939 528 932 541 921 535 916 522Z"
          fill="#526f80"/>
    <path d="M970 478 Q987 479 999 489 L995 501 1005 510
             1000 523 987 520 979 507 968 502 963 490Z"
          fill="#567889"/>
    <path d="M971 529 Q986 524 998 536 L995 548 983 556
             975 550 965 551 962 539Z"
          fill="#476a7e"/>
    <g fill="none" stroke="#e5eff2" stroke-linecap="round"
       opacity=".82">
      <path d="M912 514 Q934 502 955 507 T1002 504" stroke-width="3"/>
      <path d="M925 526 Q948 519 965 526 T1016 522" stroke-width="2"/>
      <path d="M950 487 Q969 482 985 488" stroke-width="2"/>
      <path d="M981 539 Q1001 534 1023 540" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Broad, nearly empty lunar plain. -->
  <path d="M0 550 C192 539 284 536 410 543
           C554 550 675 550 794 546
           C946 541 1052 545 1200 537
           L1200 800 H0Z"
        fill="url(#moon)"/>
  <path d="M0 550 C192 539 284 536 410 543
           C554 550 675 550 794 546
           C946 541 1052 545 1200 537"
        fill="none" stroke="#d8dad6" stroke-width="2"/>

  <path d="M0 570 L134 555 313 562 447 550 549 557
           332 583 119 581 0 594Z"
        fill="#c7c9c5" opacity=".42"/>
  <path d="M801 570 L925 550 1040 558 1200 544
           1200 584 1019 578 910 586Z"
        fill="#676c6c" opacity=".28"/>
  <path d="M0 681 L91 662 219 670 352 658 449 676
           254 709 0 710Z"
        fill="#c1c3bf" opacity=".24"/>

  <path d="M113 618 C143 606 189 607 221 620"
        fill="none" stroke="#d6d8d3" stroke-width="2"/>
  <path d="M115 620 C151 634 190 634 221 620
           C185 625 148 626 115 620Z"
        fill="#464b4b" opacity=".75"/>
  <path d="M870 636 C914 621 976 624 1017 638"
        fill="none" stroke="#c9cbc7" stroke-width="2"/>
  <path d="M871 638 C913 655 978 653 1018 638
           C976 644 915 645 871 638Z"
        fill="#3c4142" opacity=".7"/>
  <path d="M259 741 C304 727 376 727 423 742"
        fill="none" stroke="#bfc2bf" stroke-width="2"/>
  <path d="M261 743 C309 760 377 758 424 742
           C370 749 310 750 261 743Z"
        fill="#424747" opacity=".54"/>

  <!-- The low sun casts hard, pitch-black shadows. -->
  <path d="M463 697 L484 696 847 800 782 800Z" fill="#000"/>
  <path d="M612 698 L635 697 1016 800 947 800Z" fill="#000"/>
  <path d="M556 680 L582 679 938 789 889 789Z" fill="#000"/>

  <!-- A small tandem bicycle, with its rear seat empty. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#171a1b" stroke-width="2.4">
      <circle cx="471" cy="675" r="25"/>
      <circle cx="621" cy="675" r="25"/>
    </g>
    <g stroke="#525758" stroke-width=".8">
      <path d="M471 650 V700 M446 675 H496
               M453 657 L489 693 M453 693 L489 657"/>
      <path d="M621 650 V700 M596 675 H646
               M603 657 L639 693 M603 693 L639 657"/>
    </g>
    <g stroke="#151819" stroke-width="3">
      <path d="M471 675 520 629 531 667 471 675
               M520 629 573 629 579 667 531 667
               M573 629 609 628 579 667
               M609 628 621 675"/>
      <path d="M516 629 514 618 M571 629 570 618"/>
      <path d="M545 629 546 609 553 606
               M609 628 607 609 616 606 620 609"/>
      <path d="M531 667 525 677 M579 667 586 677"/>
    </g>
    <g stroke="#111415" stroke-width="4">
      <path d="M504 619 H525 M560 619 H581
               M539 608 H554 M612 607 H622"/>
    </g>
    <g stroke="#3e4343" stroke-width="1.6">
      <circle cx="471" cy="675" r="3"/>
      <circle cx="621" cy="675" r="3"/>
      <circle cx="531" cy="667" r="4"/>
      <circle cx="579" cy="667" r="4"/>
    </g>
  </g>

  <!-- Pale axolotl on the front saddle. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M560 606 C550 599 540 600 533 607
             C543 609 547 616 541 624
             C553 623 561 618 565 611Z"
          fill="#bfc2c0" stroke="#555b5c" stroke-width="1.4"/>
    <path d="M568 598 C559 601 556 615 563 628
             Q571 634 578 627 C585 618 584 604 578 596Z"
          fill="#c8cac8" stroke="#555b5c" stroke-width="1.5"/>
    <g fill="none" stroke="#555b5c" stroke-width="3">
      <path d="M574 578 Q563 566 553 560"/>
      <path d="M571 583 Q559 578 548 574"/>
      <path d="M573 589 Q560 596 554 602"/>
    </g>
    <g fill="none" stroke="#d9dcda" stroke-width="2">
      <path d="M558 565 557 558 M562 568 565 561
               M553 575 550 568 M558 578 559 570
               M559 597 555 594 M562 595 563 602"/>
    </g>
    <path d="M568 574 C575 566 592 566 602 573
             C610 579 610 589 601 595
             C592 600 576 596 570 589
             C566 584 566 578 568 574Z"
          fill="#d7d9d7" stroke="#555b5c" stroke-width="1.5"/>
    <path d="M577 607 Q591 601 607 609"
          fill="none" stroke="#d3d5d3" stroke-width="5"/>
    <path d="M568 626 Q576 639 578 651 L581 666
             M574 629 Q564 643 557 656"
          fill="none" stroke="#cdd0cd" stroke-width="5"/>
    <circle cx="597" cy="581" r="2" fill="#242929"/>
    <path d="M599 589 Q603 592 606 589"
          fill="none" stroke="#555b5c" stroke-width="1.3"/>
  </g>
</svg>