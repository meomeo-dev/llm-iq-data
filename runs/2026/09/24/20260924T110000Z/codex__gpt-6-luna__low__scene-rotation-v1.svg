<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Axolotl riding a tandem bicycle on the Moon</title>
  <desc id="desc">A tiny two-seat bicycle carrying an axolotl crosses a vast gray lunar plain. Blue Earth rises over the horizon in a black sky, under stark sunlight and long, pitch-black shadows.</desc>

  <defs>
    <radialGradient id="earth" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#a5d8ed"/>
      <stop offset=".56" stop-color="#4387a8"/>
      <stop offset="1" stop-color="#16435f"/>
    </radialGradient>
    <clipPath id="earthClip">
      <circle cx="946" cy="263" r="100"/>
    </clipPath>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#858585"/>
      <stop offset=".42" stop-color="#666"/>
      <stop offset="1" stop-color="#343434"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4e4e4"/>
      <stop offset=".55" stop-color="#a3a3a3"/>
      <stop offset="1" stop-color="#555"/>
    </linearGradient>
    <g id="wheel">
      <circle r="38" fill="#171717" stroke="#d4d4d4" stroke-width="2"/>
      <circle r="33" fill="none" stroke="#707070" stroke-width="1"/>
      <circle r="3" fill="#e3e3e3"/>
      <g stroke="#969696" stroke-width=".8">
        <path d="M0 0V-33M0 0V33M0 0H-33M0 0H33"/>
        <path d="m0 0 23-23M0 0l-23 23M0 0l23 23M0 0l-23-23"/>
        <path d="m0 0 13-30M0 0l-13 30M0 0l30 13M0 0l-30-13"/>
        <path d="m0 0-13-30M0 0l13 30M0 0l30-13M0 0l-30 13"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="800" fill="#020304"/>

  <!-- Distant lunar ridges -->
  <path d="M0 523 70 508 128 514 191 489 259 502 321 477 391 492 456 466
           529 486 596 462 650 477 715 449 773 469 833 441 893 459 958 431
           1020 453 1080 429 1140 450 1200 432V612H0Z"
        fill="#292929"/>
  <path d="M0 556 78 539 150 548 222 521 300 537 375 509 446 529 520 500
           590 517 664 488 738 510 807 478 881 501 947 474 1017 493 1092 469
           1162 490 1200 478V640H0Z"
        fill="#414141"/>

  <!-- Blue Earth -->
  <circle cx="946" cy="263" r="103" fill="#0a1822" opacity=".7"/>
  <circle cx="946" cy="263" r="96" fill="url(#earth)"/>
  <g clip-path="url(#earthClip)" opacity=".77">
    <path d="M872 207 887 194 903 197 911 209 928 213 932 227 922 236
             927 247 916 254 904 246 893 252 884 243 873 245 867 231 876 220Z"
          fill="#b8c4c5"/>
    <path d="m958 181 18 6 8 13 15 4 3 12 15 8 2 12-14 6-5 16-13 1
             -7 14-14-4-5-17-14-6 2-15-8-11 8-14-4-12Z" fill="#d0d2ce"/>
    <path d="m983 270 17-6 12 8-2 12 12 7-6 14-15 5-7 14-15-5-4-14-12-4
             7-13-7-9Z" fill="#c7cfcd"/>
    <path d="M860 278q38 16 74 9t73 1M879 302q31 11 53 7"
          fill="none" stroke="#b5d8e8" stroke-width="3" opacity=".7"/>
  </g>
  <path d="M878 329a96 96 0 0 0 137 0" fill="none" stroke="#8fcbe4" stroke-width="2" opacity=".48"/>

  <!-- Foreground lunar plain -->
  <path d="M0 610 92 591 186 600 270 579 363 594 447 573 532 587 612 569
           702 585 787 566 881 581 965 558 1057 574 1131 555 1200 568V800H0Z"
        fill="url(#ground)"/>
  <path d="M0 671q165-41 315-24t299-17q177-25 331 3t255-12v179H0Z"
        fill="#555"/>
  <path d="M38 715q176-37 338-11t314-13q187-30 364-3t146-3"
        fill="none" stroke="#9a9a9a" stroke-width="2" opacity=".35"/>
  <path d="M115 627q39-15 76-5m183 31q31-13 66-4m468 10q40-17 86-8"
        fill="none" stroke="#b0b0b0" stroke-width="2" opacity=".35"/>

  <!-- Small distant craters -->
  <g fill="none" stroke="#b4b4b4" opacity=".36">
    <ellipse cx="251" cy="633" rx="24" ry="6"/>
    <ellipse cx="766" cy="618" rx="16" ry="4"/>
    <ellipse cx="1061" cy="643" rx="31" ry="7"/>
  </g>
  <g fill="#252525" opacity=".6">
    <ellipse cx="251" cy="635" rx="17" ry="3"/>
    <ellipse cx="766" cy="619" rx="11" ry="2"/>
    <ellipse cx="1061" cy="645" rx="23" ry="3"/>
  </g>

  <!-- Long hard-edged shadow cast across the plain -->
  <path d="M460 627 740 700 1044 719 1056 727 730 715 448 640Z" fill="#050505"/>
  <path d="M509 625 671 621 826 636 977 641 1014 652 818 646 663 632 516 637Z"
        fill="#080808"/>

  <!-- Tandem bicycle: two wheels, shared frame, two seats -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(444 611)"><use href="#wheel"/></g>
    <g transform="translate(650 611)"><use href="#wheel"/></g>

    <g fill="none" stroke="#d3d3d3" stroke-width="5">
      <path d="M444 611 497 554 548 611 444 611"/>
      <path d="M548 611 592 554 650 611 548 611"/>
      <path d="M497 554 592 554"/>
      <path d="m548 611 22-47 22-10"/>
      <path d="M444 611 435 582"/>
      <path d="M435 582 418 578M435 582l9-14"/>
      <path d="m592 554 4-23"/>
      <path d="M580 530h29"/>
      <path d="m497 554-3-23"/>
      <path d="M483 529h27"/>
    </g>
    <g fill="#101010" stroke="#e0e0e0" stroke-width="2">
      <circle cx="444" cy="611" r="6"/>
      <circle cx="548" cy="611" r="6"/>
      <circle cx="650" cy="611" r="6"/>
      <path d="M484 524h29l-3 7h-27z"/>
      <path d="M580 525h29l-3 7h-27z"/>
    </g>
    <g stroke="#ededed" stroke-width="3">
      <path d="m535 598 13 13 13-13m-17 13-5 12m13-12 7 12"/>
      <path d="m637 598 13 13 13-13m-17 13-5 12m13-12 7 12"/>
    </g>
  </g>

  <!-- Axolotl astronaut in the front seat -->
  <g stroke="#eeeeee" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs and boots -->
    <path d="m495 523-6 26 16 7 14-18" fill="none" stroke="#bdbdbd" stroke-width="10"/>
    <path d="m519 538 18 17-7 9-22-11" fill="#dedede" stroke-width="2"/>
    <path d="m518 535 18 17" fill="none" stroke="#fafafa" stroke-width="3"/>
    <!-- suit torso -->
    <path d="M469 481q12-12 27-8 17 4 20 22l-4 25q-14 12-35 6l-12-16Z"
          fill="url(#suit)" stroke-width="2"/>
    <path d="m475 489 30 4m-33 6 31 4" fill="none" stroke="#777" stroke-width="2"/>
    <circle cx="490" cy="500" r="4" fill="#1d1d1d" stroke="none"/>
    <!-- backpack -->
    <path d="M462 485q-9 1-11 11l4 18q8 4 14-3l-2-23Z"
          fill="#777" stroke-width="2"/>
    <path d="m454 493 11 1m-9 10 12-1" fill="none" stroke="#ccc" stroke-width="1.5"/>
    <!-- helmet dome -->
    <path d="M467 475q-2-25 19-34 23-10 38 9 7 9 4 23l-11 12-39-1Z"
          fill="#d1d1d1" stroke-width="3"/>
    <path d="M472 469q14-16 34-13 11 2 18 9l-7 11-37 1Z"
          fill="#171b1d" stroke="#f1f1f1" stroke-width="2"/>
    <path d="M478 469q14-13 34-9" fill="none" stroke="#a6d6eb" stroke-width="3" opacity=".9"/>
    <!-- axolotl face -->
    <ellipse cx="495" cy="471" rx="13" ry="10" fill="#8e8e8e" stroke="none"/>
    <circle cx="491" cy="469" r="1.4" fill="#050505" stroke="none"/>
    <circle cx="501" cy="469" r="1.4" fill="#050505" stroke="none"/>
    <path d="M493 475q3 3 6 0" fill="none" stroke="#202020" stroke-width="1.3"/>
    <!-- feathery external gills -->
    <g fill="none" stroke="#ececec" stroke-width="2">
      <path d="M483 474 470 467m13 5-14-2m14-1-10-10m10 12-16 3"/>
      <path d="M507 473 520 466m-13 5 15-2m-14-2 10-10m-10 13 16 2"/>
    </g>
    <g fill="#bcbcbc" stroke="none">
      <circle cx="470" cy="467" r="2"/><circle cx="469" cy="472" r="2"/>
      <circle cx="473" cy="460" r="2"/><circle cx="467" cy="477" r="2"/>
      <circle cx="520" cy="466" r="2"/><circle cx="522" cy="471" r="2"/>
      <circle cx="517" cy="459" r="2"/><circle cx="524" cy="476" r="2"/>
    </g>
    <!-- arms reaching to handlebars -->
    <path d="m480 493-25 27-34 58" fill="none" stroke="#c9c9c9" stroke-width="8"/>
    <path d="m500 496 28 21 24 37" fill="none" stroke="#c9c9c9" stroke-width="8"/>
    <circle cx="419" cy="578" r="4" fill="#ededed" stroke="none"/>
    <circle cx="552" cy="554" r="4" fill="#ededed" stroke="none"/>
  </g>

  <!-- Rear rider: a compact suited passenger, making the tandem unmistakable -->
  <g stroke="#e5e5e5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m592 523-2 23 15 6 9-19" fill="none" stroke="#bdbdbd" stroke-width="9"/>
    <path d="m612 539 16 15-6 8-19-11" fill="#dedede" stroke-width="2"/>
    <path d="M575 484q12-10 25-5 13 5 14 20l-2 19q-14 10-31 4l-11-17Z"
          fill="url(#suit)" stroke-width="2"/>
    <path d="M573 479q0-20 18-29 19-8 30 10 5 9 2 20l-9 9-34-2Z"
          fill="#c8c8c8" stroke-width="3"/>
    <path d="M579 472q13-13 31-9l9 7-6 10-31 1Z"
          fill="#171b1d" stroke-width="2"/>
    <path d="M585 472q12-11 27-8" fill="none" stroke="#a6d6eb" stroke-width="2.5"/>
    <path d="m584 496-6 26m20-25 14 23" fill="none" stroke="#c9c9c9" stroke-width="7"/>
  </g>

  <!-- A few sharp sunlit stones -->
  <g fill="#d5d5d5">
    <path d="m306 653 8-13 7 14 13 4-22 3Z"/>
    <path d="m879 675 6-9 9 12 11 2-18 3Z"/>
    <path d="m188 699 5-8 7 11 8 2-14 2Z"/>
  </g>
  <g fill="#151515">
    <path d="m314 657 22 1 12 5-26-2Z"/>
    <path d="m889 679 18 3 9 5-23-3Z"/>
    <path d="m195 702 17 2 9 4-19-2Z"/>
  </g>
</svg>