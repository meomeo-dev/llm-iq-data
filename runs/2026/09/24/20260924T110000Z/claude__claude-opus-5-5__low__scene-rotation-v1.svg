<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="earth" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#8fc3ff"/>
      <stop offset="0.5" stop-color="#2f6fd0"/>
      <stop offset="1" stop-color="#0b2350"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="0.4" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#c8c8c8"/>
    </linearGradient>
    <clipPath id="earthClip"><circle cx="880" cy="230" r="90"/></clipPath>
  </defs>

  <!-- black sky -->
  <rect width="1200" height="800" fill="#000"/>
  <g fill="#fff" opacity="0.7">
    <circle cx="80" cy="60" r="1"/><circle cx="210" cy="140" r="0.8"/>
    <circle cx="340" cy="50" r="1.2"/><circle cx="470" cy="190" r="0.7"/>
    <circle cx="600" cy="90" r="1"/><circle cx="1100" cy="70" r="1"/>
    <circle cx="1040" cy="330" r="0.8"/><circle cx="150" cy="300" r="0.7"/>
    <circle cx="700" cy="260" r="0.9"/><circle cx="1150" cy="200" r="0.8"/>
  </g>

  <!-- Earth rising, half lit -->
  <circle cx="880" cy="230" r="90" fill="url(#earth)"/>
  <g clip-path="url(#earthClip)">
    <path d="M830 170 q30 -20 55 5 q10 30 -20 40 q-25 5 -35 -45z" fill="#5a8f5a" opacity="0.7"/>
    <path d="M900 250 q30 -10 40 20 q-10 30 -40 20z" fill="#6a9a60" opacity="0.6"/>
    <ellipse cx="870" cy="200" rx="60" ry="8" fill="#fff" opacity="0.35"/>
    <ellipse cx="900" cy="280" rx="50" ry="6" fill="#fff" opacity="0.3"/>
    <!-- night side -->
    <circle cx="930" cy="250" r="100" fill="#000" opacity="0.8"/>
  </g>

  <!-- distant horizon ridges -->
  <path d="M0 470 L120 455 L260 462 L380 440 L520 458 L700 450 L860 435 L1000 455 L1200 445 L1200 800 L0 800Z" fill="#6e6e6e"/>
  <path d="M380 440 L420 452 L520 458 L380 458Z" fill="#050505"/>
  <path d="M860 435 L900 448 L1000 455 L860 455Z" fill="#050505"/>

  <!-- main plain -->
  <path d="M0 490 Q600 470 1200 485 L1200 800 L0 800Z" fill="url(#ground)"/>

  <!-- craters with pitch-black shadows (sun from left) -->
  <g>
    <ellipse cx="220" cy="620" rx="120" ry="28" fill="#aaa"/>
    <path d="M100 620 a120 28 0 0 1 240 0 a110 20 0 0 0 -240 0z" fill="#000"/>
    <ellipse cx="900" cy="700" rx="180" ry="40" fill="#b5b5b5"/>
    <path d="M720 700 a180 40 0 0 1 360 0 a165 30 0 0 0 -360 0z" fill="#000"/>
    <ellipse cx="1050" cy="540" rx="50" ry="10" fill="#999"/>
    <path d="M1000 540 a50 10 0 0 1 100 0 a45 7 0 0 0 -100 0z" fill="#000"/>
    <ellipse cx="480" cy="720" rx="40" ry="9" fill="#bbb"/>
    <path d="M440 720 a40 9 0 0 1 80 0 a36 6 0 0 0 -80 0z" fill="#000"/>
    <!-- boulders with shadows -->
    <ellipse cx="365" cy="560" rx="14" ry="7" fill="#ddd"/>
    <path d="M375 562 L440 566 L372 568Z" fill="#000"/>
    <ellipse cx="760" cy="600" rx="10" ry="5" fill="#ddd"/>
    <path d="M768 602 L820 605 L766 606Z" fill="#000"/>
  </g>

  <!-- long bicycle tracks -->
  <path d="M0 540 Q300 530 588 527" stroke="#6a6a6a" stroke-width="1" fill="none" stroke-dasharray="2 3"/>

  <!-- tiny subject: axolotl on tandem bike -->
  <g transform="translate(590 500) scale(0.9)">
    <!-- long black shadow to the right -->
    <path d="M-4 30 L120 33 L140 31 L120 29 L30 28Z" fill="#000"/>
    <!-- wheels -->
    <circle cx="0" cy="22" r="8" fill="none" stroke="#eee" stroke-width="1.3"/>
    <circle cx="44" cy="22" r="8" fill="none" stroke="#eee" stroke-width="1.3"/>
    <!-- frame -->
    <path d="M0 22 L12 12 L22 22 L32 12 L44 22 M12 12 L32 12 M12 12 L11 7 M32 12 L31 7 M42 8 L44 22 M22 22 L12 12"
          stroke="#ddd" stroke-width="1.1" fill="none"/>
    <path d="M9 7 h5 M29 7 h5" stroke="#ddd" stroke-width="1.3"/>
    <path d="M40 8 h4" stroke="#ddd" stroke-width="1.2"/>
    <!-- axolotl: body from front seat, tail over rear seat -->
    <path d="M10 5 Q20 -2 32 3 Q40 0 42 5 Q38 9 32 8 Q22 9 10 8 Q4 8 2 5 Q6 4 10 5Z" fill="#e6e6e6"/>
    <path d="M10 8 Q22 9 32 8 Q38 9 42 5" stroke="#555" stroke-width="0.5" fill="none"/>
    <!-- head and gills -->
    <circle cx="41" cy="3" r="4" fill="#f0f0f0"/>
    <path d="M38 0 l-3 -4 M39 -1 l-1 -5 M40 -1 l1 -5" stroke="#bbb" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="43" cy="2" r="0.7" fill="#000"/>
    <!-- arms to handlebar -->
    <path d="M36 7 L41 8" stroke="#e6e6e6" stroke-width="1.2"/>
    <!-- legs to pedals -->
    <path d="M30 8 L32 14 M14 7 L12 14" stroke="#e6e6e6" stroke-width="1"/>
    <!-- helmet visor glint -->
    <circle cx="41" cy="3" r="5.2" fill="none" stroke="#fff" stroke-width="0.4" opacity="0.8"/>
    <!-- shadow side of body -->
    <path d="M12 8 Q22 9 32 8 L32 6 Q22 7 12 6Z" fill="#555" opacity="0.6"/>
  </g>

  <!-- foreground ridge in shadow -->
  <path d="M0 800 L0 760 Q150 740 300 770 Q350 785 420 800Z" fill="#000"/>
</svg>