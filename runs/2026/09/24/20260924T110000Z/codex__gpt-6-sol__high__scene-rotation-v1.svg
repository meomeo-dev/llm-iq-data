<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"
     role="img" aria-labelledby="title description">
  <title id="title">An axolotl rides a tandem bicycle on the Moon</title>
  <desc id="description">
    A tiny axolotl crosses a vast gray lunar plain beneath a black sky.
    Blue Earth rises beyond the horizon, while hard sunlight casts long,
    pitch-black shadows.
  </desc>

  <defs>
    <clipPath id="earth">
      <circle cx="850" cy="460" r="59"/>
    </clipPath>
  </defs>

  <rect width="1200" height="800" fill="#030405"/>

  <!-- Earth, partly hidden by the lunar horizon -->
  <g clip-path="url(#earth)">
    <circle cx="850" cy="460" r="59" fill="#183e68"/>
    <path d="M807 418c18-14 35-9 39 2l-8 9 8 8-11 9-13-5-12 10-20-5z
             M869 412l18 6 5 14-12 9 5 12-13 13-15-4-8-14 11-10-4-12z
             M822 470l17-7 16 9 3 16-13 11-5 22-20-5-9-17 8-14z"
          fill="#7197b2"/>
    <path d="M799 437c19-8 32-6 46 3m15-22c15-3 31 3 45 13
             M808 466c16-8 33-8 48 0m12 18c11-7 27-5 39 1"
          fill="none" stroke="#d3dce0" stroke-width="5"
          stroke-linecap="round" opacity=".88"/>
    <path d="M792 475c12 9 24 10 35 8m38-34c16 6 29 6 43 0"
          fill="none" stroke="#ecf0ee" stroke-width="3" opacity=".75"/>
    <path d="M866 401c32 8 51 36 43 69-5 21-17 38-38 47
             34-17 49-61 28-94-8-12-19-19-33-22z"
          fill="#06172d" opacity=".7"/>
  </g>
  <circle cx="850" cy="460" r="59" fill="none"
          stroke="#b6cbd5" stroke-width="1.5"/>

  <!-- A broad, sunlit lunar plain -->
  <path d="M0 469 80 466 164 476 265 468 354 485 447 481
           544 493 650 486 733 499 815 491 902 507 1002 502
           1100 519 1200 513V800H0Z" fill="#999b99"/>
  <path d="M0 469 80 466 164 476 265 468 354 485 447 481
           544 493 650 486 733 499 815 491 902 507 1002 502
           1100 519 1200 513"
        fill="none" stroke="#d5d5d1" stroke-width="2"/>

  <path d="M0 517 165 502 263 522 366 505 492 527 617 509
           768 536 925 524 1063 548 1200 532v42l-154-13-132 9
           -147-8-150 17-126-16-141 15-166-17L0 565Z"
        fill="#b9bab6"/>
  <path d="M0 576 133 559 242 582 344 565 478 588 597 570
           738 591 893 574 1040 600 1200 578v222H0Z"
        fill="#aaa9a4"/>
  <path d="M0 679 158 645 303 668 414 648 560 673 709 646
           835 688 1008 657 1200 690v110H0Z"
        fill="#c3c2bc"/>

  <!-- Craters and hard-edged rock shadows -->
  <g fill="#292a2a">
    <path d="m77 544 25-4 49 9-26 5z"/>
    <path d="m685 561 55-9 100 12-38 9z"/>
    <path d="m982 586 42-9 92 18-54 9z"/>
    <path d="m165 713 84-15 205 31-107 16z"/>
    <path d="m784 728 75-17 196 38-98 18z"/>
  </g>
  <g fill="none" stroke="#e5e3dc" stroke-width="3">
    <path d="M71 541q31-13 79 3"/>
    <path d="M678 557q70-19 159 4"/>
    <path d="M974 583q57-15 140 10"/>
    <path d="M148 707q87-27 219 11"/>
    <path d="M779 722q87-29 218 17"/>
  </g>
  <g fill="#656663">
    <ellipse cx="297" cy="551" rx="9" ry="3"/>
    <ellipse cx="633" cy="612" rx="14" ry="4"/>
    <ellipse cx="1080" cy="658" rx="21" ry="5"/>
    <ellipse cx="91" cy="622" rx="16" ry="4"/>
  </g>

  <!-- Long shadows from the bicycle and its rider -->
  <path d="M415 647 453 641 1015 790 914 800 433 662Z"
        fill="#060707"/>
  <path d="M537 648 563 641 1200 744v33L550 662Z"
        fill="#060707"/>
  <path d="m493 583 20-34 305 251h-64z" fill="#060707"/>

  <!-- Tandem bicycle -->
  <g stroke="#202222" stroke-linecap="round" stroke-linejoin="round"
     fill="none">
    <circle cx="423" cy="635" r="28" stroke-width="4"/>
    <circle cx="557" cy="635" r="28" stroke-width="4"/>
    <circle cx="423" cy="635" r="3" fill="#202222"/>
    <circle cx="557" cy="635" r="3" fill="#202222"/>

    <g stroke-width="3.2">
      <path d="M423 635 461 591 464 620 423 635
               M461 591 506 591 510 620 464 620 461 591
               M506 591 537 588 557 635 510 620 506 591
               M464 620 510 620"/>
      <path d="M461 591 457 580m49 11-2-11"/>
      <path d="M537 588 535 578 545 575"/>
    </g>

    <path d="M445 580h25m26 0h27" stroke-width="5"/>
    <path d="M538 579h19m-136 56 15-10" stroke-width="3"/>
    <circle cx="464" cy="620" r="5" stroke-width="2"/>
    <circle cx="510" cy="620" r="5" stroke-width="2"/>
    <path d="m464 620-8 13m8-13 9-12m37 12-9 12m9-12 10-12"
          stroke-width="2.5"/>
    <path d="M451 634h10m56-27h10" stroke-width="4"/>
    <path d="M463 627h47" stroke-width="1.6"/>
  </g>

  <!-- One small axolotl in the front saddle -->
  <g stroke="#353636" stroke-linecap="round" stroke-linejoin="round">
    <path d="M499 561q-12 8-8 20l-17 9 22-2 17-11 8 8 5-8-13-18z"
          fill="#d5d4ce" stroke-width="2"/>
    <path d="M511 575q8 8 19 9l10-5" fill="none" stroke-width="5"/>
    <path d="M503 578q-7 15 2 25l-5 17m12-39 8 17-8 20"
          fill="none" stroke-width="5"/>
    <path d="M495 620h10m4-2h10" fill="none" stroke-width="4"/>

    <!-- Feathery external gills -->
    <g fill="none" stroke="#c7c5bd" stroke-width="3">
      <path d="m492 536-12-15m13 21-17-7m18 13-17 4
               m29-17 9-17m-7 23 17-9m-16 17 18 2"/>
      <path d="m482 525-4-8m3 19-8-5m7 20-8 4
               m33-29 3-9m8 19 8-5m-7 18 9 4"/>
    </g>
    <ellipse cx="502" cy="542" rx="21" ry="16"
             fill="#deddd6" stroke-width="2"/>
    <circle cx="496" cy="540" r="1.7" fill="#202222" stroke="none"/>
    <circle cx="510" cy="540" r="1.7" fill="#202222" stroke="none"/>
    <path d="M499 549q5 4 10 0" fill="none" stroke-width="1.5"/>
  </g>

  <path d="M378 670h45m184-36h27m300 48h63"
        stroke="#eeeae1" stroke-width="2" opacity=".75"/>
</svg>