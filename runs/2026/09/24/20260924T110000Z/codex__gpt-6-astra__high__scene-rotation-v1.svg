<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960"
     viewBox="0 0 1440 960" role="img"
     aria-labelledby="title description">
  <title id="title">A Small Ride on the Moon</title>
  <desc id="description">
    A tiny gray axolotl rides the rear seat of a tandem bicycle across an
    immense lunar plain. The front seat is empty. A blue Earth rises above
    the distant horizon in a black sky. Hard sunlight illuminates the rider,
    bicycle, and crater rims, casting long, pitch-black shadows.
  </desc>

  <defs>
    <radialGradient id="earthOcean" cx="32%" cy="27%" r="78%">
      <stop offset="0" stop-color="#91c9ed"/>
      <stop offset=".47" stop-color="#458cc0"/>
      <stop offset=".82" stop-color="#21537e"/>
      <stop offset="1" stop-color="#102a43"/>
    </radialGradient>

    <clipPath id="earthClip">
      <circle cx="397" cy="471" r="49"/>
    </clipPath>

    <g id="wheel">
      <circle r="25" fill="#aaa" stroke="#090909" stroke-width="4"/>
      <circle r="21" fill="none" stroke="#eee" stroke-width="1"/>
      <g stroke="#434343" stroke-width=".75">
        <path d="M-21 0H21M0-21V21M-15-15L15 15M-15 15L15-15"/>
        <path d="M-8-19L8 19M-19-8L19 8M-19 8L19-8M-8 19L8-19"/>
      </g>
      <circle r="3" fill="#111"/>
    </g>
  </defs>

  <!-- The airless sky has no haze. -->
  <path fill="#000" d="M0 0H1440V960H0z"/>

  <!-- Earth is the only color in the scene. -->
  <circle cx="397" cy="471" r="50" fill="#7daacc"/>
  <circle cx="397" cy="471" r="49" fill="url(#earthOcean)"/>
  <g clip-path="url(#earthClip)">
    <g fill="#8db2c7">
      <path d="M365 435l13-7 16 4 5 9-7 6-1 10-12 4-4 12-9-2
               -3-11-10-7 4-11z"/>
      <path d="M385 472l12 4 8 12-3 12-7 7-2 15-7-7-2-14-6-11z"/>
      <path d="M414 433l16 7 9 12-8 6-10-4-7 8-9-5 4-10-7-7z"/>
    </g>
    <g fill="none" stroke="#e2edf2" stroke-linecap="round">
      <path d="M354 453q19-18 40-9t43 2" stroke-width="4"/>
      <path d="M360 458q14-7 24-5" stroke-width="2"/>
      <path d="M375 428q19-4 35 4" stroke-width="3"/>
      <path d="M364 487q15-9 28-3t28-2" stroke-width="4"/>
      <path d="M400 468q18-6 35 3" stroke-width="2"/>
      <path d="M395 508q17 0 28-9" stroke-width="3"/>
    </g>
    <path d="M415 420C443 446 436 489 405 519
             C465 517 471 440 415 420Z" fill="#000" opacity=".68"/>
  </g>

  <!-- A low, distant ridge interrupts the rising planet. -->
  <path d="M0 535L67 530 125 532 186 520 241 524 302 517
           351 519 395 511 432 516 476 508 519 514 588 509
           659 515 728 511 798 518 875 513 953 521 1030 515
           1104 524 1180 519 1253 529 1336 525 1440 536
           V960H0Z" fill="#aaa"/>

  <path d="M0 535L67 530 125 532 186 520 241 524 302 517
           351 519 395 511 432 516 476 508 519 514 588 509
           659 515 728 511 798 518 875 513 953 521 1030 515
           1104 524 1180 519 1253 529 1336 525 1440 536"
        fill="none" stroke="#d4d4d4" stroke-width="1.5"/>

  <path d="M0 628Q310 572 605 606T1111 606Q1303 600 1440 626
           V960H0Z" fill="#b5b5b5"/>

  <!-- Sparse relief preserves the scale and silence of the plain. -->
  <path d="M71 572Q120 562 165 575Q128 569 91 577Z" fill="#000"/>
  <path d="M74 571Q117 558 166 572" fill="none"
        stroke="#dedede" stroke-width="2"/>
  <path d="M1034 559Q1090 553 1129 565L1100 568
           Q1071 558 1034 559Z" fill="#000"/>
  <path d="M570 550l24-2 17 3-23 1Z" fill="#777"/>
  <path d="M1275 593l21-3 19 5-19 2Z" fill="#000"/>

  <path d="M161 711Q222 679 314 698Q333 703 348 715
           Q274 694 205 720Z" fill="#000"/>
  <path d="M157 710Q234 672 317 695L336 705
           Q238 680 174 717Z" fill="#dedede"/>
  <path d="M206 720Q280 704 348 715Q290 737 206 720Z" fill="#969696"/>

  <path d="M1174 728Q1223 710 1275 725L1291 733
           Q1227 718 1186 736Z" fill="#000"/>
  <path d="M1170 727Q1224 705 1279 723" fill="none"
        stroke="#e2e2e2" stroke-width="3"/>

  <!-- Long, uncompromising shadows extend away from the upper-left sun. -->
  <g fill="#000">
    <path d="M827 678L1057 739 1088 741 850 677Z"/>
    <path d="M916 678L1144 739 1165 740 936 677Z"/>
    <path d="M843 660L1003 700 1076 724 1067 729
             987 710 842 669Z"/>
    <path d="M849 652L991 687 1020 700 1006 705 977 697
             838 658Z"/>
    <path d="M1000 692l20-3 18 7-7 3 25 8-11 2-26-8-13 1Z"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="2">
    <ellipse cx="948" cy="709" rx="117" ry="4"
             transform="rotate(15 948 709)"/>
    <ellipse cx="1041" cy="710" rx="119" ry="4"
             transform="rotate(15 1041 710)"/>
  </g>

  <!-- One small rider; two seats. -->
  <g transform="translate(840 627) scale(.68)">
    <use href="#wheel" transform="translate(0 50)"/>
    <use href="#wheel" transform="translate(139 50)"/>

    <!-- Tandem frame, with two cranksets and an empty forward saddle. -->
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 50L27 3 48 50H0
               M27 3H96L48 50
               M48 50H106L96 3
               M96 3L139 50
               M106 50L124 1"
            stroke="#111" stroke-width="5"/>
      <path d="M0 49L27 2 48 49
               M28 2H96L49 49H106L96 3
               M97 3L139 49"
            stroke="#e9e9e9" stroke-width="2"/>
      <path d="M123-8L139 50" stroke="#171717" stroke-width="4"/>
      <path d="M124-8L135-10Q145-9 143-2L138 2"
            stroke="#e5e5e5" stroke-width="3"/>
      <path d="M96 3V-7M27 3V-6" stroke="#ddd" stroke-width="3"/>
      <path d="M86-9H104M16-8H34" stroke="#080808" stroke-width="5"/>
      <path d="M96-7L91-22 82-23" stroke="#1a1a1a" stroke-width="3"/>
      <path d="M83-23H74" stroke="#ededed" stroke-width="3"/>
      <path d="M47 44H106Q113 50 106 56H47Q39 50 47 44Z"
            stroke="#353535" stroke-width="1.4"/>
      <circle cx="48" cy="50" r="7" stroke="#eee" stroke-width="1.5"/>
      <circle cx="106" cy="50" r="6" stroke="#ddd" stroke-width="1.5"/>
      <path d="M48 50L57 57M106 50L99 58" stroke="#161616" stroke-width="2"/>
      <path d="M54 58H62M94 59H102" stroke="#111" stroke-width="3"/>
    </g>

    <!-- A tapering tail curls behind the rear saddle. -->
    <path d="M29-13C13-12 8 3-6 5C-19 6-26-4-27-18
             C-22-6-14-4-8-8C3-17 10-27 26-25Z"
          fill="#d1d1d1" stroke="#191919" stroke-width="1.5"/>
    <path d="M22-22C5-17-1-4-14-5" fill="none"
          stroke="#f6f6f6" stroke-width="2"/>

    <!-- Torso and bent pedaling legs. -->
    <path d="M26-37Q42-41 46-23L43-7 29-5
             Q19-16 22-28Z"
          fill="#d0d0d0" stroke="#171717" stroke-width="1.5"/>
    <path d="M40-9L57 12 45 40 53 44"
          fill="none" stroke="#222" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M29-7L45 15 56 52 62 53"
          fill="none" stroke="#e0e0e0" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Six external gills make the tiny silhouette unmistakable. -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#c3c3c3" stroke-width="4">
        <path d="M19-43L7-55 2-67M17-38L0-43-8-52M18-33L0-30-10-35"/>
        <path d="M46-43L55-55 57-66M48-37L64-44 69-54M47-31L63-30 73-36"/>
      </g>
      <g stroke="#efefef" stroke-width="1.5">
        <path d="M8-55L0-56M5-60L-2-63M2-66L5-70
                 M0-43L-7-42M-4-47L-12-47M-1-30L-6-25"/>
        <path d="M55-55L62-58M57-61L63-65
                 M64-44L72-44M67-49L75-51M63-30L69-26"/>
      </g>
    </g>

    <path d="M16-48Q29-57 44-50Q54-45 51-34
             Q47-23 32-25Q16-24 13-35Q10-42 16-48Z"
          fill="#e4e4e4" stroke="#161616" stroke-width="1.5"/>
    <path d="M16-46Q30-54 43-48" fill="none"
          stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M15-33Q34-24 50-36Q47-24 32-25Q21-24 15-33Z"
          fill="#8b8b8b"/>
    <ellipse cx="27" cy="-40" rx="2.1" ry="2.8" fill="#000"/>
    <ellipse cx="43" cy="-41" rx="2.1" ry="2.8" fill="#000"/>
    <circle cx="27.5" cy="-41" r=".6" fill="#fff"/>
    <circle cx="43.5" cy="-42" r=".6" fill="#fff"/>
    <path d="M33-33Q36-30 39-34" fill="none"
          stroke="#161616" stroke-width="1.1" stroke-linecap="round"/>

    <path d="M40-27Q52-16 60-18L77-23"
          fill="none" stroke="#181818" stroke-width="7"
          stroke-linecap="round"/>
    <path d="M39-28Q52-19 60-21L76-25"
          fill="none" stroke="#e8e8e8" stroke-width="5"
          stroke-linecap="round"/>
    <path d="M75-26l6-1M76-24l6 1"
          stroke="#e8e8e8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Near-field stone and crater emphasize the enormous empty foreground. -->
  <path d="M83 878L108 859 127 863 144 884 114 893Z" fill="#dedede"/>
  <path d="M108 859L127 863 144 884 119 881Z" fill="#777"/>
  <path d="M119 881L144 884 311 935 260 938 114 893Z" fill="#000"/>

  <path d="M802 960Q874 869 1048 874Q1194 876 1304 960Z" fill="#c7c7c7"/>
  <path d="M843 960Q913 892 1054 895Q1167 895 1255 960Z" fill="#000"/>
  <path d="M802 960Q874 869 1048 874Q1194 876 1304 960"
        fill="none" stroke="#e0e0e0" stroke-width="5"/>

  <g fill="#777">
    <path d="M487 787l8-3 7 4-10 2Z"/>
    <path d="M679 844l10-4 9 5-14 2Z"/>
    <path d="M1353 813l6-3 9 4-7 2Z"/>
    <path d="M369 917l10-5 11 6-13 3Z"/>
  </g>
  <g fill="#000">
    <path d="M495 784l17 6-10-2Z"/>
    <path d="M689 840l28 10-19-5Z"/>
    <path d="M379 912l30 12-19-6Z"/>
  </g>
</svg>