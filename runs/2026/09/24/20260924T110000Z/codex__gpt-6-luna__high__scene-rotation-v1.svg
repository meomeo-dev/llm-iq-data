<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Axolotl on a tandem bicycle beneath a rising Earth</title>
  <desc id="desc">A tiny axolotl pedals a tandem bicycle across a vast, monochrome lunar plain. Blue Earth rises above the horizon in a pitch-black sky, under harsh sunlight and long, dark shadows.</desc>

  <defs>
    <linearGradient id="earth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4e8ff"/>
      <stop offset=".42" stop-color="#4f9ac8"/>
      <stop offset="1" stop-color="#173c5e"/>
    </linearGradient>
    <clipPath id="earthClip">
      <circle cx="930" cy="183" r="73"/>
    </clipPath>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7a7a7"/>
      <stop offset=".22" stop-color="#777"/>
      <stop offset="1" stop-color="#3d3d3d"/>
    </linearGradient>
  </defs>

  <!-- Airless sky and the Earth rising at the horizon -->
  <rect width="1200" height="700" fill="#000"/>
  <circle cx="930" cy="183" r="73" fill="url(#earth)"/>
  <g clip-path="url(#earthClip)" fill="none" stroke="#d8efff" stroke-linecap="round">
    <path d="M850 146c31-14 53-12 76-25 17-10 38-13 61-7" stroke-width="13" opacity=".64"/>
    <path d="M861 181c22-11 40-4 53-18 10-11 22-9 37-17 13-7 24-7 42-2" stroke-width="8" opacity=".6"/>
    <path d="M876 219c18-14 28-9 42-22 11-11 25-9 40-20 10-8 22-8 35-4" stroke-width="11" opacity=".55"/>
    <path d="M896 259c15-10 28-7 38-18 11-11 25-10 42-17" stroke-width="7" opacity=".45"/>
    <path d="M881 134c15 3 22 7 29 14m33 69c12 4 22 3 34-2" stroke-width="4" opacity=".72"/>
  </g>
  <path d="M0 400 107 391l67 8 88-17 95 18 83-13 102 14 70-12 91 10 87-20 83 15 83-11 64 8 100-14v333H0z" fill="#151515"/>

  <!-- Broad lunar plain -->
  <path d="M0 418 107 407l67 8 88-16 95 17 83-13 102 14 70-12 91 10 87-20 83 15 83-11 64 8 100-14v307H0z" fill="url(#ground)"/>
  <path d="M0 418 107 407l67 8 88-16 95 17 83-13 102 14 70-12 91 10 87-20 83 15 83-11 64 8 100-14" fill="none" stroke="#c5c5c5" stroke-width="2" opacity=".25"/>

  <!-- Distant ridges and crater rims -->
  <path d="M0 486q48-19 96-8t96 5q53-4 97-28t85-12q49 12 91 5t81-24q45-18 95 1t90 6q47-14 98-1t84 2q39-8 87 7v76H0z" fill="#666" opacity=".65"/>
  <path d="M0 493q66-15 115 2t109 6q57-10 96-30m149 12q44 12 96-3t100 0q56 10 96-5t100 6q66 14 129-3" fill="none" stroke="#bcbcbc" stroke-width="3" opacity=".2"/>

  <!-- Craters, stones, and sharp sunlight -->
  <g fill="#202020" opacity=".88">
    <ellipse cx="163" cy="565" rx="68" ry="13"/>
    <ellipse cx="163" cy="560" rx="54" ry="7" fill="#a3a3a3"/>
    <ellipse cx="1018" cy="528" rx="48" ry="10"/>
    <ellipse cx="1018" cy="524" rx="36" ry="5" fill="#aaa"/>
    <path d="m285 545 17-28 18 28z"/>
    <path d="m1102 579 12-20 17 20z"/>
    <path d="m764 505 8-14 12 14z"/>
    <path d="m497 584 13-24 17 24z"/>
    <path d="m85 633 9-15 13 15z"/>
    <path d="m929 618 17-26 19 26z"/>
  </g>
  <g fill="#dadada" opacity=".6">
    <path d="m274 542 14-23 7 24z"/>
    <path d="m1094 576 10-17 6 18z"/>
    <path d="m490 580 12-20 5 22z"/>
    <path d="m920 615 14-23 7 25z"/>
    <circle cx="391" cy="504" r="2"/>
    <circle cx="688" cy="549" r="3"/>
    <circle cx="1134" cy="476" r="2"/>
  </g>

  <!-- Tiny tandem bicycle and its stark shadow -->
  <g transform="translate(520 444)">
    <!-- Cast shadow, pointed away from the low sunlight -->
    <path d="M-1 94 224 100 437 143 183 132z" fill="#050505" opacity=".96"/>
    <path d="M-10 82h203" stroke="#080808" stroke-width="5" opacity=".9"/>

    <!-- Two wheels -->
    <g fill="none" stroke="#171717" stroke-width="3">
      <circle cx="0" cy="48" r="29"/>
      <circle cx="142" cy="48" r="29"/>
      <circle cx="0" cy="48" r="3" fill="#171717"/>
      <circle cx="142" cy="48" r="3" fill="#171717"/>
      <path d="M0 48 51 48 79 8 142 48 51 48 36 5 79 8l-7 40 70 0"/>
      <path d="m36 5-9-7m3 7h16m82 43 16-33m-21 1h20"/>
      <path d="M50 48 36 5m15 43 28-40"/>
    </g>
    <g stroke="#555" stroke-width="1" opacity=".7">
      <path d="M0 19v58m-29-29h58m-21-21 42 42m0-42L-21 69"/>
      <path d="M142 19v58m-29-29h58m-21-21 42 42m0-42-42 42"/>
    </g>

    <!-- Frame, second saddle, and pedals -->
    <path d="M34 3h20m57 1h18" stroke="#171717" stroke-width="4" stroke-linecap="round"/>
    <path d="M57 3h18" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <circle cx="72" cy="48" r="8" fill="none" stroke="#151515" stroke-width="2"/>
    <path d="m72 48-9-7m9 7 8 7m-20-18-10 1" stroke="#181818" stroke-width="2"/>
    <path d="M30 0h18m62 0h18" stroke="#111" stroke-width="3" stroke-linecap="round"/>

    <!-- Axolotl rider, facing toward the Earth -->
    <g stroke="#282828" stroke-width="2" stroke-linejoin="round">
      <path d="M40-31q-5-13 3-22 8-8 21-4 13 3 16 14 2 9-5 16-13 10-28 4z" fill="#c8c8c8"/>
      <path d="M44-47q-11-17-18-8 0 8 13 14m24-17q8-17 16-8 2 8-9 15m-33-11q-14-11-17-3 3 8 16 10m48-10q13-12 17-3-2 8-15 11" fill="none" stroke="#bbb" stroke-width="4"/>
      <path d="M48-47q2-3 5 0m13 0q2-3 5 0" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M53-38q7 4 14-1" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M49-28q9 1 18-2l6 14-16 2-11-6z" fill="#aaa"/>
      <path d="m54-23 4 13m10-16 7 12m-21-1-8 11m28-10 8 8" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <path d="M46-8h12m15-5h12" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Sparse lunar surface scoring -->
  <g fill="none" stroke="#d6d6d6" opacity=".13">
    <path d="M37 660q64-12 137-6m188-21q45-8 86-3m475 39q73-15 142-7"/>
    <path d="M226 601q33-8 62-2m504 25q28-6 54-2m-641 35q29-7 57-4"/>
  </g>
</svg>