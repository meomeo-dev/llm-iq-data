<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Axolotl riding a tandem bicycle on the Moon, Earth rising</title>
  <defs>
    <radialGradient id="earthBase" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#a8d4ff"/>
      <stop offset="0.45" stop-color="#3f8ae0"/>
      <stop offset="0.8" stop-color="#1a4fa0"/>
      <stop offset="1" stop-color="#0c2a60"/>
    </radialGradient>
    <clipPath id="earthClip">
      <circle cx="860" cy="420" r="78"/>
    </clipPath>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c8c8c"/>
      <stop offset="0.18" stop-color="#7b7b7b"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="axoLit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="0.52" stop-color="#d2d2d2"/>
      <stop offset="0.6" stop-color="#2c2c2c"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9fb6cc" stop-opacity="0.12"/>
    </radialGradient>

    <!-- Bicycle geometry (local coordinates; ground contact at y=92) -->
    <g id="wheels" fill="none">
      <circle cx="30" cy="70" r="22"/>
      <circle cx="170" cy="70" r="22"/>
    </g>
    <g id="frame" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30,70 L58,32 L152,30 M30,70 L68,72 L58,32 M68,72 L118,72 L116,32
               M68,72 L116,32 M118,72 L156,44 M152,30 L156,44 L170,70
               M58,32 L57,26 M116,32 L115,26 M152,30 L150,20 L161,18
               M115,29 L104,22 L100,24"/>
      <circle cx="68" cy="72" r="7"/>
      <circle cx="118" cy="72" r="7"/>
    </g>
    <!-- Axolotl silhouette used for the cast shadow -->
    <g id="axoSil">
      <path d="M106,6 C92,2 76,-10 54,-6 C64,2 86,14 106,20 Z"/>
      <ellipse cx="122" cy="8" rx="18" ry="11" transform="rotate(-20 122 8)"/>
      <ellipse cx="144" cy="-8" rx="13" ry="10"/>
      <path d="M110,14 L120,12 L127,79 L121,80 Z"/>
      <path d="M132,2 L136,-2 L162,17 L160,21 Z"/>
      <path d="M136,-12 Q128,-26 120,-30 M134,-8 Q124,-16 116,-18 M134,-3 Q126,-4 118,-2"/>
      <circle cx="144" cy="-8" r="19" fill-opacity="0.25"/>
    </g>
  </defs>

  <!-- Black sky -->
  <rect width="1200" height="800" fill="#000"/>

  <!-- Sparse stars -->
  <g fill="#fff">
    <circle cx="40" cy="30" r="1" opacity="0.8"/><circle cx="95" cy="120" r="0.7" opacity="0.5"/>
    <circle cx="150" cy="60" r="1.2" opacity="0.9"/><circle cx="210" cy="190" r="0.6" opacity="0.4"/>
    <circle cx="260" cy="35" r="0.8" opacity="0.6"/><circle cx="320" cy="140" r="1" opacity="0.7"/>
    <circle cx="370" cy="260" r="0.6" opacity="0.4"/><circle cx="420" cy="80" r="0.9" opacity="0.6"/>
    <circle cx="480" cy="210" r="0.7" opacity="0.5"/><circle cx="530" cy="30" r="1.3" opacity="0.9"/>
    <circle cx="590" cy="150" r="0.6" opacity="0.4"/><circle cx="640" cy="300" r="0.8" opacity="0.5"/>
    <circle cx="690" cy="70" r="0.7" opacity="0.6"/><circle cx="740" cy="220" r="1" opacity="0.7"/>
    <circle cx="800" cy="40" r="0.6" opacity="0.5"/><circle cx="850" cy="160" r="0.9" opacity="0.6"/>
    <circle cx="910" cy="90" r="1.2" opacity="0.8"/><circle cx="960" cy="240" r="0.6" opacity="0.4"/>
    <circle cx="1010" cy="50" r="0.8" opacity="0.7"/><circle cx="1060" cy="180" r="0.7" opacity="0.5"/>
    <circle cx="1110" cy="110" r="1.1" opacity="0.8"/><circle cx="1160" cy="260" r="0.6" opacity="0.4"/>
    <circle cx="1180" cy="40" r="0.8" opacity="0.6"/><circle cx="60" cy="300" r="0.7" opacity="0.5"/>
    <circle cx="120" cy="380" r="0.6" opacity="0.3"/><circle cx="240" cy="330" r="0.9" opacity="0.5"/>
    <circle cx="300" cy="400" r="0.6" opacity="0.3"/><circle cx="450" cy="360" r="0.7" opacity="0.4"/>
    <circle cx="560" cy="380" r="0.6" opacity="0.3"/><circle cx="700" cy="390" r="0.8" opacity="0.4"/>
    <circle cx="1020" cy="330" r="0.7" opacity="0.4"/><circle cx="1100" cy="370" r="0.6" opacity="0.3"/>
    <circle cx="1170" cy="400" r="0.7" opacity="0.3"/><circle cx="20" cy="210" r="0.9" opacity="0.6"/>
    <circle cx="180" cy="260" r="0.6" opacity="0.4"/><circle cx="510" cy="290" r="1" opacity="0.5"/>
    <circle cx="620" cy="20" r="0.7" opacity="0.6"/><circle cx="1080" cy="290" r="0.8" opacity="0.5"/>
    <circle cx="990" cy="150" r="0.6" opacity="0.5"/><circle cx="880" cy="280" r="0.7" opacity="0.4"/>
  </g>

  <!-- Earth rising -->
  <circle cx="860" cy="420" r="82" fill="none" stroke="#7fbfff" stroke-opacity="0.18" stroke-width="6"/>
  <circle cx="860" cy="420" r="78" fill="url(#earthBase)"/>
  <g clip-path="url(#earthClip)">
    <ellipse cx="830" cy="395" rx="26" ry="14" fill="#6fb6f5" opacity="0.45"/>
    <ellipse cx="872" cy="430" rx="20" ry="11" fill="#6fb6f5" opacity="0.35"/>
    <g fill="none" stroke="#fff" stroke-linecap="round">
      <path d="M800,370 q20,-10 40,-4 t40,2" stroke-width="4" opacity="0.55"/>
      <path d="M790,405 q25,8 50,0 t45,6" stroke-width="3.5" opacity="0.5"/>
      <path d="M805,440 q20,-6 38,2" stroke-width="3" opacity="0.45"/>
      <path d="M830,350 q15,-6 30,-2" stroke-width="2.5" opacity="0.5"/>
      <path d="M850,470 q18,-5 34,1" stroke-width="3" opacity="0.4"/>
    </g>
    <path d="M860,342 A78,78 0 0 1 860,498 A20,78 0 0 0 860,342 Z" fill="#02060f" opacity="0.35"/>
    <path d="M860,342 A78,78 0 0 1 860,498 A42,78 0 0 0 860,342 Z" fill="#02060f" opacity="0.92"/>
  </g>
  <path d="M812,358 A78,78 0 0 0 790,452" fill="none" stroke="#bfe0ff" stroke-width="1.5" opacity="0.6"/>

  <!-- Distant ridges -->
  <path d="M0,445 L70,432 L130,438 L210,414 L290,436 L380,428 L450,440 L560,425 L640,437
           L760,431 L820,442 L900,428 L960,410 L1040,430 L1110,422 L1200,436 L1200,470 L0,470 Z"
        fill="#959595"/>
  <g fill="#0d0d0d">
    <path d="M70,432 L130,438 L90,447 Z"/>
    <path d="M210,414 L290,436 L235,447 Z"/>
    <path d="M380,428 L450,440 L400,447 Z"/>
    <path d="M560,425 L640,437 L585,447 Z"/>
    <path d="M760,431 L820,442 L780,448 Z"/>
    <path d="M960,410 L1040,430 L985,448 Z"/>
    <path d="M1110,422 L1200,436 L1130,448 Z"/>
  </g>

  <!-- Foreground regolith -->
  <rect x="0" y="452" width="1200" height="348" fill="url(#ground)"/>

  <!-- Craters: bright far wall, pitch-black sunward wall -->
  <g>
    <ellipse cx="640" cy="478" rx="28" ry="5" fill="#9e9e9e"/>
    <ellipse cx="640" cy="478" rx="26" ry="4" fill="#6c6c6c"/>
    <path d="M640,474 A26,4 0 0 0 640,482 A13,4 0 0 0 640,474 Z" fill="#000"/>

    <ellipse cx="430" cy="470" rx="15" ry="3" fill="#9e9e9e"/>
    <ellipse cx="430" cy="470" rx="14" ry="2.5" fill="#6c6c6c"/>
    <path d="M430,467.5 A14,2.5 0 0 0 430,472.5 A7,2.5 0 0 0 430,467.5 Z" fill="#000"/>

    <ellipse cx="330" cy="505" rx="43" ry="9" fill="#9e9e9e"/>
    <ellipse cx="330" cy="505" rx="40" ry="7" fill="#6c6c6c"/>
    <path d="M330,498 A40,7 0 0 0 330,512 A20,7 0 0 0 330,498 Z" fill="#000"/>

    <ellipse cx="990" cy="520" rx="54" ry="11" fill="#9e9e9e"/>
    <ellipse cx="990" cy="520" rx="50" ry="9" fill="#6c6c6c"/>
    <path d="M990,511 A50,9 0 0 0 990,529 A25,9 0 0 0 990,511 Z" fill="#000"/>

    <ellipse cx="110" cy="560" rx="41" ry="10" fill="#9e9e9e"/>
    <ellipse cx="110" cy="560" rx="38" ry="8" fill="#6c6c6c"/>
    <path d="M110,552 A38,8 0 0 0 110,568 A19,8 0 0 0 110,552 Z" fill="#000"/>

    <ellipse cx="760" cy="560" rx="65" ry="16" fill="#a2a2a2"/>
    <ellipse cx="760" cy="560" rx="60" ry="13" fill="#6c6c6c"/>
    <path d="M760,547 A60,13 0 0 0 760,573 A30,13 0 0 0 760,547 Z" fill="#000"/>

    <ellipse cx="230" cy="690" rx="118" ry="31" fill="#a6a6a6"/>
    <ellipse cx="230" cy="690" rx="110" ry="26" fill="#6a6a6a"/>
    <path d="M230,664 A110,26 0 0 0 230,716 A55,26 0 0 0 230,664 Z" fill="#000"/>

    <ellipse cx="1060" cy="700" rx="160" ry="41" fill="#a6a6a6"/>
    <ellipse cx="1060" cy="700" rx="150" ry="34" fill="#6a6a6a"/>
    <path d="M1060,666 A150,34 0 0 0 1060,734 A70,34 0 0 0 1060,666 Z" fill="#000"/>

    <ellipse cx="560" cy="760" rx="75" ry="20" fill="#a2a2a2"/>
    <ellipse cx="560" cy="760" rx="70" ry="16" fill="#686868"/>
    <path d="M560,744 A70,16 0 0 0 560,776 A35,16 0 0 0 560,744 Z" fill="#000"/>
  </g>

  <!-- Rocks with long black shadows -->
  <g>
    <path d="M660,660 L740,656 L742,661 L652,662 Z" fill="#000"/>
    <path d="M640,661 L646,650 L655,648 L660,661 Z" fill="#bdbdbd"/>
    <path d="M655,648 L660,661 L652,661 Z" fill="#1c1c1c"/>

    <path d="M902,731 L1010,724 L1014,733 L866,734 Z" fill="#000"/>
    <path d="M860,731 L868,712 L884,706 L898,716 L902,731 Z" fill="#b8b8b8"/>
    <path d="M884,706 L898,716 L902,731 L888,731 Z" fill="#1a1a1a"/>

    <path d="M162,773 L290,766 L292,776 L140,777 Z" fill="#000"/>
    <path d="M120,773 L130,752 L150,748 L162,773 Z" fill="#b4b4b4"/>
    <path d="M150,748 L162,773 L148,773 Z" fill="#181818"/>

    <path d="M392,593 L420,592 L420,594 L390,595 Z" fill="#000"/>
    <path d="M384,594 L387,589 L392,593 Z" fill="#b0b0b0"/>
    <path d="M702,512 L728,511 L728,513 L700,514 Z" fill="#000"/>
    <path d="M694,513 L697,508 L702,512 Z" fill="#b0b0b0"/>
    <path d="M1150,590 L1196,587 L1196,591 L1146,592 Z" fill="#000"/>
    <path d="M1138,591 L1142,583 L1150,590 Z" fill="#b0b0b0"/>
  </g>

  <!-- Tire track winding in from the horizon -->
  <path d="M480,629 C400,628 330,610 280,580 S200,510 150,478" fill="none"
        stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M480,630.8 C400,629.8 330,611.8 280,581.8 S200,511.8 150,479.8" fill="none"
        stroke="#a8a8a8" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>

  <!-- The tiny rider -->
  <g transform="translate(470,600) scale(0.32)">
    <!-- Cast shadow: projected onto the ground, stretching away from the low sun -->
    <g transform="matrix(1 0 -3.2 -0.1 294.4 101.2)">
      <use href="#wheels" stroke="#000" stroke-width="5"/>
      <use href="#frame" stroke="#000" stroke-width="5"/>
      <use href="#axoSil" fill="#000" stroke="#000" stroke-width="3"/>
    </g>

    <!-- Bicycle -->
    <use href="#wheels" stroke="#bdbdbd" stroke-width="4.5"/>
    <g stroke="#8a8a8a" stroke-width="0.8">
      <path d="M8,70 L52,70 M30,48 L30,92 M14.4,54.4 L45.6,85.6 M14.4,85.6 L45.6,54.4"/>
      <path d="M148,70 L192,70 M170,48 L170,92 M154.4,54.4 L185.6,85.6 M154.4,85.6 L185.6,54.4"/>
    </g>
    <use href="#frame" stroke="#d8d8d8" stroke-width="4"/>
    <path d="M68,65 L118,65 M68,79 L118,79" stroke="#777" stroke-width="1"/>
    <path d="M68,72 L62,64 M118,72 L124,80" stroke="#cfcfcf" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="56" cy="25" rx="10" ry="3.2" fill="#d0d0d0"/>
    <ellipse cx="59" cy="26" rx="6" ry="2" fill="#2a2a2a"/>
    <ellipse cx="114" cy="25" rx="10" ry="3.2" fill="#d0d0d0"/>

    <!-- Axolotl, alone at the front, the rear seat empty -->
    <path d="M106,6 C92,2 76,-10 54,-6 C64,2 86,14 106,20 Z" fill="url(#axoLit)"/>
    <path d="M100,4 C88,-2 74,-10 58,-8" fill="none" stroke="#e8e8e8" stroke-width="1.5" opacity="0.7"/>
    <path d="M110,14 L120,12 L127,79 L121,80 Z" fill="#c4c4c4"/>
    <path d="M117,13 L120,12 L127,79 L124,80 Z" fill="#1e1e1e"/>
    <ellipse cx="125" cy="81" rx="5" ry="2.5" fill="#d8d8d8"/>
    <ellipse cx="122" cy="8" rx="18" ry="11" transform="rotate(-20 122 8)" fill="url(#axoLit)"/>
    <path d="M132,2 L136,-2 L162,17 L160,21 Z" fill="#d0d0d0"/>
    <path d="M136,-2 L162,17 L160,19 L134,1 Z" fill="#262626"/>
    <circle cx="161" cy="19" r="2.5" fill="#e0e0e0"/>
    <ellipse cx="144" cy="-8" rx="13" ry="10" fill="url(#axoLit)"/>
    <g fill="none" stroke-linecap="round">
      <path d="M136,-12 Q128,-26 120,-30 M134,-8 Q124,-16 116,-18 M134,-3 Q126,-4 118,-2"
            stroke="#e6e6e6" stroke-width="3"/>
      <path d="M136,-12 Q128,-26 120,-30 M134,-8 Q124,-16 116,-18 M134,-3 Q126,-4 118,-2"
            stroke="#8a8a8a" stroke-width="3" stroke-dasharray="1.5 2.5"/>
    </g>
    <circle cx="149" cy="-12" r="1.8" fill="#000"/>
    <circle cx="148.4" cy="-12.6" r="0.5" fill="#fff"/>
    <path d="M148,-3 Q152,-1 156,-4" fill="none" stroke="#111" stroke-width="1"/>
    <!-- Water-filled glass helmet -->
    <circle cx="144" cy="-8" r="19" fill="url(#glass)" stroke="#e2e2e2" stroke-width="1.5"/>
    <path d="M130,-16 A17,17 0 0 1 140,-25" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path d="M152,6 A19,19 0 0 0 162,-6" fill="none" stroke="#111" stroke-width="2"/>
    <ellipse cx="138" cy="10" rx="9" ry="2.5" fill="#8c8c8c"/>
  </g>
</svg>