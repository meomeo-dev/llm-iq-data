<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A Small Journey Across the Moon</title>
  <desc id="desc">An axolotl rides a tandem bicycle alone across a vast gray lunar plain. Blue Earth rises in the black sky. Unfiltered sunlight casts long, pitch-black shadows.</desc>

  <defs>
    <clipPath id="earth-disc">
      <circle cx="896" cy="325" r="43"/>
    </clipPath>
    <clipPath id="lunar-ground">
      <path d="M0 414 Q180 404 344 413 Q535 420 728 406 Q954 394 1200 413 V800 H0Z"/>
    </clipPath>
  </defs>

  <!-- Airless sky. -->
  <rect width="1200" height="800" fill="#000"/>

  <!-- Earth, the only color in the scene. -->
  <g clip-path="url(#earth-disc)">
    <circle cx="896" cy="325" r="43" fill="#347db6"/>
    <path d="M858 298 L870 286 888 283 901 291 898 300 885 303
             882 313 873 316 878 327 870 333 858 320Z
             M897 319 L909 311 923 317 925 328 935 334 929 345
             918 348 916 360 906 368 904 351 896 341 900 330Z"
          fill="#9dc1cf"/>
    <path d="M854 309 Q877 293 902 305 Q923 314 939 309
             M859 340 Q879 330 895 337 Q916 347 930 343
             M873 288 Q892 297 914 289"
          fill="none" stroke="#e4edf0" stroke-width="4"/>
    <path d="M917 282 C941 307 935 351 896 370
             C920 372 944 351 943 325 C942 303 931 289 917 282Z"
          fill="#000"/>
  </g>

  <!-- A low, gently curved horizon, without atmospheric haze. -->
  <path d="M0 414 Q180 404 344 413 Q535 420 728 406
           Q954 394 1200 413 V800 H0Z" fill="#aaa"/>

  <g clip-path="url(#lunar-ground)">
    <!-- Distant ridges catch direct sunlight. -->
    <path d="M0 414 L63 406 99 410 137 401 186 412 246 409
             287 414 344 413 405 419 0 439Z" fill="#c9c9c9"/>
    <path d="M0 414 L62 413 99 417 137 401 151 416
             186 412 208 419 287 414 332 421 0 427Z" fill="#707070"/>
    <path d="M718 407 L774 397 794 402 826 391 853 399
             882 393 927 401 968 397 1010 403 1055 398
             1117 409 1200 413 1200 434 766 420Z" fill="#d1d1d1"/>
    <path d="M794 402 L826 391 813 409 850 405 882 393
             866 412 927 401 916 414 1010 403 1039 414
             1117 409 1160 418 766 420Z" fill="#5c5c5c"/>

    <!-- Sparse, sharply edged craters. -->
    <path d="M118 452 Q141 442 171 449 Q154 459 124 456Z" fill="#dedede"/>
    <path d="M124 452 Q143 446 165 450 Q146 451 138 456Z" fill="#000"/>
    <path d="M918 445 Q950 436 984 443 Q969 452 930 451Z" fill="#d6d6d6"/>
    <path d="M927 444 Q952 439 977 443 L947 448Z" fill="#000"/>
    <path d="M759 470 Q772 465 786 469 Q775 475 763 473Z" fill="#dedede"/>
    <path d="M763 469 Q774 466 783 469 L771 472Z" fill="#000"/>

    <path d="M87 621 C115 605 177 605 211 618
             C193 639 115 646 87 621Z" fill="#d6d6d6"/>
    <path d="M96 620 C120 609 172 609 201 618
             C166 614 136 623 126 634 C111 632 102 627 96 620Z" fill="#000"/>
    <path d="M132 638 Q183 637 211 618 Q195 642 142 644Z" fill="#878787"/>

    <path d="M956 556 Q1001 540 1047 553 Q1023 574 971 567Z" fill="#d3d3d3"/>
    <path d="M966 554 Q1004 544 1039 553 Q1003 550 987 564Z" fill="#000"/>

    <!-- Foreground impact basin, cropped by the frame. -->
    <path d="M766 800 C822 754 1019 713 1200 746
             V800Z" fill="#cfcfcf"/>
    <path d="M805 800 C891 754 1066 743 1200 769
             V800Z" fill="#000"/>
    <path d="M0 742 L42 731 57 735 92 736 114 745 44 744Z" fill="#000"/>
    <path d="M13 739 L42 723 57 735 44 744Z" fill="#e0e0e0"/>
    <path d="M42 723 L43 738 57 735Z" fill="#696969"/>

    <!-- Isolated stones and their hard shadows. -->
    <g fill="#000">
      <path d="M337 548 L346 545 372 550 342 551Z"/>
      <path d="M864 618 L873 613 914 621 872 621Z"/>
      <path d="M269 701 L278 695 328 707 276 705Z"/>
      <path d="M1038 487 L1042 484 1062 488Z"/>
      <path d="M480 459 L484 457 496 460Z"/>
    </g>
    <g fill="#e0e0e0">
      <path d="M337 548 L341 541 346 545 344 550Z"/>
      <path d="M864 618 L868 608 873 613 872 621Z"/>
      <path d="M269 701 L273 689 278 695 276 705Z"/>
      <path d="M1038 487 L1040 481 1042 484Z"/>
    </g>

    <!-- Two delicate tracks disappear into the empty plain. -->
    <path d="M0 549 C199 520 371 520 555 535
             M0 554 C203 524 372 525 555 538"
          fill="none" stroke="#8c8c8c" stroke-width="1"/>

    <!-- The bicycle and rider cast a single stark, elongated shadow. -->
    <g fill="#000">
      <path d="M551 539 L647 539 800 576 761 580 658 553 594 550Z"/>
      <path d="M577 538 L590 535 753 564 742 570Z"/>
      <path d="M586 533 L602 533 770 560 763 568Z"/>
      <path d="M734 555 L723 544 743 553 741 539 754 555
               768 548 764 560 780 560 768 568 746 566Z"/>
    </g>
  </g>

  <!-- A tiny tandem bicycle: two saddles, two cranksets, one passenger. -->
  <g stroke="#151515" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none">
      <circle cx="555" cy="525" r="17" stroke-width="3"/>
      <circle cx="644" cy="525" r="17" stroke-width="3"/>
      <g stroke="#5b5b5b" stroke-width=".65">
        <path d="M555 508 V542 M538 525 H572 M543 513 L567 537 M543 537 L567 513"/>
        <path d="M644 508 V542 M627 525 H661 M632 513 L656 537 M632 537 L656 513"/>
      </g>
      <g stroke="#eeeeee" stroke-width="1">
        <path d="M539 520 A17 17 0 0 1 564 511"/>
        <path d="M628 520 A17 17 0 0 1 653 511"/>
      </g>
      <path d="M555 525 L575 501 587 525Z
               M575 501 L608 501 587 525
               M587 525 L619 525 608 501
               M608 501 L633 500 619 525
               M633 500 L644 525"
            stroke-width="2.5"/>
      <path d="M575 501 L572 494 M608 501 L605 492
               M633 500 L630 486 639 483 642 486"
            stroke-width="2"/>
      <path d="M599 496 L596 486 605 484" stroke-width="1.8"/>
      <path d="M587 525 H619" stroke-width="4"/>
      <path d="M587 525 H619" stroke="#bcbcbc" stroke-width="1"/>
      <circle cx="587" cy="525" r="4" stroke-width="1.4"/>
      <circle cx="619" cy="525" r="4" stroke-width="1.4"/>
      <path d="M587 525 L582 530 H578 M619 525 L623 518 H628" stroke-width="1.5"/>
    </g>
    <path d="M565 493 Q573 490 580 493 L578 496 H567Z" fill="#121212" stroke-width="1"/>
    <path d="M598 491 Q605 488 613 491 L611 494 H599Z" fill="#121212" stroke-width="1"/>

    <!-- The axolotl's long tail floats behind the empty rear seat. -->
    <path d="M604 484 C592 486 583 485 573 478
             C563 471 554 474 551 480
             C560 476 562 484 574 489
             C586 497 598 495 607 491Z"
          fill="#bdbdbd" stroke-width="1.2"/>
    <path d="M601 488 C579 492 567 475 556 477"
          fill="none" stroke="#f0f0f0" stroke-width="1"/>

    <!-- Small body, bent legs, hands on the front handlebars. -->
    <path d="M607 470 C603 476 601 484 603 492
             Q609 497 616 489 L619 474Z"
          fill="#dedede" stroke-width="1.3"/>
    <path d="M608 490 L616 502 614 513 622 518 627 518
             M604 491 L601 502 609 511"
          fill="none" stroke-width="4"/>
    <path d="M608 490 L616 502 614 513 622 518
             M604 491 L601 502 609 511"
          fill="none" stroke="#c7c7c7" stroke-width="2.4"/>
    <path d="M615 478 Q622 485 632 486" fill="none" stroke-width="4"/>
    <path d="M615 477 Q622 483 632 485" fill="none" stroke="#ededed" stroke-width="2.4"/>

    <!-- Six feathery external gills silhouette against the lunar plain. -->
    <g fill="none" stroke-width="2">
      <path d="M604 464 L595 456 M603 468 L592 466 M604 472 L596 478
               M620 462 L625 452 M623 466 L633 460 M622 471 L633 473"/>
      <g stroke-width=".85">
        <path d="M599 460 L599 455 M598 459 L593 460
                 M597 467 L594 463 M596 467 L591 470
                 M600 475 L595 473 M599 476 L598 480
                 M623 457 L620 453 M624 455 L628 454
                 M627 464 L627 459 M629 463 L634 464
                 M628 472 L631 469 M629 473 L632 477"/>
      </g>
    </g>
    <path d="M601 462 Q607 455 618 458 Q625 460 626 468
             Q624 476 612 477 Q602 475 601 469Z"
          fill="#e8e8e8" stroke-width="1.2"/>
    <path d="M602 470 Q612 476 625 469 Q623 477 612 477Z"
          fill="#939393" stroke="none"/>
    <circle cx="610" cy="464" r="1.4" fill="#000" stroke="none"/>
    <circle cx="621" cy="463" r="1.4" fill="#000" stroke="none"/>
    <path d="M615 469 Q617 471 620 468" fill="none" stroke-width=".85"/>
    <path d="M605 460 Q611 457 617 459" fill="none" stroke="#fff" stroke-width="1.2"/>
  </g>
</svg>