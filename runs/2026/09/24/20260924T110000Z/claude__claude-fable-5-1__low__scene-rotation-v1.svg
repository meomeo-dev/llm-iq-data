<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <!-- 黑色太空背景 (black sky) -->
  <rect width="1200" height="700" fill="#000000"/>

  <!-- 稀疏星辰 -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1"/><circle cx="210" cy="140" r="1.2"/><circle cx="340" cy="45" r="0.8"/>
    <circle cx="480" cy="110" r="1"/><circle cx="620" cy="30" r="0.9"/><circle cx="760" cy="90" r="1.1"/>
    <circle cx="950" cy="50" r="1"/><circle cx="1080" cy="150" r="0.8"/><circle cx="1140" cy="70" r="1.2"/>
    <circle cx="150" cy="230" r="0.7"/><circle cx="560" cy="200" r="0.8"/><circle cx="1010" cy="240" r="0.9"/>
    <circle cx="410" cy="260" r="0.6"/><circle cx="880" cy="180" r="0.7"/><circle cx="700" cy="150" r="0.6"/>
  </g>

  <!-- 地球升起 (Earthrise) : 蓝色是画面唯一彩色 -->
  <defs>
    <clipPath id="earthClip"><circle cx="900" cy="200" r="70"/></clipPath>
    <radialGradient id="earthShade" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#7fb8ff"/>
      <stop offset="0.6" stop-color="#2a6fd6"/>
      <stop offset="1" stop-color="#0b2a66"/>
    </radialGradient>
  </defs>
  <circle cx="900" cy="200" r="70" fill="url(#earthShade)"/>
  <g clip-path="url(#earthClip)" fill="#ffffff" opacity="0.85">
    <path d="M850 180 q20 -25 45 -10 q10 15 -5 30 q-25 10 -40 -20z"/>
    <path d="M905 235 q25 -15 45 5 q-5 25 -30 25 q-25 -5 -15 -30z"/>
    <path d="M870 240 q10 -8 22 0 q-2 12 -12 12 q-12 -2 -10 -12z"/>
    <path d="M920 150 q18 -5 30 10 q-8 12 -22 8 q-14 -6 -8 -18z"/>
  </g>
  <!-- 地球夜半球 (terminator) -->
  <path d="M900 130 a70 70 0 0 1 0 140 a40 70 0 0 0 0 -140z" fill="#000000" opacity="0.55"/>

  <!-- 月面远景与地平线 -->
  <path d="M0 420 L180 405 L330 415 L520 400 L700 410 L900 398 L1050 408 L1200 400 L1200 700 L0 700z" fill="#8a8a8a"/>
  <!-- 远处环形山轮廓 -->
  <path d="M560 402 q40 -18 90 0z" fill="#9c9c9c"/>
  <path d="M560 402 q40 -6 90 0 L650 406 L560 406z" fill="#000000"/>

  <!-- 中景明暗 (harsh sunlight from upper-left) -->
  <path d="M0 470 q300 -20 600 0 t600 0 L1200 700 L0 700z" fill="#a3a3a3"/>

  <!-- 环形山群，右侧为黑影 -->
  <g>
    <ellipse cx="220" cy="560" rx="110" ry="24" fill="#b5b5b5"/>
    <path d="M220 540 a110 24 0 0 1 100 8 a110 24 0 0 1 -100 32 a95 20 0 0 0 60 -20 a95 20 0 0 0 -60 -20z" fill="#000000"/>
    <ellipse cx="220" cy="560" rx="70" ry="14" fill="#8f8f8f"/>
    <path d="M150 560 a70 14 0 0 0 140 0 a70 14 0 0 0 -140 0 M155 560 a65 12 0 0 1 130 0z" fill="#000000" opacity="0.7"/>

    <ellipse cx="820" cy="620" rx="150" ry="32" fill="#b5b5b5"/>
    <path d="M820 592 a150 32 0 0 1 130 10 a150 32 0 0 1 -130 54 a130 26 0 0 0 80 -32 a130 26 0 0 0 -80 -32z" fill="#000000"/>
    <ellipse cx="820" cy="620" rx="95" ry="18" fill="#8f8f8f"/>
    <path d="M725 620 a95 18 0 0 0 190 0 a90 15 0 0 1 -180 0z" fill="#000000" opacity="0.7"/>

    <ellipse cx="1080" cy="500" rx="60" ry="12" fill="#b5b5b5"/>
    <path d="M1080 490 a60 12 0 0 1 50 4 a60 12 0 0 1 -50 20 a50 10 0 0 0 30 -12 a50 10 0 0 0 -30 -12z" fill="#000000"/>
    <ellipse cx="1080" cy="500" rx="36" ry="6" fill="#8f8f8f"/>
  </g>

  <!-- 散落石块与硬阴影 -->
  <g>
    <ellipse cx="400" cy="640" rx="14" ry="8" fill="#c4c4c4"/>
    <path d="M400 640 l40 12 l-30 4 l-24 -8z" fill="#000000"/>
    <ellipse cx="960" cy="470" rx="9" ry="5" fill="#c4c4c4"/>
    <path d="M960 470 l26 7 l-18 3 l-15 -5z" fill="#000000"/>
    <ellipse cx="110" cy="680" rx="18" ry="9" fill="#c4c4c4"/>
    <path d="M110 680 l50 14 l-36 5 l-30 -10z" fill="#000000"/>
    <ellipse cx="650" cy="520" rx="6" ry="3" fill="#c4c4c4"/>
    <path d="M650 520 l16 5 l-11 2 l-10 -4z" fill="#000000"/>
  </g>

  <!-- 车辙 -->
  <path d="M-10 585 q200 -8 420 -4 q160 3 250 -14" fill="none" stroke="#000000" stroke-width="1.2" opacity="0.6"/>
  <path d="M-10 590 q200 -8 420 -4 q160 3 250 -14" fill="none" stroke="#000000" stroke-width="1.2" opacity="0.6"/>

  <!-- 微小的主体：双人自行车 (tandem) 与美西螈 (axolotl) -->
  <g transform="translate(560 566) scale(0.55)">
    <!-- 硬地面阴影：向右投射，纯黑 -->
    <path d="M-40 4 l150 0 l70 16 l-170 0z" fill="#000000"/>
    <path d="M22 4 l70 16 l-8 0 l-70 -16z M-18 4 l70 16 l-8 0 l-70 -16z" fill="#000000"/>

    <!-- 车轮 -->
    <g fill="none" stroke="#d9d9d9" stroke-width="2.5">
      <circle cx="-30" cy="-16" r="18"/>
      <circle cx="70" cy="-16" r="18"/>
    </g>
    <g stroke="#bdbdbd" stroke-width="1">
      <line x1="-30" y1="-34" x2="-30" y2="2"/><line x1="-48" y1="-16" x2="-12" y2="-16"/>
      <line x1="-43" y1="-29" x2="-17" y2="-3"/><line x1="-17" y1="-29" x2="-43" y2="-3"/>
      <line x1="70" y1="-34" x2="70" y2="2"/><line x1="52" y1="-16" x2="88" y2="-16"/>
      <line x1="57" y1="-29" x2="83" y2="-3"/><line x1="83" y1="-29" x2="57" y2="-3"/>
    </g>
    <!-- 双人车架 -->
    <g fill="none" stroke="#e6e6e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-30 -16 L-10 -46 L20 -46 L50 -46 L70 -16"/>
      <path d="M-10 -46 L-2 -16 L20 -46 L20 -16 L50 -46 L38 -16"/>
      <path d="M-2 -16 L20 -16 L38 -16"/>
      <path d="M-10 -46 L-14 -58 L-24 -60"/>
      <path d="M20 -46 L16 -58 L6 -60"/>
      <path d="M-10 -46 L-6 -56 L2 -56"/>
      <path d="M50 -46 L54 -56 L60 -56"/>
    </g>
    <!-- 踏板曲柄 -->
    <g stroke="#e6e6e6" stroke-width="2.5" stroke-linecap="round">
      <line x1="-2" y1="-16" x2="-9" y2="-5"/><line x1="-2" y1="-16" x2="5" y2="-27"/>
      <line x1="38" y1="-16" x2="31" y2="-5"/><line x1="38" y1="-16" x2="45" y2="-27"/>
    </g>
    <!-- 链条 -->
    <line x1="-2" y1="-16" x2="70" y2="-16" stroke="#9e9e9e" stroke-width="1"/>

    <!-- 美西螈：占后座，尾巴拖到前座，用灰阶表现 -->
    <g>
      <!-- 尾巴延伸至前座 -->
      <path d="M52 -62 q-30 -10 -60 6 q-10 6 -6 -8 q10 -14 40 -12z" fill="#cfcfcf"/>
      <!-- 身体 -->
      <path d="M52 -62 q10 -20 26 -14 q8 6 -2 20 q-14 10 -24 -6z" fill="#dcdcdc"/>
      <!-- 头 -->
      <ellipse cx="82" cy="-80" rx="14" ry="10" fill="#e6e6e6"/>
      <!-- 阴面 (pitch-black shading on unlit side) -->
      <path d="M82 -70 a14 10 0 0 0 14 -10 a14 10 0 0 1 -14 10z" fill="#000000"/>
      <path d="M78 -56 q4 6 -2 14 q-10 -6 -6 -14z" fill="#000000"/>
      <!-- 外鳃：每侧三根 -->
      <g fill="none" stroke="#bfbfbf" stroke-width="3" stroke-linecap="round">
        <path d="M92 -88 q10 -8 16 -14"/><path d="M94 -82 q12 -3 18 -8"/><path d="M92 -74 q12 2 18 -2"/>
        <path d="M70 -88 q-10 -6 -16 -12"/><path d="M68 -82 q-12 -2 -18 -6"/>
      </g>
      <g fill="#7a7a7a">
        <circle cx="108" cy="-102" r="2.4"/><circle cx="112" cy="-90" r="2.4"/><circle cx="110" cy="-76" r="2.4"/>
        <circle cx="54" cy="-100" r="2.4"/><circle cx="50" cy="-88" r="2.4"/>
      </g>
      <!-- 眼睛与惊叹表情 -->
      <circle cx="88" cy="-82" r="2.4" fill="#000000"/>
      <circle cx="89" cy="-83" r="0.8" fill="#ffffff"/>
      <path d="M86 -74 q4 3 8 0" fill="none" stroke="#000000" stroke-width="1"/>
      <!-- 前肢握把手，后肢踩踏板 -->
      <path d="M64 -60 q-8 4 -6 4" fill="none" stroke="#dcdcdc" stroke-width="3" stroke-linecap="round"/>
      <path d="M62 -58 q-2 26 -17 30" fill="none" stroke="#dcdcdc" stroke-width="3" stroke-linecap="round"/>
      <path d="M70 -50 q-10 20 -25 45" fill="none" stroke="#dcdcdc" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>