<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Axolotl on a tandem bicycle beneath Earthrise</title>
  <desc id="desc">A tiny axolotl rides a tandem bicycle across the moon. Blue Earth rises above a vast gray landscape under a black sky.</desc>
  <defs>
    <radialGradient id="earth" cx="38%" cy="34%" r="65%">
      <stop offset="0" stop-color="#c8d9e4"/>
      <stop offset=".52" stop-color="#6088a4"/>
      <stop offset="1" stop-color="#203f60"/>
    </radialGradient>
    <linearGradient id="ground" x2="0" y2="1">
      <stop stop-color="#dedede"/>
      <stop offset=".42" stop-color="#a4a4a4"/>
      <stop offset="1" stop-color="#555"/>
    </linearGradient>
    <clipPath id="earthClip"><circle cx="845" cy="323" r="59"/></clipPath>
  </defs>

  <rect width="1200" height="800" fill="#020305"/>
  <circle cx="845" cy="323" r="59" fill="url(#earth)"/>
  <g clip-path="url(#earthClip)" fill="#dce5e9" opacity=".88">
    <path d="M797 303q19-23 34-15l8 10 15 3 6 13-13 7-5 17-16-4-7-17-20-3z"/>
    <path d="M869 274q15 8 20 22l19 5 4 14-18 7-7-12-15-2-7-17z"/>
    <path d="M867 343q13-7 22 4l15 2-9 19-21 10-9-15z"/>
  </g>
  <circle cx="845" cy="323" r="59" fill="none" stroke="#e1e9ec" stroke-width="1.5"/>

  <path d="M0 545Q176 526 331 540T654 538Q815 530 936 548T1200 537V800H0Z" fill="url(#ground)"/>
  <path d="M0 545Q176 526 331 540T654 538Q815 530 936 548T1200 537" fill="none" stroke="#f4f4f4" stroke-width="3"/>
  <path d="M0 608q187-29 360-8t312-7q151-24 298-4t230-10" fill="none" stroke="#777" stroke-width="2" opacity=".7"/>
  <path d="M58 681q164-16 291 1m520-6q161-16 275 9" fill="none" stroke="#3c3c3c" stroke-width="3" opacity=".6"/>
  <g fill="#777">
    <ellipse cx="144" cy="581" rx="19" ry="5"/>
    <ellipse cx="711" cy="562" rx="26" ry="5"/>
    <ellipse cx="1038" cy="625" rx="39" ry="8"/>
  </g>
  <g fill="none" stroke="#e9e9e9" opacity=".7">
    <path d="M125 579q20-7 38 0"/>
    <path d="M685 559q26-10 52 1"/>
    <path d="M1000 620q40-14 77 1"/>
  </g>

  <!-- Hard sunlight casts one long, absolute shadow. -->
  <path d="M579 574l-20 6-290 94-33 14 336-107 108-8z" fill="#090909"/>
  <path d="M617 566l-19 10-52 23 85-24 38-8z" fill="#090909"/>

  <!-- The bicycle remains small within the open lunar plain. -->
  <g transform="translate(0 0)" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke="#171717" stroke-width="2.7">
      <circle cx="555" cy="565" r="24"/>
      <circle cx="661" cy="565" r="24"/>
      <path d="M555 565l29-36 30 36-59 0 29-36 37 0 40 36-47 0 7-36"/>
      <path d="M584 529l-3-12m-11 0h20m31 12 10-18m-7-2h17"/>
      <path d="M614 565l-7 10m7-10 8 7m-41-5 7 8"/>
      <path d="M593 533l7-13m-8 0h18"/>
    </g>
    <g fill="#dedede" stroke="#171717" stroke-width="2">
      <path d="M580 510q-6-10-2-20 4-9 15-10 13-1 19 8 5 9 0 18l-9 10-15 1z"/>
      <path d="M582 497q-12-8-16-3l10 7-11 4 15-2"/>
      <path d="M608 493q12-9 17-3l-11 8 12 3-16 1"/>
      <path d="M585 486q-8-13-14-10l4 14m27-7q7-14 13-11l-4 16"/>
      <path d="M591 515l-4 17 13 3 8-18z"/>
      <path d="M602 521l14 9 6-2m-29 3-10 12 5 7"/>
    </g>
    <circle cx="594" cy="494" r="1.8" fill="#111"/>
    <circle cx="607" cy="494" r="1.8" fill="#111"/>
    <path d="M598 502q4 3 7 0" fill="none" stroke="#333" stroke-width="1.2"/>
    <path d="M591 530l-4 25m15-22 12 28" fill="none" stroke="#181818" stroke-width="2.5"/>
  </g>
</svg>