<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Capybara riding a unicycle in a coral reef</title>
  <desc id="desc">A playful capybara balances on a unicycle between arching pink corals beneath shimmering turquoise water.</desc>

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#79eee0"/>
      <stop offset=".48" stop-color="#27c9c4"/>
      <stop offset="1" stop-color="#087d91"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffbd0" stop-opacity=".75"/>
      <stop offset="1" stop-color="#d5fff1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fur" x1=".15" y1="0" x2=".9" y2="1">
      <stop stop-color="#d99a62"/>
      <stop offset=".65" stop-color="#bd7548"/>
      <stop offset="1" stop-color="#995638"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb0a2"/>
      <stop offset="1" stop-color="#f36f83"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e5fff4"/>
      <stop offset="1" stop-color="#8ce1d8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Deep, luminous water -->
  <rect width="800" height="800" fill="url(#water)"/>
  <ellipse cx="410" cy="38" rx="340" ry="28" fill="#d8fff0" opacity=".55"/>
  <path d="M0 49 Q120 26 240 47 T480 45 T800 43" fill="none"
        stroke="#f2fff0" stroke-width="8" opacity=".55"/>

  <!-- Sunbeams from the surface -->
  <path d="M132 48 L235 48 L360 490 L292 490 Z" fill="url(#ray)" opacity=".56"/>
  <path d="M330 46 L405 46 L455 475 L405 475 Z" fill="url(#ray)" opacity=".65"/>
  <path d="M530 45 L605 45 L532 460 L482 460 Z" fill="url(#ray)" opacity=".52"/>
  <path d="M685 48 L735 48 L604 420 L570 420 Z" fill="url(#ray)" opacity=".4"/>
  <ellipse cx="401" cy="460" rx="175" ry="145" fill="#d7fff0" opacity=".16" filter="url(#glow)"/>

  <!-- Distant reef silhouettes -->
  <path d="M0 602 Q82 548 155 594 Q224 544 296 603 Q374 548 450 597
           Q523 548 590 602 Q684 541 800 596 L800 800 L0 800Z"
        fill="#167f88" opacity=".52"/>
  <path d="M0 690 Q105 635 205 680 Q305 631 405 681 Q510 628 614 682
           Q712 640 800 680 L800 800 L0 800Z" fill="#0b6678" opacity=".68"/>

  <!-- Arching branching corals -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="url(#coral)" stroke-width="22">
      <path d="M50 656 Q62 524 118 423 Q150 365 181 287"/>
      <path d="M115 434 Q77 383 69 331"/>
      <path d="M131 402 Q190 361 209 306"/>
      <path d="M177 297 Q143 246 149 199"/>
      <path d="M181 286 Q231 246 241 201"/>
      <path d="M749 659 Q739 527 685 420 Q658 364 624 284"/>
      <path d="M687 428 Q731 377 740 323"/>
      <path d="M665 396 Q609 357 594 303"/>
      <path d="M627 294 Q662 243 655 197"/>
      <path d="M622 284 Q573 245 563 199"/>
    </g>
    <g stroke="#ffd0b8" stroke-width="7" opacity=".72">
      <path d="M50 656 Q62 524 118 423 Q150 365 181 287"/>
      <path d="M749 659 Q739 527 685 420 Q658 364 624 284"/>
    </g>
  </g>

  <!-- Soft coral fans behind the rider -->
  <g opacity=".95">
    <path d="M86 686 Q79 603 42 548 Q111 565 136 620 Q111 546 128 492
             Q169 560 154 636 Q184 579 226 555 Q217 635 169 689Z"
          fill="#f78791"/>
    <path d="M714 687 Q721 606 758 550 Q689 565 664 620 Q689 547 672 492
             Q631 560 646 636 Q616 578 574 555 Q583 635 631 689Z"
          fill="#f78791"/>
    <path d="M80 690 Q100 628 145 600 M98 679 Q100 616 128 548
             M690 690 Q670 628 625 600 M672 679 Q670 616 642 548"
          fill="none" stroke="#ffc0ab" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Sea floor -->
  <path d="M0 710 Q140 676 260 713 Q380 750 510 711 Q659 667 800 711
           L800 800 L0 800Z" fill="#df987e"/>
  <path d="M0 744 Q130 711 255 746 Q398 783 542 743 Q673 708 800 744
           L800 800 L0 800Z" fill="#bd716f"/>
  <g fill="#ffe0a8" opacity=".8">
    <circle cx="286" cy="723" r="5"/><circle cx="318" cy="743" r="3"/>
    <circle cx="540" cy="726" r="4"/><circle cx="580" cy="746" r="3"/>
    <circle cx="226" cy="764" r="4"/><circle cx="641" cy="768" r="5"/>
  </g>

  <!-- Unicycle wheel, fork, and seat -->
  <circle cx="400" cy="616" r="79" fill="#087789" opacity=".25"/>
  <circle cx="400" cy="605" r="76" fill="none" stroke="#164f67" stroke-width="15"/>
  <circle cx="400" cy="605" r="66" fill="none" stroke="url(#wheel)" stroke-width="5"/>
  <g stroke="#c8fff0" stroke-width="3" opacity=".85">
    <path d="M400 539V671 M334 605H466 M353 558L447 652 M447 558L353 652"/>
    <path d="M375 544L425 666 M340 580L460 630 M425 544L375 666 M340 630L460 580"/>
  </g>
  <circle cx="400" cy="605" r="10" fill="#ffca8d" stroke="#164f67" stroke-width="4"/>
  <path d="M390 509 L400 605 L410 509" fill="none" stroke="#e8fff4" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M370 507 Q400 494 430 507 Q429 519 400 520 Q371 519 370 507Z"
        fill="#f77c83" stroke="#8b4d59" stroke-width="4"/>
  <path d="M400 605 L365 620 M400 605 L435 590" stroke="#ffd190" stroke-width="6"
        stroke-linecap="round"/>
  <circle cx="365" cy="620" r="8" fill="#f77c83"/>
  <circle cx="435" cy="590" r="8" fill="#f77c83"/>

  <!-- Capybara body and legs -->
  <path d="M343 373 Q365 337 417 345 Q463 350 474 403 L461 495
           Q450 523 416 522 L356 506 Q331 491 331 455Z"
        fill="url(#fur)" stroke="#814d3b" stroke-width="5"/>
  <path d="M356 480 Q371 488 389 488 L386 531 Q384 548 365 548
           Q349 548 350 533Z" fill="#bd7548" stroke="#814d3b" stroke-width="4"/>
  <path d="M422 486 Q441 480 456 467 L461 523 Q462 542 444 547
           Q426 550 420 534Z" fill="#b96d44" stroke="#814d3b" stroke-width="4"/>
  <path d="M351 539 Q367 545 386 539 L389 552 Q370 562 347 553Z"
        fill="#f3b995" stroke="#814d3b" stroke-width="3"/>
  <path d="M423 537 Q442 541 461 531 L466 545 Q447 560 424 551Z"
        fill="#f3b995" stroke="#814d3b" stroke-width="3"/>

  <!-- Head -->
  <path d="M343 252 Q350 211 397 204 Q444 200 466 233
           Q482 257 472 302 Q466 345 432 365
           Q399 381 365 359 Q337 339 334 302Z"
        fill="url(#fur)" stroke="#814d3b" stroke-width="5"/>
  <!-- Ears -->
  <ellipse cx="356" cy="230" rx="17" ry="24" transform="rotate(-24 356 230)"
           fill="#aa6545" stroke="#814d3b" stroke-width="4"/>
  <ellipse cx="450" cy="224" rx="16" ry="22" transform="rotate(22 450 224)"
           fill="#aa6545" stroke="#814d3b" stroke-width="4"/>
  <ellipse cx="356" cy="231" rx="8" ry="12" transform="rotate(-24 356 231)" fill="#f5ae91"/>
  <ellipse cx="450" cy="225" rx="7" ry="11" transform="rotate(22 450 225)" fill="#f5ae91"/>

  <!-- Capybara muzzle and cheerful face -->
  <path d="M361 293 Q368 267 403 266 Q438 266 450 293
           Q447 328 412 339 Q379 337 361 316Z"
        fill="#e5ad83"/>
  <ellipse cx="403" cy="287" rx="31" ry="22" fill="#f1c49a"/>
  <ellipse cx="402" cy="273" rx="15" ry="10" fill="#49383c"/>
  <circle cx="397" cy="270" r="3.5" fill="#fff3da"/>
  <ellipse cx="375" cy="258" rx="5" ry="7" fill="#382e34"/>
  <ellipse cx="431" cy="258" rx="5" ry="7" fill="#382e34"/>
  <path d="M398 300 Q403 307 410 300 M403 307 Q399 319 386 318
           M403 307 Q411 319 423 315"
        fill="none" stroke="#774b45" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="367" cy="302" rx="11" ry="6" fill="#f78f8c" opacity=".65"/>
  <ellipse cx="439" cy="302" rx="11" ry="6" fill="#f78f8c" opacity=".65"/>

  <!-- Balancing paws -->
  <path d="M350 378 Q319 374 300 351 L277 327 Q266 315 275 307
           Q285 300 297 311 L323 331 Q311 314 318 307
           Q328 301 337 316 L365 344Z"
        fill="#c17a4f" stroke="#814d3b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M464 376 Q492 363 509 337 L529 311 Q539 299 549 307
           Q558 315 548 328 L530 351 Q548 338 557 345
           Q565 354 552 365 L520 394 Q493 408 467 405Z"
        fill="#c17a4f" stroke="#814d3b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M275 307 Q267 295 276 289 Q285 285 293 300
           M549 307 Q557 295 548 290 Q539 286 532 301"
        fill="#f0bc94" stroke="#814d3b" stroke-width="4" stroke-linecap="round"/>

  <!-- Bubbles and tiny glints -->
  <g fill="none" stroke="#dffff4" stroke-width="3" opacity=".8">
    <circle cx="236" cy="256" r="13"/><circle cx="255" cy="216" r="7"/>
    <circle cx="577" cy="262" r="16"/><circle cx="602" cy="216" r="8"/>
    <circle cx="291" cy="447" r="8"/><circle cx="535" cy="458" r="10"/>
  </g>
  <g fill="#fff9d5">
    <path d="M220 330 l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/>
    <path d="M583 376 l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
    <circle cx="306" cy="179" r="3"/><circle cx="518" cy="198" r="3"/>
    <circle cx="564" cy="510" r="3"/><circle cx="246" cy="524" r="3"/>
  </g>
</svg>