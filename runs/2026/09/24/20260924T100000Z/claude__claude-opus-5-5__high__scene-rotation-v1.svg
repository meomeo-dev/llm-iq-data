<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Capybara riding a unicycle on a coral reef</title>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ff3ea"/>
      <stop offset="0.45" stop-color="#2fc3c7"/>
      <stop offset="1" stop-color="#11788b"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe0d8"/>
      <stop offset="1" stop-color="#f3a7a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#e6fffb" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c58a55"/>
      <stop offset="1" stop-color="#8e5c34"/>
    </linearGradient>
  </defs>

  <!-- Water -->
  <rect width="800" height="600" fill="url(#water)"/>
  <path d="M0,0 H800 V38 Q700,56 600,38 T400,38 T200,38 T0,38 Z" fill="#ffffff" opacity="0.25"/>
  <path d="M0,52 Q100,64 200,52 T400,52 T600,52 T800,52" fill="none" stroke="#ffffff"
        stroke-width="2" opacity="0.3"/>

  <!-- Light rays -->
  <g>
    <polygon points="150,0 205,0 330,600 180,600" fill="url(#ray)" opacity="0.6">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="300,0 340,0 430,600 330,600" fill="url(#ray)" opacity="0.6">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="6.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="430,0 490,0 560,600 440,600" fill="url(#ray)" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="590,0 630,0 760,600 670,600" fill="url(#ray)" opacity="0.5">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="5.8s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="40,0 70,0 110,600 20,600" fill="url(#ray)" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="7s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Distant reef silhouettes -->
  <g fill="none" stroke="#6fdcd4" stroke-linecap="round" opacity="0.55">
    <path d="M40,540 C45,480 30,440 50,390" stroke-width="12"/>
    <path d="M45,470 C70,450 80,430 78,405" stroke-width="8"/>
    <path d="M260,530 C255,490 270,470 262,440" stroke-width="10"/>
    <path d="M540,530 C548,490 530,470 542,445" stroke-width="10"/>
    <path d="M760,540 C752,480 772,440 750,395" stroke-width="12"/>
    <path d="M756,470 C730,452 722,430 726,405" stroke-width="8"/>
  </g>

  <!-- Soft glow around subject -->
  <circle cx="400" cy="340" r="220" fill="url(#glow)"/>

  <!-- Sandy floor -->
  <path d="M0,535 Q200,510 400,528 T800,520 L800,600 L0,600 Z" fill="url(#sand)"/>
  <path d="M60,560 Q90,555 120,560 M480,570 Q510,565 540,570 M660,555 Q690,550 720,555"
        fill="none" stroke="#e9959a" stroke-width="2" stroke-linecap="round"/>

  <!-- Brain coral -->
  <ellipse cx="205" cy="532" rx="42" ry="22" fill="#ff8a95"/>
  <path d="M175,528 Q185,518 195,528 T215,528 T235,528 M182,540 Q195,532 208,540 T230,540"
        fill="none" stroke="#e5687a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Anemone -->
  <g stroke="#ffa3ad" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M605,535 C595,515 585,505 580,495"/>
    <path d="M610,535 C605,512 602,500 603,488"/>
    <path d="M615,535 C618,512 624,500 630,490"/>
    <path d="M620,535 C630,518 640,510 648,503"/>
    <path d="M600,535 C588,522 578,518 570,515"/>
  </g>
  <ellipse cx="610" cy="536" rx="20" ry="7" fill="#ff7f8a"/>

  <!-- Seaweed -->
  <g fill="none" stroke="#3fbfa4" stroke-width="6" stroke-linecap="round">
    <path d="M300,540 C290,515 312,500 300,475 C290,455 305,445 300,430"/>
    <path d="M512,535 C522,512 502,498 514,475 C522,458 510,448 516,436"/>
  </g>

  <!-- Starfish on the sand -->
  <path transform="translate(300,560) rotate(15)" fill="#ff6f80"
        d="M0,-10 L2.35,-3.24 L9.5,-3.1 L3.8,1.24 L5.9,8.1 L0,4 L-5.9,8.1 L-3.8,1.24 L-9.5,-3.1 L-2.35,-3.24Z"/>
  <path transform="translate(700,575) rotate(-20) scale(0.8)" fill="#ffb3bb"
        d="M0,-10 L2.35,-3.24 L9.5,-3.1 L3.8,1.24 L5.9,8.1 L0,4 L-5.9,8.1 L-3.8,1.24 L-9.5,-3.1 L-2.35,-3.24Z"/>

  <!-- Left arching coral -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#ff7f8a">
      <path d="M110,580 C80,420 150,240 330,110" stroke-width="34"/>
      <path d="M106,457 C60,430 45,380 60,340" stroke-width="18"/>
      <path d="M115,410 C170,395 190,365 195,335" stroke-width="16"/>
      <path d="M141,334 C100,300 100,255 118,225" stroke-width="16"/>
      <path d="M150,315 C205,305 230,275 235,245" stroke-width="14"/>
      <path d="M215,215 C200,175 215,140 245,120" stroke-width="14"/>
      <path d="M265,172 C290,190 300,215 296,240" stroke-width="12"/>
    </g>
    <g stroke="#ffb8c0" opacity="0.7">
      <path d="M104,560 C80,420 146,248 322,118" stroke-width="8"/>
      <path d="M104,452 C66,428 54,384 64,350" stroke-width="4"/>
      <path d="M140,330 C106,298 106,260 120,234" stroke-width="4"/>
    </g>
  </g>
  <g fill="#ffa3ad">
    <circle cx="60" cy="340" r="11"/>
    <circle cx="195" cy="335" r="10"/>
    <circle cx="118" cy="225" r="10"/>
    <circle cx="235" cy="245" r="9"/>
    <circle cx="245" cy="120" r="9"/>
    <circle cx="296" cy="240" r="8"/>
    <circle cx="330" cy="110" r="18"/>
  </g>

  <!-- Right arching coral (mirrored) -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#ff7f8a">
      <path d="M690,580 C720,420 650,240 470,110" stroke-width="34"/>
      <path d="M694,457 C740,430 755,380 740,340" stroke-width="18"/>
      <path d="M685,410 C630,395 610,365 605,335" stroke-width="16"/>
      <path d="M659,334 C700,300 700,255 682,225" stroke-width="16"/>
      <path d="M650,315 C595,305 570,275 565,245" stroke-width="14"/>
      <path d="M585,215 C600,175 585,140 555,120" stroke-width="14"/>
      <path d="M535,172 C510,190 500,215 504,240" stroke-width="12"/>
    </g>
    <g stroke="#ffb8c0" opacity="0.7">
      <path d="M696,560 C720,420 654,248 478,118" stroke-width="8"/>
      <path d="M696,452 C734,428 746,384 736,350" stroke-width="4"/>
      <path d="M660,330 C694,298 694,260 680,234" stroke-width="4"/>
    </g>
  </g>
  <g fill="#ffa3ad">
    <circle cx="740" cy="340" r="11"/>
    <circle cx="605" cy="335" r="10"/>
    <circle cx="682" cy="225" r="10"/>
    <circle cx="565" cy="245" r="9"/>
    <circle cx="555" cy="120" r="9"/>
    <circle cx="504" cy="240" r="8"/>
    <circle cx="470" cy="110" r="18"/>
  </g>

  <!-- Fish -->
  <g transform="translate(630,160)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;14 -5;0 0"
                        dur="4s" repeatCount="indefinite"/>
      <path d="M0,0 C10,-12 32,-12 40,0 C32,12 10,12 0,0Z" fill="#ff8f9b"/>
      <path d="M0,0 L-13,-10 L-9,0 L-13,10Z" fill="#ff8f9b"/>
      <path d="M16,-7 Q19,0 16,7" fill="none" stroke="#ffd1d6" stroke-width="2"/>
      <circle cx="31" cy="-2" r="2.2" fill="#23364a"/>
    </g>
  </g>
  <g transform="translate(150,110) scale(0.8)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;12 4;0 0"
                        dur="5s" repeatCount="indefinite"/>
      <path d="M0,0 C10,-12 32,-12 40,0 C32,12 10,12 0,0Z" fill="#ffd1d6"/>
      <path d="M0,0 L-13,-10 L-9,0 L-13,10Z" fill="#ffd1d6"/>
      <circle cx="31" cy="-2" r="2.2" fill="#23364a"/>
    </g>
  </g>
  <g transform="translate(760,420) scale(-0.7,0.7)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;16 -6;0 0"
                        dur="4.6s" repeatCount="indefinite"/>
      <path d="M0,0 C10,-12 32,-12 40,0 C32,12 10,12 0,0Z" fill="#ff7f8a"/>
      <path d="M0,0 L-13,-10 L-9,0 L-13,10Z" fill="#ff7f8a"/>
      <circle cx="31" cy="-2" r="2.2" fill="#23364a"/>
    </g>
  </g>

  <!-- Wheel shadow -->
  <ellipse cx="400" cy="531" rx="62" ry="7" fill="#0b5a66" opacity="0.3"/>

  <!-- Capybara on unicycle, gently wobbling -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      values="-3 400 528;3 400 528;-3 400 528" dur="4s" repeatCount="indefinite"/>

    <!-- Wheel -->
    <circle cx="400" cy="470" r="56" fill="none" stroke="#24384a" stroke-width="10"/>
    <circle cx="400" cy="470" r="48" fill="none" stroke="#ff7f8a" stroke-width="3"/>
    <g stroke="#e8fbf8" stroke-width="2">
      <line x1="352" y1="470" x2="448" y2="470"/>
      <line x1="400" y1="422" x2="400" y2="518"/>
      <line x1="366" y1="436" x2="434" y2="504"/>
      <line x1="434" y1="436" x2="366" y2="504"/>
    </g>

    <!-- Far leg -->
    <path d="M378,350 C372,390 378,420 378,446" fill="none" stroke="#7a4c2a"
          stroke-width="15" stroke-linecap="round"/>
    <ellipse cx="376" cy="450" rx="11" ry="6" fill="#5a3a22"/>

    <!-- Frame and cranks -->
    <path d="M400,372 L400,470" stroke="#ff5f73" stroke-width="9" stroke-linecap="round"/>
    <line x1="400" y1="470" x2="378" y2="446" stroke="#24384a" stroke-width="5" stroke-linecap="round"/>
    <line x1="400" y1="470" x2="424" y2="494" stroke="#24384a" stroke-width="5" stroke-linecap="round"/>
    <rect x="366" y="443" width="22" height="6" rx="2" fill="#24384a"/>
    <rect x="413" y="491" width="22" height="6" rx="2" fill="#24384a"/>
    <circle cx="400" cy="470" r="7" fill="#ffb8c0" stroke="#24384a" stroke-width="2"/>

    <!-- Saddle -->
    <path d="M360,370 Q395,354 434,366 Q432,382 398,382 Q366,382 360,370Z" fill="#33475b"/>

    <!-- Back arm raised for balance -->
    <path d="M352,292 Q322,268 306,240" fill="none" stroke="#9c6a3e" stroke-width="13"
          stroke-linecap="round"/>
    <circle cx="305" cy="238" r="8" fill="#7a4c2a"/>

    <!-- Body -->
    <path d="M330,330 C325,285 360,262 410,262 C455,262 470,290 468,320
             C466,355 435,372 395,372 C355,372 333,355 330,330Z" fill="url(#fur)"/>
    <path d="M360,300 l6,-6 M380,290 l6,-6 M350,325 l6,-5 M395,305 l6,-6"
          stroke="#7a4c2a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Near leg -->
    <ellipse cx="420" cy="343" rx="30" ry="23" fill="#a06b3d"/>
    <path d="M424,352 C428,400 422,450 424,490" fill="none" stroke="#a06b3d"
          stroke-width="17" stroke-linecap="round"/>
    <ellipse cx="426" cy="494" rx="12" ry="6" fill="#5a3a22"/>

    <!-- Front arm reaching forward -->
    <path d="M452,300 Q484,316 500,338" fill="none" stroke="#a06b3d" stroke-width="13"
          stroke-linecap="round"/>
    <circle cx="502" cy="341" r="8" fill="#7a4c2a"/>

    <!-- Head -->
    <path d="M438,262 C440,232 468,214 502,218 C535,222 548,244 546,268
             C544,292 520,300 492,298 C462,296 437,290 438,262Z" fill="#b57e4b"/>
    <ellipse cx="462" cy="223" rx="9" ry="7" fill="#7a4c2a"/>
    <ellipse cx="538" cy="258" rx="9" ry="12" fill="#5a3a22"/>
    <ellipse cx="540" cy="252" rx="2" ry="3" fill="#2a1b10"/>
    <circle cx="496" cy="246" r="5" fill="#1f2a36"/>
    <circle cx="497.8" cy="244" r="1.6" fill="#ffffff"/>
    <ellipse cx="510" cy="273" rx="10" ry="6" fill="#ff9fa8" opacity="0.6"/>
    <path d="M526,282 Q533,288 540,282" fill="none" stroke="#5a3a22" stroke-width="2"
          stroke-linecap="round"/>

    <!-- Starfish hat -->
    <path transform="translate(485,214) rotate(-12) scale(1.1)" fill="#ff6f80"
          d="M0,-10 L2.35,-3.24 L9.5,-3.1 L3.8,1.24 L5.9,8.1 L0,4 L-5.9,8.1 L-3.8,1.24 L-9.5,-3.1 L-2.35,-3.24Z"/>
  </g>

  <!-- Bubbles from the capybara's nose -->
  <g fill="url(#bubble)" stroke="#ffffff" stroke-width="1" opacity="0.9">
    <circle cx="556" r="5">
      <animate attributeName="cy" from="245" to="-20" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="566" r="3.5">
      <animate attributeName="cy" from="250" to="-20" dur="5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" r="7">
      <animate attributeName="cy" from="240" to="-20" dur="7s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Ambient bubbles -->
  <g fill="url(#bubble)" stroke="#ffffff" stroke-width="1" opacity="0.8">
    <circle cx="90" r="6">
      <animate attributeName="cy" from="560" to="-20" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" r="4">
      <animate attributeName="cy" from="520" to="-20" dur="8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" r="5">
      <animate attributeName="cy" from="540" to="-20" dur="10s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" r="3">
      <animate attributeName="cy" from="530" to="-20" dur="7s" begin="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <path transform="translate(360,150)" d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5Z">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(440,190) scale(0.7)" d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5Z">
      <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(270,300) scale(0.8)" d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5Z">
      <animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(560,380) scale(0.9)" d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5Z">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>