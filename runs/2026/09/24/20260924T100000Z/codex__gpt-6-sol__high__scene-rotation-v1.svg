<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"
     role="img" aria-labelledby="title desc">
  <title id="title">Capybara riding a unicycle through a coral reef</title>
  <desc id="desc">A playful capybara pedals underwater between arching pink
    corals, with turquoise water, bubbles, and shimmering rays of sunlight.</desc>

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#70dbd3"/>
      <stop offset=".48" stop-color="#3ab7b8"/>
      <stop offset="1" stop-color="#126e83"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d5" stop-opacity=".48"/>
      <stop offset="1" stop-color="#fff8d5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#c99365"/>
      <stop offset=".6" stop-color="#ab704e"/>
      <stop offset="1" stop-color="#8c5843"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb5ad"/>
      <stop offset="1" stop-color="#e66d87"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e4fff1" stop-opacity=".42"/>
      <stop offset="1" stop-color="#e4fff1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

