    <path d="M776 451q-24 0-43 9"/>
    <path d="M776 456q-21 8-33 21"/>
    <path d="M782 452q-5-15-17-24"/>
  </g>

  <!-- Bubbles and little points of light -->
  <g fill="none" stroke="#dbfff3" opacity=".75">
    <circle cx="386" cy="579" r="15" stroke-width="3"/>
    <circle cx="360" cy="539" r="7" stroke-width="2"/>
    <circle cx="823" cy="333" r="10" stroke-width="2.5"/>
    <circle cx="850" cy="299" r="5" stroke-width="2"/>
    <circle cx="911" cy="565" r="17" stroke-width="3"/>
    <circle cx="940" cy="532" r="7" stroke-width="2"/>
    <circle cx="705" cy="572" r="7" stroke-width="2"/>
