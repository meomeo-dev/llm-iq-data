<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"
     role="img" aria-labelledby="title description">
  <title id="title">Capybara riding a unicycle through a coral reef</title>
  <desc id="description">
    A cheerful capybara pedals beneath shimmering underwater light rays,
    framed by arching pink corals in a turquoise sea.
  </desc>

  <defs>
    <linearGradient id="water" x2="0" y2="1">
      <stop offset="0" stop-color="#67ded8"/>
      <stop offset=".48" stop-color="#3cb8bb"/>
      <stop offset="1" stop-color="#126b83"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff9cf" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#d7fff2" stop-opacity=".27"/>
      <stop offset="1" stop-color="#d7fff2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lightRay" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9d7" stop-opacity=".43"/>
      <stop offset="1" stop-color="#fff9d7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc0bc"/>
      <stop offset=".55" stop-color="#f48fa5"/>
      <stop offset="1" stop-color="#da638e"/>
    </linearGradient>
    <linearGradient id="coralDark" x2="0" y2="1">
      <stop offset="0" stop-color="#eb7e9d"/>
      <stop offset="1" stop-color="#a94d83"/>
    </linearGradient>
    <linearGradient id="sand" x2="0" y2="1">
      <stop offset="0" stop-color="#f7cbb5"/>
      <stop offset="1" stop-color="#db9daa"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9bd84"/>
      <stop offset=".55" stop-color="#c98f65"/>
      <stop offset="1" stop-color="#9e654e"/>
    </linearGradient>
    <linearGradient id="headFur" x2="0" y2="1">
      <stop offset="0" stop-color="#eac391"/>
      <stop offset="1" stop-color="#bd805d"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sunlit water -->
  <path fill="url(#water)" d="M0 0h1200v900H0z"/>
  <ellipse cx="609" cy="165" rx="490" ry="420" fill="url(#sunGlow)"/>
  <g fill="url(#lightRay)">
    <path d="M275 25h58L553 790 386 707z"/>
    <path d="M455 15h48l102 776-93-65z"/>
    <path d="M640 5h42L636 776l-65-86z"/>
    <path d="M807 15h56L708 785l-55-78z"/>
    <path d="M989 30h63L763 782l-18-106z"/>
  </g>
  <path d="M0 71 Q90 52 183 70 T371 69 T558 67 T749 65
           T941 69 T1200 63"
        fill="none" stroke="#d5fff1" stroke-width="8" opacity=".65"/>
  <path d="M0 94 Q97 78 190 95 T379 91 T568 94 T758 89
           T953 94 T1200 85"
        fill="none" stroke="#b9f7ed" stroke-width="3" opacity=".45"/>
  <g fill="none" stroke="#edfff0" stroke-linecap="round" opacity=".3">
    <path d="M392 132q42-12 84 0" stroke-width="4"/>
    <path d="M695 115q58-16 105 0" stroke-width="3"/>
    <path d="M867 177q40-10 80 0" stroke-width="3"/>
  </g>

  <!-- Distant reef and drifting fish -->
  <path d="M0 725 Q94 680 175 719 T343 728 T521 700 T700 724
           T883 689 T1062 725 T1200 698V900H0Z"
        fill="#2c8798" opacity=".33"/>
  <path d="M0 772 Q121 713 242 766 T480 750 T730 767
           T958 744 T1200 753V900H0Z"
        fill="#1b738b" opacity=".36"/>
  <g fill="#b6f7e8" opacity=".56">
    <path d="M161 465q18-13 38 0-20 13-38 0l-14-11v22z"/>
    <path d="M232 514q11-9 25 0-14 9-25 0l-9-8v16z"/>
    <path d="M1000 414q-18-13-38 0 20 13 38 0l14-11v22z"/>
    <path d="M929 472q-12-9-27 0 15 9 27 0l10-8v16z"/>
  </g>

  <!-- Sandy floor -->
  <path d="M0 802 Q190 786 350 806 T685 801 T990 807
           T1200 796V900H0Z" fill="url(#sand)"/>
  <path d="M0 823 Q240 811 420 827 T770 825 T1200 815"
        fill="none" stroke="#ffe5ca" stroke-width="5" opacity=".45"/>
  <g fill="#ffe6d5" opacity=".55">
    <ellipse cx="105" cy="846" rx="20" ry="4"/>
    <ellipse cx="344" cy="861" rx="14" ry="3"/>
    <ellipse cx="836" cy="846" rx="18" ry="4"/>
    <ellipse cx="1088" cy="862" rx="22" ry="4"/>
  </g>

  <!-- Arching corals -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#a75182" opacity=".4">
      <path d="M-13 813 C72 682 55 519 173 359
               C239 270 318 221 411 221" stroke-width="54"/>
      <path d="M1214 811 C1121 657 1135 515 1018 355
               C947 259 874 222 785 223" stroke-width="54"/>
    </g>
    <g stroke="url(#coral)">
      <path d="M-13 813 C72 682 55 519 173 359
               C239 270 318 221 411 221" stroke-width="40"/>
      <path d="M1214 811 C1121 657 1135 515 1018 355
               C947 259 874 222 785 223" stroke-width="40"/>
      <path d="M94 507 C49 456 43 390 53 327" stroke-width="23"/>
      <path d="M169 366 C126 319 114 272 124 235" stroke-width="21"/>
      <path d="M245 283 C214 240 211 194 229 159" stroke-width="17"/>
      <path d="M329 232 C321 185 337 143 365 119" stroke-width="15"/>
      <path d="M1056 500 C1118 445 1135 388 1123 324" stroke-width="23"/>
      <path d="M1015 358 C1069 309 1078 265 1070 225" stroke-width="21"/>
      <path d="M944 275 C973 233 975 188 957 153" stroke-width="17"/>
      <path d="M865 232 C872 186 855 149 830 122" stroke-width="15"/>
    </g>
    <g stroke="#ffd8cb" opacity=".7">
      <path d="M-1 759 C84 625 68 488 184 350
               C246 278 320 234 388 231" stroke-width="7"/>
      <path d="M1200 759 C1113 618 1120 486 1008 351
               C943 276 874 234 805 233" stroke-width="7"/>
    </g>
  </g>
  <g fill="#ffd4ca">
    <circle cx="411" cy="221" r="13"/>
    <circle cx="53" cy="327" r="10"/>
    <circle cx="124" cy="235" r="9"/>
    <circle cx="229" cy="159" r="8"/>
    <circle cx="365" cy="119" r="7"/>
    <circle cx="785" cy="223" r="13"/>
    <circle cx="1123" cy="324" r="10"/>
    <circle cx="1070" cy="225" r="9"/>
    <circle cx="957" cy="153" r="8"/>
    <circle cx="830" cy="122" r="7"/>
  </g>
  <g fill="#fff0d9" opacity=".78">
