        fill="#195c70" stroke="#073f58" stroke-width="5"/>
  <path d="M566 534 Q608 526 643 533" fill="none"
        stroke="#f8b5ad" stroke-width="5" stroke-linecap="round"/>
  <path d="M545 721 L655 689" fill="none" stroke="#075a71"
        stroke-width="9" stroke-linecap="round"/>
  <circle cx="600" cy="705" r="15" fill="#ffb7a8"
          stroke="#0a6377" stroke-width="5"/>
  <g fill="#1b6876" stroke="#0b4f61" stroke-width="4">
    <rect x="520" y="714" width="52" height="14" rx="7"/>
    <rect x="629" y="682" width="52" height="14" rx="7"/>
  </g>

  <!-- Legs and paws -->
  <path d="M491 481 Q476 513 490 554 L523 693
           Q527 711 546 719 Q565 725 574 710
           Q572 695 557 691 L548 570 Q545 527 535 495Z"
        fill="#a97054" stroke="#865442" stroke-width="6"/>
  <path d="M628 489 Q650 516 655 554 L660 667
           Q663 678 653 684 Q642 690 633 684
           Q623 674 626 658 L613 566 Q603 529 601 504Z"
        fill="#b57a59" stroke="#865442" stroke-width="6"/>
  <path d="M529 714q17 9 37 3M636 684q17 6 31-2"
        fill="none" stroke="#e4ae85" stroke-width="4" stroke-linecap="round"/>

  <!-- Capybara body -->
  <path d="M465 383 C504 350 586 348 646 372
           C688 389 704 430 686 481
           C670 528 625 552 556 550
           C485 548 429 523 415 478
           C403 441 427 406 465 383Z"
        fill="url(#fur)" stroke="#89583f" stroke-width="7"/>
  <path d="M424 468 Q460 522 542 531 Q622 542 669 499"
        fill="none" stroke="#f2c693" stroke-width="10" opacity=".37"
        stroke-linecap="round"/>
  <path d="M462 403q35-17 69-14M492 424q25-11 48-9
           M452 455q21-6 40-2M559 382q26-5 49 0"
        fill="none" stroke="#f6d2a0" stroke-width="5" opacity=".42"
        stroke-linecap="round"/>
  <path d="M457 499q20 16 49 20M559 519q25 8 48 5"
        fill="none" stroke="#8d5a45" stroke-width="4" opacity=".36"
        stroke-linecap="round"/>

  <!-- Ear behind the head -->
  <path d="M660 360 Q652 331 667 323 Q684 318 691 339
           L692 366Z"
        fill="#bf8261" stroke="#89583f" stroke-width="6"/>
  <path d="M671 349 Q666 336 675 334 Q684 333 684 348Z"
        fill="#eb9b99"/>

  <!-- Head and broad, softly squared muzzle -->
  <path d="M649 373 C669 340 713 329 750 349
           C773 362 780 388 786 409
           C802 416 815 426 820 442
           C827 459 817 476 797 482
           C776 489 743 482 718 475
           C681 465 658 448 651 422
           C644 402 641 387 649 373Z"
        fill="url(#headFur)" stroke="#89583f" stroke-width="7"/>
  <path d="M762 416 Q788 410 806 429 Q820 443 812 459
           Q804 474 781 472 Q755 470 742 452"
        fill="#d59b75" opacity=".92"/>
  <path d="M654 386 Q677 353 715 353"
        fill="none" stroke="#f5d39f" stroke-width="7" opacity=".55"
        stroke-linecap="round"/>
  <path d="M721 348 Q719 325 732 323 Q749 324 751 350"
        fill="#c58a67" stroke="#89583f" stroke-width="5"/>
  <path d="M731 341q4-9 10-6" fill="none" stroke="#edaaa2"
        stroke-width="5" stroke-linecap="round"/>

  <!-- Face -->
  <ellipse cx="738" cy="395" rx="8" ry="10" fill="#3d444a"/>
  <circle cx="740" cy="392" r="2.5" fill="#fff9e9"/>
  <path d="M712 381q12-9 25-5" fill="none" stroke="#8a5945"
        stroke-width="5" stroke-linecap="round"/>
  <path d="M800 440q12-3 17 4q2 10-10 14q-11-2-12-10z"
        fill="#6e4b4b"/>
  <path d="M804 461q-13 12-31 7" fill="none" stroke="#82534a"
        stroke-width="4" stroke-linecap="round"/>
  <circle cx="770" cy="446" r="12" fill="#f2a29b" opacity=".38"/>
  <g fill="none" stroke="#805848" stroke-width="2.5"
