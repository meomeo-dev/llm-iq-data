    <circle cx="249" cy="280" r="4"/>
    <circle cx="324" cy="237" r="3"/>
    <circle cx="1019" cy="355" r="4"/>
    <circle cx="945" cy="273" r="4"/>
    <circle cx="867" cy="235" r="3"/>
  </g>

  <!-- Sea plants and small anemones -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#62cbbd" stroke-width="13">
      <path d="M158 810 Q117 746 142 680"/>
      <path d="M168 808 Q191 742 173 693"/>
      <path d="M1017 812 Q1045 743 1028 677"/>
      <path d="M1035 815 Q998 756 1002 706"/>
    </g>
    <g stroke="#a5ead4" stroke-width="5">
      <path d="M142 680q-21 24-17 45"/>
      <path d="M173 693q26 17 25 37"/>
      <path d="M1028 677q22 21 19 41"/>
      <path d="M1002 706q-23 18-23 36"/>
    </g>
    <g stroke="#f8a2ad" stroke-width="10">
      <path d="M296 806q-24-35-19-72"/>
      <path d="M296 806q5-44 30-70"/>
      <path d="M296 806q-5-47-1-83"/>
      <path d="M898 805q-17-42-10-78"/>
      <path d="M898 805q11-49 34-69"/>
      <path d="M898 805q-4-43 6-82"/>
    </g>
  </g>

  <!-- Unicycle shadow and wheel -->
  <ellipse cx="600" cy="818" rx="135" ry="20" fill="#695979" opacity=".23"
           filter="url(#softGlow)"/>
  <circle cx="600" cy="705" r="105" fill="#d8fff0" opacity=".08"/>
  <circle cx="600" cy="705" r="105" fill="none" stroke="#0a667d"
          stroke-width="17"/>
  <circle cx="600" cy="705" r="105" fill="none" stroke="#ffc4b9"
          stroke-width="7"/>
  <circle cx="600" cy="705" r="93" fill="none" stroke="#9fe5d7"
          stroke-width="2" opacity=".75"/>
  <g stroke="#d6fff0" stroke-width="2" opacity=".62">
    <path d="M600 705V607M600 705V803M600 705H502M600 705h98"/>
    <path d="M600 705l-69-69M600 705l69 69M600 705l69-69M600 705l-69 69"/>
    <path d="M600 705l-38-90M600 705l38 90M600 705l90-38M600 705l-90 38"/>
    <path d="M600 705l38-90M600 705l-38 90M600 705l90 38M600 705l-90-38"/>
  </g>

  <!-- Unicycle frame, saddle, and pedals -->
  <path d="M607 530 L600 705" fill="none" stroke="#075a71"
        stroke-width="18" stroke-linecap="round"/>
  <path d="M607 533 L600 694" fill="none" stroke="#8ce4d8"
        stroke-width="6" stroke-linecap="round"/>
  <path d="M551 535 Q597 519 657 533 Q649 548 621 551
