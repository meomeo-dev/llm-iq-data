  <g fill="#edfff2" opacity=".9">
    <circle cx="381" cy="572" r="3"/>
    <circle cx="817" cy="327" r="2"/>
    <circle cx="905" cy="558" r="3"/>
  </g>
  <g stroke="#fff5dc" stroke-linecap="round">
    <path d="M392 314v24m-12-12h24" stroke-width="4"
          filter="url(#smallGlow)"/>
    <path d="M392 314v24m-12-12h24" stroke-width="2.5"/>
    <path d="M864 605v18m-9-9h18" stroke-width="3"/>
    <path d="M458 609v14m-7-7h14" stroke-width="2.5"/>
    <path d="M742 270v12m-6-6h12" stroke-width="2"/>
  </g>
</svg>