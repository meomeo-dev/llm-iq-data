<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">A Capybara’s Underwater Unicycle Adventure</title>
  <desc id="desc">A smiling capybara rides a unicycle through a turquoise coral reef, framed by arching pink corals and shimmering rays from the surface.</desc>
  <defs>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#a4f7eb"/>
      <stop offset=".4" stop-color="#3cc9cb"/>
      <stop offset="1" stop-color="#116e8b"/>
    </linearGradient>
    <linearGradient id="sand" x2="0" y2="1">
      <stop stop-color="#aae4d7"/>
      <stop offset="1" stop-color="#58aeb7"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
