<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
<title>Capybara riding a unicycle through a coral reef</title>
<style>
.ray{animation:sh 5s ease-in-out infinite}
.tw{fill:#fff;animation:sh 3s ease-in-out infinite}
@keyframes sh{50%{opacity:.3}}
.wave{animation:wv 8s linear infinite}
@keyframes wv{to{transform:translateX(-100px)}}
.b{fill:#E8FFFD;fill-opacity:.3;stroke:#fff;stroke-opacity:.9;stroke-width:1.3;animation:rise 4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.sw{animation:sw 7s ease-in-out infinite}
@keyframes sw{50%{transform:translateX(16px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#B8F6EF"/><stop offset=".3" stop-color="#5FD7CF"/>
<stop offset=".72" stop-color="#22A8AD"/><stop offset="1" stop-color="#0F7084"/>
</linearGradient>
<linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity=".8"/>
<stop offset=".55" stop-color="#fff" stop-opacity=".2"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFE6D9"/><stop offset="1" stop-color="#F3B7A7"/>
</linearGradient>
<radialGradient id="glow">
<stop offset="0" stop-color="#fff" stop-opacity=".45"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="vig" cx=".5" cy=".45" r=".75">
<stop offset=".6" stop-color="#053C4A" stop-opacity="0"/>
<stop offset="1" stop-color="#053C4A" stop-opacity=".5"/>
</radialGradient>
<radialGradient id="fur" cx=".4" cy=".3" r=".8">
<stop offset="0" stop-color="#CC9262"/><stop offset="1" stop-color="#93603A"/>
</radialGradient>
<radialGradient id="jel" cx=".5" cy=".3" r=".7">
<stop offset="0" stop-color="#FFE6EA"/><stop offset="1" stop-color="#FF7D93"/>
</radialGradient>
<filter id="soft" x="-20%" y="-10%" width="140%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="haze"><feGaussianBlur stdDeviation="1.8"/></filter>
<path id="trunk" d="M95 585C70 470 60 330 120 220C170 130 260 85 355 78"/>
<path id="br" d="M80 495Q40 470 38 428M54 472Q28 462 20 440M78 400Q122 385 132 345M113 379Q140 392 152 378
M87 307Q44 285 42 240M59 286Q34 280 26 256M120 222Q98 170 112 128M107 177Q76 152 72 118
M164 161Q172 112 150 72M165 114Q190 100 196 72M222 118Q240 82 228 42M232 81Q256 70 262 44M318 80Q324 56 312 36"/>
<path id="hang" d="M285 90Q305 122 292 160M297 124Q314 130 318 148M636 161Q612 188 618 226"/>
<g id="arch" fill="none" stroke-linecap="round">
<use xlink:href="#trunk" stroke="#C9446A" stroke-width="34"/>
<use xlink:href="#br" stroke="#C9446A" stroke-width="20"/>
<use xlink:href="#trunk" stroke="#FF7B8F" stroke-width="26"/>
<use xlink:href="#br" stroke="#FF7B8F" stroke-width="14"/>
<g stroke="#FFC4CB" opacity=".85" transform="translate(-3 -3)">
<use xlink:href="#trunk" stroke-width="8"/><use xlink:href="#br" stroke-width="4"/>
</g>
<use xlink:href="#trunk" stroke="#FFE3E6" stroke-width="5" stroke-dasharray="0 15" transform="translate(4 3)"/>
<use xlink:href="#br" stroke="#FFE3E6" stroke-width="3" stroke-dasharray="0 10" opacity=".8"/>
</g>
<g id="fish">
<path d="M0 0C6-9 22-10 30-3C33 0 33 1 30 3C22 10 6 9 0 0ZM3 0L-9 8-6 0-9-8Z"/>
<circle cx="23" cy="-2" r="1.7" fill="#173848"/>
</g>
<path id="star" d="M0-14L3.5-4.9 13.3-4.3 5.7 1.9 8.2 11.3 0 6-8.2 11.3-5.7 1.9-13.3-4.3-3.5-4.9Z" stroke-width="4" stroke-linejoin="round"/>
</defs>

<rect width="800" height="600" fill="url(#sea)"/>

<!-- surface shimmer -->
<g class="wave" fill="none">
<path fill="#fff" opacity=".35" d="M0 0V26q25-10 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0V0Z"/>
<path stroke="#fff" stroke-width="2" opacity=".45" d="M0 44q25-7 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0"/>
</g>

<!-- distant reef -->
<g filter="url(#haze)" opacity=".55" fill="#2A9CA1" stroke="#2A9CA1">
<path stroke="none" d="M0 478C40 440 90 450 120 470C150 432 200 440 230 466C270 446 300 456 330 476C380 460 420 470 470 478C520 452 560 456 590 470C630 440 680 446 710 468C740 450 780 456 800 464V540H0Z"/>
<path fill="none" stroke-width="8" stroke-linecap="round" d="M250 470V428M250 446L236 430M250 454L266 434M560 470V424M560 440L545 426M560 450L574 430"/>
</g>

<!-- light rays -->
<g filter="url(#soft)" fill="url(#ray)">
<path class="ray" opacity=".5" d="M180 0H215L-107 600H-195Z"/>
<path class="ray" opacity=".6" style="animation-duration:6.5s" d="M270 0H320L155 600H30Z"/>
<path class="ray" opacity=".9" style="animation-duration:4.2s;animation-delay:-1s" d="M372 0H428L425 600H285Z"/>
<path class="ray" opacity=".6" style="animation-duration:5.6s;animation-delay:-2s" d="M440 0H470L530 600H455Z"/>
<path class="ray" opacity=".55" style="animation-duration:7s;animation-delay:-3s" d="M540 0H575L792 600H705Z"/>
<path class="ray" opacity=".45" style="animation-duration:6s;animation-delay:-1.5s" d="M640 0H690L1080 600H955Z"/>
</g>
<ellipse cx="410" cy="320" rx="230" ry="250" fill="url(#glow)"/>

<!-- seabed -->
<path fill="url(#sand)" d="M0 528Q150 505 300 520T600 518T800 512V600H0Z"/>
<path fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round" d="M40 562q20-8 40 0t40 0M180 578q18-7 36 0t36 0M450 568q20-8 40 0t40 0M620 582q18-7 36 0t36 0M300 590q20-8 40 0"/>

<!-- seaweed -->
<g fill="none" stroke-linecap="round">
<path stroke="#23AE9F" stroke-width="7" d="M34 600C14 560 56 530 34 490S48 430 30 398">
<animateTransform attributeName="transform" type="rotate" values="-3 34 600;3 34 600;-3 34 600" dur="6s" repeatCount="indefinite"/>
</path>
<path stroke="#23AE9F" stroke-width="7" d="M770 600C790 560 748 530 770 490S756 430 774 402">
<animateTransform attributeName="transform" type="rotate" values="3 770 600;-3 770 600;3 770 600" dur="7s" repeatCount="indefinite"/>
</path>
<path stroke="#5FDACB" stroke-width="5" d="M752 600C740 570 764 548 750 520"/>
</g>

<!-- coral arch -->
<g fill="none" stroke-linecap="round">
<use xlink:href="#hang" stroke="#C9446A" stroke-width="20"/>
<use xlink:href="#hang" stroke="#FF7B8F" stroke-width="14"/>
<use xlink:href="#hang" stroke="#FFC4CB" stroke-width="4" transform="translate(-3 -3)"/>
</g>
<use xlink:href="#arch"/>
<use xlink:href="#arch" transform="matrix(-1 0 0 1 800 0)"/>

<!-- foreground reef -->
<path fill="#FF9FAB" stroke="#E0607A" stroke-width="2" d="M132 562Q136 512 190 510Q244 512 248 562Z"/>
<path fill="none" stroke="#E0607A" stroke-width="2" stroke-linecap="round" d="M146 548q11-10 22 0t22 0t22 0t22 0M156 533q11-9 22 0t22 0t22 0M172 520q9-6 18 0t18 0"/>
<g stroke="#249C9A" stroke-width="2">
<rect x="612" y="492" width="22" height="70" rx="11" fill="#4FD3CA"/>
<rect x="638" y="468" width="26" height="94" rx="13" fill="#66DED4"/>
<rect x="668" y="500" width="20" height="62" rx="10" fill="#4FD3CA"/>
</g>
<g fill="#1B7F84">
<ellipse cx="623" cy="500" rx="7" ry="3"/><ellipse cx="651" cy="477" rx="9" ry="3.5"/><ellipse cx="678" cy="507" rx="6" ry="2.6"/>
</g>
<use xlink:href="#star" transform="translate(575 556) rotate(-15)" fill="#FF7B8F" stroke="#FF7B8F"/>
<circle cx="575" cy="556" r="2.5" fill="#FFD0D6"/>
<g fill="#F2C2B2"><ellipse cx="470" cy="548" rx="6" ry="3"/><ellipse cx="300" cy="546" rx="5" ry="2.5"/><ellipse cx="520" cy="585" rx="4" ry="2"/></g>

<!-- fish -->
<g class="sw"><use xlink:href="#fish" transform="translate(172 300) scale(1.2)" fill="#FF8C9E"/></g>
<g class="sw" style="animation-delay:-3s">
<use xlink:href="#fish" transform="translate(212 214) scale(.6)" fill="#FFE0E4"/>
<use xlink:href="#fish" transform="translate(234 227) scale(.55)" fill="#FFE0E4"/>
<use xlink:href="#fish" transform="translate(208 238) scale(.5)" fill="#FFE0E4"/>
</g>
<g class="sw" style="animation-delay:-5s"><use xlink:href="#fish" transform="translate(640 318) scale(-1.1 1.1)" fill="#EFFFFD"/></g>

<!-- bubbles and plankton sparkles -->
<circle class="b" cx="262" cy="500" r="4"/>
<circle class="b" cx="268" cy="472" r="3" style="animation-delay:-1.3s"/>
<circle class="b" cx="260" cy="444" r="5" style="animation-delay:-2.6s"/>
<circle class="b" cx="267" cy="416" r="2.6" style="animation-delay:-.7s"/>
<circle class="b" cx="588" cy="470" r="3.5" style="animation-delay:-2s"/>
<circle class="b" cx="582" cy="442" r="2.5" style="animation-delay:-3.2s"/>
<circle class="b" cx="590" cy="414" r="4.5" style="animation-delay:-.4s"/>
<circle class="tw" cx="250" cy="300" r="1.6"/>
<circle class="tw" cx="560" cy="390" r="1.8" style="animation-delay:-1s"/>
<circle class="tw" cx="300" cy="420" r="1.3" style="animation-delay:-2s"/>
<circle class="tw" cx="530" cy="340" r="1.5" style="animation-delay:-.5s"/>
<circle class="tw" cx="170" cy="390" r="1.7" style="animation-delay:-1.5s"/>
<circle class="tw" cx="345" cy="140" r="1.5" style="animation-delay:-2.5s"/>
<circle class="tw" cx="475" cy="128" r="1.3" style="animation-delay:-.8s"/>
<circle class="tw" cx="600" cy="440" r="1.6" style="animation-delay:-1.8s"/>
<circle class="tw" cx="228" cy="455" r="1.4" style="animation-delay:-2.2s"/>
<circle class="tw" cx="590" cy="262" r="1.5" style="animation-delay:-1.2s"/>
<circle class="tw" cx="400" cy="120" r="2" style="animation-delay:-.3s"/>

<!-- ground shadow, sand puffs, speed lines -->
<ellipse cx="400" cy="527" rx="62" ry="7" fill="#C98C80" opacity=".45"/>
<g fill="#FFF1EA" opacity=".8">
<circle cx="340" cy="518" r="8"/><circle cx="325" cy="511" r="5.5"/><circle cx="313" cy="504" r="3.5"/>
</g>

<!-- far limbs, waving arm -->
<g fill="none" stroke-linecap="round">
<path d="M340 445H318M336 470H310M338 495H318" stroke="#E6FFFC" stroke-width="3" opacity=".75"/>
<path d="M386 268Q352 244 342 198" stroke="#7A4A2A" stroke-width="17"/>
<path d="M328 186q-7 8-2 18M320 180q-9 11-3 25" stroke="#fff" stroke-width="2" opacity=".85"/>
<path d="M400 474L386 457" stroke="#173848" stroke-width="5"/>
</g>
<circle cx="342" cy="198" r="7.5" fill="#5E3920"/>
<rect x="378" y="454" width="16" height="6" rx="2" fill="#173848"/>
<path d="M378 366Q366 412 386 454" fill="none" stroke="#6E4529" stroke-width="15" stroke-linecap="round"/>
<ellipse cx="389" cy="458" rx="9" ry="5" fill="#4A2E1A"/>

<!-- unicycle -->
<circle cx="400" cy="474" r="46" fill="none" stroke="#173848" stroke-width="9"/>
<path d="M364.8 444.4A46 46 0 0 1 419.4 432.3" fill="none" stroke="#4E7A8C" stroke-width="3" stroke-linecap="round"/>
<circle cx="400" cy="474" r="40" fill="none" stroke="#FF8FA0" stroke-width="3"/>
<g stroke="#E6FFFC" stroke-width="1.6">
<path d="M360 474H440M400 434V514M371.7 445.7L428.3 502.3M428.3 445.7L371.7 502.3"/>
<animateTransform attributeName="transform" type="rotate" from="0 400 474" to="360 400 474" dur="2.5s" repeatCount="indefinite"/>
</g>
<circle cx="400" cy="474" r="6" fill="#173848"/><circle cx="400" cy="474" r="2.2" fill="#FF8FA0"/>
<path d="M400 474L389 392" stroke="#2FC4BB" stroke-width="8" stroke-linecap="round"/>
<path d="M398 469L388.5 398" stroke="#B4F6F0" stroke-width="2" stroke-linecap="round"/>
<rect x="383" y="415" width="20" height="8" rx="3" fill="#23A89F" transform="rotate(-8 393 419)"/>
<path d="M400 474L414 491" stroke="#173848" stroke-width="5" stroke-linecap="round"/>
<rect x="405" y="489" width="18" height="6" rx="2" fill="#173848"/>
<path d="M356 388Q384 377 414 384Q418 395 386 396Q358 397 356 388Z" fill="#FF6F86" stroke="#C9446A" stroke-width="2"/>

<!-- capybara body -->
<ellipse cx="392" cy="305" rx="64" ry="78" transform="rotate(12 392 305)" fill="url(#fur)" stroke="#7A4A2A" stroke-width="2"/>
<ellipse cx="428" cy="318" rx="24" ry="48" transform="rotate(12 428 318)" fill="#DDA877" opacity=".5"/>
<path d="M350 268q6-6 12-4M343 298q6-6 12-4M350 328q6-6 12-4" fill="none" stroke="#7A4A2A" stroke-width="2" stroke-linecap="round" opacity=".55"/>
<path d="M410 364Q430 420 416 486" fill="none" stroke="#8E5B35" stroke-width="17" stroke-linecap="round"/>
<ellipse cx="421" cy="490" rx="12" ry="6" fill="#5A3A22"/>
<ellipse cx="398" cy="352" rx="36" ry="27" transform="rotate(25 398 352)" fill="url(#fur)" stroke="#7A4A2A" stroke-width="2"/>

<!-- capybara head -->
<ellipse cx="420" cy="178" rx="8" ry="10" transform="rotate(-10 420 178)" fill="#6E4529"/>
<ellipse cx="404" cy="186" rx="10" ry="12" transform="rotate(-25 404 186)" fill="#8A5733"/>
<ellipse cx="405" cy="188" rx="5" ry="7" transform="rotate(-25 405 188)" fill="#5E3920"/>
<path d="M392 202C400 180 440 170 468 176C492 180 512 186 518 204C524 222 518 244 500 250C475 258 440 262 415 255C390 248 382 224 392 202Z" fill="url(#fur)" stroke="#7A4A2A" stroke-width="2"/>
<path d="M500 189C514 193 520 202 521 212C523 228 517 244 502 250C495 236 494 204 500 189Z" fill="#6E4529" opacity=".25"/>
<path d="M410 214q6-5 12-3M405 230q6-5 12-3" fill="none" stroke="#7A4A2A" stroke-width="2" stroke-linecap="round" opacity=".5"/>
<ellipse cx="455" cy="197" rx="5.5" ry="6.5" fill="#23140B"/>
<circle cx="457" cy="194.5" r="2" fill="#fff"/>
<ellipse cx="510" cy="199" rx="4.2" ry="2.4" transform="rotate(-25 510 199)" fill="#3A2416"/>
<path d="M494 233Q505 242 514 231" fill="none" stroke="#3A2416" stroke-width="2.2" stroke-linecap="round"/>
<ellipse cx="470" cy="228" rx="11" ry="6.5" fill="#FF7B8F" opacity=".5"/>
<use xlink:href="#star" transform="translate(446 166) rotate(12) scale(.8)" fill="#FF6F86" stroke="#FF6F86"/>
<circle cx="446" cy="166" r="2.4" fill="#FFD0D6"/>

<!-- jellyfish balloon -->
<g class="bob">
<path d="M505 290Q545 255 560 196" fill="none" stroke="#FFB0BD" stroke-width="1.6"/>
<g transform="translate(560 172)">
<path d="M-12 20q-5 10 0 20t0 20M-4 22q-4 9 0 18t0 18M4 22q4 9 0 18t0 18M12 20q5 10 0 20t0 20" fill="none" stroke="#FFB0BD" stroke-width="2" stroke-linecap="round"/>
<path d="M-22 18C-24-18 24-18 22 18Q16 23 11 18Q5 23 0 18Q-5 23-11 18Q-16 23-22 18Z" fill="url(#jel)" stroke="#FF7D93" stroke-width="1.5" opacity=".92"/>
<path d="M-13 6Q-11-4-2-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
<circle cx="-6" cy="8" r="1.8" fill="#173848"/><circle cx="6" cy="8" r="1.8" fill="#173848"/>
<path d="M-3 12.5q3 2.5 6 0" fill="none" stroke="#173848" stroke-width="1.3" stroke-linecap="round"/>
</g>
</g>

<!-- near arm holding the string -->
<path d="M440 284Q474 300 502 290" fill="none" stroke="#8E5B35" stroke-width="16" stroke-linecap="round"/>
<circle cx="504" cy="289" r="8.5" fill="#6B4328"/>

<!-- nose bubbles -->
<circle class="b" cx="517" cy="182" r="3"/>
<circle class="b" cx="525" cy="162" r="4.5" style="animation-delay:-1s"/>
<circle class="b" cx="520" cy="140" r="3.5" style="animation-delay:-2s"/>
<circle class="b" cx="527" cy="121" r="2.5" style="animation-delay:-3s"/>

<rect width="800" height="600" fill="url(#vig)"/>
</svg>