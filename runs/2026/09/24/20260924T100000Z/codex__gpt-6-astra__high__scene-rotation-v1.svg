<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900"
     viewBox="0 0 900 900" fill="none">
  <title>A capybara riding a unicycle through an underwater coral reef</title>
  <desc>
    A smiling peach-colored capybara balances on a pink unicycle beneath
    arching corals. Turquoise water, shimmering sunbeams, little fish,
    and floating bubbles create a dreamy, playful underwater scene.
  </desc>

  <defs>
    <linearGradient id="water" x1="450" y1="0" x2="450" y2="900"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#91E9DC"/>
      <stop offset=".38" stop-color="#37BFBF"/>
      <stop offset="1" stop-color="#126A80"/>
    </linearGradient>
    <radialGradient id="glow" cx=".51" cy=".35" r=".65">
      <stop stop-color="#CAFFF0" stop-opacity=".6"/>
      <stop offset="1" stop-color="#75E4DD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="730"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3FFE6" stop-opacity=".6"/>
      <stop offset=".65" stop-color="#DBFFF1" stop-opacity=".13"/>
      <stop offset="1" stop-color="#DBFFF1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fur" x1="338" y1="327" x2="536" y2="571"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE0B8"/>
      <stop offset=".55" stop-color="#F5BD9F"/>
      <stop offset="1" stop-color="#E4938B"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="160" x2="0" y2="830"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC4BD"/>
      <stop offset=".5" stop-color="#F58297"/>
      <stop offset="1" stop-color="#C64E7D"/>
    </linearGradient>
    <linearGradient id="sand" x1="450" y1="759" x2="450" y2="900"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#78C9BD"/>
      <stop offset="1" stop-color="#C3E2CB"/>
    </linearGradient>
    <radialGradient id="bubble" cx=".3" cy=".25" r=".8">
      <stop stop-color="#E4FFF4" stop-opacity=".38"/>
      <stop offset=".65" stop-color="#C5FFF1" stop-opacity=".02"/>
      <stop offset="1" stop-color="#E1FFF5" stop-opacity=".28"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="frame">
      <rect width="900" height="900" rx="42"/>
    </clipPath>

    <g id="fish">
      <path d="M-18 0  -33-12V12Z" fill="#FFAFAD"/>
      <path d="M-23 0Q0-22 25 0Q0 22-23 0Z" fill="#FFD0BE"/>
      <circle cx="14" cy="-2" r="2.2" fill="#386B72"/>
      <path d="M-2-7 5 0-2 7" stroke="#EE8E99" stroke-width="2"
            stroke-linecap="round"/>
    </g>
    <g id="sparkle" stroke="#E1FFF0" stroke-linecap="round">
      <path d="M0-7V7M-7 0H7" stroke-width="2"/>
      <circle r="2.5" fill="#F1FFEF" stroke="none"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Water and the rippling, luminous surface. -->
    <path fill="url(#water)" d="M0 0H900V900H0Z"/>
    <path fill="url(#glow)" d="M0 0H900V900H0Z"/>
    <g fill="url(#beam)">
      <path d="M190 0H242L448 766H262Z"/>
      <path d="M323 0H348L566 741H476Z"/>
      <path d="M528 0H574L718 712H543Z"/>
      <path d="M662 0H682L839 619H751Z"/>
      <path d="M97 0H114L190 672H100Z"/>
    </g>
    <ellipse cx="433" cy="35" rx="245" ry="34"
             fill="#E0FFF0" opacity=".3" filter="url(#soft)"/>
    <g stroke="#DEFFF0" stroke-linecap="round">
      <path d="M-20 42Q91 9 189 38T403 36T629 33T926 35"
            stroke-width="5" opacity=".45"/>
      <path d="M58 71Q127 52 203 69M318 66Q403 46 486 65
               M586 65Q675 45 774 60"
            stroke-width="3" opacity=".35"/>
      <path d="M228 24 291 23M451 20 519 18M710 27 824 24"
            stroke-width="4" opacity=".6"/>
    </g>

    <!-- Distant reef and tiny drifting fish. -->
    <g stroke="#75D8CE" stroke-linecap="round" opacity=".25">
      <path d="M70 775V540M70 657 24 611M70 617 114 568
               M790 783V512M790 600 747 552M790 659 845 606"
            stroke-width="19"/>
      <path d="M256 791V656M256 716 224 683
               M658 792V618M658 679 696 643"
            stroke-width="12"/>
    </g>
    <g opacity=".56">
      <use href="#fish" transform="translate(661 288) scale(.65)"/>
      <use href="#fish" transform="translate(713 316) scale(.42)"/>
      <use href="#fish" transform="translate(255 368) scale(-.5 .5)"/>
      <use href="#fish" transform="translate(215 390) scale(-.34 .34)"/>
    </g>
    <path d="M0 796Q111 747 230 780T465 782T700 767T900 792V900H0Z"
          fill="#267F89"/>
    <path d="M0 829Q135 778 278 811Q453 759 622 809Q776 777 900 821V900H0Z"
          fill="url(#sand)"/>
    <ellipse cx="454" cy="803" rx="124" ry="18" fill="#317F87" opacity=".23"/>

    <!-- Two branching corals form an open arch around the rider. -->
    <g stroke="#8C4F78" stroke-width="35" stroke-linecap="round"
       stroke-linejoin="round" opacity=".18">
      <path d="M99 847C141 723 112 623 143 500S178 292 309 211"/>
      <path d="M809 847C762 724 798 623 758 493S705 290 584 213"/>
    </g>
    <g stroke="url(#coral)" stroke-linecap="round" stroke-linejoin="round">
      <g stroke-width="27">
        <path d="M92 839C137 722 105 624 137 497S176 289 307 210"/>
        <path d="M806 839C765 732 792 625 753 495S707 295 585 211"/>
      </g>
      <g stroke-width="19">
        <path d="M122 704Q57 663 46 570M124 634Q181 586 196 528
                 M135 521Q79 479 69 403M163 405Q222 374 244 316
                 M203 300Q183 244 212 194M248 248Q301 259 343 231
                 M299 215Q320 182 364 173"/>
        <path d="M779 708Q841 665 850 585M779 636Q721 595 709 540
                 M758 526Q813 490 830 420M729 417Q674 383 656 326
                 M690 308Q716 255 693 207M650 260Q596 269 561 242
                 M593 216Q576 187 537 178"/>
      </g>
      <g stroke-width="12">
        <path d="M51 596 24 579M61 620 87 584M182 562 226 548
                 M78 441 43 425M81 455 102 415M230 344 219 313
                 M195 249 165 232M273 252 280 287M333 182 337 153"/>
        <path d="M845 608 875 584M832 646 813 607M722 572 684 558
                 M818 452 858 436M812 471 799 435M667 351 680 321
                 M708 264 737 240M621 266 616 292M562 187 559 157"/>
      </g>
    </g>
    <g stroke="#FFD4C5" stroke-width="5" stroke-linecap="round" opacity=".53">
      <path d="M102 808Q122 742 117 690M140 491Q157 413 181 367
               M212 293Q249 245 297 218"/>
      <path d="M794 804Q779 753 784 688M751 496Q738 442 721 400
               M682 299Q645 249 596 219"/>
    </g>

    <!-- Unicycle: one wheel, fine spokes, fork, saddle, and pedals. -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <circle cx="447" cy="683" r="101" fill="#97E5D6" fill-opacity=".1"
              stroke="#285E70" stroke-width="17"/>
      <circle cx="447" cy="683" r="92" stroke="#FFB0B6" stroke-width="7"/>
      <g stroke="#BEF6E7" stroke-width="2.5" opacity=".85">
        <path d="M447 591V775M355 683H539
                 M382 618 512 748M382 748 512 618
                 M412 598 482 768M362 648 532 718
                 M362 718 532 648M412 768 482 598"/>
      </g>
      <path d="M368 657A83 83 0 0 1 424 603"
            stroke="#E1FFF0" stroke-width="4"/>
      <path d="M467 595 448 683" stroke="#864F70" stroke-width="13"/>
      <path d="M459 553 447 681" stroke="#FF98AE" stroke-width="12"/>
      <path d="M456 556 448 642" stroke="#FFD3C8" stroke-width="3"/>
      <path d="M423 547Q449 555 484 545"
            stroke="#3C6473" stroke-width="18"/>
      <path d="M424 543Q451 549 481 540"
            stroke="#EE829B" stroke-width="10"/>
      <circle cx="447" cy="683" r="12" fill="#F8BBC0"
              stroke="#315F71" stroke-width="5"/>
      <path d="M447 683 406 660M447 683 487 704"
            stroke="#3D6574" stroke-width="7"/>
      <path d="M390 662H420M472 705H503"
            stroke="#344F66" stroke-width="9"/>
    </g>

    <!-- The far limbs sit behind the capybara's rounded body. -->
    <g stroke="#865C65" stroke-width="5" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M427 490Q464 504 443 549L416 610Q409 630 416 646
               Q419 659 405 660L391 657Q380 652 385 634
               L400 556 391 523Z"
            fill="#D9958B"/>
      <path d="M468 426Q492 444 529 437L552 423
               Q565 421 568 432Q566 446 550 452
               Q504 478 471 459Z"
            fill="#DE9C8D"/>
    </g>

    <!-- Capybara silhouette: pear-shaped body, little ears, long broad muzzle. -->
    <path d="M383 351
             C349 366 326 408 324 452
             C317 500 340 538 382 548
             C408 555 444 552 465 538
             C491 520 500 485 496 446
             L507 421
             C543 430 593 431 616 414
             C634 401 635 374 621 358
             C610 345 578 340 551 335
             C528 318 506 306 477 310
             C451 307 433 318 421 336
             C408 338 394 343 383 351Z"
          fill="url(#fur)" stroke="#865C65" stroke-width="5.5"
          stroke-linejoin="round"/>
    <path d="M347 419Q334 458 350 492"
          stroke="#FFE8C8" stroke-width="12" stroke-linecap="round" opacity=".64"/>
    <path d="M436 332Q418 314 428 298Q439 286 451 299L463 316"
          fill="#F4BF9E" stroke="#865C65" stroke-width="5"
          stroke-linejoin="round"/>
    <path d="M435 311Q430 300 439 301L450 316"
          fill="#DC8D8D"/>
    <path d="M487 312Q484 291 498 288Q512 287 515 311"
          fill="#E8A18F" stroke="#865C65" stroke-width="5"
          stroke-linejoin="round"/>
    <path d="M495 306Q494 297 501 296"
          stroke="#F9CBB0" stroke-width="4" stroke-linecap="round"/>

    <!-- Calm expression and soft muzzle. -->
    <path d="M561 355Q605 352 618 369Q628 387 613 400
             Q591 412 553 401Q540 387 546 371Z"
          fill="#FFD2AF" opacity=".62"/>
    <path d="M508 357Q517 366 526 356"
          stroke="#624F5B" stroke-width="5.5" stroke-linecap="round"/>
    <ellipse cx="609" cy="370" rx="5" ry="4" fill="#795563"
             transform="rotate(16 609 370)"/>
    <path d="M597 398Q608 401 613 393"
          stroke="#865C65" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="523" cy="383" rx="16" ry="9" fill="#ED9295" opacity=".67"/>
    <g stroke="#B77A79" stroke-width="2.5" stroke-linecap="round">
      <path d="M576 382 582 383M573 392 580 393"/>
      <path d="M371 397 375 389M384 393 388 385M357 466 358 458"/>
    </g>

    <!-- Near arm floating forward, and a bent leg reaching its pedal. -->
    <path d="M460 424Q465 439 484 455Q503 470 533 466
             L552 461Q567 462 565 474Q561 485 544 487
             Q502 500 474 484Q450 473 439 453"
          fill="#F5BC9D" stroke="#865C65" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M549 474 551 482M539 477 541 485"
          stroke="#B37877" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M421 495
             Q461 489 478 522Q489 544 472 568
             L450 599Q448 607 459 626
             L493 679Q502 691 495 698
             Q484 706 472 698L427 641
             Q407 615 417 588L436 552
             Q415 558 398 544"
          fill="url(#fur)" stroke="#865C65" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M478 686 484 696M486 682 493 692"
          stroke="#B37877" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bubbles and suspended sparkles. -->
    <g fill="url(#bubble)" stroke="#CCFFF0" stroke-width="2" opacity=".78">
      <circle cx="587" cy="329" r="10"/>
      <circle cx="612" cy="285" r="17"/>
      <circle cx="580" cy="250" r="7"/>
      <circle cx="638" cy="219" r="11"/>
      <circle cx="286" cy="489" r="13"/>
      <circle cx="270" cy="450" r="6"/>
      <circle cx="589" cy="594" r="19"/>
      <circle cx="621" cy="550" r="8"/>
      <circle cx="315" cy="657" r="8"/>
    </g>
    <g stroke="#EDFFF4" stroke-width="3" stroke-linecap="round" opacity=".85">
      <path d="M603 279Q606 274 612 274M582 586Q586 582 590 582
               M279 484 282 481"/>
    </g>
    <g opacity=".75">
      <use href="#sparkle" transform="translate(352 278) scale(.8)"/>
      <use href="#sparkle" transform="translate(554 526) scale(.7)"/>
      <use href="#sparkle" transform="translate(317 580) scale(.6)"/>
      <use href="#sparkle" transform="translate(672 471) scale(.9)"/>
      <use href="#sparkle" transform="translate(474 208) scale(.7)"/>
    </g>
    <g fill="#C8FFF0" opacity=".5">
      <circle cx="267" cy="304" r="2.5"/>
      <circle cx="390" cy="232" r="3"/>
      <circle cx="651" cy="388" r="3"/>
      <circle cx="577" cy="700" r="2.5"/>
      <circle cx="287" cy="733" r="3"/>
      <circle cx="218" cy="638" r="2"/>
      <circle cx="710" cy="719" r="3"/>
      <circle cx="534" cy="152" r="2"/>
    </g>
    <use href="#fish" transform="translate(645 652) rotate(-9) scale(.8)"/>
    <use href="#fish" transform="translate(264 571) rotate(12) scale(.65)"/>

    <!-- Foreground reef garden. -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#319A99" stroke-width="12">
        <path d="M203 839Q159 794 177 736M203 837Q219 785 203 717
                 M205 834Q241 792 239 757"/>
        <path d="M688 839Q654 794 663 741M688 837Q721 784 706 728
                 M689 836Q743 813 747 772"/>
      </g>
      <g fill="#ED8EA3" stroke="#B96187" stroke-width="3">
        <path d="M40 884V827Q40 807 58 808Q77 808 77 827V884Z"/>
        <path d="M69 888V795Q69 775 87 776Q106 777 106 797V888Z"/>
        <path d="M101 888V833Q101 812 120 813Q137 814 137 834V888Z"/>
      </g>
      <g fill="#994E79">
        <ellipse cx="58" cy="824" rx="10" ry="6"/>
        <ellipse cx="87" cy="793" rx="10" ry="6"/>
        <ellipse cx="119" cy="830" rx="10" ry="6"/>
      </g>
      <path d="M785 890V822M785 851 751 827V804
               M785 837 815 809V786M769 838 744 850M799 824 833 834"
            stroke="#FCA6AE" stroke-width="17"/>
      <path d="M588 850Q573 815 592 797Q609 813 603 830
               Q620 801 634 815Q641 837 612 852Z"
            fill="#FFD0BD" stroke="#E5919B" stroke-width="3"/>
    </g>

    <path d="M272 841 284 854 303 850 295 866 302 882
             283 876 269 887 269 868 253 858 271 856Z"
          fill="#F89EAC" stroke="#D87992" stroke-width="3"
          stroke-linejoin="round"/>
    <circle cx="279" cy="865" r="3" fill="#FFD5BF"/>
    <path d="M505 840Q520 818 539 839Z" fill="#F6C5B5"/>
    <path d="M514 837 519 828M522 837 525 826M530 837 531 831"
          stroke="#D98C98" stroke-width="2" stroke-linecap="round"/>
    <g fill="#4AABA6" opacity=".55">
      <ellipse cx="344" cy="839" rx="5" ry="2"/>
      <ellipse cx="377" cy="863" rx="3" ry="2"/>
      <ellipse cx="462" cy="821" rx="4" ry="2"/>
      <ellipse cx="552" cy="876" rx="5" ry="2"/>
      <ellipse cx="662" cy="861" rx="4" ry="2"/>
      <ellipse cx="161" cy="864" rx="4" ry="2"/>
    </g>
  </g>
  <rect x="10" y="10" width="880" height="880" rx="34"
        stroke="#C8F8E7" stroke-opacity=".45" stroke-width="2"/>
</svg>