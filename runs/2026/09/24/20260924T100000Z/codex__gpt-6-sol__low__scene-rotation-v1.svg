<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Capybara riding a unicycle through a coral reef</title>
  <desc id="desc">A cheerful capybara pedals a unicycle beneath shimmering underwater light, framed by arching pink corals.</desc>
  <defs>
    <linearGradient id="sea" x2="0" y2="1">
      <stop offset="0" stop-color="#79ddd8"/>
      <stop offset=".52" stop-color="#37bdbd"/>
      <stop offset="1" stop-color="#126d83"/>
    </linearGradient>
    <linearGradient id="ray" x2="0" y2="1">
      <stop stop-color="#fff9d9" stop-opacity=".52"/>
      <stop offset="1" stop-color="#fff9d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fur" x2="0" y2="1">
      <stop stop-color="#c99469"/>
      <stop offset="1" stop-color="#986b55"/>
    </linearGradient>
    <linearGradient id="coral" x2="0" y2="1">
      <stop stop-color="#ffb0ad"/>
      <stop offset="1" stop-color="#ed718e"/>
    </linearGradient>
    <pattern id="specks" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="19" r="2" fill="#d9fff0" opacity=".4"/>
      <circle cx="71" cy="57" r="1.5" fill="#d9fff0" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#sea)"/>
  <path d="M0 38 Q100 23 200 37 T400 35 T600 38 T800 30" fill="none" stroke="#d4fff0" stroke-width="6" opacity=".55"/>
  <path d="M85 40 360 615 260 615Z M240 35 485 625 428 625Z M555 35 440 620 520 620Z M735 36 516 620 605 620Z" fill="url(#ray)"/>
  <rect width="800" height="800" fill="url(#specks)"/>

