<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title">
  <title id="title">Capybara riding a unicycle through an underwater coral reef</title>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdf5f0"/>
      <stop offset="0.35" stop-color="#52d8d0"/>
      <stop offset="0.7" stop-color="#1ca4a9"/>
      <stop offset="1" stop-color="#0b5f70"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe2cf"/>
      <stop offset="1" stop-color="#e5a487"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#dcfffa" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#dcfffa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.72">
      <stop offset="0.55" stop-color="#04303a" stop-opacity="0"/>
      <stop offset="1" stop-color="#04303a" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <path id="star" d="M0,-10 L2.6,-3.6 9.5,-3.1 4.3,1.4 5.9,8.1 0,4.5 -5.9,8.1 -4.3,1.4 -9.5,-3.1 -2.6,-3.6 Z"/>
    <path id="spark" d="M0,-7 L1.6,-1.6 7,0 1.6,1.6 0,7 -1.6,1.6 -7,0 -1.6,-1.6 Z"/>
    <g id="fish">
      <path d="M-10,0 L-19,-6 L-19,6 Z"/>
      <ellipse cx="0" cy="0" rx="12" ry="6"/>
      <circle cx="6" cy="-1.5" r="1.4" fill="#1e2a30"/>
    </g>
  </defs>

  <!-- water -->
  <rect width="800" height="600" fill="url(#water)"/>

  <!-- light rays from the surface -->
  <g fill="url(#ray)" filter="url(#soft)">
    <polygon points="250,0 300,0 150,600 30,600"/>
    <polygon points="335,0 370,0 300,600 220,600"/>
    <polygon points="430,0 490,0 530,600 400,600"/>
    <polygon points="545,0 580,0 700,600 610,600"/>
    <polygon points="640,0 670,0 800,520 800,600 760,600"/>
  </g>
  <g fill="url(#ray)" opacity="0.6">
    <polygon points="268,0 276,0 118,600 96,600"/>
    <polygon points="452,0 462,0 490,600 462,600"/>
    <polygon points="556,0 563,0 660,600 636,600"/>
  </g>

  <!-- surface shimmer -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M-20 28 Q40 12 100 28 T220 28 T340 28 T460 28 T580 28 T700 28 T820 28" stroke-width="4" stroke-opacity="0.35"/>
    <path d="M-20 52 Q50 40 120 52 T260 52 T400 52 T540 52 T680 52 T820 52" stroke-width="3" stroke-opacity="0.2"/>
  </g>

  <!-- distant reef mounds -->
  <g fill="#0f6d7b" opacity="0.5">
    <ellipse cx="70" cy="470" rx="70" ry="45"/>
    <ellipse cx="250" cy="482" rx="60" ry="32"/>
    <ellipse cx="540" cy="480" rx="65" ry="36"/>
    <ellipse cx="730" cy="466" rx="80" ry="50"/>
  </g>

  <!-- dreamy glow behind the subject -->
  <circle cx="405" cy="320" r="200" fill="url(#glow)"/>

  <!-- sea fans -->
  <path d="M85 500 C30 450 20 380 60 330 C100 300 150 340 150 400 C150 450 120 480 85 500 Z" fill="#ff9fb0" fill-opacity="0.55"/>
  <path d="M85 500 L50 362 M85 500 L70 335 M85 500 L95 330 M85 500 L122 348 M85 500 L142 388 M85 500 L149 432" fill="none" stroke="#ffd6de" stroke-width="1.5" stroke-opacity="0.8"/>
  <path d="M735 500 C785 455 795 385 755 335 C715 305 668 345 668 405 C668 455 700 480 735 500 Z" fill="#62e2d3" fill-opacity="0.5"/>
  <path d="M735 500 L770 365 M735 500 L752 338 M735 500 L726 334 M735 500 L698 352 M735 500 L677 392 M735 500 L670 436" fill="none" stroke="#d2fff9" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- seaweed -->
  <g fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M40 500 C30 470 60 450 45 420 C30 390 60 370 48 340 C40 320 55 300 50 280" stroke="#21b5a5" stroke-width="7"/>
    <path d="M62 500 C70 470 50 445 66 420 C80 395 60 372 72 345" stroke="#3fd2c2" stroke-width="5"/>
    <path d="M770 500 C780 470 750 450 765 420 C780 390 750 370 762 340 C770 320 755 300 760 280" stroke="#21b5a5" stroke-width="7"/>
    <path d="M748 500 C740 472 760 448 745 424 C730 400 752 375 740 350" stroke="#3fd2c2" stroke-width="5"/>
  </g>

  <!-- tube corals -->
  <g fill="#35d3c3">
    <rect x="200" y="440" width="14" height="70" rx="7"/>
    <rect x="218" y="424" width="16" height="86" rx="8" fill="#26bfb0"/>
    <rect x="238" y="450" width="13" height="60" rx="6.5" fill="#55e4d5"/>
    <rect x="254" y="434" width="15" height="76" rx="7.5" fill="#26bfb0"/>
  </g>
  <g fill="#14978c">
    <ellipse cx="207" cy="444" rx="4" ry="2"/>
    <ellipse cx="226" cy="428" rx="5" ry="2.2"/>
    <ellipse cx="244.5" cy="454" rx="3.8" ry="1.8"/>
    <ellipse cx="261.5" cy="438" rx="4.5" ry="2"/>
  </g>

  <!-- brain coral -->
  <path d="M556 506 C556 470 584 452 610 452 C640 452 664 476 662 506 Z" fill="#ff9aa5"/>
  <g fill="none" stroke="#d9606f" stroke-width="2" stroke-linecap="round">
    <path d="M568 492 q8 -10 16 0 t16 0 t16 0 t16 0 t16 0"/>
    <path d="M574 477 q8 -8 16 0 t16 0 t16 0 t16 0"/>
    <path d="M592 464 q7 -6 14 0 t14 0 t14 0"/>
  </g>

  <!-- bubble coral -->
  <g fill="#ffb3ba">
    <circle cx="694" cy="492" r="10"/>
    <circle cx="710" cy="485" r="12"/>
    <circle cx="724" cy="494" r="9"/>
    <circle cx="704" cy="502" r="8" fill="#ff9fa8"/>
  </g>

  <!-- anemone -->
  <g stroke-linecap="round" fill="none">
    <path d="M300 496 L270 458 M300 496 L280 446 M300 496 L293 440 M300 496 L305 438 M300 496 L319 442 M300 496 L331 452 M300 496 L339 468" stroke="#ff8fa3" stroke-width="5"/>
    <path d="M300 496 L285 464 M300 496 L298 454 M300 496 L312 456 M300 496 L325 470" stroke="#8ef3e6" stroke-width="4"/>
  </g>
  <ellipse cx="300" cy="497" rx="22" ry="8" fill="#e56f82"/>

  <!-- left arching coral -->
  <g fill="none" stroke="#f2718a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M135 500 C118 430 160 340 235 275 C290 228 340 180 385 138" stroke-width="22"/>
    <path d="M138 421 C118 400 108 372 116 342 M235 275 C226 250 208 238 186 236 M283 232 C288 208 280 188 262 178 M329 191 C340 172 336 150 322 138" stroke-width="13"/>
    <path d="M116 342 C108 326 112 308 126 296 M186 236 C172 230 164 214 168 198 M262 178 C250 168 246 152 254 138 M385 138 C392 124 402 116 400 100 M385 138 C374 124 362 114 352 104" stroke-width="8"/>
  </g>
  <g fill="#ffc7cf">
    <circle cx="126" cy="296" r="6"/><circle cx="168" cy="198" r="6"/><circle cx="254" cy="138" r="6"/>
    <circle cx="322" cy="138" r="7"/><circle cx="400" cy="100" r="6"/><circle cx="352" cy="104" r="6"/>
  </g>
  <g fill="#ffe1e6" opacity="0.85">
    <circle cx="128" cy="466" r="2.5"/><circle cx="148" cy="386" r="2.5"/><circle cx="202" cy="306" r="2.5"/>
    <circle cx="304" cy="212" r="2.5"/><circle cx="355" cy="165" r="2.5"/>
  </g>

  <!-- right arching coral -->
  <g fill="none" stroke="#ff8f7d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M668 500 C690 430 650 340 572 275 C515 228 462 182 418 140" stroke-width="22"/>
    <path d="M669 421 C690 400 700 372 692 342 M572 275 C582 250 600 238 622 236 M522 233 C517 208 526 188 544 178 M475 192 C464 172 468 150 482 138" stroke-width="13"/>
    <path d="M692 342 C700 326 696 308 682 296 M622 236 C636 230 644 214 640 198 M544 178 C556 168 560 152 552 138 M418 140 C430 128 444 118 450 102 M418 140 C412 124 414 110 424 96" stroke-width="8"/>
  </g>
  <g fill="#ffd3c9">
    <circle cx="682" cy="296" r="6"/><circle cx="640" cy="198" r="6"/><circle cx="552" cy="138" r="6"/>
    <circle cx="482" cy="138" r="7"/><circle cx="450" cy="102" r="6"/><circle cx="424" cy="96" r="6"/>
  </g>
  <g fill="#ffe8e2" opacity="0.85">
    <circle cx="673" cy="467" r="2.5"/><circle cx="658" cy="386" r="2.5"/><circle cx="604" cy="306" r="2.5"/>
    <circle cx="497" cy="212" r="2.5"/><circle cx="445" cy="164" r="2.5"/>
  </g>

  <!-- sand -->
  <path d="M0 495 Q100 478 200 495 T400 495 T600 495 T800 495 V600 H0 Z" fill="url(#sand)"/>
  <g fill="none" stroke="#d9927a" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <path d="M40 545 Q90 535 140 545"/>
    <path d="M180 570 Q240 560 300 570"/>
    <path d="M470 555 Q530 545 590 555"/>
    <path d="M640 580 Q700 570 760 580"/>
    <path d="M330 585 Q380 577 430 585"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <path d="M120 520 Q160 512 200 520 T280 520"/>
    <path d="M560 530 Q600 522 640 530 T720 530"/>
  </g>
  <use xlink:href="#star" transform="translate(300 532) rotate(15) scale(1.6)" fill="#ff8a86"/>
  <use xlink:href="#star" transform="translate(690 548) rotate(-25) scale(1.2)" fill="#ffa4ab"/>
  <path d="M520 556 a11 9 0 0 1 22 0 Z" fill="#fff1e8"/>
  <path d="M531 556 L526 549 M531 556 L531 547 M531 556 L536 549" fill="none" stroke="#e9b8a6" stroke-width="1.2"/>

  <!-- wheel shadow -->
  <ellipse cx="402" cy="497" rx="44" ry="7" fill="#6b3f33" opacity="0.28"/>

  <!-- capybara on unicycle -->
  <g>
    <!-- far leg, crank, pedal, foot -->
    <path d="M388 336 L360 382" fill="none" stroke="#a3743f" stroke-width="15" stroke-linecap="round"/>
    <path d="M360 382 L376 426" fill="none" stroke="#a3743f" stroke-width="12" stroke-linecap="round"/>
    <line x1="400" y1="445" x2="376" y2="428" stroke="#2b3a44" stroke-width="5" stroke-linecap="round"/>
    <rect x="367" y="424.5" width="17" height="7" rx="2.5" fill="#2b3a44"/>
    <ellipse cx="374" cy="427" rx="10" ry="6" fill="#a3743f"/>
    <!-- wheel -->
    <circle cx="400" cy="445" r="50" fill="none" stroke="#2b3a44" stroke-width="9"/>
    <circle cx="400" cy="445" r="42" fill="none" stroke="#d8f0f4" stroke-width="3"/>
    <path d="M400 404 V486 M359 445 H441 M371 416 L429 474 M429 416 L371 474 M379.5 409.5 L420.5 480.5 M420.5 409.5 L379.5 480.5 M364.5 424.5 L435.5 465.5 M435.5 424.5 L364.5 465.5" fill="none" stroke="#d8f0f4" stroke-width="2"/>
    <circle cx="400" cy="445" r="6" fill="#d8f0f4" stroke="#2b3a44" stroke-width="2"/>
    <!-- near crank and pedal -->
    <line x1="400" y1="445" x2="424" y2="462" stroke="#2b3a44" stroke-width="5" stroke-linecap="round"/>
    <rect x="415" y="458.5" width="18" height="7" rx="2.5" fill="#2b3a44"/>
    <!-- fork and seat post -->
    <path d="M386 447 V400 Q386 390 400 390 Q414 390 414 400 V447 M400 390 V356" fill="none" stroke="#2b3a44" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M386 447 V400 Q386 390 400 390 Q414 390 414 400 V447 M400 390 V356" fill="none" stroke="#e9f8fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- saddle -->
    <path d="M372 353 Q400 339 430 351 Q432 359 426 361 L378 361 Q368 359 372 353 Z" fill="#ff6f80"/>
    <!-- far arm -->
    <path d="M436 270 L476 288" fill="none" stroke="#a3743f" stroke-width="12" stroke-linecap="round"/>
    <circle cx="478" cy="289" r="6.5" fill="#8f6435"/>
    <!-- body -->
    <path d="M370 353 C348 310 354 244 392 224 C420 210 452 222 460 252 C468 288 456 330 438 353 Z" fill="#c8955f"/>
    <path d="M392 226 C362 246 354 300 370 351" fill="none" stroke="#b07f4c" stroke-width="5" stroke-opacity="0.6" stroke-linecap="round"/>
    <ellipse cx="432" cy="308" rx="18" ry="32" fill="#e0b98a" opacity="0.7"/>
    <!-- near leg and foot -->
    <path d="M398 338 L432 392" fill="none" stroke="#c8955f" stroke-width="17" stroke-linecap="round"/>
    <path d="M432 392 L426 456" fill="none" stroke="#c8955f" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="429" cy="461" rx="11" ry="6" fill="#a3743f"/>
    <!-- head -->
    <path d="M420 240 C418 215 428 198 450 196 C470 194 490 200 500 214 C506 222 505 236 498 244 C490 252 470 252 455 248 C440 246 428 248 420 240 Z" fill="#c8955f"/>
    <circle cx="440" cy="199" r="8" fill="#a3743f"/>
    <circle cx="441" cy="200" r="4" fill="#f5a3a8"/>
    <circle cx="466" cy="215" r="4.5" fill="#2a1b10"/>
    <circle cx="468" cy="213" r="1.5" fill="#ffffff"/>
    <ellipse cx="497" cy="214" rx="4.5" ry="3.2" fill="#3a2716"/>
    <path d="M488 236 Q496 243 503 235" fill="none" stroke="#3a2716" stroke-width="1.6" stroke-linecap="round"/>
    <g fill="#6b4a2a"><circle cx="489" cy="227" r="1.2"/><circle cx="493" cy="230" r="1.2"/><circle cx="488" cy="232" r="1.2"/></g>
    <circle cx="466" cy="234" r="7" fill="#ff8fa3" opacity="0.45"/>
    <use xlink:href="#star" transform="translate(462 191) rotate(12) scale(0.95)" fill="#ff7f8c"/>
    <!-- near arm -->
    <path d="M446 270 L494 260" fill="none" stroke="#c8955f" stroke-width="13" stroke-linecap="round"/>
    <circle cx="496" cy="259" r="7" fill="#a3743f"/>
    <!-- bubbles from the nose -->
    <g fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.2">
      <circle cx="512" cy="204" r="3"/>
      <circle cx="521" cy="190" r="4.5"/>
      <circle cx="533" cy="172" r="6"/>
      <circle cx="528" cy="150" r="4"/>
    </g>
  </g>

  <!-- fish -->
  <use xlink:href="#fish" transform="translate(700 200)" fill="#ff8c69"/>
  <use xlink:href="#fish" transform="translate(732 232) scale(0.8)" fill="#ffa07a"/>
  <use xlink:href="#fish" transform="translate(708 262) scale(0.65)" fill="#ff8c69"/>
  <use xlink:href="#fish" transform="translate(110 250) scale(-0.9 0.9)" fill="#6fe8da"/>
  <use xlink:href="#fish" transform="translate(300 80) scale(-0.7 0.7)" fill="#ffb3a7"/>

  <!-- vignette -->
  <rect width="800" height="600" fill="url(#vig)"/>

  <!-- sparkles and bubbles -->
  <g fill="#ffffff" opacity="0.8">
    <use xlink:href="#spark" transform="translate(215 105) scale(0.9)"/>
    <use xlink:href="#spark" transform="translate(470 72) scale(0.7)"/>
    <use xlink:href="#spark" transform="translate(596 150) scale(0.6)"/>
    <use xlink:href="#spark" transform="translate(130 140) scale(0.55)"/>
    <use xlink:href="#spark" transform="translate(690 110) scale(0.8)"/>
    <use xlink:href="#spark" transform="translate(760 300) scale(0.5)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.3">
    <circle cx="120" cy="180" r="5"/>
    <circle cx="105" cy="150" r="3"/>
    <circle cx="700" cy="150" r="7"/>
    <circle cx="742" cy="118" r="4"/>
    <circle cx="280" cy="160" r="5"/>
    <circle cx="560" cy="88" r="6"/>
    <circle cx="612" cy="62" r="3.5"/>
    <circle cx="312" cy="420" r="3"/>
    <circle cx="322" cy="400" r="4"/>
    <circle cx="200" cy="380" r="3.5"/>
    <circle cx="760" cy="230" r="5"/>
  </g>
</svg>