    <circle cx="471" cy="234" r="10" fill="#9a6538"/>
    <circle cx="446" cy="241" r="5" fill="#d9a878"/>
    <circle cx="471" cy="235" r="5" fill="#d9a878"/>
    <ellipse cx="470" cy="268" rx="44" ry="36" fill="url(#fur)"/>
    <ellipse cx="505" cy="281" rx="25" ry="18" fill="#c48c5c"/>
    <ellipse cx="521" cy="275" rx="6.5" ry="4.5" fill="#3b2a1e"/>
    <path d="M512 291 q7 6 14 0" fill="none" stroke="#3b2a1e" stroke-width="2" stroke-linecap="round"/>
