      <line x1="384" y1="431" x2="416" y2="509"/>
      <line x1="416" y1="431" x2="384" y2="509"/>
      <line x1="361" y1="454" x2="439" y2="486"/>
      <line x1="439" y1="454" x2="361" y2="486"/>
