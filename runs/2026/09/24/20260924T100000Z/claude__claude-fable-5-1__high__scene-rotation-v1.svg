    <path d="M10 44 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" stroke-opacity="0.2"/>
  </g>

  <!-- light rays -->
  <g fill="url(#ray)">
    <polygon points="110,0 170,0 330,600 210,600"/>
    <polygon points="250,0 300,0 420,600 330,600"/>
    <polygon points="380,0 440,0 520,600 430,600" opacity="0.8"/>
    <polygon points="520,0 570,0 700,600 600,600" opacity="0.7"/>
    <polygon points="640,0 720,0 800,420 800,600 720,600" opacity="0.6"/>
