<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Capybara riding a unicycle in a coral reef</title>
  <desc id="desc">A playful capybara balances on a unicycle between arching pink corals beneath shimmering turquoise water.</desc>
  <defs>
    <linearGradient id="water" x2="0" y2="1">
      <stop offset="0" stop-color="#91f1e7"/>
      <stop offset=".48" stop-color="#36c9c3"/>
      <stop offset="1" stop-color="#087f91"/>
    </linearGradient>
    <linearGradient id="ray" x2="0" y2="1">
      <stop stop-color="#fff8cf" stop-opacity=".66"/>
      <stop offset="1" stop-color="#fff8cf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coral" x2="0" y2="1">
      <stop stop-color="#ffb0a4"/>
      <stop offset="1" stop-color="#f26f83"/>
    </linearGradient>
    <linearGradient id="fur" x2="0" y2="1">
      <stop stop-color="#c98b57"/>
      <stop offset="1" stop-color="#965b3d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="900" height="700" fill="url(#water)"/>
  <path d="M0 0H900V34Q800 20 700 34T500 30T300 35T0 26Z" fill="#d9fff2" opacity=".8"/>
  <path d="M110 22L260 430H175L74 23Z" fill="url(#ray)"/>
  <path d="M365 20L475 420H400L326 20Z" fill="url(#ray)" opacity=".72"/>
  <path d="M655 20L780 442H690L600 20Z" fill="url(#ray)" opacity=".62"/>
  <ellipse cx="455" cy="335" rx="225" ry="190" fill="#c9fff0" opacity=".15" filter="url(#glow)"/>

  <g fill="#f7ffda" opacity=".72">
    <circle cx="144" cy="130" r="4"/><circle cx="197" cy="213" r="3"/>
    <circle cx="732" cy="150" r="4"/><circle cx="675" cy="253" r="3"/>
    <circle cx="292" cy="95" r="3"/><circle cx="558" cy="105" r="4"/>
    <circle cx="610" cy="325" r="3"/><circle cx="271" cy="335" r="4"/>
  </g>
  <g fill="none" stroke="#dbfff1" stroke-width="3" opacity=".65">
    <path d="M160 160q-10-18 2-30"/><path d="M706 220q-13-20 0-34"/>
    <path d="M330 180q-10-15 2-28"/><path d="M580 235q-12-18 1-31"/>
  </g>

  <!-- Framing coral arches -->
  <g fill="none" stroke="url(#coral)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 620C75 505 106 393 177 321C214 283 263 275 294 307" stroke-width="30"/>
    <path d="M830 620C822 492 788 386 718 316C682 280 634 278 603 310" stroke-width="30"/>
    <path d="M91 492L50 449M108 441L75 391M139 382L119 333M190 335L177 284M240 309L237 258"
          stroke-width="15"/>
    <path d="M808 492L850 450M790 438L827 389M758 379L780 328M708 331L718 282M660 307L662 257"
          stroke-width="15"/>
    <path d="M76 619Q115 586 146 620M822 619Q784 585 753 620" stroke-width="22"/>
  </g>
  <g fill="#ffd0b9">
    <circle cx="50" cy="449" r="9"/><circle cx="75" cy="391" r="9"/>
    <circle cx="119" cy="333" r="9"/><circle cx="177" cy="284" r="9"/>
    <circle cx="237" cy="258" r="9"/><circle cx="850" cy="450" r="9"/>
    <circle cx="827" cy="389" r="9"/><circle cx="780" cy="328" r="9"/>
    <circle cx="718" cy="282" r="9"/><circle cx="662" cy="257" r="9"/>
  </g>

  <!-- Seafloor -->
  <path d="M0 594Q124 564 241 594T480 592T706 585T900 596V700H0Z" fill="#117887"/>
  <path d="M0 627Q154 603 281 629T536 621T900 624V700H0Z" fill="#0b6677"/>
  <g fill="#ffc5a8">
    <path d="M122 610q-4-44 8-67 12 30 7 67z"/>
    <path d="M149 610q-6-33 8-51 11 24 4 51z"/>
    <path d="M764 611q-2-41 12-62 9 29 4 62z"/>
    <path d="M789 609q-5-31 8-47 10 22 5 47z"/>
  </g>
  <g fill="#9ce9d9" opacity=".65">
    <ellipse cx="215" cy="640" rx="24" ry="8"/><ellipse cx="679" cy="648" rx="31" ry="9"/>
    <ellipse cx="350" cy="612" rx="18" ry="6"/><ellipse cx="560" cy="660" rx="23" ry="7"/>
  </g>

  <!-- Unicycle wheel -->
  <circle cx="450" cy="552" r="76" fill="none" stroke="#153f58" stroke-width="12"/>
  <circle cx="450" cy="552" r="65" fill="none" stroke="#a6f5e6" stroke-width="4"/>
  <g stroke="#a6f5e6" stroke-width="3" opacity=".82">
    <path d="M450 487V617M385 552H515M404 506L496 598M496 506L404 598"/>
  </g>
  <circle cx="450" cy="552" r="9" fill="#ffb189"/>
  <path d="M442 477H458L454 489H446Z" fill="#243f56"/>
  <path d="M423 477H477" stroke="#243f56" stroke-width="9" stroke-linecap="round"/>

  <!-- Capybara, seated upright and balancing -->
  <path d="M406 418Q386 438 388 474L401 514Q420 529 455 525Q486 520 502 497L494 457Q486 423 456 411Z"
        fill="url(#fur)" stroke="#744936" stroke-width="4"/>
  <ellipse cx="446" cy="469" rx="45" ry="48" fill="#d7a16a" opacity=".82"/>
  <path d="M414 493Q431 507 451 500Q474 494 484 479" fill="none" stroke="#edc08a" stroke-width="7" stroke-linecap="round"/>
  <path d="M407 441Q389 426 395 406Q403 393 418 411L430 429Z" fill="#a96e49" stroke="#744936" stroke-width="4"/>
  <path d="M468 430Q481 402 498 409Q510 420 493 442Z" fill="#a96e49" stroke="#744936" stroke-width="4"/>
  <ellipse cx="450" cy="408" rx="54" ry="43" fill="url(#fur)" stroke="#744936" stroke-width="4"/>
  <ellipse cx="492" cy="421" rx="27" ry="19" fill="#d6a06d"/>
  <ellipse cx="512" cy="416" rx="10" ry="8" fill="#352b30"/>
  <circle cx="470" cy="397" r="4.5" fill="#26323a"/>
  <path d="M478 414q9 8 17 1" fill="none" stroke="#734638" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M412 467Q384 471 371 455" fill="none" stroke="#965b3d" stroke-width="17" stroke-linecap="round"/>
  <path d="M478 462Q506 452 523 466" fill="none" stroke="#965b3d" stroke-width="17" stroke-linecap="round"/>
  <path d="M425 516Q424 537 443 546M476 511Q473 531 459 545" fill="none" stroke="#744936" stroke-width="12" stroke-linecap="round"/>
  <path d="M438 542L450 552M459 542L450 552" fill="none" stroke="#243f56" stroke-width="6" stroke-linecap="round"/>

  <!-- Tiny bubbles and playful sparkles -->
  <g fill="none" stroke="#e9fff3" opacity=".85">
    <circle cx="333" cy="402" r="9" stroke-width="2"/>
    <circle cx="348" cy="370" r="5" stroke-width="2"/>
    <circle cx="567" cy="426" r="7" stroke-width="2"/>
    <circle cx="550" cy="387" r="4" stroke-width="2"/>
  </g>
  <g stroke="#fff5c7" stroke-width="3" stroke-linecap="round">
    <path d="M322 294v16M314 302h16"/>
    <path d="M581 303v14M574 310h14"/>
    <path d="M535 260v11M529 265h11"/>
  </g>
</svg>