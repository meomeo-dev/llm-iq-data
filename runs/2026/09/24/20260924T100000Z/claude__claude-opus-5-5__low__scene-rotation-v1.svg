<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe6e0"/>
      <stop offset="0.5" stop-color="#2bb3b8"/>
      <stop offset="1" stop-color="#0f6f80"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d9c4"/>
      <stop offset="1" stop-color="#e8b8a0"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#c98a5a"/>
      <stop offset="1" stop-color="#8f5a36"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sea)"/>

  <!-- 光束 -->
  <g>
    <polygon points="180,0 240,0 330,600 200,600" fill="url(#ray)" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="360,0 400,0 470,600 380,600" fill="url(#ray)" opacity="0.4">
      <animate attributeName="opacity" values="0.3;0.65;0.3" dur="5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="520,0 590,0 640,600 520,600" fill="url(#ray)" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- 海面波纹 -->
  <path d="M0,18 Q50,8 100,18 T200,18 T300,18 T400,18 T500,18 T600,18 T700,18 T800,18"
        stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" fill="none"/>

  <!-- 沙地 -->
  <path d="M0,520 Q200,490 400,515 T800,505 L800,600 L0,600 Z" fill="url(#sand)"/>

  <!-- 拱形珊瑚 -->
  <g fill="none" stroke-linecap="round">
    <path d="M60,600 C40,380 120,140 400,110 C680,140 760,380 740,600"
          stroke="#ff7f8f" stroke-width="34"/>
    <path d="M60,600 C40,380 120,140 400,110 C680,140 760,380 740,600"
          stroke="#ffb0ba" stroke-width="12" stroke-dasharray="4 22"/>
    <path d="M110,260 q-40,-30 -60,-80 M150,190 q-10,-50 20,-90 M250,135 q0,-40 -30,-70
             M550,135 q0,-40 30,-70 M650,190 q10,-50 -20,-90 M690,260 q40,-30 60,-80"
          stroke="#ff7f8f" stroke-width="16"/>
  </g>

  <!-- 底部珊瑚丛 -->
  <g stroke-linecap="round" fill="none">
    <path d="M110,560 v-80 m0,40 q-30,-10 -35,-50 m35,30 q30,-15 30,-55"
          stroke="#ff9aa8" stroke-width="12"/>
    <path d="M690,560 v-90 m0,45 q30,-10 35,-55 m-35,30 q-30,-15 -30,-50"
          stroke="#ff9aa8" stroke-width="12"/>
  </g>
  <g fill="#5fd3c9">
    <ellipse cx="200" cy="535" rx="38" ry="22"/>
    <ellipse cx="610" cy="530" rx="42" ry="24"/>
  </g>
  <g fill="#ffc3cb">
    <circle cx="190" cy="530" r="4"/><circle cx="210" cy="528" r="4"/>
    <circle cx="600" cy="525" r="4"/><circle cx="622" cy="532" r="4"/>
  </g>
  <path d="M250,540 q-10,-40 5,-80 q10,40 -5,80 M560,540 q10,-40 -5,-80 q-10,40 5,80"
        fill="#3fb8a8"/>

  <!-- 独轮车 -->
  <g>
    <circle cx="400" cy="460" r="52" fill="none" stroke="#2c3e50" stroke-width="10"/>
    <circle cx="400" cy="460" r="44" fill="none" stroke="#ff7f8f" stroke-width="3"/>
    <g stroke="#95a5a6" stroke-width="3">
      <line x1="400" y1="412" x2="400" y2="508"/>
      <line x1="352" y1="460" x2="448" y2="460"/>
      <line x1="366" y1="426" x2="434" y2="494"/>
      <line x1="434" y1="426" x2="366" y2="494"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 400 460" to="360 400 460" dur="3s" repeatCount="indefinite"/>
    </g>
    <circle cx="400" cy="460" r="7" fill="#2c3e50"/>
    <line x1="400" y1="460" x2="400" y2="350" stroke="#2c3e50" stroke-width="9"/>
    <ellipse cx="400" cy="345" rx="34" ry="10" fill="#1d7f8a"/>
    <!-- 踏板 -->
    <line x1="400" y1="460" x2="425" y2="480" stroke="#2c3e50" stroke-width="5"/>
    <line x1="400" y1="460" x2="375" y2="440" stroke="#2c3e50" stroke-width="5"/>
    <rect x="418" y="476" width="20" height="7" rx="2" fill="#2c3e50"/>
    <rect x="362" y="436" width="20" height="7" rx="2" fill="#2c3e50"/>
  </g>

  <!-- 水豚 -->
  <g>
    <!-- 腿 -->
    <path d="M380,340 Q365,390 372,438" stroke="#7a4a2c" stroke-width="16" fill="none"
          stroke-linecap="round"/>
    <path d="M420,340 Q440,410 428,478" stroke="#7a4a2c" stroke-width="16" fill="none"
          stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="400" cy="290" rx="78" ry="62" fill="url(#fur)"/>
    <!-- 手臂 -->
    <path d="M345,275 q-35,-20 -50,-55" stroke="#8f5a36" stroke-width="15" fill="none"
          stroke-linecap="round"/>
    <path d="M455,275 q35,-20 50,-55" stroke="#8f5a36" stroke-width="15" fill="none"
          stroke-linecap="round"/>
    <!-- 头 -->
    <g>
      <rect x="352" y="170" width="112" height="78" rx="36" fill="url(#fur)"/>
      <ellipse cx="455" cy="215" rx="26" ry="30" fill="#a8704a"/>
      <ellipse cx="370" cy="172" rx="10" ry="8" fill="#7a4a2c"/>
      <ellipse cx="400" cy="168" rx="10" ry="8" fill="#7a4a2c"/>
      <circle cx="420" cy="200" r="6" fill="#2b1a10"/>
      <circle cx="422" cy="198" r="2" fill="#fff"/>
      <ellipse cx="468" cy="205" rx="4" ry="3" fill="#2b1a10"/>
      <path d="M450,230 q10,7 18,0" stroke="#2b1a10" stroke-width="2.5" fill="none"
            stroke-linecap="round"/>
      <ellipse cx="428" cy="222" rx="8" ry="5" fill="#ff9aa8" opacity="0.7"/>
      <!-- 头顶的小橘子造型换成海星 -->
      <path d="M385,158 l5,-12 l5,12 l12,1 l-10,7 l4,12 l-11,-7 l-11,7 l4,-12 l-10,-7 z"
            fill="#ff7f8f"/>
    </g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -4; 0 0" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- 小鱼 -->
  <g fill="#ffb0ba">
    <path d="M560,250 q20,-14 40,0 q-20,14 -40,0 z M560,250 l-12,-8 v16 z"/>
    <path d="M230,300 q-18,-12 -36,0 q18,12 36,0 z M230,300 l11,-7 v14 z" fill="#8ef0e6"/>
    <path d="M600,330 q14,-10 28,0 q-14,10 -28,0 z M600,330 l-9,-6 v12 z"/>
  </g>

  <!-- 气泡 -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2">
    <circle cx="480" cy="160" r="6">
      <animate attributeName="cy" values="160;20" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="492" cy="130" r="4">
      <animate attributeName="cy" values="140;10" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="400" r="8">
      <animate attributeName="cy" values="420;60" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="420" r="5">
      <animate attributeName="cy" values="440;80" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>