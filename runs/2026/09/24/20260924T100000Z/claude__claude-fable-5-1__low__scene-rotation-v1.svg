<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee8e0"/>
      <stop offset="0.5" stop-color="#2fb7b8"/>
      <stop offset="1" stop-color="#136f80"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9b5"/>
      <stop offset="1" stop-color="#d8b98d"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#c8955a"/>
      <stop offset="1" stop-color="#8f6234"/>
    </radialGradient>
  </defs>

  <!-- water background -->
  <rect width="800" height="600" fill="url(#water)"/>

  <!-- shimmering light rays -->
  <g opacity="0.7">
    <polygon points="120,0 200,0 320,420 180,420" fill="url(#ray)"/>
    <polygon points="300,0 360,0 520,440 400,440" fill="url(#ray)"/>
    <polygon points="480,0 560,0 720,400 600,400" fill="url(#ray)"/>
    <polygon points="620,0 680,0 800,300 760,320" fill="url(#ray)"/>
  </g>

  <!-- surface shimmer -->
  <path d="M0 20 Q60 5 120 20 T240 20 T360 20 T480 20 T600 20 T720 20 T840 20" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
  <path d="M0 45 Q60 30 120 45 T240 45 T360 45 T480 45 T600 45 T720 45 T840 45" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

  <!-- distant fish -->
  <g fill="#ffb6a3" opacity="0.8">
    <path d="M640 150 l30 -12 l-8 12 l8 12 z"/>
    <path d="M690 190 l26 -10 l-7 10 l7 10 z"/>
    <path d="M110 140 l-30 -12 l8 12 l-8 12 z"/>
  </g>

  <!-- sandy floor -->
  <path d="M0 470 Q200 450 400 475 T800 465 L800 600 L0 600 Z" fill="url(#sand)"/>

  <!-- left arching coral -->
  <g fill="#ff8a80" stroke="#e0605a" stroke-width="3" stroke-linejoin="round">
    <path d="M40 480 C30 380 60 300 130 240 C200 180 290 150 400 140 L400 175 C300 185 220 210 165 265 C110 320 90 400 95 480 Z"/>
    <path d="M80 480 C70 420 90 350 130 310 C160 280 200 260 240 250 L245 275 C205 285 170 305 150 335 C120 375 110 430 115 480 Z" fill="#ffab9f"/>
  </g>
  <!-- right arching coral -->
  <g fill="#ff8a80" stroke="#e0605a" stroke-width="3" stroke-linejoin="round">
    <path d="M760 480 C770 380 740 300 670 240 C600 180 510 150 400 140 L400 175 C500 185 580 210 635 265 C690 320 710 400 705 480 Z"/>
    <path d="M720 480 C730 420 710 350 670 310 C640 280 600 260 560 250 L555 275 C595 285 630 305 650 335 C680 375 690 430 685 480 Z" fill="#ffab9f"/>
  </g>
  <!-- coral polyps / knobs on arch -->
  <g fill="#ffd0c8">
    <circle cx="140" cy="250" r="9"/><circle cx="200" cy="205" r="8"/><circle cx="280" cy="170" r="8"/>
    <circle cx="660" cy="250" r="9"/><circle cx="600" cy="205" r="8"/><circle cx="520" cy="170" r="8"/>
    <circle cx="70" cy="380" r="7"/><circle cx="730" cy="380" r="7"/>
  </g>

  <!-- foreground small corals and seaweed -->
  <g stroke="#3fd6c6" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M60 490 q10 -40 -5 -80 q-10 -30 10 -60"/>
    <path d="M740 490 q-10 -40 5 -80 q10 -30 -10 -60"/>
  </g>
  <g fill="#ff9e8c">
    <ellipse cx="170" cy="470" rx="22" ry="14"/><ellipse cx="200" cy="480" rx="16" ry="10"/>
    <ellipse cx="620" cy="472" rx="24" ry="14"/><ellipse cx="655" cy="482" rx="15" ry="10"/>
  </g>
  <g fill="#ffcf5a">
    <circle cx="150" cy="462" r="6"/><circle cx="180" cy="456" r="5"/><circle cx="640" cy="458" r="6"/><circle cx="610" cy="462" r="5"/>
  </g>

  <!-- unicycle -->
  <g transform="translate(400 430)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#2b2b2b" stroke-width="7"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#f0f0f0" stroke-width="3"/>
    <g stroke="#dddddd" stroke-width="3">
      <line x1="-34" y1="0" x2="34" y2="0"/><line x1="0" y1="-34" x2="0" y2="34"/>
      <line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/>
    </g>
    <circle cx="0" cy="0" r="6" fill="#444"/>
    <!-- cranks and pedals -->
    <line x1="0" y1="0" x2="18" y2="16" stroke="#444" stroke-width="4"/>
    <line x1="0" y1="0" x2="-18" y2="-16" stroke="#444" stroke-width="4"/>
    <rect x="12" y="12" width="16" height="7" rx="2" fill="#ff8a80"/>
    <rect x="-28" y="-20" width="16" height="7" rx="2" fill="#ff8a80"/>
    <!-- seat post and saddle -->
    <line x1="0" y1="-40" x2="0" y2="-90" stroke="#555" stroke-width="6"/>
    <path d="M-22 -92 Q0 -104 24 -92 Q0 -86 -22 -92 Z" fill="#2b2b2b"/>
  </g>

  <!-- capybara -->
  <g transform="translate(400 300)">
    <!-- back legs -->
    <path d="M-30 40 q-14 30 -26 60 q6 8 14 4 q10 -26 24 -50 Z" fill="#7a5230"/>
    <!-- body -->
    <ellipse cx="0" cy="30" rx="64" ry="42" fill="url(#fur)"/>
    <!-- front leg on pedal -->
    <path d="M30 50 q-6 34 -6 84 q10 6 16 -2 q2 -44 8 -78 Z" fill="#8f6234"/>
    <!-- head -->
    <g transform="translate(58 -10)">
      <ellipse cx="0" cy="0" rx="40" ry="32" fill="url(#fur)"/>
      <!-- snout -->
      <ellipse cx="26" cy="8" rx="20" ry="16" fill="#a9784a"/>
      <ellipse cx="36" cy="6" rx="6" ry="4" fill="#3a2a1a"/>
      <!-- ears -->
      <ellipse cx="-20" cy="-26" rx="9" ry="8" fill="#7a5230"/>
      <ellipse cx="-2" cy="-30" rx="9" ry="8" fill="#7a5230"/>
      <!-- eye -->
      <circle cx="8" cy="-6" r="5" fill="#2b1b0c"/>
      <circle cx="10" cy="-8" r="1.8" fill="#ffffff"/>
      <!-- smile -->
      <path d="M22 18 q8 6 16 0" fill="none" stroke="#3a2a1a" stroke-width="2" stroke-linecap="round"/>
      <!-- cheek blush -->
      <circle cx="16" cy="12" r="6" fill="#ff8a80" opacity="0.5"/>
    </g>
    <!-- front paws out for balance -->
    <path d="M-40 10 q-40 -20 -70 -10 q-4 8 4 10 q30 -6 60 12 Z" fill="#8f6234"/>
    <!-- tiny hat of coral -->
    <path d="M36 -46 q6 -22 22 -20 q4 14 -12 22 Z" fill="#ff8a80"/>
  </g>

  <!-- bubbles -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2">
    <circle cx="470" cy="250" r="6"/><circle cx="485" cy="225" r="4"/><circle cx="478" cy="200" r="8"/>
    <circle cx="495" cy="170" r="5"/><circle cx="250" cy="330" r="5"/><circle cx="240" cy="300" r="8"/>
    <circle cx="560" cy="380" r="4"/><circle cx="575" cy="355" r="6"/>
  </g>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="474" cy="196" r="2"/><circle cx="237" cy="297" r="2"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.8">
    <path d="M150 90 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z"/>
    <path d="M620 110 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z"/>
    <path d="M380 70 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z"/>
  </g>
</svg>