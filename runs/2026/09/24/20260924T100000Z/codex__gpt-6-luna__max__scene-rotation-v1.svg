<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title description">
  <title id="title">Capybara riding a unicycle beneath the sea</title>
  <desc id="description">A playful capybara balances on a unicycle in a dreamy turquoise reef, framed by arching pink corals and shimmering rays from the surface.</desc>

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#28c9c0"/>
      <stop offset="0.42" stop-color="#128a9a"/>
      <stop offset="1" stop-color="#07516e"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff6bf" stop-opacity=".48"/>
      <stop offset="1" stop-color="#fff6bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d9985f"/>
      <stop offset=".55" stop-color="#bf7548"/>
      <stop offset="1" stop-color="#94543c"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5c995"/>
      <stop offset="1" stop-color="#dda36c"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#183d54"/>
      <stop offset="1" stop-color="#102d42"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#fff9c9" stop-opacity=".72"/>
      <stop offset="1" stop-color="#fff9c9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="7"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".22"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Open water and sunlight from the surface -->
  <rect width="1000" height="1000" fill="url(#water)"/>
  <ellipse cx="505" cy="74" rx="360" ry="155" fill="url(#glow)"/>
  <path d="M0 82 Q105 59 210 79 T420 76 T635 78 T845 73 T1000 81
           L1000 0 L0 0Z" fill="#80eee0" opacity=".7"/>
  <path d="M0 82 Q105 59 210 79 T420 76 T635 78 T845 73 T1000 81"
