  <path d="M105 83 L205 83 L405 665 L335 665Z" fill="url(#ray)"/>
  <path d="M320 79 L393 79 L510 681 L458 681Z" fill="url(#ray)" opacity=".8"/>
  <path d="M536 79 L606 79 L675 642 L625 642Z" fill="url(#ray)" opacity=".72"/>
  <path d="M765 78 L850 78 L750 625 L693 625Z" fill="url(#ray)" opacity=".62"/>
  <path d="M0 196 Q225 154 430 192 T1000 184" fill="none"
