<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720"
     viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Flamingo on the Blizzard Pass</title>
  <desc id="description">
    A determined red flamingo rides a skateboard down a steep, snowy mountain
    pass. Icy blue mountains disappear into an overcast blizzard, with gusts
    of snow cutting diagonally across the downhill composition.
  </desc>

  <defs>
    <clipPath id="frame">
      <rect width="960" height="720" rx="20"/>
    </clipPath>
    <pattern id="distant-snow" width="173" height="127"
             patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
        <path d="M12 21l22 8 M105 76l31 11" stroke-width="2" opacity=".65"/>
        <path d="M67 112l12 4 M145 29l17 6" stroke-width="3" opacity=".75"/>
      </g>
      <g fill="#FFFFFF" opacity=".8">
        <circle cx="53" cy="53" r="2"/>
        <circle cx="154" cy="112" r="1.5"/>
      </g>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Flat cloud cover and distant ridgelines. -->
    <path fill="#D7E6EC" d="M0 0h960v720H0z"/>
    <path fill="#E7F0F4"
          d="M0 78L136 92 260 60 390 83 517 57 687 91 833 73 960 104
             V0H0Z"/>
    <path fill="#C3D8E2"
          d="M-50 367L133 124 239 259 359 112 527 330 651 195
             842 383 1014 254V594H-50Z"/>
    <path fill="#EDF4F7"
          d="M28 266L133 124 239 259 207 250 167 215 153 237
             124 197 83 250Z
             M247 261L359 112 461 246 411 221 375 183 359 211
             336 193 309 240Z
             M578 281L651 195 758 301 700 273 675 253 650 267
             632 244Z"/>
    <path fill="#D0E1E9"
          d="M0 334L120 293 225 336 377 285 529 383 661 323
             813 408 960 364V551H0Z"/>
    <path fill="#E5EFF3" opacity=".8"
          d="M0 302C186 279 272 363 438 348
             S749 346 960 424V475
             C725 411 549 428 354 390S115 368 0 385Z"/>

    <!-- Dark flanks of the narrow mountain pass. -->
    <path fill="#8FAFBF"
          d="M0 192L67 226 104 307 151 338 185 429 273 492
             0 468Z"/>
    <path fill="#F2F7F9"
          d="M0 192L67 226 104 307 79 294 55 259 46 299
             19 272 0 280Z"/>
    <path fill="#B3CDDA"
          d="M0 332L48 348 70 392 117 416 146 467 0 441Z"/>
    <path fill="#A5C0CE"
          d="M744 396L821 341 858 368 902 350 960 383V588Z"/>
    <path fill="#F4F8FA"
          d="M744 396L821 341 858 368 902 350 960 383V408
             L909 384 883 398 853 388 823 372 795 397Z"/>

    <!-- The road and its cornice descend across the entire frame. -->
    <path fill="#F6FAFC"
          d="M-30 382C193 416 352 460 545 516
             S829 602 1000 648V760H-30Z"/>
    <path fill="#DCEAF1"
          d="M-30 438C188 462 397 531 548 572
             S843 658 1000 681V760H-30Z"/>
    <path fill="#EDF5F8"
          d="M-30 455C163 476 315 526 459 562
             S741 645 1000 711V760H-30Z"/>
    <path fill="none" stroke="#BBD3E0" stroke-width="3"
          d="M-20 426C145 450 268 485 368 514"/>
    <path fill="none" stroke="#FFFFFF" stroke-width="7"
          d="M-10 460C175 479 348 537 458 566"/>
    <path fill="#C4DAE5"
          d="M0 587L98 605 138 593 236 626 291 622 410 661
             473 657 664 720H0Z"/>
    <path fill="#F8FBFC"
          d="M0 571L94 593 137 584 243 613 291 610 431 654
             468 651 659 720 492 682 432 678 281 638 234 638
             129 611 87 619 0 600Z"/>

    <rect width="960" height="720" fill="url(#distant-snow)"/>

    <!-- Tracks converge toward the moving board. -->
    <g fill="none" stroke-linecap="round">
      <path d="M153 436C277 460 361 491 465 520"
            stroke="#B7CFDD" stroke-width="3"/>
      <path d="M180 456C295 481 379 510 468 534"
            stroke="#CCDDE7" stroke-width="4"/>
      <path d="M268 467l58 16 M350 490l62 17"
            stroke="#FFFFFF" stroke-width="3"/>
    </g>

    <!-- The rider and skateboard share the angle of the descent. -->
    <g transform="translate(559 550) rotate(17)">
      <!-- Wheels remain in contact with the snow. -->
      <g stroke="#294E65" stroke-width="3">
        <path d="M-69 4v13 M64 4v13" fill="none" stroke-width="6"/>
        <circle cx="-69" cy="20" r="13" fill="#769DB3"/>
        <circle cx="64" cy="20" r="13" fill="#769DB3"/>
        <circle cx="-69" cy="20" r="4" fill="#EAF4F8" stroke="none"/>
        <circle cx="64" cy="20" r="4" fill="#EAF4F8" stroke="none"/>
      </g>
      <path d="M-111-12Q-99 1-80 1H80Q98 1 112-14
               L115-7Q102 10 82 10H-82Q-101 10-114-5Z"
            fill="#294E65"/>
      <path d="M-109-12Q-95-3-79-3H80Q97-3 111-14"
            fill="none" stroke="#B5D1DF" stroke-width="5"
            stroke-linecap="round"/>
      <path d="M-78-2H77" stroke="#F7FBFD" stroke-width="2"/>

      <!-- Flexed legs brace the bird against the wind and slope. -->
      <g fill="none" stroke="#D74347" stroke-width="8"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M-57-166L-33-88-64-12-40-9"/>
        <path d="M-15-163L35-88 48-11 76-9"/>
      </g>
      <path fill="#D74347"
            d="M-81-184L-133-200-107-171
               Q-105-142-63-139
               Q-22-137 3-169
               Q9-196-24-207
               Q-56-217-81-184Z"/>

      <!-- Long S-shaped neck, swept forward into the storm. -->
      <path d="M-7-180
               C14-208-31-233-26-264
               C-22-291 21-293 43-310
               C59-323 52-340 63-350"
            fill="none" stroke="#D74347" stroke-width="20"
            stroke-linecap="round"/>
      <path fill="#D74347"
            d="M48-356Q54-372 76-370
               Q96-368 96-353
               Q97-336 77-334
               Q55-334 48-346Z"/>

      <!-- Pale hooked bill, dark tip, and a narrowed eye. -->
      <path fill="#F3F7F8"
            d="M91-359L112-350Q121-343 118-333
               L111-317 97-324 102-340 90-345Z"/>
      <path fill="#294E65"
            d="M103-337L118-332 111-317
               Q101-316 97-324Z"/>
      <path d="M95-348l12 5" fill="none" stroke="#7196AA"
            stroke-width="2"/>
      <circle cx="80" cy="-355" r="3.3" fill="#203F53"/>
      <path d="M73-361l12 3" fill="none" stroke="#203F53"
            stroke-width="2.6" stroke-linecap="round"/>

      <!-- Wing contour: the same red field remains the sole warm accent. -->
      <path d="M-87-181Q-54-192-26-176Q-48-150-87-160"
            fill="none" stroke="#294E65" stroke-width="3"
            stroke-linecap="round"/>
      <path d="M-86-172l-19-5 M-86-163l-16-4"
            fill="none" stroke="#294E65" stroke-width="2.5"
            stroke-linecap="round"/>
    </g>

    <!-- Snow kicked from the rear wheels. -->
    <g fill="#FFFFFF">
      <path d="M493 550L433 521 457 543 405 536 462 560Z"/>
      <ellipse cx="430" cy="527" rx="8" ry="3" transform="rotate(17 430 527)"/>
      <ellipse cx="405" cy="518" rx="5" ry="2" transform="rotate(17 405 518)"/>
      <circle cx="448" cy="516" r="3"/>
      <circle cx="418" cy="546" r="3.5"/>
      <circle cx="388" cy="530" r="2"/>
      <path d="M611 600l47 11-31-1 16 9-37-11Z"/>
    </g>

    <!-- Foreground gusts cross the rider and obscure the pass. -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M-25 89l166 52 M204 157l93 29 M706 86l133 42
               M817 167l170 53 M42 268l97 31 M266 309l145 46
               M691 319l124 40 M782 465l195 62"
            stroke-width="4" opacity=".8"/>
      <path d="M373 76l65 21 M472 119l128 41 M571 278l86 27
               M86 370l71 22 M353 395l94 30 M667 441l69 22
               M716 552l134 42 M123 655l103 32"
            stroke-width="2.5" opacity=".9"/>
      <path d="M-15 513l107 34 M238 570l115 37 M740 665l179 57"
            stroke-width="6" opacity=".85"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="342" cy="226" r="4"/>
      <circle cx="522" cy="301" r="3"/>
      <circle cx="736" cy="244" r="4"/>
      <circle cx="859" cy="425" r="5"/>
      <circle cx="318" cy="449" r="4"/>
      <circle cx="675" cy="503" r="3"/>
      <circle cx="756" cy="620" r="4"/>
      <circle cx="198" cy="540" r="5"/>
    </g>
  </g>
</svg>