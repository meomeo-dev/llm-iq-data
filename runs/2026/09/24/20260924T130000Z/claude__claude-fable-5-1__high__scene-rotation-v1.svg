<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db5c9"/>
      <stop offset="0.55" stop-color="#c6d7e4"/>
      <stop offset="1" stop-color="#e2ecf3"/>
    </linearGradient>
    <linearGradient id="snowGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f6f9"/>
      <stop offset="1" stop-color="#c3d6e5"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e5ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#d9e5ee" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4d8e6"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <g id="gust" stroke="#ffffff" stroke-linecap="round" fill="none">
      <path d="M0 0 l140 62" stroke-width="3" opacity="0.55"/>
      <path d="M30 40 l90 40" stroke-width="2" opacity="0.4"/>
      <path d="M-20 70 l180 80" stroke-width="2.5" opacity="0.5"/>
      <path d="M60 -30 l70 31" stroke-width="1.5" opacity="0.35"/>
      <path d="M-40 20 l110 49" stroke-width="2" opacity="0.3"/>
    </g>
    <g id="flakes" fill="#ffffff">
      <circle cx="0" cy="0" r="3" opacity="0.9"/>
      <circle cx="40" cy="25" r="2" opacity="0.7"/>
      <circle cx="85" cy="10" r="2.5" opacity="0.8"/>
      <circle cx="120" cy="50" r="1.8" opacity="0.6"/>
      <circle cx="20" cy="70" r="2.2" opacity="0.75"/>
      <circle cx="70" cy="90" r="3.2" opacity="0.85"/>
      <circle cx="150" cy="30" r="1.5" opacity="0.5"/>
      <circle cx="110" cy="105" r="2.4" opacity="0.7"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- 远山 -->
  <path d="M0 330 L70 250 L120 290 L190 180 L250 250 L300 225 L370 300 L450 170 L520 240 L580 200 L650 280 L720 220 L800 290 L800 600 L0 600Z" fill="#b6cbdc"/>
  <rect x="0" y="150" width="800" height="300" fill="url(#fog)"/>

  <!-- 左侧岩壁 -->
  <path d="M0 200 L40 230 L90 215 L140 280 L190 300 L250 360 L300 370 L340 420 L0 480Z" fill="#8eabc2"/>
  <path d="M40 230 L90 215 L110 250 L70 262Z" fill="#6f90aa" opacity="0.6"/>
  <path d="M140 280 L190 300 L200 335 L160 325Z" fill="#6f90aa" opacity="0.5"/>
  <path d="M0 200 L40 230 L90 215 L140 280" stroke="#eef4f8" stroke-width="6" fill="none" stroke-linejoin="round" opacity="0.85"/>

  <!-- 右侧岩壁 -->
  <path d="M800 120 L750 170 L700 165 L660 230 L610 250 L570 320 L540 340 L800 560Z" fill="#8eabc2"/>
  <path d="M700 165 L750 170 L740 210 L690 205Z" fill="#6f90aa" opacity="0.6"/>
  <path d="M610 250 L660 230 L665 275 L620 285Z" fill="#6f90aa" opacity="0.5"/>
  <path d="M570 320 L610 330 L600 370 L560 350Z" fill="#6f90aa" opacity="0.45"/>
  <path d="M800 120 L750 170 L700 165 L660 230" stroke="#eef4f8" stroke-width="6" fill="none" stroke-linejoin="round" opacity="0.85"/>

  <!-- 平光雾霾 -->
  <rect width="800" height="600" fill="#dfe9f1" opacity="0.18"/>

  <!-- 坡面 -->
  <path d="M0 255 L800 546 L800 600 L0 600Z" fill="url(#snowGround)"/>
  <path d="M0 255 L800 546" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.85"/>
  <g fill="none" stroke-linecap="round">
    <path d="M0 300 L800 591" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <path d="M150 255 L800 492" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
    <path d="M0 350 L700 605" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <path d="M0 420 L500 602" stroke="#b9cfe0" stroke-width="3" opacity="0.5"/>
    <path d="M0 470 L360 601" stroke="#b9cfe0" stroke-width="2" opacity="0.4"/>
  </g>
  <path d="M0 480 Q120 445 260 525 Q140 565 0 570Z" fill="#f2f6f9" opacity="0.9"/>

  <!-- 背景风雪 -->
  <g opacity="0.5">
    <use xlink:href="#gust" x="-60" y="60"/>
    <use xlink:href="#gust" x="120" y="20"/>
    <use xlink:href="#gust" x="300" y="90"/>
    <use xlink:href="#gust" x="500" y="40"/>
    <use xlink:href="#gust" x="650" y="120"/>
    <use xlink:href="#gust" x="60" y="200"/>
    <use xlink:href="#gust" x="250" y="240"/>
    <use xlink:href="#gust" x="450" y="200"/>
    <use xlink:href="#gust" x="700" y="260"/>
    <use xlink:href="#gust" x="-30" y="330"/>
    <use xlink:href="#gust" x="150" y="380"/>
    <use xlink:href="#gust" x="600" y="380"/>
    <use xlink:href="#gust" x="350" y="450"/>
    <use xlink:href="#gust" x="50" y="480"/>
    <use xlink:href="#gust" x="500" y="520"/>
    <use xlink:href="#gust" x="250" y="540"/>
    <use xlink:href="#gust" x="700" y="480"/>
  </g>

  <!-- 火烈鸟与滑板（沿坡面旋转 20°） -->
  <g transform="translate(400 401) rotate(20)">
    <!-- 柔和阴影 -->
    <ellipse cx="0" cy="0" rx="90" ry="6" fill="#9db6c9" opacity="0.45"/>

    <!-- 后方雪花飞溅 -->
    <path d="M-76 -4 C-96 -14 -112 -34 -140 -46 C-124 -28 -112 -14 -104 4 Z" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="-92" cy="-6" rx="22" ry="9" fill="#ffffff" opacity="0.85"/>
    <circle cx="-125" cy="-30" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="-140" cy="-18" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="-112" cy="-42" r="2.5" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="60" cy="-3" rx="14" ry="5" fill="#ffffff" opacity="0.7"/>

    <!-- 滑板 -->
    <circle cx="-42" cy="-9" r="9" fill="#d8e5ee" stroke="#6f8ea6" stroke-width="2"/>
    <circle cx="42" cy="-9" r="9" fill="#d8e5ee" stroke="#6f8ea6" stroke-width="2"/>
    <circle cx="-42" cy="-9" r="3" fill="#6f8ea6"/>
    <circle cx="42" cy="-9" r="3" fill="#6f8ea6"/>
    <rect x="-46" y="-24" width="8" height="8" fill="#7f97aa"/>
    <rect x="38" y="-24" width="8" height="8" fill="#7f97aa"/>
    <path d="M-70 -40 Q-66 -30 -55 -29 L55 -29 Q66 -30 70 -40 L74 -37 Q68 -24 55 -23 L-55 -23 Q-68 -24 -74 -37 Z" fill="#2c4257"/>
    <path d="M-66 -38 Q-62 -31 -54 -30 L54 -30 Q62 -31 66 -38" stroke="#3f5c74" stroke-width="2" fill="none"/>

    <!-- 腿与蹼足（屈膝压低重心） -->
    <path d="M-28 -29 L-14 -80 L-8 -135" stroke="#2c4257" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -29 L10 -82 L4 -135" stroke="#2c4257" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-40 -29 L-28 -35 L-16 -29Z" fill="#2c4257"/>
    <path d="M10 -29 L22 -35 L34 -29Z" fill="#2c4257"/>

    <!-- 尾羽 -->
    <path d="M-48 -178 L-82 -196 L-70 -180 L-92 -184 L-58 -168Z" fill="#eef3f7" stroke="#b7cddd" stroke-width="1"/>

    <!-- 身体 -->
    <ellipse cx="0" cy="-165" rx="54" ry="34" transform="rotate(10 0 -165)" fill="url(#bodyGrad)" stroke="#b7cddd" stroke-width="1.5"/>

    <!-- 翅膀与黑色飞羽 -->
    <path d="M-42 -160 L-70 -168 L-66 -158 L-88 -160 L-60 -150 Z" fill="#2c4257"/>
    <path d="M-38 -172 C-10 -198 30 -196 48 -178 C30 -164 -5 -156 -42 -160 Z" fill="#e3ecf3" stroke="#bcd2e2" stroke-width="1.5"/>
    <g stroke="#bcd2e2" stroke-width="1.2" fill="none" opacity="0.8">
      <path d="M-20 -186 L-30 -164"/>
      <path d="M0 -190 L-10 -162"/>
      <path d="M20 -188 L12 -164"/>
    </g>

    <!-- 脖颈 -->
    <path d="M40 -176 C56 -196 44 -232 72 -246 C88 -254 100 -250 108 -246" stroke="#c4d8e6" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M40 -176 C56 -196 44 -232 72 -246 C88 -254 100 -250 108 -246" stroke="#f7fafc" stroke-width="11" fill="none" stroke-linecap="round" transform="translate(-2 -3)"/>

    <!-- 头部与喙 -->
    <ellipse cx="108" cy="-246" rx="17" ry="13" fill="#f7fafc" stroke="#b7cddd" stroke-width="1.5"/>
    <path d="M121 -256 C138 -258 150 -250 150 -238 C150 -228 148 -220 145 -214 C138 -224 130 -232 121 -238 Z" fill="#dfe8ef" stroke="#9fb8cb" stroke-width="1"/>
    <path d="M150 -238 C150 -228 148 -220 145 -214 C140 -220 135 -226 133 -232 C139 -236 145 -238 150 -238 Z" fill="#1f2f3f"/>
    <circle cx="114" cy="-250" r="3.2" fill="#1f2f3f"/>
    <circle cx="115" cy="-251" r="1" fill="#ffffff"/>
    <path d="M105 -259 L119 -255" stroke="#2c4257" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 唯一红色点缀：迎风的围巾 -->
    <path d="M40 -202 C15 -212 -5 -200 -30 -212 C-52 -222 -68 -212 -92 -224 C-88 -216 -80 -214 -84 -208 C-64 -206 -52 -216 -32 -204 C-10 -192 12 -204 40 -192 Z" fill="#d7263d"/>
    <path d="M38 -195 L59 -199" stroke="#d7263d" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- 前景风雪 -->
  <g opacity="0.9">
    <use xlink:href="#gust" transform="translate(-100 150) scale(1.4)"/>
    <use xlink:href="#gust" transform="translate(200 300) scale(1.4)"/>
    <use xlink:href="#gust" transform="translate(450 80) scale(1.4)"/>
    <use xlink:href="#gust" transform="translate(600 440) scale(1.4)"/>
    <use xlink:href="#gust" transform="translate(100 520) scale(1.4)"/>
    <use xlink:href="#gust" transform="translate(350 20) scale(1.4)"/>
    <use xlink:href="#gust" transform="translate(700 220) scale(1.4)"/>
  </g>
  <g>
    <use xlink:href="#flakes" x="10" y="10"/>
    <use xlink:href="#flakes" x="180" y="40"/>
    <use xlink:href="#flakes" x="360" y="5"/>
    <use xlink:href="#flakes" x="540" y="30"/>
    <use xlink:href="#flakes" x="700" y="15"/>
    <use xlink:href="#flakes" x="60" y="150"/>
    <use xlink:href="#flakes" x="250" y="170"/>
    <use xlink:href="#flakes" x="440" y="140"/>
    <use xlink:href="#flakes" x="620" y="160"/>
    <use xlink:href="#flakes" x="0" y="290"/>
    <use xlink:href="#flakes" x="160" y="310"/>
    <use xlink:href="#flakes" x="330" y="280"/>
    <use xlink:href="#flakes" x="520" y="300"/>
    <use xlink:href="#flakes" x="690" y="320"/>
    <use xlink:href="#flakes" x="40" y="430"/>
    <use xlink:href="#flakes" x="220" y="450"/>
    <use xlink:href="#flakes" x="400" y="470"/>
    <use xlink:href="#flakes" x="580" y="440"/>
    <use xlink:href="#flakes" x="740" y="480"/>
    <use xlink:href="#flakes" x="120" y="560"/>
  </g>
  <g fill="#ffffff" filter="url(#soft)" opacity="0.7">
    <circle cx="90" cy="120" r="7"/>
    <circle cx="560" cy="90" r="6"/>
    <circle cx="300" cy="560" r="8"/>
    <circle cx="720" cy="400" r="6"/>
  </g>
</svg>