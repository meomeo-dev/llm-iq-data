<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Flamingo skateboarder in a blizzard</title>
  <desc id="desc">A determined flamingo rides a skateboard down a steep snowy mountain pass as wind drives snow across the icy blue scene. One red scarf is the sole warm accent.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#dceaf0"/>
      <stop offset="1" stop-color="#a9c4d1"/>
    </linearGradient>
    <linearGradient id="slope" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f9fcfd"/>
      <stop offset="1" stop-color="#c2d9e2"/>
    </linearGradient>
    <clipPath id="scene">
      <rect width="900" height="600"/>
    </clipPath>
  </defs>

  <g clip-path="url(#scene)">
    <rect width="900" height="600" fill="url(#sky)"/>

    <path d="M0 270 120 120 188 194 318 48 435 191 540 73 656 206 755 102 900 256V600H0Z" fill="#aec6d1"/>
    <path d="m0 302 121-182 69 78L318 48l117 143 105-118 116 133 99-104 145 154v60L0 440Z" fill="#e7f0f3" opacity=".82"/>
    <path d="m0 360 153-63 142 28 149-103 137 37 114-90 205 102v329H0Z" fill="#c4d9e1"/>
    <path d="M0 420 186 337l161 30 145-87 148 33 122-56 138 48v295H0Z" fill="url(#slope)"/>
    <path d="M0 470 163 391l177 34 158-72 160 28 123-53 119 39v233H0Z" fill="#f7fbfc"/>

    <path d="M-30 482 289 393l112 31 131-67 123 21 128-51 188 47" fill="none" stroke="#d3e5eb" stroke-width="8" opacity=".8"/>
    <path d="M10 533 236 458l143 26 121-59 146 24 130-48 134 35" fill="none" stroke="#dceaf0" stroke-width="5"/>

    <g fill="#fff" opacity=".82">
      <path d="M145 160l15 35 35 15-35 15-15 35-15-35-35-15 35-15z"/>
      <path d="M710 260l9 20 20 9-20 9-9 20-9-20-20-9 20-9z"/>
      <path d="M450 112l7 16 16 7-16 7-7 16-7-16-16-7 16-7z"/>
    </g>

    <!-- Skateboard -->
    <g transform="rotate(-18 476 438)">
      <path d="M366 433 Q375 422 392 423 L561 423 Q578 423 587 434 L582 443 Q574 450 558 450 L393 450 Q378 450 370 443Z" fill="#eff7f9" stroke="#526d7a" stroke-width="5"/>
      <path d="M384 434h181" stroke="#8eabb7" stroke-width="3"/>
      <circle cx="401" cy="461" r="12" fill="#5e7884"/>
      <circle cx="550" cy="461" r="12" fill="#5e7884"/>
      <circle cx="401" cy="461" r="4" fill="#dceaf0"/>
      <circle cx="550" cy="461" r="4" fill="#dceaf0"/>
      <path d="M414 447v10m124-10v10" stroke="#526d7a" stroke-width="4"/>
    </g>

    <!-- Flamingo body and wings -->
    <path d="M397 340 Q374 291 405 255 Q437 216 497 237 Q542 253 539 300 Q536 342 483 359 Q432 373 397 340Z" fill="#e9f3f5" stroke="#587584" stroke-width="6"/>
    <path d="M410 319 Q444 278 512 276 Q498 319 449 340 Q426 348 410 319Z" fill="#c9dce3" stroke="#78939e" stroke-width="4"/>
    <path d="M443 253 Q470 231 499 246" fill="none" stroke="#f9fcfd" stroke-width="7" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M423 280 Q409 246 429 215 Q450 184 435 160 Q422 141 398 151" fill="none" stroke="#e9f3f5" stroke-width="20" stroke-linecap="round"/>
    <path d="M423 280 Q409 246 429 215 Q450 184 435 160 Q422 141 398 151" fill="none" stroke="#587584" stroke-width="5" stroke-linecap="round"/>

    <!-- Head and beak -->
    <path d="M391 132 Q413 118 431 136 Q441 147 432 163 Q421 177 400 168 Q384 160 383 147Z" fill="#eff7f9" stroke="#587584" stroke-width="5"/>
    <path d="M391 156 Q367 163 343 158 Q360 150 389 146Z" fill="#d9e8ed" stroke="#587584" stroke-width="4"/>
    <circle cx="407" cy="143" r="4.5" fill="#405a67"/>
    <path d="M399 134 Q412 127 422 136" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

    <!-- Red scarf, sole warm accent -->
    <path d="M416 181 Q434 187 449 178 L456 192 Q437 201 420 195Z" fill="#c52f3d"/>
    <path d="M446 190 Q465 202 469 221 L456 226 Q451 209 438 199Z" fill="#c52f3d"/>

    <!-- Legs braced against the slope -->
    <path d="M448 350 Q451 378 466 402 L493 416" fill="none" stroke="#dceaf0" stroke-width="12" stroke-linecap="round"/>
    <path d="M448 350 Q451 378 466 402 L493 416" fill="none" stroke="#587584" stroke-width="4" stroke-linecap="round"/>
    <path d="M492 416l20 4" fill="none" stroke="#587584" stroke-width="5" stroke-linecap="round"/>

    <path d="M418 350 Q407 377 424 400 L451 407" fill="none" stroke="#dceaf0" stroke-width="12" stroke-linecap="round"/>
    <path d="M418 350 Q407 377 424 400 L451 407" fill="none" stroke="#587584" stroke-width="4" stroke-linecap="round"/>
    <path d="M450 407l20 1" fill="none" stroke="#587584" stroke-width="5" stroke-linecap="round"/>

    <!-- Wind-driven snow -->
    <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".82">
      <path d="M36 207h102m-78 18h130m-186 18h90" stroke-width="4"/>
      <path d="M593 132h112m-75 19h151m-204 19h93" stroke-width="3"/>
      <path d="M92 330h114m-72 18h92m529-8h110m-169 19h133" stroke-width="4"/>
      <path d="M278 102h68m-112 17h55m408 117h73" stroke-width="3"/>
    </g>
    <g fill="#fff" opacity=".9">
      <circle cx="80" cy="276" r="4"/><circle cx="238" cy="193" r="3"/>
      <circle cx="690" cy="191" r="4"/><circle cx="808" cy="312" r="3"/>
      <circle cx="311" cy="246" r="4"/><circle cx="584" cy="289" r="3"/>
      <circle cx="738" cy="80" r="3"/><circle cx="178" cy="91" r="3"/>
      <circle cx="548" cy="376" r="4"/><circle cx="278" cy="438" r="3"/>
    </g>

    <path d="M0 566 Q140 538 272 563 T546 557 T900 547V600H0Z" fill="#edf5f7" opacity=".78"/>
  </g>
</svg>