<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d4de"/>
      <stop offset="1" stop-color="#e8eef2"/>
    </linearGradient>
    <linearGradient id="slope" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#d5e2eb"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f6" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#eef3f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#eef3f6" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="streaks" width="140" height="140" patternUnits="userSpaceOnUse"
             patternTransform="rotate(24)">
      <g stroke="#ffffff" stroke-linecap="round">
        <line x1="5" y1="12" x2="40" y2="12" stroke-width="1.6" opacity="0.8"/>
        <line x1="70" y1="30" x2="95" y2="30" stroke-width="1.2" opacity="0.6"/>
        <line x1="20" y1="58" x2="62" y2="58" stroke-width="2" opacity="0.7"/>
        <line x1="95" y1="75" x2="130" y2="75" stroke-width="1.4" opacity="0.8"/>
        <line x1="40" y1="100" x2="60" y2="100" stroke-width="1.2" opacity="0.5"/>
        <line x1="85" y1="122" x2="125" y2="122" stroke-width="1.8" opacity="0.7"/>
        <line x1="0" y1="135" x2="18" y2="135" stroke-width="1.2" opacity="0.6"/>
      </g>
    </pattern>
    <pattern id="flakes" width="90" height="90" patternUnits="userSpaceOnUse"
             patternTransform="rotate(24)">
      <g fill="#ffffff">
        <circle cx="10" cy="14" r="2.2" opacity="0.9"/>
        <circle cx="52" cy="8" r="1.4" opacity="0.7"/>
        <circle cx="75" cy="40" r="2.6" opacity="0.85"/>
        <circle cx="30" cy="50" r="1.6" opacity="0.7"/>
        <circle cx="62" cy="72" r="1.9" opacity="0.8"/>
        <circle cx="14" cy="80" r="1.3" opacity="0.6"/>
      </g>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Overcast sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Far range -->
  <path d="M0,230 L60,170 L110,200 L180,110 L240,180 L300,140 L370,210 L450,120
           L520,190 L600,100 L680,170 L740,130 L800,160 L800,440 L0,440 Z"
        fill="#b3c3d0"/>
  <path d="M160,130 L180,110 L200,135 L188,128 L178,140 Z
           M432,140 L450,120 L470,146 L456,138 L446,150 Z
           M580,122 L600,100 L622,128 L608,120 L596,134 Z
           M725,146 L740,130 L756,150 L744,145 Z"
        fill="#e4ebf0"/>

  <!-- Mid range -->
  <path d="M0,300 L90,220 L160,270 L260,200 L360,300 L460,255 L560,340 L660,300
           L800,380 L800,540 L0,540 Z"
        fill="#92a8ba"/>
  <path d="M70,238 L90,220 L112,240 L98,236 L88,248 Z
           M238,220 L260,200 L284,224 L268,218 L256,232 Z
           M440,268 L460,255 L482,272 L468,270 Z"
        fill="#dde6ed"/>

  <!-- Haze over the distance -->
  <rect width="800" height="600" fill="url(#haze)"/>
  <rect width="800" height="600" fill="url(#streaks)" opacity="0.55"/>

  <!-- Rocks and marker poles behind the ridge line -->
  <path d="M222,332 L238,310 L258,314 L274,338 L274,352 L222,352 Z" fill="#5c7285"/>
  <path d="M236,314 L258,316 L263,323 L244,320 Z" fill="#f4f8fb"/>
  <path d="M520,432 L532,414 L548,418 L560,440 L520,440 Z" fill="#5c7285"/>
  <g stroke="#3e5366" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="302" x2="146" y2="246"/>
    <line x1="705" y1="490" x2="698" y2="410"/>
  </g>
  <g stroke="#f4f8fb" stroke-width="4">
    <line x1="148" y1="262" x2="147" y2="254"/>
    <line x1="700" y1="428" x2="699" y2="418"/>
  </g>

  <!-- The pass: diagonal snow slope -->
  <path d="M0,250 L800,520 L800,600 L0,600 Z" fill="url(#slope)"/>
  <path d="M0,250 L800,520" stroke="#c0d1dd" stroke-width="3"/>
  <g fill="none" stroke="#cddbe6" stroke-width="2" stroke-linecap="round">
    <path d="M0,300 Q400,410 800,560"/>
    <path d="M0,370 Q380,470 800,592"/>
    <path d="M60,470 Q300,520 560,600"/>
  </g>

  <!-- Flamingo on skateboard, aligned with the slope -->
  <g transform="translate(420,392) rotate(18.6)">
    <!-- Speed lines -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <line x1="-190" y1="-200" x2="-110" y2="-200"/>
      <line x1="-210" y1="-160" x2="-95" y2="-160"/>
      <line x1="-170" y1="-120" x2="-80" y2="-120"/>
      <line x1="-200" y1="-60" x2="-120" y2="-60"/>
    </g>

    <!-- Snow spray from the wheels -->
    <g fill="#ffffff">
      <circle cx="-88" cy="-10" r="14" opacity="0.95"/>
      <circle cx="-108" cy="-22" r="10" opacity="0.85"/>
      <circle cx="-122" cy="-6" r="9" opacity="0.8"/>
      <circle cx="-140" cy="-18" r="6" opacity="0.7"/>
      <circle cx="-156" cy="-8" r="4" opacity="0.6"/>
      <circle cx="-170" cy="-24" r="3" opacity="0.5"/>
    </g>

    <!-- Skateboard -->
    <path d="M-80,-26 Q-72,-16 -58,-16 L58,-16 Q72,-16 80,-26"
          fill="none" stroke="#2c3e50" stroke-width="7" stroke-linecap="round"/>
    <rect x="-50" y="-13" width="12" height="5" fill="#6d8396"/>
    <rect x="38" y="-13" width="12" height="5" fill="#6d8396"/>
    <circle cx="-44" cy="-6" r="6" fill="#e6eef4" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="44" cy="-6" r="6" fill="#e6eef4" stroke="#2c3e50" stroke-width="2"/>

    <!-- Legs -->
    <g fill="none" stroke="#a3101f" stroke-width="5" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M-8,-140 L-38,-82 L-28,-22"/>
      <path d="M12,-140 L-2,-80 L30,-22"/>
    </g>
    <circle cx="-38" cy="-82" r="4.5" fill="#a3101f"/>
    <circle cx="-2" cy="-80" r="4.5" fill="#a3101f"/>
    <path d="M-42,-19 L-16,-19 L-28,-27 Z" fill="#a3101f"/>
    <path d="M20,-19 L46,-19 L30,-27 Z" fill="#a3101f"/>

    <!-- Tail feathers -->
    <path d="M-50,-170 L-82,-184 L-64,-168 L-86,-170 L-62,-160 L-80,-154 L-52,-156 Z"
          fill="#a3101f"/>

    <!-- Body -->
    <path d="M-56,-168 Q-42,-196 6,-194 Q52,-190 52,-162 Q46,-134 4,-132
             Q-38,-132 -56,-168 Z"
          fill="#d7192e"/>
    <!-- Wing tucked tight -->
    <path d="M-52,-168 Q-18,-186 28,-172 Q12,-150 -28,-150 Q-46,-154 -52,-168 Z"
          fill="#a3101f"/>
    <path d="M-30,-158 Q-6,-166 16,-164" fill="none" stroke="#d7192e"
          stroke-width="2" stroke-linecap="round"/>

    <!-- Neck thrust forward -->
    <path d="M34,-180 C62,-190 58,-230 78,-244 C88,-251 96,-246 100,-240"
          fill="none" stroke="#d7192e" stroke-width="12" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="106" cy="-238" r="13" fill="#d7192e"/>
    <!-- Beak -->
    <path d="M114,-246 Q130,-247 142,-238 Q147,-230 140,-219 Q136,-228 126,-232
             Q118,-233 114,-230 Z"
          fill="#eef3f7"/>
    <path d="M142,-238 Q147,-230 140,-219 Q137,-227 133,-232 Q139,-234 142,-238 Z"
          fill="#1c2b3b"/>
    <!-- Eye with a hard, determined brow -->
    <circle cx="108" cy="-241" r="3.8" fill="#ffffff"/>
    <circle cx="109.5" cy="-241" r="2.1" fill="#1c2b3b"/>
    <path d="M99,-251 L115,-244" stroke="#1c2b3b" stroke-width="2.8"
          stroke-linecap="round"/>

    <!-- Snow caked on the back and head -->
    <g fill="#ffffff">
      <ellipse cx="-8" cy="-191" rx="14" ry="3.5"/>
      <ellipse cx="22" cy="-189" rx="7" ry="2.5"/>
      <ellipse cx="102" cy="-250" rx="6" ry="2.2"/>
      <ellipse cx="60" cy="-212" rx="4" ry="2" transform="rotate(-60 60 -212)"/>
    </g>
  </g>

  <!-- Foreground blizzard -->
  <rect width="800" height="600" fill="url(#flakes)"/>
  <rect width="800" height="600" fill="url(#streaks)" opacity="0.4"
        transform="translate(37 21)"/>
  <g fill="#ffffff" filter="url(#soft)" opacity="0.75">
    <circle cx="70" cy="90" r="7"/>
    <circle cx="300" cy="60" r="5"/>
    <circle cx="720" cy="120" r="8"/>
    <circle cx="560" cy="300" r="6"/>
    <circle cx="140" cy="440" r="9"/>
    <circle cx="760" cy="560" r="7"/>
    <circle cx="420" cy="540" r="5"/>
  </g>
</svg>