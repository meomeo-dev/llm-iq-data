<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640"
     role="img" aria-labelledby="title desc">
  <title id="title">Flamingo riding a skateboard through a blizzard</title>
  <desc id="desc">
    An icy blue flamingo in a red scarf rides diagonally down a snowy
    mountain pass, leaning into the wind with a determined expression.
  </desc>

  <rect width="960" height="640" fill="#dcebf2"/>

  <!-- Overcast sky and distant mountains -->
  <path d="M0 0H960V207Q817 191 693 215T430 204Q202 180 0 217Z"
        fill="#e8f2f6"/>
  <path d="M0 328 194 92 377 339 470 270 565 375H0Z"
        fill="#a8c3d3"/>
  <path d="m89 225 105-133 93 126-63-28-30-48-39 67Z"
        fill="#f4f9fa"/>
  <path d="M529 344 795 104 960 294V465H529Z"
        fill="#91b1c4"/>
  <path d="m680 208 115-104 91 105-61-30-30-30-49 47Z"
        fill="#f4f9fa"/>
  <path d="M0 367 138 286 300 383 416 311 579 400 736 304 960 405V520H0Z"
        fill="#c4d9e3"/>

  <!-- The descending pass -->
  <path d="M0 405Q264 447 492 494T960 590V640H0Z"
        fill="#f4f9fa"/>
  <path d="M0 405Q264 447 492 494T960 590"
        fill="none" stroke="#9ebdce" stroke-width="5"/>
  <path d="M0 458Q285 483 475 531T960 627"
        fill="none" stroke="#d2e4ec" stroke-width="18"/>
  <path d="M43 516 221 545M690 557l194 42"
        fill="none" stroke="#bdd4df" stroke-width="4"
        stroke-linecap="round" opacity=".75"/>

  <!-- Wind behind the rider -->
  <g fill="none" stroke="#f7fbfc" stroke-linecap="round">
    <path d="m34 75 149 45M274 50l190 59M680 42l181 54
             M22 181l137 40M721 247l190 56M63 311l133 39"
          stroke-width="5"/>
    <path d="m346 166 90 28M774 340l109 33M100 365l78 18
             M704 455l151 34M23 548l118 27"
          stroke-width="3"/>
  </g>

  <!-- Skateboard and its shadow -->
  <path d="M385 486q103 4 229 47" fill="none"
        stroke="#a9c4d2" stroke-width="18"
        stroke-linecap="round" opacity=".55"/>
  <g transform="rotate(10 500 480)"
     stroke="#294e65" stroke-linejoin="round">
    <circle cx="433" cy="500" r="10" fill="#8fb0c1" stroke-width="4"/>
    <circle cx="570" cy="500" r="10" fill="#8fb0c1" stroke-width="4"/>
    <path d="M396 476Q411 482 423 477H583Q598 482 612 476
             Q607 491 586 489H421Q401 491 396 476Z"
          fill="#426a80" stroke-width="5"/>
    <path d="M424 478H584" fill="none"
          stroke="#e5f0f4" stroke-width="3"/>
  </g>

  <!-- Legs, braced against the slope -->
  <g fill="none" stroke="#476d81" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 351 496 413 465 466"/>
    <path d="M516 353 533 421 552 478"/>
  </g>
  <g fill="none" stroke="#294e65" stroke-width="10"
     stroke-linecap="round">
    <path d="m465 466 28 7"/>
    <path d="m552 478 31 8"/>
  </g>

  <!-- Tail, body, and folded wing -->
  <g stroke="#294e65" stroke-width="5" stroke-linejoin="round">
    <path d="M410 302q-35-2-57-30 1 38 43 63Z"
          fill="#b7d2df"/>
    <path d="M400 291q-29-17-32-43 29 20 53 24Z"
          fill="#d8e9f0"/>
    <path d="M397 314Q389 271 430 253q42-19 91 4
             44 21 42 65-3 43-47 55-57 16-100-15
             Q397 348 397 314Z"
          fill="#d9eaf1"/>
    <path d="M418 304q34-39 94-27 24 5 36 24
             -17 25-56 42-45 19-78-1
             Q407 323 418 304Z"
          fill="#accbd9"/>
    <path d="M430 322q40 8 82-26"
          fill="none" stroke="#eaf4f7" stroke-width="5"/>
  </g>

  <!-- Curved neck and head -->
  <path d="M519 277q31-26 24-66-3-19-8-38
           -13-54 24-74 27-15 55-1
           24 12 28 34 4 24-15 37
           -13 9-28 4-16-5-21-21
           -13 13-6 35 9 29 12 52
           4 51-33 83Z"
        fill="#e4f1f5" stroke="#294e65" stroke-width="6"
        stroke-linejoin="round"/>
  <path d="M635 132q32 1 54 23l-28 23-33-19Z"
        fill="#a9c5d3" stroke="#294e65" stroke-width="5"
        stroke-linejoin="round"/>
  <path d="m676 166-15 12-15-7" fill="#294e65"/>
  <path d="m603 129 24-5" stroke="#294e65" stroke-width="5"
        stroke-linecap="round"/>
  <circle cx="617" cy="139" r="4.5" fill="#294e65"/>

  <!-- The scene's single red accent -->
  <path d="M545 216q19 10 38 1l7 18q-22 12-41 1Z
           M550 222q-35-15-63-8 30 8 47 29Z"
        fill="#d9474b" stroke="#a7323b" stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Snow crossing in front of the rider -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="m74 121 86 27M296 230l58 17M672 193l102 31
             M260 405l99 25M719 384l132 39
             M628 521l113 28M118 589l119 27"
          stroke-width="5" opacity=".9"/>
    <path d="m57 261 40 10M829 128l63 16M326 111l43 11
             M783 508l61 15M318 558l67 15"
          stroke-width="3" opacity=".85"/>
  </g>
</svg>