<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Flamingo riding a skateboard through a blizzard</title>
  <desc id="desc">A determined flamingo leans down a snowy mountain pass on a skateboard. Wind and snow sweep diagonally across an icy blue scene, with a red scarf as the only warm accent.</desc>

  <rect width="800" height="600" fill="#d9eaf0"/>

  <!-- Distant peaks beneath a flat, overcast sky -->
  <path d="M0 278 118 168 187 225 297 104 410 242 515 145 650 261 744 175 800 231V600H0Z" fill="#b9d1dc"/>
  <path d="m185 226 112-122 113 138-62-42-48-54-49 62-32-15Z
           M515 145l135 116-72-34-62-44-33 28Z
           M118 168l69 57-47-20-22-16-27 23Z" fill="#f1f8f9"/>
  <path d="M0 344 151 276 294 331 445 242 611 337 800 279V600H0Z" fill="#c9dfe7"/>

  <!-- The pass drops from upper left to lower right -->
  <path d="M0 329Q281 371 800 551V600H0Z" fill="#f3f9fa"/>
  <path d="M0 329Q281 371 800 551" fill="none" stroke="#97b9c9" stroke-width="8"/>
  <path d="M0 356Q283 402 800 578" fill="none" stroke="#c5dce5" stroke-width="5"/>
  <path d="M0 410Q310 451 667 600" fill="none" stroke="#d4e6eb" stroke-width="4"/>

  <!-- Wind-scoured snow -->
  <g fill="none" stroke="#f8fcfd" stroke-linecap="round" opacity=".86">
    <path d="M-40 90 120 145M134 105l133 43M420 68l171 57M613 117l181 62" stroke-width="5"/>
    <path d="M-22 204 162 267M291 190l123 44M565 226l185 70" stroke-width="3"/>
    <path d="M15 477l176 55M602 390l183 58M505 57l86 32" stroke-width="4"/>
  </g>

  <!-- Skateboard and cast shadow -->
  <ellipse cx="450" cy="480" rx="139" ry="18" transform="rotate(19 450 480)" fill="#a8c6d3" opacity=".55"/>
  <g transform="rotate(19 447 460)">
    <path d="M319 442q-13 6 0 15h249q13-9 1-17-26 8-59 7H361q-23 0-42-5Z" fill="#315e76"/>
    <path d="M322 440q24 7 47 7h145q31 0 52-8" fill="none" stroke="#eaf5f7" stroke-width="5"/>
    <circle cx="361" cy="470" r="13" fill="#234f68"/>
    <circle cx="522" cy="470" r="13" fill="#234f68"/>
    <circle cx="361" cy="470" r="5" fill="#a8cad8"/>
    <circle cx="522" cy="470" r="5" fill="#a8cad8"/>
  </g>

  <!-- Flamingo: low stance, leaning into the descent -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M405 338q-14 46-5 84l-36 23" fill="none" stroke="#789eae" stroke-width="13"/>
    <path d="M443 345q26 36 25 73l39 34" fill="none" stroke="#789eae" stroke-width="13"/>
    <path d="m364 445-30 4m173 3 33 2" fill="none" stroke="#315e76" stroke-width="11"/>

    <path d="M344 309q-29-31-44-23 13 31 47 49Z" fill="#aecdd8"/>
    <path d="M347 292q45-25 92 1 41 23 30 54-10 30-58 31-49 0-72-34-16-25 8-52Z" fill="#d6e8ec" stroke="#719cad" stroke-width="5"/>
    <path d="M367 311q38-17 72 9-12 28-46 29-28 0-39-20Z" fill="#a9cad6"/>
    <path d="M349 322q30 32 74 16" fill="none" stroke="#eaf5f7" stroke-width="6"/>

    <path d="M440 305q40-25 22-67-9-21-29-25-16-3-24 11" fill="none" stroke="#d6e8ec" stroke-width="28"/>
    <path d="M440 305q40-25 22-67-9-21-29-25-16-3-24 11" fill="none" stroke="#719cad" stroke-width="4"/>

    <path d="M388 213q-2-28 20-39 30-15 52 6 16 16 8 39-11 25-43 27-31 2-37-33Z" fill="#d6e8ec" stroke="#719cad" stroke-width="5"/>
    <path d="M389 201q-8-8-14-5m48-31 3-10m18 17 9-9" fill="none" stroke="#719cad" stroke-width="5"/>

    <!-- One red accent: scarf caught by the wind -->
    <path d="M444 248q18-7 27-24l10 12q-8 17-25 25Z
             M467 238q-27-13-62-10l-61-22 38 30q39 15 80 14Z" fill="#c94349"/>
    <path d="m348 208 25 18" fill="none" stroke="#c94349" stroke-width="4"/>

    <path d="M394 218q-12 5-28 6l-8 8q14 12 35 7l14-11Z" fill="#edf6f6" stroke="#719cad" stroke-width="4"/>
    <path d="m358 232 29 8-12 7q-15 2-23-7Z" fill="#315e76"/>
    <path d="m423 202 23-4" fill="none" stroke="#315e76" stroke-width="5"/>
    <circle cx="433" cy="211" r="4" fill="#234f68"/>
  </g>

  <!-- Snow cuts across the foreground -->
  <g stroke="#ffffff" stroke-linecap="round" opacity=".9">
    <path d="m107 74 47 16m49 87 27 10m274-92 54 19m128 189 45 15
             M52 551l56 17m571-70 73 23" stroke-width="4"/>
    <path d="m273 52 17 7m301 111 23 9m-388 272 35 11m350-35 22 7" stroke-width="2"/>
  </g>
</svg>