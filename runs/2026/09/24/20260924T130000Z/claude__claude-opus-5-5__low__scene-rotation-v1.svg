<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c9d6"/>
      <stop offset="1" stop-color="#e3ebf1"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#cfdde8"/>
    </linearGradient>
    <pattern id="flakes" width="60" height="60" patternUnits="userSpaceOnUse"
             patternTransform="rotate(28)">
      <line x1="5" y1="0" x2="5" y2="14" stroke="#fff" stroke-width="2" opacity="0.8"/>
      <line x1="30" y1="22" x2="30" y2="32" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
      <line x1="48" y1="40" x2="48" y2="58" stroke="#fff" stroke-width="2.5" opacity="0.6"/>
      <circle cx="18" cy="48" r="2" fill="#fff" opacity="0.8"/>
      <circle cx="52" cy="12" r="1.5" fill="#fff" opacity="0.9"/>
    </pattern>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- 远处山峰 -->
  <polygon points="0,260 110,120 190,200 290,70 400,210 480,150 600,260 0,260"
           fill="#9fb3c4" opacity="0.6"/>
  <polygon points="380,300 520,130 610,220 700,110 800,230 800,340"
           fill="#8aa1b5" opacity="0.55"/>
  <polyline points="265,100 290,70 318,105" fill="none" stroke="#fff" stroke-width="6" opacity="0.7"/>
  <polyline points="680,135 700,110 725,140" fill="none" stroke="#fff" stroke-width="6" opacity="0.7"/>

  <!-- 暴风雪雾层 -->
  <rect width="800" height="600" fill="#e8eff5" opacity="0.35"/>

  <!-- 主斜坡 -->
  <polygon points="0,250 800,560 800,600 0,600" fill="url(#snow)"/>
  <line x1="0" y1="250" x2="800" y2="560" stroke="#ffffff" stroke-width="4"/>
  <!-- 斜坡上的风吹雪纹 -->
  <path d="M60,320 L300,413 M150,400 L480,528 M40,470 L260,555" stroke="#b7c9d8"
        stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- 被雪覆盖的路桩 -->
  <g fill="#6f889c">
    <rect x="120" y="270" width="6" height="30"/>
    <rect x="640" y="468" width="7" height="38"/>
  </g>
  <rect x="118" y="266" width="10" height="6" rx="3" fill="#fff"/>
  <rect x="637" y="464" width="13" height="7" rx="3" fill="#fff"/>

  <!-- 沿斜坡运动的火烈鸟与滑板 -->
  <g transform="translate(420,413) rotate(21.2)">
    <!-- 速度线 -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="-190" y1="-30" x2="-110" y2="-30"/>
      <line x1="-210" y1="-70" x2="-120" y2="-70"/>
      <line x1="-170" y1="-120" x2="-100" y2="-120"/>
    </g>
    <!-- 雪浪 -->
    <path d="M-80,-2 Q-110,-30 -140,-10 Q-120,-25 -100,-5 Z" fill="#fff"/>

    <!-- 滑板 -->
    <rect x="-75" y="-18" width="150" height="10" rx="5" fill="#2f4a61"/>
    <path d="M-75,-13 Q-88,-20 -84,-28" stroke="#2f4a61" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M75,-13 Q88,-20 84,-28" stroke="#2f4a61" stroke-width="8" fill="none" stroke-linecap="round"/>
    <g fill="#dfe8ef" stroke="#2f4a61" stroke-width="3">
      <circle cx="-48" cy="-3" r="7"/>
      <circle cx="48" cy="-3" r="7"/>
    </g>

    <!-- 腿：屈膝重心前压 -->
    <g stroke="#7d95a8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-25,-18 -5,-60 -20,-95"/>
      <polyline points="30,-18 20,-58 5,-95"/>
    </g>

    <!-- 身体：冷光下的苍白羽毛 -->
    <ellipse cx="-5" cy="-120" rx="52" ry="32" fill="#eef3f7" stroke="#9fb3c4" stroke-width="2"
             transform="rotate(-12 -5 -120)"/>
    <!-- 被风吹向后方的翅膀 -->
    <path d="M-20,-128 Q-70,-150 -95,-120 Q-60,-125 -30,-110 Z" fill="#d5e1ea" stroke="#9fb3c4" stroke-width="2"/>
    <path d="M-50,-135 L-85,-140 M-45,-125 L-80,-126" stroke="#9fb3c4" stroke-width="1.5"/>

    <!-- 前探的脖颈 -->
    <path d="M35,-135 Q75,-160 60,-195 Q48,-220 72,-232"
          stroke="#eef3f7" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M35,-135 Q75,-160 60,-195 Q48,-220 72,-232"
          stroke="#9fb3c4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- 唯一的红色点缀：迎风飘扬的围巾 -->
    <path d="M40,-140 Q10,-150 -30,-160 Q-60,-168 -90,-160 Q-60,-150 -30,-148 Q0,-138 38,-130 Z"
          fill="#d7263d"/>
    <path d="M-90,-160 L-110,-170 M-88,-156 L-112,-158" stroke="#d7263d" stroke-width="3" stroke-linecap="round"/>
    <rect x="30" y="-146" width="18" height="12" rx="4" fill="#d7263d"/>

    <!-- 头部 -->
    <circle cx="80" cy="-236" r="15" fill="#eef3f7" stroke="#9fb3c4" stroke-width="2"/>
    <!-- 眯眼、压低眉线 -->
    <path d="M78,-243 L92,-239" stroke="#1e3344" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="86" cy="-237" rx="3" ry="2" fill="#1e3344"/>
    <!-- 冰灰色的弯喙 -->
    <path d="M93,-236 Q115,-234 118,-218 Q112,-226 94,-228 Z" fill="#c4d3de" stroke="#2f4a61" stroke-width="2"/>
    <path d="M110,-228 Q116,-224 118,-218" stroke="#1e3344" stroke-width="4" fill="none"/>
  </g>

  <!-- 前景暴风雪 -->
  <rect width="800" height="600" fill="url(#flakes)"/>
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.85">
    <line x1="700" y1="40" x2="660" y2="120" stroke-width="3"/>
    <line x1="560" y1="300" x2="530" y2="360" stroke-width="2"/>
    <line x1="200" y1="90" x2="170" y2="150" stroke-width="3"/>
    <line x1="90" y1="420" x2="60" y2="480" stroke-width="2"/>
    <line x1="760" y1="380" x2="735" y2="430" stroke-width="2"/>
  </g>
</svg>