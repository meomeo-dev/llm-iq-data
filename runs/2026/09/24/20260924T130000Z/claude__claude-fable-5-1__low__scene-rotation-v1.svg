<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d8e6"/>
      <stop offset="1" stop-color="#e8eff5"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#cfdde9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="600"/></clipPath>
  </defs>

  <!-- 平光阴天 -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- 远山（被暴风雪吞没） -->
  <polygon points="0,330 120,210 210,270 320,150 430,250 520,190 640,290 800,170 800,600 0,600" fill="#b7c9da" opacity="0.7"/>
  <polygon points="0,400 90,320 180,360 300,260 400,340 480,300 600,380 720,300 800,340 800,600 0,600" fill="#a9bdd0" opacity="0.6"/>

  <!-- 主坡：对角线构图 -->
  <polygon points="0,260 800,560 800,600 0,600" fill="url(#snow)"/>
  <polygon points="0,300 800,600 0,600" fill="#dbe6ef"/>
  <!-- 坡面纹理 -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="330" x2="220" y2="390"/>
    <line x1="300" y1="430" x2="470" y2="494"/>
    <line x1="520" y1="530" x2="700" y2="597"/>
  </g>

  <!-- 右上方冰崖 -->
  <polygon points="600,0 800,0 800,150 720,110 660,60" fill="#9fb4c8" opacity="0.6"/>
  <polygon points="700,0 800,0 800,90 740,40" fill="#8ea6bc" opacity="0.5"/>

  <!-- 滑板在坡上的影子 -->
  <ellipse cx="420" cy="452" rx="95" ry="10" fill="#a4b8cb" opacity="0.5" transform="rotate(20 420 452)"/>

  <!-- 火烈鸟 + 滑板（整体沿坡向右下倾斜） -->
  <g transform="translate(400 380) rotate(20)">
    <!-- 滑板 -->
    <g>
      <rect x="-90" y="52" width="180" height="12" rx="6" fill="#7f97ad"/>
      <path d="M-90,58 q-14,-4 -12,-14" stroke="#7f97ad" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M90,58 q14,-4 12,-14" stroke="#7f97ad" stroke-width="10" fill="none" stroke-linecap="round"/>
      <rect x="-62" y="64" width="20" height="6" fill="#5f7891"/>
      <rect x="42" y="64" width="20" height="6" fill="#5f7891"/>
      <circle cx="-60" cy="76" r="8" fill="#e6eef5" stroke="#5f7891" stroke-width="2"/>
      <circle cx="-38" cy="76" r="8" fill="#e6eef5" stroke="#5f7891" stroke-width="2"/>
      <circle cx="40" cy="76" r="8" fill="#e6eef5" stroke="#5f7891" stroke-width="2"/>
      <circle cx="62" cy="76" r="8" fill="#e6eef5" stroke="#5f7891" stroke-width="2"/>
    </g>

    <!-- 腿：前倾蹲姿，一腿弯曲一腿撑后 -->
    <g stroke="#dfe7ee" stroke-width="7" stroke-linecap="round" fill="none">
      <polyline points="-10,-20 -30,15 -48,52"/>
      <polyline points="6,-20 30,10 40,52"/>
    </g>
    <!-- 脚 -->
    <path d="M-58,52 l20,0 l-6,-6" stroke="#dfe7ee" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M30,52 l20,0 l-6,-6" stroke="#dfe7ee" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- 身体（火烈鸟被冰蓝色调统一为浅色，主体压低前倾） -->
    <ellipse cx="0" cy="-45" rx="52" ry="30" fill="#f2f6fa" stroke="#c4d3e0" stroke-width="3" transform="rotate(-12)"/>
    <!-- 翅膀（后收） -->
    <path d="M-10,-55 q-40,-5 -70,20 q40,-2 60,-8 z" fill="#e3ebf2" stroke="#c4d3e0" stroke-width="3"/>
    <!-- 尾羽 -->
    <path d="M-48,-40 q-22,8 -30,24 q18,-4 34,-12 z" fill="#e3ebf2" stroke="#c4d3e0" stroke-width="3"/>

    <!-- 颈：前伸弯曲，表现坚决 -->
    <path d="M40,-60 q30,-30 20,-80 q-6,-28 26,-40" stroke="#f2f6fa" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M40,-60 q30,-30 20,-80 q-6,-28 26,-40" stroke="#c4d3e0" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M40,-60 q30,-30 20,-80 q-6,-28 26,-40" stroke="#f2f6fa" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- 头 -->
    <g transform="translate(90 -182)">
      <ellipse cx="0" cy="0" rx="20" ry="16" fill="#f2f6fa" stroke="#c4d3e0" stroke-width="3"/>
      <!-- 喙：向下弯，眯眼向前 -->
      <path d="M16,-2 q26,4 30,24 q-4,6 -12,4 q-8,-14 -22,-18 z" fill="#5a6f84"/>
      <path d="M22,4 q14,4 20,18" stroke="#3b4f63" stroke-width="3" fill="none"/>
      <!-- 眼：细窄，坚决 -->
      <path d="M-2,-4 l10,-2" stroke="#2e3e4e" stroke-width="3" stroke-linecap="round"/>
      <circle cx="4" cy="-2" r="2.4" fill="#2e3e4e"/>
    </g>

    <!-- 唯一红色点缀：围巾，被风向后吹 -->
    <path d="M56,-92 q10,10 22,6 q6,-6 -2,-16 q-12,-4 -20,10 z" fill="#d4322c"/>
    <path d="M58,-88 q-40,10 -90,-4 q-20,-6 -46,10 q26,-8 50,2 q40,10 86,-4 z" fill="#d4322c"/>
    <path d="M56,-84 q-30,20 -70,26 q-18,4 -36,20 q22,-10 40,-12 q36,-4 66,-30 z" fill="#b8241f"/>
  </g>

  <!-- 板下扬起的雪雾 -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="330" cy="430" rx="42" ry="14" transform="rotate(20 330 430)"/>
    <ellipse cx="290" cy="418" rx="26" ry="10" transform="rotate(20 290 418)"/>
    <circle cx="262" cy="404" r="7"/>
    <circle cx="245" cy="396" r="4"/>
  </g>

  <!-- 暴风雪：斜向风雪条带 -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.7" clip-path="url(#frame)">
    <g stroke-width="2">
      <line x1="40" y1="30" x2="120" y2="70"/>
      <line x1="200" y1="10" x2="300" y2="60"/>
      <line x1="380" y1="40" x2="460" y2="80"/>
      <line x1="520" y1="90" x2="640" y2="150"/>
      <line x1="90" y1="140" x2="190" y2="190"/>
      <line x1="280" y1="170" x2="360" y2="210"/>
      <line x1="450" y1="200" x2="580" y2="265"/>
      <line x1="20" y1="230" x2="80" y2="260"/>
      <line x1="640" y1="300" x2="760" y2="360"/>
      <line x1="560" y1="420" x2="660" y2="470"/>
      <line x1="140" y1="470" x2="230" y2="515"/>
      <line x1="60" y1="540" x2="140" y2="580"/>
      <line x1="690" y1="500" x2="780" y2="545"/>
    </g>
    <g stroke-width="1.2" opacity="0.6">
      <line x1="150" y1="80" x2="210" y2="110"/>
      <line x1="330" y1="110" x2="410" y2="150"/>
      <line x1="600" y1="40" x2="700" y2="90"/>
      <line x1="230" y1="300" x2="300" y2="335"/>
      <line x1="500" y1="330" x2="560" y2="360"/>
      <line x1="700" y1="200" x2="790" y2="245"/>
      <line x1="380" y1="520" x2="470" y2="565"/>
      <line x1="10" y1="380" x2="70" y2="410"/>
    </g>
  </g>
  <!-- 雪粒 -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="70" cy="90" r="2.5"/><circle cx="250" cy="130" r="2"/><circle cx="430" cy="20" r="2.5"/>
    <circle cx="560" cy="60" r="2"/><circle cx="700" cy="130" r="3"/><circle cx="160" cy="250" r="2"/>
    <circle cx="620" cy="240" r="2.5"/><circle cx="740" cy="420" r="2"/><circle cx="100" cy="440" r="2.5"/>
    <circle cx="350" cy="560" r="2"/><circle cx="520" cy="500" r="2.5"/><circle cx="40" cy="330" r="2"/>
  </g>

  <!-- 风雪压暗四角，增强阴天低对比 -->
  <rect width="800" height="600" fill="#b8cadb" opacity="0.12"/>
</svg>