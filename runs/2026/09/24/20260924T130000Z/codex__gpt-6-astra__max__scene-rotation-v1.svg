<svg xmlns="http://www.w3.org/2000/svg"
     width="1040" height="800" viewBox="0 0 1040 800"
     role="img" aria-labelledby="title description">
  <title id="title">Through the Whiteout</title>
  <desc id="description">
    An ice-blue flamingo with a single red scarf rides a skateboard down
    an icy slope through a snowy mountain pass. Its long neck leans forward,
    its legs brace against the board, and its narrowed eye faces the blizzard.
    Angular mountains and wind-driven snow follow the diagonal composition
    under flat, overcast light.
  </desc>

  <defs>
    <clipPath id="snowfield">
      <path d="M0 460 L92 489 L171 510 L282 555 L381 580
               L493 620 L599 653 L733 699 L828 727 L927 761
               L1040 798 V800 H0 Z"/>
    </clipPath>
  </defs>

