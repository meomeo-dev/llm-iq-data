<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720"
     viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Flamingo riding through a mountain blizzard</title>
  <desc id="desc">
    An icy white flamingo wearing a single red scarf crouches determinedly on
    a skateboard, descending a diagonal snowy mountain pass. Blue mountains,
    wind-driven snow, and a steep drop surround the bird beneath an overcast sky.
  </desc>

  <defs>
    <clipPath id="frame">
      <rect width="960" height="720" rx="20"/>
    </clipPath>
    <pattern id="distantSnow" width="131" height="97"
             patternUnits="userSpaceOnUse">
      <path d="M12 20l19 8 M77 65l27 11 M112 6l12 5"
            fill="none" stroke="#f4fbff" stroke-width="2" opacity=".55"/>
      <circle cx="43" cy="78" r="2" fill="#ffffff" opacity=".7"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Flat cloud cover and the enclosing mountain pass. -->
    <path fill="#cadce7" d="M0 0h960v720H0z"/>
    <path fill="#dce9ef"
          d="M0 99L124 79l125 22 135-39 124 24 126-29 154 35 172-17V0H0z"/>
    <path fill="#b7cfdc"
          d="M0 333L144 140l85 89L347 80l157 234L646 136l97 116
             78-100 139 173v242H0z"/>
    <path fill="#e8f2f6"
          d="M144 140l-54 117 57-32 28 38 54-34z
             M347 80l-91 156 61-33 37 30 29-24 48 45z
             M646 136l-71 127 61-32 34 37 27-28z
             M821 152l-54 107 51-31 37 40z"/>
    <path fill="#9fbecd"
          d="M0 248L78 189l103 134 42-31 121 160 47 31H0z"/>
    <path fill="#d2e3eb"
          d="M0 248l78-59 24 105-41-26-22 34L0 291z"/>
    <path fill="#88acbf"
          d="M960 236l-103 68-34 91-80 56-70 170 287 67z"/>
    <path fill="#bcd3df"
          d="M960 236l-103 68-34 91 44-19 24-53 69-36z"/>
    <path fill="#769db4"
          d="M960 391l-68 46-19 96-77 106 164 67z"/>
    <path fill="#e2edf3" opacity=".7"
          d="M0 349l254-18 202 49 188 29 316 12v62l-290-30
             -248-19-206-46L0 403z"/>
    <rect width="960" height="720" fill="url(#distantSnow)"/>

    <!-- The traversable ledge descends across the entire composition. -->
    <path fill="#f4f9fc"
          d="M-60 383Q143 387 331 444L1020 658v122H-60z"/>
    <path fill="#d5e6ef"
          d="M-40 453Q177 450 352 508L960 694v62H-40z"/>
    <path fill="#b4d0df"
          d="M-20 556l188 12 132 47 162 23 169 82H-20z"/>
    <path fill="none" stroke="#ffffff" stroke-width="7"
          d="M-20 388Q161 396 331 444l657 204"/>
    <path fill="none" stroke="#c0d9e7" stroke-width="3"
          d="M0 424l139 13 119 30 M707 594l205 63
             M28 508l113 16 M761 677l118 21"/>
    <path fill="#92b6ca" d="M110 566l29-18 24 30z M827 655l23-14 30 28z"/>

    <!-- Compressed tracks and a shallow contact shadow. -->
    <path d="M51 414Q258 446 490 515 M33 425Q236 453 479 528"
          fill="none" stroke="#aacbde" stroke-width="3" opacity=".7"/>
    <ellipse cx="545" cy="550" rx="138" ry="12"
             transform="rotate(17 545 550)" fill="#9ebed1" opacity=".45"/>

    <!-- Board, trucks, and wheels follow the fall line. -->
    <g transform="translate(539 519) rotate(17)">
      <g stroke="#345d75" stroke-width="5">
        <path d="M-80 13v14m-12 0h27 M76 13v14M64 27h26"/>
      </g>
      <g fill="#31546c" stroke="#eff8fc" stroke-width="3">
        <circle cx="-79" cy="32" r="14"/>
        <circle cx="77" cy="32" r="14"/>
      </g>
      <g fill="#93b9cf">
        <circle cx="-79" cy="32" r="5"/>
        <circle cx="77" cy="32" r="5"/>
      </g>
      <path d="M-130-9Q-118 9-95 10H96q23-1 34-20"
            fill="none" stroke="#31546c" stroke-width="12"
            stroke-linecap="round"/>
      <path d="M-130-12Q-118 3-95 4H96q23-1 34-17"
            fill="none" stroke="#e9f5fa" stroke-width="8"
            stroke-linecap="round"/>
      <path d="M-98 2H97" stroke="#709ab4" stroke-width="4"/>
      <path d="M-79 0h35 M37 0h34"
            stroke="#31546c" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Bent legs brace the flamingo against the wind and slope. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M465 370l-39 59 70 69-21 4"
            stroke="#496f89" stroke-width="13"/>
      <path d="M511 380l62 64-9 78 33 11"
            stroke="#496f89" stroke-width="13"/>
      <path d="M465 370l-39 59 70 69"
            stroke="#c5e0ed" stroke-width="7"/>
      <path d="M511 380l62 64-9 78"
            stroke="#c5e0ed" stroke-width="7"/>
      <path d="M476 502l29 8m-12-12 21 11 M565 523l37 12m-21-11 28 11"
            stroke="#496f89" stroke-width="6"/>
    </g>

    <!-- Pale plumage stays inside the icy palette. -->
    <path d="M392 325l-55-33 21 41-37-7 51 38"
          fill="#dbeef6" stroke="#496f89" stroke-width="4"
          stroke-linejoin="round"/>
    <path d="M374 318
             C409 289 480 296 525 327
             C552 345 553 371 528 390
             C494 412 420 391 381 365
             Q356 347 374 318Z"
          fill="#f4fbfe" stroke="#496f89" stroke-width="4"/>
    <path d="M383 350q52 50 129 36-27 27-87 4z" fill="#c0deec"/>
    <path d="M391 324q55-19 109 29-30 34-91 5"
          fill="#d8ecf5" stroke="#749bb2" stroke-width="3"
          stroke-linecap="round"/>
    <path d="M412 334l53 23m-60-8 40 19"
          stroke="#aacbde" stroke-width="3" stroke-linecap="round"/>

    <!-- The long neck reaches forward into the blizzard. -->
    <path d="M518 348
             C570 353 589 326 578 297
             C569 272 541 257 550 228
             C558 201 599 192 638 216"
          fill="none" stroke="#496f89" stroke-width="31"
          stroke-linecap="round"/>
    <path d="M518 348
             C570 353 589 326 578 297
             C569 272 541 257 550 228
             C558 201 599 192 638 216"
          fill="none" stroke="#edf8fc" stroke-width="23"
          stroke-linecap="round"/>
    <path d="M523 354q64 0 59-41"
          fill="none" stroke="#bdddea" stroke-width="7"
          stroke-linecap="round"/>

    <!-- A single red accent: scarf pulled sharply uphill by the wind. -->
    <path d="M558 263
             C515 270 495 237 459 242
             L415 232l20 22-27 5
             C459 256 491 292 550 283Z"
          fill="#d63e49"/>
    <path d="M551 260l21 9-6 21-25-14z" fill="#d63e49"/>
    <path d="M548 278q-19 15-50 12l-36-4 18 16-17 7
             q56 7 97-25z" fill="#d63e49"/>

    <!-- Low brow, forward gaze, and hooked bill. -->
    <path d="M613 197
             C632 193 654 202 665 216
             L663 236q-27 12-49-4
             C598 222 598 206 613 197Z"
          fill="#f2faff" stroke="#496f89" stroke-width="4"/>
    <path d="M656 218l35 15q11 8 5 23l-14 23-10-26-20-17z"
          fill="#bad9e9" stroke="#496f89" stroke-width="4"
          stroke-linejoin="round"/>
    <path d="M682 240l17 6q0 16-17 33l-10-26z" fill="#294c64"/>
    <path d="M633 213l15 6" stroke="#294c64" stroke-width="4"
          stroke-linecap="round"/>
    <circle cx="640" cy="222" r="4" fill="#294c64"/>
    <circle cx="641" cy="221" r="1" fill="#ffffff"/>

    <!-- Snow shears away from the wheels and streams across the foreground. -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M441 530l-57-10m52 19-88-10m69 22-41 1"
            stroke-width="5"/>
      <path d="M637 576l-26 3m10-10-45-4" stroke-width="4"/>
      <path d="M-30 122l156 53 M169 39l127 44 M331 130l99 34
               M698 75l154 53 M769 199l148 51 M34 274l137 47
               M225 223l114 39 M718 352l160 55 M62 618l139 48
               M298 571l92 31 M667 628l140 48"
            stroke-width="4" opacity=".8"/>
      <path d="M12 188l57 20 M270 322l67 23 M433 173l54 18
               M705 290l59 20 M860 517l87 30 M179 536l54 18
               M37 682l50 17 M804 47l76 26"
            stroke-width="2" opacity=".9"/>
      <path d="M-40 340l212 72 M742 468l248 85 M102 92l95 33"
            stroke-width="8" opacity=".5"/>
    </g>
    <g fill="#ffffff">
      <circle cx="356" cy="491" r="4"/>
      <circle cx="394" cy="513" r="3"/>
      <circle cx="364" cy="544" r="5"/>
      <circle cx="323" cy="529" r="3"/>
      <circle cx="608" cy="573" r="3"/>
      <circle cx="735" cy="244" r="4"/>
      <circle cx="486" cy="120" r="3"/>
      <circle cx="217" cy="381" r="4"/>
      <circle cx="873" cy="603" r="5"/>
      <circle cx="571" cy="646" r="4"/>
    </g>
  </g>
</svg>