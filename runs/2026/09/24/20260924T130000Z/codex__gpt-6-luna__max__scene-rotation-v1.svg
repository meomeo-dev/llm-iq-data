<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"
     viewBox="0 0 1200 800" role="img"
     aria-labelledby="title description">
  <title id="title">Flamingo riding a skateboard through a blizzard</title>
  <desc id="description">
    A determined red flamingo rides diagonally down an icy mountain pass as
    wind-driven snow sweeps across the scene.
  </desc>

  <rect width="1200" height="800" fill="#DCEAF2"/>
  <path d="M0 0h1200v171c-190-21-298 9-454-4S411 133 0 194Z"
        fill="#EAF3F7"/>
  <path d="M0 154c229-35 344 12 545-4s399-59 655-12v98
           c-216-22-402 38-617 19S207 219 0 267Z"
        fill="#D2E3ED" opacity=".76"/>

  <!-- Distant mountain walls frame the pass. -->
  <path d="M0 475V337l85-75 105-139 154 235 91-98 164 215Z"
        fill="#AFC9D9"/>
  <path d="m44 375 41-113 41 84 64-223 63 133 49 102-78-56-35 64-48-82-52 98Z"
        fill="#F5F9FB"/>
  <path d="m190 123 21 103 32-35 26 65 43 24-49-102-73-74Z"
        fill="#D7E7EF"/>
  <path d="M520 484 680 327l116 55 221-265 183 236v168Z"
        fill="#A9C5D6"/>
  <path d="m680 327 71 84 45-29 93-119 128-146 68 145-83-72-35 105-57-37-69 109-63-28-83 61Z"
        fill="#F5F9FB"/>
  <path d="m1017 117 39 147 42-43 53 70 43 62-60-55-39 53-28-77-39 15-30-82Z"
        fill="#D6E6EE"/>

  <!-- Shadowed slopes recede into the mountain pass. -->
  <path d="M0 473 222 342l141 81 137-74 172 145H0Z" fill="#BDD3E0"/>
  <path d="m222 342 84 47 57 34-85-13-32 44-57-33Z" fill="#E8F1F5"/>
  <path d="M548 487 715 393l132 55 146-97 207 113v91H548Z"
        fill="#C1D7E3"/>
  <path d="m715 393 78 45 54 10-56 18-38 48-54-34-61 30Z"
        fill="#EDF4F7"/>

  <!-- Wind-driven snow streaks cross the pass. -->
  <g fill="none" stroke-linecap="round">
    <path d="M-35 244 136 291M108 199l118 33M250 276l187 47
             M474 204l147 38M664 271l194 48M893 197l158 36
             M1056 303l187 47M-26 389l173 43M166 368l104 25
             M321 419l204 48M754 369l156 37M956 421l201 49"
          stroke="#F7FAFC" stroke-width="5" opacity=".84"/>
    <path d="M-58 301l105 25M293 197l81 20M425 353l104 26
             M576 313l89 22M813 229l125 31M1008 247l96 24
             M118 451l128 31M553 438l105 26M883 475l153 37
             M1101 388l135 33"
          stroke="#8FB0C3" stroke-width="2.5" opacity=".48"/>
  </g>

  <!-- Wind-carved snowbank and the descending slope. -->
  <path d="M0 443c156 5 298 45 466 86 210 52 434 126 734 205v66H0Z"
        fill="#F5F9FB"/>
  <path d="M0 483c182 16 310 62 489 109 226 59 452 118 711 188v20
           c-270-58-493-115-720-174C301 582 163 530 0 517Z"
        fill="#D7E7EF"/>
  <path d="M0 619c225 16 443 93 648 134 196 40 358 76 552 93v-46
           c-187-26-354-64-541-107C431 648 235 565 0 554Z"
        fill="#E6F0F5"/>
  <path d="M45 524c156 20 276 56 412 91M754 630c144 40 252 67 369 91"
        fill="none" stroke="#B8CFDD" stroke-width="4" opacity=".72"
        stroke-linecap="round"/>

  <!-- Skateboard, angled with the slope. -->
  <g>
    <path d="M438 508 454 512 459 537 443 533Z
             M728 586 744 590 749 615 733 611Z"
          fill="#29465F"/>
    <path d="M425 521 454 530M715 599 744 608"
          fill="none" stroke="#29465F" stroke-width="7"
          stroke-linecap="round"/>
    <circle cx="439" cy="543" r="13" fill="#29465F"/>
    <circle cx="459" cy="548" r="13" fill="#29465F"/>
    <circle cx="729" cy="620" r="13" fill="#29465F"/>
    <circle cx="749" cy="625" r="13" fill="#29465F"/>
    <circle cx="439" cy="543" r="5" fill="#B7D0DE"/>
    <circle cx="459" cy="548" r="5" fill="#B7D0DE"/>
    <circle cx="729" cy="620" r="5" fill="#B7D0DE"/>
    <circle cx="749" cy="625" r="5" fill="#B7D0DE"/>
    <path d="M380 481q7-10 19-6l397 108q17 5 12 17l-3 7q-4 10-19 6L389 505q-16-4-12-15Z"
          fill="#527D98" stroke="#29465F" stroke-width="5"
          stroke-linejoin="round"/>
    <path d="M407 490 783 593" fill="none" stroke="#A8C4D4"
          stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bent legs brace against the deck. -->
  <g fill="none" stroke="#29465F" stroke-width="9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M531 345q-19 32-23 67l17 72q5 20 29 31l20 6"/>
    <path d="M573 340q29 28 51 54l15 83q4 29 26 46l18 8"/>
  </g>
  <g fill="#29465F">
    <circle cx="508" cy="412" r="6"/>
    <circle cx="624" cy="394" r="6"/>
  </g>
  <path d="M554 515q15 9 31 7M678 563q15 9 29 7"
        fill="none" stroke="#29465F" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Tail and plumage. -->
  <path d="M489 307q-31-25-60-18 19 28 53 38Z"
        fill="#E34D59" stroke="#29465F" stroke-width="3"
        stroke-linejoin="round"/>
  <ellipse cx="548" cy="316" rx="79" ry="47"
           transform="rotate(13 548 316)"
           fill="#E34D59" stroke="#29465F" stroke-width="4"/>

  <!-- Long neck curves forward into the blizzard. -->
  <path d="M597 326c38-22 14-48 37-77 17-22 44-34 73-39"
        fill="none" stroke="#29465F" stroke-width="32"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M597 326c38-22 14-48 37-77 17-22 44-34 73-39"
        fill="none" stroke="#E34D59" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wing and feather marks. -->
  <path d="M493 307q43-33 94-6 18 10 24 23-37 34-79 30-27-11-39-47Z"
        fill="#E34D59" stroke="#29465F" stroke-width="3"
        stroke-linejoin="round"/>
  <g fill="none" stroke="#29465F" stroke-width="3"
     stroke-linecap="round" opacity=".62">
    <path d="M516 323q31-16 66-7"/>
    <path d="M523 335q27-12 48-8"/>
  </g>

  <!-- Head and bent beak. -->
  <ellipse cx="725" cy="204" rx="21" ry="14"
           transform="rotate(-11 725 204)"
           fill="#E34D59" stroke="#29465F" stroke-width="3"/>
  <path d="M740 202 779 197 769 209q-9 5-15-1"
        fill="#29465F" stroke="#29465F" stroke-width="2"
        stroke-linejoin="round"/>
  <circle cx="731" cy="199" r="3.6" fill="#20394F"/>
  <circle cx="732" cy="198" r="1.1" fill="#F5F9FB"/>

  <!-- A final veil of windblown snow. -->
  <g fill="none" stroke="#F7FAFC" stroke-width="4"
     stroke-linecap="round" opacity=".86">
    <path d="M305 290l94 24M848 274l114 29M1002 513l105 26
             M53 378l80 20M792 442l72 18"/>
  </g>
  <g fill="#F7FAFC" opacity=".95">
    <circle cx="183" cy="319" r="3"/>
    <circle cx="342" cy="236" r="2.5"/>
    <circle cx="661" cy="185" r="3"/>
    <circle cx="867" cy="343" r="3.5"/>
    <circle cx="1069" cy="276" r="2.5"/>
    <circle cx="949" cy="573" r="3"/>
    <circle cx="274" cy="465" r="2.5"/>
  </g>
</svg>