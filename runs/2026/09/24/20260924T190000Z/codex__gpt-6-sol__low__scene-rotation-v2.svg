    <path d="M9 27h23v117H9zm36 12h16v101H45zm29-17h28v117H74zm40 26h18v85h-18zm33-15h25v97h-25zm37 18h15v76h-15zm31-22h23v95h-23zm38 15h19v77h-19zm32-9h18v75h-18z"/>
