<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pelican cycling through a library aisle</title>
  <desc id="desc">A worm's-eye view between towering bookshelves. A mischievous pelican rides a bicycle beneath one lemon-yellow desk lamp.</desc>

  <rect width="800" height="1000" fill="#fff"/>
  <path d="M0 0h800v1000H0z" fill="#111"/>

  <!-- Shelves converge toward the ceiling. -->
  <path d="M0 0 331 0 373 417 0 1000Z" fill="#f8f8f5" stroke="#111" stroke-width="8"/>
  <path d="M469 0h331v1000L427 417Z" fill="#f8f8f5" stroke="#111" stroke-width="8"/>
  <path d="M331 0h138l-42 417h-54Z" fill="#fff" stroke="#111" stroke-width="7"/>

  <g stroke="#111" stroke-width="7" fill="none">
    <path d="M0 184 345 155M0 391l356-86M0 639l367-181M0 868l367-341"/>
    <path d="M800 184 455 155M800 391l-356-86M800 639 433 458M800 868 433 527"/>
    <path d="M80 0 77 924M214 0 265 691M720 0l3 924M586 0 535 691"/>
  </g>

