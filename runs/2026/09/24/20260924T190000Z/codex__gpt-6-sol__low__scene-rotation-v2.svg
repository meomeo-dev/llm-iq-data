  </g>
  <g transform="translate(800 0) scale(-1 1)" fill="#111">
    <path d="M9 27h23v117H9zm36 12h16v101H45zm29-17h28v117H74zm40 26h18v85h-18zm33-15h25v97h-25zm37 18h15v76h-15zm31-22h23v95h-23zm38 15h19v77h-19zm32-9h18v75h-18z"/>
    <path d="M16 218h28v155H16zm42 13h20v139H58zm35-16h32v146H93zm47 27h22v111h-22zm38-23h29v126h-29zm43 10h21v108h-21zm34-16h26v116h-26zm40 18h22v98h-22z"/>
