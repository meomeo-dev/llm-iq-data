  </g>
  <path d="M222 567q32-26 67-12" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round"/>
  <path d="m105 720-39 25m50 8-57 35m59 0-34 28" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
</svg>