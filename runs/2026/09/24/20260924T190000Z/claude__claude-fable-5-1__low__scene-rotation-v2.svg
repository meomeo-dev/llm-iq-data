<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="lamp" cx="560" cy="420" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF176"/>
      <stop offset="0.25" stop-color="#F5F5F5"/>
      <stop offset="0.7" stop-color="#8A8A8A"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <clipPath id="gap">
      <polygon points="0,0 800,0 520,400 280,400"/>
    </clipPath>
    <clipPath id="gapBottom">
      <polygon points="0,800 800,800 520,400 280,400"/>
    </clipPath>
  </defs>

  <!-- ceiling far above, seen through the aisle gap -->
  <rect width="800" height="800" fill="url(#lamp)"/>

  <!-- left bookshelf, converging toward the ceiling -->
  <polygon points="0,0 0,800 280,400" fill="#111"/>
  <polygon points="800,0 800,800 520,400" fill="#111"/>
  <!-- shelf planks receding upward (left wall) -->
  <g stroke="#3a3a3a" stroke-width="6">
    <line x1="0" y1="80" x2="280" y2="400"/>
    <line x1="0" y1="200" x2="280" y2="400"/>
    <line x1="0" y1="320" x2="280" y2="400"/>
    <line x1="0" y1="480" x2="280" y2="400"/>
    <line x1="0" y1="600" x2="280" y2="400"/>
    <line x1="0" y1="720" x2="280" y2="400"/>
    <line x1="800" y1="80" x2="520" y2="400"/>
    <line x1="800" y1="200" x2="520" y2="400"/>
    <line x1="800" y1="320" x2="520" y2="400"/>
    <line x1="800" y1="480" x2="520" y2="400"/>
    <line x1="800" y1="600" x2="520" y2="400"/>
    <line x1="800" y1="720" x2="520" y2="400"/>
  </g>
  <!-- book spines: small wedges between planks, lit side white -->
  <g fill="#e8e8e8">
    <polygon points="0,100 0,190 60,235 60,168"/>
    <polygon points="70,175 70,245 130,285 130,225"/>
    <polygon points="0,340 0,470 60,440 60,400"/>
    <polygon points="90,410 90,470 150,450 150,420"/>
    <polygon points="740,100 800,60 800,180 740,225"/>
    <polygon points="660,240 720,200 720,280 660,320"/>
    <polygon points="740,470 800,510 800,600 740,560"/>
    <polygon points="0,620 0,700 70,650 70,590"/>
  </g>
  <g fill="#555">
    <polygon points="140,240 140,300 200,330 200,280"/>
    <polygon points="600,300 650,260 650,330 600,370"/>
    <polygon points="160,430 160,470 230,450 230,430"/>
    <polygon points="580,440 640,460 640,500 580,470"/>
  </g>
  <!-- one book slipping loose, about to fall on the viewer -->
  <polygon points="690,355 745,330 750,370 700,395" fill="#fff" stroke="#000" stroke-width="3"/>
  <line x1="700" y1="395" x2="750" y2="370" stroke="#000" stroke-width="3"/>

  <!-- the desk lamp clamped to the right shelf, tilted straight down at us -->
  <g stroke="#000" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="700" y1="560" x2="640" y2="500"/>
    <line x1="640" y1="500" x2="600" y2="450"/>
  </g>
  <ellipse cx="575" cy="425" rx="52" ry="34" fill="#111"/>
  <ellipse cx="575" cy="425" rx="36" ry="22" fill="#FFF176"/>
  <ellipse cx="575" cy="425" rx="14" ry="9" fill="#fff"/>

  <!-- bicycle, seen from directly beneath: two tyres as thin ellipses -->
  <g transform="translate(400 300) rotate(-12)">
    <!-- shadows cast up onto ceiling, away from the lamp -->
    <g fill="#000" opacity="0.55" transform="translate(-60 -40) scale(1.15)">
      <ellipse cx="-130" cy="0" rx="20" ry="72"/>
      <ellipse cx="130" cy="0" rx="20" ry="72"/>
      <rect x="-130" y="-10" width="260" height="20"/>
      <ellipse cx="0" cy="-30" rx="80" ry="55"/>
    </g>
    <!-- tyres -->
    <ellipse cx="-130" cy="0" rx="20" ry="72" fill="#000"/>
    <ellipse cx="-130" cy="0" rx="9" ry="58" fill="#fff"/>
    <ellipse cx="-130" cy="0" rx="3" ry="46" fill="#000"/>
    <ellipse cx="130" cy="0" rx="20" ry="72" fill="#000"/>
    <ellipse cx="130" cy="0" rx="9" ry="58" fill="#fff"/>
    <ellipse cx="130" cy="0" rx="3" ry="46" fill="#000"/>
    <!-- frame underside: down tube, chainstays, bottom bracket -->
    <g stroke="#000" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="-130" y1="0" x2="130" y2="0"/>
      <line x1="-10" y1="0" x2="60" y2="-40"/>
      <line x1="-10" y1="0" x2="-90" y2="-30"/>
    </g>
    <!-- chainring + crank arms -->
    <circle cx="-10" cy="0" r="26" fill="#fff" stroke="#000" stroke-width="7"/>
    <circle cx="-10" cy="0" r="5" fill="#000"/>
    <line x1="-10" y1="-40" x2="-10" y2="40" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    <!-- pedals with huge webbed pelican feet stomping on them -->
    <g fill="#FFF176" stroke="#000" stroke-width="5" stroke-linejoin="round">
      <polygon points="-10,-40 -50,-90 -30,-84 -10,-100 10,-84 30,-90"/>
      <polygon points="-10,40 -50,90 -30,84 -10,100 10,84 30,90"/>
    </g>
    <!-- handlebar, seen from below, with a hand-bell -->
    <line x1="130" y1="-70" x2="130" y2="70" stroke="#000" stroke-width="10" stroke-linecap="round"/>
    <circle cx="130" cy="-78" r="10" fill="#fff" stroke="#000" stroke-width="4"/>
    <!-- saddle from beneath -->
    <ellipse cx="-95" cy="0" rx="22" ry="34" fill="#000"/>
  </g>

  <!-- the pelican, belly-first over the viewer, neck craned down to peer at us -->
  <g transform="translate(400 300) rotate(-12)">
    <!-- fat belly -->
    <ellipse cx="-20" cy="0" rx="95" ry="70" fill="#fff" stroke="#000" stroke-width="6"/>
    <!-- wing tips gripping the bars -->
    <path d="M40,-40 Q100,-110 135,-70" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
    <path d="M40,40 Q100,110 135,70" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
    <!-- stubby tail feathers -->
    <path d="M-110,-20 L-150,-30 L-130,0 L-150,30 L-110,20 Z" fill="#000"/>
    <!-- neck arcing down toward the lens -->
    <path d="M50,0 Q120,20 150,-10" fill="none" stroke="#000" stroke-width="30" stroke-linecap="round"/>
    <path d="M50,0 Q120,20 150,-10" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
    <!-- head, foreshortened, looming -->
    <circle cx="165" cy="-20" r="46" fill="#fff" stroke="#000" stroke-width="6"/>
    <!-- enormous beak pointing straight at the viewer, pouch sagging -->
    <path d="M160,10 L250,70 L235,110 L150,60 Z" fill="#000"/>
    <path d="M160,10 L250,70 L245,60 L165,-2 Z" fill="#FFF176" stroke="#000" stroke-width="4"/>
    <path d="M150,60 Q200,120 235,110" fill="#fff" stroke="#000" stroke-width="5"/>
    <!-- eyes: one wide, one squinting -->
    <circle cx="140" cy="-40" r="14" fill="#fff" stroke="#000" stroke-width="5"/>
    <circle cx="144" cy="-36" r="6" fill="#000"/>
    <path d="M182,-52 Q195,-42 208,-52" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
    <!-- a grin line and one raised brow -->
    <path d="M125,-60 L155,-70" stroke="#000" stroke-width="6" stroke-linecap="round"/>
    <!-- a stolen library book tucked under the wing -->
    <rect x="-60" y="-95" width="60" height="42" fill="#FFF176" stroke="#000" stroke-width="5" transform="rotate(-25 -30 -74)"/>
    <line x1="-52" y1="-88" x2="-14" y2="-70" stroke="#000" stroke-width="3"/>
  </g>

  <!-- lamp glow spill and a few dust motes in the beam -->
  <g fill="#FFF176" opacity="0.7">
    <circle cx="500" cy="380" r="3"/>
    <circle cx="470" cy="470" r="2"/>
    <circle cx="530" cy="520" r="2.5"/>
    <circle cx="420" cy="440" r="2"/>
    <circle cx="610" cy="360" r="2"/>
  </g>

  <!-- floor-level speed lines, since the culprit is escaping across the gap -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="120" y1="240" x2="200" y2="270"/>
    <line x1="110" y1="290" x2="210" y2="300"/>
    <line x1="120" y1="340" x2="205" y2="325"/>
  </g>
</svg>