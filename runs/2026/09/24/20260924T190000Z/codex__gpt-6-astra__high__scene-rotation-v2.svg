<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">A Very Quiet Getaway</title>
  <desc id="desc">A mischievous pelican pedals a bicycle through a narrow library aisle, seen from beneath the bicycle in an exaggerated worm’s-eye view. Towering bookshelves converge overhead. A single lemon-yellow desk lamp throws a sharp beam across the black-and-white scene.</desc>

