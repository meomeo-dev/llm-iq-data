<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle in a library</title>
  <desc id="desc">A mischievous pelican pedals overhead in a narrow aisle, seen from below. Towering bookshelves frame the view, and a lemon-yellow desk lamp casts a hard point of light.</desc>

  <defs>
    <pattern id="bookLines" width="34" height="44" patternUnits="userSpaceOnUse">
      <path d="M5 5h22v34H5z" fill="white" stroke="black" stroke-width="2"/>
      <path d="M10 10v23M15 10v23" fill="none" stroke="black" stroke-width="1.5"/>
      <path d="M19 13h5M19 18h5" stroke="black" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="black"/>
    </pattern>
    <clipPath id="leftShelf">
      <path d="M0 0h260L405 1100H0z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M640 0h260v1100H495z"/>
    </clipPath>
  </defs>

  <rect width="900" height="1100" fill="white"/>

  <!-- Towering shelves converge around the view straight up the aisle. -->
  <path d="M0 0h260L405 1100H0z" fill="black"/>
  <path d="M640 0h260v1100H495z" fill="black"/>
  <g clip-path="url(#leftShelf)">
    <path d="M-35 45h390v170H-35zM-35 255h390v170H-35zM-35 465h390v170H-35zM-35 675h390v170H-35zM-35 885h390v170H-35z" fill="url(#bookLines)"/>
    <path d="M0 220L286 220M0 430L314 430M0 640L343 640M0 850L371 850" stroke="white" stroke-width="10"/>
    <path d="M20 0L182 1100M94 0L250 1100M168 0L318 1100" stroke="white" stroke-width="3" opacity=".8"/>
  </g>
  <g clip-path="url(#rightShelf)">
    <path d="M545 45h390v170H545zM545 255h390v170H545zM545 465h390v170H545zM545 675h390v170H545zM545 885h390v170H545z" fill="url(#bookLines)"/>
    <path d="M900 220L614 220M900 430L586 430M900 640L557 640M900 850L529 850" stroke="white" stroke-width="10"/>
    <path d="M732 0L570 1100M806 0L650 1100M880 0L682 1100" stroke="white" stroke-width="3" opacity=".8"/>
  </g>

  <!-- The narrow opening and ceiling recede toward the lamp. -->
  <path d="M260 0h380L495 1100H405z" fill="white"/>
  <path d="M260 0L405 1100M640 0L495 1100" fill="none" stroke="black" stroke-width="7"/>
  <path d="M290 42L610 42M310 128L590 128M333 223L567 223" stroke="black" stroke-width="5"/>
  <path d="M285 0h330v135H285z" fill="url(#dots)" opacity=".42"/>

  <!-- A single hard point light, with one lemon-yellow accent. -->
  <path d="M450 102L314 372L586 372z" fill="black" opacity=".13"/>
  <path d="M450 102L340 345M450 102L560 345M450 102L450 358" stroke="white" stroke-width="3"/>
  <path d="M450 56v38M411 69l25 29M489 69l-25 29" stroke="black" stroke-width="8" stroke-linecap="round"/>
  <path d="M428 91q22-21 44 0l-8 20h-28z" fill="#F4D21F" stroke="black" stroke-width="6"/>
  <circle cx="450" cy="111" r="8" fill="#F4D21F" stroke="black" stroke-width="4"/>
  <path d="M421 56L396 32M479 56l25-24" stroke="black" stroke-width="7" stroke-linecap="round"/>

  <!-- Bicycle wheels, foreshortened from the worm's-eye viewpoint. -->
  <g fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="339" cy="737" rx="100" ry="166" stroke-width="18"/>
    <ellipse cx="626" cy="692" rx="82" ry="142" stroke-width="18"/>
    <ellipse cx="339" cy="737" rx="86" ry="150" stroke="white" stroke-width="3"/>
    <ellipse cx="626" cy="692" rx="69" ry="128" stroke="white" stroke-width="3"/>
    <path d="M339 737L435 626L511 737L339 737M435 626L526 580M511 737L626 692M526 580L626 692" stroke-width="13"/>
    <path d="M339 737L435 626L511 737M435 626L339 737" stroke="white" stroke-width="3"/>
    <path d="M505 737h52M511 737l-20 35M435 626l-24-22M394 604h76" stroke-width="13"/>
    <circle cx="339" cy="737" r="13" fill="white" stroke-width="7"/>
    <circle cx="626" cy="692" r="13" fill="white" stroke-width="7"/>
    <circle cx="511" cy="737" r="11" fill="white" stroke-width="6"/>
  </g>

  <!-- Pelican in profile, wings flung wide as it pedals through the aisle. -->
  <path d="M431 534
           Q390 490 330 493
           Q373 527 385 570
           Q342 548 291 561
           Q354 601 407 614
           Q427 620 451 600
           Q481 579 504 593
           Q548 619 598 585
           Q554 567 525 548
           Q491 522 472 531z"
        fill="white" stroke="black" stroke-width="11" stroke-linejoin="round"/>
  <path d="M399 552Q354 527 329 516M410 580Q361 574 327 567M475 556Q524 547 561 580M465 582Q511 595 545 597"
        fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <path d="M425 524Q414 467 451 433Q486 405 517 434Q539 454 526 492L496 554Q463 568 431 545z"
        fill="white" stroke="black" stroke-width="11" stroke-linejoin="round"/>
  <path d="M451 444Q478 423 500 443Q516 459 500 477Q479 496 448 475"
        fill="none" stroke="black" stroke-width="5"/>
  <circle cx="493" cy="453" r="8" fill="black"/>
  <circle cx="496" cy="450" r="2.5" fill="white"/>
  <path d="M516 470Q567 463 590 482Q571 502 521 498L497 490z"
        fill="white" stroke="black" stroke-width="9" stroke-linejoin="round"/>
  <path d="M516 490Q554 490 579 483Q563 517 523 519L501 502z"
        fill="white" stroke="black" stroke-width="8" stroke-linejoin="round"/>
  <path d="M536 490q18 5 30 0" fill="none" stroke="black" stroke-width="4"/>
  <path d="M451 532L429 613M493 536L511 737M431 613l-20 11M511 737l-20 35"
        fill="none" stroke="black" stroke-width="10" stroke-linecap="round"/>
  <path d="M399 624q-19 3-30 19l29 5 18-13M490 769q-8 17-1 27l27-10 3-21"
        fill="white" stroke="black" stroke-width="8" stroke-linejoin="round"/>

  <!-- Comic motion marks and a cheeky little speech bubble. -->
  <path d="M244 479l-35-22M250 516l-43 4M648 478l34-29M667 515l42 3"
        stroke="black" stroke-width="7" stroke-linecap="round"/>
  <path d="M581 362q74-48 139 5l-14 57-33-16q-43 20-82-3z"
        fill="white" stroke="black" stroke-width="6" stroke-linejoin="round"/>
  <path d="M613 390h8M639 390h8M665 390h8" stroke="black" stroke-width="6" stroke-linecap="round"/>
  <path d="M664 423l-18 24" stroke="black" stroke-width="6" stroke-linecap="round"/>

  <path d="M34 1058h832" stroke="black" stroke-width="4"/>
  <text x="450" y="1082" text-anchor="middle"
        font-family="serif" font-size="18" letter-spacing="4" fill="black">
    SHHHH — PEDAL QUIETLY
  </text>
</svg>