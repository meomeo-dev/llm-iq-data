<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle in a library aisle</title>
  <desc id="desc">A worm's-eye comic view of towering bookshelves, a pelican cyclist, and one desk lamp casting a hard beam of light. The pelican's beak is the only yellow accent.</desc>

  <defs>
    <clipPath id="left-shelf-clip">
      <path d="M0 0H76L332 154L72 1000H0Z"/>
    </clipPath>
  </defs>

  <rect width="800" height="1000" fill="#000"/>

  <!-- Ceiling and shelves converge above the viewer. -->
  <g fill="none" stroke="#fff" stroke-width="3">
    <path d="M400 91 0 0M400 91 800 0M400 91 0 87M400 91 800 87"/>
    <path d="M334 153Q400 49 466 153"/>
    <path d="M353 146Q400 83 447 146"/>
    <path d="M400 91V151"/>
  </g>

  <!-- The lamp makes one sharp pool of light. -->
  <path d="M410 235-24 1000H824Z" fill="#fff"/>

  <g id="left-shelf">
    <path d="M0 0H76L332 154 72 1000H0Z" fill="#000"/>
    <path d="M76 0 332 154 72 1000" fill="none" stroke="#fff" stroke-width="7"/>

    <g clip-path="url(#left-shelf-clip)" fill="none" stroke="#fff">
      <g stroke-width="9">
        <path d="M0 163 322 178M0 317 275 326"/>
        <path d="M0 482 224 491M0 657 170 667"/>
        <path d="M0 839 113 851"/>
      </g>
      <g stroke-width="3">
        <path d="M20 179 26 308M47 181 59 310M78 183 81 313
                 M105 185 116 315M137 188 143 317M170 190 179 319
                 M201 192 205 320M229 194 242 323M260 196 269 325"/>
        <path d="M16 330 26 475M43 332 50 477M70 334 80 479
                 M100 336 105 481M128 338 140 483M160 340 166 485
                 M192 342 201 487M224 344 231 489"/>
        <path d="M17 496 22 650M44 499 54 653M74 502 80 656
                 M105 505 114 659M135 508 143 662M169 512 177 665"/>
        <path d="M17 674 28 831M48 678 55 835M77 682 88 839
                 M105 686 111 843"/>
        <path d="M17 860 23 982M43 864 52 985M72 868 79 990"/>
      </g>
      <g stroke-width="2">
        <path d="M35 208 53 207M121 218 139 216M188 225 208 224
                 M61 383 79 381M147 405 164 403M33 552 51 550
                 M97 580 114 578M41 738 57 736"/>
      </g>
    </g>
  </g>
  <use href="#left-shelf" transform="translate(800 0) scale(-1 1)"/>

  <!-- A single articulated desk lamp reaches out from the left shelf. -->
  <g stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M103 275 188 189 292 252 397 180"
          fill="none" stroke-width="17"/>
    <path d="M103 275 188 189 292 252 397 180"
          fill="none" stroke="#000" stroke-width="9"/>
    <circle cx="103" cy="275" r="18" fill="#fff" stroke="#000" stroke-width="5"/>
    <circle cx="188" cy="189" r="12" fill="#fff" stroke="#000" stroke-width="5"/>
    <circle cx="292" cy="252" r="12" fill="#fff" stroke="#000" stroke-width="5"/>
  </g>
  <path d="M399 169 465 194 448 229 369 204Z"
        fill="#fff" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="410" cy="235" r="10" fill="#fff" stroke="#000" stroke-width="5"/>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
    <path d="m337 236-22 10m112 20 15 19m-55-42-8 24"/>
  </g>

  <!-- Wheels have opposite outlines so they remain visible across the beam. -->
  <g fill="none" stroke="#fff" stroke-width="17">
    <circle cx="190" cy="760" r="137"/>
    <circle cx="615" cy="760" r="137"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="7">
    <circle cx="190" cy="760" r="137"/>
    <circle cx="615" cy="760" r="137"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="3">
    <path d="M190 623v274M53 760h274M93 663l194 194M93 857l194-194"/>
    <path d="M615 623v274M478 760h274M518 663l194 194M518 857l194-194"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m190 760 142-183 69 178-211 5m142-183 169 11-100 167
             m100-167 114 172"/>
    <path d="m501 588 33-78 57 7m-259 60-13-35m-38-2 78 3"/>
    <path d="m401 755 48 38m-48-38-42-40"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m190 760 142-183 69 178-211 5m142-183 169 11-100 167
             m100-167 114 172"/>
    <path d="m501 588 33-78 57 7m-259 60-13-35m-38-2 78 3"/>
    <path d="m401 755 48 38m-48-38-42-40"/>
  </g>
  <circle cx="401" cy="755" r="22" fill="#fff" stroke="#000" stroke-width="7"/>
  <circle cx="190" cy="760" r="10" fill="#fff" stroke="#000" stroke-width="5"/>
  <circle cx="615" cy="760" r="10" fill="#fff" stroke="#000" stroke-width="5"/>

  <!-- The rider's feet land on the pedals. -->
  <g fill="none" stroke="#000" stroke-width="14"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M354 520Q335 624 359 715l-21 8m74-186q75 77 37 254l27 13"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M354 520Q335 624 359 715l-21 8m74-186q75 77 37 254l27 13"/>
  </g>

  <!-- White plumage and a long curved neck. -->
  <path d="M281 477 249 451l29 45-27 8 45 10Z"
        fill="#fff" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M321 455q-53 8-56 59 9 66 92 68l77-14q77-29 66-91
           -15-56-83-61-54 3-96 39Z"
        fill="#fff" stroke="#000" stroke-width="9"/>
  <path d="M400 482q36-35 31-94-35-20-43-55-8-36 31-52
           55-18 76 27 16 38-21 70-8 75 32 108
           -30 40-72 31-31-8-34-35Z"
        fill="#fff" stroke="#000" stroke-width="9"/>
  <path d="M333 467q31-19 68 4-12 37-48 58-33-5-45-24"
        fill="#fff" stroke="#000" stroke-width="7"/>
  <path d="m329 516-25 10m41 4-25 16m43-13-15 22"
        fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>

  <!-- One wing grips the handlebar. -->
  <path d="M455 460q57-12 87 22l13 32-20 15-23-19q-40 13-75-8"
        fill="#fff" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="m536 517 12-14m-4 22 14-10"
        fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>

  <!-- The beak and pouch form the sole lemon-yellow accent. -->
  <path d="M472 337q101-3 205 37-15 15-47 12
           -17 53-56 69-43 15-70-19-20-25-26-61l-18-18Z"
        fill="#F5E642" stroke="#000" stroke-width="8"
        stroke-linejoin="round"/>
  <path d="M479 374q77 29 153 11"
        fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>

  <ellipse cx="453" cy="321" rx="19" ry="22" fill="#fff" stroke="#000" stroke-width="6"/>
  <circle cx="462" cy="322" r="8" fill="#000"/>
  <path d="m433 291 30-11m-36-4-9-21m21 20 5-24"
        fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- A few brisk comic marks complete the ride. -->
  <g fill="none" stroke="#000" stroke-width="7" stroke-linecap="round">
    <path d="M99 582 71 560m39 40-40-7m633 31 31-20m-25 39 43-5"/>
    <path d="m545 332 10-14m17 19 17-10"/>
  </g>
</svg>