<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#FFF44F" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#FFF44F" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFF44F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="books" width="22" height="40" patternUnits="userSpaceOnUse">
      <rect width="22" height="40" fill="#111"/>
      <rect x="1" y="2" width="6" height="38" fill="#eee"/>
      <rect x="8" y="6" width="5" height="34" fill="#777"/>
      <rect x="14" y="0" width="7" height="40" fill="#ccc"/>
      <line x1="1" y1="10" x2="7" y2="10" stroke="#111" stroke-width="1"/>
      <line x1="14" y1="30" x2="21" y2="30" stroke="#111" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ceiling / sky slit at vanishing point -->
  <rect width="600" height="800" fill="#000"/>
  <polygon points="270,330 330,330 330,390 270,390" fill="#fff"/>

  <!-- left bookshelf wall converging up -->
  <polygon points="0,0 270,330 270,390 0,800" fill="url(#books)"/>
  <polygon points="0,0 270,330 270,390 0,800" fill="#000" opacity="0.35"/>
  <g stroke="#fff" stroke-width="3">
    <line x1="0" y1="120" x2="270" y2="345"/>
    <line x1="0" y1="300" x2="270" y2="358"/>
    <line x1="0" y1="500" x2="270" y2="372"/>
    <line x1="0" y1="680" x2="270" y2="384"/>
  </g>
  <!-- right bookshelf wall -->
  <polygon points="600,0 330,330 330,390 600,800" fill="url(#books)"/>
  <polygon points="600,0 330,330 330,390 600,800" fill="#000" opacity="0.6"/>
  <g stroke="#bbb" stroke-width="3">
    <line x1="600" y1="120" x2="330" y2="345"/>
    <line x1="600" y1="300" x2="330" y2="358"/>
    <line x1="600" y1="500" x2="330" y2="372"/>
    <line x1="600" y1="680" x2="330" y2="384"/>
  </g>

  <!-- desk lamp clamped to left shelf, hard light cone (the only yellow) -->
  <polygon points="95,215 600,420 600,800 250,800" fill="url(#glow)"/>
  <g stroke="#fff" stroke-width="5" fill="none">
    <line x1="30" y1="150" x2="70" y2="190"/>
    <line x1="70" y1="190" x2="55" y2="235"/>
  </g>
  <path d="M60,190 L120,190 L105,240 L75,240 Z" fill="#fff" stroke="#000" stroke-width="3" transform="rotate(-30 90 215)"/>
  <circle cx="100" cy="222" r="9" fill="#FFF44F"/>

  <!-- bicycle seen from below -->
  <g stroke="#fff" stroke-width="6" fill="none">
    <ellipse cx="200" cy="560" rx="85" ry="30"/>
    <ellipse cx="420" cy="520" rx="85" ry="30"/>
  </g>
  <g stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="200" y1="560" x2="300" y2="520"/>
    <line x1="300" y1="520" x2="420" y2="520"/>
    <line x1="300" y1="520" x2="280" y2="470"/>
    <line x1="420" y1="520" x2="400" y2="455"/>
    <line x1="375" y1="450" x2="425" y2="460"/>
    <circle cx="300" cy="530" r="10"/>
  </g>

  <!-- pelican underside -->
  <ellipse cx="310" cy="430" rx="105" ry="60" fill="#fff" stroke="#000" stroke-width="3"/>
  <path d="M215,420 Q120,360 90,440 Q160,430 225,450 Z" fill="#fff" stroke="#000" stroke-width="3"/>
  <path d="M405,415 Q510,350 540,430 Q470,425 395,450 Z" fill="#ddd" stroke="#000" stroke-width="3"/>
  <!-- legs pedalling -->
  <g stroke="#fff" stroke-width="6" stroke-linecap="round">
    <line x1="285" y1="480" x2="290" y2="530"/>
    <line x1="330" y1="480" x2="310" y2="540"/>
  </g>
  <!-- neck + head peering down at viewer -->
  <path d="M390,410 Q440,330 410,290" stroke="#fff" stroke-width="26" fill="none" stroke-linecap="round"/>
  <circle cx="410" cy="285" r="30" fill="#fff" stroke="#000" stroke-width="3"/>
  <!-- winking eye + open eye -->
  <path d="M395,278 q7,-6 14,0" stroke="#000" stroke-width="3" fill="none"/>
  <circle cx="425" cy="280" r="6" fill="#000"/><circle cx="427" cy="278" r="2" fill="#fff"/>
  <!-- beak and pouch with stolen book -->
  <path d="M405,300 L300,380 L420,312 Z" fill="#fff" stroke="#000" stroke-width="3"/>
  <path d="M410,310 Q340,420 300,380" fill="#eee" stroke="#000" stroke-width="3"/>
  <rect x="335" y="355" width="30" height="20" fill="#000" transform="rotate(-25 350 365)"/>
  <line x1="340" y1="366" x2="362" y2="356" stroke="#fff" stroke-width="2"/>

  <!-- falling books for comedy -->
  <rect x="140" y="640" width="40" height="28" fill="#fff" stroke="#000" stroke-width="3" transform="rotate(20 160 654)"/>
  <rect x="460" y="660" width="34" height="24" fill="#ccc" stroke="#000" stroke-width="3" transform="rotate(-35 477 672)"/>
  <text x="300" y="760" font-family="sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">shhh…</text>
</svg>