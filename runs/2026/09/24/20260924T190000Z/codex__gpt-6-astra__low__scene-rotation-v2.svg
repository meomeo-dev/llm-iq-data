<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"
     viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">A Very Quiet Getaway</title>
  <desc id="desc">
    A mischievous pelican rides a bicycle through a narrow library aisle,
    seen from directly below. Towering black and white bookshelves converge
    overhead. A single lemon-yellow desk lamp casts hard, angular light.
  </desc>

  <defs>
    <pattern id="bookRows" width="92" height="146" patternUnits="userSpaceOnUse">
      <rect width="92" height="146" fill="white"/>
      <path d="M0 133H92V146H0Z" fill="black"/>
      <g fill="white" stroke="black" stroke-width="4">
        <path d="M3 12H20V131H3Z"/>
        <path d="M23 4H45V131H23Z"/>
        <path d="M48 21H62V131H48Z"/>
        <path d="M66 8L80 5L91 129L76 132Z"/>
      </g>
      <g stroke="black" stroke-width="3">
        <path d="M7 29H16M7 35H16M27 18H41M27 24H41
                 M51 105H59M51 113H59M72 32L83 31"/>
      </g>
    </pattern>
    <clipPath id="leftShelf">
      <path d="M0 0H297L350 202L251 1000H0Z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M505 0H800V1000H564L451 202Z"/>
    </clipPath>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"
             patternTransform="rotate(28)">
      <path d="M0 0V10" stroke="black" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- The aisle closes overhead; all architectural lines rush toward the ceiling. -->
  <rect width="800" height="1000" fill="black"/>
  <path d="M298 0H504L451 202L565 1000H249L350 202Z" fill="white"/>
  <path d="M325 0L373 191L290 1000M477 0L428 191L529 1000"
        fill="none" stroke="black" stroke-width="5"/>
  <path d="M351 0L389 155L401 161L440 0" fill="none"
        stroke="black" stroke-width="3"/>
  <path d="M350 202L401 160L451 202L403 229Z"
        fill="white" stroke="black" stroke-width="5"/>

  <!-- Left book canyon. -->
  <g clip-path="url(#leftShelf)">
    <rect width="356" height="1000" fill="white"/>
    <path d="M0 0H297L350 202L251 1000H0Z" fill="url(#bookRows)"/>
    <g fill="black">
      <path d="M0 93L342 180L344 194L0 126Z"/>
      <path d="M0 250L340 230L338 249L0 289Z"/>
      <path d="M0 467L318 348L314 374L0 510Z"/>
      <path d="M0 752L283 548L277 581L0 809Z"/>
      <path d="M0 1000L253 799L247 849L85 1000Z"/>
    </g>
    <path d="M72 0L317 198L143 1000H184L333 203L113 0Z" fill="black"/>
    <path d="M233 0L344 198L235 1000H257L356 198L265 0Z" fill="black"/>
    <g stroke="black" stroke-width="5">
      <path d="M0 191L329 207M0 387L321 303M0 639L296 456"/>
    </g>
  </g>

  <!-- Right shelves, their dark undersides exaggerated by the low viewpoint. -->
  <g clip-path="url(#rightShelf)">
    <rect x="443" width="357" height="1000" fill="url(#bookRows)"/>
    <g fill="black">
      <path d="M800 79L461 179L458 195L800 114Z"/>
      <path d="M800 256L462 228L465 250L800 299Z"/>
      <path d="M800 474L484 349L489 379L800 524Z"/>
      <path d="M800 757L516 548L523 584L800 817Z"/>
      <path d="M800 1000L550 798L557 845L722 1000Z"/>
      <path d="M730 0L484 198L660 1000H617L468 200L689 0Z"/>
      <path d="M568 0L455 197L566 1000H545L443 198L537 0Z"/>
    </g>
    <g stroke="black" stroke-width="5">
      <path d="M800 190L470 207M800 389L479 303M800 640L504 456"/>
    </g>
  </g>

  <!-- Hard-edged illumination from the one small desk lamp. -->
  <path d="M527 227L190 658L485 923L620 536Z"
        fill="white" stroke="black" stroke-width="3"/>
  <path d="M529 234L316 643L486 919L423 591Z" fill="black"/>
  <path d="M600 154L647 141L673 154L628 169Z"
        fill="white" stroke="black" stroke-width="5"/>
  <g fill="none" stroke="white" stroke-width="12" stroke-linejoin="round">
    <path d="M633 150L602 99L555 139L563 179"/>
  </g>
  <g fill="none" stroke="black" stroke-width="5" stroke-linejoin="round">
    <path d="M633 150L602 99L555 139L563 179"/>
  </g>
  <g fill="white" stroke="black" stroke-width="4">
    <circle cx="602" cy="99" r="8"/>
    <circle cx="555" cy="139" r="7"/>
  </g>
  <path d="M553 171Q580 167 590 190L607 218
           Q567 247 518 231L533 195Q538 178 553 171Z"
        fill="black" stroke="white" stroke-width="4"/>
  <path d="M519 230Q555 209 606 218Q577 250 519 230Z"
        fill="#F4EF32" stroke="black" stroke-width="4"/>
  <path d="M513 256L503 274M549 263L544 288M585 251L589 270"
        stroke="white" stroke-width="3"/>

  <!-- Escaping pages bring a little disorder to the silent stacks. -->
  <g fill="white" stroke="black" stroke-width="4">
    <path d="M284 274L314 259L333 290L302 311Z"/>
    <path d="M628 481L660 469L668 506L644 522Z"/>
    <path d="M153 541L182 552L165 584L141 568Z"/>
  </g>
  <g fill="none" stroke="black" stroke-width="2">
    <path d="M293 278L311 270M299 286L317 278M305 294L321 286
             M638 489L655 482M642 497L659 490"/>
  </g>

  <!-- Wheels seen from underneath: enormous near wheel and receding rear wheel. -->
  <g transform="rotate(-19 245 697)">
    <ellipse cx="245" cy="697" rx="112" ry="188" fill="white"
             stroke="black" stroke-width="19"/>
    <ellipse cx="245" cy="697" rx="94" ry="168" fill="black"
             stroke="white" stroke-width="4"/>
    <g stroke="white" stroke-width="3">
      <path d="M245 529V865M151 697H339M179 578L311 816
               M179 816L311 578M159 634L331 760M159 760L331 634
               M210 541L280 853M210 853L280 541"/>
    </g>
    <ellipse cx="245" cy="697" rx="14" ry="21" fill="white"
             stroke="black" stroke-width="5"/>
    <path d="M171 578Q141 663 161 737" fill="none"
          stroke="white" stroke-width="6"/>
  </g>

  <g transform="rotate(-19 595 810)">
    <ellipse cx="595" cy="810" rx="126" ry="216" fill="white"
             stroke="black" stroke-width="21"/>
    <ellipse cx="595" cy="810" rx="106" ry="193" fill="black"
             stroke="white" stroke-width="5"/>
    <g stroke="white" stroke-width="3">
      <path d="M595 617V1003M489 810H701M520 673L670 947
               M520 947L670 673M497 736L693 884M497 884L693 736
               M555 631L635 989M555 989L635 631"/>
    </g>
    <ellipse cx="595" cy="810" rx="16" ry="25" fill="white"
             stroke="black" stroke-width="5"/>
    <path d="M516 677Q481 757 499 835" fill="none"
          stroke="white" stroke-width="7"/>
  </g>

  <!-- Bicycle frame, chain, fork and bars. -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M245 697L346 551L411 746L245 697L510 593L411 746
             M346 551L510 593M495 549L595 810M516 549L614 804"
          stroke="black" stroke-width="24"/>
    <path d="M245 697L346 551L411 746L245 697L510 593L411 746
             M346 551L510 593M495 549L595 810M516 549L614 804"
          stroke="white" stroke-width="11"/>
    <path d="M499 566L480 494L520 478L551 489"
          stroke="black" stroke-width="20"/>
    <path d="M499 566L480 494L520 478L551 489"
          stroke="white" stroke-width="8"/>
    <path d="M343 554L330 514" stroke="black" stroke-width="18"/>
    <path d="M343 554L330 514" stroke="white" stroke-width="6"/>
  </g>
  <path d="M289 503Q310 490 359 505L369 519Q327 534 292 519Z"
        fill="black" stroke="white" stroke-width="4"/>
  <path d="M246 682L410 719Q444 721 443 749Q440 779 410 774
           L238 711Z" fill="none" stroke="black" stroke-width="10"/>
  <path d="M246 682L410 719Q444 721 443 749Q440 779 410 774
           L238 711Z" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="411" cy="746" r="29" fill="black" stroke="white" stroke-width="5"/>
  <circle cx="411" cy="746" r="9" fill="white"/>
  <path d="M411 746L455 696M411 746L368 794"
        stroke="black" stroke-width="12"/>
  <path d="M411 746L455 696M411 746L368 794"
        stroke="white" stroke-width="5"/>
  <path d="M436 693L477 705M347 791L382 801"
        stroke="black" stroke-width="13"/>

  <!-- The pelican's belly and folded wing loom over the viewer. -->
  <path d="M264 454L207 418L231 467L191 454L238 500
           Q272 552 344 553L397 489Z"
        fill="white" stroke="black" stroke-width="7"/>
  <path d="M290 388Q246 416 254 471Q264 527 335 551
           Q406 562 441 505Q462 463 425 407
           Q365 364 290 388Z"
        fill="white" stroke="black" stroke-width="8"/>
  <path d="M271 452Q282 513 348 536Q402 547 428 501
           Q379 525 348 490Z" fill="black"/>
  <path d="M282 412Q328 387 382 423L415 479
           Q381 499 345 480Q304 460 282 412Z"
        fill="white" stroke="black" stroke-width="6"/>
  <g fill="none" stroke="black" stroke-width="4" stroke-linecap="round">
    <path d="M300 422Q331 461 368 471M324 417Q351 446 383 462
             M350 422L396 455"/>
  </g>

  <!-- One wing grips the handlebar. -->
  <path d="M405 406Q449 423 467 455L516 472
           Q531 471 538 485L527 497L507 492
           Q451 490 422 463L392 437Z"
        fill="white" stroke="black" stroke-width="7"/>
  <path d="M505 475L511 488M516 477L522 490"
        fill="none" stroke="black" stroke-width="4"/>

  <!-- Long neck, cheeky eye, and unmistakable pendulous pelican pouch. -->
  <path d="M357 422Q390 381 360 347Q332 313 349 279
           Q365 246 403 251Q438 254 447 283
           L442 316Q409 307 399 321
           Q389 336 416 367Q444 404 419 441Z"
        fill="white" stroke="black" stroke-width="7"/>
  <path d="M363 353Q383 367 383 389L368 414L397 424
           Q412 398 391 368Q374 344 373 330Z" fill="black"/>
  <path d="M351 282L338 260L360 264L358 240L378 254L389 235L398 255"
        fill="white" stroke="black" stroke-width="5"
        stroke-linejoin="round"/>
  <path d="M427 287L617 306Q582 334 552 370
           Q531 397 488 386Q445 373 416 317Z"
        fill="white" stroke="black" stroke-width="7"/>
  <path d="M435 316L599 310Q549 336 543 367
           Q491 380 454 341Z" fill="url(#hatch)"/>
  <path d="M429 282L626 304L642 315L428 310Z"
        fill="white" stroke="black" stroke-width="6"
        stroke-linejoin="round"/>
  <path d="M441 299L608 307" stroke="black" stroke-width="3"/>
  <path d="M428 310Q438 320 449 314" fill="none"
        stroke="black" stroke-width="4"/>
  <ellipse cx="404" cy="279" rx="17" ry="19"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="411" cy="281" rx="6" ry="9" fill="black"/>
  <circle cx="413" cy="277" r="2" fill="white"/>
  <path d="M387 264L419 270" stroke="black" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Bent legs and broad webbed feet actually meet the pedals. -->
  <g fill="white" stroke="black" stroke-width="7" stroke-linejoin="round">
    <path d="M366 534L405 602L384 658L406 670
             L431 602L393 535Z"/>
    <path d="M313 532L289 620L341 760L361 749
             L317 618L341 542Z"/>
    <path d="M390 650L407 657L418 680L468 689L479 706
             L431 710L400 695L386 683Z"/>
    <path d="M338 747L357 742L367 774L387 786L380 801
             L349 796L320 806L325 783L338 772Z"/>
  </g>
  <path d="M419 682L431 699M438 687L449 702M341 780L340 795
           M355 778L362 793"
        fill="none" stroke="black" stroke-width="3"/>

  <!-- Comic speed marks, sharp shadows, and an overly optimistic library sign. -->
  <g fill="none" stroke="white" stroke-width="5" stroke-linecap="round">
    <path d="M99 643L83 691M123 612L111 644M697 805L719 752
             M712 851L740 795M220 904L201 944"/>
  </g>
  <g transform="rotate(-15 116 345)">
    <path d="M46 315H184V370H46Z" fill="white" stroke="black" stroke-width="6"/>
    <text x="115" y="351" text-anchor="middle"
          font-family="monospace" font-size="25" font-weight="900"
          fill="black">QUIET!</text>
  </g>
  <path d="M195 347L219 356M190 365L212 379"
        fill="none" stroke="white" stroke-width="4"/>

  <rect x="10" y="10" width="780" height="980" rx="2"
        fill="none" stroke="white" stroke-width="3"/>
</svg>