<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle through a library aisle</title>
  <desc id="desc">A comic black-and-white worm's-eye view straight up between towering bookshelves, with a pelican on a bicycle and one lemon-yellow desk lamp.</desc>

  <defs>
    <pattern id="books" width="92" height="120" patternUnits="userSpaceOnUse">
      <rect width="92" height="120" fill="#171717"/>
      <path d="M5 8h19v104H5zM28 3h23v109H28zM55 12h15v100H55zM74 6h14v106H74z"
            fill="#f7f7f4" stroke="#111" stroke-width="3"/>
      <path d="M9 18h11M32 15h15M58 25h9M77 19h8M9 98h11M32 95h15M58 100h9M77 96h8"
            stroke="#111" stroke-width="3"/>
      <path d="M11 32v48M39 29v52M62 39v38M81 31v49" stroke="#111" stroke-width="1.5"/>
    </pattern>
    <clipPath id="leftShelf">
      <path d="M0 0h310L410 800H0z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M490 800L590 0h210v800z"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#090909"/>
  <path d="M0 0h310L410 800H0z" fill="url(#books)" clip-path="url(#leftShelf)"/>
  <path d="M490 800L590 0h210v800z" fill="url(#books)" clip-path="url(#rightShelf)"/>

  <!-- Shelf edges converge overhead, leaving a narrow view straight up. -->
  <path d="M310 0L410 800M590 0L490 800" fill="none" stroke="#f4f4f0" stroke-width="10"/>
  <path d="M0 170L332 170M0 365L356 365M0 568L382 568"
        stroke="#090909" stroke-width="18"/>
  <path d="M800 170L568 170M800 365L544 365M800 568L518 568"
        stroke="#090909" stroke-width="18"/>

  <path d="M310 0h280L490 800H410z" fill="#f0f0eb"/>
  <path d="M345 0h210L472 800h-144z" fill="#cfcfca"/>
  <path d="M400 0h92L464 800h-58z" fill="#fff"/>

  <!-- A single hard point light and its graphic beams. -->
  <path d="M405 148L183 800h175L418 148L622 800H454z"
        fill="#fff" opacity=".22"/>
  <path d="M400 116l-15 34 15-6 15 6z" fill="#f4d21f"/>
  <circle cx="400" cy="142" r="11" fill="#f4d21f"/>
  <path d="M374 116h52M379 107l42 18" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <path d="M400 142v-28" stroke="#111" stroke-width="6"/>

  <!-- Comical bicycle silhouette, viewed from below. -->
  <ellipse cx="402" cy="674" rx="196" ry="24" fill="#000" opacity=".35" filter="url(#shadow)"/>
  <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="287" cy="654" r="92" stroke-width="12"/>
    <circle cx="532" cy="654" r="92" stroke-width="12"/>
    <circle cx="287" cy="654" r="7" fill="#111" stroke-width="4"/>
    <circle cx="532" cy="654" r="7" fill="#111" stroke-width="4"/>
    <path d="M287 654l92-124 70 124H287l80-81 82 81M379 530l-15-25M364 505h-43M449 654l83-124M449 654l-20-20"
          stroke-width="13"/>
    <path d="M518 530h48M532 530l-11-26" stroke-width="10"/>
    <path d="M357 498h22" stroke-width="12"/>
  </g>
  <path d="M364 566l18-7 12 15-17 9z" fill="#f7f7f4" stroke="#111" stroke-width="5"/>
  <path d="M432 628l22-5 8 17-22 7z" fill="#f7f7f4" stroke="#111" stroke-width="5"/>

  <!-- Pelican leaning forward with a sly grin. -->
  <g stroke="#111" stroke-linejoin="round">
    <path d="M347 493c-39-51-32-124 16-165 40-34 99-22 117 22 16 38-6 77-37 99l-7 58z"
          fill="#fff" stroke-width="8"/>
    <path d="M358 349c-25-31-19-75 12-98 31-23 77-12 88 17 10 28-14 54-41 57-21 3-39 13-59 24z"
          fill="#fff" stroke-width="8"/>
    <path d="M415 329c26-16 78-15 121 1 19 7 34 18 30 28-5 12-24 12-48 7-31-6-65-5-102-2z"
          fill="#fff" stroke-width="7"/>
    <path d="M420 348c36 3 72 4 112 15-28 33-67 47-112 31-18-7-23-31 0-46z"
          fill="#fff" stroke-width="7"/>
    <path d="M416 329c19 13 25 25 18 39" fill="none" stroke-width="5"/>
    <ellipse cx="420" cy="293" rx="8" ry="11" fill="#111"/>
    <path d="M438 281q16-14 30 0" fill="none" stroke-width="5" stroke-linecap="round"/>
    <path d="M352 407q-29 32-10 68" fill="none" stroke-width="7" stroke-linecap="round"/>
    <path d="M391 494l-16 42M435 494l27 34" fill="none" stroke-width="8" stroke-linecap="round"/>
    <path d="M374 536l-23 11 27 2M462 528l25 7-25 7" fill="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M363 433q23 9 46 1" fill="none" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Motion marks and cheeky punctuation. -->
  <path d="M554 399l27-21M564 421l35-9M336 294l-23-19M329 319l-32-7"
        stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <path d="M580 338q13-23 28 0-14 18-28 0z" fill="#fff" stroke="#111" stroke-width="5"/>
  <circle cx="594" cy="338" r="3" fill="#111"/>
  <path d="M590 345l-13 16" stroke="#111" stroke-width="4" stroke-linecap="round"/>

  <path d="M27 28h14M27 28v14M773 28h-14M773 28v14M27 772h14M27 772v-14M773 772h-14M773 772v-14"
        fill="none" stroke="#f7f7f4" stroke-width="4"/>
</svg>