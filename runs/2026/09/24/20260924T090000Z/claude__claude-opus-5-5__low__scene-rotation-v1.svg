<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2c3a"/>
      <stop offset="0.55" stop-color="#b8583a"/>
      <stop offset="1" stop-color="#f2a65a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a55"/>
      <stop offset="1" stop-color="#5a3322"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="400" cy="250" r="40" fill="#ffcf7a" opacity="0.8"/>
  <!-- road, vanishing point at (400,260) -->
  <polygon points="400,260 800,600 0,600" fill="url(#road)"/>
  <g stroke="#7a4a2e" stroke-width="2" opacity="0.5">
    <line x1="400" y1="260" x2="250" y2="600"/>
    <line x1="400" y1="260" x2="550" y2="600"/>
  </g>
  <!-- left houses -->
  <polygon points="0,120 300,240 300,300 0,470" fill="#6b3524"/>
  <polygon points="0,120 300,240 0,40" fill="#3a1f1c"/>
  <polygon points="300,240 370,258 370,272 300,300" fill="#7d4430"/>
  <!-- right houses -->
  <polygon points="800,110 500,238 500,300 800,480" fill="#5e2f22"/>
  <polygon points="800,110 500,238 800,30" fill="#35201c"/>
  <polygon points="500,238 430,258 430,272 500,300" fill="#7a412c"/>
  <!-- windows -->
  <g fill="#ffc861">
    <polygon points="60,210 120,228 120,290 60,290"/>
    <polygon points="180,245 220,255 220,290 180,290"/>
    <polygon points="740,200 680,222 680,285 740,290"/>
    <polygon points="610,245 575,255 575,288 610,288"/>
    <rect x="320" y="262" width="12" height="14"/>
    <rect x="465" y="262" width="12" height="14"/>
  </g>
  <g fill="url(#glow)">
    <circle cx="90" cy="255" r="70"/><circle cx="200" cy="270" r="45"/>
    <circle cx="710" cy="250" r="70"/><circle cx="592" cy="270" r="45"/>
  </g>
  <!-- lantern posts -->
  <g stroke="#2a1812" stroke-width="4">
    <line x1="240" y1="420" x2="240" y2="300"/>
    <line x1="560" y1="420" x2="560" y2="300"/>
  </g>
  <circle cx="240" cy="300" r="30" fill="url(#glow)"/>
  <circle cx="560" cy="300" r="30" fill="url(#glow)"/>
  <rect x="233" y="292" width="14" height="16" fill="#ffd27a"/>
  <rect x="553" y="292" width="14" height="16" fill="#ffd27a"/>
  <!-- leaves -->
  <g fill="#d9622b">
    <ellipse cx="150" cy="540" rx="8" ry="4" transform="rotate(30 150 540)"/>
    <ellipse cx="620" cy="560" rx="8" ry="4" fill="#e89a3a"/>
    <ellipse cx="330" cy="470" rx="6" ry="3" transform="rotate(-20 330 470)"/>
    <ellipse cx="500" cy="500" rx="7" ry="3" fill="#b8402a"/>
    <ellipse cx="700" cy="150" rx="7" ry="3" fill="#e89a3a" transform="rotate(40 700 150)"/>
    <ellipse cx="90" cy="100" rx="7" ry="3" transform="rotate(-30 90 100)"/>
  </g>
  <!-- bicycle -->
  <ellipse cx="400" cy="548" rx="120" ry="10" fill="#2a1812" opacity="0.4"/>
  <g fill="none" stroke="#2a1812" stroke-width="5">
    <circle cx="330" cy="500" r="45"/>
    <circle cx="480" cy="500" r="45"/>
    <polyline points="330,500 385,500 440,440 380,440 385,500"/>
    <line x1="440" y1="440" x2="480" y2="500"/>
    <line x1="380" y1="440" x2="372" y2="425"/>
    <line x1="440" y1="440" x2="445" y2="415"/>
    <line x1="435" y1="415" x2="460" y2="412"/>
  </g>
  <rect x="360" y="420" width="28" height="7" rx="3" fill="#2a1812"/>
  <!-- pelican -->
  <path d="M400,470 L385,500" stroke="#e08a2a" stroke-width="5"/>
  <ellipse cx="375" cy="400" rx="55" ry="35" fill="#f4ead8"/>
  <path d="M330,395 Q340,370 380,380 Q350,405 330,395Z" fill="#c9b99c"/>
  <path d="M405,385 Q420,340 420,320" stroke="#f4ead8" stroke-width="18" fill="none"
        stroke-linecap="round"/>
  <circle cx="422" cy="315" r="17" fill="#f4ead8"/>
  <circle cx="428" cy="310" r="3" fill="#2a1812"/>
  <path d="M435,315 L505,330 L438,325Z" fill="#e8a33a"/>
  <path d="M438,325 L500,332 Q470,355 440,332Z" fill="#d9782b"/>
  <path d="M430,405 Q445,410 450,415" stroke="#f4ead8" stroke-width="7" fill="none"/>
  <path d="M1,1" />
  <circle cx="422" cy="300" r="6" fill="#ffe7b0"/>
  <line x1="390" y1="430" x2="400" y2="470" stroke="#e08a2a" stroke-width="5"/>
</svg>