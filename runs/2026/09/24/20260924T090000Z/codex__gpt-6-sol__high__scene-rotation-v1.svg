    <circle cx="355" cy="503" r="5" fill="#cba784" stroke-width="2"/>
    <circle cx="648" cy="503" r="5" fill="#cba784" stroke-width="2"/>
  </g>

  <!-- Pelican: tail, body, long neck, and generous beak pouch -->
  <path d="M411 385q-42 8-67-14 13 35 57 42Z"
