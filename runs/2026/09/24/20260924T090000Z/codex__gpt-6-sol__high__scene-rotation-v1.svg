  <path d="M800 284l64 14v76l-64-23Z" fill="#60484b"/>
  <ellipse cx="831" cy="329" rx="76" ry="78" fill="url(#windowGlow)"/>
  <path d="M808 294l47 11v58l-47-17Z" fill="#ffdc91"/>
  <path d="M831 299v55m-23-31 47 13" stroke="#86554b"
        stroke-width="5"/>
  <path d="M768 479v-77q24-22 47-2v96" fill="#674d4d"/>

