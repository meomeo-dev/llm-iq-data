  <path d="M658 322l52-37v74l-52 31Z" fill="#644b4a"/>
  <ellipse cx="683" cy="337" rx="65" ry="72" fill="url(#windowGlow)"/>
  <path d="M665 325l38-27v54l-38 23Z" fill="#ffdb91"/>
