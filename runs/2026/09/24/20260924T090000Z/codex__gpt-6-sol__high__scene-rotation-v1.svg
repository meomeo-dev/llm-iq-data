  <!-- Bicycle -->
  <ellipse cx="500" cy="554" rx="185" ry="18" fill="#3d3a42"
           opacity=".18"/>
  <g fill="none" stroke="#443f46" stroke-linecap="round"
     stroke-linejoin="round">
    <circle cx="355" cy="503" r="66" stroke-width="9"/>
    <circle cx="648" cy="503" r="66" stroke-width="9"/>
    <circle cx="355" cy="503" r="53" stroke="#d6b69a" stroke-width="2"/>
    <circle cx="648" cy="503" r="53" stroke="#d6b69a" stroke-width="2"/>
    <path d="M355 503h143l-64-91-79 91 79-91 133 4-69 87 150 0-81-87"
          stroke="#81584f" stroke-width="9"/>
    <path d="M498 503 434 412m64 91 69-87"
          stroke="#cf9470" stroke-width="3"/>
    <path d="M648 503 581 390l31-8m-31 8-21-1"
          stroke="#443f46" stroke-width="8"/>
    <path d="M434 412 422 391m-21 0h45"
