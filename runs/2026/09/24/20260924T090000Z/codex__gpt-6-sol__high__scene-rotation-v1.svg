  <path d="M532 372q20-3 34 11l20 9"
        fill="none" stroke="#ead5b5" stroke-width="17"
        stroke-linecap="round"/>
  <path d="M582 390q8 2 12-4" fill="none" stroke="#b87356"
        stroke-width="9" stroke-linecap="round"/>

  <!-- A few bright leaves in the foreground -->
  <g fill="#dc985c">
    <path d="M88 571q21-25 41-12-15 28-41 12Z"/>
    <path d="M817 567q18-27 38-17-10 28-38 17Z"/>
    <path d="M56 486q18-20 32-8-13 21-32 8Z"/>
  </g>
</svg>