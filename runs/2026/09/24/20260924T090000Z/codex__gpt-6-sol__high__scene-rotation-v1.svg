  <path d="M631 271q59 0 137 19-53 19-122 15Z"
        fill="#d59a67" stroke="#805e58" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M644 299q60 14 124-9-12 48-50 68-40 17-67-13
