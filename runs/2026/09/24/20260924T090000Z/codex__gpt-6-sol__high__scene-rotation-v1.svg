<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600"
     role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle through an autumn village</title>
  <desc id="desc">At dusk, a pelican pedals along a village lane that narrows
    toward a distant church. Russet trees frame cottages with glowing windows.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#60516a"/>
      <stop offset=".58" stop-color="#b87568"/>
      <stop offset="1" stop-color="#e8ae72"/>
    </linearGradient>
    <linearGradient id="lane" x2="0" y2="1">
      <stop offset="0" stop-color="#9b716a"/>
      <stop offset="1" stop-color="#684d50"/>
    </linearGradient>
    <linearGradient id="wall" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ae83"/>
      <stop offset="1" stop-color="#a66e60"/>
    </linearGradient>
    <radialGradient id="windowGlow">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffba64" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternGlow">
      <stop offset="0" stop-color="#ffe6a0" stop-opacity=".75"/>
      <stop offset="1" stop-color="#f2a35b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Evening sky and the quiet end of the lane -->
  <path fill="url(#sky)" d="M0 0h900v600H0z"/>
  <circle cx="445" cy="198" r="75" fill="#f8c387" opacity=".16"/>
  <path d="M0 260Q105 220 225 254T450 252T690 247T900 257v105H0Z"
        fill="#765c65" opacity=".55"/>
  <path d="M0 297Q150 267 302 288T580 282T900 298v90H0Z"
        fill="#68535d" opacity=".7"/>

  <!-- Distant village roofs share the lane's vanishing point -->
  <path d="M378 279l24-20 27 20v30h-51Z" fill="#b88770"/>
  <path d="M371 280l31-25 33 25" fill="none" stroke="#594952"
        stroke-width="7" stroke-linejoin="round"/>
  <path d="M410 265v-31l12-12 12 12v38Z" fill="#c49a78"/>
  <path d="M407 235l15-17 15 17" fill="#584953"/>
  <rect x="418" y="241" width="8" height="12" rx="4" fill="#ffd988"/>
  <path d="M463 282l24-19 27 19v25h-51Z" fill="#b27c6a"/>
  <path d="M458 283l29-25 31 25" fill="none" stroke="#574850"
