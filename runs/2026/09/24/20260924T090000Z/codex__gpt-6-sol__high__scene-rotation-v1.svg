  <path d="M421 299h58L900 600H0Z" fill="url(#lane)"/>
  <path d="M421 299 0 600M479 299l421 301" fill="none"
        stroke="#d4a37d" stroke-width="7" opacity=".75"/>
  <path d="M432 311 177 600M468 311l255 289" fill="none"
        stroke="#b48775" stroke-width="2" opacity=".35"/>
  <path d="M449 325v20m0 22v31m0 43v47m0 68v44" fill="none"
