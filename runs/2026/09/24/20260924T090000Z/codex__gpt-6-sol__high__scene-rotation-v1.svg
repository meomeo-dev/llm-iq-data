    <path d="M267 558q12-18 26-10-7 19-26 10Z"/>
    <path d="M768 545q16-12 24 1-14 13-24-1Z"/>
    <path d="M699 581q11-17 26-9-9 18-26 9Z"/>
    <path d="M385 363q7-9 14-4-5 10-14 4Z"/>
    <path d="M521 334q8-7 13-1-7 8-13 1Z"/>
