<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a36"/>
      <stop offset="0.45" stop-color="#6b3446"/>
      <stop offset="0.75" stop-color="#c56a3a"/>
      <stop offset="1" stop-color="#f0b25a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f0a04a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f0a04a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe0a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a44"/>
      <stop offset="0.5" stop-color="#5c3a2c"/>
      <stop offset="1" stop-color="#3a2419"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b25a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0b25a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="laneClip">
      <polygon points="40,600 760,600 415,335 385,335"/>
    </clipPath>
    <path id="leaf" d="M0 -6 Q5 -2 4 4 Q0 8 -4 4 Q-5 -2 0 -6 Z"/>
    <g id="wheel" fill="none" stroke="#3b2a22">
      <circle r="36" stroke-width="5"/>
      <circle r="30" stroke-width="1.5" opacity="0.5"/>
      <g stroke-width="1.5" opacity="0.8">
        <line x1="-33" y1="0" x2="33" y2="0"/>
        <line x1="-33" y1="0" x2="33" y2="0" transform="rotate(30)"/>
        <line x1="-33" y1="0" x2="33" y2="0" transform="rotate(60)"/>
        <line x1="-33" y1="0" x2="33" y2="0" transform="rotate(90)"/>
        <line x1="-33" y1="0" x2="33" y2="0" transform="rotate(120)"/>
        <line x1="-33" y1="0" x2="33" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="4" fill="#3b2a22"/>
    </g>
    <!-- 左侧房屋（右侧以镜像复用） -->
    <g id="houses">
      <!-- window halos -->
      <g fill="#ffb347" opacity="0.55" filter="url(#soft)">
        <circle cx="34" cy="288" r="26"/><circle cx="74" cy="292" r="26"/>
        <circle cx="44" cy="470" r="22"/><circle cx="76" cy="450" r="22"/>
        <circle cx="136" cy="300" r="18"/><circle cx="176" cy="304" r="18"/>
        <circle cx="136" cy="416" r="18"/><circle cx="176" cy="404" r="18"/>
        <circle cx="234" cy="310" r="12"/><circle cx="266" cy="314" r="12"/>
        <circle cx="234" cy="386" r="12"/><circle cx="266" cy="376" r="12"/>
        <circle cx="320" cy="320" r="8"/><circle cx="348" cy="324" r="8"/>
        <circle cx="320" cy="356" r="8"/><circle cx="348" cy="348" r="8"/>
      </g>
      <!-- house 1 -->
      <polygon points="0,560 100,502 100,142 0,80" fill="#d8b07a" stroke="#4a2a20" stroke-width="2"/>
      <polygon points="0,560 100,502 100,470 0,520" fill="#8c6a4e" opacity="0.7"/>
      <polygon points="-10,74 105,146 105,101 -10,23" fill="#5a2a22" stroke="#3a1a14" stroke-width="2"/>
      <rect x="28" y="22" width="14" height="40" fill="#4a2a24"/>
      <polygon points="0,105 100,160 100,166 0,112" fill="#4a2a20" opacity="0.5"/>
      <!-- house 2 -->
      <polygon points="112,496 200,445 200,205 112,150" fill="#b8785a" stroke="#4a2a20" stroke-width="2"/>
      <polygon points="108,148 204,208 204,168 108,103" fill="#6e2f24" stroke="#3a1a14" stroke-width="2"/>
      <rect x="140" y="112" width="10" height="34" fill="#4a2a24"/>
      <!-- house 3 -->
      <polygon points="212,438 288,394 288,260 212,212" fill="#c99a6e" stroke="#4a2a20" stroke-width="1.5"/>
      <polygon points="208,210 292,263 292,227 208,170" fill="#5a2a22" stroke="#3a1a14" stroke-width="1.5"/>
      <!-- house 4 -->
      <polygon points="300,387 360,353 360,305 300,267" fill="#a86d55" stroke="#4a2a20" stroke-width="1"/>
      <polygon points="296,265 364,308 364,276 296,230" fill="#6e2f24" stroke="#3a1a14" stroke-width="1"/>
      <!-- windows -->
      <g fill="#ffd27a" stroke="#7a3b1e" stroke-width="1.5">
        <polygon points="20,320 48,321 48,258 20,252"/>
        <polygon points="60,321 88,322 88,266 60,260"/>
        <polygon points="64,483 88,472 88,416 64,422"/>
        <polygon points="124,323 148,324 148,278 124,273"/>
        <polygon points="164,324 188,325 188,287 164,282"/>
        <polygon points="124,449 148,439 148,384 124,389"/>
        <polygon points="164,432 188,421 188,376 164,381"/>
        <polygon points="224,326 244,326 244,298 224,294"/>
        <polygon points="256,326 276,327 276,305 256,300"/>
        <polygon points="224,406 244,397 244,364 224,368"/>
        <polygon points="256,392 276,383 276,357 256,361"/>
        <polygon points="312,328 328,328 328,315 312,312"/>
        <polygon points="340,329 356,329 356,321 340,318"/>
        <polygon points="312,365 328,358 328,346 312,349"/>
        <polygon points="340,354 356,347 356,340 340,343"/>
      </g>
      <g stroke="#7a3b1e" stroke-width="1.2" opacity="0.8">
        <line x1="34" y1="255" x2="34" y2="320"/><line x1="20" y1="288" x2="48" y2="289"/>
        <line x1="74" y1="263" x2="74" y2="321"/><line x1="60" y1="291" x2="88" y2="294"/>
        <line x1="76" y1="419" x2="76" y2="477"/><line x1="64" y1="452" x2="88" y2="444"/>
        <line x1="136" y1="275" x2="136" y2="323"/><line x1="176" y1="284" x2="176" y2="324"/>
        <line x1="136" y1="386" x2="136" y2="444"/><line x1="176" y1="378" x2="176" y2="426"/>
      </g>
      <!-- door -->
      <polygon points="32,542 56,528 56,412 32,418" fill="#5a2a22" stroke="#3a1a14" stroke-width="2"/>
      <circle cx="51" cy="476" r="2" fill="#e9a23b"/>
      <!-- porch lantern -->
      <circle cx="30" cy="395" r="18" fill="#ffb347" opacity="0.6" filter="url(#soft)"/>
      <rect x="26" y="388" width="8" height="12" fill="#ffd27a" stroke="#3a1a14" stroke-width="1"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <g fill="#fff3d6" opacity="0.7">
    <circle cx="120" cy="60" r="1.2"/><circle cx="210" cy="35" r="1"/><circle cx="330" cy="70" r="1.4"/>
    <circle cx="480" cy="40" r="1"/><circle cx="560" cy="95" r="1.2"/><circle cx="700" cy="50" r="1"/>
    <circle cx="640" cy="130" r="0.9"/><circle cx="90" cy="140" r="1"/>
  </g>
  <path d="M660 80 a26 26 0 1 0 22 40 a20 20 0 1 1 -22 -40 Z" fill="#f6e3b8" opacity="0.85"/>
  <!-- 落日余晖 -->
  <circle cx="400" cy="330" r="170" fill="url(#glow)"/>
  <path d="M290 338 Q340 296 400 320 Q460 292 520 338 Z" fill="#5a3348" opacity="0.85"/>
  <circle cx="400" cy="326" r="18" fill="#ffe2a0" opacity="0.9"/>

  <!-- 巷道 -->
  <polygon points="40,600 760,600 415,335 385,335" fill="url(#lane)"/>
  <g clip-path="url(#laneClip)" stroke="#a97a58" stroke-linecap="round" fill="none" opacity="0.35">
    <line x1="0" y1="588" x2="800" y2="588" stroke-width="9" stroke-dasharray="20 12"/>
    <line x1="0" y1="566" x2="800" y2="566" stroke-width="8" stroke-dasharray="17 11" stroke-dashoffset="9"/>
    <line x1="0" y1="546" x2="800" y2="546" stroke-width="7" stroke-dasharray="15 10"/>
    <line x1="0" y1="528" x2="800" y2="528" stroke-width="6" stroke-dasharray="13 9" stroke-dashoffset="7"/>
    <line x1="0" y1="512" x2="800" y2="512" stroke-width="5" stroke-dasharray="11 8"/>
    <line x1="0" y1="497" x2="800" y2="497" stroke-width="4.5" stroke-dasharray="10 7" stroke-dashoffset="5"/>
    <line x1="0" y1="484" x2="800" y2="484" stroke-width="4" stroke-dasharray="9 6"/>
    <line x1="0" y1="472" x2="800" y2="472" stroke-width="3.5" stroke-dasharray="8 5" stroke-dashoffset="4"/>
    <line x1="0" y1="461" x2="800" y2="461" stroke-width="3" stroke-dasharray="7 5"/>
    <line x1="0" y1="451" x2="800" y2="451" stroke-width="2.5" stroke-dasharray="6 4" stroke-dashoffset="3"/>
    <line x1="0" y1="442" x2="800" y2="442" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="0" y1="434" x2="800" y2="434" stroke-width="2" stroke-dasharray="5 3" stroke-dashoffset="2"/>
    <line x1="0" y1="427" x2="800" y2="427" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="0" y1="420" x2="800" y2="420" stroke-width="1.5" stroke-dasharray="4 3" stroke-dashoffset="2"/>
    <line x1="0" y1="414" x2="800" y2="414" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  <!-- 路缘 -->
  <polygon points="0,566 40,600 385,335 380,335 0,555" fill="#9a6a48" opacity="0.6"/>
  <polygon points="800,566 760,600 415,335 420,335 800,555" fill="#9a6a48" opacity="0.6"/>

  <!-- 房屋：左侧 + 镜像右侧 -->
  <use href="#houses"/>
  <use href="#houses" transform="translate(800 0) scale(-1 1)"/>
  <!-- 右侧色调差异，打破对称 -->
  <polygon points="800,560 700,502 700,142 800,80" fill="#8b3a1e" opacity="0.35"/>
  <polygon points="588,438 512,394 512,260 588,212" fill="#6b4a3f" opacity="0.3"/>
  <polygon points="688,496 600,445 600,205 688,150" fill="#d9b37a" opacity="0.25"/>
  <!-- 远处暮霭 -->
  <polygon points="212,438 300,387 360,353 360,305 300,267 288,260 288,212 212,212" fill="#c56a3a" opacity="0.28"/>
  <polygon points="588,438 500,387 440,353 440,305 500,267 512,260 512,212 588,212" fill="#c56a3a" opacity="0.28"/>
  <polygon points="340,400 460,400 415,335 385,335" fill="url(#mist)"/>

  <!-- 右侧路灯 -->
  <circle cx="620" cy="332" r="46" fill="url(#lampglow)"/>
  <line x1="620" y1="457" x2="620" y2="340" stroke="#2a1a16" stroke-width="4"/>
  <ellipse cx="620" cy="458" rx="9" ry="3" fill="#2a1a16"/>
  <polygon points="612,342 628,342 626,322 614,322" fill="#ffd27a" stroke="#2a1a16" stroke-width="2"/>
  <polygon points="610,322 630,322 620,314" fill="#2a1a16"/>

  <!-- 秋树：左前景 -->
  <path d="M46 600 L40 330 L34 600 Z" fill="#3a2418"/>
  <path d="M40 360 L14 320 M40 340 L70 305 M38 380 L10 372" stroke="#3a2418" stroke-width="5" stroke-linecap="round"/>
  <g opacity="0.95">
    <circle cx="52" cy="248" r="66" fill="#b5502a"/>
    <circle cx="4" cy="292" r="52" fill="#c9832f"/>
    <circle cx="96" cy="298" r="48" fill="#e9a23b"/>
    <circle cx="44" cy="322" r="42" fill="#8b3a1e"/>
    <circle cx="70" cy="270" r="30" fill="#f0b25a" opacity="0.7"/>
  </g>
  <!-- 秋树：右前景 -->
  <path d="M766 600 L772 340 L778 600 Z" fill="#3a2418"/>
  <path d="M772 370 L740 335 M772 350 L796 320" stroke="#3a2418" stroke-width="5" stroke-linecap="round"/>
  <g opacity="0.95">
    <circle cx="746" cy="272" r="62" fill="#8b3a1e"/>
    <circle cx="800" cy="300" r="56" fill="#c9832f"/>
    <circle cx="722" cy="330" r="44" fill="#e9a23b"/>
    <circle cx="760" cy="322" r="30" fill="#b5502a" opacity="0.85"/>
  </g>

  <!-- 地面落叶 -->
  <g>
    <use href="#leaf" fill="#e9a23b" transform="translate(140 585) rotate(40)"/>
    <use href="#leaf" fill="#b5502a" transform="translate(210 560) rotate(-60) scale(0.9)"/>
    <use href="#leaf" fill="#c9832f" transform="translate(560 582) rotate(15)"/>
    <use href="#leaf" fill="#8b3a1e" transform="translate(640 555) rotate(80) scale(0.85)"/>
    <use href="#leaf" fill="#e9a23b" transform="translate(500 540) rotate(-30) scale(0.7)"/>
    <use href="#leaf" fill="#b5502a" transform="translate(120 540) rotate(120) scale(0.8)"/>
    <use href="#leaf" fill="#c9832f" transform="translate(690 590) rotate(-100)"/>
  </g>
  <!-- 空中飘落的叶子 -->
  <g opacity="0.9">
    <use href="#leaf" fill="#e9a23b" transform="translate(180 200) rotate(30) scale(0.8)"/>
    <use href="#leaf" fill="#c9832f" transform="translate(230 330) rotate(-50) scale(0.7)"/>
    <use href="#leaf" fill="#b5502a" transform="translate(560 250) rotate(70) scale(0.8)"/>
    <use href="#leaf" fill="#e9a23b" transform="translate(600 420) rotate(-20) scale(0.6)"/>
    <use href="#leaf" fill="#f0b25a" transform="translate(120 420) rotate(100) scale(0.7)"/>
    <use href="#leaf" fill="#8b3a1e" transform="translate(680 200) rotate(-80) scale(0.7)"/>
  </g>

  <!-- 自行车 -->
  <ellipse cx="355" cy="562" rx="80" ry="7" fill="#1e1210" opacity="0.35"/>
  <use href="#wheel" x="290" y="522"/>
  <use href="#wheel" x="420" y="522"/>
  <g fill="none" stroke="#3b2a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 522 L350 522 L338 458 Z"/>
    <path d="M338 458 L402 455"/>
    <path d="M350 522 L410 478"/>
    <path d="M402 455 L410 478"/>
    <path d="M410 478 L420 522"/>
    <path d="M338 458 L334 440"/>
    <path d="M402 455 L400 444 Q396 440 388 443"/>
    <path d="M350 522 L362 531"/>
    <path d="M350 522 L338 513"/>
  </g>
  <circle cx="350" cy="522" r="9" fill="none" stroke="#3b2a22" stroke-width="3"/>
  <path d="M290 522 Q320 540 350 530" fill="none" stroke="#3b2a22" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="334" cy="438" rx="14" ry="4.5" fill="#5a2a22"/>
  <rect x="356" y="528" width="12" height="4" rx="1" fill="#3b2a22"/>
  <rect x="332" y="510" width="12" height="4" rx="1" fill="#3b2a22"/>
  <!-- 车把提灯 -->
  <line x1="390" y1="446" x2="390" y2="456" stroke="#3b2a22" stroke-width="1.5"/>
  <circle cx="390" cy="464" r="22" fill="#ffb347" opacity="0.55" filter="url(#soft)"/>
  <rect x="384" y="456" width="12" height="15" rx="2" fill="#ffd27a" stroke="#3b2a22" stroke-width="1.5"/>
  <rect x="382" y="454" width="16" height="3" fill="#3b2a22"/>

  <!-- 鹈鹕 -->
  <!-- legs -->
  <g fill="none" stroke="#e08a2e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M342 452 L330 494 L338 513"/>
    <path d="M352 452 L366 500 L362 530"/>
  </g>
  <path d="M362 530 L372 532 L368 526 Z" fill="#e08a2e"/>
  <path d="M338 513 L348 515 L344 509 Z" fill="#e08a2e"/>
  <!-- tail -->
  <path d="M306 420 L272 402 L286 424 L270 440 L300 438 Z" fill="#e8d8bd" stroke="#b9a385" stroke-width="1.5"/>
  <!-- body -->
  <ellipse cx="345" cy="428" rx="46" ry="30" fill="#f6ead5" stroke="#b9a385" stroke-width="1.5" transform="rotate(-8 345 428)"/>
  <!-- wing -->
  <path d="M338 408 Q298 418 308 446 Q342 452 378 430 Q360 412 338 408 Z" fill="#e8d8bd" stroke="#b9a385" stroke-width="1.5"/>
  <path d="M316 440 Q340 434 366 428 M320 428 Q345 424 364 420" fill="none" stroke="#b9a385" stroke-width="1"/>
  <!-- wing tip reaching handlebar -->
  <path d="M372 428 Q392 438 400 450" fill="none" stroke="#f6ead5" stroke-width="10" stroke-linecap="round"/>
  <path d="M372 428 Q392 438 400 450" fill="none" stroke="#b9a385" stroke-width="1" opacity="0.6"/>
  <!-- neck -->
  <path d="M372 418 C396 406 402 386 405 362" fill="none" stroke="#f6ead5" stroke-width="18" stroke-linecap="round"/>
  <path d="M372 418 C396 406 402 386 405 362" fill="none" stroke="#b9a385" stroke-width="1" opacity="0.5" transform="translate(9 2)"/>
  <!-- head -->
  <circle cx="408" cy="352" r="16" fill="#f6ead5" stroke="#b9a385" stroke-width="1.5"/>
  <path d="M396 342 Q390 334 394 328 M400 338 Q396 330 402 326" fill="none" stroke="#e8d8bd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- beak and pouch -->
  <path d="M418 358 Q446 392 484 358 Z" fill="#d9782e" stroke="#8b3a1e" stroke-width="1.5"/>
  <path d="M416 347 L486 356 L418 362 Z" fill="#e9a23b" stroke="#8b3a1e" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="420" y1="356" x2="478" y2="357" stroke="#8b3a1e" stroke-width="1"/>
  <!-- eye -->
  <circle cx="412" cy="347" r="3.2" fill="#2a1a16"/>
  <circle cx="413" cy="346" r="1" fill="#ffffff"/>
  <!-- 围巾 -->
  <path d="M394 366 Q404 374 416 368" fill="none" stroke="#8b3a1e" stroke-width="6" stroke-linecap="round"/>
  <path d="M396 370 L386 392" stroke="#8b3a1e" stroke-width="5" stroke-linecap="round"/>

  <!-- 暮色整体暖晕 -->
  <rect width="800" height="600" fill="#f0b25a" opacity="0.06"/>
</svg>