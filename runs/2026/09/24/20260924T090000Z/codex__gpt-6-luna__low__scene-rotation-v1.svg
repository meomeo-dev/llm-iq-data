<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle down an autumn village lane at dusk</title>
  <desc id="desc">A gentle, nostalgic village scene in amber and russet, with lantern-lit cottages, autumn trees, and a pelican cycling toward the viewer along a one-point-perspective lane.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#493c4c"/>
      <stop offset=".58" stop-color="#b46c52"/>
      <stop offset="1" stop-color="#e6a15c"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#896044"/>
      <stop offset="1" stop-color="#493a37"/>
    </linearGradient>
    <linearGradient id="windowGlow" x2="0" y2="1">
      <stop stop-color="#ffe59a"/>
      <stop offset="1" stop-color="#ef9b43"/>
    </linearGradient>
    <radialGradient id="lanternHalo">
      <stop stop-color="#ffd778" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd778" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ink { stroke: #493c39; stroke-linecap: round; stroke-linejoin: round; }
      .fine { fill: none; stroke: #493c39; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Dusk sky and distant village -->
  <rect width="900" height="650" fill="url(#sky)"/>
  <circle cx="449" cy="213" r="61" fill="#f5c77c" opacity=".75"/>
  <path d="M0 270 Q110 220 220 259 T450 248 T680 255 T900 223 V356 H0Z" fill="#66504a"/>
  <path d="M0 305 Q180 269 340 296 T640 284 T900 300 V376 H0Z" fill="#79604c"/>

  <!-- Distant rooftops -->
  <g fill="#4c3c3a">
    <path d="M331 293l26-24 28 24v42h-54z"/>
    <path d="M391 285l35-33 38 33v52h-73z"/>
    <path d="M483 296l25-23 29 23v40h-54z"/>
    <path d="M552 286l33-29 34 29v50h-67z"/>
  </g>
  <g fill="url(#windowGlow)">
    <rect x="350" y="305" width="9" height="14" rx="2"/>
    <rect x="412" y="296" width="11" height="17" rx="2"/>
    <rect x="440" y="298" width="10" height="17" rx="2"/>
    <rect x="500" y="308" width="9" height="13" rx="2"/>
    <rect x="572" y="299" width="10" height="15" rx="2"/>
  </g>

  <!-- Lane and perspective edges -->
  <path d="M0 650V357L328 304L360 304L270 650Z" fill="#73503d"/>
  <path d="M900 650V357L572 304L540 304L630 650Z" fill="#73503d"/>
  <path d="M270 650L360 304H540L630 650Z" fill="url(#road)"/>
  <path d="M270 650L360 304M630 650L540 304" fill="none" stroke="#d39a60" stroke-width="5" opacity=".65"/>
  <path d="M447 650L448 554M447 515L448 454M448 425L449 385M449 365L449 341"
        fill="none" stroke="#e2b378" stroke-width="5" stroke-linecap="round" opacity=".65"/>

  <!-- Cottage on left -->
  <g>
    <path d="M0 375L138 277L276 375V548H0Z" fill="#9a6546" class="ink" stroke-width="5"/>
    <path d="M-11 379L138 266L287 379" fill="none" stroke="#513b36" stroke-width="17" stroke-linejoin="round"/>
    <path d="M18 388H257V418H18Z" fill="#d19359"/>
    <path d="M32 445H104V538H32Z" fill="#61483e" class="ink" stroke-width="4"/>
    <path d="M43 455H93V505H43Z" fill="url(#windowGlow)"/>
    <path d="M68 455V505M43 480H93" fill="none" stroke="#8c543d" stroke-width="4"/>
    <circle cx="91" cy="518" r="3" fill="#f5ca80"/>
    <path d="M157 430H222V484H157Z" fill="url(#windowGlow)" class="ink" stroke-width="4"/>
    <path d="M189 431V483M158 457H221" fill="none" stroke="#84503b" stroke-width="4"/>
    <path d="M147 421H231V431H147Z" fill="#583e37"/>
    <path d="M0 549H276" stroke="#513d38" stroke-width="8"/>
  </g>

  <!-- Cottage on right -->
  <g>
    <path d="M627 376L768 280L910 376V550H627Z" fill="#895844" class="ink" stroke-width="5"/>
    <path d="M617 380L768 269L920 380" fill="none" stroke="#4c3937" stroke-width="17" stroke-linejoin="round"/>
    <path d="M644 389H890V419H644Z" fill="#c38450"/>
    <path d="M798 438H875V548H798Z" fill="#5c433a" class="ink" stroke-width="4"/>
    <path d="M811 449H862V508H811Z" fill="url(#windowGlow)"/>
    <path d="M837 449V508M811 478H862" fill="none" stroke="#81503b" stroke-width="4"/>
    <path d="M681 427H744V483H681Z" fill="url(#windowGlow)" class="ink" stroke-width="4"/>
    <path d="M712 428V482M682 455H743" fill="none" stroke="#81503b" stroke-width="4"/>
    <path d="M672 418H753V428H672Z" fill="#523b36"/>
    <path d="M627 551H900" stroke="#513d38" stroke-width="8"/>
  </g>

  <!-- Autumn trees -->
  <g>
    <path d="M115 361L121 260L112 209L137 264L147 184L159 278L178 232L165 317L192 356Z" fill="#503b36"/>
    <g fill="#a55339">
      <circle cx="76" cy="244" r="48"/><circle cx="129" cy="212" r="54"/>
      <circle cx="181" cy="248" r="45"/><circle cx="112" cy="284" r="51"/>
    </g>
    <g fill="#d27a3e">
      <circle cx="93" cy="213" r="28"/><circle cx="151" cy="230" r="31"/>
      <circle cx="118" cy="264" r="31"/>
    </g>
    <path d="M759 361L770 265L760 210L782 263L799 188L808 276L832 230L821 322L848 357Z" fill="#503b36"/>
    <g fill="#9b4d39">
      <circle cx="719" cy="246" r="48"/><circle cx="772" cy="213" r="54"/>
      <circle cx="824" cy="249" r="45"/><circle cx="755" cy="285" r="51"/>
    </g>
    <g fill="#c96f3d">
      <circle cx="736" cy="216" r="28"/><circle cx="794" cy="231" r="31"/>
      <circle cx="761" cy="265" r="31"/>
    </g>
  </g>

  <!-- Lantern halos and fixtures -->
  <g>
    <circle cx="248" cy="394" r="74" fill="url(#lanternHalo)"/>
    <path d="M247 370V389M239 389H255L260 408H234Z" fill="#493b38" stroke="#332c2c" stroke-width="3"/>
    <rect x="239" y="392" width="16" height="12" rx="3" fill="#ffd27a"/>
    <path d="M247 369V360" stroke="#493b38" stroke-width="3"/>
    <circle cx="654" cy="394" r="74" fill="url(#lanternHalo)"/>
    <path d="M653 370V389M645 389H661L666 408H640Z" fill="#493b38" stroke="#332c2c" stroke-width="3"/>
    <rect x="645" y="392" width="16" height="12" rx="3" fill="#ffd27a"/>
    <path d="M653 369V360" stroke="#493b38" stroke-width="3"/>
  </g>

  <!-- Scattered leaves -->
  <g fill="#e59a4d" opacity=".9">
    <path d="M322 542q14-17 25-2-14 2-25 2z"/><path d="M586 573q15-18 26-3-14 2-26 3z"/>
    <path d="M378 613q13-16 24-2-13 2-24 2z"/><path d="M520 500q12-15 23-2-13 2-23 2z"/>
  </g>

  <!-- Bicycle -->
  <g fill="none" class="ink" stroke-width="6">
    <circle cx="365" cy="540" r="55" stroke="#322f31"/>
    <circle cx="558" cy="540" r="55" stroke="#322f31"/>
    <path d="M365 540L414 477L462 540L365 540M414 477L500 477L558 540L462 540M500 477L487 456"/>
    <path d="M480 456H500M404 474L397 462M387 462H407"/>
    <path d="M462 540L454 555M446 555H462"/>
  </g>
  <g fill="#d9c6a2" stroke="#493c39" stroke-width="3">
    <circle cx="365" cy="540" r="6"/><circle cx="558" cy="540" r="6"/>
    <circle cx="462" cy="540" r="6"/>
  </g>

  <!-- Pelican: body, wings, neck, and head -->
  <g class="ink" stroke-width="5">
    <path d="M399 450Q403 414 435 401Q467 389 493 410Q512 426 505 453Q498 475 469 485L429 478Q406 471 399 450Z"
          fill="#f1e5cb"/>
    <path d="M418 433Q445 411 478 427Q460 451 430 459Q416 451 418 433Z"
          fill="#d8c8a8"/>
    <path d="M465 414Q472 386 468 365Q465 347 478 333L497 340Q484 357 492 375Q505 398 492 420Z"
          fill="#f3e8d2"/>
    <ellipse cx="487" cy="331" rx="28" ry="22" fill="#f4e8d0"/>
    <path d="M508 328Q545 320 568 330Q579 336 568 342Q544 350 508 341Z" fill="#dc8b45"/>
    <path d="M568 341Q555 357 531 354Q517 352 512 342Q539 346 568 341Z" fill="#c8753f"/>
    <circle cx="496" cy="326" r="3.5" fill="#382f30" stroke="none"/>
    <path d="M477 311Q487 301 500 307" fill="none" stroke="#bd6746" stroke-width="4"/>
  </g>

  <!-- Pelican legs on pedals -->
  <path d="M435 473L451 502L462 529M474 474L466 500L462 529"
        fill="none" stroke="#c97843" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M462 529L452 532M462 529L471 533" fill="none" stroke="#493c39" stroke-width="4" stroke-linecap="round"/>

  <!-- Pelican's scarf -->
  <path d="M466 370Q480 382 493 371L506 379Q490 397 470 385Z" fill="#9c493e" stroke="#493c39" stroke-width="4" stroke-linejoin="round"/>
  <path d="M481 384Q492 395 487 409L478 421L474 393Z" fill="#9c493e" stroke="#493c39" stroke-width="3" stroke-linejoin="round"/>

  <!-- Handlebar and gentle road accents -->
  <path d="M486 456L500 442L515 442M500 442L505 435" fill="none" stroke="#493c39" stroke-width="5" stroke-linecap="round"/>
  <path d="M311 585Q349 576 382 584M542 602Q586 590 615 599" fill="none" stroke="#dba66a" stroke-width="3" opacity=".45"/>

  <!-- Soft vignette -->
  <path d="M0 0H900V650H0Z" fill="none" stroke="#2f2a33" stroke-width="24" opacity=".24"/>
</svg>