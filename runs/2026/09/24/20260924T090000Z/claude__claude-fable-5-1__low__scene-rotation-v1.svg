<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a4f"/>
      <stop offset="0.55" stop-color="#8a4a3a"/>
      <stop offset="1" stop-color="#e2933f"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4a3a"/>
      <stop offset="1" stop-color="#3a2a22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunset" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <ellipse cx="400" cy="330" rx="260" ry="120" fill="url(#sunset)"/>

  <!-- Ground -->
  <rect y="330" width="800" height="270" fill="#4a3226"/>
  <!-- Lane converging to vanishing point (400,330) -->
  <polygon points="400,330 40,600 760,600" fill="url(#lane)"/>
  <!-- Cobble lines -->
  <g stroke="#7a5640" stroke-width="1.2" opacity="0.5">
    <line x1="400" y1="330" x2="200" y2="600"/>
    <line x1="400" y1="330" x2="300" y2="600"/>
    <line x1="400" y1="330" x2="500" y2="600"/>
    <line x1="400" y1="330" x2="600" y2="600"/>
    <path d="M300,380 Q400,376 500,380"/>
    <path d="M250,430 Q400,424 550,430"/>
    <path d="M180,500 Q400,492 620,500"/>
    <path d="M100,580 Q400,570 700,580"/>
  </g>

  <!-- Left houses (receding) -->
  <g>
    <polygon points="0,110 0,520 200,410 200,220" fill="#5a3a2e"/>
    <polygon points="0,110 200,220 220,190 20,60" fill="#7a3f2a"/>
    <polygon points="200,220 200,410 300,370 300,270" fill="#6b4535"/>
    <polygon points="200,220 300,270 310,255 210,195" fill="#8a4a2e"/>
    <polygon points="300,270 300,370 360,350 360,300" fill="#5e3d2f"/>
    <polygon points="300,270 360,300 366,290 306,255" fill="#7a3f2a"/>
    <!-- windows -->
    <g fill="#ffb84d">
      <polygon points="40,240 80,255 80,320 40,305"/>
      <polygon points="120,270 150,282 150,340 120,328"/>
      <polygon points="230,290 250,298 250,345 230,337"/>
      <polygon points="320,310 335,316 335,350 320,344"/>
    </g>
    <ellipse cx="60" cy="280" rx="70" ry="60" fill="url(#glow)"/>
    <ellipse cx="240" cy="318" rx="40" ry="35" fill="url(#glow)"/>
  </g>

  <!-- Right houses -->
  <g>
    <polygon points="800,110 800,520 600,410 600,220" fill="#553627"/>
    <polygon points="800,110 600,220 580,190 780,60" fill="#8a4a2e"/>
    <polygon points="600,220 600,410 500,370 500,270" fill="#66402f"/>
    <polygon points="600,220 500,270 490,255 590,195" fill="#7a3f2a"/>
    <polygon points="500,270 500,370 440,350 440,300" fill="#5e3d2f"/>
    <polygon points="500,270 440,300 434,290 494,255" fill="#8a4a2e"/>
    <g fill="#ffb84d">
      <polygon points="720,240 760,255 760,320 720,305" transform="translate(1480,0) scale(-1,1)" />
      <polygon points="680,270 650,282 650,340 680,328"/>
      <polygon points="550,290 530,298 530,345 550,337"/>
      <polygon points="470,310 455,316 455,350 470,344"/>
    </g>
    <ellipse cx="740" cy="280" rx="70" ry="60" fill="url(#glow)"/>
    <ellipse cx="560" cy="318" rx="40" ry="35" fill="url(#glow)"/>
  </g>

  <!-- Autumn trees -->
  <g>
    <rect x="352" y="300" width="6" height="40" fill="#3a2418"/>
    <circle cx="355" cy="292" r="22" fill="#c8652a"/>
    <circle cx="345" cy="300" r="14" fill="#e08a3a"/>
    <rect x="442" y="300" width="6" height="40" fill="#3a2418"/>
    <circle cx="445" cy="292" r="22" fill="#b5502a"/>
    <circle cx="456" cy="300" r="14" fill="#e08a3a"/>
  </g>

  <!-- Lantern post -->
  <rect x="640" y="380" width="8" height="180" fill="#2a1a12"/>
  <rect x="628" y="360" width="32" height="34" rx="4" fill="#2a1a12"/>
  <rect x="634" y="366" width="20" height="22" fill="#ffd36a"/>
  <ellipse cx="644" cy="378" rx="90" ry="80" fill="url(#glow)"/>

  <!-- Fallen leaves -->
  <g fill="#d9772f" opacity="0.8">
    <ellipse cx="150" cy="560" rx="7" ry="4"/>
    <ellipse cx="520" cy="520" rx="6" ry="3.5" fill="#c4512a"/>
    <ellipse cx="620" cy="575" rx="7" ry="4"/>
    <ellipse cx="260" cy="500" rx="5" ry="3" fill="#e9a03f"/>
    <ellipse cx="700" cy="540" rx="6" ry="3.5" fill="#c4512a"/>
  </g>

  <!-- Bicycle -->
  <g stroke="#2a1a12" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="300" cy="500" r="42"/>
    <circle cx="470" cy="500" r="42"/>
    <g stroke-width="1.5" opacity="0.7">
      <line x1="300" y1="458" x2="300" y2="542"/><line x1="258" y1="500" x2="342" y2="500"/>
      <line x1="270" y1="470" x2="330" y2="530"/><line x1="330" y1="470" x2="270" y2="530"/>
      <line x1="470" y1="458" x2="470" y2="542"/><line x1="428" y1="500" x2="512" y2="500"/>
      <line x1="440" y1="470" x2="500" y2="530"/><line x1="500" y1="470" x2="440" y2="530"/>
    </g>
    <!-- frame -->
    <polyline points="300,500 370,430 450,430 470,500"/>
    <polyline points="370,430 385,500 300,500"/>
    <line x1="385" y1="500" x2="450" y2="430"/>
    <line x1="450" y1="430" x2="440" y2="400"/>
    <line x1="425" y1="400" x2="462" y2="395"/>
    <line x1="370" y1="430" x2="360" y2="410"/>
    <line x1="345" y1="410" x2="378" y2="408"/>
    <circle cx="385" cy="500" r="7" fill="#2a1a12"/>
    <line x1="385" y1="500" x2="400" y2="516"/>
    <line x1="385" y1="500" x2="370" y2="484"/>
    <rect x="392" y="512" width="18" height="6" fill="#2a1a12"/>
  </g>
  <!-- Basket with leaves -->
  <rect x="440" y="392" width="34" height="26" rx="4" fill="#b8773a" stroke="#6b3f1e" stroke-width="2"/>
  <circle cx="450" cy="392" r="6" fill="#d9772f"/><circle cx="465" cy="390" r="6" fill="#c4512a"/>

  <!-- Pelican -->
  <g>
    <!-- legs -->
    <path d="M372,420 L380,470 L398,514" stroke="#e8a13c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M372,420 L362,466 L372,486" stroke="#d68c2e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="365" cy="395" rx="52" ry="34" fill="#f6ead6"/>
    <path d="M318,390 Q330,350 372,362 Q350,380 318,390 Z" fill="#e3d2b8"/>
    <!-- tail -->
    <path d="M315,392 L290,382 L300,405 Z" fill="#e3d2b8"/>
    <!-- wing -->
    <path d="M340,395 Q368,372 405,392 Q380,410 340,395 Z" fill="#dcc8ad"/>
    <!-- neck -->
    <path d="M392,372 Q405,340 400,315" stroke="#f6ead6" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="402" cy="312" r="20" fill="#f6ead6"/>
    <!-- beak -->
    <path d="M414,308 L482,318 L418,326 Z" fill="#f2a53d"/>
    <path d="M416,318 Q450,340 480,320 Q450,326 416,318 Z" fill="#e5872a"/>
    <!-- eye -->
    <circle cx="407" cy="306" r="3.5" fill="#2a1a12"/>
    <!-- scarf -->
    <path d="M386,330 Q402,342 420,334" stroke="#b5432a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M388,334 L376,360" stroke="#b5432a" stroke-width="7" stroke-linecap="round"/>
    <!-- wing arm to handlebar -->
    <path d="M395,392 Q420,395 428,404" stroke="#e3d2b8" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Soft dusk haze over distance -->
  <rect x="330" y="300" width="140" height="70" fill="#e2933f" opacity="0.15"/>
</svg>