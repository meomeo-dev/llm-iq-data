<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"
     viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">A Pelican's Autumn Evening Ride</title>
  <desc id="desc">
    A cream-colored pelican rides a russet bicycle along a cobbled village lane.
    Timber cottages and glowing lanterns converge toward a single vanishing
    point beneath an amber dusk sky. Autumn leaves drift through the gentle scene.
  </desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#766477"/>
      <stop offset=".52" stop-color="#cd927b"/>
      <stop offset="1" stop-color="#f5c584"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#b58469"/>
      <stop offset="1" stop-color="#66555a"/>
    </linearGradient>
    <linearGradient id="plaster" x2="1" y2=".7">
      <stop stop-color="#d4a078"/>
      <stop offset="1" stop-color="#926252"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#fff5d5"/>
      <stop offset=".55" stop-color="#efdfb9"/>
      <stop offset="1" stop-color="#bda78c"/>
    </linearGradient>
    <linearGradient id="bill" x2="0" y2="1">
      <stop stop-color="#f4c467"/>
      <stop offset="1" stop-color="#bd713d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ffe2a1" stop-opacity=".75"/>
      <stop offset=".4" stop-color="#ffc16d" stop-opacity=".27"/>
      <stop offset="1" stop-color="#ffc16d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette">
      <stop offset=".55" stop-color="#352d3a" stop-opacity="0"/>
      <stop offset="1" stop-color="#352d3a" stop-opacity=".35"/>
    </radialGradient>
    <pattern id="spokes" width="1" height="1" patternUnits="objectBoundingBox">
      <path d="M.5 0V1M0 .5H1M.146 .146L.854 .854M.146 .854L.854 .146"
            fill="none" stroke="#d4b89a" stroke-width=".012"/>
    </pattern>
    <g id="window">
      <rect width="43" height="64" rx="18" fill="#62443e" stroke="#543d39"
            stroke-width="7"/>
      <path d="M5 59V23Q5 5 21.5 5Q38 5 38 23V59Z" fill="#ffd08a"/>
      <path d="M21.5 5V60M4 31H39" stroke="#846048" stroke-width="4"/>
      <path d="M5 56Q13 46 19 55M25 56Q32 43 38 54" fill="#be814e" opacity=".6"/>
    </g>
    <g id="leaf">
      <path d="M-12 0Q-2-12 13-5Q10 9-2 7Z" fill="currentColor"/>
      <path d="M-15 6L9-3" fill="none" stroke="#754c3b" stroke-width="1.2"/>
    </g>
    <g id="lantern">
      <ellipse cy="3" rx="49" ry="59" fill="url(#glow)"/>
      <path d="M-10-16L0-25L10-16M0-25V-31" fill="#483b3a"
            stroke="#483b3a" stroke-width="3"/>
      <path d="M-10-15H10L8 14H-8Z" fill="#ffd08a"
            stroke="#55413a" stroke-width="3"/>
      <path d="M0-13V12M-10 16H10" stroke="#876044" stroke-width="2"/>
      <path d="M-3 7Q-4-3 1-7Q6 3 3 7Z" fill="#fff1b9"/>
    </g>
  </defs>

