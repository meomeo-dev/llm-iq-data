<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle through an autumn village at dusk</title>
  <desc id="desc">A gentle, nostalgic village lane recedes toward the sunset between lantern-lit cottages and autumn trees. A pelican pedals along the lane.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#596577"/>
      <stop offset=".58" stop-color="#bc8068"/>
      <stop offset="1" stop-color="#e6ae72"/>
    </linearGradient>
    <linearGradient id="road" x2=".15" y2="1">
      <stop stop-color="#8c6d5b"/>
      <stop offset="1" stop-color="#493f3e"/>
    </linearGradient>
    <linearGradient id="glow" x2="0" y2="1">
      <stop stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#e89c4f"/>
    </linearGradient>
    <radialGradient id="sunset">
      <stop stop-color="#ffd28b" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f4a66d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Dusk sky and distant hills -->
  <rect width="900" height="600" fill="url(#sky)"/>
  <ellipse cx="450" cy="246" rx="205" ry="115" fill="url(#sunset)"/>
  <circle cx="450" cy="230" r="30" fill="#f9d294" opacity=".82"/>
  <path d="M0 266 Q130 228 245 255 T455 247 T680 255 T900 226 V350 H0Z"
        fill="#665e5b" opacity=".72"/>
  <path d="M0 293 Q160 263 287 282 T535 270 T900 278 V362 H0Z"
        fill="#7c6558" opacity=".68"/>

  <!-- Village cottages framing the lane -->
  <path d="M0 165 L145 114 291 171 V390 H0Z" fill="#694c45"/>
  <path d="M0 165 L145 114 291 171 282 190 145 145 0 191Z" fill="#493c3d"/>
  <path d="M22 190 L145 151 264 194 V387 H22Z" fill="#9a6650"/>
  <path d="M22 190 L145 151 264 194" fill="none" stroke="#c18a64" stroke-width="5"/>
  <path d="M46 220 h48 v63 H46z M166 211 h50 v70 h-50z" fill="#523f3b"/>
  <path d="M52 226 h36 v48 H52z M172 218 h38 v56 h-38z" fill="url(#glow)"/>
  <path d="M70 226 v48 M52 250 h36 M191 218 v56 M172 246 h38"
        stroke="#765047" stroke-width="4"/>
  <path d="M96 326 Q145 277 194 326 V387 H96Z" fill="#493b39"/>
  <path d="M106 387 V337 Q145 297 184 337 V387Z" fill="#634943"/>
  <rect x="116" y="345" width="58" height="42" rx="28" fill="#d99355"/>
  <path d="M0 350 Q89 331 291 367 V403 H0Z" fill="#634943"/>

  <path d="M900 150 L766 108 622 166 V390 H900Z" fill="#57464a"/>
  <path d="M900 150 L766 108 622 166 632 187 766 139 900 178Z" fill="#403a3e"/>
  <path d="M878 183 L766 145 648 189 V389 H878Z" fill="#795346"/>
  <path d="M878 183 L766 145 648 189" fill="none" stroke="#a97a5b" stroke-width="5"/>
  <path d="M811 211 h47 v66 h-47z M678 222 h47 v61 h-47z" fill="#453b3a"/>
  <path d="M817 217 h35 v52 h-35z M684 228 h35 v49 h-35z" fill="url(#glow)"/>
  <path d="M835 217 v52 M817 243 h35 M702 228 v49 M684 250 h35"
        stroke="#62453e" stroke-width="4"/>
  <path d="M707 323 Q766 274 825 323 V389 H707Z" fill="#433a3b"/>
  <path d="M718 389 V337 Q766 297 814 337 V389Z" fill="#604641"/>
  <rect x="730" y="345" width="70" height="42" rx="28" fill="#d28a4f"/>
  <path d="M622 362 Q789 329 900 351 V403 H622Z" fill="#584348"/>

  <!-- Lanterns and the village lane -->
  <path d="M0 392 Q237 363 450 347 Q656 362 900 389 V600 H0Z"
        fill="url(#road)"/>
  <path d="M292 600 L416 348 M608 600 L484 348"
        stroke="#b38a6c" stroke-width="4" opacity=".35"/>
  <path d="M450 350 V600" stroke="#d3a67b" stroke-width="2" opacity=".22"/>
  <path d="M335 397 l-13 4 M568 397 l13 4 M270 455 l-24 8 M628 455 l24 8
           M182 538 l-34 12 M688 538 l34 12"
        stroke="#c3a083" stroke-width="3" opacity=".45"/>
  <g>
    <path d="M282 243 v35 M618 239 v35" stroke="#302f32" stroke-width="5"/>
    <path d="M270 260 h24 l-3 29 h-18z M606 256 h24 l-3 29 h-18z"
          fill="#423532" stroke="#d39a5a" stroke-width="2"/>
    <path d="M276 265 h12 v18 h-12z M612 261 h12 v18 h-12z"
          fill="#ffd487"/>
    <circle cx="282" cy="274" r="28" fill="#ffca78" opacity=".28" filter="url(#softGlow)"/>
    <circle cx="618" cy="270" r="28" fill="#ffca78" opacity=".28" filter="url(#softGlow)"/>
  </g>

  <!-- Autumn trees -->
  <g opacity=".95">
    <path d="M32 376 Q46 306 65 238 M68 373 Q73 302 69 251 M118 371 Q104 315 80 276"
          fill="none" stroke="#4d4038" stroke-width="11"/>
    <path d="M12 274 Q6 234 48 230 Q52 189 90 205 Q113 174 137 211
             Q172 207 166 248 Q184 276 151 295 Q137 326 102 307
             Q72 331 52 303 Q19 312 12 274Z" fill="#a44f37"/>
    <circle cx="55" cy="250" r="32" fill="#c36b3e"/>
    <circle cx="104" cy="234" r="37" fill="#b65a37"/>
    <circle cx="135" cy="273" r="35" fill="#8e4937"/>
    <circle cx="64" cy="291" r="27" fill="#cf8248"/>
  </g>
  <g opacity=".96">
    <path d="M865 373 Q849 303 834 235 M830 377 Q826 306 833 252 M782 372 Q794 317 818 277"
          fill="none" stroke="#493c36" stroke-width="11"/>
    <path d="M890 273 Q895 232 855 228 Q850 187 812 204 Q789 173 765 209
             Q730 205 736 246 Q718 275 750 294 Q765 326 800 307
             Q829 330 849 302 Q882 312 890 273Z" fill="#9d5336"/>
    <circle cx="846" cy="249" r="33" fill="#cb7741"/>
    <circle cx="800" cy="232" r="37" fill="#ac5434"/>
    <circle cx="769" cy="273" r="34" fill="#85483a"/>
    <circle cx="840" cy="291" r="28" fill="#d08a4a"/>
  </g>

  <!-- Bicycle -->
  <g stroke="#34403d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
     fill="none">
    <circle cx="354" cy="482" r="54" stroke="#302f32" stroke-width="5"/>
    <circle cx="540" cy="482" r="54" stroke="#302f32" stroke-width="5"/>
    <circle cx="354" cy="482" r="5" fill="#d1b28c" stroke="none"/>
    <circle cx="540" cy="482" r="5" fill="#d1b28c" stroke="none"/>
    <path d="M354 482 L421 421 L463 482 L354 482 M421 421 L493 418
             L463 482 M493 418 L540 482 M480 408 L497 418
             M488 404 L514 405 M410 413 L428 417"/>
    <path d="M463 482 l-18 18 M463 482 l20 8 M445 500 h-13 M483 490 h13"
          stroke-width="4"/>
    <path d="M354 482 L340 452 M540 482 L550 451" stroke-width="3" opacity=".8"/>
  </g>

  <!-- Pelican rider -->
  <g>
    <!-- Tail and body -->
    <path d="M409 388 Q379 378 363 394 Q382 401 405 400Z" fill="#f0e8d5"/>
    <ellipse cx="430" cy="384" rx="46" ry="31" fill="#f4eedf"/>
    <path d="M411 383 Q430 370 450 383 Q440 399 416 402Z" fill="#d7d1c2"/>
    <!-- Neck, head, and crest -->
    <path d="M443 380 Q463 351 449 328 Q438 309 451 292"
          fill="none" stroke="#f4eedf" stroke-width="20" stroke-linecap="round"/>
    <path d="M437 320 Q438 291 462 285 Q483 280 495 299
             Q499 319 480 329 Q458 336 437 320Z" fill="#f6efdf"/>
    <path d="M450 291 Q449 276 460 274 Q466 283 462 289Z" fill="#d1c9b8"/>
    <!-- Beak and pouch -->
    <path d="M485 304 Q523 298 553 309 Q531 320 490 316Z" fill="#e7a14f"/>
    <path d="M490 315 Q516 321 542 311 Q532 337 505 333 Q493 329 490 315Z"
          fill="#dc7954"/>
    <path d="M493 311 Q524 309 546 310" fill="none" stroke="#9f6447" stroke-width="2"/>
    <circle cx="479" cy="300" r="3.5" fill="#34383a"/>
    <circle cx="480" cy="299" r="1" fill="#fff4d9"/>
    <!-- Wings -->
    <path d="M408 374 Q432 362 456 379 Q444 397 418 394 Q404 391 408 374Z"
          fill="#ded8ca"/>
    <path d="M419 379 Q432 375 445 383 M417 386 Q430 383 439 390"
          fill="none" stroke="#bcb6aa" stroke-width="2"/>
    <!-- Legs and feet reaching pedals -->
    <path d="M429 404 Q431 423 447 438 L462 443" fill="none"
          stroke="#d98656" stroke-width="6" stroke-linecap="round"/>
    <path d="M456 440 l12 3 M462 438 l8 9" fill="none"
          stroke="#d98656" stroke-width="4" stroke-linecap="round"/>
    <path d="M448 404 Q460 419 477 424 L484 414" fill="none"
          stroke="#d98656" stroke-width="6" stroke-linecap="round"/>
    <path d="M479 413 l10 1 M480 409 l8 8" fill="none"
          stroke="#d98656" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Scattered leaves in the foreground -->
  <g fill="#d28349" opacity=".9">
    <path d="M115 481 q15 -14 20 1 q-12 10 -20 -1Z"/>
    <path d="M742 442 q14 -13 18 1 q-11 9 -18 -1Z"/>
    <path d="M204 572 q14 -13 19 1 q-11 9 -19 -1Z"/>
    <path d="M693 555 q14 -14 19 0 q-12 10 -19 0Z"/>
    <path d="M570 530 q12 -12 17 0 q-10 9 -17 0Z"/>
  </g>
</svg>