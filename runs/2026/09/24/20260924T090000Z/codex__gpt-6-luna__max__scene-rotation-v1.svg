<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle down an autumn village lane</title>
  <desc id="desc">A gentle, nostalgic village street at dusk, with glowing windows, russet trees, and a pelican pedaling a bicycle toward the evening light.</desc>
