      <stop offset="1" stop-color="#81504a"/>
    </linearGradient>
    <linearGradient id="feathers" x2="0" y2="1">
      <stop stop-color="#fff1d2"/>
      <stop offset="1" stop-color="#d8c6a3"/>
    </linearGradient>
    <radialGradient id="windowGlow">
      <stop stop-color="#ffd783" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb14f" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
