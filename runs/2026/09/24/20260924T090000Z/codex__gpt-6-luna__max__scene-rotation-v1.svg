      <stop stop-color="#342d49"/>
      <stop offset=".48" stop-color="#8b5360"/>
      <stop offset="1" stop-color="#ed9a60"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#896657"/>
      <stop offset=".55" stop-color="#725447"/>
      <stop offset="1" stop-color="#493c3b"/>
    </linearGradient>
    <linearGradient id="leftWall" x2="1" y2=".4">
