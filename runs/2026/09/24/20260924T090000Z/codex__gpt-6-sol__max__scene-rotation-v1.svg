          stroke="#df9870" stroke-width="3" opacity=".6"/>
    <path d="M582 645l-32 25m32-25 33-24"
          stroke="#383b40" stroke-width="7"/>
    <path d="M529 670h45m20-49h44" stroke="#3c3d42" stroke-width="7"/>
    <path d="M676 548l17-43 29-5" stroke="#424046" stroke-width="8"/>
    <path d="M524 542h69" stroke="#3f3d41" stroke-width="11"/>
  </g>
  <g fill="#444046">
    <circle cx="436" cy="650" r="8"/>
    <circle cx="761" cy="650" r="8"/>
    <circle cx="582" cy="645" r="11"/>
  </g>

  <!-- Orange legs pedal beneath the pelican's feathers. -->
  <g fill="none" stroke="#c8794b" stroke-width="15"
