<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"
     role="img" aria-labelledby="title description">
  <title id="title">A pelican rides through an autumn village</title>
  <desc id="description">
    At dusk, a pelican pedals a bicycle down a village lane lined with
    russet trees, old houses, and warmly lit windows.
  </desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#493b52"/>
      <stop offset=".52" stop-color="#a76a65"/>
      <stop offset="1" stop-color="#e5ae6c"/>
    </linearGradient>
    <radialGradient id="horizon">
      <stop stop-color="#ffd994" stop-opacity=".76"/>
      <stop offset="1" stop-color="#ffd994" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lane" x2="0" y2="1">
      <stop stop-color="#80645c"/>
      <stop offset="1" stop-color="#4b454b"/>
    </linearGradient>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#b67b61"/>
      <stop offset="1" stop-color="#805b55"/>
    </linearGradient>
    <linearGradient id="creamWall" x2="0" y2="1">
      <stop stop-color="#d9a87c"/>
      <stop offset="1" stop-color="#a87362"/>
    </linearGradient>
    <linearGradient id="window" x2="0" y2="1">
      <stop stop-color="#fff0ae"/>
      <stop offset="1" stop-color="#e9a64d"/>
    </linearGradient>
    <radialGradient id="lampGlow">
      <stop stop-color="#ffe6a0" stop-opacity=".8"/>
      <stop offset=".45" stop-color="#f9b85f" stop-opacity=".26"/>
      <stop offset="1" stop-color="#f9b85f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#f2ad58"/>
      <stop offset="1" stop-color="#cf7449"/>
    </linearGradient>
  </defs>

  <!-- The last light gathers at the end of the lane. -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="600" cy="347" rx="410" ry="220" fill="url(#horizon)"/>
  <path d="M0 382 Q150 326 286 371 T580 365 T900 374 T1200 345
           V530 H0Z" fill="#76535a" opacity=".55"/>
  <path d="M0 415 Q171 377 300 404 T603 391 T902 407 T1200 378
           V540 H0Z" fill="#634e50" opacity=".55"/>

  <!-- Small rooftops near the vanishing point. -->
  <path d="M482 352l42-27 42 27v103h-84z" fill="#936a60"/>
  <path d="M475 354l49-34 48 34-8 5-40-28-41 29z" fill="#64494c"/>
  <rect x="514" y="376" width="19" height="28" fill="url(#window)"/>
  <path d="M635 348l43-28 44 28v108h-87z" fill="#a67461"/>
  <path d="M628 351l50-37 51 37-8 6-43-31-42 32z" fill="#61464a"/>
  <rect x="669" y="374" width="20" height="31" fill="url(#window)"/>
  <path d="M572 366l28-19 29 19v88h-57z" fill="#76585a"/>
  <path d="M567 367l33-25 34 25" fill="none" stroke="#513e46"
