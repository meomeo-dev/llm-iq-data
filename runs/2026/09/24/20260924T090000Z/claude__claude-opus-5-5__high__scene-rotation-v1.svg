<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d3a"/>
      <stop offset="0.35" stop-color="#5e2f48"/>
      <stop offset="0.7" stop-color="#b8563a"/>
      <stop offset="1" stop-color="#f0a24a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="400" cy="300" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#f29a45" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f29a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3e2622"/>
      <stop offset="0.6" stop-color="#6b3f2c"/>
      <stop offset="1" stop-color="#b5703e"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb65a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb65a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe29a" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffb14f" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffb14f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="400" cy="330" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#1a0d14" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0d14" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="roadClip">
      <polygon points="0,560 375,316 428,318 800,560 800,600 0,600"/>
    </clipPath>
    <g id="wins">
      <!-- left houses -->
      <polygon points="40,232 100,243 100,322 40,326"/>
      <polygon points="90,370 130,361 130,433 90,452"/>
      <polygon points="175,275 235,282 235,329 175,339"/>
      <polygon points="190,361 240,346 240,381 190,407"/>
      <polygon points="275,278 315,285 315,313 275,319"/>
      <polygon points="340,288 365,293 365,305 340,309"/>
      <!-- right houses -->
      <polygon points="770,245 710,254 710,326 770,331"/>
      <polygon points="740,382 660,363 660,423 740,461"/>
      <polygon points="620,245 575,256 575,306 620,307"/>
      <polygon points="620,344 575,335 575,374 620,394"/>
      <polygon points="545,294 500,296 500,328 545,341"/>
      <polygon points="470,290 440,296 440,307 470,312"/>
      <!-- end house -->
      <rect x="393" y="292" width="12" height="11"/>
    </g>
