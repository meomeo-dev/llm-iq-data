      <line x1="440" y1="490" x2="500" y2="550"/><line x1="500" y1="490" x2="440" y2="550"/>
    </g>
  </g>
  <circle cx="330" cy="520" r="4" fill="#221312"/>
  <circle cx="470" cy="520" r="4" fill="#221312"/>

