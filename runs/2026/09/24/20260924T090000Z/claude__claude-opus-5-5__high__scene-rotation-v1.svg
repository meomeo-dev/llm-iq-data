  <polygon points="24,423 56,411 56,519 24,543" fill="none" stroke="#e59a4a" stroke-width="1" opacity="0.6"/>
  <circle cx="52" cy="468" r="2" fill="#f2c060"/>

  <!-- right houses (far to near) -->
  <polygon points="480,270 428,290 428,318 480,352" fill="#94502f"/>
  <polygon points="480,270 428,290 428,286 480,260" fill="#4a2522"/>
  <polygon points="560,256 480,278 480,352 560,404" fill="#7a3a2a"/>
