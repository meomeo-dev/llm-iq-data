    <line x1="400" y1="300" x2="960" y2="600"/><line x1="400" y1="300" x2="1200" y2="600"/>
    <line x1="0" y1="322" x2="800" y2="322"/><line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="340" x2="800" y2="340"/><line x1="0" y1="353" x2="800" y2="353"/>
    <line x1="0" y1="370" x2="800" y2="370"/><line x1="0" y1="392" x2="800" y2="392"/>
    <line x1="0" y1="420" x2="800" y2="420"/><line x1="0" y1="456" x2="800" y2="456"/>
    <line x1="0" y1="500" x2="800" y2="500"/><line x1="0" y1="550" x2="800" y2="550"/>
