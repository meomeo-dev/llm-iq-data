  <polygon points="330,275.5 375,291 375,316 330,345.5" fill="#8e4c32"/>
  <polygon points="330,275.5 375,291 375,288 330,267" fill="#4a2522"/>
  <polygon points="260,237 330,268.5 330,345.5 260,391" fill="#a35a36"/>
