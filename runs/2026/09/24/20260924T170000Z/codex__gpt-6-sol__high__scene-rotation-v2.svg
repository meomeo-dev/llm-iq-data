<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle in a library aisle</title>
  <desc id="desc">A comic black-and-white worm's-eye view between towering bookshelves. A pelican pedals overhead beneath a single lemon-yellow desk lamp.</desc>

  <defs>
    <clipPath id="left-clip">
      <path d="M0 0H405L325 1000H0Z"/>
    </clipPath>

    <g id="left-shelf">
      <path d="M0 0H405L325 1000H0Z" fill="#090909"/>
      <g clip-path="url(#left-clip)" fill="none" stroke="#fff" stroke-linejoin="round">
        <path d="M-20 173 392 138M-20 179 392 144
                 M-20 369 374 337M-20 377 374 345
                 M-20 594 353 571M-20 604 353 581
                 M-20 850 333 837M-20 862 333 849"
              stroke-width="9"/>
        <path d="M19 18 24 168M55 15 57 165M88 11 91 163
                 M126 8 125 158M165 5 164 155M201 3 201 152
                 M239 1 237 149M277 0 273 146M313 0 307 143
                 M348 0 339 140M380 0 369 138
                 M18 185 24 367M60 181 64 363M103 177 103 359
                 M145 174 145 356M190 170 187 351M232 166 229 348
                 M273 162 268 344M314 159 307 341M351 155 343 338
                 M15 384 19 593M56 381 59 590M100 377 99 587
                 M143 374 141 584M187 371 184 581M231 367 227 579
                 M272 364 267 576M311 361 305 573M348 358 339 571
                 M17 612 20 850M62 609 62 847M107 606 105 845
                 M151 604 148 843M197 601 192 841M240 599 235 840
                 M282 596 274 838M321 593 311 837
                 M19 870 20 1005M68 868 67 1005M115 866 112 1005
                 M163 864 158 1005M210 862 203 1005
                 M257 860 247 1005M302 858 289 1005"
              stroke-width="5"/>
        <path d="M34 48 35 122M173 33 172 109M288 35 282 113
                 M72 221 73 312M239 207 234 299M323 205 316 300
                 M31 439 31 532M157 433 154 532M286 427 279 529
                 M70 676 70 772M221 667 215 769M307 666 300 769"
              stroke-width="3"/>
      </g>
      <path d="M405 0 325 1000" fill="none" stroke="#fff" stroke-width="8"/>
    </g>

    <g id="wheel" fill="none" stroke="#090909">
      <circle r="150" stroke-width="22"/>
      <circle r="132" stroke-width="3"/>
      <g stroke-width="3">
        <path d="M-131 0H131"/>
        <path d="M-131 0H131" transform="rotate(30)"/>
        <path d="M-131 0H131" transform="rotate(60)"/>
        <path d="M-131 0H131" transform="rotate(90)"/>
        <path d="M-131 0H131" transform="rotate(120)"/>
        <path d="M-131 0H131" transform="rotate(150)"/>
      </g>
      <circle r="17" fill="#fff" stroke-width="8"/>
    </g>
  </defs>

  <!-- The shelves rise around a narrow strip of ceiling. -->
  <rect width="1000" height="1000" fill="#fff"/>
  <use href="#left-shelf"/>
  <use href="#left-shelf" transform="translate(1000 0) scale(-1 1)"/>

  <g fill="none" stroke="#090909" stroke-linecap="round">
    <path d="M443 0 469 165M557 0 531 165" stroke-width="5"/>
    <path d="M412 0 462 165M588 0 538 165" stroke-width="2"/>
    <path d="M500 0V108" stroke-width="7"/>
  </g>

  <!-- One hard point light; yellow appears nowhere else. -->
  <g stroke="#090909" stroke-linejoin="round">
    <path d="M456 120 544 120 523 166H477Z" fill="#090909" stroke-width="8"/>
    <path d="M478 167Q500 180 522 167" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="500" cy="184" r="17" fill="#f4df32" stroke-width="6"/>
  </g>
  <g stroke="#f4df32" stroke-width="5" stroke-linecap="square">
    <path d="M500 210v22M468 198l-17 15M532 198l17 15
             M462 178l-22-3M538 178l22-3"/>
  </g>
  <g fill="none" stroke="#090909" stroke-width="3" opacity=".75">
    <path d="M478 225 391 394M522 225 618 389
             M457 240 328 484M543 240 704 478"/>
  </g>

  <!-- Wheels and bicycle, seen from below. -->
  <g transform="rotate(-5 505 710)">
    <use href="#wheel" x="304" y="712"/>
    <use href="#wheel" x="704" y="712"/>

    <g fill="none" stroke="#090909" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M304 712 454 518 502 712 304 712
               M454 518 624 525 502 712
               M624 525 704 712
               M454 518 502 712"
            stroke-width="19"/>
      <path d="M304 712 454 518 502 712 304 712
               M454 518 624 525 502 712
               M624 525 704 712"
            stroke="#fff" stroke-width="4"/>
      <path d="M432 499h62M621 525l36-111 68-15
               M700 394l36 24" stroke-width="16"/>
      <path d="M492 712h64m-54 0-18 65h-46" stroke-width="13"/>
      <circle cx="502" cy="712" r="27" fill="#fff" stroke-width="12"/>
    </g>
    <path d="M447 738h58" stroke="#090909" stroke-width="13"
          stroke-linecap="round"/>
  </g>

  <!-- Pelican tail, body, neck, and outrageous bill. -->
  <g stroke="#090909" stroke-linecap="round" stroke-linejoin="round">
    <path d="M379 442 293 405 332 456 275 455 358 491Z"
          fill="#090909" stroke-width="9"/>
    <path d="M365 399Q437 366 506 402Q554 430 538 487
             Q519 542 461 550Q389 550 348 492Q331 455 365 399Z"
          fill="#fff" stroke-width="13"/>
    <path d="M495 441Q552 428 549 370Q547 332 576 306
             Q602 286 618 313Q631 335 612 357"
          fill="none" stroke-width="59"/>
    <path d="M495 441Q552 428 549 370Q547 332 576 306
             Q602 286 618 313Q631 335 612 357"
          fill="none" stroke="#fff" stroke-width="41"/>

    <path d="M593 303Q618 281 646 309Q662 331 644 358
             Q622 379 594 360Q576 340 593 303Z"
          fill="#fff" stroke-width="11"/>

    <path d="M636 343Q704 368 825 380Q791 461 697 460
             Q649 454 636 343Z"
          fill="#fff" stroke-width="11"/>
    <path d="M637 345Q733 345 858 381L865 396
             Q744 406 640 365Z"
          fill="#090909" stroke-width="10"/>
    <path d="M654 382Q740 422 815 400" fill="none" stroke-width="5"/>

    <path d="M584 301 576 279 597 291 600 270 612 298"
          fill="#090909" stroke-width="6"/>
    <circle cx="624" cy="323" r="15" fill="#090909" stroke-width="3"/>
    <circle cx="629" cy="318" r="4" fill="#fff" stroke="none"/>
    <path d="M602 304Q626 291 643 303" fill="none" stroke-width="6"/>

    <path d="M377 422Q432 404 493 432Q487 495 426 507
             Q385 489 377 422Z"
          fill="#090909" stroke-width="8"/>
    <g fill="none" stroke="#fff" stroke-width="5">
      <path d="M391 439Q426 452 474 436"/>
      <path d="M397 457Q430 472 473 457"/>
      <path d="M411 476Q437 490 466 475"/>
    </g>

    <!-- Feet clutch the pedals, with a little comic swagger. -->
    <path d="M455 518Q465 558 491 594L519 621
             M508 618l32 9m-28-7 18 23m-25-25 3 28"
          fill="none" stroke-width="16"/>
    <path d="M383 508Q364 561 419 600L451 619
             M449 618l29-2m-28 3 19 18m-26-20 3 25"
          fill="none" stroke-width="14"/>
  </g>

  <!-- Stark motion marks make the quiet aisle feel less quiet. -->
  <g fill="none" stroke="#090909" stroke-linecap="round">
    <path d="M109 686 190 677M103 709l75-4M813 585l79-31
             M837 610l64-16M415 862l-46 49M591 868l51 42"
          stroke-width="8"/>
    <path d="M151 474l49 23M843 479l43-34" stroke-width="5"/>
  </g>
</svg>