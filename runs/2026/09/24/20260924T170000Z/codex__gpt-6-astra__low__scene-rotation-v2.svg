    <ellipse cx="363" cy="871" rx="16" ry="23" fill="#000"/>
    <path d="M249 737l13 8M229 780l15 5M220 830l16 2M222 884l15-1
             M231 935l15-4M250 981l14-7M282 1022l11-10"
          stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Pelican: round belly overhead, enormous pouch, and an unrepentant grin. -->
  <g stroke="#000" stroke-linejoin="round" stroke-linecap="round">
    <path d="M504 549q47 15 75 81l-52-15-19 25-20-57z"
          fill="#000" stroke-width="6"/>
    <path d="M469 588q46 39 40 83l-52 65-4 61-34 12
             4-82 46-67-31-48z"
          fill="#fff" stroke-width="7"/>
    <path d="M419 788l-31 21q-12 10 4 13l72-8-13-22z"
          fill="#000" stroke-width="5"/>
    <path d="M536 564q43 17 47 64l-38 59-17 46-30 6
             16-64 28-48-30-29z"
          fill="#fff" stroke-width="6"/>
    <path d="M504 725l-24 16 60-2 17-16-23-5z" fill="#000" stroke-width="5"/>

    <path d="M444 389q-53 31-63 91-16 86 67 145
             35 25 83-2 53-29 48-86-4-56-55-94
             l-35-49z"
          fill="#fff" stroke-width="8"/>
    <path d="M410 454q-32 61 2 114 38 61 97 36
             -48-7-62-60-16-53 9-105z" fill="#000" stroke-width="3"/>
    <path d="M452 442q59 11 73 63l-67 83q-13 8-19-4
             l21-49-25 27q-12 9-15-3l26-48-19 19q-11 6-12-5
             8-47 37-83z"
          fill="#fff" stroke-width="6"/>
    <path d="M466 476l-23 49M482 490l-29 59" fill="none" stroke-width="3"/>

    <!-- Forward wing reaches and grasps the handlebar. -->
    <path d="M420 432q-52 33-63 91l-39 56q-22 8-21 27
             7 15 20 7l16-18q13 12 21 0l-1-14 44-48 43-65z"
