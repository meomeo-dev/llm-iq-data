    <path d="M405 328L216 376q76 69 162 21 35-18 39-42z"
          fill="#fff" stroke-width="6"/>
    <path d="M223 376q83 53 153 12" fill="none" stroke-width="3"/>
    <path d="M407 324q-96 4-195 51l-9 13q109-17 211-35z"
          fill="#fff" stroke-width="6"/>
    <path d="M215 376l193-35" fill="none" stroke-width="3"/>
