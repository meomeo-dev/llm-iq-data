  <path d="M0 0l397 198M900 0L503 198M325 0l72 198M574 0l-71 198"
        fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M397 198h106l-53-82z" fill="#000"/>
  <path d="M421 137l29-64 29 64M450 73V0" fill="none" stroke="#000" stroke-width="3"/>

  <!-- Shelf fronts: deliberately exaggerated, vertiginous perspective. -->
  <g fill="#000" stroke="#fff" stroke-width="3">
    <path d="M0 953l270-12 13-74L0 859z"/>
    <path d="M0 732l306 34 11-63L0 642z"/>
    <path d="M0 518l339 68 9-54L0 436z"/>
    <path d="M0 330l366 105 7-44L0 259z"/>
    <path d="M0 173l385 137 5-34L0 114z"/>
    <path d="M900 953l-270-12-13-74 283-8z"/>
    <path d="M900 732l-306 34-11-63 317-61z"/>
    <path d="M900 518l-339 68-9-54 348-96z"/>
    <path d="M900 330L534 435l-7-44 373-132z"/>
    <path d="M900 173L515 310l-5-34 390-162z"/>
  </g>

  <g fill="#080808">
    <use href="#bookRow" transform="matrix(.89 .015 -.02 1.55 0 680)"/>
    <use href="#bookRow" transform="matrix(.99 .19 -.02 1.18 0 502)"/>
    <use href="#bookRow" transform="matrix(1.08 .30 -.02 .91 0 329)"/>
    <use href="#bookRow" transform="matrix(1.17 .41 -.02 .69 0 168)"/>
    <use href="#bookRow" transform="matrix(1.22 .49 -.02 .50 0 58)"/>
    <use href="#bookRow" transform="matrix(-.89 .015 .02 1.55 900 680)"/>
    <use href="#bookRow" transform="matrix(-.99 .19 .02 1.18 900 502)"/>
    <use href="#bookRow" transform="matrix(-1.08 .30 .02 .91 900 329)"/>
    <use href="#bookRow" transform="matrix(-1.17 .41 .02 .69 900 168)"/>
    <use href="#bookRow" transform="matrix(-1.22 .49 .02 .50 900 58)"/>
  </g>
  <g fill="none" stroke="#fff">
    <path d="M68 1100L397 198M190 1100l207-902M832 1100L503 198M710 1100L503 198" stroke-width="5"/>
    <path d="M0 1030l257-9M900 1030l-257-9" stroke-width="3"/>
  </g>

