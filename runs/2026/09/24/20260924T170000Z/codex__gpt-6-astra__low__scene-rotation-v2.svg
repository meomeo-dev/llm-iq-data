    <path d="M366 871l72-204 130-17-77 125z" fill="none" stroke-width="15"/>
    <path d="M438 667l53 108-125 96M491 775l-7-151" fill="none" stroke-width="12"/>
    <path d="M464 619l66-12q15 2 8 13l-69 13z" fill="#000"/>
    <path d="M366 871l-49-214 20-58" fill="none" stroke-width="14"/>
    <path d="M329 617l-43-22-28 19M330 617l65-33 28 13"
