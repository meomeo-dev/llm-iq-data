    <ellipse cx="438" cy="319" rx="19" ry="23" fill="#fff" stroke-width="4"/>
    <ellipse cx="431" cy="325" rx="6" ry="10" fill="#000" stroke="none"/>
    <path d="M419 305l31 8" fill="none" stroke-width="7"/>
    <path d="M454 342q10 3 15-5" fill="none" stroke-width="3"/>
  </g>

  <!-- Loose pages, a flying book, and comic motion in the confined aisle. -->
  <g fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round">
    <path d="M625 412l58-23 30 41-56 31-24-5z"/>
    <path d="M657 461l-11-41 37-31M646 420l-21-8" fill="none"/>
    <path d="M634 416l5 32M652 423l38-22M657 432l38-22" fill="none" stroke-width="2"/>
