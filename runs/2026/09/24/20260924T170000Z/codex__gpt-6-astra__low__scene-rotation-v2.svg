    <path d="M486 457q-20-42-6-82 17-43-9-74
             -28-32-62-14-32 17-29 49 2 20 26 37
             20 14 12 42l-12 31q37 31 80 11z"
          fill="#fff" stroke-width="7"/>
    <path d="M416 382q21 28-1 65l29 9q-5-37 6-63" fill="#000" stroke-width="3"/>

