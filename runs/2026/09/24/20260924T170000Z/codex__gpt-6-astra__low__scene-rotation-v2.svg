    <ellipse cx="568" cy="650" rx="83" ry="154" transform="rotate(-24 568 650)"
             fill="#fff" stroke-width="16"/>
    <ellipse cx="568" cy="650" rx="69" ry="139" transform="rotate(-24 568 650)"
