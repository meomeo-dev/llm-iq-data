<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">The Library Lane Bandit</title>
  <desc id="desc">A mischievous pelican rides a bicycle over the viewer in a narrow library aisle. Towering black and white bookshelves converge overhead. A single lemon-yellow desk lamp throws a hard wedge of light across the bird and bicycle.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M2 3h1M11 12h1" stroke="#000" stroke-width="0.65" opacity=".15"/>
    </pattern>
    <pattern id="hatching" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 0v9" stroke="#fff" stroke-width="1"/>
    </pattern>
    <g id="bookRow" stroke="#fff" stroke-width="1.7">
      <path d="M0 0v110h26V0zM30 5v105h19V5zM54 0v110h34V0z
               M94 10v100h16V10zM115 0v110h28V0zM149 4v106h20V4z
               M175 0v110h36V0zM218 12v98h22V12zM246 0v110h24V0z
               M277 6v104h36V6z"/>
      <path d="M4 16h18M4 23h18M4 91h18M59 19h24M59 26h24
               M120 83h18M120 90h18M181 16h24M181 22h24
               M251 88h14M282 15h26M282 21h26"/>
      <path d="M39 25v50M102 33v46M158 23v40M229 39v35M295 40v29"/>
    </g>
  </defs>

