  <path d="M754 327L211 640l619 323z" fill="#fff" opacity=".94"/>
  <path d="M865 478h-118l18-17h72z" fill="#fff" stroke="#000" stroke-width="5"/>
  <path d="M805 460l37-83-69-52" fill="none" stroke="#fff" stroke-width="12"/>
  <path d="M805 460l37-83-69-52" fill="none" stroke="#000" stroke-width="5"/>
