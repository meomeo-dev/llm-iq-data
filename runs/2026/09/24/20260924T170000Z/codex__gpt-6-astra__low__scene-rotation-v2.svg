    <path d="M534 916q19 60-9 115M550 945q8 36-4 65"/>
    <path d="M177 867q-9-55 8-95M161 837q-2-30 8-53"/>
    <path d="M604 540l14-27M617 551l18-19"/>
  </g>
  <g transform="translate(83 594) rotate(12)">
    <path d="M0 0h102v47H0z" fill="#fff" stroke="#000" stroke-width="4"/>
    <text x="51" y="30" text-anchor="middle" font-family="monospace"
          font-size="21" font-weight="bold" fill="#000">SHHH!</text>
  </g>
  <path d="M29 1067h135M736 1067h135" stroke="#fff" stroke-width="3"/>
</svg>