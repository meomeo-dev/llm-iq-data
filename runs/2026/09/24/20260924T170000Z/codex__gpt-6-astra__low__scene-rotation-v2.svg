    <path d="M432 817l44-7M510 740l38-6" stroke-width="10" stroke-linecap="round"/>
    <path d="M486 749l81-112M498 801l84-137" fill="none" stroke-width="3"/>
  </g>

  <!-- The huge elliptical front tire looms almost directly above the reader. -->
  <g transform="rotate(14 363 871)">
    <ellipse cx="363" cy="871" rx="143" ry="213" fill="#fff" stroke="#000" stroke-width="25"/>
    <ellipse cx="363" cy="871" rx="125" ry="195" fill="none" stroke="#000" stroke-width="3"/>
    <g stroke="#000" stroke-width="2">
