<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF44F" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFF44F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFF44F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="books" width="40" height="60" patternUnits="userSpaceOnUse">
      <rect width="40" height="60" fill="#111"/>
      <rect x="2" y="4" width="7" height="54" fill="#eee"/>
      <rect x="11" y="10" width="5" height="48" fill="#777"/>
      <rect x="18" y="2" width="9" height="56" fill="#ddd"/>
      <rect x="29" y="14" width="4" height="44" fill="#555"/>
      <rect x="34" y="6" width="5" height="52" fill="#bbb"/>
    </pattern>
  </defs>

  <!-- ceiling / sky slit -->
  <rect width="600" height="800" fill="#000"/>
  <polygon points="250,0 350,0 330,160 270,160" fill="#fff"/>

  <!-- left shelf converging upward -->
  <polygon points="0,0 250,0 270,160 0,800" fill="url(#books)"/>
  <polygon points="0,0 250,0 270,160 0,800" fill="none" stroke="#fff" stroke-width="3"/>
  <g stroke="#fff" stroke-width="4">
    <line x1="0" y1="640" x2="264" y2="128"/>
    <line x1="0" y1="480" x2="259" y2="96"/>
    <line x1="0" y1="330" x2="255" y2="64"/>
    <line x1="0" y1="190" x2="252" y2="32"/>
  </g>
  <!-- right shelf -->
  <polygon points="600,0 350,0 330,160 600,800" fill="url(#books)"/>
  <polygon points="600,0 350,0 330,160 600,800" fill="none" stroke="#fff" stroke-width="3"/>
  <g stroke="#fff" stroke-width="4">
    <line x1="600" y1="640" x2="336" y2="128"/>
    <line x1="600" y1="480" x2="341" y2="96"/>
    <line x1="600" y1="330" x2="345" y2="64"/>
    <line x1="600" y1="190" x2="348" y2="32"/>
  </g>

  <!-- hard shadows cast from lamp -->
  <polygon points="130,560 300,330 600,120 600,300" fill="#000" opacity="0.55"/>

  <!-- plank bridging the shelves, seen from below -->
  <polygon points="150,300 450,300 470,330 130,330" fill="#fff" stroke="#000" stroke-width="3"/>

  <!-- pelican on bicycle, underside view -->
  <g stroke="#000" stroke-width="4" fill="none">
    <circle cx="220" cy="300" r="48" fill="#fff"/>
    <circle cx="380" cy="300" r="48" fill="#fff"/>
    <g stroke-width="2">
      <line x1="220" y1="252" x2="220" y2="348"/><line x1="172" y1="300" x2="268" y2="300"/>
      <line x1="380" y1="252" x2="380" y2="348"/><line x1="332" y1="300" x2="428" y2="300"/>
    </g>
    <polyline points="220,300 290,300 360,250 380,300"/>
    <line x1="290" y1="300" x2="270" y2="245"/>
    <line x1="360" y1="250" x2="370" y2="225"/>
  </g>
  <!-- body -->
  <ellipse cx="285" cy="215" rx="70" ry="45" fill="#fff" stroke="#000" stroke-width="4"/>
  <!-- wing flailing -->
  <path d="M250,200 Q190,130 150,150 Q200,170 235,225 Z" fill="#fff" stroke="#000" stroke-width="4"/>
  <!-- feet on pedals -->
  <path d="M275,255 L290,300 M300,255 L300,290" stroke="#000" stroke-width="5"/>
  <!-- neck and head -->
  <path d="M330,195 Q370,150 360,120" stroke="#000" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M330,195 Q370,150 360,120" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="360" cy="115" r="20" fill="#fff" stroke="#000" stroke-width="4"/>
  <circle cx="366" cy="110" r="5" fill="#000"/>
  <circle cx="368" cy="108" r="1.5" fill="#fff"/>
  <!-- bill and yellow pouch, stuffed with a stolen book -->
  <path d="M375,112 L470,128 L378,124 Z" fill="#fff" stroke="#000" stroke-width="3"/>
  <path d="M378,124 Q430,175 468,130 Z" fill="#FFF44F" stroke="#000" stroke-width="3"/>
  <rect x="410" y="132" width="26" height="16" fill="#000" transform="rotate(-10 423 140)"/>
  <!-- mischievous grin line -->
  <path d="M372,122 q6,5 12,0" stroke="#000" stroke-width="2" fill="none"/>

  <!-- falling books -->
  <g stroke="#fff" stroke-width="2">
    <rect x="120" y="420" width="30" height="42" fill="#000" transform="rotate(25 135 441)"/>
    <rect x="440" y="470" width="24" height="36" fill="#000" transform="rotate(-35 452 488)"/>
  </g>

  <!-- desk lamp, hard point light at bottom foreground -->
  <circle cx="300" cy="660" r="190" fill="url(#glow)"/>
  <polygon points="300,650 230,400 370,400" fill="#FFF44F" opacity="0.25"/>
  <g stroke="#fff" stroke-width="6" fill="#000">
    <line x1="300" y1="800" x2="300" y2="720"/>
    <path d="M255,720 L345,720 L325,670 L275,670 Z"/>
  </g>
  <circle cx="300" cy="660" r="16" fill="#FFF44F" stroke="#000" stroke-width="3"/>

  <!-- comic motion lines -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="260" x2="160" y2="260"/>
    <line x1="110" y1="290" x2="165" y2="290"/>
    <line x1="125" y1="320" x2="160" y2="320"/>
  </g>
  <text x="490" y="90" font-family="sans-serif" font-size="34" font-weight="bold" fill="#fff" transform="rotate(12 490 90)">SHH!</text>
</svg>