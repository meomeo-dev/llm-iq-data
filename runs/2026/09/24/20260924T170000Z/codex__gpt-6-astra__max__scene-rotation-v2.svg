<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200"
     viewBox="0 0 1000 1200" role="img" aria-labelledby="title description">
  <title id="title">A Very Quiet Getaway</title>
  <desc id="description">
    A mischievous pelican bicycles directly over the viewer in a narrow library
    aisle. Towering bookshelves converge overhead. Foreshortened wheels, webbed
    soles, and the underside of the bird emphasize the worm's-eye viewpoint.
    One articulated desk lamp casts hard shadows. Its lemon-yellow opening is
    the only color in an otherwise black-and-white ink illustration.
  </desc>

