  <title id="title">The Quietest Getaway (最安静的逃跑)</title>
  <desc id="description">
    A mischievous pelican rides a bicycle beneath towering library shelves,
    seen from directly below. One desk lamp casts a hard lemon-yellow beam.
  </desc>

