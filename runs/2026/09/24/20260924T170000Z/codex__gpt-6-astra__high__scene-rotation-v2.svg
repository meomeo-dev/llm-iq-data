<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Quiet, Please</title>
  <desc id="desc">A mischievous pelican rides a bicycle overhead in a narrow library aisle, viewed from floor level looking up. Towering black-and-white bookshelves converge around the ceiling. A single desk lamp with a lemon-yellow opening throws a hard wedge of light across the scene.</desc>

  <defs>
    <pattern id="hatching" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M-3 3L3-3M0 12L12 0M9 15L15 9" fill="none" stroke="#fff" stroke-width="1.5"/>
    </pattern>

    <pattern id="bookSpines" width="91" height="140" patternUnits="userSpaceOnUse">
      <rect width="91" height="140" fill="#000"/>
      <g stroke="#fff" fill="none">
        <rect x="4" y="7" width="19" height="128" stroke-width="2"/>
        <path d="M8 20H19M8 25H19M8 113H19M8 119H19"/>
        <rect x="28" y="18" width="12" height="117" stroke-width="2"/>
        <path d="M33 32V100"/>
        <path d="M47 135V3H70V135" stroke-width="3"/>
        <path d="M51 14H66M51 21H66M51 112H66M51 122H66" stroke-width="2"/>
        <path d="M77 135L72 29L84 28L89 135" stroke-width="2"/>
      </g>
      <rect x="51" y="44" width="15" height="37" fill="#fff"/>
      <path d="M56 49V76M61 49V66" stroke="#000" stroke-width="2"/>
    </pattern>

    <clipPath id="leftStack">
