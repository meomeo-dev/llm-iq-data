      <ellipse rx="87" ry="141" fill="#fff"/>
      <ellipse rx="79" ry="132" fill="#000"/>
      <g stroke="#fff" stroke-width="2">
        <path d="M0-132V132M-79 0H79M-57-93L57 93M57-93L-57 93"/>
        <path d="M-31-121L31 121M31-121L-31 121M-73-51L73 51M73-51L-73 51"/>
      </g>
      <ellipse rx="16" ry="22" fill="#fff" stroke="#000" stroke-width="5"/>
      <ellipse rx="5" ry="8" fill="#000"/>
      <path d="M-31-147C21-159 68-121 87-66" fill="none" stroke="#fff" stroke-width="3"/>
