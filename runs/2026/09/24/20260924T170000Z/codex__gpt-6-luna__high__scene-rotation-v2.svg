<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Great Library Getaway</title>
  <desc id="desc">A mischievous pelican pedals a bicycle high above the viewer in a towering library aisle. A single desk lamp casts a sharp beam; lemon yellow accents its shade.</desc>

  <defs>
    <clipPath id="leftWall">
      <path d="M0 0 344 112 330 1100 0 1200Z"/>
    </clipPath>
    <clipPath id="rightWall">
      <path d="M900 0 556 112 570 1100 900 1200Z"/>
    </clipPath>
    <pattern id="bookRows" width="112" height="118" patternUnits="userSpaceOnUse">
      <path d="M0 116H112" stroke="#fff" stroke-width="8"/>
      <path d="M8 18 31 13 34 107 10 109Z" fill="#fff"/>
      <path d="M38 9 69 17 65 108 38 104Z" fill="#fff"/>
      <path d="M75 20 104 14 108 106 77 109Z" fill="#fff"/>
      <path d="M13 34H29M42 35H64M81 38H103M12 94H31M42 91H63M81 95H104"
            stroke="#000" stroke-width="4"/>
      <path d="M20 25V101M52 25V100M91 27V101"
            stroke="#000" stroke-width="2"/>
    </pattern>
    <pattern id="smallBooks" width="78" height="92" patternUnits="userSpaceOnUse">
      <path d="M0 90H78" stroke="#fff" stroke-width="7"/>
      <path d="M6 13 28 9 31 82 8 84ZM35 18 53 12 56 83 36 81ZM61 10 73 15 72 84 60 82Z"
            fill="#fff"/>
      <path d="M10 28H28M39 31H52M63 30H72"
            stroke="#000" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="900" height="1200" fill="#000"/>

  <!-- Shelves rise toward the vanishing point above the aisle. -->
  <path d="M0 0 344 112 330 1100 0 1200Z" fill="#111"/>
  <g clip-path="url(#leftWall)">
    <path d="M-20 20 322 126 312 1080 -20 1180Z" fill="url(#bookRows)"/>
    <path d="M-18 20 320 126M-15 256 318 350M-12 494 315 574M-8 732 312 800M-4 968 309 1030"
          fill="none" stroke="#fff" stroke-width="15"/>
    <path d="M0 0 344 112 330 1100" fill="none" stroke="#000" stroke-width="20"/>
  </g>
  <path d="M900 0 556 112 570 1100 900 1200Z" fill="#111"/>
  <g clip-path="url(#rightWall)">
    <path d="M920 20 578 126 588 1080 920 1180Z" fill="url(#bookRows)"/>
    <path d="M918 20 580 126M915 256 582 350M912 494 585 574M908 732 588 800M904 968 591 1030"
          fill="none" stroke="#fff" stroke-width="15"/>
    <path d="M900 0 556 112 570 1100" fill="none" stroke="#000" stroke-width="20"/>
  </g>

  <!-- One desk lamp: a crisp pool of light in the dark shaft. -->
  <path d="M450 70 314 442H586Z" fill="#fff"/>
  <path d="M450 70 368 426H532Z" fill="#f4f4f4"/>
  <path d="M450 28V67M450 28 492 53 477 75" fill="none" stroke="#fff" stroke-width="12"/>
  <path d="M412 66 488 66 515 112 385 112Z" fill="#fff" stroke="#000" stroke-width="10"/>
  <path d="M421 75 479 75 495 101 405 101Z" fill="#f4df38"/>

  <!-- Fast, foreshortened bicycle wheels. -->
  <g fill="none" stroke="#fff" stroke-width="15">
    <circle cx="300" cy="786" r="143"/>
    <circle cx="640" cy="786" r="143"/>
  </g>
  <g fill="none" stroke="#777" stroke-width="4">
    <circle cx="300" cy="786" r="128"/>
    <circle cx="640" cy="786" r="128"/>
    <path d="M300 643V929M157 786H443M199 685 401 887M199 887 401 685"/>
    <path d="M640 643V929M497 786H783M539 685 741 887M539 887 741 685"/>
  </g>
  <g fill="#fff" stroke="#000" stroke-width="7">
    <circle cx="300" cy="786" r="14"/>
    <circle cx="640" cy="786" r="14"/>
  </g>

  <!-- Frame, handlebars, pedals, and a conspicuously jaunty rider. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="m300 786 149-112 191 112-171 5-20-117 111 1"
          stroke-width="17"/>
    <path d="m449 674-23-64h-51m244 181 48-95h55" stroke-width="14"/>
    <path d="m410 679-35-8m342 25 42 8" stroke-width="13"/>
    <path d="m438 795-47 54m78-57 48 43" stroke-width="11"/>
  </g>
  <path d="m380 613 64-9" stroke="#fff" stroke-width="19" stroke-linecap="round"/>
  <path d="m658 755 50 12" stroke="#fff" stroke-width="17" stroke-linecap="round"/>

  <!-- Pelican body and wings, outlined for bold comic-book contrast. -->
  <path d="M381 581Q362 510 422 465Q482 422 546 471Q590 505 565 568
           Q535 624 451 620Z"
        fill="#fff" stroke="#000" stroke-width="15"/>
  <path d="M405 554Q457 493 545 492Q515 565 434 590Z"
        fill="#111" stroke="#000" stroke-width="9"/>
  <path d="M423 523Q464 474 520 472" fill="none" stroke="#fff" stroke-width="8"/>
  <path d="M466 600Q496 631 528 607L548 630Q511 663 461 638Z"
        fill="#fff" stroke="#000" stroke-width="10"/>

  <!-- Long neck, ridiculous head, and oversized bill. -->
  <path d="M475 478Q465 421 493 362Q509 327 541 315L569 343
           Q526 375 527 433L548 487Z"
        fill="#fff" stroke="#000" stroke-width="13"/>
  <path d="M523 347Q518 296 560 277Q606 255 642 286
           Q674 314 656 351Q637 386 590 375L558 360Z"
        fill="#fff" stroke="#000" stroke-width="12"/>
  <path d="M625 331Q696 320 756 347Q709 379 642 366Z"
        fill="#fff" stroke="#000" stroke-width="11"/>
  <path d="M643 367Q696 371 739 351Q714 404 657 395Q632 389 625 374Z"
        fill="#111" stroke="#000" stroke-width="8"/>
  <circle cx="628" cy="310" r="8" fill="#000"/>
  <path d="M608 296q15-15 30-1" fill="none" stroke="#000" stroke-width="6"
        stroke-linecap="round"/>

  <!-- Feet on pedals and a little airborne library chaos. -->
  <path d="M476 627Q455 661 428 669M518 625Q544 649 569 650"
        fill="none" stroke="#000" stroke-width="13" stroke-linecap="round"/>
  <path d="m413 667 29 5m126-24 28 8" fill="none" stroke="#fff" stroke-width="12"
        stroke-linecap="round"/>
  <path d="m230 494 31-22m-46 72 38-6m435-72 34 20m-7 56 37 5"
        fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <path d="m744 478 34-23 26 31-34 22Z" fill="#fff" stroke="#000" stroke-width="7"/>
  <path d="m752 478 27 29" stroke="#000" stroke-width="4"/>
  <path d="m161 557 31-20 22 28-34 22Z" fill="#fff" stroke="#000" stroke-width="7"/>
  <path d="m172 558 26 28" stroke="#000" stroke-width="4"/>

  <path d="M334 1000Q450 1031 566 1000" fill="none" stroke="#fff" stroke-width="5"
        stroke-dasharray="8 18"/>
</svg>