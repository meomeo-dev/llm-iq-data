<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5E642" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F5E642" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5E642" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shelfL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="shelfR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="ceilingFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8e8"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="800"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- ceiling far above, the sliver of sky between the shelves -->
    <rect width="800" height="800" fill="#0a0a0a"/>
    <polygon points="250,0 550,0 430,400 370,400" fill="url(#ceilingFade)"/>

    <!-- left tower of shelving, converging upward -->
    <polygon points="0,800 0,0 250,0 370,400" fill="url(#shelfL)"/>
    <polygon points="0,800 0,0 250,0 370,400" fill="none" stroke="#000" stroke-width="3"/>
    <!-- shelf ledges left (perspective lines to vanishing point ~ 400,400) -->
    <g stroke="#111" stroke-width="10" stroke-linecap="round">
      <line x1="0" y1="740" x2="380" y2="405"/>
      <line x1="0" y1="600" x2="380" y2="403"/>
      <line x1="0" y1="450" x2="378" y2="401"/>
      <line x1="0" y1="300" x2="376" y2="399"/>
      <line x1="0" y1="150" x2="374" y2="398"/>
      <line x1="40" y1="0" x2="372" y2="397"/>
    </g>
    <!-- book spines left: chunky blocks between ledges -->
    <g fill="#1c1c1c" stroke="#000" stroke-width="2">
      <polygon points="0,700 0,640 120,600 130,640"/>
      <polygon points="0,640 0,610 95,580 120,600"/>
      <polygon points="130,640 120,600 200,560 215,590"/>
      <polygon points="215,590 200,560 260,520 270,545"/>
      <polygon points="0,560 0,500 110,480 120,505"/>
      <polygon points="120,505 110,480 210,470 220,490"/>
      <polygon points="0,410 0,340 130,380 140,410"/>
      <polygon points="140,410 130,380 220,405 230,420"/>
      <polygon points="0,260 0,200 130,300 145,330"/>
      <polygon points="145,330 130,300 210,340 225,360"/>
      <polygon points="0,110 0,40 120,200 140,230"/>
      <polygon points="140,230 120,200 210,290 230,310"/>
    </g>
    <!-- white paper edges catching lamp light on the left side -->
    <g fill="#f2f2f2">
      <polygon points="118,600 122,606 200,560 196,556"/>
      <polygon points="110,478 112,484 210,468 208,462"/>
      <polygon points="0,338 130,378 128,384 0,346"/>
      <polygon points="130,298 134,304 210,338 208,332"/>
      <polygon points="120,198 124,204 210,288 206,282"/>
    </g>

    <!-- right tower of shelving -->
    <polygon points="800,800 800,0 550,0 430,400" fill="url(#shelfR)"/>
    <polygon points="800,800 800,0 550,0 430,400" fill="none" stroke="#000" stroke-width="3"/>
    <g stroke="#111" stroke-width="10" stroke-linecap="round">
      <line x1="800" y1="740" x2="420" y2="405"/>
      <line x1="800" y1="600" x2="420" y2="403"/>
      <line x1="800" y1="450" x2="422" y2="401"/>
      <line x1="800" y1="300" x2="424" y2="399"/>
      <line x1="800" y1="150" x2="426" y2="398"/>
      <line x1="760" y1="0" x2="428" y2="397"/>
    </g>
    <g fill="#141414" stroke="#000" stroke-width="2">
      <polygon points="800,700 800,640 680,600 670,640"/>
      <polygon points="670,640 680,600 600,560 585,590"/>
      <polygon points="585,590 600,560 540,520 530,545"/>
      <polygon points="800,560 800,500 690,480 680,505"/>
      <polygon points="680,505 690,480 590,470 580,490"/>
      <polygon points="800,410 800,340 670,380 660,410"/>
      <polygon points="660,410 670,380 580,405 570,420"/>
      <polygon points="800,260 800,200 670,300 655,330"/>
      <polygon points="655,330 670,300 590,340 575,360"/>
      <polygon points="800,110 800,40 680,200 660,230"/>
      <polygon points="660,230 680,200 590,290 570,310"/>
    </g>
    <!-- right side is farther from the lamp: only faint edges -->
    <g fill="#8a8a8a">
      <polygon points="682,600 678,606 600,560 604,556"/>
      <polygon points="690,478 688,484 590,468 592,462"/>
      <polygon points="680,198 676,204 590,288 594,282"/>
    </g>

    <!-- hard shadows thrown by the lamp across the far right shelves -->
    <polygon points="800,470 800,560 560,455 520,430" fill="#000" opacity="0.55"/>
    <polygon points="800,620 800,700 640,600 600,560" fill="#000" opacity="0.5"/>

    <!-- the desk lamp clamped to the left shelf: single hard light -->
    <circle cx="150" cy="520" r="260" fill="url(#lampGlow)"/>
    <g stroke="#000" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="30" y1="640" x2="95" y2="585"/>
      <line x1="95" y1="585" x2="150" y2="540"/>
    </g>
    <rect x="18" y="628" width="34" height="26" rx="4" fill="#000"/>
    <polygon points="150,540 118,500 165,470 200,505" fill="#000"/>
    <polygon points="150,540 200,505 165,470" fill="#F5E642"/>
    <circle cx="176" cy="500" r="9" fill="#ffffff"/>
    <!-- light cone shooting up the aisle -->
    <polygon points="150,540 200,505 395,405 405,405" fill="#F5E642" opacity="0.22"/>

    <!-- a plank bridging the aisle far overhead, seen from beneath -->
    <polygon points="285,262 515,262 505,300 295,300" fill="#111" stroke="#000" stroke-width="3"/>
    <line x1="290" y1="281" x2="510" y2="281" stroke="#333" stroke-width="2"/>

    <!-- hard shadow of pelican+bike falling onto the plank and up the right shelf -->
    <ellipse cx="470" cy="286" rx="80" ry="12" fill="#000" opacity="0.6"/>

    <!-- THE BICYCLE, from below: two wheels, underside of frame -->
    <g transform="translate(400,270)">
      <!-- rear wheel (nearer to lamp so brighter rim) -->
      <g transform="translate(-95,0)">
        <ellipse cx="0" cy="0" rx="62" ry="14" fill="none" stroke="#f4f4f4" stroke-width="6"/>
        <ellipse cx="0" cy="0" rx="62" ry="14" fill="none" stroke="#000" stroke-width="2"/>
        <g stroke="#dcdcdc" stroke-width="2">
          <line x1="-60" y1="-3" x2="60" y2="3"/>
          <line x1="-52" y1="6" x2="52" y2="-6"/>
          <line x1="-40" y1="10" x2="40" y2="-10"/>
          <line x1="-20" y1="13" x2="20" y2="-13"/>
          <line x1="0" y1="-14" x2="0" y2="14"/>
        </g>
        <circle cx="0" cy="0" r="7" fill="#000"/>
      </g>
      <!-- front wheel turned in a comic wobble -->
      <g transform="translate(100,0) rotate(-14)">
        <ellipse cx="0" cy="0" rx="62" ry="16" fill="none" stroke="#bfbfbf" stroke-width="6"/>
        <ellipse cx="0" cy="0" rx="62" ry="16" fill="none" stroke="#000" stroke-width="2"/>
        <g stroke="#9c9c9c" stroke-width="2">
          <line x1="-60" y1="-4" x2="60" y2="4"/>
          <line x1="-50" y1="8" x2="50" y2="-8"/>
          <line x1="-36" y1="12" x2="36" y2="-12"/>
          <line x1="-16" y1="15" x2="16" y2="-15"/>
          <line x1="0" y1="-16" x2="0" y2="16"/>
        </g>
        <circle cx="0" cy="0" r="7" fill="#000"/>
      </g>
      <!-- frame underside -->
      <g stroke="#000" stroke-width="9" stroke-linecap="round" fill="none">
        <line x1="-95" y1="0" x2="-20" y2="-40"/>
        <line x1="-20" y1="-40" x2="60" y2="-42"/>
        <line x1="60" y1="-42" x2="100" y2="0"/>
        <line x1="-20" y1="-40" x2="10" y2="-6"/>
        <line x1="10" y1="-6" x2="60" y2="-42"/>
        <line x1="-95" y1="0" x2="10" y2="-6"/>
      </g>
      <!-- pedals + crank -->
      <circle cx="10" cy="-6" r="14" fill="#000"/>
      <circle cx="10" cy="-6" r="14" fill="none" stroke="#f4f4f4" stroke-width="2"/>
      <line x1="10" y1="-6" x2="46" y2="12" stroke="#000" stroke-width="6"/>
      <rect x="40" y="6" width="22" height="9" rx="3" fill="#F5E642" stroke="#000" stroke-width="2"/>
      <line x1="10" y1="-6" x2="-26" y2="-24" stroke="#000" stroke-width="6"/>
      <rect x="-40" y="-30" width="22" height="9" rx="3" fill="#F5E642" stroke="#000" stroke-width="2"/>
    </g>

    <!-- THE PELICAN, viewed from underneath, leaning over the handlebars to peer down at us -->
    <g transform="translate(410,150)">
      <!-- webbed feet planted on pedals: big, orange-less, white with black outline -->
      <g fill="#f4f4f4" stroke="#000" stroke-width="3">
        <polygon points="-40,90 -70,118 -52,120 -36,108 -26,124 -14,120 -18,104 -2,112 4,100 -24,84"/>
        <polygon points="70,86 42,116 60,118 74,106 84,122 96,118 92,102 108,110 114,98 88,82"/>
      </g>
      <!-- legs -->
      <g stroke="#000" stroke-width="6" stroke-linecap="round">
        <line x1="-24" y1="86" x2="-10" y2="50"/>
        <line x1="88" y1="84" x2="66" y2="50"/>
      </g>
      <!-- belly / body: lit from below-left, so left side bright, right dark -->
      <ellipse cx="30" cy="20" rx="92" ry="56" fill="#f4f4f4" stroke="#000" stroke-width="4"/>
      <path d="M 30 -36 A 92 56 0 0 1 122 20 A 92 56 0 0 1 30 76 Z" fill="#1a1a1a" opacity="0.8"/>
      <!-- wings gripping the handlebars, tips splayed -->
      <path d="M -60 8 C -120 -10 -140 -50 -110 -80 C -95 -60 -80 -50 -60 -40 Z" fill="#f4f4f4" stroke="#000" stroke-width="4"/>
      <path d="M 120 8 C 180 -10 200 -50 170 -80 C 155 -60 140 -50 120 -40 Z" fill="#0f0f0f" stroke="#000" stroke-width="4"/>
      <!-- handlebar underside -->
      <line x1="-120" y1="-72" x2="180" y2="-72" stroke="#000" stroke-width="8" stroke-linecap="round"/>
      <rect x="-134" y="-80" width="30" height="16" rx="6" fill="#f4f4f4" stroke="#000" stroke-width="3"/>
      <rect x="164" y="-80" width="30" height="16" rx="6" fill="#0f0f0f" stroke="#000" stroke-width="3"/>
      <!-- neck curving down toward the viewer -->
      <path d="M 30 -30 C 20 -70 60 -100 50 -130" fill="none" stroke="#000" stroke-width="30" stroke-linecap="round"/>
      <path d="M 30 -30 C 20 -70 60 -100 50 -130" fill="none" stroke="#f4f4f4" stroke-width="22" stroke-linecap="round"/>
      <!-- head, looking straight down at us -->
      <ellipse cx="50" cy="-150" rx="40" ry="32" fill="#f4f4f4" stroke="#000" stroke-width="4"/>
      <!-- eyes: one squinting, one wide - mischief -->
      <circle cx="30" cy="-158" r="9" fill="#000"/>
      <circle cx="33" cy="-161" r="3" fill="#fff"/>
      <path d="M 62 -160 Q 74 -166 84 -158" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
      <!-- eyebrows raised, cheeky -->
      <path d="M 18 -176 Q 30 -186 44 -178" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 58 -180 Q 74 -190 90 -176" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <!-- the enormous beak thrust downward, pouch hanging full of stolen books -->
      <path d="M 14 -136 L 60 -30 L 100 -136 Z" fill="#f4f4f4" stroke="#000" stroke-width="4"/>
      <path d="M 14 -136 L 60 -30 L 100 -136 Q 60 -122 14 -136 Z" fill="none" stroke="#000" stroke-width="4"/>
      <path d="M 26 -130 Q 60 -40 96 -130 Q 60 -100 26 -130 Z" fill="#111"/>
      <!-- book poking out of the pouch: lemon-yellow accent -->
      <g transform="translate(60,-70) rotate(20)">
        <rect x="-18" y="-24" width="36" height="48" fill="#F5E642" stroke="#000" stroke-width="3"/>
        <line x1="-10" y1="-14" x2="10" y2="-14" stroke="#000" stroke-width="2"/>
        <line x1="-10" y1="-4" x2="10" y2="-4" stroke="#000" stroke-width="2"/>
        <line x1="-10" y1="6" x2="4" y2="6" stroke="#000" stroke-width="2"/>
      </g>
      <!-- beak tip highlight from the lamp -->
      <path d="M 20 -132 L 44 -80" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- a couple of loose pages fluttering down toward the camera -->
    <g fill="#f4f4f4" stroke="#000" stroke-width="2">
      <polygon points="560,120 610,100 620,140 570,160"/>
      <polygon points="210,110 250,90 262,126 222,148"/>
      <polygon points="600,330 640,318 650,352 610,362"/>
    </g>
    <g stroke="#000" stroke-width="1.5">
      <line x1="572" y1="122" x2="606" y2="110"/>
      <line x1="578" y1="136" x2="612" y2="124"/>
      <line x1="222" y1="112" x2="248" y2="100"/>
      <line x1="228" y1="126" x2="254" y2="114"/>
    </g>

    <!-- a tiny "SHHH" sign on the far shelf, ignored -->
    <g transform="translate(680,90) rotate(-54)">
      <rect x="-28" y="-12" width="56" height="24" fill="#f4f4f4" stroke="#000" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">SHHH</text>
    </g>

    <!-- heavy vignette to push the aisle into deep shadow around the edges -->
    <rect width="800" height="800" fill="none" stroke="#000" stroke-width="80" opacity="0.6"/>
  </g>
</svg>