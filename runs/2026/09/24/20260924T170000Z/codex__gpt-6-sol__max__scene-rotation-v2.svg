    <path d="M632 227 683 242" stroke-width="5"/>
    <circle cx="652" cy="248" r="12" fill="#f5d600"
            stroke-width="5"/>
    <path d="m608 254-19 8m38 5-10 17m54-23 14 15"
          stroke-width="4"/>
  </g>

  <!-- A book slips from a shelf as the rider passes. -->
  <g transform="translate(172 309) rotate(-24)" stroke="#000"
     stroke-linejoin="round">
    <path d="M0 0h57v75H0z" fill="#000" stroke-width="5"/>
    <path d="M9 5h52v69H9z" fill="#fff" stroke-width="4"/>
    <path d="M19 16h29M19 26h24M19 53h29" fill="none"
          stroke-width="3"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="5"
     stroke-linecap="round">
    <path d="m116 300-26-16m27 40-35-1m64 59-20 20"/>
  </g>

  <!-- The underside of the bicycle fills the foreground. -->
  <use href="#wheel" x="224" y="691"/>
  <use href="#wheel" x="667" y="691"/>

  <g fill="none" stroke="#000" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M224 691 390 500 444 676 224 691
             M390 500 575 488 444 676M575 488 667 691"
