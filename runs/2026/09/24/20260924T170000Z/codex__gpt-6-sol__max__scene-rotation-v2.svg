        fill="#fff" stroke="#000" stroke-width="9"/>
  <path d="M369 400q-60-12-92-67 1 76 73 121
           55 29 111-3-61-4-92-51Z"
        fill="#000" stroke="#000" stroke-width="7"/>
  <g fill="none" stroke="#fff" stroke-width="5"
     stroke-linecap="round">
    <path d="m305 360 59 70m-32-53 62 64m-33-52 61 51"/>
  </g>
  <path d="M342 461q70 41 149 15" fill="none"
        stroke="#000" stroke-width="5" stroke-linecap="round"/>

  <!-- One leg reaches forward; the other presses the opposite pedal. -->
  <g fill="none" stroke="#000" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M382 480 343 572 408 706" stroke-width="23"/>
    <path d="M382 480 343 572 408 706" stroke="#fff"
          stroke-width="11"/>
    <path d="M479 481 524 556 480 642" stroke-width="25"/>
    <path d="M479 481 524 556 480 642" stroke="#fff"
          stroke-width="12"/>
    <path d="m407 706-29 7m30-7 19 13m53-77 27 2m-27-2-19 13"
          stroke-width="10"/>
  </g>

  <path d="M558 237q18-18 38-8 24 10 22 36
