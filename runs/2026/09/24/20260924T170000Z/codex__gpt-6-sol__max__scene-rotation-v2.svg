  <path d="M479 418q58-42 53-99 0-52 42-69"
        fill="none" stroke="#000" stroke-width="53"
        stroke-linecap="round"/>
  <path d="M479 418q58-42 53-99 0-52 42-69"
        fill="none" stroke="#fff" stroke-width="39"
        stroke-linecap="round"/>

  <path d="M331 419q-8-78 95-93 101-11 143 65
