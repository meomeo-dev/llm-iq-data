        fill="#fff" stroke="#000" stroke-width="8"/>
  <path d="M607 265 780 279q15 2 15 13-1 12-19 15
           l-169 5Z" fill="#fff" stroke="#000" stroke-width="7"/>
  <path d="M610 310q29 63 101 58 57-3 70-61
           -57 26-171 3Z" fill="#fff" stroke="#000"
        stroke-width="7" stroke-linejoin="round"/>
  <path d="M633 339q61 36 116-3" fill="none"
        stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <circle cx="589" cy="258" r="13" fill="#000"/>
  <circle cx="593" cy="254" r="4" fill="#fff"/>
  <path d="m565 233 34-12m-31-15 10-21m0 24 20-17"
