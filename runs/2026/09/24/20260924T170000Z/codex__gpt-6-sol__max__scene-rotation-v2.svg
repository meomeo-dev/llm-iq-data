<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900"
     role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle in a library aisle</title>
  <desc id="desc">
    A worm's-eye view between towering bookshelves. A grinning pelican pedals
    overhead beneath the hard light of a single lemon-yellow desk lamp.
  </desc>

  <defs>
    <clipPath id="left-shelf-clip">
      <path d="M0 0H315L350 320 245 900H0Z"/>
    </clipPath>

    <g id="left-shelf">
      <path d="M0 0H315L350 320 245 900H0Z" fill="#000"/>
      <g clip-path="url(#left-shelf-clip)" fill="#fff">
        <path d="M13 12h24l-3 148-23-5zM43 16h12l-1 146-14-3z
                 M61 23h31l-2 146-29-6zM101 29h16l1 144-18-4z
                 M125 35h27l3 145-29-6zM164 42h13l4 143-15-4z
                 M185 49h34l5 144-37-8zM232 57h17l7 143-20-5z
                 M260 65h23l11 144-26-6zM300 74h16l11 144-19-5z"/>
        <path d="M0 242l28 3-1 135-27-2zM37 252l16 2-1 130-17-2z
                 M63 258l32 5-2 129-33-4zM104 267l12 2 2 129-15-2z
                 M125 273l25 4 4 127-29-4zM162 283l38 6 5 123-40-5z
                 M213 296l14 3 6 118-17-3zM238 302l29 5 9 119-33-6z
                 M283 314l18 4 10 113-21-3zM317 324l23 4 2 109-26-4z"/>
        <path d="M0 464h34l-5 187H0zM45 469l17 2-4 184-19-2z
                 M73 475l39 5-2 180-42-5zM123 485l18 3 2 176-21-3z
                 M153 493l30 5 6 171-34-4zM196 503l16 3 8 166-19-2z
                 M226 512l37 7 12 158-42-6zM278 530l17 3 13 149-21-3z
                 M310 541l23 5 9 140-27-4z"/>
        <path d="M0 711h29l-5 189H0zM39 718l17 2-3 180H34z
                 M67 726l39 6-1 168H62zM117 740l16 3 3 157h-20z
                 M145 749l33 6 7 145h-36zM191 761l19 4 9 135h-23z
                 M221 772l35 8 14 120h-40zM269 789l25 6 15 105h-29z"/>
      </g>
      <g clip-path="url(#left-shelf-clip)" fill="none"
         stroke="#000" stroke-width="4">
        <path d="M77 34l-2 124M138 60l3 108M201 66l5 117
                 M15 267l-1 102M77 277l-2 101M179 300l5 98
                 M19 486l-2 145M89 500l-1 136M170 517l5 133
                 M18 743l-3 142M82 754l-2 129M163 776l5 108"/>
      </g>
      <g clip-path="url(#left-shelf-clip)" fill="none"
         stroke="#fff" stroke-linecap="square">
        <path d="M-20 180 339 231M-20 204 342 250
                 M-20 401 344 449M-20 425 339 470
                 M-20 672 291 696M-20 695 285 719"
              stroke-width="9"/>
        <path d="M314 0 349 320 244 900" stroke-width="11"/>
        <path d="M296 0 332 320 227 900" stroke-width="3"/>
      </g>
    </g>

    <g id="wheel" fill="none" stroke="#000">
      <ellipse rx="151" ry="120" fill="#fff" stroke-width="15"/>
      <ellipse rx="135" ry="106" stroke-width="3"/>
      <g stroke-width="3">
        <path d="M-145 0H145M0-116V116
                 M-103-82 103 82M-103 82 103-82
                 M-56-109 56 109M-56 109 56-109
                 M-134-44 134 44M-134 44 134-44"/>
      </g>
      <circle r="16" fill="#fff" stroke-width="7"/>
      <circle r="5" fill="#000" stroke="none"/>
    </g>
  </defs>

  <!-- The shelves and ceiling converge above the viewer. -->
  <path fill="#fff" d="M0 0h900v900H0z"/>
  <g fill="none" stroke="#000" stroke-linecap="square">
    <path d="M324 0 450 171 576 0M349 0 450 171 551 0"
          stroke-width="7"/>
    <path d="M450 0v171M449 171 277 900M451 171 623 900"
          stroke-width="3"/>
    <path d="M387 0 450 171 513 0" stroke-width="2"/>
  </g>

  <use href="#left-shelf"/>
  <use href="#left-shelf" transform="translate(900 0) scale(-1 1)"/>

  <!-- One desk lamp cuts a sharp triangle of light across the aisle. -->
  <path d="M652 248 456 900 704 900Z" fill="#fff"/>
  <path d="M652 248 456 900M652 248 704 900"
        fill="none" stroke="#000" stroke-width="3"/>
  <g fill="none" stroke="#000" stroke-linejoin="round"
