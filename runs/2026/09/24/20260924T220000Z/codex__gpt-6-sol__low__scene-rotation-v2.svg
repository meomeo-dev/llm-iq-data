<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">The pelican’s midnight library ride</title>
  <desc id="desc">A mischievous pelican pedals a bicycle through a towering library aisle, seen from floor level looking upward. A single lemon-yellow desk lamp casts hard light across the black-and-white scene.</desc>
  <defs>
    <clipPath id="leftShelf">
      <path d="M0 0H260L320 540 0 960Z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M460 0H720V960L400 540Z"/>
    </clipPath>
    <pattern id="books" width="76" height="154" patternUnits="userSpaceOnUse">
      <rect width="76" height="154" fill="#fff"/>
      <path d="M0 0V154M76 0V154M0 148H76" stroke="#111" stroke-width="10"/>
      <path d="M12 18V137M30 12V140M51 16V138M64 24V137" stroke="#111" stroke-width="3"/>
      <path d="M16 36h10m-10 9h10m20 60h13m-13 9h13M34 41h12" stroke="#111" stroke-width="2"/>
      <path d="M10 134h58" stroke="#111" stroke-width="4"/>
    </pattern>
  </defs>

  <!-- The shelves lean inward toward the patch of ceiling overhead. -->
  <rect width="720" height="960" fill="#111"/>
  <path d="M260 0H460L400 540H320Z" fill="#fff"/>
  <path d="M275 0 327 530M445 0 393 530M360 0v520" fill="none" stroke="#111" stroke-width="5"/>
  <path d="M0 0H260L320 540 0 960Z" fill="url(#books)"/>
  <path d="M460 0H720V960L400 540Z" fill="url(#books)"/>
  <g clip-path="url(#leftShelf)" stroke="#111" fill="none">
    <path d="M0 125 274 98M0 285l287-68M0 480l301-151M0 716l316-266" stroke-width="17"/>
    <path d="M34 0 70 888M133 0l60 711M224 0l66 566" stroke-width="9"/>
  </g>
  <g clip-path="url(#rightShelf)" stroke="#111" fill="none">
    <path d="m446 98 274 27M433 217l287 68M419 329l301 151M404 450l316 266" stroke-width="17"/>
    <path d="M686 0 650 888M587 0l-60 711M496 0l-66 566" stroke-width="9"/>
  </g>

  <!-- A single lamp throws a sharp triangular beam into the aisle. -->
  <path d="M626 420 390 574 155 852 662 741Z" fill="#fff"/>
  <path d="M626 420 390 574 155 852" fill="none" stroke="#111" stroke-width="5"/>
  <path d="M720 355 655 405M648 400l-30 12" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <path d="M613 400 674 438 631 474 588 445Z" fill="#111" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="628" cy="451" rx="24" ry="10" transform="rotate(31 628 451)" fill="#f5df36"/>
  <path d="m606 472-16 20m51-6 12 24m-32-33-2 28" stroke="#f5df36" stroke-width="4" stroke-linecap="round"/>

  <!-- Crisp floor-level shadows exaggerate the upward viewpoint. -->
  <path d="M0 960 320 540h80l320 420Z" fill="#fff"/>
  <path d="M0 960 320 540h80l320 420M70 960l265-420M650 960 385 540" fill="none" stroke="#111" stroke-width="8"/>
  <path d="M118 920 410 684 630 960Z" fill="#111"/>

  <!-- Bicycle wheels swell toward the viewer. -->
  <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="223" cy="752" rx="112" ry="148" transform="rotate(-17 223 752)" stroke-width="17"/>
    <ellipse cx="525" cy="779" rx="130" ry="164" transform="rotate(16 525 779)" stroke-width="19"/>
    <path d="M118 744h207M139 680l168 154M166 626l114 249M213 605l18 295M265 607l-79 284M309 662 141 847
             M402 773h249M420 704l218 151M461 648l136 280M517 615l17 325M574 632l-99 291M622 700 429 871"
          stroke-width="2.5"/>
    <path d="M223 752 355 642 525 779 346 795 223 752 326 582 355 642 346 795"
          stroke-width="14"/>
    <path d="M525 779 474 608 431 569M455 566h-72M326 582l-24-42m-28-5h85" stroke-width="13"/>
    <path d="M346 795v50m-37 0h74" stroke-width="12"/>
  </g>
  <circle cx="223" cy="752" r="13" fill="#111"/>
  <circle cx="525" cy="779" r="15" fill="#111"/>
  <circle cx="355" cy="642" r="11" fill="#111"/>

  <!-- The rider reaches for the bars with an ill-advised grin. -->
  <path d="M320 444q-64-37-85 10-17 37 35 74l46 28 44-45Z" fill="#fff" stroke="#111" stroke-width="10"/>
  <path d="M261 466q-24 3-38 25l-23 47 26 12 38-42" fill="#fff" stroke="#111" stroke-width="9"/>
  <path d="M213 533q-25-5-35 12l31 23 24-16" fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M350 509q69-28 105 34l-6 31-73 3-48-36" fill="#fff" stroke="#111" stroke-width="10"/>
  <path d="M430 549q20 13 16 29l-18 9-22-22" fill="#fff" stroke="#111" stroke-width="7"/>
  <path d="M344 550q-2 53-18 87m49-83 28 70-48 42" fill="none" stroke="#111" stroke-width="18" stroke-linecap="round"/>

  <!-- White wing and pouch are outlined like a comic-book silhouette. -->
  <path d="M309 425q-31-77 17-119 34-29 73-4 27 19 19 64l-20 71q-9 55-70 72-67 10-84-54 21 18 45 10-31-17-38-47 29 18 58 7Z"
        fill="#fff" stroke="#111" stroke-width="10" stroke-linejoin="round"/>
  <path d="M362 357q42-31 66 1 9 13 4 33l-47 78q-39 33-91 7 53 6 70-35Z"
        fill="#fff" stroke="#111" stroke-width="9"/>
  <path d="M416 369q70-5 125 30-66 8-122 9Z" fill="#fff" stroke="#111" stroke-width="9" stroke-linejoin="round"/>
  <path d="M425 410q55 13 89-2-29 57-92 45l-35-23Z" fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M435 419q36 12 60 1" fill="none" stroke="#111" stroke-width="5"/>
  <ellipse cx="395" cy="342" rx="13" ry="17" fill="#111"/>
  <circle cx="399" cy="337" r="4" fill="#fff"/>
  <path d="m365 319 45-9m-78-12-15-32m35 28 2-39" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <path d="m292 470 24-17m-12 35 28-17" stroke="#111" stroke-width="6" stroke-linecap="round"/>

  <!-- A startled book slips from above. -->
  <path d="m113 282 58-21 39 73-57 23Z" fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="m125 288 40 55m-27-61 41 54" stroke="#111" stroke-width="3"/>
  <path d="m193 372 9 16m-46-10-15 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</svg>