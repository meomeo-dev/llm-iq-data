<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 1200"
     role="img"
     aria-labelledby="title description">
  <title id="title">The library getaway</title>
  <desc id="description">
    A mischievous pelican pedals a bicycle through a narrow library aisle,
    seen from far below. Towering bookshelves converge overhead. A single
    lemon-yellow desk lamp casts sharp rays through the black-and-white scene.
  </desc>

  <defs>
    <clipPath id="shelf-clip">
      <path d="M0 0H448L305 1200H0Z"/>
    </clipPath>

    <g id="book-cluster" fill="none" stroke="#fff" stroke-width="2">
      <path d="M3 150V13H22V150
               M26 150V26H48V150
               M52 150V7H67V150
               M71 150V19H96V150
               M100 150V10H117V150"/>
      <path d="M7 49H18M7 58H18M30 108H44M55 42H64
               M75 52H92M75 61H92M103 119H114"/>
    </g>

    <g id="book-row">
      <use href="#book-cluster" x="0"/>
      <use href="#book-cluster" x="120"/>
      <use href="#book-cluster" x="240"/>
      <use href="#book-cluster" x="360"/>
    </g>

    <g id="shelf">
      <path d="M0 0H448L305 1200H0Z"
            fill="#080808" stroke="#fff" stroke-width="5"/>
      <g clip-path="url(#shelf-clip)">
        <use href="#book-row" transform="translate(0 24) scale(1 .72)"/>
        <use href="#book-row" transform="translate(0 174) scale(1 .88)"/>
        <use href="#book-row" transform="translate(0 333) scale(1 1.1)"/>
        <use href="#book-row" transform="translate(0 538) scale(1 1.4)"/>
        <use href="#book-row" transform="translate(0 784) scale(1 1.65)"/>
        <use href="#book-row" transform="translate(0 1061) scale(1 1.8)"/>
        <path d="M0 151H435M0 318H415M0 520H390
                 M0 770H360M0 1050H323"
              fill="none" stroke="#fff" stroke-width="12"/>
        <path d="M64 0L34 1200M255 0L173 1200"
              fill="none" stroke="#fff" stroke-width="3"/>
      </g>
      <path d="M448 0L305 1200"
            fill="none" stroke="#fff" stroke-width="8"/>
    </g>

    <g id="spokes" fill="none" stroke="#fff" stroke-width="2">
      <path d="M0-135V135M-135 0H135
               M-95-95L95 95M95-95L-95 95
               M-52-125L52 125M52-125L-52 125
               M-125-52L125 52M125-52L-125 52"/>
    </g>
  </defs>

  <!-- The ceiling and shelves rush toward a point high above the viewer. -->
  <rect width="1000" height="1200" fill="#080808"/>
  <path d="M448 0H552L695 1200H305Z"
        fill="#080808" stroke="#fff" stroke-width="4"/>
  <g fill="none" stroke="#fff">
    <path d="M500 0V1200" stroke-width="2"/>
    <path d="M430 150H570M408 340H592M385 540H615
             M354 800H646M326 1060H674"
          stroke-width="5"/>
    <path d="M475 0L410 1200M525 0L590 1200" stroke-width="2"/>
  </g>

  <!-- Straight-edged rays mark the desk lamp as the one light source. -->
  <g fill="none" stroke="#fff" stroke-width="2">
    <path d="M431 299L112 1200M431 299L297 1200
             M431 299L658 1200M431 299L956 1200"/>
  </g>

  <use href="#shelf"/>
  <use href="#shelf" transform="translate(1000 0) scale(-1 1)"/>

  <g transform="rotate(-4 831 195)">
    <rect x="747" y="163" width="168" height="65"
          fill="#080808" stroke="#fff" stroke-width="4"/>
    <text x="831" y="207" fill="#fff" text-anchor="middle"
          font-family="monospace" font-size="25" font-weight="bold">
      SILENCE
    </text>
  </g>

  <!-- A clamped, articulated desk lamp hangs over the aisle. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M101 190L251 111L355 190"
          fill="none" stroke="#080808" stroke-width="21"/>
    <path d="M101 190L251 111L355 190"
          fill="none" stroke="#fff" stroke-width="10"/>
    <path d="M79 173H129V213H79Z"
          fill="#080808" stroke="#fff" stroke-width="5"/>
    <circle cx="251" cy="111" r="16"
            fill="#080808" stroke="#fff" stroke-width="5"/>
    <circle cx="355" cy="190" r="15"
            fill="#080808" stroke="#fff" stroke-width="5"/>
    <path d="M352 189L399 207L449 274L398 297Z"
          fill="#080808" stroke="#fff" stroke-width="6"/>
    <path d="M398 297Q425 310 449 274"
          fill="none" stroke="#fff" stroke-width="6"/>
    <circle cx="431" cy="299" r="15"
            fill="#f4e64b" stroke="#080808" stroke-width="4"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="3">
    <path d="M432 256V239M474 278L488 267M467 322L480 335
             M402 330L388 345M387 269L373 258"/>
  </g>

  <!-- The wheels loom large from the floor-level viewpoint. -->
  <g transform="translate(270 863)">
    <circle r="150" fill="#080808" stroke="#fff" stroke-width="16"/>
    <circle r="136" fill="none" stroke="#fff" stroke-width="2"/>
    <use href="#spokes" transform="rotate(9)"/>
    <circle r="15" fill="#080808" stroke="#fff" stroke-width="5"/>
  </g>
  <g transform="translate(760 802)">
    <circle r="174" fill="#080808" stroke="#fff" stroke-width="18"/>
    <circle r="155" fill="none" stroke="#fff" stroke-width="2"/>
    <use href="#spokes" transform="rotate(-7) scale(1.13)"/>
    <circle r="16" fill="#080808" stroke="#fff" stroke-width="5"/>
  </g>

  <!-- Bicycle frame, saddle, bars, and pedals. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 863L430 620L500 821L270 863
             M430 620L646 617L500 821
             M646 617L703 740L760 802"
          stroke="#080808" stroke-width="25"/>
    <path d="M270 863L430 620L500 821L270 863
             M430 620L646 617L500 821
             M646 617L703 740L760 802"
          stroke="#fff" stroke-width="13"/>
    <path d="M646 617L686 552L738 552Q764 554 756 582"
          stroke="#080808" stroke-width="22"/>
    <path d="M646 617L686 552L738 552Q764 554 756 582"
          stroke="#fff" stroke-width="11"/>
    <path d="M500 821L540 778M500 821L461 866"
          stroke="#fff" stroke-width="10"/>
    <path d="M522 778H558M443 866H480"
          stroke="#fff" stroke-width="8"/>
  </g>
  <circle cx="500" cy="821" r="19"
          fill="#080808" stroke="#fff" stroke-width="6"/>
  <path d="M377 607Q410 583 468 595L460 615Q420 625 377 607Z"
        fill="#080808" stroke="#fff" stroke-width="5"/>
  <circle cx="725" cy="548" r="13"
          fill="#080808" stroke="#fff" stroke-width="4"/>

  <!-- Long legs plant both webbed feet on the pedals. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M444 604L458 692L536 777
             M402 611L418 770L460 863"
          stroke="#080808" stroke-width="30"/>
    <path d="M444 604L458 692L536 777
             M402 611L418 770L460 863"
          stroke="#fff" stroke-width="17"/>
  </g>
  <path d="M519 774L543 769L558 781M444 860L464 853L480 867"
        fill="none" stroke="#080808" stroke-width="5"
        stroke-linecap="round"/>

  <!-- White body, folded black wing, crooked neck, and sly expression. -->
  <path d="M478 491C524 456 540 405 535 359L586 374
           C588 447 558 520 530 557Z"
        fill="#fff" stroke="#080808" stroke-width="9"/>
  <path d="M321 534C332 470 404 431 476 447
           C532 459 559 513 541 570
           C523 632 435 665 366 625
           C326 602 309 568 321 534Z"
        fill="#fff" stroke="#080808" stroke-width="9"/>
  <path d="M344 510C399 482 470 497 520 536
           C495 580 446 609 386 599
           C356 584 340 549 344 510Z"
        fill="#080808" stroke="#fff" stroke-width="5"/>
  <g fill="none" stroke="#fff" stroke-width="4"
     stroke-linecap="round">
    <path d="M370 540Q429 519 489 549"/>
    <path d="M376 563Q432 546 474 568"/>
    <path d="M393 582Q430 571 453 581"/>
  </g>
  <path d="M536 360C540 322 564 301 598 304
           C632 308 650 336 639 367
           C630 391 608 401 584 390
           C559 381 541 379 536 360Z"
        fill="#fff" stroke="#080808" stroke-width="9"/>
  <path d="M560 310L550 287L575 298L581 278L596 304"
        fill="#fff" stroke="#080808" stroke-width="6"
        stroke-linejoin="round"/>

  <!-- The pouch swings beneath an absurdly long bill. -->
  <path d="M625 381C677 443 768 501 901 403
           C866 472 786 521 705 488
           C662 471 638 424 625 381Z"
        fill="#fff" stroke="#080808" stroke-width="8"/>
  <path d="M626 360C721 353 825 360 907 380
           Q931 386 924 402Q920 411 900 408
           C794 402 707 397 623 389Z"
        fill="#fff" stroke="#080808" stroke-width="8"/>
  <path d="M900 405Q922 426 894 442"
        fill="none" stroke="#080808" stroke-width="8"
        stroke-linecap="round"/>
  <path d="M645 387Q736 413 854 406"
        fill="none" stroke="#080808" stroke-width="4"/>
  <ellipse cx="603" cy="344" rx="18" ry="22"
           fill="#fff" stroke="#080808" stroke-width="5"/>
  <ellipse cx="610" cy="347" rx="7" ry="11" fill="#080808"/>
  <path d="M584 319Q605 306 625 319"
        fill="none" stroke="#080808" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Pages and motion marks break the library's solemn order. -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M97 803Q63 782 48 747M88 839L33 832
             M919 698Q957 672 970 630
             M943 738L987 726"
          stroke-width="5"/>
    <path d="M690 157L729 142L749 177L706 190Z
             M706 190L718 164L749 177"
          stroke-width="3"/>
    <path d="M808 263L847 247L866 282L823 295Z
             M823 295L833 269L866 282"
          stroke-width="3"/>
  </g>
</svg>