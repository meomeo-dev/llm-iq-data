<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5E642"/>
      <stop offset="0.25" stop-color="#F5E642" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F5E642" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="aisle">
      <polygon points="0,0 800,0 800,800 0,800"/>
    </clipPath>
  </defs>

  <!-- ceiling: deep black -->
  <rect width="800" height="800" fill="#0a0a0a"/>

  <!-- lamp glow: the one hard light source, hanging off the right shelf -->
  <circle cx="560" cy="330" r="360" fill="url(#lamp)"/>

  <!-- LEFT shelf tower converging to vanishing point (400,330) -->
  <g stroke="#ffffff" stroke-width="3" fill="#111">
    <polygon points="0,0 0,800 300,420 300,240"/>
    <!-- shelf planks receding -->
    <line x1="0" y1="80" x2="300" y2="260"/>
    <line x1="0" y1="200" x2="300" y2="290"/>
    <line x1="0" y1="330" x2="300" y2="330"/>
    <line x1="0" y1="470" x2="300" y2="370"/>
    <line x1="0" y1="620" x2="300" y2="400"/>
    <line x1="0" y1="760" x2="300" y2="420"/>
  </g>
  <!-- left book spines (perspective slats) -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.85">
    <line x1="30" y1="60" x2="60" y2="200"/>
    <line x1="80" y1="100" x2="100" y2="215"/>
    <line x1="140" y1="145" x2="150" y2="235"/>
    <line x1="200" y1="185" x2="205" y2="250"/>
    <line x1="250" y1="220" x2="252" y2="262"/>
    <line x1="30" y1="340" x2="40" y2="450"/>
    <line x1="90" y1="340" x2="95" y2="425"/>
    <line x1="150" y1="340" x2="152" y2="405"/>
    <line x1="210" y1="335" x2="212" y2="390"/>
    <line x1="260" y1="333" x2="262" y2="378"/>
    <line x1="40" y1="650" x2="30" y2="760"/>
    <line x1="110" y1="590" x2="100" y2="700"/>
    <line x1="180" y1="540" x2="175" y2="620"/>
    <line x1="240" y1="500" x2="235" y2="560"/>
  </g>

  <!-- RIGHT shelf tower -->
  <g stroke="#ffffff" stroke-width="3" fill="#161616">
    <polygon points="800,0 800,800 500,420 500,240"/>
    <line x1="800" y1="80" x2="500" y2="260"/>
    <line x1="800" y1="200" x2="500" y2="290"/>
    <line x1="800" y1="330" x2="500" y2="330"/>
    <line x1="800" y1="470" x2="500" y2="370"/>
    <line x1="800" y1="620" x2="500" y2="400"/>
    <line x1="800" y1="760" x2="500" y2="420"/>
  </g>
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.9">
    <line x1="770" y1="60" x2="740" y2="200"/>
    <line x1="720" y1="100" x2="700" y2="215"/>
    <line x1="660" y1="145" x2="650" y2="235"/>
    <line x1="600" y1="185" x2="595" y2="250"/>
    <line x1="550" y1="220" x2="548" y2="262"/>
    <line x1="770" y1="340" x2="760" y2="450"/>
    <line x1="710" y1="340" x2="705" y2="425"/>
    <line x1="650" y1="340" x2="648" y2="405"/>
    <line x1="590" y1="335" x2="588" y2="390"/>
    <line x1="540" y1="333" x2="538" y2="378"/>
    <line x1="760" y1="650" x2="770" y2="760"/>
    <line x1="690" y1="590" x2="700" y2="700"/>
    <line x1="620" y1="540" x2="625" y2="620"/>
    <line x1="560" y1="500" x2="565" y2="560"/>
  </g>

  <!-- distant ceiling slit between shelves -->
  <rect x="300" y="240" width="200" height="180" fill="#1c1c1c" stroke="#fff" stroke-width="2"/>
  <line x1="300" y1="330" x2="500" y2="330" stroke="#fff" stroke-width="1" opacity="0.5"/>

  <!-- desk lamp clamped to right shelf, aiming into the aisle -->
  <g stroke="#ffffff" stroke-width="4" fill="#0a0a0a" stroke-linecap="round">
    <line x1="700" y1="470" x2="620" y2="400"/>
    <line x1="620" y1="400" x2="590" y2="350"/>
    <polygon points="575,335 615,365 555,375 540,340" fill="#000"/>
    <ellipse cx="560" cy="345" rx="26" ry="14" fill="#F5E642" stroke="#F5E642"/>
  </g>

  <!-- a plank laid across the aisle, seen from below -->
  <polygon points="150,560 650,560 620,620 180,620" fill="#000" stroke="#fff" stroke-width="3"/>
  <line x1="165" y1="590" x2="635" y2="590" stroke="#fff" stroke-width="1" opacity="0.4"/>

  <!-- bicycle underside: wheels, frame, pedals — hard-lit from the right -->
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
    <ellipse cx="290" cy="590" rx="70" ry="22"/>
    <ellipse cx="530" cy="590" rx="70" ry="22"/>
    <!-- spokes -->
    <g stroke-width="1.5" opacity="0.8">
      <line x1="220" y1="590" x2="360" y2="590"/><line x1="290" y1="568" x2="290" y2="612"/>
      <line x1="240" y1="575" x2="340" y2="605"/><line x1="240" y1="605" x2="340" y2="575"/>
      <line x1="460" y1="590" x2="600" y2="590"/><line x1="530" y1="568" x2="530" y2="612"/>
      <line x1="480" y1="575" x2="580" y2="605"/><line x1="480" y1="605" x2="580" y2="575"/>
    </g>
    <!-- frame triangle foreshortened -->
    <polyline points="290,590 380,520 470,590"/>
    <line x1="380" y1="520" x2="400" y2="570"/>
    <line x1="340" y1="560" x2="400" y2="570"/>
    <!-- crank and pedals -->
    <circle cx="400" cy="572" r="12" fill="#000"/>
    <line x1="400" y1="572" x2="430" y2="545"/>
    <line x1="400" y1="572" x2="370" y2="600"/>
    <rect x="422" y="538" width="20" height="9" fill="#F5E642" stroke="none"/>
    <rect x="358" y="596" width="20" height="9" fill="#000" stroke="#fff"/>
    <!-- handlebars -->
    <line x1="470" y1="590" x2="500" y2="530"/>
    <line x1="460" y1="520" x2="540" y2="520"/>
  </g>

  <!-- PELICAN, belly-up view from below, leaning over to peer at the viewer -->
  <g stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- body (white belly, lit side right) -->
    <ellipse cx="385" cy="470" rx="95" ry="60" fill="#ffffff"/>
    <path d="M385 410 A95 60 0 0 1 480 470 L385 470 Z" fill="#e8e8e8" stroke="none"/>
    <!-- webbed feet on pedals -->
    <path d="M430 545 l-14 -20 l-10 22 l-6 -20 l-6 20 z" fill="#F5E642"/>
    <path d="M372 600 l-14 -22 l-10 24 l-6 -22 l-6 22 z" fill="#F5E642"/>
    <!-- legs -->
    <line x1="410" y1="520" x2="425" y2="545" stroke="#F5E642"/>
    <line x1="370" y1="525" x2="365" y2="595" stroke="#F5E642"/>
    <!-- wings gripping handlebars -->
    <path d="M440 470 Q500 480 500 525" fill="none"/>
    <path d="M330 470 Q300 490 320 520 Q350 500 355 480 Z" fill="#fff"/>
    <!-- neck curling down toward viewer -->
    <path d="M300 460 Q240 430 250 380 Q265 350 300 355" fill="#fff"/>
    <!-- head -->
    <circle cx="315" cy="345" r="38" fill="#fff"/>
    <!-- eye: mischievous side-glance -->
    <circle cx="325" cy="335" r="9" fill="#fff"/>
    <circle cx="329" cy="337" r="4.5" fill="#000" stroke="none"/>
    <path d="M312 322 L340 330" stroke-width="3"/>
    <!-- huge beak with pouch, lit lemon on the lamp side -->
    <path d="M345 350 L470 380 L350 372 Z" fill="#F5E642"/>
    <path d="M345 352 L470 380 Q400 430 350 372 Z" fill="#000"/>
    <line x1="350" y1="358" x2="465" y2="380" stroke="#fff" stroke-width="2"/>
    <!-- sly grin line -->
    <path d="M355 368 Q400 385 455 380" fill="none" stroke="#F5E642" stroke-width="2"/>
    <!-- a stolen book poking out of the pouch -->
    <rect x="392" y="392" width="34" height="14" fill="#fff" transform="rotate(20 409 399)"/>
  </g>

  <!-- a few books tumbling off the shelf, mid-air -->
  <g fill="#000" stroke="#fff" stroke-width="2">
    <rect x="130" y="440" width="34" height="20" transform="rotate(-30 147 450)"/>
    <rect x="640" y="640" width="30" height="18" transform="rotate(25 655 649)"/>
    <rect x="210" y="690" width="26" height="16" transform="rotate(60 223 698)"/>
  </g>

  <!-- hard light rim: lamp-side edge highlights -->
  <g stroke="#F5E642" stroke-width="2" fill="none" opacity="0.9">
    <path d="M478 470 A95 60 0 0 0 400 412"/>
    <path d="M598 590 A70 22 0 0 0 530 568"/>
  </g>

  <!-- hard shadows cast on the ceiling by the pelican and plank -->
  <g fill="#000" opacity="0.7">
    <polygon points="120,100 330,130 300,230 100,210"/>
    <ellipse cx="200" cy="470" rx="60" ry="30"/>
  </g>
</svg>