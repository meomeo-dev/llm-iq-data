<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle through a library</title>
  <desc id="desc">A mischievous pelican pedals above the viewer in a towering library aisle. A single desk lamp casts a sharp lemon-yellow beam.</desc>

