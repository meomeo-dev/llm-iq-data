<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Librarian</title>
  <desc id="desc">A mischievous pelican rides a bicycle high above the viewer in a towering library aisle, lit by one lemon-yellow desk lamp.</desc>

  <rect width="900" height="900" fill="#050505"/>

  <!-- Shelves rise from the floor-level viewpoint and converge overhead. -->
  <g fill="none" stroke="#f5f2e9" stroke-width="5" stroke-linejoin="round">
    <path d="M0 0h205L438 357v543H0z"/>
    <path d="M900 0H695L462 357v543h438z"/>
    <path d="M0 0l438 357M900 0L462 357"/>
    <path d="M0 165h313M0 330h420M0 500h438M0 670h438"/>
    <path d="M900 165H587M900 330H480M900 500H462M900 670H462"/>
  </g>

  <!-- Book spines, packed tightly along the converging shelves. -->
  <g fill="#050505" stroke="#f5f2e9" stroke-width="2.5">
    <path d="M18 16h32v128H18zM59 16h41v128H59zM109 16h29v128h-29zM147 16h43v128h-43z"/>
    <path d="M22 180h39v127H22zM69 180h29v127H69zM107 180h45v127h-45zM161 180h40v127h-40zM211 180h42v127h-42zM263 180h40v127h-40z"/>
    <path d="M22 344h42v127H22zM73 344h31v127H73zM113 344h48v127h-48zM171 344h36v127h-36zM216 344h36v127h-36zM262 344h39v127h-39zM310 344h36v127h-36zM355 344h42v127h-42z"/>
    <path d="M22 514h38v126H22zM68 514h46v126H68zM123 514h30v126h-30zM162 514h48v126h-48zM220 514h39v126h-39zM267 514h46v126h-46zM322 514h43v126h-43zM373 514h47v126h-47z"/>
    <path d="M22 684h44v124H22zM74 684h32v124H74zM114 684h43v124h-43zM166 684h32v124h-32zM207 684h43v124h-43zM259 684h39v124h-39zM306 684h42v124h-42zM356 684h63v124h-63z"/>
    <path d="M850 16h32v128h-32zM800 16h42v128h-42zM762 16h30v128h-30zM710 16h44v128h-44z"/>
    <path d="M839 180h39v127h-39zM802 180h29v127h-29zM747 180h45v127h-45zM699 180h40v127h-40zM646 180h42v127h-42zM597 180h40v127h-40z"/>
    <path d="M836 344h42v127h-42zM796 344h31v127h-31zM739 344h48v127h-48zM693 344h36v127h-36zM648 344h36v127h-36zM595 344h39v127h-39zM552 344h36v127h-36zM503 344h42v127h-42z"/>
    <path d="M840 514h38v126h-38zM786 514h46v126h-46zM747 514h30v126h-30zM690 514h48v126h-48zM641 514h39v126h-39zM585 514h46v126h-46zM535 514h43v126h-43zM480 514h47v126h-47z"/>
    <path d="M834 684h44v124h-44zM794 684h32v124h-32zM743 684h43v124h-43zM702 684h32v124h-32zM650 684h43v124h-43zM603 684h39v124h-39zM554 684h42v124h-42zM480 684h63v124h-63z"/>
  </g>

  <!-- Shelf details and spine labels. -->
  <g fill="none" stroke="#f5f2e9" stroke-width="2" opacity=".75">
    <path d="M29 43h12m-12 8h19M68 43h20m-20 8h13M119 43h9m-9 8h13M157 43h23m-23 8h16"/>
    <path d="M34 208h15m-15 8h23M116 208h22m-22 8h14M178 208h19m-19 8h14M224 208h20m-20 8h14"/>
    <path d="M34 372h20m-20 8h13M122 372h28m-28 8h18M180 372h17m-17 8h11M319 372h22m-22 8h14"/>
    <path d="M858 43h12m-12 8h19M811 43h20m-20 8h13M772 43h9m-9 8h13M720 43h23m-23 8h16"/>
    <path d="M851 208h15m-15 8h23M759 208h22m-22 8h14M705 208h19m-19 8h14M654 208h20m-20 8h14"/>
    <path d="M851 372h20m-20 8h13M748 372h28m-28 8h18M698 372h17m-17 8h11M559 372h22m-22 8h14"/>
  </g>

  <!-- One desk lamp: a crisp point of lemon-yellow light. -->
  <g stroke="#f5f2e9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M498 92l-18 60 29 8 20-60"/>
    <path d="M475 154l-25 22 74 22-15-28"/>
    <path d="M464 181L371 382M507 192l97 190" stroke-width="2.5"/>
  </g>
  <path d="M477 172l35 11-12 17-41-13z" fill="#f2d21b" stroke="#f2d21b" stroke-width="3"/>
  <circle cx="490" cy="185" r="5" fill="#fff9cf"/>

  <!-- Bicycle wheels, seen from directly beneath. -->
  <g fill="none" stroke="#f5f2e9" stroke-linecap="round">
    <circle cx="323" cy="590" r="137" stroke-width="10"/>
    <circle cx="323" cy="590" r="124" stroke-width="2.5"/>
    <circle cx="642" cy="590" r="137" stroke-width="10"/>
    <circle cx="642" cy="590" r="124" stroke-width="2.5"/>
    <g stroke-width="2">
      <path d="M323 466v248M199 590h248M235 502l176 176M235 678l176-176"/>
      <path d="M642 466v248M518 590h248M554 502l176 176M554 678l176-176"/>
    </g>
  </g>

  <!-- Frame and crank. -->
  <g fill="none" stroke="#f5f2e9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M323 590l139-155 70 155H323l100-106"/>
    <path d="M462 435l179 155"/>
    <path d="M452 422l24 9 14-37"/>
    <path d="M642 590l-14-160"/>
    <path d="M613 427l63-5"/>
    <path d="M420 484l-54-25"/>
    <path d="M348 454l-39 9"/>
  </g>
  <circle cx="462" cy="590" r="17" fill="#050505" stroke="#f5f2e9" stroke-width="7"/>
  <path d="M462 590l37 26m-37-26-35-27" fill="none" stroke="#f5f2e9" stroke-width="8" stroke-linecap="round"/>
  <path d="M488 616h30m-117-53h-30" stroke="#f5f2e9" stroke-width="8" stroke-linecap="round"/>

  <!-- Pelican rider, belly-up perspective, with an oversized comic beak. -->
  <g stroke="#050505" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M405 440c-30-28-34-76-15-111 18-33 62-46 97-28 33 17 47 56 31 88-13 26-40 42-70 43l-13 47z" fill="#f5f2e9"/>
    <path d="M489 330c30-16 71-9 92 12 11 11 17 25 14 39-4 22-26 38-58 42l-46 3c19-18 23-42 11-61-6-10-14-20-13-35z" fill="#f5f2e9"/>
    <path d="M536 372c47-7 95 1 136 23 10 5 9 18-2 22-41 15-89 16-134 6-10-2-15-12-12-22l12-29z" fill="#f2d21b"/>
    <path d="M529 411c28-1 56 7 78 22-26 27-65 32-94 13-9-6-12-18-5-27z" fill="#f5f2e9"/>
    <path d="M500 349c11 0 20 9 20 20s-9 20-20 20-20-9-20-20 9-20 20-20z" fill="#050505"/>
    <circle cx="506" cy="357" r="5" fill="#f5f2e9" stroke="none"/>
    <path d="M421 429c19 24 44 34 74 32l-15 31-53-11z" fill="#050505"/>
    <!-- Wing and mischievous little feather fingers on the handlebar. -->
    <path d="M407 374c-22 13-30 37-20 58 10 20 34 27 57 16l29-17-27-43z" fill="#050505"/>
    <path d="M432 405l31 28m-24-43 34 29" fill="none"/>
    <path d="M464 433l-9-20m13 23 8-19" fill="none" stroke-width="6"/>
    <!-- Legs and feet reach the pedals. -->
    <path d="M431 470l-17 57 40 63m51-71 16 54-59 17" fill="none" stroke-width="14"/>
    <path d="M447 585l-32 10m96-17 30 9" fill="none" stroke-width="12"/>
  </g>

  <!-- Ground-level title-card flourish. -->
  <g fill="#f5f2e9" font-family="sans-serif" text-anchor="middle">
    <text x="450" y="845" font-size="20" letter-spacing="7">SHHHH…</text>
    <text x="450" y="875" font-size="12" letter-spacing="4">THE NIGHT SHIFT IS ON WHEELS</text>
  </g>
</svg>