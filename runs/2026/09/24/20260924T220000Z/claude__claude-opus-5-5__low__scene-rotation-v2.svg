<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <pattern id="books" width="22" height="60" patternUnits="userSpaceOnUse">
      <rect width="22" height="60" fill="#111"/>
      <rect x="2" y="4" width="7" height="54" fill="#eee"/>
      <rect x="10" y="10" width="5" height="48" fill="#777"/>
      <rect x="16" y="2" width="5" height="56" fill="#ccc"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- void / darkness -->
  <rect width="600" height="800" fill="#000"/>

  <!-- ceiling sliver at vanishing point -->
  <rect x="250" y="60" width="100" height="140" fill="#222"/>

  <!-- left bookshelf plane converging upward -->
  <polygon points="0,0 250,60 250,200 0,800" fill="url(#books)"/>
  <polygon points="0,0 250,60 250,200 0,800" fill="none" stroke="#fff" stroke-width="3"/>
  <!-- shelf boards left -->
  <g stroke="#fff" stroke-width="4">
    <line x1="0" y1="160" x2="250" y2="95"/>
    <line x1="0" y1="330" x2="250" y2="130"/>
    <line x1="0" y1="500" x2="250" y2="160"/>
    <line x1="0" y1="670" x2="250" y2="185"/>
  </g>

  <!-- right bookshelf plane -->
  <polygon points="600,0 350,60 350,200 600,800" fill="url(#books)"/>
  <polygon points="600,0 350,60 350,200 600,800" fill="none" stroke="#fff" stroke-width="3"/>
  <g stroke="#fff" stroke-width="4">
    <line x1="600" y1="160" x2="350" y2="95"/>
    <line x1="600" y1="330" x2="350" y2="130"/>
    <line x1="600" y1="500" x2="350" y2="160"/>
    <line x1="600" y1="670" x2="350" y2="185"/>
  </g>

  <!-- hard shadow wedge cast by lamp across right shelf -->
  <polygon points="600,330 350,130 350,200 600,800" fill="#000" opacity="0.75"/>

  <!-- desk lamp clamped to left shelf -->
  <g>
    <polygon points="95,470 600,120 600,560" fill="url(#glow)" opacity="0.55"/>
    <rect x="40" y="480" width="50" height="10" fill="#fff"/>
    <line x1="65" y1="480" x2="80" y2="430" stroke="#fff" stroke-width="5"/>
    <line x1="80" y1="430" x2="105" y2="455" stroke="#fff" stroke-width="5"/>
    <polygon points="95,440 125,450 110,480" fill="#fff" stroke="#000" stroke-width="2"/>
    <circle cx="112" cy="465" r="6" fill="#fff" stroke="#000"/>
  </g>

  <!-- plank bridging shelves high above -->
  <rect x="150" y="300" width="300" height="16" fill="#fff" stroke="#000" stroke-width="3"/>
  <rect x="150" y="316" width="300" height="10" fill="#000"/>

  <!-- bicycle (seen from below, riding the plank) -->
  <g stroke="#fff" stroke-width="4" fill="none">
    <circle cx="240" cy="270" r="30"/>
    <circle cx="360" cy="270" r="30"/>
    <polyline points="240,270 285,270 330,235 275,235 285,270"/>
    <line x1="330" y1="235" x2="360" y2="270"/>
    <line x1="330" y1="235" x2="325" y2="215"/>
    <line x1="315" y1="215" x2="338" y2="212"/>
    <line x1="275" y1="235" x2="270" y2="222"/>
    <line x1="260" y1="222" x2="282" y2="222"/>
  </g>
  <g stroke="#fff" stroke-width="1.5">
    <line x1="240" y1="240" x2="240" y2="300"/><line x1="210" y1="270" x2="270" y2="270"/>
    <line x1="360" y1="240" x2="360" y2="300"/><line x1="330" y1="270" x2="390" y2="270"/>
  </g>

  <!-- pelican -->
  <g>
    <!-- body -->
    <ellipse cx="285" cy="195" rx="42" ry="30" fill="#fff" stroke="#000" stroke-width="3"/>
    <!-- wing flung up mischievously -->
    <path d="M270,185 Q230,140 250,120 Q275,160 300,180 Z" fill="#fff" stroke="#000" stroke-width="3"/>
    <!-- legs to pedals -->
    <line x1="280" y1="220" x2="285" y2="270" stroke="#fff" stroke-width="4"/>
    <line x1="295" y1="220" x2="300" y2="255" stroke="#fff" stroke-width="4"/>
    <!-- neck -->
    <path d="M310,180 Q330,150 322,125" stroke="#fff" stroke-width="12" fill="none"/>
    <!-- head -->
    <circle cx="322" cy="118" r="15" fill="#fff" stroke="#000" stroke-width="3"/>
    <circle cx="327" cy="113" r="3.5" fill="#000"/>
    <path d="M321,106 L333,108" stroke="#000" stroke-width="2.5"/>
    <!-- lemon-yellow beak and pouch (the single accent) -->
    <path d="M334,116 L400,128 L334,126 Z" fill="#FFF44F" stroke="#000" stroke-width="2"/>
    <path d="M336,126 Q370,150 398,129 Z" fill="#FFF44F" stroke="#000" stroke-width="2"/>
  </g>

  <!-- books falling toward the viewer -->
  <g stroke="#000" stroke-width="2">
    <rect x="200" y="360" width="40" height="55" fill="#fff" transform="rotate(-25 220 387)"/>
    <rect x="370" y="420" width="60" height="80" fill="#ddd" transform="rotate(30 400 460)"/>
    <rect x="250" y="560" width="90" height="120" fill="#fff" transform="rotate(-12 295 620)"/>
  </g>
  <text x="295" y="630" font-family="serif" font-size="18" text-anchor="middle" fill="#000" transform="rotate(-12 295 620)">SHHH!</text>
</svg>