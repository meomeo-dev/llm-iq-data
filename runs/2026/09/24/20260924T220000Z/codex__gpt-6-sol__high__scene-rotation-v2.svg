<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle through a library aisle</title>
  <desc id="desc">A mischievous pelican pedals above a worm's-eye view of towering bookshelves. A single lemon-yellow desk lamp lights the black-and-white scene.</desc>

  <defs>
    <clipPath id="left-shelves">
      <path d="M0 0 365 100 220 1100H0Z"/>
    </clipPath>
    <clipPath id="right-shelves">
      <path d="M900 0 535 100 680 1100H900Z"/>
    </clipPath>
    <g id="wheel">
      <ellipse rx="119" ry="147" fill="black" stroke="white" stroke-width="10"/>
      <ellipse rx="104" ry="132" fill="none" stroke="white" stroke-width="2"/>
      <circle r="14" fill="white"/>
      <path d="M0-140V140M-113 0H113M-79-101 79 101M79-101-79 101M-104-55 104 55M104-55-104 55"
            stroke="white" stroke-width="2" opacity=".7"/>
    </g>
  </defs>

  <!-- The aisle narrows toward the ceiling directly overhead. -->
  <rect width="900" height="1100" fill="black"/>
  <path d="M365 100 450 35 535 100M365 100 220 1100M535 100 680 1100"
        fill="none" stroke="white" stroke-width="5"/>
  <path d="M450 35V440M365 100 450 35 535 100"
        fill="none" stroke="white" stroke-width="2" opacity=".6"/>
  <path d="M0 0 365 100 220 1100H0ZM900 0 535 100 680 1100H900Z"
        fill="none" stroke="white" stroke-width="7"/>

  <g clip-path="url(#left-shelves)" fill="none" stroke="white">
    <path d="M-20 150 344 246M-20 290 322 390M-20 455 298 565M-20 645 269 770M-20 865 235 1005"
          stroke-width="18"/>
    <path d="M30 100 5 246M68 112 43 256M108 124 80 267M151 135 119 278M198 148 161 290M249 161 206 302M305 178 256 314
             M22 264 2 384M61 275 38 396M103 287 76 407M148 300 117 419M195 313 159 431M245 327 204 444M297 342 254 459
             M16 411-4 552M58 423 34 564M101 436 74 578M148 450 117 591M195 466 159 605M245 481 204 622
             M17 582-5 752M61 599 35 767M108 616 78 784M159 635 124 803M213 654 173 823
             M20 790-5 983M70 811 40 1004M124 831 89 1026M181 853 139 1048"
          stroke-width="5"/>
    <path d="M88 127 100 266M176 143 185 296M55 425 67 575M221 478 233 624M130 828 142 1034"
          stroke-width="2"/>
  </g>

  <g clip-path="url(#right-shelves)" fill="none" stroke="white">
    <path d="M556 246 920 150M578 390 920 290M602 565 920 455M631 770 920 645M665 1005 920 865"
          stroke-width="18"/>
    <path d="M595 178 644 314M651 161 694 302M702 148 739 290M749 135 781 278M792 124 820 267M832 112 857 256M870 100 895 246
             M603 342 646 459M655 327 696 444M705 313 741 431M752 300 783 419M797 287 824 407M839 275 862 396M878 264 898 384
             M655 481 696 622M705 466 741 605M752 450 783 591M799 436 826 578M842 423 866 564
             M687 654 727 823M741 635 776 803M792 616 822 784M839 599 865 767M883 582 905 752
             M719 853 761 1048M776 831 811 1026M830 811 860 1004M880 790 905 983"
          stroke-width="5"/>
    <path d="M724 143 715 296M812 127 800 266M845 425 833 575M679 478 667 624M770 828 758 1034"
          stroke-width="2"/>
  </g>

  <!-- One desk lamp supplies the only color. -->
  <path d="M900 300 806 277 761 219" fill="none" stroke="white"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="806" cy="277" r="11" fill="black" stroke="white" stroke-width="5"/>
  <path d="M735 174 783 209 744 248 693 213Z" fill="black"
        stroke="white" stroke-width="6"/>
  <circle cx="725" cy="222" r="15" fill="#f4df32"/>
  <path d="M725 184v-16M687 221h-18M695 192l-12-12M699 249l-11 11M750 255l9 12"
        stroke="#f4df32" stroke-width="5" stroke-linecap="round"/>
  <path d="M700 263 552 474M680 237 518 302M759 274 822 493"
        fill="none" stroke="white" stroke-width="2" opacity=".75"/>

  <!-- Bicycle, viewed from the floor of the aisle. -->
  <g transform="translate(291 767) rotate(-12)">
    <use href="#wheel"/>
  </g>
  <g transform="translate(650 747) rotate(12)">
    <use href="#wheel"/>
  </g>
  <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <path d="M291 767 414 592 468 748 291 767M414 592 558 578 468 748M558 578 650 747"
          stroke-width="15"/>
    <path d="M414 592 394 554M558 578 574 528 610 524M554 531l45-24"
          stroke-width="11"/>
    <path d="M357 551h83" stroke-width="14"/>
    <circle cx="468" cy="748" r="17" fill="black" stroke-width="7"/>
    <path d="M468 748 519 785M468 748 422 712" stroke-width="10"/>
    <path d="M501 785h35M405 712h34" stroke-width="9"/>
  </g>

  <!-- Tail, body, and curved neck of the rider. -->
  <path d="M357 483q-66-35-90-21 44 9 72 43-61-14-82 0 56 5 103 32Z"
        fill="white" stroke="black" stroke-width="7"/>
  <ellipse cx="428" cy="482" rx="104" ry="79" transform="rotate(-17 428 482)"
           fill="white" stroke="black" stroke-width="8"/>
  <path d="M491 467q61-22 38-86-10-30 15-52 23-19 47-4
           -23 6-26 28-5 37 9 66 8 74-67 94Z"
        fill="white" stroke="black" stroke-width="8"/>
  <path d="M366 477q55 17 106-18-26 55-83 57"
        fill="none" stroke="black" stroke-width="6"/>

  <!-- The pelican's grin is in its eye and the drooping bill pouch. -->
  <path d="M585 378q86-13 190 31-92 9-190-12Z"
        fill="white" stroke="black" stroke-width="7" stroke-linejoin="round"/>
  <path d="M591 397q77 70 160 19-50 92-151 15Z"
        fill="white" stroke="black" stroke-width="7"/>
  <path d="M607 418q77 57 130 16" fill="none" stroke="black"
        stroke-width="4"/>
  <circle cx="571" cy="367" r="14" fill="black"/>
  <circle cx="576" cy="362" r="4" fill="white"/>
  <path d="m551 344 32-12" stroke="black" stroke-width="8"
        stroke-linecap="round"/>
  <path d="m552 323-13-26m24 25 1-30m12 34 14-24" fill="none"
        stroke="black" stroke-width="6" stroke-linecap="round"/>

  <!-- Wing on the handlebar, feet on the pedals. -->
  <path d="M469 488q42 6 70 41l47 3q18 4 18 21-12 7-24 0l-50-5
           q-53-4-84-43Z"
        fill="white" stroke="black" stroke-width="7"/>
  <path d="m585 531 13 8m-18-4 12 11" stroke="black" stroke-width="4"
        stroke-linecap="round"/>
  <path d="M398 531q-15 58 20 95l-2 86m50-169q21 63 49 92l6 146"
        fill="none" stroke="white" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M405 713q20-13 41 0m59 74q21-13 39 2"
        fill="none" stroke="black" stroke-width="7" stroke-linecap="round"/>

  <!-- A loose book completes the comic near miss. -->
  <g transform="translate(191 321) rotate(-25)">
    <path d="M0 0h63v77H0q12-38 0-77Z" fill="white"
          stroke="black" stroke-width="5"/>
    <path d="M9 10h43M9 20h32M9 31h39" stroke="black"
          stroke-width="3"/>
  </g>
  <path d="m214 426-13 23m38-15 8 24m-61-36-22 10"
        stroke="white" stroke-width="4" stroke-linecap="round"/>
</svg>