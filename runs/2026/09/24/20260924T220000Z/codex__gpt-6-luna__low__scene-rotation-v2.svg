<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">A pelican rides a bicycle through a library aisle</title>
  <desc id="desc">A comic black-and-white worm's-eye view looking straight up between towering bookshelves. A pelican pedals overhead, with one lemon-yellow desk lamp casting a hard cone of light.</desc>

  <defs>
    <pattern id="shelf" width="98" height="120" patternUnits="userSpaceOnUse">
      <rect width="98" height="120" fill="#111"/>
      <path d="M0 9H98M0 113H98" stroke="#f4f1e9" stroke-width="8"/>
      <path d="M9 20v78M89 20v78" stroke="#777" stroke-width="2"/>
      <path d="M17 34h18v62H17zM40 26h17v70H40zM62 39h19v57H62z" fill="#f4f1e9"/>
      <path d="M20 40h12M43 33h11M65 46h13" stroke="#111" stroke-width="3"/>
      <path d="M24 34v62M48 26v70M71 39v57" stroke="#888" stroke-width="2"/>
    </pattern>
    <pattern id="floor" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V50" stroke="#777" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="scene">
      <path d="M0 0H800V1000H0z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#scene)">
    <rect width="800" height="1000" fill="#0b0b0b"/>
    <!-- Bookshelves converge overhead to a narrow vanishing point. -->
    <path d="M0 0H800L480 535 410 535z" fill="url(#shelf)" stroke="#f4f1e9" stroke-width="5"/>
    <path d="M0 0L410 535 285 1000H0z" fill="#111" stroke="#f4f1e9" stroke-width="5"/>
    <path d="M800 0L480 535 515 1000H800z" fill="#111" stroke="#f4f1e9" stroke-width="5"/>
    <path d="M0 0L410 535 285 1000H0z" fill="url(#shelf)" opacity=".96"/>
    <path d="M800 0L480 535 515 1000H800z" fill="url(#shelf)" opacity=".96"/>
    <path d="M285 1000L410 535H480L515 1000z" fill="#171717"/>
    <path d="M285 1000L410 535M515 1000L480 535" stroke="#eee" stroke-width="5"/>
    <path d="M325 1000L424 535M475 1000L466 535" stroke="#777" stroke-width="2"/>
    <path d="M310 855H503M337 735H493M365 635H486M393 560H479" fill="none" stroke="#eee" stroke-width="4"/>

    <!-- Single lemon-yellow desk lamp, the scene's hard point light. -->
    <path d="M681 110L643 174 800 602V208z" fill="#fff" opacity=".14"/>
    <path d="M682 105l-31 51 46 16 19-55z" fill="#f2d51a" stroke="#fff" stroke-width="5"/>
    <path d="M681 111l-24 38 36 11z" fill="#111"/>
    <circle cx="683" cy="147" r="9" fill="#fff"/>
    <path d="M703 173L800 405" stroke="#fff" stroke-width="3" opacity=".85"/>

    <!-- Light-catching central floor grid. -->
    <path d="M305 872L500 872 800 1000H0z" fill="url(#floor)" opacity=".18"/>
    <ellipse cx="403" cy="828" rx="178" ry="33" fill="#000" opacity=".7" filter="url(#shadow)"/>

    <!-- Bicycle wheels and frame. -->
    <g fill="none" stroke="#f4f1e9" stroke-width="9">
      <circle cx="281" cy="713" r="92"/>
      <circle cx="535" cy="713" r="92"/>
      <path d="M281 713L370 617 434 713H281L350 713 535 713 434 713 475 600"/>
      <path d="M451 600h51M337 617h67M350 713l-18 24M350 713l19-20"/>
    </g>
    <g fill="#f4f1e9">
      <circle cx="281" cy="713" r="10"/>
      <circle cx="535" cy="713" r="10"/>
      <circle cx="434" cy="713" r="12"/>
      <path d="M468 592l20-9 8 10-20 9z"/>
    </g>
    <g stroke="#888" stroke-width="2">
      <path d="M281 621v184M189 713h184M535 621v184M443 713h184"/>
      <path d="M281 713l65-65 88 65 59-83 42 83M281 713l96 0 58-96"/>
    </g>

    <!-- The rider: a delighted, slightly chaotic pelican. -->
    <path d="M352 545q-28-77 18-128 37-41 102-26 48 11 53 53 5 45-44 66-41 18-67 4l-21 62z"
          fill="#f4f1e9" stroke="#111" stroke-width="7"/>
    <path d="M393 414q18-47 63-45 42 2 55 34 8 19-6 34-16 16-44 8-29-9-68 8z"
          fill="#fff" stroke="#111" stroke-width="6"/>
    <path d="M492 418q70-8 121 15 35 16 25 31-11 17-62 8l-79-18z"
          fill="#f2d51a" stroke="#111" stroke-width="6"/>
    <path d="M522 452q55 10 103 11-24 34-81 20l-32-9z"
          fill="#f4f1e9" stroke="#111" stroke-width="5"/>
    <circle cx="469" cy="399" r="7" fill="#111"/>
    <path d="M456 385q17-14 34 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <path d="M373 470q-25 49-4 82 20 29 53 4" fill="none" stroke="#111" stroke-width="7"/>
    <path d="M379 533l-26 70M444 533l-24 69" stroke="#111" stroke-width="8" stroke-linecap="round"/>
    <path d="M349 604q-11 7-21 3M418 603q-13 9-25 7" stroke="#111" stroke-width="7" stroke-linecap="round"/>
    <path d="M411 454q-22 18-36 42M406 462q-26 3-41 16M412 474q-17 23-19 41"
          fill="none" stroke="#777" stroke-width="3"/>

    <!-- Wings reach for the handlebars; feet pedal with comic effort. -->
    <path d="M387 463q-45 18-58 58-6 20 15 19 23-2 54-39"
          fill="#fff" stroke="#111" stroke-width="6"/>
    <path d="M394 476q-24 26-38 51M386 477q-22 13-37 31" stroke="#888" stroke-width="3"/>
    <path d="M473 476q28 7 42 40l-3 38" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
    <path d="M512 551l-18 9" stroke="#111" stroke-width="7" stroke-linecap="round"/>
    <path d="M352 599q-17 1-28 14-4 8 7 10l31-4M421 600q15 3 27 15 4 8-7 9l-30-7"
          fill="#f4f1e9" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
    <path d="M365 609l14 1M420 608l14 4" stroke="#111" stroke-width="4"/>

    <!-- Motion marks and comic punctuation. -->
    <path d="M185 525l-36-17M196 548l-45-2M610 560l33-20M616 582l45-6"
          stroke="#f4f1e9" stroke-width="6" stroke-linecap="round"/>
    <path d="M550 313q-3-24 12-31 13 13 4 30M576 311q9-22 26-20 4 19-15 28"
          fill="none" stroke="#f4f1e9" stroke-width="4"/>
    <text x="99" y="416" fill="#f4f1e9" font-family="sans-serif" font-size="42" font-weight="900"
          transform="rotate(-14 99 416)">WHEE!</text>
    <path d="M96 432l25-11" stroke="#f4f1e9" stroke-width="4"/>

    <!-- Strong frame vignette. -->
    <path d="M16 16H784V984H16z" fill="none" stroke="#f4f1e9" stroke-width="5"/>
    <path d="M0 0H800V1000H0z" fill="none" stroke="#000" stroke-width="22"/>
  </g>
</svg>