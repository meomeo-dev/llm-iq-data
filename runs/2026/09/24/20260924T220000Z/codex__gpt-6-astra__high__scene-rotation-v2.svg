<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <title>A pelican takes the express lane through the library</title>
  <desc>
    A mischievous pelican rides a bicycle overhead in a narrow library aisle,
    seen from a worm's-eye perspective. Towering black and white bookshelves
    converge above it. A single lemon-yellow desk lamp casts hard-edged light.
  </desc>

  <defs>
    <pattern id="paper" width="19" height="23" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r=".65" fill="#000" opacity=".12"/>
      <circle cx="14" cy="19" r=".45" fill="#000" opacity=".1"/>
    </pattern>

    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"
             patternTransform="rotate(28)">
      <path d="M0 0V9" stroke="#000" stroke-width="2"/>
    </pattern>

    <g id="books" stroke="#fff" stroke-width="2">
      <path d="M0 0H300V83H0Z" fill="#000"/>
      <path d="M7 78V12H27V78 M31 78V3H47V78 M51 78V18H80V78
               M85 78V7H101V78 M105 78V0H132V78
               M137 78V13H149V78 M156 78L143 8L164 4L178 78
               M184 78V10H214V78 M219 78V1H233V78
               M239 78V15H263V78 M269 78V7H293V78"
            fill="none"/>
      <path d="M11 22H23 M11 27H23 M55 29H76 M55 34H76
               M109 10H128 M109 16H128 M188 22H210
               M243 26H259 M273 17H289 M273 23H289
               M9 68H25 M55 66H76 M108 68H129 M188 67H210"
            fill="none"/>
      <path d="M35 9H43V72H35Z M89 14H97V72H89Z
               M222 8H230V72H222Z" fill="#fff" stroke="none"/>
    </g>

    <g id="wheel">
      <ellipse rx="153" ry="75" fill="#fff" stroke="#000" stroke-width="17"/>
      <ellipse rx="137" ry="59" fill="#fff" stroke="#000" stroke-width="3"/>
      <g stroke="#000" stroke-width="2">
        <path d="M-137 0H137 M0-59V59 M-119-29L119 29
                 M-119 29L119-29 M-69-51L69 51 M-69 51L69-51
                 M-132-15L132 15 M-132 15L132-15
                 M-35-57L35 57 M-35 57L35-57
                 M-98-42L98 42 M-98 42L98-42"/>
      </g>
      <ellipse rx="16" ry="9" fill="#000"/>
      <path d="M-139-29C-107-68 52-83 119-38"
            fill="none" stroke="#fff" stroke-width="4"/>
      <path d="M-121 47L-113 53 M-96 60L-87 65 M-64 69L-54 73
               M-27 73L-16 77 M17 74L29 76 M60 69L70 72
               M98 57L108 61" stroke="#fff" stroke-width="2"/>
    </g>

    <clipPath id="leftShelf">
      <path d="M0 0H359L410 157L164 1100H0Z"/>
    </clipPath>
    <clipPath id="rightShelf">
      <path d="M551 0H900V1100H736L490 157Z"/>
    </clipPath>
  </defs>

  <!-- The aisle rises to a tiny patch of ceiling. -->
  <path d="M0 0H900V1100H0Z" fill="#fff"/>
  <path d="M359 0L410 157L164 1100H0V0Z
           M551 0L490 157L736 1100H900V0Z" fill="#000"/>

  <g clip-path="url(#leftShelf)">
    <g opacity=".85">
      <use href="#books" transform="matrix(1.22 -.22 .02 1.92 -71 890)"/>
      <use href="#books" transform="matrix(1.13 -.13 .06 1.53 -48 651)"/>
      <use href="#books" transform="matrix(1.1 -.055 .10 1.22 -25 455)"/>
      <use href="#books" transform="matrix(1.13 .06 .12 .94 -13 298)"/>
      <use href="#books" transform="matrix(1.2 .19 .13 .68 -5 174)"/>
      <use href="#books" transform="matrix(1.24 .31 .13 .49 0 65)"/>
      <use href="#books" transform="matrix(1.22 .4 .13 .35 0 -24)"/>
    </g>
    <g fill="#fff">
      <path d="M0 1069L189 1019L185 1037L0 1092Z"/>
      <path d="M0 880L244 833L240 850L0 900Z"/>
      <path d="M0 649L297 624L293 640L0 665Z"/>
      <path d="M0 455L337 454L333 468L0 470Z"/>
      <path d="M0 299L371 320L367 333L0 314Z"/>
      <path d="M0 175L397 228L393 239L0 189Z"/>
      <path d="M0 68L409 160L405 170L0 81Z"/>
      <path d="M59 1100L345 0H352L78 1100Z"/>
      <path d="M0 726L302 0H308L0 763Z"/>
    </g>
    <path d="M163 1100L410 157L359 0" fill="none"
          stroke="#fff" stroke-width="11"/>
  </g>

  <g clip-path="url(#rightShelf)">
    <g transform="translate(900 0) scale(-1 1)">
      <use href="#books" transform="matrix(1.22 -.22 .02 1.92 -71 890)"/>
      <use href="#books" transform="matrix(1.13 -.13 .06 1.53 -48 651)"/>
      <use href="#books" transform="matrix(1.1 -.055 .10 1.22 -25 455)"/>
      <use href="#books" transform="matrix(1.13 .06 .12 .94 -13 298)"/>
      <use href="#books" transform="matrix(1.2 .19 .13 .68 -5 174)"/>
      <use href="#books" transform="matrix(1.24 .31 .13 .49 0 65)"/>
      <use href="#books" transform="matrix(1.22 .4 .13 .35 0 -24)"/>
      <g fill="#fff">
        <path d="M0 1069L189 1019L185 1037L0 1092Z"/>
        <path d="M0 880L244 833L240 850L0 900Z"/>
        <path d="M0 649L297 624L293 640L0 665Z"/>
        <path d="M0 455L337 454L333 468L0 470Z"/>
        <path d="M0 299L371 320L367 333L0 314Z"/>
        <path d="M0 175L397 228L393 239L0 189Z"/>
        <path d="M0 68L409 160L405 170L0 81Z"/>
        <path d="M59 1100L345 0H352L78 1100Z"/>
        <path d="M0 726L302 0H308L0 763Z"/>
      </g>
      <path d="M163 1100L410 157L359 0" fill="none"
            stroke="#fff" stroke-width="11"/>
    </g>
  </g>

  <path d="M359 0L410 157H490L551 0 M410 157L442 95H458L490 157"
        fill="none" stroke="#000" stroke-width="3"/>
  <path d="M450 0V95" stroke="#000" stroke-width="2"/>

  <!-- One articulated desk lamp; its shade is the only colored object. -->
  <path d="M656 354L732 335L751 345L672 367Z"
        fill="#fff" stroke="#000" stroke-width="5"/>
  <path d="M702 342L751 269L686 194"
        fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  <path d="M702 342L751 269L686 194"
        fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="751" cy="269" r="10" fill="#fff" stroke="#000" stroke-width="4"/>
  <path d="M696 340Q781 337 790 415" fill="none" stroke="#fff" stroke-width="3"/>

  <!-- A sharply bounded pool of light cuts across the aisle. -->
  <path d="M661 223L619 234L183 972L814 746Z" fill="#fff"/>
  <path d="M653 164Q680 154 696 183L711 214
           Q670 248 622 233L637 191Q642 173 653 164Z"
        fill="#f4ed32" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M623 231Q665 249 711 214Q674 219 653 213Z"
        fill="#000"/>
  <ellipse cx="664" cy="226" rx="12" ry="5" transform="rotate(-12 664 226)"
           fill="#fff"/>
  <path d="M651 179L642 199" fill="none" stroke="#fff" stroke-width="4"/>

  <!-- A comically severe library notice, high on the shelf. -->
  <g transform="translate(61 560) rotate(-9)">
    <path d="M0 0H121V72H0Z" fill="#fff" stroke="#000" stroke-width="4"/>
    <text x="60" y="29" text-anchor="middle" fill="#000"
          font-family="monospace" font-size="18" font-weight="bold">QUIET</text>
    <path d="M17 39H105" stroke="#000" stroke-width="2"/>
    <text x="60" y="58" text-anchor="middle" fill="#000"
          font-family="monospace" font-size="10">PLEASE.</text>
  </g>

  <!-- Hard cast shadows on the left shelf. -->
  <path d="M92 707L203 614L280 650L238 702L157 714L109 799Z
           M0 855L180 754L224 779L34 963Z" fill="#000"/>

  <!-- Bicycle, seen from underneath: compressed wheels and exposed crank. -->
  <g transform="translate(465 755) rotate(-20)">
    <use href="#wheel" transform="translate(-210 60)"/>
    <use href="#wheel" transform="translate(210 60)"/>

    <path d="M-218 51L-9 78L16 94L-206 75Z"
          fill="#fff" stroke="#000" stroke-width="4"/>
    <path d="M-206 60L0 72" stroke="#000" stroke-width="3"/>

    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-210 60L-88-101L0 72L-210 60
               M-88-101L135-67L0 72 M135-67L210 60"
            stroke="#000" stroke-width="20"/>
      <path d="M-210 60L-88-101L0 72L-210 60
               M-88-101L135-67L0 72 M135-67L210 60"
            stroke="#fff" stroke-width="8"/>
      <path d="M-88-101L-104-133 M135-67L121-127"
            stroke="#000" stroke-width="13"/>
      <path d="M121-127L163-148L198-136Q215-124 195-114"
            stroke="#000" stroke-width="12"/>
      <path d="M121-127L163-148L198-136"
            stroke="#fff" stroke-width="4"/>
      <path d="M175-139Q248-88 210 49" stroke="#000" stroke-width="3"/>
    </g>

    <path d="M-150-147Q-119-157-77-145L-59-136
             Q-98-123-148-133Z" fill="#000" stroke="#fff" stroke-width="3"/>
    <ellipse cx="0" cy="72" rx="31" ry="21"
             fill="#000" stroke="#fff" stroke-width="3"/>
    <ellipse cx="0" cy="72" rx="21" ry="13"
             fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M0 72L44 104 M0 72L-45 40"
          stroke="#000" stroke-width="9"/>
    <path d="M26 105H66 M-64 39H-27"
          stroke="#000" stroke-width="12" stroke-linecap="round"/>
    <path d="M29 102H63 M-60 36H-31" stroke="#fff" stroke-width="3"/>
    <circle cx="0" cy="72" r="6" fill="#fff"/>
    <ellipse cx="156" cy="-147" rx="14" ry="9"
             fill="#fff" stroke="#000" stroke-width="4"/>
  </g>

  <!-- Far leg and webbed foot. -->
  <path d="M453 567Q482 606 525 657L513 738L549 765"
        fill="none" stroke="#000" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M527 746L564 753L586 778L550 776L526 787L514 772Z"
        fill="#fff" stroke="#000" stroke-width="5"/>
  <path d="M532 758L550 776 M548 758L565 775" stroke="#000" stroke-width="3"/>

  <!-- Tail projects toward the viewer. -->
  <path d="M316 488L216 532L254 539L225 562L273 555L254 585
           L335 552Z" fill="#fff" stroke="#000" stroke-width="6"
        stroke-linejoin="round"/>
  <path d="M239 545L311 521L273 554Z" fill="#000"/>

  <!-- The huge pear-shaped belly is the central low-angle silhouette. -->
  <path d="M455 361
           C398 352 328 383 303 452
           C273 531 303 613 378 630
           C449 647 511 589 525 511
           C536 452 495 420 487 385Z"
        fill="#fff" stroke="#000" stroke-width="7"/>
  <path d="M311 435C291 521 326 588 390 602
           C442 612 485 575 507 540
           C487 609 430 646 378 630
           C303 613 273 531 303 452Z" fill="#000"/>
  <path d="M335 565Q360 587 391 590 M330 545Q343 559 357 564"
        fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>

  <!-- Long pelican neck, with a hard shadow along the underside. -->
  <path d="M412 420
           C449 379 415 331 444 279
           C458 253 496 248 521 263
           C542 276 548 301 534 325
           C515 356 481 349 486 386
           L503 438
           C484 463 444 456 412 420Z"
        fill="#fff" stroke="#000" stroke-width="6"/>
  <path d="M466 303C452 341 479 369 461 408
           L482 439L503 438L486 386
           C481 349 515 356 534 325L511 313Z" fill="#000"/>

  <!-- Oversized bill and sagging throat pouch, visible from below. -->
  <path d="M513 299
           Q582 291 738 351
           Q683 386 604 389
           Q548 388 510 335Z"
        fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M514 328Q608 356 738 351
           Q669 414 589 405Q539 391 514 328Z"
        fill="#fff" stroke="#000" stroke-width="5"/>
  <path d="M534 342Q576 390 634 391
           Q684 388 724 360Q674 409 606 411
           Q548 402 534 342Z" fill="#000"/>
  <path d="M520 309Q626 319 738 351"
        fill="none" stroke="#000" stroke-width="3"/>
  <path d="M732 349Q754 352 742 369L728 365Z" fill="#000"/>
  <path d="M566 355L585 381 M581 358L600 385 M598 361L616 386"
        stroke="#000" stroke-width="2"/>

  <!-- A backward glance and an unapologetic eyebrow. -->
  <path d="M470 282Q489 268 507 284Q490 304 473 291Z"
        fill="#fff" stroke="#000" stroke-width="3"/>
  <ellipse cx="480" cy="286" rx="5" ry="8" fill="#000"/>
  <circle cx="479" cy="283" r="1.6" fill="#fff"/>
  <path d="M466 269Q488 253 510 270" fill="none"
        stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <path d="M457 266L442 240L464 251L467 229L482 249"
        fill="#fff" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <path d="M540 308L551 310" stroke="#000" stroke-width="3"
        stroke-linecap="round"/>

  <!-- Wing reaches forward and curls around the handlebar. -->
  <path d="M388 419
           C429 413 460 447 479 485
           L572 539L605 553
           Q619 565 609 577
           Q600 587 585 573
           Q594 592 580 595
           Q567 594 559 576
           C503 565 442 543 414 514
           C389 489 375 450 388 419Z"
        fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M399 448C419 487 438 512 478 531
           L566 567L578 589
           Q555 581 540 578
           C477 560 430 538 414 514
           Q391 490 399 448Z" fill="#000"/>
  <path d="M412 439Q438 460 450 483
           M409 456Q424 479 435 487
           M470 516L548 551"
        fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>

  <!-- Near leg crosses the frame and stamps firmly onto its pedal. -->
  <path d="M370 600L363 691L432 793"
        fill="none" stroke="#000" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M375 615L373 687L440 788"
        fill="none" stroke="#fff" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M427 781Q443 778 453 792
           L472 808L506 818L485 832L463 829L447 842L419 809Z"
        fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M444 800L463 829 M452 798L485 832"
        fill="none" stroke="#000" stroke-width="3"/>
  <path d="M447 842L485 832L506 818L492 836L449 850Z" fill="#000"/>

  <!-- A book tumbles out in the slipstream. -->
  <g transform="translate(230 694) rotate(24)">
    <path d="M-49-19L-6-30L4-22L40-35L51 17L8 36L-3 29L-43 35Z"
          fill="#000" stroke="#fff" stroke-width="3"/>
    <path d="M-43-24Q-23-33-5-25L3 24Q-15 18-39 29Z
             M-5-25Q12-37 34-38L45 12Q21 14 3 24Z"
          fill="#fff" stroke="#000" stroke-width="3"/>
    <path d="M-33-13L-14-17 M-31-4L-12-8 M-28 5L-11 1
             M7-18L28-26 M9-9L30-17 M11 0L31-8"
          stroke="#000" stroke-width="2"/>
  </g>

  <!-- Ink motion marks; even the bell is trying to whisper. -->
  <g fill="none" stroke="#000" stroke-linecap="round">
    <path d="M164 601Q145 629 157 652 M147 597Q126 629 136 653"
          stroke-width="3"/>
    <path d="M291 936Q405 985 531 924 M330 958Q426 986 492 958"
          stroke-width="4"/>
    <path d="M740 659L781 638 M747 675L799 652 M758 690L786 679"
          stroke-width="4"/>
    <path d="M599 550L614 534 M611 560L633 554" stroke-width="3"/>
  </g>
  <text x="598" y="513" transform="rotate(-14 598 513)"
        fill="#000" font-family="monospace" font-size="18" font-style="italic">
    ting.
  </text>

  <path d="M0 0H900V1100H0Z" fill="url(#paper)" pointer-events="none"/>
  <path d="M10 10H890V1090H10Z" fill="none" stroke="#000" stroke-width="7"/>
</svg>