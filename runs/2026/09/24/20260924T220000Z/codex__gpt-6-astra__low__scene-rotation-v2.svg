    </g>
    <path d="M287 509Q314 499 352 511L368 527Q328 538 290 528Z" fill="#000" stroke="#fff" stroke-width="3"/>
    <path d="M571 457L599 458" stroke="#000" stroke-width="17" stroke-linecap="round"/>
    <circle cx="547" cy="484" r="15" fill="#fff" stroke="#000" stroke-width="5"/>
    <path d="M540 480Q546 473 551 480" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M557 494Q579 539 567 589" fill="none" stroke="#000" stroke-width="3"/>
    <path d="M225 723L408 706Q443 707 444 737Q443 770 411 771L225 751Z" fill="none" stroke="#000" stroke-width="5"/>
    <circle cx="413" cy="738" r="29" fill="#fff" stroke="#000" stroke-width="7"/>
    <circle cx="413" cy="738" r="9" fill="#000"/>
    <circle cx="226" cy="737" r="11" fill="#000"/>
    <circle cx="621" cy="737" r="12" fill="#000"/>
    <path d="M413 738L463 784M413 738L374 692" stroke="#000" stroke-width="10"/>
    <path d="M444 785H486M353 691H393" stroke="#000" stroke-width="13" stroke-linecap="round"/>
