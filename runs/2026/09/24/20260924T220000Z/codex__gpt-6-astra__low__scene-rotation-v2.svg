  <!-- Dangling legs and extravagant webbed feet visibly meet the pedals. -->
  <path d="M325 505L304 552L355 608L357 671" fill="none" stroke="#000" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
