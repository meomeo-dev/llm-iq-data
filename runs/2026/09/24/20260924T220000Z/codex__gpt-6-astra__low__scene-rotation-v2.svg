    <path d="M238-20L317 280L148 1030" fill="none" stroke="#000" stroke-width="13"/>
  </g>
  <g clip-path="url(#rightClip)">
    <path d="M532-100H930V1080H668L470 280Z" fill="url(#books)" transform="rotate(-11 650 450)"/>
    <g fill="#000" stroke="#fff" stroke-width="3">
