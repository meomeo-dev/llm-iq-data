<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Quiet, Please!</title>
  <desc id="desc">A mischievous pelican rides a bicycle through a narrow library aisle, seen from almost directly underneath. Towering black and white bookshelves converge overhead. A single lemon-yellow desk lamp casts hard-edged light across the scene.</desc>
  <defs>
    <pattern id="books" width="96" height="180" patternUnits="userSpaceOnUse">
      <rect width="96" height="180" fill="white"/>
      <g stroke="black" stroke-width="5">
        <path d="M4 12V156H20V12ZM25 27V156H43V27ZM49 7V156H65V7ZM70 19L78 156H93L86 18Z"/>
        <path d="M5 41H20M26 124H43M50 27H65M51 38H65M74 48L88 47"/>
      </g>
      <path d="M0 159H96V180H0Z" fill="black"/>
    </pattern>
    <clipPath id="leftClip">
      <path d="M0 0H277L350 280L207 1000H0Z"/>
    </clipPath>
    <clipPath id="rightClip">
      <path d="M542 0H800V1000H655L455 280Z"/>
    </clipPath>
  </defs>

