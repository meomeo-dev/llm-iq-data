<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec9f0"/>
      <stop offset="1" stop-color="#fde7c8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="650" cy="80" r="40" fill="#ffe27a" opacity="0.9"/>
  <rect x="0" y="421" width="800" height="79" fill="#c9b27c"/>
  <rect x="0" y="421" width="800" height="6" fill="#a58f5c"/>
  <g stroke="#8a7646" stroke-width="5" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.3s" repeatCount="indefinite"/>
      <line x1="0" y1="450" x2="50" y2="450"/>
      <line x1="120" y1="450" x2="170" y2="450"/>
      <line x1="240" y1="450" x2="290" y2="450"/>
      <line x1="360" y1="450" x2="410" y2="450"/>
      <line x1="480" y1="450" x2="530" y2="450"/>
      <line x1="600" y1="450" x2="650" y2="450"/>
      <line x1="720" y1="450" x2="770" y2="450"/>
      <line x1="840" y1="450" x2="890" y2="450"/>
    </g>
  </g>

  <!-- Rear wheel -->
  <g transform="translate(250,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="78" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <path d="M-70,0 L70,0 M-64.7,-26.8 L64.7,26.8 M-49.5,-49.5 L49.5,49.5 M-26.8,-64.7 L26.8,64.7 M0,-70 L0,70 M26.8,-64.7 L-26.8,64.7 M49.5,-49.5 L-49.5,49.5 M64.7,-26.8 L-64.7,26.8" stroke="#888" stroke-width="1.2" fill="none"/>
      <rect x="-3" y="-72" width="6" height="12" fill="#d33"/>
      <circle r="7" fill="#444"/>
      <circle r="3" fill="#ccc"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g transform="translate(550,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="78" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <path d="M-70,0 L70,0 M-64.7,-26.8 L64.7,26.8 M-49.5,-49.5 L49.5,49.5 M-26.8,-64.7 L26.8,64.7 M0,-70 L0,70 M26.8,-64.7 L-26.8,64.7 M49.5,-49.5 L-49.5,49.5 M64.7,-26.8 L-64.7,26.8" stroke="#888" stroke-width="1.2" fill="none"/>
      <rect x="-3" y="-72" width="6" height="12" fill="#d33"/>
      <circle r="7" fill="#444"/>
      <circle r="3" fill="#ccc"/>
    </g>
  </g>

  <!-- Far leg (behind frame) -->
  <path fill="none" stroke="#b86a25" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M355,222 L409.5,291.1 L340,345">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M355,222 L409.5,291.1 L340,345;
      M355,222 L421.1,280.1 L345.4,325;
      M355,222 L433.4,261.9 L360,310.4;
      M355,222 L440.8,241.4 L380,305;
      M355,222 L442.3,233.2 L400,310.4;
      M355,222 L440.9,241 L414.6,325;
      M355,222 L435.1,258.3 L420,345;
      M355,222 L423.3,277.4 L414.6,365;
      M355,222 L408.3,292 L400,379.6;
      M355,222 L397.9,298.8 L380,385;
      M355,222 L396.6,299.6 L360,379.6;
      M355,222 L401.1,296.9 L345.4,365;
      M355,222 L409.5,291.1 L340,345"/>
  </path>

  <!-- Far crank and pedal -->
  <g transform="translate(380,345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#444" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="2s" repeatCount="indefinite"/>
          <rect x="-12" y="2" width="24" height="5" rx="2" fill="#222"/>
          <path d="M-9,1 Q-7,-8 3,-6 L19,0 L15,2 Z" fill="#b86a25"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Chain -->
  <path d="M380,319 L250,329 M380,371 L250,351" stroke="#333" stroke-width="2.5" fill="none"/>
  <circle cx="250" cy="340" r="11" fill="none" stroke="#333" stroke-width="3"/>

  <!-- Frame -->
  <g fill="none" stroke="#1d6fb8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380,345 L350,238"/>
    <path d="M352,242 L500,230"/>
    <path d="M380,345 L506,257"/>
    <path d="M500,225 L508,255"/>
    <path d="M352,244 L250,340"/>
    <path d="M380,345 L250,340"/>
    <path d="M508,255 L550,340"/>
  </g>
  <circle cx="380" cy="345" r="9" fill="#333"/>

  <!-- Chainring -->
  <g transform="translate(380,345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="26" fill="none" stroke="#555" stroke-width="3"/>
      <circle r="29" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="4 4"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#666" stroke-width="2"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#666" stroke-width="2"/>
    </g>
  </g>

  <!-- Saddle and seatpost -->
  <path d="M350,240 L350,232" stroke="#333" stroke-width="5"/>
  <path d="M326,231 Q346,225 374,230 Q380,235 368,237 L336,238 Q323,238 326,231 Z" fill="#222"/>

  <!-- Handlebar -->
  <path d="M500,226 L494,205" stroke="#333" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M492,205 L520,200 Q536,200 534,217" stroke="#333" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M514,201 L524,199" stroke="#111" stroke-width="9" stroke-linecap="round"/>

  <!-- Pelican tail -->
  <path d="M325,222 L282,238 L290,222 L280,214 L326,208 Z" fill="#3d2e24"/>

  <!-- Pelican body -->
  <ellipse cx="368" cy="198" rx="64" ry="37" transform="rotate(-35 368 198)" fill="#6e5846"/>
  <ellipse cx="350" cy="205" rx="34" ry="20" transform="rotate(-35 350 205)" fill="#85705c"/>

  <!-- Neck -->
  <path d="M405,172 C428,150 410,126 435,112" stroke="#f1e8c8" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M399,168 C416,148 400,124 425,107" stroke="#5b3f2c" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Head -->
  <ellipse cx="441" cy="104" rx="17" ry="13" fill="#f6efcf"/>
  <path d="M427,98 Q441,86 456,96 Q445,94 427,98 Z" fill="#f0cf5e"/>
  <circle cx="447" cy="100" r="3.2" fill="#111"/>
  <circle cx="448" cy="99" r="1" fill="#fff"/>

  <!-- Bill -->
  <path d="M453,98 L532,118 Q536,121 530,124 L453,112 Z" fill="#9d9378"/>
  <path d="M455,111 Q492,142 529,124 L455,111 Z" fill="#c1a56f"/>
  <path d="M526,118 Q536,119 532,125 Q528,124 526,122 Z" fill="#c9553a"/>

  <!-- Wing to handlebar -->
  <path d="M395,172 Q462,168 518,199" stroke="#5a4535" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M440,176 Q485,180 516,200" stroke="#3a2c22" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="397" cy="172" r="10" fill="#5a4535"/>

  <!-- Near leg -->
  <path fill="none" stroke="#e8913a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M355,222 L435.1,258.3 L420,345">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M355,222 L435.1,258.3 L420,345;
      M355,222 L423.3,277.4 L414.6,365;
      M355,222 L408.3,292 L400,379.6;
      M355,222 L397.9,298.8 L380,385;
      M355,222 L396.6,299.6 L360,379.6;
      M355,222 L401.1,296.9 L345.4,365;
      M355,222 L409.5,291.1 L340,345;
      M355,222 L421.1,280.1 L345.4,325;
      M355,222 L433.4,261.9 L360,310.4;
      M355,222 L440.8,241.4 L380,305;
      M355,222 L442.3,233.2 L400,310.4;
      M355,222 L440.9,241 L414.6,325;
      M355,222 L435.1,258.3 L420,345"/>
  </path>
  <circle cx="355" cy="222" r="11" fill="#6e5846"/>

  <!-- Near crank and pedal -->
  <g transform="translate(380,345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#666" stroke-width="7" stroke-linecap="round"/>
      <circle r="6" fill="#999"/>
      <g transform="translate(40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-12" y="2" width="24" height="5" rx="2" fill="#222"/>
          <path d="M-9,1 Q-7,-8 3,-6 L19,0 L15,2 Z" fill="#e8913a"/>
        </g>
      </g>
    </g>
  </g>
</svg>