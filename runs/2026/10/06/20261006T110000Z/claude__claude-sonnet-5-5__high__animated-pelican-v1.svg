<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f7"/>
      <stop offset="1" stop-color="#eaf6fc"/>
    </linearGradient>
    <g id="wheelArt">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#9a9a9a" stroke-width="2"/>
      <g stroke="#b5b5b5" stroke-width="1">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(15)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(30)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(45)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(60)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(75)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(105)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(120)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(135)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(150)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(165)"/>
      </g>
      <circle cx="56" cy="0" r="3.5" fill="#d33"/>
      <circle r="7" fill="#555" stroke="#222" stroke-width="2"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="32" fill="#ffe28a" opacity="0.9"/>
  <rect y="422" width="800" height="78" fill="#dccda6"/>
  <line x1="0" y1="422" x2="800" y2="422" stroke="#a89a73" stroke-width="3"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#b8a97f" stroke-width="3" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="478" x2="800" y2="478" stroke="#b8a97f" stroke-width="2" stroke-dasharray="20 40">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="425" rx="230" ry="8" fill="#000" opacity="0.15"/>

  <!-- wheels -->
  <g transform="translate(230,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheelArt"/>
    </g>
  </g>
  <g transform="translate(570,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheelArt"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="385" y1="339" x2="230" y2="343"/>
    <line x1="385" y1="371" x2="230" y2="357"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c8281e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="385" y1="355" x2="352" y2="252"/>
    <line x1="352" y1="256" x2="522" y2="250"/>
    <line x1="385" y1="355" x2="530" y2="282"/>
    <line x1="385" y1="355" x2="230" y2="350"/>
    <line x1="354" y1="262" x2="230" y2="350"/>
    <line x1="522" y1="244" x2="532" y2="286"/>
  </g>
  <path d="M530,278 L538,300 Q548,330 570,350" fill="none" stroke="#a81f17" stroke-width="6" stroke-linecap="round"/>
  <!-- seat post, saddle -->
  <line x1="352" y1="252" x2="350" y2="238" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M322,241 Q334,231 362,233 L380,238 Q360,246 322,241 Z" fill="#222"/>
  <!-- stem, handlebar -->
  <line x1="521" y1="246" x2="518" y2="218" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M508,218 Q545,210 552,238" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M542,212 Q550,216 552,226" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>

  <!-- crank, chainring, pedals -->
  <g transform="translate(385,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="17" fill="none" stroke="#444" stroke-width="3"/>
      <circle r="12" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="-40" y1="0" x2="40" y2="0" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <circle r="6" fill="#999" stroke="#333" stroke-width="2"/>
      <g transform="translate(40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-12" y="-3.5" width="24" height="7" rx="2" fill="#222"/>
        </g>
      </g>
      <g transform="translate(-40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-12" y="-3.5" width="24" height="7" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2b2825" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M350,235 L414.5,297.8 L345,355 L359,355">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear"
      values="M350,235 L414.5,297.8 L345,355 L359,355;M350,235 L430.6,275.2 L356.7,326.7 L370.7,326.7;M350,235 L439.6,243.4 L385,315 L399,315;M350,235 L439.9,240.7 L413.3,326.7 L427.3,326.7;M350,235 L434.7,265.5 L425,355 L439,355;M350,235 L418.5,293.5 L413.3,383.3 L427.3,383.3;M350,235 L403.9,307 L385,395 L399,395;M350,235 L404.3,306.9 L356.7,383.3 L370.7,383.3;M350,235 L414.5,297.8 L345,355 L359,355"/>
  </path>

  <!-- tail -->
  <path d="M292,200 L250,220 L256,240 L298,230 Z" fill="#54433a"/>

  <!-- body -->
  <g transform="rotate(-12 345 198)">
    <ellipse cx="345" cy="198" rx="62" ry="41" fill="#8a735c"/>
    <ellipse cx="358" cy="208" rx="46" ry="26" fill="#cdbfa8"/>
    <path d="M300,185 Q320,170 345,176 M305,200 Q330,188 355,194" fill="none" stroke="#6d5a47" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#45403a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M350,235 L434.7,265.5 L425,355 L439,355">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear"
      values="M350,235 L434.7,265.5 L425,355 L439,355;M350,235 L418.5,293.5 L413.3,383.3 L427.3,383.3;M350,235 L403.9,307 L385,395 L399,395;M350,235 L404.3,306.9 L356.7,383.3 L370.7,383.3;M350,235 L414.5,297.8 L345,355 L359,355;M350,235 L430.6,275.2 L356.7,326.7 L370.7,326.7;M350,235 L439.6,243.4 L385,315 L399,315;M350,235 L439.9,240.7 L413.3,326.7 L427.3,326.7;M350,235 L434.7,265.5 L425,355 L439,355"/>
  </path>
  <!-- thigh feathers -->
  <ellipse cx="354" cy="229" rx="22" ry="14" fill="#9a826a"/>

  <!-- wing reaching handlebar -->
  <path d="M360,170 C405,166 470,188 538,205 L533,218 C482,214 432,224 396,234 L358,214 Z" fill="#6b5543" stroke="#4a3a2d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400,200 L470,205 M395,212 L460,214" stroke="#8d7560" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- neck and head -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="0.8s" repeatCount="indefinite"/>
    <path d="M382,176 C412,168 394,126 416,108" fill="none" stroke="#5b3b28" stroke-width="22" stroke-linecap="round"/>
    <path d="M388,178 C418,170 400,128 424,110" fill="none" stroke="#f3eee3" stroke-width="13" stroke-linecap="round"/>
    <circle cx="424" cy="100" r="15" fill="#f4efe4"/>
    <path d="M410,96 Q422,80 438,92 Q428,92 410,96 Z" fill="#e8c65a"/>
    <path d="M408,100 Q410,88 420,86" fill="none" stroke="#5b3b28" stroke-width="5" stroke-linecap="round"/>
    <circle cx="430" cy="98" r="3.5" fill="#222"/>
    <circle cx="431" cy="97" r="1" fill="#fff"/>
    <path d="M436,93 L520,113 Q531,116 528,125 L436,108 Z" fill="#8d8878" stroke="#5f5b4e" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M438,107 L520,124 Q490,152 448,116 Z" fill="#a39a7c" stroke="#7d7458" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M522,114 Q532,117 528,126 Q524,122 520,119 Z" fill="#6a6656"/>
  </g>
</svg>