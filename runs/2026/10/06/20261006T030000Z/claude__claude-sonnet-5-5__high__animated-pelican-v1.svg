<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8f5"/>
      <stop offset="1" stop-color="#fdf0d2"/>
    </linearGradient>
    <g id="wheel">
      <circle r="67" fill="none" stroke="#2b2b2b" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#c9ced3" stroke-width="2"/>
      <g stroke="#9aa0a6" stroke-width="1">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(22.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(45)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(67.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(112.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(135)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="6" fill="#555"/>
      <circle cx="0" cy="-57" r="3" fill="#e8c020"/>
    </g>
    <g id="foot">
      <path d="M-7,-3 L-5,-9 L12,-5 L19,-1 L14,1 L-7,1 Z" fill="#3a3a3a" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
      <path d="M12,-5 L17,0 M8,-6 L14,1" stroke="#222" stroke-width="1" fill="none"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="690" cy="85" r="36" fill="#ffe9a0" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="900 0" dur="60s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="70" rx="45" ry="14"/>
      <ellipse cx="30" cy="60" rx="30" ry="14"/>
      <ellipse cx="-28" cy="62" rx="25" ry="11"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="600 0" dur="80s" repeatCount="indefinite"/>
      <ellipse cx="400" cy="120" rx="38" ry="11"/>
      <ellipse cx="425" cy="111" rx="24" ry="11"/>
    </g>
  </g>
  <rect x="0" y="290" width="800" height="130" fill="#62b3cf"/>
  <g stroke="#a8dcec" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="315" x2="130" y2="315"/>
    <line x1="260" y1="335" x2="350" y2="335"/>
    <line x1="560" y1="310" x2="640" y2="310"/>
    <line x1="660" y1="345" x2="740" y2="345"/>
    <line x1="120" y1="370" x2="190" y2="370"/>
  </g>
  <rect x="0" y="420" width="800" height="80" fill="#e8d4a2"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#c9b27a" stroke-width="2"/>
  <line x1="0" y1="438" x2="800" y2="438" stroke="#c2a96d" stroke-width="4" stroke-dasharray="40 80">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.55s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="468" x2="800" y2="468" stroke="#b89d5f" stroke-width="5" stroke-dasharray="20 100">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.4s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="423" rx="175" ry="6" fill="#000" opacity="0.2"/>

  <!-- wheels -->
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2c2c2c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M335,238 L399.2,285.7 L340,360">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M335,238 L399.2,285.7 L340,360;
      M335,238 L408.7,269.2 L345.4,340;
      M335,238 L414.5,247.5 L360,325.4;
      M335,238 L414.7,231.6 L380,320;
      M335,238 L414.7,231.5 L400,325.4;
      M335,238 L414.7,245 L414.6,340;
      M335,238 L410.1,265.5 L420,360;
      M335,238 L398.7,286.3 L414.6,380;
      M335,238 L384.4,300.9 L400,394.6;
      M335,238 L378.7,305 L380,400;
      M335,238 L382.5,302.4 L360,394.6;
      M335,238 L390,296.1 L345.4,380;
      M335,238 L399.2,285.7 L340,360"/>
  </path>
  <!-- far crank + pedal -->
  <g transform="translate(380,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-40" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
          <rect x="-12" y="0" width="24" height="5" rx="2" fill="#1a1a1a"/>
          <use href="#foot"/>
        </g>
      </g>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="345" y1="258" x2="340" y2="244" stroke="#b5bbc0" stroke-width="5"/>
    <path d="M312,247 Q330,238 358,243 L361,249 Q335,254 312,252 Z" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="2"/>
    <g stroke="#c0392b" stroke-width="6">
      <line x1="380" y1="360" x2="346" y2="260"/>
      <line x1="350" y1="268" x2="507" y2="254"/>
      <line x1="380" y1="360" x2="512" y2="266"/>
      <line x1="380" y1="360" x2="250" y2="350"/>
      <line x1="349" y1="266" x2="250" y2="350"/>
      <line x1="506" y1="248" x2="514" y2="270" stroke-width="8"/>
    </g>
    <line x1="514" y1="270" x2="550" y2="350" stroke="#333" stroke-width="5"/>
    <path d="M506,248 L500,228 L520,224 Q536,224 535,240" stroke="#333" stroke-width="4"/>
    <circle cx="550" cy="350" r="4" fill="#333" stroke="none"/>
  </g>

  <!-- chain and rear cog -->
  <line x1="380" y1="340" x2="250" y2="341" stroke="#333" stroke-width="2.5" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" from="0" to="-10" dur="0.16s" repeatCount="indefinite"/>
  </line>
  <line x1="380" y1="380" x2="250" y2="359" stroke="#333" stroke-width="2.5" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="0.16s" repeatCount="indefinite"/>
  </line>
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.9s" repeatCount="indefinite"/>
      <circle r="9" fill="#777" stroke="#333" stroke-width="3" stroke-dasharray="3 3"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#222" stroke-width="2"/>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#4a4a4a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M335,238 L410.1,265.5 L420,360">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M335,238 L410.1,265.5 L420,360;
      M335,238 L398.7,286.3 L414.6,380;
      M335,238 L384.4,300.9 L400,394.6;
      M335,238 L378.7,305 L380,400;
      M335,238 L382.5,302.4 L360,394.6;
      M335,238 L390,296.1 L345.4,380;
      M335,238 L399.2,285.7 L340,360;
      M335,238 L408.7,269.2 L345.4,340;
      M335,238 L414.5,247.5 L360,325.4;
      M335,238 L414.7,231.6 L380,320;
      M335,238 L414.7,231.5 L400,325.4;
      M335,238 L414.7,245 L414.6,340;
      M335,238 L410.1,265.5 L420,360"/>
  </path>
  <!-- near crank, chainring, pedal -->
  <g transform="translate(380,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <circle r="20" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="3.3 3.3"/>
      <circle r="17" fill="none" stroke="#777" stroke-width="2"/>
      <g stroke="#777" stroke-width="2">
        <line x1="0" y1="0" x2="0" y2="-17"/>
        <line x1="0" y1="0" x2="16.2" y2="-5.3"/>
        <line x1="0" y1="0" x2="10" y2="13.7"/>
        <line x1="0" y1="0" x2="-10" y2="13.7"/>
        <line x1="0" y1="0" x2="-16.2" y2="-5.3"/>
      </g>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#666" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
          <rect x="-12" y="0" width="24" height="5" rx="2" fill="#111"/>
          <use href="#foot"/>
        </g>
      </g>
    </g>
    <circle r="5" fill="#222"/>
  </g>

  <!-- pelican body -->
  <path d="M286,210 L232,224 L236,238 L288,232 Z" fill="#4a3a2d" stroke="#33271d" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M240,226 L282,216 M240,232 L284,224" stroke="#33271d" stroke-width="1.2" fill="none"/>
  <g transform="rotate(-10 322 212)">
    <ellipse cx="322" cy="212" rx="54" ry="33" fill="#7a6652" stroke="#4e4033" stroke-width="2"/>
    <ellipse cx="338" cy="222" rx="34" ry="18" fill="#9a8770" opacity="0.8"/>
  </g>

  <!-- neck, head, bill -->
  <path d="M350,198 C336,168 368,156 392,140" fill="none" stroke="#5a4030" stroke-width="22" stroke-linecap="round"/>
  <path d="M355,197 C343,170 372,160 394,143" fill="none" stroke="#f5efe0" stroke-width="14" stroke-linecap="round"/>
  <circle cx="398" cy="137" r="15" fill="#f7f1e2"/>
  <path d="M385,130 Q396,115 411,129 Q398,124 385,130 Z" fill="#f0d36a"/>
  <path d="M409,146 Q440,176 487,157 L409,146 Z" fill="#b39d6f" stroke="#7d6a45" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M408,130 L490,148 Q498,152 489,156 L408,146 Z" fill="#8c8576" stroke="#5f584b" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M484,148 Q498,151 492,162 Q487,157 484,154 Z" fill="#4f483d"/>
  <circle cx="404" cy="135" r="3" fill="#1a1a1a"/>
  <circle cx="405" cy="134" r="1" fill="#fff"/>

  <!-- wing reaching to handlebar -->
  <path d="M336,190 C400,185 470,205 528,218 L525,228 C470,232 400,240 340,226 Z" fill="#5a4636" stroke="#3a2d22" stroke-width="2" stroke-linejoin="round"/>
  <path d="M360,200 C420,203 470,212 515,221 M360,214 C420,224 470,225 512,226" fill="none" stroke="#8a7560" stroke-width="2" stroke-linecap="round"/>
  <circle cx="526" cy="223" r="5" fill="#3a2d22"/>
</svg>