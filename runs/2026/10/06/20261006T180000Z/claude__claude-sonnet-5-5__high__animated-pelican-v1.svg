<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f5"/>
      <stop offset="1" stop-color="#e8f6fd"/>
    </linearGradient>
    <g id="wheel">
      <circle r="85" fill="none" stroke="#222" stroke-width="8"/>
      <circle r="79" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#8a8a8a" stroke-width="1.2">
        <line x1="-78" y1="0" x2="78" y2="0"/>
        <line x1="-78" y1="0" x2="78" y2="0" transform="rotate(30)"/>
        <line x1="-78" y1="0" x2="78" y2="0" transform="rotate(60)"/>
        <line x1="-78" y1="0" x2="78" y2="0" transform="rotate(90)"/>
        <line x1="-78" y1="0" x2="78" y2="0" transform="rotate(120)"/>
        <line x1="-78" y1="0" x2="78" y2="0" transform="rotate(150)"/>
      </g>
      <circle cx="0" cy="-70" r="3" fill="#d33"/>
      <circle r="8" fill="#555" stroke="#222" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="34" fill="#ffe27a"/>
  <ellipse cx="170" cy="80" rx="50" ry="14" fill="#fff" opacity="0.8"/>
  <ellipse cx="205" cy="70" rx="32" ry="12" fill="#fff" opacity="0.8"/>
  <rect x="0" y="429" width="800" height="51" fill="#d9c38c"/>
  <g>
    <line x1="0" y1="446" x2="1100" y2="446" stroke="#b39c63" stroke-width="5" stroke-dasharray="60 118"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-178 0" dur="3s" repeatCount="indefinite"/>
  </g>
  <line x1="0" y1="429" x2="800" y2="429" stroke="#8a7a4a" stroke-width="2"/>

  <!-- wheels -->
  <g transform="translate(250,340)">
    <g>
      <use href="#wheel"/>
      <circle r="10" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="3 2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(590,340)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#444" stroke-width="2" fill="none">
    <line x1="395" y1="323" x2="250" y2="331"/>
    <line x1="395" y1="367" x2="250" y2="349"/>
  </g>

  <!-- far crank + pedal -->
  <g transform="translate(395,345)">
    <g>
      <line x1="0" y1="0" x2="38" y2="0" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(38,0)">
        <g>
          <rect x="-10" y="4" width="22" height="4" rx="1" fill="#222"/>
          <path d="M-7,-4 C4,-6 16,-3 22,3 L17,4 L21,9 L11,6 L8,11 L-3,6 Z" fill="#222"/>
          <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="2s" repeatCount="indefinite"/>
        </g>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2a2a2a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M372,232 L427.6,292.3 L357,345">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M372,232 L427.6,292.3 L357,345;
      M372,232 L437.7,281.2 L362.1,326;
      M372,232 L448.4,262 L376,312.1;
      M372,232 L453.5,241.2 L395,307;
      M372,232 L454,233.6 L414,312.1;
      M372,232 L453.3,241.8 L427.9,326;
      M372,232 L449.5,258.6 L433,345;
      M372,232 L440.6,276.9 L427.9,364;
      M372,232 L428.7,291.3 L414,377.9;
      M372,232 L419.9,298.6 L395,383;
      M372,232 L417.4,300.3 L376,377.9;
      M372,232 L420.4,298.2 L362.1,364;
      M372,232 L427.6,292.3 L357,345"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="340" x2="395" y2="345"/>
    <line x1="395" y1="345" x2="365" y2="228"/>
    <line x1="365" y1="238" x2="525" y2="236"/>
    <line x1="395" y1="345" x2="527" y2="248"/>
    <line x1="250" y1="340" x2="365" y2="242"/>
    <path d="M532,240 C545,275 575,310 590,340" stroke="#a52f24"/>
    <line x1="522" y1="222" x2="532" y2="254" stroke-width="9" stroke="#8e2a20"/>
  </g>
  <circle cx="395" cy="345" r="8" fill="#444" stroke="#222" stroke-width="2"/>

  <!-- seat post + saddle -->
  <line x1="365" y1="226" x2="364" y2="240" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <path d="M333,222 C345,213 382,215 397,223 C393,231 345,233 333,222 Z" fill="#222"/>

  <!-- handlebar -->
  <g fill="none" stroke="#444" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="521" y1="222" x2="517" y2="198"/>
    <path d="M517,198 C532,190 552,192 558,204 C560,210 556,214 552,213"/>
  </g>
  <circle cx="541" cy="194" r="5" fill="#222"/>

  <!-- pelican tail + body -->
  <polygon points="338,204 296,222 302,230 340,226" fill="#4e392b"/>
  <path d="M330,218 C322,190 350,160 395,160 C440,160 455,190 438,214 C420,236 360,240 330,218 Z" fill="#7a5c45" stroke="#4a3426" stroke-width="2"/>
  <path d="M360,218 C390,230 425,222 436,205 C420,215 385,222 360,218 Z" fill="#a38468" opacity="0.8"/>

  <!-- neck -->
  <path d="M420,186 C444,166 422,136 448,108" fill="none" stroke="#5a4030" stroke-width="26" stroke-linecap="round"/>
  <path d="M428,188 C452,168 430,138 456,112" fill="none" stroke="#fbfaf4" stroke-width="20" stroke-linecap="round"/>

  <!-- head + bill -->
  <ellipse cx="463" cy="102" rx="24" ry="18" fill="#fbfaf4" stroke="#d8d4c4" stroke-width="1"/>
  <path d="M443,96 C448,82 470,80 484,92 C470,90 455,92 443,96 Z" fill="#f2dc86"/>
  <path d="M480,106 L586,124 C560,146 505,138 480,106 Z" fill="#8f7f63"/>
  <path d="M478,92 L588,121 L586,125 L480,107 Z" fill="#a89a80" stroke="#7d705a" stroke-width="1"/>
  <path d="M586,121 L591,129 L585,126 Z" fill="#6f634e"/>
  <circle cx="469" cy="96" r="3.6" fill="#111"/>
  <circle cx="470" cy="95" r="1.1" fill="#fff"/>

  <!-- near chainring + crank + pedal -->
  <g transform="translate(395,345)">
    <g>
      <circle r="20" fill="none" stroke="#777" stroke-width="5" stroke-dasharray="4 2"/>
      <line x1="0" y1="0" x2="38" y2="0" stroke="#555" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(38,0)">
        <g>
          <rect x="-10" y="4" width="22" height="4" rx="1" fill="#111"/>
          <path d="M-7,-4 C4,-6 16,-3 22,3 L17,4 L21,9 L11,6 L8,11 L-3,6 Z" fill="#3a3a3a"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        </g>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#3b3b3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M372,232 L449.5,258.6 L433,345">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M372,232 L449.5,258.6 L433,345;
      M372,232 L440.6,276.9 L427.9,364;
      M372,232 L428.7,291.3 L414,377.9;
      M372,232 L419.9,298.6 L395,383;
      M372,232 L417.4,300.3 L376,377.9;
      M372,232 L420.4,298.2 L362.1,364;
      M372,232 L427.6,292.3 L357,345;
      M372,232 L437.7,281.2 L362.1,326;
      M372,232 L448.4,262 L376,312.1;
      M372,232 L453.5,241.2 L395,307;
      M372,232 L454,233.6 L414,312.1;
      M372,232 L453.3,241.8 L427.9,326;
      M372,232 L449.5,258.6 L433,345"/>
  </path>
  <circle cx="372" cy="230" r="9" fill="#6a4f3c"/>

  <!-- wing to handlebar -->
  <path d="M392,168 C430,165 490,180 543,192 C548,196 546,202 538,202 C490,206 430,208 398,198 C385,190 385,175 392,168 Z" fill="#6b4f3b" stroke="#4a3426" stroke-width="2"/>
  <g stroke="#4a3426" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M410,180 C450,184 495,192 530,196"/>
    <path d="M410,190 C450,194 490,199 525,200"/>
  </g>
  <path d="M520,190 C535,190 546,193 546,197 C546,201 536,203 520,202 Z" fill="#3e2c21"/>
</svg>