<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecbf0"/>
      <stop offset="1" stop-color="#fdf1d6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="660" cy="80" r="34" fill="#ffe48a" opacity="0.9"/>

  <g fill="#ffffff" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="1000 0" dur="40s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="90" rx="50" ry="16"/>
      <ellipse cx="30" cy="78" rx="34" ry="16"/>
      <ellipse cx="-28" cy="80" rx="26" ry="12"/>
    </g>
  </g>

  <rect x="0" y="330" width="800" height="93" fill="#5fb3c9"/>
  <rect x="0" y="423" width="800" height="77" fill="#e8d9b0"/>
  <g stroke="#b59d6a" stroke-width="5" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-134 0" dur="0.4s" repeatCount="indefinite"/>
      <line x1="0" y1="462" x2="60" y2="462"/>
      <line x1="134" y1="462" x2="194" y2="462"/>
      <line x1="268" y1="462" x2="328" y2="462"/>
      <line x1="402" y1="462" x2="462" y2="462"/>
      <line x1="536" y1="462" x2="596" y2="462"/>
      <line x1="670" y1="462" x2="730" y2="462"/>
      <line x1="804" y1="462" x2="864" y2="462"/>
      <line x1="938" y1="462" x2="998" y2="462"/>
    </g>
  </g>
  <ellipse cx="400" cy="428" rx="200" ry="7" fill="#000000" opacity="0.15"/>

  <!-- Rear wheel -->
  <g transform="translate(250 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
      <circle r="80" fill="none" stroke="#1f1f1f" stroke-width="6"/>
      <circle r="73" fill="none" stroke="#bdbdbd" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-73" y1="0" x2="73" y2="0"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(22.5)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(45)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(67.5)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(90)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(112.5)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(135)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="66" cy="0" r="4" fill="#ff6a2b"/>
      <circle r="7" fill="#555"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g transform="translate(550 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
      <circle r="80" fill="none" stroke="#1f1f1f" stroke-width="6"/>
      <circle r="73" fill="none" stroke="#bdbdbd" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-73" y1="0" x2="73" y2="0"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(22.5)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(45)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(67.5)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(90)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(112.5)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(135)"/>
        <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="66" cy="0" r="4" fill="#ff6a2b"/>
      <circle r="7" fill="#555"/>
    </g>
  </g>

  <!-- Far crank, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 350" to="360 380 350" dur="2s" repeatCount="indefinite"/>
    <line x1="380" y1="350" x2="350" y2="350" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(350 350)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="3" width="24" height="5" rx="2" fill="#111"/>
        <path d="M-4 -4 Q10 -6 22 3 L-4 3 Z" fill="#4a4a4a"/>
        <path d="M8 -1 L22 3 M12 -2 L20 3" stroke="#2a2a2a" stroke-width="1" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Far leg -->
  <path fill="none" stroke="#555555" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M335 248 L400 291 L350 350">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M335 248 L400 291 L350 350;M335 248 L407 278 L354 335;M335 248 L412 262 L365 324;M335 248 L413 249 L380 320;M335 248 L413 248 L395 324;M335 248 L412 257 L406 335;M335 248 L409 272 L410 350;M335 248 L402 287 L406 365;M335 248 L395 298 L395 376;M335 248 L391 303 L380 380;M335 248 L391 302 L365 376;M335 248 L395 298 L354 365;M335 248 L400 291 L350 350"/>
  </path>

  <!-- Frame -->
  <g fill="none" stroke="#17877f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 340 L380 350"/>
    <path d="M250 340 L346 258"/>
    <path d="M380 350 L346 258"/>
    <path d="M346 258 L503 240"/>
    <path d="M380 350 L508 264"/>
    <path d="M503 236 L510 266" stroke="#0e5d58" stroke-width="9"/>
  </g>
  <path d="M510 264 L550 340" stroke="#444" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M503 238 L496 214" stroke="#888" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M494 214 H512 Q530 212 534 234" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M346 258 L338 243" stroke="#999" stroke-width="5" stroke-linecap="round"/>

  <!-- Chain and rear cog -->
  <g stroke="#333" stroke-width="2" stroke-dasharray="3 2" fill="none">
    <line x1="380" y1="332" x2="250" y2="332"/>
    <line x1="380" y1="368" x2="250" y2="348"/>
  </g>
  <circle cx="250" cy="340" r="8" fill="none" stroke="#666" stroke-width="3"/>

  <!-- Saddle -->
  <path d="M312 243 Q312 236 326 237 L360 236 Q367 236 364 241 Q340 247 312 243 Z" fill="#222"/>

  <!-- Pelican tail and body -->
  <path d="M305 212 L262 236 L274 248 L308 232 Z" fill="#4b3a2c"/>
  <path d="M268 240 L282 244 M274 234 L288 240" stroke="#2f241b" stroke-width="2" fill="none"/>
  <ellipse cx="345" cy="212" rx="52" ry="33" fill="#6f5a48" transform="rotate(12 345 212)"/>
  <ellipse cx="360" cy="222" rx="34" ry="20" fill="#8c7863" transform="rotate(12 360 222)"/>

  <!-- Neck -->
  <path d="M372 200 C395 185 380 155 408 135" fill="none" stroke="#f7f2e2" stroke-width="22" stroke-linecap="round"/>
  <path d="M361 195 C384 178 369 152 396 131" fill="none" stroke="#4a2f20" stroke-width="7" stroke-linecap="round"/>

  <!-- Head and bill -->
  <circle cx="416" cy="120" r="17" fill="#fbf8ee"/>
  <path d="M400 114 Q416 98 432 112 Q416 107 400 114 Z" fill="#f3d36b"/>
  <path d="M428 112 L505 138 Q512 142 506 146 L430 128 Z" fill="#8b8a7a"/>
  <path d="M430 124 L502 146 Q470 166 436 135 Z" fill="#b7a98a"/>
  <circle cx="507" cy="141" r="3.5" fill="#e0652d"/>
  <circle cx="424" cy="116" r="3" fill="#1a1a1a"/>
  <circle cx="425" cy="115" r="1" fill="#ffffff"/>

  <!-- Near crank and chainring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 350" to="360 380 350" dur="2s" repeatCount="indefinite"/>
    <circle cx="380" cy="350" r="18" fill="none" stroke="#555" stroke-width="3"/>
    <g stroke="#666" stroke-width="2">
      <line x1="380" y1="350" x2="380" y2="334"/>
      <line x1="380" y1="350" x2="395" y2="345"/>
      <line x1="380" y1="350" x2="386" y2="365"/>
      <line x1="380" y1="350" x2="371" y2="364"/>
      <line x1="380" y1="350" x2="365" y2="345"/>
    </g>
    <line x1="380" y1="350" x2="410" y2="350" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="380" cy="350" r="5" fill="#999"/>
    <g transform="translate(410 350)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="3" width="24" height="5" rx="2" fill="#111"/>
        <path d="M-4 -4 Q10 -6 22 3 L-4 3 Z" fill="#333"/>
        <path d="M8 -1 L22 3 M12 -2 L20 3" stroke="#1a1a1a" stroke-width="1" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Near leg -->
  <path fill="none" stroke="#333333" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M335 248 L409 272 L410 350">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M335 248 L409 272 L410 350;M335 248 L402 287 L406 365;M335 248 L395 298 L395 376;M335 248 L391 303 L380 380;M335 248 L391 302 L365 376;M335 248 L395 298 L354 365;M335 248 L400 291 L350 350;M335 248 L407 278 L354 335;M335 248 L412 262 L365 324;M335 248 L413 249 L380 320;M335 248 L413 248 L395 324;M335 248 L412 257 L406 335;M335 248 L409 272 L410 350"/>
  </path>
  <ellipse cx="340" cy="243" rx="20" ry="13" fill="#6f5a48"/>

  <!-- Near wing gripping the handlebar -->
  <path d="M358 185 Q420 175 470 200 Q500 210 522 213 L518 223 Q480 227 450 219 Q400 206 362 220 Z" fill="#4b3a2c"/>
  <path d="M380 205 Q420 198 460 212 M390 213 Q425 207 470 218" stroke="#7a6350" stroke-width="2" fill="none"/>
  <circle cx="520" cy="218" r="6" fill="#3a2d22"/>
</svg>