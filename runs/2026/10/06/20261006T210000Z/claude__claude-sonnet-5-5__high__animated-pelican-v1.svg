<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset="1" stop-color="#e6f6fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#2b2b2b" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#b9bfc4" stroke-width="2"/>
      <g stroke="#9aa0a6" stroke-width="1.2">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(22.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(45)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(67.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(112.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(135)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="8" fill="#6f757b"/>
      <circle cx="0" cy="-57" r="3.5" fill="#e53935"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="80" rx="50" ry="14"/>
    <ellipse cx="180" cy="68" rx="32" ry="12"/>
    <ellipse cx="520" cy="55" rx="44" ry="12"/>
    <ellipse cx="545" cy="44" rx="26" ry="10"/>
  </g>

  <rect x="0" y="431" width="800" height="69" fill="#c9bb94"/>
  <rect x="0" y="431" width="800" height="6" fill="#8f8a80"/>
  <g fill="#f4f1e6">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-110 0" dur="0.4s" repeatCount="indefinite"/>
      <rect x="0" y="462" width="55" height="5"/>
      <rect x="110" y="462" width="55" height="5"/>
      <rect x="220" y="462" width="55" height="5"/>
      <rect x="330" y="462" width="55" height="5"/>
      <rect x="440" y="462" width="55" height="5"/>
      <rect x="550" y="462" width="55" height="5"/>
      <rect x="660" y="462" width="55" height="5"/>
      <rect x="770" y="462" width="55" height="5"/>
      <rect x="880" y="462" width="55" height="5"/>
    </g>
  </g>
  <ellipse cx="405" cy="436" rx="190" ry="7" fill="#000" opacity="0.18"/>

  <!-- wheels -->
  <g transform="translate(250,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(560,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far crank arm and pedal -->
  <g transform="translate(380,372)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-28" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-28,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-9" y="-2.5" width="18" height="5" rx="2" fill="#222"/>
          <ellipse cx="5" cy="-5" rx="11" ry="3.5" fill="#4a4540"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <polyline fill="none" stroke="#2c2824" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" points="350,262 400.3,310.7 352,372">
    <animate attributeName="points" dur="1.6s" repeatCount="indefinite" calcMode="linear"
      values="350,262 400.3,310.7 352,372;
              350,262 408.5,300.5 355.8,358;
              350,262 415.3,287.3 366,347.8;
              350,262 418.5,276.2 380,344;
              350,262 419,273.9 394,347.8;
              350,262 417.3,281.1 404.3,358;
              350,262 412.2,294.1 408,372;
              350,262 402.8,308 404.3,386;
              350,262 391.6,318.3 394,396.3;
              350,262 385.7,322.2 380,400;
              350,262 387.3,321.2 366,396.3;
              350,262 392.8,317.4 355.8,386;
              350,262 400.3,310.7 352,372"/>
  </polyline>

  <!-- chain -->
  <g stroke="#3a3a3a" stroke-width="2" fill="none">
    <line x1="380" y1="357" x2="250" y2="353"/>
    <line x1="380" y1="387" x2="250" y2="367"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1b8f9e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="380" y1="372" x2="352" y2="276"/>
    <line x1="352" y1="276" x2="523" y2="266"/>
    <line x1="380" y1="372" x2="527" y2="282"/>
    <line x1="380" y1="372" x2="250" y2="360"/>
    <line x1="352" y1="276" x2="250" y2="360"/>
    <line x1="522" y1="262" x2="530" y2="288" stroke-width="8"/>
    <line x1="528" y1="285" x2="560" y2="360"/>
  </g>
  <circle cx="380" cy="372" r="8" fill="#333"/>
  <circle cx="250" cy="360" r="7" fill="#444"/>
  <circle cx="250" cy="360" r="3" fill="#bbb"/>
  <circle cx="560" cy="360" r="3" fill="#bbb"/>
  <line x1="352" y1="276" x2="349" y2="268" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M328,266 Q345,261 374,266 Q377,273 366,274 Q345,272 331,272 Z" fill="#222"/>
  <line x1="522" y1="262" x2="517" y2="242" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M507,241 L530,239 Q546,239 548,255" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pelican tail and body -->
  <path d="M300,226 L258,244 L266,226 L252,216 L302,212 Z" fill="#4e3f30"/>
  <ellipse cx="348" cy="226" rx="56" ry="36" transform="rotate(-10 348 226)" fill="#8d7a5f"/>
  <ellipse cx="338" cy="240" rx="34" ry="18" transform="rotate(-10 338 240)" fill="#a69379" opacity="0.8"/>

  <!-- neck, head, bill -->
  <path d="M382,210 Q412,202 408,172 Q406,153 428,150" fill="none" stroke="#f4efe4" stroke-width="22" stroke-linecap="round"/>
  <path d="M372,200 Q398,186 397,160" fill="none" stroke="#5a4632" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="432" cy="148" rx="20" ry="15" fill="#f6f0e0"/>
  <ellipse cx="428" cy="138" rx="14" ry="7" fill="#f2d24f"/>
  <path d="M448,158 Q492,198 541,175 L448,161 Z" fill="#c9a77a"/>
  <path d="M446,140 L548,166 Q555,172 546,175 L446,160 Z" fill="#a89878"/>
  <path d="M530,170 L548,166 Q555,172 546,175 Z" fill="#6b5a40"/>
  <circle cx="438" cy="146" r="4.5" fill="#fff"/>
  <circle cx="439" cy="146" r="2.5" fill="#111"/>

  <!-- wing reaching the handlebar -->
  <path d="M352,205 Q440,212 528,234 L534,246 Q445,246 356,240 Z" fill="#5c4a38"/>
  <path d="M370,222 Q440,226 520,240" fill="none" stroke="#7a654e" stroke-width="2"/>
  <circle cx="531" cy="241" r="8" fill="#4a3b2c"/>

  <!-- near crank, chainring and pedal -->
  <g transform="translate(380,372)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="15" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="4 2"/>
      <line x1="0" y1="0" x2="28" y2="0" stroke="#666" stroke-width="6" stroke-linecap="round"/>
      <circle r="4" fill="#999"/>
      <g transform="translate(28,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-9" y="-2.5" width="18" height="5" rx="2" fill="#222"/>
          <ellipse cx="5" cy="-5" rx="11" ry="3.5" fill="#6a5f52"/>
          <path d="M12,-5 L18,-4 M12,-6 L18,-6 M11,-3 L17,-2" stroke="#4a4036" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <polyline fill="none" stroke="#4b4038" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" points="350,262 412.2,294.1 408,372">
    <animate attributeName="points" dur="1.6s" repeatCount="indefinite" calcMode="linear"
      values="350,262 412.2,294.1 408,372;
              350,262 402.8,308 404.3,386;
              350,262 391.6,318.3 394,396.3;
              350,262 385.7,322.2 380,400;
              350,262 387.3,321.2 366,396.3;
              350,262 392.8,317.4 355.8,386;
              350,262 400.3,310.7 352,372;
              350,262 408.5,300.5 355.8,358;
              350,262 415.3,287.3 366,347.8;
              350,262 418.5,276.2 380,344;
              350,262 419,273.9 394,347.8;
              350,262 417.3,281.1 404.3,358;
              350,262 412.2,294.1 408,372"/>
  </polyline>
  <circle cx="350" cy="262" r="6" fill="#6b5842"/>
</svg>