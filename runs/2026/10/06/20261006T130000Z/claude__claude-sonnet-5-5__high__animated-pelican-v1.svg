<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ee"/>
      <stop offset="1" stop-color="#fdf1d6"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="0.9">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(22.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(45)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(67.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(112.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(135)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-59" r="3" fill="#e0402f"/>
      <circle r="7" fill="#666" stroke="#333" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#fff3b0" opacity="0.9"/>
  <rect y="330" width="800" height="90" fill="#6fb3c9"/>
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M40,350 q15,-6 30,0 t30,0"/>
    <path d="M300,365 q15,-6 30,0 t30,0"/>
    <path d="M620,345 q15,-6 30,0 t30,0"/>
    <path d="M150,395 q15,-6 30,0 t30,0"/>
    <path d="M520,400 q15,-6 30,0 t30,0"/>
  </g>
  <rect y="420" width="800" height="80" fill="#e6d3a6"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#c9b58a" stroke-width="2"/>
  <g>
    <line x1="0" y1="458" x2="1300" y2="458" stroke="#c4ae7e" stroke-width="5" stroke-dasharray="50 60"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-440 0" dur="0.8s" repeatCount="indefinite"/>
  </g>
  <ellipse cx="400" cy="424" rx="190" ry="7" fill="#000" opacity="0.15"/>

  <!-- wheels -->
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
      <circle r="12" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="2 2"/>
    </g>
  </g>
  <g transform="translate(550,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
    </g>
  </g>

  <!-- chain and chainring -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="380" y1="339" x2="250" y2="343"/>
    <line x1="380" y1="371" x2="250" y2="357"/>
  </g>
  <g transform="translate(380,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="3 2"/>
      <circle r="11" fill="none" stroke="#777" stroke-width="1.5"/>
      <line x1="-11" y1="0" x2="11" y2="0" stroke="#777" stroke-width="1.5"/>
      <line x1="0" y1="-11" x2="0" y2="11" stroke="#777" stroke-width="1.5"/>
    </g>
  </g>

  <!-- far crank, pedal and foot -->
  <g transform="translate(380,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="38" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(38,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="2s" repeatCount="indefinite"/>
          <rect x="-10" y="-2" width="20" height="5" rx="1.5" fill="#222"/>
          <ellipse cx="3" cy="-4" rx="12" ry="3.5" fill="#2f2b28"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2f2b28" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M352,275 L398.2,313.3 L342,355">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M352,275 L398.2,313.3 L342,355;M352,275 L406.8,299.4 L347.1,336;M352,275 L412,274.1 L361,322.1;M352,275 L407.7,252.7 L380,317;M352,275 L407.7,252.6 L399,322.1;M352,275 L411.3,266 L412.9,336;M352,275 L411.1,285.4 L418,355;M352,275 L404.2,304.5 L412.9,374;M352,275 L393.8,318.1 L399,387.9;M352,275 L387.5,323.4 L380,393;M352,275 L387.7,323.2 L361,387.9;M352,275 L391.7,320 L347.1,374;M352,275 L398.2,313.3 L342,355"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#1e7f8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="380" y1="355" x2="352" y2="293"/>
    <line x1="352" y1="293" x2="510" y2="279"/>
    <line x1="380" y1="355" x2="516" y2="293"/>
    <line x1="510" y1="275" x2="518" y2="297" stroke-width="8"/>
    <line x1="380" y1="355" x2="250" y2="350" stroke-width="5"/>
    <line x1="352" y1="295" x2="250" y2="350" stroke-width="4"/>
    <line x1="518" y1="297" x2="550" y2="350" stroke-width="5"/>
  </g>
  <line x1="352" y1="293" x2="350" y2="283" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <path d="M322,284 Q330,277 352,279 L376,281 Q382,285 374,287 L330,288 Q320,288 322,284 Z" fill="#1c1c1c"/>
  <line x1="510" y1="275" x2="505" y2="258" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M505,258 Q525,250 540,258 Q546,262 543,270" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <circle cx="380" cy="355" r="5" fill="#444"/>

  <!-- tail and body -->
  <path d="M302,230 L250,250 L256,262 L306,254 Z" fill="#4a3727"/>
  <path d="M290,240 L258,254" stroke="#7a6048" stroke-width="2"/>
  <ellipse cx="348" cy="238" rx="64" ry="40" transform="rotate(-12 348 238)" fill="#85705c"/>
  <ellipse cx="350" cy="250" rx="48" ry="22" transform="rotate(-12 350 250)" fill="#a8977f"/>

  <!-- neck and head -->
  <path d="M392,232 C425,222 405,190 430,170" fill="none" stroke="#f1e8d8" stroke-width="22" stroke-linecap="round"/>
  <path d="M382,224 C410,213 393,186 418,164" fill="none" stroke="#5b4030" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="441" cy="160" rx="19" ry="14" transform="rotate(15 441 160)" fill="#f7f0e2"/>
  <ellipse cx="439" cy="150" rx="14" ry="6" transform="rotate(10 439 150)" fill="#f0cf6a"/>
  <path d="M456,154 L534,176 Q540,180 535,184 L456,170 Z" fill="#b3a58f"/>
  <path d="M458,170 Q494,206 535,184 Z" fill="#8d7b66"/>
  <circle cx="536" cy="180" r="3.5" fill="#d9832b"/>
  <circle cx="448" cy="157" r="3.4" fill="#fff"/>
  <circle cx="448.5" cy="157" r="2.2" fill="#111"/>

  <!-- near leg -->
  <path fill="none" stroke="#4b4540" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M352,275 L411.1,285.4 L418,355">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M352,275 L411.1,285.4 L418,355;M352,275 L404.2,304.5 L412.9,374;M352,275 L393.8,318.1 L399,387.9;M352,275 L387.5,323.4 L380,393;M352,275 L387.7,323.2 L361,387.9;M352,275 L391.7,320 L347.1,374;M352,275 L398.2,313.3 L342,355;M352,275 L406.8,299.4 L347.1,336;M352,275 L412,274.1 L361,322.1;M352,275 L407.7,252.7 L380,317;M352,275 L407.7,252.6 L399,322.1;M352,275 L411.3,266 L412.9,336;M352,275 L411.1,285.4 L418,355"/>
  </path>

  <!-- near wing gripping handlebar -->
  <path d="M378,224 C430,212 500,236 542,258 L544,268 C500,262 440,252 388,252 Z" fill="#5a4331"/>
  <path d="M400,238 Q450,236 500,256 M396,246 Q446,246 520,262" fill="none" stroke="#8a6f55" stroke-width="2" stroke-linecap="round"/>
  <circle cx="542" cy="263" r="5" fill="#3a2b1f"/>

  <!-- near crank, pedal and foot -->
  <g transform="translate(380,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="38" y2="0" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <circle r="6" fill="#999" stroke="#444" stroke-width="2"/>
      <g transform="translate(38,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-10" y="-2" width="20" height="5" rx="1.5" fill="#222"/>
          <ellipse cx="3" cy="-4" rx="12" ry="3.5" fill="#4b4540"/>
          <path d="M8,-5 L14,-3 M5,-6 L12,-4" stroke="#2f2b28" stroke-width="1" fill="none"/>
        </g>
      </g>
    </g>
  </g>
</svg>