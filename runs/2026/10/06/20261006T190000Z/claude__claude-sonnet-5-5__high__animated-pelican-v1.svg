<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset="1" stop-color="#e9f6fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5db6d6"/>
      <stop offset="1" stop-color="#2f84ac"/>
    </linearGradient>
    <g id="spokes" stroke="#9a9a9a" stroke-width="1.6" stroke-linecap="round">
      <line x1="-73" y1="0" x2="73" y2="0"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(22.5)"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(45)"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(67.5)"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(90)"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(112.5)"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(135)"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(157.5)"/>
    </g>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe28a" opacity="0.9"/>
  <ellipse cx="150" cy="80" rx="60" ry="16" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="190" cy="68" rx="40" ry="14" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="520" cy="130" rx="50" ry="12" fill="#ffffff" opacity="0.7"/>
  <rect x="0" y="290" width="800" height="130" fill="url(#sea)"/>
  <path d="M0 310 Q40 302 80 310 T160 310 T240 310 T320 310 T400 310 T480 310 T560 310 T640 310 T720 310 T800 310" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <rect x="0" y="420" width="800" height="80" fill="#5b5f66"/>
  <rect x="0" y="420" width="800" height="6" fill="#7c8088"/>
  <line x1="-200" y1="465" x2="1000" y2="465" stroke="#f2f2f2" stroke-width="5" stroke-dasharray="100 100">
    <animate attributeName="stroke-dashoffset" from="0" to="200" dur="0.477s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="395" cy="424" rx="215" ry="8" fill="#000000" opacity="0.25"/>

  <!-- rear wheel -->
  <g transform="translate(235 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="80" fill="none" stroke="#222222" stroke-width="6"/>
      <circle r="73" fill="none" stroke="#b8b8b8" stroke-width="2"/>
      <use href="#spokes"/>
      <circle r="9" fill="none" stroke="#666666" stroke-width="3" stroke-dasharray="3 2"/>
      <circle cx="58" cy="0" r="3" fill="#e8402a"/>
      <circle r="6" fill="#555555"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(555 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="80" fill="none" stroke="#222222" stroke-width="6"/>
      <circle r="73" fill="none" stroke="#b8b8b8" stroke-width="2"/>
      <use href="#spokes"/>
      <circle cx="58" cy="0" r="3" fill="#e8402a"/>
      <circle r="6" fill="#555555"/>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M235 340 L390 350"/>
    <path d="M235 340 L346 264"/>
    <path d="M390 350 L346 262"/>
    <path d="M346 266 L516 238"/>
    <path d="M390 350 L520 248"/>
    <path d="M514 228 L523 254" stroke-width="9"/>
    <path d="M522 250 L555 340" stroke="#a82e22"/>
  </g>
  <g fill="none" stroke="#444444" stroke-linecap="round" stroke-linejoin="round">
    <path d="M344 262 L343 254" stroke-width="5"/>
    <path d="M514 228 L511 210" stroke-width="5"/>
    <path d="M503 208 L528 208 Q553 208 551 236" stroke-width="5"/>
  </g>

  <!-- chain -->
  <g fill="none" stroke="#3a3a3a" stroke-width="2">
    <path d="M390 334 L235 332"/>
    <path d="M390 366 L235 348"/>
  </g>

  <!-- crank, chainring, pedals, feet -->
  <g transform="translate(390 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#666666" stroke-width="3" stroke-dasharray="4 2"/>
      <line x1="0" y1="0" x2="-38" y2="0" stroke="#9a9a9a" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-38 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="0" width="20" height="4" rx="1.5" fill="#333333"/>
          <path d="M-7 -4 Q4 -5 15 -1 L16 2 Q4 3 -7 2 Z" fill="#2a2522"/>
        </g>
      </g>
      <line x1="0" y1="0" x2="38" y2="0" stroke="#555555" stroke-width="6" stroke-linecap="round"/>
      <circle r="6" fill="#333333"/>
      <g transform="translate(38 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="0" width="20" height="4" rx="1.5" fill="#333333"/>
          <path d="M-7 -4 Q4 -5 15 -1 L16 2 Q4 3 -7 2 Z" fill="#3b3430"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#1f1b19" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M345 250 L409.3 294.2 L352 350">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="M345 250 L409.3 294.2 L352 350;M345 250 L417.6 278.6 L357.1 331;M345 250 L422.8 256.1 L371 317.1;M345 250 L422.2 238.8 L390 312;M345 250 L422.1 238.2 L409 317.1;M345 250 L423 251 L422.9 331;M345 250 L420.3 270.4 L428 350;M345 250 L412.1 289.7 L422.9 369;M345 250 L402.1 303.2 L409 382.9;M345 250 L396.8 308.3 L390 388;M345 250 L397.7 307.5 L371 382.9;M345 250 L402.3 303 L357.1 369;M345 250 L409.3 294.2 L352 350"/>
  </path>

  <!-- tail -->
  <path d="M268 225 L222 252 L240 260 L284 246 Z" fill="#4a3f35"/>

  <!-- body -->
  <path d="M262 222 Q272 190 330 178 Q392 168 414 198 Q420 232 380 246 Q330 252 290 244 Q268 238 262 222 Z" fill="#7a6a58"/>
  <path d="M300 238 Q350 252 395 232 Q410 222 412 208 Q400 240 350 246 Q315 246 300 238 Z" fill="#a89a86"/>
  <path d="M375 188 Q320 172 272 214 Q322 218 372 210 Z" fill="#4a3d32"/>
  <path d="M300 200 L340 204 M290 212 L345 214 M310 190 L350 194" stroke="#6b5a4a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- near leg -->
  <path fill="none" stroke="#2e2926" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M345 250 L420.3 270.4 L428 350">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="M345 250 L420.3 270.4 L428 350;M345 250 L412.1 289.7 L422.9 369;M345 250 L402.1 303.2 L409 382.9;M345 250 L396.8 308.3 L390 388;M345 250 L397.7 307.5 L371 382.9;M345 250 L402.3 303 L357.1 369;M345 250 L409.3 294.2 L352 350;M345 250 L417.6 278.6 L357.1 331;M345 250 L422.8 256.1 L371 317.1;M345 250 L422.2 238.8 L390 312;M345 250 L422.1 238.2 L409 317.1;M345 250 L423 251 L422.9 331;M345 250 L420.3 270.4 L428 350"/>
  </path>
  <ellipse cx="346" cy="245" rx="22" ry="12" fill="#7a6a58"/>

  <!-- saddle -->
  <path d="M320 249 Q342 244 372 250 Q372 256 360 256 Q336 255 320 254 Z" fill="#222222"/>

  <!-- neck -->
  <path d="M395 195 Q420 170 408 140 Q404 125 425 115" fill="none" stroke="#f4f1ea" stroke-width="24" stroke-linecap="round"/>
  <path d="M386 194 Q408 166 396 138 Q392 122 412 110" fill="none" stroke="#5b3a24" stroke-width="8" stroke-linecap="round"/>

  <!-- head and bill -->
  <ellipse cx="432" cy="112" rx="24" ry="18" fill="#f7f3ea"/>
  <ellipse cx="430" cy="98" rx="15" ry="7" fill="#f2d675"/>
  <path d="M452 102 Q500 112 550 138 Q552 143 546 144 Q498 130 452 122 Z" fill="#9b958a"/>
  <path d="M452 122 Q495 134 546 144 Q500 168 456 134 Z" fill="#6b5d4d"/>
  <path d="M538 136 Q552 138 550 146 Q546 148 543 144 Z" fill="#b5452f"/>
  <circle cx="442" cy="108" r="3.5" fill="#1a1a1a"/>
  <circle cx="443" cy="107" r="1" fill="#ffffff"/>

  <!-- wing reaching handlebar -->
  <path d="M375 192 Q420 225 470 222 Q505 218 528 208" fill="none" stroke="#5a4a3c" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M385 198 Q425 228 470 226" fill="none" stroke="#7a6a58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="528" cy="208" r="7" fill="#3a2f27"/>
</svg>