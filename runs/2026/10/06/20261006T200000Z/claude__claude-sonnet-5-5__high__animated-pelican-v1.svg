<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ec"/>
      <stop offset="1" stop-color="#e9f6fa"/>
    </linearGradient>
    <g id="spokes" stroke="#8a949c" stroke-width="1.3" fill="none">
      <line x1="-64" y1="0" x2="64" y2="0"/>
      <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(22.5)"/>
      <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(45)"/>
      <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(67.5)"/>
      <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
      <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(112.5)"/>
      <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(135)"/>
      <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(157.5)"/>
    </g>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#ffe9a3"/>
  <rect x="0" y="423" width="800" height="77" fill="#d9c593"/>
  <rect x="0" y="423" width="800" height="6" fill="#b9a574"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#f6efd9" stroke-width="4" stroke-dasharray="30 20">
    <animate attributeName="stroke-dashoffset" from="0" to="50" dur="0.18s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="426" rx="210" ry="8" fill="#000" opacity="0.15"/>

  <!-- rear wheel -->
  <g transform="translate(230,350)">
    <circle r="70" fill="none" stroke="#1d1d1d" stroke-width="7"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="64" fill="none" stroke="#c4ccd2" stroke-width="2"/>
      <use href="#spokes"/>
      <circle cx="0" cy="-58" r="3.5" fill="#d9381e"/>
      <circle r="8" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 2"/>
      <circle r="5" fill="#777"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(570,350)">
    <circle r="70" fill="none" stroke="#1d1d1d" stroke-width="7"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="64" fill="none" stroke="#c4ccd2" stroke-width="2"/>
      <use href="#spokes"/>
      <circle cx="0" cy="-58" r="3.5" fill="#d9381e"/>
      <circle r="6" fill="#777"/>
    </g>
  </g>

  <!-- far crank, pedal, far leg -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 360" to="360 380 360" dur="2s" repeatCount="indefinite"/>
    <line x1="380" y1="360" x2="350" y2="360" stroke="#8d949a" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 350 360" to="-360 350 360" dur="2s" repeatCount="indefinite"/>
      <rect x="340" y="358" width="20" height="5" rx="1.5" fill="#222"/>
      <ellipse cx="352" cy="355" rx="11" ry="4.5" fill="#444"/>
    </g>
  </g>
  <path fill="none" stroke="#555" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M345 240 L405.4 295.5 L350 360">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M345 240 L405.4 295.5 L350 360;M345 240 L417.9 277.7 L358.8 338.8;M345 240 L425 257.9 L380 330;M345 240 L425.2 257.2 L401.2 338.8;M345 240 L418.9 275.5 L410 360;M345 240 L404.7 296.3 L401.2 381.2;M345 240 L393.5 306.1 L380 390;M345 240 L395.5 304.6 L358.8 381.2;M345 240 L405.4 295.5 L350 360"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#1e6f8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="230" y1="350" x2="380" y2="360"/>
    <line x1="230" y1="350" x2="345" y2="258"/>
    <line x1="380" y1="360" x2="345" y2="258"/>
    <line x1="345" y1="258" x2="510" y2="256"/>
    <line x1="380" y1="360" x2="522" y2="288"/>
    <line x1="510" y1="254" x2="523" y2="290" stroke-width="8"/>
    <path d="M523 290 Q 540 318 570 350" stroke="#8d949a" stroke-width="5"/>
  </g>
  <!-- seat post and saddle -->
  <line x1="345" y1="258" x2="341" y2="243" stroke="#8d949a" stroke-width="5" stroke-linecap="round"/>
  <path d="M316 243 Q 340 236 374 241 Q 377 249 360 250 Q 335 251 316 247 Z" fill="#2b2b2b"/>
  <!-- handlebar -->
  <g fill="none" stroke="#8d949a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="510" y1="254" x2="503" y2="235"/>
    <path d="M500 235 L 524 232 Q 548 230 546 252" stroke="#333"/>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="2.5" fill="none" stroke-dasharray="4 3">
    <line x1="230" y1="343" x2="380" y2="344">
      <animate attributeName="stroke-dashoffset" from="7" to="0" dur="0.14s" repeatCount="indefinite"/>
    </line>
    <line x1="380" y1="376" x2="230" y2="357">
      <animate attributeName="stroke-dashoffset" from="7" to="0" dur="0.14s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- chainring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 360" to="360 380 360" dur="2s" repeatCount="indefinite"/>
    <circle cx="380" cy="360" r="16" fill="none" stroke="#666" stroke-width="5" stroke-dasharray="3 2"/>
    <circle cx="380" cy="360" r="11" fill="none" stroke="#999" stroke-width="1.5"/>
  </g>
  <circle cx="380" cy="360" r="6" fill="#444"/>

  <!-- near crank, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 360" to="360 380 360" dur="2s" repeatCount="indefinite"/>
    <line x1="380" y1="360" x2="410" y2="360" stroke="#a5acb2" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 410 360" to="-360 410 360" dur="2s" repeatCount="indefinite"/>
      <rect x="400" y="358" width="20" height="5" rx="1.5" fill="#222"/>
      <ellipse cx="412" cy="355" rx="11" ry="4.5" fill="#2c2c2c"/>
    </g>
  </g>
  <!-- near leg -->
  <path fill="none" stroke="#2b2b2b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M345 240 L418.9 275.5 L410 360">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M345 240 L418.9 275.5 L410 360;M345 240 L404.7 296.3 L401.2 381.2;M345 240 L393.5 306.1 L380 390;M345 240 L395.5 304.6 L358.8 381.2;M345 240 L405.4 295.5 L350 360;M345 240 L417.9 277.7 L358.8 338.8;M345 240 L425 257.9 L380 330;M345 240 L425.2 257.2 L401.2 338.8;M345 240 L418.9 275.5 L410 360"/>
  </path>

  <!-- tail -->
  <path d="M290 203 L236 224 L242 238 L292 224 Z" fill="#4a3524"/>
  <!-- body -->
  <ellipse cx="340" cy="198" rx="58" ry="40" fill="#7b6246" transform="rotate(-12 340 198)"/>
  <ellipse cx="385" cy="200" rx="18" ry="24" fill="#a08a6a" transform="rotate(-12 385 200)"/>
  <!-- arm reaching handlebar -->
  <path d="M360 203 Q 450 200 490 222 L 528 232" fill="none" stroke="#6b4a30" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="530" cy="233" r="6" fill="#3a2a1c"/>
  <!-- wing -->
  <ellipse cx="333" cy="205" rx="38" ry="21" fill="#6b4a30" transform="rotate(-8 333 205)"/>
  <path d="M300 212 Q 320 224 352 220" fill="none" stroke="#4a3322" stroke-width="3" stroke-linecap="round"/>
  <!-- neck -->
  <path d="M378 188 C 408 176 398 142 424 126" fill="none" stroke="#5b3a24" stroke-width="16" stroke-linecap="round"/>
  <path d="M386 190 C 416 180 408 148 432 132" fill="none" stroke="#f4eddb" stroke-width="6" stroke-linecap="round"/>
  <!-- head -->
  <ellipse cx="430" cy="122" rx="17" ry="14" fill="#fbf3d6"/>
  <ellipse cx="428" cy="112" rx="12" ry="6" fill="#f2d45c"/>
  <!-- bill and pouch -->
  <path d="M443 131 L 516 150 Q 490 178 450 142 Z" fill="#8f7a5c"/>
  <path d="M441 113 L 514 142 Q 523 146 518 151 L 443 132 Z" fill="#b59b7a"/>
  <path d="M514 142 Q 523 146 518 151" fill="none" stroke="#6e5a40" stroke-width="2"/>
  <!-- eye -->
  <circle cx="437" cy="119" r="3.2" fill="#1a1a1a"/>
  <circle cx="438" cy="118" r="1" fill="#fff"/>
</svg>