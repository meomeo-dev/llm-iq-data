<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="1" stop-color="#d9f1fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="65" fill="none" stroke="#b8b8b8" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1">
        <line x1="-65" y1="0" x2="65" y2="0"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(22.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(45)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(67.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(90)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(112.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(135)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#555"/>
      <circle cx="0" cy="-60" r="3.5" fill="#ff9f1c"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="690" cy="80" r="34" fill="#ffd966"/>
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="1000 0" dur="60s" repeatCount="indefinite"/>
      <ellipse cx="100" cy="90" rx="40" ry="14"/>
      <ellipse cx="130" cy="78" rx="28" ry="14"/>
      <ellipse cx="75" cy="82" rx="24" ry="11"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="700 0" dur="85s" repeatCount="indefinite"/>
      <ellipse cx="500" cy="150" rx="46" ry="12"/>
      <ellipse cx="530" cy="140" rx="28" ry="12"/>
      <ellipse cx="475" cy="142" rx="22" ry="10"/>
    </g>
  </g>
  <rect y="320" width="800" height="80" fill="#3d8fb5"/>
  <rect y="320" width="800" height="6" fill="#8fd0e8"/>
  <rect y="395" width="800" height="28" fill="#e8d7a8"/>
  <rect y="423" width="800" height="77" fill="#5d5d66"/>
  <line x1="0" y1="466" x2="960" y2="466" stroke="#f5f5f5" stroke-width="5" stroke-dasharray="50 70">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.314s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="410" cy="432" rx="200" ry="8" fill="#000" opacity="0.25"/>

  <!-- far leg -->
  <path d="M352 236 L421 293.8 L355 355" fill="none" stroke="#262626" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2.4s" repeatCount="indefinite" values="M352 236 L421 293.8 L355 355;M352 236 L432 277.2 L361 332.5;M352 236 L440.6 251.8 L377.5 316;M352 236 L441.9 230.3 L400 310;M352 236 L441.6 228.1 L422.5 316;M352 236 L441.8 242.5 L439 332.5;M352 236 L437.1 265.3 L445 355;M352 236 L425.1 288.6 L439 377.5;M352 236 L410 304.9 L422.5 394;M352 236 L403.2 310.1 L400 400;M352 236 L405.4 308.4 L377.5 394;M352 236 L411.8 303.2 L361 377.5;M352 236 L421 293.8 L355 355"/>
  </path>

  <!-- far crank, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 355" to="360 400 355" dur="2.4s" repeatCount="indefinite"/>
    <line x1="400" y1="355" x2="355" y2="355" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 355 355" to="-360 355 355" dur="2.4s" repeatCount="indefinite"/>
      <rect x="344" y="355" width="22" height="5" rx="1.5" fill="#222"/>
      <path d="M351 349 L372 353 L369 355 L351 355 Z" fill="#262626" stroke="#262626" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="2" stroke-dasharray="3 2">
    <line x1="400" y1="333" x2="260" y2="341"/>
    <line x1="400" y1="377" x2="260" y2="359"/>
  </g>

  <!-- wheels -->
  <g transform="translate(260 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(560 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <circle cx="260" cy="350" r="9" fill="#555"/>
  <circle cx="560" cy="350" r="5" fill="#444"/>

  <!-- frame -->
  <g fill="none" stroke="#1f6f8b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="260" y1="350" x2="400" y2="355"/>
    <line x1="260" y1="350" x2="364" y2="256"/>
    <line x1="400" y1="355" x2="362" y2="252"/>
    <line x1="362" y1="252" x2="520" y2="242"/>
    <line x1="400" y1="355" x2="526" y2="268"/>
    <line x1="518" y1="236" x2="528" y2="270" stroke-width="8"/>
    <line x1="523" y1="256" x2="560" y2="350" stroke-width="5"/>
    <line x1="518" y1="236" x2="514" y2="216" stroke="#444" stroke-width="5"/>
    <path d="M510 216 L540 214 Q556 214 556 230" stroke="#444" stroke-width="5"/>
    <line x1="362" y1="252" x2="358" y2="243" stroke="#444" stroke-width="5"/>
  </g>
  <path d="M318 240 Q330 236 355 238 L385 240 Q392 244 380 247 Q345 249 322 246 Q314 244 318 240 Z" fill="#2a2a2a"/>
  <circle cx="541" cy="214" r="5" fill="#222"/>

  <!-- pelican: tail, body -->
  <path d="M305 188 L258 206 L266 216 L306 216 Z" fill="#6b5848" stroke="#4a3b2e" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="348" cy="200" rx="62" ry="42" transform="rotate(-8 348 200)" fill="#8b7b69" stroke="#5e5043" stroke-width="2"/>
  <ellipse cx="368" cy="218" rx="40" ry="18" transform="rotate(-8 368 218)" fill="#d8cfbd" opacity="0.8"/>

  <!-- neck and head -->
  <path d="M388 192 C 408 166, 392 142, 428 126" fill="none" stroke="#5a3a22" stroke-width="22" stroke-linecap="round"/>
  <path d="M394 190 C 413 168, 399 146, 432 130" fill="none" stroke="#f4efe6" stroke-width="11" stroke-linecap="round"/>
  <path d="M446 125 Q 482 172 528 148 L 524 142 Z" fill="#d7c29a" stroke="#8c7a58" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="440" cy="118" r="16" fill="#f6f0dc" stroke="#cfc5a8" stroke-width="1.5"/>
  <path d="M426 112 Q 440 94 455 108 Q 441 104 426 112 Z" fill="#f3d35a"/>
  <path d="M451 112 L 530 136 Q 540 139 537 147 L 531 149 Q 530 144 524 143 L 449 126 Z" fill="#b9ae96" stroke="#7d735c" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="446" cy="116" r="3.2" fill="#111"/>
  <circle cx="447" cy="115" r="1" fill="#fff"/>

  <!-- wing reaching handlebar -->
  <path d="M352 172 C 400 165 470 185 536 208 L 540 216 C 470 210 400 215 360 212 Z" fill="#6d5a49" stroke="#4a3b2e" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400 190 C 450 192 490 200 528 210" fill="none" stroke="#54443a" stroke-width="1.5"/>

  <!-- near leg -->
  <path d="M352 236 L437.1 265.3 L445 355" fill="none" stroke="#3d3d3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2.4s" repeatCount="indefinite" values="M352 236 L437.1 265.3 L445 355;M352 236 L425.1 288.6 L439 377.5;M352 236 L410 304.9 L422.5 394;M352 236 L403.2 310.1 L400 400;M352 236 L405.4 308.4 L377.5 394;M352 236 L411.8 303.2 L361 377.5;M352 236 L421 293.8 L355 355;M352 236 L432 277.2 L361 332.5;M352 236 L440.6 251.8 L377.5 316;M352 236 L441.9 230.3 L400 310;M352 236 L441.6 228.1 L422.5 316;M352 236 L441.8 242.5 L439 332.5;M352 236 L437.1 265.3 L445 355"/>
  </path>
  <ellipse cx="354" cy="232" rx="18" ry="12" fill="#8b7b69" stroke="#5e5043" stroke-width="1.5"/>

  <!-- near crank, chainring, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 355" to="360 400 355" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="400" cy="355" r="22" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="3 3"/>
    <circle cx="400" cy="355" r="18" fill="none" stroke="#777" stroke-width="1.5"/>
    <line x1="400" y1="355" x2="445" y2="355" stroke="#888" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 445 355" to="-360 445 355" dur="2.4s" repeatCount="indefinite"/>
      <rect x="434" y="355" width="22" height="5" rx="1.5" fill="#222"/>
      <path d="M441 349 L462 353 L459 355 L441 355 Z" fill="#3d3d3d" stroke="#3d3d3d" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>
  <circle cx="400" cy="355" r="8" fill="#444" stroke="#222" stroke-width="2"/>
</svg>