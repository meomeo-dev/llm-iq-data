<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Animated California brown pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ee"/>
      <stop offset="1" stop-color="#e4f4fa"/>
    </linearGradient>
    <g id="wheel">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
        <circle r="67" fill="none" stroke="#222" stroke-width="6"/>
        <circle r="62" fill="none" stroke="#b5b5b5" stroke-width="2"/>
        <g stroke="#8a8a8a" stroke-width="1.2">
          <line x1="-62" y1="0" x2="62" y2="0"/>
          <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(22.5)"/>
          <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(45)"/>
          <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(67.5)"/>
          <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
          <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(112.5)"/>
          <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(135)"/>
          <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(157.5)"/>
        </g>
        <circle r="9" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="3 2"/>
        <circle r="5" fill="#444"/>
        <circle cx="0" cy="-58" r="3" fill="#e8b020"/>
      </g>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#fff3b0" opacity="0.9"/>
  <rect y="430" width="800" height="70" fill="#e2d3a8"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#b8a57a" stroke-width="4" stroke-dasharray="30 30">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="465" x2="800" y2="465" stroke="#c9b88a" stroke-width="3" stroke-dasharray="50 50">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="432" rx="230" ry="8" fill="#000" opacity="0.15"/>

  <!-- far-side leg -->
  <path d="M350,250 L405.6,307.5 L343,365 L355,365" fill="none" stroke="#1c1c1c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M350,250 L405.6,307.5 L343,365 L355,365;M350,250 L414.7,297.2 L347.3,349 L359.3,349;M350,250 L423.3,281.9 L359,337.3 L371,337.3;M350,250 L428.2,266.8 L375,333 L387,333;M350,250 L429.2,261.5 L391,337.3 L403,337.3;M350,250 L427.9,267.9 L402.7,349 L414.7,349;M350,250 L423.5,281.6 L407,365 L419,365;M350,250 L414.8,296.9 L402.7,381 L414.7,381;M350,250 L404.3,308.8 L391,392.7 L403,392.7;M350,250 L396.9,314.9 L375,397 L387,397;M350,250 L395.4,315.9 L359,392.7 L371,392.7;M350,250 L398.8,313.5 L347.3,381 L359.3,381;M350,250 L405.6,307.5 L343,365 L355,365"/>
  </path>

  <!-- wheels -->
  <use href="#wheel" transform="translate(250,360)"/>
  <use href="#wheel" transform="translate(550,360)"/>

  <!-- far-side crank and pedal -->
  <g transform="translate(375,365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-32" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-32,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
          <rect x="-6" y="-2.5" width="20" height="5" rx="2" fill="#333"/>
        </g>
      </g>
    </g>
  </g>

  <!-- chain -->
  <line x1="375" y1="347" x2="250" y2="352" stroke="#333" stroke-width="2"/>
  <line x1="375" y1="383" x2="250" y2="368" stroke="#333" stroke-width="2"/>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="375" y1="365" x2="340" y2="264"/>
    <line x1="340" y1="268" x2="505" y2="262"/>
    <line x1="375" y1="365" x2="508" y2="270"/>
    <line x1="375" y1="365" x2="250" y2="360"/>
    <line x1="340" y1="266" x2="250" y2="360"/>
    <line x1="510" y1="270" x2="550" y2="360"/>
  </g>
  <line x1="503" y1="250" x2="511" y2="276" stroke="#8e2a20" stroke-width="9" stroke-linecap="round"/>
  <line x1="503" y1="250" x2="498" y2="236" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M498,236 L524,232 Q542,232 543,248" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="550" cy="360" r="4" fill="#444"/>
  <circle cx="250" cy="360" r="4" fill="#444"/>

  <!-- seat post and saddle -->
  <line x1="340" y1="264" x2="336" y2="252" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M312,250 Q336,241 366,249 Q368,256 358,257 L318,258 Q310,256 312,250 Z" fill="#1b1b1b"/>

  <!-- near-side crank, chainring, pedal -->
  <g transform="translate(375,365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <circle r="18" fill="none" stroke="#777" stroke-width="4" stroke-dasharray="4 2"/>
      <line x1="0" y1="0" x2="32" y2="0" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(32,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
          <rect x="-6" y="-2.5" width="20" height="5" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
    <circle r="6" fill="#444"/>
  </g>

  <!-- near-side leg -->
  <path d="M350,250 L423.5,281.6 L407,365 L419,365" fill="none" stroke="#3a3a3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M350,250 L423.5,281.6 L407,365 L419,365;M350,250 L414.8,296.9 L402.7,381 L414.7,381;M350,250 L404.3,308.8 L391,392.7 L403,392.7;M350,250 L396.9,314.9 L375,397 L387,397;M350,250 L395.4,315.9 L359,392.7 L371,392.7;M350,250 L398.8,313.5 L347.3,381 L359.3,381;M350,250 L405.6,307.5 L343,365 L355,365;M350,250 L414.7,297.2 L347.3,349 L359.3,349;M350,250 L423.3,281.9 L359,337.3 L371,337.3;M350,250 L428.2,266.8 L375,333 L387,333;M350,250 L429.2,261.5 L391,337.3 L403,337.3;M350,250 L427.9,267.9 L402.7,349 L414.7,349;M350,250 L423.5,281.6 L407,365 L419,365"/>
  </path>

  <!-- pelican -->
  <path d="M290,212 L238,246 L266,252 L296,236 Z" fill="#5e4d3d"/>
  <ellipse cx="340" cy="212" rx="60" ry="38" fill="#7d6c58"/>
  <ellipse cx="352" cy="226" rx="40" ry="20" fill="#a39380"/>
  <path d="M345,236 Q352,246 362,238" fill="none" stroke="#5e4d3d" stroke-width="2"/>

  <!-- wing reaching handlebar -->
  <path d="M350,196 C400,184 470,206 526,232 L520,241 C462,226 402,240 346,236 Z" fill="#6a5846"/>
  <path d="M380,205 C430,205 470,218 514,234 M370,216 C420,218 462,228 508,238" fill="none" stroke="#8d7a65" stroke-width="2"/>
  <circle cx="525" cy="236" r="6" fill="#4d3e30"/>

  <!-- neck and head -->
  <path d="M376,192 C352,158 430,160 438,122" fill="none" stroke="#f4efe2" stroke-width="26" stroke-linecap="round"/>
  <path d="M368,184 C348,156 418,150 428,120" fill="none" stroke="#5b3a24" stroke-width="7" stroke-linecap="round"/>
  <circle cx="440" cy="114" r="17" fill="#f7f3e8"/>
  <path d="M424,108 Q430,94 446,97 Q454,102 452,108 Q440,102 424,108 Z" fill="#f1d04f"/>
  <path d="M452,124 Q490,170 536,148 L450,122 Z" fill="#a8896a"/>
  <path d="M450,106 L538,140 Q548,145 538,149 L450,126 Z" fill="#b9a98a"/>
  <path d="M538,140 Q548,145 538,149" fill="none" stroke="#6b5a45" stroke-width="2"/>
  <circle cx="447" cy="110" r="4" fill="#fff"/>
  <circle cx="448" cy="110" r="2.4" fill="#111"/>
</svg>