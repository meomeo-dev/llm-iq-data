<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6f5"/>
      <stop offset="1" stop-color="#fdf3d8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="35" fill="#ffe48a"/>
  <rect x="0" y="430" width="800" height="70" fill="#d9c79a"/>
  <line x1="0" y1="432" x2="1300" y2="432" stroke="#a8946a" stroke-width="4" stroke-dasharray="60 50">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-440 0" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="436" rx="210" ry="9" fill="#000" opacity="0.15"/>

  <!-- far leg (behind everything) -->
  <polyline fill="none" stroke="#333" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="350,282 391.2,332.3 335,365">
    <animate attributeName="points" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="350,282 391.2,332.3 335,365;
              350,282 405.5,315.8 345.3,389.8;
              350,282 415,283.1 370,400;
              350,282 414.9,278.5 394.8,389.8;
              350,282 412.3,300.4 405,365;
              350,282 398.9,324.9 394.8,340.3;
              350,282 385,336.8 370,330;
              350,282 383.9,337.5 345.3,340.3;
              350,282 391.2,332.3 335,365"/>
  </polyline>

  <!-- far crank + pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 370 365" to="360 370 365" dur="2s" repeatCount="indefinite"/>
    <line x1="370" y1="365" x2="335" y2="365" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(335,365)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="-2" width="20" height="5" rx="2" fill="#222"/>
        <polygon points="-5,-3 15,0 -5,3" fill="#333"/>
      </g>
    </g>
  </g>

  <!-- rear wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 240 360" to="360 240 360" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="240" cy="360" r="70" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="240" cy="360" r="64" fill="none" stroke="#bbb" stroke-width="2"/>
    <g stroke="#888" stroke-width="1.2">
      <line x1="240" y1="360" x2="240" y2="296"/>
      <line x1="240" y1="360" x2="264.5" y2="300.8"/>
      <line x1="240" y1="360" x2="285.2" y2="314.8"/>
      <line x1="240" y1="360" x2="299.2" y2="335.5"/>
      <line x1="240" y1="360" x2="304" y2="360"/>
      <line x1="240" y1="360" x2="299.2" y2="384.5"/>
      <line x1="240" y1="360" x2="285.2" y2="405.2"/>
      <line x1="240" y1="360" x2="264.5" y2="419.2"/>
      <line x1="240" y1="360" x2="240" y2="424"/>
      <line x1="240" y1="360" x2="215.5" y2="419.2"/>
      <line x1="240" y1="360" x2="194.8" y2="405.2"/>
      <line x1="240" y1="360" x2="180.8" y2="384.5"/>
      <line x1="240" y1="360" x2="176" y2="360"/>
      <line x1="240" y1="360" x2="180.8" y2="335.5"/>
      <line x1="240" y1="360" x2="194.8" y2="314.8"/>
      <line x1="240" y1="360" x2="215.5" y2="300.8"/>
    </g>
    <rect x="238" y="290" width="4" height="8" fill="#d33"/>
    <circle cx="240" cy="360" r="6" fill="#555"/>
  </g>

  <!-- front wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 560 360" to="360 560 360" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="560" cy="360" r="70" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="560" cy="360" r="64" fill="none" stroke="#bbb" stroke-width="2"/>
    <g stroke="#888" stroke-width="1.2">
      <line x1="560" y1="360" x2="560" y2="296"/>
      <line x1="560" y1="360" x2="584.5" y2="300.8"/>
      <line x1="560" y1="360" x2="605.2" y2="314.8"/>
      <line x1="560" y1="360" x2="619.2" y2="335.5"/>
      <line x1="560" y1="360" x2="624" y2="360"/>
      <line x1="560" y1="360" x2="619.2" y2="384.5"/>
      <line x1="560" y1="360" x2="605.2" y2="405.2"/>
      <line x1="560" y1="360" x2="584.5" y2="419.2"/>
      <line x1="560" y1="360" x2="560" y2="424"/>
      <line x1="560" y1="360" x2="535.5" y2="419.2"/>
      <line x1="560" y1="360" x2="514.8" y2="405.2"/>
      <line x1="560" y1="360" x2="500.8" y2="384.5"/>
      <line x1="560" y1="360" x2="496" y2="360"/>
      <line x1="560" y1="360" x2="500.8" y2="335.5"/>
      <line x1="560" y1="360" x2="514.8" y2="314.8"/>
      <line x1="560" y1="360" x2="535.5" y2="300.8"/>
    </g>
    <rect x="558" y="290" width="4" height="8" fill="#d33"/>
    <circle cx="560" cy="360" r="6" fill="#555"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="240" y1="360" x2="370" y2="365"/>
    <line x1="240" y1="360" x2="330" y2="300"/>
    <line x1="370" y1="365" x2="330" y2="300"/>
    <line x1="330" y1="300" x2="503" y2="288"/>
    <line x1="370" y1="365" x2="512" y2="305"/>
    <line x1="503" y1="282" x2="515" y2="312" stroke-width="8"/>
    <line x1="513" y1="308" x2="560" y2="360"/>
    <line x1="503" y1="284" x2="497" y2="262" stroke="#555" stroke-width="5"/>
    <path d="M497,262 L520,258 Q536,256 538,270" stroke="#555" stroke-width="5"/>
    <line x1="330" y1="300" x2="330" y2="288" stroke="#555" stroke-width="5"/>
  </g>
  <path d="M312,287 Q330,278 358,282 Q362,288 354,290 Q330,292 312,291 Z" fill="#2b2b2b"/>
  <circle cx="370" cy="365" r="8" fill="#555"/>

  <!-- chain and chainring -->
  <line x1="370" y1="343" x2="240" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="370" y1="387" x2="240" y2="370" stroke="#333" stroke-width="2"/>
  <circle cx="240" cy="360" r="10" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="3 2"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 370 365" to="360 370 365" dur="2s" repeatCount="indefinite"/>
    <circle cx="370" cy="365" r="22" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="4 2"/>
    <circle cx="370" cy="365" r="16" fill="none" stroke="#777" stroke-width="1.5"/>
  </g>

  <!-- pelican body -->
  <path d="M290,252 L262,262 L270,238 L255,236 L285,224 Z" fill="#6e5a48" stroke="#4a3a2c" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="340" cy="240" rx="62" ry="40" transform="rotate(-15 340 240)" fill="#9b8c7c" stroke="#5a4a3c" stroke-width="2"/>
  <ellipse cx="335" cy="250" rx="42" ry="20" transform="rotate(-15 335 250)" fill="#b3a595" opacity="0.7"/>

  <!-- neck -->
  <path d="M388,226 C412,214 392,186 428,172" fill="none" stroke="#f4efe0" stroke-width="22" stroke-linecap="round"/>
  <path d="M380,218 C400,206 384,178 418,164" fill="none" stroke="#5e3f27" stroke-width="9" stroke-linecap="round"/>

  <!-- head and bill -->
  <circle cx="440" cy="168" r="15" fill="#f6f1e2"/>
  <ellipse cx="438" cy="158" rx="11" ry="6" fill="#f2dc7a"/>
  <path d="M451,162 L536,183 Q542,187 533,190 L452,181 Z" fill="#a39684" stroke="#6d6253" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M452,180 Q492,218 531,190 L452,181 Z" fill="#c4a67a" stroke="#6d6253" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="445" cy="164" r="2.6" fill="#111"/>

  <!-- wing reaching handlebar -->
  <path d="M368,222 C402,214 470,240 520,256 L523,265 C470,265 410,264 372,258 Z" fill="#7a6a58" stroke="#4a3a2c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M390,232 C430,232 470,248 505,258" fill="none" stroke="#5a4a3c" stroke-width="2"/>

  <!-- near crank + pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 370 365" to="360 370 365" dur="2s" repeatCount="indefinite"/>
    <line x1="370" y1="365" x2="405" y2="365" stroke="#666" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(405,365)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="-2" width="20" height="5" rx="2" fill="#222"/>
        <polygon points="-5,-3 15,0 -5,3" fill="#444"/>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <polyline fill="none" stroke="#5a5a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="350,282 412.3,300.4 405,365">
    <animate attributeName="points" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="350,282 412.3,300.4 405,365;
              350,282 398.9,324.9 394.8,389.8;
              350,282 385,336.8 370,400;
              350,282 383.9,337.5 345.3,389.8;
              350,282 391.2,332.3 335,365;
              350,282 405.5,315.8 345.3,340.3;
              350,282 415,283.1 370,330;
              350,282 414.9,278.5 394.8,340.3;
              350,282 412.3,300.4 405,365"/>
  </polyline>
</svg>