<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd4f2"/>
      <stop offset="1" stop-color="#e6f5fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="80" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="80" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 8"/>
      <circle r="73" fill="none" stroke="#b8bcc2" stroke-width="2.5"/>
      <g stroke="#9aa0a6" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <line x1="0" y1="0" x2="0" y2="-72" stroke="#d63b2f" stroke-width="2.5"/>
      <circle cx="0" cy="-62" r="4" fill="#d63b2f"/>
      <circle r="7" fill="#777" stroke="#333" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#fff3b0" opacity="0.9"/>
  <rect x="0" y="427" width="800" height="73" fill="#ead9a6"/>
  <line x1="0" y1="428" x2="800" y2="428" stroke="#b39f6a" stroke-width="4" stroke-dasharray="30 20">
    <animate attributeName="stroke-dashoffset" from="0" to="50" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- wheels -->
  <g transform="translate(230 345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(590 345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <circle cx="230" cy="345" r="10" fill="#444"/>
  <path d="M380,335 L230,336 M380,365 L230,354" stroke="#333" stroke-width="2.5" fill="none"/>

  <!-- far crank + pedal -->
  <g transform="rotate(180 380 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 380 350" to="360 380 350" dur="2s" repeatCount="indefinite"/>
      <line x1="380" y1="350" x2="412" y2="350" stroke="#2f2f2f" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(412 350)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-2.5" width="22" height="5" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#3a3a3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M360,262 L400,312 L348,350">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M360,262 L400,312 L348,350;M360,262 L409,304 L352,334;M360,262 L418,288 L364,322;M360,262 L423,271 L380,318;M360,262 L424,265 L396,322;M360,262 L423,272 L408,334;M360,262 L419,286 L412,350;M360,262 L410,302 L408,366;M360,262 L398,314 L396,378;M360,262 L390,319 L380,382;M360,262 L389,319 L364,378;M360,262 L393,317 L352,366;M360,262 L400,312 L348,350"/>
  </path>
  <ellipse rx="11" ry="4" fill="#3a3a3a" cx="351" cy="346">
    <animate attributeName="cx" dur="2s" repeatCount="indefinite" values="351;355;367;383;399;411;415;411;399;383;367;355;351"/>
    <animate attributeName="cy" dur="2s" repeatCount="indefinite" values="346;330;318;314;318;330;346;362;374;378;374;362;346"/>
  </ellipse>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="380" y1="350" x2="350" y2="268"/>
    <line x1="356" y1="284" x2="534" y2="264"/>
    <line x1="380" y1="350" x2="540" y2="282"/>
    <line x1="380" y1="350" x2="230" y2="345"/>
    <line x1="356" y1="284" x2="230" y2="345"/>
  </g>
  <line x1="532" y1="258" x2="541" y2="285" stroke="#8e2a20" stroke-width="8" stroke-linecap="round"/>
  <line x1="541" y1="285" x2="590" y2="345" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <line x1="532" y1="258" x2="527" y2="236" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <path d="M527,236 L552,233 Q572,236 566,258" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M336,268 Q352,261 374,268 Q360,275 336,273 Z" fill="#222" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="380" cy="350" r="7" fill="#666" stroke="#222" stroke-width="2"/>

  <!-- near crank, chainring, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 350" to="360 380 350" dur="2s" repeatCount="indefinite"/>
    <circle cx="380" cy="350" r="15" fill="none" stroke="#444" stroke-width="3"/>
    <circle cx="380" cy="350" r="17" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 4"/>
    <line x1="380" y1="350" x2="412" y2="350" stroke="#2f2f2f" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(412 350)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-11" y="-2.5" width="22" height="5" rx="2" fill="#111"/>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#5a5a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M360,262 L419,286 L412,350">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M360,262 L419,286 L412,350;M360,262 L410,302 L408,366;M360,262 L398,314 L396,378;M360,262 L390,319 L380,382;M360,262 L389,319 L364,378;M360,262 L393,317 L352,366;M360,262 L400,312 L348,350;M360,262 L409,304 L352,334;M360,262 L418,288 L364,322;M360,262 L423,271 L380,318;M360,262 L424,265 L396,322;M360,262 L423,272 L408,334;M360,262 L419,286 L412,350"/>
  </path>
  <ellipse rx="11" ry="4" fill="#5a5a5a" cx="415" cy="346">
    <animate attributeName="cx" dur="2s" repeatCount="indefinite" values="415;411;399;383;367;355;351;355;367;383;399;411;415"/>
    <animate attributeName="cy" dur="2s" repeatCount="indefinite" values="346;362;374;378;374;362;346;330;318;314;318;330;346"/>
  </ellipse>

  <!-- tail -->
  <path d="M292,226 L232,252 L238,263 L294,246 Z" fill="#5a3d2b" stroke="#3e2a1d" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- body -->
  <ellipse cx="340" cy="225" rx="58" ry="38" fill="#8a6e58" stroke="#5a3d2b" stroke-width="2" transform="rotate(-12 340 225)"/>
  <ellipse cx="352" cy="238" rx="36" ry="18" fill="#a68c77" transform="rotate(-12 340 225)"/>

  <!-- neck -->
  <path d="M372,208 C402,198 386,162 426,152" fill="none" stroke="#5a3d2b" stroke-width="17" stroke-linecap="round"/>
  <path d="M380,212 C410,204 394,170 430,160" fill="none" stroke="#f4efe6" stroke-width="7" stroke-linecap="round"/>

  <!-- head and bill -->
  <circle cx="434" cy="144" r="15" fill="#f7f3ea" stroke="#d8d0c0" stroke-width="1"/>
  <path d="M422,136 Q434,124 446,134 Q434,138 422,136 Z" fill="#f2d35b"/>
  <path d="M444,138 L540,158 Q546,162 537,165 L446,152 Z" fill="#b8a58c" stroke="#7a6a55" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M446,151 Q486,192 536,165 Z" fill="#8c7b68" stroke="#6a5a48" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M534,158 Q546,160 538,166" fill="none" stroke="#4a3d30" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="441" cy="141" r="3" fill="#111"/>
  <circle cx="442" cy="140" r="1" fill="#fff"/>

  <!-- wing reaching the handlebar -->
  <path d="M350,198 C400,205 480,222 556,232 L552,239 C480,245 410,251 345,237 Z" fill="#6b4f3a" stroke="#3e2a1d" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M370,212 C430,222 490,230 548,235" fill="none" stroke="#8d6f57" stroke-width="2" stroke-linecap="round"/>
  <circle cx="554" cy="235" r="5" fill="#3e2a1d"/>
</svg>