<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f5"/>
      <stop offset="1" stop-color="#e8f5fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#cfd3d8" stroke-width="1.2">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-59.13" y1="-24.49" x2="59.13" y2="24.49"/>
        <line x1="-45.25" y1="-45.25" x2="45.25" y2="45.25"/>
        <line x1="-24.49" y1="-59.13" x2="24.49" y2="59.13"/>
        <line x1="0" y1="-64" x2="0" y2="64"/>
        <line x1="24.49" y1="-59.13" x2="-24.49" y2="59.13"/>
        <line x1="45.25" y1="-45.25" x2="-45.25" y2="45.25"/>
        <line x1="59.13" y1="-24.49" x2="-59.13" y2="24.49"/>
      </g>
      <circle cx="0" cy="-58" r="2.8" fill="#e53935"/>
      <circle r="7" fill="#555"/>
    </g>
  </defs>

  <rect width="800" height="460" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="34" fill="#ffe27a" opacity="0.9"/>
  <path d="M0,392 Q120,330 260,380 Q380,340 520,382 Q660,335 800,385 L800,402 L0,402 Z" fill="#b9d6a0"/>

  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="860 0" to="-260 0" dur="40s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="70" rx="40" ry="14"/>
      <ellipse cx="-22" cy="76" rx="26" ry="11"/>
      <ellipse cx="24" cy="77" rx="28" ry="11"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="1000 0" to="-120 0" dur="55s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="130" rx="34" ry="11"/>
      <ellipse cx="-20" cy="135" rx="22" ry="9"/>
      <ellipse cx="22" cy="136" rx="24" ry="9"/>
    </g>
  </g>

  <rect x="0" y="402" width="800" height="58" fill="#6f7377"/>
  <line x1="0" y1="402" x2="800" y2="402" stroke="#4d5054" stroke-width="3"/>
  <line x1="-200" y1="432" x2="1000" y2="432" stroke="#f3f3f3" stroke-width="5" stroke-dasharray="60 100">
    <animate attributeName="stroke-dashoffset" from="0" to="160" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="395" cy="405" rx="200" ry="5" fill="#000" opacity="0.22"/>

  <!-- wheels -->
  <g transform="translate(240,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.6s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
      <circle r="12" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="3 2"/>
    </g>
  </g>
  <g transform="translate(550,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.6s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
    </g>
  </g>

  <!-- far crank, pedal and leg -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 380 335" to="540 380 335" dur="2s" repeatCount="indefinite"/>
    <line x1="380" y1="335" x2="420" y2="335" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 420 335" to="-360 420 335" dur="2s" repeatCount="indefinite"/>
      <rect x="408" y="337" width="24" height="5" rx="2" fill="#333"/>
    </g>
  </g>
  <path fill="none" stroke="#3a2d24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M340,238 L395.7,280.4 L340,335 L354,335">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M340,238 L395.7,280.4 L340,335 L354,335;
      M340,238 L405,264.5 L345.4,315 L359.4,315;
      M340,238 L410,240.5 L360,300.4 L374,300.4;
      M340,238 L408,222 L380,295 L394,295;
      M340,238 L408,223 L400,300.4 L414,300.4;
      M340,238 L410,237 L414.6,315 L428.6,315;
      M340,238 L407,258 L420,335 L434,335;
      M340,238 L397,279 L414.6,355 L428.6,355;
      M340,238 L382.5,293.6 L400,369.6 L414,369.6;
      M340,238 L377.6,297 L380,375 L394,375;
      M340,238 L381,294.6 L360,369.6 L374,369.6;
      M340,238 L387.5,289.4 L345.4,355 L359.4,355;
      M340,238 L395.7,280.4 L340,335 L354,335"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="351" y1="250" x2="240" y2="330" stroke="#c0392b" stroke-width="5"/>
    <line x1="380" y1="335" x2="240" y2="330" stroke="#c0392b" stroke-width="5"/>
    <line x1="380" y1="335" x2="350" y2="245" stroke="#c0392b" stroke-width="6"/>
    <line x1="352" y1="252" x2="503" y2="228" stroke="#c0392b" stroke-width="6"/>
    <line x1="380" y1="335" x2="509" y2="253" stroke="#c0392b" stroke-width="6"/>
    <line x1="500" y1="222" x2="510" y2="256" stroke="#8e2a20" stroke-width="8"/>
    <line x1="510" y1="256" x2="550" y2="330" stroke="#6b7078" stroke-width="5"/>
    <line x1="350" y1="245" x2="345" y2="233" stroke="#6b7078" stroke-width="4"/>
    <line x1="500" y1="222" x2="496" y2="205" stroke="#6b7078" stroke-width="4"/>
    <path d="M496,205 L520,202 Q534,204 532,222" stroke="#333" stroke-width="5"/>
  </g>

  <!-- chain -->
  <path d="M380,317 L240,322" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.13s" repeatCount="indefinite"/>
  </path>
  <path d="M240,338 L380,353" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.13s" repeatCount="indefinite"/>
  </path>

  <!-- pelican body, tail -->
  <path d="M272,205 L236,226 L242,236 L278,224 Z" fill="#4e3b2c"/>
  <ellipse cx="325" cy="200" rx="62" ry="38" fill="#7b6350" transform="rotate(-20 325 200)"/>
  <ellipse cx="335" cy="212" rx="40" ry="20" fill="#8d7762" transform="rotate(-20 335 212)"/>

  <!-- saddle -->
  <path d="M322,236 Q340,230 368,234 L370,240 Q342,243 322,241 Z" fill="#2b2b2b"/>

  <!-- near crank, chainring, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 335" to="360 380 335" dur="2s" repeatCount="indefinite"/>
    <circle cx="380" cy="335" r="18" fill="none" stroke="#8a8f96" stroke-width="3" stroke-dasharray="5 2"/>
    <line x1="380" y1="335" x2="420" y2="335" stroke="#777" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 420 335" to="-360 420 335" dur="2s" repeatCount="indefinite"/>
      <rect x="408" y="337" width="24" height="5" rx="2" fill="#222"/>
    </g>
  </g>
  <circle cx="380" cy="335" r="7" fill="#444"/>

  <!-- near leg -->
  <path fill="none" stroke="#55433a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M340,238 L407,258 L420,335 L434,335">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M340,238 L407,258 L420,335 L434,335;
      M340,238 L397,279 L414.6,355 L428.6,355;
      M340,238 L382.5,293.6 L400,369.6 L414,369.6;
      M340,238 L377.6,297 L380,375 L394,375;
      M340,238 L381,294.6 L360,369.6 L374,369.6;
      M340,238 L387.5,289.4 L345.4,355 L359.4,355;
      M340,238 L395.7,280.4 L340,335 L354,335;
      M340,238 L405,264.5 L345.4,315 L359.4,315;
      M340,238 L410,240.5 L360,300.4 L374,300.4;
      M340,238 L408,222 L380,295 L394,295;
      M340,238 L408,223 L400,300.4 L414,300.4;
      M340,238 L410,237 L414.6,315 L428.6,315;
      M340,238 L407,258 L420,335 L434,335"/>
  </path>

  <!-- wing reaching to handlebar -->
  <path d="M345,180 C380,175 430,198 470,200 L521,203 L523,211 C480,216 420,224 370,224 C345,224 335,205 345,180 Z" fill="#5c4430"/>
  <path d="M380,200 C420,205 460,208 508,208" fill="none" stroke="#7a5c40" stroke-width="3" stroke-linecap="round"/>
  <path d="M370,212 C410,216 450,216 498,212" fill="none" stroke="#7a5c40" stroke-width="3" stroke-linecap="round"/>

  <!-- neck and head -->
  <path d="M372,192 C400,190 392,150 418,142 C432,138 436,130 446,126" fill="none" stroke="#efe6cc" stroke-width="20" stroke-linecap="round"/>
  <path d="M368,184 C394,182 384,146 412,136 C426,132 430,124 440,120" fill="none" stroke="#4b3626" stroke-width="6" stroke-linecap="round"/>
  <circle cx="452" cy="122" r="15" fill="#f6efd9"/>
  <path d="M440,114 Q452,102 465,112 Q452,110 440,114 Z" fill="#f0d35c"/>
  <path d="M463,114 Q505,118 550,134 Q552,138 546,139 Q505,130 463,128 Z" fill="#a89880"/>
  <path d="M463,128 Q500,160 545,140 Q505,132 463,128 Z" fill="#d4b483"/>
  <circle cx="548" cy="137" r="3" fill="#d9722b"/>
  <circle cx="458" cy="117" r="3.2" fill="#1c1c1c"/>
  <circle cx="459" cy="116" r="1" fill="#fff"/>
</svg>