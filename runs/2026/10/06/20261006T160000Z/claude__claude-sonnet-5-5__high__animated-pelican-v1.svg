<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" role="img" aria-label="Animated California brown pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f2"/>
      <stop offset="1" stop-color="#e9f6fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="58" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="58" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 10"/>
      <circle r="52" fill="none" stroke="#c8ccd0" stroke-width="2.5"/>
      <g stroke="#9aa0a6" stroke-width="1.2">
        <line x1="-52" y1="0" x2="52" y2="0"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(22.5)"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(45)"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(67.5)"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(90)"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(112.5)"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(135)"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="6" fill="#555"/>
      <circle r="2" fill="#ddd"/>
    </g>
  </defs>

  <rect width="700" height="500" fill="url(#sky)"/>
  <circle cx="610" cy="80" r="32" fill="#ffe27a" opacity="0.9"/>

  <g fill="#ffffff" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="14s" repeatCount="indefinite"/>
      <ellipse cx="130" cy="90" rx="46" ry="13"/>
      <ellipse cx="160" cy="80" rx="30" ry="14"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 0;0 0" dur="11s" repeatCount="indefinite"/>
      <ellipse cx="450" cy="55" rx="40" ry="11"/>
      <ellipse cx="475" cy="47" rx="26" ry="12"/>
    </g>
  </g>

  <rect x="0" y="330" width="700" height="89" fill="#6fb6d6" opacity="0.55"/>
  <rect x="0" y="419" width="700" height="81" fill="#6b6f76"/>
  <rect x="0" y="419" width="700" height="5" fill="#8d9199"/>
  <line x1="-120" y1="458" x2="820" y2="458" stroke="#ffffff" stroke-width="5" stroke-dasharray="60 50">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-110 0" dur="0.4s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="375" cy="424" rx="190" ry="6" fill="#000000" opacity="0.25"/>

  <!-- far crank and pedal -->
  <g transform="translate(360,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-3" width="22" height="6" rx="2" fill="#2a2a2a"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far foot and leg -->
  <g transform="translate(0,0)">
    <path d="M-7,-3 Q-7,-9 -2,-9 L14,-4 Q15,-3 12,-3 Z" fill="#33302b">
      <animateTransform attributeName="transform" type="translate" dur="2s" repeatCount="indefinite"
        values="330,355; 334,340; 345,329; 360,325; 375,329; 386,340; 390,355; 386,370; 375,381; 360,385; 345,381; 334,370; 330,355"/>
    </path>
  </g>
  <path fill="none" stroke="#33302b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M340,262 L382,308 L330,355">
    <animate attributeName="d" dur="2s" repeatCount="indefinite"
      values="M340,262 L382,308 L330,355;
              M340,262 L390,298 L334,340;
              M340,262 L398,283 L345,329;
              M340,262 L402,269 L360,325;
              M340,262 L402,264 L375,329;
              M340,262 L401,272 L386,340;
              M340,262 L397,285 L390,355;
              M340,262 L389,300 L386,370;
              M340,262 L378,311 L375,381;
              M340,262 L371,316 L360,385;
              M340,262 L371,316 L345,381;
              M340,262 L375,313 L334,370;
              M340,262 L382,308 L330,355"/>
  </path>

  <!-- wheels -->
  <g transform="translate(235,358)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(515,358)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#3a3a3a" stroke-width="2" fill="none">
    <line x1="360" y1="339" x2="235" y2="351"/>
    <line x1="360" y1="371" x2="235" y2="365"/>
    <circle cx="235" cy="358" r="7" fill="#999"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#d6402f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="360" y1="355" x2="338" y2="278"/>
    <line x1="339" y1="280" x2="484" y2="262"/>
    <line x1="360" y1="355" x2="488" y2="288"/>
    <line x1="360" y1="355" x2="235" y2="358"/>
    <line x1="339" y1="282" x2="235" y2="358"/>
    <line x1="482" y1="256" x2="490" y2="290"/>
    <path d="M490,290 Q500,325 515,358"/>
  </g>
  <line x1="338" y1="278" x2="336" y2="266" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M310,266 Q335,257 364,261 L366,268 Q338,273 310,271 Z" fill="#2b2b2b"/>
  <line x1="482" y1="257" x2="480" y2="240" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M466,238 Q486,230 502,240 Q510,248 506,258" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <circle cx="360" cy="355" r="8" fill="#888"/>

  <!-- near chainring, crank and pedal -->
  <g transform="translate(360,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#444" stroke-width="3"/>
      <circle r="19" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <circle r="5" fill="#bbb"/>
      <g transform="translate(30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-3" width="22" height="6" rx="2" fill="#1c1c1c"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near leg and foot -->
  <path fill="none" stroke="#55514a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M340,262 L397,285 L390,355">
    <animate attributeName="d" dur="2s" repeatCount="indefinite"
      values="M340,262 L397,285 L390,355;
              M340,262 L389,300 L386,370;
              M340,262 L378,311 L375,381;
              M340,262 L371,316 L360,385;
              M340,262 L371,316 L345,381;
              M340,262 L375,313 L334,370;
              M340,262 L382,308 L330,355;
              M340,262 L390,298 L334,340;
              M340,262 L398,283 L345,329;
              M340,262 L402,269 L360,325;
              M340,262 L402,264 L375,329;
              M340,262 L401,272 L386,340;
              M340,262 L397,285 L390,355"/>
  </path>
  <path d="M-7,-3 Q-7,-9 -2,-9 L14,-4 Q15,-3 12,-3 Z" fill="#55514a">
    <animateTransform attributeName="transform" type="translate" dur="2s" repeatCount="indefinite"
      values="390,355; 386,370; 375,381; 360,385; 345,381; 334,370; 330,355; 334,340; 345,329; 360,325; 375,329; 386,340; 390,355"/>
  </path>

  <!-- pelican tail and body -->
  <path d="M292,236 L246,262 L258,275 L302,258 Z" fill="#5a4a3a"/>
  <ellipse cx="345" cy="225" rx="62" ry="42" transform="rotate(-18 345 225)" fill="#85705a"/>
  <ellipse cx="352" cy="238" rx="40" ry="20" transform="rotate(-18 352 238)" fill="#a89883"/>

  <!-- neck and head -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 385 205;2 385 205;-2 385 205" dur="2s" repeatCount="indefinite"/>
    <path d="M377,205 C394,195 404,185 392,170 C386,160 394,155 402,152" fill="none" stroke="#6b4a35" stroke-width="8" stroke-linecap="round"/>
    <path d="M383,205 C400,195 410,185 398,170 C392,160 400,155 408,152" fill="none" stroke="#f3ecda" stroke-width="18" stroke-linecap="round"/>
    <circle cx="410" cy="150" r="15" fill="#f6efdc"/>
    <ellipse cx="407" cy="140" rx="11" ry="7" fill="#f1cf5b"/>
    <path d="M420,144 L496,172 Q500,176 494,177 L424,158 Z" fill="#8f8f86"/>
    <path d="M424,158 L494,177 Q478,200 436,172 Z" fill="#b9824c"/>
    <circle cx="416" cy="148" r="4" fill="#f6efdc"/>
    <circle cx="416" cy="148" r="2.5" fill="#222"/>
  </g>

  <!-- near wing resting on handlebar -->
  <path d="M350,192 Q420,205 498,236 Q504,242 498,247 Q420,246 340,232 Z" fill="#6e5a46" stroke="#4a3a2c" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#4a3a2c" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M400,215 Q440,232 488,242"/>
    <path d="M380,212 Q430,226 478,236"/>
  </g>
</svg>