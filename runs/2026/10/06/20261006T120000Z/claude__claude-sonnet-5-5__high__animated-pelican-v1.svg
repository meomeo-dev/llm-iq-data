<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset="1" stop-color="#e6f5fb"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe27a"/>
  <path d="M0,330 Q120,290 240,325 T480,320 T800,310 L800,420 L0,420 Z" fill="#7fb8a4"/>
  <rect x="0" y="345" width="800" height="75" fill="#5fa8c8"/>
  <rect x="0" y="420" width="800" height="80" fill="#6b6b6b"/>
  <line x1="0" y1="421" x2="800" y2="421" stroke="#444" stroke-width="3"/>
  <line x1="-200" y1="462" x2="1000" y2="462" stroke="#f2f2f2" stroke-width="6" stroke-dasharray="60 100">
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="0.4366s" repeatCount="indefinite"/>
  </line>

  <!-- rear wheel -->
  <g transform="translate(260,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#bdbdbd" stroke-width="2"/>
      <path d="M-62,0H62 M0,-62V62 M-44,-44L44,44 M-44,44L44,-44 M-57,-24L57,24 M-57,24L57,-24 M-24,-57L24,57 M-24,57L24,-57" stroke="#9a9a9a" stroke-width="1.2" fill="none"/>
      <circle r="9" fill="none" stroke="#555" stroke-width="3"/>
      <circle r="6" fill="#444"/>
      <circle cx="0" cy="-63" r="3.5" fill="#ff9a1f"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(550,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#bdbdbd" stroke-width="2"/>
      <path d="M-62,0H62 M0,-62V62 M-44,-44L44,44 M-44,44L44,-44 M-57,-24L57,24 M-57,24L57,-24 M-24,-57L24,57 M-24,-57L24,57 M-24,57L24,-57" stroke="#9a9a9a" stroke-width="1.2" fill="none"/>
      <circle r="6" fill="#444"/>
      <circle cx="0" cy="-63" r="3.5" fill="#ff9a1f"/>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#4a4f55" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M345,240 L414.3,289.2 L355,350">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M345,240 L414.3,289.2 L355,350;
      M345,240 L422.4,275.1 L359.7,332.5;
      M345,240 L428.5,255.8 L372.5,319.7;
      M345,240 L430,240 L390,315;
      M345,240 L430,237.7 L407.5,319.7;
      M345,240 L429.7,248 L420.3,332.5;
      M345,240 L426.2,265 L425,350;
      M345,240 L418.6,282.5 L420.3,367.5;
      M345,240 L409.5,295.3 L407.5,380.3;
      M345,240 L404,301.2 L390,385;
      M345,240 L403.9,301.3 L372.5,380.3;
      M345,240 L407.7,297.4 L359.7,367.5;
      M345,240 L414.3,289.2 L355,350"/>
  </path>

  <!-- far crank and pedal -->
  <g transform="translate(390,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="1.2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#666" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-2" width="20" height="5" rx="2" fill="#333"/>
          <path d="M-6,0 L-6,-6 Q0,-8 6,-4 L17,-1 L17,2 L-6,2 Z" fill="#4a4f55"/>
        </g>
      </g>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260,350 L390,350"/>
    <path d="M390,350 L352,258"/>
    <path d="M260,350 L352,262"/>
    <path d="M354,262 L508,244"/>
    <path d="M390,350 L514,258"/>
    <path d="M506,236 L518,268" stroke-width="9"/>
    <path d="M516,264 L550,350" stroke="#a82e22"/>
    <path d="M508,238 L500,212" stroke="#444" stroke-width="5"/>
    <path d="M498,212 L520,210 Q538,210 536,230" stroke="#333" stroke-width="5"/>
  </g>
  <circle cx="522" cy="210" r="6" fill="#111"/>
  <line x1="352" y1="258" x2="350" y2="250" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M318,250 Q345,246 380,252 Q382,258 360,258 L330,258 Q318,257 318,250 Z" fill="#2b2b2b"/>

  <!-- chain -->
  <line x1="390" y1="332" x2="260" y2="341" stroke="#444" stroke-width="2"/>
  <line x1="390" y1="368" x2="260" y2="359" stroke="#444" stroke-width="2"/>

  <!-- near leg -->
  <path fill="none" stroke="#2f3338" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" d="M345,240 L426.2,265 L425,350">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M345,240 L426.2,265 L425,350;
      M345,240 L418.6,282.5 L420.3,367.5;
      M345,240 L409.5,295.3 L407.5,380.3;
      M345,240 L404,301.2 L390,385;
      M345,240 L403.9,301.3 L372.5,380.3;
      M345,240 L407.7,297.4 L359.7,367.5;
      M345,240 L414.3,289.2 L355,350;
      M345,240 L422.4,275.1 L359.7,332.5;
      M345,240 L428.5,255.8 L372.5,319.7;
      M345,240 L430,240 L390,315;
      M345,240 L430,237.7 L407.5,319.7;
      M345,240 L429.7,248 L420.3,332.5;
      M345,240 L426.2,265 L425,350"/>
  </path>

  <!-- near crank, chainring and pedal -->
  <g transform="translate(390,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="19" fill="none" stroke="#555" stroke-width="3"/>
      <path d="M-14,0H14 M0,-14V14" stroke="#555" stroke-width="2"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#888" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-2" width="20" height="5" rx="2" fill="#222"/>
          <path d="M-6,0 L-6,-6 Q0,-8 6,-4 L17,-1 L17,2 L-6,2 Z" fill="#2f3338"/>
        </g>
      </g>
    </g>
    <circle r="6" fill="#222"/>
  </g>

  <!-- tail -->
  <path d="M282,205 L236,234 L288,240 Z" fill="#5a3d28"/>

  <!-- body -->
  <ellipse cx="330" cy="205" rx="65" ry="38" transform="rotate(-12 330 205)" fill="#7a5a3c"/>
  <ellipse cx="345" cy="215" rx="40" ry="20" transform="rotate(-12 345 215)" fill="#9c7c5a"/>

  <!-- neck and head -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 380 185;-2 380 185;0 380 185;2 380 185;0 380 185" dur="1.2s" repeatCount="indefinite"/>
    <path d="M366,190 Q397,172 386,142 Q380,120 406,110" fill="none" stroke="#5a3d28" stroke-width="8" stroke-linecap="round"/>
    <path d="M374,190 Q405,172 394,142 Q388,120 414,110" fill="none" stroke="#f7f4ec" stroke-width="22" stroke-linecap="round"/>
    <circle cx="418" cy="106" r="15" fill="#f7f4ec"/>
    <path d="M404,100 Q418,86 432,98 Q420,96 404,100 Z" fill="#f0d66a"/>
    <circle cx="418" cy="104" r="13" fill="none"/>
    <path d="M432,112 Q462,150 502,130 L440,112 Z" fill="#8f7b62"/>
    <path d="M428,98 L508,124 Q514,130 504,131 L430,114 Z" fill="#b9a98a"/>
    <path d="M504,124 Q512,126 510,134 Q506,132 504,131 Z" fill="#6f6250"/>
    <circle cx="422" cy="100" r="3" fill="#111"/>
    <circle cx="423" cy="99" r="1" fill="#fff"/>
  </g>

  <!-- wing reaching the handlebar -->
  <path d="M360,180 Q440,180 520,206 L528,214 Q450,218 372,218 Q350,200 360,180 Z" fill="#6b4a2f" stroke="#4a3220" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400,200 Q450,200 500,210" fill="none" stroke="#8a6a4a" stroke-width="3" stroke-linecap="round"/>
</svg>