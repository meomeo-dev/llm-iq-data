<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecae6"/>
      <stop offset="1" stop-color="#e9f5f9"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="65" fill="none" stroke="#aeb6bd" stroke-width="3"/>
      <g stroke="#9aa3aa" stroke-width="1.2">
        <line x1="-65" y1="0" x2="65" y2="0"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(22.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(45)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(67.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(90)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(112.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(135)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="58" cy="0" r="3.5" fill="#d62828"/>
      <circle r="7" fill="#666" stroke="#333" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffd166"/>
  <path d="M0 400 Q120 330 240 390 Q360 320 480 390 Q620 330 800 395 L800 430 L0 430 Z" fill="#b7d3a8"/>
  <rect x="0" y="430" width="800" height="70" fill="#d9c9a3"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#a79672" stroke-width="3"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#b9a57a" stroke-width="4" stroke-dasharray="40 40">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.3s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="432" rx="260" ry="7" fill="#000" opacity="0.15"/>

  <!-- wheels -->
  <g transform="translate(250,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain and rear cog -->
  <circle cx="250" cy="360" r="9" fill="#777" stroke="#444" stroke-width="2"/>
  <g stroke="#333" stroke-width="2.5">
    <line x1="380" y1="349" x2="250" y2="351"/>
    <line x1="380" y1="381" x2="250" y2="369"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1f6f8b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380 365 L250 360"/>
    <path d="M356 280 L250 360"/>
    <path d="M380 365 L353 272"/>
    <path d="M357 285 L506 272"/>
    <path d="M380 365 L513 292"/>
    <path d="M506 262 L516 300" stroke-width="9"/>
    <path d="M516 298 Q540 320 550 360"/>
    <path d="M506 262 L503 246" stroke="#444" stroke-width="5"/>
    <path d="M497 245 L528 245 Q542 247 540 263 Q538 272 528 271" stroke="#333" stroke-width="5"/>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2e2b28" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M355 275 L399 323 L350 365">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
      values="M355 275 L399 323 L350 365;M355 275 L408 313 L354 350;M355 275 L416 298 L365 339;M355 275 L420 283 L380 335;M355 275 L420 279 L395 339;M355 275 L419 286 L406 350;M355 275 L415 300 L410 365;M355 275 L406 315 L406 380;M355 275 L395 326 L395 391;M355 275 L389 331 L380 395;M355 275 L389 331 L365 391;M355 275 L393 328 L354 380;M355 275 L399 323 L350 365"/>
  </path>

  <!-- crank, chainring and pedals -->
  <g transform="translate(380,365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#555" stroke-width="3"/>
      <circle r="11" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#8a8f94" stroke-width="6" stroke-linecap="round"/>
      <circle r="5" fill="#444"/>
      <g transform="translate(-30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-2.5" width="20" height="5" rx="2" fill="#222"/>
          <path d="M-4 -4 L16 0 L10 6 L-4 4 Z" fill="#c9741f" stroke="#7a4310" stroke-width="1"/>
        </g>
      </g>
      <g transform="translate(30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-2.5" width="20" height="5" rx="2" fill="#222"/>
          <path d="M-4 -4 L16 0 L10 6 L-4 4 Z" fill="#e08a2c" stroke="#7a4310" stroke-width="1"/>
        </g>
      </g>
    </g>
  </g>

  <!-- saddle -->
  <path d="M333 268 Q353 261 377 268 Q373 275 351 275 Q336 275 333 268 Z" fill="#222"/>

  <!-- tail -->
  <path d="M318 246 L282 258 L286 270 L322 264 Z" fill="#4a3a2c"/>

  <!-- body -->
  <ellipse cx="352" cy="240" rx="47" ry="30" transform="rotate(-20 352 240)" fill="#7a6552"/>
  <ellipse cx="362" cy="250" rx="30" ry="17" transform="rotate(-20 362 250)" fill="#9a8570" opacity="0.7"/>

  <!-- near leg -->
  <path fill="none" stroke="#4a4540" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M355 275 L415 300 L410 365">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
      values="M355 275 L415 300 L410 365;M355 275 L406 315 L406 380;M355 275 L395 326 L395 391;M355 275 L389 331 L380 395;M355 275 L389 331 L365 391;M355 275 L393 328 L354 380;M355 275 L399 323 L350 365;M355 275 L408 313 L354 350;M355 275 L416 298 L365 339;M355 275 L420 283 L380 335;M355 275 L420 279 L395 339;M355 275 L419 286 L406 350;M355 275 L415 300 L410 365"/>
  </path>
  <circle cx="355" cy="274" r="5" fill="#4a4540"/>

  <!-- neck -->
  <path d="M382 228 C408 208 396 192 432 184" fill="none" stroke="#5a3d2b" stroke-width="17" stroke-linecap="round"/>
  <path d="M388 232 C412 214 402 198 436 192" fill="none" stroke="#f3efe4" stroke-width="7" stroke-linecap="round"/>

  <!-- head and bill -->
  <circle cx="437" cy="180" r="17" fill="#f6f1dc"/>
  <ellipse cx="434" cy="168" rx="12" ry="6" fill="#f2d36b"/>
  <path d="M450 174 L520 190 Q527 192 522 197 L452 191 Z" fill="#b3a27c" stroke="#7d6e4e" stroke-width="1"/>
  <path d="M452 189 Q490 218 522 197 Q490 197 452 189 Z" fill="#8b7355"/>
  <circle cx="445" cy="177" r="3.2" fill="#111"/>
  <circle cx="446" cy="176" r="1" fill="#fff"/>

  <!-- wing reaching the handlebar -->
  <path d="M366 226 Q440 252 524 245" fill="none" stroke="#4a3a2c" stroke-width="13" stroke-linecap="round"/>
  <path d="M370 232 Q440 256 520 249" fill="none" stroke="#6b5440" stroke-width="3" stroke-linecap="round"/>
  <circle cx="527" cy="245" r="6" fill="#3b2d22"/>
</svg>