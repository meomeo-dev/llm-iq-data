<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <rect width="800" height="500" fill="#cfe8f5"/>
  <rect y="420" width="800" height="80" fill="#e6d9b5"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#8d8466" stroke-width="2"/>
  <g fill="#c9b98c">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-110 0" dur="0.375s" repeatCount="indefinite"/>
    <rect x="-110" y="440" width="50" height="5"/>
    <rect x="0" y="440" width="50" height="5"/>
    <rect x="110" y="440" width="50" height="5"/>
    <rect x="220" y="440" width="50" height="5"/>
    <rect x="330" y="440" width="50" height="5"/>
    <rect x="440" y="440" width="50" height="5"/>
    <rect x="550" y="440" width="50" height="5"/>
    <rect x="660" y="440" width="50" height="5"/>
    <rect x="770" y="440" width="50" height="5"/>
  </g>
  <ellipse cx="400" cy="423" rx="230" ry="6" fill="#000" opacity="0.15"/>

  <!-- far leg -->
  <g transform="translate(352,238)" stroke="#2a2826" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-60.1;-43.1;-34.8;-39.3;-49.35;-63.2;-74.5;-73.2;-60.1" dur="2s" begin="-1s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="78"/>
      <g transform="translate(0,78)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="59.8;37.6;35.8;57.2;81.2;97.8;98.8;83.6;59.8" dur="2s" begin="-1s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="78"/>
          <path d="M-8,73 Q8,73 24,80 L22,83 L-8,82 Z" fill="#2a2826" stroke-width="2"/>
        </g>
      </g>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="395" y1="341" x2="230" y2="343"/>
    <line x1="395" y1="369" x2="230" y2="357"/>
  </g>

  <!-- rear wheel -->
  <g transform="translate(230,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#999" stroke-width="1">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(30)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(60)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(120)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="8" fill="#555"/>
      <circle r="3" cy="-58" fill="#d33"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(570,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#999" stroke-width="1">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(30)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(60)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(120)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="8" fill="#555"/>
      <circle r="3" cy="-58" fill="#d33"/>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1e88a8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="395" y1="355" x2="362" y2="252"/>
    <line x1="362" y1="252" x2="520" y2="240"/>
    <line x1="395" y1="355" x2="524" y2="262"/>
    <line x1="395" y1="355" x2="230" y2="350"/>
    <line x1="362" y1="252" x2="230" y2="350"/>
    <line x1="518" y1="236" x2="528" y2="264"/>
    <line x1="526" y1="258" x2="570" y2="350"/>
    <line x1="362" y1="252" x2="356" y2="236" stroke="#555" stroke-width="5"/>
    <path d="M518,236 L513,216" stroke="#555" stroke-width="5"/>
    <path d="M506,214 L536,212 Q553,214 553,234" stroke="#333" stroke-width="5"/>
  </g>
  <path d="M332,236 Q350,227 374,231 L380,236 Q352,245 332,236 Z" fill="#222"/>

  <!-- cranks and pedals -->
  <g transform="translate(395,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="14" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#444" stroke-width="2"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#444" stroke-width="2"/>
      <line x1="0" y1="0" x2="-25" y2="0" stroke="#555" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(-25,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-9" y="-2.5" width="18" height="5" rx="1.5" fill="#222"/>
        </g>
      </g>
      <line x1="0" y1="0" x2="25" y2="0" stroke="#777" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(25,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-9" y="-2.5" width="18" height="5" rx="1.5" fill="#222"/>
        </g>
      </g>
      <circle r="5" fill="#333"/>
    </g>
  </g>

  <!-- near leg -->
  <g transform="translate(352,238)" stroke="#3b3a38" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-60.1;-43.1;-34.8;-39.3;-49.35;-63.2;-74.5;-73.2;-60.1" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="78"/>
      <g transform="translate(0,78)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="59.8;37.6;35.8;57.2;81.2;97.8;98.8;83.6;59.8" dur="2s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="78"/>
          <path d="M-8,73 Q8,73 24,80 L22,83 L-8,82 Z" fill="#4a4540" stroke-width="2"/>
        </g>
      </g>
    </g>
  </g>

  <!-- pelican tail and body -->
  <path d="M302,194 L260,208 L268,222 L306,224 Z" fill="#4e4034"/>
  <ellipse cx="350" cy="208" rx="52" ry="32" transform="rotate(10 350 208)" fill="#7d6b58"/>
  <ellipse cx="362" cy="216" rx="34" ry="18" transform="rotate(10 362 216)" fill="#a0907a"/>
  <ellipse cx="352" cy="232" rx="18" ry="11" fill="#6b5a49"/>

  <!-- neck -->
  <path d="M388,200 C370,170 400,160 410,140 C418,126 430,122 446,122" fill="none" stroke="#f1ebdc" stroke-width="20" stroke-linecap="round"/>
  <path d="M380,196 C362,168 392,158 402,138 C410,124 424,114 440,114" fill="none" stroke="#5a4232" stroke-width="6" stroke-linecap="round"/>

  <!-- head and bill -->
  <ellipse cx="452" cy="120" rx="20" ry="16" fill="#f5efcf"/>
  <path d="M440,106 Q452,98 466,106 Q452,104 440,110 Z" fill="#e8d98a"/>
  <path d="M466,112 L570,148 L562,153 Q515,166 462,136 Z" fill="#a89a7a" stroke="#6e6450" stroke-width="2" stroke-linejoin="round"/>
  <path d="M470,124 L562,151" stroke="#6e6450" stroke-width="2" fill="none"/>
  <path d="M566,146 Q574,150 568,157" stroke="#7a5a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="458" cy="115" r="4" fill="#111"/>
  <circle cx="459.5" cy="113.5" r="1.3" fill="#fff"/>

  <!-- wing reaching the handlebar -->
  <path d="M365,192 Q440,184 536,208 L538,218 Q450,224 372,226 Z" fill="#6a5846" stroke="#4a3b2e" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#4a3b2e" stroke-width="1.5" fill="none">
    <path d="M400,200 Q470,200 530,212"/>
    <path d="M395,210 Q470,212 532,216"/>
  </g>
  <circle cx="537" cy="213" r="6" fill="#4a3b2e"/>
</svg>