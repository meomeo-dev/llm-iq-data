<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="1" stop-color="#fdf1d6"/>
    </linearGradient>
    <g id="wheel">
      <circle r="88" fill="none" stroke="#1f1f1f" stroke-width="7"/>
      <circle r="83" fill="none" stroke="#9aa0a6" stroke-width="2"/>
      <g stroke="#c9ced3" stroke-width="1">
        <line x1="-83" y1="0" x2="83" y2="0"/>
        <line x1="-83" y1="0" x2="83" y2="0" transform="rotate(22.5)"/>
        <line x1="-83" y1="0" x2="83" y2="0" transform="rotate(45)"/>
        <line x1="-83" y1="0" x2="83" y2="0" transform="rotate(67.5)"/>
        <line x1="-83" y1="0" x2="83" y2="0" transform="rotate(90)"/>
        <line x1="-83" y1="0" x2="83" y2="0" transform="rotate(112.5)"/>
        <line x1="-83" y1="0" x2="83" y2="0" transform="rotate(135)"/>
        <line x1="-83" y1="0" x2="83" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="8" fill="#555"/>
      <circle r="3" fill="#bbb"/>
      <circle cx="83" cy="0" r="4" fill="#ff8c00"/>
      <circle cx="-83" cy="0" r="3" fill="#ffd34d"/>
    </g>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="42" fill="#fff3b0" opacity="0.9"/>
  <rect x="0" y="405" width="800" height="66" fill="#5fa8c8"/>
  <path d="M0,420 Q40,412 80,420 T160,420 T240,420 T320,420 T400,420 T480,420 T560,420 T640,420 T720,420 T800,420" fill="none" stroke="#bfe6f5" stroke-width="2"/>
  <path d="M0,440 Q50,432 100,440 T200,440 T300,440 T400,440 T500,440 T600,440 T700,440 T800,440" fill="none" stroke="#9fd3e8" stroke-width="2"/>
  <rect x="0" y="471" width="800" height="129" fill="#e3d3a6"/>
  <rect x="0" y="471" width="800" height="4" fill="#c9b684"/>
  <ellipse cx="400" cy="476" rx="250" ry="7" fill="#000" opacity="0.18"/>

  <!-- Far crank, pedal and foot -->
  <g transform="translate(390,385)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="1.6s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#5f6469" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-10" y="1" width="20" height="5" rx="2" fill="#1a1a1a"/>
          <ellipse cx="4" cy="-1" rx="11" ry="4" fill="#4a4740"/>
          <path d="M12,-2 L17,1 M12,0 L17,3 M11,2 L16,5" stroke="#4a4740" stroke-width="2" stroke-linecap="round" fill="none"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Far leg -->
  <g transform="translate(365,280)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-43.8;-62.1;-84.5;-86.7;-69.9;-48.2;-34.3;-34.5;-43.8" dur="1.6s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="75" stroke="#4a4740" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(0,75)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="94.4;117.7;122.9;105.0;77.4;52.6;46.8;66.4;94.4" dur="1.6s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="80" stroke="#4a4740" stroke-width="5" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="4.5" fill="#4a4740"/>
          <circle cx="0" cy="80" r="3.5" fill="#4a4740"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Wheels -->
  <g transform="translate(230,380)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>
  <g transform="translate(570,380)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>

  <!-- Chain and rear sprocket -->
  <circle cx="230" cy="380" r="10" fill="none" stroke="#444" stroke-width="3"/>
  <line x1="390" y1="365" x2="230" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="390" y1="405" x2="230" y2="390" stroke="#333" stroke-width="2"/>

  <!-- Frame -->
  <g stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="230" y1="380" x2="390" y2="385"/>
    <line x1="230" y1="380" x2="352" y2="288"/>
    <line x1="390" y1="385" x2="350" y2="280"/>
    <line x1="355" y1="292" x2="516" y2="284"/>
    <line x1="390" y1="385" x2="526" y2="308"/>
    <line x1="527" y1="310" x2="570" y2="380"/>
  </g>
  <line x1="514" y1="276" x2="526" y2="312" stroke="#8e2a20" stroke-width="9" stroke-linecap="round"/>
  <line x1="350" y1="280" x2="347" y2="272" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- Handlebar -->
  <line x1="516" y1="282" x2="509" y2="252" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M505,252 L534,248 Q548,248 548,262" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>

  <!-- Saddle -->
  <path d="M326,274 Q348,267 378,272 L374,280 Q350,281 328,280 Z" fill="#222"/>

  <!-- Pelican: tail, body, neck, head -->
  <path d="M296,232 L260,258 L268,268 L302,256 Z" fill="#4e3f31"/>
  <ellipse cx="350" cy="232" rx="64" ry="38" fill="#7b6a58" transform="rotate(-6 350 232)"/>
  <ellipse cx="385" cy="240" rx="30" ry="24" fill="#8f7e69"/>
  <path d="M395,225 C425,225 438,205 436,185 C435,175 442,168 450,160" fill="none" stroke="#efe6d0" stroke-width="20" stroke-linecap="round"/>
  <path d="M392,215 C418,213 424,200 424,186 C424,176 432,166 440,158" fill="none" stroke="#5b3d28" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="455" cy="152" rx="20" ry="16" fill="#f4efe2"/>
  <ellipse cx="452" cy="142" rx="14" ry="7" fill="#f0d56a"/>
  <path d="M468,160 Q490,196 545,196 Q556,192 558,183 L548,180 Z" fill="#a39679"/>
  <path d="M470,146 L556,172 Q566,176 566,184 Q556,182 548,180 L468,162 Z" fill="#8a8272"/>
  <path d="M470,150 L556,174" stroke="#6f6859" stroke-width="1.5" fill="none"/>
  <circle cx="460" cy="148" r="3.2" fill="#1a1a1a"/>
  <circle cx="461" cy="147" r="1" fill="#fff"/>

  <!-- Near wing gripping the handlebar -->
  <path d="M378,222 C420,216 470,234 540,246 C522,258 470,264 430,260 C400,256 380,246 374,236 Z" fill="#5a4a3a"/>
  <path d="M400,232 C440,236 490,246 530,250 M395,244 C440,250 480,254 520,256" fill="none" stroke="#7b6a58" stroke-width="2"/>

  <!-- Near crank, chainring, pedal and foot -->
  <g transform="translate(390,385)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="20" fill="none" stroke="#444" stroke-width="3"/>
      <circle r="23" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 2.5"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#8a8f94" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-10" y="1" width="20" height="5" rx="2" fill="#222"/>
          <ellipse cx="4" cy="-1" rx="11" ry="4" fill="#3b3a36"/>
          <path d="M12,-2 L17,1 M12,0 L17,3 M11,2 L16,5" stroke="#3b3a36" stroke-width="2" stroke-linecap="round" fill="none"/>
        </g>
      </g>
    </g>
    <circle r="6" fill="#333"/>
  </g>

  <!-- Near leg -->
  <g transform="translate(365,280)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-69.9;-48.2;-34.3;-34.5;-43.8;-62.1;-84.5;-86.7;-69.9" dur="1.6s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="75" stroke="#3b3a36" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(0,75)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="77.4;52.6;46.8;66.4;94.4;117.7;122.9;105.0;77.4" dur="1.6s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="80" stroke="#3b3a36" stroke-width="5" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="4.5" fill="#3b3a36"/>
          <circle cx="0" cy="80" r="3.5" fill="#3b3a36"/>
        </g>
      </g>
    </g>
  </g>
  <ellipse cx="362" cy="273" rx="20" ry="13" fill="#8a7860"/>
</svg>