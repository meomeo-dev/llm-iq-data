<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd4f2"/>
      <stop offset="1" stop-color="#fff3d6"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#9aa3a8" stroke-width="2"/>
      <g stroke="#9aa3a8" stroke-width="1.2">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(22.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(45)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(67.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(112.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(135)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-56" r="3" fill="#c0392b"/>
      <circle r="7" fill="#555"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <ellipse cx="150" cy="80" rx="60" ry="16" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="190" cy="68" rx="40" ry="14" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="640" cy="110" rx="70" ry="16" fill="#ffffff" opacity="0.7"/>
  <rect x="0" y="420" width="800" height="60" fill="#e8d9a8"/>
  <line x1="0" y1="426" x2="800" y2="426" stroke="#b79f63" stroke-width="3" stroke-dasharray="60 50">
    <animate attributeName="stroke-dashoffset" from="0" to="110" dur="0.3s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="422" rx="260" ry="8" fill="#000000" opacity="0.15"/>

  <!-- Wheels -->
  <g transform="translate(230 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="10" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="2 2"/>
    </g>
  </g>
  <g transform="translate(570 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Chain -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="230" y1="340" x2="400" y2="339"/>
    <line x1="230" y1="360" x2="400" y2="371"/>
  </g>

  <!-- Far crank, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 400 355" to="540 400 355" dur="1.6s" repeatCount="indefinite"/>
    <line x1="400" y1="355" x2="440" y2="355" stroke="#2c2c2c" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 440 355" to="-540 440 355" dur="1.6s" repeatCount="indefinite"/>
      <rect x="428" y="355" width="24" height="4" rx="1" fill="#1a1a1a"/>
      <path d="M431 348 Q438 343 446 346 L464 352 L462 355 L446 354 L431 354 Z" fill="#2a2a2a"/>
    </g>
  </g>

  <!-- Far leg -->
  <g fill="none" stroke="#2a2a2a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
        values="-50 360 248;-61.7 360 248;-79.3 360 248;-94.8 360 248;-97.5 360 248;-89 360 248;-75.1 360 248;-59.9 360 248;-47.3 360 248;-40.7 360 248;-40 360 248;-43.2 360 248;-50 360 248"/>
      <line x1="360" y1="248" x2="360" y2="330"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
          values="103.6 360 330;120.7 360 330;130.2 360 330;127.2 360 330;113.4 360 330;94.4 360 330;74.6 360 330;57.2 360 330;47.5 360 330;50.6 360 330;64.8 360 330;83.8 360 330;103.6 360 330"/>
        <line x1="360" y1="330" x2="360" y2="408"/>
      </g>
    </g>
  </g>

  <!-- Frame -->
  <g fill="none" stroke="#1f6f8b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 350 L400 355"/>
    <path d="M230 350 L352 250"/>
    <path d="M400 355 L352 248"/>
    <path d="M352 250 L512 243"/>
    <path d="M400 355 L522 258"/>
    <path d="M508 236 L527 268" stroke-width="8"/>
    <path d="M527 268 L570 350" stroke-width="5"/>
    <path d="M508 236 L503 222" stroke="#555" stroke-width="5"/>
    <path d="M352 248 L346 232" stroke="#888" stroke-width="5"/>
  </g>
  <path d="M500 224 L535 214 Q548 212 546 228" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- Saddle and tail -->
  <path d="M320 232 Q345 225 374 231 Q378 237 366 238 L328 239 Z" fill="#3b2a20"/>
  <path d="M292 214 L252 232 L262 240 L304 236 Z" fill="#5a4636" stroke="#3d2f24" stroke-width="2" stroke-linejoin="round"/>

  <!-- Pelican body, neck, head -->
  <ellipse cx="340" cy="208" rx="66" ry="36" transform="rotate(-12 340 208)" fill="#7d6e5c" stroke="#5a4c3c" stroke-width="2"/>
  <path d="M310 200 Q335 192 360 200 M305 214 Q335 206 365 216" fill="none" stroke="#5f5242" stroke-width="2" stroke-linecap="round"/>
  <path d="M385 198 C420 195 405 165 425 150 C432 145 436 142 440 138" fill="none" stroke="#f5f0e6" stroke-width="20" stroke-linecap="round"/>
  <path d="M385 198 C420 195 405 165 425 150 C432 145 436 142 440 138" fill="none" stroke="#4b3a2c" stroke-width="7" stroke-linecap="round" transform="translate(-7 2)"/>
  <ellipse cx="448" cy="134" rx="17" ry="14" fill="#fbf8f0"/>
  <ellipse cx="446" cy="124" rx="13" ry="7" fill="#f2d35b"/>
  <path d="M462 140 L544 164 Q500 182 458 152 Z" fill="#c8b27a" stroke="#9c8a56" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M460 126 L548 158 Q551 163 545 164 L462 142 Z" fill="#8b8c86" stroke="#66675f" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M540 157 Q551 160 546 166 L541 164 Z" fill="#d9692b"/>
  <circle cx="452" cy="132" r="2.8" fill="#111"/>

  <!-- Near crank, chainring, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 355" to="360 400 355" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="400" cy="355" r="16" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>
    <line x1="400" y1="355" x2="440" y2="355" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <circle cx="400" cy="355" r="5" fill="#222"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 440 355" to="-360 440 355" dur="1.6s" repeatCount="indefinite"/>
      <rect x="428" y="355" width="24" height="4" rx="1" fill="#222"/>
      <path d="M431 348 Q438 343 446 346 L464 352 L462 355 L446 354 L431 354 Z" fill="#454545"/>
      <path d="M448 348 L463 352 M446 351 L461 354" stroke="#222" stroke-width="1" fill="none"/>
    </g>
  </g>

  <!-- Near leg -->
  <g fill="none" stroke="#3d3d3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
        values="-75.1 360 248;-59.9 360 248;-47.3 360 248;-40.7 360 248;-40 360 248;-43.2 360 248;-50 360 248;-61.7 360 248;-79.3 360 248;-94.8 360 248;-97.5 360 248;-89 360 248;-75.1 360 248"/>
      <line x1="360" y1="248" x2="360" y2="330"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
          values="74.6 360 330;57.2 360 330;47.5 360 330;50.6 360 330;64.8 360 330;83.8 360 330;103.6 360 330;120.7 360 330;130.2 360 330;127.2 360 330;113.4 360 330;94.4 360 330;74.6 360 330"/>
        <line x1="360" y1="330" x2="360" y2="408"/>
      </g>
    </g>
  </g>
  <ellipse cx="358" cy="242" rx="13" ry="10" fill="#7d6e5c" stroke="#5a4c3c" stroke-width="1.5"/>

  <!-- Wing gripping handlebar -->
  <path d="M350 190 C400 185 470 195 534 210 L539 220 C470 212 400 224 355 226 Z" fill="#5e4b3a" stroke="#3d2f24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400 200 L470 208 M395 212 L468 214" stroke="#3d2f24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="538" cy="215" r="6" fill="#3d2f24"/>
</svg>