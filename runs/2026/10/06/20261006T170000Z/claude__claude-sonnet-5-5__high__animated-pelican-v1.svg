<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f2"/>
      <stop offset="1" stop-color="#e9f6fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#9aa0a8" stroke-width="1">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(22.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(45)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(67.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(112.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(135)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-57" r="3" fill="#e63b2e"/>
      <circle r="7" fill="#555"/>
      <circle r="3" fill="#ddd"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe27a" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="90" rx="50" ry="14"/>
    <ellipse cx="180" cy="80" rx="32" ry="14"/>
    <ellipse cx="520" cy="55" rx="44" ry="11"/>
    <ellipse cx="545" cy="47" rx="26" ry="11"/>
  </g>
  <rect x="0" y="424" width="800" height="76" fill="#d9c79a"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#b9a574" stroke-width="4" stroke-dasharray="35 20">
    <animate attributeName="stroke-dashoffset" from="0" to="440" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="390" cy="427" rx="210" ry="6" fill="#000" opacity="0.18"/>

  <!-- Far leg (behind frame) -->
  <g transform="translate(355,245)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
        values="44;27.7;12.2;12.1;26.6;46;57.2;54.4;44"/>
      <line x1="0" y1="0" x2="72" y2="0" stroke="#2f2a27" stroke-width="9" stroke-linecap="round"/>
      <g transform="translate(72,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
            values="85.7;105.6;109;93.2;68.1;44.1;39.4;59.6;85.7"/>
          <line x1="0" y1="0" x2="78" y2="0" stroke="#2a2725" stroke-width="6" stroke-linecap="round"/>
          <circle r="5" fill="#2f2a27"/>
          <g transform="translate(78,0)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
                values="-129.7;-133.3;-121.2;-105.3;-94.7;-90.1;-96.6;-114;-129.7"/>
              <path d="M-6,-1 L-6,-7 L10,-7 Q20,-6 22,-1 Z" fill="#b9791f"/>
              <path d="M10,-7 L22,-1 M4,-7 L16,-1" stroke="#7a4a0e" stroke-width="1" fill="none"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Rear wheel -->
  <g transform="translate(230,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="9" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="4 3"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g transform="translate(545,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Chain -->
  <g stroke="#333" stroke-width="2">
    <line x1="385" y1="341" x2="230" y2="341"/>
    <line x1="385" y1="369" x2="230" y2="359"/>
  </g>

  <!-- Frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M385,355 L347,258"/>
    <path d="M349,266 L507,248"/>
    <path d="M385,355 L511,262"/>
    <path d="M385,355 L230,350"/>
    <path d="M350,268 L230,350"/>
    <path d="M514,266 L545,350" stroke="#8e2a20"/>
    <path d="M502,236 L514,268" stroke-width="9"/>
  </g>
  <!-- Seat post and saddle -->
  <path d="M348,262 L350,250" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M331,250 Q345,243 374,247 L374,252 Q350,255 331,252 Z" fill="#222"/>
  <!-- Stem and handlebar -->
  <path d="M502,236 L498,214" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M488,213 L510,209 Q526,207 528,222" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crankset and pedals -->
  <g transform="translate(385,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.6s" repeatCount="indefinite"/>
      <circle r="14" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="5 2"/>
      <line x1="0" y1="0" x2="-28" y2="0" stroke="#555" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="28" y2="0" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(-28,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-12" y="-1" width="26" height="3" rx="1" fill="#222"/>
        </g>
      </g>
      <g transform="translate(28,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-12" y="-1" width="26" height="3" rx="1" fill="#111"/>
        </g>
      </g>
    </g>
    <circle r="5" fill="#999" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Pelican tail -->
  <path d="M300,214 L238,234 L246,243 L304,234 Z" fill="#5d452e"/>
  <!-- Pelican body -->
  <ellipse cx="340" cy="210" rx="54" ry="36" transform="rotate(-12 340 210)" fill="#85694b"/>
  <path d="M305,222 Q335,240 372,226" fill="none" stroke="#a68b6a" stroke-width="3" opacity="0.8"/>
  <path d="M312,200 Q338,214 366,204 M308,188 Q334,200 360,192" fill="none" stroke="#6a4f35" stroke-width="2" opacity="0.7"/>
  <circle cx="355" cy="242" r="11" fill="#7d6446"/>

  <!-- Neck -->
  <path d="M372,196 C392,185 378,150 398,132 C406,124 412,120 418,114" fill="none" stroke="#f2eee2" stroke-width="20" stroke-linecap="round"/>
  <path d="M364,190 C382,178 368,152 390,126" fill="none" stroke="#5a3b24" stroke-width="6" stroke-linecap="round"/>

  <!-- Head and bill -->
  <circle cx="424" cy="112" r="14" fill="#f7f1d8"/>
  <ellipse cx="421" cy="102" rx="10" ry="6" fill="#f0d56a"/>
  <path d="M436,122 Q470,160 524,133 L436,124 Z" fill="#a89574"/>
  <path d="M434,106 L528,128 Q534,131 527,134 L436,124 Z" fill="#bdae8e"/>
  <path d="M522,127 Q536,128 532,139 L522,133 Z" fill="#c0502a"/>
  <circle cx="428" cy="107" r="3.4" fill="#fff"/>
  <circle cx="429" cy="107" r="2.2" fill="#111"/>

  <!-- Wing reaching the handlebar -->
  <path d="M350,185 C400,175 470,195 522,206 L527,216 C470,224 400,222 352,212 Z" fill="#7a5c3f" stroke="#4a3523" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M470,200 L524,208 L526,215 L468,214 Z" fill="#4f3824"/>

  <!-- Near leg -->
  <g transform="translate(355,245)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
        values="26.6;46;57.2;54.4;44;27.7;12.2;12.1;26.6"/>
      <line x1="0" y1="0" x2="72" y2="0" stroke="#4a4038" stroke-width="9" stroke-linecap="round"/>
      <g transform="translate(72,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
            values="68.1;44.1;39.4;59.6;85.7;105.6;109;93.2;68.1"/>
          <line x1="0" y1="0" x2="78" y2="0" stroke="#3d3a38" stroke-width="6" stroke-linecap="round"/>
          <circle r="5" fill="#4a4038"/>
          <g transform="translate(78,0)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
                values="-94.7;-90.1;-96.6;-114;-129.7;-133.3;-121.2;-105.3;-94.7"/>
              <path d="M-6,-1 L-6,-7 L10,-7 Q20,-6 22,-1 Z" fill="#e8a23a"/>
              <path d="M10,-7 L22,-1 M4,-7 L16,-1" stroke="#a05d12" stroke-width="1" fill="none"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>