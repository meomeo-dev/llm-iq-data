<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="80" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="74" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-74" y1="0" x2="74" y2="0"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(22.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(45)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(67.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(90)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(112.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(135)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#555"/>
      <circle r="3" fill="#ddd"/>
      <circle cx="0" cy="-68" r="3.5" fill="#e03b2f"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="690" cy="70" r="34" fill="#ffe27a" opacity="0.9"/>
  <rect y="424" width="800" height="56" fill="#d9c391"/>
  <line x1="0" y1="426" x2="800" y2="426" stroke="#8a7650" stroke-width="3" stroke-dasharray="40 20">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#b39b66" stroke-width="2" stroke-dasharray="70 50">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- rear wheel -->
  <g transform="translate(250,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="9" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="3 2"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(550,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far crank and pedal -->
  <g transform="translate(385,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="-32" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(0,-32)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#1a1a1a"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <g transform="translate(352,245)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
        values="-82.5;-83.2;-67.5;-47.2;-35.5;-37.3;-46.8;-64.1;-82.5"/>
      <line x1="0" y1="0" x2="0" y2="76" stroke="#2c2c2c" stroke-width="8" stroke-linecap="round"/>
      <g transform="translate(0,76)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
            values="116.4;98.4;71.4;47.4;44;65.2;92.6;113.8;116.4"/>
          <line x1="0" y1="0" x2="0" y2="76" stroke="#2c2c2c" stroke-width="6" stroke-linecap="round"/>
          <circle r="5" fill="#2c2c2c"/>
          <g transform="translate(0,76)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
                values="-33.9;-15.2;-3.9;-0.2;-8.5;-27.9;-45.8;-49.7;-33.9"/>
              <path d="M-6,-4 Q8,-6 22,2 L22,5 Q10,6 -6,5 Z" fill="#2c2c2c"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="2" stroke-dasharray="3 2" fill="none">
    <line x1="385" y1="330" x2="250" y2="331"/>
    <line x1="385" y1="370" x2="250" y2="349"/>
  </g>

  <!-- frame -->
  <g stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="385" y1="350" x2="250" y2="340"/>
    <line x1="250" y1="340" x2="350" y2="270"/>
    <line x1="385" y1="350" x2="350" y2="264"/>
    <line x1="352" y1="272" x2="488" y2="262"/>
    <line x1="385" y1="350" x2="502" y2="276"/>
    <line x1="486" y1="254" x2="506" y2="281" stroke-width="8"/>
  </g>
  <line x1="506" y1="281" x2="550" y2="340" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <line x1="350" y1="264" x2="350" y2="254" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <circle cx="250" cy="340" r="5" fill="#444"/>
  <circle cx="550" cy="340" r="5" fill="#444"/>

  <!-- saddle -->
  <path d="M322,252 Q350,244 388,250 Q392,254 386,257 Q350,259 326,257 Q319,255 322,252 Z" fill="#2b2b2b"/>

  <!-- near crank, chainring and pedal -->
  <g transform="translate(385,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="21" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="3 2.2"/>
      <g stroke="#777" stroke-width="2">
        <line x1="-18" y1="0" x2="18" y2="0"/>
        <line x1="-18" y1="0" x2="18" y2="0" transform="rotate(72)"/>
        <line x1="-18" y1="0" x2="18" y2="0" transform="rotate(144)"/>
        <line x1="-18" y1="0" x2="18" y2="0" transform="rotate(216)"/>
        <line x1="-18" y1="0" x2="18" y2="0" transform="rotate(288)"/>
      </g>
      <line x1="0" y1="0" x2="0" y2="32" stroke="#999" stroke-width="6" stroke-linecap="round"/>
      <circle r="5" fill="#333"/>
      <g transform="translate(0,32)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#111"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <g transform="translate(352,245)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
        values="-35.5;-37.3;-46.8;-64.1;-82.5;-83.2;-67.5;-47.2;-35.5"/>
      <line x1="0" y1="0" x2="0" y2="76" stroke="#3b3b3b" stroke-width="9" stroke-linecap="round"/>
      <g transform="translate(0,76)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
            values="44;65.2;92.6;113.8;116.4;98.4;71.4;47.4;44"/>
          <line x1="0" y1="0" x2="0" y2="76" stroke="#3b3b3b" stroke-width="7" stroke-linecap="round"/>
          <circle r="5.5" fill="#3b3b3b"/>
          <g transform="translate(0,76)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
                values="-8.5;-27.9;-45.8;-49.7;-33.9;-15.2;-3.9;-0.2;-8.5"/>
              <path d="M-6,-4 Q8,-6 22,2 L22,5 Q10,6 -6,5 Z" fill="#4a4a4a"/>
              <path d="M8,-3 L20,3 M13,-3 L21,4" stroke="#222" stroke-width="1" fill="none"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- tail -->
  <path d="M322,236 L268,262 L276,246 L262,244 L318,222 Z" fill="#4e3f33"/>

  <!-- body -->
  <ellipse cx="345" cy="205" rx="46" ry="52" transform="rotate(-15 345 205)" fill="#7a6a58"/>
  <ellipse cx="360" cy="212" rx="28" ry="38" transform="rotate(-15 360 212)" fill="#a8977f"/>
  <path d="M330,195 q8,6 0,14 M342,210 q8,6 0,14 M326,222 q8,6 0,14" stroke="#5e4f40" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- neck -->
  <path d="M365,192 C372,150 395,135 424,126" stroke="#f6efdc" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M352,186 C358,152 380,124 410,113" stroke="#5b4030" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- head and bill -->
  <path d="M449,124 Q486,164 534,149 L447,129 Z" fill="#d9c6a0" stroke="#8c7a58" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M446,103 L538,137 Q545,143 536,147 L446,126 Z" fill="#b8a98a" stroke="#8c7a58" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="430" cy="112" rx="24" ry="19" fill="#fbf3dc"/>
  <path d="M408,106 Q418,86 442,94 Q448,100 444,104 Q426,98 408,106 Z" fill="#f2d96b"/>
  <circle cx="438" cy="107" r="3.4" fill="#111"/>
  <circle cx="439" cy="106" r="1" fill="#fff"/>

  <!-- handlebar and stem -->
  <line x1="486" y1="254" x2="479" y2="242" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M470,238 Q500,230 513,246 Q518,257 507,259" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- wing reaching the handlebar -->
  <path d="M350,172 Q425,198 506,236 L518,250 Q422,234 345,216 Z" fill="#6b5a49" stroke="#4e3f33" stroke-width="2" stroke-linejoin="round"/>
  <path d="M380,200 L440,222 M400,196 L470,230 M420,196 L492,236" stroke="#4e3f33" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="512" cy="248" rx="9" ry="7" fill="#3f3328"/>
</svg>