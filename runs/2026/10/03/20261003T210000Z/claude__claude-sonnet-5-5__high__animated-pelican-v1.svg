<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8f0"/>
      <stop offset="1" stop-color="#e9f6fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="77" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="71" fill="none" stroke="#c8ccd0" stroke-width="3"/>
      <path d="M-72,0 L72,0 M-66.5,-27.6 L66.5,27.6 M-50.9,-50.9 L50.9,50.9 M-27.6,-66.5 L27.6,66.5 M0,-72 L0,72 M27.6,-66.5 L-27.6,66.5 M50.9,-50.9 L-50.9,50.9 M66.5,-27.6 L-66.5,27.6" stroke="#9aa0a6" stroke-width="1.2" fill="none"/>
      <circle cx="0" cy="-64" r="3.5" fill="#d62828"/>
      <circle r="7" fill="#777" stroke="#444" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="34" fill="#fff3b0" opacity="0.9"/>
  <rect x="0" y="420" width="800" height="60" fill="#e2cf9f"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#b59a6a" stroke-width="2"/>
  <line x1="0" y1="436" x2="800" y2="436" stroke="#b59a6a" stroke-width="3" stroke-dasharray="40 60">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="0.2s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="456" x2="800" y2="456" stroke="#c4aa78" stroke-width="3" stroke-dasharray="20 80">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="0.2s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="424" rx="200" ry="8" fill="#000" opacity="0.18"/>

  <!-- far leg -->
  <path fill="none" stroke="#555" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M350,232 L426.3,296.7 L345,355">
    <animate attributeName="d" dur="2.4s" repeatCount="indefinite" values="M350,232 L426.3,296.7 L345,355;M350,232 L435.9,283.2 L350.4,335;M350,232 L445.6,261.2 L365,320.4;M350,232 L449.8,238.8 L385,315;M350,232 L450,231.1 L405,320.4;M350,232 L449.7,239.6 L419.6,335;M350,232 L446.7,257.4 L425,355;M350,232 L439.3,277 L419.6,375;M350,232 L429.5,292.7 L405,389.6;M350,232 L421.5,301.9 L385,395;M350,232 L418.3,305 L365,389.6;M350,232 L420.1,303.3 L350.4,375;M350,232 L426.3,296.7 L345,355"/>
  </path>

  <!-- far crank and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 355" to="360 385 355" dur="2.4s" repeatCount="indefinite"/>
    <line x1="385" y1="355" x2="345" y2="355" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 345 355" to="-360 345 355" dur="2.4s" repeatCount="indefinite"/>
      <rect x="333" y="354" width="24" height="5" rx="2" fill="#333"/>
      <path d="M338,352 Q346,343 362,352 L336,354 Z" fill="#555"/>
    </g>
  </g>

  <!-- wheels -->
  <g transform="translate(240,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(570,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <path d="M240,331 L385,333" stroke="#333" stroke-width="3" stroke-dasharray="4 3" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.12s" repeatCount="indefinite"/>
  </path>
  <path d="M240,349 L385,377" stroke="#333" stroke-width="3" stroke-dasharray="4 3" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="7" dur="0.12s" repeatCount="indefinite"/>
  </path>

  <!-- rear cog -->
  <g transform="translate(240,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <circle r="10" fill="none" stroke="#666" stroke-width="4" stroke-dasharray="3 2"/>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1b8a9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M385,355 L351,252"/>
    <path d="M353,262 L518,252"/>
    <path d="M385,355 L528,275"/>
    <path d="M385,355 L240,340"/>
    <path d="M353,266 L240,340"/>
  </g>
  <path d="M516,246 L530,272" stroke="#14606c" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M530,272 Q552,300 570,340" stroke="#8a9096" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M516,246 L507,224 L506,210" stroke="#444" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M492,210 L514,208 Q532,208 528,226" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M494,210 L512,208" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <path d="M351,252 L350,244" stroke="#999" stroke-width="5" stroke-linecap="round"/>
  <circle cx="385" cy="355" r="6" fill="#444"/>

  <!-- saddle -->
  <path d="M324,238 Q340,233 374,236 Q384,239 376,245 L330,247 Q320,245 324,238 Z" fill="#2b2118"/>

  <!-- near leg -->
  <path fill="none" stroke="#333" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M350,232 L446.7,257.4 L425,355">
    <animate attributeName="d" dur="2.4s" repeatCount="indefinite" values="M350,232 L446.7,257.4 L425,355;M350,232 L439.3,277 L419.6,375;M350,232 L429.5,292.7 L405,389.6;M350,232 L421.5,301.9 L385,395;M350,232 L418.3,305 L365,389.6;M350,232 L420.1,303.3 L350.4,375;M350,232 L426.3,296.7 L345,355;M350,232 L435.9,283.2 L350.4,335;M350,232 L445.6,261.2 L365,320.4;M350,232 L449.8,238.8 L385,315;M350,232 L450,231.1 L405,320.4;M350,232 L449.7,239.6 L419.6,335;M350,232 L446.7,257.4 L425,355"/>
  </path>

  <!-- near crank, chainring, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 355" to="360 385 355" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="385" cy="355" r="22" fill="none" stroke="#666" stroke-width="5" stroke-dasharray="3 2.5"/>
    <circle cx="385" cy="355" r="18" fill="none" stroke="#999" stroke-width="1.5"/>
    <line x1="385" y1="355" x2="425" y2="355" stroke="#222" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 425 355" to="-360 425 355" dur="2.4s" repeatCount="indefinite"/>
      <rect x="413" y="354" width="24" height="5" rx="2" fill="#222"/>
      <path d="M418,352 Q426,343 442,352 L416,354 Z" fill="#333"/>
    </g>
  </g>

  <!-- pelican tail -->
  <path d="M285,198 L238,216 L245,230 L289,222 Z" fill="#4a382b" stroke="#3b2b20" stroke-width="2" stroke-linejoin="round"/>

  <!-- pelican body -->
  <ellipse cx="338" cy="196" rx="66" ry="42" transform="rotate(-8 338 196)" fill="#6d5a47"/>
  <ellipse cx="372" cy="202" rx="28" ry="30" fill="#8c7861" opacity="0.85"/>

  <!-- neck -->
  <path d="M368,176 C392,160 380,140 402,122" fill="none" stroke="#f4f0e6" stroke-width="20" stroke-linecap="round"/>
  <path d="M361,168 C381,153 370,133 393,113" fill="none" stroke="#5a3a26" stroke-width="5" stroke-linecap="round"/>

  <!-- head, bill and pouch -->
  <path d="M426,114 C448,150 488,142 505,130 L426,117 Z" fill="#8c7a62" stroke="#6b5a45" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="414" cy="110" r="14" fill="#f7f4ec"/>
  <path d="M401,105 Q408,93 424,100 Q414,100 401,109 Z" fill="#f0cf5e"/>
  <path d="M424,103 L506,125 Q510,128 505,130 L424,115 Z" fill="#a89b86" stroke="#7d6f5c" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M498,126 L506,125 Q510,128 505,130 L497,128 Z" fill="#4a3d30"/>
  <circle cx="418" cy="107" r="2.8" fill="#1a1a1a"/>
  <circle cx="419" cy="106" r="0.9" fill="#fff"/>

  <!-- wing reaching the handlebar -->
  <path d="M338,166 C385,160 450,180 504,200 L506,212 C450,206 395,214 342,214 Z" fill="#5a4333" stroke="#3b2b20" stroke-width="2" stroke-linejoin="round"/>
  <path d="M350,190 C400,188 450,198 498,208" fill="none" stroke="#8b6f55" stroke-width="3" stroke-linecap="round"/>
</svg>