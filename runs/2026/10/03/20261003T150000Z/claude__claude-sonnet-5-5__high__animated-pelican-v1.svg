<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset="1" stop-color="#e8f6fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="34" fill="#ffe27a"/>
  <rect x="0" y="426" width="800" height="54" fill="#cdbd8c"/>
  <line x1="0" y1="426" x2="800" y2="426" stroke="#8b7a4a" stroke-width="3"/>
  <line x1="0" y1="448" x2="800" y2="448" stroke="#a89763" stroke-width="4" stroke-dasharray="40 40">
    <animate attributeName="stroke-dashoffset" from="0" to="480" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- FAR SIDE: crank, pedal, leg -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="180 400 350" to="540 400 350" dur="2s" repeatCount="indefinite"/>
    <line x1="400" y1="350" x2="400" y2="390" stroke="#6d6d6d" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="-180 400 390" to="-540 400 390" dur="2s" repeatCount="indefinite"/>
      <rect x="388" y="393" width="28" height="4" rx="1.5" fill="#1a1a1a"/>
      <path d="M394,384 L402,384 L424,390 Q428,393 423,394 L396,394 Q392,390 394,384 Z" fill="#222"/>
    </g>
  </g>
  <g stroke="#2b2b2b" stroke-width="7" stroke-linecap="round" fill="none">
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="2s" repeatCount="indefinite"
        values="-86.25 375 240;-90.73 375 240;-82.8 375 240;-68 375 240;-50.15 375 240;-33.4 375 240;-24.56 375 240;-25.88 375 240;-31.41 375 240;-39.83 375 240;-52.39 375 240;-69.8 375 240;-86.25 375 240"/>
      <line x1="375" y1="240" x2="375" y2="315"/>
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="2s" repeatCount="indefinite"
          values="123.65 375 315;112.2 375 315;93.2 375 315;71.1 375 315;48.75 375 315;30.8 375 315;28.89 375 315;45.64 375 315;67.81 375 315;90.13 375 315;109.74 375 315;122.7 375 315;123.65 375 315"/>
        <line x1="375" y1="315" x2="375" y2="397"/>
      </g>
      <circle cx="375" cy="315" r="4.5" fill="#2b2b2b" stroke="none"/>
    </g>
  </g>

  <!-- WHEELS -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 220 350" to="360 220 350" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="220" cy="350" r="72" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="220" cy="350" r="67" fill="none" stroke="#b8b8b8" stroke-width="2"/>
    <path d="M152,350H288 M157.2,324L282.8,376 M171.9,301.9L268.1,398.1 M194,287.2L246,412.8 M220,282V418 M246,287.2L194,412.8 M268.1,301.9L171.9,398.1 M282.8,324L157.2,376" stroke="#9a9a9a" stroke-width="1.2" fill="none"/>
    <circle cx="220" cy="350" r="9" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 2"/>
    <circle cx="220" cy="350" r="5" fill="#444"/>
    <circle cx="280" cy="350" r="4" fill="#e67e22"/>
  </g>
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 580 350" to="360 580 350" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="580" cy="350" r="72" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="580" cy="350" r="67" fill="none" stroke="#b8b8b8" stroke-width="2"/>
    <path d="M512,350H648 M517.2,324L642.8,376 M531.9,301.9L628.1,398.1 M554,287.2L606,412.8 M580,282V418 M606,287.2L554,412.8 M628.1,301.9L531.9,398.1 M642.8,324L517.2,376" stroke="#9a9a9a" stroke-width="1.2" fill="none"/>
    <circle cx="580" cy="350" r="5" fill="#444"/>
    <circle cx="640" cy="350" r="4" fill="#e67e22"/>
  </g>

  <!-- FRAME -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M400,350 L220,350 M373,264 L220,350" stroke="#1f7a8c" stroke-width="5"/>
    <path d="M400,350 L372,258 M372,260 L542,258 M400,350 L551,280" stroke="#1f7a8c" stroke-width="6"/>
    <path d="M539,250 L552,282" stroke="#16596a" stroke-width="8"/>
    <path d="M551,280 L580,350" stroke="#444" stroke-width="5"/>
    <path d="M539,250 L534,237" stroke="#333" stroke-width="5"/>
    <path d="M534,237 L552,229 Q570,227 568,243" stroke="#222" stroke-width="5"/>
    <path d="M372,258 L368,238" stroke="#333" stroke-width="5"/>
    <path d="M400,330 L220,342 M400,370 L220,358" stroke="#333" stroke-width="2"/>
  </g>
  <path d="M342,237 Q368,229 394,234 Q397,241 388,242 L348,242 Q338,242 342,237 Z" fill="#222"/>

  <!-- PELICAN -->
  <path d="M305,198 L246,220 L256,232 L308,224 Z" fill="#4a3a2c"/>
  <ellipse cx="352" cy="208" rx="60" ry="38" transform="rotate(-12 352 208)" fill="#8a7560"/>
  <path d="M320,200 Q335,215 350,222 M338,190 Q352,206 368,214 M305,208 Q318,222 332,228" stroke="#6a5744" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M388,200 C420,185 385,150 428,130" fill="none" stroke="#5a3e2b" stroke-width="20" stroke-linecap="round"/>
  <path d="M388,200 C420,185 385,150 428,130" transform="translate(5,1)" fill="none" stroke="#f1eadb" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="436" cy="124" rx="19" ry="15" fill="#f6efc2"/>
  <path d="M449,113 Q500,125 548,146 L549,150 Q500,142 450,126 Z" fill="#b9a98c"/>
  <path d="M450,126 Q500,142 549,150 Q520,172 480,160 Q455,152 450,126 Z" fill="#8a7a5f"/>
  <path d="M543,145 Q552,148 549,153 Q545,152 541,150 Z" fill="#c0532a"/>
  <circle cx="443" cy="118" r="3.2" fill="#111"/>
  <circle cx="444" cy="117" r="1" fill="#fff"/>
  <path d="M368,186 C420,176 495,196 556,224 L558,233 C500,226 430,232 372,226 Z" fill="#7b6650" stroke="#4d3d2e" stroke-width="2" stroke-linejoin="round"/>
  <path d="M440,196 Q500,206 545,226 M430,208 Q490,214 548,231" stroke="#4d3d2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="556" cy="229" rx="8" ry="6" fill="#3d3025"/>

  <!-- NEAR SIDE: leg, then crank/pedal -->
  <g stroke="#444" stroke-width="7" stroke-linecap="round" fill="none">
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="2s" repeatCount="indefinite"
        values="-24.56 375 240;-25.88 375 240;-31.41 375 240;-39.83 375 240;-52.39 375 240;-69.8 375 240;-86.25 375 240;-90.73 375 240;-82.8 375 240;-68 375 240;-50.15 375 240;-33.4 375 240;-24.56 375 240"/>
      <line x1="375" y1="240" x2="375" y2="315"/>
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="2s" repeatCount="indefinite"
          values="28.89 375 315;45.64 375 315;67.81 375 315;90.13 375 315;109.74 375 315;122.7 375 315;123.65 375 315;112.2 375 315;93.2 375 315;71.1 375 315;48.75 375 315;30.8 375 315;28.89 375 315"/>
        <line x1="375" y1="315" x2="375" y2="397"/>
      </g>
      <circle cx="375" cy="315" r="4.5" fill="#444" stroke="none"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 400 350" to="360 400 350" dur="2s" repeatCount="indefinite"/>
    <circle cx="400" cy="350" r="20" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="4 2"/>
    <line x1="400" y1="350" x2="400" y2="390" stroke="#888" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 400 390" to="-360 400 390" dur="2s" repeatCount="indefinite"/>
      <rect x="388" y="393" width="28" height="4" rx="1.5" fill="#222"/>
      <path d="M394,384 L402,384 L424,390 Q428,393 423,394 L396,394 Q392,390 394,384 Z" fill="#3a3a3a"/>
      <path d="M404,390 L424,390 L412,394 Z" fill="#555"/>
      <circle cx="400" cy="390" r="3.5" fill="#444"/>
    </g>
  </g>
  <circle cx="400" cy="350" r="6" fill="#333"/>
  <circle cx="375" cy="240" r="9" fill="#8a7560"/>
</svg>