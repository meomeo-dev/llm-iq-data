<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f5"/>
      <stop offset="1" stop-color="#e8f6fd"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="38" fill="#ffe27a"/>
  <rect x="0" y="473" width="800" height="87" fill="#d9c79a"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#b39e6b" stroke-width="3" stroke-dasharray="30 20">
    <animate attributeName="stroke-dashoffset" from="0" to="50" dur="0.25s" repeatCount="indefinite"/>
  </line>

  <!-- rear wheel -->
  <g transform="translate(230,390)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.64s" repeatCount="indefinite"/>
      <circle r="77" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="71" fill="none" stroke="#9a9a9a" stroke-width="2"/>
      <g stroke="#bbb" stroke-width="1.2">
        <line x1="0" y1="-71" x2="0" y2="71"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(22.5)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(45)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(67.5)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(90)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(112.5)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(135)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(157.5)"/>
      </g>
      <circle r="10" fill="#777" stroke="#444" stroke-width="2"/>
      <circle r="5" fill="#333"/>
      <circle cx="0" cy="-60" r="4" fill="#e03a2f"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(570,390)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.64s" repeatCount="indefinite"/>
      <circle r="77" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="71" fill="none" stroke="#9a9a9a" stroke-width="2"/>
      <g stroke="#bbb" stroke-width="1.2">
        <line x1="0" y1="-71" x2="0" y2="71"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(22.5)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(45)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(67.5)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(90)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(112.5)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(135)"/>
        <line x1="0" y1="-71" x2="0" y2="71" transform="rotate(157.5)"/>
      </g>
      <circle r="6" fill="#777" stroke="#444" stroke-width="2"/>
      <circle cx="0" cy="-60" r="4" fill="#e03a2f"/>
    </g>
  </g>

  <!-- chain -->
  <path d="M390,378 L230,381 M390,422 L230,399" stroke="#555" stroke-width="2" fill="none" stroke-dasharray="4 2"/>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="400" x2="352" y2="288"/>
    <line x1="352" y1="290" x2="510" y2="288"/>
    <line x1="390" y1="400" x2="520" y2="318"/>
    <line x1="390" y1="400" x2="230" y2="390"/>
    <line x1="356" y1="300" x2="230" y2="390"/>
    <line x1="508" y1="282" x2="522" y2="322" stroke-width="8"/>
    <line x1="522" y1="318" x2="570" y2="390" stroke="#a52f24"/>
  </g>
  <!-- stem and handlebar -->
  <g fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="508" y1="282" x2="503" y2="256"/>
    <path d="M497,254 Q525,244 545,256"/>
  </g>
  <line x1="538" y1="251" x2="548" y2="258" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <!-- seatpost and saddle -->
  <line x1="352" y1="288" x2="351" y2="280" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M322,282 Q345,272 376,280 Q378,286 368,288 Q345,284 328,291 Z" fill="#1c1c1c"/>

  <!-- far leg -->
  <path fill="none" stroke="#b86a1c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M360,272 L416,336 L352,400">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="M360,272 L416,336 L352,400;M360,272 L433,316 L363,373;M360,272 L443,289 L390,362;M360,272 L444,287 L417,373;M360,272 L436,310 L428,400;M360,272 L415,337 L417,427;M360,272 L397,348 L390,438;M360,272 L402,346 L363,427;M360,272 L416,336 L352,400"/>
  </path>
  <ellipse rx="13" ry="4.5" fill="#b86a1c" cx="356" cy="397">
    <animate attributeName="cx" dur="1.6s" repeatCount="indefinite" values="356;367;394;421;432;421;394;367;356"/>
    <animate attributeName="cy" dur="1.6s" repeatCount="indefinite" values="397;370;359;370;397;424;435;424;397"/>
  </ellipse>

  <!-- crankset -->
  <g transform="translate(390,400)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="22" fill="none" stroke="#888" stroke-width="3"/>
      <circle r="25" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="3 3"/>
      <line x1="0" y1="0" x2="38" y2="0" stroke="#444" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-38" y2="0" stroke="#444" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(38,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-13" y="-3.5" width="26" height="7" rx="2" fill="#222"/>
        </g>
      </g>
      <g transform="translate(-38,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-13" y="-3.5" width="26" height="7" rx="2" fill="#222"/>
        </g>
      </g>
      <circle r="6" fill="#555"/>
    </g>
  </g>

  <!-- pelican tail -->
  <path d="M305,242 L248,276 L262,286 L310,264 Z" fill="#4a3626"/>

  <!-- pelican body -->
  <g transform="rotate(-25 350 240)">
    <ellipse cx="350" cy="240" rx="60" ry="40" fill="#8a6a52"/>
    <ellipse cx="364" cy="252" rx="42" ry="22" fill="#cdb8a0"/>
  </g>

  <!-- neck -->
  <path d="M390,214 C402,192 394,172 412,154" fill="none" stroke="#4d3220" stroke-width="26" stroke-linecap="round"/>
  <path d="M396,214 C408,192 400,172 418,154" fill="none" stroke="#f6f1e6" stroke-width="16" stroke-linecap="round"/>

  <!-- head -->
  <ellipse cx="424" cy="148" rx="20" ry="17" fill="#f6f1e6"/>
  <path d="M406,142 Q424,120 442,140 Q424,134 406,142 Z" fill="#f2c94c"/>
  <!-- bill and pouch -->
  <path d="M437,163 Q492,206 548,176 L437,163 Z" fill="#c9a77a" stroke="#8a6a4a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M434,142 L550,170 L546,178 L436,160 Z" fill="#8c8f93" stroke="#5f6266" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M542,168 L552,170 L547,178 Z" fill="#d07a2a"/>
  <circle cx="433" cy="145" r="3.5" fill="#111"/>
  <circle cx="434" cy="144" r="1" fill="#fff"/>

  <!-- near leg -->
  <path fill="none" stroke="#e08a2c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M360,272 L436,310 L428,400">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="M360,272 L436,310 L428,400;M360,272 L415,337 L417,427;M360,272 L397,348 L390,438;M360,272 L402,346 L363,427;M360,272 L416,336 L352,400;M360,272 L433,316 L363,373;M360,272 L443,289 L390,362;M360,272 L444,287 L417,373;M360,272 L436,310 L428,400"/>
  </path>
  <ellipse rx="13" ry="4.5" fill="#e08a2c" cx="432" cy="397">
    <animate attributeName="cx" dur="1.6s" repeatCount="indefinite" values="432;421;394;367;356;367;394;421;432"/>
    <animate attributeName="cy" dur="1.6s" repeatCount="indefinite" values="397;424;435;424;397;370;359;370;397"/>
  </ellipse>
  <ellipse cx="362" cy="268" rx="20" ry="14" fill="#7a5c45"/>

  <!-- wing reaching the handlebar -->
  <path d="M368,214 Q460,212 535,248 L530,260 Q455,242 372,252 Z" fill="#5b4130" stroke="#3c2a1d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M385,232 Q455,228 520,252" fill="none" stroke="#8a6a52" stroke-width="2"/>
</svg>