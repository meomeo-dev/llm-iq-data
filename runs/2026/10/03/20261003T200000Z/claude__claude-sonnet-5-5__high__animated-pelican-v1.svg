<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f5"/>
      <stop offset="1" stop-color="#e9f6fc"/>
    </linearGradient>
    <g id="wheel">
      <circle r="67" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="61" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#9aa0a6" stroke-width="1">
        <line x1="-61" y1="0" x2="61" y2="0"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(30)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(60)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(90)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(120)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="7" fill="#555"/>
      <circle r="3" fill="#ddd"/>
      <circle cx="61" cy="0" r="3" fill="#e63946"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="690" cy="85" r="30" fill="#ffd966"/>
  <g fill="#ffffff" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" from="850 60" to="-250 60" dur="45s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="45" ry="14"/>
    <ellipse cx="25" cy="-10" rx="30" ry="14"/>
    <ellipse cx="-25" cy="-6" rx="25" ry="11"/>
  </g>
  <rect x="0" y="300" width="800" height="90" fill="#3a7ca5"/>
  <rect x="0" y="300" width="800" height="6" fill="#6fb1d6"/>
  <rect x="0" y="380" width="800" height="120" fill="#e3cf9a"/>
  <rect x="0" y="420" width="800" height="50" fill="#7c7f85"/>
  <g stroke="#f5f5f5" stroke-width="4">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="0.44s" repeatCount="indefinite"/>
    <line x1="-80" y1="445" x2="-40" y2="445"/>
    <line x1="0" y1="445" x2="40" y2="445"/>
    <line x1="80" y1="445" x2="120" y2="445"/>
    <line x1="160" y1="445" x2="200" y2="445"/>
    <line x1="240" y1="445" x2="280" y2="445"/>
    <line x1="320" y1="445" x2="360" y2="445"/>
    <line x1="400" y1="445" x2="440" y2="445"/>
    <line x1="480" y1="445" x2="520" y2="445"/>
    <line x1="560" y1="445" x2="600" y2="445"/>
    <line x1="640" y1="445" x2="680" y2="445"/>
    <line x1="720" y1="445" x2="760" y2="445"/>
    <line x1="800" y1="445" x2="840" y2="445"/>
  </g>
  <ellipse cx="400" cy="424" rx="200" ry="5" fill="#000" opacity="0.25"/>

  <!-- wheels -->
  <g transform="translate(250 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
      <circle r="9" fill="none" stroke="#333" stroke-width="2.5"/>
    </g>
  </g>
  <g transform="translate(550 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>

  <!-- far crank and far leg -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 350" to="360 390 350" dur="2s" repeatCount="indefinite"/>
    <line x1="390" y1="350" x2="360" y2="350" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 360 350" to="0 360 350" dur="2s" repeatCount="indefinite"/>
      <rect x="350" y="347" width="20" height="6" rx="2" fill="#222"/>
    </g>
  </g>
  <g stroke="#3d352e" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite" values="-47.6 360 258;-60.9 360 258;-76.8 360 258;-89.1 360 258;-90.3 360 258;-81.3 360 258;-66.2 360 258;-48.3 360 258;-30.9 360 258;-25.5 360 258;-30.4 360 258;-37.8 360 258;-47.6 360 258"/>
    <line x1="360" y1="258" x2="360" y2="318" stroke-width="8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite" values="88.3 360 318;106.3 360 318;116.5 360 318;115.3 360 318;103.1 360 318;84.1 360 318;61.9 360 318;38.8 360 318;18.8 360 318;21.9 360 318;43.5 360 318;66.6 360 318;88.3 360 318"/>
      <line x1="360" y1="318" x2="360" y2="386" stroke-width="6"/>
      <circle cx="360" cy="318" r="4.5" fill="#3d352e" stroke="none"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite" values="-40.7 360 386;-45.4 360 386;-39.7 360 386;-26.2 360 386;-12.8 360 386;-2.8 360 386;4.3 360 386;9.5 360 386;12.1 360 386;3.6 360 386;-13.1 360 386;-28.8 360 386;-40.7 360 386"/>
        <path d="M350 381 Q372 375 388 383 L386 387 L352 387 Z" fill="#4a423a" stroke="none"/>
      </g>
    </g>
  </g>

  <!-- frame -->
  <g stroke="#c0392b" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="390" y1="350" x2="352" y2="272"/>
    <line x1="355" y1="274" x2="503" y2="266"/>
    <line x1="390" y1="350" x2="503" y2="285"/>
    <line x1="390" y1="350" x2="250" y2="350"/>
    <line x1="352" y1="272" x2="250" y2="350"/>
    <line x1="500" y1="256" x2="508" y2="292" stroke-width="8"/>
    <line x1="508" y1="290" x2="550" y2="350" stroke="#a93226" stroke-width="5"/>
  </g>
  <line x1="352" y1="272" x2="349" y2="262" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M326 259 Q345 254 378 258 Q380 264 366 264 Q340 266 326 262 Z" fill="#2b2b2b"/>
  <line x1="500" y1="256" x2="497" y2="240" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M486 240 L506 238 Q526 236 528 248" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- chain -->
  <line x1="390" y1="335" x2="250" y2="343" stroke="#222" stroke-width="2" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="0.21s" repeatCount="indefinite"/>
  </line>
  <line x1="390" y1="365" x2="250" y2="357" stroke="#222" stroke-width="2" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-10" dur="0.21s" repeatCount="indefinite"/>
  </line>

  <!-- pelican tail, body, neck, head, bill -->
  <path d="M308 228 L256 254 L268 263 L314 247 Z" fill="#5b4636"/>
  <ellipse cx="345" cy="226" rx="56" ry="36" fill="#8a7660" transform="rotate(-20 345 226)"/>
  <ellipse cx="368" cy="232" rx="30" ry="22" fill="#a8977f" transform="rotate(-20 368 232)"/>
  <path d="M385 205 C405 200 408 170 418 148" fill="none" stroke="#f3eedf" stroke-width="16" stroke-linecap="round"/>
  <path d="M378 198 C398 190 400 165 408 146" fill="none" stroke="#5a3d2b" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="425" cy="136" rx="19" ry="15" fill="#f6f1e3"/>
  <ellipse cx="424" cy="130" rx="15" ry="8" fill="#f1d36a" opacity="0.85"/>
  <path d="M439 130 L524 152 Q527 156 522 158 L440 145 Z" fill="#a8977a"/>
  <path d="M440 145 Q478 188 522 158 Q480 162 440 145 Z" fill="#7f6f55"/>
  <path d="M520 150 Q531 153 524 161 Z" fill="#5a4a38"/>
  <circle cx="431" cy="130" r="4" fill="#fff"/>
  <circle cx="432" cy="130" r="2.6" fill="#111"/>

  <!-- near crank, chainring, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 350" to="360 390 350" dur="2s" repeatCount="indefinite"/>
    <circle cx="390" cy="350" r="15" fill="none" stroke="#333" stroke-width="3"/>
    <line x1="375" y1="350" x2="405" y2="350" stroke="#333" stroke-width="2"/>
    <line x1="390" y1="335" x2="390" y2="365" stroke="#333" stroke-width="2"/>
    <line x1="390" y1="350" x2="420" y2="350" stroke="#666" stroke-width="5" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 420 350" to="0 420 350" dur="2s" repeatCount="indefinite"/>
      <rect x="410" y="347" width="20" height="6" rx="2" fill="#111"/>
    </g>
  </g>
  <circle cx="390" cy="350" r="6" fill="#222"/>

  <!-- near leg -->
  <g stroke="#4a423a" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite" values="-66.2 360 258;-48.3 360 258;-30.9 360 258;-25.5 360 258;-30.4 360 258;-37.8 360 258;-47.6 360 258;-60.9 360 258;-76.8 360 258;-89.1 360 258;-90.3 360 258;-81.3 360 258;-66.2 360 258"/>
    <line x1="360" y1="258" x2="360" y2="318" stroke-width="9"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite" values="61.9 360 318;38.8 360 318;18.8 360 318;21.9 360 318;43.5 360 318;66.6 360 318;88.3 360 318;106.3 360 318;116.5 360 318;115.3 360 318;103.1 360 318;84.1 360 318;61.9 360 318"/>
      <line x1="360" y1="318" x2="360" y2="386" stroke-width="7"/>
      <circle cx="360" cy="318" r="5.5" fill="#4a423a" stroke="none"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite" values="4.3 360 386;9.5 360 386;12.1 360 386;3.6 360 386;-13.1 360 386;-28.8 360 386;-40.7 360 386;-45.4 360 386;-39.7 360 386;-26.2 360 386;-12.8 360 386;-2.8 360 386;4.3 360 386"/>
        <path d="M349 381 Q372 374 390 383 L388 388 L351 388 Z" fill="#5a5148" stroke="none"/>
      </g>
    </g>
  </g>

  <!-- wing resting on handlebar -->
  <path d="M362 204 C410 196 470 222 522 238 L526 248 C470 246 410 246 366 236 Z" fill="#6a4e3a" stroke="#4a3426" stroke-width="1.5"/>
  <path d="M400 214 C440 218 480 232 516 242" fill="none" stroke="#4a3426" stroke-width="1.2"/>
  <path d="M395 228 C440 232 480 240 518 246" fill="none" stroke="#4a3426" stroke-width="1.2"/>
  <circle cx="524" cy="243" r="5" fill="#3b2c20"/>
</svg>