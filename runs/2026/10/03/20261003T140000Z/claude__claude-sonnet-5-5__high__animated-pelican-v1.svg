<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#fdf1d6"/>
    </linearGradient>
    <g id="wheel">
      <circle r="80" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="74" fill="none" stroke="#a9a9a9" stroke-width="2"/>
      <g stroke="#8c8c8c" stroke-width="1">
        <line x1="-74" y1="0" x2="74" y2="0"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(22.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(45)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(67.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(90)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(112.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(135)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-66" r="4" fill="#ff8a00"/>
      <circle r="8" fill="#555" stroke="#222" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#fff3b0" opacity="0.9"/>
  <rect x="0" y="330" width="800" height="30" fill="#6bb6d6" opacity="0.5"/>
  <rect x="0" y="420" width="800" height="80" fill="#d8c08a"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#a88f5a" stroke-width="4" stroke-dasharray="30 24">
    <animate attributeName="stroke-dashoffset" from="0" to="-54" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="422" rx="260" ry="9" fill="#000" opacity="0.18"/>

  <!-- wheels -->
  <g transform="translate(230 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(570 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="395" y1="350" x2="358" y2="238"/>
    <line x1="358" y1="242" x2="520" y2="228"/>
    <line x1="395" y1="350" x2="526" y2="256"/>
    <line x1="395" y1="350" x2="230" y2="340"/>
    <line x1="360" y1="244" x2="230" y2="340"/>
    <path d="M528 256 Q545 295 570 340" stroke="#555" stroke-width="6"/>
    <line x1="520" y1="220" x2="529" y2="262" stroke="#7a1f16" stroke-width="9"/>
  </g>
  <!-- seat post and saddle -->
  <line x1="358" y1="238" x2="357" y2="230" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M328 228 Q345 222 388 226 Q392 232 372 233 Q350 234 328 232 Z" fill="#2b2b2b"/>
  <!-- stem and handlebar -->
  <path d="M520 222 L516 205 L540 198 Q558 196 556 214" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rear hub cog -->
  <circle cx="230" cy="340" r="8" fill="none" stroke="#444" stroke-width="3"/>

  <!-- chain -->
  <g fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.35s" repeatCount="indefinite"/>
    <line x1="395" y1="332" x2="230" y2="332"/>
    <line x1="395" y1="368" x2="230" y2="348"/>
  </g>

  <!-- far crank + pedal -->
  <g transform="translate(395 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="2.4s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#555" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(35 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="2.4s" repeatCount="indefinite"/>
          <rect x="-8" y="1" width="26" height="5" rx="2" fill="#333"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#b86a1c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
        d="M358 225 L420.9 286.5 L360 350 L374 352">
    <animate attributeName="d" dur="2.4s" repeatCount="indefinite" values="
      M358 225 L420.9 286.5 L360 350 L374 352;
      M358 225 L430.9 274.4 L364.7 332.5 L378.7 334.5;
      M358 225 L439.7 257.5 L377.5 319.7 L391.5 321.7;
      M358 225 L444.3 242.1 L395 315 L409 317;
      M358 225 L445 237.9 L412.5 319.7 L426.5 321.7;
      M358 225 L443.4 246.4 L425.3 332.5 L439.3 334.5;
      M358 225 L437.7 262.3 L430 350 L444 352;
      M358 225 L427.1 279.5 L425.3 367.5 L439.3 369.5;
      M358 225 L414.7 292.3 L412.5 380.3 L426.5 382.3;
      M358 225 L407.4 297.9 L395 385 L409 387;
      M358 225 L407.7 297.6 L377.5 380.3 L391.5 382.3;
      M358 225 L412.8 293.9 L364.7 367.5 L378.7 369.5;
      M358 225 L420.9 286.5 L360 350 L374 352"/>
  </path>

  <!-- tail -->
  <path d="M296 192 L252 214 L262 230 L305 214 Z" fill="#4a3426"/>
  <!-- body -->
  <ellipse cx="345" cy="190" rx="58" ry="37" transform="rotate(-12 345 190)" fill="#7a5a46"/>
  <path d="M310 205 Q345 232 385 205" fill="none" stroke="#a88465" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="372" cy="196" rx="26" ry="22" fill="#8a6a54"/>

  <!-- neck and head -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 385 172;2 385 172;-2 385 172" dur="1.2s" repeatCount="indefinite"/>
    <path d="M385 172 C415 165 395 120 420 100" fill="none" stroke="#f4efe6" stroke-width="20" stroke-linecap="round"/>
    <path d="M377 168 C402 150 385 118 410 98" fill="none" stroke="#5a3d2b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="428" cy="88" r="17" fill="#f7f2e8"/>
    <path d="M414 80 Q428 66 442 80 Q428 76 414 80 Z" fill="#f2d96b"/>
    <path d="M440 82 L512 104 Q514 108 508 108 L440 98 Z" fill="#9b8b76"/>
    <path d="M440 96 Q468 128 508 108 L440 98 Z" fill="#c9a46a"/>
    <path d="M508 103 Q516 104 513 110 L507 108 Z" fill="#6e5c48"/>
    <circle cx="432" cy="84" r="4" fill="#fff"/>
    <circle cx="433" cy="84" r="2.5" fill="#111"/>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#e8892b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M358 225 L437.7 262.3 L430 350 L444 352">
    <animate attributeName="d" dur="2.4s" repeatCount="indefinite" values="
      M358 225 L437.7 262.3 L430 350 L444 352;
      M358 225 L427.1 279.5 L425.3 367.5 L439.3 369.5;
      M358 225 L414.7 292.3 L412.5 380.3 L426.5 382.3;
      M358 225 L407.4 297.9 L395 385 L409 387;
      M358 225 L407.7 297.6 L377.5 380.3 L391.5 382.3;
      M358 225 L412.8 293.9 L364.7 367.5 L378.7 369.5;
      M358 225 L420.9 286.5 L360 350 L374 352;
      M358 225 L430.9 274.4 L364.7 332.5 L378.7 334.5;
      M358 225 L439.7 257.5 L377.5 319.7 L391.5 321.7;
      M358 225 L444.3 242.1 L395 315 L409 317;
      M358 225 L445 237.9 L412.5 319.7 L426.5 321.7;
      M358 225 L443.4 246.4 L425.3 332.5 L439.3 334.5;
      M358 225 L437.7 262.3 L430 350 L444 352"/>
  </path>

  <!-- near crank, chainring, pedal -->
  <g transform="translate(395 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
      <circle r="18" fill="none" stroke="#444" stroke-width="4"/>
      <circle r="12" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="3 4"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <circle r="5" fill="#222"/>
      <g transform="translate(35 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.4s" repeatCount="indefinite"/>
          <rect x="-8" y="1" width="26" height="5" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
  </g>

  <!-- wing reaching handlebar -->
  <path d="M350 170 C400 165 470 190 545 195 L548 203 C470 207 400 207 355 195 Z" fill="#6b4a37"/>
  <path d="M362 180 C410 178 470 195 540 199" fill="none" stroke="#8a6650" stroke-width="3" stroke-linecap="round"/>
  <circle cx="548" cy="199" r="6" fill="#4a3426"/>
</svg>