<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f5"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="80" rx="50" ry="16"/>
    <ellipse cx="185" cy="68" rx="32" ry="14"/>
    <ellipse cx="520" cy="50" rx="44" ry="13"/>
    <ellipse cx="548" cy="40" rx="26" ry="11"/>
  </g>
  <rect x="0" y="422" width="800" height="58" fill="#c9b27c"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#a89260" stroke-width="3" stroke-dasharray="30 20">
    <animate attributeName="stroke-dashoffset" from="0" to="50" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="458" x2="800" y2="458" stroke="#b39d6a" stroke-width="2" stroke-dasharray="14 36">
    <animate attributeName="stroke-dashoffset" from="0" to="50" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- Rear wheel -->
  <g transform="translate(230,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#9aa5ad" stroke-width="2"/>
      <g stroke="#b8c0c6" stroke-width="1.3">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(22.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(45)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(67.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(112.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(135)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="9" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 2"/>
      <circle r="6" fill="#666"/>
      <circle cx="0" cy="-58" r="3" fill="#e0402a"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g transform="translate(560,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#9aa5ad" stroke-width="2"/>
      <g stroke="#b8c0c6" stroke-width="1.3">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(22.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(45)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(67.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(112.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(135)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="6" fill="#666"/>
      <circle cx="0" cy="-58" r="3" fill="#e0402a"/>
    </g>
  </g>

  <!-- Far side crank and pedal -->
  <g transform="translate(400,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3d3d3d" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="2s" repeatCount="indefinite"/>
          <rect x="-10" y="1" width="20" height="4" rx="1.5" fill="#222"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Far leg -->
  <g transform="translate(372,242)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-39.9;-59.6;-82.6;-84.3;-65.6;-39.9;-23.9;-28.4;-39.9" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#2f2924" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(0,80)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="88.1;114.2;119.7;100.2;68.8;36.4;26.9;55.2;88.1" dur="2s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="85" stroke="#2f2924" stroke-width="6" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="4.5" fill="#2f2924"/>
          <g transform="translate(0,85)">
            <g>
              <animateTransform attributeName="transform" type="rotate" values="-48.2;-54.6;-37.1;-15.9;-3.2;3.5;-3;-26.8;-48.2" dur="2s" repeatCount="indefinite"/>
              <polygon points="-6,-5 6,-6 22,-2 21,1 -6,1" fill="#3a322c"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Chain -->
  <g stroke="#444" stroke-width="2.5" stroke-dasharray="3 2" fill="none">
    <line x1="400" y1="338" x2="230" y2="341"/>
    <line x1="400" y1="382" x2="230" y2="359"/>
  </g>

  <!-- Frame -->
  <g fill="none" stroke="#2a6fb0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="400" y1="360" x2="362" y2="252"/>
    <line x1="362" y1="252" x2="516" y2="254"/>
    <line x1="518" y1="252" x2="530" y2="284"/>
    <line x1="530" y1="284" x2="400" y2="360"/>
    <line x1="400" y1="360" x2="230" y2="350" stroke-width="6"/>
    <line x1="362" y1="252" x2="230" y2="350" stroke-width="5"/>
  </g>
  <line x1="526" y1="278" x2="560" y2="350" stroke="#7d8a94" stroke-width="6" stroke-linecap="round"/>
  <line x1="516" y1="250" x2="510" y2="228" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <path d="M510,228 C524,222 544,226 552,242" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <circle cx="400" cy="360" r="7" fill="#555"/>
  <circle cx="230" cy="350" r="4" fill="#333"/>
  <circle cx="560" cy="350" r="4" fill="#333"/>

  <!-- Saddle -->
  <line x1="362" y1="252" x2="360" y2="240" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M338,238 Q360,231 386,240 Q394,244 386,247 Q360,247 338,243 Z" fill="#222"/>

  <!-- Pelican upper body -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="1s" repeatCount="indefinite"/>
    <polygon points="322,200 285,218 324,232" fill="#5a4a3c"/>
    <ellipse cx="368" cy="212" rx="56" ry="32" transform="rotate(15 368 212)" fill="#7a6a58"/>
    <ellipse cx="380" cy="222" rx="36" ry="18" transform="rotate(15 380 222)" fill="#948268" opacity="0.7"/>
    <path d="M405,205 C392,172 430,172 440,136" fill="none" stroke="#5b3f27" stroke-width="10" stroke-linecap="round" transform="translate(-5,2)"/>
    <path d="M405,205 C392,172 430,172 440,136" fill="none" stroke="#f4ecd0" stroke-width="13" stroke-linecap="round"/>
    <circle cx="446" cy="126" r="14" fill="#f6edc0"/>
    <path d="M434,120 Q446,106 460,116 Q448,114 436,126 Z" fill="#f2d65a"/>
    <path d="M454,130 L526,142 Q494,162 456,142 Z" fill="#a8896a"/>
    <path d="M454,119 L530,138 L526,142 L454,130 Z" fill="#8a7f6a"/>
    <path d="M526,138 L533,141 L526,144 Z" fill="#d6552e"/>
    <circle cx="447" cy="121" r="2.8" fill="#111"/>
    <circle cx="446.2" cy="120.2" r="0.9" fill="#fff"/>
    <path d="M398,205 Q455,222 528,228" fill="none" stroke="#5a4632" stroke-width="14" stroke-linecap="round"/>
    <path d="M404,210 Q455,226 520,232" fill="none" stroke="#6f5a42" stroke-width="5" stroke-linecap="round"/>
    <circle cx="530" cy="228" r="7" fill="#5a4632"/>
  </g>

  <!-- Near crank, chainring and pedal -->
  <g transform="translate(400,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="22" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="4 3"/>
      <circle r="15" fill="none" stroke="#777" stroke-width="2"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#555" stroke-width="7" stroke-linecap="round"/>
      <circle r="6" fill="#888"/>
      <g transform="translate(40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-10" y="1" width="20" height="4" rx="1.5" fill="#111"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Near leg -->
  <g transform="translate(372,242)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-65.6;-39.9;-23.9;-28.4;-39.9;-59.6;-82.6;-84.3;-65.6" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#4a3f38" stroke-width="8" stroke-linecap="round"/>
      <g transform="translate(0,80)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="68.8;36.4;26.9;55.2;88.1;114.2;119.7;100.2;68.8" dur="2s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="85" stroke="#4a3f38" stroke-width="6.5" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="5" fill="#4a3f38"/>
          <g transform="translate(0,85)">
            <g>
              <animateTransform attributeName="transform" type="rotate" values="-3.2;3.5;-3;-26.8;-48.2;-54.6;-37.1;-15.9;-3.2" dur="2s" repeatCount="indefinite"/>
              <polygon points="-6,-5 6,-6 22,-2 21,1 -6,1" fill="#5a4d44"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>