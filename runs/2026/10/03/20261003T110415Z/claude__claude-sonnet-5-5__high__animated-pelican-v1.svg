<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset="1" stop-color="#e9f6fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#1f1f1f" stroke-width="7"/>
      <circle r="65" fill="none" stroke="#b9bec4" stroke-width="2.5"/>
      <g stroke="#8a9096" stroke-width="1.1">
        <line x1="-65" y1="0" x2="65" y2="0"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(22.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(45)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(67.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(90)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(112.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(135)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="58" cy="0" r="3.5" fill="#d33a2c"/>
      <circle r="7" fill="#666"/>
      <circle r="3" fill="#ddd"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe27a" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="60s" repeatCount="indefinite"/>
      <ellipse cx="860" cy="90" rx="50" ry="14"/>
      <ellipse cx="890" cy="78" rx="34" ry="14"/>
      <ellipse cx="830" cy="80" rx="30" ry="12"/>
    </g>
  </g>
  <rect x="0" y="402" width="800" height="98" fill="#d8cdb2"/>
  <rect x="0" y="402" width="800" height="4" fill="#8c7d5f"/>
  <g stroke="#a89877" stroke-width="4" fill="none">
    <line x1="-120" y1="430" x2="920" y2="430" stroke-dasharray="60 60">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.327s" repeatCount="indefinite"/>
    </line>
    <line x1="-120" y1="462" x2="920" y2="462" stroke-dasharray="30 30">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.327s" repeatCount="indefinite"/>
    </line>
  </g>
  <ellipse cx="400" cy="405" rx="210" ry="8" fill="#000000" opacity="0.15"/>

  <!-- far-side crank, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 390 340" to="540 390 340" dur="2.8s" repeatCount="indefinite"/>
    <line x1="390" y1="340" x2="416" y2="340" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 416 340" to="-540 416 340" dur="2.8s" repeatCount="indefinite"/>
      <g transform="translate(416,340)">
        <rect x="-10" y="3" width="20" height="4" rx="1.5" fill="#1a1a1a"/>
        <path d="M-4,-3 Q8,-4 17,2 L17,3 L-5,3 Z" fill="#a86a2c" stroke="#5e3a14" stroke-width="0.8"/>
      </g>
    </g>
  </g>

  <!-- far-side leg -->
  <path fill="none" stroke="#2f2a26" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M362,232 L407.5,285.2 L364,340">
    <animate attributeName="d" dur="2.8s" repeatCount="indefinite" calcMode="linear" values="M362,232 L407.5,285.2 L364,340;M362,232 L416,276.5 L367.5,327;M362,232 L423.6,265.2 L377,317.5;M362,232 L428,255.2 L390,314;M362,232 L428.9,252.5 L403,317.5;M362,232 L426.8,258.5 L412.5,327;M362,232 L420.7,270.2 L416,340;M362,232 L409.9,283.1 L412.5,353;M362,232 L396.7,292.8 L403,362.5;M362,232 L390.3,296 L390,366;M362,232 L393.5,294.5 L377,362.5;M362,232 L399.8,290.9 L367.5,353;M362,232 L407.5,285.2 L364,340"/>
  </path>

  <!-- wheels -->
  <g transform="translate(250,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="9" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="2 1.5"/>
    </g>
  </g>
  <g transform="translate(550,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#3a3a3a" stroke-width="2" stroke-dasharray="3 2">
    <line x1="390" y1="325" x2="250" y2="321"/>
    <line x1="390" y1="355" x2="250" y2="339"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="340" x2="352" y2="250"/>
    <line x1="354" y1="255" x2="505" y2="244"/>
    <line x1="390" y1="340" x2="508" y2="252"/>
    <line x1="390" y1="340" x2="250" y2="330"/>
    <line x1="355" y1="256" x2="250" y2="330"/>
    <line x1="503" y1="232" x2="512" y2="258" stroke-width="8"/>
  </g>
  <line x1="512" y1="258" x2="550" y2="330" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>
  <!-- handlebar -->
  <g fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round">
    <line x1="503" y1="232" x2="500" y2="216" stroke-width="5"/>
    <path d="M500,216 Q520,204 534,218" stroke-width="4"/>
    <line x1="528" y1="212" x2="536" y2="220" stroke-width="7" stroke="#111"/>
  </g>
  <!-- seatpost and saddle -->
  <line x1="352" y1="250" x2="352" y2="241" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <path d="M334,242 Q350,234 380,238 Q385,243 378,246 L338,247 Z" fill="#222"/>

  <!-- near-side crank, chainring, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 340" to="360 390 340" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="390" cy="340" r="15" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>
    <circle cx="390" cy="340" r="11" fill="none" stroke="#777" stroke-width="1.5"/>
    <line x1="390" y1="340" x2="416" y2="340" stroke="#666" stroke-width="6" stroke-linecap="round"/>
    <circle cx="390" cy="340" r="5" fill="#bbb" stroke="#444" stroke-width="1.5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 416 340" to="-360 416 340" dur="2.8s" repeatCount="indefinite"/>
      <g transform="translate(416,340)">
        <rect x="-10" y="3" width="20" height="4" rx="1.5" fill="#1a1a1a"/>
        <path d="M-4,-3 Q8,-4 17,2 L17,3 L-5,3 Z" fill="#d08a3e" stroke="#7a4d1c" stroke-width="0.8"/>
        <path d="M6,3 L17,2 M11,3 L17,3" stroke="#7a4d1c" stroke-width="0.8" fill="none"/>
      </g>
    </g>
  </g>

  <!-- near-side leg -->
  <path fill="none" stroke="#4a4038" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M362,232 L420.7,270.2 L416,340">
    <animate attributeName="d" dur="2.8s" repeatCount="indefinite" calcMode="linear" values="M362,232 L420.7,270.2 L416,340;M362,232 L409.9,283.1 L412.5,353;M362,232 L396.7,292.8 L403,362.5;M362,232 L390.3,296 L390,366;M362,232 L393.5,294.5 L377,362.5;M362,232 L399.8,290.9 L367.5,353;M362,232 L407.5,285.2 L364,340;M362,232 L416,276.5 L367.5,327;M362,232 L423.6,265.2 L377,317.5;M362,232 L428,255.2 L390,314;M362,232 L428.9,252.5 L403,317.5;M362,232 L426.8,258.5 L412.5,327;M362,232 L420.7,270.2 L416,340"/>
  </path>

  <!-- pelican: tail -->
  <path d="M338,198 L294,224 L300,236 L346,226 Z" fill="#4e4339" stroke="#352d25" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="385" cy="196" rx="60" ry="42" transform="rotate(-8 385 196)" fill="#8b7a66" stroke="#5b4e40" stroke-width="2"/>
  <ellipse cx="402" cy="212" rx="38" ry="22" transform="rotate(-8 402 212)" fill="#a8998a" opacity="0.7"/>
  <!-- neck -->
  <path d="M410,168 Q434,158 430,128" fill="none" stroke="#5b3d28" stroke-width="10" stroke-linecap="round"/>
  <path d="M422,172 Q448,162 441,128" fill="none" stroke="#f6f1e2" stroke-width="20" stroke-linecap="round"/>
  <!-- head -->
  <ellipse cx="446" cy="120" rx="19" ry="15" fill="#f8f3dc" stroke="#d9d0a8" stroke-width="1"/>
  <ellipse cx="442" cy="111" rx="14" ry="7" fill="#f1d44f" opacity="0.85"/>
  <circle cx="454" cy="117" r="3.2" fill="#1a1a1a"/>
  <circle cx="455" cy="116" r="1" fill="#ffffff"/>
  <!-- bill -->
  <path d="M462,115 L538,138 Q549,141 543,150 L462,130 Z" fill="#9a9486" stroke="#5f5a4f" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M462,128 Q498,168 541,149 L462,126 Z" fill="#b9ae8e" stroke="#7d7358" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- wing reaching to handlebar -->
  <path d="M380,178 Q440,170 530,214 Q526,221 518,219 Q470,216 424,238 Q392,240 366,214 Z" fill="#6a5a49" stroke="#3f352b" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#3f352b" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M400,186 Q450,190 508,212"/>
    <path d="M395,200 Q440,206 480,220"/>
    <path d="M385,214 Q410,224 440,230"/>
  </g>
</svg>