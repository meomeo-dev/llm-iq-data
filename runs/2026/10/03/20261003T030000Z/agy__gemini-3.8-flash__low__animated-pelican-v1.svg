<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Sky & Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="55%" stop-color="#E0F7FA"/>
      <stop offset="75%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0097A7"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>

    <!-- Metallic & Bicycle Gradients -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474F"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>

    <!-- Pelican Shading Gradients -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCA28"/>
      <stop offset="60%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D4C41"/>
      <stop offset="50%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="40%" stop-color="#5D4037"/>
      <stop offset="85%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>

    <!-- Reusable Spoked Wheel (Radius 115) -->
    <g id="spoked-wheel">
      <!-- Outer Tire -->
      <circle cx="0" cy="0" r="115" fill="none" stroke="#212121" stroke-width="16"/>
      <circle cx="0" cy="0" r="119" fill="none" stroke="#37474F" stroke-width="2"/>
      <circle cx="0" cy="0" r="107" fill="none" stroke="#455A64" stroke-width="3"/>
      <!-- Metallic Rim -->
      <circle cx="0" cy="0" r="103" fill="none" stroke="url(#metalGrad)" stroke-width="7"/>
      <!-- 16 Spokes -->
      <g stroke="#B0BEC5" stroke-width="1.8" opacity="0.85">
        <line x1="0" y1="-100" x2="0" y2="100"/>
        <line x1="-100" y1="0" x2="100" y2="0"/>
        <line x1="-70.7" y1="-70.7" x2="70.7" y2="70.7"/>
        <line x1="70.7" y1="-70.7" x2="-70.7" y2="70.7"/>
        <line x1="-92.4" y1="-38.3" x2="92.4" y2="38.3"/>
        <line x1="-38.3" y1="-92.4" x2="38.3" y2="92.4"/>
        <line x1="38.3" y1="-92.4" x2="-38.3" y2="92.4"/>
        <line x1="92.4" y1="-38.3" x2="-92.4" y2="38.3"/>
      </g>
      <!-- Hub & Cog -->
      <circle cx="0" cy="0" r="18" fill="url(#metalGrad)" stroke="#455A64" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#263238"/>
      <!-- Valve Stem Reflector Marker for clear rotation visibility -->
      <circle cx="0" cy="-80" r="5" fill="#FFC107" stroke="#FFA000" stroke-width="1.5"/>
    </g>

    <style><![CDATA[
      /* Wheel Rotations (Axle positions: Rear at (250,500), Front at (730,500)) */
      .wheel-spin-rear {
        transform-origin: 250px 500px;
        animation: spin 1.8s linear infinite;
      }
      .wheel-spin-front {
        transform-origin: 730px 500px;
        animation: spin 1.8s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Cranksets revolving around Bottom Bracket at (470, 500) */
      .crank-revolve {
        transform-origin: 470px 500px;
        animation: spin 1.8s linear infinite;
      }
      /* Counter-rotate pedals so they remain horizontal */
      .pedal-counter-spin {
        animation: counter-spin 1.8s linear infinite;
      }
      @keyframes counter-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }

      /* Smooth Synchronized Pelvis / Body Bobbing */
      .pelican-body-bob {
        animation: pelicanBob 0.9s ease-in-out infinite alternate;
        transform-origin: 395px 330px;
      }
      @keyframes pelicanBob {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(3.5px) rotate(0.8deg); }
      }

      /* Coastal Scenery Motion */
      .road-dashes {
        animation: roadScroll 0.6s linear infinite;
      }
      @keyframes roadScroll {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-160px); }
      }
      .wave-slide {
        animation: waveScroll 3.6s linear infinite;
      }
      @keyframes waveScroll {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-200px); }
      }

      /* Synchronized Leg Linkages (SMIL used for precision knee & foot keyframes) */
    ]]></style>
  </defs>

  <!-- BACKGROUND: Pacific Coastline & Sunset -->
  <rect x="0" y="0" width="1000" height="700" fill="url(#skyGrad)"/>
  <circle cx="820" cy="240" r="70" fill="url(#sunGrad)" opacity="0.8"/>
  
  <!-- Coastal Hills -->
  <path d="M0,450 Q220,380 440,430 T880,420 Q950,430 1000,440 L1000,530 L0,530 Z" fill="#8D6E63" opacity="0.65"/>
  <path d="M0,470 Q300,420 600,465 T1000,455 L1000,540 L0,540 Z" fill="#5D4037" opacity="0.75"/>

  <!-- Ocean Waves -->
  <rect x="0" y="500" width="1000" height="70" fill="url(#seaGrad)"/>
  <g class="wave-slide" fill="none" stroke="#80DEEA" stroke-width="3" opacity="0.6">
    <path d="M-200,520 Q -150,510 -100,520 T 0,520 T 100,520 T 200,520 T 300,520 T 400,520 T 500,520 T 600,520 T 700,520 T 800,520 T 900,520 T 1000,520 T 1100,520 T 1200,520" />
    <path d="M-200,535 Q -150,528 -100,535 T 0,535 T 100,535 T 200,535 T 300,535 T 400,535 T 500,535 T 600,535 T 700,535 T 800,535 T 900,535 T 1000,535 T 1100,535 T 1200,535" opacity="0.5"/>
  </g>

  <!-- Pavement / Roadway & Pier Boardwalk -->
  <rect x="0" y="570" width="1000" height="130" fill="#37474F"/>
  <rect x="0" y="570" width="1000" height="10" fill="#90A4AE"/>
  <!-- Animated Road Lane Lines -->
  <g class="road-dashes" stroke="#ECEFF1" stroke-width="6" stroke-dasharray="70 90">
    <line x1="-160" y1="640" x2="1160" y2="640"/>
  </g>

  <!-- Cast Shadows (Bicycle + Pelican) -->
  <ellipse cx="250" cy="615" rx="80" ry="12" fill="#212121" opacity="0.35"/>
  <ellipse cx="730" cy="615" rx="80" ry="12" fill="#212121" opacity="0.35"/>
  <ellipse cx="480" cy="618" rx="140" ry="16" fill="#212121" opacity="0.4"/>

  <!-- ================= BICYCLE LAYER ================= -->

  <!-- REAR WHEEL (Spun by CSS around axle at cx=250, cy=500) -->
  <g class="wheel-spin-rear">
    <use href="#spoked-wheel" x="250" y="500"/>
  </g>

  <!-- FRONT WHEEL (Spun by CSS around axle at cx=730, cy=500) -->
  <g class="wheel-spin-front">
    <use href="#spoked-wheel" x="730" y="500"/>
  </g>

  <!-- BICYCLE FRAMEWORK -->
  <!-- Bottom Bracket at (470, 500) -->
  <!-- Rear Dropout at (250, 500) -->
  <!-- Seat Junction / Lug at (390, 360) -->
  <!-- Head Tube top at (675, 340), bottom at (695, 410) -->
  <!-- Front Dropout / Axle at (730, 500) -->
  <g>
    <!-- Rear Chainstay & Seatstay -->
    <line x1="250" y1="500" x2="470" y2="500" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="250" y1="500" x2="390" y2="360" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Drive Chain -->
    <path d="M 250,488 L 470,480 A 24,24 0 0,1 470,520 L 250,512 A 12,12 0 0,1 250,488 Z" fill="none" stroke="#78909C" stroke-width="5" stroke-dasharray="7 3"/>
    
    <!-- Main Triangle (Seat Tube, Down Tube, Top Tube) -->
    <line x1="470" y1="500" x2="390" y2="360" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/>
    <line x1="470" y1="500" x2="695" y2="410" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/>
    <line x1="390" y1="360" x2="675" y2="340" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Head Tube -->
    <line x1="675" y1="340" x2="695" y2="410" stroke="url(#frameGrad)" stroke-width="15" stroke-linecap="round"/>
    
    <!-- Front Fork (Head tube bottom to front axle) -->
    <line x1="695" y1="410" x2="730" y2="500" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Seatpost & Saddle -->
    <line x1="390" y1="360" x2="375" y2="310" stroke="url(#metalGrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- Racing Cruiser Saddle tailored for Pelican -->
    <path d="M335,310 C345,296 385,296 415,306 C425,310 425,316 415,318 C390,320 365,322 340,322 C330,322 328,318 335,310 Z" fill="#2E1C14" stroke="#1B0000" stroke-width="2"/>
    <path d="M336,310 C350,302 385,302 410,310" stroke="#8D6E63" stroke-width="2" fill="none"/>

    <!-- Stem & Classic Cruiser / Swept Handlebars -->
    <path d="M675,340 L670,290 L650,285" fill="none" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M640,295 Q655,275 680,282 Q700,288 665,315" fill="none" stroke="#263238" stroke-width="10" stroke-linecap="round"/>
    <circle cx="665" cy="315" r="7" fill="#D84315"/> <!-- Grip End -->
  </g>

  <!-- ================= BACKGROUND CRANK & LEFT LEG ================= -->
  <!-- Left Crank starts 180 degrees opposite right crank (Pointing upward-left at 0s) -->
  <g class="crank-revolve">
    <!-- Chainring at BB -->
    <circle cx="470" cy="500" r="28" fill="url(#metalGrad)" stroke="#37474F" stroke-width="3"/>
    
    <!-- Left Crank Arm (Radius 45, Angle 180 deg relative to front) -->
    <g>
      <line x1="470" y1="500" x2="435" y2="465" stroke="#78909C" stroke-width="9" stroke-linecap="round"/>
      <!-- Left Pedal Spindle at (435, 465) -->
      <g transform="translate(435, 465)">
        <g class="pedal-counter-spin" transform-origin="0 0">
          <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#455A64" stroke="#263238" stroke-width="1.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- LEFT LEG (Far Side / Darker Silhouette) -->
  <!-- Hip at (375, 335), moves down-forward to (435, 465) on cycle -->
  <g opacity="0.85">
    <path fill="none" stroke="#BF360C" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
        values="
          M 375,335 Q 400,390 435,465;
          M 375,335 Q 455,420 470,545;
          M 375,335 Q 470,455 505,535;
          M 375,335 Q 430,370 470,455;
          M 375,335 Q 400,390 435,465
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
      />
    </path>
    <!-- Left Webbed Foot -->
    <polygon fill="#E64A19">
      <animate attributeName="points" dur="1.8s" repeatCount="indefinite"
        values="
          420,465 448,460 440,474;
          455,545 483,540 475,554;
          490,535 518,530 510,544;
          455,455 483,450 475,464;
          420,465 448,460 440,474
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
      />
    </polygon>
  </g>


  <!-- ================= PELICAN BODY & HEAD ================= -->
  <!-- Anchored on Saddle with rhythmic breathing / bobbing -->
  <g class="pelican-body-bob">
    
    <!-- Tail Feathers -->
    <path d="M 320,335 C 300,330 280,345 270,360 C 285,360 310,355 330,350 Z" fill="#3E2723"/>
    <path d="M 325,330 C 295,315 285,330 275,345 C 295,348 320,345 335,340 Z" fill="#4E342E"/>

    <!-- Main Torso / Body -->
    <path d="M 345,315 C 330,335 340,375 365,395 C 400,420 455,410 475,375 C 490,350 480,315 445,305 C 410,295 365,300 345,315 Z" fill="url(#featherGrad)" stroke="#271810" stroke-width="2"/>

    <!-- Wing & Layered Feathers -->
    <path d="M 360,320 C 375,305 435,305 455,340 C 465,360 450,400 410,405 C 380,410 355,375 355,350 Z" fill="#4E342E" stroke="#3E2723" stroke-width="2"/>
    <!-- Wing Coverts & Scapulars -->
    <path d="M 370,330 Q 405,335 435,360 Q 405,385 375,370 Z" fill="#5D4037" opacity="0.9"/>
    <path d="M 380,345 Q 415,350 440,380" stroke="#8D6E63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 370,360 Q 400,365 425,395" stroke="#795548" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Pelican S-Curved Neck -->
    <!-- California brown pelicans have rich dark chestnut rear hindneck and striking white crest/foreneck during breeding season -->
    <path d="M 445,315 C 475,305 505,270 495,210 C 490,175 460,165 480,130 C 490,110 520,105 540,115 C 555,125 550,150 535,170 C 515,200 525,235 500,285 C 485,315 460,325 445,315 Z" fill="url(#neckGrad)"/>
    <!-- Chestnut nape stripe -->
    <path d="M 495,210 C 490,175 460,165 480,130 C 488,115 510,110 525,115 C 500,125 480,150 488,180 C 495,205 480,240 460,285" fill="#3E2723"/>

    <!-- Head & Pale Yellowish Crest -->
    <path d="M 520,120 C 525,95 550,85 570,95 C 585,102 590,118 580,135 C 565,150 535,145 520,120 Z" fill="#FFFDE7"/>
    <path d="M 530,95 Q 545,80 565,85 Q 555,98 540,100" fill="#FFF59D"/> <!-- Crest Tuft -->

    <!-- Piercing Pelican Eye & Bare Orbital Patch -->
    <circle cx="560" cy="115" r="9" fill="#B0BEC5"/> <!-- Bare skin around eye -->
    <circle cx="560" cy="115" r="5" fill="#ECEFF1"/> <!-- Iris -->
    <circle cx="560" cy="115" r="2.5" fill="#000000"/> <!-- Pupil -->
    <circle cx="561.5" cy="113.5" r="1" fill="#FFFFFF"/> <!-- Catchlight -->

    <!-- Giant Beak & Gular Pouch -->
    <!-- Upper Maxilla -->
    <path d="M 575,110 L 730,145 C 738,147 738,153 728,154 L 570,135 Z" fill="#90A4AE" stroke="#607D8B" stroke-width="1.5"/>
    <path d="M 726,145 Q 736,148 733,153 Q 720,150 715,147 Z" fill="#D84315"/> <!-- Orange beak hook -->
    <line x1="580" y1="122" x2="725" y2="148" stroke="#37474F" stroke-width="2"/> <!-- Tomium/Mouthline -->

    <!-- Deep Gular Pouch -->
    <path d="M 570,135 C 585,185 640,215 690,175 L 726,152 C 670,185 615,175 570,135 Z" fill="url(#pouchGrad)" stroke="#BF360C" stroke-width="1.5"/>
    <!-- Pouch Stretch Texture Lines -->
    <path d="M 600,148 Q 630,178 660,165" stroke="#FFA726" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M 625,155 Q 650,182 680,165" stroke="#FFA726" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- Wing / Arm reaching out to handlebar -->
    <!-- Wing shoulder starts at (440, 320) extending down-forward to grip handlebar at (665, 315) -->
    <path d="M 435,325 C 475,325 540,315 580,310 C 615,305 645,305 665,315 C 655,325 635,328 600,332 C 555,338 480,355 435,340 Z" fill="#4E342E" stroke="#3E2723" stroke-width="2"/>
    <!-- Primary Flight feather tips resting on bar / mimicking gripping feathers -->
    <path d="M 660,312 C 672,310 675,322 662,324 C 650,326 648,314 660,312 Z" fill="#2E1C14"/>
    <path d="M 655,318 C 665,318 667,328 656,329 C 648,330 646,321 655,318 Z" fill="#2E1C14"/>

    <!-- Stylish Pelican Coastal Cap / Visor (fun thematic touch) -->
    <path d="M 525,98 C 540,88 565,88 580,102 L 610,108 C 612,112 605,116 590,114 L 565,108 Z" fill="#00838F"/>
    <path d="M 535,93 C 548,87 568,88 578,98" stroke="#FFD54F" stroke-width="2" fill="none"/>
  </g>

  <!-- ================= FOREGROUND CRANK, PEDAL & RIGHT LEG ================= -->
  <!-- Right Crank revolves clockwise in sync with left crank, starting pointing forward-down (505, 535) -->
  <g class="crank-revolve">
    <!-- Right Crank Arm (Length 50) -->
    <line x1="470" y1="500" x2="505" y2="535" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Chrome Spindle Cap -->
    <circle cx="470" cy="500" r="12" fill="url(#metalGrad)" stroke="#37474F" stroke-width="2"/>
    <circle cx="470" cy="500" r="4" fill="#E65100"/>

    <!-- Right Pedal Assembly at (505, 535) -->
    <g transform="translate(505, 535)">
      <g class="pedal-counter-spin" transform-origin="0 0">
        <!-- Pedal platform with safety amber reflector -->
        <rect x="-16" y="-5" width="32" height="10" rx="3" fill="#263238" stroke="#000000" stroke-width="1.5"/>
        <rect x="-10" y="-2" width="20" height="4" rx="1" fill="#FFB300"/>
        <circle cx="0" cy="0" r="3" fill="#CFD8DC"/>
      </g>
    </g>
  </g>

  <!-- RIGHT LEG (Near Side / In Full Light) -->
  <!-- Hip origin at (395, 345). Coordinates match right pedal position perfectly over time:
       0.00s: Pedal at (505, 535) -> Low-forward extension
       0.45s: Pedal at (470, 450) -> Top of revolution, knee raised high
       0.90s: Pedal at (435, 465) -> Back-swing position
       1.35s: Pedal at (470, 550) -> Full deep down-stroke
       1.80s: Pedal at (505, 535) -> Complete smooth loop
  -->
  <g>
    <!-- Powerful Leg (Femur & Tibiotarsus) -->
    <path fill="none" stroke="#E65100" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
        values="
          M 395,345 Q 470,455 505,535;
          M 395,345 Q 430,370 470,455;
          M 395,345 Q 400,390 435,465;
          M 395,345 Q 455,420 470,550;
          M 395,345 Q 470,455 505,535
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
      />
    </path>
    <path fill="none" stroke="#FFA726" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
        values="
          M 395,345 Q 470,455 505,535;
          M 395,345 Q 430,370 470,455;
          M 395,345 Q 400,390 435,465;
          M 395,345 Q 455,420 470,550;
          M 395,345 Q 470,455 505,535
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
      />
    </path>

    <!-- Broad Orange Webbed Foot firmly planted on pedal -->
    <polygon fill="#FF5722" stroke="#BF360C" stroke-width="1.5">
      <animate attributeName="points" dur="1.8s" repeatCount="indefinite"
        values="
          490,535 524,530 514,545;
          455,455 489,450 479,465;
          420,465 454,460 444,475;
          455,550 489,545 479,560;
          490,535 524,530 514,545
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
      />
    </polygon>
  </g>

  <!-- Foreground Highlights: Breezy Coast Details & Motion Whimsy -->
  <!-- Gentle Breeze Motion Lines -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <line x1="140" y1="260" x2="220" y2="260">
      <animate attributeName="x1" dur="1.2s" repeatCount="indefinite" values="240;100"/>
      <animate attributeName="x2" dur="1.2s" repeatCount="indefinite" values="320;180"/>
      <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values="0;0.7;0"/>
    </line>
    <line x1="80" y1="310" x2="180" y2="310">
      <animate attributeName="x1" dur="0.9s" repeatCount="indefinite" values="200;40"/>
      <animate attributeName="x2" dur="0.9s" repeatCount="indefinite" values="300;140"/>
      <animate attributeName="opacity" dur="0.9s" repeatCount="indefinite" values="0;0.8;0"/>
    </line>
  </g>

</svg>