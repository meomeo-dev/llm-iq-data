<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6edfc"/>
      <stop offset="65%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f5e6ca"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e53e3e"/>
      <stop offset="50%" stop-color="#dd6b20"/>
      <stop offset="100%" stop-color="#c53030"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e0"/>
      <stop offset="50%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#a0aec0"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dd6b20"/>
      <stop offset="60%" stop-color="#c05621"/>
      <stop offset="100%" stop-color="#7b341e"/>
    </linearGradient>

    <linearGradient id="billGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ecc94b"/>
      <stop offset="70%" stop-color="#dd6b20"/>
      <stop offset="100%" stop-color="#c53030"/>
    </linearGradient>

    <!-- Wheel Definition with Hub and 16 Spokes -->
    <g id="spoked-wheel">
      <!-- Tire -->
      <circle cx="0" cy="0" r="115" fill="none" stroke="#1a202c" stroke-width="18"/>
      <!-- Rim -->
      <circle cx="0" cy="0" r="106" fill="none" stroke="url(#rimGrad)" stroke-width="6"/>
      <circle cx="0" cy="0" r="103" fill="none" stroke="#718096" stroke-width="1.5"/>
      <!-- Spokes (8 crossed lines = 16 spokes) -->
      <g stroke="#cbd5e0" stroke-width="1.8" opacity="0.85">
        <line x1="0" y1="-104" x2="0" y2="104"/>
        <line x1="-104" y1="0" x2="104" y2="0"/>
        <line x1="-73.5" y1="-73.5" x2="73.5" y2="73.5"/>
        <line x1="-73.5" y1="73.5" x2="73.5" y2="-73.5"/>
        <line x1="-39.8" y1="-96" x2="39.8" y2="96"/>
        <line x1="39.8" y1="-96" x2="-39.8" y2="96"/>
        <line x1="-96" y1="-39.8" x2="96" y2="39.8"/>
        <line x1="-96" y1="39.8" x2="96" y2="-39.8"/>
      </g>
      <!-- Hub & Axle Nut -->
      <circle cx="0" cy="0" r="14" fill="#4a5568"/>
      <circle cx="0" cy="0" r="8" fill="#e2e8f0"/>
      <circle cx="0" cy="0" r="3.5" fill="#1a202c"/>
    </g>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style><![CDATA[
    /* Continuous animations synced across 1.6s cycle */
    .spin-wheel-rear {
      transform-origin: 260px 480px;
      animation: rotateCycle 1.6s linear infinite;
    }
    .spin-wheel-front {
      transform-origin: 740px 480px;
      animation: rotateCycle 1.6s linear infinite;
    }
    .crank-assembly {
      transform-origin: 480px 480px;
      animation: rotateCycle 1.6s linear infinite;
    }
    .pedal-counter-1 {
      transform-origin: 480px 530px;
      animation: counterRotate 1.6s linear infinite;
    }
    .pedal-counter-2 {
      transform-origin: 480px 430px;
      animation: counterRotate 1.6s linear infinite;
    }

    /* Leg & foot kinematics synchronized to pedal rotation */
    .pelican-leg-near {
      animation: nearLegMotion 1.6s ease-in-out infinite;
      transform-origin: 430px 335px;
    }
    .pelican-leg-far {
      animation: farLegMotion 1.6s ease-in-out infinite;
      transform-origin: 415px 330px;
    }

    /* Subtly bouncing pelican torso & feather crest for organic feel */
    .pelican-body-bob {
      animation: pelicanBob 0.8s ease-in-out infinite alternate;
    }
    .crest-flutter {
      animation: crestFlutter 0.8s ease-in-out infinite alternate;
      transform-origin: 520px 145px;
    }
    .ground-dash {
      stroke-dasharray: 40 45;
      animation: groundScroll 0.8s linear infinite;
    }

    @keyframes rotateCycle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes nearLegMotion {
      0%   { transform: rotate(0deg) translateY(0px); }
      25%  { transform: rotate(-10deg) translateY(-8px); }
      50%  { transform: rotate(-18deg) translateY(-14px); }
      75%  { transform: rotate(-7deg) translateY(-5px); }
      100% { transform: rotate(0deg) translateY(0px); }
    }
    @keyframes farLegMotion {
      0%   { transform: rotate(-18deg) translateY(-14px); }
      25%  { transform: rotate(-7deg) translateY(-5px); }
      50%  { transform: rotate(0deg) translateY(0px); }
      75%  { transform: rotate(-10deg) translateY(-8px); }
      100% { transform: rotate(-18deg) translateY(-14px); }
    }
    @keyframes pelicanBob {
      0%   { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-3.5px) rotate(0.4deg); }
    }
    @keyframes crestFlutter {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(-4deg) skewX(2deg); }
    }
    @keyframes groundScroll {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -85; }
    }
  ]]></style>

  <!-- Background Environment -->
  <rect width="1000" height="700" fill="url(#skyGrad)"/>
  
  <!-- Coastal Horizon details -->
  <path d="M 0 450 Q 250 440, 500 445 T 1000 440 L 1000 500 L 0 500 Z" fill="#b2d8d8" opacity="0.45"/>
  <path d="M 0 470 Q 200 465, 450 470 T 1000 465 L 1000 500 L 0 500 Z" fill="#80cbc4" opacity="0.4"/>

  <!-- Road & Speed Lines -->
  <rect x="0" y="565" width="1000" height="135" fill="url(#roadGrad)"/>
  <line x1="0" y1="575" x2="1000" y2="575" stroke="#f6ad55" stroke-width="4"/>
  <line x1="0" y1="630" x2="1000" y2="630" stroke="#edf2f7" stroke-width="6" class="ground-dash"/>

  <!-- Bicycle & Pelican Shadow -->
  <ellipse cx="500" cy="585" rx="310" ry="24" fill="#1a202c" opacity="0.32" filter="url(#shadow)"/>

  <!-- ==================== FAR SIDE COMPONENTS ==================== -->
  
  <!-- Far Pedal & Crank (offset by 180deg) -->
  <g class="crank-assembly">
    <g transform="rotate(180 480 480)">
      <!-- Far crank arm -->
      <line x1="480" y1="480" x2="480" y2="530" stroke="#4a5568" stroke-width="7" stroke-linecap="round"/>
      <circle cx="480" cy="530" r="5" fill="#2d3748"/>
      <!-- Far pedal assembly counter-rotated to remain horizontal -->
      <g class="pedal-counter-2">
        <rect x="466" y="526" width="28" height="8" rx="3" fill="#2d3748" stroke="#1a202c" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- Pelican Far Leg (synchronized to reach far pedal at top) -->
  <g class="pelican-leg-far">
    <!-- Thigh & Drumstick -->
    <path d="M 415 330 Q 425 390 455 425 Q 470 445 480 470" fill="none" stroke="#2d3748" stroke-width="12" stroke-linecap="round"/>
    <!-- Tarsus (lower leg) -->
    <line x1="472" y1="455" x2="480" y2="515" stroke="#dd6b20" stroke-width="7" stroke-linecap="round"/>
    <!-- Webbed foot gripping far pedal -->
    <path d="M 480 515 L 460 528 L 498 528 Z" fill="#c05621"/>
  </g>

  <!-- ==================== BICYCLE FRAMEWORK ==================== -->

  <!-- Rear Wheel (Animated Spoke Rotation around Rear Axle 260, 480) -->
  <g transform="translate(260, 480)">
    <use href="#spoked-wheel" class="spin-wheel-rear"/>
  </g>

  <!-- Front Wheel (Animated Spoke Rotation around Front Axle 740, 480) -->
  <g transform="translate(740, 480)">
    <use href="#spoked-wheel" class="spin-wheel-front"/>
  </g>

  <!-- Main Bicycle Frame Diamond & Components -->
  <g id="bicycle-frame" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear Chainstay & Seatstay -->
    <line x1="260" y1="480" x2="480" y2="480" stroke="#c53030" stroke-width="9"/> <!-- Chainstay -->
    <line x1="260" y1="480" x2="400" y2="330" stroke="#c53030" stroke-width="9"/> <!-- Seatstay -->

    <!-- Rear Sprocket & Drive Chain -->
    <circle cx="260" cy="480" r="19" fill="#718096" stroke="#4a5568" stroke-width="2"/>
    <path d="M 260 464 L 480 460 L 480 500 L 260 496 Z" fill="none" stroke="#4a5568" stroke-width="4.5" stroke-dasharray="6 3"/>

    <!-- Main Triangle (Seat Tube, Down Tube, Top Tube) -->
    <line x1="480" y1="480" x2="400" y2="310" stroke="url(#frameGrad)" stroke-width="12"/> <!-- Seat Tube extended -->
    <line x1="480" y1="480" x2="655" y2="315" stroke="url(#frameGrad)" stroke-width="12"/> <!-- Down Tube -->
    <line x1="400" y1="330" x2="650" y2="315" stroke="url(#frameGrad)" stroke-width="11"/> <!-- Top Tube -->

    <!-- Head Tube & Front Fork -->
    <line x1="655" y1="300" x2="645" y2="335" stroke="url(#frameGrad)" stroke-width="14"/> <!-- Head Tube -->
    <line x1="645" y1="335" x2="740" y2="480" stroke="#c53030" stroke-width="10"/> <!-- Front Fork -->

    <!-- Stem & Classic Cruiser Handlebars -->
    <path d="M 652 305 L 658 260 L 635 255 Q 615 255 625 285" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    <!-- Handlebar Grips -->
    <circle cx="625" cy="285" r="6" fill="#7b341e"/>

    <!-- Saddle Seatpost & Ergonomic Sprung Bicycle Saddle -->
    <line x1="400" y1="320" x2="405" y2="285" stroke="#cbd5e0" stroke-width="8"/>
    <!-- Saddle Base & Cushion -->
    <path d="M 370 285 Q 405 280 440 286 Q 448 290 440 295 Q 405 292 375 295 Z" fill="#2d3748" stroke="#1a202c" stroke-width="1.5"/>
    <ellipse cx="388" cy="287" rx="18" ry="4" fill="#4a5568"/>
    <!-- Saddle chrome suspension springs -->
    <circle cx="380" cy="292" r="4" fill="none" stroke="#a0aec0" stroke-width="2"/>
    <circle cx="395" cy="292" r="4" fill="none" stroke="#a0aec0" stroke-width="2"/>
  </g>

  <!-- Chainring / Spider at Bottom Bracket -->
  <circle cx="480" cy="480" r="28" fill="#e2e8f0" stroke="#718096" stroke-width="3"/>
  <circle cx="480" cy="480" r="18" fill="#a0aec0" opacity="0.6"/>
  <!-- Chainring cutouts -->
  <circle cx="480" cy="466" r="4" fill="#718096"/>
  <circle cx="493" cy="484" r="4" fill="#718096"/>
  <circle cx="470" cy="491" r="4" fill="#718096"/>
  <circle cx="467" cy="474" r="4" fill="#718096"/>

  <!-- ==================== PELICAN (RIDER) ==================== -->
  <g class="pelican-body-bob">
    <!-- Tail Feathers perched over the saddle -->
    <path d="M 330 260 Q 365 268 395 282 Q 360 295 320 280 Z" fill="#4a5568" stroke="#2d3748" stroke-width="1.5"/>
    <path d="M 320 270 Q 355 276 385 285 Q 345 298 310 288 Z" fill="#2d3748"/>

    <!-- Torso / Body of California Brown Pelican -->
    <!-- Distinct brown-grey body plumage with soft feather texturing -->
    <path d="M 365 285 Q 360 215 425 210 Q 485 205 505 265 Q 500 340 435 345 Q 380 345 365 285 Z" 
          fill="#4a423b" stroke="#2d2723" stroke-width="2"/>
    
    <!-- Feather flank gradients / underbelly shading -->
    <path d="M 390 325 Q 440 345 480 315 Q 495 275 485 240 Q 455 310 390 325 Z" fill="#36302a" opacity="0.7"/>
    <path d="M 380 280 Q 405 225 450 220 Q 410 260 395 320 Q 375 305 380 280 Z" fill="#635950" opacity="0.8"/>

    <!-- Pelican Neck (S-Curved characteristic posture) -->
    <!-- California brown pelicans have a dark chestnut-brown hindneck in breeding plumage and white foreneck -->
    <!-- Hindneck (rich mahogany brown) -->
    <path d="M 445 220 C 455 170 480 145 525 140 C 540 140 550 150 550 165 C 530 180 500 200 485 235 Z" 
          fill="#44261c" stroke="#2b1710" stroke-width="1.5"/>
    <!-- Foreneck / Throat (silky white/creamy-yellow transition) -->
    <path d="M 470 230 C 490 200 520 180 540 165 C 555 175 540 210 515 240 C 495 250 480 245 470 230 Z" 
          fill="#f7fafc"/>
    <path d="M 485 240 Q 525 200 542 166" fill="none" stroke="#ecc94b" stroke-width="3" opacity="0.4"/>

    <!-- Head (Pale yellow / creamy white crown) -->
    <path d="M 515 148 C 515 125 540 115 565 120 C 585 125 595 145 585 165 C 565 175 530 170 515 148 Z" 
          fill="#fffff0" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Pale yellow crest plumage on crown -->
    <path d="M 525 135 C 535 120 560 118 575 122 C 555 128 540 138 525 135 Z" fill="#faf089"/>

    <!-- Wispy nape crest feathers (animated flutter) -->
    <g class="crest-flutter">
      <path d="M 520 138 Q 495 135 480 148 Q 505 145 524 144 Z" fill="#faf089"/>
      <path d="M 516 144 Q 490 145 475 160 Q 502 153 520 150 Z" fill="#44261c"/>
      <path d="M 514 152 Q 495 158 485 170 Q 505 162 518 156 Z" fill="#44261c"/>
    </g>

    <!-- Eye Patches & Eye (Bright blue orbital ring during breeding) -->
    <circle cx="560" cy="138" r="8" fill="#4299e1" opacity="0.85"/>
    <circle cx="560" cy="138" r="5" fill="#f6e05e"/>
    <circle cx="561" cy="138" r="2.8" fill="#1a202c"/>
    <circle cx="562.5" cy="136.5" r="1.2" fill="#ffffff"/>

    <!-- Large Pelican Bill & Gular Pouch -->
    <!-- Bill Top Ridge (Culmen with distinctive hook at tip) -->
    <path d="M 575 135 L 755 168 Q 770 172 765 178 Q 755 180 740 176 L 575 150 Z" 
          fill="url(#billGrad)" stroke="#c05621" stroke-width="1.2"/>

    <!-- Huge Distensible Gular Pouch -->
    <path d="M 575 150 L 745 176 C 715 225 640 255 570 205 C 560 185 565 165 575 150 Z" 
          fill="url(#pouchGrad)" stroke="#7b341e" stroke-width="1.5" opacity="0.96"/>
    
    <!-- Pouch elasticity lines / veins -->
    <path d="M 605 170 Q 645 220 685 185" fill="none" stroke="#dd6b20" stroke-width="1.2" opacity="0.5"/>
    <path d="M 585 175 Q 615 215 650 195" fill="none" stroke="#dd6b20" stroke-width="1.2" opacity="0.5"/>
    <path d="M 630 175 Q 665 210 710 180" fill="none" stroke="#dd6b20" stroke-width="1.2" opacity="0.5"/>

    <!-- Pelican Wing resting against flank / gripping handlebar -->
    <!-- Wing shoulder & primary covert feathers -->
    <path d="M 405 240 C 440 220 480 230 495 270 C 485 305 450 325 410 300 Z" 
          fill="#5a4f47" stroke="#2d2723" stroke-width="1.5"/>
    <path d="M 425 255 C 455 245 475 255 480 280 C 465 295 440 300 425 285 Z" fill="#6f6259"/>

    <!-- Wing arm extending forward to handlebar -->
    <path d="M 465 255 Q 545 250 625 283 Q 620 295 560 285 Q 485 285 455 275 Z" 
          fill="#4a423b" stroke="#2d2723" stroke-width="1.5"/>
    <!-- Wing primary feather tips curled realistically around handlebar grip -->
    <path d="M 618 280 Q 634 278 630 290 Q 615 294 612 284 Z" fill="#2d2723"/>
    <path d="M 622 283 Q 637 283 632 294 Q 618 297 616 287 Z" fill="#1a202c"/>
  </g>

  <!-- ==================== NEAR SIDE CRANK, PEDAL & LEG ==================== -->

  <!-- Near Pedal & Crank (Connected to Bottom Bracket at 480, 480) -->
  <g class="crank-assembly">
    <!-- Chrome Near Crank Arm -->
    <line x1="480" y1="480" x2="480" y2="530" stroke="#cbd5e0" stroke-width="8" stroke-linecap="round"/>
    <circle cx="480" cy="480" r="10" fill="#4a5568"/>
    <circle cx="480" cy="480" r="4.5" fill="#edf2f7"/>
    <circle cx="480" cy="530" r="5.5" fill="#4a5568"/>

    <!-- Near Pedal Body (Counter-rotates to stay upright) -->
    <g class="pedal-counter-1">
      <rect x="464" y="525" width="32" height="10" rx="3.5" fill="#1a202c" stroke="#4a5568" stroke-width="1.5"/>
      <rect x="470" y="527" width="20" height="6" rx="2" fill="#ed8936"/> <!-- Amber pedal reflector -->
    </g>
  </g>

  <!-- Near Pelican Leg (Synchronized pedaling action pinned to Near Pedal) -->
  <g class="pelican-leg-near">
    <!-- Muscular Hip & Thigh -->
    <path d="M 430 335 C 445 375 460 415 470 445" 
          fill="none" stroke="#4a423b" stroke-width="16" stroke-linecap="round"/>
    <!-- Feathery "trouser" fringe -->
    <path d="M 420 335 Q 445 365 475 375 Q 460 395 445 410" 
          fill="#36302a" stroke="#2d2723" stroke-width="1.5"/>

    <!-- Knee Joint & Tarsus (scaled orange-yellow shank) -->
    <line x1="468" y1="440" x2="480" y2="520" stroke="#dd6b20" stroke-width="8.5" stroke-linecap="round"/>
    <circle cx="468" cy="440" r="5.5" fill="#c05621"/>

    <!-- Large Totipalmate Webbed Foot planted on Pedal -->
    <!-- 4 webbed forward toes gripping pedal platform -->
    <path d="M 478 518 L 452 531 L 478 534 L 505 530 L 490 520 Z" 
          fill="#dd6b20" stroke="#9c4221" stroke-width="1.5"/>
    <!-- Black toe claws -->
    <circle cx="452" cy="531" r="2.2" fill="#1a202c"/>
    <circle cx="478" cy="534" r="2.2" fill="#1a202c"/>
    <circle cx="505" cy="530" r="2.2" fill="#1a202c"/>
  </g>
</svg>