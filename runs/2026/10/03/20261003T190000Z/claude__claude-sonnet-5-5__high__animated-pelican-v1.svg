<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <g id="wheelbody">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#b9c0c7" stroke-width="2"/>
      <g stroke="#9aa3ab" stroke-width="1">
        <line x1="-65" y1="0" x2="65" y2="0"/>
        <line x1="-60.1" y1="-24.9" x2="60.1" y2="24.9"/>
        <line x1="-46" y1="-46" x2="46" y2="46"/>
        <line x1="-24.9" y1="-60.1" x2="24.9" y2="60.1"/>
        <line x1="0" y1="-65" x2="0" y2="65"/>
        <line x1="24.9" y1="-60.1" x2="-24.9" y2="60.1"/>
        <line x1="46" y1="-46" x2="-46" y2="46"/>
        <line x1="60.1" y1="-24.9" x2="-60.1" y2="24.9"/>
      </g>
      <circle r="7" fill="#666"/>
      <circle cx="58" cy="0" r="3.5" fill="#e33"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="34" fill="#ffe08a"/>
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="1000 0" dur="45s" repeatCount="indefinite"/>
      <ellipse cx="100" cy="80" rx="40" ry="14"/>
      <ellipse cx="130" cy="70" rx="30" ry="14"/>
      <ellipse cx="70" cy="72" rx="26" ry="12"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="700 0" dur="60s" repeatCount="indefinite"/>
      <ellipse cx="500" cy="130" rx="36" ry="12"/>
      <ellipse cx="528" cy="122" rx="26" ry="12"/>
    </g>
  </g>

  <rect x="0" y="400" width="800" height="80" fill="#6b6f76"/>
  <rect x="0" y="400" width="800" height="5" fill="#4e5258"/>
  <line x1="-100" y1="440" x2="900" y2="440" stroke="#f2f2f2" stroke-width="6" stroke-dasharray="50 50">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="0.3636s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="402" rx="190" ry="6" fill="#000" opacity="0.25"/>

  <!-- far leg -->
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="1.6s" begin="-0.8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="-63.3 350 215;-39.9 350 215;-26 350 215;-30.4 350 215;-41.4 350 215;-59.5 350 215;-79 350 215;-80.1 350 215;-63.3 350 215"/>
    <line x1="350" y1="215" x2="350" y2="293" stroke="#4a3d31" stroke-width="9" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.6s" begin="-0.8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="66.7 350 293;36.6 350 293;29 350 293;55.7 350 293;86.4 350 293;110.2 350 293;114.6 350 293;96.1 350 293;66.7 350 293"/>
      <line x1="350" y1="293" x2="350" y2="373" stroke="#222" stroke-width="5" stroke-linecap="round"/>
      <circle cx="350" cy="293" r="5" fill="#4a3d31"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="1.6s" begin="-0.8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="-3.4 350 373;3.3 350 373;-3 350 373;-25.3 350 373;-45 350 373;-50.7 350 373;-35.6 350 373;-16 350 373;-3.4 350 373"/>
        <path d="M344,366 L372,368 Q377,372 370,373 L344,373 Z" fill="#2b2b2b"/>
      </g>
    </g>
  </g>

  <!-- far crank and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 380 330" to="540 380 330" dur="1.6s" repeatCount="indefinite"/>
    <line x1="380" y1="330" x2="415" y2="330" stroke="#666" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 415 330" to="-540 415 330" dur="1.6s" repeatCount="indefinite"/>
      <rect x="404" y="327" width="22" height="6" rx="2" fill="#1a1a1a"/>
    </g>
  </g>

  <!-- wheels -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 250 330" to="360 250 330" dur="1.6s" repeatCount="indefinite"/>
    <use href="#wheelbody" x="250" y="330"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 550 330" to="360 550 330" dur="1.6s" repeatCount="indefinite"/>
    <use href="#wheelbody" x="550" y="330"/>
  </g>

  <!-- frame -->
  <g stroke="#1f8a9e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="380" y1="330" x2="362" y2="232"/>
    <line x1="362" y1="232" x2="510" y2="232"/>
    <line x1="380" y1="330" x2="518" y2="262"/>
    <line x1="380" y1="330" x2="250" y2="330"/>
    <line x1="362" y1="232" x2="250" y2="330"/>
    <line x1="518" y1="262" x2="550" y2="330"/>
    <line x1="510" y1="232" x2="518" y2="262" stroke-width="9"/>
  </g>
  <!-- seatpost, saddle, stem, handlebar -->
  <line x1="362" y1="232" x2="356" y2="210" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M332,207 Q356,198 388,205 L388,212 Q356,215 332,212 Z" fill="#222"/>
  <line x1="510" y1="232" x2="507" y2="206" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M495,206 L530,204 Q548,206 546,224" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <circle cx="250" cy="330" r="5" fill="#444"/>
  <circle cx="550" cy="330" r="5" fill="#444"/>

  <!-- chain and rear sprocket -->
  <g stroke="#555" stroke-width="2" fill="none">
    <line x1="380" y1="314" x2="250" y2="323"/>
    <line x1="380" y1="346" x2="250" y2="337"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 250 330" to="360 250 330" dur="0.7s" repeatCount="indefinite"/>
    <circle cx="250" cy="330" r="8" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 3"/>
  </g>

  <!-- near crank, chainring and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 330" to="360 380 330" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="380" cy="330" r="16" fill="none" stroke="#444" stroke-width="3"/>
    <circle cx="380" cy="330" r="16" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="380" y1="330" x2="415" y2="330" stroke="#888" stroke-width="6" stroke-linecap="round"/>
    <circle cx="380" cy="330" r="6" fill="#555"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 415 330" to="-360 415 330" dur="1.6s" repeatCount="indefinite"/>
      <rect x="404" y="327" width="22" height="6" rx="2" fill="#111"/>
    </g>
  </g>

  <!-- near leg -->
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="-63.3 350 215;-39.9 350 215;-26 350 215;-30.4 350 215;-41.4 350 215;-59.5 350 215;-79 350 215;-80.1 350 215;-63.3 350 215"/>
    <line x1="350" y1="215" x2="350" y2="293" stroke="#6e5c49" stroke-width="10" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="66.7 350 293;36.6 350 293;29 350 293;55.7 350 293;86.4 350 293;110.2 350 293;114.6 350 293;96.1 350 293;66.7 350 293"/>
      <line x1="350" y1="293" x2="350" y2="373" stroke="#3a3a3a" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="350" cy="293" r="5.5" fill="#6e5c49"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="-3.4 350 373;3.3 350 373;-3 350 373;-25.3 350 373;-45 350 373;-50.7 350 373;-35.6 350 373;-16 350 373;-3.4 350 373"/>
        <path d="M344,366 L372,368 Q377,372 370,373 L344,373 Z" fill="#3a3a3a"/>
      </g>
    </g>
  </g>

  <!-- pelican body -->
  <path d="M292,170 L236,196 L244,174 L234,160 Z" fill="#4d3b2c"/>
  <ellipse cx="338" cy="172" rx="58" ry="38" transform="rotate(-12 338 172)" fill="#8a7b68"/>
  <ellipse cx="368" cy="182" rx="26" ry="20" fill="#a89a86"/>

  <!-- neck, head, bill -->
  <path d="M372,152 C395,142 385,112 408,100" fill="none" stroke="#f0ead8" stroke-width="22" stroke-linecap="round"/>
  <path d="M364,142 C383,132 373,106 396,92" fill="none" stroke="#5b3d28" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="418" cy="96" rx="20" ry="15" fill="#f6efc4"/>
  <path d="M400,84 Q415,76 430,84 Q415,88 400,84 Z" fill="#f0c94a"/>
  <path d="M436,99 L520,115 Q480,142 440,108 Z" fill="#d9b36a" stroke="#8a6e3a" stroke-width="1"/>
  <path d="M432,88 L522,108 Q530,110 528,117 L520,114 L432,99 Z" fill="#9a8f7a"/>
  <circle cx="427" cy="92" r="3.6" fill="#111"/>
  <circle cx="428" cy="91" r="1" fill="#fff"/>

  <!-- wing reaching to handlebar -->
  <path d="M362,150 Q430,168 528,203 Q532,208 524,208 Q440,202 358,196 Q345,172 362,150 Z" fill="#6b5b4a"/>
  <path d="M470,190 Q500,200 528,203 Q532,208 524,208 Q495,206 468,198 Z" fill="#3b2f25"/>
</svg>