<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f5"/>
      <stop offset="1" stop-color="#f6efd9"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0a392"/>
      <stop offset="1" stop-color="#6a5a4b"/>
    </linearGradient>
    <g id="spokes" stroke="#9aa0a6" stroke-width="1.4">
      <line x1="-72" y1="0" x2="72" y2="0"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe27a" opacity="0.9"/>
  <path d="M0,400 Q200,370 400,395 T800,385 L800,480 L0,480 Z" fill="#d9c98f"/>
  <rect x="0" y="424" width="800" height="56" fill="#c9b777"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#a89a5c" stroke-width="4" stroke-dasharray="60 90">
    <animate attributeName="stroke-dashoffset" from="0" to="150" dur="1s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="424" rx="230" ry="9" fill="#000" opacity="0.18"/>

  <!-- far crank + pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 390 345" to="540 390 345" dur="2s" repeatCount="indefinite"/>
    <line x1="390" y1="345" x2="430" y2="345" stroke="#555" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(430,345)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="-180 0 0" to="-540 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#333"/>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path d="M350,225 L414.4,285 L350,342 L365,342" fill="none" stroke="#3a3632" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
M350,225 L414.4,285 L350,342 L365,342;
M350,225 L425,271.1 L355.4,322 L370.4,322;
M350,225 L434.3,250.3 L370,307.4 L385,307.4;
M350,225 L437.8,231.1 L390,302 L405,302;
M350,225 L438,226.9 L410,307.4 L425,307.4;
M350,225 L437.1,237.9 L424.6,322 L439.6,322;
M350,225 L432,257 L430,342 L445,342;
M350,225 L420.9,277.1 L424.6,362 L439.6,362;
M350,225 L407.4,291.7 L410,376.6 L425,376.6;
M350,225 L399.8,297.5 L390,382 L405,382;
M350,225 L400.5,297.1 L370,376.6 L385,376.6;
M350,225 L405.9,293 L355.4,362 L370.4,362;
M350,225 L414.4,285 L350,342 L365,342"/>
  </path>

  <!-- rear wheel -->
  <g transform="translate(230,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.6s" repeatCount="indefinite"/>
      <circle r="76" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="71" fill="none" stroke="#b9bec4" stroke-width="2"/>
      <use href="#spokes"/>
      <circle cx="56" cy="0" r="5" fill="#e74c3c"/>
      <circle r="8" fill="#666"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(570,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.6s" repeatCount="indefinite"/>
      <circle r="76" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="71" fill="none" stroke="#b9bec4" stroke-width="2"/>
      <use href="#spokes"/>
      <circle cx="56" cy="0" r="5" fill="#e74c3c"/>
      <circle r="8" fill="#666"/>
    </g>
  </g>

  <!-- chain -->
  <path d="M390,323 L230,332 M390,367 L230,348" stroke="#444" stroke-width="2" fill="none"/>
  <circle cx="230" cy="340" r="9" fill="none" stroke="#777" stroke-width="3"/>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230,340 L390,345"/>
    <path d="M230,340 L355,250"/>
    <path d="M390,345 L355,250"/>
    <path d="M355,252 L540,236"/>
    <path d="M390,345 L545,256"/>
    <path d="M538,226 L546,262"/>
    <path d="M546,262 L570,340"/>
  </g>
  <path d="M538,226 L530,200" stroke="#333" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M518,196 Q552,188 558,206" stroke="#333" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M355,250 L346,232" stroke="#777" stroke-width="6" stroke-linecap="round"/>
  <circle cx="390" cy="345" r="8" fill="#444"/>

  <!-- saddle -->
  <path d="M318,231 Q345,223 374,230 Q376,239 362,239 L330,239 Q316,239 318,231 Z" fill="#2a2a2a"/>

  <!-- pelican tail -->
  <path d="M290,195 L250,205 L255,222 L295,218 Z" fill="#5d4d3e"/>

  <!-- pelican body -->
  <ellipse cx="340" cy="192" rx="64" ry="40" fill="url(#body)" transform="rotate(-8 340 192)"/>
  <path d="M300,200 Q320,210 345,205 M310,215 Q335,222 360,214" stroke="#554637" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- near crank group (behind near leg) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 345" to="360 390 345" dur="2s" repeatCount="indefinite"/>
    <circle cx="390" cy="345" r="22" fill="none" stroke="#888" stroke-width="5" stroke-dasharray="4 3"/>
    <line x1="390" y1="345" x2="430" y2="345" stroke="#777" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(430,345)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#222"/>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <path d="M350,225 L432,257 L430,342 L445,342" fill="none" stroke="#2a2724" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
M350,225 L432,257 L430,342 L445,342;
M350,225 L420.9,277.1 L424.6,362 L439.6,362;
M350,225 L407.4,291.7 L410,376.6 L425,376.6;
M350,225 L399.8,297.5 L390,382 L405,382;
M350,225 L400.5,297.1 L370,376.6 L385,376.6;
M350,225 L405.9,293 L355.4,362 L370.4,362;
M350,225 L414.4,285 L350,342 L365,342;
M350,225 L425,271.1 L355.4,322 L370.4,322;
M350,225 L434.3,250.3 L370,307.4 L385,307.4;
M350,225 L437.8,231.1 L390,302 L405,302;
M350,225 L438,226.9 L410,307.4 L425,307.4;
M350,225 L437.1,237.9 L424.6,322 L439.6,322;
M350,225 L432,257 L430,342 L445,342"/>
  </path>
  <!-- thigh feather patch -->
  <ellipse cx="352" cy="220" rx="24" ry="17" fill="#8a7b6a" stroke="#5d4d3e" stroke-width="1.5"/>

  <!-- neck -->
  <path d="M378,172 C388,142 402,150 424,116" fill="none" stroke="#f4efe6" stroke-width="24" stroke-linecap="round"/>
  <path d="M368,170 C378,140 392,148 414,112" fill="none" stroke="#5a3a22" stroke-width="7" stroke-linecap="round"/>

  <!-- wing reaching handlebar -->
  <path d="M352,168 Q425,158 548,196 Q552,207 540,207 Q440,207 345,196 Z" fill="#7a6b5b" stroke="#4d4236" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400,178 Q450,184 500,198 M390,188 Q450,196 520,204" stroke="#4d4236" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="548" cy="201" r="6" fill="#222"/>

  <!-- head and bill -->
  <circle cx="428" cy="108" r="18" fill="#f7f1e4"/>
  <ellipse cx="424" cy="96" rx="13" ry="8" fill="#f2d36b"/>
  <path d="M440,114 Q492,152 542,131 L442,119 Z" fill="#b8a98a" stroke="#7d6f55" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M440,100 L546,124 Q551,128 541,130 L440,118 Z" fill="#9a9a94" stroke="#6d6d68" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M538,124 Q552,126 544,134" fill="none" stroke="#5b5b57" stroke-width="3" stroke-linecap="round"/>
  <circle cx="435" cy="104" r="3.6" fill="#111"/>
  <circle cx="436" cy="103" r="1.1" fill="#fff"/>
</svg>