<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f2"/>
      <stop offset="1" stop-color="#e6f6fd"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe9a0"/>
  <rect x="0" y="430" width="800" height="70" fill="#d9c9a0"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="0.29s" repeatCount="indefinite"/>
    <line x1="0" y1="444" x2="960" y2="444" stroke="#b8a578" stroke-width="4" stroke-dasharray="40 40"/>
  </g>
  <ellipse cx="400" cy="432" rx="260" ry="9" fill="#000" opacity="0.15"/>

  <!-- rear wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 250 360" to="360 250 360" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="250" cy="360" r="70" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="250" cy="360" r="64" fill="none" stroke="#b5b5b5" stroke-width="2"/>
    <g stroke="#8a8a8a" stroke-width="1">
      <line x1="250" y1="296" x2="250" y2="424"/>
      <line x1="186" y1="360" x2="314" y2="360"/>
      <line x1="204.8" y1="314.8" x2="295.2" y2="405.2"/>
      <line x1="204.8" y1="405.2" x2="295.2" y2="314.8"/>
      <line x1="217.6" y1="300.5" x2="282.4" y2="419.5"/>
      <line x1="217.6" y1="419.5" x2="282.4" y2="300.5"/>
      <line x1="190.5" y1="327.6" x2="309.5" y2="392.4"/>
      <line x1="190.5" y1="392.4" x2="309.5" y2="327.6"/>
    </g>
    <circle cx="250" cy="360" r="7" fill="#555"/>
    <rect x="248" y="291" width="4" height="9" fill="#d33"/>
  </g>

  <!-- front wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 530 360" to="360 530 360" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="530" cy="360" r="70" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="530" cy="360" r="64" fill="none" stroke="#b5b5b5" stroke-width="2"/>
    <g stroke="#8a8a8a" stroke-width="1">
      <line x1="530" y1="296" x2="530" y2="424"/>
      <line x1="466" y1="360" x2="594" y2="360"/>
      <line x1="484.8" y1="314.8" x2="575.2" y2="405.2"/>
      <line x1="484.8" y1="405.2" x2="575.2" y2="314.8"/>
      <line x1="497.6" y1="300.5" x2="562.4" y2="419.5"/>
      <line x1="497.6" y1="419.5" x2="562.4" y2="300.5"/>
      <line x1="470.5" y1="327.6" x2="589.5" y2="392.4"/>
      <line x1="470.5" y1="392.4" x2="589.5" y2="327.6"/>
    </g>
    <circle cx="530" cy="360" r="7" fill="#555"/>
    <rect x="528" y="291" width="4" height="9" fill="#d33"/>
  </g>

  <!-- far crank arm + pedal (opposite phase) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 365" to="360 380 365" dur="2s" repeatCount="indefinite"/>
    <line x1="380" y1="365" x2="350" y2="365" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(350,365)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-11" y="1" width="22" height="5" rx="2" fill="#222"/>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <g transform="translate(368,272)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
        values="-33.2;-43;-56.9;-71.7;-78.7;-74.9;-63.7;-49.2;-35.3;-26.2;-24.2;-27;-33.2"/>
      <line x1="0" y1="0" x2="0" y2="66" stroke="#5a4a3c" stroke-width="9" stroke-linecap="round"/>
      <g transform="translate(0,66)">
        <circle cx="0" cy="0" r="5.5" fill="#5a4a3c"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
            values="88.3;106.3;118.9;121.9;113.6;97.8;78.8;59.7;45;41.2;51.2;68.8;88.3"/>
          <line x1="0" y1="0" x2="0" y2="66" stroke="#6b5a4a" stroke-width="6" stroke-linecap="round"/>
          <g transform="translate(0,66)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
                values="-55.1;-63.3;-62;-50.2;-34.9;-22.9;-15.1;-10.5;-9.7;-15;-27;-41.8;-55.1"/>
              <path d="M-7,-6 Q-2,-9 3,-5 L22,-2 Q18,2 8,1 L-7,1 Z" fill="#b8742f" stroke="#8a5521" stroke-width="1"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- chain -->
  <path d="M380,349 L250,352 M380,381 L250,368" stroke="#333" stroke-width="2" fill="none"/>
  <circle cx="250" cy="360" r="9" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="380" y1="365" x2="250" y2="360"/>
    <line x1="354" y1="285" x2="250" y2="360"/>
    <line x1="380" y1="365" x2="354" y2="285"/>
    <line x1="357" y1="290" x2="491" y2="270"/>
    <line x1="380" y1="365" x2="497" y2="282"/>
    <line x1="490" y1="262" x2="499" y2="290" stroke-width="8"/>
    <line x1="499" y1="290" x2="530" y2="360"/>
    <line x1="354" y1="285" x2="352" y2="274" stroke="#333"/>
  </g>
  <path d="M489,262 L486,246" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M478,246 L506,243 Q522,246 520,262" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M330,274 Q350,269 380,274 Q387,279 376,282 L336,283 Q326,281 330,274 Z" fill="#3b2a20"/>
  <circle cx="380" cy="365" r="8" fill="#444"/>
  <circle cx="530" cy="360" r="4" fill="#ddd"/>
  <circle cx="250" cy="360" r="4" fill="#ddd"/>

  <!-- pelican tail -->
  <path d="M312,236 L268,250 L276,262 L316,252 Z" fill="#4a382a"/>

  <!-- body -->
  <ellipse cx="354" cy="238" rx="52" ry="31" transform="rotate(-8 354 238)" fill="#7d6b5a"/>
  <path d="M322,232 Q340,222 358,230 M326,248 Q346,238 366,246 M345,214 Q362,208 380,216" fill="none" stroke="#5f4e3f" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="392" cy="232" rx="18" ry="22" fill="#a89782"/>

  <!-- neck -->
  <path d="M388,224 Q416,214 414,192 Q413,172 432,164" fill="none" stroke="#efe5c6" stroke-width="20" stroke-linecap="round"/>
  <path d="M380,212 Q404,204 402,188 Q401,170 420,160" fill="none" stroke="#5a3a22" stroke-width="7" stroke-linecap="round"/>

  <!-- head and bill -->
  <ellipse cx="442" cy="158" rx="18" ry="14" fill="#f6efd2"/>
  <path d="M426,152 Q440,138 458,148 Q450,153 436,156 Z" fill="#f0d36b"/>
  <path d="M455,151 L546,176 Q549,180 544,181 L458,166 Z" fill="#9a8f7a"/>
  <path d="M458,166 L544,181 Q508,208 462,172 Z" fill="#b59f7c"/>
  <path d="M542,176 Q551,178 546,184" fill="none" stroke="#3b2a20" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="449" cy="155" r="4.5" fill="#fff6d8"/>
  <circle cx="450" cy="155" r="2.6" fill="#1a1208"/>

  <!-- near crank arm, chainring, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 365" to="360 380 365" dur="2s" repeatCount="indefinite"/>
    <circle cx="380" cy="365" r="16" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>
    <line x1="380" y1="365" x2="410" y2="365" stroke="#666" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(410,365)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-11" y="1" width="22" height="5" rx="2" fill="#111"/>
      </g>
    </g>
  </g>
  <circle cx="380" cy="365" r="4" fill="#bbb"/>

  <!-- near leg -->
  <g transform="translate(368,272)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
        values="-63.7;-49.2;-35.3;-26.2;-24.2;-27;-33.2;-43;-56.9;-71.7;-78.7;-74.9;-63.7"/>
      <line x1="0" y1="0" x2="0" y2="66" stroke="#7a6552" stroke-width="9" stroke-linecap="round"/>
      <g transform="translate(0,66)">
        <circle cx="0" cy="0" r="5.5" fill="#7a6552"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
            values="78.8;59.7;45;41.2;51.2;68.8;88.3;106.3;118.9;121.9;113.6;97.8;78.8"/>
          <line x1="0" y1="0" x2="0" y2="66" stroke="#8a7560" stroke-width="6" stroke-linecap="round"/>
          <g transform="translate(0,66)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
                values="-15.1;-10.5;-9.7;-15;-27;-41.8;-55.1;-63.3;-62;-50.2;-34.9;-22.9;-15.1"/>
              <path d="M-7,-6 Q-2,-9 3,-5 L22,-2 Q18,2 8,1 L-7,1 Z" fill="#e08a2e" stroke="#a8601b" stroke-width="1"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- near wing reaching handlebar -->
  <path d="M366,210 Q432,204 506,240 Q511,247 503,248 Q432,232 368,240 Z" fill="#6e5c4b" stroke="#4a382a" stroke-width="1.5"/>
  <path d="M440,222 Q480,230 503,244" fill="none" stroke="#3b2a20" stroke-width="3" stroke-linecap="round"/>
  <circle cx="507" cy="244" r="5" fill="#4a382a"/>
</svg>