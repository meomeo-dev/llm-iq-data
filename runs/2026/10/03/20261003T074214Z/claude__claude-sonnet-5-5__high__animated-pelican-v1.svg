<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc6ee"/>
      <stop offset="1" stop-color="#f6e7c8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6068"/>
      <stop offset="1" stop-color="#3b3d43"/>
    </linearGradient>
    <radialGradient id="bodyg" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#a08c74"/>
      <stop offset="1" stop-color="#6e5d4a"/>
    </radialGradient>
  </defs>

  <rect width="800" height="420" fill="url(#sky)"/>
  <circle cx="670" cy="90" r="40" fill="#fff2b0" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="80" rx="55" ry="16"/>
    <ellipse cx="185" cy="68" rx="35" ry="14"/>
    <ellipse cx="520" cy="55" rx="50" ry="14"/>
    <ellipse cx="550" cy="45" rx="30" ry="12"/>
  </g>
  <path d="M0,400 Q120,380 240,398 T480,396 T800,392 L800,420 L0,420 Z" fill="#3f8fa8" opacity="0.55"/>
  <rect x="0" y="420" width="800" height="80" fill="url(#road)"/>
  <rect x="0" y="420" width="800" height="4" fill="#2c2e33"/>

  <g stroke="#d9d9d9" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-220 0" dur="0.5s" repeatCount="indefinite"/>
    <line x1="0" y1="458" x2="70" y2="458"/>
    <line x1="220" y1="458" x2="290" y2="458"/>
    <line x1="440" y1="458" x2="510" y2="458"/>
    <line x1="660" y1="458" x2="730" y2="458"/>
    <line x1="880" y1="458" x2="950" y2="458"/>
    <line x1="1100" y1="458" x2="1170" y2="458"/>
  </g>

  <ellipse cx="400" cy="424" rx="200" ry="7" fill="#000000" opacity="0.25"/>

  <!-- far crank, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 360" to="360 390 360" dur="2.4s" repeatCount="indefinite"/>
    <line x1="390" y1="360" x2="350" y2="360" stroke="#555" stroke-width="7" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 350 360" to="-360 350 360" dur="2.4s" repeatCount="indefinite"/>
      <g transform="translate(350 360)">
        <rect x="-13" y="-3" width="26" height="6" rx="2" fill="#222"/>
        <path d="M-6,-2 C-6,-9 3,-9 7,-5 L21,-1 L17,2 L-4,2 Z" fill="#2c2c2c"/>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path d="M365,252 L418,314 L350,360" fill="none" stroke="#2c2c2c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2.4s" repeatCount="indefinite" values="
      M365,252 L418,314 L350,360;
      M365,252 L429,304 L355.4,340;
      M365,252 L441,284 L370,325.4;
      M365,252 L447,261 L390,320;
      M365,252 L447,252 L410,325.4;
      M365,252 L447,261 L424.6,340;
      M365,252 L442,279 L430,360;
      M365,252 L433,298 L424.6,380;
      M365,252 L420,313 L410,394.6;
      M365,252 L410,321 L390,400;
      M365,252 L408,322 L370,394.6;
      M365,252 L411,320 L355.4,380;
      M365,252 L418,314 L350,360"/>
  </path>

  <!-- rear wheel -->
  <g transform="translate(250 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <circle r="67" fill="none" stroke="#202020" stroke-width="7"/>
      <circle r="61" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#9aa0a8" stroke-width="1.2">
        <line x1="-61" y1="0" x2="61" y2="0"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(30)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(60)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(90)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(120)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(150)"/>
      </g>
      <circle cx="55" cy="0" r="3.5" fill="#e63946"/>
      <circle r="7" fill="#777"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(550 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <circle r="67" fill="none" stroke="#202020" stroke-width="7"/>
      <circle r="61" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#9aa0a8" stroke-width="1.2">
        <line x1="-61" y1="0" x2="61" y2="0"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(30)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(60)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(90)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(120)"/>
        <line x1="-61" y1="0" x2="61" y2="0" transform="rotate(150)"/>
      </g>
      <circle cx="55" cy="0" r="3.5" fill="#e63946"/>
      <circle r="7" fill="#777"/>
    </g>
  </g>

  <!-- chain -->
  <g fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="4 3">
    <path d="M390,342 L250,342">
      <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.15s" repeatCount="indefinite"/>
    </path>
    <path d="M250,358 L390,378">
      <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.15s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="250" cy="350" r="8" fill="#666" stroke="#333" stroke-width="2"/>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="350" x2="390" y2="360"/>
    <line x1="250" y1="350" x2="342" y2="266"/>
    <line x1="390" y1="360" x2="340" y2="262"/>
    <line x1="342" y1="268" x2="518" y2="248"/>
    <line x1="390" y1="360" x2="520" y2="256"/>
    <line x1="516" y1="236" x2="522" y2="262" stroke-width="8"/>
    <path d="M522,258 Q530,310 550,350" stroke="#8e2a20"/>
  </g>
  <line x1="340" y1="262" x2="337" y2="254" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M308,254 Q335,246 372,252 L369,259 Q335,263 310,261 Z" fill="#3a2a22"/>
  <circle cx="250" cy="350" r="4" fill="#ddd"/>
  <circle cx="550" cy="350" r="4" fill="#ddd"/>
  <circle cx="390" cy="360" r="7" fill="#444"/>

  <!-- pelican tail and body -->
  <path d="M305,205 L258,248 L276,254 L316,238 Z" fill="#5b4a3a"/>
  <ellipse cx="350" cy="208" rx="57" ry="43" fill="url(#bodyg)"/>
  <path d="M320,236 Q350,252 385,236 Q360,250 320,236 Z" fill="#cdbfa8" opacity="0.6"/>
  <ellipse cx="338" cy="205" rx="38" ry="26" transform="rotate(-12 338 205)" fill="#5b4a3a"/>
  <g stroke="#3f3226" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M308,208 Q325,214 345,212"/>
    <path d="M312,220 Q330,226 350,222"/>
  </g>

  <!-- neck and head -->
  <path d="M388,190 C422,186 394,146 430,128" fill="none" stroke="#f5f0e2" stroke-width="22" stroke-linecap="round"/>
  <path d="M376,182 C408,172 382,134 418,114" fill="none" stroke="#4a3a2c" stroke-width="7" stroke-linecap="round"/>
  <path d="M452,122 Q494,160 540,139 L450,127 Z" fill="#c9a77a" stroke="#8c6e48" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M446,107 L540,133 Q548,137 538,140 L446,124 Z" fill="#8f9390" stroke="#5f6360" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="436" cy="116" r="16" fill="#f7f2e6"/>
  <path d="M422,112 Q436,92 452,108 Q438,100 422,112 Z" fill="#f0d160"/>
  <circle cx="443" cy="113" r="3.2" fill="#111"/>
  <circle cx="444" cy="112" r="1" fill="#fff"/>

  <!-- wing reaching handlebar -->
  <path d="M366,184 Q430,238 512,214" fill="none" stroke="#5b4a3a" stroke-width="16" stroke-linecap="round"/>
  <path d="M440,222 L470,224 M455,214 L486,218" stroke="#3f3226" stroke-width="2" stroke-linecap="round"/>

  <!-- handlebar -->
  <g fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M516,238 L510,216"/>
    <path d="M504,214 L526,212 Q540,214 538,232"/>
  </g>

  <!-- near leg -->
  <path d="M365,252 L442,279 L430,360" fill="none" stroke="#3b3b3b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2.4s" repeatCount="indefinite" values="
      M365,252 L442,279 L430,360;
      M365,252 L433,298 L424.6,380;
      M365,252 L420,313 L410,394.6;
      M365,252 L410,321 L390,400;
      M365,252 L408,322 L370,394.6;
      M365,252 L411,320 L355.4,380;
      M365,252 L418,314 L350,360;
      M365,252 L429,304 L355.4,340;
      M365,252 L441,284 L370,325.4;
      M365,252 L447,261 L390,320;
      M365,252 L447,252 L410,325.4;
      M365,252 L447,261 L424.6,340;
      M365,252 L442,279 L430,360"/>
  </path>

  <!-- near crank, chainring, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 360" to="360 390 360" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="390" cy="360" r="18" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>
    <line x1="390" y1="342" x2="390" y2="378" stroke="#666" stroke-width="2"/>
    <line x1="372" y1="360" x2="408" y2="360" stroke="#666" stroke-width="2"/>
    <line x1="390" y1="360" x2="430" y2="360" stroke="#666" stroke-width="7" stroke-linecap="round"/>
    <circle cx="390" cy="360" r="5" fill="#222"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 430 360" to="-360 430 360" dur="2.4s" repeatCount="indefinite"/>
      <g transform="translate(430 360)">
        <rect x="-13" y="-3" width="26" height="6" rx="2" fill="#222"/>
        <path d="M-6,-2 C-6,-9 3,-9 7,-5 L21,-1 L17,2 L-4,2 Z" fill="#444"/>
      </g>
    </g>
  </g>
</svg>