<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset="1" stop-color="#e4f5fb"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#fff3b0" opacity="0.9"/>
  <rect x="0" y="420" width="800" height="80" fill="#d9c9a0"/>
  <line x1="0" y1="438" x2="880" y2="438" stroke="#b9a77c" stroke-width="4" stroke-dasharray="20 20">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="422" rx="210" ry="7" fill="#000" opacity="0.15"/>

  <!-- far leg -->
  <path fill="none" stroke="#a85a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M375,255 L417.8,320.2 L354,365">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M375,255 L417.8,320.2 L354,365;
      M375,255 L428.5,311.8 L358.8,347;
      M375,255 L440.7,297 L372,333.8;
      M375,255 L449.4,278.4 L390,329;
      M375,255 L451.8,269.2 L408,333.8;
      M375,255 L450.5,274.7 L421.2,347;
      M375,255 L445.1,289.3 L426,365;
      M375,255 L433.9,306.1 L421.2,383;
      M375,255 L419.5,319 L408,396.2;
      M375,255 L408.8,325.3 L390,401;
      M375,255 L406.6,326.3 L372,396.2;
      M375,255 L410.4,324.5 L358.8,383;
      M375,255 L417.8,320.2 L354,365"/>
  </path>

  <!-- far crank arm + pedal -->
  <g transform="translate(390,365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-36" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-36,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-2" width="22" height="5" rx="2" fill="#222"/>
          <path d="M-4,-5 Q8,-3 16,2 L-6,-1 Z" fill="#a85a1a" stroke="#a85a1a" stroke-width="2" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- rear wheel -->
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#bbb" stroke-width="2"/>
      <g stroke="#999" stroke-width="1">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(18)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(36)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(54)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(72)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(108)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(126)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(144)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(162)"/>
      </g>
      <circle r="9" fill="none" stroke="#555" stroke-width="3"/>
      <circle r="5" fill="#444"/>
      <circle cx="64" cy="0" r="3" fill="#e74c3c"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(550,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#bbb" stroke-width="2"/>
      <g stroke="#999" stroke-width="1">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(18)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(36)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(54)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(72)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(108)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(126)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(144)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(162)"/>
      </g>
      <circle r="6" fill="#444"/>
      <circle cx="64" cy="0" r="3" fill="#e74c3c"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#444" stroke-width="1.5" fill="none">
    <line x1="390" y1="349" x2="250" y2="342"/>
    <line x1="390" y1="381" x2="250" y2="358"/>
  </g>

  <!-- frame -->
  <g stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="390" y1="365" x2="366" y2="268"/>
    <line x1="366" y1="272" x2="250" y2="350"/>
    <line x1="390" y1="365" x2="250" y2="350"/>
    <line x1="366" y1="270" x2="512" y2="262"/>
    <line x1="390" y1="365" x2="516" y2="272"/>
    <line x1="505" y1="245" x2="519" y2="277" stroke-width="8"/>
    <line x1="519" y1="277" x2="550" y2="350"/>
  </g>
  <g stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="366" y1="268" x2="362" y2="252"/>
    <line x1="505" y1="245" x2="500" y2="232"/>
    <path d="M500,232 L522,228 Q536,228 536,242"/>
  </g>
  <circle cx="390" cy="365" r="7" fill="#444"/>

  <!-- near leg -->
  <path fill="none" stroke="#7a6a58" stroke-width="13" stroke-linecap="round" d="M375,255 L445.1,289.3">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M375,255 L445.1,289.3;
      M375,255 L433.9,306.1;
      M375,255 L419.5,319;
      M375,255 L408.8,325.3;
      M375,255 L406.6,326.3;
      M375,255 L410.4,324.5;
      M375,255 L417.8,320.2;
      M375,255 L428.5,311.8;
      M375,255 L440.7,297;
      M375,255 L449.4,278.4;
      M375,255 L451.8,269.2;
      M375,255 L450.5,274.7;
      M375,255 L445.1,289.3"/>
  </path>
  <path fill="none" stroke="#e08a2c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M375,255 L445.1,289.3 L426,365">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M375,255 L445.1,289.3 L426,365;
      M375,255 L433.9,306.1 L421.2,383;
      M375,255 L419.5,319 L408,396.2;
      M375,255 L408.8,325.3 L390,401;
      M375,255 L406.6,326.3 L372,396.2;
      M375,255 L410.4,324.5 L358.8,383;
      M375,255 L417.8,320.2 L354,365;
      M375,255 L428.5,311.8 L358.8,347;
      M375,255 L440.7,297 L372,333.8;
      M375,255 L449.4,278.4 L390,329;
      M375,255 L451.8,269.2 L408,333.8;
      M375,255 L450.5,274.7 L421.2,347;
      M375,255 L445.1,289.3 L426,365"/>
  </path>

  <!-- near crank: chainring, arm, pedal -->
  <g transform="translate(390,365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#555" stroke-width="3"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#555" stroke-width="2"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#555" stroke-width="2"/>
      <line x1="0" y1="0" x2="36" y2="0" stroke="#666" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(36,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-2" width="22" height="5" rx="2" fill="#222"/>
          <path d="M-4,-5 Q8,-3 16,2 L-6,-1 Z" fill="#e08a2c" stroke="#e08a2c" stroke-width="2" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
    <circle r="5" fill="#333"/>
  </g>

  <!-- saddle -->
  <path d="M346,258 Q370,251 394,256 L394,262 Q370,266 346,262 Z" fill="#2b2b2b"/>

  <!-- pelican tail -->
  <path d="M322,224 L282,232 L284,250 L324,246 Z" fill="#4a3b2e" stroke="#4a3b2e" stroke-width="2" stroke-linejoin="round"/>

  <!-- pelican body -->
  <g transform="rotate(-8 362 222)">
    <ellipse cx="362" cy="222" rx="54" ry="35" fill="#7a6a58"/>
    <ellipse cx="378" cy="232" rx="34" ry="20" fill="#9a8a76"/>
  </g>

  <!-- neck -->
  <path d="M395,208 C390,170 440,175 462,158" fill="none" stroke="#f3eee2" stroke-width="18" stroke-linecap="round"/>
  <path d="M388,206 C383,170 434,166 455,149" fill="none" stroke="#5a3a22" stroke-width="5" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="468" cy="154" r="15" fill="#f6f1e4"/>
  <ellipse cx="466" cy="143" rx="10" ry="6" fill="#f2d56b"/>
  <path d="M478,147 L552,176 Q557,180 550,183 L478,163 Z" fill="#a89b86"/>
  <path d="M478,163 L550,183 Q515,205 478,172 Z" fill="#c7a583"/>
  <circle cx="473" cy="151" r="3" fill="#1a1a1a"/>
  <circle cx="474" cy="150" r="1" fill="#fff"/>

  <!-- wing / arm to handlebar -->
  <path d="M330,215 Q370,192 410,212 Q420,228 395,238 Q360,250 335,240 Z" fill="#5b4a3a"/>
  <path d="M395,215 Q460,205 526,230" fill="none" stroke="#5b4a3a" stroke-width="14" stroke-linecap="round"/>
  <path d="M345,222 Q370,212 395,224 M342,232 Q368,224 392,234" fill="none" stroke="#7d6a55" stroke-width="2" stroke-linecap="round"/>
</svg>