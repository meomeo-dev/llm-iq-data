<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8f5"/>
      <stop offset="1" stop-color="#fdf3dc"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#b9bec4" stroke-width="2"/>
      <g stroke="#8d949b" stroke-width="1.2">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(22.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(45)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(67.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(112.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(135)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#555" stroke="#222" stroke-width="2"/>
      <circle cx="0" cy="-57" r="3.5" fill="#e03b3b"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="75" r="36" fill="#ffe27a" opacity="0.9"/>
  <rect y="423" width="800" height="57" fill="#d2bf8f"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#b39e6c" stroke-width="4" stroke-dasharray="40 40">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.44s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="462" x2="800" y2="462" stroke="#b39e6c" stroke-width="3" stroke-dasharray="25 55">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.44s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="424" rx="230" ry="6" fill="#000" opacity="0.15"/>

  <!-- wheels -->
  <g transform="translate(250 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far crank, pedal and leg -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 380 355" to="540 380 355" dur="2s" repeatCount="indefinite"/>
    <line x1="380" y1="355" x2="416" y2="355" stroke="#6d7379" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(416 355)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="2s" repeatCount="indefinite"/>
        <rect x="-12" y="0" width="24" height="5" rx="2" fill="#333"/>
        <ellipse cx="5" cy="-4" rx="15" ry="5" fill="#2f2b28"/>
      </g>
    </g>
  </g>
  <path fill="none" stroke="#2f2b28" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M342,228 L410.1,286.8 L344,355">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M342,228 L410.1,286.8 L344,355;
      M342,228 L419.6,273.5 L348.8,337;
      M342,228 L427.7,255.4 L362,323.8;
      M342,228 L431.3,239 L380,319;
      M342,228 L431.7,235.1 L398,323.8;
      M342,228 L430.6,243.9 L411.2,337;
      M342,228 L425.9,260.5 L416,355;
      M342,228 L416.7,278.2 L411.2,373;
      M342,228 L405.6,291.7 L398,386.2;
      M342,228 L398.7,297.9 L380,391;
      M342,228 L398.2,298.3 L362,386.2;
      M342,228 L402.5,294.7 L348.8,373;
      M342,228 L410.1,286.8 L344,355"/>
  </path>

  <!-- chain -->
  <g stroke="#333" stroke-width="2.5" fill="none">
    <line x1="250" y1="339" x2="380" y2="335"/>
    <line x1="250" y1="361" x2="380" y2="375"/>
  </g>

  <!-- frame -->
  <g stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="380" y1="355" x2="250" y2="350"/>
    <line x1="380" y1="355" x2="335" y2="250"/>
    <line x1="335" y1="250" x2="250" y2="350"/>
    <line x1="337" y1="256" x2="492" y2="252"/>
    <line x1="380" y1="355" x2="496" y2="266"/>
    <line x1="490" y1="244" x2="498" y2="268" stroke-width="8"/>
    <line x1="496" y1="262" x2="550" y2="350" stroke="#a52f23"/>
  </g>
  <g stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="335" y1="250" x2="333" y2="240"/>
    <line x1="489" y1="246" x2="484" y2="224"/>
    <path d="M474,224 L500,214 Q521,210 527,227" stroke-width="5"/>
  </g>
  <path d="M310,241 Q334,230 366,236 L361,244 Q334,241 310,247 Z" fill="#1f1f1f"/>

  <!-- rear cog and chainring -->
  <g transform="translate(250 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
      <circle r="11" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="4 3"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 355" to="360 380 355" dur="2s" repeatCount="indefinite"/>
    <circle cx="380" cy="355" r="20" fill="none" stroke="#555" stroke-width="5" stroke-dasharray="5 3"/>
    <circle cx="380" cy="355" r="12" fill="none" stroke="#777" stroke-width="2"/>
  </g>

  <!-- near crank, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 355" to="360 380 355" dur="2s" repeatCount="indefinite"/>
    <line x1="380" y1="355" x2="416" y2="355" stroke="#8d949b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="380" cy="355" r="7" fill="#444"/>
    <g transform="translate(416 355)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-12" y="0" width="24" height="5" rx="2" fill="#222"/>
        <ellipse cx="5" cy="-4" rx="15" ry="5" fill="#4a4540"/>
        <path d="M14,-4 l7,2 l-3,3 z" fill="#4a4540"/>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#4a4540" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M342,228 L425.9,260.5 L416,355">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M342,228 L425.9,260.5 L416,355;
      M342,228 L416.7,278.2 L411.2,373;
      M342,228 L405.6,291.7 L398,386.2;
      M342,228 L398.7,297.9 L380,391;
      M342,228 L398.2,298.3 L362,386.2;
      M342,228 L402.5,294.7 L348.8,373;
      M342,228 L410.1,286.8 L344,355;
      M342,228 L419.6,273.5 L348.8,337;
      M342,228 L427.7,255.4 L362,323.8;
      M342,228 L431.3,239 L380,319;
      M342,228 L431.7,235.1 L398,323.8;
      M342,228 L430.6,243.9 L411.2,337;
      M342,228 L425.9,260.5 L416,355"/>
  </path>

  <!-- pelican -->
  <path d="M290,192 L232,222 L250,234 L296,216 Z" fill="#4b3d33"/>
  <ellipse cx="335" cy="190" rx="60" ry="40" transform="rotate(-12 335 190)" fill="#7a6a5c"/>
  <ellipse cx="378" cy="198" rx="26" ry="28" fill="#d8cfc2"/>
  <ellipse cx="342" cy="221" rx="28" ry="16" fill="#6d5e51"/>

  <path d="M372,178 C405,176 395,136 422,118" fill="none" stroke="#f5efe6" stroke-width="26" stroke-linecap="round"/>
  <path d="M364,166 C391,158 383,130 408,106" fill="none" stroke="#6b4a2e" stroke-width="9" stroke-linecap="round"/>

  <path d="M450,108 L541,131 Q520,156 470,146 Q448,138 442,122 Z" fill="#d9b87a" stroke="#a8824a" stroke-width="1.5"/>
  <path d="M458,118 Q490,142 530,136" fill="none" stroke="#a8824a" stroke-width="1"/>
  <ellipse cx="432" cy="104" rx="24" ry="19" fill="#f6f0e4"/>
  <ellipse cx="428" cy="92" rx="18" ry="8" fill="#f2d97a"/>
  <path d="M452,92 L546,122 Q552,125 549,132 L541,130 L452,108 Z" fill="#a39a85" stroke="#7d7461" stroke-width="1.5"/>
  <circle cx="441" cy="100" r="3.6" fill="#111"/>
  <circle cx="442.2" cy="98.8" r="1.1" fill="#fff"/>

  <path d="M330,150 C370,150 440,178 508,208 L514,216 C450,222 380,222 335,195 Z" fill="#5a4a3e" stroke="#3e3128" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#3e3128" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M380,178 C420,190 460,206 500,214"/>
    <path d="M360,190 C400,202 450,214 490,218"/>
  </g>
  <circle cx="510" cy="214" r="6" fill="#2b2b2b"/>
</svg>