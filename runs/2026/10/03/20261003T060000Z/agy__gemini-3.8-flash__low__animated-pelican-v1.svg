<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background sky & ground gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4f1f9"/>
      <stop offset="65%" stop-color="#fff4e3"/>
      <stop offset="100%" stop-color="#fedac2"/>
    </linearGradient>

    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#726154"/>
      <stop offset="18%" stop-color="#5a493d"/>
      <stop offset="100%" stop-color="#362921"/>
    </linearGradient>

    <!-- Metallic gradients for bike parts -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d6dadf"/>
      <stop offset="70%" stop-color="#88929b"/>
      <stop offset="100%" stop-color="#b0b8c1"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006d77"/>
      <stop offset="50%" stop-color="#83c5be"/>
      <stop offset="100%" stop-color="#004e55"/>
    </linearGradient>

    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#e29578"/>
      <stop offset="55%" stop-color="#ffb703"/>
      <stop offset="85%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#b08968"/>
      <stop offset="50%" stop-color="#c47a53"/>
      <stop offset="100%" stop-color="#8f5032"/>
    </linearGradient>

    <!-- Wheel Definition (reusable for front and rear) -->
    <g id="bicycle-wheel">
      <!-- Rim and Tire shadow/highlights -->
      <circle cx="0" cy="0" r="116" fill="none" stroke="#22252a" stroke-width="16"/>
      <circle cx="0" cy="0" r="121" fill="none" stroke="#111215" stroke-width="3"/>
      <circle cx="0" cy="0" r="110" fill="none" stroke="#a0aab2" stroke-width="4"/>
      <circle cx="0" cy="0" r="107" fill="none" stroke="#5d656b" stroke-width="2"/>
      
      <!-- Spokes (16 crossing spokes) -->
      <g stroke="#dce3e8" stroke-width="1.6" opacity="0.85">
        <line x1="0" y1="-107" x2="0" y2="107"/>
        <line x1="-107" y1="0" x2="107" y2="0"/>
        <line x1="-75.6" y1="-75.6" x2="75.6" y2="75.6"/>
        <line x1="-75.6" y1="75.6" x2="75.6" y2="-75.6"/>
        <line x1="-98.8" y1="-41" x2="98.8" y2="41"/>
        <line x1="-98.8" y1="41" x2="98.8" y2="-41"/>
        <line x1="-41" y1="-98.8" x2="41" y2="98.8"/>
        <line x1="-41" y1="98.8" x2="41" y2="-98.8"/>
      </g>
      
      <!-- Hub -->
      <circle cx="0" cy="0" r="16" fill="url(#chromeGrad)" stroke="#444d56" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#1b1e22"/>
    </g>
  </defs>

  <style><![CDATA[
    /* Continuous animations */
    .wheel-rotate-rear {
      animation: spinWheel 1.4s linear infinite;
      transform-origin: 260px 480px;
    }
    .wheel-rotate-front {
      animation: spinWheel 1.4s linear infinite;
      transform-origin: 730px 480px;
    }
    @keyframes spinWheel {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Crank revolution around bottom bracket (x: 480, y: 480) */
    .crank-assembly {
      animation: pedalRotate 1.4s linear infinite;
      transform-origin: 480px 480px;
    }
    @keyframes pedalRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Keep pedals horizontal while crank rotates */
    .counter-rotate {
      animation: counterSpin 1.4s linear infinite;
    }
    @keyframes counterSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    /* Left (Far) Leg Kinematics - Starts at Top Dead Center (phase offset) */
    .left-thigh {
      animation: leftThighMotion 1.4s ease-in-out infinite;
      transform-origin: 440px 320px;
    }
    .left-shin {
      animation: leftShinMotion 1.4s ease-in-out infinite;
      transform-origin: 415px 405px;
    }
    @keyframes leftThighMotion {
      0%   { transform: rotate(-18deg); }
      25%  { transform: rotate(4deg); }
      50%  { transform: rotate(26deg); }
      75%  { transform: rotate(6deg); }
      100% { transform: rotate(-18deg); }
    }
    @keyframes leftShinMotion {
      0%   { transform: rotate(38deg); }
      25%  { transform: rotate(32deg); }
      50%  { transform: rotate(0deg); }
      75%  { transform: rotate(14deg); }
      100% { transform: rotate(38deg); }
    }

    /* Right (Near) Leg Kinematics - Bottom Dead Center */
    .right-thigh {
      animation: rightThighMotion 1.4s ease-in-out infinite;
      transform-origin: 445px 320px;
    }
    .right-shin {
      animation: rightShinMotion 1.4s ease-in-out infinite;
      transform-origin: 485px 410px;
    }
    @keyframes rightThighMotion {
      0%   { transform: rotate(26deg); }
      25%  { transform: rotate(6deg); }
      50%  { transform: rotate(-18deg); }
      75%  { transform: rotate(4deg); }
      100% { transform: rotate(26deg); }
    }
    @keyframes rightShinMotion {
      0%   { transform: rotate(0deg); }
      25%  { transform: rotate(14deg); }
      50%  { transform: rotate(38deg); }
      75%  { transform: rotate(32deg); }
      100% { transform: rotate(0deg); }
    }

    /* Subtle pelican body and head bobbing synced to pedaling cadence */
    .pelican-rider {
      animation: bodyBob 0.7s ease-in-out infinite alternate;
      transform-origin: 445px 330px;
    }
    @keyframes bodyBob {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(3.5px) rotate(0.8deg); }
    }

    /* Road dash movement for sense of speed */
    .road-dashes {
      animation: roadScroll 0.7s linear infinite;
    }
    @keyframes roadScroll {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }

    /* Coastal breeze fluttering feather tail */
    .feather-flutter {
      animation: tailWiggle 0.45s ease-in-out infinite alternate;
      transform-origin: 360px 320px;
    }
    @keyframes tailWiggle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(4deg); }
    }
  ]]></style>

  <!-- ================= SCENERY & ROAD ================= -->
  <!-- Sky -->
  <rect x="0" y="0" width="1000" height="490" fill="url(#skyGrad)"/>
  
  <!-- Coastal Distant Dunes / Hills -->
  <path d="M 0,470 Q 180,410 400,450 T 800,430 Q 920,410 1000,440 L 1000,490 L 0,490 Z" fill="#b8cbb8" opacity="0.65"/>
  <path d="M 0,480 Q 250,440 520,470 T 1000,460 L 1000,490 L 0,490 Z" fill="#99b29c" opacity="0.5"/>

  <!-- Ground / Pavement -->
  <rect x="0" y="490" width="1000" height="160" fill="url(#groundGrad)"/>
  <!-- Curb Line -->
  <line x1="0" y1="492" x2="1000" y2="492" stroke="#cfc0ad" stroke-width="4"/>
  <!-- Road Speed Line -->
  <line class="road-dashes" x1="0" y1="585" x2="1000" y2="585" stroke="#f4f1de" stroke-width="7" stroke-dasharray="60, 60" opacity="0.4"/>

  <!-- Ground Shadows of Bike & Rider -->
  <ellipse cx="260" cy="595" rx="100" ry="12" fill="#1e1814" opacity="0.45"/>
  <ellipse cx="730" cy="595" rx="100" ry="12" fill="#1e1814" opacity="0.45"/>
  <ellipse cx="490" cy="595" rx="180" ry="16" fill="#1e1814" opacity="0.35"/>

  <!-- ================= BICYCLE (FAR LAYER) ================= -->
  <!-- Rear Wheel (Animated Rotation around (260, 480)) -->
  <g class="wheel-rotate-rear">
    <g transform="translate(260, 480)">
      <use href="#bicycle-wheel"/>
    </g>
  </g>

  <!-- Front Wheel (Animated Rotation around (730, 480)) -->
  <g class="wheel-rotate-front">
    <g transform="translate(730, 480)">
      <use href="#bicycle-wheel"/>
    </g>
  </g>

  <!-- ================= FAR LEG (LEFT) ================= -->
  <!-- Positioned behind bicycle main triangle -->
  <g class="left-thigh">
    <!-- Left Upper Leg -->
    <path d="M 440,325 Q 405,370 415,405" fill="none" stroke="#4a3e35" stroke-width="16" stroke-linecap="round"/>
    <path d="M 440,325 Q 405,370 415,405" fill="none" stroke="#2b231d" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Lower Leg & Foot -->
    <g class="left-shin">
      <path d="M 415,405 L 430,465" fill="none" stroke="#3d332a" stroke-width="10" stroke-linecap="round"/>
      <!-- Pelican Webbed Left Foot gripping far pedal -->
      <path d="M 430,465 L 400,470 L 442,475 Z" fill="#ffb703" stroke="#d48b00" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ================= BICYCLE FRAMEWORK ================= -->
  <g id="bicycle-frame">
    <!-- Chainstay (BB 480,480 to Rear Hub 260,480) -->
    <line x1="480" y1="480" x2="260" y2="480" stroke="#004e55" stroke-width="11" stroke-linecap="round"/>
    <line x1="480" y1="480" x2="260" y2="480" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Seatstay (Seat Cluster 435,320 to Rear Hub 260,480) -->
    <line x1="435" y1="320" x2="260" y2="480" stroke="#004e55" stroke-width="10" stroke-linecap="round"/>
    <line x1="435" y1="320" x2="260" y2="480" stroke="url(#frameGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Seat Tube (Seat Cluster 435,320 to BB 480,480) -->
    <line x1="435" y1="320" x2="480" y2="480" stroke="#004e55" stroke-width="15" stroke-linecap="round"/>
    <line x1="435" y1="320" x2="480" y2="480" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Down Tube (BB 480,480 to Head Tube 660,300) -->
    <line x1="480" y1="480" x2="660" y2="300" stroke="#004e55" stroke-width="17" stroke-linecap="round"/>
    <line x1="480" y1="480" x2="660" y2="300" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Top Tube (Seat Cluster 435,320 to Head Tube 645,275) -->
    <line x1="435" y1="320" x2="645" y2="275" stroke="#004e55" stroke-width="14" stroke-linecap="round"/>
    <line x1="435" y1="320" x2="645" y2="275" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round"/>

    <!-- Head Tube -->
    <line x1="640" y1="260" x2="665" y2="315" stroke="#00353a" stroke-width="16" stroke-linecap="round"/>
    <line x1="640" y1="260" x2="665" y2="315" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Front Fork (Head Tube base 665,315 to Front Axle 730,480) -->
    <line x1="665" y1="315" x2="710" y2="430" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="710" y1="430" x2="730" y2="480" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Seatpost & Saddle -->
    <line x1="435" y1="320" x2="425" y2="290" stroke="url(#chromeGrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- Sleek Saddle Cushion -->
    <path d="M 390,285 C 410,278 445,280 460,290 C 455,296 440,296 425,294 C 405,294 395,298 390,285 Z" fill="#2b1e17" stroke="#160e0a" stroke-width="2"/>

    <!-- Handlebar Stem & Touring Cruiser Bars -->
    <path d="M 640,260 L 635,225 L 655,220" fill="none" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Swept-back Handlebars -->
    <path d="M 655,220 C 675,215 690,225 660,245" fill="none" stroke="url(#chromeGrad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Rubber Grips -->
    <path d="M 667,240 L 650,250" fill="none" stroke="#2b1e17" stroke-width="9" stroke-linecap="round"/>

    <!-- Drive Chain & Chainring -->
    <circle cx="480" cy="480" r="34" fill="none" stroke="#1a1c1e" stroke-width="5"/>
    <circle cx="480" cy="480" r="32" fill="#58616a" stroke="#222528" stroke-width="2"/>
    <path d="M 480,448 L 260,468 A 14,14 0 0,1 260,492 L 480,512" fill="none" stroke="#1c2024" stroke-width="4.5" stroke-dasharray="6,4"/>
  </g>

  <!-- ================= CRANKSET & PEDALS (SYNCHRONIZED ROTATION) ================= -->
  <!-- Centered exactly at Bottom Bracket (480, 480) -->
  <g class="crank-assembly">
    <!-- Left (Far) Crank Arm & Pedal - 180 degrees opposite -->
    <g id="far-crank">
      <line x1="480" y1="480" x2="435" y2="425" stroke="#495057" stroke-width="8" stroke-linecap="round"/>
      <!-- Far Pedal (Kept horizontal via counter-spin at x:435, y:425) -->
      <g class="counter-rotate" style="transform-origin: 435px 425px;">
        <rect x="420" y="420" width="30" height="10" rx="3" fill="#212529" stroke="#adb5bd" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Center Spindle Cap -->
    <circle cx="480" cy="480" r="14" fill="url(#chromeGrad)" stroke="#343a40" stroke-width="2"/>

    <!-- Right (Near) Crank Arm & Pedal -->
    <g id="near-crank">
      <line x1="480" y1="480" x2="525" y2="535" stroke="url(#chromeGrad)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="525" cy="535" r="4.5" fill="#212529"/>
      <!-- Near Pedal (Kept horizontal via counter-spin at x:525, y:535) -->
      <g class="counter-rotate" style="transform-origin: 525px 535px;">
        <rect x="510" y="530" width="32" height="11" rx="3" fill="#ffb703" stroke="#212529" stroke-width="2"/>
        <line x1="515" y1="535" x2="537" y2="535" stroke="#d48b00" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- ================= PELICAN RIDER (BODY, HEAD, WING) ================= -->
  <g class="pelican-rider">
    <!-- Fluttering Tail Feathers -->
    <g class="feather-flutter">
      <path d="M 390,320 C 350,325 330,345 315,355 C 330,340 360,335 385,335 Z" fill="#4a3e35"/>
      <path d="M 395,330 C 365,342 340,365 325,380 C 345,360 375,348 400,342 Z" fill="#3b3129"/>
    </g>

    <!-- Pelican Torso / Body -->
    <!-- California brown pelicans have warm grey-brown bodies and silvery grey mantles -->
    <path d="M 405,325 C 390,290 415,250 460,250 C 510,250 535,290 515,340 C 495,380 435,370 405,325 Z" fill="#605146" stroke="#43372f" stroke-width="2"/>
    <!-- Chest / Breast Highlight Contour -->
    <path d="M 450,252 C 485,255 520,285 505,335 C 490,368 450,360 435,340 C 465,335 485,305 465,270 Z" fill="#7a695c" opacity="0.6"/>

    <!-- Graceful S-Curved Neck -->
    <!-- Brown pelicans in breeding plumage display a rich chestnut hindneck & creamy front -->
    <path d="M 470,260 C 485,210 520,185 540,165 C 555,150 570,135 550,110 C 530,85 570,75 585,95 C 600,115 575,150 550,175 C 525,200 510,230 495,265 Z" fill="#3a281c"/>
    <path d="M 490,260 C 505,225 530,195 555,170 C 575,145 590,125 582,105 C 585,115 575,145 550,175 C 520,205 505,230 490,260 Z" fill="#e9ecef" opacity="0.85"/>

    <!-- Pelican Head (Crown & Nape) -->
    <!-- Bright yellow/cream crown distinctive of the California Brown Pelican -->
    <path d="M 565,95 C 560,70 585,55 615,62 C 635,66 645,85 640,105 C 630,120 600,125 575,115 C 565,110 560,100 565,95 Z" fill="#fefae0" stroke="#dda15e" stroke-width="1.5"/>
    <!-- Distinctive Pale Straw Yellow Crest / Tuft -->
    <path d="M 580,63 C 585,45 610,48 625,58 C 615,55 595,54 580,63 Z" fill="#ffe3a8"/>

    <!-- Eye & Facial Patch -->
    <circle cx="612" cy="85" r="9" fill="#1b263b"/>
    <circle cx="612" cy="85" r="7.5" fill="#e0e1dd"/>
    <circle cx="613" cy="84" r="4.2" fill="#0d1b2a"/>
    <circle cx="615" cy="82" r="1.5" fill="#ffffff"/> <!-- Sparkle -->

    <!-- Giant Pouch & Bill (Crucial Pelican Anatomy) -->
    <!-- Pouch hangs underneath lower bill -->
    <path d="M 625,102 C 655,130 730,155 770,125 C 750,150 670,175 615,115 Z" fill="url(#pouchGrad)" stroke="#6c3b24" stroke-width="1.5"/>
    
    <!-- Long Upper Bill with hooked tip -->
    <path d="M 622,86 L 795,110 C 815,113 818,122 812,125 C 795,126 775,122 625,102 Z" fill="url(#beakGrad)" stroke="#c44900" stroke-width="1.5"/>
    <path d="M 795,110 Q 815,112 813,126" fill="none" stroke="#9e2a2b" stroke-width="2.5"/> <!-- Hooked tip -->
    <!-- Bill Ridge / Highlights -->
    <line x1="630" y1="90" x2="795" y2="111" stroke="#fff" stroke-width="1.5" opacity="0.6"/>

    <!-- Folded Wing / Arm resting forward toward handlebars -->
    <!-- Wing shoulder starts on torso, extends folded elbow, and wingtip feathers reach grip -->
    <path d="M 440,290 C 470,270 525,275 570,300 C 610,325 640,310 655,248 C 640,265 615,280 575,275 C 525,270 480,295 440,290 Z" fill="#4f4237" stroke="#362c24" stroke-width="1.5"/>
    <!-- Wing Covert Layer Details -->
    <path d="M 455,305 C 490,295 540,295 580,335 C 555,335 520,315 480,315 C 465,315 455,310 455,305 Z" fill="#69594b"/>
    <path d="M 480,325 C 515,315 565,320 605,355 C 570,355 540,335 500,335 Z" fill="#362c24"/>

    <!-- Wingtips gripping the front handlebar -->
    <path d="M 648,245 C 655,238 668,242 666,252 C 660,258 650,256 648,245 Z" fill="#362c24"/>
  </g>

  <!-- ================= FOREGROUND (RIGHT / NEAR) LEG & WEB FOOT ================= -->
  <!-- Synchronized pedaling leg placed in front of frame -->
  <g class="right-thigh">
    <!-- Thigh / Femur portion originating from pelican hip (445, 320) -->
    <path d="M 445,320 Q 480,365 485,410" fill="none" stroke="#5a4c40" stroke-width="18" stroke-linecap="round"/>
    <path d="M 445,320 Q 480,365 485,410" fill="none" stroke="#3b3129" stroke-width="9" stroke-linecap="round"/>

    <!-- Shin / Tarsus articulating to foot on near pedal -->
    <g class="right-shin">
      <line x1="485" y1="410" x2="525" y2="530" stroke="#2e251f" stroke-width="12" stroke-linecap="round"/>
      <line x1="485" y1="410" x2="525" y2="530" stroke="#e09f3e" stroke-width="7" stroke-linecap="round"/>

      <!-- Large Orange Webbed Foot firmly pressed on the near pedal -->
      <!-- Claws & Webbing wrap around pedal platform -->
      <path d="M 525,530 L 495,535 L 505,542 L 545,542 L 550,535 Z" fill="#ffb703" stroke="#9a6700" stroke-width="2"/>
      <path d="M 505,535 L 538,542" stroke="#d48b00" stroke-width="2"/>
      <path d="M 518,533 L 546,539" stroke="#d48b00" stroke-width="2"/>
      <!-- Joint Knuckle -->
      <circle cx="485" cy="410" r="8" fill="#4a3c31"/>
      <circle cx="525" cy="530" r="5" fill="#d48b00"/>
    </g>
  </g>
</svg>