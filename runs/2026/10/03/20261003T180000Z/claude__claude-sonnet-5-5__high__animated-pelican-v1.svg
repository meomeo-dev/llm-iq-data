<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#d9f1fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="75" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="75" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="4 8"/>
      <circle r="68" fill="none" stroke="#c8ccd0" stroke-width="2.5"/>
      <g stroke="#9aa0a6" stroke-width="1.1">
        <line x1="-68" y1="0" x2="68" y2="0"/>
        <line x1="-68" y1="0" x2="68" y2="0" transform="rotate(15)"/>
        <line x1="-68" y1="0" x2="68" y2="0" transform="rotate(30)"/>
        <line x1="-68" y1="0" x2="68" y2="0" transform="rotate(45)"/>
        <line x1="-68" y1="0" x2="68" y2="0" transform="rotate(60)"/>
        <line x1="-68" y1="0" x2="68" y2="0" transform="rotate(75)"/>
        <line x1="-68" y1="0" x2="68" y2="0" transform="rotate(90)"/>
        <line x1="-68" y1="0" x2="68" y2="0" transform="rotate(105)"/>
        <line x1="-68" y1="0" x2="68" y2="0" transform="rotate(120)"/>
        <line x1="-68" y1="0" x2="68" y2="0" transform="rotate(135)"/>
        <line x1="-68" y1="0" x2="68" y2="0" transform="rotate(150)"/>
        <line x1="-68" y1="0" x2="68" y2="0" transform="rotate(165)"/>
      </g>
      <circle cx="0" cy="-65" r="3.5" fill="#e8a317"/>
      <circle r="8" fill="#999" stroke="#444" stroke-width="2"/>
      <circle r="3" fill="#333"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe27a" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-300 0" to="900 0" dur="70s" repeatCount="indefinite"/>
      <ellipse cx="150" cy="70" rx="45" ry="14"/>
      <ellipse cx="120" cy="78" rx="35" ry="12"/>
      <ellipse cx="180" cy="80" rx="38" ry="12"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-300 0" to="900 0" dur="95s" begin="-40s" repeatCount="indefinite"/>
      <ellipse cx="400" cy="130" rx="50" ry="14"/>
      <ellipse cx="370" cy="138" rx="36" ry="11"/>
      <ellipse cx="435" cy="139" rx="36" ry="11"/>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="423" width="800" height="77" fill="#6b6f76"/>
  <rect x="0" y="423" width="800" height="4" fill="#52565c"/>
  <line x1="0" y1="462" x2="800" y2="462" stroke="#f4f4f4" stroke-width="5" stroke-dasharray="50 50">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="0.19s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="405" cy="426" rx="235" ry="6" fill="#000" opacity="0.2"/>

  <!-- rear wheel -->
  <g transform="translate(250,345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
      <circle r="12" fill="#bbb" stroke="#555" stroke-width="2"/>
      <circle r="13.5" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2.2"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(560,345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <g fill="none" stroke="#333" stroke-width="3" stroke-dasharray="6 4">
    <path d="M250,333 L395,326">
      <animate attributeName="stroke-dashoffset" from="0" to="-10" dur="0.12s" repeatCount="indefinite"/>
    </path>
    <path d="M250,357 L395,374">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="0.12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- far crank + far pedal + far foot -->
  <g transform="translate(395,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="1.8s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="38" y2="0" stroke="#444" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(38,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="1.8s" repeatCount="indefinite"/>
          <rect x="-10" y="-2" width="20" height="5" rx="2" fill="#222"/>
          <path d="M-8,-2 L-6,-8 L2,-7 L17,-2 Z" fill="#2b2b2b" stroke="#1a1a1a" stroke-width="1" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2b2b2b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M355,220 L417.3,270.2 L357,350">
    <animate attributeName="d" dur="1.8s" repeatCount="indefinite" calcMode="linear" values="
      M355,220 L417.3,270.2 L357,350;
      M355,220 L427,254.9 L362.1,331;
      M355,220 L433.5,235.3 L376,317.1;
      M355,220 L435,220.4 L395,312;
      M355,220 L435,219.3 L414,317.1;
      M355,220 L434.2,231.2 L427.9,331;
      M355,220 L429.1,250.1 L433,350;
      M355,220 L417.8,269.5 L427.9,369;
      M355,220 L403.7,283.5 L414,382.9;
      M355,220 L397.1,288 L395,388;
      M355,220 L400.3,286 L376,382.9;
      M355,220 L407.8,280 L362.1,369;
      M355,220 L417.3,270.2 L357,350"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#1f8a8a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M395,350 L365,250"/>
    <path d="M365,252 L515,258"/>
    <path d="M395,350 L523,284"/>
    <path d="M250,345 L395,350"/>
    <path d="M250,345 L365,254"/>
    <path d="M528,288 L560,345"/>
  </g>
  <path d="M512,250 L528,288" stroke="#16696a" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- seat post and saddle -->
  <path d="M365,252 L358,228" stroke="#aab0b5" stroke-width="5" stroke-linecap="round"/>
  <path d="M330,225 Q352,216 386,221 L388,227 Q352,231 330,230 Z" fill="#222" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- stem and handlebar -->
  <path d="M512,250 L510,232" stroke="#aab0b5" stroke-width="5" stroke-linecap="round"/>
  <path d="M508,232 L538,230 Q553,230 553,247" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M553,247 L553,252" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <!-- hubs cover -->
  <circle cx="250" cy="345" r="5" fill="#666"/>
  <circle cx="560" cy="345" r="5" fill="#666"/>
  <!-- bottom bracket -->
  <circle cx="395" cy="350" r="8" fill="#16696a"/>

  <!-- near crank + chainring + near pedal + near foot -->
  <g transform="translate(395,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <circle r="24" fill="#d5d8db" stroke="#555" stroke-width="2"/>
      <circle r="26" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="4 2.5"/>
      <circle r="14" fill="none" stroke="#888" stroke-width="1.5"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#888" stroke-width="2"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#888" stroke-width="2"/>
      <line x1="0" y1="0" x2="38" y2="0" stroke="#666" stroke-width="6" stroke-linecap="round"/>
      <circle r="5" fill="#333"/>
      <g transform="translate(38,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.8s" repeatCount="indefinite"/>
          <rect x="-10" y="-2" width="20" height="5" rx="2" fill="#222"/>
          <path d="M-8,-2 L-6,-8 L2,-7 L17,-2 Z" fill="#3d3d3d" stroke="#1a1a1a" stroke-width="1" stroke-linejoin="round"/>
          <path d="M6,-6 L14,-2 M9,-7 L16,-3" stroke="#222" stroke-width="1" fill="none"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#444" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M355,220 L429.1,250.1 L433,350">
    <animate attributeName="d" dur="1.8s" repeatCount="indefinite" calcMode="linear" values="
      M355,220 L429.1,250.1 L433,350;
      M355,220 L417.8,269.5 L427.9,369;
      M355,220 L403.7,283.5 L414,382.9;
      M355,220 L397.1,288 L395,388;
      M355,220 L400.3,286 L376,382.9;
      M355,220 L407.8,280 L362.1,369;
      M355,220 L417.3,270.2 L357,350;
      M355,220 L427,254.9 L362.1,331;
      M355,220 L433.5,235.3 L376,317.1;
      M355,220 L435,220.4 L395,312;
      M355,220 L435,219.3 L414,317.1;
      M355,220 L434.2,231.2 L427.9,331;
      M355,220 L429.1,250.1 L433,350"/>
  </path>

  <!-- pelican: tail, body -->
  <path d="M312,190 L266,208 L272,224 L292,224 L318,212 Z" fill="#4e3b2e" stroke="#3a2b21" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="360" cy="185" rx="62" ry="40" fill="#7c6753" stroke="#5a4838" stroke-width="2" transform="rotate(-10 360 185)"/>
  <ellipse cx="372" cy="200" rx="38" ry="18" fill="#92806b" opacity="0.8"/>
  <ellipse cx="368" cy="213" rx="24" ry="12" fill="#7c6753"/>
  <ellipse cx="336" cy="188" rx="40" ry="21" fill="#5f4a3a" stroke="#4a382b" stroke-width="1.5" transform="rotate(-10 336 188)"/>
  <path d="M312,192 Q330,200 352,196 M318,181 Q338,189 360,184" fill="none" stroke="#4a382b" stroke-width="1.5"/>

  <!-- neck -->
  <path d="M402,178 C440,170 405,135 436,120" fill="none" stroke="#f1ebdb" stroke-width="20" stroke-linecap="round"/>
  <path d="M393,177 C431,169 396,135 427,118" fill="none" stroke="#5c4130" stroke-width="8" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="440" cy="114" r="15" fill="#f7f3e6"/>
  <ellipse cx="437" cy="105" rx="12" ry="6.5" fill="#efd069" transform="rotate(-10 437 105)"/>
  <circle cx="447" cy="112" r="3" fill="#111"/>
  <circle cx="448" cy="111" r="1" fill="#fff"/>
  <!-- bill -->
  <path d="M453,126 Q490,163 527,146 L453,122 Z" fill="#6f6a56" stroke="#4d493b" stroke-width="1"/>
  <path d="M451,107 L530,140 Q534,145 527,146 L452,124 Z" fill="#9a9686" stroke="#6a6657" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="529" cy="143" r="2.5" fill="#3b382e"/>

  <!-- wing reaching the handlebar -->
  <path d="M380,168 C430,172 490,205 538,226 L544,238 C490,226 432,218 384,206 Z" fill="#65503f" stroke="#4a382b" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M400,190 C440,196 490,214 536,232" fill="none" stroke="#8a735d" stroke-width="2"/>
  <ellipse cx="541" cy="232" rx="9" ry="7" fill="#3d2d22"/>
</svg>