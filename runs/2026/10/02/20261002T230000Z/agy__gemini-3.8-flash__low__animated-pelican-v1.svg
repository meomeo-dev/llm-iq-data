<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background Coastal Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5d8f7"/>
      <stop offset="65%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#fff8e7"/>
    </linearGradient>

    <!-- Ocean Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82a6"/>
      <stop offset="100%" stop-color="#1e4e69"/>
    </linearGradient>

    <!-- Metallic Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="50%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>

    <!-- Chrome / Steel Metal Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>

    <!-- Pelican Pouch Gradient -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d87a56"/>
      <stop offset="100%" stop-color="#b2533e"/>
    </linearGradient>

    <!-- Wheel Spoke Definition (12 Spokes) -->
    <g id="spokes">
      <line x1="0" y1="-85" x2="0" y2="85" stroke="#90a4ae" stroke-width="1.8" opacity="0.85"/>
      <line x1="-85" y1="0" x2="85" y2="0" stroke="#90a4ae" stroke-width="1.8" opacity="0.85"/>
      <line x1="-60.1" y1="-60.1" x2="60.1" y2="60.1" stroke="#90a4ae" stroke-width="1.8" opacity="0.85"/>
      <line x1="-60.1" y1="60.1" x2="60.1" y2="-60.1" stroke="#90a4ae" stroke-width="1.8" opacity="0.85"/>
      <line x1="-29.1" y1="-80" x2="29.1" y2="80" stroke="#90a4ae" stroke-width="1.8" opacity="0.85"/>
      <line x1="-80" y1="-29.1" x2="80" y2="29.1" stroke="#90a4ae" stroke-width="1.8" opacity="0.85"/>
      <line x1="-80" y1="29.1" x2="80" y2="-29.1" stroke="#90a4ae" stroke-width="1.8" opacity="0.85"/>
      <line x1="-29.1" y1="80" x2="29.1" y2="-80" stroke="#90a4ae" stroke-width="1.8" opacity="0.85"/>
    </g>

    <!-- Complete Wheel Assembly (Center at 0,0, Radius 95) -->
    <g id="wheel">
      <!-- Outer Tire -->
      <circle cx="0" cy="0" r="95" fill="none" stroke="#263238" stroke-width="14"/>
      <!-- Tire Tread Detail -->
      <circle cx="0" cy="0" r="100" fill="none" stroke="#102027" stroke-width="2" stroke-dasharray="4,4"/>
      <!-- Rim -->
      <circle cx="0" cy="0" r="88" fill="none" stroke="#eceff1" stroke-width="5"/>
      <circle cx="0" cy="0" r="85" fill="none" stroke="#78909c" stroke-width="1.5"/>
      <!-- Rotating Spokes -->
      <g>
        <use href="#spokes"/>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="1.2s"
          repeatCount="indefinite"/>
      </g>
      <!-- Hub -->
      <circle cx="0" cy="0" r="13" fill="url(#chromeGrad)" stroke="#455a64" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#37474f"/>
    </g>
  </defs>

  <style><![CDATA[
    .ground-line { stroke: #e0d0b0; stroke-width: 3; stroke-linecap: round; }
    .speed-line { stroke: #ffffff; stroke-width: 2.5; stroke-dasharray: 40 80; opacity: 0.6; }
  ]]></style>

  <!-- ================= BACKGROUND ================= -->
  <rect width="900" height="650" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="780" cy="120" r="55" fill="#fff9c4" opacity="0.8"/>
  <circle cx="780" cy="120" r="70" fill="#fff9c4" opacity="0.3"/>

  <!-- Distant Ocean / Coast Horizon -->
  <path d="M0,450 Q220,442 450,446 T900,445 L900,490 L0,490 Z" fill="url(#oceanGrad)"/>
  <path d="M0,465 C300,460 600,468 900,463 L900,490 L0,490 Z" fill="#2d6a8a" opacity="0.7"/>

  <!-- Boardwalk / Road Path -->
  <rect x="0" y="490" width="900" height="160" fill="#d7ccc8"/>
  <rect x="0" y="490" width="900" height="18" fill="#8d6e63"/>
  <line x1="0" y1="518" x2="900" y2="518" stroke="#a1887f" stroke-width="4"/>

  <!-- Animated Ground Motion Lines -->
  <g stroke="#bcaaa4" stroke-width="3" stroke-linecap="round">
    <line x1="1000" y1="565" x2="1120" y2="565">
      <animate attributeName="x1" from="950" to="-200" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="1070" to="-80" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="1000" y1="605" x2="1180" y2="605">
      <animate attributeName="x1" from="1100" to="-250" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="1280" to="-70" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="1000" y1="535" x2="1080" y2="535">
      <animate attributeName="x1" from="1050" to="-150" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="1130" to="-70" dur="0.9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ================= BICYCLE AND RIDER GROUP ================= -->
  <!-- Subtle whole-body riding bounce -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 0,-3.5; 0,0; 0,-1.5; 0,0"
      keyTimes="0; 0.25; 0.5; 0.75; 1"
      dur="0.6s"
      repeatCount="indefinite"/>

    <!-- ================= BACK LEG (Far Side / Left Leg) ================= -->
    <!-- Positioned behind bike frame & front crank; synchronized with crank 180° offset -->
    <g>
      <!-- Left Upper Leg (Thigh) pinned to Hip (415, 230) -->
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="18 415 230; -12 415 230; 18 415 230"
          keyTimes="0; 0.5; 1"
          dur="1.2s"
          repeatCount="indefinite"/>
        <line x1="415" y1="230" x2="455" y2="335" stroke="#4e342e" stroke-width="18" stroke-linecap="round"/>
        
        <!-- Left Lower Leg pinned to Knee (455, 335) -->
        <g>
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="-32 455 335; 26 455 335; -32 455 335"
            keyTimes="0; 0.5; 1"
            dur="1.2s"
            repeatCount="indefinite"/>
          <line x1="455" y1="335" x2="400" y2="435" stroke="#3e2723" stroke-width="12" stroke-linecap="round"/>
          <!-- Webbed Foot & Rear Pedal Shoe -->
          <polygon points="400,435 365,446 415,446" fill="#f57c00"/>
        </g>
      </g>
    </g>

    <!-- ================= REAR WHEEL ================= -->
    <!-- Center: (220, 435) -->
    <g transform="translate(220, 435)">
      <use href="#wheel"/>
    </g>

    <!-- ================= FRONT WHEEL ================= -->
    <!-- Center: (670, 435) -->
    <g transform="translate(670, 435)">
      <use href="#wheel"/>
    </g>

    <!-- ================= BICYCLE FRAME ================= -->
    <!-- Geometry:
         Rear Axle: (220, 435)
         Bottom Bracket (BB): (435, 435)
         Seat Lug (Seat post top): (395, 255)
         Head Tube Top: (610, 205)
         Head Tube Bottom / Fork Crown: (625, 275)
         Front Dropouts: (670, 435)
    -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Rear Chainstays: Rear Axle -> BB -->
      <line x1="220" y1="435" x2="435" y2="435" stroke="#bf360c" stroke-width="11"/>
      
      <!-- Rear Seatstays: Rear Axle -> Seat Lug -->
      <line x1="220" y1="435" x2="395" y2="255" stroke="url(#frameGrad)" stroke-width="9"/>

      <!-- Seat Tube: BB -> Seat Lug -->
      <line x1="435" y1="435" x2="395" y2="255" stroke="url(#frameGrad)" stroke-width="13"/>

      <!-- Down Tube: BB -> Head Tube Bottom -->
      <line x1="435" y1="435" x2="625" y2="275" stroke="url(#frameGrad)" stroke-width="14"/>

      <!-- Top Tube: Seat Lug -> Head Tube Top -->
      <line x1="395" y1="255" x2="610" y2="205" stroke="url(#frameGrad)" stroke-width="12"/>

      <!-- Head Tube -->
      <line x1="610" y1="205" x2="625" y2="275" stroke="#bf360c" stroke-width="15"/>

      <!-- Front Fork: Crown -> Front Dropouts -->
      <line x1="625" y1="275" x2="670" y2="435" stroke="url(#chromeGrad)" stroke-width="10"/>

      <!-- Seatpost & Saddle -->
      <line x1="395" y1="255" x2="385" y2="220" stroke="url(#chromeGrad)" stroke-width="9"/>
      <!-- Ergonomic Leather Saddle -->
      <path d="M340,225 C360,222 385,217 410,218 C425,219 432,228 424,233 C414,238 395,231 345,232 C338,232 334,228 340,225 Z"
            fill="#3e2723" stroke="#271c19" stroke-width="2"/>

      <!-- Handlebar Stem & Swept Cruiser Bar -->
      <path d="M610,205 L600,165 L615,160" fill="none" stroke="url(#chromeGrad)" stroke-width="8"/>
      <!-- Handlebar curve forward then back to grips -->
      <path d="M575,175 Q625,145 640,165" fill="none" stroke="url(#chromeGrad)" stroke-width="7"/>
      <!-- Rubber Grips -->
      <circle cx="575" cy="175" r="6.5" fill="#212121"/>

      <!-- Bicycle Drive Chain & Chainring -->
      <circle cx="435" cy="435" r="32" fill="#37474f" stroke="#78909c" stroke-width="2"/>
      <circle cx="220" cy="435" r="16" fill="#37474f"/>
      <!-- Chain Paths -->
      <line x1="220" y1="419" x2="435" y2="403" stroke="#263238" stroke-width="3.5" stroke-dasharray="5,3"/>
      <line x1="220" y1="451" x2="435" y2="467" stroke="#263238" stroke-width="3.5" stroke-dasharray="5,3"/>
    </g>

    <!-- ================= REAR CRANK & PEDAL (180 deg out of phase) ================= -->
    <!-- Revolves around Bottom Bracket (435, 435) -->
    <g transform="translate(435, 435)">
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="180"
          to="540"
          dur="1.2s"
          repeatCount="indefinite"/>
        <!-- Rear Crank Arm (Length 46) -->
        <rect x="-5" y="-5" width="10" height="51" rx="4" fill="#78909c" stroke="#37474f" stroke-width="1.5"/>
        <!-- Rear Pedal Spindle & Platform (counter-rotates to stay horizontal) -->
        <g transform="translate(0, 46)">
          <g>
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="-180"
              to="-540"
              dur="1.2s"
              repeatCount="indefinite"/>
            <rect x="-14" y="-4" width="28" height="8" rx="2.5" fill="#424242" stroke="#212121" stroke-width="1.2"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ================= PELICAN BODY & HEAD ================= -->
    <!-- Pelican Body Group -->
    <g id="pelican-body">
      <!-- Tail Feathers -->
      <path d="M315,220 C325,195 350,195 365,215 C345,225 325,235 315,220 Z" fill="#4e342e" stroke="#2d1d19" stroke-width="1.5"/>
      <path d="M305,210 C320,185 348,190 360,210 C340,218 318,222 305,210 Z" fill="#6d4c41"/>

      <!-- Large Main Torso / Barrel Chest -->
      <path d="M345,225 C340,170 380,135 440,140 C490,145 520,185 505,245 C490,285 410,290 360,260 C345,248 345,235 345,225 Z"
            fill="#5d4037" stroke="#3e2723" stroke-width="2"/>

      <!-- Brown Pelican Dusky Belly & Feather Shading -->
      <path d="M375,260 C420,285 480,270 495,230 C475,255 425,265 375,260 Z" fill="#3e2723"/>
      <path d="M360,205 C375,175 415,160 455,165 C440,195 400,215 360,205 Z" fill="#795548" opacity="0.6"/>

      <!-- Curved S-Neck (California Brown Pelican: rich chestnut-brown hindneck, white front/sides) -->
      <!-- White Neck Front Contour -->
      <path d="M475,160 C495,115 505,75 465,55 C445,45 435,55 450,75 C465,95 460,125 445,150 Z"
            fill="#eceff1" stroke="#cfd8dc" stroke-width="1.5"/>
      
      <!-- Rich Chestnut Brown Hindneck -->
      <path d="M465,55 C478,65 485,95 470,130 C460,150 445,160 440,165 C455,145 465,110 450,75 Z"
            fill="#4e342e"/>

      <!-- Pelican Head & Pale Yellow Crest Cap -->
      <ellipse cx="445" cy="50" rx="26" ry="19" fill="#eceff1"/>
      <!-- Pale Straw-Yellow Crown Wash -->
      <path d="M430,42 C440,32 462,32 468,43 C460,47 440,47 430,42 Z" fill="#fff59d"/>

      <!-- Intense Pelican Eye -->
      <circle cx="456" cy="46" r="6" fill="#cfd8dc"/>
      <circle cx="457" cy="46" r="3.5" fill="#212121"/>
      <circle cx="458" cy="44.5" r="1.2" fill="#ffffff"/> <!-- Sparkle -->

      <!-- Distinctive Pelican Beak & Deep Gular Pouch -->
      <!-- Upper Bill (Long, flat, hooked horn at tip) -->
      <path d="M462,44 L605,62 C612,63 614,70 608,72 L460,60 Z"
            fill="#b0bec5" stroke="#78909c" stroke-width="1.5"/>
      <!-- Curved Bill Hook Tip -->
      <path d="M605,62 Q614,64 610,74 Q604,69 603,66 Z" fill="#d84315"/>

      <!-- Pouch (Gular Sac) expanding downwards and forwards -->
      <path d="M460,60 L595,72 C580,105 520,125 462,75 Z"
            fill="url(#pouchGrad)" stroke="#8d2b1b" stroke-width="1.5"/>
      <!-- Delicate Pouch Vascular Streaks -->
      <path d="M485,73 Q525,102 560,78" fill="none" stroke="#ff8a65" stroke-width="1" opacity="0.6"/>
      <path d="M472,68 Q510,95 540,75" fill="none" stroke="#ff8a65" stroke-width="1" opacity="0.6"/>

      <!-- Wing resting gracefully along the flank -->
      <path d="M375,190 C395,165 440,165 470,195 C450,230 405,245 365,225 C355,220 365,200 375,190 Z"
            fill="#4e342e" stroke="#2e1c14" stroke-width="2"/>
      <!-- Layered Wing Primary & Covert Feather Tips -->
      <path d="M390,210 C420,215 445,205 460,195" fill="none" stroke="#8d6e63" stroke-width="2.5"/>
      <path d="M380,223 C410,228 435,220 450,210" fill="none" stroke="#8d6e63" stroke-width="2.5"/>
      <path d="M355,225 C330,235 315,250 300,240 C320,230 340,225 355,225 Z" fill="#3e2723"/>

      <!-- Wing/Arm reaching to handlebars -->
      <!-- Shoulder to elbow to wing tip gripping handlebar (575, 175) -->
      <path d="M440,180 Q510,185 575,175" fill="none" stroke="#5d4037" stroke-width="16" stroke-linecap="round"/>
      <path d="M440,180 Q510,185 575,175" fill="none" stroke="#8d6e63" stroke-width="6" stroke-linecap="round"/>
      <!-- Wing feather "hand" gripping handle -->
      <path d="M565,168 C578,165 585,178 572,183 C565,185 560,172 565,168 Z" fill="#3e2723"/>
    </g>

    <!-- ================= FRONT CRANK & PEDAL (Near Side) ================= -->
    <!-- Bottom bracket axle center at (435, 435) -->
    <g transform="translate(435, 435)">
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="1.2s"
          repeatCount="indefinite"/>

        <!-- Front Crank Arm (pointing opposite to rear, length 46) -->
        <rect x="-5" y="-5" width="10" height="51" rx="4" fill="url(#chromeGrad)" stroke="#455a64" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="8" fill="#37474f"/>
        <circle cx="0" cy="0" r="3" fill="#cfd8dc"/>

        <!-- Front Pedal Platform at (0, 46) counter-rotating to remain level -->
        <g transform="translate(0, 46)">
          <g>
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0"
              to="-360"
              dur="1.2s"
              repeatCount="indefinite"/>
            <!-- Pedal Body -->
            <rect x="-15" y="-4.5" width="30" height="9" rx="3" fill="#212121" stroke="#ffab00" stroke-width="1.2"/>
            <rect x="-11" y="-2" width="22" height="4" fill="#e65100"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ================= FRONT LEG (Near Side / Right Leg) ================= -->
    <!-- Pinned to Hip at (430, 240). Thigh and shin articulate in synchrony with crank rotation -->
    <g>
      <!-- Upper Leg (Thigh) -->
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="-12 430 240; 20 430 240; -12 430 240"
          keyTimes="0; 0.5; 1"
          dur="1.2s"
          repeatCount="indefinite"/>
        <!-- Muscular Pelican Thigh -->
        <path d="M418,230 L446,238 L458,340 L430,340 Z" fill="#6d4c41"/>
        <line x1="430" y1="240" x2="445" y2="340" stroke="#5d4037" stroke-width="20" stroke-linecap="round"/>

        <!-- Lower Leg (Knee joint at 445, 340) -->
        <g>
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="24 445 340; -34 445 340; 24 445 340"
            keyTimes="0; 0.5; 1"
            dur="1.2s"
            repeatCount="indefinite"/>
          <!-- Sturdy Tarsus / Shin -->
          <line x1="445" y1="340" x2="435" y2="465" stroke="#ff9800" stroke-width="11" stroke-linecap="round"/>
          <line x1="445" y1="340" x2="435" y2="465" stroke="#f57c00" stroke-width="8" stroke-linecap="round"/>

          <!-- Webbed Pelican Foot over the pedal -->
          <!-- Pinned to Ankle (435, 465) -->
          <g>
            <animateTransform
              attributeName="transform"
              type="rotate"
              values="-10 435 465; 12 435 465; -10 435 465"
              keyTimes="0; 0.5; 1"
              dur="1.2s"
              repeatCount="indefinite"/>
            <!-- Broad Palmate Webbed Foot -->
            <polygon points="435,462 400,479 465,479" fill="#ff9800" stroke="#e65100" stroke-width="1.5"/>
            <!-- Webbed Claws -->
            <line x1="435" y1="462" x2="400" y2="479" stroke="#b26a00" stroke-width="2"/>
            <line x1="435" y1="462" x2="432" y2="480" stroke="#b26a00" stroke-width="2"/>
            <line x1="435" y1="462" x2="465" y2="479" stroke="#b26a00" stroke-width="2"/>
          </g>
        </g>
      </g>
    </g>

  </g>

  <!-- Coastal Breeze & Motion Wind Lines -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.45" stroke-linecap="round">
    <line x1="900" y1="180" x2="780" y2="180">
      <animate attributeName="x1" from="1000" to="-100" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="880" to="-220" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <line x1="900" y1="215" x2="740" y2="215">
      <animate attributeName="x1" from="1100" to="-150" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="940" to="-310" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="900" y1="130" x2="820" y2="130">
      <animate attributeName="x1" from="950" to="-80" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="870" to="-160" dur="1.7s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>