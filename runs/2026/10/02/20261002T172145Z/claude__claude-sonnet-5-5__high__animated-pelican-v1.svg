<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#e6f5fc"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#1f1f1f" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#b5b9bf" stroke-width="2"/>
      <g stroke="#8b9097" stroke-width="1.2">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(22.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(45)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(67.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(112.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(135)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-57" r="3.5" fill="#e53935"/>
      <circle r="8" fill="#6d7279"/>
      <circle r="3" fill="#222"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="85" r="38" fill="#ffe27a" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="90" rx="50" ry="15"/>
    <ellipse cx="185" cy="78" rx="32" ry="14"/>
    <ellipse cx="500" cy="60" rx="45" ry="12"/>
    <ellipse cx="530" cy="50" rx="28" ry="11"/>
  </g>

  <rect x="0" y="423" width="800" height="77" fill="#7d838c"/>
  <rect x="0" y="423" width="800" height="5" fill="#5f656d"/>
  <line x1="-120" y1="468" x2="920" y2="468" stroke="#f3f3f3" stroke-width="5" stroke-dasharray="60 50">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-110,0" dur="0.4s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="380" cy="426" rx="190" ry="8" fill="#000" opacity="0.2"/>

  <!-- wheels -->
  <g transform="translate(230,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="12" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="2 2"/>
    </g>
  </g>
  <g transform="translate(526,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="1.8" stroke-dasharray="3 2">
    <line x1="372" y1="338" x2="230" y2="342"/>
    <line x1="372" y1="366" x2="230" y2="358"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c8372d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="230" y1="350" x2="372" y2="352"/>
    <line x1="230" y1="350" x2="340" y2="266"/>
    <line x1="372" y1="352" x2="335" y2="252"/>
    <line x1="340" y1="268" x2="482" y2="254"/>
    <line x1="372" y1="352" x2="492" y2="282"/>
    <line x1="482" y1="250" x2="492" y2="282" stroke-width="8"/>
    <line x1="492" y1="282" x2="526" y2="350" stroke="#9aa0a8" stroke-width="5"/>
  </g>
  <g fill="none" stroke="#2a2a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="482" y1="250" x2="479" y2="232"/>
    <path d="M479,232 L503,226 Q514,226 514,238"/>
  </g>
  <path d="M313,250 Q335,243 361,248 L363,254 Q336,257 313,256 Z" fill="#222" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- crank, chainring, pedals -->
  <g transform="translate(372,352)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="14" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 2"/>
      <line x1="0" y1="0" x2="36" y2="0" stroke="#2f2f2f" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-36" y2="0" stroke="#2f2f2f" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(36,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-10" y="-2.5" width="20" height="5" rx="1.5" fill="#1c1c1c"/>
        </g>
      </g>
      <g transform="translate(-36,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-10" y="-2.5" width="20" height="5" rx="1.5" fill="#1c1c1c"/>
        </g>
      </g>
    </g>
    <circle r="5" fill="#8d9299" stroke="#222" stroke-width="1.5"/>
  </g>

  <!-- far leg -->
  <path d="M342,248 L391.5,303 L336,352" fill="none" stroke="#2e2a26" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M342,248 L391.5,303 L336,352;
      M342,248 L401.6,291.8 L340.8,334;
      M342,248 L411.3,274 L354,320.8;
      M342,248 L415.6,256.2 L372,316;
      M342,248 L415.9,251.5 L390,320.8;
      M342,248 L414.9,260.9 L403.2,334;
      M342,248 L409.7,278 L408,352;
      M342,248 L398.2,296.2 L403.2,370;
      M342,248 L383.2,309.5 L390,383.2;
      M342,248 L375.3,314.1 L372,388;
      M342,248 L377.4,313 L354,383.2;
      M342,248 L383.3,309.4 L340.8,370;
      M342,248 L391.5,303 L336,352"/>
  </path>
  <g transform="translate(336,352)">
    <animateTransform attributeName="transform" type="translate" dur="2s" repeatCount="indefinite" calcMode="linear" values="336,352;340.8,334;354,320.8;372,316;390,320.8;403.2,334;408,352;403.2,370;390,383.2;372,388;354,383.2;340.8,370;336,352"/>
    <path d="M-7,-9 Q4,-10 16,-4 L19,-2 L11,-2 L-6,-2 Z" fill="#2e2a26"/>
  </g>

  <!-- near leg -->
  <path d="M342,248 L409.7,278 L408,352" fill="none" stroke="#4a423a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M342,248 L409.7,278 L408,352;
      M342,248 L398.2,296.2 L403.2,370;
      M342,248 L383.2,309.5 L390,383.2;
      M342,248 L375.3,314.1 L372,388;
      M342,248 L377.4,313 L354,383.2;
      M342,248 L383.3,309.4 L340.8,370;
      M342,248 L391.5,303 L336,352;
      M342,248 L401.6,291.8 L340.8,334;
      M342,248 L411.3,274 L354,320.8;
      M342,248 L415.6,256.2 L372,316;
      M342,248 L415.9,251.5 L390,320.8;
      M342,248 L414.9,260.9 L403.2,334;
      M342,248 L409.7,278 L408,352"/>
  </path>
  <g transform="translate(408,352)">
    <animateTransform attributeName="transform" type="translate" dur="2s" repeatCount="indefinite" calcMode="linear" values="408,352;403.2,370;390,383.2;372,388;354,383.2;340.8,370;336,352;340.8,334;354,320.8;372,316;390,320.8;403.2,334;408,352"/>
    <path d="M-7,-9 Q4,-10 16,-4 L19,-2 L11,-2 L-6,-2 Z" fill="#4a423a"/>
  </g>

  <!-- pelican tail and body -->
  <path d="M290,212 L226,236 L230,250 L294,238 Z" fill="#4a3b2f" stroke="#33271e" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="335" cy="215" rx="58" ry="40" transform="rotate(-12 335 215)" fill="#7b6552"/>
  <ellipse cx="372" cy="214" rx="24" ry="27" fill="#9b8a74"/>

  <!-- neck and head -->
  <path d="M366,205 C392,196 388,160 418,152" fill="none" stroke="#7a5236" stroke-width="20" stroke-linecap="round"/>
  <path d="M371,203 C397,194 393,160 425,151" fill="none" stroke="#f2e8c8" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="426" cy="144" rx="19" ry="15" fill="#f6efd2"/>
  <ellipse cx="424" cy="134" rx="14" ry="6" fill="#f0cf5a"/>
  <path d="M442,150 Q485,190 534,164 L442,154 Z" fill="#c2ae85" stroke="#8d7a58" stroke-width="1"/>
  <path d="M440,138 L536,158 Q541,162 534,165 L440,151 Z" fill="#9d9482" stroke="#6f6757" stroke-width="1" stroke-linejoin="round"/>
  <path d="M528,157 Q541,160 541,165 Q537,167 531,164 Z" fill="#5b4a3a"/>
  <circle cx="432" cy="139" r="3.2" fill="#111"/>
  <circle cx="433" cy="138" r="1" fill="#fff"/>

  <!-- wing gripping handlebar -->
  <path d="M335,192 C375,182 445,205 502,224 L498,232 C450,236 390,246 340,236 C322,225 320,205 335,192 Z" fill="#5a4636" stroke="#3d2e22" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#8a7158" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M360,205 C400,208 440,218 485,228"/>
    <path d="M350,218 C395,222 440,228 480,233"/>
  </g>
  <circle cx="503" cy="228" r="6" fill="#3d2e22"/>
</svg>