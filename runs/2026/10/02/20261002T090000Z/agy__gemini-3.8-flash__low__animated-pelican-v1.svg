<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* ---- Keyframe Animations ---- */
      @keyframes wheelRotate {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes crankRotate {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes counterRotate {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      /* Left Leg (Near Side: starts pointing forward-down / phase 0) */
      @keyframes leftThighMove {
        0%   { transform: rotate(0deg); }
        25%  { transform: rotate(11deg); }
        50%  { transform: rotate(18deg); }
        75%  { transform: rotate(7deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes leftShinMove {
        0%   { transform: rotate(0deg); }
        25%  { transform: rotate(-24deg); }
        50%  { transform: rotate(-14deg); }
        75%  { transform: rotate(12deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes leftFootMove {
        0%   { transform: rotate(0deg); }
        25%  { transform: rotate(13deg); }
        50%  { transform: rotate(-4deg); }
        75%  { transform: rotate(-19deg); }
        100% { transform: rotate(0deg); }
      }
      /* Right Leg (Far Side: 180 deg out of phase with Left) */
      @keyframes rightThighMove {
        0%   { transform: rotate(18deg); }
        25%  { transform: rotate(7deg); }
        50%  { transform: rotate(0deg); }
        75%  { transform: rotate(11deg); }
        100% { transform: rotate(18deg); }
      }
      @keyframes rightShinMove {
        0%   { transform: rotate(-14deg); }
        25%  { transform: rotate(12deg); }
        50%  { transform: rotate(0deg); }
        75%  { transform: rotate(-24deg); }
        100% { transform: rotate(-14deg); }
      }
      @keyframes rightFootMove {
        0%   { transform: rotate(-4deg); }
        25%  { transform: rotate(-19deg); }
        50%  { transform: rotate(0deg); }
        75%  { transform: rotate(13deg); }
        100% { transform: rotate(-4deg); }
      }
      /* Subtle cycling body bounce and breeze motion */
      @keyframes pelicanBounce {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25%      { transform: translateY(-2.5px) rotate(-0.5deg); }
        50%      { transform: translateY(1px) rotate(0.3deg); }
        75%      { transform: translateY(-2px) rotate(-0.4deg); }
      }
      @keyframes pouchFlutter {
        0%, 100% { transform: scaleY(1); }
        50%      { transform: scaleY(1.05) skewX(-1deg); }
      }
      @keyframes groundMove {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }

      /* Animation Application */
      .anim-rear-wheel {
        transform-origin: 260px 510px;
        animation: wheelRotate 1.2s linear infinite;
      }
      .anim-front-wheel {
        transform-origin: 750px 510px;
        animation: wheelRotate 1.2s linear infinite;
      }
      .anim-crank {
        transform-origin: 495px 510px;
        animation: crankRotate 1.2s linear infinite;
      }
      .anim-pedal-left {
        transform-origin: 535px 540px;
        animation: counterRotate 1.2s linear infinite;
      }
      .anim-pedal-right {
        transform-origin: 455px 480px;
        animation: counterRotate 1.2s linear infinite;
      }
      .anim-pelican-torso {
        transform-origin: 460px 330px;
        animation: pelicanBounce 1.2s ease-in-out infinite;
      }
      .anim-pouch {
        transform-origin: 620px 220px;
        animation: pouchFlutter 0.6s ease-in-out infinite;
      }
      .anim-thigh-left {
        transform-origin: 470px 335px;
        animation: leftThighMove 1.2s linear infinite;
      }
      .anim-shin-left {
        transform-origin: 498px 438px;
        animation: leftShinMove 1.2s linear infinite;
      }
      .anim-foot-left {
        transform-origin: 535px 540px;
        animation: leftFootMove 1.2s linear infinite;
      }
      .anim-thigh-right {
        transform-origin: 470px 335px;
        animation: rightThighMove 1.2s linear infinite;
      }
      .anim-shin-right {
        transform-origin: 468px 428px;
        animation: rightShinMove 1.2s linear infinite;
      }
      .anim-foot-right {
        transform-origin: 455px 480px;
        animation: rightFootMove 1.2s linear infinite;
      }
      .speed-line {
        stroke-dasharray: 60 40;
        animation: groundMove 0.4s linear infinite;
      }
    ]]></style>

    <!-- Linear Gradients for realism and lighting -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4f0fc"/>
      <stop offset="60%" stop-color="#eaf7fd"/>
      <stop offset="100%" stop-color="#fdf8ea"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#006d77"/>
      <stop offset="50%" stop-color="#83c5be"/>
      <stop offset="100%" stop-color="#006d77"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#666"/>
      <stop offset="50%" stop-color="#e6e6e6"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>

    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="60%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#d62828"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d47a00" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>

    <!-- Reusable 16-Spoke Wheel Assembly -->
    <g id="bicycle-wheel">
      <!-- Tire -->
      <circle cx="0" cy="0" r="115" stroke="#1d2021" stroke-width="16" fill="none"/>
      <!-- Outer Rim & Inner Lip -->
      <circle cx="0" cy="0" r="108" stroke="url(#rimGrad)" stroke-width="4.5" fill="none"/>
      <circle cx="0" cy="0" r="99" stroke="#b0b0b0" stroke-width="1.5" fill="none"/>
      <!-- Spokes (16 Radial Intersecting Spokes) -->
      <g stroke="#d5d5d5" stroke-width="1.6" opacity="0.8">
        <line x1="0" y1="-99" x2="0" y2="99"/>
        <line x1="-99" y1="0" x2="99" y2="0"/>
        <line x1="-70" y1="-70" x2="70" y2="70"/>
        <line x1="-70" y1="70" x2="70" y2="-70"/>
        <line x1="-91.4" y1="-37.9" x2="91.4" y2="37.9"/>
        <line x1="-91.4" y1="37.9" x2="91.4" y2="-37.9"/>
        <line x1="-37.9" y1="-91.4" x2="37.9" y2="91.4"/>
        <line x1="-37.9" y1="91.4" x2="37.9" y2="-91.4"/>
      </g>
      <!-- Hub -->
      <circle cx="0" cy="0" r="14" fill="#343a40"/>
      <circle cx="0" cy="0" r="9" fill="#ced4da"/>
      <circle cx="0" cy="0" r="4" fill="#111"/>
    </g>
  </defs>

  <!-- Background Environment -->
  <rect width="1000" height="700" fill="url(#skyGrad)"/>

  <!-- Coastal Horizon & Distant Islands -->
  <path d="M0 450 Q 250 435, 520 445 T 1000 440 L 1000 490 L 0 490 Z" fill="#bde0fe" opacity="0.6"/>
  <path d="M120 440 Q 200 415, 290 440 Z" fill="#90b4ce" opacity="0.5"/>
  <path d="M680 442 Q 780 420, 880 442 Z" fill="#90b4ce" opacity="0.5"/>

  <!-- Roadway & Shadow -->
  <rect x="0" y="585" width="1000" height="115" fill="#495057"/>
  <rect x="0" y="585" width="1000" height="8" fill="#343a40"/>
  <line x1="0" y1="628" x2="1000" y2="628" stroke="#ffb703" stroke-width="5" class="speed-line"/>
  <line x1="0" y1="665" x2="1000" y2="665" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35" class="speed-line"/>

  <!-- Bicycle Ground Contact Shadows -->
  <ellipse cx="260" cy="624" rx="100" ry="12" fill="#000000" opacity="0.25"/>
  <ellipse cx="750" cy="624" rx="100" ry="12" fill="#000000" opacity="0.25"/>
  <ellipse cx="500" cy="624" rx="160" ry="14" fill="#000000" opacity="0.2"/>

  <!-- ==================== BICYCLE LAYER (Rear Elements) ==================== -->

  <!-- Rear Wheel -->
  <g class="anim-rear-wheel">
    <use href="#bicycle-wheel" x="260" y="510"/>
  </g>

  <!-- Front Wheel -->
  <g class="anim-front-wheel">
    <use href="#bicycle-wheel" x="750" y="510"/>
  </g>

  <!-- Far/Right Crank, Pedal & Foot (Behind Bike Frame) -->
  <g class="anim-crank">
    <!-- Right Crank Arm (180 deg offset from left arm) -->
    <line x1="495" y1="510" x2="455" y2="480" stroke="#adb5bd" stroke-width="8" stroke-linecap="round"/>
    <circle cx="455" cy="480" r="5" fill="#495057"/>
  </g>
  <!-- Right Pedal with Counter-Rotation to stay horizontal -->
  <g class="anim-pedal-right">
    <rect x="439" y="476" width="32" height="8" rx="3" fill="#212529" stroke="#ffb703" stroke-width="1.5"/>
  </g>

  <!-- Far/Right Pelican Leg (Subdued tint for depth) -->
  <!-- Thigh -->
  <g class="anim-thigh-right">
    <line x1="470" y1="335" x2="468" y2="428" stroke="#87674f" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- Shin -->
  <g class="anim-shin-right">
    <line x1="468" y1="428" x2="455" y2="480" stroke="#e07a10" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- Foot / Webbing -->
  <g class="anim-foot-right">
    <polygon points="455,480 435,472 425,483 452,488" fill="#bc5800"/>
    <path d="M435 472 Q 430 478, 425 483" stroke="#944300" stroke-width="1" fill="none"/>
  </g>

  <!-- ==================== BICYCLE FRAMEWORK ==================== -->
  <g id="bicycle-chassis">
    <!-- Rear Dropouts -->
    <circle cx="260" cy="510" r="8" fill="#343a40"/>

    <!-- Chain (Rear Sprocket to Chainring) -->
    <path d="M260 500 L 495 496 A 24 24 0 0 1 505 528 L 260 520 Z" fill="none" stroke="#6c757d" stroke-width="4" stroke-dasharray="7 3"/>
    <!-- Chain Guard / Rear Stays (Chainstay & Seatstay) -->
    <line x1="260" y1="510" x2="495" y2="510" stroke="#004d54" stroke-width="9" stroke-linecap="round"/> <!-- Chainstay -->
    <line x1="260" y1="510" x2="425" y2="340" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/> <!-- Seatstay -->

    <!-- Main Diamond Frame Triangle -->
    <!-- Seat Tube -->
    <line x1="425" y1="340" x2="495" y2="510" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Down Tube -->
    <line x1="495" y1="510" x2="685" y2="310" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Top Tube -->
    <line x1="425" y1="340" x2="680" y2="315" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Front Fork & Head Tube -->
    <!-- Head Tube -->
    <line x1="680" y1="305" x2="690" y2="345" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Fork Blades down to Front Axle -->
    <line x1="688" y1="335" x2="750" y2="510" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="750" cy="510" r="8" fill="#343a40"/>

    <!-- Handlebar Stem & Handlebars -->
    <line x1="680" y1="305" x2="672" y2="250" stroke="#adb5bd" stroke-width="8" stroke-linecap="round"/>
    <!-- Swept Cruiser Handlebars -->
    <path d="M672 250 Q 665 240, 645 240 L 610 248" fill="none" stroke="#ced4da" stroke-width="7" stroke-linecap="round"/>
    <!-- Rubber Handgrip -->
    <line x1="618" y1="246" x2="602" y2="250" stroke="#212529" stroke-width="10" stroke-linecap="round"/>
    <!-- Brass Bell on Handlebars -->
    <circle cx="658" cy="235" r="7.5" fill="#ffb703" stroke="#d47a00" stroke-width="1.5"/>

    <!-- Seat Post & Cruiser Saddle -->
    <line x1="425" y1="340" x2="415" y2="295" stroke="#adb5bd" stroke-width="8" stroke-linecap="round"/>
    <!-- Vintage Leather Saddle -->
    <path d="M375 292 Q 410 285, 450 292 Q 460 295, 455 305 Q 430 305, 385 303 Q 370 302, 375 292 Z" fill="#582f0e" stroke="#371d06" stroke-width="2"/>
    <!-- Saddle Chrome Springs -->
    <circle cx="390" cy="305" r="4.5" fill="none" stroke="#adb5bd" stroke-width="2.5"/>
    <circle cx="402" cy="305" r="4.5" fill="none" stroke="#adb5bd" stroke-width="2.5"/>

    <!-- Bottom Bracket & Front Chainring (Centered at 495, 510) -->
    <circle cx="495" cy="510" r="28" fill="#343a40" stroke="#adb5bd" stroke-width="3"/>
    <circle cx="495" cy="510" r="22" fill="#495057"/>
    <!-- Sprocket teeth styling -->
    <circle cx="495" cy="510" r="26" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- ==================== PELICAN CHARACTER ==================== -->
  <g class="anim-pelican-torso">
    <!-- Tail Feathers -->
    <path d="M355 305 Q 330 300, 310 320 Q 335 328, 360 325 Z" fill="#4a3728"/>
    <path d="M360 315 Q 335 315, 320 335 Q 345 338, 368 330 Z" fill="#6c533e"/>

    <!-- Pelican Body / Torso (California Brown Pelican Colors: rich warm browns and heather greys) -->
    <path d="M365 315 Q 350 280, 390 260 Q 440 240, 480 270 Q 520 300, 490 355 Q 450 375, 400 365 Q 370 355, 365 315 Z" fill="#5c4433"/>
    <!-- Wing Feathers / Shading -->
    <path d="M375 310 Q 425 285, 485 320 Q 470 355, 410 355 Q 380 345, 375 310 Z" fill="#7a5c45" stroke="#4a3728" stroke-width="1.5"/>
    <!-- Feather layer details -->
    <path d="M395 320 C 430 310, 460 330, 475 340" fill="none" stroke="#9c7a5b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M385 332 C 415 325, 445 340, 460 350" fill="none" stroke="#9c7a5b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- S-Curved Neck (Upper white/buff neck, chestnut hindneck of California Brown Pelican breeding plumage) -->
    <!-- Dark Chestnut Hindneck -->
    <path d="M465 265 Q 490 200, 520 180 Q 545 165, 560 168 Q 550 185, 525 210 Q 500 245, 485 275 Z" fill="#402416"/>
    <!-- Silky White/Cream Front Foreneck -->
    <path d="M485 275 Q 515 220, 545 190 Q 568 170, 580 178 Q 555 210, 530 250 Q 508 285, 485 275 Z" fill="#fdfbf7"/>

    <!-- Pelican Head (Golden-Yellow Crown / White Crest) -->
    <path d="M555 170 Q 565 142, 595 146 Q 625 150, 630 175 Q 615 190, 575 185 Z" fill="#ffea75"/>
    <!-- White crest highlights around eye -->
    <path d="M575 170 Q 590 155, 615 158 Q 622 170, 605 180 Z" fill="#ffffff"/>

    <!-- Eye & Sclera -->
    <circle cx="602" cy="166" r="6" fill="#f8f9fa"/>
    <circle cx="603" cy="166" r="3.5" fill="#212529"/>
    <circle cx="604" cy="164.5" r="1.2" fill="#ffffff"/> <!-- Catchlight -->
    <path d="M594 163 Q 603 158, 612 162" fill="none" stroke="#c97a3e" stroke-width="1.5"/>

    <!-- Enormous Pelican Beak & Gular Pouch -->
    <!-- Stretched Lower Gular Throat Pouch -->
    <g class="anim-pouch">
      <path d="M620 183 Q 650 250, 715 220 Q 770 200, 805 192 L 632 186 Z" fill="url(#pouchGrad)"/>
      <path d="M640 195 Q 670 238, 725 215" fill="none" stroke="#d62828" stroke-width="1.2" opacity="0.6"/>
      <path d="M660 195 Q 690 230, 745 208" fill="none" stroke="#d62828" stroke-width="1.2" opacity="0.6"/>
    </g>

    <!-- Upper Beak Maxilla with Hooked Tip -->
    <path d="M610 172 L 805 188 Q 820 190, 822 196 Q 815 202, 805 194 L 620 183 Z" fill="url(#beakGrad)" stroke="#b25e00" stroke-width="1.2"/>
    <!-- Lateral beak groove -->
    <line x1="620" y1="178" x2="805" y2="191" stroke="#8a3b00" stroke-width="1.5"/>

    <!-- Hip joint cover feather -->
    <ellipse cx="468" cy="330" rx="20" ry="15" fill="#4a3728"/>

    <!-- Cyclist Wing/Arm reaching comfortably to handlebars -->
    <!-- Wing shoulder/forearm -->
    <path d="M440 280 Q 520 270, 560 260 Q 585 255, 608 252" fill="none" stroke="#5c4433" stroke-width="16" stroke-linecap="round"/>
    <path d="M440 280 Q 520 270, 560 260 Q 585 255, 608 252" fill="none" stroke="#7a5c45" stroke-width="11" stroke-linecap="round"/>
    <!-- Wing Feathers clasping bicycle handlebar -->
    <path d="M595 245 Q 615 248, 618 258 Q 605 264, 595 258 Z" fill="#3d2a1d"/>
    <path d="M602 244 Q 622 248, 624 257" stroke="#2b1d14" stroke-width="2"/>

    <!-- Pelican Cycling Cap (Stylish touch) -->
    <path d="M575 158 Q 595 138, 622 148 Q 632 158, 628 168 Z" fill="url(#capGrad)"/>
    <!-- Cap Visor flipped upward -->
    <path d="M625 152 Q 646 142, 652 148 Q 638 160, 626 158 Z" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
    <line x1="585" y1="152" x2="620" y2="162" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- ==================== FOREGROUND: NEAR/LEFT LEG, CRANK & PEDAL ==================== -->

  <!-- Near/Left Pelican Leg (Full articulation with hip, knee, ankle, foot) -->
  <!-- Thigh (Rotates around hip at 470, 335) -->
  <g class="anim-thigh-left">
    <line x1="470" y1="335" x2="498" y2="438" stroke="#a37853" stroke-width="18" stroke-linecap="round"/>
    <!-- Knee Joint highlight -->
    <circle cx="498" cy="438" r="9" fill="#8a613e"/>
  </g>

  <!-- Shin (Connected at knee 498, 438 down to pedal spindle 535, 540) -->
  <g class="anim-shin-left">
    <line x1="498" y1="438" x2="535" y2="540" stroke="#f77f00" stroke-width="8.5" stroke-linecap="round"/>
  </g>

  <!-- Near Crank Arm (Phase: Forward-Downwards / 0 deg) -->
  <g class="anim-crank">
    <line x1="495" y1="510" x2="535" y2="540" stroke="#ced4da" stroke-width="9" stroke-linecap="round"/>
    <circle cx="535" cy="540" r="5" fill="#343a40"/>
  </g>

  <!-- Near Pedal Assembly (Counter-rotates to stay level under foot) -->
  <g class="anim-pedal-left">
    <rect x="519" y="536" width="34" height="8" rx="3.5" fill="#212529" stroke="#ffb703" stroke-width="1.5"/>
    <!-- Pedal reflector -->
    <rect x="526" y="538" width="18" height="4" rx="1.5" fill="#fcbf49"/>
  </g>

  <!-- Webbed Foot firmly planted on Left Pedal (Counter-rotates with natural ankle flexion) -->
  <g class="anim-foot-left">
    <!-- Webbed pelican foot gripping pedal -->
    <polygon points="535,540 575,532 585,544 532,548" fill="#f77f00" stroke="#d62828" stroke-width="1"/>
    <!-- Webbing segment lines -->
    <line x1="535" y1="540" x2="575" y2="533" stroke="#b25e00" stroke-width="1.8"/>
    <line x1="535" y1="542" x2="583" y2="540" stroke="#b25e00" stroke-width="1.8"/>
    <line x1="535" y1="544" x2="576" y2="546" stroke="#b25e00" stroke-width="1.8"/>
    <path d="M575 533 Q 582 538, 584 544" fill="none" stroke="#c05c00" stroke-width="1.5"/>
  </g>

  <!-- Central Bottom Bracket Axle Cap -->
  <circle cx="495" cy="510" r="10" fill="#212529"/>
  <circle cx="495" cy="510" r="4.5" fill="#adb5bd"/>

  <!-- Speed Dust / Breeze Particles Behind Rear Wheel -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="210" cy="590" r="3.5">
      <animate attributeName="cx" values="240;120" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="595;585" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="605" r="2.5">
      <animate attributeName="cx" values="230;100" dur="0.45s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="608;600" dur="0.45s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="0.45s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>