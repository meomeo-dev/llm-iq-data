<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8f2"/>
      <stop offset="1" stop-color="#fbeed2"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8672"/>
      <stop offset="0.55" stop-color="#7a6654"/>
      <stop offset="1" stop-color="#4f4036"/>
    </linearGradient>
    <g id="wheel">
      <circle r="78" fill="none" stroke="#25252a" stroke-width="6"/>
      <circle r="73" fill="none" stroke="#c6c9cf" stroke-width="2.5"/>
      <path d="M-74 0H74 M-68.37 -28.32L68.37 28.32 M-52.33 -52.33L52.33 52.33 M-28.32 -68.37L28.32 68.37 M0 -74V74 M-28.32 68.37L28.32 -68.37 M-52.33 52.33L52.33 -52.33 M-68.37 28.32L68.37 -28.32" stroke="#9a9da4" stroke-width="1.1" fill="none"/>
      <circle cx="0" cy="-66" r="3.5" fill="#ff7a1a"/>
      <circle cx="0" cy="66" r="3.5" fill="#ffd23a"/>
      <circle r="8" fill="#7d8087"/>
      <circle r="3" fill="#3a3a40"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="665" cy="105" r="34" fill="#ffd76a"/>
  <g fill="#ffffff" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="24s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="85" rx="48" ry="14"/>
    <ellipse cx="185" cy="73" rx="34" ry="14"/>
    <ellipse cx="500" cy="150" rx="42" ry="11"/>
    <ellipse cx="530" cy="140" rx="28" ry="11"/>
  </g>
  <rect x="0" y="300" width="800" height="130" fill="#4a9ec4"/>
  <rect x="0" y="300" width="800" height="7" fill="#9fd5e8"/>
  <g stroke="#bfe6f2" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M60 330H110M190 350H260M330 322H380M600 340H670M720 318H770M470 360H530"/>
  </g>
  <rect x="0" y="430" width="800" height="70" fill="#7f8087"/>
  <rect x="0" y="430" width="800" height="4" fill="#5e5f65"/>
  <line x1="-260" y1="470" x2="1060" y2="470" stroke="#f4efe0" stroke-width="5" stroke-dasharray="60 191.5">
    <animate attributeName="stroke-dashoffset" from="0" to="251.5" dur="0.75s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="434" rx="200" ry="7" fill="#000000" opacity="0.22"/>

  <!-- Wheels -->
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
    </g>
  </g>

  <!-- Far crank and pedal -->
  <g transform="translate(390,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-35" y2="0" stroke="#55585e" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3s" repeatCount="indefinite"/>
          <rect x="-10" y="-1" width="20" height="4" rx="1.5" fill="#222226"/>
          <circle r="2.5" fill="#888"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Far leg -->
  <g transform="translate(358,246)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="3s" repeatCount="indefinite" values="-43.05;-53.9;-67.75;-79.8;-83.2;-76.97;-64.8;-49.95;-36.4;-29.8;-30.7;-35.4;-43.05"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#2b2a2f" stroke-width="8" stroke-linecap="round"/>
      <g transform="translate(0,80)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="3s" repeatCount="indefinite" values="89.1;105.8;115.9;115.6;105.2;88.2;68.6;49.2;35;35.4;49.9;69.4;89.1"/>
          <circle r="4.5" fill="#2b2a2f"/>
          <line x1="0" y1="0" x2="0" y2="80" stroke="#2b2a2f" stroke-width="6" stroke-linecap="round"/>
          <g transform="translate(0,80)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="3s" repeatCount="indefinite" values="-46.05;-51.9;-48.15;-35.8;-22;-11.2;-3.8;0.75;1.4;-5.6;-19.2;-34;-46.05"/>
              <path d="M-5 -6 L4 -7 L20 0 L14 1 L-5 1 Z" fill="#2b2a2f"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Frame -->
  <g fill="none" stroke="#1b7f8c" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="350" x2="390" y2="360" stroke-width="5"/>
    <line x1="250" y1="350" x2="352" y2="268" stroke-width="4"/>
    <line x1="390" y1="360" x2="352" y2="268" stroke-width="6"/>
    <line x1="352" y1="268" x2="507" y2="262" stroke-width="6"/>
    <line x1="390" y1="360" x2="516" y2="292" stroke-width="7"/>
    <line x1="505" y1="258" x2="520" y2="298" stroke-width="9"/>
    <line x1="520" y1="298" x2="550" y2="350" stroke-width="5"/>
  </g>
  <!-- Seatpost and saddle -->
  <line x1="352" y1="268" x2="350" y2="254" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M320 252 Q330 247 352 250 L384 252 Q394 254 384 259 Q352 263 326 259 Q316 256 320 252 Z" fill="#2a2a2e"/>
  <!-- Stem and handlebar -->
  <line x1="505" y1="258" x2="499" y2="237" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M497 236 H530 Q550 236 548 256 Q546 266 536 262" fill="none" stroke="#2a2a2e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chain -->
  <path d="M250 338 L390 336" fill="none" stroke="#2f2f33" stroke-width="2.5" stroke-dasharray="4 2.8545">
    <animate attributeName="stroke-dashoffset" from="0" to="-150.8" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M386 384 L248 362" fill="none" stroke="#2f2f33" stroke-width="2.5" stroke-dasharray="4 2.8545">
    <animate attributeName="stroke-dashoffset" from="0" to="-150.8" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Rear cog -->
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <circle r="12" fill="none" stroke="#4d5056" stroke-width="4" stroke-dasharray="3.6 2.683"/>
      <circle r="9" fill="#8b8e94"/>
      <circle cx="6" cy="0" r="1.8" fill="#222"/>
    </g>
  </g>

  <!-- Chainring, near crank and pedal -->
  <g transform="translate(390,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
      <circle r="24" fill="none" stroke="#5d6066" stroke-width="4" stroke-dasharray="3.6 2.683"/>
      <circle r="19" fill="none" stroke="#a5a8ae" stroke-width="2"/>
      <path d="M0 0L18 0M0 0L5.56 17.12M0 0L-14.56 10.58M0 0L-14.56 -10.58M0 0L5.56 -17.12" stroke="#a5a8ae" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#9a9da4" stroke-width="6" stroke-linecap="round"/>
      <circle r="6" fill="#7d8087"/>
      <g transform="translate(35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3s" repeatCount="indefinite"/>
          <rect x="-10" y="-1" width="20" height="4" rx="1.5" fill="#333338"/>
          <circle r="2.5" fill="#bbb"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Near leg -->
  <g transform="translate(358,246)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="3s" repeatCount="indefinite" values="-64.8;-49.95;-36.4;-29.8;-30.7;-35.4;-43.05;-53.9;-67.75;-79.8;-83.2;-76.97;-64.8"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#3b383d" stroke-width="8" stroke-linecap="round"/>
      <g transform="translate(0,80)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="3s" repeatCount="indefinite" values="68.6;49.2;35;35.4;49.9;69.4;89.1;105.8;115.9;115.6;105.2;88.2;68.6"/>
          <circle r="4.5" fill="#3b383d"/>
          <line x1="0" y1="0" x2="0" y2="80" stroke="#3b383d" stroke-width="6" stroke-linecap="round"/>
          <g transform="translate(0,80)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="3s" repeatCount="indefinite" values="-3.8;0.75;1.4;-5.6;-19.2;-34;-46.05;-51.9;-48.15;-35.8;-22;-11.2;-3.8"/>
              <path d="M-5 -6 L4 -7 L20 0 L14 1 L-5 1 Z" fill="#3b383d"/>
              <path d="M4 -6 L18 0 M9 -5 L17 1" stroke="#1e1c20" stroke-width="1" fill="none"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Tail -->
  <path d="M304 206 L262 222 L264 236 L306 231 Z" fill="#4a3b30" stroke="#33281f" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M296 214 L266 226 M298 222 L268 232" stroke="#33281f" stroke-width="1.2" fill="none"/>

  <!-- Neck and head (gentle bob) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -2.5;0 0" dur="1.5s" repeatCount="indefinite"/>
    <path d="M385 205 C420 202 404 166 426 147" fill="none" stroke="#f3efe6" stroke-width="19" stroke-linecap="round"/>
    <path d="M377 198 C410 192 395 160 417 142" fill="none" stroke="#5b3b29" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Body -->
  <g transform="rotate(8 352 216)">
    <ellipse cx="352" cy="216" rx="58" ry="33" fill="url(#bodyGrad)" stroke="#3f3228" stroke-width="2"/>
    <path d="M320 200 Q340 194 362 200 M315 214 Q338 208 366 214" stroke="#a89682" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Head details (bobbing with neck) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -2.5;0 0" dur="1.5s" repeatCount="indefinite"/>
    <path d="M452 148 Q488 186 536 165 L541 164 L452 151 Z" fill="#8d7f5e" stroke="#5a4e38" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M450 133 Q490 138 541 158 Q547 162 541 165 L452 148 Z" fill="#c4b38c" stroke="#6e5e46" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M531 155 L541 158 Q547 162 541 165 L533 163 Z" fill="#c2552d"/>
    <ellipse cx="440" cy="140" rx="18" ry="14" fill="#f6f3ea" stroke="#6e5e46" stroke-width="1"/>
    <path d="M424 136 Q438 122 458 134 Q440 130 424 136 Z" fill="#ecce62"/>
    <ellipse cx="438" cy="132" rx="13" ry="6" fill="#efd36c" opacity="0.9"/>
    <circle cx="446" cy="138" r="3" fill="#1c1410"/>
    <circle cx="447" cy="137" r="1" fill="#ffffff"/>
  </g>

  <!-- Wing reaching to handlebar -->
  <path d="M368 192 C410 186 470 208 506 224 L534 230 L537 241 C500 245 470 241 440 237 C410 237 385 233 368 222 Z" fill="#6a5443" stroke="#3f3027" stroke-width="2" stroke-linejoin="round"/>
  <path d="M372 197 C410 192 450 206 482 219 C440 215 405 215 372 214 Z" fill="#8f7a66"/>
  <path d="M500 226 L516 238 M486 224 L504 240 M470 220 L490 239" stroke="#3f3027" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="531" cy="236" r="5" fill="#2a2a2e"/>
</svg>