<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5d8f7"/>
      <stop offset="65%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Ocean/Coastal gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Pelican Pouch gradient -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Metallic Frame gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Spoked Wheel Definition (Radius ~80, center at 0,0) -->
    <g id="spoked-wheel">
      <!-- Outer Tire & Rim -->
      <circle cx="0" cy="0" r="82" fill="none" stroke="#27272a" stroke-width="14"/>
      <circle cx="0" cy="0" r="75" fill="none" stroke="#e4e4e7" stroke-width="4"/>
      <circle cx="0" cy="0" r="73" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>

      <!-- Spokes (16 spokes: 8 diametric lines) -->
      <g stroke="#d4d4d8" stroke-width="1.5" opacity="0.85">
        <line x1="-73" y1="0" x2="73" y2="0"/>
        <line x1="0" y1="-73" x2="0" y2="73"/>
        <line x1="-51.6" y1="-51.6" x2="51.6" y2="51.6"/>
        <line x1="-51.6" y1="51.6" x2="51.6" y2="-51.6"/>
        <line x1="-67.4" y1="-27.9" x2="67.4" y2="27.9"/>
        <line x1="-27.9" y1="-67.4" x2="27.9" y2="67.4"/>
        <line x1="-67.4" y1="27.9" x2="67.4" y2="-27.9"/>
        <line x1="-27.9" y1="67.4" x2="27.9" y2="-67.4"/>
      </g>

      <!-- Center Hub -->
      <circle cx="0" cy="0" r="13" fill="#52525b" stroke="#27272a" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#f4f4f5"/>
    </g>

    <style><![CDATA[
      /* Wheel rotations: 1.2s continuous clockwise */
      .wheel-spin-rear {
        transform-origin: 260px 480px;
        animation: spin 1.2s linear infinite;
      }
      .wheel-spin-front {
        transform-origin: 640px 480px;
        animation: spin 1.2s linear infinite;
      }

      /* Crank set rotation around Bottom Bracket (450px, 480px) */
      .crank-assembly {
        transform-origin: 450px 480px;
        animation: spin 1.2s linear infinite;
      }

      /* Counter-rotations for pedals to keep them horizontal */
      .pedal-counter-right {
        transform-origin: 450px 432px;
        animation: counter-spin 1.2s linear infinite;
      }
      .pedal-counter-left {
        transform-origin: 450px 528px;
        animation: counter-spin 1.2s linear infinite;
      }

      /* Leg animations synchronized with 1.2s crank rotation */
      /* Right leg (Starts pointing UP towards 12 o'clock, y=432) */
      .right-thigh-anim {
        transform-origin: 405px 335px; /* Hip joint */
        animation: rightThighMotion 1.2s ease-in-out infinite;
      }
      .right-shank-anim {
        transform-origin: 432px 388px; /* Knee joint */
        animation: rightShankMotion 1.2s ease-in-out infinite;
      }

      /* Left leg (Starts pointing DOWN towards 6 o'clock, y=528) */
      .left-thigh-anim {
        transform-origin: 395px 330px; /* Hip joint */
        animation: leftThighMotion 1.2s ease-in-out infinite;
      }
      .left-shank-anim {
        transform-origin: 422px 425px; /* Knee joint */
        animation: leftShankMotion 1.2s ease-in-out infinite;
      }

      /* Subtle riding bounce for pelican's body and pouch */
      .body-bob {
        animation: pelicanBob 0.6s ease-in-out infinite alternate;
      }

      /* Ground dashed line movement to enhance sense of riding speed */
      .ground-flow {
        animation: groundMove 0.6s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes counter-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }

      /* Synchronized thigh rotations relative to hip */
      @keyframes rightThighMotion {
        0%   { transform: rotate(-18deg); } /* pedal at TOP */
        25%  { transform: rotate(-5deg);  } /* pedal moving forward */
        50%  { transform: rotate(15deg);  } /* pedal at BOTTOM */
        75%  { transform: rotate(2deg);   } /* pedal pulling back up */
        100% { transform: rotate(-18deg); }
      }
      @keyframes rightShankMotion {
        0%   { transform: rotate(-14deg); }
        25%  { transform: rotate(18deg); }
        50%  { transform: rotate(3deg); }
        75%  { transform: rotate(-22deg); }
        100% { transform: rotate(-14deg); }
      }

      @keyframes leftThighMotion {
        0%   { transform: rotate(15deg);  } /* pedal at BOTTOM */
        25%  { transform: rotate(2deg);   } /* pedal pulling up */
        50%  { transform: rotate(-18deg); } /* pedal at TOP */
        75%  { transform: rotate(-5deg);  } /* pedal moving down */
        100% { transform: rotate(15deg);  }
      }
      @keyframes leftShankMotion {
        0%   { transform: rotate(3deg); }
        25%  { transform: rotate(-22deg); }
        50%  { transform: rotate(-14deg); }
        75%  { transform: rotate(18deg); }
        100% { transform: rotate(3deg); }
      }

      @keyframes pelicanBob {
        0%   { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-3.5px) rotate(-0.5deg); }
      }

      @keyframes groundMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -80; }
      }
    ]]></style>
  </defs>

  <!-- Sky and Coastal Scenery Background -->
  <rect x="0" y="0" width="900" height="650" fill="url(#skyGrad)"/>
  <circle cx="810" cy="110" r="55" fill="#fde047" opacity="0.6"/>

  <!-- Distant Ocean & Dunes -->
  <path d="M0 450 Q 220 440 450 448 T 900 445 L 900 570 L 0 570 Z" fill="url(#waterGrad)" opacity="0.4"/>
  <path d="M0 480 Q 300 460 600 475 T 900 470 L 900 650 L 0 650 Z" fill="#e2e8f0"/>

  <!-- Bike Path / Ground -->
  <rect x="0" y="555" width="900" height="95" fill="#64748b"/>
  <line x1="0" y1="558" x2="900" y2="558" stroke="#cbd5e1" stroke-width="4"/>
  <!-- Animated road marks for speed illusion -->
  <line x1="0" y1="605" x2="900" y2="605" stroke="#f1f5f9" stroke-width="5" stroke-dasharray="45 35" class="ground-flow"/>

  <!-- ==================== BICYCLE LAYER ==================== -->
  <g id="bicycle-and-rider">

    <!-- REAR WHEEL (Center: 260, 480) -->
    <g class="wheel-spin-rear">
      <use href="#spoked-wheel" x="260" y="480"/>
    </g>

    <!-- FRONT WHEEL (Center: 640, 480) -->
    <g class="wheel-spin-front">
      <use href="#spoked-wheel" x="640" y="480"/>
    </g>

    <!-- BICYCLE FRAMEWORK -->
    <!-- Rear Dropouts to Seat and Bottom Bracket -->
    <g stroke="url(#frameGrad)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Chain Stay: Rear Hub (260,480) -> BB (450,480) -->
      <line x1="260" y1="480" x2="450" y2="480" stroke-width="12"/>

      <!-- Seat Stay: Rear Hub (260,480) -> Seat Lug (380,330) -->
      <line x1="260" y1="480" x2="380" y2="330" stroke-width="11"/>

      <!-- Seat Tube: BB (450,480) -> Seat Lug (380,330) -->
      <line x1="450" y1="480" x2="380" y2="330" stroke-width="14"/>

      <!-- Down Tube: BB (450,480) -> Head Tube Lower (580,340) -->
      <line x1="450" y1="480" x2="580" y2="340" stroke-width="14"/>

      <!-- Top Tube: Seat Lug (380,330) -> Head Tube Upper (570,300) -->
      <line x1="380" y1="330" x2="570" y2="300" stroke-width="12"/>

      <!-- Head Tube -->
      <line x1="580" y1="345" x2="568" y2="290" stroke-width="15" stroke="#991b1b"/>

      <!-- Front Fork: Head Tube Base (580,340) -> Front Hub (640,480) -->
      <line x1="580" y1="340" x2="640" y2="480" stroke-width="12" stroke="#dc2626"/>
    </g>

    <!-- Drive Chain (Simplified loop) -->
    <path d="M 260 472 L 450 464 A 18 18 0 0 1 450 496 L 260 488 Z" fill="none" stroke="#475569" stroke-width="4.5" stroke-dasharray="7 3"/>

    <!-- Saddle Post and Saddle -->
    <line x1="380" y1="330" x2="370" y2="295" stroke="#94a3b8" stroke-width="11" stroke-linecap="round"/>
    <!-- Sleek ergonomic leather bicycle seat -->
    <path d="M 330 295 C 345 287, 395 287, 408 298 C 402 305, 385 306, 370 304 C 352 304, 340 307, 330 295 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>

    <!-- Handlebar Stem & Touring / Cruiser Handlebar -->
    <!-- Quill Stem -->
    <path d="M 570 295 L 565 245 L 585 245" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Swept-back handlebar curve -->
    <path d="M 595 250 C 585 240, 560 235, 540 248 L 532 255" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <!-- Handlebar Grip -->
    <line x1="540" y1="248" x2="526" y2="258" stroke="#1e293b" stroke-width="11" stroke-linecap="round"/>

    <!-- ==================== LEFT LEG (Far Side Behind Frame) ==================== -->
    <g id="left-leg">
      <!-- Left Thigh group pivoting at Hip (395, 330) -->
      <g class="left-thigh-anim">
        <path d="M 395 330 L 422 425" stroke="#57534e" stroke-width="16" stroke-linecap="round"/>
        <!-- Left Shank & Webbed Foot pivoting at Knee (422, 425) -->
        <g class="left-shank-anim">
          <path d="M 422 425 L 450 528" stroke="#d97706" stroke-width="9" stroke-linecap="round"/>
          <!-- Pelican Left Webbed Foot on Far Pedal -->
          <path d="M 450 528 Q 470 528 478 533 L 442 533 Z" fill="#b45309"/>
        </g>
      </g>
    </g>

    <!-- ==================== CRANKSET & PEDALS ==================== -->
    <!-- Center BB at (450, 480), Crank arm length = 48px -->
    <!-- Front chainring sprocket -->
    <circle cx="450" cy="480" r="24" fill="#64748b" stroke="#334155" stroke-width="3"/>
    <circle cx="450" cy="480" r="16" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>

    <!-- Revolving Crank Assembly -->
    <g class="crank-assembly">
      <!-- Left Crank Arm (starts pointing DOWN to 6 o'clock: y=528) -->
      <line x1="450" y1="480" x2="450" y2="528" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
      <circle cx="450" cy="528" r="5" fill="#334155"/>

      <!-- Right Crank Arm (starts pointing UP to 12 o'clock: y=432) -->
      <line x1="450" y1="480" x2="450" y2="432" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
      <circle cx="450" cy="432" r="5" fill="#475569"/>

      <!-- Left Pedal (Counter-rotating to stay upright) -->
      <g class="pedal-counter-left">
        <rect x="435" y="524" width="30" height="7" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
      </g>

      <!-- Right Pedal (Counter-rotating to stay upright) -->
      <g class="pedal-counter-right">
        <rect x="435" y="428" width="30" height="8" rx="3" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
        <line x1="439" y1="432" x2="461" y2="432" stroke="#f59e0b" stroke-width="2"/>
      </g>
    </g>
    <!-- Bottom bracket cap -->
    <circle cx="450" cy="480" r="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>

    <!-- ==================== CALIFORNIA BROWN PELICAN BODY ==================== -->
    <g class="body-bob">
      <!-- Tail feathers tucked back behind saddle -->
      <path d="M 330 310 C 300 320, 280 340, 290 355 C 310 355, 335 340, 350 325 Z" fill="#44403c" stroke="#292524" stroke-width="2"/>

      <!-- Pelican Torso / Wing (Characteristic California Brown Pelican mottled brown & slate) -->
      <!-- Main Body Core -->
      <ellipse cx="400" cy="300" rx="68" ry="46" fill="#78716c" transform="rotate(-15 400 300)"/>

      <!-- Feather Layering & Folded Primary Wing -->
      <path d="M 350 280 C 375 255, 450 265, 460 305 C 440 340, 380 365, 340 330 C 330 310, 335 295, 350 280 Z" fill="#57534e"/>
      <!-- Wing speculum & bars (silver-grey streak typical of adult brown pelican) -->
      <path d="M 370 290 Q 425 290 445 325 Q 400 335 365 315 Z" fill="#a8a29e" opacity="0.85"/>
      <path d="M 360 300 C 385 305, 415 320, 435 340" fill="none" stroke="#292524" stroke-width="3" stroke-linecap="round"/>

      <!-- Pelican S-Curved Neck -->
      <!-- Hindneck: rich dark chestnut brown characteristic of breeding California brown pelican -->
      <path d="M 445 285 C 475 260, 485 200, 465 170 C 475 160, 495 195, 485 245 C 480 270, 465 295, 445 310 Z" fill="#451a03"/>
      <!-- Foreneck: crisp white / cream stripe running down front -->
      <path d="M 445 270 C 470 235, 475 180, 460 162 C 450 160, 445 175, 455 210 C 460 235, 450 260, 435 275 Z" fill="#fef08a"/>

      <!-- Pelican Head & Crown -->
      <!-- Pale yellow/straw colored crown of Pacific Brown Pelican -->
      <ellipse cx="468" cy="148" rx="26" ry="19" fill="#fef08a" transform="rotate(-5 468 148)"/>
      <path d="M 450 152 Q 440 168 455 175 Q 470 172 474 158 Z" fill="#78350f"/>

      <!-- Eye surround & Bright Blue/Dark Eye -->
      <circle cx="476" cy="145" r="7" fill="#fed7aa"/>
      <circle cx="477" cy="145" r="4" fill="#0284c7"/>
      <circle cx="478" cy="144" r="1.8" fill="#09090b"/>
      <circle cx="479" cy="143" r="0.8" fill="#ffffff"/>

      <!-- Huge Pelican Beak and Distensible Throat Gular Pouch -->
      <!-- Bill Upper Mandible (Long, horn/grey with hooked tip) -->
      <path d="M 485 142 L 620 175 C 632 178, 634 186, 626 189 L 485 162 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
      <!-- Hooked maxillary unguis nail at bill tip -->
      <path d="M 622 175 Q 634 179 628 190 Q 620 184 620 175 Z" fill="#dc2626"/>

      <!-- Characteristic Giant Gular Pouch -->
      <path d="M 486 163 Q 545 235 605 184 L 485 162 Z" fill="url(#pouchGrad)" stroke="#c2410c" stroke-width="1.5"/>
      <!-- Pouch vascular lines / striations -->
      <path d="M 505 168 Q 540 212 580 182" fill="none" stroke="#ea580c" stroke-width="1.2" opacity="0.6"/>
      <path d="M 520 170 Q 550 205 568 180" fill="none" stroke="#ea580c" stroke-width="1.2" opacity="0.6"/>

      <!-- Pelican's Wing/Arm stretching comfortably down to Handlebar Grip (532, 255) -->
      <path d="M 440 295 C 470 280, 500 270, 528 256" fill="none" stroke="#57534e" stroke-width="20" stroke-linecap="round"/>
      <path d="M 440 295 C 470 280, 500 270, 528 256" fill="none" stroke="#a8a29e" stroke-width="10" stroke-linecap="round"/>
      <!-- Wingtips gripping the handlebar -->
      <path d="M 522 252 Q 536 248 534 263 Q 520 265 522 252 Z" fill="#292524"/>

      <!-- Stylish Coastal Biker Cap / Visor for whimsical charm -->
      <path d="M 452 136 C 465 125, 485 125, 495 135 L 522 137 C 525 142, 515 146, 500 144 L 452 136 Z" fill="#0284c7"/>
      <ellipse cx="475" cy="134" rx="19" ry="6" fill="#38bdf8"/>
    </g> <!-- end body-bob -->

    <!-- ==================== RIGHT LEG (Near Side Foreground) ==================== -->
    <g id="right-leg">
      <!-- Right Thigh group pivoting at Hip (405, 335) -->
      <g class="right-thigh-anim">
        <!-- Muscular upper leg -->
        <path d="M 405 335 L 432 388" stroke="#78716c" stroke-width="20" stroke-linecap="round"/>
        <path d="M 405 335 L 432 388" stroke="#57534e" stroke-width="14" stroke-linecap="round"/>

        <!-- Right Shank & Webbed Foot pivoting at Knee (432, 388) -->
        <g class="right-shank-anim">
          <!-- Tarsus / lower leg -->
          <path d="M 432 388 L 450 432" stroke="#f59e0b" stroke-width="11" stroke-linecap="round"/>
          <circle cx="432" cy="388" r="7" fill="#a8a29e"/>

          <!-- Pelican Big Webbed Foot gripping the near pedal -->
          <!-- Foot ankle and 3 distinct totipalmate webbed toes -->
          <path d="M 444 430 L 476 432 C 478 436, 474 440, 468 440 L 438 436 Z" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
          <path d="M 444 429 L 472 426 L 474 433 Z" fill="#f59e0b"/>
          <!-- Toes claws on pedal -->
          <circle cx="476" cy="432" r="2.2" fill="#1c1917"/>
          <circle cx="472" cy="426" r="2" fill="#1c1917"/>
        </g>
      </g>
    </g>

  </g> <!-- end bicycle-and-rider -->

  <!-- Foreground decorative roadside coastal flora -->
  <path d="M 30 650 Q 45 590 70 580 Q 85 620 90 650 Z" fill="#65a30d" opacity="0.7"/>
  <path d="M 60 650 Q 80 570 115 575 Q 120 625 125 650 Z" fill="#4d7c0f" opacity="0.6"/>
  <path d="M 820 650 Q 835 585 860 575 Q 880 620 890 650 Z" fill="#65a30d" opacity="0.7"/>
</svg>