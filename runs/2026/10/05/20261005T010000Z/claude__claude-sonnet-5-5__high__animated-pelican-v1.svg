<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#e3f4fc"/>
    </linearGradient>
    <g id="wheelBody">
      <circle r="77" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#a9b0b8" stroke-width="3"/>
      <g stroke="#8a8f96" stroke-width="1.5" stroke-linecap="round">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#555" stroke="#333" stroke-width="2"/>
      <circle cx="0" cy="-68" r="3" fill="#e0332b"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#fff3b0" opacity="0.9"/>
  <path d="M0,390 Q120,320 240,380 T480,370 T720,375 T800,365 L800,480 L0,480 Z" fill="#a8d5a2"/>
  <rect x="0" y="414" width="800" height="66" fill="#c9b48a"/>
  <rect x="0" y="412" width="800" height="4" fill="#8a7650"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-210 0" dur="0.5s" repeatCount="indefinite"/>
    <g fill="#a38e66">
      <rect x="0" y="436" width="100" height="6"/>
      <rect x="210" y="436" width="100" height="6"/>
      <rect x="420" y="436" width="100" height="6"/>
      <rect x="630" y="436" width="100" height="6"/>
      <rect x="840" y="436" width="100" height="6"/>
      <rect x="1050" y="436" width="100" height="6"/>
    </g>
  </g>

  <!-- wheels -->
  <g transform="translate(250,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheelBody"/>
      <circle r="11" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="3 3"/>
    </g>
  </g>
  <g transform="translate(550,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheelBody"/>
    </g>
  </g>

  <!-- far crank + pedal -->
  <g transform="translate(390,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-45" y2="0" stroke="#444" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-45,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-12" y="-3.5" width="24" height="7" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2a241f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M335,258 L405,230 L422,308 L436,310">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="M335,258 L404,286 L345,340 L359,342;M335,258 L409,247 L358,308 L372,310;M335,258 L397,215 L390,295 L404,297;M335,258 L405,230 L422,308 L436,310;M335,258 L410,264 L435,340 L449,342;M335,258 L400,295 L422,372 L436,374;M335,258 L393,305 L390,385 L404,387;M335,258 L396,302 L358,372 L372,374;M335,258 L404,286 L345,340 L359,342"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250,330 L390,340"/>
    <path d="M250,330 L342,258"/>
    <path d="M390,340 L342,258"/>
    <path d="M342,258 L488,246"/>
    <path d="M390,340 L494,258"/>
    <path d="M487,240 L497,264"/>
    <path d="M497,264 L550,330"/>
  </g>
  <line x1="342" y1="258" x2="340" y2="246" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M312,242 Q336,236 362,242 L360,249 Q336,252 314,249 Z" fill="#2b2b2b"/>
  <g fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M487,240 L481,214"/>
    <path d="M481,214 L508,210 Q524,210 526,228"/>
  </g>
  <circle cx="550" cy="330" r="5" fill="#333"/>
  <circle cx="250" cy="330" r="5" fill="#333"/>

  <!-- chain -->
  <g stroke="#444" stroke-width="2.5" stroke-dasharray="8 6">
    <line x1="390" y1="316" x2="250" y2="320">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.15s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="340" x2="390" y2="364">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.15s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- pelican body -->
  <path d="M262,206 L205,234 L213,243 L270,235 Z" fill="#43372c"/>
  <ellipse cx="320" cy="212" rx="64" ry="40" fill="#76665a" transform="rotate(-8 320 212)"/>
  <path d="M345,190 Q372,205 365,232 Q340,245 300,238 Q330,225 345,190 Z" fill="#9a8a78" opacity="0.7"/>
  <path d="M355,200 Q392,190 385,160 Q378,140 408,134" fill="none" stroke="#4b3626" stroke-width="20" stroke-linecap="round"/>
  <path d="M358,200 Q395,190 388,160 Q382,142 410,137" fill="none" stroke="#f5f0e4" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="418" cy="127" rx="20" ry="15" fill="#f6f1e4"/>
  <ellipse cx="414" cy="115" rx="14" ry="7" fill="#f0d067"/>
  <path d="M398,122 Q402,138 410,140 Q400,136 396,128 Z" fill="#4b3626"/>
  <circle cx="425" cy="123" r="4" fill="#fff"/>
  <circle cx="426" cy="123" r="2.5" fill="#111"/>
  <path d="M436,134 L506,146 Q482,178 440,142 Z" fill="#b9a88a" stroke="#7d6e58" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M434,117 L512,139 Q515,146 507,147 L436,134 Z" fill="#8f8068" stroke="#6b5d48" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="510" cy="143" r="3" fill="#c2452f"/>

  <!-- wing reaching handlebar -->
  <path d="M345,198 Q420,204 505,206 L511,216 Q420,232 345,226 Z" fill="#5a4a3b" stroke="#3e3126" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#8a7864" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M370,208 Q420,212 470,210"/>
    <path d="M365,216 Q420,222 480,214"/>
  </g>
  <path d="M290,198 Q330,180 372,203 Q340,238 272,230 Z" fill="#5a4a3b" stroke="#3e3126" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#8a7864" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M300,205 Q330,195 356,206"/>
    <path d="M292,214 Q326,206 352,218"/>
    <path d="M288,223 Q320,218 340,228"/>
  </g>

  <!-- near crank, chainring + pedal -->
  <g transform="translate(390,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="24" fill="none" stroke="#666" stroke-width="5" stroke-dasharray="4 2.5"/>
      <line x1="0" y1="0" x2="45" y2="0" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <circle r="6" fill="#333"/>
      <g transform="translate(45,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-12" y="-3.5" width="24" height="7" rx="2" fill="#111"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#4a4037" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" d="M335,258 L410,264 L435,340 L449,342">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="M335,258 L410,264 L435,340 L449,342;M335,258 L400,295 L422,372 L436,374;M335,258 L393,305 L390,385 L404,387;M335,258 L396,302 L358,372 L372,374;M335,258 L404,286 L345,340 L359,342;M335,258 L409,247 L358,308 L372,310;M335,258 L397,215 L390,295 L404,297;M335,258 L405,230 L422,308 L436,310;M335,258 L410,264 L435,340 L449,342"/>
  </path>
</svg>