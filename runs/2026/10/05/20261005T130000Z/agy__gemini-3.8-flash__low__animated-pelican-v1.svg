<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Coastal Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ac9e8"/>
      <stop offset="55%" stop-color="#bfe8f7"/>
      <stop offset="75%" stop-color="#fcedc7"/>
      <stop offset="100%" stop-color="#f7caa1"/>
    </linearGradient>

    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a7b9b"/>
      <stop offset="100%" stop-color="#144d66"/>
    </linearGradient>

    <!-- Metal & Frame Gradients -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d63031"/>
      <stop offset="50%" stop-color="#ff7675"/>
      <stop offset="100%" stop-color="#b71540"/>
    </linearGradient>

    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f2f6"/>
      <stop offset="50%" stop-color="#a4b0be"/>
      <stop offset="100%" stop-color="#747d8c"/>
    </linearGradient>

    <!-- Pelican Plumage Gradients -->
    <linearGradient id="pelicanBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#635347"/>
      <stop offset="50%" stop-color="#48382d"/>
      <stop offset="100%" stop-color="#2d221a"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b83b32"/>
      <stop offset="60%" stop-color="#80261f"/>
      <stop offset="100%" stop-color="#4d1612"/>
    </linearGradient>

    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#606f7b"/>
      <stop offset="50%" stop-color="#d39e45"/>
      <stop offset="85%" stop-color="#e0693a"/>
      <stop offset="100%" stop-color="#f8a532"/>
    </linearGradient>

    <!-- 16-Spoke Wheel Template (Radius ~90px, Center at 0,0) -->
    <g id="bicycle-wheel">
      <!-- Rim and Tire -->
      <circle cx="0" cy="0" r="92" fill="none" stroke="#222f3e" stroke-width="12"/>
      <circle cx="0" cy="0" r="86" fill="none" stroke="#dfe4ea" stroke-width="4"/>
      <!-- Spokes -->
      <line x1="-85" y1="0" x2="85" y2="0" stroke="#ced6e0" stroke-width="1.5"/>
      <line x1="0" y1="-85" x2="0" y2="85" stroke="#ced6e0" stroke-width="1.5"/>
      <line x1="-60" y1="-60" x2="60" y2="60" stroke="#ced6e0" stroke-width="1.5"/>
      <line x1="-60" y1="60" x2="60" y2="-60" stroke="#ced6e0" stroke-width="1.5"/>
      <line x1="-78.5" y1="-32.5" x2="78.5" y2="32.5" stroke="#ced6e0" stroke-width="1.5"/>
      <line x1="-32.5" y1="-78.5" x2="32.5" y2="78.5" stroke="#ced6e0" stroke-width="1.5"/>
      <line x1="-78.5" y1="32.5" x2="78.5" y2="-32.5" stroke="#ced6e0" stroke-width="1.5"/>
      <line x1="-32.5" y1="78.5" x2="32.5" y2="-78.5" stroke="#ced6e0" stroke-width="1.5"/>
      <!-- Hub -->
      <circle cx="0" cy="0" r="12" fill="url(#chromeGrad)" stroke="#57606f" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#2f3542"/>
    </g>

    <!-- Webbed Pelican Foot -->
    <g id="pelican-foot">
      <path d="M-6,0 C-6,14 -16,22 -20,24 C-10,24 -2,18 0,16 C3,19 12,24 22,23 C17,20 10,13 6,0 Z" fill="#2d3436"/>
      <line x1="0" y1="0" x2="-14" y2="23" stroke="#1e272e" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#1e272e" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="14" y2="22" stroke="#1e272e" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="900" height="470" fill="url(#skyGrad)"/>
  <rect x="0" y="470" width="900" height="180" fill="#6d5345"/>

  <!-- Distant Ocean & Coastal Horizon -->
  <path d="M0,380 L900,380 L900,470 L0,470 Z" fill="url(#seaGrad)"/>
  <ellipse cx="680" cy="230" rx="48" ry="48" fill="#fff" opacity="0.6"/>
  <ellipse cx="680" cy="230" rx="38" ry="38" fill="#fdfae6"/>

  <!-- Moving Road Details -->
  <rect x="0" y="465" width="900" height="185" fill="#4b4e54"/>
  <line x1="0" y1="467" x2="900" y2="467" stroke="#eccc68" stroke-width="4"/>
  <line x1="0" y1="580" x2="900" y2="580" stroke="#f1f2f6" stroke-dasharray="45 35" stroke-width="4">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- Ground Shadows -->
  <ellipse cx="230" cy="565" rx="85" ry="12" fill="#202326" opacity="0.45"/>
  <ellipse cx="650" cy="565" rx="85" ry="12" fill="#202326" opacity="0.45"/>
  <ellipse cx="440" cy="567" rx="140" ry="16" fill="#1b1d1f" opacity="0.45"/>

  <!-- ==================== BICYCLE LAYER ==================== -->

  <!-- REAR WHEEL (Center at X:230, Y:470) -->
  <g transform="translate(230, 470)">
    <use href="#bicycle-wheel">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- FRONT WHEEL (Center at X:650, Y:470) -->
  <g transform="translate(650, 470)">
    <use href="#bicycle-wheel">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- DRIVE CHAIN & SPROCKETS -->
  <g>
    <!-- Rear Cassette Sprocket -->
    <circle cx="230" cy="470" r="16" fill="#747d8c" stroke="#2f3542" stroke-width="2"/>
    <!-- Large Front Chainring Spindle Hub (BB at 410, 470) -->
    <circle cx="410" cy="470" r="34" fill="#a4b0be" stroke="#2f3542" stroke-width="3"/>
    <!-- Chain loops -->
    <path d="M230,455 L410,438 A32,32 0 0,1 410,502 L230,485 A15,15 0 0,1 230,455 Z" fill="none" stroke="#2f3542" stroke-width="4" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- BICYCLE FRAME -->
  <!-- Geometry Nodes: Rear Axle=(230,470), Bottom Bracket=(410,470), Head Tube Top=(590,290), Head Tube Bottom=(610,380), Fork Tip=(650,470), Seat Junction=(345,310) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear Triangle: Chainstay (Rear Axle to BB) -->
    <line x1="230" y1="470" x2="410" y2="470" stroke="url(#frameGrad)" stroke-width="12"/>
    <!-- Seatstay (Rear Axle to Seat Junction) -->
    <line x1="230" y1="470" x2="345" y2="310" stroke="url(#frameGrad)" stroke-width="11"/>
    <!-- Seat Tube (BB to Seat Junction) -->
    <line x1="410" y1="470" x2="345" y2="310" stroke="url(#frameGrad)" stroke-width="13"/>

    <!-- Front Triangle: Down Tube (BB to Bottom Head Tube) -->
    <line x1="410" y1="470" x2="600" y2="340" stroke="url(#frameGrad)" stroke-width="14"/>
    <!-- Top Tube (Seat Junction to Top Head Tube) -->
    <line x1="345" y1="310" x2="590" y2="290" stroke="url(#frameGrad)" stroke-width="13"/>

    <!-- Head Tube -->
    <line x1="585" y1="275" x2="615" y2="375" stroke="url(#frameGrad)" stroke-width="16"/>

    <!-- Front Fork (Bottom Head Tube to Front Axle) -->
    <line x1="610" y1="365" x2="650" y2="470" stroke="url(#chromeGrad)" stroke-width="10"/>

    <!-- Seatpost & Saddle -->
    <line x1="345" y1="310" x2="325" y2="245" stroke="url(#chromeGrad)" stroke-width="9"/>
    <!-- Comfy Leather Saddle -->
    <path d="M285,245 C295,236 345,235 365,247 C365,255 350,256 340,256 C315,256 300,265 285,263 Z" fill="#2d3436"/>
    <ellipse cx="330" cy="246" rx="28" ry="6" fill="#635347"/>

    <!-- Handlebar Stem & Touring Droop/Cruiser Bar -->
    <path d="M587,280 L580,225 L615,215" fill="none" stroke="url(#chromeGrad)" stroke-width="10" stroke-linecap="square"/>
    <!-- Grips & Curves -->
    <path d="M605,215 C640,215 650,240 645,260" fill="none" stroke="#2d3436" stroke-width="11" stroke-linecap="round"/>
    <path d="M635,248 L650,250" stroke="#f1f2f6" stroke-width="3"/>
  </g>


  <!-- ==================== PEDALS, CRANKS & LEGS ==================== -->

  <!-- LEFT / FAR CRANK, PEDAL & LEG (180 degrees out of phase: starts UP / FORWARD) -->
  <g id="left-pedal-assembly">
    <!-- Bottom bracket rotation at (410, 470) -->
    <g transform="translate(410, 470)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="1.2s" repeatCount="indefinite"/>
        <!-- Far crank arm -->
        <rect x="-8" y="-6" width="62" height="12" rx="6" fill="#57606f"/>
        <!-- Left pedal spindle at (50, 0) -->
        <g transform="translate(50, 0)">
          <!-- Counter-rotate pedal to keep horizontal -->
          <g>
            <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="1.2s" repeatCount="indefinite"/>
            <rect x="-18" y="-6" width="36" height="10" rx="3" fill="#2f3542"/>
            <rect x="-14" y="-3" width="28" height="4" fill="#ff4757"/>
            <!-- Far foot -->
            <use href="#pelican-foot" transform="translate(0, -6) scale(0.85)" opacity="0.9"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Far Leg: Hip at (345, 260). Path synchronizes with pedal motion -->
    <path stroke="#1e272e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
        M345,260 L380,355 L360,470;
        M345,260 L425,370 L410,520;
        M345,260 L445,340 L460,470;
        M345,260 L395,315 L410,420;
        M345,260 L380,355 L360,470
      "/>
    </path>
  </g>


  <!-- ==================== PELICAN SEATED RIDER ==================== -->
  <g id="pelican-rider">
    <!-- Pelican Tail -->
    <path d="M255,270 C240,285 235,310 260,305 C275,302 290,285 295,275 Z" fill="#3d312a"/>

    <!-- Torso and Wing (Backbone of brown pelican) -->
    <!-- Torso subtly bobs with pedaling effort -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 1,-3; 0,-5; -1,-2; 0,0" dur="0.6s" repeatCount="indefinite"/>

      <!-- Main Body -->
      <path d="M280,265 C270,230 300,180 350,175 C395,170 425,200 420,250 C415,290 345,295 280,265 Z" fill="url(#pelicanBodyGrad)"/>

      <!-- Wing Coverts & Feather Layering -->
      <path d="M305,245 C320,195 385,185 410,225 C395,265 350,290 305,245 Z" fill="#53443a" stroke="#332720" stroke-width="2"/>
      <path d="M320,240 C340,210 380,205 395,235 C380,260 350,270 320,240 Z" fill="#756254"/>
      <!-- Feathers tips -->
      <path d="M275,270 C310,265 350,275 365,295 C335,295 295,285 275,270 Z" fill="#2d221a"/>

      <!-- Elegant S-Curve Neck (Chestnut-brown hindneck, white foreneck characteristic of breeding adult) -->
      <!-- Hindneck (Rich dark mahogany brown) -->
      <path d="M390,195 C410,165 435,130 435,90 C435,60 460,40 495,45 C490,65 460,75 455,115 C450,150 435,185 395,205 Z" fill="#3b2219"/>
      <!-- Foreneck (Bright creamy white stripe) -->
      <path d="M410,195 C430,165 455,130 455,90 C455,68 475,55 498,52 C505,75 480,95 475,125 C470,155 440,190 410,195 Z" fill="#f5f6fa"/>

      <!-- Pelican Head -->
      <g transform="translate(500, 50)">
        <!-- Straw-yellow breeding plumage crest on crown -->
        <path d="M-15,10 C-30,0 -15,-20 10,-22 C28,-24 40,-10 35,10 C20,16 5,16 -15,10 Z" fill="#fed330"/>
        <path d="M-22,-2 C-38,-10 -25,-26 -5,-26 C12,-26 22,-18 18,-2 Z" fill="#f7b731"/>

        <!-- Face skin patch (bare pinkish-grey around eye) -->
        <circle cx="12" cy="-4" r="9" fill="#d1ccc0"/>
        <!-- Piercing Blue/Light eye with dark pupil -->
        <circle cx="12" cy="-4" r="5" fill="#74b9ff"/>
        <circle cx="13" cy="-4" r="2.5" fill="#2d3436"/>
        <circle cx="14" cy="-5" r="1" fill="#ffffff"/>

        <!-- Large Bill & Throat Pouch -->
        <!-- Huge expandable Pouch (Ruby/dark chestnut) -->
        <path d="M15,12 C35,28 65,70 115,75 C145,78 175,45 205,10 C145,25 75,20 15,12 Z" fill="url(#pouchGrad)" stroke="#581612" stroke-width="2"/>
        <!-- Pouch muscle striations -->
        <path d="M60,20 C85,45 125,60 160,35" stroke="#9e322a" stroke-width="2" fill="none" opacity="0.7"/>
        <path d="M85,22 C105,45 135,55 175,25" stroke="#9e322a" stroke-width="2" fill="none" opacity="0.7"/>

        <!-- Upper Bill (Long, flat, mottled horn & yellow with hooked tip) -->
        <path d="M20,2 C65,-2 135,-3 210,5 C222,7 225,14 218,17 C190,14 140,15 20,14 Z" fill="url(#billGrad)"/>
        <!-- Hook at bill tip (nail) -->
        <path d="M210,5 C218,6 224,9 220,18 C215,22 211,18 211,13 Z" fill="#eb4d4b"/>
        <!-- Bill line / nostril groove -->
        <line x1="30" y1="7" x2="205" y2="10" stroke="#474747" stroke-width="1.8"/>

        <!-- Whimsical stylish seaside rider cap -->
        <path d="M-15,-12 C-5,-32 30,-32 40,-12 C25,-12 -2,-12 -15,-12 Z" fill="#1e3799"/>
        <path d="M15,-18 C38,-20 60,-12 70,-4 C55,-5 32,-10 15,-18 Z" fill="#0c2461"/>
      </g>

      <!-- Pelican's Arm / Wing gripping the handlebar -->
      <!-- Shoulder to elbow to wrist resting forward on handlebar at (625, 230) -->
      <path d="M375,215 Q470,230 540,220 Q590,215 628,232" fill="none" stroke="#48382d" stroke-width="18" stroke-linecap="round"/>
      <path d="M375,215 Q470,230 540,220 Q590,215 628,232" fill="none" stroke="#635347" stroke-width="12" stroke-linecap="round"/>
      <!-- Wingtip feathers curling over handlebar grip -->
      <path d="M620,225 C635,220 645,232 638,245 C630,248 620,240 618,230 Z" fill="#2d221a"/>
      <path d="M628,228 C642,225 650,238 642,250 C635,252 628,245 625,235 Z" fill="#1e272e"/>
    </g>
  </g>


  <!-- ==================== FOREGROUND RIGHT / NEAR CRANK & LEG ==================== -->

  <!-- RIGHT / NEAR CRANK, PEDAL & LEG (Starts DOWN / REARWARD at 0 degrees) -->
  <g id="right-pedal-assembly">
    <!-- Bottom bracket rotation at (410, 470) -->
    <g transform="translate(410, 470)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <!-- Right Crank Arm -->
        <rect x="-8" y="-6" width="62" height="12" rx="6" fill="#ced6e0" stroke="#747d8c" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="10" fill="#2f3542"/>

        <!-- Pedal Spindle at (50, 0) -->
        <g transform="translate(50, 0)">
          <!-- Counter-rotate pedal to keep it horizontal throughout circle -->
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
            <!-- Pedal Body -->
            <rect x="-18" y="-7" width="36" height="12" rx="3" fill="#1e272e"/>
            <rect x="-15" y="-4" width="30" height="6" fill="#ffa502"/>
            <circle cx="0" cy="-1" r="3" fill="#ffffff"/>

            <!-- Large Webbed Pelican Right Foot clamped on pedal -->
            <g transform="translate(0, -6)">
              <use href="#pelican-foot"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- Near Leg: Thigh and Shin smoothly stretching and compressing -->
    <!-- Synchronized 5-keyframe motion matching the 1.2s crank revolution -->
    <path stroke="#2d3436" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
        M350,265 L445,340 L460,470;
        M350,265 L395,315 L410,420;
        M350,265 L380,355 L360,470;
        M350,265 L425,370 L410,520;
        M350,265 L445,340 L460,470
      "/>
    </path>

    <!-- Muscular feathered hip joint cover -->
    <circle cx="350" cy="265" r="16" fill="#48382d"/>
  </g>

  <!-- Speed Lines / Breeze Animation -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <line x1="880" y1="180" x2="820" y2="180">
      <animate attributeName="x1" from="950" to="-50" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="890" to="-110" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="850" y1="260" x2="770" y2="260">
      <animate attributeName="x1" from="980" to="-80" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="900" to="-160" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="890" y1="390" x2="810" y2="390">
      <animate attributeName="x1" from="920" to="-60" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="840" to="-140" dur="1.3s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>