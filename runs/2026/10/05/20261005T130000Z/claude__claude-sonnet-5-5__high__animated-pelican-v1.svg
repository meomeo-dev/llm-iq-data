<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="80" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="74" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-74" y1="0" x2="74" y2="0"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(22.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(45)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(67.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(90)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(112.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(135)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(157.5)"/>
      </g>
      <rect x="-3" y="-83" width="6" height="12" fill="#d33"/>
      <circle r="8" fill="#555"/>
      <circle r="3" fill="#ddd"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe27a"/>
  <rect x="0" y="423" width="800" height="77" fill="#d9c9a0"/>
  <line x1="0" y1="423" x2="800" y2="423" stroke="#8a7a5a" stroke-width="3"/>
  <g stroke="#a89868" stroke-width="5">
    <line x1="0" y1="450" x2="960" y2="450" stroke-dasharray="40 40">
      <animateTransform attributeName="transform" type="translate" values="0 0;-80 0" dur="0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <ellipse cx="400" cy="426" rx="230" ry="7" fill="#000" opacity="0.15"/>

  <!-- far leg and far crank -->
  <path fill="none" stroke="#2f2620" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M348 228 L414 296 L340 355">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M348 228 L414 296 L340 355;M348 228 L426 282 L346 332;M348 228 L438 258 L362 316;M348 228 L443 235 L385 310;M348 228 L443 228 L407 316;M348 228 L442 239 L424 332;M348 228 L437 260 L430 355;M348 228 L426 282 L424 377;M348 228 L411 299 L407 394;M348 228 L402 306 L385 400;M348 228 L401 307 L362 394;M348 228 L406 304 L346 377;M348 228 L414 296 L340 355"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 385 355" to="540 385 355" dur="2s" repeatCount="indefinite"/>
    <line x1="385" y1="355" x2="430" y2="355" stroke="#444" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(430 355)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="-180 0 0" to="-540 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#222"/>
        <path d="M-6 -5 L10 -3 Q24 0 22 4 L-6 4 Z" fill="#2f2620"/>
      </g>
    </g>
  </g>

  <!-- wheels -->
  <g transform="translate(240 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="11" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="4 2.5"/>
    </g>
  </g>
  <g transform="translate(560 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="2.5">
    <line x1="385" y1="335" x2="240" y2="330"/>
    <line x1="385" y1="375" x2="240" y2="350"/>
  </g>

  <!-- tail -->
  <path d="M312 190 L268 208 L270 224 L315 214 Z" fill="#4b3a2c"/>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="240" y1="340" x2="385" y2="355"/>
    <line x1="240" y1="340" x2="342" y2="250"/>
    <line x1="385" y1="355" x2="342" y2="250"/>
    <line x1="342" y1="250" x2="500" y2="242"/>
    <line x1="385" y1="355" x2="506" y2="262"/>
    <line x1="500" y1="238" x2="508" y2="268" stroke-width="9"/>
    <line x1="506" y1="262" x2="560" y2="340" stroke="#a52f24"/>
  </g>
  <line x1="342" y1="250" x2="342" y2="238" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <path d="M316 236 Q340 229 374 238 Q374 245 340 244 Q320 244 316 236 Z" fill="#222"/>
  <line x1="500" y1="238" x2="497" y2="213" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <path d="M497 213 L520 210" fill="none" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <line x1="510" y1="211" x2="526" y2="209" stroke="#111" stroke-width="8" stroke-linecap="round"/>

  <!-- pelican body -->
  <ellipse cx="365" cy="195" rx="62" ry="36" transform="rotate(-15 365 195)" fill="#8a7966"/>
  <ellipse cx="372" cy="205" rx="40" ry="20" transform="rotate(-15 372 205)" fill="#a39380"/>
  <path d="M398 188 C 438 186 398 150 434 138" fill="none" stroke="#f4ead2" stroke-width="20" stroke-linecap="round"/>
  <path d="M392 180 C 420 172 388 150 422 130" fill="none" stroke="#5a3f2a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="440" cy="128" r="16" fill="#f6ecd0"/>
  <ellipse cx="437" cy="116" rx="11" ry="5" fill="#f2d46b"/>
  <path d="M452 118 L542 142 L540 148 L452 134 Z" fill="#b9a98c"/>
  <path d="M452 134 L540 148 Q500 178 455 140 Z" fill="#c9a77c"/>
  <path d="M538 141 Q546 143 543 150 L539 148 Z" fill="#7a6a55"/>
  <circle cx="446" cy="123" r="3" fill="#111"/>
  <circle cx="447" cy="122" r="1" fill="#fff"/>

  <!-- near leg -->
  <path fill="none" stroke="#4a3f35" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M348 228 L437 260 L430 355">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M348 228 L437 260 L430 355;M348 228 L426 282 L424 377;M348 228 L411 299 L407 394;M348 228 L402 306 L385 400;M348 228 L401 307 L362 394;M348 228 L406 304 L346 377;M348 228 L414 296 L340 355;M348 228 L426 282 L346 332;M348 228 L438 258 L362 316;M348 228 L443 235 L385 310;M348 228 L443 228 L407 316;M348 228 L442 239 L424 332;M348 228 L437 260 L430 355"/>
  </path>

  <!-- near crank, chainring, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 355" to="360 385 355" dur="2s" repeatCount="indefinite"/>
    <circle cx="385" cy="355" r="20" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="5 3"/>
    <line x1="385" y1="355" x2="430" y2="355" stroke="#666" stroke-width="7" stroke-linecap="round"/>
    <circle cx="385" cy="355" r="7" fill="#888" stroke="#333" stroke-width="2"/>
    <g transform="translate(430 355)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#222"/>
        <path d="M-6 -5 L10 -3 Q24 0 22 4 L-6 4 Z" fill="#4a3f35"/>
      </g>
    </g>
  </g>

  <!-- near wing gripping the handlebar -->
  <path d="M378 172 C 425 168 485 190 526 206 L521 216 C 470 206 420 216 374 214 Z" fill="#6b5a4a"/>
  <path d="M400 190 C 440 188 480 200 520 210" fill="none" stroke="#54453a" stroke-width="3" stroke-linecap="round"/>
</svg>