<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8f5"/>
      <stop offset="1" stop-color="#fdf1d8"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#a9adb3" stroke-width="2"/>
      <g stroke="#8d9299" stroke-width="1.2">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(22.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(45)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(67.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(112.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(135)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-60" r="3" fill="#d9362b"/>
      <circle r="7" fill="#555"/>
      <circle r="3" fill="#ddd"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="660" cy="90" r="38" fill="#ffe27a" opacity="0.9"/>
  <rect y="360" width="800" height="60" fill="#7cc0da"/>
  <rect y="420" width="800" height="80" fill="#e3d2a8"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#b9a578" stroke-width="2"/>
  <line x1="0" y1="450" x2="920" y2="450" stroke="#bda97b" stroke-width="5" stroke-dasharray="50 60">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-110 0" dur="0.375s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="423" rx="210" ry="6" fill="#000" opacity="0.15"/>

  <!-- far crank, pedal and leg -->
  <path fill="none" stroke="#3d342b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M352 238L409 291L358 350">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M352 238L409 291L358 350;M352 238L418 280L362 334;M352 238L426 264L374 322;M352 238L429 251L390 318;M352 238L429 248L406 322;M352 238L428 257L418 334;M352 238L422 272L422 350;M352 238L412 288L418 366;M352 238L399 300L406 378;M352 238L393 304L390 382;M352 238L396 303L374 378;M352 238L401 299L362 366;M352 238L409 291L358 350"/>
  </path>
  <g transform="translate(390,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="32" y2="0" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(32,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="2s" repeatCount="indefinite"/>
          <rect x="-9" y="-2" width="18" height="4" rx="1.5" fill="#222"/>
          <ellipse cx="3" cy="-5" rx="11" ry="3.5" fill="#6a5b40"/>
        </g>
      </g>
    </g>
  </g>

  <!-- wheels -->
  <g transform="translate(260,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>
  <g transform="translate(540,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#444" stroke-width="2" fill="none">
    <line x1="390" y1="335" x2="260" y2="343"/>
    <line x1="390" y1="365" x2="260" y2="357"/>
    <circle cx="260" cy="350" r="8" stroke-dasharray="3 2"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 350L390 350"/>
    <path d="M260 350L352 258"/>
    <path d="M390 350L346 244"/>
    <path d="M352 262L498 258"/>
    <path d="M390 350L500 266"/>
    <path d="M496 244L504 274"/>
    <path d="M504 274L540 350"/>
  </g>
  <g fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M496 244L492 222"/>
    <path d="M480 220L520 222Q537 225 534 242"/>
  </g>

  <!-- chainring -->
  <g transform="translate(390,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="4 2"/>
      <circle r="11" fill="none" stroke="#888" stroke-width="1.5"/>
    </g>
  </g>

  <!-- saddle -->
  <path d="M316 243Q334 233 364 237Q368 242 360 246Q336 248 316 247Z" fill="#4a2f1d"/>

  <!-- pelican tail and body -->
  <path d="M305 212L262 236L308 242Z" fill="#6b5a4a"/>
  <ellipse cx="338" cy="206" rx="54" ry="37" transform="rotate(-10 338 206)" fill="#85745f"/>
  <path d="M312 222Q345 240 380 214Q366 236 340 240Q318 238 312 222Z" fill="#b8a98f" opacity="0.7"/>

  <!-- neck, head, bill -->
  <path d="M372 195Q400 175 385 150Q372 130 405 112" fill="none" stroke="#f6f0e2" stroke-width="20" stroke-linecap="round"/>
  <path d="M366 190Q392 170 376 148Q364 128 398 106" fill="none" stroke="#4d3b2d" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="414" cy="106" rx="18" ry="13" fill="#f4e7b8"/>
  <path d="M426 100L506 124Q510 128 503 131L428 117Z" fill="#a89a86"/>
  <path d="M428 114Q462 148 503 131Q468 127 428 114Z" fill="#8c7a5a"/>
  <path d="M498 123L508 126Q511 130 504 132L498 128Z" fill="#c5603a"/>
  <circle cx="419" cy="102" r="3.2" fill="#111"/>
  <circle cx="420" cy="101" r="1" fill="#fff"/>

  <!-- wing gripping handlebar -->
  <path d="M335 190Q400 172 490 216L498 226Q410 206 340 226Z" fill="#5e4f42"/>
  <path d="M338 200Q400 188 470 218" fill="none" stroke="#3f342b" stroke-width="2" opacity="0.6"/>
  <circle cx="494" cy="221" r="6" fill="#5e4f42"/>

  <!-- near leg -->
  <path fill="none" stroke="#5a4d41" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M352 238L422 272L422 350">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M352 238L422 272L422 350;M352 238L412 288L418 366;M352 238L399 300L406 378;M352 238L393 304L390 382;M352 238L396 303L374 378;M352 238L401 299L362 366;M352 238L409 291L358 350;M352 238L418 280L362 334;M352 238L426 264L374 322;M352 238L429 251L390 318;M352 238L429 248L406 322;M352 238L428 257L418 334;M352 238L422 272L422 350"/>
  </path>

  <!-- near crank and pedal -->
  <g transform="translate(390,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="32" y2="0" stroke="#444" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(32,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-9" y="-2" width="18" height="4" rx="1.5" fill="#222"/>
          <ellipse cx="3" cy="-5" rx="11" ry="3.5" fill="#7a6a4a"/>
        </g>
      </g>
    </g>
    <circle r="5" fill="#999" stroke="#555" stroke-width="1.5"/>
  </g>
</svg>