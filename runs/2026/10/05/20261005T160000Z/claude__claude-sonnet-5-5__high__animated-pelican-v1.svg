<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="67" fill="none" stroke="#2a2a2a" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#b8bcc2" stroke-width="2.5"/>
      <g stroke="#9aa0a8" stroke-width="1.2">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(22.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(45)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(67.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(112.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(135)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cy="-56" r="3" fill="#ff9d1c"/>
      <circle r="6" fill="#777" stroke="#444" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe27a"/>

  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="900 0" dur="60s" repeatCount="indefinite"/>
      <ellipse cx="150" cy="70" rx="42" ry="14"/>
      <ellipse cx="180" cy="60" rx="30" ry="14"/>
      <ellipse cx="120" cy="62" rx="26" ry="11"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="600 0" dur="80s" repeatCount="indefinite"/>
      <ellipse cx="500" cy="120" rx="36" ry="12"/>
      <ellipse cx="525" cy="112" rx="26" ry="12"/>
    </g>
  </g>

  <rect x="0" y="420" width="800" height="80" fill="#d9c595"/>
  <rect x="0" y="420" width="800" height="4" fill="#b9a46f"/>
  <path d="M0 458 H800" stroke="#ffffff" stroke-width="6" stroke-dasharray="100 100" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="0.545s" repeatCount="indefinite"/>
  </path>
  <ellipse cx="400" cy="422" rx="220" ry="6" fill="#000" opacity="0.18"/>

  <!-- wheels -->
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="9" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="2 2"/>
    </g>
  </g>
  <g transform="translate(550,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far leg (behind frame) -->
  <path fill="none" stroke="#2b2927" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M345 256 L399.9 302.6 L348 358">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="M345 256 L399.9 302.6 L348 358;M345 256 L408.3 290.5 L352.3 342;M345 256 L414.8 273.8 L364 330.3;M345 256 L416.9 259.5 L380 326;M345 256 L417 257.3 L396 330.3;M345 256 L416.2 266.5 L407.7 342;M345 256 L412.1 282 L412 358;M345 256 L403.4 298.1 L407.7 374;M345 256 L393 309.7 L396 385.7;M345 256 L387.3 314.2 L380 390;M345 256 L388.2 313.6 L364 385.7;M345 256 L392.8 309.8 L352.3 374;M345 256 L399.9 302.6 L348 358"/>
  </path>
  <!-- far crank + pedal -->
  <g transform="translate(380,358)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-32" y2="0" stroke="#5a5f66" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-32,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-10" y="-1" width="20" height="5" rx="2" fill="#222"/>
          <path d="M-5 -5 Q6 -5 15 -1 L13 1 L-5 1 Z" fill="#2b2927"/>
        </g>
      </g>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 350 L380 358"/>
    <path d="M250 350 L353 278"/>
    <path d="M380 358 L352 272"/>
    <path d="M354 274 L504 258"/>
    <path d="M380 358 L510 280"/>
    <path d="M512 284 L550 350" stroke="#a52f23"/>
    <path d="M503 248 L512 284" stroke-width="8"/>
  </g>
  <path d="M352 272 L350 262" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M503 248 L500 226" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M488 226 H512 Q532 226 530 247" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="380" cy="358" r="8" fill="#666" stroke="#333" stroke-width="2"/>

  <!-- chain -->
  <path d="M380 338 L250 342 M380 378 L250 358" stroke="#333" stroke-width="2.5" stroke-dasharray="3 2" fill="none"/>

  <!-- tail -->
  <path d="M286 222 L236 240 L238 246 L288 248 Z" fill="#5e4f40"/>
  <path d="M250 240 L288 236 M246 245 L288 243" stroke="#463a2f" stroke-width="1.5"/>

  <!-- body -->
  <ellipse cx="332" cy="222" rx="58" ry="38" transform="rotate(-12 332 222)" fill="#7d6b58"/>
  <path d="M345 245 Q380 240 388 215" fill="none" stroke="#a8967f" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <!-- saddle -->
  <path d="M326 262 Q350 256 380 260 L378 267 Q350 269 328 268 Z" fill="#222"/>

  <!-- neck and head -->
  <path d="M368 210 C392 200 376 170 408 158" fill="none" stroke="#f1ead8" stroke-width="22" stroke-linecap="round"/>
  <path d="M362 202 C380 190 366 164 400 150" fill="none" stroke="#5b3f2a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="414" cy="148" r="17" fill="#f6f0dc"/>
  <path d="M400 140 Q414 124 430 138 Q416 134 400 140 Z" fill="#f0d878"/>
  <circle cx="420" cy="144" r="3.5" fill="#111"/>
  <circle cx="421" cy="143" r="1.1" fill="#fff"/>
  <path d="M430 157 Q468 192 500 171 Q466 170 430 157 Z" fill="#8a7f6a" stroke="#5f5645" stroke-width="1"/>
  <path d="M425 143 Q465 148 503 166 Q507 171 499 171 Q462 164 426 156 Z" fill="#b0a58c" stroke="#6e6552" stroke-width="1.2"/>
  <path d="M498 166 Q506 168 503 174" fill="none" stroke="#6e6552" stroke-width="2"/>

  <!-- wing reaching the handlebar -->
  <path d="M338 205 Q430 195 510 221 Q516 227 508 231 Q430 222 345 242 Z" fill="#5a4a3b"/>
  <path d="M380 214 Q440 210 495 224 M375 224 Q440 220 495 228" fill="none" stroke="#3f33a28" stroke-width="1.2" stroke-opacity="0"/>
  <path d="M380 214 Q440 210 495 224 M375 226 Q440 222 495 229" fill="none" stroke="#3c3126" stroke-width="1.4"/>
  <circle cx="510" cy="226" r="5" fill="#463a2f"/>

  <!-- near leg -->
  <path fill="none" stroke="#3d3a36" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M345 256 L412.1 282 L412 358">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="M345 256 L412.1 282 L412 358;M345 256 L403.4 298.1 L407.7 374;M345 256 L393 309.7 L396 385.7;M345 256 L387.3 314.2 L380 390;M345 256 L388.2 313.6 L364 385.7;M345 256 L392.8 309.8 L352.3 374;M345 256 L399.9 302.6 L348 358;M345 256 L408.3 290.5 L352.3 342;M345 256 L414.8 273.8 L364 330.3;M345 256 L416.9 259.5 L380 326;M345 256 L417 257.3 L396 330.3;M345 256 L416.2 266.5 L407.7 342;M345 256 L412.1 282 L412 358"/>
  </path>

  <!-- near crank, chainring, pedal -->
  <g transform="translate(380,358)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="19" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 2"/>
      <line x1="0" y1="0" x2="32" y2="0" stroke="#8a9098" stroke-width="6" stroke-linecap="round"/>
      <circle r="5" fill="#444"/>
      <g transform="translate(32,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-10" y="-1" width="20" height="5" rx="2" fill="#222"/>
          <path d="M-5 -5 Q6 -5 15 -1 L13 1 L-5 1 Z" fill="#3d3a36"/>
          <path d="M4 -3 L12 0 M8 -3.5 L13 -1" stroke="#26231f" stroke-width="1"/>
        </g>
      </g>
    </g>
  </g>
</svg>