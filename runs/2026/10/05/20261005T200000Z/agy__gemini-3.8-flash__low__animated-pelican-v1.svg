<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Background Sky & Ground Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="60%" stop-color="#bce6eb"/>
      <stop offset="100%" stop-color="#fdf4dc"/>
    </linearGradient>

    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2c896"/>
      <stop offset="35%" stop-color="#cbb07c"/>
      <stop offset="100%" stop-color="#937a50"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="55%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- 16-Spoke Wheel Definition (axle at center 0,0; radius ~120) -->
    <g id="wheelAssembly">
      <!-- Rubber Tire -->
      <circle cx="0" cy="0" r="122" fill="none" stroke="#222" stroke-width="16"/>
      <!-- Outer Rim & Inner Bead -->
      <circle cx="0" cy="0" r="114" fill="none" stroke="#d4d4d8" stroke-width="4"/>
      <circle cx="0" cy="0" r="112" fill="none" stroke="#a1a1aa" stroke-width="2"/>
      <!-- 16 Spokes -->
      <g stroke="#cbd5e1" stroke-width="1.8" opacity="0.85">
        <line x1="0" y1="-112" x2="0" y2="112"/>
        <line x1="-112" y1="0" x2="112" y2="0"/>
        <line x1="-79.2" y1="-79.2" x2="79.2" y2="79.2"/>
        <line x1="-79.2" y1="79.2" x2="79.2" y2="-79.2"/>
        <line x1="-42.9" y1="-103.5" x2="42.9" y2="103.5"/>
        <line x1="42.9" y1="-103.5" x2="-42.9" y2="103.5"/>
        <line x1="-103.5" y1="-42.9" x2="103.5" y2="42.9"/>
        <line x1="-103.5" y1="42.9" x2="103.5" y2="-42.9"/>
      </g>
      <!-- Center Hub -->
      <circle cx="0" cy="0" r="16" fill="url(#metalGrad)" stroke="#475569" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#1e293b"/>
    </g>
  </defs>

  <style><![CDATA[
    /* Continuous scenic motion */
    @keyframes groundMove {
      from { transform: translateX(0); }
      to { transform: translateX(-200px); }
    }
    .ground-texture {
      animation: groundMove 1s linear infinite;
    }

    /* Bicycle & Pelican subtle road bounce */
    @keyframes subtleVibe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .bike-pelican-unit {
      animation: subtleVibe 0.5s ease-in-out infinite;
    }

    /* Pelvis rocking / pedaling effort */
    @keyframes pelicanBob {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(-1.5deg) translateY(-2px); }
      75% { transform: rotate(1.5deg) translateY(1px); }
    }
    .pelican-torso-group {
      transform-origin: 430px 380px;
      animation: pelicanBob 1.6s ease-in-out infinite;
    }

    /* Wind flutter on crest feathers */
    @keyframes crestFlutter {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(4deg) skewX(2deg); }
    }
    .crest-tuft {
      transform-origin: 395px 175px;
      animation: crestFlutter 0.8s ease-in-out infinite;
    }
  ]]></style>

  <!-- Sky Background -->
  <rect width="1000" height="700" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="830" cy="140" r="55" fill="#fef08a" opacity="0.85"/>
  <circle cx="830" cy="140" r="70" fill="#fef08a" opacity="0.3"/>

  <!-- Distant Ocean & Horizon -->
  <path d="M0,490 Q250,488 500,490 T1000,490 L1000,530 L0,530 Z" fill="#67b0c9" opacity="0.6"/>
  <path d="M0,520 L1000,520 L1000,545 L0,545 Z" fill="#58a0b7" opacity="0.75"/>

  <!-- Coastal Promenade / Ground -->
  <rect x="0" y="540" width="1000" height="160" fill="url(#groundGrad)"/>
  <line x1="0" y1="540" x2="1000" y2="540" stroke="#fef3c7" stroke-width="4"/>

  <!-- Animated Road Dashes for Speed Effect -->
  <g class="ground-texture" stroke="#a16207" stroke-width="3" stroke-dasharray="35 65" opacity="0.45">
    <line x1="0" y1="585" x2="1200" y2="585"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Bicycle and Rider Assembly with subtle vibration -->
  <g class="bike-pelican-unit">

    <!-- Ground Shadow Cast by Bike & Pelican -->
    <ellipse cx="505" cy="545" rx="310" ry="24" fill="#584223" opacity="0.45"/>

    <!-- ========================================== -->
    <!-- 1. BACK LEG (Far side / Left leg)          -->
    <!-- Crank angle at t=0 is 180 deg (down-back)  -->
    <!-- ========================================== -->
    <g id="backLegGroup">
      <!-- Thigh Far -->
      <path d="M430,375 Q405,430 460,470" fill="none" stroke="#52443a" stroke-width="26" stroke-linecap="round"/>
      <path d="M430,375 Q405,430 460,470" fill="none" stroke="#715f53" stroke-width="18" stroke-linecap="round"/>
      <!-- Shin Far -->
      <line x1="460" y1="470" x2="475" y2="505" stroke="#473c33" stroke-width="16" stroke-linecap="round"/>
      <!-- Webbed Foot Far -->
      <polygon points="465,502 495,505 480,518" fill="#d97706"/>

      <!-- Smooth leg flexion animation synchronized to crank angle +180 deg -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 430 375; -16 430 375; 0 430 375; 16 430 375; 0 430 375"
        keyTimes="0; 0.25; 0.5; 0.75; 1"
        dur="1.6s"
        repeatCount="indefinite"/>
    </g>

    <!-- ========================================== -->
    <!-- 2. WHEELS (Continuous Rotation)            -->
    <!-- Axles: Rear = (280, 440), Front = (730, 440)-->
    <!-- ========================================== -->

    <!-- Rear Wheel -->
    <g transform="translate(280, 440)">
      <use href="#wheelAssembly"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 280 440"
        to="360 280 440"
        dur="1.6s"
        repeatCount="indefinite"/>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(730, 440)">
      <use href="#wheelAssembly"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 730 440"
        to="360 730 440"
        dur="1.6s"
        repeatCount="indefinite"/>
    </g>

    <!-- ========================================== -->
    <!-- 3. BICYCLE FRAMEWORK                       -->
    <!-- Key Points:                                -->
    <!-- Rear Axle: (280, 440)                      -->
    <!-- Bottom Bracket Spindle: (480, 440)         -->
    <!-- Seat Tube Junction: (420, 310)             -->
    <!-- Head Tube: (660, 260) to (685, 340)        -->
    <!-- Front Fork Dropouts: (730, 440)            -->
    <!-- ========================================== -->

    <!-- Chainstay and Rear Dropout -->
    <line x1="280" y1="440" x2="480" y2="440" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Seatstay -->
    <line x1="280" y1="440" x2="420" y2="310" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round"/>
    
    <!-- Bike Chain and Rear Cog -->
    <circle cx="280" cy="440" r="24" fill="none" stroke="#64748b" stroke-width="6"/>
    <path d="M280,418 L480,402 M280,462 L480,478" stroke="#334155" stroke-width="4.5" stroke-dasharray="8 4"/>

    <!-- Front Chainring (Chainwheel) -->
    <circle cx="480" cy="440" r="40" fill="none" stroke="#94a3b8" stroke-width="6"/>
    <circle cx="480" cy="440" r="37" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 3"/>

    <!-- Main Diamond Frame Tubes -->
    <!-- Down Tube -->
    <line x1="480" y1="440" x2="675" y2="285" stroke="url(#frameGrad)" stroke-width="16" stroke-linecap="round"/>
    <!-- Seat Tube -->
    <line x1="480" y1="440" x2="420" y2="310" stroke="url(#frameGrad)" stroke-width="15" stroke-linecap="round"/>
    <!-- Top Tube -->
    <line x1="420" y1="310" x2="660" y2="260" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Head Tube -->
    <line x1="655" y1="245" x2="685" y2="340" stroke="url(#frameGrad)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Front Fork (Angled down to front axle) -->
    <line x1="685" y1="340" x2="730" y2="440" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/>

    <!-- Stem & Classic Cruiser Handlebar -->
    <!-- Quill Stem -->
    <polyline points="665,250 660,195 680,195" fill="none" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Handlebar Sweeping Back -->
    <path d="M680,195 Q705,190 690,215 Q675,230 635,235" fill="none" stroke="url(#metalGrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- Rubber Hand Grips -->
    <path d="M648,233 L628,236" stroke="#1e293b" stroke-width="13" stroke-linecap="round"/>

    <!-- Seatpost & Vintage Leather Saddle -->
    <line x1="420" y1="310" x2="415" y2="275" stroke="url(#metalGrad)" stroke-width="11" stroke-linecap="round"/>
    <!-- Saddle Seat -->
    <path d="M375,280 C390,270 445,268 460,285 C460,295 440,295 410,290 C390,290 380,295 375,280 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <circle cx="390" cy="286" r="4" fill="#b45309"/>
    <!-- Saddle Springs -->
    <circle cx="390" cy="294" r="5" fill="none" stroke="#64748b" stroke-width="2.5"/>

    <!-- ========================================== -->
    <!-- 4. CRANKSET & PEDALS (Smil revolving)      -->
    <!-- Center of Bottom Bracket Spindle: 480, 440 -->
    <!-- Crank Arm Length: 48px                     -->
    <!-- ========================================== -->
    <g transform="translate(480, 440)">
      <!-- Revolving Crank Arms Assembly -->
      <g>
        <!-- Continuous 360-degree Crank Rotation -->
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="1.6s"
          repeatCount="indefinite"/>

        <!-- Far-Side Crank Arm (180 deg opposite) -->
        <line x1="0" y1="0" x2="-34" y2="-34" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
        <!-- Far Pedal Spindle & Body (counter-rotates to stay horizontal) -->
        <g transform="translate(-34, -34)">
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0"
            to="-360"
            dur="1.6s"
            repeatCount="indefinite"
            additive="sum"/>
          <rect x="-12" y="-5" width="24" height="10" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
        </g>

        <!-- Near-Side Crank Arm -->
        <line x1="0" y1="0" x2="34" y2="34" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="12" fill="url(#metalGrad)" stroke="#334155" stroke-width="2"/>

        <!-- Near Pedal Spindle & Body (counter-rotates to remain level for foot) -->
        <g id="nearPedal" transform="translate(34, 34)">
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0"
            to="-360"
            dur="1.6s"
            repeatCount="indefinite"
            additive="sum"/>
          <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#f59e0b" stroke-width="2"/>
        </g>
      </g>
    </g>

    <!-- =================================================== -->
    <!-- 5. PELICAN RIDER (California Brown Pelican)          -->
    <!-- Anatomic Features: Mottled brown-grey body, slender  -->
    <!-- neck, yellow-white head, long bill with large pouch -->
    <!-- =================================================== -->
    <g class="pelican-torso-group">

      <!-- Tail Feathers -->
      <path d="M360,335 C330,345 320,370 345,375 C370,375 390,360 395,340 Z" fill="#44403c"/>
      <path d="M340,350 L320,380 L350,365" stroke="#292524" stroke-width="3" fill="none"/>

      <!-- Pelican Main Body / Torso -->
      <path d="M380,310 C370,350 395,410 445,410 C500,410 525,360 520,310 C515,270 470,255 425,265 C395,272 385,290 380,310 Z" fill="#57534e"/>

      <!-- Brown Pelican Feathery Texture Layers on Flank -->
      <path d="M400,285 C430,280 470,280 500,305 C490,350 455,395 420,395 C390,390 385,345 400,285 Z" fill="#78716c"/>
      <path d="M415,305 C435,300 465,300 480,320 C470,355 440,380 420,375 Z" fill="#a8a29e" opacity="0.3"/>

      <!-- Pelican Folded Wing -->
      <g>
        <!-- Outer Coverts -->
        <path d="M410,280 Q450,270 485,310 Q500,345 460,375 Q420,390 405,335 Z" fill="#44403c" stroke="#292524" stroke-width="2"/>
        <!-- Primary & Secondary Feather Strata -->
        <path d="M430,300 Q475,320 465,365" stroke="#78716c" stroke-width="4" fill="none"/>
        <path d="M440,290 Q485,310 480,350" stroke="#a8a29e" stroke-width="3" fill="none"/>
        <path d="M420,320 Q465,345 445,375" stroke="#292524" stroke-width="3" fill="none"/>
      </g>

      <!-- Wing / Arm Reaching Forward to Grip the Handlebars -->
      <path d="M455,300 Q540,270 635,235" fill="none" stroke="#57534e" stroke-width="22" stroke-linecap="round"/>
      <path d="M455,300 Q540,270 635,235" fill="none" stroke="#78716c" stroke-width="14" stroke-linecap="round"/>
      <!-- Wing Tip Primary Feathers Clamping Handlebar Grip -->
      <path d="M625,225 Q645,230 635,245 Q620,250 615,235 Z" fill="#292524"/>
      <path d="M632,228 Q652,233 642,248" fill="none" stroke="#1c1917" stroke-width="2.5"/>

      <!-- Elegant S-Curve Neck of California Brown Pelican -->
      <!-- Hindneck (Rich dark chestnut / seal brown during breeding season) -->
      <path d="M450,265 C455,220 480,185 500,165 C520,145 525,115 500,105 C475,95 445,115 440,150 C435,185 415,225 410,265 Z" fill="#451a03"/>
      <!-- Foreneck (Contrasting pale warm stripe) -->
      <path d="M465,260 C470,225 490,195 508,170 C522,150 515,120 495,112 C475,105 458,125 450,155 C442,190 425,225 420,260 Z" fill="#f5f5f4"/>

      <!-- Pelican Head & Crown (Straw Yellow / Pale Golden) -->
      <path d="M495,112 C505,100 500,75 470,72 C435,68 405,95 415,130 C420,145 440,155 465,150 C485,145 495,125 495,112 Z" fill="#fef08a"/>
      <!-- Crest Feathers with wind animation -->
      <g class="crest-tuft">
        <path d="M420,95 Q385,85 375,100 Q400,110 415,112 Z" fill="#fef08a"/>
        <path d="M425,85 Q395,75 385,90 Q405,98 420,98 Z" fill="#fde047"/>
      </g>

      <!-- Keen Pelican Eye -->
      <circle cx="452" cy="98" r="8" fill="#e2e8f0" stroke="#713f12" stroke-width="2"/>
      <circle cx="453" cy="98" r="4.5" fill="#0f172a"/>
      <circle cx="455" cy="96" r="1.5" fill="#ffffff"/>

      <!-- Signature Large Bill and Gular Pouch -->
      <!-- Immense Gular Throat Pouch (Flexible yellow-orange sac) -->
      <path d="M470,122 C530,140 590,175 620,180 C600,210 520,215 460,155 Z" fill="url(#pouchGrad)" opacity="0.95" stroke="#b45309" stroke-width="2"/>
      <!-- Pouch vascular striations -->
      <path d="M500,140 Q550,180 595,180 M480,135 Q530,170 565,185 M525,145 Q565,175 610,180" stroke="#d97706" stroke-width="1.8" fill="none" opacity="0.7"/>

      <!-- Long Sturdy Maxilla (Upper Bill) -->
      <path d="M465,95 L685,145 C695,148 695,153 685,155 L475,125 Z" fill="url(#billGrad)" stroke="#475569" stroke-width="1.5"/>
      <!-- Maxillary Hook / Nail at tip of bill -->
      <path d="M685,145 Q700,150 690,158 Q680,158 684,152 Z" fill="#be123c"/>

      <!-- Lower Mandible (Lower jaw framing the pouch) -->
      <path d="M475,122 L685,155" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- =================================================== -->
    <!-- 6. FOREGROUND LEG & FOOT (Near Side)                -->
    <!-- Hip: (445, 385)                                     -->
    <!-- Moves continuously with the near crank & pedal      -->
    <!-- =================================================== -->
    <g id="frontLegGroup">
      <!-- Thigh -->
      <path d="M445,385 Q495,415 510,460" fill="none" stroke="#332c27" stroke-width="28" stroke-linecap="round"/>
      <path d="M445,385 Q495,415 510,460" fill="none" stroke="#57534e" stroke-width="20" stroke-linecap="round"/>
      
      <!-- Strong Lower Leg (Tarsus) extending down to pedal -->
      <line x1="510" y1="460" x2="514" y2="474" stroke="#292524" stroke-width="17" stroke-linecap="round"/>
      <line x1="510" y1="460" x2="514" y2="474" stroke="#d97706" stroke-width="11" stroke-linecap="round"/>

      <!-- Fully Webbed Pelican Foot positioned squarely on the Near Pedal -->
      <!-- Heel: (514, 474), Toes grasping pedal platform -->
      <path d="M495,472 L538,474 L528,485 L490,482 Z" fill="#d97706" stroke="#b45309" stroke-width="2"/>
      <polygon points="538,474 548,476 540,480" fill="#78350f"/>
      <polygon points="535,479 544,482 533,485" fill="#78350f"/>
      <!-- Webbing webbing ribs -->
      <line x1="505" y1="474" x2="538" y2="474" stroke="#f59e0b" stroke-width="2"/>
      <line x1="505" y1="477" x2="534" y2="482" stroke="#f59e0b" stroke-width="2"/>

      <!-- Smooth synchronized pedaling motion for foreground leg -->
      <!-- Cycles through upper stroke, push forward, bottom extension, and upward return -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 445 385; 16 445 385; 0 445 385; -16 445 385; 0 445 385"
        keyTimes="0; 0.25; 0.5; 0.75; 1"
        dur="1.6s"
        repeatCount="indefinite"/>
    </g>

  </g>
</svg>