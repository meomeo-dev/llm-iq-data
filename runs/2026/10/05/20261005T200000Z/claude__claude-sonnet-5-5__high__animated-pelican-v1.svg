<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f5"/>
      <stop offset="1" stop-color="#f6efd8"/>
    </linearGradient>
    <g id="wheel">
      <circle r="72" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <circle r="66" fill="none" stroke="#b8b8b8" stroke-width="1.5"/>
      <g stroke="#888" stroke-width="1">
        <line x1="-66" y1="0" x2="66" y2="0"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(22.5)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(45)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(67.5)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(90)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(112.5)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(135)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#555"/>
      <circle r="3" fill="#ddd"/>
      <circle cx="0" cy="-61" r="3.5" fill="#d33"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#ffe9a0" opacity="0.85"/>
  <rect x="0" y="427" width="800" height="73" fill="#d9c9a0"/>
  <line x1="0" y1="427" x2="800" y2="427" stroke="#8c7b55" stroke-width="2"/>
  <g stroke="#a89468" stroke-width="3" stroke-dasharray="30 30">
    <g>
      <line x1="0" y1="450" x2="900" y2="450"/>
      <line x1="0" y1="475" x2="900" y2="475" stroke-dashoffset="15"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-60 0" dur="0.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <ellipse cx="400" cy="428" rx="230" ry="6" fill="#000" opacity="0.15"/>

  <!-- Wheels -->
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use xlink:href="#wheel" href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use xlink:href="#wheel" href="#wheel"/>
    </g>
  </g>

  <!-- Chain and rear cog -->
  <circle cx="250" cy="350" r="8" fill="none" stroke="#444" stroke-width="3"/>
  <path d="M390,342 L250,342 M250,358 L390,378" stroke="#444" stroke-width="2.5" stroke-dasharray="3 2" fill="none"/>

  <!-- Far leg and far crank (behind frame) -->
  <polyline fill="none" stroke="#7d6e58" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points="365,255 413.4,308.3 355,360">
    <animate attributeName="points" dur="1.2s" repeatCount="indefinite" calcMode="linear"
      values="365,255 413.4,308.3 355,360;
              365,255 423.3,297.3 359.7,342.5;
              365,255 432.5,279.9 372.5,329.7;
              365,255 436.6,262.5 390,325;
              365,255 437,257.5 407.5,329.7;
              365,255 436.1,266.1 420.3,342.5;
              365,255 431.6,282.3 425,360;
              365,255 421.6,299.5 420.3,377.5;
              365,255 408.6,312.3 407.5,390.3;
              365,255 400.4,317.7 390,395;
              365,255 400.7,317.5 372.5,390.3;
              365,255 405.6,314.5 359.7,377.5;
              365,255 413.4,308.3 355,360"/>
  </polyline>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 390 360" to="540 390 360" dur="1.2s" repeatCount="indefinite"/>
    <line x1="390" y1="360" x2="425" y2="360" stroke="#2f2f2f" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 425 360" to="-540 425 360" dur="1.2s" repeatCount="indefinite"/>
      <rect x="413" y="357.5" width="24" height="5" rx="1.5" fill="#222"/>
      <ellipse cx="428" cy="356" rx="11" ry="3.5" fill="#d98a3a"/>
    </g>
  </g>

  <!-- Frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250,350 L390,360"/>
    <path d="M250,350 L352,254"/>
    <path d="M390,360 L350,245"/>
    <path d="M350,252 L505,252"/>
    <path d="M390,360 L510,268"/>
    <path d="M505,245 L513,276"/>
  </g>
  <path d="M513,276 L550,350" stroke="#555" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="390" cy="360" r="7" fill="#444"/>
  <!-- Seat post and saddle -->
  <line x1="350" y1="245" x2="348" y2="238" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M322,238 Q345,230 374,237 L370,245 Q346,247 326,246 Z" fill="#222"/>
  <!-- Stem and handlebar -->
  <line x1="505" y1="246" x2="500" y2="222" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M490,222 L520,222 Q540,222 540,242" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- Pelican -->
  <path d="M330,205 L282,232 L298,246 L335,236 Z" fill="#4a3a2d"/>
  <ellipse cx="372" cy="215" rx="60" ry="38" fill="#6b5a4a"/>
  <ellipse cx="385" cy="226" rx="38" ry="22" fill="#a89a84" opacity="0.7"/>
  <path d="M410,198 C445,190 455,160 430,140 C415,125 440,108 462,112" fill="none" stroke="#efe6cc" stroke-width="18" stroke-linecap="round"/>
  <path d="M404,192 C438,184 446,160 424,140 C408,124 434,104 458,106" fill="none" stroke="#4d3223" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="466" cy="112" rx="17" ry="13" fill="#f7f1df"/>
  <path d="M452,104 Q466,96 480,104 Q468,108 452,108 Z" fill="#f0d96a"/>
  <circle cx="473" cy="109" r="3.5" fill="#fff"/>
  <circle cx="473.5" cy="109" r="2.2" fill="#111"/>
  <path d="M480,120 Q512,150 548,137 L480,116 Z" fill="#8a6b4d"/>
  <path d="M478,105 L554,128 Q560,131 554,136 L478,119 Z" fill="#b4a88c"/>
  <path d="M554,128 Q561,131 554,136" fill="none" stroke="#6e5a3e" stroke-width="2"/>
  <!-- Wing (folded on body) and arm reaching the handlebar -->
  <path d="M322,212 Q350,190 400,200 Q420,212 400,232 Q360,248 322,230 Z" fill="#7b6650"/>
  <path d="M335,214 L380,222 M335,222 L385,230 M338,230 L375,238" stroke="#5a4838" stroke-width="2" fill="none"/>
  <path d="M395,203 Q450,216 516,223" fill="none" stroke="#5d4a3a" stroke-width="13" stroke-linecap="round"/>
  <circle cx="518" cy="223" r="6" fill="#3d2f25"/>

  <!-- Near leg -->
  <polyline fill="none" stroke="#8a7a60" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="365,255 431.6,282.3 425,360">
    <animate attributeName="points" dur="1.2s" repeatCount="indefinite" calcMode="linear"
      values="365,255 431.6,282.3 425,360;
              365,255 421.6,299.5 420.3,377.5;
              365,255 408.6,312.3 407.5,390.3;
              365,255 400.4,317.7 390,395;
              365,255 400.7,317.5 372.5,390.3;
              365,255 405.6,314.5 359.7,377.5;
              365,255 413.4,308.3 355,360;
              365,255 423.3,297.3 359.7,342.5;
              365,255 432.5,279.9 372.5,329.7;
              365,255 436.6,262.5 390,325;
              365,255 437,257.5 407.5,329.7;
              365,255 436.1,266.1 420.3,342.5;
              365,255 431.6,282.3 425,360"/>
  </polyline>

  <!-- Near crank, chainring and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 360" to="360 390 360" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="390" cy="360" r="18" fill="none" stroke="#555" stroke-width="3"/>
    <circle cx="390" cy="360" r="13" fill="none" stroke="#777" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="390" y1="360" x2="425" y2="360" stroke="#2f2f2f" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 425 360" to="-360 425 360" dur="1.2s" repeatCount="indefinite"/>
      <rect x="413" y="357.5" width="24" height="5" rx="1.5" fill="#222"/>
      <ellipse cx="428" cy="356" rx="11" ry="3.5" fill="#e59a45"/>
      <path d="M435,356 l5,-1 M435,357 l5,1" stroke="#c67a2c" stroke-width="1.5"/>
    </g>
    <circle cx="390" cy="360" r="4" fill="#999"/>
  </g>
</svg>