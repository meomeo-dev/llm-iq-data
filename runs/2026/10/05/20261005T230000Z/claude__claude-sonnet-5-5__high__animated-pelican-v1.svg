<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f7"/>
      <stop offset="1" stop-color="#eaf7fd"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#2b2b2b" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#9aa5ab" stroke-width="2"/>
      <g stroke="#8a9399" stroke-width="1">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(22.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(45)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(67.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(112.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(135)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#555"/>
      <circle r="3" fill="#ddd"/>
      <circle cx="58" cy="0" r="3" fill="#e74c3c"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe08a"/>
  <path d="M0,400 Q120,320 260,390 Q380,330 520,392 Q650,340 800,395 L800,440 L0,440 Z" fill="#a9d49a"/>
  <rect x="0" y="432" width="800" height="68" fill="#6d6d6d"/>
  <line x1="0" y1="466" x2="1300" y2="466" stroke="#f5f5f5" stroke-width="5" stroke-dasharray="50 60">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-440 0" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <!-- wheels -->
  <g transform="translate(240,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
    </g>
  </g>
  <g transform="translate(560,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
    </g>
  </g>

  <!-- far leg -->
  <g transform="translate(365,250)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
        values="-30.7;-41;-53.7;-66;-71.5;-67.4;-56.3;-41.3;-25.5;-15.6;-17.5;-23.1;-30.7"/>
      <line x1="0" y1="0" x2="0" y2="75" stroke="#5f5043" stroke-width="10" stroke-linecap="round"/>
      <g transform="translate(0,75)">
        <circle r="5" fill="#5f5043"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
            values="78.2;96.6;108.8;111.6;103.8;88.2;68.2;46.6;26.4;19.6;35.8;57.2;78.2"/>
          <line x1="0" y1="0" x2="0" y2="75" stroke="#6b625b" stroke-width="6" stroke-linecap="round"/>
          <g transform="translate(0,75)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
                values="-47.5;-55.6;-55.1;-45.6;-32.3;-20.8;-11.9;-5.3;-0.9;-4;-18.3;-34.1;-47.5"/>
              <path d="M-5,-8 L24,-3 L22,2 L-6,2 Z" fill="#6b625b" stroke="#6b625b" stroke-width="2" stroke-linejoin="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="380" y1="365" x2="240" y2="360"/>
    <line x1="364" y1="284" x2="240" y2="360"/>
    <line x1="380" y1="365" x2="362" y2="268"/>
    <line x1="363" y1="282" x2="520" y2="274"/>
    <line x1="380" y1="365" x2="524" y2="292"/>
    <line x1="516" y1="262" x2="526" y2="300" stroke-width="8"/>
    <line x1="524" y1="296" x2="560" y2="360" stroke-width="5"/>
  </g>
  <line x1="362" y1="268" x2="360" y2="257" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M336,259 Q360,251 394,257 Q397,264 382,266 Q352,267 336,264 Z" fill="#3b2a20"/>
  <path d="M519,268 L515,244 L500,244 Q490,244 490,257" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="240" cy="360" r="5" fill="#333"/>
  <circle cx="560" cy="360" r="5" fill="#333"/>

  <!-- chain -->
  <g stroke="#333" stroke-width="2">
    <line x1="380" y1="350" x2="240" y2="354"/>
    <line x1="380" y1="380" x2="240" y2="366"/>
  </g>
  <circle cx="240" cy="360" r="7" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="2 2"/>

  <!-- crank, chainring, pedals -->
  <g transform="translate(380,365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="15" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="3 2"/>
      <line x1="-32" y1="0" x2="32" y2="0" stroke="#444" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(32,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-10" y="-2.5" width="20" height="5" rx="2" fill="#bbb" stroke="#333" stroke-width="1"/>
        </g>
      </g>
      <g transform="translate(-32,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-10" y="-2.5" width="20" height="5" rx="2" fill="#bbb" stroke="#333" stroke-width="1"/>
        </g>
      </g>
    </g>
    <circle r="5" fill="#222"/>
  </g>

  <!-- near leg -->
  <g transform="translate(365,250)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
        values="-56.3;-41.3;-25.5;-15.6;-17.5;-23.1;-30.7;-41;-53.7;-66;-71.5;-67.4;-56.3"/>
      <line x1="0" y1="0" x2="0" y2="75" stroke="#7a6552" stroke-width="11" stroke-linecap="round"/>
      <g transform="translate(0,75)">
        <circle r="5.5" fill="#7a6552"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
            values="68.2;46.6;26.4;19.6;35.8;57.2;78.2;96.6;108.8;111.6;103.8;88.2;68.2"/>
          <line x1="0" y1="0" x2="0" y2="75" stroke="#3a342f" stroke-width="6" stroke-linecap="round"/>
          <g transform="translate(0,75)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
                values="-11.9;-5.3;-0.9;-4;-18.3;-34.1;-47.5;-55.6;-55.1;-45.6;-32.3;-20.8;-11.9"/>
              <path d="M-5,-8 L24,-3 L22,2 L-6,2 Z" fill="#3a342f" stroke="#3a342f" stroke-width="2" stroke-linejoin="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- pelican body -->
  <path d="M296,212 L248,244 L252,208 L262,196 Z" fill="#4e3b2e"/>
  <ellipse cx="352" cy="212" rx="62" ry="41" fill="#8a7560" transform="rotate(-8 352 212)"/>
  <path d="M320,240 Q355,258 395,236 Q380,250 350,252 Q330,252 320,240 Z" fill="#b7a58f"/>
  <path d="M388,196 Q340,196 296,226 Q340,238 390,224 Z" fill="#4e3b2e"/>
  <path d="M376,200 Q440,212 498,244" fill="none" stroke="#6b5443" stroke-width="17" stroke-linecap="round"/>
  <path d="M380,198 Q440,208 494,240" fill="none" stroke="#8a7560" stroke-width="6" stroke-linecap="round"/>
  <circle cx="499" cy="246" r="7" fill="#4e3b2e"/>

  <!-- neck and head -->
  <path d="M388,205 C405,172 395,150 432,128" fill="none" stroke="#f4efe6" stroke-width="24" stroke-linecap="round"/>
  <path d="M378,200 C394,168 384,146 414,122" fill="none" stroke="#5a4636" stroke-width="8" stroke-linecap="round"/>
  <circle cx="442" cy="120" r="16" fill="#f8f4ec"/>
  <ellipse cx="437" cy="108" rx="13" ry="7" fill="#f2d675" transform="rotate(-10 437 108)"/>
  <path d="M454,126 Q500,170 546,150 L454,130 Z" fill="#a68a62"/>
  <path d="M452,112 L549,146 L546,151 L454,128 Z" fill="#c2b08a"/>
  <path d="M540,145 L552,146 Q553,154 545,153 Z" fill="#7d6b4f"/>
  <circle cx="446" cy="115" r="3.5" fill="#222"/>
  <circle cx="447" cy="114" r="1" fill="#fff"/>
</svg>