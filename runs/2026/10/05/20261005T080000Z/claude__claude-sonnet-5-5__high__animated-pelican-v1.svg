<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#fbe9c6"/>
    </linearGradient>
    <g id="wheelbody">
      <circle r="77" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="71" fill="none" stroke="#b8bcc2" stroke-width="2.5"/>
      <g stroke="#9aa0a6" stroke-width="1.3">
        <line x1="-71" y1="0" x2="71" y2="0"/>
        <line x1="-71" y1="0" x2="71" y2="0" transform="rotate(30)"/>
        <line x1="-71" y1="0" x2="71" y2="0" transform="rotate(60)"/>
        <line x1="-71" y1="0" x2="71" y2="0" transform="rotate(90)"/>
        <line x1="-71" y1="0" x2="71" y2="0" transform="rotate(120)"/>
        <line x1="-71" y1="0" x2="71" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="9" fill="#555" stroke="#333" stroke-width="2"/>
      <circle cx="0" cy="-66" r="3.5" fill="#e53935"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#fff3b0" opacity="0.9"/>
  <path d="M0 400 Q200 385 400 398 T800 392 L800 420 L0 420 Z" fill="#4a90b8" opacity="0.6"/>
  <rect x="0" y="420" width="800" height="80" fill="#8a8d91"/>
  <rect x="0" y="420" width="800" height="5" fill="#6d7074"/>
  <g stroke="#f5f5f5" stroke-width="5">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="0.8s" repeatCount="indefinite"/>
      <line x1="0" y1="458" x2="50" y2="458"/>
      <line x1="100" y1="458" x2="150" y2="458"/>
      <line x1="200" y1="458" x2="250" y2="458"/>
      <line x1="300" y1="458" x2="350" y2="458"/>
      <line x1="400" y1="458" x2="450" y2="458"/>
      <line x1="500" y1="458" x2="550" y2="458"/>
      <line x1="600" y1="458" x2="650" y2="458"/>
      <line x1="700" y1="458" x2="750" y2="458"/>
      <line x1="800" y1="458" x2="850" y2="458"/>
    </g>
  </g>
  <ellipse cx="410" cy="424" rx="220" ry="6" fill="#000" opacity="0.18"/>

  <!-- far leg -->
  <path fill="none" stroke="#262626" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M365 262 L411 312 L355 350 L368 347">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M365 262 L411 312 L355 350 L368 347;
      M365 262 L425 294 L365 325 L378 322;
      M365 262 L433 262 L390 315 L403 312;
      M365 262 L433 260 L415 325 L428 322;
      M365 262 L430 282 L425 350 L438 347;
      M365 262 L416 307 L415 375 L428 372;
      M365 262 L403 318 L390 385 L403 382;
      M365 262 L403 318 L365 375 L378 372;
      M365 262 L411 312 L355 350 L368 347"/>
  </path>

  <!-- far crank + pedal -->
  <g transform="translate(390,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-35" y2="0" stroke="#444" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-2.5" width="22" height="5" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
  </g>

  <!-- wheels -->
  <g transform="translate(240,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use xlink:href="#wheelbody"/>
      <circle r="14" fill="none" stroke="#777" stroke-width="5" stroke-dasharray="3 3"/>
    </g>
  </g>
  <g transform="translate(580,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use xlink:href="#wheelbody"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="2.5">
    <line x1="390" y1="332" x2="240" y2="333"/>
    <line x1="390" y1="368" x2="240" y2="347"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="350" x2="356" y2="270"/>
    <line x1="362" y1="284" x2="530" y2="250"/>
    <line x1="390" y1="350" x2="534" y2="258"/>
    <line x1="390" y1="350" x2="240" y2="340"/>
    <line x1="362" y1="284" x2="240" y2="340"/>
    <line x1="536" y1="262" x2="580" y2="340"/>
    <line x1="528" y1="240" x2="537" y2="264" stroke-width="10" stroke="#9c2b20"/>
  </g>
  <g fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="528" y1="240" x2="522" y2="222"/>
    <path d="M522 222 L546 216 Q568 216 568 240"/>
  </g>
  <path d="M564 232 L572 246" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <circle cx="390" cy="350" r="7" fill="#555" stroke="#333" stroke-width="2"/>

  <!-- saddle -->
  <line x1="356" y1="270" x2="356" y2="264" stroke="#333" stroke-width="5"/>
  <path d="M332 262 Q358 254 388 261 Q378 272 336 270 Z" fill="#3b2a1e"/>

  <!-- pelican -->
  <path d="M318 218 L262 244 L322 248 Z" fill="#5b4631"/>
  <g transform="rotate(-8 360 228)">
    <ellipse cx="360" cy="228" rx="52" ry="36" fill="#8c7456"/>
    <ellipse cx="372" cy="238" rx="36" ry="22" fill="#b9a584"/>
  </g>
  <path d="M392 212 C432 218 405 162 445 152" fill="none" stroke="#6b4e33" stroke-width="22" stroke-linecap="round"/>
  <path d="M396 218 C434 224 411 166 450 158" fill="none" stroke="#efe6cf" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="452" cy="143" rx="21" ry="16" fill="#f7f1de"/>
  <ellipse cx="447" cy="131" rx="15" ry="7" fill="#f0d24f"/>
  <path d="M464 134 L554 152 Q558 157 548 158 L466 150 Z" fill="#8e9390"/>
  <path d="M466 149 Q505 184 546 160 L548 158 L466 151 Z" fill="#b59a73"/>
  <circle cx="459" cy="140" r="3.5" fill="#1a1a1a"/>
  <circle cx="460" cy="139" r="1.1" fill="#fff"/>
  <path d="M378 204 Q450 214 550 220 Q522 238 440 240 Q392 242 368 228 Z" fill="#6a523a"/>
  <path d="M368 228 Q392 242 440 240 Q420 232 378 222 Z" fill="#4e3b29"/>
  <circle cx="550" cy="221" r="6" fill="#4e3b29"/>

  <!-- chainring + near crank + pedal -->
  <g transform="translate(390,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="18" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="3 2"/>
      <g stroke="#777" stroke-width="2">
        <line x1="-16" y1="0" x2="16" y2="0"/>
        <line x1="-16" y1="0" x2="16" y2="0" transform="rotate(60)"/>
        <line x1="-16" y1="0" x2="16" y2="0" transform="rotate(120)"/>
      </g>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-2.5" width="22" height="5" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M365 262 L430 282 L425 350 L438 347">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M365 262 L430 282 L425 350 L438 347;
      M365 262 L416 307 L415 375 L428 372;
      M365 262 L403 318 L390 385 L403 382;
      M365 262 L403 318 L365 375 L378 372;
      M365 262 L411 312 L355 350 L368 347;
      M365 262 L425 294 L365 325 L378 322;
      M365 262 L433 262 L390 315 L403 312;
      M365 262 L433 260 L415 325 L428 322;
      M365 262 L430 282 L425 350 L438 347"/>
  </path>
</svg>