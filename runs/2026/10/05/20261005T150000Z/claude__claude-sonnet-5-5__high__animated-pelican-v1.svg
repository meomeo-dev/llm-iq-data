<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="78" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#bbb" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.5">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="9" fill="#555"/>
      <circle r="4" fill="#ddd"/>
      <circle cx="66" cy="0" r="4" fill="#d33"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="35" fill="#fff3b0"/>
  <rect x="0" y="420" width="800" height="80" fill="#c9d9a8"/>
  <line x1="0" y1="421" x2="800" y2="421" stroke="#7d8f5c" stroke-width="3" stroke-dasharray="30 20">
    <animate attributeName="stroke-dashoffset" from="0" to="50" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="424" rx="230" ry="7" fill="#000" opacity="0.15"/>

  <!-- rear wheel -->
  <g transform="translate(250,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="12" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="3 2"/>
    </g>
  </g>

  <!-- far leg -->
  <g transform="translate(335,250)" stroke="#5a5552" stroke-width="8" stroke-linecap="round" fill="none">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" begin="-1s" repeatCount="indefinite"
        values="-78.5;-62.1;-48.5;-41.4;-40.85;-44.8;-53.04;-66.7;-86.25;-102.3;-103.7;-93.7;-78.5"/>
      <line x1="0" y1="0" x2="0" y2="75"/>
      <g transform="translate(0,75)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2s" begin="-1s" repeatCount="indefinite"
            values="77.5;59.9;49.3;51.3;64.4;82.9;102.8;120.4;130.95;129.1;115.8;97.2;77.5"/>
          <line x1="0" y1="0" x2="0" y2="85"/>
          <path d="M-3,83 L24,88 L22,95 L-2,93 Z" fill="#6a6562" stroke="none"/>
        </g>
      </g>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="370" y1="350" x2="333" y2="250"/>
    <line x1="340" y1="266" x2="500" y2="262"/>
    <line x1="370" y1="350" x2="505" y2="288"/>
    <line x1="370" y1="350" x2="250" y2="340"/>
    <line x1="338" y1="268" x2="250" y2="340"/>
    <line x1="498" y1="254" x2="508" y2="288" stroke-width="9"/>
    <path d="M508,288 Q532,305 550,340"/>
  </g>
  <g fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="498" y1="256" x2="494" y2="232"/>
    <path d="M494,232 L472,229 Q456,229 458,248"/>
  </g>
  <path d="M312,252 Q335,243 362,250 Q360,259 335,259 Q315,259 312,252Z" fill="#222"/>

  <!-- chain -->
  <g stroke="#444" stroke-width="2">
    <line x1="370" y1="331" x2="250" y2="333"/>
    <line x1="370" y1="369" x2="250" y2="347"/>
  </g>

  <!-- front wheel -->
  <g transform="translate(550,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- crank, chainring, pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 370 350" to="360 370 350" dur="2s" repeatCount="indefinite"/>
    <circle cx="370" cy="350" r="19" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="4 2"/>
    <line x1="330" y1="350" x2="410" y2="350" stroke="#999" stroke-width="6" stroke-linecap="round"/>
    <circle cx="370" cy="350" r="6" fill="#333"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 410 350" to="-360 410 350" dur="2s" repeatCount="indefinite"/>
      <rect x="396" y="346" width="28" height="8" rx="2" fill="#222"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 330 350" to="-360 330 350" dur="2s" repeatCount="indefinite"/>
      <rect x="316" y="346" width="28" height="8" rx="2" fill="#222"/>
    </g>
  </g>

  <!-- pelican tail and body -->
  <path d="M292,222 L255,245 L262,256 L300,248 Z" fill="#4a3d33"/>
  <ellipse cx="335" cy="215" rx="54" ry="38" fill="#7a6958" transform="rotate(-12 335 215)"/>
  <ellipse cx="350" cy="228" rx="36" ry="20" fill="#9a8a76" transform="rotate(-12 350 228)"/>

  <!-- neck -->
  <path d="M357,196 C385,190 366,160 396,138" fill="none" stroke="#5b4636" stroke-width="8" stroke-linecap="round"/>
  <path d="M368,206 C402,206 380,166 410,144" fill="none" stroke="#f4efe0" stroke-width="18" stroke-linecap="round"/>

  <!-- near leg -->
  <g transform="translate(335,250)" stroke="#2e2a28" stroke-width="9" stroke-linecap="round" fill="none">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
        values="-78.5;-62.1;-48.5;-41.4;-40.85;-44.8;-53.04;-66.7;-86.25;-102.3;-103.7;-93.7;-78.5"/>
      <line x1="0" y1="0" x2="0" y2="75"/>
      <circle cx="0" cy="75" r="4" fill="#2e2a28" stroke="none"/>
      <g transform="translate(0,75)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
            values="77.5;59.9;49.3;51.3;64.4;82.9;102.8;120.4;130.95;129.1;115.8;97.2;77.5"/>
          <line x1="0" y1="0" x2="0" y2="85"/>
          <path d="M-3,82 L26,88 L24,96 L-2,94 Z" fill="#4a4543" stroke="none"/>
        </g>
      </g>
    </g>
  </g>
  <ellipse cx="333" cy="246" rx="24" ry="16" fill="#7a6958"/>

  <!-- head and bill -->
  <circle cx="412" cy="132" r="17" fill="#f7f2e2"/>
  <path d="M398,128 Q412,108 430,124 Q414,120 398,128Z" fill="#f2d36b"/>
  <path d="M424,123 L520,148 Q525,152 517,154 L424,141 Z" fill="#8f8478"/>
  <path d="M428,138 Q470,176 515,154 L428,136 Z" fill="#c4a982"/>
  <circle cx="419" cy="128" r="4" fill="#fff"/>
  <circle cx="420" cy="128" r="2.3" fill="#111"/>

  <!-- wing reaching the handlebar -->
  <path d="M335,194 Q400,198 480,227 Q484,236 474,237 Q400,226 328,226 Z" fill="#54453a"/>
  <path d="M340,206 Q400,212 470,232" fill="none" stroke="#3a2f27" stroke-width="2"/>
  <path d="M338,214 Q400,220 466,235" fill="none" stroke="#3a2f27" stroke-width="2"/>
  <circle cx="474" cy="231" r="5" fill="#3a2f27"/>
</svg>