<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#fdf1d0"/>
    </linearGradient>
    <g id="spokes" stroke="#b8b8b8" stroke-width="1.5">
      <line x1="-73" y1="0" x2="73" y2="0"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(30)"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(60)"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(90)"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(120)"/>
      <line x1="-73" y1="0" x2="73" y2="0" transform="rotate(150)"/>
      <circle cx="66" cy="0" r="4" fill="#e74c3c" stroke="none"/>
      <circle cx="-66" cy="0" r="3" fill="#f1c40f" stroke="none"/>
    </g>
  </defs>

  <rect width="800" height="560" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="40" fill="#ffe27a" opacity="0.9"/>
  <path d="M0 470 Q150 440 300 470 T600 465 T800 470 L800 560 L0 560Z" fill="#cfe8c4"/>
  <rect x="0" y="506" width="800" height="54" fill="#8c7b6a"/>
  <line x1="0" y1="506" x2="800" y2="506" stroke="#5e5144" stroke-width="3"/>
  <line x1="0" y1="526" x2="800" y2="526" stroke="#e8dccb" stroke-width="4" stroke-dasharray="50 50">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="0.4s" repeatCount="indefinite"/>
  </line>

  <!-- Rear wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 250 420" to="360 250 420" dur="2s" repeatCount="indefinite"/>
    <circle cx="250" cy="420" r="80" fill="none" stroke="#2b2b2b" stroke-width="6"/>
    <circle cx="250" cy="420" r="73" fill="none" stroke="#c9c9c9" stroke-width="2"/>
    <use href="#spokes" x="250" y="420"/>
    <circle cx="250" cy="420" r="7" fill="#555"/>
  </g>
  <!-- Front wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 570 420" to="360 570 420" dur="2s" repeatCount="indefinite"/>
    <circle cx="570" cy="420" r="80" fill="none" stroke="#2b2b2b" stroke-width="6"/>
    <circle cx="570" cy="420" r="73" fill="none" stroke="#c9c9c9" stroke-width="2"/>
    <use href="#spokes" x="570" y="420"/>
    <circle cx="570" cy="420" r="7" fill="#555"/>
  </g>

  <!-- Far crank, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 390 425" to="540 390 425" dur="1.6s" repeatCount="indefinite"/>
    <line x1="390" y1="425" x2="430" y2="425" stroke="#666" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 430 425" to="-540 430 425" dur="1.6s" repeatCount="indefinite"/>
      <rect x="418" y="432" width="26" height="5" rx="2" fill="#222"/>
      <path d="M424 421 L446 421 Q458 425 460 430 L452 428 L458 434 L420 432 Z" fill="#45413c"/>
    </g>
  </g>

  <!-- Far leg -->
  <path fill="none" stroke="#2e2a27" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
        d="M352 292 L415 360 L350 425">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="M352 292 L415 360 L350 425;M352 292 L432 337 L362 397;M352 292 L442 309 L390 385;M352 292 L443 308 L418 397;M352 292 L434 333 L430 425;M352 292 L412 362 L418 453;M352 292 L395 373 L390 465;M352 292 L401 370 L362 453;M352 292 L415 360 L350 425"/>
  </path>

  <!-- Frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 420 L390 425"/>
    <path d="M390 425 L346 302"/>
    <path d="M250 420 L353 322"/>
    <path d="M353 322 L520 324"/>
    <path d="M390 425 L526 342"/>
    <path d="M518 312 L528 345" stroke-width="8"/>
    <path d="M526 340 Q545 385 570 420" stroke="#a93226"/>
    <path d="M518 312 L514 296" stroke="#444"/>
    <path d="M504 297 L522 295 Q548 291 550 313" stroke="#333" stroke-width="5"/>
  </g>
  <path d="M322 298 Q342 289 374 296 L374 302 Q346 307 322 303 Z" fill="#2d1f17"/>

  <!-- Chain and rear cog -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="390" y1="407" x2="250" y2="412"/>
    <line x1="390" y1="443" x2="250" y2="428"/>
    <circle cx="250" cy="420" r="8" stroke="#777" stroke-width="3"/>
  </g>
  <circle cx="390" cy="425" r="6" fill="#444"/>

  <!-- Near crank, chainring, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 425" to="360 390 425" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="390" cy="425" r="18" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="4 3"/>
    <line x1="390" y1="425" x2="430" y2="425" stroke="#999" stroke-width="7" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 430 425" to="-360 430 425" dur="1.6s" repeatCount="indefinite"/>
      <rect x="418" y="432" width="26" height="5" rx="2" fill="#222"/>
      <path d="M424 421 L446 421 Q458 425 460 430 L452 428 L458 434 L420 432 Z" fill="#5a554f"/>
    </g>
  </g>

  <!-- Near leg -->
  <path fill="none" stroke="#4a4440" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
        d="M352 292 L434 333 L430 425">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="M352 292 L434 333 L430 425;M352 292 L412 362 L418 453;M352 292 L395 373 L390 465;M352 292 L401 370 L362 453;M352 292 L415 360 L350 425;M352 292 L432 337 L362 397;M352 292 L442 309 L390 385;M352 292 L443 308 L418 397;M352 292 L434 333 L430 425"/>
  </path>

  <!-- Pelican -->
  <path d="M292 255 L246 284 L256 297 L302 282 Z" fill="#43372e"/>
  <path d="M252 288 L286 276 M258 295 L292 281" stroke="#2c231c" stroke-width="2"/>
  <ellipse cx="352" cy="260" rx="68" ry="40" fill="#6e5c4b"/>
  <ellipse cx="372" cy="270" rx="46" ry="26" fill="#8b7a68"/>

  <path d="M398 248 C438 238 402 200 444 180" fill="none" stroke="#5b3a24" stroke-width="26" stroke-linecap="round"/>
  <path d="M402 246 C440 236 408 202 450 182" fill="none" stroke="#f1ebdc" stroke-width="16" stroke-linecap="round"/>

  <ellipse cx="454" cy="172" rx="25" ry="18" fill="#f6f1e2"/>
  <ellipse cx="449" cy="160" rx="17" ry="8" fill="#f2d36b"/>
  <path d="M472 164 L580 196 Q583 201 575 201 L472 181 Z" fill="#8d8a80"/>
  <path d="M576 196 Q584 197 580 204 L572 201 Z" fill="#c8793a"/>
  <path d="M474 181 Q522 224 573 202 L474 181 Z" fill="#c4a574" stroke="#8a7350" stroke-width="1.5"/>
  <circle cx="464" cy="168" r="4.5" fill="#fff"/>
  <circle cx="465" cy="168" r="3" fill="#111"/>

  <path d="M378 232 Q440 232 500 268 L548 296 L538 310 Q470 298 402 288 Q366 268 378 232 Z" fill="#5d4a3a" stroke="#3b2d22" stroke-width="2"/>
  <path d="M400 250 Q450 255 505 285 M398 264 Q445 272 495 296 M392 276 Q430 284 470 298" fill="none" stroke="#3b2d22" stroke-width="2"/>
  <path d="M520 284 L548 296 L538 310 L512 300 Z" fill="#3b2d22"/>
  <circle cx="545" cy="302" r="6" fill="#222"/>
</svg>