<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#fdf1d6"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#9aa3ab" stroke-width="2"/>
      <g stroke="#cfd4d8" stroke-width="1.3">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(22.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(45)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(67.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(112.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(135)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(157.5)"/>
      </g>
      <line x1="0" y1="0" x2="0" y2="-62" stroke="#e74c3c" stroke-width="2"/>
      <circle cx="0" cy="-58" r="3.5" fill="#f39c12"/>
      <circle r="7" fill="#555" stroke="#bbb" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#fff3b0" opacity="0.9"/>

  <ellipse cx="400" cy="424" rx="230" ry="8" fill="#000" opacity="0.15"/>
  <line x1="0" y1="421" x2="800" y2="421" stroke="#8a7a5c" stroke-width="4" stroke-dasharray="30 30">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- Rear wheel -->
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g transform="translate(550,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Chain -->
  <g stroke="#444" stroke-width="2" fill="none">
    <line x1="370" y1="342" x2="250" y2="343"/>
    <line x1="370" y1="378" x2="250" y2="357"/>
  </g>
  <circle cx="250" cy="350" r="9" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="3 2"/>

  <!-- Frame -->
  <g stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="250" y1="350" x2="370" y2="360"/>
    <line x1="250" y1="350" x2="350" y2="266"/>
    <line x1="370" y1="360" x2="348" y2="262"/>
    <line x1="350" y1="268" x2="496" y2="250"/>
    <line x1="370" y1="360" x2="503" y2="264"/>
    <line x1="492" y1="244" x2="506" y2="268"/>
    <line x1="506" y1="268" x2="550" y2="350"/>
  </g>
  <g stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="492" y1="244" x2="500" y2="230"/>
    <path d="M500,230 L518,230 Q528,230 528,242 Q528,252 518,252"/>
    <line x1="348" y1="262" x2="348" y2="256"/>
  </g>

  <!-- Saddle -->
  <path d="M322,255 Q345,246 376,255 L374,262 Q346,262 324,262 Z" fill="#2b2b2b"/>

  <!-- Crank, chainring, pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 370 360" to="360 370 360" dur="2s" repeatCount="indefinite"/>
    <circle cx="370" cy="360" r="18" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="3 2"/>
    <line x1="335" y1="360" x2="405" y2="360" stroke="#9a9a9a" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(405,360)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-8" y="3" width="24" height="5" rx="2" fill="#222"/>
      </g>
    </g>
    <g transform="translate(335,360)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-8" y="3" width="24" height="5" rx="2" fill="#222"/>
      </g>
    </g>
    <circle cx="370" cy="360" r="6" fill="#444"/>
  </g>

  <!-- Far leg -->
  <path fill="none" stroke="#2f2822" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
        d="M345,250 L404.3,310.8 L335,360 L349,360">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M345,250 L404.3,310.8 L335,360 L349,360;
      M345,250 L413.5,300.3 L339.7,342.5 L353.7,342.5;
      M345,250 L423.4,282.8 L352.5,329.7 L366.5,329.7;
      M345,250 L428.9,263.7 L370,325 L384,325;
      M345,250 L429.9,256 L387.5,329.7 L401.5,329.7;
      M345,250 L429,262.5 L400.3,342.5 L414.3,342.5;
      M345,250 L425.4,277.5 L405,360 L419,360;
      M345,250 L417.5,294.3 L400.3,377.5 L414.3,377.5;
      M345,250 L407.4,307.7 L387.5,390.3 L401.5,390.3;
      M345,250 L399.5,315.3 L370,395 L384,395;
      M345,250 L396.6,317.6 L352.5,390.3 L366.5,390.3;
      M345,250 L398.5,316.1 L339.7,377.5 L353.7,377.5;
      M345,250 L404.3,310.8 L335,360 L349,360"/>
  </path>

  <!-- Near leg -->
  <path fill="none" stroke="#4a3f35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M345,250 L425.4,277.5 L405,360 L419,360">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M345,250 L425.4,277.5 L405,360 L419,360;
      M345,250 L417.5,294.3 L400.3,377.5 L414.3,377.5;
      M345,250 L407.4,307.7 L387.5,390.3 L401.5,390.3;
      M345,250 L399.5,315.3 L370,395 L384,395;
      M345,250 L396.6,317.6 L352.5,390.3 L366.5,390.3;
      M345,250 L398.5,316.1 L339.7,377.5 L353.7,377.5;
      M345,250 L404.3,310.8 L335,360 L349,360;
      M345,250 L413.5,300.3 L339.7,342.5 L353.7,342.5;
      M345,250 L423.4,282.8 L352.5,329.7 L366.5,329.7;
      M345,250 L428.9,263.7 L370,325 L384,325;
      M345,250 L429.9,256 L387.5,329.7 L401.5,329.7;
      M345,250 L429,262.5 L400.3,342.5 L414.3,342.5;
      M345,250 L425.4,277.5 L405,360 L419,360"/>
  </path>

  <!-- Pelican tail -->
  <polygon points="292,226 258,246 262,256 296,248" fill="#4a3d31"/>

  <!-- Pelican body -->
  <ellipse cx="335" cy="222" rx="52" ry="34" fill="#7a6a58" transform="rotate(-8 335 222)"/>
  <ellipse cx="362" cy="232" rx="26" ry="20" fill="#9a8a76" opacity="0.7"/>

  <!-- Wing reaching to handlebar -->
  <path d="M318,204 C350,190 430,208 514,228 L516,236 C440,230 372,242 322,250 Z" fill="#5a4a3c"/>
  <path d="M340,214 C390,212 440,222 500,232" fill="none" stroke="#3f3329" stroke-width="2"/>
  <path d="M338,228 C390,226 440,232 505,236" fill="none" stroke="#3f3329" stroke-width="2"/>

  <!-- Neck -->
  <path d="M360,220 C368,192 395,212 418,176" fill="none" stroke="#f6f1e8" stroke-width="20" stroke-linecap="round"/>
  <path d="M352,214 C360,186 388,204 409,170" fill="none" stroke="#6b4a2b" stroke-width="5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="425" cy="170" r="16" fill="#f8f4ec"/>
  <ellipse cx="421" cy="157" rx="10" ry="5" fill="#f2d56b"/>
  <path d="M410,165 Q408,178 416,184 Q410,176 413,166 Z" fill="#6b4a2b"/>
  <circle cx="432" cy="166" r="2.8" fill="#111"/>

  <!-- Bill and pouch -->
  <path d="M438,168 Q480,170 520,184 Q526,188 516,190 Q480,186 438,177 Z" fill="#c9b48a"/>
  <path d="M438,177 Q478,208 516,190 Q480,186 438,177 Z" fill="#8f7f62"/>
  <circle cx="520" cy="186" r="2.5" fill="#e67e22"/>
</svg>