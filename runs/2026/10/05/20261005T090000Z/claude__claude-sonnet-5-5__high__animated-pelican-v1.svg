<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec9f0"/>
      <stop offset="1" stop-color="#e6f5fc"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#8d939a" stroke-width="1.2">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(22.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(45)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(67.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(112.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(135)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="6" fill="#444"/>
      <rect x="-1.5" y="-62" width="3" height="9" fill="#d62828"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#ffe27a"/>

  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-200 0;1000 0" dur="46s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="70" rx="40" ry="13"/>
      <ellipse cx="25" cy="60" rx="26" ry="14"/>
      <ellipse cx="-24" cy="62" rx="22" ry="11"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-200 0;1000 0" dur="46s" begin="-23s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="130" rx="46" ry="14"/>
      <ellipse cx="28" cy="120" rx="28" ry="15"/>
      <ellipse cx="-26" cy="122" rx="24" ry="12"/>
    </g>
  </g>

  <rect x="0" y="421" width="800" height="59" fill="#6f6f73"/>
  <rect x="0" y="421" width="800" height="4" fill="#4d4d51"/>

  <!-- Rear wheel -->
  <g transform="translate(235 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <!-- Front wheel -->
  <g transform="translate(545 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Far side: leg, crank, pedal -->
  <path fill="none" stroke="#2f2f33" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M370,258 L417.1,316.4 L350,350">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="M370,258 L417.1,316.4 L350,350;M370,258 L433.1,298.6 L361.7,321.7;M370,258 L444.9,259 L390,310;M370,258 L444.8,251.5 L418.3,321.7;M370,258 L442.8,276.1 L430,350;M370,258 L429.3,304 L418.3,378.3;M370,258 L413.7,318.9 L390,390;M370,258 L410.4,321.2 L361.7,378.3;M370,258 L417.1,316.4 L350,350"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 390 350" to="540 390 350" dur="1.6s" repeatCount="indefinite"/>
    <line x1="390" y1="350" x2="430" y2="350" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(430 350)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="1.6s" repeatCount="indefinite"/>
        <rect x="-11" y="-2" width="22" height="5" rx="2" fill="#222"/>
        <path d="M-9,-8 L9,-8 Q15,-5 13,-2 L-9,-2 Z" fill="#2f2f33"/>
      </g>
    </g>
  </g>

  <!-- Frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390,350 L352,270"/>
    <path d="M352,270 L500,262"/>
    <path d="M390,350 L506,278"/>
    <path d="M352,272 L235,350"/>
    <path d="M390,350 L235,350"/>
    <path d="M497,250 L509,281" stroke-width="7"/>
  </g>
  <path d="M509,281 L545,350" fill="none" stroke="#444" stroke-width="5" stroke-linecap="round"/>

  <!-- Seatpost and saddle -->
  <line x1="346" y1="258" x2="352" y2="272" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M326,256 Q345,249 378,253 Q382,260 370,262 Q345,263 326,260 Z" fill="#222"/>

  <!-- Handlebar -->
  <line x1="498" y1="252" x2="493" y2="232" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <path d="M493,232 L515,229 Q532,230 530,246" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>

  <!-- Chain and rear cog -->
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M390,328 L235,339"/>
    <path d="M390,372 L235,361"/>
  </g>
  <g transform="translate(235 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      <circle r="11" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="4 2"/>
    </g>
  </g>
  <circle cx="390" cy="350" r="7" fill="#333"/>

  <!-- Pelican: tail, body -->
  <path d="M305,226 L262,244 L268,254 L310,244 Z" fill="#5d4e42"/>
  <ellipse cx="350" cy="228" rx="54" ry="32" fill="#8c7b6b" transform="rotate(-8 350 228)"/>
  <path d="M312,236 Q350,258 392,236 Q350,250 312,236 Z" fill="#b5a794" opacity="0.7"/>

  <!-- Neck -->
  <path d="M388,222 C410,214 395,182 418,168" fill="none" stroke="#f4efe2" stroke-width="16" stroke-linecap="round"/>
  <path d="M382,216 C402,206 388,180 410,166" fill="none" stroke="#4a3b30" stroke-width="5" stroke-linecap="round"/>

  <!-- Head and bill -->
  <path d="M434,168 Q470,204 503,188 L434,160 Z" fill="#c9a98a" stroke="#8a6c52" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M432,153 L505,184 Q508,188 503,188 L434,166 Z" fill="#8f979e" stroke="#5f666c" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="424" cy="162" r="13" fill="#f7f3e8"/>
  <path d="M412,158 Q422,142 438,154 Q426,150 412,158 Z" fill="#f2c94c"/>
  <circle cx="429" cy="159" r="3" fill="#111"/>
  <circle cx="430" cy="158" r="1" fill="#fff"/>

  <!-- Wing reaching to handlebar -->
  <path d="M352,208 C400,200 470,212 514,227 L513,235 C470,234 410,246 356,244 C340,235 340,220 352,208 Z" fill="#6e5d4f" stroke="#4d3f35" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#4d3f35" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M380,214 C420,214 460,222 496,230"/>
    <path d="M376,228 C420,228 460,232 500,234"/>
  </g>

  <!-- Near side: leg, crank, chainring, pedal -->
  <path fill="none" stroke="#454549" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M370,258 L442.8,276.1 L430,350">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="M370,258 L442.8,276.1 L430,350;M370,258 L429.3,304 L418.3,378.3;M370,258 L413.7,318.9 L390,390;M370,258 L410.4,321.2 L361.7,378.3;M370,258 L417.1,316.4 L350,350;M370,258 L433.1,298.6 L361.7,321.7;M370,258 L444.9,259 L390,310;M370,258 L444.8,251.5 L418.3,321.7;M370,258 L442.8,276.1 L430,350"/>
  </path>
  <circle cx="370" cy="258" r="6" fill="#454549"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 350" to="360 390 350" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="390" cy="350" r="22" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="5 2"/>
    <line x1="390" y1="350" x2="430" y2="350" stroke="#777" stroke-width="6" stroke-linecap="round"/>
    <circle cx="390" cy="350" r="5" fill="#333"/>
    <g transform="translate(430 350)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
        <rect x="-11" y="-2" width="22" height="5" rx="2" fill="#222"/>
        <path d="M-9,-8 L9,-8 Q15,-5 13,-2 L-9,-2 Z" fill="#454549"/>
      </g>
    </g>
  </g>
</svg>