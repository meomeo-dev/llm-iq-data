<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f0"/>
      <stop offset="1" stop-color="#e6f5fb"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="40" ry="12" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="-20" cy="-8" rx="22" ry="14" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="15" cy="-12" rx="26" ry="16" fill="#ffffff" opacity="0.85"/>
    </g>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#1d1d1d" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#bfc5cc" stroke-width="2"/>
      <g stroke="#9aa3ad" stroke-width="1.2">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(22.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(45)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(67.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(112.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(135)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#666666"/>
      <circle cx="0" cy="-57" r="3.5" fill="#e74c3c"/>
      <circle cx="57" cy="0" r="3" fill="#f5b041"/>
    </g>
  </defs>

  <!-- Sky and scenery -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="24s" repeatCount="indefinite"/>
    <use href="#cloud" transform="translate(100,80)"/>
    <use href="#cloud" transform="translate(500,55)"/>
    <use href="#cloud" transform="translate(900,90)"/>
  </g>
  <path d="M0,422 L0,372 Q120,330 240,372 Q360,320 480,368 Q620,325 800,375 L800,422 Z" fill="#9bbf8e" opacity="0.8"/>

  <!-- Road -->
  <rect x="0" y="422" width="800" height="78" fill="#6b6f76"/>
  <line x1="0" y1="422" x2="800" y2="422" stroke="#4d5056" stroke-width="3"/>
  <line x1="0" y1="466" x2="800" y2="466" stroke="#f4f4f4" stroke-width="5" stroke-dasharray="60 40">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="0.25s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="425" rx="210" ry="6" fill="#000000" opacity="0.25"/>

  <!-- Far leg (behind frame) -->
  <path d="M345,250 L397.6,299.2 L352,355" fill="none" stroke="#5a5550" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M345,250 L397.6,299.2 L352,355;
              M345,250 L409.2,282.5 L360.2,335.2;
              M345,250 L415.5,264.4 L380,327;
              M345,250 L415.5,264.9 L399.8,335.2;
              M345,250 L409,283 L408,355;
              M345,250 L393.6,303.1 L399.8,374.8;
              M345,250 L383.2,311.1 L380,383;
              M345,250 L387.5,308.2 L360.2,374.8;
              M345,250 L397.6,299.2 L352,355"/>
  </path>

  <!-- Far crank and pedal -->
  <g transform="translate(380,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="28" y2="0" stroke="#6f7b87" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(28,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="4" width="22" height="4" rx="1.5" fill="#1c1c1c"/>
          <polygon points="-5,-3 4,-3 16,2 16,4 -5,4" fill="#4a4540"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Rear wheel -->
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="10" fill="none" stroke="#555555" stroke-width="3" stroke-dasharray="3 2"/>
    </g>
  </g>

  <!-- Chain -->
  <line x1="380" y1="339" x2="250" y2="343" stroke="#3a3a3a" stroke-width="3" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.111s" repeatCount="indefinite"/>
  </line>
  <line x1="250" y1="357" x2="380" y2="371" stroke="#3a3a3a" stroke-width="3" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.111s" repeatCount="indefinite"/>
  </line>

  <!-- Frame -->
  <g fill="none" stroke="#2a6f97" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="380" y1="355" x2="342" y2="264"/>
    <line x1="380" y1="355" x2="516" y2="258"/>
    <line x1="342" y1="264" x2="512" y2="246"/>
    <line x1="380" y1="355" x2="250" y2="350"/>
    <line x1="342" y1="264" x2="250" y2="350"/>
    <line x1="511" y1="240" x2="518" y2="262" stroke-width="8"/>
    <line x1="518" y1="262" x2="550" y2="350"/>
  </g>
  <!-- Seat post and saddle -->
  <line x1="342" y1="264" x2="339" y2="250" stroke="#444444" stroke-width="5" stroke-linecap="round"/>
  <path d="M312,250 Q320,242 345,244 L366,246 Q374,250 362,253 L318,255 Z" fill="#3b2a20"/>
  <!-- Stem and handlebar -->
  <line x1="511" y1="240" x2="508" y2="224" stroke="#444444" stroke-width="5" stroke-linecap="round"/>
  <path d="M498,222 Q522,213 542,225" fill="none" stroke="#333333" stroke-width="5" stroke-linecap="round"/>
  <path d="M530,219 Q537,220 542,225" fill="none" stroke="#111111" stroke-width="8" stroke-linecap="round"/>

  <!-- Pelican tail and body -->
  <path d="M296,222 L240,246 L252,257 L298,242 Z" fill="#4e3e31"/>
  <ellipse cx="335" cy="212" rx="54" ry="36" transform="rotate(-20 335 212)" fill="#7c6652"/>
  <ellipse cx="352" cy="220" rx="30" ry="22" transform="rotate(-20 352 220)" fill="#a28d78" opacity="0.7"/>
  <ellipse cx="318" cy="204" rx="30" ry="15" transform="rotate(-20 318 204)" fill="#5d4a3a" opacity="0.8"/>
  <path d="M300,215 Q315,225 332,222 M308,226 Q322,236 340,232" fill="none" stroke="#5d4a3a" stroke-width="2" opacity="0.7"/>

  <!-- Neck, head, bill (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="1s" repeatCount="indefinite"/>
    <path d="M372,200 C392,185 380,165 400,152" fill="none" stroke="#4b3425" stroke-width="22" stroke-linecap="round"/>
    <path d="M376,202 C396,187 384,167 404,154" fill="none" stroke="#f7f3ea" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="412" cy="142" rx="17" ry="13" fill="#f7f3ea"/>
    <path d="M397,138 Q404,124 420,128 Q428,131 429,137 Q414,130 397,138 Z" fill="#f0d24f"/>
    <path d="M430,150 L502,165 Q470,196 436,160 Z" fill="#8f8571" stroke="#6e6455" stroke-width="1"/>
    <path d="M426,134 L506,158 Q510,162 504,164 L428,150 Z" fill="#a39682"/>
    <path d="M498,157 L508,160 Q511,166 503,165 L496,163 Z" fill="#5e5244"/>
    <circle cx="421" cy="139" r="4.5" fill="#e8dfb0"/>
    <circle cx="421.5" cy="139" r="2.2" fill="#2b2118"/>
  </g>

  <!-- Wing reaching to the handlebar -->
  <path d="M352,198 Q430,240 531,221" fill="none" stroke="#5d4a3a" stroke-width="15" stroke-linecap="round"/>
  <path d="M360,208 Q430,247 520,229" fill="none" stroke="#7a634f" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M530,214 L542,222 L532,228 Z" fill="#3f3228"/>

  <!-- Near leg -->
  <path d="M345,250 L409,283 L408,355" fill="none" stroke="#3d3a37" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M345,250 L409,283 L408,355;
              M345,250 L393.6,303.1 L399.8,374.8;
              M345,250 L383.2,311.1 L380,383;
              M345,250 L387.5,308.2 L360.2,374.8;
              M345,250 L397.6,299.2 L352,355;
              M345,250 L409.2,282.5 L360.2,335.2;
              M345,250 L415.5,264.4 L380,327;
              M345,250 L415.5,264.9 L399.8,335.2;
              M345,250 L409,283 L408,355"/>
  </path>

  <!-- Bottom bracket, chainring, near crank and pedal -->
  <circle cx="380" cy="355" r="7" fill="#333333"/>
  <g transform="translate(380,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#555555" stroke-width="3" stroke-dasharray="3 2"/>
      <line x1="0" y1="0" x2="28" y2="0" stroke="#8d99a6" stroke-width="6" stroke-linecap="round"/>
      <circle r="4" fill="#222222"/>
      <g transform="translate(28,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="4" width="22" height="4" rx="1.5" fill="#1c1c1c"/>
          <polygon points="-5,-3 4,-3 16,2 16,4 -5,4" fill="#3d3a37"/>
          <line x1="6" y1="-1" x2="15" y2="3" stroke="#6b645c" stroke-width="0.8"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Front wheel -->
  <g transform="translate(550,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
</svg>