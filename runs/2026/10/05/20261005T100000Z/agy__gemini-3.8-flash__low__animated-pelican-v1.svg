<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8e3" />
      <stop offset="60%" stop-color="#c5e3f6" />
      <stop offset="85%" stop-color="#fce4b8" />
      <stop offset="100%" stop-color="#fcd397" />
    </linearGradient>

    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="15%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dd6b20" />
      <stop offset="60%" stop-color="#ed8936" />
      <stop offset="100%" stop-color="#fbd38d" />
    </linearGradient>

    <linearGradient id="billUpper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#744210" />
      <stop offset="70%" stop-color="#b7791f" />
      <stop offset="100%" stop-color="#dd6b20" />
    </linearGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#319795" />
      <stop offset="50%" stop-color="#4fd1c5" />
      <stop offset="100%" stop-color="#234e52" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>

    <!-- Wheel Definition centered at (0,0) -->
    <g id="bicycle-wheel">
      <!-- Tire -->
      <circle cx="0" cy="0" r="115" fill="none" stroke="#1a202c" stroke-width="16" />
      <!-- Rim -->
      <circle cx="0" cy="0" r="107" fill="none" stroke="url(#rimGrad)" stroke-width="6" />
      <circle cx="0" cy="0" r="103" fill="none" stroke="#2d3748" stroke-width="2" />
      <!-- Spokes (16 spokes for distinct visible rotation) -->
      <g stroke="#cbd5e0" stroke-width="1.8" opacity="0.85">
        <line x1="-103" y1="0" x2="103" y2="0" />
        <line x1="0" y1="-103" x2="0" y2="103" />
        <line x1="-72.8" y1="-72.8" x2="72.8" y2="72.8" />
        <line x1="-72.8" y1="72.8" x2="72.8" y2="-72.8" />
        <line x1="-95.1" y1="-39.4" x2="95.1" y2="39.4" />
        <line x1="-39.4" y1="-95.1" x2="39.4" y2="95.1" />
        <line x1="-95.1" y1="39.4" x2="95.1" y2="-39.4" />
        <line x1="-39.4" y1="95.1" x2="39.4" y2="-95.1" />
      </g>
      <!-- Hub -->
      <circle cx="0" cy="0" r="14" fill="#4a5568" />
      <circle cx="0" cy="0" r="7" fill="#edf2f7" />
    </g>

    <style><![CDATA[
      /* Continuous animations */
      .spin-wheel {
        animation: rotateCW 1.5s linear infinite;
      }
      .pedal-system {
        animation: rotateCW 1.5s linear infinite;
        transform-origin: 470px 530px;
      }
      .counter-rotate {
        animation: rotateCCW 1.5s linear infinite;
      }
      .leg-left {
        animation: pumpLegLeft 1.5s ease-in-out infinite;
        transform-origin: 440px 385px;
      }
      .shin-left {
        animation: pumpShinLeft 1.5s ease-in-out infinite;
        transform-origin: 410px 455px;
      }
      .leg-right {
        animation: pumpLegRight 1.5s ease-in-out infinite;
        transform-origin: 440px 385px;
      }
      .shin-right {
        animation: pumpShinRight 1.5s ease-in-out infinite;
        transform-origin: 500px 470px;
      }
      .pelican-bob {
        animation: bobbing 0.75s ease-in-out infinite alternate;
      }
      .breeze-road {
        animation: dashRoad 0.5s linear infinite;
      }

      @keyframes rotateCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateCCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes bobbing {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-3px) rotate(0.4deg); }
      }
      @keyframes pumpLegLeft {
        0%   { transform: rotate(-10deg); }
        50%  { transform: rotate(18deg); }
        100% { transform: rotate(-10deg); }
      }
      @keyframes pumpShinLeft {
        0%   { transform: rotate(15deg); }
        50%  { transform: rotate(-12deg); }
        100% { transform: rotate(15deg); }
      }
      @keyframes pumpLegRight {
        0%   { transform: rotate(18deg); }
        50%  { transform: rotate(-10deg); }
        100% { transform: rotate(18deg); }
      }
      @keyframes pumpShinRight {
        0%   { transform: rotate(-12deg); }
        50%  { transform: rotate(15deg); }
        100% { transform: rotate(-12deg); }
      }
      @keyframes dashRoad {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 120; }
      }
    ]]></style>
  </defs>

  <!-- Background Environment -->
  <rect x="0" y="0" width="1000" height="700" fill="url(#skyGrad)" />
  
  <!-- Coastal Horizon details -->
  <path d="M0 460 Q 250 450 550 462 T 1000 458 L 1000 490 L 0 490 Z" fill="#68d391" opacity="0.3" />
  <path d="M0 480 Q 320 470 680 482 T 1000 478 L 1000 510 L 0 510 Z" fill="#e2e8f0" opacity="0.4" />
  
  <!-- Road Surface -->
  <rect x="0" y="500" width="1000" height="200" fill="url(#groundGrad)" />
  <!-- Road Speedlines (giving forward motion feeling) -->
  <line x1="0" y1="655" x2="1000" y2="655" stroke="#f6ad55" stroke-width="6" stroke-dasharray="60 60" class="breeze-road" />
  <line x1="0" y1="510" x2="1000" y2="510" stroke="#a0aec0" stroke-width="3" />

  <!-- Bicycle Shadow -->
  <ellipse cx="480" cy="640" rx="340" ry="18" fill="#171923" opacity="0.5" />

  <!-- ==================== FAR SIDE (LEFT) LEG & PEDAL ==================== -->
  <!-- Left Leg (Behind frame) -->
  <g opacity="0.75">
    <g class="leg-left">
      <!-- Thigh -->
      <path d="M 440 385 Q 420 420 410 455" stroke="#795548" stroke-width="22" stroke-linecap="round" fill="none" />
      <g class="shin-left">
        <!-- Shin / Tarsus -->
        <path d="M 410 455 L 435 565" stroke="#8d6e63" stroke-width="12" stroke-linecap="round" fill="none" />
        <!-- Webbed Foot -->
        <polygon points="435,565 410,580 465,582 455,565" fill="#5d4037" />
      </g>
    </g>
  </g>

  <!-- Far-side Crank & Pedal (180 deg out of phase from main side) -->
  <g class="pedal-system">
    <g id="crank-far">
      <!-- Arm pointing to (425, 485) initially -->
      <line x1="470" y1="530" x2="435" y2="485" stroke="#718096" stroke-width="9" stroke-linecap="round" />
      <!-- Far Pedal Spindle -->
      <g transform="translate(435, 485)">
        <g class="counter-rotate">
          <!-- Far pedal body kept horizontal -->
          <rect x="-16" y="-6" width="32" height="10" rx="3" fill="#2d3748" />
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== BICYCLE WHEELS ==================== -->
  <!-- Rear Wheel (Axle at 250, 530) -->
  <g transform="translate(250, 530)">
    <g class="spin-wheel">
      <use href="#bicycle-wheel" />
    </g>
  </g>

  <!-- Front Wheel (Axle at 720, 530) -->
  <g transform="translate(720, 530)">
    <g class="spin-wheel">
      <use href="#bicycle-wheel" />
    </g>
  </g>

  <!-- ==================== BICYCLE FRAMEWORK ==================== -->
  <g id="bicycle-frame">
    <!-- Rear Dropouts to Seat & Chainstays -->
    <!-- Chain Stay (Rear Axle 250,530 to BB 470,530) -->
    <line x1="250" y1="530" x2="470" y2="530" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Seat Stay (Rear Axle 250,530 to Seat Cluster 390,360) -->
    <line x1="250" y1="530" x2="390" y2="360" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Drive Chain & Cassette -->
    <circle cx="250" cy="530" r="22" fill="#718096" stroke="#4a5568" stroke-width="3" />
    <path d="M 250 512 L 470 500 A 32 32 0 0 1 470 560 L 250 548 Z" fill="none" stroke="#2d3748" stroke-width="5" stroke-dasharray="8 3" />

    <!-- Main Diamond Frame -->
    <!-- Seat Tube (Bottom Bracket 470,530 to Seat Cluster 390,360) -->
    <line x1="470" y1="530" x2="390" y2="360" stroke="url(#frameGrad)" stroke-width="15" stroke-linecap="round" />
    <!-- Down Tube (Bottom Bracket 470,530 to Head Tube 630,340) -->
    <line x1="470" y1="530" x2="630" y2="340" stroke="url(#frameGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Top Tube (Seat Cluster 390,360 to Head Tube 620,330) -->
    <line x1="390" y1="360" x2="620" y2="330" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Head Tube -->
    <line x1="610" y1="310" x2="635" y2="365" stroke="url(#frameGrad)" stroke-width="18" stroke-linecap="round" />

    <!-- Front Fork (Head tube to Front Axle 720, 530) -->
    <line x1="635" y1="360" x2="720" y2="530" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Seatpost & Saddle -->
    <line x1="390" y1="360" x2="375" y2="330" stroke="#cbd5e0" stroke-width="11" stroke-linecap="round" />
    <!-- Comfortable bicycle saddle shaped for pelican -->
    <path d="M 330 332 C 345 320, 395 320, 420 332 C 410 342, 385 342, 370 340 C 355 338, 335 344, 330 332 Z" fill="#1a202c" stroke="#2d3748" stroke-width="2" />

    <!-- Stem & Handlebars -->
    <!-- Stem -->
    <line x1="615" y1="315" x2="605" y2="270" stroke="#cbd5e0" stroke-width="11" stroke-linecap="round" />
    <line x1="605" y1="270" x2="635" y2="265" stroke="#cbd5e0" stroke-width="11" stroke-linecap="round" />
    <!-- Cruiser / Swept Handlebars -->
    <path d="M 635 265 C 665 265, 680 250, 665 240 C 650 230, 615 250, 595 260" fill="none" stroke="#a0aec0" stroke-width="9" stroke-linecap="round" />
    <!-- Hand Grips -->
    <path d="M 605 256 L 590 263" stroke="#2d3748" stroke-width="12" stroke-linecap="round" />

    <!-- Mudguards / Fenders -->
    <path d="M 180 500 A 125 125 0 0 1 310 435" fill="none" stroke="#234e52" stroke-width="7" />
    <path d="M 660 435 A 125 125 0 0 1 780 495" fill="none" stroke="#234e52" stroke-width="7" />
  </g>

  <!-- ==================== CALIFORNIA BROWN PELICAN ==================== -->
  <g id="pelican" class="pelican-bob">
    <!-- Tail Feathers -->
    <path d="M 310 335 C 280 345, 275 365, 290 380 C 315 375, 340 360, 355 345 Z" fill="#4a5568" stroke="#2d3748" stroke-width="2" />
    <path d="M 295 345 C 270 360, 270 375, 290 385" stroke="#2d3748" stroke-width="3" fill="none" />

    <!-- Torso / Body (Brown Pelican mottled plumage) -->
    <!-- Base Body -->
    <path d="M 335 340 C 330 280, 420 270, 465 310 C 500 340, 485 410, 425 415 C 370 420, 340 390, 335 340 Z" fill="#5c4d47" />
    <!-- Chest / Belly lighter plumage -->
    <path d="M 370 320 C 430 300, 470 335, 455 385 C 440 410, 385 415, 365 390 C 355 370, 355 335, 370 320 Z" fill="#6d5d55" />
    <path d="M 390 310 C 430 310, 450 340, 440 375 C 410 405, 380 385, 380 360 Z" fill="#4a3e39" opacity="0.6" />

    <!-- Pelican Folded Wing -->
    <!-- Wing Coverts -->
    <path d="M 360 325 C 380 295, 435 295, 455 335 C 430 380, 375 390, 340 365 C 335 350, 345 335, 360 325 Z" fill="#786c65" stroke="#3e3531" stroke-width="2" />
    <!-- Wing secondary / flight feathers streak patterns -->
    <path d="M 355 345 Q 405 350 440 338" stroke="#3e3531" stroke-width="2.5" fill="none" />
    <path d="M 345 360 Q 395 365 435 350" stroke="#3e3531" stroke-width="2.5" fill="none" />
    <path d="M 355 372 Q 390 375 425 365" stroke="#3e3531" stroke-width="2.5" fill="none" />

    <!-- Pelican Neck (S-curved characteristic of Pelecanus occidentalis) -->
    <!-- Hindneck (rich chestnut brown / mahogany in breeding plumage) -->
    <path d="M 435 315 C 455 270, 475 210, 440 160 C 470 165, 495 215, 470 280 C 465 295, 455 310, 445 320 Z" fill="#3b261d" />
    <!-- Foreneck (silky white/cream stripe leading to crown) -->
    <path d="M 425 305 C 445 260, 460 210, 430 165 C 440 160, 460 170, 465 210 C 470 250, 450 295, 435 315 Z" fill="#f7fafc" />

    <!-- Head & Crown (Pale yellow / straw crest of California brown pelican) -->
    <path d="M 420 165 C 420 120, 470 120, 475 155 C 480 180, 430 185, 420 165 Z" fill="#fefcbf" stroke="#ecc94b" stroke-width="1.5" />
    <!-- Nape Feathers/Tuft -->
    <path d="M 425 150 C 410 150, 405 165, 415 175 C 420 168, 425 160, 425 150 Z" fill="#fefcbf" />

    <!-- Eye Patch & Eye -->
    <path d="M 450 148 C 455 142, 468 142, 470 150 C 468 158, 455 156, 450 148 Z" fill="#c53030" opacity="0.7" /> <!-- Reddish bare skin around eye in breeding season -->
    <circle cx="460" cy="148" r="5" fill="#edf2f7" />
    <circle cx="460" cy="148" r="3" fill="#1a202c" />
    <circle cx="461" cy="146.5" r="1" fill="#ffffff" />

    <!-- Massive Bill & Gular Pouch -->
    <!-- Upper Beak (Maxilla) straight, long with hook tip -->
    <path d="M 470 150 L 650 190 C 665 194, 665 204, 650 205 L 475 175 Z" fill="url(#billUpper)" stroke="#744210" stroke-width="2" />
    <!-- Nail / Hook on upper beak -->
    <path d="M 648 190 Q 662 196 652 208 Q 644 198 648 190 Z" fill="#c53030" />

    <!-- Gular Pouch (Flexible throat skin with vibrant breeding colors) -->
    <path d="M 465 175 C 500 240, 580 255, 635 204 C 550 230, 495 210, 465 175 Z" fill="url(#pouchGrad)" stroke="#c05621" stroke-width="1.5" />
    <path d="M 480 185 Q 545 228 610 206" stroke="#dd6b20" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Pelican Arms / Wings holding the Handlebar -->
    <!-- Wing shoulder extending down to grip at (595, 260) -->
    <path d="M 430 300 C 470 290, 530 260, 595 260" stroke="#5c4d47" stroke-width="22" stroke-linecap="round" fill="none" />
    <path d="M 440 305 C 480 295, 535 270, 595 260" stroke="#786c65" stroke-width="15" stroke-linecap="round" fill="none" />
    <!-- Wing primary feather tips curled gracefully around handlebar grip -->
    <path d="M 590 250 C 605 248, 612 265, 595 272 C 585 272, 582 258, 590 250 Z" fill="#2d3748" />
  </g>

  <!-- ==================== FOREGROUND (RIGHT) DRIVE, CRANK & LEG ==================== -->
  <!-- Bottom Bracket Spindle Center: (470, 530) -->
  <!-- Chainwheel / Large Sprocket -->
  <circle cx="470" cy="530" r="38" fill="url(#rimGrad)" stroke="#2d3748" stroke-width="3" />
  <circle cx="470" cy="530" r="28" fill="none" stroke="#1a202c" stroke-width="4" stroke-dasharray="6 4" />
  <circle cx="470" cy="530" r="12" fill="#2d3748" />

  <!-- Revolving Crankset & Pedal System -->
  <g class="pedal-system">
    <!-- Right Crank Arm (180 deg opposite of far crank) -->
    <!-- Center (470, 530) to initial pedal pivot at (505, 575) -->
    <line x1="470" y1="530" x2="505" y2="575" stroke="#cbd5e0" stroke-width="11" stroke-linecap="round" />
    <circle cx="470" cy="530" r="9" fill="#4a5568" />
    <circle cx="505" cy="575" r="6" fill="#4a5568" />

    <!-- Right Pedal (stays horizontal via counter-rotation) -->
    <g transform="translate(505, 575)">
      <g class="counter-rotate">
        <!-- Pedal platform -->
        <rect x="-18" y="-7" width="36" height="12" rx="3" fill="#1a202c" stroke="#4a5568" stroke-width="1.5" />
        <!-- Orange safety reflector -->
        <rect x="-12" y="-3" width="24" height="4" rx="1.5" fill="#ed8936" />
      </g>
    </g>
  </g>

  <!-- Near-Side Pelican Leg (Rigged with hip at 440,385 and synchronized pedal pumping) -->
  <g class="leg-right">
    <!-- Thigh (Femur section) -->
    <path d="M 440 385 C 470 425, 490 440, 500 470" stroke="#5d4037" stroke-width="26" stroke-linecap="round" fill="none" />
    <path d="M 440 385 C 465 420, 480 435, 495 465" stroke="#795548" stroke-width="18" stroke-linecap="round" fill="none" />
    
    <g class="shin-right">
      <!-- Shin / Lower leg (Tarsus) -->
      <path d="M 500 470 L 505 570" stroke="#8d6e63" stroke-width="13" stroke-linecap="round" fill="none" />
      <circle cx="500" cy="470" r="10" fill="#5d4037" />
      
      <!-- Big webbed foot resting planted firmly on the pedal -->
      <g transform="translate(505, 570)">
        <!-- Ankle joint -->
        <circle cx="0" cy="0" r="7" fill="#4e342e" />
        <!-- Webbing between toes -->
        <polygon points="0,0 -20,12 28,14 18,-2" fill="#5d4037" opacity="0.9" />
        <!-- 3 Prominent forward webbed toes -->
        <line x1="0" y1="0" x2="-22" y2="12" stroke="#3e2723" stroke-width="4.5" stroke-linecap="round" />
        <line x1="0" y1="0" x2="6" y2="15" stroke="#3e2723" stroke-width="4.5" stroke-linecap="round" />
        <line x1="0" y1="0" x2="28" y2="12" stroke="#3e2723" stroke-width="4.5" stroke-linecap="round" />
        <!-- Claws / Nails -->
        <circle cx="-22" cy="12" r="2" fill="#212121" />
        <circle cx="6" cy="15" r="2" fill="#212121" />
        <circle cx="28" cy="12" r="2" fill="#212121" />
      </g>
    </g>
  </g>

  <!-- Speed Dust / Wind Accent Lines -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <line x1="210" y1="635" x2="160" y2="635" stroke-dasharray="15 10" />
    <line x1="170" y1="645" x2="110" y2="645" stroke-dasharray="20 15" />
    <line x1="680" y1="638" x2="630" y2="638" stroke-dasharray="12 8" />
  </g>
</svg>