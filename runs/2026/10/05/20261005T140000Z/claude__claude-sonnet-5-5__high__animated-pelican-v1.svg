<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f5"/>
      <stop offset="1" stop-color="#f9e8c8"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="63" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#8a8a8a" stroke-width="1.2">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(30)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(60)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(120)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="7" fill="#555"/>
      <circle cx="0" cy="-66" r="3.5" fill="#ff9a1f"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="90" rx="50" ry="14"/>
    <ellipse cx="170" cy="78" rx="30" ry="12"/>
    <ellipse cx="520" cy="130" rx="44" ry="12"/>
    <ellipse cx="545" cy="120" rx="26" ry="10"/>
  </g>
  <rect x="0" y="420" width="800" height="60" fill="#d9c08f"/>
  <line x1="-130" y1="436" x2="930" y2="436" stroke="#a98f5c" stroke-width="5" stroke-dasharray="60 60">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.327s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="422" rx="190" ry="7" fill="#000" opacity="0.18"/>

  <!-- far crank, pedal, foot, leg -->
  <g transform="translate(385,362)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="1.5s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="26" y2="0" stroke="#4a4a4a" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(26,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="540" to="180" dur="1.5s" repeatCount="indefinite"/>
          <rect x="-8" y="1" width="16" height="4" rx="1.5" fill="#2b2b2b"/>
          <path d="M-4,-5 Q4,-7 14,0 L17,3 L-5,2 Z" fill="#b9732c"/>
        </g>
      </g>
    </g>
  </g>
  <path fill="none" stroke="#3f3228" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M358,258 L408,307 L359,357">
    <animate attributeName="d" dur="1.5s" repeatCount="indefinite" calcMode="linear" values="M358,258 L408,307 L359,357;M358,258 L415.4,298.1 L362.5,344;M358,258 L422.2,285.8 L372,334.5;M358,258 L426.1,274.3 L385,331;M358,258 L426.8,270.7 L398,334.5;M358,258 L425.6,276.3 L407.5,344;M358,258 L421.4,287.8 L411,357;M358,258 L413.8,300.3 L407.5,370;M358,258 L405,309.9 L398,379.5;M358,258 L399.2,314.5 L385,383;M358,258 L398.8,314.9 L372,379.5;M358,258 L402.1,312.3 L362.5,370;M358,258 L408,307 L359,357"/>
  </path>

  <!-- rear wheel -->
  <g transform="translate(260,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <!-- front wheel -->
  <g transform="translate(540,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="385" y1="362" x2="260" y2="350"/>
    <line x1="365" y1="285" x2="260" y2="350"/>
    <line x1="385" y1="362" x2="365" y2="285"/>
    <line x1="365" y1="285" x2="503" y2="268"/>
    <line x1="385" y1="362" x2="498" y2="290"/>
    <line x1="505" y1="262" x2="497" y2="292" stroke-width="8"/>
    <path d="M498,290 Q522,314 540,350" stroke="#8e2a20"/>
  </g>
  <!-- seatpost, saddle, stem, handlebar -->
  <line x1="365" y1="285" x2="358" y2="268" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M336,266 Q350,259 374,263 L380,268 Q356,273 336,269 Z" fill="#2b2b2b"/>
  <g fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="505" y1="262" x2="508" y2="247"/>
    <path d="M504,246 L526,244 Q537,244 537,256"/>
  </g>
  <circle cx="540" cy="350" r="5" fill="#777"/>
  <circle cx="260" cy="350" r="5" fill="#777"/>

  <!-- chain -->
  <g stroke="#3a3a3a" stroke-width="2" stroke-dasharray="3 2" fill="none">
    <line x1="385" y1="347" x2="260" y2="343"/>
    <line x1="385" y1="377" x2="260" y2="357"/>
  </g>
  <circle cx="260" cy="350" r="8" fill="none" stroke="#3a3a3a" stroke-width="3"/>

  <!-- near crank, chainring, pedal, foot -->
  <g transform="translate(385,362)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <circle r="15" fill="none" stroke="#3a3a3a" stroke-width="3"/>
      <line x1="-13" y1="0" x2="13" y2="0" stroke="#666" stroke-width="2"/>
      <line x1="0" y1="-13" x2="0" y2="13" stroke="#666" stroke-width="2"/>
      <line x1="0" y1="0" x2="26" y2="0" stroke="#6a6a6a" stroke-width="6" stroke-linecap="round"/>
      <circle r="4" fill="#222"/>
      <g transform="translate(26,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.5s" repeatCount="indefinite"/>
          <rect x="-8" y="1" width="16" height="4" rx="1.5" fill="#1f1f1f"/>
          <path d="M-4,-5 Q4,-7 14,0 L17,3 L-5,2 Z" fill="#e0953e"/>
          <path d="M10,-1 L17,3 M12,-2 L18,0" stroke="#b9732c" stroke-width="1" fill="none"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#5c4a3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M358,258 L421.4,287.8 L411,357">
    <animate attributeName="d" dur="1.5s" repeatCount="indefinite" calcMode="linear" values="M358,258 L421.4,287.8 L411,357;M358,258 L413.8,300.3 L407.5,370;M358,258 L405,309.9 L398,379.5;M358,258 L399.2,314.5 L385,383;M358,258 L398.8,314.9 L372,379.5;M358,258 L402.1,312.3 L362.5,370;M358,258 L408,307 L359,357;M358,258 L415.4,298.1 L362.5,344;M358,258 L422.2,285.8 L372,334.5;M358,258 L426.1,274.3 L385,331;M358,258 L426.8,270.7 L398,334.5;M358,258 L425.6,276.3 L407.5,344;M358,258 L421.4,287.8 L411,357"/>
  </path>

  <!-- pelican: tail, body -->
  <path d="M308,232 L266,246 L270,256 L312,250 Z" fill="#4a3a2d"/>
  <ellipse cx="350" cy="234" rx="54" ry="32" transform="rotate(-8 350 234)" fill="#7a6552"/>
  <ellipse cx="358" cy="246" rx="40" ry="17" transform="rotate(-8 358 246)" fill="#93806a"/>

  <!-- neck -->
  <path d="M385,225 C365,195 410,188 413,155" fill="none" stroke="#f4eee0" stroke-width="16" stroke-linecap="round"/>
  <path d="M377,224 C357,195 400,184 404,158" fill="none" stroke="#5a3b28" stroke-width="5" stroke-linecap="round"/>

  <!-- head, bill, pouch -->
  <path d="M432,156 Q466,202 507,173 L430,153 Z" fill="#8d7b5a"/>
  <path d="M432,156 Q466,202 507,173" fill="none" stroke="#5f5139" stroke-width="1.5"/>
  <path d="M430,142 L507,166 Q514,169 508,174 L430,157 Z" fill="#c2b393"/>
  <circle cx="420" cy="148" r="15" fill="#f7efd0"/>
  <ellipse cx="418" cy="138" rx="11" ry="7" fill="#f2d86b"/>
  <circle cx="425" cy="146" r="2.6" fill="#111"/>
  <circle cx="426" cy="145" r="0.8" fill="#fff"/>

  <!-- wing reaching to handlebar -->
  <path d="M366,230 Q440,252 524,243" fill="none" stroke="#54402f" stroke-width="13" stroke-linecap="round"/>
  <path d="M372,232 Q440,250 516,243" fill="none" stroke="#6e5640" stroke-width="3" stroke-linecap="round"/>
  <circle cx="526" cy="244" r="6" fill="#54402f"/>
</svg>