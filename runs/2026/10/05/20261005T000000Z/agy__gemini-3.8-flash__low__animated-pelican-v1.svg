<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Sky & Scenery Gradients -->
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72afd3"/>
      <stop offset="60%" stop-color="#b8e1fc"/>
      <stop offset="100%" stop-color="#fdf4cd"/>
    </linearGradient>

    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a7b9b"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>

    <!-- Metallic & Bicycle Gradients -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="40%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="90%" stop-color="#334155"/>
      <stop offset="94%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <!-- Pelican Shading Gradients -->
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <linearGradient id="billGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>

    <linearGradient id="pelicanBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="40%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>

    <linearGradient id="pelicanNeckGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Wheel Definition (Center at 0,0, Radius 110) -->
    <g id="spoked-wheel">
      <!-- Rubber Tire -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#1c1917" stroke-width="18"/>
      <!-- Deep Dish Rim -->
      <circle cx="0" cy="0" r="102" fill="none" stroke="#cbd5e1" stroke-width="7"/>
      <circle cx="0" cy="0" r="98.5" fill="none" stroke="#475569" stroke-width="1.5"/>
      <!-- Spokes (16 pairs, cleanly spaced) -->
      <path d="
        M0,-98 L0,98 M-98,0 L98,0
        M-69.3,-69.3 L69.3,69.3 M-69.3,69.3 L69.3,-69.3
        M-37.5,-90.5 L37.5,90.5 M-90.5,-37.5 L90.5,37.5
        M-90.5,37.5 L90.5,-37.5 M-37.5,90.5 L37.5,-90.5
        M-19.1,-96.1 L19.1,96.1 M-96.1,-19.1 L96.1,19.1
        M-96.1,19.1 L96.1,-19.1 M-19.1,96.1 L19.1,-96.1
        M-54.4,-81.6 L54.4,81.6 M-81.6,-54.4 L81.6,54.4
        M-81.6,54.4 L81.6,-54.4 M-54.4,81.6 L54.4,-81.6
      " stroke="#94a3b8" stroke-width="1.4" opacity="0.85"/>
      <!-- Spoke Reflection Highlights -->
      <path d="M0,-98 L0,98 M-98,0 L98,0" stroke="#f8fafc" stroke-width="0.8" opacity="0.6"/>
      <!-- Center Hub -->
      <circle cx="0" cy="0" r="16" fill="url(#chrome)"/>
      <circle cx="0" cy="0" r="9" fill="#334155"/>
      <circle cx="0" cy="0" r="4" fill="#0f172a"/>
    </g>
  </defs>

  <style><![CDATA[
    /* Continuous animations */
    .spin-wheel {
      animation: wheelRoll 1.4s linear infinite;
    }
    .crank-rotate {
      animation: crankTurn 1.4s linear infinite;
      transform-origin: 500px 520px;
    }
    .counter-pedal-left {
      animation: counterTurn 1.4s linear infinite;
      transform-origin: 500px 568px;
    }
    .counter-pedal-right {
      animation: counterTurn 1.4s linear infinite;
      transform-origin: 500px 472px;
    }
    .feather-breeze {
      animation: featherBob 0.7s ease-in-out infinite alternate;
      transform-origin: 430px 240px;
    }
    .pouch-jiggle {
      animation: pouchPulse 0.7s ease-in-out infinite alternate;
      transform-origin: 660px 240px;
    }

    /* Keyframe Definitions */
    @keyframes wheelRoll {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes crankTurn {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterTurn {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes featherBob {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(3deg) translateY(-2px); }
    }
    @keyframes pouchPulse {
      0%   { transform: scale(1) skewX(0deg); }
      100% { transform: scale(1.03, 0.98) skewX(-2deg); }
    }
  ]]></style>

  <!-- ================= BACKGROUND & COASTAL SETTING ================= -->
  <!-- Sky -->
  <rect x="0" y="0" width="1000" height="700" fill="url(#bgSky)"/>

  <!-- Sun -->
  <circle cx="850" cy="160" r="75" fill="#fef08a" opacity="0.6"/>
  <circle cx="850" cy="160" r="60" fill="#fde047" opacity="0.8"/>

  <!-- Distant Pacific Coast Hills & Ocean -->
  <path d="M0,450 Q280,390 600,430 T1000,410 L1000,500 L0,500 Z" fill="#99b898" opacity="0.5"/>
  <rect x="0" y="470" width="1000" height="60" fill="url(#seaGrad)"/>
  <path d="M 0,480 Q 250,470 500,480 T 1000,480 L1000,500 L0,500 Z" fill="#38bdf8" opacity="0.3"/>

  <!-- Wooden Pier / Roadway -->
  <rect x="0" y="520" width="1000" height="180" fill="#78350f"/>
  <rect x="0" y="520" width="1000" height="15" fill="#a16207"/>
  <!-- Boardwalk Planks Pattern -->
  <path d="
    M0,535 L1000,535 M0,555 L1000,555 M0,580 L1000,580 M0,610 L1000,610 M0,645 L1000,645 M0,685 L1000,685
    M120,520 L110,700 M260,520 L240,700 M410,520 L390,700 M580,520 L560,700 M740,520 L720,700 M890,520 L870,700
  " stroke="#451a03" stroke-width="2.5" opacity="0.45"/>

  <!-- Ground Shadows under Wheels -->
  <ellipse cx="250" cy="625" rx="105" ry="14" fill="#291e12" opacity="0.45"/>
  <ellipse cx="750" cy="625" rx="105" ry="14" fill="#291e12" opacity="0.45"/>
  <ellipse cx="500" cy="627" rx="130" ry="12" fill="#291e12" opacity="0.3"/>

  <!-- ================= BICYCLE: BACKGROUND ELEMENTS ================= -->

  <!-- Rear Wheel (Axle at 250, 520) -->
  <g transform="translate(250, 520)">
    <g class="spin-wheel" style="transform-origin: 0px 0px;">
      <use href="#spoked-wheel"/>
    </g>
  </g>

  <!-- Far/Left Pedal Assembly (180 deg out-of-phase with drive-side crank) -->
  <g class="crank-rotate">
    <!-- Back Crank Arm pointing UP towards 500, 472 -->
    <line x1="500" y1="520" x2="500" y2="472" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="500" cy="472" r="5" fill="#334155"/>
  </g>

  <!-- Far/Left Pedal Platform (counter-rotates to stay level) -->
  <g class="counter-pedal-right">
    <rect x="484" y="468" width="32" height="8" rx="3" fill="#1e293b"/>
    <rect x="487" y="469" width="26" height="6" rx="2" fill="#475569"/>
  </g>

  <!-- Far/Left Pelican Leg (Reaches upward to left pedal) -->
  <!-- Hip: (450, 360). Synchronized animated knee and foot -->
  <g stroke="#334155" stroke-linecap="round" stroke-linejoin="round">
    <!-- Animated Far Leg & Foot -->
    <path stroke-width="12" fill="none">
      <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
        values="
          M 450,360 Q 440,410 500,472;
          M 450,360 Q 490,460 548,520;
          M 450,360 Q 490,490 500,568;
          M 450,360 Q 420,440 452,520;
          M 450,360 Q 440,410 500,472
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
        calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
      />
    </path>
    <!-- Webbed Web Foot Far (Yellow-gray) -->
    <path fill="#ca8a04" stroke="#854d0e" stroke-width="2">
      <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
        values="
          M 490,472 L 522,465 L 526,475 L 500,477 Z;
          M 538,520 L 570,513 L 574,523 L 548,525 Z;
          M 490,568 L 522,561 L 526,571 L 500,573 Z;
          M 442,520 L 474,513 L 478,523 L 452,525 Z;
          M 490,472 L 522,465 L 526,475 L 500,477 Z
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
        calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
      />
    </path>
  </g>


  <!-- ================= BICYCLE FRAME & DRIVE ================= -->

  <!-- Rear Dropouts & Stays -->
  <!-- Chainstay: (250, 520) to BB (500, 520) -->
  <line x1="250" y1="520" x2="500" y2="520" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Seatstay: (250, 520) to Seat Cluster (420, 360) -->
  <line x1="250" y1="520" x2="420" y2="360" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Drive Chain Loop -->
  <path d="M 250,511 L 500,504 A 20,20 0 0,1 500,536 L 250,528 A 10,10 0 0,1 250,511 Z"
        fill="none" stroke="#475569" stroke-width="3.5" stroke-dasharray="7,3"/>

  <!-- Main Triangle Tubes -->
  <!-- Seat Tube: BB (500, 520) to Seat Lug (420, 360) -->
  <line x1="500" y1="520" x2="420" y2="360" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round"/>
  <!-- Down Tube: BB (500, 520) to Head Tube Lower (680, 370) -->
  <line x1="500" y1="520" x2="680" y2="370" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round"/>
  <!-- Top Tube: Seat Cluster (420, 360) to Head Tube Upper (665, 320) -->
  <line x1="420" y1="360" x2="665" y2="320" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Head Tube (665, 320) to (685, 385) -->
  <line x1="662" y1="315" x2="687" y2="385" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/>

  <!-- Front Fork: Head Tube base (685, 385) down with rake to Front Axle (750, 520) -->
  <path d="M 685,385 L 736,495 Q 740,515 750,520" fill="none" stroke="url(#chrome)" stroke-width="8" stroke-linecap="round"/>

  <!-- Seat Post & Vintage Saddle -->
  <line x1="420" y1="360" x2="408" y2="320" stroke="url(#chrome)" stroke-width="7" stroke-linecap="round"/>
  <!-- Leather Saddle (centered comfortably beneath pelican) -->
  <path d="M 370,314 Q 405,305 440,316 Q 448,322 435,326 Q 405,322 375,328 Q 365,326 370,314 Z" fill="#451a03"/>
  <path d="M 378,326 Q 405,335 425,326" fill="none" stroke="#78350f" stroke-width="3"/>
  <!-- Chrome Saddle Springs -->
  <circle cx="380" cy="328" r="4" fill="none" stroke="url(#chrome)" stroke-width="2"/>
  <circle cx="390" cy="329" r="4" fill="none" stroke="url(#chrome)" stroke-width="2"/>

  <!-- Quill Stem & Classic Cruiser Handlebars -->
  <path d="M 662,315 L 655,270 L 675,270" fill="none" stroke="url(#chrome)" stroke-width="7" stroke-linecap="round"/>
  <!-- Swept-back Handlebar Curve -->
  <path d="M 675,270 Q 700,270 705,290 Q 708,308 670,312" fill="none" stroke="url(#chrome)" stroke-width="6" stroke-linecap="round"/>
  <!-- Hand Grip -->
  <path d="M 682,311 L 666,313" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <!-- Brass Bell -->
  <circle cx="692" cy="272" r="6" fill="#eab308"/>
  <circle cx="690" cy="270" r="2" fill="#fef08a"/>


  <!-- ================= PELICAN BODY & HEAD ================= -->

  <!-- Pelican Tail Feathers -->
  <g class="feather-breeze">
    <path d="M 350,330 Q 320,335 295,325 Q 315,345 345,355 Z" fill="#44403c"/>
    <path d="M 345,340 Q 310,350 285,345 Q 310,365 345,368 Z" fill="#292524"/>
  </g>

  <!-- Large Plump Body -->
  <ellipse cx="430" cy="335" rx="85" ry="60" transform="rotate(-15, 430, 335)" fill="url(#pelicanBodyGrad)"/>

  <!-- Wing Feather Layering (Folded at Rest on Bike) -->
  <path d="M 370,305 Q 430,290 495,335 Q 450,390 380,380 Q 360,340 370,305 Z" fill="#57534e"/>
  <!-- Primary and Secondary Wing Feathers Details -->
  <path d="M 360,345 Q 430,355 490,345" stroke="#292524" stroke-width="2.5" fill="none"/>
  <path d="M 370,365 Q 425,370 475,360" stroke="#1c1917" stroke-width="2.5" fill="none"/>
  <path d="M 385,320 C 420,325 450,330 470,355" stroke="#78716c" stroke-width="3" fill="none"/>

  <!-- Strong S-Curved Neck -->
  <!-- Posterior Brown Nape & Anterior Creamy White Foreneck -->
  <path d="
    M 480,310
    C 530,300 555,270 545,210
    C 538,160 580,120 625,125
    C 605,120 560,150 565,200
    C 572,250 535,285 465,325
    Z" fill="url(#pelicanNeckGrad)"/>
  <!-- Front Throat Line (Crisp White/Pale Gold) -->
  <path d="
    M 625,125
    C 605,125 575,160 580,205
    C 586,255 530,300 480,325
    C 505,315 550,275 555,215
    C 560,175 595,135 625,125
    Z" fill="#fef3c7"/>

  <!-- Head Crown (Yellow/Straw crest, typical of adult California Brown) -->
  <path d="M 605,135 Q 625,100 660,118 Q 675,130 670,155 Q 630,165 605,135 Z" fill="#fef08a"/>
  <!-- Crest Feather Tufts -->
  <path d="M 615,115 Q 590,105 580,115 Q 600,125 615,120 Z" fill="#fde047"/>

  <!-- Eye Patch & Eye -->
  <circle cx="642" cy="138" r="8" fill="#e2e8f0"/>
  <circle cx="643" cy="138" r="4.5" fill="#0284c7"/>
  <circle cx="644" cy="137" r="2" fill="#0f172a"/>
  <circle cx="645" cy="136" r="1" fill="#ffffff"/>

  <!-- Magnificent Long Bill & Gular Pouch -->
  <!-- Upper Bill Mandible (Hooked at tip) -->
  <path d="M 655,135 L 810,180 Q 830,186 828,193 Q 822,198 812,192 L 660,155 Z" fill="url(#billGrad)" stroke="#a16207" stroke-width="1"/>
  <!-- Bill Ridge & Hook (Nail) -->
  <path d="M 810,180 Q 833,186 829,196 Q 822,193 816,187" fill="#dc2626" stroke="#991b1b" stroke-width="1.2"/>
  <path d="M 660,138 L 815,183" stroke="#ca8a04" stroke-width="2"/>

  <!-- Gular Pouch (Throat sac) with natural elastic animation -->
  <g class="pouch-jiggle">
    <path d="M 660,155 L 812,192 C 780,240 710,265 660,225 C 640,210 645,175 660,155 Z"
          fill="url(#pouchGrad)" opacity="0.92"/>
    <!-- Pouch Vascular Striations -->
    <path d="M 680,175 Q 730,230 770,200 M 670,185 Q 710,240 745,210 M 662,195 Q 685,230 720,220"
          stroke="#c2410c" stroke-width="1.3" fill="none" opacity="0.5"/>
  </g>

  <!-- Pelican Wing / Arm Extended to Handlebars -->
  <!-- Shoulder at (475, 310) reaching forward to Grip at (675, 312) -->
  <path d="M 470,305 Q 540,280 610,295 Q 650,302 675,312 Q 650,320 600,312 Q 530,305 465,330 Z" fill="#57534e"/>
  <!-- Wing Pinion Feathers Overlapping Handgrip -->
  <path d="M 650,302 Q 675,306 685,312 Q 670,318 645,315 Z" fill="#44403c"/>
  <path d="M 640,308 Q 668,312 678,318 Q 660,324 638,318 Z" fill="#292524"/>


  <!-- ================= BICYCLE: FOREGROUND ELEMENTS ================= -->

  <!-- Front Wheel (Axle at 750, 520) - Placed in front of fork blade highlight -->
  <g transform="translate(750, 520)">
    <g class="spin-wheel" style="transform-origin: 0px 0px;">
      <use href="#spoked-wheel"/>
    </g>
  </g>

  <!-- Front Axle Nut & Fork Crown Detail -->
  <circle cx="750" cy="520" r="7" fill="url(#chrome)"/>
  <circle cx="750" cy="520" r="3" fill="#0f172a"/>

  <!-- Drive Chainring (Chainwheel at BB 500, 520) -->
  <circle cx="500" cy="520" r="24" fill="#334155"/>
  <circle cx="500" cy="520" r="21" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,2"/>
  <circle cx="500" cy="520" r="14" fill="#1e293b"/>
  <!-- Chainwheel 5-Arm Spider -->
  <path d="M 500,499 L 500,541 M 480,506 L 520,534 M 480,534 L 520,506" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="500" cy="520" r="6" fill="url(#chrome)"/>

  <!-- FOREGROUND (RIGHT) CRANK, PEDAL, AND LEG -->
  <!-- Crank revolves clockwise around (500, 520). Radius = 48px -->
  <g class="crank-rotate">
    <!-- Near Crank Arm pointing DOWN towards (500, 568) at t=0 -->
    <line x1="500" y1="520" x2="500" y2="568" stroke="url(#chrome)" stroke-width="8.5" stroke-linecap="round"/>
    <circle cx="500" cy="568" r="5" fill="#475569"/>
  </g>

  <!-- Near Pedal Platform (counter-rotates around 500,568 to stay horizontal) -->
  <g class="counter-pedal-left">
    <!-- Amber Pedal Reflector & Rubber Block -->
    <rect x="480" y="564" width="38" height="9" rx="3.5" fill="#0f172a"/>
    <rect x="484" y="566" width="30" height="5" rx="2" fill="#d97706"/>
    <rect x="488" y="567" width="22" height="3" rx="1" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Near/Right Pelican Leg (Synchronized with crank turn) -->
  <!-- Hip Joint located at (445, 360). Follows pedal path:
       t=0.00: Down (500, 568)
       t=0.25: Back (452, 520)
       t=0.50: Up   (500, 472)
       t=0.75: Fwd  (548, 520)
  -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Thigh Feather Tuft / "Breeches" -->
    <path d="M 425,345 Q 460,350 468,375 Q 440,390 422,370 Z" fill="#44403c"/>

    <!-- Articulated Leg Bone & Shin -->
    <path stroke="#1e293b" stroke-width="13" fill="none">
      <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
        values="
          M 445,360 Q 490,490 500,568;
          M 445,360 Q 420,440 452,520;
          M 445,360 Q 440,410 500,472;
          M 445,360 Q 490,460 548,520;
          M 445,360 Q 490,490 500,568
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
        calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
      />
    </path>
    <!-- Leg Highlight -->
    <path stroke="#475569" stroke-width="4" fill="none">
      <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
        values="
          M 445,360 Q 490,490 500,568;
          M 445,360 Q 420,440 452,520;
          M 445,360 Q 440,410 500,472;
          M 445,360 Q 490,460 548,520;
          M 445,360 Q 490,490 500,568
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
        calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
      />
    </path>

    <!-- Foreground Webbed Pelican Foot (Firmly planted on pedal platform) -->
    <path fill="#eab308" stroke="#a16207" stroke-width="2.2">
      <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
        values="
          M 488,568 L 526,561 L 530,571 L 500,573 Z;
          M 440,520 L 478,513 L 482,523 L 452,525 Z;
          M 488,472 L 526,465 L 530,475 L 500,477 Z;
          M 536,520 L 574,513 L 578,523 L 548,525 Z;
          M 488,568 L 526,561 L 530,571 L 500,573 Z
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
        calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
      />
    </path>
    <!-- Webbing Ridges / Claws -->
    <path stroke="#78350f" stroke-width="1.8" fill="none">
      <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
        values="
          M 500,568 L 526,564 M 500,570 L 529,568;
          M 452,520 L 478,516 M 452,522 L 481,520;
          M 500,472 L 526,468 M 500,474 L 529,472;
          M 548,520 L 574,516 M 548,522 L 577,520;
          M 500,568 L 526,564 M 500,570 L 529,568
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
        calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
      />
    </path>
  </g>

</svg>