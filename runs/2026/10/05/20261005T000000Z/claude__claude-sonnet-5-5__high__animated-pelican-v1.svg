<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset="1" stop-color="#e8f6fc"/>
    </linearGradient>
    <g id="wheelBody">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#9aa0a8" stroke-width="1.2">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(30)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(60)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(120)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(150)"/>
      </g>
      <circle cx="58" cy="0" r="3.5" fill="#e03a3a"/>
      <circle r="7" fill="#666"/>
      <circle r="3" fill="#ddd"/>
    </g>
  </defs>

  <rect width="720" height="470" fill="url(#sky)"/>
  <ellipse cx="140" cy="70" rx="50" ry="16" fill="#fff" opacity="0.85"/>
  <ellipse cx="170" cy="60" rx="34" ry="14" fill="#fff" opacity="0.85"/>
  <ellipse cx="560" cy="95" rx="55" ry="15" fill="#fff" opacity="0.8"/>
  <rect x="0" y="421" width="720" height="49" fill="#e3d3a1"/>
  <rect x="0" y="421" width="720" height="3" fill="#b9a56d"/>
  <g stroke="#b9a56d" stroke-width="4" stroke-linecap="round">
    <path d="M0 440h40 M80 440h40 M160 440h40 M240 440h40 M320 440h40 M400 440h40 M480 440h40 M560 440h40 M640 440h40 M720 440h40 M800 440h40">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- far leg -->
  <g stroke="#4a4038" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
        values="55.3 385 248;38.9 385 248;13.9 385 248;6.8 385 248;21.8 385 248;43.9 385 248;59.8 385 248;62.2 385 248;55.3 385 248"/>
      <line x1="385" y1="248" x2="465" y2="248"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
          values="93.7 465 248;119.2 465 248;127.6 465 248;111.2 465 248;83.6 465 248;57.5 465 248;48.6 465 248;65.7 465 248;93.7 465 248"/>
        <line x1="465" y1="248" x2="545" y2="248"/>
        <circle cx="465" cy="248" r="4" fill="#4a4038" stroke="none"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
            values="-149 545 248;-158.1 545 248;-141.5 545 248;-118 545 248;-105.4 545 248;-101.4 545 248;-108.4 545 248;-127.9 545 248;-149 545 248"/>
          <polygon points="538,243 556,242 580,248 575,250 580,253 566,252 570,256 550,252 538,251" fill="#3a322b" stroke="#3a322b" stroke-width="1.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far crank + pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 400 355" to="540 400 355" dur="2s" repeatCount="indefinite"/>
    <line x1="400" y1="355" x2="438" y2="355" stroke="#444" stroke-width="7" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 438 355" to="-540 438 355" dur="2s" repeatCount="indefinite"/>
      <rect x="428" y="357.5" width="24" height="5" rx="2" fill="#222"/>
      <circle cx="438" cy="355" r="3.5" fill="#888"/>
    </g>
  </g>

  <!-- wheels -->
  <g transform="translate(250 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use href="#wheelBody"/>
    </g>
  </g>
  <g transform="translate(570 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use href="#wheelBody"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="2.5" stroke-dasharray="3 2" fill="none">
    <path d="M400 339 L250 342"/>
    <path d="M400 371 L250 358"/>
  </g>
  <circle cx="250" cy="350" r="9" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="3 2">
    <animateTransform attributeName="transform" type="rotate" from="0 250 350" to="360 250 350" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- frame -->
  <g stroke="#1f7a99" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="400" y1="355" x2="373" y2="268"/>
    <line x1="373" y1="268" x2="528" y2="252"/>
    <line x1="400" y1="355" x2="534" y2="280"/>
    <line x1="373" y1="268" x2="250" y2="350"/>
    <line x1="400" y1="355" x2="250" y2="350"/>
  </g>
  <line x1="526" y1="246" x2="536" y2="284" stroke="#17607a" stroke-width="10" stroke-linecap="round"/>
  <line x1="536" y1="284" x2="570" y2="350" stroke="#1f7a99" stroke-width="6" stroke-linecap="round"/>
  <line x1="528" y1="252" x2="523" y2="230" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <path d="M523 230 L507 226" stroke="#222" stroke-width="6" stroke-linecap="round" fill="none"/>
  <line x1="373" y1="268" x2="368" y2="254" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <path d="M345 255 Q370 248 402 253 L400 261 Q370 263 345 260 Z" fill="#2b2b2b"/>
  <circle cx="400" cy="355" r="8" fill="#555"/>

  <!-- near crank, chainring, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 355" to="360 400 355" dur="2s" repeatCount="indefinite"/>
    <circle cx="400" cy="355" r="16" fill="none" stroke="#777" stroke-width="4" stroke-dasharray="3 2"/>
    <circle cx="400" cy="355" r="12" fill="none" stroke="#999" stroke-width="1.5"/>
    <line x1="400" y1="355" x2="438" y2="355" stroke="#555" stroke-width="7" stroke-linecap="round"/>
    <circle cx="400" cy="355" r="5" fill="#bbb"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 438 355" to="-360 438 355" dur="2s" repeatCount="indefinite"/>
      <rect x="428" y="357.5" width="24" height="5" rx="2" fill="#111"/>
      <circle cx="438" cy="355" r="3.5" fill="#999"/>
    </g>
  </g>

  <!-- tail -->
  <path d="M305 212 L258 238 L268 250 L314 238 Z" fill="#4e3f33"/>
  <path d="M262 240 L300 232 M270 248 L308 238" stroke="#7a6757" stroke-width="1.5"/>

  <!-- body -->
  <g transform="rotate(-8 350 210)">
    <ellipse cx="350" cy="210" rx="68" ry="42" fill="#6f6154"/>
    <ellipse cx="346" cy="198" rx="56" ry="26" fill="#9c8b79"/>
    <path d="M300 205 Q340 190 385 205" stroke="#7b6a58" stroke-width="2" fill="none"/>
    <path d="M296 218 Q340 205 390 220" stroke="#7b6a58" stroke-width="2" fill="none"/>
  </g>

  <!-- near leg -->
  <g stroke="#6b5d52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="385" cy="248" r="6" fill="#6b5d52" stroke="none"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
        values="21.8 385 248;43.9 385 248;59.8 385 248;62.2 385 248;55.3 385 248;38.9 385 248;13.9 385 248;6.8 385 248;21.8 385 248"/>
      <line x1="385" y1="248" x2="465" y2="248"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
          values="83.6 465 248;57.5 465 248;48.6 465 248;65.7 465 248;93.7 465 248;119.2 465 248;127.6 465 248;111.2 465 248;83.6 465 248"/>
        <line x1="465" y1="248" x2="545" y2="248"/>
        <circle cx="465" cy="248" r="4.5" fill="#6b5d52" stroke="none"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
            values="-105.4 545 248;-101.4 545 248;-108.4 545 248;-127.9 545 248;-149 545 248;-158.1 545 248;-141.5 545 248;-118 545 248;-105.4 545 248"/>
          <polygon points="538,243 556,242 580,248 575,250 580,253 566,252 570,256 550,252 538,251" fill="#5b5148" stroke="#5b5148" stroke-width="1.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- neck, head, bill (gentle bob) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 395 200;-2.5 395 200;0 395 200;2 395 200;0 395 200" dur="1s" repeatCount="indefinite"/>
    <path d="M388 205 C430 200 418 150 458 135" stroke="#efe9dc" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M382 192 C418 186 408 140 448 120" stroke="#5a3f2c" stroke-width="9" stroke-linecap="round" fill="none"/>
    <ellipse cx="475" cy="122" rx="25" ry="18" fill="#f6f1e3"/>
    <ellipse cx="470" cy="108" rx="18" ry="8" fill="#f1d36a"/>
    <path d="M492 128 L592 144 Q540 178 494 136 Z" fill="#c2a984"/>
    <path d="M494 108 L596 136 L598 142 L592 143 L492 124 Z" fill="#a8998a"/>
    <path d="M590 134 Q602 138 596 148 L592 143 Z" fill="#d9682f"/>
    <circle cx="487" cy="115" r="4" fill="#111"/>
    <circle cx="488.3" cy="113.7" r="1.3" fill="#fff"/>
  </g>

  <!-- wing on handlebar -->
  <path d="M372 190 C410 180 470 200 512 224 L506 235 C460 226 410 236 372 232 Z" fill="#4a3a2e"/>
  <path d="M390 205 C430 205 470 214 500 228 M386 218 C430 218 460 224 496 232" stroke="#74604f" stroke-width="2" fill="none"/>
  <circle cx="509" cy="229" r="6" fill="#3a2d23"/>
</svg>