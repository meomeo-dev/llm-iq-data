<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd4f0"/>
      <stop offset="1" stop-color="#fdeccb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="77" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="72" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#9aa0a6" stroke-width="1.2">
        <line x1="0" y1="-72" x2="0" y2="72"/>
        <line x1="0" y1="-72" x2="0" y2="72" transform="rotate(30)"/>
        <line x1="0" y1="-72" x2="0" y2="72" transform="rotate(60)"/>
        <line x1="0" y1="-72" x2="0" y2="72" transform="rotate(90)"/>
        <line x1="0" y1="-72" x2="0" y2="72" transform="rotate(120)"/>
        <line x1="0" y1="-72" x2="0" y2="72" transform="rotate(150)"/>
      </g>
      <circle r="8" fill="#777" stroke="#444" stroke-width="2"/>
      <circle cy="-67" r="3" fill="#e33"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="36" fill="#ffd66b"/>
  <g fill="#ffffff" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0; 70 0; 0 0" dur="40s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="80" rx="48" ry="14"/>
    <ellipse cx="185" cy="68" rx="32" ry="12"/>
    <ellipse cx="480" cy="55" rx="40" ry="11"/>
    <ellipse cx="505" cy="46" rx="26" ry="10"/>
  </g>
  <rect x="0" y="300" width="800" height="100" fill="#4aa3c7"/>
  <rect x="0" y="300" width="800" height="3" fill="#ffffff" opacity="0.6"/>
  <rect x="0" y="400" width="800" height="21" fill="#d6c59c"/>
  <rect x="0" y="421" width="800" height="79" fill="#6e7176"/>
  <line x1="0" y1="421" x2="800" y2="421" stroke="#4a4c50" stroke-width="2"/>
  <line x1="0" y1="465" x2="800" y2="465" stroke="#f1f1f1" stroke-width="4" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.25s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="425" rx="230" ry="6" fill="#000000" opacity="0.22"/>

  <!-- Wheels -->
  <g transform="translate(240 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="10" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="3 2.5"/>
    </g>
  </g>
  <g transform="translate(560 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Far crank, pedal and leg (behind frame) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 352" to="360 390 352" dur="2s" repeatCount="indefinite"/>
    <line x1="390" y1="352" x2="352" y2="352" stroke="#666" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(352 352)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="0" width="20" height="4" rx="1.5" fill="#1c1c1c"/>
        <path d="M-6 -7 Q6 -9 15 -1 L15 0 L-6 0 Z" fill="#2f2b28"/>
      </g>
    </g>
  </g>
  <path fill="none" stroke="#2f2b28" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M360 218 L418.8 288.7 L352 352">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M360 218 L418.8 288.7 L352 352;
      M360 218 L430.3 277.3 L357.1 333;
      M360 218 L441.7 260.3 L371 319.1;
      M360 218 L448.5 243 L390 314;
      M360 218 L450 236.8 L409 319.1;
      M360 218 L448.1 244.5 L422.9 333;
      M360 218 L441.4 261 L428 352;
      M360 218 L428.7 279.2 L422.9 371;
      M360 218 L413.3 293 L409 384.9;
      M360 218 L403.6 299 L390 390;
      M360 218 L403.7 298.9 L371 384.9;
      M360 218 L409.6 295.5 L357.1 371;
      M360 218 L418.8 288.7 L352 352"/>
  </path>

  <!-- Chain -->
  <g fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-dasharray="5 3">
    <path d="M240 331 L390 330">
      <animate attributeName="stroke-dashoffset" from="0" to="8" dur="0.12s" repeatCount="indefinite"/>
    </path>
    <path d="M240 349 L390 374">
      <animate attributeName="stroke-dashoffset" from="8" to="0" dur="0.12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Frame -->
  <g fill="none" stroke="#e0452c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 352 L351 226 L507 234 L513 254 Z"/>
    <path d="M390 352 L240 340 L353 238"/>
    <line x1="505" y1="228" x2="515" y2="262" stroke-width="8"/>
    <path d="M512 250 L520 270 Q535 305 560 340" stroke-width="5"/>
    <line x1="351" y1="226" x2="347" y2="212" stroke="#888" stroke-width="5"/>
    <line x1="507" y1="230" x2="504" y2="208" stroke="#555" stroke-width="5"/>
    <path d="M504 208 L528 202 Q546 200 548 214" stroke="#2a2a2a" stroke-width="5"/>
  </g>
  <circle cx="390" cy="352" r="8" fill="#555" stroke="#2a2a2a" stroke-width="2"/>
  <path d="M324 213 Q345 205 374 209 L378 216 Q350 221 326 219 Z" fill="#3a2a22"/>

  <!-- Near crank, chainring, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 352" to="360 390 352" dur="2s" repeatCount="indefinite"/>
    <circle cx="390" cy="352" r="23" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="4 3"/>
    <circle cx="390" cy="352" r="19" fill="none" stroke="#777" stroke-width="2"/>
    <g stroke="#777" stroke-width="2.5">
      <line x1="390" y1="333" x2="390" y2="371"/>
      <line x1="371" y1="352" x2="409" y2="352"/>
    </g>
    <line x1="390" y1="352" x2="428" y2="352" stroke="#8a8a8a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="390" cy="352" r="5" fill="#444"/>
    <g transform="translate(428 352)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="0" width="20" height="4" rx="1.5" fill="#1c1c1c"/>
        <path d="M-6 -7 Q6 -9 15 -1 L15 0 L-6 0 Z" fill="#3b3631"/>
      </g>
    </g>
  </g>

  <!-- Near leg -->
  <path fill="none" stroke="#4b4540" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M360 218 L441.4 261 L428 352">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M360 218 L441.4 261 L428 352;
      M360 218 L428.7 279.2 L422.9 371;
      M360 218 L413.3 293 L409 384.9;
      M360 218 L403.6 299 L390 390;
      M360 218 L403.7 298.9 L371 384.9;
      M360 218 L409.6 295.5 L357.1 371;
      M360 218 L418.8 288.7 L352 352;
      M360 218 L430.3 277.3 L357.1 333;
      M360 218 L441.7 260.3 L371 319.1;
      M360 218 L448.5 243 L390 314;
      M360 218 L450 236.8 L409 319.1;
      M360 218 L448.1 244.5 L422.9 333;
      M360 218 L441.4 261 L428 352"/>
  </path>

  <!-- Pelican: tail and body -->
  <path d="M300 200 L266 214 L272 202 L297 188 Z" fill="#4e4132"/>
  <path d="M292 208 Q300 170 340 150 Q390 135 420 160 Q438 185 410 212 Q380 232 340 228 Q305 226 292 208 Z" fill="#7b6a58" stroke="#51443518" stroke-width="1"/>

  <!-- Neck -->
  <path d="M405 168 Q444 152 434 128 Q428 108 455 98" fill="none" stroke="#f6f1e7" stroke-width="20" stroke-linecap="round"/>
  <path d="M405 168 Q444 152 434 128 Q428 108 455 98" fill="none" stroke="#5b3b24" stroke-width="6" stroke-linecap="round" transform="translate(-7 0)"/>

  <!-- Bill and head -->
  <path d="M478 99 Q520 138 564 125 L478 100 Z" fill="#b9835a"/>
  <path d="M476 86 L568 119 Q574 123 566 125 L476 100 Z" fill="#8b8e8a"/>
  <ellipse cx="462" cy="94" rx="18" ry="13" fill="#fbf8ef"/>
  <path d="M446 90 Q458 78 476 86 Q462 84 446 94 Z" fill="#f1d36b"/>
  <circle cx="470" cy="90" r="2.8" fill="#111"/>
  <circle cx="471" cy="89" r="0.9" fill="#ffffff"/>

  <!-- Wing reaching handlebar -->
  <path d="M368 165 Q420 148 470 178 Q505 196 534 200 L532 210 Q490 214 442 200 Q398 206 372 192 Z" fill="#5f5040" stroke="#3f3428" stroke-width="1.5"/>
  <g stroke="#8b7a64" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M385 180 Q430 172 470 190"/>
    <path d="M390 190 Q435 188 480 200"/>
    <path d="M400 172 Q440 168 475 184"/>
  </g>
  <circle cx="533" cy="205" r="5" fill="#3f3428"/>
</svg>