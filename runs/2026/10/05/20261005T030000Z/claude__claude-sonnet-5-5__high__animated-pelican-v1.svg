<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f5"/>
      <stop offset="1" stop-color="#fdf3dc"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(20)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(40)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(60)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(80)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(100)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(120)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(140)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(160)"/>
      </g>
      <circle cx="56" cy="0" r="3.5" fill="#d33"/>
      <circle r="7" fill="#555" stroke="#222" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#ffe28a" opacity="0.9"/>

  <!-- ground -->
  <rect x="0" y="423" width="800" height="77" fill="#d9c9a3"/>
  <line x1="0" y1="423" x2="800" y2="423" stroke="#8a7d6a" stroke-width="3"/>
  <g stroke="#a8977a" stroke-width="4" stroke-dasharray="50 60">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-110 0" dur="0.25s" repeatCount="indefinite"/>
      <line x1="0" y1="445" x2="1000" y2="445"/>
      <line x1="40" y1="470" x2="1040" y2="470"/>
    </g>
  </g>

  <!-- wheels -->
  <g transform="translate(260 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(540 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far crank, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 390 355" to="540 390 355" dur="2s" repeatCount="indefinite"/>
    <line x1="390" y1="355" x2="420" y2="355" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 420 355" to="-540 420 355" dur="2s" repeatCount="indefinite"/>
      <g transform="translate(420 355)">
        <rect x="-9" y="-2" width="18" height="5" rx="1.5" fill="#333"/>
        <path d="M-8,-1 L-6,-7 Q0,-10 8,-6 L20,-1 Q20,3 14,3 L-8,3 Z" fill="#333"/>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path d="M362,262 L411,300 L360,355" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M362,262 L411,300 L360,355;
      M362,262 L418.2,288.2 L364,340;
      M362,262 L423.2,271.6 L375,329;
      M362,262 L423.9,258.1 L390,325;
      M362,262 L423.7,256.4 L405,329;
      M362,262 L423.9,265.5 L416,340;
      M362,262 L421,280 L420,355;
      M362,262 L414.5,295 L416,370;
      M362,262 L405.7,306 L405,381;
      M362,262 L400.3,310.7 L390,385;
      M362,262 L400.6,310.5 L375,381;
      M362,262 L404.7,307 L364,370;
      M362,262 L411,300 L360,355"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="260" y1="350" x2="390" y2="355"/>
    <line x1="260" y1="350" x2="362" y2="272"/>
    <line x1="390" y1="355" x2="362" y2="272"/>
    <line x1="362" y1="272" x2="499" y2="252"/>
    <line x1="390" y1="355" x2="508" y2="280"/>
    <line x1="498" y1="250" x2="508" y2="282" stroke-width="8"/>
  </g>
  <line x1="508" y1="280" x2="540" y2="350" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="362" y1="272" x2="358" y2="258" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- chain and rear cog -->
  <circle cx="260" cy="350" r="7" fill="none" stroke="#444" stroke-width="2"/>
  <line x1="390" y1="340" x2="260" y2="344" stroke="#444" stroke-width="2"/>
  <line x1="390" y1="370" x2="260" y2="356" stroke="#444" stroke-width="2"/>
  <circle cx="390" cy="355" r="5" fill="#222"/>
  <!-- stem and handlebar -->
  <line x1="502" y1="252" x2="498" y2="230" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M486,226 Q500,221 512,229 Q522,238 520,250" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- saddle -->
  <path d="M334,255 Q358,249 386,253 Q391,258 382,262 L338,263 Q330,261 334,255 Z" fill="#3b2a1f" stroke="#222" stroke-width="1.5"/>

  <!-- near leg -->
  <path d="M362,262 L421,280 L420,355" fill="none" stroke="#5a5a5a" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M362,262 L421,280 L420,355;
      M362,262 L414.5,295 L416,370;
      M362,262 L405.7,306 L405,381;
      M362,262 L400.3,310.7 L390,385;
      M362,262 L400.6,310.5 L375,381;
      M362,262 L404.7,307 L364,370;
      M362,262 L411,300 L360,355;
      M362,262 L418.2,288.2 L364,340;
      M362,262 L423.2,271.6 L375,329;
      M362,262 L423.9,258.1 L390,325;
      M362,262 L423.7,256.4 L405,329;
      M362,262 L423.9,265.5 L416,340;
      M362,262 L421,280 L420,355"/>
  </path>

  <!-- near crank, chainring, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 355" to="360 390 355" dur="2s" repeatCount="indefinite"/>
    <circle cx="390" cy="355" r="15" fill="none" stroke="#666" stroke-width="3"/>
    <line x1="390" y1="355" x2="420" y2="355" stroke="#888" stroke-width="5.5" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 420 355" to="-360 420 355" dur="2s" repeatCount="indefinite"/>
      <g transform="translate(420 355)">
        <rect x="-9" y="-2" width="18" height="5" rx="1.5" fill="#222"/>
        <path d="M-8,-1 L-6,-7 Q0,-10 8,-6 L20,-1 Q20,3 14,3 L-8,3 Z" fill="#555" stroke="#333" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- tail -->
  <path d="M318,222 L282,246 L322,248 Z" fill="#5d4c3c" stroke="#4a3a2c" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- body -->
  <ellipse cx="355" cy="222" rx="52" ry="37" transform="rotate(-18 355 222)" fill="#7a6652" stroke="#5a4636" stroke-width="2"/>
  <ellipse cx="350" cy="228" rx="30" ry="14" transform="rotate(-18 350 228)" fill="#8d7861" opacity="0.8"/>

  <!-- neck -->
  <path d="M374,202 C390,182 386,160 402,138" fill="none" stroke="#6b4e35" stroke-width="7" stroke-linecap="round"/>
  <path d="M382,205 C400,185 395,160 412,140" fill="none" stroke="#f4f0e4" stroke-width="16" stroke-linecap="round"/>

  <!-- head and bill -->
  <ellipse cx="420" cy="128" rx="16" ry="12" fill="#f6e9a8" stroke="#c9b66a" stroke-width="1.5"/>
  <path d="M410,119 Q420,112 430,118" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M432,121 L506,148 Q510,152 505,155 L432,138 Z" fill="#b9a27a" stroke="#6e5b3a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M434,138 Q470,172 505,155 L434,141 Z" fill="#d9b46a" stroke="#6e5b3a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M500,147 L510,150 Q511,158 503,156 Z" fill="#7a5a3a"/>
  <circle cx="427" cy="124" r="3" fill="#111"/>
  <circle cx="428" cy="123" r="1" fill="#fff"/>

  <!-- wing reaching the handlebar -->
  <path d="M366,200 C410,196 470,214 512,230 L518,240 C470,236 410,236 372,226 Z" fill="#6b5846" stroke="#4a3a2c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400,206 C440,208 480,222 508,234" fill="none" stroke="#8d7861" stroke-width="2" stroke-linecap="round"/>
  <circle cx="515" cy="236" r="6" fill="#3b2d22"/>
</svg>