<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Coastal Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ac1eb"/>
      <stop offset="45%" stop-color="#bfe3f7"/>
      <stop offset="70%" stop-color="#fedac2"/>
      <stop offset="100%" stop-color="#fcd39f"/>
    </linearGradient>

    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a7b9b"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65c00"/>
      <stop offset="60%" stop-color="#c43802"/>
      <stop offset="100%" stop-color="#801b00"/>
    </linearGradient>

    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#b55400"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06d6a0"/>
      <stop offset="100%" stop-color="#0b8261"/>
    </linearGradient>

    <!-- Reusable Wheel Definition (Center at 0,0, radius 95) -->
    <g id="bicycle-wheel">
      <!-- Shadow and Tire -->
      <circle cx="0" cy="0" r="95" fill="none" stroke="#222" stroke-width="12"/>
      <!-- Rim Outer / Inner -->
      <circle cx="0" cy="0" r="90" fill="none" stroke="#silver" stroke-width="3"/>
      <circle cx="0" cy="0" r="88" fill="none" stroke="#e0e0e0" stroke-width="2"/>
      <!-- Spokes (16 spokes) -->
      <g stroke="#d5dbe0" stroke-width="1.8" opacity="0.85">
        <line x1="0" y1="-88" x2="0" y2="88"/>
        <line x1="-88" y1="0" x2="88" y2="0"/>
        <line x1="-62.2" y1="-62.2" x2="62.2" y2="62.2"/>
        <line x1="62.2" y1="-62.2" x2="-62.2" y2="62.2"/>
        <line x1="-33.7" y1="-81.3" x2="33.7" y2="81.3"/>
        <line x1="33.7" y1="-81.3" x2="-33.7" y2="81.3"/>
        <line x1="-81.3" y1="-33.7" x2="81.3" y2="33.7"/>
        <line x1="81.3" y1="-33.7" x2="-81.3" y2="33.7"/>
      </g>
      <!-- Hub -->
      <circle cx="0" cy="0" r="14" fill="#6c757d"/>
      <circle cx="0" cy="0" r="7" fill="#343a40"/>
      <circle cx="0" cy="0" r="3" fill="#f8f9fa"/>
    </g>

    <!-- Ground Dash Line Pattern for Motion Effect -->
    <style><![CDATA[
      @keyframes groundMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      .moving-ground {
        animation: groundMove 0.8s linear infinite;
      }
    ]]></style>
  </defs>

  <!-- BACKGROUND: Coastal California Scene -->
  <rect width="900" height="470" fill="url(#skyGrad)"/>
  
  <!-- Distant Sun -->
  <circle cx="760" cy="180" r="65" fill="#fff5eb" opacity="0.75"/>
  <circle cx="760" cy="180" r="80" fill="#ffe8d6" opacity="0.35"/>

  <!-- Distant Pacific Ocean & Shoreline -->
  <rect y="440" width="900" height="40" fill="url(#seaGrad)"/>
  <!-- Shoreline / Boardwalk Path -->
  <rect y="480" width="900" height="170" fill="#dfbe99"/>
  <path d="M 0 480 Q 225 476, 450 480 T 900 480 L 900 488 L 0 488 Z" fill="#d0ab83"/>

  <!-- Boardwalk Wood Planks / Speed Lines -->
  <line x1="0" y1="585" x2="900" y2="585" stroke="#bc9468" stroke-width="4" stroke-dasharray="80 40" class="moving-ground"/>
  <line x1="0" y1="620" x2="900" y2="620" stroke="#a47e54" stroke-width="3" stroke-dasharray="50 70" class="moving-ground"/>

  <!-- Bike Wheel Ground Shadows -->
  <ellipse cx="230" cy="565" rx="80" ry="12" fill="#5c4430" opacity="0.45"/>
  <ellipse cx="610" cy="565" rx="80" ry="12" fill="#5c4430" opacity="0.45"/>
  <ellipse cx="430" cy="567" rx="120" ry="14" fill="#5c4430" opacity="0.35"/>

  <!-- ========================================== -->
  <!-- BICYCLE SETUP                              -->
  <!-- Rear Axle: (230, 475)                      -->
  <!-- Front Axle: (610, 475)                     -->
  <!-- Bottom Bracket (Crank Center): (395, 475)  -->
  <!-- Seatpost Cluster: (320, 310)               -->
  <!-- Headtube / Fork Crown: (545, 290)          -->
  <!-- Handlebars: (535, 220)                     -->
  <!-- ========================================== -->

  <!-- REAR WHEEL (Animated Rotation) -->
  <g transform="translate(230, 475)">
    <use href="#bicycle-wheel"/>
    <animateTransform attributeName="transform" type="rotate"
      from="0" to="360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- FRONT WHEEL (Animated Rotation) -->
  <g transform="translate(610, 475)">
    <use href="#bicycle-wheel"/>
    <animateTransform attributeName="transform" type="rotate"
      from="0" to="360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- BICYCLE FRAMEWORK -->
  <g id="bicycle-chassis">
    <!-- Chainstay: BB(395, 475) to Rear Axle(230, 475) -->
    <line x1="395" y1="475" x2="230" y2="475" stroke="#089f77" stroke-width="8" stroke-linecap="round"/>
    <!-- Seatstay: Seat(320, 310) to Rear Axle(230, 475) -->
    <line x1="320" y1="310" x2="230" y2="475" stroke="#089f77" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Bike Chain and Rear Cog -->
    <circle cx="230" cy="475" r="20" fill="none" stroke="#444" stroke-width="4"/>
    <path d="M 230 455 L 395 448 A 28 28 0 0 1 395 502 L 230 495 Z" fill="none" stroke="#2b2d42" stroke-width="3.5" stroke-dasharray="7 3"/>

    <!-- LEFT (FAR-SIDE) CRANK & PEDAL (180 deg offset) -->
    <g transform="translate(395, 475)">
      <!-- Rotates 180° out of phase (from 180 to 540) -->
      <animateTransform attributeName="transform" type="rotate"
        from="180" to="540" dur="1.2s" repeatCount="indefinite" additive="sum"/>
      <!-- Crank Arm -->
      <line x1="0" y1="0" x2="0" y2="48" stroke="#718096" stroke-width="9" stroke-linecap="round"/>
      <!-- Pedal Axle & Pedal Body (Counter-rotates to stay horizontal) -->
      <g transform="translate(0, 48)">
        <animateTransform attributeName="transform" type="rotate"
          from="-180" to="-540" dur="1.2s" repeatCount="indefinite" additive="sum"/>
        <rect x="-14" y="-5" width="28" height="10" rx="3" fill="#2d3748" stroke="#1a202c" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Main Diamond Triangle Tubes -->
    <!-- Down Tube: Head(545, 290) to BB(395, 475) -->
    <line x1="545" y1="290" x2="395" y2="475" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/>
    <!-- Seat Tube: BB(395, 475) to Seat Junction(320, 310) -->
    <line x1="395" y1="475" x2="320" y2="310" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/>
    <!-- Top Tube: Seat Junction(320, 310) to Head(545, 290) -->
    <line x1="320" y1="310" x2="545" y2="290" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Front Fork: Head(545, 290) to Front Axle(610, 475) -->
    <line x1="545" y1="290" x2="610" y2="475" stroke="#089f77" stroke-width="9" stroke-linecap="round"/>
    <line x1="542" y1="270" x2="547" y2="305" stroke="#065f46" stroke-width="14" stroke-linecap="round"/>

    <!-- Handlebar Stem & Touring Drop/Cruiser Handlebar -->
    <!-- Stem -->
    <path d="M 543 275 L 538 235 L 555 228" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <!-- Swooping Handlebar Bar -->
    <path d="M 530 240 C 565 210, 595 235, 560 260" fill="none" stroke="#e2e8f0" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Handlebar Grip -->
    <path d="M 565 255 L 553 263" stroke="#78350f" stroke-width="8.5" stroke-linecap="round"/>

    <!-- Seatpost & Saddle -->
    <line x1="320" y1="310" x2="308" y2="270" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <!-- Classic Riveted Leather Saddle -->
    <path d="M 270 270 C 275 260, 335 258, 348 272 C 342 278, 328 283, 318 281 C 298 278, 278 282, 270 270 Z" fill="#6e2d09" stroke="#451a03" stroke-width="2"/>
    <circle cx="282" cy="272" r="1.5" fill="#f6ad55"/>
    <circle cx="295" cy="272" r="1.5" fill="#f6ad55"/>
  </g>

  <!-- ========================================== -->
  <!-- PELICAN (SEATED & CYCLING)                 -->
  <!-- ========================================== -->
  <g id="california-brown-pelican">
    <!-- Tail Feathers resting over saddle -->
    <path d="M 245 285 C 230 295, 235 315, 260 305 C 240 315, 252 330, 278 312 Z" fill="#4a3728"/>

    <!-- Torso / Heavy Body -->
    <!-- Layered Brown Pelican plumage: dark greyish-brown back/belly -->
    <path d="M 270 275 C 265 230, 320 200, 380 215 C 430 228, 445 270, 420 330 C 390 380, 335 360, 290 325 C 275 312, 270 292, 270 275 Z" fill="#5c4738" stroke="#3d2d24" stroke-width="2"/>
    
    <!-- Feather Shading / Belly Tone -->
    <path d="M 295 320 C 335 355, 390 355, 415 320 C 400 340, 350 348, 310 328 Z" fill="#38291f"/>
    <!-- Wing Folded on Side -->
    <path d="M 300 240 C 345 225, 420 255, 400 320 C 385 330, 350 315, 330 280 Z" fill="#4d3a2d" stroke="#36261c" stroke-width="2"/>
    <!-- Silver-grey speckled covert feathers on wing -->
    <path d="M 325 245 C 360 238, 400 262, 385 300 C 365 275, 345 260, 325 245 Z" fill="#847568" opacity="0.6"/>

    <!-- S-Curve Neck (Classic Pelican pose) -->
    <!-- Hind neck (rich chestnut/cinnamon brown of breeding California pelican) -->
    <path d="M 370 218 C 360 170, 425 125, 465 140 C 490 150, 495 185, 445 190 C 420 193, 405 210, 400 230 Z" fill="#5a2e17" stroke="#3b1b0b" stroke-width="1.5"/>
    
    <!-- Front/side of neck: bright white stripe running up to head -->
    <path d="M 430 190 C 470 185, 475 155, 460 145 C 440 135, 395 160, 395 195 C 395 208, 402 220, 410 230 C 418 215, 420 200, 430 190 Z" fill="#f8fafc"/>

    <!-- Head: Pale golden yellow crown & nape -->
    <path d="M 445 140 C 445 110, 485 108, 500 132 C 510 145, 500 162, 475 160 C 452 158, 445 150, 445 140 Z" fill="#fae588" stroke="#dfc65a" stroke-width="1"/>
    
    <!-- Eye Patch & Eye (Bright blue/straw iris with red bare skin rim) -->
    <circle cx="482" cy="133" r="7" fill="#b91c1c"/>
    <circle cx="482" cy="133" r="4.5" fill="#fef08a"/>
    <circle cx="483" cy="133" r="2.2" fill="#0f172a"/>
    <circle cx="484" cy="132" r="0.8" fill="#ffffff"/>

    <!-- Pelican Bill (Large long upper bill) -->
    <!-- Upper Mandible extending forward towards handlebars -->
    <path d="M 495 133 L 640 162 C 646 163, 646 169, 638 171 L 490 155 Z" fill="url(#billGrad)" stroke="#b45309" stroke-width="1.5"/>
    <!-- Hook at tip of bill -->
    <path d="M 640 162 Q 646 166, 641 173 Q 637 170, 638 165 Z" fill="#d97706"/>

    <!-- Large Gular Pouch (Throat sac) swinging back to chest -->
    <path d="M 490 155 L 638 171 C 605 200, 520 235, 470 168 Z" fill="url(#pouchGrad)" opacity="0.95" stroke="#991b1b" stroke-width="1.5"/>
    <!-- Pouch texture streaks -->
    <path d="M 525 168 Q 560 190, 610 178" fill="none" stroke="#fca5a5" stroke-width="1" opacity="0.4"/>
    <path d="M 505 164 Q 540 198, 580 185" fill="none" stroke="#fca5a5" stroke-width="1" opacity="0.4"/>

    <!-- Pelican Wing / Arm extended forward to steer handlebar -->
    <!-- Shoulder at (390, 240) reaching down to grip at (555, 260) -->
    <path d="M 385 235 C 430 240, 480 235, 525 248 C 542 253, 555 258, 560 262 C 555 268, 538 266, 515 258 C 470 252, 420 258, 380 255 Z" fill="#523e32" stroke="#36261c" stroke-width="1.5"/>
    <!-- Feathered "Hand" / Primary wingtips curling over the handlebar grip -->
    <path d="M 550 253 C 562 250, 570 255, 568 265 C 565 272, 553 272, 545 264 Z" fill="#38291f"/>

    <!-- Cool Coastal Detail: Pelican Bicycling Cap -->
    <path d="M 452 122 C 460 102, 498 106, 506 126 Z" fill="#0284c7"/>
    <path d="M 502 122 Q 532 125, 528 132 Q 502 131, 498 126 Z" fill="#0369a1"/>
  </g>

  <!-- ======================================================== -->
  <!-- ANIMATED CRANKSET & LEGS (SYNCHRONIZED KINEMATICS)       -->
  <!-- Bottom Bracket Spindle: (395, 475)                       -->
  <!-- Hip Joint Anchor: (345, 335)                             -->
  <!-- Pedal Orbit Radius: 48px                                 -->
  <!-- Angular velocity: 360 deg / 1.2s                         -->
  <!--                                                          -->
  <!-- Positions of Right Pedal (BB + [48*sin(θ), 48*cos(θ)]):  -->
  <!--   t=0.0s (0° / Top):   Knee ~ (395, 400), Pedal=(395, 427)-->
  <!--   t=0.3s (90° / Fwd):  Knee ~ (428, 415), Pedal=(443, 475)-->
  <!--   t=0.6s (180° / Btm): Knee ~ (390, 442), Pedal=(395, 523)-->
  <!--   t=0.9s (270° / Back):Knee ~ (355, 418), Pedal=(347, 475)-->
  <!-- ======================================================== -->

  <!-- RIGHT (NEAR-SIDE) LEG & FOOT -->
  <!-- Hip joint connection on pelvic flank -->
  <circle cx="345" cy="335" r="14" fill="#4d3a2d"/>

  <!-- Animated Thigh & Shin -->
  <!-- Coordinates: Hip(345,335) -> Knee -> Ankle/Pedal -->
  <g>
    <!-- Thigh (Thick feathered upper leg) -->
    <path stroke="#4a3728" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
        values="
          M 345 335 Q 375 365, 395 400;
          M 345 335 Q 395 375, 428 415;
          M 345 335 Q 375 390, 390 442;
          M 345 335 Q 348 375, 355 418;
          M 345 335 Q 375 365, 395 400
        "/>
    </path>

    <!-- Leg feather cowl over knee -->
    <path stroke="#5c4738" stroke-width="16" stroke-linecap="round" fill="none">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
        values="
          M 345 335 L 390 393;
          M 345 335 L 420 407;
          M 345 335 L 386 430;
          M 345 335 L 354 408;
          M 345 335 L 390 393
        "/>
    </path>

    <!-- Tarsus / Bare Shin (Scaly slate/olive leg) -->
    <path stroke="#374151" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
        values="
          M 395 400 L 395 427;
          M 428 415 L 443 475;
          M 390 442 L 395 523;
          M 355 418 L 347 475;
          M 395 400 L 395 427
        "/>
    </path>

    <!-- Large Totipalmate Webbed Foot on the Pedal -->
    <!-- Smoothly follows the pedal position and tilts to stay natural -->
    <path fill="#1f2937" stroke="#111827" stroke-width="1.5">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
        values="
          M 395 427 L 425 433 L 420 440 L 383 433 Z;
          M 443 475 L 473 487 L 466 494 L 431 481 Z;
          M 395 523 L 423 529 L 418 536 L 383 529 Z;
          M 347 475 L 377 475 L 372 482 L 337 479 Z;
          M 395 427 L 425 433 L 420 440 L 383 433 Z
        "/>
    </path>
  </g>

  <!-- RIGHT (NEAR-SIDE) CRANK & CHAINRING (Overlaying the leg/BB) -->
  <!-- Center Spindle: (395, 475) -->
  <g transform="translate(395, 475)">
    <!-- Continuous 360° crank rotation -->
    <animateTransform attributeName="transform" type="rotate"
      from="0" to="360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
    
    <!-- Chrome Chainring Sprocket -->
    <circle cx="0" cy="0" r="28" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="8" fill="#0f172a"/>

    <!-- Right Crank Arm (starts at 0° = pointing UP at t=0) -->
    <!-- Spindle (0,0) to Pedal Axle (0, -48) -->
    <line x1="0" y1="0" x2="0" y2="-48" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-48" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-48" r="5" fill="#334155"/>

    <!-- Right Pedal Body (Counter-rotates to stay level under the foot) -->
    <g transform="translate(0, -48)">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="-360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
      <rect x="-14" y="-5" width="28" height="10" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
      <!-- Reflector on Pedal -->
      <rect x="-10" y="-2" width="20" height="4" rx="1" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Bottom Bracket Dustcap Pivot Cover -->
  <circle cx="395" cy="475" r="9" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>

  <!-- Little California Palm Tree in Front Foreground passing by -->
  <g opacity="0.25">
    <path d="M 870 540 Q 860 420, 890 350" stroke="#451a03" stroke-width="12" fill="none"/>
  </g>
</svg>