<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d">
  <title id="t">California brown pelican riding a bicycle</title>
  <desc id="d">An animated brown pelican seated on a bicycle, pedaling with spinning wheels, revolving cranks and moving legs.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ee"/>
      <stop offset="1" stop-color="#fdf1d6"/>
    </linearGradient>
    <g id="wheel">
      <circle r="67" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(22.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(45)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(67.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(112.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(135)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="9" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="2 2"/>
      <circle r="5" fill="#777"/>
      <circle cx="52" cy="0" r="4" fill="#d83a2e"/>
    </g>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>
  <circle cx="660" cy="90" r="38" fill="#ffe27a" opacity="0.9"/>
  <rect x="0" y="320" width="800" height="100" fill="#5fb0c9"/>
  <rect x="0" y="320" width="800" height="6" fill="#8fd0e4"/>
  <rect x="0" y="420" width="800" height="80" fill="#8c8a84"/>
  <line x1="-70" y1="462" x2="900" y2="462" stroke="#f4f1e6" stroke-width="5" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.25s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="405" cy="424" rx="195" ry="6" fill="#000" opacity="0.22"/>

  <!-- wheels -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 250 350" to="360 250 350" dur="1.6s" repeatCount="indefinite"/>
    <use href="#wheel" x="250" y="350"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 560 350" to="360 560 350" dur="1.6s" repeatCount="indefinite"/>
    <use href="#wheel" x="560" y="350"/>
  </g>

  <!-- far crank, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 390 360" to="540 390 360" dur="1.6s" repeatCount="indefinite"/>
    <line x1="390" y1="360" x2="420" y2="360" stroke="#777" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 420 360" to="-360 420 360" dur="1.6s" repeatCount="indefinite"/>
      <rect x="409" y="361" width="22" height="5" rx="1.5" fill="#555"/>
      <path d="M414,354 L424,353 L440,359 L443,364 L436,363 L433,365 L426,363 L414,362 Z" fill="#35332e"/>
    </g>
  </g>

  <!-- far leg -->
  <path d="M355,240 L417.6,297.5 L360,360" fill="none" stroke="#4a4640" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
      M355,240 L417.6,297.5 L360,360;
      M355,240 L430,280 L369,339;
      M355,240 L437.7,259.7 L390,330;
      M355,240 L438,258.2 L411,339;
      M355,240 L432,276 L420,360;
      M355,240 L418.5,296.5 L411,381;
      M355,240 L407.6,307 L390,390;
      M355,240 L408.5,306 L369,381;
      M355,240 L417.6,297.5 L360,360"/>
  </path>

  <!-- chain -->
  <g stroke="#333" stroke-width="1.8" fill="none">
    <line x1="390" y1="343" x2="250" y2="341"/>
    <line x1="390" y1="377" x2="250" y2="359"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1f8a9a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="360" x2="350" y2="250"/>
    <line x1="350" y1="258" x2="514" y2="256"/>
    <line x1="390" y1="360" x2="516" y2="262"/>
    <line x1="250" y1="350" x2="390" y2="360"/>
    <line x1="250" y1="350" x2="351" y2="260"/>
    <line x1="505" y1="236" x2="518" y2="263"/>
    <line x1="516" y1="262" x2="560" y2="350"/>
  </g>
  <g fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="350" y1="250" x2="347" y2="243"/>
    <path d="M505,236 L498,220 L520,216 Q540,214 542,228 Q542,240 530,242"/>
  </g>
  <path d="M326,244 Q350,238 376,242 Q382,248 372,250 L334,250 Q326,250 326,244 Z" fill="#222"/>
  <circle cx="250" cy="350" r="6" fill="#777"/>
  <circle cx="560" cy="350" r="6" fill="#777"/>

  <!-- pelican: tail, body, neck, head, bill -->
  <path d="M298,190 L248,204 L252,216 L300,214 Z" fill="#4b392a"/>
  <ellipse cx="345" cy="200" rx="56" ry="37" transform="rotate(8 345 200)" fill="#8f7b5f" stroke="#4a3a2a" stroke-width="2"/>
  <ellipse cx="350" cy="216" rx="40" ry="17" transform="rotate(8 350 216)" fill="#b3a083" opacity="0.8"/>
  <path d="M375,200 C405,185 385,160 408,134" fill="none" stroke="#f3eee0" stroke-width="20" stroke-linecap="round"/>
  <path d="M366,192 C392,178 372,155 398,128" fill="none" stroke="#5a3b24" stroke-width="6" stroke-linecap="round"/>
  <circle cx="415" cy="125" r="16" fill="#f6f1e0"/>
  <path d="M400,119 Q412,104 428,114 Q416,116 400,119 Z" fill="#f0cf55"/>
  <path d="M426,112 L496,138 Q508,142 506,152 Q500,155 496,150 L426,130 Z" fill="#c2b08f" stroke="#6b5a42" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M428,128 L496,150 Q468,178 436,148 Z" fill="#9a8467" stroke="#6b5a42" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="421" cy="121" r="3.2" fill="#1a1a1a"/>
  <circle cx="422" cy="120" r="1" fill="#fff"/>

  <!-- near leg -->
  <path d="M355,240 L432,276 L420,360" fill="none" stroke="#3d3b36" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
      M355,240 L432,276 L420,360;
      M355,240 L418.5,296.5 L411,381;
      M355,240 L407.6,307 L390,390;
      M355,240 L408.5,306 L369,381;
      M355,240 L417.6,297.5 L360,360;
      M355,240 L430,280 L369,339;
      M355,240 L437.7,259.7 L390,330;
      M355,240 L438,258.2 L411,339;
      M355,240 L432,276 L420,360"/>
  </path>
  <ellipse cx="355" cy="238" rx="17" ry="12" fill="#8f7b5f"/>

  <!-- near crank, chainring, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 360" to="360 390 360" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="390" cy="360" r="17" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>
    <line x1="390" y1="360" x2="420" y2="360" stroke="#666" stroke-width="6" stroke-linecap="round"/>
    <circle cx="390" cy="360" r="5" fill="#333"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 420 360" to="-360 420 360" dur="1.6s" repeatCount="indefinite"/>
      <rect x="409" y="361" width="22" height="5" rx="1.5" fill="#333"/>
      <path d="M414,354 L424,353 L440,359 L443,364 L436,363 L433,365 L426,363 L414,362 Z" fill="#3f3d36"/>
    </g>
  </g>

  <!-- wing gripping the handlebar -->
  <path d="M352,178 C400,176 470,195 528,212 C530,220 524,224 516,222 C470,226 410,232 360,218 Z" fill="#62482f" stroke="#3a2a1c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M470,204 L528,212 C530,220 524,224 516,222 L468,220 Z" fill="#3a2a1c"/>
</svg>