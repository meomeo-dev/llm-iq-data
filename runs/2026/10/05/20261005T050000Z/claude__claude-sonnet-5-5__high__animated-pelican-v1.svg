<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#fdf1d6"/>
    </linearGradient>
    <g id="wheelart">
      <circle r="88" fill="none" stroke="#222" stroke-width="8"/>
      <circle r="82" fill="none" stroke="#c4c8cc" stroke-width="2.5"/>
      <g stroke="#8a8f94" stroke-width="1">
        <line x1="-82" y1="0" x2="82" y2="0"/>
        <line x1="-82" y1="0" x2="82" y2="0" transform="rotate(22.5)"/>
        <line x1="-82" y1="0" x2="82" y2="0" transform="rotate(45)"/>
        <line x1="-82" y1="0" x2="82" y2="0" transform="rotate(67.5)"/>
        <line x1="-82" y1="0" x2="82" y2="0" transform="rotate(90)"/>
        <line x1="-82" y1="0" x2="82" y2="0" transform="rotate(112.5)"/>
        <line x1="-82" y1="0" x2="82" y2="0" transform="rotate(135)"/>
        <line x1="-82" y1="0" x2="82" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="12" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="3 2"/>
      <circle r="7" fill="#666"/>
      <circle r="3" fill="#ddd"/>
      <circle cx="74" cy="0" r="4" fill="#c0392b"/>
      <circle cx="-74" cy="0" r="4" fill="#e8b43a"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="660" cy="100" r="42" fill="#ffd966" opacity="0.9"/>
  <path d="M0,470 Q120,420 240,470 T480,465 T800,455 L800,510 L0,510 Z" fill="#b9d6a0"/>
  <rect x="0" y="503" width="800" height="97" fill="#dccb9f"/>
  <line x1="0" y1="504" x2="800" y2="504" stroke="#a89466" stroke-width="3" stroke-dasharray="40 40">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.41s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#c4b182" stroke-width="3" stroke-dasharray="60 100">
    <animate attributeName="stroke-dashoffset" from="0" to="160" dur="0.83s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="507" rx="230" ry="7" fill="#000" opacity="0.15"/>

  <!-- Wheels -->
  <g transform="translate(250,410)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
      <use href="#wheelart"/>
    </g>
  </g>
  <g transform="translate(550,410)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
      <use href="#wheelart"/>
    </g>
  </g>

  <!-- Chain -->
  <line x1="390" y1="400" x2="250" y2="402" stroke="#333" stroke-width="3" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="14" dur="0.17s" repeatCount="indefinite"/>
  </line>
  <line x1="390" y1="440" x2="250" y2="418" stroke="#333" stroke-width="3" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.17s" repeatCount="indefinite"/>
  </line>

  <!-- Frame -->
  <g fill="none" stroke="#1f6fb2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="420" x2="250" y2="410"/>
    <line x1="354" y1="308" x2="250" y2="410" stroke-width="5"/>
    <line x1="390" y1="420" x2="351" y2="302"/>
    <line x1="356" y1="314" x2="508" y2="314"/>
    <line x1="390" y1="420" x2="514" y2="326"/>
    <line x1="508" y1="298" x2="516" y2="332" stroke-width="9"/>
    <path d="M512,320 L531,372 Q540,392 550,410" stroke="#444" stroke-width="6"/>
    <line x1="506" y1="298" x2="499" y2="270" stroke="#555" stroke-width="5"/>
    <path d="M498,270 L525,268 Q546,268 546,286" stroke="#333" stroke-width="5"/>
    <line x1="351" y1="304" x2="349" y2="290" stroke="#555" stroke-width="5"/>
  </g>
  <circle cx="250" cy="410" r="6" fill="#444"/>
  <circle cx="550" cy="410" r="6" fill="#444"/>

  <!-- Crank, chainring, pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 420" to="360 390 420" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="390" cy="420" r="20" fill="none" stroke="#777" stroke-width="3"/>
    <circle cx="390" cy="420" r="22" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 3"/>
    <line x1="390" y1="420" x2="422" y2="420" stroke="#8a8a8a" stroke-width="6" stroke-linecap="round"/>
    <line x1="390" y1="420" x2="358" y2="420" stroke="#6a6a6a" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 422 420" to="-360 422 420" dur="1.5s" repeatCount="indefinite"/>
      <rect x="410" y="417.5" width="24" height="5" rx="2" fill="#222"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 358 420" to="-360 358 420" dur="1.5s" repeatCount="indefinite"/>
      <rect x="346" y="417.5" width="24" height="5" rx="2" fill="#222"/>
    </g>
  </g>
  <circle cx="390" cy="420" r="6" fill="#444"/>

  <!-- Far leg -->
  <path d="M360,290 L421,349 L358,420 L373,419" fill="none" stroke="#242424" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.5s" repeatCount="indefinite" calcMode="linear" values="M360,290 L421,349 L358,420 L373,419;M360,290 L430,338 L362,404 L377,403;M360,290 L439,323 L374,392 L389,391;M360,290 L443,309 L390,388 L405,387;M360,290 L444,305 L406,392 L421,391;M360,290 L442,312 L418,404 L433,403;M360,290 L437,326 L422,420 L437,419;M360,290 L428,342 L418,436 L433,435;M360,290 L417,353 L406,448 L421,447;M360,290 L410,359 L390,452 L405,451;M360,290 L409,359 L374,448 L389,447;M360,290 L414,356 L362,436 L377,435;M360,290 L421,349 L358,420 L373,419"/>
  </path>

  <!-- Near leg -->
  <path d="M360,290 L437,326 L422,420 L437,419" fill="none" stroke="#454545" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.5s" repeatCount="indefinite" calcMode="linear" values="M360,290 L437,326 L422,420 L437,419;M360,290 L428,342 L418,436 L433,435;M360,290 L417,353 L406,448 L421,447;M360,290 L410,359 L390,452 L405,451;M360,290 L409,359 L374,448 L389,447;M360,290 L414,356 L362,436 L377,435;M360,290 L421,349 L358,420 L373,419;M360,290 L430,338 L362,404 L377,403;M360,290 L439,323 L374,392 L389,391;M360,290 L443,309 L390,388 L405,387;M360,290 L444,305 L406,392 L421,391;M360,290 L442,312 L418,404 L433,403;M360,290 L437,326 L422,420 L437,419"/>
  </path>

  <!-- Saddle -->
  <path d="M320,287 Q345,281 384,287 Q388,295 372,296 Q345,294 324,293 Z" fill="#222"/>

  <!-- Tail -->
  <path d="M330,262 L284,284 L292,293 L332,282 Z" fill="#4a3a2e"/>

  <!-- Body -->
  <ellipse cx="368" cy="252" rx="52" ry="36" transform="rotate(-20 368 252)" fill="#85725d"/>
  <ellipse cx="378" cy="262" rx="34" ry="20" transform="rotate(-20 378 262)" fill="#b3a28c"/>

  <!-- Neck -->
  <path d="M404,238 C430,236 408,200 438,186" fill="none" stroke="#f5efe2" stroke-width="22" stroke-linecap="round"/>
  <path d="M397,230 C418,222 402,198 428,177" fill="none" stroke="#5a4030" stroke-width="7" stroke-linecap="round"/>

  <!-- Head and bill -->
  <ellipse cx="448" cy="178" rx="18" ry="13" transform="rotate(15 448 178)" fill="#fbf4d8"/>
  <path d="M432,172 Q448,158 466,170 Q450,166 432,177 Z" fill="#f0cf4a"/>
  <circle cx="455" cy="174" r="3" fill="#111"/>
  <circle cx="456" cy="173" r="1" fill="#fff"/>
  <path d="M462,184 Q498,214 540,198 L462,187 Z" fill="#a89c7c"/>
  <path d="M461,171 L541,193 Q543,196 540,198 L461,185 Z" fill="#8d8d86"/>
  <path d="M538,192 Q549,194 546,204 Q541,200 538,198 Z" fill="#c8541f"/>

  <!-- Wing reaching the handlebar -->
  <path d="M372,232 C410,226 470,246 528,266 L532,276 C490,282 430,284 392,268 C378,262 366,246 372,232 Z" fill="#5e4a3a"/>
  <path d="M392,268 C430,284 490,282 532,276" fill="none" stroke="#c9b79c" stroke-width="2"/>
  <circle cx="528" cy="270" r="7" fill="#3d2e22"/>

  <!-- Thigh feathers -->
  <ellipse cx="362" cy="287" rx="16" ry="10" fill="#7a6652"/>
</svg>