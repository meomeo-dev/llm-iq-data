<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecae6"/>
      <stop offset="1" stop-color="#e9f5fb"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="420" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe08a"/>
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="60s" repeatCount="indefinite"/>
      <ellipse cx="300" cy="70" rx="50" ry="14"/>
      <ellipse cx="335" cy="60" rx="32" ry="14"/>
      <ellipse cx="900" cy="110" rx="55" ry="15"/>
      <ellipse cx="935" cy="100" rx="34" ry="14"/>
    </g>
  </g>

  <rect x="0" y="420" width="800" height="80" fill="#6b6f76"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#4f5359" stroke-width="4"/>
  <line x1="0" y1="466" x2="800" y2="466" stroke="#f5f5f5" stroke-width="6" stroke-dasharray="40 40">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.32s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="424" rx="210" ry="8" fill="#000" opacity="0.25"/>

  <!-- rear wheel -->
  <g transform="translate(250 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="77" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <circle r="77" fill="none" stroke="#6a6a6a" stroke-width="2" stroke-dasharray="6 9"/>
      <circle r="70" fill="none" stroke="#c9ced3" stroke-width="3"/>
      <path d="M-70 0H70 M0 -70V70 M-49.5 -49.5L49.5 49.5 M-49.5 49.5L49.5 -49.5 M-64.7 -26.8L64.7 26.8 M-64.7 26.8L64.7 -26.8 M-26.8 -64.7L26.8 64.7 M-26.8 64.7L26.8 -64.7" stroke="#9aa0a6" stroke-width="1.2" fill="none"/>
      <rect x="63" y="-3" width="6" height="6" fill="#e74c3c"/>
      <circle r="9" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="3 2"/>
      <circle r="6" fill="#888" stroke="#444" stroke-width="2"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(550 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="77" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <circle r="77" fill="none" stroke="#6a6a6a" stroke-width="2" stroke-dasharray="6 9"/>
      <circle r="70" fill="none" stroke="#c9ced3" stroke-width="3"/>
      <path d="M-70 0H70 M0 -70V70 M-49.5 -49.5L49.5 49.5 M-49.5 49.5L49.5 -49.5 M-64.7 -26.8L64.7 26.8 M-64.7 26.8L64.7 -26.8 M-26.8 -64.7L26.8 64.7 M-26.8 64.7L26.8 -64.7" stroke="#9aa0a6" stroke-width="1.2" fill="none"/>
      <rect x="63" y="-3" width="6" height="6" fill="#e74c3c"/>
      <circle r="6" fill="#888" stroke="#444" stroke-width="2"/>
    </g>
  </g>

  <!-- far crank arm and pedal -->
  <g transform="translate(390 345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-40" y2="0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(-40 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-12" y="-1" width="24" height="5" rx="2" fill="#1b1b1b"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#4d453c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M368 250 L412.7 303.8 L350 339">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="M368 250 L412.7 303.8 L350 339;M368 250 L429.2 284 L361.7 310.7;M368 250 L437.9 247.3 L390 299;M368 250 L437.8 244.3 L418.3 310.7;M368 250 L435 270 L430 339;M368 250 L418.7 298.3 L418.3 367.3;M368 250 L402.3 311 L390 379;M368 250 L403 310.6 L361.7 367.3;M368 250 L412.7 303.8 L350 339"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="2s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="350 345;361.7 316.7;390 305;418.3 316.7;430 345;418.3 373.3;390 385;361.7 373.3;350 345"/>
    <polygon points="-7,-12 5,-12 25,-5 25,-1 -7,-1" fill="#4d453c" stroke="#4d453c" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="345" x2="250" y2="340"/>
    <line x1="352" y1="278" x2="250" y2="340"/>
    <line x1="390" y1="345" x2="350" y2="275"/>
    <line x1="352" y1="278" x2="505" y2="258"/>
    <line x1="390" y1="345" x2="511" y2="268"/>
    <line x1="505" y1="255" x2="513" y2="272" stroke-width="8"/>
    <line x1="513" y1="272" x2="550" y2="340"/>
  </g>
  <line x1="350" y1="275" x2="346" y2="258" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M322 258 Q345 251 378 255 Q388 258 380 264 L326 265 Q317 262 322 258 Z" fill="#222"/>
  <line x1="505" y1="255" x2="502" y2="222" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M500 222 L528 218 Q546 217 547 233" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>

  <!-- chain -->
  <line x1="390" y1="323" x2="250" y2="332" stroke="#333" stroke-width="3" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.1s" repeatCount="indefinite"/>
  </line>
  <line x1="250" y1="348" x2="390" y2="367" stroke="#333" stroke-width="3" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.1s" repeatCount="indefinite"/>
  </line>

  <!-- near crank arm, chainring, pedal -->
  <g transform="translate(390 345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="22" fill="none" stroke="#555" stroke-width="4"/>
      <circle r="25" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 3"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#555" stroke-width="7" stroke-linecap="round"/>
      <circle r="6" fill="#999" stroke="#333" stroke-width="2"/>
      <g transform="translate(40 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-12" y="-1" width="24" height="5" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
  </g>

  <!-- pelican: tail and body -->
  <path d="M292 205 L252 222 L260 234 L296 234 Z" fill="#4d4036"/>
  <ellipse cx="345" cy="212" rx="60" ry="38" transform="rotate(-8 345 212)" fill="#8a7866"/>
  <ellipse cx="388" cy="222" rx="26" ry="24" fill="#5b4636"/>
  <path d="M300 215 Q330 240 375 238" fill="none" stroke="#a89680" stroke-width="3" stroke-linecap="round"/>

  <!-- neck, head, bill -->
  <path d="M388 198 C372 160 418 172 424 138" fill="none" stroke="#f6f1e6" stroke-width="22" stroke-linecap="round"/>
  <path d="M377 192 C362 158 405 168 412 138" fill="none" stroke="#5a3d2b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="430" cy="128" r="15" fill="#f6f1e6"/>
  <ellipse cx="428" cy="117" rx="10" ry="6" fill="#f1d77a"/>
  <path d="M443 135 Q470 180 517 157 L443 143 Z" fill="#7d6a4c"/>
  <path d="M441 120 L520 148 Q528 152 520 157 L442 138 Z" fill="#b2a37f"/>
  <circle cx="521" cy="153" r="3" fill="#5c4a35"/>
  <circle cx="436" cy="125" r="4.2" fill="#f1e7c0"/>
  <circle cx="437" cy="125" r="2.4" fill="#1b1b1b"/>

  <!-- wing reaching the handlebar -->
  <path d="M372 190 C410 180 470 195 524 212 L532 222 C480 224 420 236 372 222 Z" fill="#6a5a4b" stroke="#4a3d31" stroke-width="2" stroke-linejoin="round"/>
  <path d="M390 205 C430 205 480 212 520 217" fill="none" stroke="#8f7d6a" stroke-width="2"/>
  <path d="M390 214 C430 216 480 220 522 221" fill="none" stroke="#8f7d6a" stroke-width="2"/>
  <line x1="522" y1="219" x2="536" y2="218" stroke="#111" stroke-width="9" stroke-linecap="round"/>

  <!-- near leg -->
  <path fill="none" stroke="#5b5348" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M368 250 L435 270 L430 339">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="M368 250 L435 270 L430 339;M368 250 L418.7 298.3 L418.3 367.3;M368 250 L402.3 311 L390 379;M368 250 L403 310.6 L361.7 367.3;M368 250 L412.7 303.8 L350 339;M368 250 L429.2 284 L361.7 310.7;M368 250 L437.9 247.3 L390 299;M368 250 L437.8 244.3 L418.3 310.7;M368 250 L435 270 L430 339"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="2s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="430 345;418.3 373.3;390 385;361.7 373.3;350 345;361.7 316.7;390 305;418.3 316.7;430 345"/>
    <polygon points="-7,-12 5,-12 25,-5 25,-1 -7,-1" fill="#5b5348" stroke="#5b5348" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <circle cx="368" cy="250" r="9" fill="#7a6a58"/>
</svg>