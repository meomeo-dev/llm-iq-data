<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f5"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="78" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="72" fill="none" stroke="#b8c0c8" stroke-width="2"/>
      <g stroke="#8d969e" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(30)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(60)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(120)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(150)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(15)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(75)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
      </g>
      <circle r="8" fill="#555" stroke="#333" stroke-width="2"/>
      <circle cx="67" cy="0" r="3.5" fill="#e53935"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="120" cy="80" rx="46" ry="14"/>
    <ellipse cx="150" cy="70" rx="30" ry="12"/>
    <ellipse cx="620" cy="60" rx="52" ry="15"/>
    <ellipse cx="650" cy="50" rx="30" ry="11"/>
  </g>
  <rect x="0" y="421" width="800" height="59" fill="#d9c493"/>
  <rect x="0" y="421" width="800" height="4" fill="#b59d62"/>
  <g fill="#9c8450">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-175 0" dur="0.5s" repeatCount="indefinite"/>
      <rect x="0" y="445" width="40" height="5"/>
      <rect x="175" y="445" width="40" height="5"/>
      <rect x="350" y="445" width="40" height="5"/>
      <rect x="525" y="445" width="40" height="5"/>
      <rect x="700" y="445" width="40" height="5"/>
      <rect x="875" y="445" width="40" height="5"/>
    </g>
  </g>

  <!-- wheels -->
  <g transform="translate(250 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far crank and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 390 350" to="540 390 350" dur="1.6s" repeatCount="indefinite"/>
    <line x1="390" y1="350" x2="430" y2="350" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 430 350" to="-540 430 350" dur="1.6s" repeatCount="indefinite"/>
      <rect x="416" y="347.5" width="28" height="5" rx="2" fill="#222"/>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#1c1c20" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M335,240 L406.3,286.3 L353,344">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M335,240 L406.3,286.3 L353,344;
              M335,240 L418.1,258.1 L364.7,315.7;
              M335,240 L419.5,230.3 L393,304;
              M335,240 L420,236.8 L421.3,315.7;
              M335,240 L415.9,266.2 L433,344;
              M335,240 L399.4,295.4 L421.3,372.3;
              M335,240 L389.7,305 L393,384;
              M335,240 L395.1,300.1 L364.7,372.3;
              M335,240 L406.3,286.3 L353,344"/>
  </path>
  <ellipse rx="13" ry="4.5" fill="#1c1c20" cx="353" cy="344">
    <animate attributeName="cx" dur="1.6s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="353;364.7;393;421.3;433;421.3;393;364.7;353"/>
    <animate attributeName="cy" dur="1.6s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="344;315.7;304;315.7;344;372.3;384;372.3;344"/>
  </ellipse>

  <!-- chain -->
  <g stroke="#333" stroke-width="2" stroke-dasharray="3 2" fill="none">
    <line x1="390" y1="332" x2="250" y2="332"/>
    <line x1="390" y1="368" x2="250" y2="348"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="340" x2="390" y2="350"/>
    <line x1="250" y1="340" x2="343" y2="266"/>
    <line x1="390" y1="350" x2="341" y2="258"/>
    <line x1="343" y1="264" x2="505" y2="252"/>
    <line x1="390" y1="350" x2="515" y2="272"/>
    <line x1="498" y1="240" x2="520" y2="282"/>
    <line x1="520" y1="282" x2="550" y2="340"/>
  </g>
  <line x1="341" y1="258" x2="333" y2="243" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M306,238 Q330,229 360,236 L357,243 Q332,245 308,244 Z" fill="#2b2b2b"/>
  <!-- stem and handlebar -->
  <line x1="498" y1="240" x2="486" y2="216" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M486,214 L506,212 Q528,212 528,232 Q528,250 514,250" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- rear cog -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 250 340" to="360 250 340" dur="0.71s" repeatCount="indefinite"/>
    <circle cx="250" cy="340" r="8" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="3 2"/>
  </g>

  <!-- near crank, chainring, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 350" to="360 390 350" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="390" cy="350" r="18" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="4 2"/>
    <line x1="390" y1="350" x2="430" y2="350" stroke="#3a3a3a" stroke-width="7" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 430 350" to="-360 430 350" dur="1.6s" repeatCount="indefinite"/>
      <rect x="416" y="347.5" width="28" height="5" rx="2" fill="#111"/>
    </g>
  </g>
  <circle cx="390" cy="350" r="6" fill="#999" stroke="#333" stroke-width="2"/>

  <!-- pelican tail -->
  <path d="M285,205 L238,232 L246,242 L292,232 Z" fill="#5b4a3b" stroke="#3f3228" stroke-width="2" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="322" cy="205" rx="56" ry="36" transform="rotate(-18 322 205)" fill="#8a7968" stroke="#5e4f41" stroke-width="2"/>
  <path d="M300,232 Q335,244 362,222" fill="none" stroke="#c9bba8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <!-- neck -->
  <path d="M358,190 C392,172 372,142 408,122" fill="none" stroke="#f4efe3" stroke-width="22" stroke-linecap="round"/>
  <path d="M350,178 C382,160 362,134 396,112" fill="none" stroke="#5b3a24" stroke-width="7" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="414" cy="118" r="17" fill="#f6f0dc"/>
  <path d="M400,110 Q412,94 430,106 Q416,104 400,110 Z" fill="#f2d86b"/>
  <!-- bill and pouch -->
  <path d="M424,110 L505,136 Q511,141 503,143 L428,128 Z" fill="#b9a98a" stroke="#7d6e52" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M428,128 Q470,162 503,143 Q470,138 428,128 Z" fill="#c9985a" stroke="#8a6535" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="419" cy="112" r="3.6" fill="#fff"/>
  <circle cx="419.5" cy="112" r="2.2" fill="#111"/>
  <!-- wing reaching to handlebar -->
  <path d="M318,178 C350,170 420,185 510,208 L514,219 C430,224 360,216 320,206 Z" fill="#6e5a48" stroke="#4d3d30" stroke-width="2" stroke-linejoin="round"/>
  <path d="M345,190 C390,194 440,204 500,213 M340,200 C390,206 440,212 505,217" fill="none" stroke="#4d3d30" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="512" cy="213" r="6" fill="#3a2f26"/>

  <!-- near leg -->
  <path fill="none" stroke="#2e2e33" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M335,240 L415.9,266.2 L433,344">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M335,240 L415.9,266.2 L433,344;
              M335,240 L399.4,295.4 L421.3,372.3;
              M335,240 L389.7,305 L393,384;
              M335,240 L395.1,300.1 L364.7,372.3;
              M335,240 L406.3,286.3 L353,344;
              M335,240 L418.1,258.1 L364.7,315.7;
              M335,240 L419.5,230.3 L393,304;
              M335,240 L420,236.8 L421.3,315.7;
              M335,240 L415.9,266.2 L433,344"/>
  </path>
  <ellipse rx="13" ry="4.5" fill="#2e2e33" cx="433" cy="344">
    <animate attributeName="cx" dur="1.6s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="433;421.3;393;364.7;353;364.7;393;421.3;433"/>
    <animate attributeName="cy" dur="1.6s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="344;372.3;384;372.3;344;315.7;304;315.7;344"/>
  </ellipse>
</svg>