<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- 漫射陈列室背景渐变 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f3f4" />
      <stop offset="55%" stop-color="#f8fafb" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- 柔和阴影滤镜 -->
    <filter id="plinth-shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" />
    </filter>
    <filter id="shed-shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" />
    </filter>
    <filter id="small-shadow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>

    <!-- 底座侧壁质感渐变 -->
    <linearGradient id="plinth-side-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d4926" />
      <stop offset="35%" stop-color="#556636" />
      <stop offset="70%" stop-color="#46542c" />
      <stop offset="100%" stop-color="#2d371b" />
    </linearGradient>

    <!-- 底座顶面漫射光 -->
    <radialGradient id="plinth-top-light" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12" />
    </radialGradient>

    <!-- 机库受光面侧墙骨架 Pattern（密集的竖向窄格） -->
    <pattern id="wall-ribs-pattern" width="2.5" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(26.5)">
      <rect x="0" y="0" width="2.5" height="60" fill="#8f9d90" />
      <line x1="0" y1="0" x2="0" y2="60" stroke="#58675a" stroke-width="0.75" />
      <line x1="0.8" y1="0" x2="0.8" y2="60" stroke="#a7b7a8" stroke-width="0.5" />
    </pattern>

    <!-- 巨门横向波纹 Pattern -->
    <pattern id="door-corrugation" width="10" height="2" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="10" height="2" fill="#5a6a6f" />
      <line x1="0" y1="0" x2="10" y2="0" stroke="#48565b" stroke-width="0.6" />
      <line x1="0" y1="1" x2="10" y2="1" stroke="#68797f" stroke-width="0.5" />
    </pattern>

    <!-- 农田麦浪耕纹 Pattern 1 -->
    <pattern id="furrow-pattern-1" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="8" y2="0" stroke="#8ca854" stroke-width="1.2" stroke-opacity="0.35" />
    </pattern>
    <pattern id="furrow-pattern-2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="6" y2="0" stroke="#c0a653" stroke-width="1.2" stroke-opacity="0.4" />
    </pattern>

    <!-- 底座顶面剪裁路径 -->
    <clipPath id="plinth-clip">
      <ellipse cx="500" cy="435" rx="396" ry="196" />
    </clipPath>

    <!-- 近侧机库侧墙剪裁路径 -->
    <clipPath id="shed1-sidewall-clip">
      <polygon points="575,525 269,372 269,324 575,477" />
    </clipPath>

    <!-- 远侧机库受光侧墙剪裁路径 -->
    <clipPath id="shed2-sidewall-clip">
      <polygon points="665,480 389,342 389,294 665,432" />
    </clipPath>

    <!-- 小车模型组件定义 -->
    <g id="mini-car-red">
      <!-- 车底阴影 -->
      <ellipse cx="0" cy="1.5" rx="4.5" ry="2" fill="#1b241b" opacity="0.6" />
      <!-- 车身底座 -->
      <rect x="-3.5" y="-1.8" width="7" height="3.2" rx="1.2" fill="#aa3228" />
      <!-- 车顶车窗 -->
      <rect x="-1.8" y="-1.4" width="3.6" height="2.4" rx="0.8" fill="#d8e3e8" />
      <!-- 车顶 -->
      <rect x="-1.4" y="-1.1" width="2.8" height="2" rx="0.6" fill="#8e261e" />
      <!-- 车头微高光 -->
      <circle cx="3.2" cy="-0.2" r="0.6" fill="#fff4cf" />
    </g>

    <g id="mini-car-green">
      <ellipse cx="0" cy="1.5" rx="4.5" ry="2" fill="#1b241b" opacity="0.6" />
      <rect x="-3.5" y="-1.8" width="7" height="3.2" rx="1.2" fill="#2b5e3b" />
      <rect x="-1.8" y="-1.4" width="3.6" height="2.4" rx="0.8" fill="#d2ded6" />
      <rect x="-1.4" y="-1.1" width="2.8" height="2" rx="0.6" fill="#1f442b" />
      <circle cx="3.2" cy="-0.2" r="0.6" fill="#fff5cc" />
    </g>

    <g id="mini-car-blue">
      <ellipse cx="0" cy="1.5" rx="5" ry="2.2" fill="#1b241b" opacity="0.6" />
      <!-- 厢式小货车体块 -->
      <rect x="-4" y="-2" width="8" height="3.6" rx="1" fill="#446a88" />
      <rect x="0.5" y="-1.8" width="3" height="3.2" rx="0.6" fill="#cad5dc" />
      <rect x="-3.8" y="-1.8" width="4.2" height="3.2" rx="0.6" fill="#35556f" />
    </g>
  </defs>

  <!-- 1. 背景 -->
  <rect width="1000" height="800" fill="url(#bg-grad)" />

  <!-- 2. 底座下方投影 -->
  <ellipse cx="500" cy="492" rx="415" ry="145" fill="#182218" opacity="0.28" filter="url(#plinth-shadow-blur)" />

  <!-- 3. 圆形展示底座厚度侧壁 -->
  <path d="M 104 435 A 396 196 0 0 0 896 435 L 896 476 A 396 196 0 0 1 104 476 Z" fill="url(#plinth-side-grad)" />
  <!-- 底座底边缘极暗反光边 -->
  <path d="M 104 476 A 396 196 0 0 0 896 476" fill="none" stroke="#1a2210" stroke-width="1.5" opacity="0.7" />

  <!-- 4. 底座顶面农田与环境（受 clipPath 约束） -->
  <g clip-path="url(#plinth-clip)">
    <!-- 农田底层色 -->
    <ellipse cx="500" cy="435" rx="396" ry="196" fill="#9db862" />

    <!-- 农田色块拼图（黄绿、麦黄、浅黄、深绿相间） -->
    <!-- 田块 A: 西南深麦黄 -->
    <polygon points="100,430 280,330 380,440 180,560" fill="#d2b96a" />
    <polygon points="100,430 280,330 380,440 180,560" fill="url(#furrow-pattern-2)" />

    <!-- 田块 B: 南侧浅鲜绿 -->
    <polygon points="180,560 380,440 470,550 330,625" fill="#a6c466" />

    <!-- 田块 C: 东南浅麦黄 -->
    <polygon points="470,550 330,625 580,630 630,550" fill="#deb855" />
    <polygon points="470,550 330,625 580,630 630,550" fill="url(#furrow-pattern-2)" />

    <!-- 田块 D: 正南暖黄草地 -->
    <polygon points="630,550 580,630 780,590 750,510" fill="#c7b163" />

    <!-- 田块 E: 东侧草绿 -->
    <polygon points="750,510 780,590 896,435 770,390" fill="#8ea853" />
    <polygon points="750,510 780,590 896,435 770,390" fill="url(#furrow-pattern-1)" />

    <!-- 田块 F: 东北深绿耕地 -->
    <polygon points="770,390 896,435 760,280 610,300" fill="#758f44" />

    <!-- 田块 G: 北侧麦田 -->
    <polygon points="610,300 760,280 500,240 430,300" fill="#d9be6e" />
    <polygon points="610,300 760,280 500,240 430,300" fill="url(#furrow-pattern-2)" />

    <!-- 田块 H: 西北黄绿 -->
    <polygon points="430,300 500,240 240,270 230,340" fill="#a4bd68" />
    <polygon points="430,300 500,240 240,270 230,340" fill="url(#furrow-pattern-1)" />

    <!-- 田块 I: 西侧嫩绿牧草 -->
    <polygon points="230,340 240,270 120,380 200,420" fill="#93af5a" />

    <!-- 机库地基硬化浅灰地面与周围压实平地 -->
    <polygon points="245,360 480,245 765,385 750,470 550,545 245,395" fill="#889e5a" opacity="0.6" />

    <!-- 田野细树篱（细深绿带微凸灌木感） -->
    <g stroke="#394f24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M 180 560 L 380 440 L 470 550" />
      <path d="M 380 440 L 280 330 L 430 300" />
      <path d="M 630 550 L 750 510 L 770 390 L 610 300" />
      <path d="M 470 550 L 630 550" />
      <path d="M 230 340 L 380 440" />
      <path d="M 750 510 L 890 445" />
    </g>
    <!-- 树篱小阴影 -->
    <g stroke="#1e2d12" stroke-width="1.2" stroke-linecap="round" opacity="0.35">
      <path d="M 182 562 L 382 442 L 472 552" />
      <path d="M 632 552 L 752 512 L 772 392" />
    </g>

    <!-- 乡间小路（从底座边缘经村落通向两库之间） -->
    <!-- 主路段 -->
    <path d="M 175 540 C 230 560, 270 565, 330 560 C 400 555, 460 550, 520 535 C 570 522, 615 508, 654 485" 
          fill="none" stroke="#d5d7cf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 175 540 C 230 560, 270 565, 330 560 C 400 555, 460 550, 520 535 C 570 522, 615 508, 654 485" 
          fill="none" stroke="#bcbfae" stroke-width="1" stroke-dasharray="8 4" stroke-linecap="round" opacity="0.6" />

    <!-- 村庄内部分支小道 -->
    <path d="M 240 520 C 255 535, 275 550, 310 555" fill="none" stroke="#cfd2c8" stroke-width="3" stroke-linecap="round" />

    <!-- 5. 微缩村舍与小教堂尖塔（位于底座左前角） -->
    <!-- 村庄投影层 -->
    <g fill="#1e2916" opacity="0.38" filter="url(#small-shadow-blur)">
      <!-- 教堂投影 -->
      <polygon points="275,516 305,528 295,532 268,520" />
      <polygon points="270,516 288,522 284,524 266,518" />
      <!-- 各村舍投影 -->
      <rect x="226" y="527" width="14" height="8" rx="2" />
      <rect x="248" y="546" width="13" height="7" rx="2" />
      <rect x="296" y="567" width="15" height="7" rx="2" />
      <rect x="326" y="546" width="14" height="7" rx="2" />
      <rect x="336" y="518" width="12" height="6" rx="2" />
      <ellipse cx="220" cy="515" rx="7" ry="4" />
      <ellipse cx="258" cy="508" rx="8" ry="4.5" />
      <ellipse cx="304" cy="520" rx="9" ry="5" />
    </g>

    <!-- 村舍实体（高度不超过机库高度十分之一，即不超过 7px） -->
    <!-- 村舍 1 -->
    <g transform="translate(222, 522)">
      <polygon points="0,5 10,0 10,4 0,9" fill="#c4b59d" />
      <polygon points="10,0 14,2 14,6 10,4" fill="#a89a84" />
      <!-- 坡屋顶 -->
      <polygon points="-1,5 9,-1 11,0 1,6" fill="#a44b38" />
      <polygon points="9,-1 15,2 13,3 8,0" fill="#7a3425" />
    </g>

    <!-- 村舍 2 -->
    <g transform="translate(245, 540)">
      <polygon points="0,4 9,0 9,4 0,8" fill="#dedbd4" />
      <polygon points="9,0 13,2 13,6 9,4" fill="#aba7a0" />
      <polygon points="-1,4 8,-1 10,0 1,5" fill="#58636e" />
      <polygon points="8,-1 14,2 12,3 7,0" fill="#3f474f" />
    </g>

    <!-- 村舍 3 -->
    <g transform="translate(292, 560)">
      <polygon points="0,5 11,0 11,4 0,9" fill="#baa48b" />
      <polygon points="11,0 15,2 15,6 11,4" fill="#99836d" />
      <polygon points="-1,5 10,-1 12,0 1,6" fill="#944535" />
      <polygon points="10,-1 16,2 14,3 9,0" fill="#6d3023" />
    </g>

    <!-- 村舍 4 -->
    <g transform="translate(322, 540)">
      <polygon points="0,4 10,0 10,4 0,8" fill="#d9d5cb" />
      <polygon points="10,0 13,2 13,6 10,4" fill="#b0aba1" />
      <polygon points="-1,4 9,-1 11,0 1,5" fill="#5b646c" />
      <polygon points="9,-1 14,2 12,3 8,0" fill="#424a51" />
    </g>

    <!-- 村舍 5 -->
    <g transform="translate(332, 512)">
      <polygon points="0,4 8,0 8,3 0,7" fill="#bfae99" />
      <polygon points="8,0 12,2 12,5 8,3" fill="#998977" />
      <polygon points="-1,4 7,-1 9,0 1,5" fill="#994838" />
      <polygon points="7,-1 13,2 11,3 6,0" fill="#713225" />
    </g>

    <!-- 小教堂与尖塔 -->
    <g transform="translate(268, 508)">
      <!-- 教堂主殿（巴西利卡长方小体块与双坡顶） -->
      <polygon points="6,9 18,3 18,8 6,14" fill="#c7bead" />
      <polygon points="18,3 24,6 24,11 18,8" fill="#9e9585" />
      <polygon points="5,9 17,3 19,4 7,10" fill="#545e68" />
      <polygon points="17,3 25,7 23,8 16,4" fill="#3e464e" />
      <!-- 教堂方塔楼（塔高约 9px） -->
      <polygon points="0,7 6,4 6,12 0,15" fill="#ded7ca" />
      <polygon points="6,4 10,6 10,14 6,12" fill="#aca497" />
      <!-- 教堂尖塔（高约 11px 的细尖棱锥） -->
      <polygon points="3,-5 0,7 6,4" fill="#717c86" />
      <polygon points="3,-5 6,4 10,6" fill="#4a535c" />
      <!-- 尖塔顶极细亮线 -->
      <line x1="3" y1="-5" x2="3" y2="-7" stroke="#e8eff5" stroke-width="0.6" />
    </g>

    <!-- 圆形树冠的大树几棵 -->
    <!-- 树 1 -->
    <g transform="translate(218, 512)">
      <rect x="-0.8" y="2" width="1.6" height="4" fill="#4a3b2c" />
      <ellipse cx="0" cy="0" rx="6.5" ry="5.5" fill="#52782b" />
      <path d="M -5 1 A 6 5 0 0 0 5 1 A 5.5 4.5 0 0 1 -5 1" fill="#2f4a18" />
      <ellipse cx="-1.5" cy="-1.5" rx="3.5" ry="2.5" fill="#789e3d" opacity="0.75" />
    </g>

    <!-- 树 2 -->
    <g transform="translate(254, 503)">
      <rect x="-0.8" y="2" width="1.6" height="4" fill="#4a3b2c" />
      <ellipse cx="0" cy="0" rx="7.5" ry="6" fill="#496d26" />
      <path d="M -6 1.5 A 7 5.5 0 0 0 6 1.5 A 6 5 0 0 1 -6 1.5" fill="#283f14" />
      <ellipse cx="-2" cy="-1.8" rx="4" ry="3" fill="#6f9435" opacity="0.8" />
    </g>

    <!-- 树 3 -->
    <g transform="translate(300, 516)">
      <rect x="-0.8" y="2" width="1.6" height="4" fill="#4a3b2c" />
      <ellipse cx="0" cy="0" rx="8" ry="6.5" fill="#587f2e" />
      <path d="M -6.5 1.5 A 7.5 6 0 0 0 6.5 1.5 A 6.5 5 0 0 1 -6.5 1.5" fill="#324d1a" />
      <ellipse cx="-2" cy="-2" rx="4.5" ry="3.2" fill="#7ea741" opacity="0.85" />
    </g>

    <!-- 树 4 (沿小路散落) -->
    <g transform="translate(345, 532)">
      <ellipse cx="0" cy="0" rx="6" ry="5" fill="#446622" />
      <path d="M -5 1 A 5.5 4.5 0 0 0 5 1 A 4.8 4 0 0 1 -5 1" fill="#243812" />
      <ellipse cx="-1.5" cy="-1.2" rx="3" ry="2.2" fill="#688c30" opacity="0.8" />
    </g>

    <!-- 树 5 -->
    <g transform="translate(385, 495)">
      <ellipse cx="0" cy="0" rx="7" ry="5.5" fill="#50752a" />
      <path d="M -5.5 1.2 A 6.5 5 0 0 0 5.5 1.2 A 5.5 4.5 0 0 1 -5.5 1.2" fill="#2c4416" />
      <ellipse cx="-1.8" cy="-1.5" rx="3.5" ry="2.5" fill="#759c3a" opacity="0.8" />
    </g>

    <!-- 6. 机库在地面上的巨大漫射投影（沿光照方向朝右下延伸） -->
    <g fill="#1a2615" opacity="0.4" filter="url(#shed-shadow-blur)">
      <!-- 远侧机库（机库2）阴影 -->
      <polygon points="457,308 733,446 785,465 795,435 520,290" />
      <!-- 近侧机库（机库1）阴影（落在两库空地与部分田野上） -->
      <polygon points="337,338 643,491 695,510 685,475 390,325" />
    </g>

    <!-- 7. 两库之间的直道小路 -->
    <polygon points="658,487 648,482 358,337 368,342" fill="#dadcd4" />
    <line x1="653" y1="484.5" x2="363" y2="339.5" stroke="#babdb3" stroke-width="0.8" />

    <!-- 8. 远侧巨型机库（机库 2，略短，长 308px，宽 76px，高 68px） -->
    <!-- ① 内部/空地间侧墙（中间弱受光面） -->
    <polygon points="665,480 389,342 389,294 665,432" fill="#758678" />
    <!-- 侧墙竖向骨架（带 clipPath） -->
    <polygon points="665,480 389,342 389,294 665,432" fill="url(#wall-ribs-pattern)" opacity="0.4" clip-path="url(#shed2-sidewall-clip)" />

    <!-- ② 背光侧端墙（高大端面） -->
    <path d="M 665 480 L 733 446 L 733 398 Q 717 393 699 395 Q 680 409 665 432 Z" fill="#46545b" />

    <!-- 巨型分段滑门（关闭状态，门扇略浅带横向纹理） -->
    <!-- 门轨上楣梁横梁 -->
    <polygon points="664,435 734,400 734,404 664,439" fill="#323e44" />
    <!-- 门扇主体（高约 51px，为机库高度 3/4） -->
    <polygon points="665,479 733,445 733,403 665,437" fill="#58676d" />
    <polygon points="665,479 733,445 733,403 665,437" fill="url(#door-corrugation)" opacity="0.65" />
    <!-- 滑门分段竖缝（8 扇巨大滑门） -->
    <g stroke="#2c373c" stroke-width="0.9" opacity="0.85">
      <line x1="673.5" y1="474.7" x2="673.5" y2="432.7" />
      <line x1="682" y1="470.5" x2="682" y2="428.5" />
      <line x1="690.5" y1="466.2" x2="690.5" y2="424.2" />
      <line x1="699" y1="462" x2="699" y2="420" />
      <line x1="707.5" y1="457.7" x2="707.5" y2="415.7" />
      <line x1="716" y1="453.5" x2="716" y2="411.5" />
      <line x1="724.5" y1="449.2" x2="724.5" y2="407.2" />
    </g>
    <!-- 端墙底部暗边 -->
    <line x1="665" y1="480" x2="733" y2="446" stroke="#232b2f" stroke-width="1.8" />

    <!-- ③ 屋顶右坡（背光/中间坡面） -->
    <path d="M 699 395 Q 717 393 733 398 L 457 260 Q 441 255 423 257 Z" fill="#647568" />

    <!-- ④ 屋顶左坡（受光坡面，偏浅灰绿） -->
    <path d="M 665 432 Q 680 409 699 395 L 423 257 Q 404 271 389 294 Z" fill="#95a999" />
    <!-- 坡面波纹细节微线 -->
    <path d="M 675 423 L 399 285 M 686 411 L 410 273" stroke="#b2c4b5" stroke-width="0.8" opacity="0.5" />

    <!-- ⑤ 屋脊天窗带（浅灰白，贯通全长） -->
    <polygon points="697,394 421,256 425,258 701,396" fill="#e5ece7" stroke="#b8c7bc" stroke-width="0.6" />
    <line x1="699" y1="395" x2="423" y2="257" stroke="#ffffff" stroke-width="0.8" />

    <!-- 远侧机库上部高光亮边 -->
    <path d="M 665 432 Q 680 409 699 395" fill="none" stroke="#d5e5d8" stroke-width="1.2" />

    <!-- 9. 近侧巨型机库（机库 1，主景，长 342px，宽 76px，高 68px，比例精确） -->
    <!-- ① 近侧机库垂直侧墙（正面大受光面，灰绿波纹板，整排铺满密集的竖向凸起骨架） -->
    <!-- 侧墙底色 -->
    <polygon points="575,525 269,372 269,324 575,477" fill="#8f9d90" />
    <!-- 密集的竖向骨架 Narrow bays（使用 clipPath 严格限制在侧墙内部） -->
    <polygon points="575,525 269,372 269,324 575,477" fill="url(#wall-ribs-pattern)" clip-path="url(#shed1-sidewall-clip)" />

    <!-- 侧墙顶边更亮的窄边高光 -->
    <line x1="269" y1="324" x2="575" y2="477" stroke="#d1e3d3" stroke-width="1.6" />
    <!-- 侧墙底边与地面接缝 AO 遮蔽阴影 -->
    <line x1="269" y1="372" x2="575" y2="525" stroke="#364238" stroke-width="1.6" opacity="0.6" />

    <!-- ② 近端高大端墙（背光面，偏深蓝灰） -->
    <path d="M 575 525 L 643 491 L 643 443 Q 627 438 609 440 Q 590 454 575 477 Z" fill="#47565d" />

    <!-- 端门上方半圆形/微弧形山墙结构加强肋 -->
    <path d="M 577 475 Q 592 453 609 442 Q 625 439 641 443" fill="none" stroke="#3a484e" stroke-width="1.5" />
    <line x1="609" y1="440" x2="609" y2="445" stroke="#333f44" stroke-width="1.2" />

    <!-- 巨门滑轨大横梁（微凸出） -->
    <polygon points="574,476 644,441 644,445 574,480" fill="#313d42" />
    <line x1="574" y1="476" x2="644" y2="441" stroke="#506168" stroke-width="0.8" />

    <!-- 巨型分段滑门（门扇高度为机库高四分之三，约 51px，关闭状态，细密横向纹理） -->
    <polygon points="575,524 643,490 643,444 575,478" fill="#5b6b71" />
    <polygon points="575,524 643,490 643,444 575,478" fill="url(#door-corrugation)" opacity="0.75" />

    <!-- 门扇之间的细微拼缝（8 扇巨门并列闭合） -->
    <g stroke="#263136" stroke-width="1" opacity="0.9">
      <line x1="583.5" y1="519.7" x2="583.5" y2="473.7" />
      <line x1="592" y1="515.5" x2="592" y2="469.5" />
      <line x1="600.5" y1="511.2" x2="600.5" y2="465.2" />
      <line x1="609" y1="507" x2="609" y2="461" />
      <line x1="617.5" y1="502.7" x2="617.5" y2="456.7" />
      <line x1="626" y1="498.5" x2="626" y2="452.5" />
      <line x1="634.5" y1="494.2" x2="634.5" y2="448.2" />
    </g>

    <!-- 门扇中缝微高光与门缝深度感 -->
    <g stroke="#718289" stroke-width="0.5" opacity="0.6">
      <line x1="584" y1="519.7" x2="584" y2="473.7" />
      <line x1="601" y1="511.2" x2="601" y2="465.2" />
      <line x1="618" y1="502.7" x2="618" y2="456.7" />
      <line x1="635" y1="494.2" x2="635" y2="448.2" />
    </g>

    <!-- 端墙底边深色暗边 -->
    <line x1="575" y1="525" x2="643" y2="491" stroke="#222b30" stroke-width="2" />

    <!-- ③ 机库屋顶右坡（微带弧度两坡顶之背光坡，深灰绿） -->
    <path d="M 609 440 Q 627 438 643 443 L 337 290 Q 321 285 303 287 Z" fill="#67796b" />
    <path d="M 619 432 L 313 279 M 631 437 L 325 284" stroke="#546457" stroke-width="0.8" opacity="0.6" />

    <!-- ④ 机库屋顶左坡（受光大坡面，偏浅灰绿） -->
    <path d="M 575 477 Q 590 454 609 440 L 303 287 Q 284 301 269 324 Z" fill="#9db1a0" />
    <!-- 坡面波纹纵向条纹质感 -->
    <g stroke="#b8ccbb" stroke-width="0.8" opacity="0.45">
      <path d="M 584 468 L 278 315" />
      <path d="M 593 458 L 287 305" />
      <path d="M 601 448 L 295 295" />
    </g>

    <!-- ⑤ 屋檐悬挑阴影（AO 环境光遮蔽） -->
    <line x1="269" y1="324" x2="575" y2="477" stroke="#334235" stroke-width="2.2" opacity="0.5" />

    <!-- ⑥ 屋脊通长天窗带（浅灰白，微微凸起于圆润屋脊上） -->
    <polygon points="607,439 301,286 305,288 611,441" fill="#e8eee9" stroke="#b5c4b8" stroke-width="0.75" />
    <!-- 天窗高光中线与细小分格 -->
    <line x1="609" y1="440" x2="303" y2="287" stroke="#ffffff" stroke-width="1.1" />

    <!-- 近侧机库屋顶端部曲线高光亮边 -->
    <path d="M 575 477 Q 590 454 609 440" fill="none" stroke="#e0ece2" stroke-width="1.5" />

    <!-- 10. 动态微缩元素：田间公路上平稳缓行的小汽车（<= 12 个动画元素，平滑无跳变循环） -->
    <!-- 汽车 1：红色小轿车，由村落向机库方向行进 -->
    <g>
      <use href="#mini-car-red">
        <animateMotion path="M 185,542 C 240,562, 280,567, 340,561 C 410,556, 470,551, 530,536 C 575,524, 615,508, 648,487" 
                       dur="11s" repeatCount="indefinite" rotate="auto" />
      </use>
    </g>

    <!-- 汽车 2：墨绿小车，在公路中段平稳行驶 -->
    <g>
      <use href="#mini-car-green">
        <animateMotion path="M 310,563 C 380,558, 450,553, 510,539 C 560,526, 605,510, 642,489" 
                       dur="8.5s" repeatCount="indefinite" rotate="auto" begin="-4s" />
      </use>
    </g>

    <!-- 汽车 3：浅蓝厢式小货车，从机库之间的平直小路驶入两库深处 -->
    <g>
      <use href="#mini-car-blue">
        <animateMotion path="M 648,482 L 400,358" 
                       dur="9.5s" repeatCount="indefinite" rotate="auto" />
      </use>
    </g>

    <!-- 11. 底座顶面边缘高光细亮边（展现微缩模型陈列台边缘切角光泽） -->
    <ellipse cx="500" cy="435" rx="396" ry="196" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.75" />
    <ellipse cx="500" cy="435" rx="395" ry="195" fill="url(#plinth-top-light)" pointer-events="none" />
  </g>
</svg>