<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#fdf0d5"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#9aa0a8" stroke-width="1">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(22.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(45)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(67.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(112.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(135)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-57" r="3.5" fill="#e53935"/>
      <circle r="6" fill="#555"/>
      <circle r="2.5" fill="#ddd"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#fff3b0" opacity="0.9"/>
  <rect x="0" y="330" width="800" height="90" fill="#5aa9d6"/>
  <rect x="0" y="330" width="800" height="6" fill="#9fd3ee"/>
  <rect x="0" y="420" width="800" height="80" fill="#6b6f76"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#4a4d52" stroke-width="3"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#f5f5f5" stroke-width="6" stroke-dasharray="60 46.75">
    <animate attributeName="stroke-dashoffset" from="0" to="427" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="424" rx="230" ry="7" fill="#000" opacity="0.25"/>

  <!-- wheels -->
  <g transform="translate(230 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>
  <g transform="translate(570 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="3" stroke-dasharray="3 3" fill="none">
    <line x1="230" y1="342" x2="370" y2="342">
      <animate attributeName="stroke-dashoffset" from="0" to="-6" dur="0.25s" repeatCount="indefinite"/>
    </line>
    <line x1="370" y1="378" x2="230" y2="358">
      <animate attributeName="stroke-dashoffset" from="0" to="-6" dur="0.25s" repeatCount="indefinite"/>
    </line>
  </g>
  <g transform="translate(230 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.5s" repeatCount="indefinite"/>
      <circle r="8" fill="#777" stroke="#333" stroke-width="2"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#333" stroke-width="2"/>
    </g>
  </g>

  <!-- far crank, pedal and leg -->
  <g transform="translate(370 360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(35 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180 0 0" to="-540 0 0" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-1" width="22" height="4" rx="1.5" fill="#222"/>
          <ellipse cx="5" cy="-5" rx="14" ry="4.5" fill="#262626"/>
        </g>
      </g>
    </g>
  </g>
  <path fill="none" stroke="#262626" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M350 265L399.3 321.5L335 360">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M350 265L399.3 321.5L335 360;M350 265L413.8 304.6L345.3 335.3;M350 265L424.5 273.5L370 325;M350 265L424.9 266.7L394.7 335.3;M350 265L421.7 286.9L405 360;M350 265L409.2 311.1L394.7 384.7;M350 265L395.7 324.5L370 395;M350 265L392.8 326.6L345.3 384.7;M350 265L399.3 321.5L335 360"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#c62828" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="230" y1="350" x2="370" y2="360"/>
    <line x1="230" y1="350" x2="340" y2="258"/>
    <line x1="370" y1="360" x2="340" y2="252"/>
    <line x1="340" y1="256" x2="520" y2="248"/>
    <line x1="370" y1="360" x2="524" y2="258"/>
    <line x1="520" y1="238" x2="529" y2="270" stroke-width="8"/>
    <line x1="529" y1="268" x2="570" y2="350" stroke="#9e9e9e" stroke-width="5"/>
  </g>
  <line x1="340" y1="252" x2="335" y2="238" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <rect x="311" y="231" width="52" height="9" rx="4.5" fill="#222"/>
  <path d="M519 238 L515 221" stroke="#444" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M507 221 L535 221 Q551 219 551 235" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- bottom bracket and chainring -->
  <circle cx="370" cy="360" r="7" fill="#444"/>
  <g transform="translate(370 360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <circle r="18" fill="none" stroke="#666" stroke-width="4"/>
      <circle r="18" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#666" stroke-width="2"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#666" stroke-width="2"/>
    </g>
  </g>

  <!-- pelican tail and body -->
  <path d="M318 222 L284 246 L292 226 L282 214 Z" fill="#4b3a2b"/>
  <ellipse cx="357" cy="218" rx="53" ry="31" transform="rotate(-12 357 218)" fill="#7a6a58"/>
  <path d="M330 238 Q365 252 405 222 Q385 244 345 248 Z" fill="#4b3a2b" opacity="0.7"/>
  <path d="M385 210 Q405 225 400 200 Q395 188 385 192 Z" fill="#efe9dc"/>

  <!-- neck, head, bill -->
  <path d="M388 202 C 400 172, 430 176, 440 152 C 445 140, 450 136, 455 128" fill="none" stroke="#f4efe4" stroke-width="17" stroke-linecap="round"/>
  <path d="M382 198 C 392 168, 422 172, 432 150 C 437 140, 441 135, 447 128" fill="none" stroke="#5a4130" stroke-width="5" stroke-linecap="round"/>
  <circle cx="458" cy="122" r="14" fill="#f8f3e8"/>
  <path d="M446 118 Q458 104 472 116 Q458 110 446 118 Z" fill="#f2cf5b"/>
  <path d="M468 113 L556 141 Q559 147 552 148 L468 133 Z" fill="#b7a98f"/>
  <path d="M470 130 Q505 175 552 148 Q510 148 470 130 Z" fill="#8f7f66"/>
  <path d="M552 140 Q562 142 558 150 Q554 150 552 148 Z" fill="#c0642a"/>
  <circle cx="460" cy="117" r="2.6" fill="#111"/>
  <circle cx="460.8" cy="116.2" r="0.8" fill="#fff"/>

  <!-- wing gripping handlebar -->
  <path d="M385 200 Q440 195 480 215 Q510 229 542 225" fill="none" stroke="#6b4a2f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M390 198 Q440 192 480 211 Q510 224 538 221" fill="none" stroke="#8a6a4a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="544" cy="226" r="7" fill="#3b2a1d"/>

  <!-- near crank, pedal and leg -->
  <g transform="translate(370 360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(35 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-1" width="22" height="4" rx="1.5" fill="#222"/>
          <ellipse cx="5" cy="-5" rx="14" ry="4.5" fill="#3a3a3a"/>
        </g>
      </g>
    </g>
  </g>
  <path fill="none" stroke="#3a3a3a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M350 265L421.7 286.9L405 360">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M350 265L421.7 286.9L405 360;M350 265L409.2 311.1L394.7 384.7;M350 265L395.7 324.5L370 395;M350 265L392.8 326.6L345.3 384.7;M350 265L399.3 321.5L335 360;M350 265L413.8 304.6L345.3 335.3;M350 265L424.5 273.5L370 325;M350 265L424.9 266.7L394.7 335.3;M350 265L421.7 286.9L405 360"/>
  </path>
</svg>