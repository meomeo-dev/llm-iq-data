<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Coastal Sky & Ocean -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80d0f7"/>
      <stop offset="45%" stop-color="#d4effa"/>
      <stop offset="55%" stop-color="#ffe6c2"/>
      <stop offset="70%" stop-color="#fdbb84"/>
      <stop offset="78%" stop-color="#48a9c5"/>
      <stop offset="100%" stop-color="#1d6682"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffd15c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff9d42" stop-opacity="0"/>
    </radialGradient>

    <!-- Bicycle Metallic Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="50%" stop-color="#d62828"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>

    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#dcdcdc"/>
      <stop offset="70%" stop-color="#8a9ba8"/>
      <stop offset="100%" stop-color="#efefef"/>
    </linearGradient>

    <!-- Tire Gradient -->
    <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#3a3a3c"/>
      <stop offset="93%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#111113"/>
    </radialGradient>

    <!-- Pelican Plumage & Pouch Gradients -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="45%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#c1440e"/>
    </linearGradient>

    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7f8c8d"/>
      <stop offset="40%" stop-color="#bdc3c7"/>
      <stop offset="85%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>

    <linearGradient id="pelicanBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c5042"/>
      <stop offset="40%" stop-color="#453c32"/>
      <stop offset="85%" stop-color="#2b2620"/>
      <stop offset="100%" stop-color="#1f1a16"/>
    </linearGradient>

    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#786c5f"/>
      <stop offset="35%" stop-color="#53493e"/>
      <stop offset="80%" stop-color="#302821"/>
      <stop offset="100%" stop-color="#1c1713"/>
    </linearGradient>

    <linearGradient id="neckGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d332a"/>
      <stop offset="40%" stop-color="#4e2c1d"/>
      <stop offset="70%" stop-color="#5c1d06"/>
      <stop offset="100%" stop-color="#e9d8a6"/>
    </linearGradient>

    <!-- Wheel Definition with Spokes -->
    <g id="bicycleWheel">
      <!-- Outer Tire -->
      <circle cx="0" cy="0" r="115" fill="none" stroke="url(#tireGrad)" stroke-width="16"/>
      <!-- Rim -->
      <circle cx="0" cy="0" r="106" fill="none" stroke="url(#chromeGrad)" stroke-width="6"/>
      <circle cx="0" cy="0" r="102" fill="none" stroke="#2b2d42" stroke-width="1.5"/>
      <!-- 24 Spokes -->
      <g stroke="#e2eafc" stroke-width="1.2" opacity="0.8">
        <line x1="0" y1="-103" x2="0" y2="103"/>
        <line x1="-103" y1="0" x2="103" y2="0"/>
        <line x1="-72.8" y1="-72.8" x2="72.8" y2="72.8"/>
        <line x1="-72.8" y1="72.8" x2="72.8" y2="-72.8"/>
        <line x1="-95.1" y1="-39.4" x2="95.1" y2="39.4"/>
        <line x1="-95.1" y1="39.4" x2="95.1" y2="-39.4"/>
        <line x1="-39.4" y1="-95.1" x2="39.4" y2="95.1"/>
        <line x1="-39.4" y1="95.1" x2="39.4" y2="-95.1"/>
        <line x1="-99.1" y1="-20.1" x2="99.1" y2="20.1"/>
        <line x1="-99.1" y1="20.1" x2="99.1" y2="-20.1"/>
        <line x1="-20.1" y1="-99.1" x2="20.1" y2="99.1"/>
        <line x1="-20.1" y1="99.1" x2="20.1" y2="-99.1"/>
      </g>
      <!-- Hub & Axle -->
      <circle cx="0" cy="0" r="14" fill="#6c757d"/>
      <circle cx="0" cy="0" r="9" fill="url(#chromeGrad)"/>
      <circle cx="0" cy="0" r="4" fill="#212529"/>
    </g>

    <!-- Ground Shadow Filter -->
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <!-- BACKGROUND: Pacific Coast Sunset -->
  <rect x="0" y="0" width="1000" height="650" fill="url(#skyGrad)"/>

  <!-- Setting Sun -->
  <circle cx="780" cy="300" r="160" fill="url(#sunGlow)"/>
  <circle cx="780" cy="300" r="60" fill="#fff9e6"/>

  <!-- Distant Ocean & Surf -->
  <path d="M 0 475 Q 250 470 500 475 T 1000 473 L 1000 520 L 0 520 Z" fill="#1b5a75" opacity="0.85"/>
  <path d="M 0 495 C 200 492, 350 498, 600 493 C 800 488, 920 496, 1000 494 L 1000 535 L 0 535 Z" fill="#28728f" opacity="0.6"/>
  <!-- Distant Flying Brown Pelicans -->
  <g fill="#2e241c" opacity="0.65">
    <path d="M 120 180 Q 135 170 150 182 Q 165 170 180 180 Q 150 188 120 180 Z"/>
    <path d="M 210 145 Q 222 137 235 147 Q 247 137 260 145 Q 235 152 210 145 Z"/>
    <path d="M 175 125 Q 183 118 192 126 Q 201 118 210 125 Q 192 130 175 125 Z"/>
  </g>

  <!-- Boardwalk / Coastal Road -->
  <rect x="0" y="520" width="1000" height="130" fill="#ccb088"/>
  <rect x="0" y="520" width="1000" height="12" fill="#a4845c"/>
  <line x1="0" y1="565" x2="1000" y2="565" stroke="#bda078" stroke-dasharray="30 25" stroke-width="4"/>
  <line x1="0" y1="610" x2="1000" y2="610" stroke="#bda078" stroke-dasharray="40 30" stroke-width="5"/>

  <!-- Moving Ground Dust / Pebbles -->
  <g fill="#8c6f48" opacity="0.5">
    <ellipse cx="900" cy="545" rx="8" ry="3">
      <animate attributeName="cx" from="1050" to="-50" dur="1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="580" rx="12" ry="4">
      <animate attributeName="cx" from="1050" to="-50" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="300" cy="550" rx="6" ry="2.5">
      <animate attributeName="cx" from="1050" to="-50" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="600" rx="10" ry="3.5">
      <animate attributeName="cx" from="1050" to="-50" dur="0.9s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Bicycle & Rider Shadows -->
  <g filter="url(#shadowBlur)" fill="#443224" opacity="0.45">
    <ellipse cx="310" cy="535" rx="110" ry="16"/>
    <ellipse cx="710" cy="535" rx="110" ry="16"/>
    <ellipse cx="500" cy="540" rx="150" ry="18"/>
  </g>

  <!-- MAIN SCENE CONTAINER (Gentle riding vibration / bounce) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-2.5; 0,1.5; 0,-1.5; 0,0" dur="0.5s" repeatCount="indefinite"/>

    <!-- ==================== BACK LEG (Far Side / Left Leg) ==================== -->
    <!-- Far Side Hip ~ (470, 275). Pedal BB is (515, 420), Radius 55.
         Back crank is 180 deg out of phase with Front crank.
         When front crank is at top (0 deg -> pedal at (515, 365)), back is at bottom (180 deg -> pedal at (515, 475)).
    -->
    <g id="backLegGroup">
      <!-- Back Thigh & Shin -->
      <path id="backLegPath" stroke="#25211c" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
          values="
            M 470 275 Q 430 380 515 475;
            M 470 275 Q 425 350 460 420;
            M 470 275 Q 470 315 515 365;
            M 470 275 Q 515 330 570 420;
            M 470 275 Q 430 380 515 475"
        />
      </path>
      <!-- Back Webbed Foot (Darkened far side) -->
      <g>
        <animateTransform attributeName="transform" type="translate" dur="1.2s" repeatCount="indefinite"
          values="
            515,475;
            460,420;
            515,365;
            570,420;
            515,475"
        />
        <polygon points="5,-6 32,2 26,16 -12,10 -12,-3" fill="#cf7a08"/>
        <line x1="-10" y1="3" x2="30" y2="4" stroke="#8c4e02" stroke-width="2"/>
        <line x1="-10" y1="7" x2="24" y2="14" stroke="#8c4e02" stroke-width="2"/>
      </g>
    </g>

    <!-- ==================== BICYCLE FRAMEWORK & WHEELS ==================== -->
    <!-- REAR WHEEL: Axle at (310, 420) -->
    <g transform="translate(310, 420)">
      <use href="#bicycleWheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
    </g>

    <!-- FRONT WHEEL: Axle at (710, 420) -->
    <g transform="translate(710, 420)">
      <use href="#bicycleWheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
    </g>

    <!-- BICYCLE FRAME TUBING -->
    <!--
      Geometry Keypoints:
      Rear Dropouts (Axle): (310, 420)
      Bottom Bracket (BB):  (515, 420)
      Seat Lug:             (455, 275)
      Head Tube Top:        (660, 240)
      Head Tube Bottom:     (675, 290)
      Front Dropouts (Fork):(710, 420)
    -->
    <!-- Drive Chain -->
    <path d="M 310 408 L 515 400 A 24 24 0 0 1 539 420 A 24 24 0 0 1 515 444 L 310 432 A 14 14 0 0 1 310 408 Z"
          fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 310 410 L 515 402 L 515 442 L 310 430" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5 3"/>

    <!-- Rear Chainstay & Seatstay -->
    <line x1="310" y1="420" x2="515" y2="420" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="310" y1="420" x2="455" y2="275" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Main Triangle: Seat Tube, Down Tube, Top Tube -->
    <line x1="515" y1="420" x2="455" y2="275" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="515" y1="420" x2="675" y2="288" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="455" y1="275" x2="660" y2="240" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/>

    <!-- Head Tube -->
    <line x1="660" y1="240" x2="678" y2="295" stroke="url(#frameGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Front Fork -->
    <line x1="675" y1="290" x2="710" y2="420" stroke="url(#chromeGrad)" stroke-width="11" stroke-linecap="round"/>

    <!-- Seat Post & Saddle -->
    <line x1="455" y1="275" x2="445" y2="248" stroke="url(#chromeGrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- Saddle / Bicycle Seat -->
    <path d="M 405 244 Q 455 238 480 248 Q 486 253 470 256 Q 435 256 412 258 Q 400 255 405 244 Z" fill="#1b1b1b"/>
    <path d="M 410 246 C 435 241 465 246 476 250" stroke="#495057" stroke-width="2" fill="none"/>

    <!-- Stem & Handlebars -->
    <path d="M 660 240 L 655 210 L 635 212 Q 620 215 628 238 Q 632 248 642 244"
          fill="none" stroke="url(#chromeGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Handlebar Grips -->
    <path d="M 632 238 Q 635 246 642 244" fill="none" stroke="#212529" stroke-width="12" stroke-linecap="round"/>

    <!-- ==================== CRANKSET & PEDALS (SMIL REVOLUTION) ==================== -->
    <!-- Bottom Bracket Center: (515, 420) -->
    <!-- Chainring (Front Sprocket) -->
    <circle cx="515" cy="420" r="30" fill="url(#chromeGrad)" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="515" cy="420" r="23" fill="none" stroke="#343a40" stroke-width="4" stroke-dasharray="7 5"/>
    <circle cx="515" cy="420" r="10" fill="#212529"/>

    <!-- REVOLVING CRANK ARMS & PEDALS ASSEMBLY -->
    <!-- Rotates 360 deg around (515, 420) in 1.2s -->
    <g transform="translate(515, 420)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite" additive="replace"/>

      <!-- FAR SIDE (BACK) CRANK ARM: at 180 degrees (Pointing downward at start) -->
      <line x1="0" y1="0" x2="0" y2="55" stroke="#495057" stroke-width="9" stroke-linecap="round"/>
      <circle cx="0" cy="55" r="5" fill="#212529"/>
      <!-- Far Pedal (Counter-rotated so it stays horizontal) -->
      <g transform="translate(0, 55)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
        <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#212529" stroke="#6c757d" stroke-width="1.5"/>
      </g>

      <!-- NEAR SIDE (FRONT) CRANK ARM: at 0 degrees (Pointing upward at start) -->
      <line x1="0" y1="0" x2="0" y2="-55" stroke="url(#chromeGrad)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="0" cy="-55" r="6" fill="#adb5bd"/>
      <!-- Near Pedal (Counter-rotated so it stays horizontal) -->
      <g transform="translate(0, -55)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
        <rect x="-16" y="-5" width="32" height="10" rx="3.5" fill="#ffb703" stroke="#212529" stroke-width="2"/>
        <circle cx="0" cy="0" r="2.5" fill="#212529"/>
      </g>

      <!-- Spindle Cap -->
      <circle cx="0" cy="0" r="8" fill="#111"/>
      <circle cx="0" cy="0" r="4" fill="url(#chromeGrad)"/>
    </g>

    <!-- ==================== CALIFORNIA BROWN PELICAN ==================== -->
    <g id="pelicanRider">
      <!-- Tail Feathers resting over saddle -->
      <path d="M 405 250 C 370 260 360 275 350 290 C 375 285 395 275 425 260 Z" fill="#2b241d"/>
      <path d="M 400 252 C 375 270 365 285 358 300 C 380 290 405 280 430 263 Z" fill="#3a3127"/>

      <!-- Pelican Torso / Body -->
      <path d="M 425 260 
               C 410 230 425 180 460 160 
               C 505 135 550 165 570 205 
               C 585 235 565 275 530 285 
               C 485 298 445 285 425 260 Z" 
            fill="url(#pelicanBodyGrad)" stroke="#1a1510" stroke-width="2"/>

      <!-- Rump / Chest Highlight Feathers -->
      <path d="M 445 275 C 475 285 520 280 545 250 C 515 270 470 275 445 275 Z" fill="#524436"/>

      <!-- Pelican Neck (S-Curve characteristic of pelicans in flight/perched) -->
      <path d="M 525 170 
               C 560 145 565 105 535 80 
               C 515 62 490 68 495 90 
               C 500 112 530 115 540 135 
               C 548 152 542 165 535 175 Z" 
            fill="url(#neckGrad)"/>
      <!-- White Neck Crest / Border Line characteristic of Brown Pelican breeding plumage -->
      <path d="M 535 80 C 515 62 490 68 495 90 C 500 112 530 115 540 135" 
            fill="none" stroke="#f8f9fa" stroke-width="7" stroke-linecap="round"/>

      <!-- Pelican Head -->
      <path d="M 515 65 C 515 42 545 40 565 52 C 580 62 585 80 570 95 C 550 108 522 95 515 65 Z" fill="#faedcd"/>
      <!-- Pale Straw-Yellow Crown -->
      <path d="M 522 62 C 522 45 545 42 562 50 C 555 58 535 60 522 62 Z" fill="#ffe382"/>

      <!-- Pelican Eye -->
      <circle cx="548" cy="62" r="7" fill="#b02a37"/> <!-- Crimson eye ring -->
      <circle cx="548" cy="62" r="4.5" fill="#f8f9fa"/> <!-- Pale iris -->
      <circle cx="548" cy="62" r="2" fill="#111"/> <!-- Pupil -->
      <circle cx="546" cy="60" r="0.8" fill="#fff"/> <!-- Catchlight -->

      <!-- Distinctive Huge Pelican Bill & Pouch -->
      <!-- Large Gular Pouch -->
      <path d="M 565 78 Q 630 155 700 95 Q 640 105 572 82 Z" fill="url(#pouchGrad)" opacity="0.95"/>
      <path d="M 570 85 Q 635 140 680 96" fill="none" stroke="#dc2f02" stroke-width="2.5" opacity="0.6"/>

      <!-- Upper Maxilla (Bill) Hooking Downward at Tip -->
      <path d="M 558 68 L 740 85 Q 755 90 748 97 Q 740 102 730 94 L 565 80 Z" fill="url(#billGrad)" stroke="#603813" stroke-width="1.5"/>
      <!-- Hooked Nail on Tip of Bill -->
      <path d="M 740 85 Q 755 90 748 98 Q 738 102 735 94 Z" fill="#ffb703"/>

      <!-- Folded Wing with Layered Primary/Secondary Feathers -->
      <g>
        <path d="M 445 190 
                 C 455 170 495 160 535 180 
                 C 555 190 560 215 540 240 
                 C 515 270 465 260 435 235 
                 C 425 225 435 205 445 190 Z" 
              fill="url(#wingGrad)" stroke="#1f1a15" stroke-width="2.5"/>
        <!-- Feather Strands Overlay -->
        <path d="M 460 195 Q 500 215 530 240" fill="none" stroke="#2c241d" stroke-width="3" stroke-linecap="round"/>
        <path d="M 475 185 Q 515 205 542 225" fill="none" stroke="#2c241d" stroke-width="3" stroke-linecap="round"/>
        <path d="M 495 180 Q 530 195 550 215" fill="none" stroke="#796a5b" stroke-width="2" stroke-linecap="round"/>
        <path d="M 440 220 Q 480 240 520 250" fill="none" stroke="#1c1611" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <!-- Wing/Arm reaching comfortably to the Handlebars -->
      <!-- Shoulder (525, 205) -> Elbow (590, 235) -> Wingtip 'Hand' on handlebar (638, 236) -->
      <path d="M 525 205 Q 590 210 638 236" fill="none" stroke="#53493e" stroke-width="16" stroke-linecap="round"/>
      <path d="M 525 205 Q 590 210 638 236" fill="none" stroke="#332a21" stroke-width="12" stroke-linecap="round"/>
      <!-- Wingtip Feathers Clamping Handlebar Grip -->
      <path d="M 632 226 C 646 226 652 240 644 248 C 636 254 624 244 632 226 Z" fill="#1e1813"/>
      <path d="M 626 230 C 638 232 642 244 636 250 C 628 254 620 246 626 230 Z" fill="#2c241d"/>
    </g>

    <!-- ==================== FRONT LEG (Near Side / Right Leg) ==================== -->
    <!--
      Near Side Hip at (485, 270).
      Pedal revolving around (515, 420) at radius 55:
        At 0.0s (0 deg):   Pedal is at (515, 365)  [Top Dead Center]
        At 0.3s (90 deg):  Pedal is at (570, 420)  [Forward Down]
        At 0.6s (180 deg): Pedal is at (515, 475)  [Bottom Dead Center]
        At 0.9s (270 deg): Pedal is at (460, 420)  [Rearward Up]
        At 1.2s (360 deg): Pedal is at (515, 365)  [Back to Top]
    -->
    <g id="frontLegGroup">
      <!-- Front Upper Leg & Shin: Articulating synchronously with pedal rotation -->
      <path id="frontLegPath" stroke="#3d342a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
          values="
            M 485 270 Q 470 310 515 365;
            M 485 270 Q 525 330 570 420;
            M 485 270 Q 435 385 515 475;
            M 485 270 Q 420 355 460 420;
            M 485 270 Q 470 310 515 365"
        />
      </path>

      <!-- Front Leg Feather 'Breeches' at Hip -->
      <path d="M 465 255 Q 495 260 510 285 Q 480 300 465 275 Z" fill="#2b251f"/>

      <!-- Front Webbed Foot & Claws Clamping the Near Pedal -->
      <g>
        <animateTransform attributeName="transform" type="translate" dur="1.2s" repeatCount="indefinite"
          values="
            515,365;
            570,420;
            515,475;
            460,420;
            515,365"
        />
        <!-- Foot Plate / Webbing -->
        <polygon points="6,-8 36,0 30,16 -12,8 -12,-5" fill="#fca311" stroke="#b06500" stroke-width="1.5"/>
        <!-- Webbing Ridges & Talons -->
        <line x1="-10" y1="2" x2="34" y2="2" stroke="#b06500" stroke-width="2"/>
        <line x1="-10" y1="6" x2="28" y2="14" stroke="#b06500" stroke-width="2"/>
        <!-- Front Claws curled over pedal platform -->
        <path d="M 33 -2 Q 39 0 35 6" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 36 2 Q 41 5 37 10" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 29 13 Q 34 16 30 20" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

  </g>
</svg>