<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="460" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe27a"/>
  <rect y="418" width="800" height="42" fill="#c9b58a"/>
  <line x1="0" y1="438" x2="800" y2="438" stroke="#8d7a55" stroke-width="4" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.26s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="420" rx="230" ry="6" fill="#000" opacity="0.15"/>

  <!-- FAR SIDE: crank, pedal, leg -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 385 360" to="540 385 360" dur="2s" repeatCount="indefinite"/>
    <line x1="385" y1="360" x2="423" y2="360" stroke="#6b6b6b" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(423 360)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="-180 0 0" to="-540 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="-2.5" width="20" height="5" fill="#444"/>
        <ellipse cx="5" cy="-4" rx="15" ry="4.5" fill="#555"/>
      </g>
    </g>
  </g>
  <path d="M345 226 L410 289 L347 360" fill="none" stroke="#555" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M345 226L410 289L347 360;M345 226L420.5 275L352 341;M345 226L430 257L366 327;M345 226L434 240.5L385 322;M345 226L434 237L404 327;M345 226L432.5 247L418 341;M345 226L426 265L423 360;M345 226L414 284L418 379;M345 226L399 298L404 393;M345 226L391 303L385 398;M345 226L393 302L366 393;M345 226L400 297L352 379;M345 226L410 289L347 360"/>
  </path>

  <!-- WHEELS -->
  <g transform="translate(250 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(30)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(60)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(120)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(150)"/>
      </g>
      <circle cx="0" cy="-58" r="3" fill="#e8742a"/>
      <circle r="7" fill="#444"/>
    </g>
  </g>
  <g transform="translate(540 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(30)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(60)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(120)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(150)"/>
      </g>
      <circle cx="0" cy="-58" r="3" fill="#e8742a"/>
      <circle r="7" fill="#444"/>
    </g>
  </g>

  <!-- CHAIN -->
  <g stroke="#333" stroke-width="2" stroke-dasharray="3 2" fill="none">
    <line x1="385" y1="342" x2="250" y2="344"/>
    <line x1="385" y1="378" x2="250" y2="356"/>
  </g>
  <circle cx="250" cy="350" r="6" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="2 2"/>

  <!-- FRAME -->
  <g fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M385 360 L350 240"/>
    <path d="M352 248 L498 256"/>
    <path d="M385 360 L500 262"/>
    <path d="M385 360 L250 350"/>
    <path d="M352 248 L250 350"/>
    <path d="M497 250 L507 280" stroke-width="8"/>
    <path d="M507 278 L540 350" stroke="#2a8fa3" stroke-width="5"/>
  </g>
  <path d="M350 240 L345 228" stroke="#999" stroke-width="5" stroke-linecap="round"/>
  <path d="M497 250 L492 230" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <path d="M485 232 Q500 220 520 228" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <circle cx="385" cy="360" r="8" fill="#333"/>
  <path d="M318 228 Q335 221 362 225 Q374 230 360 234 L325 234 Z" fill="#222"/>

  <!-- PELICAN -->
  <polygon points="310,190 266,220 290,230 322,212" fill="#4d3f33"/>
  <ellipse cx="350" cy="185" rx="60" ry="37" transform="rotate(-12 350 185)" fill="#8a7761"/>
  <ellipse cx="385" cy="198" rx="34" ry="19" transform="rotate(-12 385 198)" fill="#a08c74"/>
  <ellipse cx="345" cy="217" rx="22" ry="13" fill="#7a6853"/>
  <path d="M395 165 Q372 125 420 105" fill="none" stroke="#f3ecd6" stroke-width="20" stroke-linecap="round"/>
  <path d="M384 162 Q361 122 408 92" fill="none" stroke="#5a4636" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="428" cy="100" rx="22" ry="17" fill="#f6f0dc"/>
  <path d="M410 90 Q426 76 446 92 Q428 88 410 90 Z" fill="#f2d46b"/>
  <circle cx="436" cy="97" r="3.5" fill="#1b1b1b"/>
  <circle cx="437" cy="96" r="1" fill="#fff"/>
  <path d="M448 94 L540 120 Q546 123 538 126 L448 108 Z" fill="#a79a85"/>
  <path d="M450 106 Q482 146 534 126 L450 108 Z" fill="#c4ad82"/>
  <circle cx="541" cy="122" r="3" fill="#c0392b"/>

  <path d="M350 160 Q440 150 516 220 L524 230 Q519 233 513 230 Q430 195 345 205 Z" fill="#5a4838"/>
  <path d="M365 175 Q440 165 505 220" fill="none" stroke="#7b6650" stroke-width="2"/>
  <circle cx="519" cy="227" r="6" fill="#3a2f26"/>

  <!-- NEAR SIDE: crank, chainring, pedal, leg -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 360" to="360 385 360" dur="2s" repeatCount="indefinite"/>
    <circle cx="385" cy="360" r="18" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 2"/>
    <line x1="385" y1="360" x2="423" y2="360" stroke="#222" stroke-width="6" stroke-linecap="round"/>
    <circle cx="385" cy="360" r="5" fill="#777"/>
    <g transform="translate(423 360)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="-2.5" width="20" height="5" fill="#111"/>
        <ellipse cx="5" cy="-4" rx="15" ry="4.5" fill="#2e2e2e"/>
      </g>
    </g>
  </g>
  <path d="M345 226 L426 265 L423 360" fill="none" stroke="#2e2e2e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M345 226L426 265L423 360;M345 226L414 284L418 379;M345 226L399 298L404 393;M345 226L391 303L385 398;M345 226L393 302L366 393;M345 226L400 297L352 379;M345 226L410 289L347 360;M345 226L420.5 275L352 341;M345 226L430 257L366 327;M345 226L434 240.5L385 322;M345 226L434 237L404 327;M345 226L432.5 247L418 341;M345 226L426 265L423 360"/>
  </path>
</svg>