<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset="1" stop-color="#fdf1d4"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#b8b8b8" stroke-width="2"/>
      <g stroke="#999" stroke-width="1">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(22.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(45)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(67.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(112.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(135)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="52" cy="0" r="3" fill="#e74c3c"/>
      <circle r="6" fill="#777"/>
      <circle r="2.5" fill="#333"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe08a" opacity="0.9"/>
  <path d="M0,330 Q120,300 240,325 T480,320 T800,318 L800,401 L0,401 Z" fill="#9ec9a0" opacity="0.6"/>
  <rect x="0" y="401" width="800" height="79" fill="#d9c08f"/>
  <line x1="0" y1="401" x2="800" y2="401" stroke="#8a7650" stroke-width="2"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-440 0" dur="1.2s" repeatCount="indefinite"/>
    <line x1="0" y1="425" x2="1300" y2="425" stroke="#b39a68" stroke-width="4" stroke-dasharray="40 70"/>
    <line x1="55" y1="450" x2="1300" y2="450" stroke="#c2aa78" stroke-width="3" stroke-dasharray="25 85"/>
  </g>
  <ellipse cx="405" cy="404" rx="190" ry="7" fill="#000" opacity="0.18"/>

  <!-- far crank, pedal, foot -->
  <g transform="translate(385,335)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-38" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-38,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.4s" repeatCount="indefinite"/>
          <rect x="-9" y="-2" width="18" height="4" rx="1.5" fill="#333"/>
          <path d="M-3,-7 L10,-3 L10,-1 L-8,-1 L-8,-4 Z" fill="#3a322b" stroke="#2a231d" stroke-width="1" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2f2923" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M350,228 L407.9,280.3 L347,329">
    <animate attributeName="d" dur="2.4s" repeatCount="indefinite" calcMode="linear" values="
      M350,228 L407.9,280.3 L347,329;
      M350,228 L417.4,267.3 L352.1,310;
      M350,228 L425.9,246.1 L366,296.1;
      M350,228 L428,225.9 L385,291;
      M350,228 L427.8,221.8 L404,296.1;
      M350,228 L427.9,232.6 L417.9,310;
      M350,228 L424.5,251 L423,329;
      M350,228 L415.7,270 L417.9,348;
      M350,228 L404.4,283.9 L404,361.9;
      M350,228 L397.4,290 L385,367;
      M350,228 L396.9,290.3 L366,361.9;
      M350,228 L400.9,287.1 L352.1,348;
      M350,228 L407.9,280.3 L347,329"/>
  </path>

  <!-- rear wheel -->
  <g transform="translate(250,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="385" y1="335" x2="355" y2="245"/>
    <line x1="354" y1="248" x2="498" y2="232"/>
    <line x1="385" y1="335" x2="505" y2="246"/>
    <line x1="385" y1="335" x2="250" y2="330"/>
    <line x1="356" y1="250" x2="250" y2="330"/>
    <line x1="496" y1="224" x2="508" y2="252"/>
    <line x1="508" y1="252" x2="560" y2="330" stroke="#8e2b21"/>
  </g>
  <g fill="none" stroke="#333" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="355" y1="245" x2="351" y2="232"/>
    <line x1="496" y1="224" x2="492" y2="204"/>
    <path d="M478,207 L492,204 L528,198 Q546,196 547,214"/>
  </g>

  <!-- chain and rear cog -->
  <g stroke="#444" stroke-width="2" fill="none">
    <line x1="385" y1="319" x2="250" y2="322"/>
    <line x1="385" y1="351" x2="250" y2="338"/>
  </g>
  <g transform="translate(250,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="8" fill="#666" stroke="#333" stroke-width="2" stroke-dasharray="3 2"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(560,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- near crank, chainring, pedal, foot -->
  <g transform="translate(385,335)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
      <circle r="16" fill="#888" stroke="#333" stroke-width="3" stroke-dasharray="4 2"/>
      <line x1="0" y1="0" x2="38" y2="0" stroke="#999" stroke-width="6" stroke-linecap="round"/>
      <circle r="5" fill="#444"/>
      <g transform="translate(38,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.4s" repeatCount="indefinite"/>
          <rect x="-9" y="-2" width="18" height="4" rx="1.5" fill="#222"/>
          <path d="M-3,-7 L10,-3 L10,-1 L-8,-1 L-8,-4 Z" fill="#6b5a4a" stroke="#3a2e24" stroke-width="1" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- pelican tail and body -->
  <path d="M290,188 L246,194 L250,214 L292,208 Z" fill="#3e3025" stroke="#2a1f17" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="335" cy="195" rx="60" ry="33" transform="rotate(12 335 195)" fill="#8a7763" stroke="#4d3f31" stroke-width="2"/>
  <path d="M320,205 Q350,225 385,205" fill="none" stroke="#b9a88f" stroke-width="3" stroke-linecap="round"/>

  <!-- neck, head, bill -->
  <path d="M365,190 C395,185 380,152 405,130" fill="none" stroke="#5b3d2a" stroke-width="20" stroke-linecap="round"/>
  <path d="M372,196 C402,190 388,158 412,136" fill="none" stroke="#efe6cf" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="412" cy="122" rx="20" ry="15" fill="#f6efd6" stroke="#8a7a55" stroke-width="1.5"/>
  <path d="M394,116 Q410,102 428,114 Q410,108 394,116 Z" fill="#e8c95a"/>
  <path d="M430,126 Q468,162 504,140 L430,128 Z" fill="#c9a56a" stroke="#7c6238" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M428,111 L503,134 L507,141 L428,127 Z" fill="#b9a98a" stroke="#6e5f45" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M500,133 Q510,136 507,143 L502,141 Z" fill="#4a3a2a"/>
  <circle cx="419" cy="117" r="3.5" fill="#fff"/>
  <circle cx="420" cy="117" r="2.2" fill="#111"/>

  <!-- wing reaching to handlebar -->
  <path d="M340,172 C385,168 460,184 526,196 L531,204 C470,210 400,218 345,212 Z" fill="#7a6652" stroke="#4d3f31" stroke-width="2" stroke-linejoin="round"/>
  <path d="M370,190 L440,200 M365,198 L450,206 M380,180 L470,194" stroke="#5a4a3a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="527" cy="200" r="6" fill="#3a2e24"/>

  <!-- saddle -->
  <path d="M330,227 Q352,221 382,225 Q386,232 372,233 L336,233 Q326,233 330,227 Z" fill="#2b2b2b"/>

  <!-- near leg -->
  <path fill="none" stroke="#4a4038" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M350,228 L424.5,251 L423,329">
    <animate attributeName="d" dur="2.4s" repeatCount="indefinite" calcMode="linear" values="
      M350,228 L424.5,251 L423,329;
      M350,228 L415.7,270 L417.9,348;
      M350,228 L404.4,283.9 L404,361.9;
      M350,228 L397.4,290 L385,367;
      M350,228 L396.9,290.3 L366,361.9;
      M350,228 L400.9,287.1 L352.1,348;
      M350,228 L407.9,280.3 L347,329;
      M350,228 L417.4,267.3 L352.1,310;
      M350,228 L425.9,246.1 L366,296.1;
      M350,228 L428,225.9 L385,291;
      M350,228 L427.8,221.8 L404,296.1;
      M350,228 L427.9,232.6 L417.9,310;
      M350,228 L424.5,251 L423,329"/>
  </path>
</svg>