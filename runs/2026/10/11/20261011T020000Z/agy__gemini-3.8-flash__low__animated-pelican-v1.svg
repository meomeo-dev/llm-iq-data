<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background Sky & Coastal Palette -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ac1eb"/>
      <stop offset="60%" stop-color="#bfe3f7"/>
      <stop offset="100%" stop-color="#faecc9"/>
    </linearGradient>

    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a7b9b"/>
      <stop offset="100%" stop-color="#184e68"/>
    </linearGradient>

    <!-- Metallic Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>

    <!-- Chrome & Rim Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>

    <!-- Pelican Plumage Gradients -->
    <linearGradient id="brownFeathers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5d4037"/>
      <stop offset="50%" stop-color="#452f27"/>
      <stop offset="100%" stop-color="#2d1c16"/>
    </linearGradient>

    <linearGradient id="chestFeathers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d4c41"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>

    <!-- Pouch / Beak Gradients -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#bf360c"/>
      <stop offset="45%" stop-color="#e65100"/>
      <stop offset="85%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </linearGradient>

    <linearGradient id="billHorn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="70%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Reusable Spoked Wheel (Radius = 115, Center = 0,0) -->
    <g id="wheel">
      <!-- Outer Tire -->
      <circle cx="0" cy="0" r="115" fill="none" stroke="#212121" stroke-width="14"/>
      <!-- Tire Tread Detail -->
      <circle cx="0" cy="0" r="121" fill="none" stroke="#37474f" stroke-width="1.5" stroke-dasharray="4,6"/>
      <!-- Metal Rim -->
      <circle cx="0" cy="0" r="108" fill="none" stroke="url(#metalGrad)" stroke-width="6"/>
      <!-- Inner Rim Edge -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#78909c" stroke-width="1.5"/>
      <!-- 16 Spokes -->
      <g stroke="#b0bec5" stroke-width="1.6" opacity="0.85">
        <line x1="0" y1="-105" x2="0" y2="105"/>
        <line x1="-105" y1="0" x2="105" y2="0"/>
        <line x1="-74.2" y1="-74.2" x2="74.2" y2="74.2"/>
        <line x1="-74.2" y1="74.2" x2="74.2" y2="-74.2"/>
        <line x1="-39.9" y1="-96.9" x2="39.9" y2="96.9"/>
        <line x1="-96.9" y1="-39.9" x2="96.9" y2="39.9"/>
        <line x1="-96.9" y1="39.9" x2="96.9" y2="-39.9"/>
        <line x1="-39.9" y1="96.9" x2="39.9" y2="-96.9"/>
      </g>
      <!-- Hub & Axle -->
      <circle cx="0" cy="0" r="15" fill="url(#metalGrad)"/>
      <circle cx="0" cy="0" r="7" fill="#263238"/>
      <circle cx="0" cy="0" r="3" fill="#cfd8dc"/>
    </g>

    <!-- Ground Dash Line Pattern for Motion Feel -->
    <pattern id="roadMarking" x="0" y="0" width="120" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="60" height="8" fill="#fff" opacity="0.6"/>
    </pattern>
  </defs>

  <style><![CDATA[
    /* Continuous Spin Animations */
    .spin-forward {
      animation: wheelRoll 1.4s linear infinite;
    }
    .pedal-counter-rotate {
      animation: counterRev 1.4s linear infinite;
    }
    .breeze {
      animation: softBob 1.4s ease-in-out infinite;
    }
    .road-move {
      animation: roadDash 0.7s linear infinite;
    }

    @keyframes wheelRoll {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterRev {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes softBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%      { transform: translateY(-4px) rotate(0.6deg); }
    }
    @keyframes roadDash {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
  ]]></style>

  <!-- Background Environment -->
  <rect x="0" y="0" width="900" height="650" fill="url(#skyGrad)"/>
  <path d="M0 450 Q 225 440, 450 450 T 900 450 L 900 650 L 0 650 Z" fill="url(#seaGrad)" opacity="0.7"/>
  
  <!-- Coastal Promenade / Boardwalk Road -->
  <rect x="0" y="525" width="900" height="125" fill="#546e7a"/>
  <rect x="0" y="520" width="900" height="7" fill="#cfd8dc" opacity="0.6"/>
  <!-- Animated Road Lane Dash -->
  <line x1="0" y1="585" x2="900" y2="585" stroke="#ffffff" stroke-width="5" stroke-dasharray="50,40" class="road-move" opacity="0.75"/>
  <rect x="0" y="640" width="900" height="10" fill="#37474f"/>

  <!-- Subtle Distant Pier / Sea Horizon elements -->
  <path d="M0 460 L900 460" stroke="#78909c" stroke-width="2" opacity="0.4"/>
  <g fill="#37474f" opacity="0.2">
    <polygon points="120,460 125,435 130,460"/>
    <polygon points="150,460 153,440 156,460"/>
    <polygon points="760,460 765,430 770,460"/>
    <polygon points="790,460 793,438 796,460"/>
  </g>

  <!-- ========================================== -->
  <!-- MAIN BICYCLE & PELICAN RIG                -->
  <!-- ========================================== -->
  <g id="pelican-and-bike">

    <!-- REAR WHEEL: Center at (225, 460) -->
    <g transform="translate(225, 460)">
      <g class="spin-forward">
        <use href="#wheel"/>
      </g>
    </g>

    <!-- FRONT WHEEL: Center at (665, 460) -->
    <g transform="translate(665, 460)">
      <g class="spin-forward">
        <use href="#wheel"/>
      </g>
    </g>

    <!-- DRIVE CHAIN & SPROCKETS (Stationary Chain Path & Rear Cog) -->
    <g stroke="#37474f" stroke-width="5" fill="none" stroke-linejoin="round">
      <path d="M 225 460 L 440 440 L 440 480 Z" stroke="#263238" stroke-width="3" stroke-dasharray="5,3"/>
      <circle cx="225" cy="460" r="22" fill="#78909c" stroke="#37474f" stroke-width="3"/>
      <circle cx="225" cy="460" r="10" fill="#263238"/>
    </g>

    <!-- ========================================== -->
    <!-- LEFT / FAR SIDE LEG & PEDAL (Phase: 180°) -->
    <!-- ========================================== -->
    <!-- Far Hip at (378, 280), Crank Spindle at (440, 460), Radius=44 -->
    <g id="left-leg-assembly">
      <!-- SMIL animated thigh & shin: Far leg reaches bottom-left when right is top-right -->
      <path fill="none" stroke="#6d4c41" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
        <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
          values="
            M 380 282 Q 385 365, 410 425 L 409 491;
            M 380 282 Q 415 360, 442 415 L 471 491;
            M 380 282 Q 430 355, 460 395 L 471 429;
            M 380 282 Q 410 345, 430 380 L 409 429;
            M 380 282 Q 385 365, 410 425 L 409 491"
          keyTimes="0; 0.25; 0.5; 0.75; 1"/>
      </path>
      <!-- Far Webbed Foot -->
      <g>
        <animateTransform attributeName="transform" type="translate" dur="1.4s" repeatCount="indefinite"
          values="409,491; 471,491; 471,429; 409,429; 409,491"
          keyTimes="0; 0.25; 0.5; 0.75; 1"/>
        <path d="M -8 -4 L 14 -4 L 20 6 L -6 6 Z" fill="#e65100" opacity="0.85"/>
      </g>
    </g>

    <!-- FAR CRANK ARM & PEDAL (Rotates 180° out of phase) -->
    <g transform="translate(440, 460)">
      <g class="spin-forward">
        <!-- Far crank pointed at 180 deg (down-left initially if near is up-right) -->
        <g transform="rotate(180)">
          <line x1="0" y1="0" x2="44" y2="0" stroke="#78909c" stroke-width="8" stroke-linecap="round"/>
          <circle cx="44" cy="0" r="5" fill="#37474f"/>
          <!-- Pedal kept horizontal -->
          <g transform="translate(44, 0)">
            <g class="pedal-counter-rotate">
              <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#263238" stroke="#90a4ae" stroke-width="1.5"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- BICYCLE FRAME                              -->
    <!-- Geometry:                                  -->
    <!-- Rear Drop: (225, 460)                      -->
    <!-- Bottom Bracket: (440, 460)                 -->
    <!-- Seat Tube Junction: (365, 305)             -->
    <!-- Head Tube Top: (605, 230)                  -->
    <!-- Head Tube Bottom / Fork Crown: (625, 290)  -->
    <!-- Front Drop: (665, 460)                     -->
    <!-- ========================================== -->
    <g id="bicycle-frame">
      <!-- Rear Mudguard / Fender -->
      <path d="M 180 460 A 125 125 0 0 1 325 365" fill="none" stroke="#e63946" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
      <path d="M 180 460 L 225 460 M 310 380 L 225 460" stroke="#cfd8dc" stroke-width="2.5"/>

      <!-- Front Mudguard / Fender -->
      <path d="M 595 360 A 125 125 0 0 1 720 425" fill="none" stroke="#e63946" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
      <path d="M 625 290 L 600 360 M 700 405 L 665 460" stroke="#cfd8dc" stroke-width="2.5"/>

      <!-- Rear Stays (Chainstay & Seatstay) -->
      <!-- Chainstay: Rear Axle (225, 460) to BB (440, 460) -->
      <line x1="225" y1="460" x2="440" y2="460" stroke="#b71c1c" stroke-width="12" stroke-linecap="round"/>
      <!-- Seatstay: Rear Axle (225, 460) to Seat Cluster (365, 305) -->
      <line x1="225" y1="460" x2="365" y2="305" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round"/>

      <!-- Main Diamond Triangle -->
      <!-- Seat Tube: BB (440, 460) up through Seat Lug (365, 305) to (353, 280) -->
      <line x1="440" y1="460" x2="353" y2="280" stroke="url(#frameGrad)" stroke-width="15" stroke-linecap="round"/>

      <!-- Down Tube: BB (440, 460) to Head Tube Lower (620, 275) -->
      <line x1="440" y1="460" x2="620" y2="275" stroke="url(#frameGrad)" stroke-width="16" stroke-linecap="round"/>

      <!-- Top Tube: Seat Cluster (365, 305) to Head Tube Upper (605, 230) -->
      <line x1="365" y1="305" x2="605" y2="230" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>

      <!-- Head Tube -->
      <line x1="605" y1="220" x2="625" y2="285" stroke="#b71c1c" stroke-width="18" stroke-linecap="round"/>

      <!-- Front Fork: Head Tube Base (625, 285) to Front Axle (665, 460) -->
      <!-- Elegant curve towards dropouts -->
      <path d="M 623 285 L 642 385 Q 648 430, 665 460" fill="none" stroke="url(#metalGrad)" stroke-width="12" stroke-linecap="round"/>

      <!-- Seat Post & Saddle -->
      <line x1="360" y1="290" x2="348" y2="265" stroke="url(#metalGrad)" stroke-width="9"/>
      <!-- Retro Leather Bicycle Saddle -->
      <path d="M 310 265 Q 350 258, 385 265 Q 395 272, 380 278 Q 345 274, 320 282 Q 308 280, 310 265 Z" fill="#3e2723" stroke="#271202" stroke-width="2"/>
      <!-- Saddle Springs -->
      <circle cx="323" cy="275" r="5" fill="none" stroke="#90a4ae" stroke-width="2"/>
      <circle cx="335" cy="274" r="5" fill="none" stroke="#90a4ae" stroke-width="2"/>

      <!-- Stem & Swept Handlebars (Cruiser Style) -->
      <!-- Stem rising from head tube -->
      <line x1="605" y1="220" x2="598" y2="185" stroke="url(#metalGrad)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="598" cy="185" r="7" fill="#455a64"/>
      <!-- Swept-back Handlebars reaching towards Pelican's wing -->
      <path d="M 598 185 Q 585 185, 565 205 Q 550 220, 535 220" fill="none" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round"/>
      <!-- Rubber Grips -->
      <path d="M 548 217 L 532 222" stroke="#263238" stroke-width="11" stroke-linecap="round"/>

      <!-- Front Chainring (Spur Gear) at Bottom Bracket -->
      <circle cx="440" cy="460" r="32" fill="url(#metalGrad)" stroke="#455a64" stroke-width="3"/>
      <!-- Chainring Cutouts for realism -->
      <circle cx="440" cy="442" r="6" fill="#546e7a"/>
      <circle cx="440" cy="478" r="6" fill="#546e7a"/>
      <circle cx="422" cy="460" r="6" fill="#546e7a"/>
      <circle cx="458" cy="460" r="6" fill="#546e7a"/>
      <circle cx="440" cy="460" r="10" fill="#263238"/>
    </g>

    <!-- ========================================== -->
    <!-- PELICAN BODY, HEAD, WINGS & BEAK           -->
    <!-- Seated with body resting above saddle      -->
    <!-- ========================================== -->
    <g id="pelican-rider" class="breeze">
      <!-- Tail Feathers -->
      <path d="M 315 260 C 280 270, 260 250, 245 280 C 265 295, 290 290, 320 282 Z" fill="#3e2723" stroke="#271202" stroke-width="1.5"/>
      <path d="M 270 273 L 305 275" stroke="#795548" stroke-width="2"/>

      <!-- Main Torso / Barrel Chest of Brown Pelican -->
      <!-- Brown pelicans have silvery-gray-brown backs and dark rich brown-black bellies -->
      <path d="M 330 275 C 320 220, 360 170, 420 175 C 465 178, 485 220, 460 285 C 445 320, 375 325, 330 275 Z" fill="url(#brownFeathers)"/>

      <!-- Chest / Breast Overlay (Speckled warm coastal look) -->
      <path d="M 380 180 C 430 185, 470 225, 455 285 C 440 315, 395 315, 375 285 C 365 240, 360 210, 380 180 Z" fill="url(#chestFeathers)" opacity="0.9"/>

      <!-- Graceful Curved S-Neck -->
      <!-- Typical brown pelican sinuous posture pulled back during cruising -->
      <path d="M 425 185 C 435 130, 460 100, 490 85 C 510 75, 530 85, 520 115 C 505 155, 460 165, 455 190 Z" fill="#e0e0e0"/>
      <!-- Golden/Chestnut Nape Stripe on Breeding Adult -->
      <path d="M 465 92 C 485 80, 510 82, 515 105 C 495 135, 465 150, 452 185" fill="none" stroke="#4e342e" stroke-width="14" stroke-linecap="round"/>
      <path d="M 470 93 C 488 83, 508 86, 512 105" fill="none" stroke="#d7ccc8" stroke-width="3"/>

      <!-- Head (Straw-yellow crown, white face) -->
      <ellipse cx="522" cy="85" rx="26" ry="20" transform="rotate(-10 522 85)" fill="#fff9c4"/>
      <!-- White facial mask -->
      <path d="M 505 85 Q 525 65, 542 85 Q 530 105, 505 85 Z" fill="#ffffff"/>

      <!-- Intelligent Eye -->
      <circle cx="524" cy="80" r="5" fill="#cfd8dc"/>
      <circle cx="524" cy="80" r="3.2" fill="#212121"/>
      <circle cx="525.5" cy="78.5" r="1.2" fill="#ffffff"/>

      <!-- Gular Pouch (Enormous expandable scoop) -->
      <path d="M 535 93 C 570 120, 615 170, 605 205 C 575 220, 540 180, 520 120 Z" fill="url(#pouchGrad)" opacity="0.95" stroke="#bf360c" stroke-width="1.5"/>
      <!-- Pouch vascular/stretch texture lines -->
      <path d="M 538 110 Q 570 155, 585 195 M 545 125 Q 565 160, 570 190" fill="none" stroke="#e64a19" stroke-width="1.2" opacity="0.6"/>

      <!-- Long Upper Maxilla / Bill (Culmen with hooked tip) -->
      <path d="M 532 80 L 685 128 C 692 131, 695 137, 688 141 L 536 102 Z" fill="url(#billHorn)" stroke="#bf360c" stroke-width="1"/>
      <!-- Downcurved Bill Hook at Tip (Nail) -->
      <path d="M 685 128 Q 696 132, 693 141 Q 688 147, 683 138 Z" fill="#b71c1c"/>
      <!-- Lateral bill groove -->
      <line x1="535" y1="88" x2="675" y2="132" stroke="#d84315" stroke-width="1.5"/>

      <!-- Folded Wing / Arm resting forward to grip handlebars -->
      <!-- Scapulars and Coverts -->
      <path d="M 370 215 C 385 190, 440 190, 470 220 C 490 240, 530 225, 545 220 C 530 240, 500 255, 465 255 C 420 255, 375 245, 370 215 Z" fill="#4e342e" stroke="#2d1c16" stroke-width="2"/>

      <!-- Wing Primary / Flight Feathers swept nicely back -->
      <path d="M 360 230 C 320 255, 290 270, 275 270 C 315 275, 360 260, 395 248 Z" fill="#2d1c16"/>
      <path d="M 370 225 C 330 250, 305 262, 290 262 C 325 268, 365 255, 400 242 Z" fill="#3e2723"/>

      <!-- Wing Joint / Forearm reaching down to grip handlebar grip at (535, 220) -->
      <path d="M 465 225 C 490 220, 520 210, 542 216 C 545 222, 538 230, 525 233 C 495 240, 465 245, 455 240 Z" fill="#5d4037"/>
      <!-- Feathery Wingtip curled securely over the rubber handlebar grip -->
      <path d="M 533 214 Q 548 212, 548 225 Q 540 235, 528 226 Z" fill="#271202"/>
    </g>

    <!-- ========================================== -->
    <!-- RIGHT / FOREGROUND CRANK, PEDAL & LEG      -->
    <!-- Phase: 0° (Starts at top-forward)         -->
    <!-- ========================================== -->

    <!-- FOREGROUND CRANK ARM & PEDAL -->
    <g transform="translate(440, 460)">
      <g class="spin-forward">
        <!-- Near Crank Arm pointing right/forward initially (0 deg) -->
        <g transform="rotate(0)">
          <line x1="0" y1="0" x2="44" y2="0" stroke="url(#metalGrad)" stroke-width="9" stroke-linecap="round"/>
          <circle cx="44" cy="0" r="5.5" fill="#263238"/>
          <!-- Pedal Platform kept horizontal via counter-rotation -->
          <g transform="translate(44, 0)">
            <g class="pedal-counter-rotate">
              <!-- Pedal Spindle & Body -->
              <rect x="-16" y="-5" width="32" height="10" rx="3" fill="#212121" stroke="#eceff1" stroke-width="1.8"/>
              <!-- Amber Pedal Reflector -->
              <rect x="-10" y="-2" width="20" height="4" rx="1" fill="#ffb300"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- FOREGROUND RIGHT LEG & FOOT (Phase: 0°) -->
    <!-- Hip anchored at (405, 290) on Pelican Body.
         Pedal axle orbits (440, 460) with radius 44:
         0.00s (0 deg):   (484, 460) -> Foot at (484, 460)
         0.35s (90 deg):  (440, 504) -> Foot at (440, 504)
         0.70s (180 deg): (396, 460) -> Foot at (396, 460)
         1.05s (270 deg): (440, 416) -> Foot at (440, 416)
         1.40s (360 deg): (484, 460) -> Return
    -->
    <g id="right-leg-assembly">
      <!-- High-Detail Animated Leg Path (Thigh to Knee to Ankle) -->
      <path fill="none" stroke="#795548" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
          values="
            M 405 290 Q 430 355, 460 395 L 471 429;
            M 405 290 Q 410 345, 430 380 L 409 429;
            M 405 290 Q 385 365, 410 425 L 409 491;
            M 405 290 Q 415 360, 442 415 L 471 491;
            M 405 290 Q 430 355, 460 395 L 471 429"
          keyTimes="0; 0.25; 0.5; 0.75; 1"/>
      </path>

      <!-- Feathery Thigh Trousers Overlay -->
      <path d="M 390 280 Q 420 310, 435 345 Q 405 350, 395 315 Z" fill="#4e342e"/>

      <!-- Large Orange/Yellow Webbed Foot firmly planted on Pedal -->
      <g>
        <animateTransform attributeName="transform" type="translate" dur="1.4s" repeatCount="indefinite"
          values="471,429; 409,429; 409,491; 471,491; 471,429"
          keyTimes="0; 0.25; 0.5; 0.75; 1"/>
        <!-- Webbed Foot & Claws holding onto pedal -->
        <path d="M -12 -5 L 18 -5 C 24 0, 26 5, 20 8 L -10 8 C -14 4, -14 -1, -12 -5 Z" fill="#ef6c00" stroke="#b71c1c" stroke-width="1.5"/>
        <!-- 3 Defined Webbed Toes -->
        <path d="M -2 -4 L 14 7 M 4 -5 L 20 5 M 8 -5 L 22 2" stroke="#ffd54f" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Ankle Joint Ball -->
        <circle cx="-6" cy="-2" r="5" fill="#e65100"/>
      </g>
    </g>

    <!-- Bottom Bracket Chrome Cap Overlay -->
    <circle cx="440" cy="460" r="8" fill="url(#metalGrad)" stroke="#37474f" stroke-width="2"/>

  </g>
</svg>