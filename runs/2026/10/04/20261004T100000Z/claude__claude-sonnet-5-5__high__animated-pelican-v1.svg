<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f0"/>
      <stop offset="1" stop-color="#e8f5fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="65" fill="none" stroke="#b5b5b5" stroke-width="1.8"/>
      <g stroke="#8a8a8a" stroke-width="0.8">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(15)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(30)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(45)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(60)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(75)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(105)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(120)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(135)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(150)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(165)"/>
      </g>
      <rect x="-1.5" y="-66" width="3" height="8" fill="#d33"/>
      <circle r="7" fill="#777" stroke="#444" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="80" rx="46" ry="14"/>
    <ellipse cx="180" cy="68" rx="30" ry="12"/>
    <ellipse cx="480" cy="55" rx="40" ry="12"/>
    <ellipse cx="505" cy="45" rx="26" ry="10"/>
  </g>
  <rect x="0" y="421" width="800" height="79" fill="#e6d5a8"/>
  <line x1="0" y1="421" x2="800" y2="421" stroke="#9c8c5e" stroke-width="2"/>
  <line x1="0" y1="455" x2="800" y2="455" stroke="#b8a574" stroke-width="4" stroke-dasharray="30 30">
    <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="0.2s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="395" cy="424" rx="190" ry="5" fill="#000" opacity="0.15"/>

  <!-- wheels -->
  <g transform="translate(230 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(560 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- rear cog and chain -->
  <circle cx="230" cy="350" r="8" fill="none" stroke="#555" stroke-width="3"/>
  <path d="M230 343L390 342" fill="none" stroke="#3a3a3a" stroke-width="2.5" stroke-dasharray="3 2">
    <animate attributeName="stroke-dashoffset" from="0" to="-5" dur="0.1s" repeatCount="indefinite"/>
  </path>
  <path d="M390 374L230 357" fill="none" stroke="#3a3a3a" stroke-width="2.5" stroke-dasharray="3 2">
    <animate attributeName="stroke-dashoffset" from="0" to="-5" dur="0.1s" repeatCount="indefinite"/>
  </path>

  <!-- far crank, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 358" to="360 390 358" dur="2s" repeatCount="indefinite"/>
    <line x1="390" y1="358" x2="352" y2="358" stroke="#2c2c2c" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(352 358)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <path d="M-5 -1L13 2L10 5L-5 5Z" fill="#2a2824"/>
        <rect x="-9" y="4" width="18" height="4" rx="1.5" fill="#1c1c1c"/>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2a2824" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M372 238L417.9 305.9L352 358">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M372 238L417.9 305.9L352 358;M372 238L429.5 296.5L357.1 339;M372 238L442.1 280.5L371 325.1;M372 238L450.5 261.7L390 320;M372 238L452.6 253.3L409 325.1;M372 238L451 259.9L422.9 339;M372 238L444.8 275.7L428 358;M372 238L432.3 293.5L422.9 377;M372 238L416 307.2L409 391;M372 238L404.5 313.3L390 396;M372 238L403.8 313.6L371 391;M372 238L409.2 311.1L357.1 377;M372 238L417.9 305.9L352 358"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#1b8a9a" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="358" x2="352" y2="252" stroke-width="6"/>
    <line x1="352" y1="252" x2="515" y2="235" stroke-width="6"/>
    <line x1="390" y1="358" x2="518" y2="246" stroke-width="7"/>
    <line x1="514" y1="226" x2="518" y2="247" stroke-width="8"/>
    <line x1="352" y1="254" x2="230" y2="350" stroke-width="4"/>
    <line x1="390" y1="358" x2="230" y2="350" stroke-width="4"/>
    <line x1="517" y1="243" x2="560" y2="350" stroke-width="5"/>
  </g>
  <line x1="350" y1="238" x2="352" y2="254" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <path d="M514 227L511 213" stroke="#333" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M511 213L528 210Q541 210 541 222Q541 232 531 233" stroke="#333" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="560" cy="350" r="4" fill="#444"/>
  <circle cx="230" cy="350" r="4" fill="#444"/>

  <!-- near crank, chainring, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 358" to="360 390 358" dur="2s" repeatCount="indefinite"/>
    <circle cx="390" cy="358" r="16" fill="none" stroke="#555" stroke-width="3"/>
    <line x1="378" y1="358" x2="402" y2="358" stroke="#555" stroke-width="2"/>
    <line x1="390" y1="346" x2="390" y2="370" stroke="#555" stroke-width="2"/>
    <line x1="390" y1="358" x2="428" y2="358" stroke="#2c2c2c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="390" cy="358" r="5" fill="#999" stroke="#333" stroke-width="1.5"/>
    <g transform="translate(428 358)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <path d="M-5 -1L13 2L10 5L-5 5Z" fill="#403d38"/>
        <rect x="-9" y="4" width="18" height="4" rx="1.5" fill="#1c1c1c"/>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#403d38" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M372 238L444.8 275.7L428 358">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M372 238L444.8 275.7L428 358;M372 238L432.3 293.5L422.9 377;M372 238L416 307.2L409 391;M372 238L404.5 313.3L390 396;M372 238L403.8 313.6L371 391;M372 238L409.2 311.1L357.1 377;M372 238L417.9 305.9L352 358;M372 238L429.5 296.5L357.1 339;M372 238L442.1 280.5L371 325.1;M372 238L450.5 261.7L390 320;M372 238L452.6 253.3L409 325.1;M372 238L451 259.9L422.9 339;M372 238L444.8 275.7L428 358"/>
  </path>

  <!-- pelican tail and body -->
  <path d="M292 200L252 220L260 229L295 222Z" fill="#4a3b2e"/>
  <ellipse cx="345" cy="203" rx="62" ry="36" transform="rotate(8 345 203)" fill="#7d6a58"/>
  <path d="M292 195Q340 176 388 192" fill="none" stroke="#a8967f" stroke-width="5" stroke-linecap="round"/>
  <path d="M300 222Q345 238 385 224" fill="none" stroke="#5e4d3d" stroke-width="5" stroke-linecap="round"/>

  <!-- saddle -->
  <path d="M320 239Q340 234 378 237Q382 242 374 244Q345 244 322 243Z" fill="#2b2118"/>

  <!-- neck -->
  <path d="M382 200Q425 195 428 165Q430 148 438 135" fill="none" stroke="#5b3d28" stroke-width="20" stroke-linecap="round"/>
  <path d="M388 197Q433 190 437 163Q439 148 446 136" fill="none" stroke="#efe6d2" stroke-width="8" stroke-linecap="round"/>

  <!-- wing reaching handlebar -->
  <path d="M368 190Q420 178 472 196Q505 206 531 205L533 214Q490 220 455 220Q405 225 366 214Z" fill="#8a7762" stroke="#5a4a3a" stroke-width="1"/>
  <path d="M500 203Q520 207 531 205L533 214Q515 216 497 217Z" fill="#3a2f26"/>
  <path d="M390 200Q430 196 470 205M385 210Q430 210 465 213" fill="none" stroke="#6a5846" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="531" cy="210" r="5" fill="#3a2f26"/>

  <!-- head -->
  <ellipse cx="432" cy="130" rx="7" ry="11" fill="#5b3d28"/>
  <path d="M453 132Q492 170 536 152L453 128Z" fill="#9a8660"/>
  <circle cx="443" cy="125" r="14" fill="#f4efe2"/>
  <ellipse cx="441" cy="115" rx="11" ry="6" fill="#f1d34f"/>
  <path d="M453 118L540 146Q546 150 538 153L453 133Z" fill="#bfae8c"/>
  <path d="M536 145Q548 148 538 154L534 150Z" fill="#7a6a4c"/>
  <circle cx="449" cy="122" r="2.6" fill="#1a1a1a"/>
</svg>