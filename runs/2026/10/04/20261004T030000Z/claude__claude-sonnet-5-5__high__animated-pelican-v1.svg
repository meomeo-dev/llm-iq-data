<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f2"/>
      <stop offset="1" stop-color="#e8f5fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="80" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="80" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="6 10"/>
      <circle r="74" fill="none" stroke="#c9ced3" stroke-width="3"/>
      <g stroke="#9aa0a8" stroke-width="1.2">
        <line x1="-74" y1="0" x2="74" y2="0"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(22.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(45)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(67.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(90)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(112.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(135)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="8" fill="#888" stroke="#555" stroke-width="2"/>
      <circle cx="0" cy="-66" r="3.5" fill="#d33"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#ffe27a" opacity="0.9"/>
  <rect x="0" y="423" width="800" height="77" fill="#d9c9a0"/>
  <line x1="0" y1="423" x2="800" y2="423" stroke="#8a7b62" stroke-width="3"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#b8a67c" stroke-width="4" stroke-dasharray="60 60">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="475" x2="800" y2="475" stroke="#b8a67c" stroke-width="3" stroke-dasharray="30 90">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="426" rx="260" ry="8" fill="#000" opacity="0.15"/>

  <!-- wheels -->
  <g transform="translate(240,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(560,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far crank, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 385 352" to="540 385 352" dur="2s" repeatCount="indefinite"/>
    <line x1="385" y1="352" x2="417" y2="352" stroke="#6d7075" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 417 352" to="-540 417 352" dur="2s" repeatCount="indefinite"/>
      <rect x="406" y="351" width="22" height="5" rx="1.5" fill="#1e1e1e"/>
      <polygon points="412,341 421,341 438,350 433,353 412,351" fill="#3a322c" stroke="#2a2420" stroke-width="1" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2a2420" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M352,205 L416,275 L353,346">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M352,205 L416.2,275.1 L353,346;
      M352,205 L426.1,264.5 L357.3,330;
      M352,205 L435.5,250.4 L369,318.3;
      M352,205 L441.2,237.5 L385,314;
      M352,205 L442.8,233 L401,318.3;
      M352,205 L440.7,239.2 L412.7,330;
      M352,205 L434.2,252.6 L417,346;
      M352,205 L423.5,267.6 L412.7,362;
      M352,205 L411.2,279.3 L401,373.7;
      M352,205 L403.6,284.8 L385,378;
      M352,205 L403.1,285.1 L369,373.7;
      M352,205 L408,281.7 L357.3,362;
      M352,205 L416.2,275.1 L353,346"/>
  </path>

  <!-- chain -->
  <path d="M385,336 L240,332 M385,368 L240,348" stroke="#3a3a3a" stroke-width="2" fill="none"/>
  <circle cx="240" cy="340" r="9" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="3 2"/>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M385,352 L352,236"/>
    <path d="M352,236 L521,240"/>
    <path d="M385,352 L528,260"/>
    <path d="M385,352 L240,340"/>
    <path d="M352,236 L240,340"/>
    <path d="M352,236 L346,214" stroke="#555" stroke-width="5"/>
    <path d="M520,232 L530,262" stroke-width="8"/>
    <path d="M532,262 Q550,300 560,340" stroke="#444" stroke-width="6"/>
    <path d="M519,228 L514,205" stroke="#555" stroke-width="5"/>
    <path d="M514,205 L541,198 Q557,198 556,214" stroke="#333" stroke-width="5"/>
  </g>
  <circle cx="385" cy="352" r="6" fill="#444"/>

  <!-- pelican: tail and body -->
  <path d="M322,205 L262,238 L276,246 L334,224 Z" fill="#4a3e34"/>
  <ellipse cx="350" cy="180" rx="44" ry="50" transform="rotate(25 350 180)" fill="#7d6d5b"/>
  <ellipse cx="362" cy="186" rx="26" ry="38" transform="rotate(25 362 186)" fill="#9a8a76"/>

  <!-- neck, head -->
  <path d="M364,154 C372,130 392,128 410,112" fill="none" stroke="#f3ecd8" stroke-width="21" stroke-linecap="round"/>
  <path d="M356,148 C364,122 384,118 402,100" fill="none" stroke="#5b3a24" stroke-width="6" stroke-linecap="round"/>
  <circle cx="418" cy="106" r="17" fill="#f6efdc"/>
  <path d="M403,100 Q412,84 430,92 Q424,98 418,98 Q410,96 403,100 Z" fill="#f0d36a"/>
  <circle cx="423" cy="101" r="4.5" fill="#fff"/>
  <circle cx="424" cy="101" r="3" fill="#1b1b1b"/>

  <!-- bill and pouch -->
  <path d="M432,113 L498,121 Q472,152 442,134 Q432,126 432,113 Z" fill="#b08a5a" stroke="#7a5a35" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M428,97 L498,113 Q511,115 507,126 L498,120 L430,114 Z" fill="#9a9585" stroke="#6e6a5c" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- wing reaching handlebar -->
  <path d="M368,160 C410,205 480,215 543,199" fill="none" stroke="#5c4d40" stroke-width="16" stroke-linecap="round"/>
  <path d="M372,162 C412,203 480,212 540,198" fill="none" stroke="#85766a" stroke-width="7" stroke-linecap="round"/>

  <!-- saddle -->
  <path d="M320,214 Q340,205 374,211 L374,218 Q342,222 320,220 Z" fill="#222" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- near leg -->
  <path fill="none" stroke="#3f3730" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M352,205 L434,253 L417,346">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M352,205 L434.2,252.6 L417,346;
      M352,205 L423.5,267.6 L412.7,362;
      M352,205 L411.2,279.3 L401,373.7;
      M352,205 L403.6,284.8 L385,378;
      M352,205 L403.1,285.1 L369,373.7;
      M352,205 L408,281.7 L357.3,362;
      M352,205 L416.2,275.1 L353,346;
      M352,205 L426.1,264.5 L357.3,330;
      M352,205 L435.5,250.4 L369,318.3;
      M352,205 L441.2,237.5 L385,314;
      M352,205 L442.8,233 L401,318.3;
      M352,205 L440.7,239.2 L412.7,330;
      M352,205 L434.2,252.6 L417,346"/>
  </path>

  <!-- near crank, chainring, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 352" to="360 385 352" dur="2s" repeatCount="indefinite"/>
    <circle cx="385" cy="352" r="16" fill="none" stroke="#999" stroke-width="3" stroke-dasharray="3 2"/>
    <line x1="385" y1="352" x2="417" y2="352" stroke="#8c9096" stroke-width="6" stroke-linecap="round"/>
    <circle cx="385" cy="352" r="5" fill="#555"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 417 352" to="-360 417 352" dur="2s" repeatCount="indefinite"/>
      <rect x="406" y="351" width="22" height="5" rx="1.5" fill="#1e1e1e"/>
      <polygon points="412,341 421,341 438,350 433,353 412,351" fill="#5b4c3e" stroke="#3a322c" stroke-width="1" stroke-linejoin="round"/>
      <path d="M424,344 L434,351 M419,345 L430,352" stroke="#3a322c" stroke-width="1" fill="none"/>
    </g>
  </g>
</svg>