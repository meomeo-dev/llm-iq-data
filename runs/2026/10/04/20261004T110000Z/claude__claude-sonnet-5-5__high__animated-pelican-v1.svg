<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f5"/>
      <stop offset="1" stop-color="#e6f5fc"/>
    </linearGradient>
    <g id="wheelBody">
      <circle r="78" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#b8bec4" stroke-width="2"/>
      <g stroke="#cfd4d8" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-66" r="3" fill="#e53935"/>
      <circle r="7" fill="#777" stroke="#444" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="460" fill="url(#sky)"/>
  <rect y="400" width="800" height="60" fill="#8bb36a"/>
  <rect y="400" width="800" height="4" fill="#6f9455"/>
  <line x1="-100" y1="425" x2="900" y2="425" stroke="#d9c9a0" stroke-width="6" stroke-dasharray="60 40">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="0.32s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="402" rx="190" ry="7" fill="#000" opacity="0.18"/>

  <!-- Wheels -->
  <g transform="translate(240,320)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheelBody"/>
    </g>
  </g>
  <g transform="translate(560,320)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheelBody"/>
    </g>
  </g>

  <!-- Far crank arm and pedal -->
  <g transform="translate(390,325)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-40" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-3" width="22" height="6" rx="2" fill="#333"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Far leg -->
  <path fill="none" stroke="#262019" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M360 226L414.8 281.5L350 325L364 325">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M360 226L414.8 281.5L350 325L364 325;M360 226L424.8 269.4L355.4 305L369.4 305;M360 226L435 247.3L370 290.4L384 290.4;M360 226L437.9 223.5L390 285L404 285;M360 226L437.5 217.4L410 290.4L424 290.4;M360 226L438 228.2L424.6 305L438.6 305;M360 226L435.1 247.2L430 325L444 325;M360 226L426.3 267L424.6 345L438.6 345;M360 226L414.5 281.8L410 359.6L424 359.6;M360 226L406.4 288.7L390 365L404 365;M360 226L404.8 289.8L370 359.6L384 359.6;M360 226L408 287.5L355.4 345L369.4 345;M360 226L414.8 281.5L350 325L364 325"/>
  </path>

  <!-- Frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="240" y1="320" x2="390" y2="325"/>
    <line x1="240" y1="320" x2="352" y2="240"/>
    <line x1="390" y1="325" x2="352" y2="236"/>
    <line x1="352" y1="242" x2="503" y2="224"/>
    <line x1="390" y1="325" x2="508" y2="246"/>
    <line x1="503" y1="218" x2="509" y2="248" stroke-width="8"/>
  </g>
  <line x1="509" y1="248" x2="560" y2="320" stroke="#8a8f94" stroke-width="5" stroke-linecap="round"/>
  <circle cx="240" cy="320" r="5" fill="#555"/>
  <circle cx="560" cy="320" r="5" fill="#555"/>

  <!-- Seat post, stem, handlebar -->
  <line x1="352" y1="236" x2="348" y2="220" stroke="#8a8f94" stroke-width="5" stroke-linecap="round"/>
  <line x1="503" y1="218" x2="498" y2="200" stroke="#8a8f94" stroke-width="5" stroke-linecap="round"/>
  <path d="M486 198 L506 198 Q532 196 532 214" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chain -->
  <g stroke="#444" stroke-width="2" fill="none">
    <line x1="390" y1="303" x2="240" y2="311"/>
    <line x1="390" y1="347" x2="240" y2="329"/>
  </g>
  <circle cx="240" cy="320" r="9" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2">
    <animateTransform attributeName="transform" type="rotate" from="0 240 320" to="360 240 320" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Saddle -->
  <path d="M322 224 Q345 213 380 221 Q383 228 372 229 Q342 231 322 229 Z" fill="#222"/>

  <!-- Near crank arm, chainring, pedal -->
  <g transform="translate(390,325)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="22" fill="none" stroke="#666" stroke-width="4" stroke-dasharray="4 2"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-3" width="22" height="6" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
    <circle r="6" fill="#999" stroke="#444" stroke-width="2"/>
  </g>

  <!-- Near leg -->
  <path fill="none" stroke="#3a2f27" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M360 226L435.1 247.2L430 325L444 325">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M360 226L435.1 247.2L430 325L444 325;M360 226L426.3 267L424.6 345L438.6 345;M360 226L414.5 281.8L410 359.6L424 359.6;M360 226L406.4 288.7L390 365L404 365;M360 226L404.8 289.8L370 359.6L384 359.6;M360 226L408 287.5L355.4 345L369.4 345;M360 226L414.8 281.5L350 325L364 325;M360 226L424.8 269.4L355.4 305L369.4 305;M360 226L435 247.3L370 290.4L384 290.4;M360 226L437.9 223.5L390 285L404 285;M360 226L437.5 217.4L410 290.4L424 290.4;M360 226L438 228.2L424.6 305L438.6 305;M360 226L435.1 247.2L430 325L444 325"/>
  </path>

  <!-- Pelican tail -->
  <path d="M308 184 L262 198 L271 208 L257 214 L308 208 Z" fill="#4a3a2c"/>

  <!-- Pelican body -->
  <ellipse cx="350" cy="190" rx="58" ry="38" transform="rotate(-8 350 190)" fill="#85705a"/>
  <ellipse cx="392" cy="186" rx="22" ry="26" fill="#a89884"/>
  <ellipse cx="344" cy="190" rx="40" ry="22" transform="rotate(-12 344 190)" fill="#5e4a3a"/>
  <g stroke="#43352a" stroke-width="2" stroke-linecap="round">
    <line x1="312" y1="190" x2="350" y2="184"/>
    <line x1="314" y1="198" x2="352" y2="192"/>
    <line x1="320" y1="205" x2="356" y2="199"/>
  </g>

  <!-- Wing reaching the handlebar -->
  <path d="M380 178 Q450 170 508 198" fill="none" stroke="#5e4a3a" stroke-width="13" stroke-linecap="round"/>
  <path d="M470 182 Q492 188 508 198" fill="none" stroke="#3b2d22" stroke-width="9" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M390 176 C380 150 400 128 428 122" fill="none" stroke="#5a4030" stroke-width="20" stroke-linecap="round"/>
  <path d="M396 176 C388 152 406 132 432 126" fill="none" stroke="#f4efe4" stroke-width="11" stroke-linecap="round"/>

  <!-- Head -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="1s" repeatCount="indefinite"/>
    <ellipse cx="436" cy="118" rx="17" ry="13" fill="#fbf8f0"/>
    <ellipse cx="431" cy="108" rx="11" ry="6" fill="#f1d36b"/>
    <path d="M451 125 Q488 162 522 144 Q486 144 451 125 Z" fill="#b87c5a"/>
    <path d="M449 112 L524 138 Q530 142 522 144 L449 127 Z" fill="#a39379"/>
    <path d="M517 137 L526 140 Q530 143 523 145 L516 142 Z" fill="#d2542a"/>
    <circle cx="443" cy="114" r="3" fill="#1c1c1c"/>
    <circle cx="444" cy="113" r="1" fill="#fff"/>
  </g>
</svg>