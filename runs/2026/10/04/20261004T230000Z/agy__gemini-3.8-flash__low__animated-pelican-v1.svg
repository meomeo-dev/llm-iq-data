<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Coastal Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee2b3" />
      <stop offset="45%" stop-color="#ffcaa7" />
      <stop offset="70%" stop-color="#ffdcb8" />
      <stop offset="100%" stop-color="#caebf2" />
    </linearGradient>

    <!-- Ocean Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d7f9d" />
      <stop offset="100%" stop-color="#19485c" />
    </linearGradient>

    <!-- Bicycle Metallic Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65c00" />
      <stop offset="50%" stop-color="#f9d423" />
      <stop offset="100%" stop-color="#ff4e50" />
    </linearGradient>

    <!-- Chrome / Steel Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a9ba8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Pelican Pouch Gradient -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e67e22" />
      <stop offset="70%" stop-color="#d35400" />
      <stop offset="100%" stop-color="#a04000" />
    </linearGradient>

    <!-- Pelican Body Feather Gradient -->
    <linearGradient id="pelicanBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#795548" />
      <stop offset="50%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#3e2723" />
    </linearGradient>

    <!-- Bicycle Wheel Template (Axle at 0,0, radius 105) -->
    <g id="bicycleWheel">
      <!-- Tire -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#222" stroke-width="16" />
      <circle cx="0" cy="0" r="97" fill="none" stroke="#f1f5f9" stroke-dasharray="3 7" stroke-width="2" opacity="0.6" />
      <!-- Rim -->
      <circle cx="0" cy="0" r="96" fill="none" stroke="url(#metalGrad)" stroke-width="7" />
      <circle cx="0" cy="0" r="92" fill="none" stroke="#334155" stroke-width="1.5" />
      <!-- 16 Spokes -->
      <g stroke="#cbd5e1" stroke-width="1.5" opacity="0.85">
        <line x1="0" y1="-92" x2="0" y2="92" />
        <line x1="-92" y1="0" x2="92" y2="0" />
        <line x1="-65" y1="-65" x2="65" y2="65" />
        <line x1="-65" y1="65" x2="65" y2="-65" />
        <line x1="-35" y1="-85" x2="35" y2="85" />
        <line x1="-85" y1="-35" x2="85" y2="35" />
        <line x1="-85" y1="35" x2="85" y2="-35" />
        <line x1="-35" y1="85" x2="35" y2="-85" />
      </g>
      <!-- Hub -->
      <circle cx="0" cy="0" r="16" fill="url(#metalGrad)" stroke="#334155" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#0f172a" />
    </g>

    <style><![CDATA[
      /* Road dashes movement */
      @keyframes roadMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      .anim-road {
        animation: roadMove 0.8s linear infinite;
      }

      /* Cloud drift */
      @keyframes cloudDrift {
        0% { transform: translateX(0); }
        100% { transform: translateX(-400px); }
      }
      .anim-clouds {
        animation: cloudDrift 28s linear infinite;
      }

      /* Wheel continuous forward spin */
      @keyframes spinForward {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .rear-wheel-spin {
        transform-origin: 260px 450px;
        animation: spinForward 1.2s linear infinite;
      }
      .front-wheel-spin {
        transform-origin: 740px 450px;
        animation: spinForward 1.2s linear infinite;
      }

      /* Bottom Bracket Crank Revolutions (1.2s per full pedal cycle) */
      @keyframes crankRev {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .crankset {
        transform-origin: 490px 450px;
        animation: crankRev 1.2s linear infinite;
      }

      /* Counter-rotate pedals so they stay level under feet */
      @keyframes pedalCounterRev {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      .pedal-left {
        transform-origin: 490px 395px;
        animation: pedalCounterRev 1.2s linear infinite;
      }
      .pedal-right {
        transform-origin: 490px 505px;
        animation: pedalCounterRev 1.2s linear infinite;
      }

      /* Pelican torso subtle bobbing in cadence with pedaling */
      @keyframes pelicanBob {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25% { transform: translateY(3px) rotate(0.5deg); }
        50% { transform: translateY(-1px) rotate(0deg); }
        75% { transform: translateY(3px) rotate(-0.5deg); }
      }
      .pelican-rider {
        transform-origin: 420px 300px;
        animation: pelicanBob 0.6s ease-in-out infinite;
      }

      /* Pouch throat flutter in the sea breeze */
      @keyframes throatGiggle {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.03, 0.96) translate(1px, 2px); }
      }
      .pouch-flutter {
        transform-origin: 660px 185px;
        animation: throatGiggle 0.4s ease-in-out infinite;
      }

      /* Left Leg Pedaling: Hip at (430, 315) -> Track Left Pedal (R=55 around 490,450, Phase 180°) */
      @keyframes pedalLegLeft {
        0%   { d: path("M 430 315 Q 460 365 470 410 L 490 395 L 515 400"); }
        25%  { d: path("M 430 315 Q 480 375 515 425 L 545 450 L 570 455"); }
        50%  { d: path("M 430 315 Q 490 415 500 470 L 490 505 L 515 510"); }
        75%  { d: path("M 430 315 Q 430 395 440 445 L 435 450 L 460 455"); }
        100% { d: path("M 430 315 Q 460 365 470 410 L 490 395 L 515 400"); }
      }
      .anim-leg-left {
        animation: pedalLegLeft 1.2s linear infinite;
      }

      /* Right Leg Pedaling: Hip at (445, 315) -> Track Right Pedal (R=55 around 490,450, Phase 0°) */
      @keyframes pedalLegRight {
        0%   { d: path("M 445 315 Q 500 415 505 470 L 490 505 L 518 510"); }
        25%  { d: path("M 445 315 Q 440 395 450 445 L 435 450 L 463 455"); }
        50%  { d: path("M 445 315 Q 470 365 478 410 L 490 395 L 518 400"); }
        75%  { d: path("M 445 315 Q 495 375 528 425 L 545 450 L 573 455"); }
        100% { d: path("M 445 315 Q 500 415 505 470 L 490 505 L 518 510"); }
      }
      .anim-leg-right {
        animation: pedalLegRight 1.2s linear infinite;
      }
    ]]></style>
  </defs>

  <!-- ================= BACKGROUND SCENE ================= -->
  <!-- Sky -->
  <rect x="0" y="0" width="1000" height="650" fill="url(#skyGrad)" />

  <!-- Distant Sun -->
  <circle cx="200" cy="180" r="70" fill="#fff5ea" opacity="0.75" />
  <circle cx="200" cy="180" r="90" fill="#ffe0b2" opacity="0.35" />

  <!-- Distant Coastal Mountains & Coastline -->
  <path d="M 0 380 Q 140 320 280 360 T 560 340 T 840 370 L 1000 360 L 1000 430 L 0 430 Z" fill="#b08968" opacity="0.5" />
  <path d="M 0 395 Q 180 360 400 385 T 800 375 L 1000 390 L 1000 430 L 0 430 Z" fill="#6c584c" opacity="0.7" />

  <!-- Coastal Ocean Shoreline -->
  <rect x="0" y="420" width="1000" height="80" fill="url(#oceanGrad)" />
  <!-- Wave crests -->
  <path d="M 0 435 C 100 430 150 440 250 435 C 350 430 400 440 500 435 C 600 430 650 440 750 435 C 850 430 900 440 1000 435" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.8" />
  <path d="M 0 450 C 80 447 130 455 220 450 C 310 445 360 455 450 450 C 540 445 590 455 680 450 C 770 445 820 455 1000 450" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.6" />

  <!-- Drifting Clouds -->
  <g class="anim-clouds" fill="#ffffff" opacity="0.6">
    <ellipse cx="250" cy="110" rx="60" ry="22" />
    <ellipse cx="280" cy="98" rx="45" ry="26" />
    <ellipse cx="780" cy="130" rx="80" ry="25" />
    <ellipse cx="820" cy="118" rx="55" ry="30" />
    <ellipse cx="1150" cy="105" rx="70" ry="24" />
    <ellipse cx="1190" cy="92" rx="50" ry="28" />
  </g>

  <!-- Distant Flying Brown Pelicans in V-formation -->
  <g stroke="#4a3728" stroke-width="2.5" fill="none" opacity="0.6">
    <path d="M 750 80 Q 760 70 770 80 Q 780 70 790 80" />
    <path d="M 790 95 Q 800 87 810 95 Q 820 87 830 95" />
    <path d="M 835 110 Q 845 103 855 110 Q 865 103 875 110" />
  </g>

  <!-- Ground / Seaside Boardwalk / Bike Path -->
  <rect x="0" y="490" width="1000" height="160" fill="#334155" />
  <!-- Sidewalk curb -->
  <rect x="0" y="490" width="1000" height="12" fill="#94a3b8" />
  <!-- Striped Bike Lane Markings (Animated moving left) -->
  <line x1="0" y1="565" x2="1000" y2="565" stroke="#f8fafc" stroke-width="5" stroke-dasharray="60 60" class="anim-road" />
  <line x1="0" y1="640" x2="1000" y2="640" stroke="#f59e0b" stroke-width="4" />

  <!-- ================= BICYCLE AND RIDER LAYER ================= -->
  <!-- Shadow on the Road -->
  <ellipse cx="500" cy="560" rx="310" ry="16" fill="#0f172a" opacity="0.35" />

  <!-- 1. LEFT / FAR LEG (Behind Bike Frame) -->
  <path class="anim-leg-left" d="M 430 315 Q 460 365 470 410 L 490 395 L 515 400"
        fill="none" stroke="#261b17" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left Webbed Foot / Flipper -->
  <g class="crankset">
    <g class="pedal-left">
      <!-- Left Pedal Bar & Plate -->
      <rect x="474" y="392" width="32" height="6" rx="3" fill="#1e293b" stroke="#000" stroke-width="1.5" />
      <path d="M 485 394 L 525 390 L 515 404 Z" fill="#b45309" opacity="0.9" /> <!-- Foot toe web -->
    </g>
  </g>

  <!-- 2. REAR WHEEL (Animated continuous forward spin around center 260, 450) -->
  <g class="rear-wheel-spin">
    <use href="#bicycleWheel" x="260" y="450" />
  </g>

  <!-- Rear Wheel Cassette Cog -->
  <circle cx="260" cy="450" r="22" fill="url(#metalGrad)" stroke="#1e293b" stroke-width="2" />
  <circle cx="260" cy="450" r="10" fill="#334155" />

  <!-- 3. DRIVE CHAIN -->
  <!-- Chain loops between Rear Hub (260, 450) and Bottom Bracket (490, 450) -->
  <path d="M 260 435 L 490 427 A 24 24 0 0 1 490 473 L 260 465 A 15 15 0 0 1 260 435 Z"
        fill="none" stroke="#475569" stroke-width="4.5" stroke-dasharray="5 3" />

  <!-- 4. BICYCLE FRAME -->
  <!-- Geometry:
       Rear Dropouts: (260, 450)
       Seat Tube Junction / Cluster: (410, 310)
       Bottom Bracket (BB): (490, 450)
       Head Tube Top: (670, 275)
       Head Tube Bottom: (685, 335)
       Front Dropouts / Axle: (740, 450)
  -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Chain Stay: Rear Axle to BB -->
    <line x1="260" y1="450" x2="490" y2="450" stroke="#f97316" stroke-width="14" />
    <line x1="260" y1="450" x2="490" y2="450" stroke="url(#frameGrad)" stroke-width="10" />

    <!-- Seat Stay: Rear Axle to Seat Cluster -->
    <line x1="260" y1="450" x2="410" y2="310" stroke="#c2410c" stroke-width="14" />
    <line x1="260" y1="450" x2="410" y2="310" stroke="url(#frameGrad)" stroke-width="9" />

    <!-- Seat Tube: BB to Seat Cluster -->
    <line x1="490" y1="450" x2="410" y2="310" stroke="#ea580c" stroke-width="16" />
    <line x1="490" y1="450" x2="410" y2="310" stroke="url(#frameGrad)" stroke-width="12" />

    <!-- Down Tube: BB to Head Tube Bottom -->
    <line x1="490" y1="450" x2="685" y2="335" stroke="#c2410c" stroke-width="17" />
    <line x1="490" y1="450" x2="685" y2="335" stroke="url(#frameGrad)" stroke-width="13" />

    <!-- Top Tube: Seat Cluster to Head Tube Top -->
    <line x1="410" y1="310" x2="670" y2="275" stroke="#ea580c" stroke-width="16" />
    <line x1="410" y1="310" x2="670" y2="275" stroke="url(#frameGrad)" stroke-width="12" />

    <!-- Head Tube: Head Tube Top to Bottom -->
    <line x1="670" y1="275" x2="685" y2="335" stroke="#9a3412" stroke-width="18" />
    <line x1="670" y1="275" x2="685" y2="335" stroke="url(#frameGrad)" stroke-width="14" />

    <!-- Front Fork: Head Tube Bottom to Front Axle -->
    <line x1="685" y1="335" x2="740" y2="450" stroke="#475569" stroke-width="13" />
    <line x1="685" y1="335" x2="740" y2="450" stroke="url(#metalGrad)" stroke-width="9" />

    <!-- Seat Post & Bicycle Saddle (Seat) -->
    <line x1="410" y1="310" x2="395" y2="280" stroke="url(#metalGrad)" stroke-width="9" />
    <!-- Saddle Seat Contour -->
    <path d="M 355 275 C 380 270 425 272 445 282 C 435 288 415 288 395 287 C 375 287 360 286 355 275 Z" fill="#1e1b18" stroke="#000" stroke-width="2" />

    <!-- Stem & Handlebars -->
    <line x1="670" y1="275" x2="663" y2="240" stroke="url(#metalGrad)" stroke-width="10" />
    <!-- Classic Upright Cruiser / Swept Handlebars -->
    <path d="M 663 240 Q 650 220 635 235" fill="none" stroke="url(#metalGrad)" stroke-width="9" />
    <!-- Rubber Grips -->
    <path d="M 640 232 L 625 245" stroke="#1e293b" stroke-width="11" stroke-linecap="round" />
  </g>

  <!-- 5. CRANKSET & PEDALS (Driven by pure animation at 490, 450) -->
  <g class="crankset">
    <!-- Chainring (Front Sprocket) -->
    <circle cx="490" cy="450" r="30" fill="url(#metalGrad)" stroke="#1e293b" stroke-width="3" />
    <!-- Chainring lightening cutouts -->
    <circle cx="490" cy="430" r="6" fill="#334155" />
    <circle cx="507" cy="460" r="6" fill="#334155" />
    <circle cx="473" cy="460" r="6" fill="#334155" />

    <!-- Left Crank Arm (180 deg out of phase, pointing UP at 0s: (490, 450) to (490, 395)) -->
    <line x1="490" y1="450" x2="490" y2="395" stroke="#334155" stroke-width="11" stroke-linecap="round" />
    <circle cx="490" cy="395" r="5" fill="#e2e8f0" />

    <!-- Right Crank Arm (In phase, pointing DOWN at 0s: (490, 450) to (490, 505)) -->
    <line x1="490" y1="450" x2="490" y2="505" stroke="url(#metalGrad)" stroke-width="11" stroke-linecap="round" />
    <circle cx="490" cy="505" r="7" fill="#1e293b" />

    <!-- Bottom Bracket Center Spindle Nut -->
    <circle cx="490" cy="450" r="11" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- 6. FRONT WHEEL (Animated continuous forward spin around center 740, 450) -->
  <g class="front-wheel-spin">
    <use href="#bicycleWheel" x="740" y="450" />
  </g>

  <!-- 7. PELICAN RIDER (CALIFORNIA BROWN PELICAN) -->
  <!-- Anatomical features: Large pouched bill with hooked tip, pale yellow crown,
       rich chestnut brown neck hindstripe, silvery gray-brown feathered mantle & wings -->
  <g class="pelican-rider">
    <!-- Tail Feathers perched over the saddle back -->
    <path d="M 350 295 Q 320 305 305 320 Q 335 315 365 305 Z" fill="#3e2723" stroke="#271a15" stroke-width="2" />
    <path d="M 355 290 Q 330 295 315 310 Q 345 305 375 298 Z" fill="#4e342e" />

    <!-- Main Torso / Body -->
    <ellipse cx="445" cy="275" rx="75" ry="50" transform="rotate(-18 445 275)" fill="url(#pelicanBrown)" stroke="#271a15" stroke-width="2" />

    <!-- Layered Wing Feathers (Silver-gray / Chestnut brown scalloped edges) -->
    <!-- Primary & Secondary Coverts -->
    <path d="M 390 280 Q 420 235 480 250 Q 515 285 450 305 Q 405 310 390 280 Z" fill="#6d4c41" stroke="#3e2723" stroke-width="2" />
    <path d="M 405 285 C 430 255 470 265 490 290 C 465 315 425 310 405 285 Z" fill="#8d6e63" />
    <!-- Feather Scallop lines -->
    <path d="M 415 280 Q 435 295 455 280 M 435 290 Q 455 305 475 290 M 420 265 Q 445 280 470 265" fill="none" stroke="#cfd8dc" stroke-width="2.5" opacity="0.8" />

    <!-- Pelagic Curved S-Neck -->
    <!-- Foreneck (silky white / light straw) -->
    <path d="M 505 260 C 530 250 560 210 550 170 C 545 150 560 120 595 110" fill="none" stroke="#f8fafc" stroke-width="32" stroke-linecap="round" />
    <!-- Nape / Hindneck (Deep chestnut/seal brown band characteristic of breeding Pelecanus occidentalis) -->
    <path d="M 495 260 C 515 245 540 205 530 165 C 525 145 545 118 585 105" fill="none" stroke="#3e2723" stroke-width="14" stroke-linecap="round" />

    <!-- Pelican Head Structure -->
    <g id="pelicanHead">
      <!-- Head Base -->
      <ellipse cx="600" cy="115" rx="35" ry="24" transform="rotate(-6 600 115)" fill="#f8fafc" />
      <!-- Pale Yellow Feathered Crown Crest -->
      <path d="M 580 102 C 585 80 620 85 635 102 C 615 95 595 95 580 102 Z" fill="#fef08a" stroke="#facc15" stroke-width="1.5" />

      <!-- Characteristic Huge Pelican Bill and Gular Pouch -->
      <!-- Expanded Pouch (Gular Sac) -->
      <g class="pouch-flutter">
        <path d="M 630 130 C 655 170 705 220 740 185 C 765 160 760 142 770 140 Z" fill="url(#pouchGrad)" opacity="0.95" />
        <!-- Pouch delicate vein striations -->
        <path d="M 660 150 Q 700 190 730 170 M 680 145 Q 715 180 745 160" fill="none" stroke="#b91c1c" stroke-width="1.5" opacity="0.4" />
      </g>

      <!-- Upper Maxilla (Long hooked gray/horn bill) -->
      <path d="M 620 115 L 795 133 C 815 137 810 148 795 147 L 625 132 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2" />
      <!-- Hooked Nail tip (Dertrum) of beak -->
      <path d="M 790 133 Q 815 138 805 152 Q 795 150 790 142 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1" />

      <!-- Lower Mandible Rim -->
      <path d="M 630 130 L 795 145" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

      <!-- Bare Facial Skin around eye (Rosy / Slate bare patch) -->
      <circle cx="612" cy="115" r="9" fill="#94a3b8" opacity="0.5" />
      <!-- Pelican Eye (Bright straw-yellow iris with dark pupil) -->
      <circle cx="612" cy="115" r="5.5" fill="#fef08a" stroke="#475569" stroke-width="1" />
      <circle cx="613" cy="115" r="2.8" fill="#0f172a" />
      <circle cx="614" cy="113.8" r="1" fill="#ffffff" />
    </g>

    <!-- Pelican Arms / Wings reaching forward to steer handlebars -->
    <!-- Left Wing/Hand gripping bar -->
    <path d="M 470 260 Q 560 250 635 235" fill="none" stroke="#4e342e" stroke-width="18" stroke-linecap="round" />
    <path d="M 470 260 Q 560 250 635 235" fill="none" stroke="#6d4c41" stroke-width="13" stroke-linecap="round" />
    <!-- Feather wingtip feathers wrapped over handlebar grip -->
    <path d="M 625 228 C 640 220 648 245 630 248 Z" fill="#3e2723" />
    <path d="M 633 226 C 648 222 654 242 638 248 Z" fill="#271a15" />

    <!-- Dapper Seaside Bicyclist Accents: Breezy Flying Nautical Neck-Scarf -->
    <path d="M 525 240 Q 480 250 435 230 Q 475 255 520 255 Z" fill="#38bdf8" />
    <path d="M 520 245 Q 460 265 410 255 Q 460 270 515 258 Z" fill="#0284c7" />
  </g>

  <!-- 8. RIGHT / FOREGROUND LEG (Anatomically positioned outside the frame) -->
  <!-- Hip origin: (445, 315) -> Dynamic Thigh -> Knee -> Tarsus -> Foot onto Right Pedal -->
  <path class="anim-leg-right" d="M 445 315 Q 500 415 505 470 L 490 505 L 518 510"
        fill="none" stroke="#3e2723" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Yellowish-gray scale texture line on pelican tarsus -->
  <g class="crankset">
    <g class="pedal-right">
      <!-- Right Pedal Spindle & Platform -->
      <rect x="472" y="502" width="36" height="8" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
      <circle cx="490" cy="506" r="3.5" fill="#f59e0b" /> <!-- Amber pedal reflector -->

      <!-- Webbed Foot grasping pedal -->
      <path d="M 475 505 L 525 498 Q 535 508 522 516 L 478 510 Z" fill="#d97706" opacity="0.95" stroke="#78350f" stroke-width="1.5" />
      <!-- 4 Webbed Claws/Toes -->
      <line x1="495" y1="504" x2="526" y2="500" stroke="#78350f" stroke-width="1.5" />
      <line x1="495" y1="507" x2="528" y2="507" stroke="#78350f" stroke-width="1.5" />
      <line x1="495" y1="510" x2="524" y2="515" stroke="#78350f" stroke-width="1.5" />
    </g>
  </g>

  <!-- Foreground Beach Grass Details -->
  <path d="M 20 650 Q 30 600 55 580 Q 40 610 35 650" fill="#65a30d" />
  <path d="M 40 650 Q 55 590 85 575 Q 65 610 55 650" fill="#84cc16" />
  <path d="M 940 650 Q 950 595 985 585 Q 965 615 955 650" fill="#65a30d" />
</svg>