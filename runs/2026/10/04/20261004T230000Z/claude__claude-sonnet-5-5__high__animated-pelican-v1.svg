<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f0"/>
      <stop offset="1" stop-color="#e3f3fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="78" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="72" fill="none" stroke="#9aa5ad" stroke-width="2"/>
      <g stroke="#b8c0c6" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#444"/>
      <circle r="2.5" fill="#ddd"/>
      <circle cx="60" cy="0" r="3.5" fill="#e74c3c"/>
    </g>
  </defs>

  <rect width="800" height="560" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="38" fill="#fff3b0" opacity="0.9"/>
  <rect y="473" width="800" height="87" fill="#ead9a6"/>
  <line x1="0" y1="474" x2="800" y2="474" stroke="#b59f6a" stroke-width="4" stroke-dasharray="30 20">
    <animate attributeName="stroke-dashoffset" from="0" to="500" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="510" x2="800" y2="510" stroke="#c9b47a" stroke-width="3" stroke-dasharray="60 40">
    <animate attributeName="stroke-dashoffset" from="0" to="500" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="370" cy="476" rx="200" ry="6" fill="#000" opacity="0.15"/>

  <!-- Wheels -->
  <g transform="translate(220,390)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="10" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 2"/>
    </g>
  </g>
  <g transform="translate(520,390)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Chain -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="350" y1="378" x2="220" y2="380"/>
    <line x1="350" y1="422" x2="220" y2="400"/>
  </g>

  <!-- Far leg -->
  <path fill="none" stroke="#555" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M322 285 L374 343.1 L315 400 l12 0">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M322 285 L374 343.1 L315 400 l12 0;
              M322 285 L389.4 324.2 L325.3 375.3 l12 0;
              M322 285 L398.7 299 L350 365 l12 0;
              M322 285 L399.1 296.9 L374.8 375.3 l12 0;
              M322 285 L392.5 318.4 L385 400 l12 0;
              M322 285 L374.4 342.8 L374.8 424.8 l12 0;
              M322 285 L359.3 353.5 L350 435 l12 0;
              M322 285 L362.5 351.7 L325.3 424.8 l12 0;
              M322 285 L374 343.1 L315 400 l12 0"/>
  </path>

  <!-- Frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="350" y1="400" x2="322" y2="300"/>
    <line x1="322" y1="302" x2="478" y2="295"/>
    <line x1="350" y1="400" x2="484" y2="316"/>
    <line x1="220" y1="390" x2="350" y2="400"/>
    <line x1="220" y1="390" x2="322" y2="306"/>
    <line x1="474" y1="288" x2="487" y2="322"/>
    <path d="M487 322 Q 497 346 520 390"/>
  </g>
  <circle cx="474" cy="288" r="4" fill="#7b241c"/>
  <!-- Seat post and saddle -->
  <line x1="322" y1="302" x2="321" y2="293" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M296 292 Q 322 285 348 294 Q 322 303 296 297 Z" fill="#2c2c2c"/>
  <!-- Stem and handlebar -->
  <g fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round">
    <line x1="474" y1="288" x2="470" y2="272" stroke-width="5"/>
    <path d="M468 272 L486 268 Q 502 265 506 282" stroke-width="5"/>
  </g>
  <circle cx="487" cy="268" r="5" fill="#111"/>

  <!-- Crank group -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 350 400" to="360 350 400" dur="2s" repeatCount="indefinite"/>
    <circle cx="350" cy="400" r="22" fill="#cfd4d8" fill-opacity="0.5" stroke="#666" stroke-width="2"/>
    <circle cx="350" cy="400" r="23.5" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="3 2"/>
    <line x1="350" y1="400" x2="385" y2="400" stroke="#555" stroke-width="7" stroke-linecap="round"/>
    <line x1="350" y1="400" x2="315" y2="400" stroke="#555" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(385,400)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-13" y="-3" width="26" height="6" rx="2" fill="#222"/>
      </g>
    </g>
    <g transform="translate(315,400)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-13" y="-3" width="26" height="6" rx="2" fill="#222"/>
      </g>
    </g>
  </g>
  <circle cx="350" cy="400" r="6" fill="#333"/>
  <circle cx="350" cy="400" r="2" fill="#aaa"/>

  <!-- Near leg -->
  <path fill="none" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M322 285 L392.5 318.4 L385 400 l12 0">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M322 285 L392.5 318.4 L385 400 l12 0;
              M322 285 L374.4 342.8 L374.8 424.8 l12 0;
              M322 285 L359.3 353.5 L350 435 l12 0;
              M322 285 L362.5 351.7 L325.3 424.8 l12 0;
              M322 285 L374 343.1 L315 400 l12 0;
              M322 285 L389.4 324.2 L325.3 375.3 l12 0;
              M322 285 L398.7 299 L350 365 l12 0;
              M322 285 L399.1 296.9 L374.8 375.3 l12 0;
              M322 285 L392.5 318.4 L385 400 l12 0"/>
  </path>

  <!-- Pelican: tail and body -->
  <path d="M292 266 L262 292 L286 292 L304 280 Z" fill="#4a362a"/>
  <ellipse cx="335" cy="250" rx="58" ry="34" transform="rotate(-30 335 250)" fill="#8a6a50"/>
  <ellipse cx="345" cy="258" rx="40" ry="18" transform="rotate(-30 345 258)" fill="#b39a82" opacity="0.7"/>
  <ellipse cx="326" cy="252" rx="40" ry="22" transform="rotate(-30 326 252)" fill="#6b513c"/>

  <!-- Neck and head -->
  <path d="M376 232 C 392 214, 392 196, 408 178" fill="none" stroke="#f3efe6" stroke-width="18" stroke-linecap="round"/>
  <path d="M367 226 C 383 208, 383 192, 399 172" fill="none" stroke="#5a3f2c" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="416" cy="165" rx="17" ry="14" fill="#f6e9a6"/>
  <path d="M402 160 Q 408 149 421 150" fill="none" stroke="#5a3f2c" stroke-width="4" stroke-linecap="round"/>
  <path d="M431 173 Q 470 212 507 187 L 440 176 Z" fill="#c9a36b"/>
  <path d="M428 158 L 510 180 Q 515 184 508 188 L 430 174 Z" fill="#a89b7a"/>
  <path d="M506 180 Q 516 182 510 190" fill="none" stroke="#6d6247" stroke-width="3" stroke-linecap="round"/>
  <circle cx="423" cy="160" r="4" fill="#fff"/>
  <circle cx="423.5" cy="160" r="2.5" fill="#111"/>

  <!-- Wing arm to handlebar -->
  <path d="M352 245 Q 425 262 486 268" fill="none" stroke="#6b513c" stroke-width="11" stroke-linecap="round"/>
  <path d="M352 249 Q 425 266 484 272" fill="none" stroke="#8a6a50" stroke-width="3" stroke-linecap="round"/>
  <circle cx="488" cy="268" r="6" fill="#3a2a20"/>
</svg>