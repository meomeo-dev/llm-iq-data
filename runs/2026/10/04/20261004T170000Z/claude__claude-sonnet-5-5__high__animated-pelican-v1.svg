<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f5"/>
      <stop offset="1" stop-color="#f6efd9"/>
    </linearGradient>
    <g id="spokes" stroke="#9a9a9a" stroke-width="1.2">
      <line x1="-65" y1="0" x2="65" y2="0"/>
      <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(22.5)"/>
      <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(45)"/>
      <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(67.5)"/>
      <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(90)"/>
      <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(112.5)"/>
      <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(135)"/>
      <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(157.5)"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <rect x="0" y="420" width="800" height="80" fill="#d9c9a0"/>
  <ellipse cx="400" cy="424" rx="230" ry="8" fill="#000" opacity="0.15"/>
  <line x1="0" y1="438" x2="800" y2="438" stroke="#a48f61" stroke-width="4" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.7s" repeatCount="indefinite"/>
  </line>

  <!-- rear wheel -->
  <g transform="translate(240,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <circle r="68" fill="none" stroke="#2b2b2b" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#bdbdbd" stroke-width="2"/>
      <use href="#spokes" xlink:href="#spokes"/>
      <circle cx="62" cy="0" r="3.5" fill="#e74c3c"/>
      <circle r="7" fill="#555"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(560,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <circle r="68" fill="none" stroke="#2b2b2b" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#bdbdbd" stroke-width="2"/>
      <use href="#spokes" xlink:href="#spokes"/>
      <circle cx="62" cy="0" r="3.5" fill="#e74c3c"/>
      <circle r="7" fill="#555"/>
    </g>
  </g>

  <!-- far crank and pedal -->
  <g transform="translate(370,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-30" y2="0" stroke="#666" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(-30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-2.5" width="20" height="5" rx="1.5" fill="#333"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#5a5550" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M350,238 L399.2,301.1 L340,355 L354,358">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M350,238 L399.2,301.1 L340,355 L354,358;
      M350,238 L408.5,292.6 L344,340 L358,343;
      M350,238 L418.2,279.9 L355,329 L369,332;
      M350,238 L424.7,266.6 L370,325 L384,328;
      M350,238 L426.7,260.7 L385,329 L399,332;
      M350,238 L425.2,265.5 L396,340 L410,343;
      M350,238 L419.6,277.4 L400,355 L414,358;
      M350,238 L409.7,291.2 L396,370 L410,373;
      M350,238 L398,302 L385,381 L399,384;
      M350,238 L389.6,307.5 L370,385 L384,388;
      M350,238 L388.4,308.2 L355,381 L369,384;
      M350,238 L392.2,306 L344,370 L358,373;
      M350,238 L399.2,301.1 L340,355 L354,358"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="240" y1="350" x2="370" y2="355"/>
    <line x1="240" y1="350" x2="335" y2="255"/>
    <line x1="370" y1="355" x2="335" y2="255"/>
    <line x1="335" y1="255" x2="512" y2="248"/>
    <line x1="370" y1="355" x2="520" y2="260"/>
    <line x1="512" y1="238" x2="522" y2="262"/>
    <line x1="522" y1="262" x2="560" y2="350"/>
  </g>
  <!-- seatpost and saddle -->
  <line x1="335" y1="255" x2="332" y2="238" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M312,236 Q335,229 360,236 Q364,243 350,244 L318,243 Z" fill="#222"/>
  <!-- stem and handlebar -->
  <line x1="512" y1="238" x2="507" y2="220" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M500,212 L522,208 Q537,208 537,224" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="524" cy="209" r="5" fill="#111"/>

  <!-- chain -->
  <line x1="370" y1="341" x2="240" y2="343" stroke="#444" stroke-width="2"/>
  <line x1="370" y1="369" x2="240" y2="357" stroke="#444" stroke-width="2"/>
  <circle cx="240" cy="350" r="8" fill="none" stroke="#444" stroke-width="3"/>

  <!-- near crank, chainring, pedal -->
  <g transform="translate(370,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <circle r="14" fill="none" stroke="#444" stroke-width="3"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#444" stroke-width="2"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#444" stroke-width="2"/>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#888" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-2.5" width="20" height="5" rx="1.5" fill="#222"/>
        </g>
      </g>
    </g>
    <circle r="5" fill="#222"/>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#2f2c2a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M350,238 L419.6,277.4 L400,355 L414,358">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M350,238 L419.6,277.4 L400,355 L414,358;
      M350,238 L409.7,291.2 L396,370 L410,373;
      M350,238 L398,302 L385,381 L399,384;
      M350,238 L389.6,307.5 L370,385 L384,388;
      M350,238 L388.4,308.2 L355,381 L369,384;
      M350,238 L392.2,306 L344,370 L358,373;
      M350,238 L399.2,301.1 L340,355 L354,358;
      M350,238 L408.5,292.6 L344,340 L358,343;
      M350,238 L418.2,279.9 L355,329 L369,332;
      M350,238 L424.7,266.6 L370,325 L384,328;
      M350,238 L426.7,260.7 L385,329 L399,332;
      M350,238 L425.2,265.5 L396,340 L410,343;
      M350,238 L419.6,277.4 L400,355 L414,358"/>
  </path>

  <!-- pelican: tail, body -->
  <path d="M305,222 L268,208 L272,232 Z" fill="#4a3a2d"/>
  <ellipse cx="348" cy="218" rx="52" ry="28" transform="rotate(-8 348 218)" fill="#7d6a58"/>
  <ellipse cx="365" cy="228" rx="32" ry="15" transform="rotate(-8 365 228)" fill="#a8998a"/>

  <!-- neck -->
  <path d="M382,208 C404,188 396,162 422,150" fill="none" stroke="#5b3a24" stroke-width="18" stroke-linecap="round"/>
  <path d="M386,208 C410,190 402,164 428,152" fill="none" stroke="#f4efe6" stroke-width="12" stroke-linecap="round"/>

  <!-- head and bill -->
  <circle cx="429" cy="146" r="15" fill="#f6f1e7"/>
  <path d="M416,140 Q428,126 444,138 Q432,134 416,140 Z" fill="#e8c95a"/>
  <path d="M440,139 L508,160 Q511,164 506,166 L441,156 Z" fill="#b9a98a"/>
  <path d="M441,155 Q468,190 505,166 Q470,166 441,155 Z" fill="#8c6b4a"/>
  <circle cx="434" cy="143" r="2.6" fill="#1a1a1a"/>

  <!-- wing / arm to handlebar -->
  <path d="M372,203 C420,238 480,236 524,212" fill="none" stroke="#4a3a2d" stroke-width="14" stroke-linecap="round"/>
  <path d="M376,205 C422,238 482,234 522,213" fill="none" stroke="#6a5645" stroke-width="5" stroke-linecap="round"/>
  <circle cx="525" cy="211" r="6" fill="#3a2c21"/>
</svg>