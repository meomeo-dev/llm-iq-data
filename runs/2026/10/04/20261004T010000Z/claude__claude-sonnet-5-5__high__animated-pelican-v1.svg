<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#e6f5fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="77" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="72" fill="none" stroke="#b8c0c8" stroke-width="2"/>
      <g stroke="#c8ccd2" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="9" fill="#666"/>
      <circle r="3.5" fill="#ddd"/>
      <circle cx="0" cy="-66" r="3.5" fill="#e63946"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="660" cy="90" r="38" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="1000 0" dur="60s" repeatCount="indefinite"/>
      <ellipse cx="100" cy="90" rx="50" ry="16"/>
      <ellipse cx="135" cy="78" rx="34" ry="16"/>
      <ellipse cx="70" cy="80" rx="30" ry="13"/>
    </g>
  </g>
  <rect y="500" width="800" height="100" fill="#d9c398"/>
  <line x1="0" y1="530" x2="800" y2="530" stroke="#b79f6e" stroke-width="4" stroke-dasharray="40 20">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="503" rx="190" ry="6" fill="#000" opacity="0.2"/>

  <!-- far crank + pedal -->
  <g transform="translate(390,430)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="2s" repeatCount="indefinite"/>
          <rect x="-13" y="-3" width="26" height="6" rx="2" fill="#333"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#6b6b6b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
        d="M350,288 L419.1,353.2 L355,430">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M350,288 L419.1,353.2 L355,430;
      M350,288 L429.2,340.5 L359.7,412.5;
      M350,288 L437.9,324 L372.5,399.7;
      M350,288 L442.4,309.9 L390,395;
      M350,288 L443.2,306.3 L407.5,399.7;
      M350,288 L441.2,314.7 L420.3,412.5;
      M350,288 L435,330.5 L425,430;
      M350,288 L424,347.5 L420.3,447.5;
      M350,288 L411.5,360.4 L407.5,460.3;
      M350,288 L404.2,366 L390,465;
      M350,288 L404.7,365.7 L372.5,460.3;
      M350,288 L410.4,361.3 L359.7,447.5;
      M350,288 L419.1,353.2 L355,430"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="2s" repeatCount="indefinite" values="
      355 430;359.7 412.5;372.5 399.7;390 395;407.5 399.7;420.3 412.5;425 430;420.3 447.5;407.5 460.3;390 465;372.5 460.3;359.7 447.5;355 430"/>
    <path d="M-8,-6 L16,-2 L18,1 L-8,1 Z" fill="#555" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- wheels -->
  <g transform="translate(250,420)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550,420)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- frame -->
  <g stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="250" y1="420" x2="390" y2="430"/>
    <line x1="250" y1="420" x2="338" y2="300"/>
    <line x1="390" y1="430" x2="336" y2="302"/>
    <line x1="338" y1="302" x2="508" y2="306"/>
    <line x1="390" y1="430" x2="506" y2="308"/>
    <line x1="512" y1="296" x2="550" y2="420"/>
    <line x1="504" y1="298" x2="514" y2="312" stroke-width="9"/>
    <line x1="336" y1="302" x2="334" y2="292" stroke="#444" stroke-width="5"/>
    <line x1="512" y1="296" x2="518" y2="268" stroke="#444" stroke-width="5"/>
    <path d="M512,266 L540,262 Q558,262 557,278" stroke="#444" stroke-width="5"/>
  </g>
  <circle cx="390" cy="430" r="8" fill="#444"/>
  <circle cx="250" cy="420" r="7" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="2 2"/>

  <!-- chain -->
  <g stroke="#555" stroke-width="2" stroke-dasharray="3 2">
    <line x1="390" y1="413" x2="250" y2="413"/>
    <line x1="390" y1="447" x2="250" y2="427"/>
  </g>

  <!-- saddle -->
  <path d="M312,292 Q335,286 365,290 L366,296 Q338,300 312,297 Z" fill="#2b2b2b"/>

  <!-- near crank + pedal -->
  <g transform="translate(390,430)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="17" fill="none" stroke="#888" stroke-width="4" stroke-dasharray="3 2"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#444" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-13" y="-3" width="26" height="6" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#3e3e3e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M350,288 L435,330.5 L425,430">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M350,288 L435,330.5 L425,430;
      M350,288 L424,347.5 L420.3,447.5;
      M350,288 L411.5,360.4 L407.5,460.3;
      M350,288 L404.2,366 L390,465;
      M350,288 L404.7,365.7 L372.5,460.3;
      M350,288 L410.4,361.3 L359.7,447.5;
      M350,288 L419.1,353.2 L355,430;
      M350,288 L429.2,340.5 L359.7,412.5;
      M350,288 L437.9,324 L372.5,399.7;
      M350,288 L442.4,309.9 L390,395;
      M350,288 L443.2,306.3 L407.5,399.7;
      M350,288 L441.2,314.7 L420.3,412.5;
      M350,288 L435,330.5 L425,430"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="2s" repeatCount="indefinite" values="
      425 430;420.3 447.5;407.5 460.3;390 465;372.5 460.3;359.7 447.5;355 430;359.7 412.5;372.5 399.7;390 395;407.5 399.7;420.3 412.5;425 430"/>
    <path d="M-8,-6 L16,-2 L18,1 L-8,1 Z" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- pelican: tail and body -->
  <path d="M290,236 L250,262 L296,266 Z" fill="#54442f"/>
  <ellipse cx="340" cy="248" rx="60" ry="42" transform="rotate(-12 340 248)" fill="#8d7a62"/>
  <ellipse cx="358" cy="262" rx="38" ry="22" transform="rotate(-12 358 262)" fill="#a8957a"/>

  <!-- neck -->
  <path d="M378,232 C402,226 396,196 412,176 C420,166 426,160 432,152" fill="none" stroke="#f1ece0" stroke-width="20" stroke-linecap="round"/>
  <path d="M372,222 C392,214 386,190 400,170" fill="none" stroke="#5b3d2a" stroke-width="7" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="432" cy="150" r="17" fill="#f6f1e4"/>
  <path d="M417,143 Q430,126 447,140 Q436,135 417,143 Z" fill="#f0cf5a"/>
  <circle cx="439" cy="146" r="3.2" fill="#111"/>
  <circle cx="440" cy="145" r="1" fill="#fff"/>

  <!-- bill -->
  <path d="M448,157 Q492,204 541,177 L448,163 Z" fill="#cbb88c" stroke="#9c8a66" stroke-width="1"/>
  <path d="M446,142 L548,172 Q548,178 540,178 L446,160 Z" fill="#a39373"/>
  <path d="M538,171 L549,172 Q549,178 541,178 Z" fill="#d9822b"/>

  <!-- wing reaching the handlebar -->
  <path d="M360,238 Q420,262 470,262 L543,263" fill="none" stroke="#6b5a45" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M362,236 Q420,258 470,258 L530,259" fill="none" stroke="#8a7760" stroke-width="5" stroke-linecap="round"/>
  <circle cx="545" cy="263" r="6" fill="#222"/>
</svg>