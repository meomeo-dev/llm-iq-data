<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd6f5"/>
      <stop offset="1" stop-color="#e8f6fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="660" cy="80" r="34" fill="#fff3b0"/>
  <rect x="0" y="430" width="800" height="70" fill="#c9b27c"/>
  <line x1="0" y1="433" x2="800" y2="433" stroke="#8a7449" stroke-width="3"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#a08a58" stroke-width="4" stroke-dasharray="30 30">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- rear wheel -->
  <g transform="translate(260,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#aaa" stroke-width="2"/>
      <g stroke="#999" stroke-width="1.2">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(22.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(45)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(67.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(112.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(135)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="9" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="3 2"/>
      <circle cx="0" cy="-56" r="4" fill="#ff8a00"/>
      <circle r="5" fill="#555"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(560,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#aaa" stroke-width="2"/>
      <g stroke="#999" stroke-width="1.2">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(22.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(45)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(67.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(112.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(135)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-56" r="4" fill="#ff8a00"/>
      <circle r="6" fill="#555"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="400" y1="349" x2="260" y2="352"/>
    <line x1="400" y1="381" x2="260" y2="368"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="400" y1="365" x2="260" y2="360"/>
    <line x1="369" y1="290" x2="260" y2="360"/>
    <line x1="400" y1="365" x2="368" y2="285"/>
    <line x1="370" y1="290" x2="520" y2="284"/>
    <line x1="400" y1="365" x2="528" y2="300"/>
    <line x1="516" y1="278" x2="530" y2="305" stroke-width="9"/>
    <line x1="530" y1="305" x2="560" y2="360" stroke="#888" stroke-width="5"/>
    <line x1="368" y1="285" x2="366" y2="270" stroke="#444" stroke-width="5"/>
    <line x1="516" y1="278" x2="506" y2="246" stroke="#444" stroke-width="5"/>
    <path d="M500,246 L530,242 Q548,242 548,258" stroke="#333" stroke-width="5"/>
  </g>
  <path d="M342,268 Q356,260 376,263 L392,266 Q388,275 372,275 Q350,275 342,268Z" fill="#2c2c2c"/>
  <circle cx="548" cy="258" r="5" fill="#111"/>

  <!-- crank, chainring, pedals -->
  <g transform="translate(400,365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="4 2"/>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-30" y2="0" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="2" width="22" height="5" rx="2" fill="#111"/>
        </g>
      </g>
      <g transform="translate(-30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="2" width="22" height="5" rx="2" fill="#111"/>
        </g>
      </g>
      <circle r="6" fill="#555"/>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#3a3128" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M372,262 L426,315 L370,365 L384,364">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M372,262 L426,315 L370,365 L384,364;
      M372,262 L434,305 L374,350 L388,349;
      M372,262 L442,290 L385,339 L399,338;
      M372,262 L446,276 L400,335 L414,334;
      M372,262 L447,271 L415,339 L429,338;
      M372,262 L445,278 L426,350 L440,349;
      M372,262 L441,291 L430,365 L444,364;
      M372,262 L433,305 L426,380 L440,379;
      M372,262 L424,317 L415,391 L429,390;
      M372,262 L417,322 L400,395 L414,394;
      M372,262 L416,323 L385,391 L399,390;
      M372,262 L419,320 L374,380 L388,379;
      M372,262 L426,315 L370,365 L384,364"/>
  </path>

  <!-- tail -->
  <path d="M352,230 L314,250 L322,260 L358,252Z" fill="#4a3a2c"/>

  <!-- body -->
  <ellipse cx="388" cy="236" rx="52" ry="32" fill="#7b6a58" transform="rotate(12 388 236)"/>
  <ellipse cx="398" cy="244" rx="34" ry="19" fill="#a89a85" transform="rotate(12 398 244)"/>

  <!-- neck -->
  <path d="M418,226 Q420,195 452,185" fill="none" stroke="#efe6c8" stroke-width="16" stroke-linecap="round"/>
  <path d="M410,222 Q412,190 446,176" fill="none" stroke="#5b3a24" stroke-width="5" stroke-linecap="round"/>

  <!-- head and bill -->
  <ellipse cx="462" cy="180" rx="15" ry="12" fill="#f6f0dc"/>
  <ellipse cx="459" cy="173" rx="11" ry="6" fill="#f3d36b" opacity="0.75"/>
  <path d="M472,188 Q505,224 546,200 L474,190 Z" fill="#6f6a58"/>
  <path d="M472,174 L548,196 Q553,199 546,201 L474,190 Z" fill="#8f9498"/>
  <circle cx="468" cy="176" r="3.5" fill="#fff"/>
  <circle cx="468.5" cy="176" r="2" fill="#111"/>

  <!-- wing reaching handlebar -->
  <path d="M378,212 Q440,222 508,240 Q514,246 506,251 Q440,256 380,250 Z" fill="#5d4a3a"/>
  <path d="M400,230 Q450,236 500,244" fill="none" stroke="#3f3226" stroke-width="2"/>

  <!-- near leg -->
  <path fill="none" stroke="#4a4036" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M372,262 L441,291 L430,365 L444,364">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M372,262 L441,291 L430,365 L444,364;
      M372,262 L433,305 L426,380 L440,379;
      M372,262 L424,317 L415,391 L429,390;
      M372,262 L417,322 L400,395 L414,394;
      M372,262 L416,323 L385,391 L399,390;
      M372,262 L419,320 L374,380 L388,379;
      M372,262 L426,315 L370,365 L384,364;
      M372,262 L434,305 L374,350 L388,349;
      M372,262 L442,290 L385,339 L399,338;
      M372,262 L446,276 L400,335 L414,334;
      M372,262 L447,271 L415,339 L429,338;
      M372,262 L445,278 L426,350 L440,349;
      M372,262 L441,291 L430,365 L444,364"/>
  </path>
  <circle cx="372" cy="262" r="6" fill="#4a4036"/>
</svg>