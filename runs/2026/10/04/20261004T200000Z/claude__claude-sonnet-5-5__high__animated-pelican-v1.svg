<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f7"/>
      <stop offset="1" stop-color="#eaf7fc"/>
    </linearGradient>
    <g id="wheelBody">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="66.5" fill="none" stroke="#b8b8b8" stroke-width="1.5"/>
      <g stroke="#9a9a9a" stroke-width="1">
        <line x1="-66" y1="0" x2="66" y2="0"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(22.5)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(45)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(67.5)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(90)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(112.5)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(135)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="6" fill="#555"/>
      <circle cx="0" cy="-60" r="3.5" fill="#e8742a"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="690" cy="80" r="38" fill="#ffe27a" opacity="0.9"/>
  <rect x="0" y="423" width="800" height="77" fill="#e6d6a4"/>
  <line x1="0" y1="423" x2="800" y2="423" stroke="#b9a66d" stroke-width="2"/>
  <line x1="0" y1="445" x2="800" y2="445" stroke="#c9b67d" stroke-width="4" stroke-dasharray="40 80">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="426" rx="230" ry="7" fill="#000" opacity="0.12"/>

  <!-- rear wheel -->
  <g transform="translate(230,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.9s" repeatCount="indefinite"/>
      <use href="#wheelBody"/>
      <circle r="9" fill="none" stroke="#777" stroke-width="3"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(570,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.9s" repeatCount="indefinite"/>
      <use href="#wheelBody"/>
    </g>
  </g>

  <!-- far leg (behind frame and body) -->
  <path fill="none" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M340 232 L401.2 291 L340 350">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
      M340 232 L401.2 291 L340 350;
      M340 232 L417.3 267.6 L351.7 321.7;
      M340 232 L424.8 237.8 L380 310;
      M340 232 L424.7 238.4 L408.3 321.7;
      M340 232 L418.3 265 L420 350;
      M340 232 L398.2 293.9 L408.3 378.3;
      M340 232 L383.4 305.1 L380 390;
      M340 232 L388.7 301.7 L351.7 378.3;
      M340 232 L401.2 291 L340 350"/>
  </path>

  <!-- chain -->
  <g stroke="#555" stroke-width="2" fill="none">
    <line x1="380" y1="334" x2="230" y2="341"/>
    <line x1="380" y1="366" x2="230" y2="359"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1f6f8b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="380" y1="350" x2="351" y2="252"/>
    <line x1="355" y1="268" x2="515" y2="244"/>
    <line x1="380" y1="350" x2="520" y2="258"/>
    <line x1="380" y1="350" x2="230" y2="350"/>
    <line x1="356" y1="272" x2="230" y2="350"/>
    <line x1="522" y1="258" x2="570" y2="350"/>
    <line x1="513" y1="238" x2="521" y2="262" stroke-width="9"/>
  </g>
  <circle cx="230" cy="350" r="5" fill="#444"/>
  <circle cx="570" cy="350" r="5" fill="#444"/>

  <!-- stem and handlebar -->
  <g fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="513" y1="238" x2="508" y2="208"/>
    <path d="M508 208 L530 205 Q546 205 546 222"/>
  </g>

  <!-- seat post and saddle -->
  <line x1="351" y1="252" x2="347" y2="246" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <path d="M316 246 Q338 237 363 243 Q368 248 360 251 Q338 254 316 252 Z" fill="#222"/>

  <!-- bottom bracket: cranks, chainring, pedals, feet -->
  <g transform="translate(380,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#888" stroke-width="3"/>
      <circle r="18" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="3 3"/>
      <line x1="-40" y1="0" x2="40" y2="0" stroke="#666" stroke-width="5" stroke-linecap="round"/>
      <circle r="6" fill="#444"/>
      <!-- pedal A (near foot) -->
      <g transform="translate(40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-1" width="20" height="4" rx="1.5" fill="#222"/>
          <path d="M-5 0 Q-5 -6 2 -6 L12 -3 Q17 -1 15 0 Z" fill="#3a3a3a"/>
        </g>
      </g>
      <!-- pedal B (far foot) -->
      <g transform="translate(-40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-1" width="20" height="4" rx="1.5" fill="#222"/>
          <path d="M-5 0 Q-5 -6 2 -6 L12 -3 Q17 -1 15 0 Z" fill="#2a2a2a"/>
        </g>
      </g>
    </g>
  </g>

  <!-- pelican body -->
  <path d="M272 200 L250 192 L254 232 L284 224 Z" fill="#5b4636"/>
  <ellipse cx="322" cy="208" rx="62" ry="36" transform="rotate(-12 322 208)" fill="#8c7355"/>
  <ellipse cx="345" cy="214" rx="34" ry="22" transform="rotate(-12 345 214)" fill="#a58d6c"/>

  <!-- wing reaching to handlebar -->
  <path d="M350 186 Q440 214 528 202 L532 210 Q440 236 346 206 Z" fill="#5b4636"/>
  <path d="M470 212 L530 204 L531 210 L474 222 Z" fill="#3b2d22"/>
  <circle cx="531" cy="206" r="6" fill="#3b2d22"/>

  <!-- neck and head -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.5 370 190;1.5 370 190;-1.5 370 190" dur="1.2s" repeatCount="indefinite"/>
    <path d="M362 192 C392 182 378 150 404 136" fill="none" stroke="#f2ede0" stroke-width="15" stroke-linecap="round"/>
    <path d="M356 184 C384 170 372 146 396 130" fill="none" stroke="#6b5440" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="410" cy="130" r="13" fill="#f7e9a8"/>
    <path d="M421 126 L498 149 Q505 152 500 156 L420 141 Z" fill="#b5a78a"/>
    <path d="M421 138 Q452 172 497 157 L420 141 Z" fill="#c9a77a"/>
    <path d="M494 148 Q505 150 502 157 L496 156 Z" fill="#d9822b"/>
    <circle cx="414" cy="126" r="3" fill="#222"/>
    <circle cx="415" cy="125" r="1" fill="#fff"/>
  </g>

  <!-- near leg (over body) -->
  <path fill="none" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M340 232 L418.3 265 L420 350">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
      M340 232 L418.3 265 L420 350;
      M340 232 L398.2 293.9 L408.3 378.3;
      M340 232 L383.4 305.1 L380 390;
      M340 232 L388.7 301.7 L351.7 378.3;
      M340 232 L401.2 291 L340 350;
      M340 232 L417.3 267.6 L351.7 321.7;
      M340 232 L424.8 237.8 L380 310;
      M340 232 L424.7 238.4 L408.3 321.7;
      M340 232 L418.3 265 L420 350"/>
  </path>
  <circle cx="340" cy="232" r="4" fill="#3a3a3a"/>
</svg>