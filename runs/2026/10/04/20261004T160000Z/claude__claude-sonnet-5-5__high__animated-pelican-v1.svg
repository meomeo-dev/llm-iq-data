<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6f5"/>
      <stop offset="1" stop-color="#f6f1dc"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="64" fill="none" stroke="#aeb4b8" stroke-width="2.5"/>
      <g stroke="#c9ced1" stroke-width="1.2">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(22.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(45)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(67.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(112.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(135)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(157.5)"/>
      </g>
      <rect x="-2.5" y="-68" width="5" height="9" fill="#d9342b"/>
      <circle r="7" fill="#555" stroke="#999" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <rect y="420" width="800" height="60" fill="#d8c8a0"/>
  <line x1="0" y1="421" x2="800" y2="421" stroke="#8a7a58" stroke-width="3"/>
  <line x1="0" y1="445" x2="800" y2="445" stroke="#b7a57c" stroke-width="4" stroke-dasharray="60 60">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.3s" repeatCount="indefinite"/>
  </line>

  <!-- wheels -->
  <g transform="translate(250 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="9" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="3 2"/>
    </g>
  </g>
  <g transform="translate(560 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far crank and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 385 360" to="540 385 360" dur="1.2s" repeatCount="indefinite"/>
    <line x1="385" y1="360" x2="420" y2="360" stroke="#555" stroke-width="7" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 420 360" to="-360 420 360" dur="1.2s" repeatCount="indefinite"/>
      <rect x="410" y="357.5" width="26" height="6" rx="2" fill="#222"/>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2a2522" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M348 245 L408 297.9 L350 360 L364 362">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M348 245 L408 297.9 L350 360 L364 362;
      M348 245 L417.3 285 L354.7 342.5 L368.7 344.5;
      M348 245 L425 267 L367.5 329.7 L381.5 331.7;
      M348 245 L427.7 251.6 L385 325 L399 327;
      M348 245 L427.9 248.6 L402.5 329.7 L416.5 331.7;
      M348 245 L426.8 258.2 L415.3 342.5 L429.3 344.5;
      M348 245 L422.2 275 L420 360 L434 362;
      M348 245 L412.4 292.5 L415.3 377.5 L429.3 379.5;
      M348 245 L400.6 305.2 L402.5 390.3 L416.5 392.3;
      M348 245 L393.9 310.5 L385 395 L399 397;
      M348 245 L394.9 309.9 L367.5 390.3 L381.5 392.3;
      M348 245 L400.2 305.6 L354.7 377.5 L368.7 379.5;
      M348 245 L408 297.9 L350 360 L364 362"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#1d8fa3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="350" x2="385" y2="360"/>
    <line x1="250" y1="350" x2="345" y2="268"/>
    <line x1="385" y1="360" x2="343" y2="262"/>
    <line x1="343" y1="266" x2="507" y2="252"/>
    <line x1="385" y1="360" x2="511" y2="264"/>
  </g>
  <line x1="505" y1="244" x2="513" y2="268" stroke="#157080" stroke-width="9" stroke-linecap="round"/>
  <line x1="513" y1="268" x2="560" y2="350" stroke="#9aa3a8" stroke-width="6" stroke-linecap="round"/>
  <line x1="505" y1="244" x2="500" y2="226" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <path d="M490 227 L512 224 Q530 224 530 242" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="343" y1="264" x2="341" y2="256" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <path d="M320 258 Q345 248 376 254 Q372 263 345 263 Q330 265 320 258 Z" fill="#2b2b2b"/>

  <!-- chain -->
  <g stroke="#555" stroke-width="2">
    <line x1="385" y1="342" x2="250" y2="342"/>
    <line x1="385" y1="378" x2="250" y2="358"/>
  </g>

  <!-- chainring and near crank -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 360" to="360 385 360" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="385" cy="360" r="18" fill="none" stroke="#666" stroke-width="4" stroke-dasharray="4 2"/>
    <circle cx="385" cy="360" r="6" fill="#444"/>
    <line x1="385" y1="360" x2="420" y2="360" stroke="#777" stroke-width="7" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 420 360" to="-360 420 360" dur="1.2s" repeatCount="indefinite"/>
      <rect x="410" y="357.5" width="26" height="6" rx="2" fill="#111"/>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#3d3631" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M348 245 L422.2 275 L420 360 L434 362">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M348 245 L422.2 275 L420 360 L434 362;
      M348 245 L412.4 292.5 L415.3 377.5 L429.3 379.5;
      M348 245 L400.6 305.2 L402.5 390.3 L416.5 392.3;
      M348 245 L393.9 310.5 L385 395 L399 397;
      M348 245 L394.9 309.9 L367.5 390.3 L381.5 392.3;
      M348 245 L400.2 305.6 L354.7 377.5 L368.7 379.5;
      M348 245 L408 297.9 L350 360 L364 362;
      M348 245 L417.3 285 L354.7 342.5 L368.7 344.5;
      M348 245 L425 267 L367.5 329.7 L381.5 331.7;
      M348 245 L427.7 251.6 L385 325 L399 327;
      M348 245 L427.9 248.6 L402.5 329.7 L416.5 331.7;
      M348 245 L426.8 258.2 L415.3 342.5 L429.3 344.5;
      M348 245 L422.2 275 L420 360 L434 362"/>
  </path>

  <!-- pelican: tail, body, wing -->
  <path d="M308 226 L258 242 L266 255 L314 242 Z" fill="#4a3d32"/>
  <ellipse cx="352" cy="222" rx="54" ry="32" transform="rotate(-12 352 222)" fill="#7b6a5a"/>
  <path d="M312 218 Q350 188 398 210 Q362 246 322 240 Z" fill="#5c4d40"/>
  <path d="M330 222 Q350 208 380 216" fill="none" stroke="#7b6a5a" stroke-width="2"/>
  <path d="M340 232 Q360 222 388 224" fill="none" stroke="#7b6a5a" stroke-width="2"/>

  <!-- neck and head -->
  <path d="M392 210 C420 195 385 170 415 148" fill="none" stroke="#f4f0e6" stroke-width="22" stroke-linecap="round"/>
  <path d="M382 206 C405 191 372 169 402 146" fill="none" stroke="#4a3a2e" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="428" cy="140" rx="21" ry="15" fill="#f6f2e8"/>
  <path d="M410 132 Q428 118 446 130 Q430 128 412 138 Z" fill="#f0dc7c"/>

  <!-- bill and pouch -->
  <path d="M444 148 Q482 186 520 168 L446 138 Z" fill="#8d7f6a"/>
  <path d="M440 131 L520 160 Q530 164 521 169 L440 147 Z" fill="#a3a698"/>
  <path d="M514 162 Q530 164 521 170 L512 167 Z" fill="#d9772b"/>
  <circle cx="437" cy="135" r="3.2" fill="#111"/>
  <circle cx="438" cy="134" r="1" fill="#fff"/>

  <!-- arm reaching handlebar -->
  <path d="M382 214 Q440 238 512 226" fill="none" stroke="#5c4d40" stroke-width="11" stroke-linecap="round"/>
  <circle cx="512" cy="225" r="6" fill="#3d3631"/>
</svg>