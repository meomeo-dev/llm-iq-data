<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd6f2"/>
      <stop offset="1" stop-color="#e8f6fc"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#1f1f1f" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#9aa3a8" stroke-width="2"/>
      <g stroke="#b8bec2" stroke-width="1.2">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(20)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(40)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(60)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(80)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(100)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(120)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(140)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(160)"/>
      </g>
      <circle cx="0" cy="-60" r="3" fill="#d33"/>
      <circle r="7" fill="#555" stroke="#222" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="34" fill="#ffe27a" opacity="0.9"/>
  <rect x="0" y="420" width="800" height="60" fill="#c9b98a"/>
  <line x1="0" y1="421" x2="800" y2="421" stroke="#6e5f3c" stroke-width="3" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="280" dur="0.96s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="424" rx="230" ry="8" fill="#000" opacity="0.18"/>

  <!-- rear wheel -->
  <g transform="translate(240,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far crank, pedal and leg -->
  <path d="M335,250 L398.4,284.2 L360,360" fill="none" stroke="#2f2f2f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M335,250 L398.4,284.2 L360,360;
      M335,250 L404.2,270.1 L364,345;
      M335,250 L406.8,255.2 L375,334;
      M335,250 L406.9,246.7 L390,330;
      M335,250 L407,249.1 L405,334;
      M335,250 L406.3,260.5 L416,345;
      M335,250 L401.8,277 L420,360;
      M335,250 L392.5,293.3 L416,375;
      M335,250 L382.7,304 L405,386;
      M335,250 L380.9,305.5 L390,390;
      M335,250 L385.2,301.6 L375,386;
      M335,250 L391.5,294.6 L364,375;
      M335,250 L398.4,284.2 L360,360"/>
  </path>
  <g transform="translate(390,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="1.2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#1d1d1d" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#222"/>
          <ellipse cx="4" cy="-5" rx="12" ry="5" fill="#c9741f"/>
          <path d="M10,-6 L17,-3 M9,-3 L16,0" stroke="#a45a14" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(560,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="360" x2="342" y2="262"/>
    <line x1="342" y1="264" x2="506" y2="252"/>
    <line x1="390" y1="360" x2="511" y2="268"/>
    <line x1="503" y1="240" x2="514" y2="272"/>
    <line x1="240" y1="350" x2="390" y2="360"/>
    <line x1="240" y1="350" x2="342" y2="264"/>
  </g>
  <line x1="514" y1="272" x2="560" y2="350" stroke="#7d7d7d" stroke-width="6" stroke-linecap="round"/>
  <line x1="342" y1="262" x2="337" y2="254" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M310,257 Q335,247 360,257 Q348,265 314,263 Z" fill="#2a2a2a"/>
  <!-- stem and handlebar -->
  <line x1="503" y1="240" x2="508" y2="222" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M498,219 L520,219 Q537,222 534,238" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- chain -->
  <g stroke="#333" stroke-width="2" stroke-dasharray="3 2">
    <line x1="390" y1="340" x2="240" y2="341"/>
    <line x1="390" y1="380" x2="240" y2="359"/>
  </g>
  <circle cx="240" cy="350" r="9" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="3 2"/>
  <circle cx="390" cy="360" r="20" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="4 2"/>
  <circle cx="390" cy="360" r="5" fill="#222"/>

  <!-- near leg -->
  <path d="M335,250 L401.8,277 L420,360" fill="none" stroke="#4d4d4d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M335,250 L401.8,277 L420,360;
      M335,250 L392.5,293.3 L416,375;
      M335,250 L382.7,304 L405,386;
      M335,250 L380.9,305.5 L390,390;
      M335,250 L385.2,301.6 L375,386;
      M335,250 L391.5,294.6 L364,375;
      M335,250 L398.4,284.2 L360,360;
      M335,250 L404.2,270.1 L364,345;
      M335,250 L406.8,255.2 L375,334;
      M335,250 L406.9,246.7 L390,330;
      M335,250 L407,249.1 L405,334;
      M335,250 L406.3,260.5 L416,345;
      M335,250 L401.8,277 L420,360"/>
  </path>
  <g transform="translate(390,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#111" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#222"/>
          <ellipse cx="4" cy="-5" rx="12" ry="5" fill="#e08a2a"/>
          <path d="M10,-6 L17,-3 M9,-3 L16,0" stroke="#b86a18" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- pelican body -->
  <polygon points="272,218 226,244 272,250" fill="#4a3a2d"/>
  <ellipse cx="325" cy="212" rx="64" ry="39" transform="rotate(-12 325 212)" fill="#6b5a4a"/>
  <ellipse cx="335" cy="226" rx="42" ry="18" transform="rotate(-8 335 226)" fill="#8a7660"/>
  <path d="M280,205 Q320,175 362,200 Q330,232 284,222 Z" fill="#54443a"/>

  <!-- neck and head -->
  <path d="M366,205 C398,190 384,152 420,140" fill="none" stroke="#f4f0e0" stroke-width="22" stroke-linecap="round"/>
  <path d="M356,196 C386,176 374,146 408,128" fill="none" stroke="#4a3a2d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="425" cy="138" r="17" fill="#f4f0e0"/>
  <path d="M410,128 Q422,114 438,126 Q424,134 410,128 Z" fill="#f2d35b"/>
  <path d="M438,144 Q480,194 530,161 L440,148 Z" fill="#c9a96a"/>
  <path d="M436,127 L530,157 Q534,160 528,162 L438,144 Z" fill="#9a9283"/>
  <path d="M526,156 Q536,158 532,166 Q529,162 526,162 Z" fill="#6f6a5f"/>
  <circle cx="432" cy="134" r="3" fill="#111"/>
  <circle cx="433" cy="133" r="1" fill="#fff"/>

  <!-- wing reaching handlebar -->
  <path d="M352,200 Q430,238 514,222" fill="none" stroke="#5c4737" stroke-width="15" stroke-linecap="round"/>
  <path d="M356,204 Q430,240 510,226" fill="none" stroke="#7a6350" stroke-width="4" stroke-linecap="round"/>
  <circle cx="517" cy="222" r="8" fill="#4a3a2d"/>
</svg>