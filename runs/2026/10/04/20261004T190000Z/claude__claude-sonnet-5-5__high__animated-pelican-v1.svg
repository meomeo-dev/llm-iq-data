<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#fdf1d0"/>
    </linearGradient>
    <g id="wheel">
      <circle r="77" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#c4c4c4" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-68" r="3" fill="#d8402b"/>
      <circle r="7" fill="#555" stroke="#222" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="660" cy="80" r="38" fill="#ffe27a" opacity="0.9"/>
  <rect y="421" width="800" height="79" fill="#c9b27c"/>
  <line x1="-100" y1="448" x2="900" y2="448" stroke="#9c8656" stroke-width="5" stroke-dasharray="30 30">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="424" rx="270" ry="8" fill="#000" opacity="0.18"/>

  <!-- far leg -->
  <path d="M338,222 L413,271.7 L345,345" fill="none" stroke="#2f2924" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M338,222 L413,271.7 L345,345;
              M338,222 L421.8,255 L350.4,325;
              M338,222 L427.4,232.2 L365,310.4;
              M338,222 L427.7,214.6 L385,305;
              M338,222 L427.5,212.9 L405,310.4;
              M338,222 L427.9,225.4 L419.6,325;
              M338,222 L425,245 L425,345;
              M338,222 L417.1,265 L419.6,365;
              M338,222 L407.1,279.7 L405,379.6;
              M338,222 L401,286.3 L385,385;
              M338,222 L401,286.3 L365,379.6;
              M338,222 L405.5,281.6 L350.4,365;
              M338,222 L413,271.7 L345,345"/>
  </path>

  <!-- far crank and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 345" to="360 385 345" dur="2s" repeatCount="indefinite"/>
    <line x1="385" y1="345" x2="345" y2="345" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(345,345)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-12" y="3" width="24" height="5" rx="2" fill="#333"/>
        <path d="M-8,-5 L14,-2 L8,0 L15,3 L-8,3 Z" fill="#b8741f"/>
      </g>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M385,345 L352,238"/>
    <path d="M352,240 L516,236"/>
    <path d="M385,345 L524,258"/>
    <path d="M385,345 L240,340"/>
    <path d="M352,242 L240,340"/>
    <path d="M526,262 L560,340"/>
    <path d="M516,226 L526,262" stroke-width="9"/>
    <path d="M352,238 L344,214" stroke="#444" stroke-width="5"/>
    <path d="M516,226 L510,206" stroke="#444" stroke-width="5"/>
    <path d="M498,204 L530,204 Q548,204 548,222" stroke="#333" stroke-width="5"/>
  </g>
  <circle cx="548" cy="222" r="4" fill="#222"/>

  <!-- wheels -->
  <g transform="translate(240,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
    </g>
  </g>
  <g transform="translate(560,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
    </g>
  </g>
  <circle cx="240" cy="340" r="10" fill="none" stroke="#444" stroke-width="3"/>

  <!-- chain -->
  <path d="M385,327 L240,331 M385,363 L240,349" stroke="#333" stroke-width="2" fill="none"/>

  <!-- near crank, chainring and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 345" to="360 385 345" dur="2s" repeatCount="indefinite"/>
    <circle cx="385" cy="345" r="18" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="4 3"/>
    <line x1="385" y1="345" x2="425" y2="345" stroke="#222" stroke-width="6" stroke-linecap="round"/>
    <circle cx="385" cy="345" r="6" fill="#888" stroke="#222" stroke-width="2"/>
    <g transform="translate(425,345)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-12" y="3" width="24" height="5" rx="2" fill="#222"/>
        <path d="M-8,-5 L14,-2 L8,0 L15,3 L-8,3 Z" fill="#d98a2b"/>
      </g>
    </g>
  </g>

  <!-- saddle -->
  <path d="M315,216 Q330,207 355,211 L380,214 Q383,223 366,224 L325,223 Z" fill="#2b2b2b"/>

  <!-- near leg -->
  <path d="M338,222 L425,245 L425,345" fill="none" stroke="#4a4036" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M338,222 L425,245 L425,345;
              M338,222 L417.1,265 L419.6,365;
              M338,222 L407.1,279.7 L405,379.6;
              M338,222 L401,286.3 L385,385;
              M338,222 L401,286.3 L365,379.6;
              M338,222 L405.5,281.6 L350.4,365;
              M338,222 L413,271.7 L345,345;
              M338,222 L421.8,255 L350.4,325;
              M338,222 L427.4,232.2 L365,310.4;
              M338,222 L427.7,214.6 L385,305;
              M338,222 L427.5,212.9 L405,310.4;
              M338,222 L427.9,225.4 L419.6,325;
              M338,222 L425,245 L425,345"/>
  </path>

  <!-- tail -->
  <path d="M285,178 L232,196 L238,208 L240,200 L248,210 L292,200 Z" fill="#4b443b"/>

  <!-- body -->
  <ellipse cx="335" cy="180" rx="64" ry="40" fill="#7d7468" transform="rotate(-12 335 180)"/>
  <ellipse cx="345" cy="195" rx="46" ry="22" fill="#a39a8c" transform="rotate(-12 345 195)"/>
  <path d="M280,170 Q330,128 395,150 Q340,150 280,170 Z" fill="#5e564c"/>

  <!-- neck -->
  <path d="M378,165 C415,145 372,115 420,92" fill="none" stroke="#f4f0e6" stroke-width="22" stroke-linecap="round"/>
  <path d="M370,160 C405,138 364,110 410,86" fill="none" stroke="#6b4a2b" stroke-width="6" stroke-linecap="round"/>

  <!-- wing reaching the handlebar -->
  <path d="M345,158 C395,150 465,170 534,201 L526,211 C470,196 420,196 352,200 Z" fill="#5e564c"/>
  <path d="M440,178 C480,184 510,196 534,204 L526,211 C490,200 460,194 430,192 Z" fill="#8b8173"/>
  <circle cx="532" cy="205" r="6" fill="#4b443b"/>

  <!-- head and bill -->
  <ellipse cx="434" cy="88" rx="22" ry="16" fill="#f7f3ea"/>
  <ellipse cx="432" cy="80" rx="17" ry="8" fill="#f3dc6e" opacity="0.85"/>
  <path d="M452,97 Q498,134 540,111 L452,98 Z" fill="#c9b48a" stroke="#8a7a5a" stroke-width="1.5"/>
  <path d="M450,82 L544,104 Q550,108 543,111 L452,98 Z" fill="#a6a090"/>
  <path d="M536,102 L546,104 Q552,108 546,113 L541,110 Z" fill="#c0562b"/>
  <circle cx="444" cy="84" r="3.5" fill="#111"/>
  <circle cx="445" cy="83" r="1" fill="#fff"/>
</svg>