<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec9ee"/>
      <stop offset="1" stop-color="#e6f4fb"/>
    </linearGradient>
    <g id="spokes" stroke="#b8b8b8" stroke-width="1.2">
      <line x1="-72" y1="0" x2="72" y2="0"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(15)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(30)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(60)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(75)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(105)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(120)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(150)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(165)"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#fff3b0" opacity="0.9"/>
  <rect x="0" y="430" width="800" height="70" fill="#d9c7a0"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#8a7a60" stroke-width="3"/>
  <line x1="-100" y1="458" x2="900" y2="458" stroke="#fffaf0" stroke-width="5" stroke-dasharray="50 50">
    <animate attributeName="stroke-dashoffset" from="0" to="-500" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="432" rx="230" ry="9" fill="#000" opacity="0.15"/>

  <!-- far leg -->
  <path fill="none" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M355,235 L434.9,230.6 L390,320">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
      M355,235 L434.9,230.6 L390,320;
      M355,235 L434.8,228.5 L410,325.4;
      M355,235 L434.8,240.5 L424.6,340;
      M355,235 L430.9,260 L430,360;
      M355,235 L421.1,280 L424.6,380;
      M355,235 L408.3,294.6 L410,394.6;
      M355,235 L400.8,300.6 L390,400;
      M355,235 L401.9,299.8 L370,394.6;
      M355,235 L408,294.9 L355.4,380;
      M355,235 L416.9,285.7 L350,360;
      M355,235 L426.9,270.1 L355.4,340;
      M355,235 L433.9,248.4 L370,325.4;
      M355,235 L434.9,230.6 L390,320"/>
  </path>

  <!-- rear wheel -->
  <g transform="translate(240,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <circle r="80" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="73" fill="none" stroke="#c8c8c8" stroke-width="2"/>
      <use href="#spokes"/>
      <circle r="7" fill="#555"/>
      <circle cx="0" cy="-66" r="3.5" fill="#f39c12"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(560,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <circle r="80" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="73" fill="none" stroke="#c8c8c8" stroke-width="2"/>
      <use href="#spokes"/>
      <circle r="7" fill="#555"/>
      <circle cx="0" cy="-66" r="3.5" fill="#f39c12"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#555" stroke-width="2" fill="none">
    <line x1="390" y1="340" x2="240" y2="342"/>
    <line x1="390" y1="380" x2="240" y2="358"/>
    <circle cx="240" cy="350" r="8"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="240" y1="350" x2="390" y2="360"/>
    <line x1="240" y1="350" x2="355" y2="250"/>
    <line x1="390" y1="360" x2="352" y2="240"/>
    <line x1="355" y1="252" x2="512" y2="248"/>
    <line x1="390" y1="360" x2="517" y2="268"/>
    <line x1="518" y1="272" x2="560" y2="350"/>
    <line x1="510" y1="238" x2="518" y2="274" stroke-width="8"/>
  </g>
  <!-- seatpost and saddle -->
  <line x1="353" y1="246" x2="351" y2="234" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M330,230 Q345,225 374,229 L374,234 Q350,237 330,234 Z" fill="#2a2a2a"/>
  <!-- stem and handlebar -->
  <g fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round">
    <line x1="510" y1="238" x2="504" y2="220" stroke-width="5"/>
    <path d="M498,221 L520,217 Q536,217 538,231" stroke-width="5"/>
    <line x1="514" y1="218" x2="524" y2="216.5" stroke="#111" stroke-width="8"/>
  </g>

  <!-- crank, chainring, pedals -->
  <g transform="translate(390,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.6s" repeatCount="indefinite"/>
      <circle r="20" fill="none" stroke="#666" stroke-width="3"/>
      <circle r="23" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="4 4"/>
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#444" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(0,-40)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-10" y="-1" width="20" height="5" rx="2" fill="#222"/>
          <ellipse cx="4" cy="-3" rx="11" ry="3.5" fill="#e08a2c"/>
        </g>
      </g>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <circle r="6" fill="#222"/>
      <g transform="translate(0,40)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-10" y="-1" width="20" height="5" rx="2" fill="#222"/>
          <ellipse cx="4" cy="-3" rx="11" ry="3.5" fill="#f0952f"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M355,235 L400.8,300.6 L390,400">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
      M355,235 L400.8,300.6 L390,400;
      M355,235 L401.9,299.8 L370,394.6;
      M355,235 L408,294.9 L355.4,380;
      M355,235 L416.9,285.7 L350,360;
      M355,235 L426.9,270.1 L355.4,340;
      M355,235 L433.9,248.4 L370,325.4;
      M355,235 L434.9,230.6 L390,320;
      M355,235 L434.8,228.5 L410,325.4;
      M355,235 L434.8,240.5 L424.6,340;
      M355,235 L430.9,260 L430,360;
      M355,235 L421.1,280 L424.6,380;
      M355,235 L408.3,294.6 L410,394.6;
      M355,235 L400.8,300.6 L390,400"/>
  </path>

  <!-- pelican: tail, body -->
  <path d="M305,198 L252,222 L262,234 L310,222 Z" fill="#4a3a2c"/>
  <ellipse cx="345" cy="190" rx="52" ry="40" transform="rotate(-15 345 190)" fill="#7d6c5a"/>
  <ellipse cx="358" cy="224" rx="17" ry="12" fill="#6f5f4e"/>
  <ellipse cx="335" cy="200" rx="30" ry="18" transform="rotate(-15 335 200)" fill="#8d7c69"/>

  <!-- neck, head, bill -->
  <path d="M375,168 C402,152 386,128 410,116" fill="none" stroke="#f4f1ea" stroke-width="22" stroke-linecap="round"/>
  <path d="M367,162 C386,142 374,122 398,108" fill="none" stroke="#5b3a22" stroke-width="6" stroke-linecap="round"/>
  <circle cx="415" cy="108" r="16" fill="#f7f4ee"/>
  <ellipse cx="413" cy="98" rx="11" ry="6" fill="#f0d36e"/>
  <circle cx="422" cy="106" r="3" fill="#111"/>
  <path d="M430,114 Q470,152 506,130 L428,117 Z" fill="#c9a66b"/>
  <path d="M428,100 L506,124 Q511,127 506,130 L428,117 Z" fill="#8c8a80"/>
  <path d="M498,123 L508,126 Q511,128 506,130 L496,127 Z" fill="#d9772b"/>

  <!-- wing reaching handlebar -->
  <path d="M325,168 Q385,158 430,185 Q475,205 518,214 L517,222 Q465,224 420,212 Q365,205 322,196 Z" fill="#5a4a3a"/>
  <path d="M430,190 Q475,208 512,216" fill="none" stroke="#7d6c5a" stroke-width="2"/>
</svg>