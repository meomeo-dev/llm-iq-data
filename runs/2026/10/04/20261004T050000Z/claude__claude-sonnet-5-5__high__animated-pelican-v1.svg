<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe27a"/>
  <path d="M0,380 Q120,310 240,380 T480,380 T720,370 T800,380 L800,436 L0,436 Z" fill="#a7cf9a"/>
  <rect x="0" y="436" width="800" height="64" fill="#d9c9a0"/>
  <line x1="0" y1="448" x2="800" y2="448" stroke="#8a7a55" stroke-width="3" stroke-dasharray="60 60">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.48s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="438" rx="190" ry="6" fill="#000" opacity="0.15"/>

  <!-- rear wheel -->
  <g transform="translate(240 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <circle r="80" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="74" fill="none" stroke="#b9bec4" stroke-width="2"/>
      <g stroke="#9aa0a6" stroke-width="1.2">
        <line x1="-74" y1="0" x2="74" y2="0"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(22.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(45)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(67.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(90)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(112.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(135)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-69" r="3.5" fill="#e53935"/>
      <circle r="7" fill="#555"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(560 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <circle r="80" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="74" fill="none" stroke="#b9bec4" stroke-width="2"/>
      <g stroke="#9aa0a6" stroke-width="1.2">
        <line x1="-74" y1="0" x2="74" y2="0"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(22.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(45)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(67.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(90)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(112.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(135)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-69" r="3.5" fill="#e53935"/>
      <circle r="7" fill="#555"/>
    </g>
  </g>

  <!-- far leg (behind body) -->
  <path d="M345,235 L437.6,267 L435,365" fill="none" stroke="#3f342b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M345,235 L442.9,239.5 L395,325;M345,235 L443,236.5 L415,330.4;M345,235 L442.1,247.8 L429.6,345;M345,235 L437.6,267 L435,365;M345,235 L428.1,287 L429.6,385;M345,235 L416.8,301.7 L415,399.6;M345,235 L410.2,308.2 L395,405;M345,235 L410.3,308.1 L375,399.6;M345,235 L415,303.6 L360.4,385;M345,235 L423,294.4 L355,365;M345,235 L432.6,278.8 L360.4,345;M345,235 L440.4,257.4 L375,330.4;M345,235 L442.9,239.5 L395,325"/>
  </path>

  <!-- chain -->
  <path d="M395,349 L240,343 M395,381 L240,357" stroke="#444" stroke-width="2" stroke-dasharray="3 2" fill="none"/>
  <circle cx="240" cy="350" r="7" fill="none" stroke="#444" stroke-width="2"/>

  <!-- frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240,350 L395,365"/>
    <path d="M240,350 L336,252"/>
    <path d="M395,365 L336,252"/>
    <path d="M336,252 L522,246"/>
    <path d="M395,365 L528,265"/>
    <path d="M520,243 L528,266"/>
    <path d="M528,266 L560,350"/>
  </g>
  <path d="M336,252 L330,232" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <path d="M520,243 L514,222" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <path d="M510,222 L540,218 Q557,218 557,238" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="395" cy="365" r="8" fill="#444"/>

  <!-- pelican tail and body -->
  <path d="M275,205 L222,232 L246,246 L282,232 Z" fill="#4a3f36"/>
  <ellipse cx="335" cy="198" rx="80" ry="44" transform="rotate(-10 335 198)" fill="#7d6b5a"/>
  <ellipse cx="358" cy="216" rx="50" ry="20" transform="rotate(-10 358 216)" fill="#a39379" opacity="0.8"/>

  <!-- neck and head -->
  <path d="M385,182 C420,180 395,137 428,128" fill="none" stroke="#f2ecd8" stroke-width="24" stroke-linecap="round"/>
  <path d="M380,168 C406,154 390,130 414,116" fill="none" stroke="#6b4a2f" stroke-width="7" stroke-linecap="round"/>
  <circle cx="440" cy="118" r="19" fill="#f6efd0"/>
  <ellipse cx="436" cy="104" rx="12" ry="7" fill="#e8c55a"/>
  <path d="M456,126 L565,144 Q515,174 462,138 Z" fill="#c7b690"/>
  <path d="M456,110 L566,138 Q571,141 565,145 L456,127 Z" fill="#8c8576"/>
  <circle cx="447" cy="114" r="3.5" fill="#111"/>
  <circle cx="448" cy="113" r="1" fill="#fff"/>

  <!-- wing reaching handlebar -->
  <path d="M360,182 C420,175 480,200 532,220" fill="none" stroke="#5b4b3e" stroke-width="16" stroke-linecap="round"/>
  <path d="M365,184 C420,178 478,202 528,220" fill="none" stroke="#86745f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="535" cy="220" r="6" fill="#3a2f27"/>

  <!-- saddle -->
  <path d="M310,232 Q335,222 360,228 L370,234 Q340,240 310,237 Z" fill="#4a2f1f"/>

  <!-- near leg -->
  <path d="M345,235 L437.6,267 L435,365" fill="none" stroke="#5a4a3c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="M345,235 L437.6,267 L435,365;M345,235 L428.1,287 L429.6,385;M345,235 L416.8,301.7 L415,399.6;M345,235 L410.2,308.2 L395,405;M345,235 L410.3,308.1 L375,399.6;M345,235 L415,303.6 L360.4,385;M345,235 L423,294.4 L355,365;M345,235 L432.6,278.8 L360.4,345;M345,235 L440.4,257.4 L375,330.4;M345,235 L442.9,239.5 L395,325;M345,235 L443,236.5 L415,330.4;M345,235 L442.1,247.8 L429.6,345;M345,235 L437.6,267 L435,365"/>
  </path>

  <!-- crank, chainring, pedals and feet -->
  <g transform="translate(395 365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <circle r="17" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="4 2"/>
      <line x1="0" y1="0" x2="-40" y2="0" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <circle r="6" fill="#777"/>
      <g transform="translate(-40 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="2s" repeatCount="indefinite"/>
          <rect x="-9" y="-1" width="18" height="5" rx="1.5" fill="#222"/>
          <path d="M-4,-4 Q8,-8 18,2 L16,4 L-4,3 Z" fill="#b8691f"/>
        </g>
      </g>
      <g transform="translate(40 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="2s" repeatCount="indefinite"/>
          <rect x="-9" y="-1" width="18" height="5" rx="1.5" fill="#222"/>
          <path d="M-4,-4 Q8,-8 18,2 L16,4 L-4,3 Z" fill="#e0872e"/>
        </g>
      </g>
    </g>
  </g>
</svg>