<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="40" fill="#ffe27a"/>
  <rect x="0" y="500" width="800" height="100" fill="#cdb98a"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#8a7a52" stroke-width="3"/>
  <ellipse cx="400" cy="502" rx="230" ry="9" fill="#000" opacity="0.15"/>

  <g stroke="#8a7a52" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="1.2s" repeatCount="indefinite"/>
    <line x1="0" y1="540" x2="40" y2="540"/>
    <line x1="120" y1="540" x2="160" y2="540"/>
    <line x1="240" y1="540" x2="280" y2="540"/>
    <line x1="360" y1="540" x2="400" y2="540"/>
    <line x1="480" y1="540" x2="520" y2="540"/>
    <line x1="600" y1="540" x2="640" y2="540"/>
    <line x1="720" y1="540" x2="760" y2="540"/>
    <line x1="840" y1="540" x2="880" y2="540"/>
    <line x1="60" y1="565" x2="90" y2="565"/>
    <line x1="180" y1="565" x2="210" y2="565"/>
    <line x1="300" y1="565" x2="330" y2="565"/>
    <line x1="420" y1="565" x2="450" y2="565"/>
    <line x1="540" y1="565" x2="570" y2="565"/>
    <line x1="660" y1="565" x2="690" y2="565"/>
    <line x1="780" y1="565" x2="810" y2="565"/>
  </g>

  <!-- Rear wheel -->
  <g transform="translate(240,420)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="77" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#999" stroke-width="2"/>
      <g stroke="#777" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="9" fill="#555" stroke="#333" stroke-width="2"/>
      <circle cx="72" cy="0" r="3" fill="#d33"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g transform="translate(560,420)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="77" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#999" stroke-width="2"/>
      <g stroke="#777" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="9" fill="#555" stroke="#333" stroke-width="2"/>
      <circle cx="72" cy="0" r="3" fill="#d33"/>
    </g>
  </g>

  <!-- Far side crank and pedal (behind frame) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 390 430" to="540 390 430" dur="2s" repeatCount="indefinite"/>
    <line x1="390" y1="430" x2="425" y2="430" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(425,430)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="0" width="20" height="5" rx="2" fill="#333"/>
        <polygon points="-5,-6 4,-6 17,0 -8,1" fill="#c77a1c" stroke="#8a520f" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- Far leg -->
  <path fill="none" stroke="#b86a1c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M355,305 L416,364 L355,430">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M355,305 L416,364 L355,430;M355,305 L426,352 L360,413;M355,305 L435,335 L373,400;M355,305 L439,319 L390,395;M355,305 L439,316 L408,400;M355,305 L438,324 L420,413;M355,305 L432,340 L425,430;M355,305 L422,358 L420,448;M355,305 L409,370 L408,460;M355,305 L402,376 L390,465;M355,305 L403,376 L373,460;M355,305 L408,372 L360,448;M355,305 L416,364 L355,430"/>
  </path>

  <!-- Frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="430" x2="354" y2="305"/>
    <line x1="354" y1="318" x2="508" y2="318"/>
    <line x1="390" y1="430" x2="514" y2="338"/>
    <line x1="240" y1="420" x2="390" y2="430"/>
    <line x1="240" y1="420" x2="354" y2="318"/>
    <line x1="508" y1="305" x2="516" y2="345"/>
    <line x1="516" y1="345" x2="560" y2="420"/>
  </g>
  <line x1="354" y1="305" x2="352" y2="294" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <line x1="508" y1="305" x2="503" y2="289" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M498,290 Q530,279 545,291 Q549,302 541,306" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <circle cx="390" cy="430" r="7" fill="#444"/>

  <!-- Chain -->
  <g stroke="#333" stroke-width="2">
    <line x1="390" y1="414" x2="240" y2="412"/>
    <line x1="390" y1="446" x2="240" y2="428"/>
  </g>
  <circle cx="240" cy="420" r="8" fill="none" stroke="#333" stroke-width="3"/>

  <!-- Saddle -->
  <path d="M324,297 Q352,288 382,296 Q386,304 372,305 L336,304 Q322,303 324,297 Z" fill="#2b2b2b"/>

  <!-- Near leg -->
  <path fill="none" stroke="#e08a2e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M355,305 L432,340 L425,430">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M355,305 L432,340 L425,430;M355,305 L422,358 L420,448;M355,305 L409,370 L408,460;M355,305 L402,376 L390,465;M355,305 L403,376 L373,460;M355,305 L408,372 L360,448;M355,305 L416,364 L355,430;M355,305 L426,352 L360,413;M355,305 L435,335 L373,400;M355,305 L439,319 L390,395;M355,305 L439,316 L408,400;M355,305 L438,324 L420,413;M355,305 L432,340 L425,430"/>
  </path>

  <!-- Near crank, chainring and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 430" to="360 390 430" dur="2s" repeatCount="indefinite"/>
    <circle cx="390" cy="430" r="16" fill="none" stroke="#444" stroke-width="3"/>
    <circle cx="390" cy="430" r="16" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="390" y1="430" x2="425" y2="430" stroke="#666" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(425,430)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="0" width="20" height="5" rx="2" fill="#333"/>
        <polygon points="-5,-6 4,-6 17,0 -8,1" fill="#e89a3c" stroke="#8a520f" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- Tail -->
  <path d="M285,248 L236,260 L238,276 L290,268 Z" fill="#4d3b2e"/>

  <!-- Body -->
  <ellipse cx="350" cy="250" rx="78" ry="46" transform="rotate(-12 350 250)" fill="#8b7765"/>
  <path d="M290,262 Q350,300 415,262" fill="none" stroke="#a89887" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Neck -->
  <path d="M410,236 C450,238 430,202 462,190" fill="none" stroke="#f4efe6" stroke-width="24" stroke-linecap="round"/>
  <path d="M402,226 C436,222 420,190 452,176" fill="none" stroke="#5a3d2b" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Head -->
  <circle cx="470" cy="186" r="16" fill="#f7f2e8"/>
  <ellipse cx="467" cy="175" rx="12" ry="7" fill="#f2d36b"/>
  <circle cx="477" cy="184" r="3.2" fill="#1a1a1a"/>
  <circle cx="478" cy="183" r="1" fill="#fff"/>

  <!-- Bill and pouch -->
  <path d="M484,198 Q530,242 582,220 L486,204 Z" fill="#7d6650"/>
  <path d="M482,180 L580,212 Q592,216 582,221 L484,200 Z" fill="#b39d80"/>
  <path d="M572,212 Q590,214 584,224" fill="none" stroke="#6b5640" stroke-width="2"/>

  <!-- Wing reaching to handlebar -->
  <path d="M368,232 C420,225 480,255 528,280 L520,293 C470,281 420,286 365,290 Z" fill="#6b4f3a"/>
  <g stroke="#8a6a50" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M385,246 C430,244 470,262 508,282"/>
    <path d="M380,262 C430,262 470,274 512,288"/>
    <path d="M375,276 C420,278 460,283 500,291"/>
  </g>
  <circle cx="527" cy="286" r="6" fill="#4d3b2e"/>
</svg>