<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="460" viewBox="0 0 800 460">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#fdf3d8"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#c9ced3" stroke-width="2"/>
      <g stroke="#9aa3ab" stroke-width="1">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(22.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(45)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(67.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(112.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(135)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#555"/>
      <circle cx="52" cy="0" r="4" fill="#e63946"/>
    </g>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="460" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe27a" opacity="0.9"/>
  <path d="M0,360 Q120,300 240,350 T480,340 T800,350 L800,410 L0,410 Z" fill="#a9c9a0"/>

  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="860 0" to="-200 0" dur="40s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="70" rx="40" ry="14"/>
      <ellipse cx="25" cy="60" rx="28" ry="14"/>
      <ellipse cx="-22" cy="62" rx="22" ry="11"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="900 0" to="-200 0" dur="65s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="130" rx="34" ry="11"/>
      <ellipse cx="20" cy="122" rx="22" ry="11"/>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="402" width="800" height="58" fill="#d9c08f"/>
  <line x1="0" y1="402" x2="800" y2="402" stroke="#8a7650" stroke-width="3"/>
  <line x1="0" y1="428" x2="800" y2="428" stroke="#b49a68" stroke-width="4" stroke-dasharray="60 60">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.27s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="404" rx="230" ry="5" fill="#000000" opacity="0.15"/>

  <!-- wheels -->
  <g transform="translate(240,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>
  <g transform="translate(560,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>

  <!-- far crank, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 385 340" to="540 385 340" dur="2s" repeatCount="indefinite"/>
    <line x1="385" y1="340" x2="425" y2="340" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 425 340" to="-540 425 340" dur="2s" repeatCount="indefinite"/>
      <rect x="414" y="343" width="22" height="5" rx="2" fill="#333"/>
      <path d="M417,343 Q419,336 426,337 L443,341 L444,343 Z" fill="#2a2623"/>
    </g>
  </g>

  <!-- far leg -->
  <path d="M355,238 L404.5,294.3 L345,340" fill="none" stroke="#2a2623" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M355,238 L404.5,294.3 L345,340;M355,238 L415.3,282.6 L350.4,320;M355,238 L426.1,261.9 L365,305.4;M355,238 L430,240 L385,300;M355,238 L429.9,234.6 L405,305.4;M355,238 L429.6,245.7 L419.6,320;M355,238 L425,265 L425,340;M355,238 L413.2,285.3 L419.6,360;M355,238 L397.1,300.1 L405,374.6;M355,238 L388.5,305.1 L385,380;M355,238 L390.5,304.1 L365,374.6;M355,238 L396.2,300.7 L350.4,360;M355,238 L404.5,294.3 L345,340"/>
  </path>

  <!-- chain -->
  <g fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="4 3">
    <line x1="385" y1="320" x2="240" y2="320">
      <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.111s" repeatCount="indefinite"/>
    </line>
    <line x1="240" y1="340" x2="385" y2="360">
      <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.111s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- rear sprocket -->
  <g transform="translate(240,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <circle r="10" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="2.5 2.5"/>
      <circle r="5" fill="#888"/>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="385" y1="340" x2="240" y2="330"/>
    <line x1="364" y1="266" x2="240" y2="330"/>
    <line x1="385" y1="340" x2="362" y2="260"/>
    <line x1="362" y1="264" x2="514" y2="244"/>
    <line x1="385" y1="340" x2="520" y2="262"/>
    <path d="M521,262 Q540,300 560,330" stroke="#176070"/>
    <line x1="512" y1="238" x2="522" y2="268" stroke-width="8"/>
  </g>
  <!-- seat post, stem, handlebar -->
  <line x1="362" y1="260" x2="356" y2="240" stroke="#b8bec4" stroke-width="5" stroke-linecap="round"/>
  <line x1="512" y1="238" x2="506" y2="222" stroke="#b8bec4" stroke-width="5" stroke-linecap="round"/>
  <path d="M506,222 L500,212 Q494,205 484,208" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="385" cy="340" r="8" fill="#444"/>
  <circle cx="560" cy="330" r="4" fill="#888"/>
  <circle cx="240" cy="330" r="4" fill="#888"/>

  <!-- saddle -->
  <path d="M332,238 Q350,231 372,235 L390,238 Q372,247 340,245 Z" fill="#3b2a20"/>

  <!-- near crank, chainring, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 340" to="360 385 340" dur="2s" repeatCount="indefinite"/>
    <circle cx="385" cy="340" r="21" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="2.5 2.5"/>
    <circle cx="385" cy="340" r="17" fill="none" stroke="#777" stroke-width="2"/>
    <line x1="385" y1="340" x2="425" y2="340" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <circle cx="385" cy="340" r="6" fill="#222"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 425 340" to="-360 425 340" dur="2s" repeatCount="indefinite"/>
      <rect x="414" y="343" width="22" height="5" rx="2" fill="#222"/>
      <path d="M417,343 Q419,336 426,337 L443,341 L444,343 Z" fill="#3f3a36"/>
    </g>
  </g>

  <!-- near leg -->
  <path d="M355,238 L425,265 L425,340" fill="none" stroke="#3f3a36" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M355,238 L425,265 L425,340;M355,238 L413.2,285.3 L419.6,360;M355,238 L397.1,300.1 L405,374.6;M355,238 L388.5,305.1 L385,380;M355,238 L390.5,304.1 L365,374.6;M355,238 L396.2,300.7 L350.4,360;M355,238 L404.5,294.3 L345,340;M355,238 L415.3,282.6 L350.4,320;M355,238 L426.1,261.9 L365,305.4;M355,238 L430,240 L385,300;M355,238 L429.9,234.6 L405,305.4;M355,238 L429.6,245.7 L419.6,320;M355,238 L425,265 L425,340"/>
  </path>

  <!-- pelican: tail -->
  <polygon points="312,205 266,226 272,240 318,228" fill="#5d4d41"/>
  <path d="M300,212 L274,228 M304,218 L282,234" stroke="#3f342b" stroke-width="1.5" fill="none"/>

  <!-- pelican: body -->
  <ellipse cx="352" cy="212" rx="54" ry="32" transform="rotate(-8 352 212)" fill="#8a7664"/>
  <ellipse cx="362" cy="222" rx="38" ry="17" transform="rotate(-8 362 222)" fill="#a8998a"/>

  <!-- neck -->
  <path d="M372,206 Q398,196 398,172 Q398,150 412,146" fill="none" stroke="#f4eedc" stroke-width="17" stroke-linecap="round"/>
  <path d="M364,197 Q388,187 388,168 Q388,148 406,139" fill="none" stroke="#5a3b27" stroke-width="5" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="414" cy="146" r="14" fill="#f6f0d6"/>
  <ellipse cx="412" cy="135" rx="9" ry="5" fill="#f0cd55"/>
  <path d="M424,141 L484,168 Q490,171 486,174 L426,156 Z" fill="#8b8478"/>
  <path d="M426,156 L486,174 Q456,192 428,164 Z" fill="#b9a98a"/>
  <circle cx="486" cy="172" r="2.5" fill="#d9822b"/>
  <circle cx="419" cy="144" r="3.4" fill="#ffffff"/>
  <circle cx="420" cy="144" r="2.2" fill="#1a1a1a"/>

  <!-- wing reaching the handlebar -->
  <path d="M358,196 Q398,188 438,198 Q474,202 490,209 Q476,218 440,214 Q400,224 360,222 Z" fill="#6a5646" stroke="#4a3a2e" stroke-width="2" stroke-linejoin="round"/>
  <path d="M380,204 Q420,202 460,208 M376,212 Q420,212 456,212" fill="none" stroke="#4a3a2e" stroke-width="1.5"/>
</svg>