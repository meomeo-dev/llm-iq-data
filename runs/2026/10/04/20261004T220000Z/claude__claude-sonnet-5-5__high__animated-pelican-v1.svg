<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f5"/>
      <stop offset="1" stop-color="#f6efd8"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#9aa0a6" stroke-width="1">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(22.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(45)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(67.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(112.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(135)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-57" r="3.5" fill="#ff8c1a"/>
      <circle r="7" fill="#777"/>
      <circle r="3" fill="#ddd"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#ffe27a" opacity="0.9"/>
  <rect y="424" width="800" height="76" fill="#d9c79a"/>
  <line x1="-100" y1="440" x2="900" y2="440" stroke="#b5a16f" stroke-width="4" stroke-dasharray="40 40">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="424" x2="800" y2="424" stroke="#a89466" stroke-width="2"/>

  <!-- far leg and far crank -->
  <path d="M350,230 L429.5,272.1 L410,360" fill="none" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M350,230 L400.7,304.3 L330,360;
      M350,230 L412.9,294.4 L335.4,340;
      M350,230 L426.3,277.7 L350,325.4;
      M350,230 L435.5,258.2 L370,320;
      M350,230 L437.9,249.2 L390,325.4;
      M350,230 L436.2,255.7 L404.6,340;
      M350,230 L429.5,272.1 L410,360;
      M350,230 L416.4,290.8 L404.6,380;
      M350,230 L399.5,305.1 L390,394.6;
      M350,230 L387.7,311.8 L370,400;
      M350,230 L386.4,312.3 L350,394.6;
      M350,230 L391.7,309.8 L335.4,380;
      M350,230 L400.7,304.3 L330,360"/>
  </path>
  <g transform="translate(370,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-40" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="1" width="24" height="4" rx="1.5" fill="#222"/>
          <polygon points="-4,-5 5,-6 22,0 22,2 -6,2" fill="#2a2a2a"/>
        </g>
      </g>
    </g>
  </g>

  <!-- wheels -->
  <g transform="translate(230,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="10" fill="none" stroke="#555" stroke-width="3"/>
    </g>
  </g>
  <g transform="translate(570,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="2" stroke-dasharray="3 2">
    <line x1="230" y1="342" x2="370" y2="342"/>
    <line x1="230" y1="358" x2="370" y2="378"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#d9462f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="230" y1="350" x2="370" y2="360"/>
    <line x1="230" y1="350" x2="343" y2="266"/>
    <line x1="370" y1="360" x2="341" y2="262"/>
    <line x1="341" y1="262" x2="518" y2="246"/>
    <line x1="370" y1="360" x2="526" y2="268"/>
    <line x1="524" y1="262" x2="570" y2="350" stroke="#333" stroke-width="5"/>
  </g>
  <line x1="518" y1="246" x2="526" y2="268" stroke="#8f2a1a" stroke-width="9" stroke-linecap="round"/>
  <path d="M517,244 L513,224 L531,219 Q546,219 546,234" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="546" cy="232" r="5" fill="#111"/>
  <line x1="341" y1="262" x2="347" y2="243" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M320,236 L374,236 Q378,245 366,246 L330,246 Q316,246 320,236 Z" fill="#222"/>
  <circle cx="370" cy="360" r="8" fill="#666"/>

  <!-- pelican body -->
  <polygon points="275,188 232,203 238,224 278,214" fill="#4a3425"/>
  <ellipse cx="325" cy="195" rx="68" ry="45" fill="#7a5c45" transform="rotate(-8 325 195)"/>
  <ellipse cx="372" cy="196" rx="24" ry="30" fill="#c7b299"/>
  <path d="M368,172 C395,160 385,125 415,108" fill="none" stroke="#f3efe4" stroke-width="22" stroke-linecap="round"/>
  <path d="M358,166 C384,152 374,122 408,98" fill="none" stroke="#5a3e2c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="426" cy="100" r="16" fill="#f7f1dc"/>
  <path d="M410,96 A16,16 0 0 1 441,94 Q426,88 410,96 Z" fill="#f2cf5a"/>
  <path d="M438,92 L524,119 L522,124 L438,104 Z" fill="#a89478"/>
  <path d="M440,104 Q480,142 521,124 Z" fill="#8a6e55"/>
  <circle cx="523" cy="122" r="2.5" fill="#3a2a1d"/>
  <circle cx="432" cy="97" r="3.2" fill="#111"/>
  <circle cx="433" cy="96" r="1" fill="#fff"/>

  <!-- near thigh feathers and near leg -->
  <ellipse cx="352" cy="226" rx="20" ry="16" fill="#6b4d3a"/>
  <path d="M350,230 L429.5,272.1 L410,360" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M350,230 L429.5,272.1 L410,360;
      M350,230 L416.4,290.8 L404.6,380;
      M350,230 L399.5,305.1 L390,394.6;
      M350,230 L387.7,311.8 L370,400;
      M350,230 L386.4,312.3 L350,394.6;
      M350,230 L391.7,309.8 L335.4,380;
      M350,230 L400.7,304.3 L330,360;
      M350,230 L412.9,294.4 L335.4,340;
      M350,230 L426.3,277.7 L350,325.4;
      M350,230 L435.5,258.2 L370,320;
      M350,230 L437.9,249.2 L390,325.4;
      M350,230 L436.2,255.7 L404.6,340;
      M350,230 L429.5,272.1 L410,360"/>
  </path>

  <!-- wing reaching handlebar -->
  <path d="M345,172 Q440,200 532,222" fill="none" stroke="#5f4331" stroke-width="16" stroke-linecap="round"/>
  <path d="M352,172 Q440,198 520,217" fill="none" stroke="#8a664d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="534" cy="224" r="7" fill="#3a2a1d"/>

  <!-- near crank -->
  <g transform="translate(370,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="18" fill="none" stroke="#555" stroke-width="3"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="1" width="24" height="4" rx="1.5" fill="#222"/>
          <polygon points="-4,-5 5,-6 22,0 22,2 -6,2" fill="#333"/>
        </g>
      </g>
    </g>
  </g>
  <circle cx="370" cy="360" r="4" fill="#ccc"/>
</svg>