<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 90 540 370" width="810" height="555">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6f7"/>
      <stop offset="1" stop-color="#fdf3dc"/>
    </linearGradient>
    <g id="wheel">
      <circle r="83" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="78" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#9aa0a6" stroke-width="1">
        <line y1="-77" y2="77"/>
        <line y1="-77" y2="77" transform="rotate(15)"/>
        <line y1="-77" y2="77" transform="rotate(30)"/>
        <line y1="-77" y2="77" transform="rotate(45)"/>
        <line y1="-77" y2="77" transform="rotate(60)"/>
        <line y1="-77" y2="77" transform="rotate(75)"/>
        <line y1="-77" y2="77" transform="rotate(90)"/>
        <line y1="-77" y2="77" transform="rotate(105)"/>
        <line y1="-77" y2="77" transform="rotate(120)"/>
        <line y1="-77" y2="77" transform="rotate(135)"/>
        <line y1="-77" y2="77" transform="rotate(150)"/>
        <line y1="-77" y2="77" transform="rotate(165)"/>
      </g>
      <circle r="6" fill="#888"/>
      <rect x="-1.5" y="-79" width="3" height="7" fill="#d22"/>
    </g>
  </defs>

  <rect x="130" y="90" width="540" height="370" fill="url(#sky)"/>
  <rect x="130" y="437" width="540" height="23" fill="#e8d3a2"/>
  <line x1="130" y1="446" x2="670" y2="446" stroke="#b79d62" stroke-width="3" stroke-dasharray="30 30">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="438" rx="200" ry="6" fill="#000" fill-opacity="0.15"/>

  <!-- wheels -->
  <g transform="translate(255,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="8" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="2 2"/>
    </g>
  </g>
  <g transform="translate(540,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="390" y1="340" x2="255" y2="342"/>
    <line x1="390" y1="376" x2="255" y2="358"/>
  </g>

  <!-- far leg -->
  <polyline fill="none" stroke="#5a524a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points="355,245 417,307.4 345,358 358,358">
    <animate attributeName="points" dur="1.8s" repeatCount="indefinite" values="
      355,245 417,307.4 345,358 358,358;
      355,245 428.4,293.6 351,335.5 364,335.5;
      355,245 439.7,268.8 367.5,319 380.5,319;
      355,245 443,242.7 390,313 403,313;
      355,245 442.6,236.3 412.5,319 425.5,319;
      355,245 442.9,248.6 429,335.5 442,335.5;
      355,245 439.4,270.1 435,358 448,358;
      355,245 429.1,292.5 429,380.5 442,380.5;
      355,245 415.4,309 412.5,397 425.5,397;
      355,245 406.3,316.5 390,403 403,403;
      355,245 405.1,317.4 367.5,397 380.5,397;
      355,245 409.1,314.4 351,380.5 364,380.5;
      355,245 417,307.4 345,358 358,358"/>
  </polyline>

  <!-- frame -->
  <g fill="none" stroke="#1f7a8c" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390,358 L354,248" stroke-width="6"/>
    <path d="M358.6,262 L514,246" stroke-width="6"/>
    <path d="M390,358 L520,266" stroke-width="7"/>
    <path d="M513,242 L520,267" stroke-width="9"/>
    <path d="M390,358 L255,350" stroke-width="4"/>
    <path d="M358.6,262 L255,350" stroke-width="4"/>
    <path d="M520,266 L540,350" stroke-width="5"/>
  </g>
  <line x1="354" y1="252" x2="354" y2="245" stroke="#444" stroke-width="4"/>
  <path d="M326,246 Q352,238 378,243 Q380,249 362,250 Q342,251 326,250 Z" fill="#222"/>
  <line x1="513" y1="242" x2="508" y2="228" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <path d="M508,228 L535,226 Q548,226 548,240" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <circle cx="390" cy="358" r="6" fill="#555"/>
  <circle cx="540" cy="350" r="4" fill="#555"/>
  <circle cx="255" cy="350" r="4" fill="#555"/>

  <!-- crank, chainring, pedals -->
  <g transform="translate(390,358)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <circle r="18" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="3 2"/>
      <line x1="0" y1="0" x2="45" y2="0" stroke="#999" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-45" y2="0" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(45,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.8s" repeatCount="indefinite"/>
          <rect x="-12" y="-2.5" width="24" height="5" rx="1.5" fill="#222"/>
        </g>
      </g>
      <g transform="translate(-45,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.8s" repeatCount="indefinite"/>
          <rect x="-12" y="-2.5" width="24" height="5" rx="1.5" fill="#222"/>
        </g>
      </g>
      <circle r="4" fill="#555"/>
    </g>
  </g>

  <!-- near leg -->
  <polyline fill="none" stroke="#2f2a26" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="355,245 439.4,270.1 435,358 448,358">
    <animate attributeName="points" dur="1.8s" repeatCount="indefinite" values="
      355,245 439.4,270.1 435,358 448,358;
      355,245 429.1,292.5 429,380.5 442,380.5;
      355,245 415.4,309 412.5,397 425.5,397;
      355,245 406.3,316.5 390,403 403,403;
      355,245 405.1,317.4 367.5,397 380.5,397;
      355,245 409.1,314.4 351,380.5 364,380.5;
      355,245 417,307.4 345,358 358,358;
      355,245 428.4,293.6 351,335.5 364,335.5;
      355,245 439.7,268.8 367.5,319 380.5,319;
      355,245 443,242.7 390,313 403,313;
      355,245 442.6,236.3 412.5,319 425.5,319;
      355,245 442.9,248.6 429,335.5 442,335.5;
      355,245 439.4,270.1 435,358 448,358"/>
  </polyline>

  <!-- pelican body -->
  <path d="M296,214 L246,236 L252,247 L302,240 Z" fill="#4d3f33" stroke="#33281f" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="350" cy="222" rx="66" ry="34" transform="rotate(10 350 222)" fill="#7a6552" stroke="#3f3226" stroke-width="2"/>
  <ellipse cx="354" cy="240" rx="22" ry="12" fill="#6a5646" stroke="#3f3226" stroke-width="1.5"/>

  <!-- neck -->
  <path d="M386,208 C404,188 386,170 430,148" fill="none" stroke="#4e3a2a" stroke-width="8" stroke-linecap="round"/>
  <path d="M396,212 C416,190 398,172 442,156" fill="none" stroke="#f4efe4" stroke-width="16" stroke-linecap="round"/>

  <!-- head and bill -->
  <path d="M466,158 Q525,200 580,179 L470,162 Z" fill="#8d8062" stroke="#5e5440" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M464,144 L585,172 Q588,176 582,178 L464,160 Z" fill="#a89a7c" stroke="#5e5440" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M575,170 L588,174 Q591,182 582,180 Z" fill="#d9622b"/>
  <circle cx="452" cy="150" r="15" fill="#f6f1e6" stroke="#cfc6b0" stroke-width="1"/>
  <ellipse cx="450" cy="140" rx="11" ry="7" fill="#f1d96b"/>
  <circle cx="459" cy="148" r="3" fill="#111"/>
  <circle cx="460" cy="147" r="1" fill="#fff"/>

  <!-- wing reaching the handlebar -->
  <path d="M385,200 C420,200 480,215 536,226 L538,236 C480,238 420,238 380,232 Z" fill="#6a5646" stroke="#3f3226" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#3f3226" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M410,214 C450,220 490,226 526,230"/>
    <path d="M400,224 C440,230 480,233 522,234"/>
  </g>
  <circle cx="537" cy="231" r="5" fill="#5b4a3a" stroke="#3f3226" stroke-width="1.5"/>
</svg>