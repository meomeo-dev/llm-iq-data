<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8ee"/>
      <stop offset="1" stop-color="#e6f5fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="80" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="73" fill="none" stroke="#b8bec4" stroke-width="2"/>
      <g stroke="#9aa1a8" stroke-width="1">
        <line x1="-73" y1="0" x2="73" y2="0"/>
        <line x1="-68.6" y1="-24.9" x2="68.6" y2="24.9"/>
        <line x1="-55.9" y1="-46.9" x2="55.9" y2="46.9"/>
        <line x1="-36.5" y1="-63.2" x2="36.5" y2="63.2"/>
        <line x1="-12.7" y1="-71.9" x2="12.7" y2="71.9"/>
        <line x1="12.7" y1="-71.9" x2="-12.7" y2="71.9"/>
        <line x1="36.5" y1="-63.2" x2="-36.5" y2="63.2"/>
        <line x1="55.9" y1="-46.9" x2="-55.9" y2="46.9"/>
        <line x1="68.6" y1="-24.9" x2="-68.6" y2="24.9"/>
      </g>
      <circle cx="0" cy="-66" r="4" fill="#e63b2e"/>
      <circle r="9" fill="#555"/>
      <circle r="4" fill="#ccc"/>
    </g>
  </defs>

  <rect width="800" height="560" fill="url(#sky)"/>
  <circle cx="660" cy="90" r="40" fill="#ffe28a" opacity="0.9"/>
  <rect y="400" width="800" height="160" fill="#e9d8a6"/>
  <rect y="380" width="800" height="24" fill="#4aa3c7" opacity="0.55"/>
  <line x1="0" y1="476" x2="800" y2="476" stroke="#8a7a52" stroke-width="3" stroke-dasharray="30 20" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="0" to="500" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="480" rx="230" ry="8" fill="#000" opacity="0.15"/>

  <!-- far crank, pedal, leg -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 380 400" to="540 380 400" dur="2s" repeatCount="indefinite"/>
    <line x1="380" y1="400" x2="420" y2="400" stroke="#6b7076" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 420 400" to="-540 420 400" dur="2s" repeatCount="indefinite"/>
      <rect x="408" y="397" width="24" height="6" rx="2" fill="#333"/>
    </g>
  </g>
  <polyline fill="none" stroke="#3d3d3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" points="350,275 422.7,343.7 340,400">
    <animate attributeName="points" dur="2s" repeatCount="indefinite" values="350,275 422.7,343.7 340,400;350,275 432.7,331.2 345.4,380;350,275 443.6,310.4 360,365.4;350,275 449.2,287.8 380,360;350,275 449.9,278.8 400,365.4;350,275 449.4,286.3 414.6,380;350,275 445.9,303.4 420,400;350,275 437.9,322.7 414.6,420;350,275 427.3,338.4 400,434.6;350,275 418.6,347.8 380,440;350,275 415,351 360,434.6;350,275 416.5,349.7 345.4,420;350,275 422.7,343.7 340,400"/>
  </polyline>
  <ellipse cx="340" cy="400" rx="13" ry="5" fill="#2b2b2b">
    <animate attributeName="cx" dur="2s" repeatCount="indefinite" values="340;345.4;360;380;400;414.6;420;414.6;400;380;360;345.4;340"/>
    <animate attributeName="cy" dur="2s" repeatCount="indefinite" values="400;380;365.4;360;365.4;380;400;420;434.6;440;434.6;420;400"/>
  </ellipse>

  <!-- wheels -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 250 390" to="360 250 390" dur="1.2s" repeatCount="indefinite"/>
    <use xlink:href="#wheel" x="250" y="390"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 550 390" to="360 550 390" dur="1.2s" repeatCount="indefinite"/>
    <use xlink:href="#wheel" x="550" y="390"/>
  </g>

  <!-- chain and rear cog -->
  <g stroke="#444" stroke-width="2" stroke-dasharray="4 3" fill="none">
    <line x1="380" y1="380" x2="250" y2="382">
      <animate attributeName="stroke-dashoffset" from="0" to="-70" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="380" y1="420" x2="250" y2="398">
      <animate attributeName="stroke-dashoffset" from="0" to="70" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>
  <circle cx="250" cy="390" r="9" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2">
    <animateTransform attributeName="transform" type="rotate" from="0 250 390" to="360 250 390" dur="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- frame -->
  <g fill="none" stroke="#1e6f8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="390" x2="380" y2="400"/>
    <line x1="250" y1="390" x2="352" y2="284"/>
    <line x1="380" y1="400" x2="352" y2="282"/>
    <line x1="354" y1="288" x2="513" y2="280"/>
    <line x1="380" y1="400" x2="516" y2="294"/>
    <line x1="508" y1="266" x2="518" y2="296"/>
    <line x1="518" y1="290" x2="550" y2="390"/>
  </g>
  <line x1="352" y1="282" x2="350" y2="266" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M326,266 Q352,258 384,264 Q387,273 378,273 Q350,270 330,275 Z" fill="#1a1a1a"/>
  <g fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="508" y1="266" x2="505" y2="248"/>
    <path d="M504,248 L536,246 Q550,246 548,262"/>
  </g>
  <circle cx="550" cy="390" r="5" fill="#1e6f8c"/>
  <circle cx="250" cy="390" r="5" fill="#1e6f8c"/>

  <!-- near crank, chainring, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 400" to="360 380 400" dur="2s" repeatCount="indefinite"/>
    <circle cx="380" cy="400" r="20" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="5 3"/>
    <line x1="380" y1="400" x2="420" y2="400" stroke="#9aa1a8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="380" cy="400" r="6" fill="#444"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 420 400" to="-360 420 400" dur="2s" repeatCount="indefinite"/>
      <rect x="408" y="397" width="24" height="6" rx="2" fill="#222"/>
    </g>
  </g>

  <!-- near leg and foot -->
  <polyline fill="none" stroke="#3d3d3d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" points="350,275 445.9,303.4 420,400">
    <animate attributeName="points" dur="2s" repeatCount="indefinite" values="350,275 445.9,303.4 420,400;350,275 437.9,322.7 414.6,420;350,275 427.3,338.4 400,434.6;350,275 418.6,347.8 380,440;350,275 415,351 360,434.6;350,275 416.5,349.7 345.4,420;350,275 422.7,343.7 340,400;350,275 432.7,331.2 345.4,380;350,275 443.6,310.4 360,365.4;350,275 449.2,287.8 380,360;350,275 449.9,278.8 400,365.4;350,275 449.4,286.3 414.6,380;350,275 445.9,303.4 420,400"/>
  </polyline>
  <ellipse cx="420" cy="400" rx="14" ry="5.5" fill="#2b2b2b">
    <animate attributeName="cx" dur="2s" repeatCount="indefinite" values="420;414.6;400;380;360;345.4;340;345.4;360;380;400;414.6;420"/>
    <animate attributeName="cy" dur="2s" repeatCount="indefinite" values="400;420;434.6;440;434.6;420;400;380;365.4;360;365.4;380;400"/>
  </ellipse>

  <!-- pelican -->
  <path d="M292,232 L238,264 L298,260 Z" fill="#5a4636"/>
  <ellipse cx="338" cy="240" rx="58" ry="36" transform="rotate(-12 338 240)" fill="#7d6a58"/>
  <ellipse cx="372" cy="250" rx="26" ry="20" fill="#a89886" opacity="0.8"/>
  <path d="M378,228 C362,196 396,196 404,166" fill="none" stroke="#f4f1ea" stroke-width="20" stroke-linecap="round"/>
  <path d="M369,226 C353,196 387,194 395,164" fill="none" stroke="#5a3a28" stroke-width="5" stroke-linecap="round"/>
  <circle cx="416" cy="150" r="17" fill="#f7f4ee"/>
  <ellipse cx="414" cy="138" rx="11" ry="6" fill="#e8c547"/>
  <path d="M430,158 Q470,198 518,183 L430,164 Z" fill="#c9ad82"/>
  <path d="M428,142 L522,176 Q527,180 520,183 L428,160 Z" fill="#9a8f78"/>
  <circle cx="522" cy="179" r="3" fill="#b5442e"/>
  <circle cx="423" cy="146" r="3.2" fill="#111"/>
  <circle cx="424" cy="145" r="1" fill="#fff"/>
  <path d="M365,215 C410,205 480,228 540,246 L538,256 C480,256 420,262 368,248 Z" fill="#6b4e3a" stroke="#4a3426" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400,226 C440,230 480,242 530,251" fill="none" stroke="#8c6a50" stroke-width="2"/>
  <circle cx="540" cy="250" r="6" fill="#222"/>
</svg>