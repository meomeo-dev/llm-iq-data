<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <desc>An animated brown pelican pedaling a bicycle. Wheels spin, cranks and pedals revolve, and the legs follow the pedals.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f2"/>
      <stop offset="1" stop-color="#e8f5fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#1f1f1f" stroke-width="7"/>
      <circle r="63" fill="none" stroke="#bdbdbd" stroke-width="2.5"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(22.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(45)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(67.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(112.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(135)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#555"/>
      <circle cx="60" cy="0" r="3.5" fill="#d9363e"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe28a" opacity="0.9"/>
  <rect y="421" width="800" height="79" fill="#d2c39c"/>
  <line x1="0" y1="421" x2="800" y2="421" stroke="#8c7d58" stroke-width="2"/>

  <g fill="#8c7d58">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="0.273s" repeatCount="indefinite"/>
    <rect x="-80" y="445" width="40" height="4"/>
    <rect x="0" y="445" width="40" height="4"/>
    <rect x="80" y="445" width="40" height="4"/>
    <rect x="160" y="445" width="40" height="4"/>
    <rect x="240" y="445" width="40" height="4"/>
    <rect x="320" y="445" width="40" height="4"/>
    <rect x="400" y="445" width="40" height="4"/>
    <rect x="480" y="445" width="40" height="4"/>
    <rect x="560" y="445" width="40" height="4"/>
    <rect x="640" y="445" width="40" height="4"/>
    <rect x="720" y="445" width="40" height="4"/>
    <rect x="800" y="445" width="40" height="4"/>
  </g>

  <!-- wheels -->
  <g transform="translate(230 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(570 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#444" stroke-width="2" fill="none">
    <line x1="385" y1="339" x2="230" y2="342"/>
    <line x1="385" y1="371" x2="230" y2="358"/>
    <circle cx="230" cy="350" r="8" stroke="#666" stroke-width="3"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="385" y1="355" x2="350" y2="266"/>
    <line x1="350" y1="272" x2="527" y2="257"/>
    <line x1="385" y1="355" x2="520" y2="282"/>
    <line x1="385" y1="355" x2="230" y2="350" stroke-width="5"/>
    <line x1="350" y1="272" x2="230" y2="350" stroke-width="5"/>
    <line x1="528" y1="250" x2="518" y2="286" stroke-width="8"/>
    <line x1="518" y1="286" x2="570" y2="350" stroke="#8e2a20" stroke-width="5"/>
  </g>
  <path d="M522 250 L522 232 L548 228 Q566 228 564 248" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M551 228 Q566 228 564 248" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <path d="M322 262 Q345 251 380 257 Q386 262 372 265 L330 267 Q320 267 322 262 Z" fill="#222"/>
  <circle cx="385" cy="355" r="8" fill="#555"/>

  <!-- far leg -->
  <path fill="none" stroke="#2b2b2b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M360 245 L416.3 308.7 L345 355 L359 355">
    <animate attributeName="d" calcMode="linear" dur="1.5s" repeatCount="indefinite" values="
      M360 245 L416.3 308.7 L345 355 L359 355;
      M360 245 L426.7 297.7 L350.4 335 L364.4 335;
      M360 245 L438.5 277.7 L365 320.4 L379 320.4;
      M360 245 L444.5 254.3 L385 315 L399 315;
      M360 245 L445 245.4 L405 320.4 L419 320.4;
      M360 245 L444.5 253.7 L419.6 335 L433.6 335;
      M360 245 L440.8 271.5 L425 355 L439 355;
      M360 245 L431.6 290.9 L419.6 375 L433.6 375;
      M360 245 L419.3 305.9 L405 389.6 L419 389.6;
      M360 245 L410 313.8 L385 395 L399 395;
      M360 245 L407.1 315.8 L365 389.6 L379 389.6;
      M360 245 L409.6 314 L350.4 375 L364.4 375;
      M360 245 L416.3 308.7 L345 355 L359 355"/>
  </path>

  <!-- crank, chainring, pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 355" to="360 385 355" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="385" cy="355" r="16" fill="none" stroke="#666" stroke-width="3"/>
    <circle cx="385" cy="355" r="10" fill="none" stroke="#888" stroke-width="1.5"/>
    <line x1="345" y1="355" x2="425" y2="355" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <circle cx="385" cy="355" r="6" fill="#333"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 425 355" to="-360 425 355" dur="1.5s" repeatCount="indefinite"/>
      <rect x="410" y="354" width="30" height="5" rx="2" fill="#222"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 345 355" to="-360 345 355" dur="1.5s" repeatCount="indefinite"/>
      <rect x="330" y="354" width="30" height="5" rx="2" fill="#222"/>
    </g>
  </g>

  <!-- tail and body -->
  <path d="M290 200 L252 216 L258 224 L250 234 L292 230 Z" fill="#4e3922"/>
  <ellipse cx="355" cy="205" rx="76" ry="48" fill="#7a5a3c"/>
  <ellipse cx="375" cy="222" rx="50" ry="26" fill="#a58a69"/>

  <!-- near leg -->
  <path fill="none" stroke="#3a3a3a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M360 245 L440.8 271.5 L425 355 L439 355">
    <animate attributeName="d" calcMode="linear" dur="1.5s" repeatCount="indefinite" values="
      M360 245 L440.8 271.5 L425 355 L439 355;
      M360 245 L431.6 290.9 L419.6 375 L433.6 375;
      M360 245 L419.3 305.9 L405 389.6 L419 389.6;
      M360 245 L410 313.8 L385 395 L399 395;
      M360 245 L407.1 315.8 L365 389.6 L379 389.6;
      M360 245 L409.6 314 L350.4 375 L364.4 375;
      M360 245 L416.3 308.7 L345 355 L359 355;
      M360 245 L426.7 297.7 L350.4 335 L364.4 335;
      M360 245 L438.5 277.7 L365 320.4 L379 320.4;
      M360 245 L444.5 254.3 L385 315 L399 315;
      M360 245 L445 245.4 L405 320.4 L419 320.4;
      M360 245 L444.5 253.7 L419.6 335 L433.6 335;
      M360 245 L440.8 271.5 L425 355 L439 355"/>
  </path>
  <ellipse cx="360" cy="241" rx="24" ry="16" fill="#8a6845"/>

  <!-- neck and head -->
  <path d="M400 200 C430 205 425 170 445 152" fill="none" stroke="#efe3b5" stroke-width="22" stroke-linecap="round"/>
  <path d="M392 192 C415 194 414 166 436 148" fill="none" stroke="#6b4a2b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="445" cy="150" r="17" fill="#f4ebc3"/>
  <path d="M430 140 Q445 128 460 138 Q448 135 430 148 Z" fill="#e9d27a"/>
  <circle cx="451" cy="144" r="3" fill="#1b1b1b"/>
  <path d="M458 160 L546 181 Q520 205 470 180 Q460 172 458 160 Z" fill="#9c8758"/>
  <path d="M456 143 L548 176 L546 181 L458 160 Z" fill="#bba873"/>
  <path d="M548 176 L551 179 L546 183 Z" fill="#6e5a35"/>

  <!-- wing reaching to the handlebar -->
  <path d="M365 180 C420 170 500 200 552 228 L546 238 C490 224 420 238 372 234 Z" fill="#5e4329"/>
  <path d="M385 200 C430 195 490 215 538 233" fill="none" stroke="#3f2b18" stroke-width="2"/>
  <path d="M390 214 C430 212 480 226 530 238" fill="none" stroke="#3f2b18" stroke-width="2"/>
</svg>