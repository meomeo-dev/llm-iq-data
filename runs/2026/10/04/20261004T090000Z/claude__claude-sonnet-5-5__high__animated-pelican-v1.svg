<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="80" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="74" fill="none" stroke="#9aa5ad" stroke-width="2"/>
      <g stroke="#b8c0c6" stroke-width="1.2">
        <line x1="0" y1="-74" x2="0" y2="74"/>
        <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(22.5)"/>
        <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(45)"/>
        <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(67.5)"/>
        <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(90)"/>
        <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(112.5)"/>
        <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(135)"/>
        <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-69" r="4" fill="#ff8c1a"/>
      <circle r="9" fill="#555" stroke="#222" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="40" fill="#ffe27a"/>
  <rect x="0" y="503" width="800" height="97" fill="#e5cf9c"/>
  <line x1="0" y1="503" x2="800" y2="503" stroke="#b79b5e" stroke-width="3"/>
  <line x1="-60" y1="540" x2="860" y2="540" stroke="#c4aa6e" stroke-width="4" stroke-dasharray="30 30">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- far leg -->
  <path fill="none" stroke="#a85f10" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M355,318 L403.6,381.5 L340,430 L354,430">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M355,318 L403.6,381.5 L340,430 L354,430;
              M355,318 L421.4,362.5 L351.7,401.7 L365.7,401.7;
              M355,318 L433.9,330.9 L380,390 L394,390;
              M355,318 L434.7,326.1 L408.3,401.7 L422.3,401.7;
              M355,318 L428.1,350.4 L420,430 L434,430;
              M355,318 L407.6,378.3 L408.3,458.3 L422.3,458.3;
              M355,318 L388.9,390.5 L380,470 L394,470;
              M355,318 L391.7,389.1 L351.7,458.3 L365.7,458.3;
              M355,318 L403.6,381.5 L340,430 L354,430"/>
  </path>

  <!-- wheels -->
  <g transform="translate(240,420)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(560,420)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="3" stroke-dasharray="4 3" fill="none">
    <line x1="240" y1="412" x2="380" y2="412">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="380" y1="448" x2="240" y2="428">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>
  <circle cx="240" cy="420" r="8" fill="none" stroke="#333" stroke-width="3"/>

  <!-- frame -->
  <g fill="none" stroke="#1e88a8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="240" y1="420" x2="380" y2="430"/>
    <line x1="240" y1="420" x2="354" y2="342"/>
    <line x1="380" y1="430" x2="352" y2="340"/>
    <line x1="354" y1="342" x2="498" y2="326"/>
    <line x1="380" y1="430" x2="503" y2="345"/>
    <line x1="499" y1="312" x2="504" y2="345"/>
  </g>
  <line x1="500" y1="330" x2="560" y2="420" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
  <line x1="352" y1="340" x2="348" y2="324" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M326,322 Q340,314 372,318 L370,324 Q345,327 326,326 Z" fill="#222"/>
  <path d="M499,314 L508,291 Q522,284 542,290" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- crank, chainring, pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 430" to="360 380 430" dur="2s" repeatCount="indefinite"/>
    <circle cx="380" cy="430" r="18" fill="none" stroke="#333" stroke-width="3"/>
    <line x1="340" y1="430" x2="420" y2="430" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 420 430" to="-360 420 430" dur="2s" repeatCount="indefinite"/>
      <rect x="408" y="427" width="24" height="6" rx="2" fill="#222"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 340 430" to="-360 340 430" dur="2s" repeatCount="indefinite"/>
      <rect x="328" y="427" width="24" height="6" rx="2" fill="#222"/>
    </g>
  </g>
  <circle cx="380" cy="430" r="6" fill="#777" stroke="#222" stroke-width="2"/>

  <!-- near leg -->
  <path fill="none" stroke="#e8912a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M355,318 L428.1,350.4 L420,430 L434,430">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M355,318 L428.1,350.4 L420,430 L434,430;
              M355,318 L407.6,378.3 L408.3,458.3 L422.3,458.3;
              M355,318 L388.9,390.5 L380,470 L394,470;
              M355,318 L391.7,389.1 L351.7,458.3 L365.7,458.3;
              M355,318 L403.6,381.5 L340,430 L354,430;
              M355,318 L421.4,362.5 L351.7,401.7 L365.7,401.7;
              M355,318 L433.9,330.9 L380,390 L394,390;
              M355,318 L434.7,326.1 L408.3,401.7 L422.3,401.7;
              M355,318 L428.1,350.4 L420,430 L434,430"/>
  </path>

  <!-- pelican -->
  <polygon points="318,282 272,298 278,314 322,306" fill="#4e3b2a"/>
  <ellipse cx="362" cy="288" rx="54" ry="36" fill="#7a6048"/>
  <ellipse cx="372" cy="298" rx="38" ry="22" fill="#a68b6f"/>
  <path d="M326,270 Q350,252 392,262" fill="none" stroke="#4e3b2a" stroke-width="6" stroke-linecap="round"/>

  <path d="M388,278 C425,272 405,235 432,215" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <path d="M378,272 C410,264 392,232 420,210" fill="none" stroke="#4a3828" stroke-width="6" stroke-linecap="round"/>

  <path d="M446,218 Q482,252 522,234 Z" fill="#a89c86"/>
  <path d="M446,200 L528,226 Q532,231 523,233 L446,218 Z" fill="#8d8d80"/>
  <circle cx="526" cy="229" r="3.5" fill="#c0392b"/>
  <circle cx="436" cy="208" r="14" fill="#ffffff"/>
  <ellipse cx="434" cy="198" rx="10" ry="6" fill="#f2d36b"/>
  <circle cx="441" cy="204" r="2.8" fill="#111"/>

  <path d="M372,278 Q455,312 536,290" fill="none" stroke="#5d4634" stroke-width="15" stroke-linecap="round"/>
  <path d="M380,280 Q455,308 530,288" fill="none" stroke="#8a6f55" stroke-width="4" stroke-linecap="round"/>
  <circle cx="540" cy="290" r="5" fill="#5d4634"/>
</svg>