<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#b8bcc4" stroke-width="2"/>
      <g stroke="#9aa0aa" stroke-width="1.2">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(22.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(45)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(67.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(112.5)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(135)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="58" cy="0" r="3.5" fill="#f39c12"/>
      <circle r="7" fill="#555"/>
      <circle r="3" fill="#ddd"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="150" cy="80" rx="48" ry="16"/>
      <ellipse cx="180" cy="68" rx="32" ry="14"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="20s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="450" cy="50" rx="40" ry="12"/>
      <ellipse cx="474" cy="42" rx="26" ry="11"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;50 0;0 0" dur="24s" repeatCount="indefinite"/>
    </g>
  </g>
  <rect x="0" y="401" width="800" height="99" fill="#c9b78a"/>
  <rect x="0" y="401" width="800" height="6" fill="#a8956a"/>
  <line x1="-60" y1="440" x2="860" y2="440" stroke="#a8956a" stroke-width="4" stroke-dasharray="60 60">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.436s" repeatCount="indefinite"/>
  </line>
  <line x1="-60" y1="475" x2="860" y2="475" stroke="#b7a579" stroke-width="3" stroke-dasharray="30 90">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.3s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="404" rx="190" ry="8" fill="#000" opacity="0.18"/>

  <!-- far leg (behind frame) -->
  <path d="M355,225 L407.6,274.2 L362,340" fill="none" stroke="#333" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M355,225 L407.6,274.2 L362,340;
      M355,225 L415.8,263.6 L365.7,326;
      M355,225 L422.4,250.5 L376,315.7;
      M355,225 L425.4,240.3 L390,312;
      M355,225 L425.7,238.6 L404,315.7;
      M355,225 L423.6,246.5 L414.2,326;
      M355,225 L418,259.9 L418,340;
      M355,225 L407.4,274.3 L414.2,354;
      M355,225 L395.2,284.7 L404,364.2;
      M355,225 L389.8,288 L390,368;
      M355,225 L393.1,286 L376,364.2;
      M355,225 L399.7,281.5 L365.7,354;
      M355,225 L407.6,274.2 L362,340"/>
  </path>
  <g>
    <rect x="-11" y="3" width="24" height="5" rx="2" fill="#111"/>
    <path d="M-6,-6 Q10,-4 16,2 L14,5 L-6,3 Z" fill="#2b2b2b"/>
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M362,340 A28,28 0 1 1 418,340 A28,28 0 1 1 362,340"/>
  </g>

  <!-- wheels -->
  <g transform="translate(250,330)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(550,330)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- chain and rear cog -->
  <g stroke="#444" stroke-width="2" fill="none">
    <line x1="390" y1="324" x2="250" y2="323"/>
    <line x1="390" y1="356" x2="250" y2="337"/>
  </g>
  <circle cx="250" cy="330" r="7" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="2 2">
    <animateTransform attributeName="transform" type="rotate" from="0 250 330" to="360 250 330" dur="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="340" x2="365" y2="238"/>
    <line x1="365" y1="244" x2="522" y2="238"/>
    <line x1="390" y1="340" x2="528" y2="262"/>
    <line x1="390" y1="340" x2="250" y2="330"/>
    <line x1="366" y1="246" x2="250" y2="330"/>
    <line x1="520" y1="226" x2="530" y2="268" stroke-width="8"/>
    <line x1="529" y1="264" x2="550" y2="330" stroke-width="5"/>
  </g>
  <g fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="518" y1="226" x2="516" y2="208"/>
    <path d="M516,208 L540,206 Q556,208 554,228"/>
    <line x1="365" y1="238" x2="362" y2="231"/>
  </g>
  <path d="M334,230 Q350,226 372,228 Q388,230 390,234 Q370,239 334,235 Z" fill="#222"/>

  <!-- crank, chainring, spindle -->
  <g>
    <circle cx="390" cy="340" r="16" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="3 2"/>
    <line x1="362" y1="340" x2="418" y2="340" stroke="#9a9a9a" stroke-width="6" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0 390 340" to="360 390 340" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <circle cx="390" cy="340" r="6" fill="#555"/>
  <circle cx="390" cy="340" r="2.5" fill="#ccc"/>

  <!-- pelican tail and body -->
  <path d="M300,192 L244,212 L250,224 L303,214 Z" fill="#4d4136"/>
  <path d="M296,200 L252,226 L262,230 L304,216 Z" fill="#3b3128"/>
  <ellipse cx="340" cy="195" rx="58" ry="33" transform="rotate(-15 340 195)" fill="#7a6a58"/>
  <ellipse cx="352" cy="205" rx="40" ry="20" transform="rotate(-15 352 205)" fill="#8d7c68"/>
  <ellipse cx="318" cy="190" rx="34" ry="20" transform="rotate(-15 318 190)" fill="#5b4e41"/>

  <!-- near leg -->
  <path d="M355,225 L418,259.9 L418,340" fill="none" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M355,225 L418,259.9 L418,340;
      M355,225 L407.4,274.3 L414.2,354;
      M355,225 L395.2,284.7 L404,364.2;
      M355,225 L389.8,288 L390,368;
      M355,225 L393.1,286 L376,364.2;
      M355,225 L399.7,281.5 L365.7,354;
      M355,225 L407.6,274.2 L362,340;
      M355,225 L415.8,263.6 L365.7,326;
      M355,225 L422.4,250.5 L376,315.7;
      M355,225 L425.4,240.3 L390,312;
      M355,225 L425.7,238.6 L404,315.7;
      M355,225 L423.6,246.5 L414.2,326;
      M355,225 L418,259.9 L418,340"/>
  </path>
  <circle cx="355" cy="224" r="14" fill="#7a6a58"/>
  <g>
    <rect x="-11" y="3" width="24" height="5" rx="2" fill="#111"/>
    <path d="M-6,-6 Q10,-4 16,2 L14,5 L-6,3 Z" fill="#3a3a3a"/>
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M418,340 A28,28 0 1 1 362,340 A28,28 0 1 1 418,340"/>
  </g>

  <!-- wing reaching to handlebar -->
  <path d="M350,175 Q328,215 360,216 Q450,236 541,213 L543,202 Q450,216 395,178 Z" fill="#6b5a48"/>
  <path d="M360,200 Q440,230 538,208" fill="none" stroke="#4a3d31" stroke-width="3" stroke-linecap="round"/>
  <circle cx="541" cy="207" r="7" fill="#4a3d31"/>

  <!-- neck -->
  <path d="M380,185 Q410,170 405,140 Q400,118 435,112" fill="none" stroke="#f1ece0" stroke-width="22" stroke-linecap="round"/>
  <path d="M372,184 Q397,170 394,142 Q390,122 424,106" fill="none" stroke="#5a3b27" stroke-width="8" stroke-linecap="round"/>

  <!-- head and bill -->
  <circle cx="440" cy="110" r="15" fill="#f4efe2"/>
  <ellipse cx="437" cy="99" rx="12" ry="8" fill="#e8d36a"/>
  <path d="M452,102 L546,121 Q551,123 547,128 L452,118 Z" fill="#b3a58f"/>
  <path d="M452,117 Q498,142 543,127 L452,120 Z" fill="#8e7f6b"/>
  <path d="M538,120 Q552,123 547,135 Q543,128 536,127 Z" fill="#4a3d31"/>
  <circle cx="447" cy="107" r="3" fill="#fff"/>
  <circle cx="448" cy="107" r="2" fill="#111"/>
</svg>