<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Coastal / Scenic Background Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="60%" stop-color="#00f2fe"/>
      <stop offset="85%" stop-color="#ffecd2"/>
      <stop offset="100%" stop-color="#fcb69f"/>
    </linearGradient>

    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b7b9d"/>
      <stop offset="100%" stop-color="#0f4c64"/>
    </linearGradient>

    <!-- Metallic & Bicycle Gradients -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4e50"/>
      <stop offset="100%" stop-color="#f9d423"/>
    </linearGradient>

    <linearGradient id="chromeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9e9e9e"/>
    </linearGradient>

    <linearGradient id="tireGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="50%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>

    <!-- Pelican Anatomy Gradients -->
    <linearGradient id="pelicanBodyGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#795548"/>
      <stop offset="45%" stop-color="#4e342e"/>
      <stop offset="100%" stop-color="#2d1d18"/>
    </linearGradient>

    <linearGradient id="neckGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="40%" stop-color="#2c1b18"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#efebe9"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="60%" stop-color="#e64a19"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>

    <linearGradient id="billGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="55%" stop-color="#b0bec5"/>
      <stop offset="85%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>

    <!-- Wheel Definition (Diameter: 220px, Axle center at 0,0) -->
    <g id="bicycle-wheel">
      <!-- Outer Tire & Rim -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="url(#tireGrad)" stroke-width="14"/>
      <circle cx="0" cy="0" r="102" fill="none" stroke="#607d8b" stroke-width="3"/>
      <circle cx="0" cy="0" r="99" fill="none" stroke="#cfd8dc" stroke-width="2"/>
      <!-- Spokes (16 spokes spaced evenly) -->
      <g stroke="#eceff1" stroke-width="1.6" opacity="0.85">
        <line x1="0" y1="-99" x2="0" y2="99"/>
        <line x1="-99" y1="0" x2="99" y2="0"/>
        <line x1="-70" y1="-70" x2="70" y2="70"/>
        <line x1="-70" y1="70" x2="70" y2="-70"/>
        <line x1="-91.4" y1="-37.9" x2="91.4" y2="37.9"/>
        <line x1="-37.9" y1="-91.4" x2="37.9" y2="91.4"/>
        <line x1="-91.4" y1="37.9" x2="91.4" y2="-37.9"/>
        <line x1="-37.9" y1="91.4" x2="37.9" y2="-91.4"/>
      </g>
      <!-- Center Hub -->
      <circle cx="0" cy="0" r="12" fill="url(#chromeGrad)"/>
      <circle cx="0" cy="0" r="5" fill="#263238"/>
      <!-- Tire Valve -->
      <rect x="75" y="-3" width="8" height="6" fill="#ffd54f" rx="1"/>
    </g>

    <style><![CDATA[
      /* CSS Keyframe Animations */
      @keyframes wheelRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes crankRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes counterRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }

      /* Pelican Body & Head Bobs */
      @keyframes pelicanBob {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25% { transform: translateY(-3px) rotate(0.4deg); }
        50% { transform: translateY(2px) rotate(-0.3deg); }
        75% { transform: translateY(-2px) rotate(0.2deg); }
      }

      @keyframes pouchSway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-3deg); }
      }

      /* Synchronized Pedaling Leg Cycles (Bottom Bracket at X:490, Y:535) */
      /* Left/Far Leg */
      @keyframes leftThighMove {
        0% { transform: rotate(18deg); }
        25% { transform: rotate(40deg); }
        50% { transform: rotate(26deg); }
        75% { transform: rotate(5deg); }
        100% { transform: rotate(18deg); }
      }

      @keyframes leftLowerLegMove {
        0% { transform: rotate(-30deg); }
        25% { transform: rotate(-44deg); }
        50% { transform: rotate(-24deg); }
        75% { transform: rotate(-6deg); }
        100% { transform: rotate(-30deg); }
      }

      /* Right/Near Leg (180 degrees out of phase with Left) */
      @keyframes rightThighMove {
        0% { transform: rotate(26deg); }
        25% { transform: rotate(5deg); }
        50% { transform: rotate(18deg); }
        75% { transform: rotate(40deg); }
        100% { transform: rotate(26deg); }
      }

      @keyframes rightLowerLegMove {
        0% { transform: rotate(-24deg); }
        25% { transform: rotate(-6deg); }
        50% { transform: rotate(-30deg); }
        75% { transform: rotate(-44deg); }
        100% { transform: rotate(-24deg); }
      }

      /* Road Motion Effect */
      @keyframes roadDash {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }

      /* Classes applied to animating elements */
      .spin-rear {
        transform-origin: 240px 535px;
        animation: wheelRotate 1.25s linear infinite;
      }

      .spin-front {
        transform-origin: 760px 535px;
        animation: wheelRotate 1.25s linear infinite;
      }

      .crank-assembly {
        transform-origin: 490px 535px;
        animation: crankRotate 1.25s linear infinite;
      }

      .pedal-keep-level {
        animation: counterRotate 1.25s linear infinite;
      }

      .pedal-l {
        transform-origin: 490px 480px;
      }

      .pedal-r {
        transform-origin: 490px 590px;
      }

      .pelican-rider {
        animation: pelicanBob 1.25s ease-in-out infinite;
        transform-origin: 410px 340px;
      }

      .pelican-throat {
        animation: pouchSway 1.25s ease-in-out infinite;
        transform-origin: 645px 190px;
      }

      .left-thigh-group {
        transform-origin: 420px 395px;
        animation: leftThighMove 1.25s ease-in-out infinite;
      }

      .left-lower-leg {
        transform-origin: 450px 485px;
        animation: leftLowerLegMove 1.25s ease-in-out infinite;
      }

      .right-thigh-group {
        transform-origin: 425px 395px;
        animation: rightThighMove 1.25s ease-in-out infinite;
      }

      .right-lower-leg {
        transform-origin: 455px 485px;
        animation: rightLowerLegMove 1.25s ease-in-out infinite;
      }

      .moving-stripe {
        stroke-dasharray: 40 30;
        animation: roadDash 0.8s linear infinite;
      }
    ]]></style>
  </defs>

  <!-- BACKGROUND: Sky, Coastline & Ground -->
  <rect width="1000" height="700" fill="url(#skyGrad)"/>
  
  <!-- Distant Ocean & Sun Glow -->
  <circle cx="850" cy="220" r="90" fill="#fff9c4" opacity="0.45"/>
  <path d="M0 430 Q280 410 550 425 T1000 420 L1000 500 L0 500 Z" fill="url(#seaGrad)"/>

  <!-- Pier / Boardwalk Roadway -->
  <rect x="0" y="500" width="1000" height="200" fill="#422918"/>
  <rect x="0" y="500" width="1000" height="15" fill="#795548"/>
  <rect x="0" y="515" width="1000" height="185" fill="#3e2723"/>

  <!-- Speed Marks / Plank Lines on Boardwalk -->
  <line x1="0" y1="645" x2="1000" y2="645" stroke="#ffb74d" stroke-width="4" opacity="0.4" class="moving-stripe"/>
  <line x1="0" y1="520" x2="1000" y2="520" stroke="#271611" stroke-width="3"/>
  <line x1="0" y1="695" x2="1000" y2="695" stroke="#1d0f0c" stroke-width="8"/>

  <!-- BICYCLE AND RIDER LAYER -->
  <g id="bicycle-and-pelican">

    <!-- FAR SIDE / LEFT LEG (Behind the bicycle frame) -->
    <g id="far-leg" opacity="0.92">
      <!-- Hip anchor at (420, 395) -->
      <g class="left-thigh-group">
        <!-- Far Thigh / Feathered Fluff -->
        <path d="M410 380 Q435 375 450 435 Q455 470 450 485 Q435 480 420 440 Z" fill="#3e2723"/>
        <!-- Far Knee & Lower Leg -->
        <g class="left-lower-leg">
          <!-- Shank / Bone -->
          <line x1="450" y1="485" x2="480" y2="560" stroke="#e65100" stroke-width="9" stroke-linecap="round"/>
          <line x1="450" y1="485" x2="480" y2="560" stroke="#f57c00" stroke-width="5" stroke-linecap="round"/>
          <!-- Big Webbed Pelican Foot pinned near Far Pedal -->
          <path d="M472 555 L518 565 L508 580 L465 572 Z" fill="#ef6c00"/>
          <path d="M480 560 L522 570" stroke="#ffe0b2" stroke-width="1.5"/>
        </g>
      </g>
    </g>

    <!-- FAR PEDAL & FAR CRANK ARM (Rotates around BB at 490, 535, 180 deg offset) -->
    <g class="crank-assembly">
      <!-- Far Crank Arm (points upwards to 490, 480 when main is down) -->
      <line x1="490" y1="535" x2="490" y2="480" stroke="#90a4ae" stroke-width="9" stroke-linecap="round"/>
      <circle cx="490" cy="480" r="5" fill="#37474f"/>
      <!-- Far Pedal Platform -->
      <g class="pedal-keep-level pedal-l">
        <rect x="474" y="475" width="32" height="10" rx="3" fill="#263238" stroke="#eceff1" stroke-width="1.5"/>
        <line x1="479" y1="480" x2="501" y2="480" stroke="#ff9800" stroke-width="2"/>
      </g>
    </g>

    <!-- REAR WHEEL (Center: 240, 535) -->
    <g class="spin-rear">
      <use href="#bicycle-wheel" x="240" y="535"/>
    </g>

    <!-- FRONT WHEEL (Center: 760, 535) -->
    <g class="spin-front">
      <use href="#bicycle-wheel" x="760" y="535"/>
    </g>

    <!-- BICYCLE FRAMEWORK -->
    <!-- Rear Dropouts (240, 535), Bottom Bracket (490, 535), Seat Cluster (395, 360), Headtube Top (680, 310), Fork Crown/Dropouts (760, 535) -->
    <g id="bicycle-frame">
      <!-- Rear Dropouts / Wheel stays -->
      <line x1="240" y1="535" x2="490" y2="535" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round"/> <!-- Chain stay -->
      <line x1="240" y1="535" x2="395" y2="360" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/> <!-- Seat stay -->

      <!-- Main Triangle Tubes -->
      <line x1="490" y1="535" x2="395" y2="360" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/> <!-- Seat tube -->
      <line x1="490" y1="535" x2="680" y2="340" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/> <!-- Down tube -->
      <line x1="395" y1="360" x2="670" y2="320" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/> <!-- Top tube -->

      <!-- Front Fork & Headtube -->
      <line x1="685" y1="305" x2="670" y2="345" stroke="#37474f" stroke-width="15" stroke-linecap="round"/> <!-- Head tube -->
      <line x1="675" y1="335" x2="760" y2="535" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round"/> <!-- Front Fork -->

      <!-- Bottom Bracket Shell Outer Accent -->
      <circle cx="490" cy="535" r="16" fill="#263238" stroke="url(#chromeGrad)" stroke-width="3"/>

      <!-- Chainring (Large Front Sprocket) -->
      <circle cx="490" cy="535" r="32" fill="none" stroke="url(#chromeGrad)" stroke-width="5" stroke-dasharray="8 3"/>
      <circle cx="490" cy="535" r="23" fill="none" stroke="#78909c" stroke-width="3"/>
      <!-- Bicycle Chain -->
      <path d="M240 523 L490 505 A32 32 0 0 1 520 545 L240 547" fill="none" stroke="#263238" stroke-width="4" stroke-dasharray="5 3"/>

      <!-- Seatpost and Saddle -->
      <line x1="395" y1="360" x2="410" y2="320" stroke="url(#chromeGrad)" stroke-width="9" stroke-linecap="round"/>
      <!-- Saddle (Pelican sits comfortably here) -->
      <path d="M370 320 C380 305 440 305 450 323 C430 330 395 332 370 320 Z" fill="#212121" stroke="#424242" stroke-width="2"/>
      <path d="M366 322 Q372 313 392 313 L435 315 Q455 320 445 328 Q410 326 366 322 Z" fill="#37474f"/>

      <!-- Handlebar Stem & Swept Cruiser Bars -->
      <line x1="685" y1="305" x2="692" y2="260" stroke="url(#chromeGrad)" stroke-width="9" stroke-linecap="round"/>
      <!-- Curved Handlebar -->
      <path d="M692 260 Q685 240 660 248 Q640 255 645 270" fill="none" stroke="url(#chromeGrad)" stroke-width="7" stroke-linecap="round"/>
      <!-- Handle Grips -->
      <rect x="638" y="260" width="16" height="12" rx="4" fill="#ff7043" transform="rotate(-15 646 266)"/>
    </g>

    <!-- PELICAN BODY & HEAD (Seated on saddle at 410, 315, hands on handlebar at 645, 265) -->
    <g class="pelican-rider">
      <!-- Pelican Tail Feathers -->
      <path d="M320 340 Q350 330 380 345 Q340 365 315 352 Z" fill="#3e2723"/>
      <path d="M305 348 Q345 340 375 358 Q335 378 305 348 Z" fill="#271611"/>

      <!-- Torso / Barrel Chest -->
      <path d="M370 330 C360 270 410 240 480 255 C540 268 560 330 520 380 C480 415 400 410 370 330 Z" fill="url(#pelicanBodyGrad)"/>

      <!-- Folded Wing Details & Feathers -->
      <path d="M390 280 Q460 270 515 320 Q480 385 410 375 Q380 340 390 280 Z" fill="#5d4037" stroke="#3e2723" stroke-width="2"/>
      <path d="M410 305 C460 300 495 330 485 365 C450 372 425 355 410 305 Z" fill="#4e342e"/>
      <path d="M430 325 Q475 325 465 355" stroke="#8d6e63" stroke-width="2.5" fill="none"/>

      <!-- Pelican Arm / Wing Extended to Grips (Reaching to 645, 265) -->
      <path d="M480 285 Q570 260 635 262 Q650 264 645 273 Q620 285 540 310 Q495 315 480 285 Z" fill="#4e342e" stroke="#3e2723" stroke-width="1.5"/>
      <!-- Wingtip feathers wrapping handlebar grip -->
      <path d="M632 260 Q655 262 650 278 Q635 282 630 268 Z" fill="#ff7043" opacity="0.9"/>

      <!-- Graceful S-Curved Neck (California Brown Pelican characteristic) -->
      <!-- Back of neck is rich dark chestnut brown, front is creamy white -->
      <path d="M475 260 C465 200 520 150 565 140 C605 130 630 155 640 185 C650 215 625 240 595 245 C555 250 525 255 475 260 Z" fill="url(#neckGrad)"/>
      <path d="M525 220 C540 180 575 160 605 165 C625 180 625 210 590 235 C565 245 540 235 525 220 Z" fill="#f5f5f5"/>

      <!-- Pelican Head & Eye -->
      <g id="pelican-head">
        <!-- Crown (Straw-yellow wash characteristic of adult breeding Brown Pelican) -->
        <path d="M605 130 C635 125 660 145 665 170 C645 180 620 175 605 155 Z" fill="#fff59d"/>
        <path d="M615 132 Q640 128 655 145" stroke="#fbc02d" stroke-width="2" fill="none"/>

        <!-- Eye Patch and Eye -->
        <circle cx="642" cy="155" r="9" fill="#212121"/>
        <circle cx="642" cy="155" r="7" fill="#cfd8dc"/>
        <circle cx="643" cy="155" r="4" fill="#b71c1c"/> <!-- Reddish eye ring of California subspecies -->
        <circle cx="643" cy="155" r="2.5" fill="#000000"/>
        <circle cx="644" cy="154" r="0.9" fill="#ffffff"/> <!-- Sparkle -->

        <!-- Huge Pouch (Gular Pouch) with gentle sway animation -->
        <g class="pelican-throat">
          <path d="M650 178 C680 200 710 260 660 290 C625 310 605 255 615 220 C625 195 640 185 650 178 Z" fill="url(#pouchGrad)" opacity="0.95"/>
          <path d="M650 185 C675 215 680 265 650 280" fill="none" stroke="#d84315" stroke-width="2" opacity="0.6"/>
        </g>

        <!-- Long Bill / Beak -->
        <!-- Upper Bill -->
        <path d="M655 155 L815 188 C825 191 825 198 810 199 L655 182 Z" fill="url(#billGrad)" stroke="#b0bec5" stroke-width="1"/>
        <!-- Curved Hook at bill tip -->
        <path d="M815 188 Q826 193 821 202 Q813 203 810 198 Z" fill="#bf360c"/>
        <!-- Lower Mandible Edge -->
        <path d="M655 182 L810 199" stroke="#78909c" stroke-width="2"/>
      </g>
    </g>

    <!-- NEAR SIDE / RIGHT CRANK ARM & PEDAL (Rotates around BB at 490, 535) -->
    <g class="crank-assembly">
      <!-- Crank Arm (Points downwards to 490, 590 at start) -->
      <line x1="490" y1="535" x2="490" y2="590" stroke="url(#chromeGrad)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="490" cy="535" r="9" fill="#263238"/>
      <circle cx="490" cy="590" r="6" fill="#37474f"/>
      <!-- Near Pedal (Stays upright/horizontal while revolving) -->
      <g class="pedal-keep-level pedal-r">
        <rect x="470" y="584" width="38" height="12" rx="3.5" fill="#212121" stroke="#eceff1" stroke-width="1.8"/>
        <!-- Orange Pedal Safety Reflector -->
        <rect x="475" y="587" width="28" height="6" rx="2" fill="#ff9800"/>
      </g>
    </g>

    <!-- NEAR SIDE / RIGHT LEG (In front of frame & pedals) -->
    <g id="near-leg">
      <!-- Hip socket located at (425, 395) -->
      <g class="right-thigh-group">
        <!-- Thigh Fluff & Muscles -->
        <path d="M410 375 Q445 370 460 425 Q470 465 455 485 Q430 480 420 435 Z" fill="#4e342e" stroke="#2e1c14" stroke-width="1.5"/>
        <!-- Knee and Lower Leg -->
        <g class="right-lower-leg">
          <!-- Tarsus / Shank -->
          <line x1="455" y1="485" x2="490" y2="585" stroke="#e65100" stroke-width="11" stroke-linecap="round"/>
          <line x1="455" y1="485" x2="490" y2="585" stroke="#ffa726" stroke-width="5" stroke-linecap="round"/>
          <!-- Ankle Joint -->
          <circle cx="490" cy="585" r="7" fill="#bf360c"/>
          <!-- Large Webbed Pelican Foot gripping the pedal firmly -->
          <path d="M470 580 L525 583 L515 605 L465 596 Z" fill="#f57c00" stroke="#bf360c" stroke-width="1.5"/>
          <!-- Webbing details & claws -->
          <path d="M480 585 L525 588" stroke="#ffe082" stroke-width="2"/>
          <path d="M478 592 L520 598" stroke="#ffe082" stroke-width="2"/>
          <!-- Claws / Nails clutching pedal -->
          <circle cx="526" cy="584" r="2.5" fill="#212121"/>
          <circle cx="522" cy="599" r="2.5" fill="#212121"/>
          <circle cx="515" cy="606" r="2.5" fill="#212121"/>
        </g>
      </g>
    </g>

    <!-- BICYCLE ACCESSORIES: Vintage Bell & Front Reflector -->
    <!-- Front Reflector -->
    <circle cx="683" cy="355" r="9" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
    <circle cx="683" cy="355" r="6" fill="#fff59d"/>
    <!-- Dome Bell on Handlebar -->
    <path d="M668 245 A 9 9 0 0 1 684 242 Z" fill="#ffd700" stroke="#c5a059" stroke-width="1.5"/>
    <circle cx="676" cy="240" r="2" fill="#ffd700"/>

  </g>
</svg>