<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset="1" stop-color="#e6f5fb"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="690" cy="80" r="36" fill="#fff3b0"/>
  <rect x="0" y="420" width="800" height="80" fill="#d9c79a"/>
  <line x1="0" y1="422" x2="800" y2="422" stroke="#8a7650" stroke-width="3" stroke-dasharray="30 24">
    <animate attributeName="stroke-dashoffset" from="0" to="54" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="424" rx="230" ry="9" fill="#000" opacity="0.15"/>

  <!-- rear wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 240 350" to="360 240 350" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="240" cy="350" r="68" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="240" cy="350" r="62" fill="none" stroke="#9aa3aa" stroke-width="2"/>
    <g stroke="#b8c0c6" stroke-width="1.2">
      <line x1="178" y1="350" x2="302" y2="350"/>
      <line x1="178" y1="350" x2="302" y2="350" transform="rotate(30 240 350)"/>
      <line x1="178" y1="350" x2="302" y2="350" transform="rotate(60 240 350)"/>
      <line x1="178" y1="350" x2="302" y2="350" transform="rotate(90 240 350)"/>
      <line x1="178" y1="350" x2="302" y2="350" transform="rotate(120 240 350)"/>
      <line x1="178" y1="350" x2="302" y2="350" transform="rotate(150 240 350)"/>
    </g>
    <circle cx="240" cy="350" r="9" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="240" cy="350" r="5" fill="#444"/>
    <circle cx="298" cy="350" r="3.5" fill="#e03a2f"/>
  </g>

  <!-- front wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 555 350" to="360 555 350" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="555" cy="350" r="68" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="555" cy="350" r="62" fill="none" stroke="#9aa3aa" stroke-width="2"/>
    <g stroke="#b8c0c6" stroke-width="1.2">
      <line x1="493" y1="350" x2="617" y2="350"/>
      <line x1="493" y1="350" x2="617" y2="350" transform="rotate(30 555 350)"/>
      <line x1="493" y1="350" x2="617" y2="350" transform="rotate(60 555 350)"/>
      <line x1="493" y1="350" x2="617" y2="350" transform="rotate(90 555 350)"/>
      <line x1="493" y1="350" x2="617" y2="350" transform="rotate(120 555 350)"/>
      <line x1="493" y1="350" x2="617" y2="350" transform="rotate(150 555 350)"/>
    </g>
    <circle cx="555" cy="350" r="5" fill="#444"/>
    <circle cx="613" cy="350" r="3.5" fill="#e03a2f"/>
  </g>

  <!-- far crank and pedal (opposite phase) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 385 355" to="540 385 355" dur="2s" repeatCount="indefinite"/>
    <line x1="385" y1="355" x2="425" y2="355" stroke="#3a3f44" stroke-width="5" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 425 355" to="-540 425 355" dur="2s" repeatCount="indefinite"/>
      <rect x="415" y="352" width="20" height="6" rx="2" fill="#2b2b2b"/>
    </g>
  </g>

  <!-- far leg -->
  <path d="M350 238L413.1 299.3L345 355L357 355" fill="none" stroke="#2e2e2e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
M350 238L413.1 299.3L345 355L357 355;
M350 238L423.6 286.2L350.4 335L362.4 335;
M350 238L433.7 265.3L365 320.4L377 320.4;
M350 238L437.7 244.6L385 315L397 315;
M350 238L438 238.8L405 320.4L417 320.4;
M350 238L437.3 248.8L419.6 335L431.6 335;
M350 238L433 267.4L425 355L437 355;
M350 238L423 287.1L419.6 375L431.6 375;
M350 238L410.6 301.8L405 389.6L417 389.6;
M350 238L402.4 308.7L385 395L397 395;
M350 238L401.3 309.5L365 389.6L377 389.6;
M350 238L405.4 306.3L350.4 375L362.4 375;
M350 238L413.1 299.3L345 355L357 355"/>
  </path>

  <!-- seat post and saddle -->
  <line x1="350" y1="258" x2="348" y2="246" stroke="#3a3f44" stroke-width="5" stroke-linecap="round"/>
  <path d="M316 252 Q328 241 360 244 Q385 245 386 251 Q360 256 316 252Z" fill="#1f1f1f"/>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="385" y1="355" x2="350" y2="258"/>
    <line x1="350" y1="258" x2="502" y2="252"/>
    <line x1="385" y1="355" x2="509" y2="278"/>
    <line x1="350" y1="258" x2="240" y2="350"/>
    <line x1="385" y1="355" x2="240" y2="350"/>
    <line x1="500" y1="245" x2="512" y2="282"/>
  </g>
  <!-- fork -->
  <line x1="512" y1="282" x2="555" y2="350" stroke="#8d2a20" stroke-width="6" stroke-linecap="round"/>
  <!-- steerer, stem and handlebar -->
  <g fill="none" stroke="#3a3f44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 245 L496 228 L512 224" stroke-width="5"/>
    <path d="M512 224 Q530 224 532 238 Q533 250 521 253" stroke-width="5"/>
  </g>
  <circle cx="385" cy="355" r="7" fill="#333"/>

  <!-- chain -->
  <g stroke="#2a2a2a" stroke-width="2">
    <line x1="385" y1="338" x2="240" y2="341"/>
    <line x1="385" y1="372" x2="240" y2="359"/>
  </g>

  <!-- near crank, chainring and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 355" to="360 385 355" dur="2s" repeatCount="indefinite"/>
    <circle cx="385" cy="355" r="17" fill="none" stroke="#2a2a2a" stroke-width="3" stroke-dasharray="4 2"/>
    <line x1="385" y1="355" x2="425" y2="355" stroke="#555b61" stroke-width="5" stroke-linecap="round"/>
    <circle cx="385" cy="355" r="4" fill="#999"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 425 355" to="-360 425 355" dur="2s" repeatCount="indefinite"/>
      <rect x="415" y="352" width="20" height="6" rx="2" fill="#1d1d1d"/>
    </g>
  </g>

  <!-- near leg -->
  <path d="M350 238L433 267.4L425 355L437 355" fill="none" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
M350 238L433 267.4L425 355L437 355;
M350 238L423 287.1L419.6 375L431.6 375;
M350 238L410.6 301.8L405 389.6L417 389.6;
M350 238L402.4 308.7L385 395L397 395;
M350 238L401.3 309.5L365 389.6L377 389.6;
M350 238L405.4 306.3L350.4 375L362.4 375;
M350 238L413.1 299.3L345 355L357 355;
M350 238L423.6 286.2L350.4 335L362.4 335;
M350 238L433.7 265.3L365 320.4L377 320.4;
M350 238L437.7 244.6L385 315L397 315;
M350 238L438 238.8L405 320.4L417 320.4;
M350 238L437.3 248.8L419.6 335L431.6 335;
M350 238L433 267.4L425 355L437 355"/>
  </path>

  <!-- pelican body -->
  <path d="M305 192 L252 176 L260 202 L306 214Z" fill="#4e4032"/>
  <ellipse cx="350" cy="207" rx="60" ry="34" transform="rotate(18 350 207)" fill="#7d6d5a"/>
  <ellipse cx="388" cy="216" rx="28" ry="21" fill="#d9ceb2"/>
  <ellipse cx="342" cy="205" rx="40" ry="17" transform="rotate(18 342 205)" fill="#5f5041"/>

  <!-- neck and head -->
  <path d="M392 205 C415 200 395 170 420 160" fill="none" stroke="#f1e8cb" stroke-width="20" stroke-linecap="round"/>
  <path d="M384 197 C402 190 384 165 410 150" fill="none" stroke="#5a3d2b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="428" cy="152" r="15" fill="#f5ecc8"/>
  <path d="M414 146 Q428 130 442 144 Q430 140 414 146Z" fill="#f0d36a"/>
  <path d="M440 146 L512 166 Q515 171 508 172 L440 162Z" fill="#a8977a"/>
  <path d="M441 160 Q475 200 508 172Z" fill="#8c7a60"/>
  <path d="M500 164 L512 166 Q515 171 508 172 L498 170Z" fill="#c8402f"/>
  <circle cx="436" cy="147" r="2.8" fill="#111"/>
  <circle cx="437" cy="146" r="0.9" fill="#fff"/>

  <!-- wing reaching the handlebar -->
  <path d="M378 196 Q440 218 518 225" fill="none" stroke="#6b4a32" stroke-width="14" stroke-linecap="round"/>
  <path d="M378 196 Q440 218 518 225" fill="none" stroke="#8a6a4e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="518" cy="225" r="6" fill="#3a2a1e"/>
</svg>