<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8ee"/>
      <stop offset="1" stop-color="#dff3fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g stroke="#9aa0a6" stroke-width="1.2">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(22.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(45)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(67.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(112.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(135)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-58" r="3.5" fill="#e63946"/>
      <circle r="7" fill="#666" stroke="#333" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="34" fill="#ffe27a" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="80" rx="46" ry="14"/>
    <ellipse cx="180" cy="70" rx="30" ry="14"/>
    <ellipse cx="520" cy="55" rx="40" ry="11"/>
    <ellipse cx="545" cy="47" rx="26" ry="11"/>
  </g>
  <rect x="0" y="424" width="800" height="56" fill="#5b5f66"/>
  <rect x="0" y="424" width="800" height="3" fill="#44474d"/>
  <line x1="0" y1="455" x2="800" y2="455" stroke="#f2f2f2" stroke-width="5" stroke-dasharray="40 80">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.33s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="426" rx="210" ry="6" fill="#000" opacity="0.25"/>

  <!-- rear wheel -->
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <!-- front wheel -->
  <g transform="translate(550,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far crank arm and pedal -->
  <g transform="translate(370,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="35" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(0,35)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="-180 0 0" to="-540 0 0" dur="2s" repeatCount="indefinite"/>
          <rect x="-9" y="-2.5" width="18" height="5" rx="2" fill="#1f1f1f"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2a2a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M345,240 L422.6,259.7 L370,320">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M345,240 L422.6,259.7 L370,320;
      M345,240 L423.9,253.4 L387.5,324.7;
      M345,240 L422.3,260.6 L400.3,337.5;
      M345,240 L416.5,275.8 L405,355;
      M345,240 L405.2,292.7 L400.3,372.5;
      M345,240 L391.1,305.4 L387.5,385.3;
      M345,240 L382.0,310.9 L370,390;
      M345,240 L382.0,310.9 L352.5,385.3;
      M345,240 L387.1,308.0 L339.7,372.5;
      M345,240 L395.2,302.3 L335,355;
      M345,240 L405.6,292.2 L339.7,337.5;
      M345,240 L416.2,276.4 L352.5,324.7;
      M345,240 L422.6,259.7 L370,320"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="2s" repeatCount="indefinite" values="370,320;387.5,324.7;400.3,337.5;405,355;400.3,372.5;387.5,385.3;370,390;352.5,385.3;339.7,372.5;335,355;339.7,337.5;352.5,324.7;370,320"/>
    <path d="M-5,-7 L17,-2 L17,1 L-5,0 Z" fill="#2a2a2a" stroke="#2a2a2a" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- chain -->
  <g stroke="#444" stroke-width="2" fill="none">
    <line x1="370" y1="341" x2="250" y2="344"/>
    <line x1="370" y1="369" x2="250" y2="356"/>
    <circle cx="250" cy="350" r="6" fill="#888"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M370,355 L250,350"/>
    <path d="M370,355 L342,258"/>
    <path d="M343,262 L250,350"/>
    <path d="M343,262 L498,246"/>
    <path d="M370,355 L508,280"/>
    <path d="M498,243 L508,282" stroke-width="8"/>
    <path d="M508,282 L550,350" stroke="#8a8f96" stroke-width="5"/>
  </g>
  <circle cx="370" cy="355" r="7" fill="#444"/>
  <!-- seat post -->
  <line x1="342" y1="258" x2="336" y2="248" stroke="#777" stroke-width="5" stroke-linecap="round"/>
  <!-- stem and handlebar -->
  <line x1="498" y1="244" x2="494" y2="226" stroke="#777" stroke-width="5" stroke-linecap="round"/>
  <path d="M486,226 Q514,218 530,224 Q540,230 534,243" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>

  <!-- near crank, chainring and pedal -->
  <g transform="translate(370,355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      <circle r="15" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="4 2"/>
      <line x1="0" y1="0" x2="0" y2="35" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(0,35)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="2s" repeatCount="indefinite"/>
          <rect x="-9" y="-2.5" width="18" height="5" rx="2" fill="#111"/>
        </g>
      </g>
    </g>
  </g>

  <!-- pelican tail and body -->
  <path d="M304,215 L258,240 L262,247 L312,236 Z" fill="#4d4036"/>
  <path d="M298,205 C296,172 335,158 378,168 C410,176 412,212 390,236 C372,254 322,256 304,230 Z" fill="#6f6154"/>
  <ellipse cx="372" cy="215" rx="22" ry="26" fill="#a39384" opacity="0.6"/>
  <!-- neck -->
  <path d="M388,182 C410,166 396,142 425,126" fill="none" stroke="#f4efe2" stroke-width="22" stroke-linecap="round"/>
  <path d="M379,179 C400,164 386,143 415,127" fill="none" stroke="#5a3e2a" stroke-width="6" stroke-linecap="round"/>
  <!-- head and bill -->
  <ellipse cx="436" cy="116" rx="20" ry="15" fill="#f4efe2"/>
  <ellipse cx="432" cy="106" rx="14" ry="7" fill="#f2d56b"/>
  <path d="M452,124 Q495,160 540,139 L452,128 Z" fill="#c9a66b"/>
  <path d="M450,108 L535,132 Q542,134 539,139 L450,124 Z" fill="#a89b86"/>
  <circle cx="538" cy="136" r="3" fill="#c0562f"/>
  <circle cx="443" cy="113" r="3.2" fill="#111"/>
  <circle cx="444" cy="112" r="1" fill="#fff"/>
  <!-- wing reaching handlebar -->
  <path d="M350,182 C400,168 470,184 526,214 L532,225 C470,212 410,224 372,228 Z" fill="#4d4036" stroke="#3a2f27" stroke-width="2" stroke-linejoin="round"/>
  <path d="M372,196 C410,192 450,196 490,208" fill="none" stroke="#6f6154" stroke-width="3" stroke-linecap="round"/>

  <!-- saddle -->
  <path d="M312,247 Q332,239 362,246 Q367,252 355,254 L318,254 Q309,253 312,247 Z" fill="#2e211b"/>

  <!-- near leg -->
  <path fill="none" stroke="#3b3b3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M345,240 L382.0,310.9 L370,390">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M345,240 L382.0,310.9 L370,390;
      M345,240 L382.0,310.9 L352.5,385.3;
      M345,240 L387.1,308.0 L339.7,372.5;
      M345,240 L395.2,302.3 L335,355;
      M345,240 L405.6,292.2 L339.7,337.5;
      M345,240 L416.2,276.4 L352.5,324.7;
      M345,240 L422.6,259.7 L370,320;
      M345,240 L423.9,253.4 L387.5,324.7;
      M345,240 L422.3,260.6 L400.3,337.5;
      M345,240 L416.5,275.8 L405,355;
      M345,240 L405.2,292.7 L400.3,372.5;
      M345,240 L391.1,305.4 L387.5,385.3;
      M345,240 L382.0,310.9 L370,390"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="2s" repeatCount="indefinite" values="370,390;352.5,385.3;339.7,372.5;335,355;339.7,337.5;352.5,324.7;370,320;387.5,324.7;400.3,337.5;405,355;400.3,372.5;387.5,385.3;370,390"/>
    <path d="M-5,-7 L17,-2 L17,1 L-5,0 Z" fill="#3b3b3b" stroke="#3b3b3b" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <ellipse cx="346" cy="235" rx="16" ry="12" fill="#6f6154"/>
</svg>