<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#b8b8b8" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(20)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(40)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(60)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(80)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(100)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(120)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(140)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(160)"/>
      </g>
      <circle cx="0" cy="-57" r="3.5" fill="#d62828"/>
      <circle r="7" fill="#666" stroke="#333" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#ffe27a"/>
  <rect y="423" width="800" height="57" fill="#cdb58a"/>
  <line x1="0" y1="423" x2="800" y2="423" stroke="#8a7550" stroke-width="3"/>

  <g stroke="#8a7550" stroke-width="4" stroke-linecap="round">
    <g>
      <line x1="0" y1="445" x2="40" y2="445"/>
      <line x1="120" y1="445" x2="160" y2="445"/>
      <line x1="240" y1="445" x2="280" y2="445"/>
      <line x1="360" y1="445" x2="400" y2="445"/>
      <line x1="480" y1="445" x2="520" y2="445"/>
      <line x1="600" y1="445" x2="640" y2="445"/>
      <line x1="720" y1="445" x2="760" y2="445"/>
      <line x1="840" y1="445" x2="880" y2="445"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <ellipse cx="400" cy="425" rx="190" ry="7" fill="#000" opacity="0.15"/>

  <!-- wheels -->
  <g transform="translate(250,350)">
    <g>
      <use href="#wheel"/>
      <circle r="10" fill="none" stroke="#444" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(550,350)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="2" stroke-dasharray="3 2">
    <line x1="385" y1="340" x2="250" y2="340"/>
    <line x1="385" y1="370" x2="250" y2="360"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#2a6f97" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="385" y1="355" x2="340" y2="256"/>
    <line x1="342" y1="263" x2="508" y2="252"/>
    <line x1="385" y1="355" x2="508" y2="256"/>
    <line x1="385" y1="355" x2="250" y2="350"/>
    <line x1="344" y1="266" x2="250" y2="350"/>
    <line x1="510" y1="256" x2="550" y2="350"/>
  </g>
  <line x1="505" y1="246" x2="512" y2="264" stroke="#1d4e6b" stroke-width="9" stroke-linecap="round"/>
  <g fill="none" stroke="#222" stroke-linecap="round" stroke-linejoin="round">
    <path d="M505 246 L502 226" stroke-width="5"/>
    <path d="M502 226 L520 222 Q541 219 543 232" stroke-width="5"/>
  </g>
  <circle cx="385" cy="355" r="7" fill="#444"/>

  <!-- far leg, crank and pedal -->
  <path fill="none" stroke="#2b2622" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M360 258 L405 309 L355 355">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
      values="M360 258 L405 309 L355 355;M360 258 L418.2 293.1 L363.8 333.8;M360 258 L426.7 271.3 L385 325;M360 258 L427.1 269.1 L406.2 333.8;M360 258 L421.4 287.3 L415 355;M360 258 L405.9 308.2 L406.2 376.2;M360 258 L393 317.5 L385 385;M360 258 L395.4 316 L363.8 376.2;M360 258 L405 309 L355 355"/>
  </path>
  <g transform="translate(385,355)">
    <g>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#444" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(30,0)">
        <g>
          <rect x="-10" y="-1.5" width="20" height="5" rx="1.5" fill="#333"/>
          <polygon points="-6,-7 13,-1 13,1.5 -6,1.5" fill="#2b2622"/>
          <animateTransform attributeName="transform" type="rotate" from="-180 0 0" to="-540 0 0" dur="1.2s" repeatCount="indefinite"/>
        </g>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- tail and body -->
  <path d="M305 205 L258 226 L306 236 Z" fill="#4a3d33"/>
  <ellipse cx="352" cy="214" rx="58" ry="38" fill="#7a6755" transform="rotate(-6 352 214)"/>
  <ellipse cx="372" cy="226" rx="38" ry="22" fill="#9a8672" opacity="0.7"/>
  <path d="M322 248 Q345 243 374 248 Q377 255 362 255 L326 254 Z" fill="#1f1f1f"/>

  <!-- near leg, crank, chainring and pedal -->
  <path fill="none" stroke="#3d342d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M360 258 L421.4 287.3 L415 355">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
      values="M360 258 L421.4 287.3 L415 355;M360 258 L405.9 308.2 L406.2 376.2;M360 258 L393 317.5 L385 385;M360 258 L395.4 316 L363.8 376.2;M360 258 L405 309 L355 355;M360 258 L418.2 293.1 L363.8 333.8;M360 258 L426.7 271.3 L385 325;M360 258 L427.1 269.1 L406.2 333.8;M360 258 L421.4 287.3 L415 355"/>
  </path>
  <g transform="translate(385,355)">
    <g>
      <circle r="15" fill="none" stroke="#555" stroke-width="3"/>
      <circle r="10" fill="none" stroke="#777" stroke-width="1"/>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#777" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(30,0)">
        <g>
          <rect x="-10" y="-1.5" width="20" height="5" rx="1.5" fill="#333"/>
          <polygon points="-6,-7 13,-1 13,1.5 -6,1.5" fill="#3d342d"/>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="1.2s" repeatCount="indefinite"/>
        </g>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>
  <circle cx="385" cy="355" r="4" fill="#222"/>

  <!-- neck and head -->
  <path d="M388 208 C415 205 405 170 428 150" fill="none" stroke="#efe9da" stroke-width="20" stroke-linecap="round"/>
  <path d="M380 196 C403 190 397 165 418 142" fill="none" stroke="#4b3a2e" stroke-width="7" stroke-linecap="round"/>
  <circle cx="436" cy="142" r="16" fill="#f4e8a6"/>
  <path d="M446 152 L527 175 Q495 205 448 164 Z" fill="#d3b48a" stroke="#a88a64" stroke-width="1"/>
  <path d="M446 134 L528 168 Q535 172 527 176 L446 152 Z" fill="#b49b7d" stroke="#8a7660" stroke-width="1"/>
  <circle cx="441" cy="137" r="4.5" fill="#fff"/>
  <circle cx="442" cy="137" r="2.6" fill="#111"/>

  <!-- wing gripping the handlebar -->
  <path d="M372 198 C420 200 480 214 532 222 L535 231 C480 236 420 240 380 232 Z" fill="#5f4e41" stroke="#3f3329" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#8a7665" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M400 207 C440 210 480 220 520 226"/>
    <path d="M395 220 C440 224 480 228 522 230"/>
  </g>
  <circle cx="536" cy="226" r="6" fill="#4a3d33"/>
</svg>