<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset="1" stop-color="#fdf1d6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#ffe27a" opacity="0.9"/>

  <g fill="#ffffff" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="1000 0" dur="40s" repeatCount="indefinite"/>
      <ellipse cx="100" cy="70" rx="45" ry="14"/>
      <ellipse cx="130" cy="58" rx="30" ry="14"/>
      <ellipse cx="75" cy="62" rx="26" ry="11"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="700 0" dur="55s" repeatCount="indefinite"/>
      <ellipse cx="400" cy="130" rx="40" ry="12"/>
      <ellipse cx="425" cy="120" rx="26" ry="12"/>
    </g>
  </g>

  <rect x="0" y="424" width="800" height="56" fill="#d9c08f"/>
  <line x1="0" y1="424" x2="800" y2="424" stroke="#8a7a60" stroke-width="3"/>
  <line x1="-140" y1="448" x2="940" y2="448" stroke="#b79d68" stroke-width="4" stroke-dasharray="70 70">
    <animate attributeName="stroke-dashoffset" from="0" to="140" dur="0.333s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="426" rx="200" ry="6" fill="#000" opacity="0.18"/>

  <!-- rear wheel -->
  <g transform="translate(230 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="78" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="70" fill="none" stroke="#b8b8b8" stroke-width="2.5"/>
      <g stroke="#9a9a9a" stroke-width="1.3">
        <line x1="-70" y1="0" x2="70" y2="0"/>
        <line x1="-60.6" y1="-35" x2="60.6" y2="35"/>
        <line x1="-35" y1="-60.6" x2="35" y2="60.6"/>
        <line x1="0" y1="-70" x2="0" y2="70"/>
        <line x1="35" y1="-60.6" x2="-35" y2="60.6"/>
        <line x1="60.6" y1="-35" x2="-60.6" y2="35"/>
      </g>
      <circle cx="0" cy="-66" r="3.5" fill="#ff8a00"/>
      <circle r="9" fill="none" stroke="#555" stroke-width="3"/>
      <circle r="5" fill="#444"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(570 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="78" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="70" fill="none" stroke="#b8b8b8" stroke-width="2.5"/>
      <g stroke="#9a9a9a" stroke-width="1.3">
        <line x1="-70" y1="0" x2="70" y2="0"/>
        <line x1="-60.6" y1="-35" x2="60.6" y2="35"/>
        <line x1="-35" y1="-60.6" x2="35" y2="60.6"/>
        <line x1="0" y1="-70" x2="0" y2="70"/>
        <line x1="35" y1="-60.6" x2="-35" y2="60.6"/>
        <line x1="60.6" y1="-35" x2="-60.6" y2="35"/>
      </g>
      <circle cx="0" cy="-66" r="3.5" fill="#ff8a00"/>
      <circle r="5" fill="#444"/>
    </g>
  </g>

  <!-- far crank, pedal and leg -->
  <g transform="translate(390 345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="1.8s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#555" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(40 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="540" to="180" dur="1.8s" repeatCount="indefinite"/>
          <rect x="-11" y="-3" width="22" height="6" rx="2" fill="#333"/>
        </g>
      </g>
    </g>
  </g>
  <path fill="none" stroke="#6a6a6a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M350,215 L426,280 L350,339 L366,339">
    <animate attributeName="d" dur="1.8s" repeatCount="indefinite" calcMode="linear" values="M350,215 L426,280 L350,339 L366,339;M350,215 L436.1,265.9 L355.4,319 L371.4,319;M350,215 L445.5,244.8 L370,304.4 L386,304.4;M350,215 L449.5,224.7 L390,299 L406,299;M350,215 L449.9,218.7 L410,304.4 L426,304.4;M350,215 L449.1,228.1 L424.6,319 L440.6,319;M350,215 L445,246.1 L430,339 L446,339;M350,215 L436.2,265.7 L424.6,359 L440.6,359;M350,215 L425.3,280.8 L410,373.6 L426,373.6;M350,215 L417.4,288.8 L390,379 L406,379;M350,215 L415.5,290.6 L370,373.6 L386,373.6;M350,215 L418.7,287.6 L355.4,359 L371.4,359;M350,215 L426,280 L350,339 L366,339"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="345" x2="346" y2="240"/>
    <line x1="347" y1="246" x2="536" y2="243"/>
    <line x1="390" y1="345" x2="540" y2="259"/>
    <line x1="390" y1="345" x2="230" y2="340"/>
    <line x1="347" y1="248" x2="230" y2="340"/>
    <line x1="535" y1="237" x2="542" y2="263"/>
    <path d="M542,263 Q556,300 570,340"/>
  </g>
  <line x1="346" y1="240" x2="344" y2="226" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M322,224 Q345,218 372,226 Q372,232 345,232 Q326,232 322,224 Z" fill="#2b2b2b"/>
  <g fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round">
    <path d="M535,237 L530,212" stroke-width="5"/>
    <path d="M522,210 L548,207 Q568,205 568,226" stroke-width="5"/>
    <path d="M552,207 L566,206" stroke="#111" stroke-width="8"/>
  </g>

  <!-- chain -->
  <g stroke="#444" stroke-width="2.5">
    <line x1="390" y1="327" x2="230" y2="331"/>
    <line x1="390" y1="363" x2="230" y2="349"/>
  </g>

  <!-- near crank, chainring, pedal -->
  <g transform="translate(390 345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <circle r="18" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="4 2"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#555" stroke-width="2"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#555" stroke-width="2"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#444" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(40 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.8s" repeatCount="indefinite"/>
          <rect x="-11" y="-3" width="22" height="6" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
    <circle r="6" fill="#777" stroke="#333" stroke-width="2"/>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#3a3a3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M350,215 L445,246.1 L430,339 L446,339">
    <animate attributeName="d" dur="1.8s" repeatCount="indefinite" calcMode="linear" values="M350,215 L445,246.1 L430,339 L446,339;M350,215 L436.2,265.7 L424.6,359 L440.6,359;M350,215 L425.3,280.8 L410,373.6 L426,373.6;M350,215 L417.4,288.8 L390,379 L406,379;M350,215 L415.5,290.6 L370,373.6 L386,373.6;M350,215 L418.7,287.6 L355.4,359 L371.4,359;M350,215 L426,280 L350,339 L366,339;M350,215 L436.1,265.9 L355.4,319 L371.4,319;M350,215 L445.5,244.8 L370,304.4 L386,304.4;M350,215 L449.5,224.7 L390,299 L406,299;M350,215 L449.9,218.7 L410,304.4 L426,304.4;M350,215 L449.1,228.1 L424.6,319 L440.6,319;M350,215 L445,246.1 L430,339 L446,339"/>
  </path>

  <!-- pelican tail and body -->
  <polygon points="284,182 236,212 250,226 292,212" fill="#5b4a3a"/>
  <ellipse cx="335" cy="190" rx="60" ry="38" transform="rotate(-12 335 190)" fill="#7d6b58"/>
  <ellipse cx="340" cy="206" rx="40" ry="18" transform="rotate(-12 340 206)" fill="#a8998a" opacity="0.75"/>

  <!-- neck and head -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 385 165;-3 385 165;0 385 165;3 385 165;0 385 165" dur="1.8s" repeatCount="indefinite"/>
    <path d="M372,172 Q408,168 400,140 Q394,116 428,110" fill="none" stroke="#fbf8f0" stroke-width="20" stroke-linecap="round"/>
    <path d="M364,164 Q392,152 386,138 Q380,114 412,100" fill="none" stroke="#5b4332" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="432" cy="108" r="15" fill="#fbf8f0"/>
    <ellipse cx="430" cy="97" rx="12" ry="6.5" transform="rotate(-8 430 97)" fill="#f2cf4f"/>
    <path d="M446,114 L526,134 Q500,172 456,138 Z" fill="#c8a06c" stroke="#8a6a40" stroke-width="1"/>
    <path d="M444,100 L526,126 Q534,129 528,134 L446,116 Z" fill="#8f8575" stroke="#6b6254" stroke-width="1"/>
    <circle cx="528" cy="130" r="3.5" fill="#d9772b"/>
    <circle cx="439" cy="106" r="3.2" fill="#1a1a1a"/>
    <circle cx="440" cy="105" r="1" fill="#fff"/>
  </g>

  <!-- wing reaching the handlebar -->
  <path d="M355,168 Q455,182 546,203 L556,213 Q450,214 350,196 Z" fill="#6b5744" stroke="#4a3a2c" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#4a3a2c" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M400,190 Q460,200 520,208"/>
    <path d="M380,196 Q450,206 530,212"/>
  </g>
  <circle cx="552" cy="208" r="6" fill="#4a3a2c"/>
</svg>