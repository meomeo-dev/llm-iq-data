<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8ff"/>
      <stop offset="1" stop-color="#fff0cf"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="65" fill="none" stroke="#b9b9b9" stroke-width="2"/>
      <g stroke="#8a8a8a" stroke-width="1.2">
        <line x1="-65" y1="0" x2="65" y2="0"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(22.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(45)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(67.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(90)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(112.5)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(135)"/>
        <line x1="-65" y1="0" x2="65" y2="0" transform="rotate(157.5)"/>
      </g>
      <rect x="-1.5" y="-64" width="3" height="9" fill="#e53935"/>
      <circle cx="0" cy="58" r="3" fill="#ffb300"/>
      <circle r="7" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="2 1.5"/>
      <circle r="5" fill="#666"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffd54f" opacity="0.9"/>
  <rect y="423" width="800" height="57" fill="#d9c9a3"/>
  <line x1="0" y1="423" x2="800" y2="423" stroke="#6b5b45" stroke-width="4"/>
  <line x1="-80" y1="445" x2="880" y2="445" stroke="#a8946b" stroke-width="4" stroke-dasharray="30 40">
    <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- wheels -->
  <g transform="translate(250 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(555 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far crank and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 380 355" to="540 380 355" dur="2s" repeatCount="indefinite"/>
    <line x1="380" y1="355" x2="420" y2="355" stroke="#4a4a4a" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(420 355)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#2b2b2b"/>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#5a554e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M360,240 L410.9,308.1 L340,355 L352,355">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M360,240 L410.9,308.1 L340,355 L352,355;
      M360,240 L422,298.2 L345.4,335 L357.4,335;
      M360,240 L434.9,280.2 L360,320.4 L372,320.4;
      M360,240 L443.1,258 L380,315 L392,315;
      M360,240 L444.6,248 L400,320.4 L412,320.4;
      M360,240 L443.6,255.1 L414.6,335 L426.6,335;
      M360,240 L438.7,272.1 L420,355 L432,355;
      M360,240 L428,291.1 L414.6,375 L426.6,375;
      M360,240 L413.8,305.8 L400,389.6 L412,389.6;
      M360,240 L403.2,313.2 L380,395 L392,395;
      M360,240 L400.3,314.8 L360,389.6 L372,389.6;
      M360,240 L403.5,313 L345.4,375 L357.4,375;
      M360,240 L410.9,308.1 L340,355 L352,355"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#d9442f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250,350 L380,355"/>
    <path d="M250,350 L352,258"/>
    <path d="M380,355 L352,258"/>
    <path d="M352,262 L518,254"/>
    <path d="M380,355 L524,274"/>
    <path d="M518,250 L528,278" stroke-width="8"/>
    <path d="M528,278 L555,350" stroke="#444"/>
    <path d="M352,258 L347,242" stroke="#333" stroke-width="5"/>
    <path d="M518,250 L512,228" stroke="#333" stroke-width="5"/>
    <path d="M500,226 L536,224 Q552,224 554,240" stroke="#333" stroke-width="5"/>
  </g>
  <circle cx="250" cy="350" r="5" fill="#333"/>
  <circle cx="555" cy="350" r="5" fill="#333"/>

  <!-- chain -->
  <g fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="4 2">
    <path d="M380,337 L250,343">
      <animate attributeName="stroke-dashoffset" from="0" to="-6" dur="0.25s" repeatCount="indefinite"/>
    </path>
    <path d="M250,357 L380,373">
      <animate attributeName="stroke-dashoffset" from="0" to="-6" dur="0.25s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- near crank, chainring, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 355" to="360 380 355" dur="2s" repeatCount="indefinite"/>
    <circle cx="380" cy="355" r="18" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="3 2.5"/>
    <line x1="380" y1="355" x2="420" y2="355" stroke="#2f2f2f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="380" cy="355" r="6" fill="#999" stroke="#333" stroke-width="2"/>
    <g transform="translate(420 355)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
        <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#1a1a1a"/>
      </g>
    </g>
  </g>

  <!-- pelican tail and body -->
  <polygon points="322,206 268,232 278,240 326,226" fill="#5e5040"/>
  <ellipse cx="362" cy="205" rx="50" ry="36" fill="#85735c" transform="rotate(-8 362 205)"/>
  <ellipse cx="396" cy="203" rx="19" ry="23" fill="#d8cfb8"/>
  <path d="M330,190 Q360,165 395,175" fill="none" stroke="#6b5a45" stroke-width="5" stroke-linecap="round"/>

  <!-- neck and head -->
  <path d="M400,196 Q432,186 426,160 Q423,142 444,138" fill="none" stroke="#f6f1de" stroke-width="20" stroke-linecap="round"/>
  <path d="M394,184 Q418,175 413,158 Q411,142 430,127" fill="none" stroke="#5b3a22" stroke-width="7" stroke-linecap="round"/>
  <circle cx="446" cy="133" r="15" fill="#f8f4e0"/>
  <ellipse cx="442" cy="123" rx="11" ry="7" fill="#f1d36a" transform="rotate(-10 442 123)"/>
  <path d="M457,142 Q495,180 541,151 L456,142 Z" fill="#a98563" stroke="#7a5a3c" stroke-width="1"/>
  <path d="M455,126 Q500,128 548,144 Q553,150 544,150 L456,142 Z" fill="#cdbd92" stroke="#8a7a55" stroke-width="1"/>
  <circle cx="452" cy="130" r="3" fill="#1a1a1a"/>
  <circle cx="453" cy="129" r="1" fill="#fff"/>

  <!-- saddle -->
  <path d="M328,240 Q350,233 376,238 Q378,246 362,246 L332,246 Q326,246 328,240 Z" fill="#3b2a1f"/>

  <!-- wing reaching handlebar -->
  <path d="M378,198 Q455,222 536,228" fill="none" stroke="#4f4234" stroke-width="13" stroke-linecap="round"/>
  <circle cx="538" cy="228" r="6" fill="#3a3026"/>

  <!-- near leg -->
  <path fill="none" stroke="#2d2d2d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M360,240 L438.7,272.1 L420,355 L432,355">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M360,240 L438.7,272.1 L420,355 L432,355;
      M360,240 L428,291.1 L414.6,375 L426.6,375;
      M360,240 L413.8,305.8 L400,389.6 L412,389.6;
      M360,240 L403.2,313.2 L380,395 L392,395;
      M360,240 L400.3,314.8 L360,389.6 L372,389.6;
      M360,240 L403.5,313 L345.4,375 L357.4,375;
      M360,240 L410.9,308.1 L340,355 L352,355;
      M360,240 L422,298.2 L345.4,335 L357.4,335;
      M360,240 L434.9,280.2 L360,320.4 L372,320.4;
      M360,240 L443.1,258 L380,315 L392,315;
      M360,240 L444.6,248 L400,320.4 L412,320.4;
      M360,240 L443.6,255.1 L414.6,335 L426.6,335;
      M360,240 L438.7,272.1 L420,355 L432,355"/>
  </path>
  <ellipse cx="362" cy="234" rx="17" ry="12" fill="#85735c"/>
</svg>