<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#b8b8b8" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(22.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(45)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(67.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(112.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(135)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#777" stroke="#444" stroke-width="2"/>
      <circle cx="0" cy="-65" r="2.5" fill="#e33"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe27a" opacity="0.9"/>
  <rect y="422" width="800" height="78" fill="#cdb98a"/>
  <rect y="422" width="800" height="4" fill="#9e8a5c"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-110 0" dur="0.3s" repeatCount="indefinite"/>
    <line x1="0" y1="450" x2="1100" y2="450" stroke="#a8935f" stroke-width="5" stroke-dasharray="60 50"/>
  </g>
  <ellipse cx="400" cy="424" rx="250" ry="8" fill="#000" opacity="0.18"/>

  <!-- wheels -->
  <g transform="translate(240,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(560,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- far leg -->
  <g transform="translate(350,240)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
        values="42.7 0 0;26.5 0 0;11.8 0 0;12.8 0 0;28.3 0 0;48.9 0 0;59.2 0 0;53.9 0 0;42.7 0 0"/>
      <line x1="0" y1="0" x2="78" y2="0" stroke="#2b2927" stroke-width="9" stroke-linecap="round"/>
      <circle cx="78" cy="0" r="5" fill="#2b2927"/>
      <g transform="translate(78,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
            values="84.6 0 0;104.3 0 0;106 0 0;88.1 0 0;60.7 0 0;33.8 0 0;30.8 0 0;56.5 0 0;84.6 0 0"/>
          <line x1="0" y1="0" x2="78" y2="0" stroke="#2b2927" stroke-width="7" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far crank + pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="180 390 355;540 390 355" dur="2s" repeatCount="indefinite"/>
    <line x1="390" y1="355" x2="420" y2="355" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(420,355)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-180 0 0;-540 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-11" y="-2.5" width="22" height="5" rx="2" fill="#222"/>
        <path d="M-7 1 Q-8 -8 0 -8 L12 -5 L26 -1 Q20 2 14 1 Q8 3 2 1Z" fill="#2b2927"/>
      </g>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="355" x2="240" y2="350" stroke="#c0392b" stroke-width="6"/>
    <line x1="355" y1="262" x2="240" y2="350" stroke="#c0392b" stroke-width="5"/>
    <line x1="390" y1="355" x2="352" y2="255" stroke="#c0392b" stroke-width="7"/>
    <line x1="352" y1="260" x2="522" y2="250" stroke="#c0392b" stroke-width="6"/>
    <line x1="390" y1="355" x2="527" y2="268" stroke="#c0392b" stroke-width="7"/>
    <line x1="521" y1="240" x2="530" y2="272" stroke="#8e2a20" stroke-width="9"/>
    <line x1="530" y1="272" x2="560" y2="350" stroke="#555" stroke-width="5"/>
    <line x1="352" y1="256" x2="348" y2="240" stroke="#666" stroke-width="5"/>
    <line x1="521" y1="240" x2="516" y2="222" stroke="#666" stroke-width="5"/>
    <path d="M512 222 L540 222 Q552 222 551 236" stroke="#333" stroke-width="5"/>
  </g>

  <!-- chain and rear cog -->
  <g stroke="#444" stroke-width="2">
    <line x1="390" y1="338" x2="240" y2="343"/>
    <line x1="390" y1="372" x2="240" y2="357"/>
  </g>
  <g transform="translate(240,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <circle r="7" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>
    </g>
  </g>

  <!-- saddle -->
  <path d="M322 243 Q345 238 372 244 Q376 250 366 251 L330 250 Q320 250 322 243Z" fill="#222"/>

  <!-- near leg -->
  <g transform="translate(350,240)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
        values="28.3 0 0;48.9 0 0;59.2 0 0;53.9 0 0;42.7 0 0;26.5 0 0;11.8 0 0;12.8 0 0;28.3 0 0"/>
      <line x1="0" y1="0" x2="78" y2="0" stroke="#3d3a38" stroke-width="9" stroke-linecap="round"/>
      <circle cx="78" cy="0" r="5" fill="#3d3a38"/>
      <g transform="translate(78,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2s" repeatCount="indefinite"
            values="60.7 0 0;33.8 0 0;30.8 0 0;56.5 0 0;84.6 0 0;104.3 0 0;106 0 0;88.1 0 0;60.7 0 0"/>
          <line x1="0" y1="0" x2="78" y2="0" stroke="#3d3a38" stroke-width="7" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near crank, chainring, pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 390 355;360 390 355" dur="2s" repeatCount="indefinite"/>
    <circle cx="390" cy="355" r="17" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>
    <circle cx="390" cy="355" r="12" fill="none" stroke="#666" stroke-width="2"/>
    <line x1="390" y1="355" x2="420" y2="355" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <circle cx="390" cy="355" r="5" fill="#999" stroke="#333" stroke-width="2"/>
    <g transform="translate(420,355)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="2s" repeatCount="indefinite"/>
        <rect x="-11" y="-2.5" width="22" height="5" rx="2" fill="#222"/>
        <path d="M-7 1 Q-8 -8 0 -8 L12 -5 L26 -1 Q20 2 14 1 Q8 3 2 1Z" fill="#3d3a38"/>
      </g>
    </g>
  </g>

  <!-- pelican tail and body -->
  <path d="M292 200 L238 222 L246 232 L295 226Z" fill="#5e4632"/>
  <ellipse cx="350" cy="205" rx="65" ry="38" transform="rotate(-10 350 205)" fill="#8a7058"/>
  <ellipse cx="365" cy="215" rx="42" ry="22" transform="rotate(-10 365 215)" fill="#b39c80"/>

  <!-- neck -->
  <path d="M385 195 C 420 185, 430 150, 465 150" fill="none" stroke="#f4eeda" stroke-width="20" stroke-linecap="round"/>
  <path d="M380 186 C 412 176 422 142 460 140" fill="none" stroke="#5b4030" stroke-width="5" stroke-linecap="round"/>

  <!-- head and bill -->
  <path d="M484 154 Q520 196 568 168 L482 156Z" fill="#cdb98f" stroke="#8c7a5a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M480 140 L566 162 Q571 166 566 169 L480 156Z" fill="#9a8c7c" stroke="#6e6256" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="472" cy="148" r="14" fill="#f4eeda"/>
  <ellipse cx="468" cy="138" rx="10" ry="6" fill="#f2d36b"/>
  <circle cx="476" cy="145" r="3" fill="#111"/>
  <circle cx="477" cy="144" r="1" fill="#fff"/>

  <!-- wing reaching handlebar -->
  <path d="M355 180 C 410 175 480 195 540 220 L534 230 C 470 222 410 225 360 225 Z" fill="#6b4f35"/>
  <path d="M400 190 C 440 190 490 205 530 218 L526 224 C 480 214 440 212 398 214 Z" fill="#a78b66"/>
  <path d="M500 210 L545 220 L536 232 L496 222Z" fill="#3b2b1e"/>
  <circle cx="540" cy="224" r="6" fill="#222"/>
</svg>