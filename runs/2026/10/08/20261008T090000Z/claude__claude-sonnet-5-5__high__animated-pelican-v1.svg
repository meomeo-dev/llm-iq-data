<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f2"/>
      <stop offset="1" stop-color="#e9f6fc"/>
    </linearGradient>
    <g id="wheelBody">
      <circle r="68" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="62" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#8a8a8a" stroke-width="1.2">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(22.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(45)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(67.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(90)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(112.5)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(135)"/>
        <line x1="-62" y1="0" x2="62" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="6" fill="#444"/>
      <rect x="55" y="-3" width="9" height="6" fill="#e03b3b"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="36" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="80" rx="48" ry="14"/>
    <ellipse cx="170" cy="68" rx="30" ry="12"/>
    <ellipse cx="520" cy="55" rx="44" ry="12"/>
  </g>
  <rect x="0" y="400" width="800" height="80" fill="#dcc99a"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#9c8a5a" stroke-width="3"/>
  <line x1="0" y1="425" x2="800" y2="425" stroke="#b49f6c" stroke-width="4" stroke-dasharray="60 50">
    <animate attributeName="stroke-dashoffset" from="0" to="440" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- far crank arm, pedal and leg -->
  <g transform="translate(385,335)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-38" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-38,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#333"/>
        </g>
      </g>
    </g>
  </g>
  <path d="M362,228 L441.1,239.5 L417.9,316 L434,319" fill="none" stroke="#3a322b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M362,228 L412.9,289.7 L347,335 L363,338;
      M362,228 L423.2,279.4 L352.1,316 L368,319;
      M362,228 L434.8,261.2 L366,302.1 L382,305;
      M362,228 L441.2,240 L385,297 L401,300;
      M362,228 L441.9,231.7 L404,302.1 L420,305;
      M362,228 L441.1,239.5 L417.9,316 L434,319;
      M362,228 L436.9,256.2 L423,335 L439,338;
      M362,228 L427.1,274.5 L417.9,354 L434,357;
      M362,228 L414.2,288.5 L404,367.9 L420,371;
      M362,228 L404.9,295.5 L385,373 L401,376;
      M362,228 L402.8,296.9 L366,367.9 L382,371;
      M362,228 L406.1,294.8 L352.1,354 L368,357;
      M362,228 L412.9,289.7 L347,335 L363,338"/>
  </path>

  <!-- wheels -->
  <g transform="translate(250,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use href="#wheelBody"/>
    </g>
  </g>
  <g transform="translate(550,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use href="#wheelBody"/>
    </g>
  </g>

  <!-- chain and sprockets -->
  <g stroke="#333" stroke-width="2.5">
    <line x1="385" y1="318" x2="250" y2="322"/>
    <line x1="385" y1="352" x2="250" y2="338"/>
  </g>
  <g transform="translate(250,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <circle r="9" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="3 2.5"/>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="330" x2="385" y2="335"/>
    <line x1="250" y1="330" x2="354" y2="230"/>
    <line x1="385" y1="335" x2="352" y2="225"/>
    <line x1="356" y1="232" x2="505" y2="220"/>
    <line x1="385" y1="335" x2="512" y2="245"/>
    <line x1="503" y1="212" x2="514" y2="248"/>
    <path d="M514,248 Q530,285 550,330" stroke="#555" stroke-width="6"/>
  </g>
  <!-- seat post, saddle -->
  <line x1="352" y1="225" x2="349" y2="210" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M325,208 Q348,202 378,207 Q382,214 372,216 Q345,217 328,216 Z" fill="#2b2b2b"/>
  <!-- stem and handlebar -->
  <line x1="503" y1="212" x2="500" y2="194" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <path d="M498,194 L526,192 Q542,192 541,210" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- chainring -->
  <g transform="translate(385,335)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="17" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="3 3"/>
      <circle r="12" fill="#999" stroke="#555" stroke-width="2"/>
    </g>
  </g>

  <!-- pelican -->
  <!-- tail -->
  <path d="M305,185 L268,205 L276,212 L300,208 L312,202 Z" fill="#5a3a1e"/>
  <!-- body -->
  <ellipse cx="350" cy="180" rx="55" ry="33" fill="#7a5230"/>
  <ellipse cx="372" cy="188" rx="30" ry="22" fill="#a77c4e"/>
  <!-- neck -->
  <path d="M385,172 Q412,152 398,128 Q390,108 420,100" fill="none" stroke="#f1e8cf" stroke-width="19" stroke-linecap="round"/>
  <path d="M372,160 Q398,138 386,122 Q380,104 408,92" fill="none" stroke="#5b3a1e" stroke-width="5" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="428" cy="98" r="15" fill="#f6eab4"/>
  <path d="M414,88 Q428,80 442,90 Q430,86 414,92 Z" fill="#6b4a2b"/>
  <circle cx="433" cy="94" r="3" fill="#1b1b1b"/>
  <circle cx="434" cy="93" r="1" fill="#ffffff"/>
  <!-- bill -->
  <path d="M438,92 L512,108 Q516,111 510,113 L438,104 Z" fill="#a99b7a"/>
  <path d="M440,104 Q478,138 510,113 Z" fill="#c9a46a"/>
  <path d="M506,106 Q516,106 514,114 Q510,112 506,112 Z" fill="#7a3a2a"/>
  <!-- wing reaching the handlebar -->
  <path d="M372,160 Q452,158 524,192" fill="none" stroke="#6b4a2b" stroke-width="14" stroke-linecap="round"/>
  <path d="M390,160 Q452,164 520,192" fill="none" stroke="#8b6538" stroke-width="5" stroke-linecap="round"/>
  <circle cx="525" cy="192" r="7" fill="#4a2f17"/>
  <!-- thigh feathers -->
  <ellipse cx="362" cy="214" rx="19" ry="15" fill="#7a5230"/>

  <!-- near crank arm and pedal -->
  <g transform="translate(385,335)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="38" y2="0" stroke="#666" stroke-width="6" stroke-linecap="round"/>
      <circle r="6" fill="#444"/>
      <g transform="translate(38,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <path d="M362,228 L436.9,256.2 L423,335 L439,338" fill="none" stroke="#3a322b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M362,228 L436.9,256.2 L423,335 L439,338;
      M362,228 L427.1,274.5 L417.9,354 L434,357;
      M362,228 L414.2,288.5 L404,367.9 L420,371;
      M362,228 L404.9,295.5 L385,373 L401,376;
      M362,228 L402.8,296.9 L366,367.9 L382,371;
      M362,228 L406.1,294.8 L352.1,354 L368,357;
      M362,228 L412.9,289.7 L347,335 L363,338;
      M362,228 L423.2,279.4 L352.1,316 L368,319;
      M362,228 L434.8,261.2 L366,302.1 L382,305;
      M362,228 L441.2,240 L385,297 L401,300;
      M362,228 L441.9,231.7 L404,302.1 L420,305;
      M362,228 L441.1,239.5 L417.9,316 L434,319;
      M362,228 L436.9,256.2 L423,335 L439,338"/>
  </path>
</svg>