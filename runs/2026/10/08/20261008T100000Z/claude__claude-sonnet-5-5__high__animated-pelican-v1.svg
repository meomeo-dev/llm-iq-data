<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="1" stop-color="#fdf1cf"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="90" rx="50" ry="16"/>
    <ellipse cx="185" cy="78" rx="34" ry="14"/>
    <ellipse cx="500" cy="60" rx="44" ry="13"/>
    <ellipse cx="530" cy="50" rx="28" ry="11"/>
  </g>
  <rect x="0" y="380" width="800" height="42" fill="#4fa3c7" opacity="0.55"/>

  <rect x="0" y="422" width="800" height="58" fill="#5d5d63"/>
  <g stroke="#e8e8e8" stroke-width="4" stroke-dasharray="40 40">
    <g>
      <line x1="-120" y1="452" x2="920" y2="452"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="0.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- rear wheel -->
  <g>
    <circle cx="240" cy="350" r="70" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="240" cy="350" r="64" fill="none" stroke="#aaa" stroke-width="2"/>
    <g stroke="#999" stroke-width="1">
      <line x1="176" y1="350" x2="304" y2="350"/>
      <line x1="176" y1="350" x2="304" y2="350" transform="rotate(22.5 240 350)"/>
      <line x1="176" y1="350" x2="304" y2="350" transform="rotate(45 240 350)"/>
      <line x1="176" y1="350" x2="304" y2="350" transform="rotate(67.5 240 350)"/>
      <line x1="176" y1="350" x2="304" y2="350" transform="rotate(90 240 350)"/>
      <line x1="176" y1="350" x2="304" y2="350" transform="rotate(112.5 240 350)"/>
      <line x1="176" y1="350" x2="304" y2="350" transform="rotate(135 240 350)"/>
      <line x1="176" y1="350" x2="304" y2="350" transform="rotate(157.5 240 350)"/>
    </g>
    <circle cx="240" cy="350" r="8" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 2"/>
    <circle cx="240" cy="350" r="5" fill="#888"/>
    <circle cx="240" cy="291" r="3" fill="#e63946"/>
    <animateTransform attributeName="transform" type="rotate" from="0 240 350" to="360 240 350" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- front wheel -->
  <g>
    <circle cx="540" cy="350" r="70" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="540" cy="350" r="64" fill="none" stroke="#aaa" stroke-width="2"/>
    <g stroke="#999" stroke-width="1">
      <line x1="476" y1="350" x2="604" y2="350"/>
      <line x1="476" y1="350" x2="604" y2="350" transform="rotate(22.5 540 350)"/>
      <line x1="476" y1="350" x2="604" y2="350" transform="rotate(45 540 350)"/>
      <line x1="476" y1="350" x2="604" y2="350" transform="rotate(67.5 540 350)"/>
      <line x1="476" y1="350" x2="604" y2="350" transform="rotate(90 540 350)"/>
      <line x1="476" y1="350" x2="604" y2="350" transform="rotate(112.5 540 350)"/>
      <line x1="476" y1="350" x2="604" y2="350" transform="rotate(135 540 350)"/>
      <line x1="476" y1="350" x2="604" y2="350" transform="rotate(157.5 540 350)"/>
    </g>
    <circle cx="540" cy="350" r="5" fill="#888"/>
    <circle cx="540" cy="291" r="3" fill="#e63946"/>
    <animateTransform attributeName="transform" type="rotate" from="0 540 350" to="360 540 350" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="240" y1="350" x2="375" y2="358"/>
    <line x1="349" y1="282" x2="375" y2="358"/>
    <line x1="352" y1="292" x2="240" y2="350"/>
    <line x1="355" y1="295" x2="502" y2="268"/>
    <line x1="375" y1="358" x2="506" y2="282"/>
    <line x1="500" y1="262" x2="507" y2="284" stroke-width="8"/>
    <line x1="507" y1="284" x2="540" y2="350" stroke="#8e2a20"/>
    <line x1="500" y1="262" x2="494" y2="240" stroke="#444" stroke-width="5"/>
    <path d="M486,240 L512,238 Q532,238 534,254" stroke="#333" stroke-width="5"/>
  </g>
  <line x1="351" y1="292" x2="349" y2="278" stroke="#444" stroke-width="5" stroke-linecap="round"/>

  <!-- chain -->
  <path d="M375,342 L240,342 M375,374 L240,358" stroke="#333" stroke-width="2" fill="none"/>

  <!-- saddle -->
  <path d="M322,283 Q345,275 372,281 Q375,288 366,289 L330,290 Q320,290 322,283 Z" fill="#222"/>

  <!-- far leg -->
  <g transform="translate(345,272)" stroke="#2f2a22" stroke-width="7" stroke-linecap="round" fill="none">
    <g>
      <animateTransform attributeName="transform" type="rotate" calcMode="linear" dur="1.6s" repeatCount="indefinite"
        keyTimes="0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1"
        values="-51.2;-63.6;-78.9;-90.8;-92.3;-84;-70.5;-55.3;-42.4;-36.5;-37.6;-42.8;-51.2"/>
      <line x1="0" y1="0" x2="0" y2="60"/>
      <g transform="translate(0,60)">
        <g>
          <animateTransform attributeName="transform" type="rotate" calcMode="linear" dur="1.6s" repeatCount="indefinite"
            keyTimes="0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1"
            values="94;110.2;119.4;117.8;106.3;88.7;69.2;51;39.3;41.4;55.7;74.8;94"/>
          <line x1="0" y1="0" x2="0" y2="66"/>
          <g transform="translate(0,66)">
            <g>
              <animateTransform attributeName="transform" type="rotate" calcMode="linear" dur="1.6s" repeatCount="indefinite"
                keyTimes="0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1"
                values="-42.8;-46.6;-40.5;-27;-14;-4.7;1.3;4.3;3.1;-4.9;-18.1;-32;-42.8"/>
              <path d="M-12,-4 L8,-4 L20,2 L8,5 L-12,5 Z" fill="#3b352b" stroke="none"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- crank, chainring, pedals -->
  <g>
    <circle cx="375" cy="358" r="16" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="3 2"/>
    <line x1="347" y1="358" x2="403" y2="358" stroke="#777" stroke-width="6" stroke-linecap="round"/>
    <circle cx="375" cy="358" r="6" fill="#444"/>
    <g>
      <rect x="394" y="355.5" width="18" height="5" rx="2" fill="#222"/>
      <animateTransform attributeName="transform" type="rotate" from="0 403 358" to="-360 403 358" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="338" y="355.5" width="18" height="5" rx="2" fill="#222"/>
      <animateTransform attributeName="transform" type="rotate" from="0 347 358" to="-360 347 358" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 375 358" to="360 375 358" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- near leg -->
  <g transform="translate(345,272)" stroke="#4a4033" stroke-width="7" stroke-linecap="round" fill="none">
    <g>
      <animateTransform attributeName="transform" type="rotate" calcMode="linear" dur="1.6s" repeatCount="indefinite"
        keyTimes="0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1"
        values="-70.5;-55.3;-42.4;-36.5;-37.6;-42.8;-51.2;-63.6;-78.9;-90.8;-92.3;-84;-70.5"/>
      <line x1="0" y1="0" x2="0" y2="60"/>
      <g transform="translate(0,60)">
        <g>
          <animateTransform attributeName="transform" type="rotate" calcMode="linear" dur="1.6s" repeatCount="indefinite"
            keyTimes="0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1"
            values="69.2;51;39.3;41.4;55.7;74.8;94;110.2;119.4;117.8;106.3;88.7;69.2"/>
          <line x1="0" y1="0" x2="0" y2="66"/>
          <g transform="translate(0,66)">
            <g>
              <animateTransform attributeName="transform" type="rotate" calcMode="linear" dur="1.6s" repeatCount="indefinite"
                keyTimes="0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1"
                values="1.3;4.3;3.1;-4.9;-18.1;-32;-42.8;-46.6;-40.5;-27;-14;-4.7;1.3"/>
              <path d="M-12,-4 L8,-4 L20,2 L8,5 L-12,5 Z" fill="#544a3b" stroke="none"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- pelican tail and body -->
  <path d="M290,238 L238,262 L252,232 Z" fill="#5f4d3a"/>
  <ellipse cx="328" cy="235" rx="56" ry="38" transform="rotate(-8 328 235)" fill="#8a7660"/>
  <ellipse cx="322" cy="232" rx="40" ry="22" transform="rotate(-8 322 232)" fill="#6c5a46"/>
  <g stroke="#52422f" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M290,236 Q320,244 350,232"/>
    <path d="M292,226 Q320,234 346,222"/>
  </g>

  <!-- neck -->
  <path d="M365,218 Q392,208 386,178 Q381,152 405,142" fill="none" stroke="#f4efe0" stroke-width="20" stroke-linecap="round"/>
  <path d="M358,214 Q380,200 374,176 Q368,150 394,134" fill="none" stroke="#5b3a1e" stroke-width="5" stroke-linecap="round"/>

  <!-- head and bill -->
  <circle cx="410" cy="138" r="16" fill="#f8f3df"/>
  <path d="M396,128 Q410,116 424,128 Q412,122 396,128 Z" fill="#f2d661"/>
  <path d="M420,146 Q468,190 507,156 L420,144 Z" fill="#b59a63"/>
  <path d="M418,130 L505,150 L509,156 L507,158 L420,147 Z" fill="#9a8f7a"/>
  <path d="M500,149 L511,155 L507,160 L500,156 Z" fill="#6e5f48"/>
  <circle cx="413" cy="134" r="4" fill="#fff"/>
  <circle cx="414" cy="134" r="2.5" fill="#111"/>

  <!-- wing reaching handlebar -->
  <path d="M352,222 Q430,236 514,238" fill="none" stroke="#5f4d3a" stroke-width="12" stroke-linecap="round"/>
  <path d="M352,222 Q430,236 514,238" fill="none" stroke="#7a664f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="516" cy="238" r="7" fill="#4a3c2c"/>
</svg>