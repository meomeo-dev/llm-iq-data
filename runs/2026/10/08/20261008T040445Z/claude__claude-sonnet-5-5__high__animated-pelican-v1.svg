<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#cfe8f5"/>
  <rect y="420" width="800" height="80" fill="#c9b98f"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#8a7b55" stroke-width="3"/>
  <line x1="0" y1="450" x2="1000" y2="450" stroke="#f5efdc" stroke-width="5" stroke-dasharray="50 50">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="0.32s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="424" rx="230" ry="7" fill="#000" opacity="0.15"/>

  <!-- rear wheel -->
  <g transform="translate(230,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="77" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#9a9a9a" stroke-width="2"/>
      <g stroke="#bdbdbd" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="9" fill="#777" stroke="#444" stroke-width="2"/>
      <circle r="6" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="3 2"/>
      <circle cx="0" cy="-67" r="3.5" fill="#d33"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(570,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <circle r="77" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#9a9a9a" stroke-width="2"/>
      <g stroke="#bdbdbd" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="8" fill="#777" stroke="#444" stroke-width="2"/>
      <circle cx="0" cy="-67" r="3.5" fill="#d33"/>
    </g>
  </g>

  <!-- far crank arm and pedal -->
  <g transform="translate(370,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-35" y2="0" stroke="#2c2c2c" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(-35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-13" y="-3.5" width="26" height="7" rx="2" fill="#1e1e1e"/>
        </g>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2f2f2f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M335,240 L392,304 L345,375 L359,375">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M335,240 L400,295 L335,350 L349,350;
      M335,240 L413,274 L345,325 L359,325;
      M335,240 L420,246 L370,315 L384,315;
      M335,240 L420,244 L395,325 L409,325;
      M335,240 L416,266 L405,350 L419,350;
      M335,240 L404,290 L395,375 L409,375;
      M335,240 L392,303 L370,385 L384,385;
      M335,240 L392,304 L345,375 L359,375;
      M335,240 L400,295 L335,350 L349,350"/>
  </path>

  <!-- chain -->
  <g stroke="#3a3a3a" stroke-width="2.5" fill="none">
    <line x1="370" y1="328" x2="230" y2="331"/>
    <line x1="370" y1="372" x2="230" y2="349"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="230" y1="340" x2="370" y2="350"/>
    <line x1="230" y1="340" x2="343" y2="247"/>
    <line x1="370" y1="350" x2="340" y2="232"/>
    <line x1="343" y1="249" x2="518" y2="243"/>
    <line x1="370" y1="350" x2="522" y2="258"/>
    <line x1="516" y1="236" x2="524" y2="268" stroke-width="9"/>
  </g>
  <line x1="524" y1="266" x2="570" y2="340" stroke="#777" stroke-width="6" stroke-linecap="round"/>
  <line x1="516" y1="236" x2="511" y2="213" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <path d="M502,213 L530,205 Q548,204 550,218" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="341" y1="240" x2="338" y2="226" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <circle cx="370" cy="350" r="10" fill="#555" stroke="#222" stroke-width="2"/>

  <!-- pelican tail and body -->
  <g transform="rotate(-18 345 200)">
    <path d="M292,196 L246,232 L296,224 Z" fill="#4d3a2a"/>
    <ellipse cx="345" cy="200" rx="62" ry="36" fill="#8a6d50"/>
    <ellipse cx="318" cy="195" rx="30" ry="20" fill="#6e5439"/>
    <ellipse cx="390" cy="204" rx="22" ry="26" fill="#efe9da"/>
  </g>

  <!-- saddle -->
  <path d="M314,227 Q342,220 374,227 L370,234 Q342,233 316,234 Z" fill="#222"/>

  <!-- neck and head -->
  <path d="M388,190 C425,185 405,140 440,125" fill="none" stroke="#f4efe4" stroke-width="20" stroke-linecap="round"/>
  <path d="M376,172 C408,166 392,130 428,110" fill="none" stroke="#5a4030" stroke-width="6" stroke-linecap="round"/>
  <circle cx="446" cy="115" r="16" fill="#f5ecc0"/>
  <path d="M432,108 Q446,92 460,106 Q448,100 432,108 Z" fill="#e8c84a"/>
  <path d="M460,124 Q495,172 546,141 L460,128 Z" fill="#cdb98a" stroke="#a89a78" stroke-width="1.5"/>
  <path d="M458,104 L552,134 Q556,140 546,141 L460,128 Z" fill="#a89a78"/>
  <circle cx="551" cy="137" r="3.5" fill="#d9632b"/>
  <circle cx="452" cy="110" r="3" fill="#111"/>
  <circle cx="453" cy="109" r="1" fill="#fff"/>

  <!-- wing arm to handlebar -->
  <path d="M372,192 Q455,228 536,208" fill="none" stroke="#6b4a2f" stroke-width="14" stroke-linecap="round"/>
  <path d="M380,196 Q455,230 532,212" fill="none" stroke="#8a6d50" stroke-width="5" stroke-linecap="round"/>
  <circle cx="538" cy="207" r="7" fill="#4d3a2a"/>

  <!-- near chainring and crank -->
  <g transform="translate(370,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="22" fill="none" stroke="#555" stroke-width="4"/>
      <circle r="22" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="4 3"/>
      <line x1="0" y1="0" x2="35" y2="0" stroke="#444" stroke-width="7" stroke-linecap="round"/>
      <circle r="6" fill="#777" stroke="#333" stroke-width="2"/>
      <g transform="translate(35,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-13" y="-3.5" width="26" height="7" rx="2" fill="#222"/>
        </g>
      </g>
    </g>
  </g>

  <!-- near leg -->
  <ellipse cx="338" cy="236" rx="16" ry="12" fill="#7a5f45"/>
  <path fill="none" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M335,240 L416,266 L405,350 L419,350">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear" values="
      M335,240 L416,266 L405,350 L419,350;
      M335,240 L404,290 L395,375 L409,375;
      M335,240 L392,303 L370,385 L384,385;
      M335,240 L392,304 L345,375 L359,375;
      M335,240 L400,295 L335,350 L349,350;
      M335,240 L413,274 L345,325 L359,325;
      M335,240 L420,246 L370,315 L384,315;
      M335,240 L420,244 L395,325 L409,325;
      M335,240 L416,266 L405,350 L419,350"/>
  </path>
</svg>