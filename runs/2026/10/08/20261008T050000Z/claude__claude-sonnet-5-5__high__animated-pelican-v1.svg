<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset="1" stop-color="#e6f5fb"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <rect y="430" width="800" height="70" fill="#e3cf9b"/>
  <line x1="0" y1="431" x2="800" y2="431" stroke="#b9a46c" stroke-width="3"/>

  <!-- FAR SIDE: crank arm, pedal, leg -->
  <path d="M350,243 L429.7,249.5 L370,310" fill="none" stroke="#2b2b2b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M350,243 L429.7,249.5 L370,310;
      M350,243 L430,240.3 L390,315.4;
      M350,243 L429.8,248.8 L404.6,330;
      M350,243 L426.4,266.6 L410,350;
      M350,243 L417.5,286 L404.6,370;
      M350,243 L405.1,301 L390,384.6;
      M350,243 L395.4,308.9 L370,390;
      M350,243 L392.3,310.9 L350,384.6;
      M350,243 L394.8,309.3 L335.4,370;
      M350,243 L401.6,304.2 L330,350;
      M350,243 L412.1,293.4 L335.4,330;
      M350,243 L424,273.5 L350,315.4;
      M350,243 L429.7,249.5 L370,310"/>
  </path>
  <g transform="translate(370,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(0,-40)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-11" y="5" width="22" height="4" rx="1.5" fill="#222"/>
          <path d="M-10,-4 Q0,-6 14,0 Q17,4 10,5 L-10,5 Z" fill="#2b2b2b"/>
        </g>
      </g>
    </g>
  </g>

  <!-- REAR WHEEL -->
  <g transform="translate(230,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <circle r="78" fill="none" stroke="#1e1e1e" stroke-width="7"/>
      <circle r="72" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.3">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-66" r="4" fill="#d33"/>
      <circle r="7" fill="#444"/>
      <circle r="3" fill="#ccc"/>
    </g>
  </g>

  <!-- FRONT WHEEL -->
  <g transform="translate(570,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <circle r="78" fill="none" stroke="#1e1e1e" stroke-width="7"/>
      <circle r="72" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.3">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-66" r="4" fill="#d33"/>
      <circle r="7" fill="#444"/>
      <circle r="3" fill="#ccc"/>
    </g>
  </g>

  <!-- CHAIN -->
  <g stroke="#333" stroke-width="2" stroke-dasharray="3 2" fill="none">
    <line x1="370" y1="332" x2="230" y2="343"/>
    <line x1="370" y1="368" x2="230" y2="357"/>
  </g>

  <!-- FRAME -->
  <g fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="230" y1="350" x2="370" y2="350"/>
    <line x1="230" y1="350" x2="343" y2="272"/>
    <line x1="370" y1="350" x2="343" y2="272"/>
    <line x1="343" y1="272" x2="516" y2="236"/>
    <line x1="370" y1="350" x2="524" y2="262"/>
    <line x1="514" y1="228" x2="524" y2="264" stroke-width="8"/>
    <line x1="520" y1="250" x2="570" y2="350" stroke="#8e2a20" stroke-width="5"/>
  </g>
  <!-- seat post, stem, handlebar -->
  <g fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="343" y1="272" x2="338" y2="252"/>
    <line x1="514" y1="228" x2="510" y2="200"/>
    <path d="M504,199 L530,198 Q548,198 551,214"/>
  </g>
  <path d="M526,198 L538,198" stroke="#111" stroke-width="8" stroke-linecap="round"/>

  <!-- chainring and hub -->
  <circle cx="370" cy="350" r="17" fill="none" stroke="#444" stroke-width="4"/>
  <circle cx="370" cy="350" r="6" fill="#888" stroke="#333" stroke-width="2"/>

  <!-- NEAR SIDE: crank arm, pedal -->
  <g transform="translate(370,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#777" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(0,40)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-11" y="5" width="22" height="4" rx="1.5" fill="#222"/>
          <path d="M-10,-4 Q0,-6 14,0 Q17,4 10,5 L-10,5 Z" fill="#3d3d3d"/>
        </g>
      </g>
    </g>
  </g>
  <circle cx="370" cy="350" r="4" fill="#222"/>

  <!-- NEAR LEG -->
  <path d="M350,243 L395.4,308.9 L370,390" fill="none" stroke="#3d3d3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M350,243 L395.4,308.9 L370,390;
      M350,243 L392.3,310.9 L350,384.6;
      M350,243 L394.8,309.3 L335.4,370;
      M350,243 L401.6,304.2 L330,350;
      M350,243 L412.1,293.4 L335.4,330;
      M350,243 L424,273.5 L350,315.4;
      M350,243 L429.7,249.5 L370,310;
      M350,243 L430,240.3 L390,315.4;
      M350,243 L429.8,248.8 L404.6,330;
      M350,243 L426.4,266.6 L410,350;
      M350,243 L417.5,286 L404.6,370;
      M350,243 L405.1,301 L390,384.6;
      M350,243 L395.4,308.9 L370,390"/>
  </path>
  <!-- near foot redrawn on top of leg end -->
  <g transform="translate(370,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <g transform="translate(0,40)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <path d="M-10,-4 Q0,-6 14,0 Q17,4 10,5 L-10,5 Z" fill="#3d3d3d"/>
        </g>
      </g>
    </g>
  </g>

  <!-- PELICAN TAIL AND BODY -->
  <path d="M282,214 L236,238 L252,222 L234,213 L282,204 Z" fill="#4a3a2e"/>
  <ellipse cx="335" cy="212" rx="68" ry="40" fill="#7d6b58" transform="rotate(-12 335 212)"/>
  <ellipse cx="350" cy="222" rx="46" ry="24" fill="#a08c74" transform="rotate(-12 350 222)"/>

  <!-- saddle -->
  <path d="M312,253 Q338,245 374,251 Q380,257 370,259 L318,260 Z" fill="#222"/>

  <!-- wing reaching to handlebar -->
  <path d="M352,188 Q440,176 528,196" fill="none" stroke="#5b4636" stroke-width="17" stroke-linecap="round"/>
  <path d="M352,188 Q440,176 528,196" fill="none" stroke="#7a6049" stroke-width="6" stroke-linecap="round"/>
  <path d="M300,200 Q330,170 370,190 Q345,230 300,226 Z" fill="#5b4636"/>

  <!-- neck -->
  <path d="M380,212 C416,206 394,160 430,134" fill="none" stroke="#f0ead8" stroke-width="20" stroke-linecap="round"/>
  <path d="M370,200 C406,194 384,152 420,124" fill="none" stroke="#5b4636" stroke-width="6" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="438" cy="125" r="16" fill="#f5efd8"/>
  <path d="M424,118 Q438,102 452,116 Q440,112 424,118 Z" fill="#f2d95c"/>
  <!-- bill and pouch -->
  <path d="M448,119 L546,146 Q551,150 544,153 L450,138 Z" fill="#8a7f6a"/>
  <path d="M450,134 Q492,176 543,153 L450,128 Z" fill="#a39a7c"/>
  <path d="M540,145 Q552,148 546,157 Q544,152 536,150 Z" fill="#6b624f"/>
  <circle cx="441" cy="120" r="4" fill="#fff"/>
  <circle cx="442" cy="120" r="2.3" fill="#111"/>
</svg>