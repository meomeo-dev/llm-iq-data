<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient & Shadows -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d8f3"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#fdf6e2"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="15%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Metallic Bike Frame Gradient -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Chrome Gradient -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Pelican Pouch Gradient -->
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Wheel Definition (Axle centered at 0,0 for clean rotation) -->
    <g id="bicycle-wheel">
      <!-- Rim & Tire -->
      <circle cx="0" cy="0" r="115" stroke="#1e293b" stroke-width="14" fill="none"/>
      <circle cx="0" cy="0" r="110" stroke="#334155" stroke-width="3" fill="none"/>
      <circle cx="0" cy="0" r="102" stroke="url(#chrome)" stroke-width="6" fill="none"/>
      <circle cx="0" cy="0" r="18" fill="url(#chrome)" stroke="#475569" stroke-width="2"/>
      
      <!-- Spokes (16 spoked wheel) -->
      <g stroke="#cbd5e1" stroke-width="1.8" opacity="0.85">
        <line x1="0" y1="-102" x2="0" y2="102"/>
        <line x1="-102" y1="0" x2="102" y2="0"/>
        <line x1="-72.1" y1="-72.1" x2="72.1" y2="72.1"/>
        <line x1="72.1" y1="-72.1" x2="-72.1" y2="72.1"/>
        <line x1="-39" y1="-94.3" x2="39" y2="94.3"/>
        <line x1="39" y1="-94.3" x2="-39" y2="94.3"/>
        <line x1="-94.3" y1="-39" x2="94.3" y2="39"/>
        <line x1="94.3" y1="-39" x2="-94.3" y2="39"/>
      </g>
      
      <!-- Valve stem & Reflector -->
      <rect x="-2" y="-98" width="4" height="10" fill="#f8fafc"/>
      <rect x="35" y="-12" width="28" height="10" rx="3" fill="#f59e0b" stroke="#d97706"/>
      <circle cx="0" cy="0" r="7" fill="#0f172a"/>
    </g>
  </defs>

  <style><![CDATA[
    /* Continuous animations */
    .spin-wheel {
      animation: wheelRoll 1.6s linear infinite;
    }
    .crank-revolve {
      animation: crankTurn 1.6s linear infinite;
      transform-origin: 430px 470px;
    }
    
    /* Road markings dash motion */
    .road-lines {
      stroke-dasharray: 60 50;
      animation: roadMove 0.8s linear infinite;
    }
    
    /* Pelican breeze & posture animation */
    .pelican-sway {
      animation: bodyBob 0.8s ease-in-out infinite alternate;
      transform-origin: 390px 320px;
    }
    .pouch-wobble {
      animation: pouchShake 0.8s ease-in-out infinite alternate;
      transform-origin: 590px 175px;
    }

    @keyframes wheelRoll {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes crankTurn {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes roadMove {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -110; }
    }

    @keyframes bodyBob {
      0%   { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(4px) rotate(0.8deg); }
    }

    @keyframes pouchShake {
      0%   { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.03, 0.97) rotate(-1.5deg); }
    }
  ]]></style>

  <!-- Sky & Coastal Background -->
  <rect width="900" height="650" fill="url(#skyGrad)"/>

  <!-- Distant Ocean & Dunes Horizon -->
  <path d="M0,450 Q240,430 480,445 T900,435 L900,500 L0,500 Z" fill="#7dd3fc" opacity="0.45"/>
  <path d="M0,460 Q320,445 680,462 T900,455 L900,500 L0,500 Z" fill="#cbd5e1" opacity="0.6"/>

  <!-- Ground / Pavement -->
  <rect x="0" y="490" width="900" height="160" fill="url(#roadGrad)"/>
  <line x1="0" y1="500" x2="900" y2="500" stroke="#f8fafc" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="0" y1="580" x2="900" y2="580" stroke="#fbbf24" stroke-width="7" class="road-lines"/>

  <!-- Ground Shadows -->
  <ellipse cx="230" cy="580" rx="90" ry="11" fill="#0f172a" opacity="0.38"/>
  <ellipse cx="670" cy="580" rx="90" ry="11" fill="#0f172a" opacity="0.38"/>
  <ellipse cx="440" cy="580" rx="140" ry="15" fill="#0f172a" opacity="0.25"/>

  <!-- ================= BICYCLE LAYER (BACK) ================= -->
  <!-- Rear Wheel (Axle at 230, 470) -->
  <g transform="translate(230, 470)">
    <g class="spin-wheel">
      <use href="#bicycle-wheel"/>
    </g>
  </g>

  <!-- Front Wheel (Axle at 670, 470) -->
  <g transform="translate(670, 470)">
    <g class="spin-wheel">
      <use href="#bicycle-wheel"/>
    </g>
  </g>

  <!-- ================= REAR LEG & PEDAL (Behind Frame) ================= -->
  <g id="back-leg-system">
    <!-- Back Crank & Pedal (180 deg out of phase from front) -->
    <!-- Center of crank spindle: 430, 470. Crank radius: 48. Target pedal pos: (430 + 48*cos(A), 470 + 48*sin(A)) -->
    <!-- At t=0, Back crank is pointing UP/BACK (~225 deg): pos approx (396, 436) -->
    <!-- Animating the rear pedal path & leg using synchronized keyframe-like movements -->
    <path id="rear-crank-arm" stroke="#64748b" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M 430,470 L 396,436;
                M 430,470 L 464,436;
                M 430,470 L 464,504;
                M 430,470 L 396,504;
                M 430,470 L 396,436" />
    </path>
    <!-- Rear Pedal Platform -->
    <path stroke="#1e293b" stroke-width="7" stroke-linecap="round">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M 384,436 L 408,436;
                M 452,436 L 476,436;
                M 452,504 L 476,504;
                M 384,504 L 408,504;
                M 384,436 L 408,436" />
    </path>

    <!-- Rear Leg (Hip at ~380,310): Thigh, Shin, Large Webbed Foot -->
    <!-- Shaded darker for depth / back plane -->
    <path fill="none" stroke="#52525b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M 378,312 Q 352,370 366,410 L 396,436;
                M 378,312 Q 380,360 430,395 L 464,436;
                M 378,312 Q 410,380 435,460 L 464,504;
                M 378,312 Q 365,395 365,465 L 396,504;
                M 378,312 Q 352,370 366,410 L 396,436" />
    </path>
    <!-- Rear Webbed Foot Clamping Pedal -->
    <path fill="#eab308" opacity="0.8" stroke="#ca8a04" stroke-width="1.5">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M 380,436 L 414,432 L 408,443 Z;
                M 448,436 L 482,432 L 476,443 Z;
                M 448,504 L 482,500 L 476,511 Z;
                M 380,504 L 414,500 L 408,511 Z;
                M 380,436 L 414,432 L 408,443 Z" />
    </path>
  </g>

  <!-- ================= BICYCLE FRAMEWORK ================= -->
  <g id="bicycle-frame" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear Triangle: Chainstay & Seatstay -->
    <line x1="230" y1="470" x2="430" y2="470" stroke="#d97706" stroke-width="11"/>
    <line x1="230" y1="470" x2="380" y2="340" stroke="#d97706" stroke-width="11"/>

    <!-- Drive Chain loop (Stylized) -->
    <path d="M 230,470 L 430,452 A 22,22 0 0,1 430,488 L 230,475 Z" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="7,4"/>

    <!-- Main Triangle: Seat Tube, Down Tube, Top Tube -->
    <!-- Bottom bracket: 430,470. Seat cluster: 380,340. Head tube top: 610,290; bottom: 630,360 -->
    <line x1="430" y1="470" x2="380" y2="320" stroke="url(#frameGrad)" stroke-width="15"/>
    <line x1="430" y1="470" x2="625" y2="350" stroke="url(#frameGrad)" stroke-width="15"/>
    <line x1="380" y1="340" x2="615" y2="305" stroke="url(#frameGrad)" stroke-width="14"/>

    <!-- Head Tube -->
    <line x1="612" y1="285" x2="632" y2="365" stroke="url(#frameGrad)" stroke-width="16"/>

    <!-- Front Fork (Head tube bottom 632,365 to front axle 670,470) -->
    <line x1="632" y1="365" x2="670" y2="470" stroke="url(#chrome)" stroke-width="12"/>

    <!-- Seat Post & Saddle -->
    <line x1="380" y1="340" x2="375" y2="295" stroke="url(#chrome)" stroke-width="11"/>
    <!-- Sleek Racing Saddle -->
    <path d="M 330,300 C 350,292 395,290 415,302 C 405,310 390,307 375,307 C 355,307 335,312 330,300 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>

    <!-- Handlebar Stem & Classic Cruiser / Drop Bars -->
    <path d="M 612,285 L 610,250 L 635,248" fill="none" stroke="url(#chrome)" stroke-width="10"/>
    <path d="M 635,248 C 655,248 665,265 658,285 C 652,300 635,298 630,295" fill="none" stroke="#1e293b" stroke-width="9"/>

    <!-- Chainring / Bottom Bracket Hub Spindle -->
    <circle cx="430" cy="470" r="28" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="430" cy="470" r="14" fill="#0f172a"/>
  </g>

  <!-- ================= THE PELICAN ================= -->
  <!-- Pelican Tail feathers extending behind saddle -->
  <g class="pelican-sway">
    <!-- Tail -->
    <path d="M 320,310 C 290,305 270,320 255,335 C 275,338 298,335 328,328 Z" fill="#475569" stroke="#334155" stroke-width="2"/>
    <path d="M 325,315 C 295,318 280,335 268,348 C 290,346 312,340 335,332 Z" fill="#64748b"/>

    <!-- Robust Brown Pelican Body Torso -->
    <!-- California brown pelicans have warm silver-brown to chestnut bodies -->
    <path d="M 335,310 C 330,260 365,225 425,235 C 475,243 505,275 500,330 C 495,375 435,390 380,375 C 345,365 338,335 335,310 Z"
          fill="#52525b" stroke="#3f3f46" stroke-width="3"/>
    
    <!-- Feather Layering / Flank coloration -->
    <path d="M 350,295 C 380,265 440,260 480,295 C 455,345 405,370 360,355 C 345,335 348,310 350,295 Z"
          fill="#71717a" opacity="0.8"/>

    <!-- Folded Wing with brown/grey coastal hues -->
    <!-- Wing Coverts and Primaries -->
    <path d="M 370,265 C 425,260 480,285 490,325 C 465,365 410,385 365,370 C 350,335 355,290 370,265 Z"
          fill="#44403c" stroke="#292524" stroke-width="2.5"/>
    <path d="M 360,325 C 400,320 455,340 485,385 C 430,395 385,380 350,350 Z"
          fill="#292524" opacity="0.9"/>
    <!-- Wing flight feather details -->
    <path d="M 390,330 L 485,382 M 380,345 L 465,386 M 370,358 L 440,388" stroke="#78716c" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Neck: S-Curved, White rear crest, Chestnut dark front patch (Breeding adult California Pelican) -->
    <!-- Back of neck (white/cream) -->
    <path d="M 435,245 C 450,210 475,170 515,150 C 538,138 555,145 565,160 C 550,175 525,185 505,215 C 485,245 470,265 450,270 Z"
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Neck front & nape (rich mahogany brown / chestnut) -->
    <path d="M 450,250 C 470,225 495,195 520,175 C 545,155 560,175 550,195 C 530,225 500,265 465,275 Z"
          fill="#451a03"/>

    <!-- Pelican Head -->
    <path d="M 540,155 C 545,130 575,120 600,135 C 615,145 618,162 612,175 C 595,190 565,185 540,155 Z"
          fill="#fef08a" stroke="#fde047" stroke-width="2"/> <!-- Straw-yellow crown of adult -->
    <path d="M 545,135 C 535,142 530,155 538,165" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/> <!-- Small crest -->

    <!-- Eye & Facial Skin -->
    <circle cx="585" cy="148" r="9" fill="#0284c7"/> <!-- Light blue eye-ring -->
    <circle cx="585" cy="148" r="5" fill="#f8fafc"/> <!-- Iris -->
    <circle cx="586" cy="148" r="2.8" fill="#0f172a"/> <!-- Pupil -->
    <circle cx="587" cy="146" r="1.2" fill="#ffffff"/> <!-- Sparkle -->

    <!-- Pelican Beak / Giant Bill (Upper Mandible) -->
    <!-- Maxilla: long, grey-horn, hooked tip at end -->
    <path d="M 595,145 L 755,195 C 765,198 765,206 752,208 L 602,178 Z"
          fill="#94a3b8" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
    <!-- Bill Ridge Highlight & Hook tip -->
    <path d="M 598,147 L 755,197 Q 762,201 756,207" fill="none" stroke="#f59e0b" stroke-width="3"/>

    <!-- Gular Pouch (Large, expandable throat pouch) -->
    <g class="pouch-wobble">
      <path d="M 605,178 C 625,230 675,255 725,225 C 742,215 750,205 752,205 C 720,202 650,188 605,178 Z"
            fill="url(#pouchGrad)" stroke="#c2410c" stroke-width="2"/>
      <!-- Vascular / texture lines on the pouch -->
      <path d="M 625,190 Q 660,225 710,215 M 645,192 Q 675,232 725,212" fill="none" stroke="#ea580c" stroke-width="1.8" opacity="0.6"/>
    </g>

    <!-- Pelican Arms/Wings gripping the handlebar -->
    <path d="M 470,270 Q 560,250 635,270" fill="none" stroke="#52525b" stroke-width="22" stroke-linecap="round"/>
    <path d="M 470,270 Q 560,250 635,270" fill="none" stroke="#71717a" stroke-width="16" stroke-linecap="round"/>
    <!-- Wing tip / Primary feathers wrapped over handle grip (635, 270) -->
    <path d="M 625,262 C 640,258 648,272 638,284 C 628,290 622,275 625,262 Z" fill="#292524"/>
    <path d="M 632,266 C 646,262 652,276 642,286" fill="none" stroke="#1c1917" stroke-width="3"/>
  </g>

  <!-- ================= FRONT LEG & PEDAL (Forefront Layer) ================= -->
  <!-- Fully synchronized pedaling motion in front of bike frame -->
  <g id="front-leg-system">
    <!-- Front Crank Arm (Rotates around 430, 470 with R=48) -->
    <!-- 180 degrees opposite to rear leg -->
    <path id="front-crank-arm" stroke="#94a3b8" stroke-width="11" stroke-linecap="round">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M 430,470 L 464,504;
                M 430,470 L 396,504;
                M 430,470 L 396,436;
                M 430,470 L 464,436;
                M 430,470 L 464,504" />
    </path>
    
    <!-- Crank Cap -->
    <circle cx="430" cy="470" r="9" fill="#334155" stroke="#f8fafc" stroke-width="2"/>

    <!-- Front Pedal Platform (Stays roughly horizontal as crank revolves) -->
    <path stroke="#0f172a" stroke-width="8" stroke-linecap="round">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M 452,504 L 476,504;
                M 384,504 L 408,504;
                M 384,436 L 408,436;
                M 452,436 L 476,436;
                M 452,504 L 476,504" />
    </path>

    <!-- Front Leg: Hip at (410, 335), Knee moving forward/backward, Ankle at pedal -->
    <!-- Smooth continuous articulation synchronized with crank -->
    <path fill="none" stroke="#27272a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M 410,335 Q 450,400 442,460 L 464,504;
                M 410,335 Q 395,410 375,465 L 396,504;
                M 410,335 Q 370,380 372,408 L 396,436;
                M 410,335 Q 425,365 440,395 L 464,436;
                M 410,335 Q 450,400 442,460 L 464,504" />
    </path>
    <path fill="none" stroke="#3f3f46" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M 410,335 Q 450,400 442,460 L 464,504;
                M 410,335 Q 395,410 375,465 L 396,504;
                M 410,335 Q 370,380 372,408 L 396,436;
                M 410,335 Q 425,365 440,395 L 464,436;
                M 410,335 Q 450,400 442,460 L 464,504" />
    </path>

    <!-- Large Orange/Yellow Webbed Pelican Foot clamping pedal -->
    <path fill="#f59e0b" stroke="#b45309" stroke-width="2">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M 444,504 L 488,498 L 480,512 Z;
                M 376,504 L 420,498 L 412,512 Z;
                M 376,436 L 420,430 L 412,444 Z;
                M 444,436 L 488,430 L 480,444 Z;
                M 444,504 L 488,498 L 480,512 Z" />
    </path>
    <!-- Webbing Claws / Digits -->
    <path stroke="#78350f" stroke-width="2" stroke-linecap="round">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M 458,502 L 484,499 M 458,506 L 482,508;
                M 390,502 L 416,499 M 390,506 L 414,508;
                M 390,434 L 416,431 M 390,438 L 414,440;
                M 458,434 L 484,431 M 458,438 L 482,440;
                M 458,502 L 484,499 M 458,506 L 482,508" />
    </path>
  </g>

  <!-- Speed Breeze Lines (Motion Effect) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.65">
    <line x1="120" y1="260" x2="60" y2="260">
      <animate attributeName="x1" dur="0.9s" values="180;40" repeatCount="indefinite"/>
      <animate attributeName="x2" dur="0.9s" values="100;0" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="0.9s" values="0.8;0" repeatCount="indefinite"/>
    </line>
    <line x1="160" y1="360" x2="90" y2="360">
      <animate attributeName="x1" dur="1.1s" values="220;50" repeatCount="indefinite"/>
      <animate attributeName="x2" dur="1.1s" values="130;0" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="1.1s" values="0.7;0" repeatCount="indefinite"/>
    </line>
    <line x1="780" y1="170" x2="840" y2="170">
      <animate attributeName="x1" dur="0.7s" values="760;840" repeatCount="indefinite"/>
      <animate attributeName="x2" dur="0.7s" values="810;900" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="0.7s" values="0.7;0" repeatCount="indefinite"/>
    </line>
  </g>
</svg>