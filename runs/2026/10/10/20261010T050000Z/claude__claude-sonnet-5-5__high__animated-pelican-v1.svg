<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f0"/>
      <stop offset="1" stop-color="#e9f6fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="63" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <path d="M-63 0L63 0M-58.2 -24.1L58.2 24.1M-44.5 -44.5L44.5 44.5M-24.1 -58.2L24.1 58.2M0 -63L0 63M24.1 -58.2L-24.1 58.2M44.5 -44.5L-44.5 44.5M58.2 -24.1L-58.2 24.1" stroke="#9aa0a8" stroke-width="1.2" fill="none"/>
      <circle r="9" fill="#777" stroke="#444" stroke-width="2"/>
      <rect x="-3" y="-72" width="6" height="12" rx="2" fill="#e03a2f"/>
      <circle cx="0" cy="48" r="4" fill="#f2c230"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-120 0" to="900 0" dur="40s" repeatCount="indefinite"/>
      <ellipse cx="100" cy="70" rx="40" ry="14"/>
      <ellipse cx="130" cy="60" rx="30" ry="14"/>
      <ellipse cx="70" cy="62" rx="26" ry="11"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="520 0" dur="60s" repeatCount="indefinite"/>
      <ellipse cx="500" cy="120" rx="46" ry="14"/>
      <ellipse cx="530" cy="110" rx="30" ry="13"/>
    </g>
  </g>
  <rect x="0" y="420" width="800" height="60" fill="#d9c9a0"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#a89a72" stroke-width="3"/>
  <ellipse cx="400" cy="424" rx="230" ry="7" fill="#000" opacity="0.18"/>

  <!-- wheels -->
  <g transform="translate(250 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550 350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <path d="M390 336L250 343M390 368L250 357" stroke="#333" stroke-width="2.5" fill="none"/>

  <!-- far crank + pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 352" to="360 390 352" dur="1.6s" repeatCount="indefinite"/>
    <line x1="390" y1="352" x2="356" y2="352" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 356 352" to="-360 356 352" dur="1.6s" repeatCount="indefinite"/>
      <rect x="344" y="349" width="24" height="6" rx="2" fill="#222"/>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#55504a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M345,212 L414,270 L356,352 L372,352">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="
M345,212 L414,270 L356,352 L372,352;
M345,212 L423,257 L361,335 L377,335;
M345,212 L430,241 L373,323 L389,323;
M345,212 L434,228 L390,318 L406,318;
M345,212 L434,226 L407,323 L423,323;
M345,212 L432,236 L419,335 L435,335;
M345,212 L426,252 L424,352 L440,352;
M345,212 L415,269 L419,369 L435,369;
M345,212 L402,282 L407,381 L423,381;
M345,212 L396,286 L390,386 L406,386;
M345,212 L398,285 L373,381 L389,381;
M345,212 L405,279 L361,369 L377,369;
M345,212 L414,270 L356,352 L372,352"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#1f6f8b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 352L344 226"/>
    <path d="M344 228L514 212"/>
    <path d="M390 352L516 228"/>
    <path d="M344 228L250 350"/>
    <path d="M390 352L250 350"/>
    <path d="M520 236L550 350" stroke-width="5"/>
    <path d="M514 205L521 238" stroke-width="9"/>
    <path d="M344 226L340 212" stroke="#444" stroke-width="4"/>
    <path d="M514 203L510 188" stroke="#444" stroke-width="5"/>
    <path d="M498 186L520 186Q538 186 540 200Q541 210 531 212" stroke="#333" stroke-width="5"/>
  </g>

  <!-- tail, body -->
  <path d="M300 180L258 203L268 213L308 204Z" fill="#5e4e40"/>
  <ellipse cx="352" cy="178" rx="60" ry="38" transform="rotate(-8 352 178)" fill="#8a7a68"/>
  <ellipse cx="368" cy="186" rx="40" ry="24" transform="rotate(-8 368 186)" fill="#a8998a"/>
  <path d="M326 200Q342 192 362 198L362 214Q340 220 322 214Z" fill="#222"/>

  <!-- neck and head -->
  <path d="M390 168C415 160 405 130 438 114" fill="none" stroke="#f3ede0" stroke-width="20" stroke-linecap="round"/>
  <path d="M384 160C408 152 398 124 430 106" fill="none" stroke="#6b4426" stroke-width="7" stroke-linecap="round"/>
  <circle cx="444" cy="106" r="17" fill="#f6f0dc"/>
  <ellipse cx="441" cy="94" rx="13" ry="8" fill="#f0d56a"/>
  <path d="M460 112Q500 150 546 130L458 106Z" fill="#c9a46a"/>
  <path d="M458 98L548 120Q556 123 550 129L458 114Z" fill="#a9a08a"/>
  <circle cx="450" cy="103" r="2.6" fill="#111"/>

  <!-- wing holding handlebar -->
  <path d="M380 160Q430 150 470 172Q505 182 528 186L530 195Q490 199 450 198Q405 200 372 185Z" fill="#6b5a4a" stroke="#4a3d31" stroke-width="2"/>

  <!-- near chainring + crank + pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 352" to="360 390 352" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="390" cy="352" r="16" fill="none" stroke="#555" stroke-width="3"/>
    <line x1="374" y1="352" x2="406" y2="352" stroke="#666" stroke-width="2"/>
    <line x1="390" y1="336" x2="390" y2="368" stroke="#666" stroke-width="2"/>
    <line x1="390" y1="352" x2="424" y2="352" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 424 352" to="-360 424 352" dur="1.6s" repeatCount="indefinite"/>
      <rect x="412" y="349" width="24" height="6" rx="2" fill="#222"/>
    </g>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#3b3835" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M345,212 L426,252 L424,352 L440,352">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="
M345,212 L426,252 L424,352 L440,352;
M345,212 L415,269 L419,369 L435,369;
M345,212 L402,282 L407,381 L423,381;
M345,212 L396,286 L390,386 L406,386;
M345,212 L398,285 L373,381 L389,381;
M345,212 L405,279 L361,369 L377,369;
M345,212 L414,270 L356,352 L372,352;
M345,212 L423,257 L361,335 L377,335;
M345,212 L430,241 L373,323 L389,323;
M345,212 L434,228 L390,318 L406,318;
M345,212 L434,226 L407,323 L423,323;
M345,212 L432,236 L419,335 L435,335;
M345,212 L426,252 L424,352 L440,352"/>
  </path>

  <circle cx="390" cy="352" r="6" fill="#222"/>
</svg>