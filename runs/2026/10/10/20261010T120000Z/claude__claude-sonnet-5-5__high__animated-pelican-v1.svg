<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec3e8"/>
      <stop offset="1" stop-color="#fde7c4"/>
    </linearGradient>
    <g id="wheel">
      <circle r="80" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="74" fill="none" stroke="#a9a9a9" stroke-width="2"/>
      <g stroke="#8c8c8c" stroke-width="1.2">
        <line x1="-74" y1="0" x2="74" y2="0"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(22.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(45)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(67.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(90)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(112.5)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(135)"/>
        <line x1="-74" y1="0" x2="74" y2="0" transform="rotate(157.5)"/>
      </g>
      <rect x="-2" y="-76" width="4" height="8" fill="#d33"/>
      <circle r="8" fill="#555"/>
      <circle r="3" fill="#ccc"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="660" cy="110" r="42" fill="#ffd98a" opacity="0.9"/>
  <g fill="#fff" opacity="0.8">
    <ellipse cx="150" cy="100" rx="55" ry="14"/>
    <ellipse cx="185" cy="88" rx="35" ry="12"/>
    <ellipse cx="520" cy="150" rx="48" ry="11"/>
  </g>
  <rect y="390" width="800" height="100" fill="#8fc3d6"/>
  <g stroke="#cfeaf3" stroke-width="2" fill="none" opacity="0.8">
    <path d="M40,415 q15,-6 30,0 t30,0"/>
    <path d="M250,440 q15,-6 30,0 t30,0"/>
    <path d="M620,420 q15,-6 30,0 t30,0"/>
    <path d="M470,455 q15,-6 30,0 t30,0"/>
  </g>
  <rect y="484" width="800" height="116" fill="#d9c9a3"/>
  <line x1="0" y1="484" x2="800" y2="484" stroke="#b9a77d" stroke-width="3"/>
  <line x1="-80" y1="545" x2="900" y2="545" stroke="#fff6dc" stroke-width="6" stroke-dasharray="50 30">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="488" rx="200" ry="7" fill="#000" opacity="0.18"/>

  <!-- wheels -->
  <g transform="translate(250,400)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(545,400)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <circle cx="250" cy="400" r="7" fill="#444"/>

  <!-- chain -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="390" y1="393" x2="250" y2="394"/>
    <line x1="390" y1="427" x2="250" y2="406"/>
  </g>

  <!-- far crank, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 390 410" to="540 390 410" dur="1.2s" repeatCount="indefinite"/>
    <line x1="390" y1="410" x2="430" y2="410" stroke="#666" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(430,410)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="1.2s" repeatCount="indefinite"/>
        <rect x="-11" y="3" width="24" height="4" rx="1.5" fill="#111"/>
        <path d="M-8,-4 L2,-5 L20,0 L20,3 L-8,3 Z" fill="#3a342e" stroke="#2a2520" stroke-width="1" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#4a4036" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M355,295 L415,355.2 L350,410">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M355,295 L415,355.2 L350,410;
      M355,295 L425.7,342.5 L355.4,390;
      M355,295 L435.7,321.6 L370,375.4;
      M355,295 L439.7,301.1 L390,370;
      M355,295 L440,295.8 L410,375.4;
      M355,295 L439.2,306.3 L424.6,390;
      M355,295 L434.5,325.1 L430,410;
      M355,295 L423.7,345 L424.6,430;
      M355,295 L410.2,359.6 L410,444.6;
      M355,295 L401.8,365.9 L390,450;
      M355,295 L401.9,365.8 L370,444.6;
      M355,295 L406.9,362.3 L355.4,430;
      M355,295 L415,355.2 L350,410"/>
  </path>

  <!-- frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="410" x2="348" y2="318"/>
    <line x1="348" y1="318" x2="502" y2="304"/>
    <line x1="390" y1="410" x2="507" y2="316"/>
    <line x1="390" y1="410" x2="250" y2="400"/>
    <line x1="348" y1="318" x2="250" y2="400"/>
    <line x1="500" y1="300" x2="508" y2="318" stroke-width="9"/>
    <line x1="508" y1="318" x2="545" y2="400"/>
  </g>
  <!-- seat post and saddle -->
  <line x1="348" y1="318" x2="341" y2="303" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M316,297 L358,297 Q372,298 366,304 L322,304 Q312,302 316,297 Z" fill="#2a2a2a"/>

  <!-- stem and handlebar -->
  <line x1="500" y1="300" x2="494" y2="270" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M494,270 L516,266 Q530,264 532,274" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>

  <!-- pelican tail and body -->
  <path d="M286,284 C294,246 330,224 372,230 C408,236 418,268 396,292 C380,306 340,306 312,300 Z" fill="#7a6a58" stroke="#5b4a3b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M300,282 C320,292 350,298 385,290" fill="none" stroke="#9b8b76" stroke-width="3" stroke-linecap="round"/>

  <!-- neck and head -->
  <path d="M392,250 C386,218 418,214 420,186" fill="none" stroke="#f3efe3" stroke-width="26" stroke-linecap="round"/>
  <path d="M380,246 C374,216 406,212 410,182" fill="none" stroke="#4a3426" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="426" cy="176" rx="22" ry="16" fill="#f6f2e6"/>
  <ellipse cx="420" cy="165" rx="15" ry="7" fill="#f0d56a" transform="rotate(-8 420 165)"/>
  <circle cx="434" cy="172" r="4.5" fill="#fff" opacity="0.7"/>
  <circle cx="434" cy="172" r="3" fill="#1b1b1b"/>
  <path d="M440,166 C480,170 520,184 546,196 C548,200 543,203 538,201 L440,184 Z" fill="#a89878" stroke="#7d6e52" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M442,182 C470,208 510,214 538,203 C520,196 480,188 442,180 Z" fill="#9c8560" stroke="#6d5a3d" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- wing reaching handlebar -->
  <path d="M380,246 C430,236 480,246 524,260 L536,270 C480,278 430,282 385,284 Z" fill="#5b4a3b" stroke="#8b7a66" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#3b2e24" stroke-width="1.5" stroke-linecap="round">
    <line x1="410" y1="252" x2="500" y2="268"/>
    <line x1="410" y1="262" x2="505" y2="271"/>
    <line x1="410" y1="272" x2="495" y2="276"/>
  </g>

  <!-- hip and near leg -->
  <circle cx="355" cy="293" r="13" fill="#6e5f4e"/>
  <path fill="none" stroke="#6b5d52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M355,295 L434.5,325.1 L430,410">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M355,295 L434.5,325.1 L430,410;
      M355,295 L423.7,345 L424.6,430;
      M355,295 L410.2,359.6 L410,444.6;
      M355,295 L401.8,365.9 L390,450;
      M355,295 L401.9,365.8 L370,444.6;
      M355,295 L406.9,362.3 L355.4,430;
      M355,295 L415,355.2 L350,410;
      M355,295 L425.7,342.5 L355.4,390;
      M355,295 L435.7,321.6 L370,375.4;
      M355,295 L439.7,301.1 L390,370;
      M355,295 L440,295.8 L410,375.4;
      M355,295 L439.2,306.3 L424.6,390;
      M355,295 L434.5,325.1 L430,410"/>
  </path>

  <!-- near crank, chainring, pedal and foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 410" to="360 390 410" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="390" cy="410" r="17" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="4 2"/>
    <line x1="390" y1="410" x2="350" y2="410" stroke="#777" stroke-width="6" stroke-linecap="round"/>
    <line x1="390" y1="410" x2="430" y2="410" stroke="#999" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(430,410)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
        <rect x="-11" y="3" width="24" height="4" rx="1.5" fill="#111"/>
        <path d="M-8,-4 L2,-5 L20,0 L20,3 L-8,3 Z" fill="#4f463d" stroke="#2a2520" stroke-width="1" stroke-linejoin="round"/>
        <path d="M8,-2 L19,1 M12,-3 L20,0" stroke="#2a2520" stroke-width="1" fill="none"/>
      </g>
    </g>
  </g>
  <circle cx="390" cy="410" r="6" fill="#444"/>
  <circle cx="390" cy="410" r="2" fill="#ccc"/>
</svg>