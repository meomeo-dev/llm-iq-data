<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#72afd3"/>
      <stop offset="60%" stop-color="#bfe3f7"/>
      <stop offset="100%" stop-color="#fdf3cd"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5056"/>
      <stop offset="100%" stop-color="#2c3035"/>
    </linearGradient>

    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5599b4"/>
      <stop offset="100%" stop-color="#3b728c"/>
    </linearGradient>

    <!-- Pelican Shading Gradients -->
    <linearGradient id="pelicanBodyGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#7a7067"/>
      <stop offset="40%" stop-color="#574d45"/>
      <stop offset="100%" stop-color="#342c26"/>
    </linearGradient>

    <linearGradient id="pelicanPouchGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#e69c24"/>
      <stop offset="50%" stop-color="#d46b13"/>
      <stop offset="100%" stop-color="#9e3b0b"/>
    </linearGradient>

    <linearGradient id="pelicanBillTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a939e"/>
      <stop offset="60%" stop-color="#cfd6df"/>
      <stop offset="90%" stop-color="#d97429"/>
      <stop offset="100%" stop-color="#b82e1f"/>
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dce3e8"/>
      <stop offset="50%" stop-color="#9aa0a6"/>
      <stop offset="100%" stop-color="#5f6368"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#008080"/>
      <stop offset="50%" stop-color="#00a896"/>
      <stop offset="100%" stop-color="#025951"/>
    </linearGradient>

    <!-- Wheel Definition (Center at 0,0, radius 90) -->
    <g id="bicycle-wheel">
      <!-- Tire -->
      <circle cx="0" cy="0" r="92" fill="none" stroke="#222" stroke-width="12"/>
      <circle cx="0" cy="0" r="95" fill="none" stroke="#151515" stroke-width="2"/>
      <circle cx="0" cy="0" r="88" fill="none" stroke="#e8d898" stroke-width="2.5"/> <!-- Gumwall rim stripe -->
      <!-- Rim -->
      <circle cx="0" cy="0" r="84" fill="none" stroke="url(#metalGrad)" stroke-width="6"/>
      <!-- Spokes (16 spokes: 8 rotated lines) -->
      <g stroke="#bbb" stroke-width="1.3" opacity="0.85">
        <line x1="-83" y1="0" x2="83" y2="0"/>
        <line x1="0" y1="-83" x2="0" y2="83"/>
        <line x1="-58.7" y1="-58.7" x2="58.7" y2="58.7"/>
        <line x1="-58.7" y1="58.7" x2="58.7" y2="-58.7"/>
        <line x1="-76.7" y1="-31.8" x2="76.7" y2="31.8"/>
        <line x1="-31.8" y1="-76.7" x2="31.8" y2="76.7"/>
        <line x1="-76.7" y1="31.8" x2="76.7" y2="-31.8"/>
        <line x1="-31.8" y1="76.7" x2="31.8" y2="-76.7"/>
      </g>
      <!-- Hub -->
      <circle cx="0" cy="0" r="14" fill="#333"/>
      <circle cx="0" cy="0" r="8" fill="url(#metalGrad)"/>
      <circle cx="0" cy="0" r="3" fill="#111"/>
    </g>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    /* Continuous Wheel Rotations */
    .spin-wheel-rear {
      transform-origin: 220px 470px;
      animation: wheelRoll 1.4s linear infinite;
    }
    .spin-wheel-front {
      transform-origin: 670px 470px;
      animation: wheelRoll 1.4s linear infinite;
    }
    @keyframes wheelRoll {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Crank & Chainring Revolutions around Bottom Bracket (430, 470) */
    .crank-assembly {
      transform-origin: 430px 470px;
      animation: crankTurn 1.4s linear infinite;
    }
    @keyframes crankTurn {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Keep pedals horizontal while orbiting */
    .pedal-counter-right {
      transform-origin: 462px 502px;
      animation: pedalCounter 1.4s linear infinite;
    }
    .pedal-counter-left {
      transform-origin: 398px 438px;
      animation: pedalCounter 1.4s linear infinite;
    }
    @keyframes pedalCounter {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    /* Synchronized Leg Kinematics (Right / Foreground Leg) */
    /* Hip joint at (395, 305) */
    .right-thigh {
      transform-origin: 395px 305px;
      animation: rightThighCycle 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    /* Knee follows thigh; lower leg flexes */
    .right-shin {
      transform-origin: 425px 405px;
      animation: rightShinCycle 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Synchronized Leg Kinematics (Left / Background Leg - 180 deg out of phase: -0.7s) */
    .left-thigh {
      transform-origin: 390px 300px;
      animation: leftThighCycle 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .left-shin {
      transform-origin: 420px 400px;
      animation: leftShinCycle 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes rightThighCycle {
      0%   { transform: rotate(18deg); }   /* Crank at 45 deg forward-down */
      25%  { transform: rotate(30deg); }   /* Crank at bottom-dead-center */
      50%  { transform: rotate(8deg); }    /* Crank backward-up */
      75%  { transform: rotate(-10deg); }  /* Crank top-dead-center */
      100% { transform: rotate(18deg); }
    }
    @keyframes rightShinCycle {
      0%   { transform: rotate(8deg); }
      25%  { transform: rotate(-8deg); }
      50%  { transform: rotate(16deg); }
      75%  { transform: rotate(34deg); }
      100% { transform: rotate(8deg); }
    }

    @keyframes leftThighCycle {
      0%   { transform: rotate(8deg); }    /* Crank backward-up */
      25%  { transform: rotate(-10deg); }  /* Crank top-dead-center */
      50%  { transform: rotate(18deg); }   /* Crank forward-down */
      75%  { transform: rotate(30deg); }   /* Crank bottom-dead-center */
      100% { transform: rotate(8deg); }
    }
    @keyframes leftShinCycle {
      0%   { transform: rotate(16deg); }
      25%  { transform: rotate(34deg); }
      50%  { transform: rotate(8deg); }
      75%  { transform: rotate(-8deg); }
      100% { transform: rotate(16deg); }
    }

    /* Subtle Pelvis and Body Rhythm */
    .pelican-torso-bob {
      animation: bodyBob 0.7s ease-in-out infinite alternate;
    }
    @keyframes bodyBob {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-2px) rotate(0.4deg); }
    }

    /* Background road dash movement */
    .road-line {
      stroke-dasharray: 40 30;
      animation: roadScroll 0.7s linear infinite;
    }
    @keyframes roadScroll {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 70; }
    }
  ]]></style>

  <!-- ENVIRONMENT BACKGROUND -->
  <!-- Sky -->
  <rect x="0" y="0" width="900" height="520" fill="url(#skyGrad)"/>
  
  <!-- Distant Ocean / Bay Horizon -->
  <rect x="0" y="340" width="900" height="140" fill="url(#seaGrad)"/>
  
  <!-- Coastal headlands -->
  <path d="M0,360 Q180,310 380,355 T800,340 Q860,345 900,350 L900,430 L0,430 Z" fill="#6c7f58" opacity="0.6"/>
  <path d="M220,365 Q410,335 620,368 T900,358 L900,430 L220,430 Z" fill="#4d5c3f" opacity="0.8"/>
  
  <!-- Seaside Barrier & Road Ground -->
  <rect x="0" y="420" width="900" height="25" fill="#d2c8b8"/>
  <line x1="0" y1="422" x2="900" y2="422" stroke="#b0a290" stroke-width="3"/>
  <rect x="0" y="445" width="900" height="205" fill="url(#roadGrad)"/>
  <line class="road-line" x1="0" y1="575" x2="900" y2="575" stroke="#f0d142" stroke-width="5" opacity="0.85"/>
  <line x1="0" y1="450" x2="900" y2="450" stroke="#fff" stroke-width="3" opacity="0.5"/>

  <!-- BICYCLE & RIDER CONTAINER -->
  <g id="pelican-cyclist">
    
    <!-- Cast Shadows on Ground -->
    <ellipse cx="220" cy="565" rx="70" ry="11" fill="#181c1f" opacity="0.45"/>
    <ellipse cx="670" cy="565" rx="70" ry="11" fill="#181c1f" opacity="0.45"/>
    <ellipse cx="430" cy="568" rx="150" ry="14" fill="#181c1f" opacity="0.35"/>

    <!-- ==================== BACKGROUND / LEFT LEG ==================== -->
    <g class="left-leg-assembly" opacity="0.9">
      <!-- Left Thigh (Pivoting at Pelvis 390,300) -->
      <g class="left-thigh">
        <path d="M385,295 C370,335 390,380 420,400 C405,370 405,320 395,295 Z" fill="#3e3834"/>
        <!-- Left Shin / Webbed Foot -->
        <g class="left-shin">
          <path d="M420,400 L398,438" stroke="#332c27" stroke-width="8" stroke-linecap="round"/>
          <!-- Foot / Webbing clamping pedal -->
          <path d="M382,442 C388,435 410,432 418,443 C405,446 390,450 382,442 Z" fill="#2d2825"/>
        </g>
      </g>
    </g>

    <!-- ==================== REAR WHEEL (Animated) ==================== -->
    <g class="spin-wheel-rear">
      <use href="#bicycle-wheel" x="220" y="470"/>
    </g>

    <!-- ==================== FRONT WHEEL (Animated) ==================== -->
    <g class="spin-wheel-front">
      <use href="#bicycle-wheel" x="670" y="470"/>
    </g>

    <!-- ==================== BICYCLE FRAMEWORK ==================== -->
    <g id="bicycle-frame" filter="url(#softShadow)">
      <!-- Rear Dropouts / Stay to Axle -->
      <!-- Chainstay (Rear Axle 220,470 to Bottom Bracket 430,470) -->
      <line x1="220" y1="470" x2="430" y2="470" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>
      
      <!-- Seatstay (Rear Axle 220,470 to Seat Lug 380,310) -->
      <line x1="220" y1="470" x2="380" y2="310" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>

      <!-- Rear Rim Brake Caliper -->
      <path d="M255,432 L268,445 L260,452" fill="none" stroke="#666" stroke-width="4"/>

      <!-- Drive Chain (Lower & Upper spans) -->
      <line x1="220" y1="482" x2="430" y2="486" stroke="#252525" stroke-width="3.5" stroke-dasharray="6,2"/>
      <line x1="220" y1="458" x2="430" y2="454" stroke="#252525" stroke-width="3.5" stroke-dasharray="6,2"/>
      <!-- Rear Sprocket Cluster -->
      <circle cx="220" cy="470" r="19" fill="#777" stroke="#333" stroke-width="2"/>

      <!-- Seat Tube (Bottom Bracket 430,470 to Seat Lug 380,310) -->
      <line x1="430" y1="470" x2="380" y2="310" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>

      <!-- Down Tube (Bottom Bracket 430,470 to Head Tube 605,275) -->
      <line x1="430" y1="470" x2="605" y2="275" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round"/>

      <!-- Top Tube (Seat Lug 380,310 to Head Tube Top 595,245) -->
      <line x1="380" y1="310" x2="595" y2="245" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round"/>

      <!-- Head Tube (595,245 to 615,305) -->
      <line x1="595" y1="245" x2="615" y2="305" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>

      <!-- Front Fork (Head Tube Lower 615,305 down to Front Axle 670,470) -->
      <path d="M615,305 L655,425 Q662,450 670,470" fill="none" stroke="url(#metalGrad)" stroke-width="9" stroke-linecap="round"/>

      <!-- Seat Post & Saddle -->
      <line x1="380" y1="310" x2="370" y2="280" stroke="url(#metalGrad)" stroke-width="8"/>
      <!-- Vintage Leather Saddle / Seat -->
      <path d="M330,274 C345,268 395,268 405,276 C408,284 395,289 385,287 C365,283 345,288 335,287 C326,286 323,278 330,274 Z" fill="#4a2511"/>
      <path d="M340,287 Q365,296 385,287" fill="none" stroke="#221107" stroke-width="3"/>
      <!-- Saddle Springs -->
      <circle cx="342" cy="287" r="4.5" fill="none" stroke="#888" stroke-width="2"/>

      <!-- Stem & Swept Cruiser Handlebars -->
      <!-- Quill Stem -->
      <path d="M595,245 L590,205 L575,208" fill="none" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Handlebar bar curve -->
      <path d="M575,208 Q540,210 545,232" fill="none" stroke="#222" stroke-width="6.5" stroke-linecap="round"/>
      <!-- Grips -->
      <path d="M545,232 L552,242" stroke="#6d4c3d" stroke-width="8" stroke-linecap="round"/>
      <!-- Classic Bell -->
      <circle cx="583" cy="202" r="6" fill="#f4b400" stroke="#b28200" stroke-width="1.5"/>
    </g>

    <!-- ==================== ROTATING CRANKSET & PEDALS ==================== -->
    <!-- Center BB at (430, 470) -->
    <g class="crank-assembly">
      <!-- Front Large Chainring -->
      <circle cx="430" cy="470" r="32" fill="none" stroke="url(#metalGrad)" stroke-width="7"/>
      <circle cx="430" cy="470" r="34" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="4,2"/>
      <circle cx="430" cy="470" r="18" fill="#333"/>
      
      <!-- Left Crank Arm (pointing opposite: -135 deg / up-back) -->
      <line x1="430" y1="470" x2="398" y2="438" stroke="#444" stroke-width="7.5" stroke-linecap="round"/>
      <!-- Left Pedal Axle & Body -->
      <g class="pedal-counter-left">
        <rect x="386" y="434" width="24" height="8" rx="3" fill="#1b1b1b" stroke="#666" stroke-width="1.5"/>
      </g>

      <!-- Right Crank Arm (pointing 45 deg / down-forward) -->
      <line x1="430" y1="470" x2="462" y2="502" stroke="url(#metalGrad)" stroke-width="8.5" stroke-linecap="round"/>
      <!-- Right Pedal Axle & Platform (counter-rotates to stay level) -->
      <g class="pedal-counter-right">
        <rect x="450" y="498" width="24" height="8" rx="3" fill="#2d2d2d" stroke="#bbb" stroke-width="1.5"/>
        <rect x="453" y="500" width="18" height="4" rx="1.5" fill="#f2994a"/> <!-- Amber Reflector -->
      </g>
      <!-- Center Spindle Bolt -->
      <circle cx="430" cy="470" r="7" fill="#111"/>
      <circle cx="430" cy="470" r="3" fill="#fff" opacity="0.6"/>
    </g>

    <!-- ==================== CALIFORNIA BROWN PELICAN ==================== -->
    <g id="pelican-rider" class="pelican-torso-bob" filter="url(#softShadow)">
      
      <!-- Tail Feathers perched neatly over saddle -->
      <path d="M320,290 C300,298 290,320 305,325 C320,330 338,305 345,295 Z" fill="#3e3630"/>
      <path d="M312,298 C298,308 292,328 308,333 C322,336 338,312 346,298 Z" fill="#2b2521"/>

      <!-- Body / Torso (Stout, bulky brown pelican trunk) -->
      <path d="M340,285 C330,250 355,195 420,185 C465,178 505,210 500,265 C495,305 460,330 405,330 C370,330 348,310 340,285 Z" fill="url(#pelicanBodyGrad)"/>

      <!-- Wing (Resting folded along flank, feather layers) -->
      <!-- Base Coverts -->
      <path d="M358,260 C370,205 440,195 480,230 C495,245 470,295 430,310 C385,325 352,295 358,260 Z" fill="#665b53"/>
      <!-- Middle Wing Texture / Streaks -->
      <path d="M375,255 C400,215 450,215 475,245 C450,285 410,305 375,255 Z" fill="#524841"/>
      <!-- Primary Flight Feathers trailing backwards -->
      <path d="M335,280 Q370,295 425,305 L370,315 Q335,298 335,280 Z" fill="#2d2622"/>
      <path d="M345,273 Q380,288 440,298 L390,307 Q345,290 345,273 Z" fill="#3a322c"/>

      <!-- Neck (Graceful pelican S-curve bent eagerly forward) -->
      <!-- Back contour of neck -->
      <path d="M470,200 C475,150 515,105 550,105 C575,105 585,130 555,155 C530,175 520,205 500,225 Z" fill="#332c27"/>
      <!-- Front golden/white neck stripe of California brown pelican breeding plumage -->
      <path d="M495,215 C520,185 530,165 558,145 C570,135 565,115 550,115 C525,115 495,155 480,205 Z" fill="#f4eedb"/>

      <!-- Head (White & Yellow Crown) -->
      <!-- Head Base -->
      <path d="M535,118 C535,88 565,75 590,82 C610,88 618,108 610,126 C598,145 545,142 535,118 Z" fill="#f8f4e6"/>
      <!-- Straw-yellow breeding crest top -->
      <path d="M545,100 C555,75 595,72 605,88 C590,80 565,82 545,100 Z" fill="#fcd34d"/>

      <!-- Pelican Eye (Characteristic pale eye surrounded by dark bare skin) -->
      <circle cx="582" cy="102" r="7" fill="#603813"/>
      <circle cx="582" cy="102" r="4.5" fill="#e8edf2"/>
      <circle cx="583" cy="102" r="2.2" fill="#111"/>
      <circle cx="584" cy="100.5" r="0.9" fill="#fff"/> <!-- Catchlight -->

      <!-- Huge Pouch and Giant Bill -->
      <!-- Throat Pouch (Gular pouch stretching under jaw) -->
      <path d="M575,135 C590,180 660,220 705,170 C720,152 700,135 660,130 Z" fill="url(#pelicanPouchGrad)"/>
      <path d="M605,148 C635,185 680,185 695,160" fill="none" stroke="#ab3c13" stroke-width="2" opacity="0.6"/>

      <!-- Upper Bill (Long, hooked tip) -->
      <path d="M595,105 L765,142 Q780,146 782,154 Q775,162 760,154 L585,124 Z" fill="url(#pelicanBillTop)"/>
      <!-- Maxillary nail (downturned hook at bill tip) -->
      <path d="M768,143 Q785,147 784,158 Q775,162 766,150 Z" fill="#b3261e"/>

      <!-- Lower Bill / Mandible Edge -->
      <path d="M600,124 L762,152 L670,155 Z" fill="#757f8a"/>

      <!-- Pelican Arms / Wing-Hands Gripping Handlebar -->
      <!-- Arm extending from breast toward handlebar grip (545, 232) -->
      <path d="M470,225 Q515,225 546,233 Q538,245 500,245 Q465,245 470,225 Z" fill="#524841"/>
      <!-- Wing tips wrap around grip -->
      <path d="M542,228 C552,225 558,236 550,244 C542,246 538,236 542,228 Z" fill="#2d2622"/>

      <!-- ==================== FOREGROUND / RIGHT LEG (Animated) ==================== -->
      <!-- Connected to pelvis at (395, 305) -->
      <g class="right-leg-assembly">
        <!-- Thigh / Femur -->
        <g class="right-thigh">
          <!-- Heavy feathered upper leg -->
          <path d="M380,295 C370,335 395,385 425,405 C435,380 425,320 405,295 Z" fill="#4d443c"/>
          <path d="M388,305 C382,335 400,375 422,398" fill="none" stroke="#362f2a" stroke-width="3"/>
          
          <!-- Shin / Tarsus & Webbed Foot -->
          <!-- Pivots from knee joint (425, 405) down to right pedal (462, 502) -->
          <g class="right-shin">
            <!-- Bare scaly tarsus bone -->
            <line x1="425" y1="405" x2="462" y2="502" stroke="#2b2622" stroke-width="8" stroke-linecap="round"/>
            <line x1="426" y1="408" x2="461" y2="498" stroke="#544c45" stroke-width="2.5" stroke-linecap="round"/>
            
            <!-- Large Peliform Totipalmate Webbed Foot gripping the pedal platform -->
            <!-- Heel pad at ankle (462, 502) spreading 4 webbed toes forward over pedal -->
            <path d="M448,506 C455,496 482,493 494,507 C475,512 458,515 448,506 Z" fill="#221e1a"/>
            <!-- Claws / Toe digits resting on pedal -->
            <path d="M462,502 L488,501 M462,504 L492,506 M462,505 L485,510" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </g>
      </g>
      
    </g> <!-- End Pelican Rider -->

    <!-- Wind Motion Lines around Beak and Helmet-less Feather Crest -->
    <path d="M795,148 L840,148" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M780,132 L815,132" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <path d="M740,105 L775,105" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>