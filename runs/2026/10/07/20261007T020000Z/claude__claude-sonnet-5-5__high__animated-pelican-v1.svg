<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ed8f5"/>
      <stop offset="1" stop-color="#e6f6fd"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="34" fill="#fff3b0"/>
  <rect x="0" y="420" width="800" height="80" fill="#d9c79a"/>
  <rect x="0" y="420" width="800" height="6" fill="#b8a57a"/>

  <!-- rear wheel -->
  <g transform="translate(230,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      <circle r="66" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="60" fill="none" stroke="#aaa" stroke-width="2"/>
      <g stroke="#888" stroke-width="1.2">
        <line x1="-60" y1="0" x2="60" y2="0"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(22.5)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(45)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(67.5)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(90)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(112.5)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(135)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="8" fill="#555"/>
      <circle r="8" fill="none" stroke="#333" stroke-width="2"/>
      <circle cx="56" cy="0" r="3.5" fill="#ff8a1f"/>
      <circle r="7" cx="0" cy="0" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(570,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      <circle r="66" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="60" fill="none" stroke="#aaa" stroke-width="2"/>
      <g stroke="#888" stroke-width="1.2">
        <line x1="-60" y1="0" x2="60" y2="0"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(22.5)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(45)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(67.5)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(90)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(112.5)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(135)"/>
        <line x1="-60" y1="0" x2="60" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="8" fill="#555"/>
      <circle cx="56" cy="0" r="3.5" fill="#ff8a1f"/>
    </g>
  </g>

  <!-- chain -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="385" y1="344" x2="230" y2="343"/>
    <line x1="385" y1="376" x2="230" y2="357"/>
  </g>

  <!-- frame -->
  <g stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="385" y1="360" x2="345" y2="263"/>
    <line x1="345" y1="266" x2="505" y2="258"/>
    <line x1="385" y1="360" x2="510" y2="282"/>
    <line x1="385" y1="360" x2="230" y2="350"/>
    <line x1="345" y1="266" x2="230" y2="350"/>
  </g>
  <!-- head tube, fork, stem, handlebar -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="503" y1="248" x2="512" y2="286" stroke="#8e2a20" stroke-width="9"/>
    <line x1="512" y1="286" x2="570" y2="350" stroke="#555" stroke-width="6"/>
    <line x1="503" y1="248" x2="498" y2="230" stroke="#555" stroke-width="6"/>
    <path d="M498 230 L520 228 Q538 228 540 246" stroke="#333" stroke-width="6"/>
    <line x1="516" y1="228" x2="530" y2="228" stroke="#111" stroke-width="9"/>
  </g>
  <!-- seat post and saddle -->
  <line x1="345" y1="263" x2="351" y2="248" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <path d="M318 246 Q345 238 380 246 L376 254 Q345 256 322 253 Z" fill="#2b2b2b"/>

  <!-- crank, chainring, pedals -->
  <g transform="translate(385,360)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="4 2"/>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#666" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-30" y2="0" stroke="#666" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-9" y="-2.5" width="18" height="5" rx="2" fill="#222"/>
        </g>
      </g>
      <g transform="translate(-30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-9" y="-2.5" width="18" height="5" rx="2" fill="#222"/>
        </g>
      </g>
      <circle r="6" fill="#999" stroke="#333" stroke-width="2"/>
    </g>
  </g>

  <!-- far leg -->
  <path fill="none" stroke="#2f2a26" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M355 255 L415.4 307.5 L355 360 L369 360">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M355 255 L415.4 307.5 L355 360 L369 360;
      M355 255 L427 289.8 L363.8 338.8 L377.8 338.8;
      M355 255 L434.1 266.9 L385 330 L399 330;
      M355 255 L434.5 264 L406.2 338.8 L420.2 338.8;
      M355 255 L430.5 281.5 L415 360 L429 360;
      M355 255 L419.5 302.3 L406.2 381.2 L420.2 381.2;
      M355 255 L409.2 313.8 L385 390 L399 390;
      M355 255 L408.3 314.7 L363.8 381.2 L377.8 381.2;
      M355 255 L415.4 307.5 L355 360 L369 360"/>
  </path>

  <!-- near leg -->
  <path fill="none" stroke="#4a4038" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M355 255 L430.5 281.5 L415 360 L429 360">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="
      M355 255 L430.5 281.5 L415 360 L429 360;
      M355 255 L419.5 302.3 L406.2 381.2 L420.2 381.2;
      M355 255 L409.2 313.8 L385 390 L399 390;
      M355 255 L408.3 314.7 L363.8 381.2 L377.8 381.2;
      M355 255 L415.4 307.5 L355 360 L369 360;
      M355 255 L427 289.8 L363.8 338.8 L377.8 338.8;
      M355 255 L434.1 266.9 L385 330 L399 330;
      M355 255 L434.5 264 L406.2 338.8 L420.2 338.8;
      M355 255 L430.5 281.5 L415 360 L429 360"/>
  </path>

  <!-- pelican tail -->
  <path d="M300 214 L258 226 L264 238 L302 234 Z" fill="#5b4a3c"/>
  <path d="M300 220 L262 230 M300 226 L268 235" stroke="#3f3228" stroke-width="2" fill="none"/>

  <!-- body -->
  <ellipse cx="348" cy="212" rx="58" ry="40" fill="#8a7461" transform="rotate(-8 348 212)"/>
  <ellipse cx="362" cy="226" rx="38" ry="22" fill="#a39080" transform="rotate(-8 362 226)"/>

  <!-- neck -->
  <path d="M385 205 Q422 190 412 160 Q407 142 435 135" fill="none" stroke="#f6f0e0" stroke-width="22" stroke-linecap="round"/>
  <path d="M376 196 Q410 180 398 156 Q392 138 418 124" fill="none" stroke="#4a3a2c" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- head -->
  <circle cx="437" cy="135" r="17" fill="#f6f0e0"/>
  <ellipse cx="434" cy="124" rx="13" ry="7" fill="#f2d35b"/>
  <circle cx="444" cy="132" r="3.5" fill="#111"/>
  <circle cx="445" cy="131" r="1" fill="#fff"/>

  <!-- bill and pouch -->
  <path d="M450 130 L542 150 L538 157 L452 143 Z" fill="#8d8a80"/>
  <path d="M452 143 L538 157 Q500 188 458 154 Z" fill="#b08c6a"/>
  <path d="M538 148 Q548 150 546 162 Q542 160 538 157 Z" fill="#d8572a"/>

  <!-- wing reaching to handlebar -->
  <path d="M380 195 Q440 190 470 215 Q500 235 526 232 L524 241 Q490 246 455 233 Q410 226 375 226 Z" fill="#6b5646" stroke="#4a3a2c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400 205 Q440 205 465 222 M400 214 Q435 216 458 229" fill="none" stroke="#4a3a2c" stroke-width="1.5"/>
  <circle cx="525" cy="234" r="6" fill="#4a3a2c"/>
</svg>