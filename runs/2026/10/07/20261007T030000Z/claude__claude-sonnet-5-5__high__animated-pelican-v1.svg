<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#fbe9c6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="120" cy="105" r="38" fill="#fff3b0" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-250 0" to="1000 0" dur="70s" repeatCount="indefinite"/>
      <ellipse cx="100" cy="70" rx="45" ry="14"/>
      <ellipse cx="130" cy="58" rx="30" ry="13"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-700 0" to="550 0" dur="90s" repeatCount="indefinite"/>
      <ellipse cx="700" cy="130" rx="50" ry="13"/>
      <ellipse cx="730" cy="119" rx="30" ry="12"/>
    </g>
  </g>
  <rect x="0" y="310" width="800" height="110" fill="#3f8fb5"/>
  <rect x="0" y="310" width="800" height="6" fill="#bfe6f5"/>
  <rect x="0" y="420" width="800" height="80" fill="#7d7f83"/>
  <rect x="0" y="420" width="800" height="4" fill="#5d5f63"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.36s" repeatCount="indefinite"/>
    <line x1="-120" y1="465" x2="920" y2="465" stroke="#f4f4f4" stroke-width="6" stroke-dasharray="60 60"/>
  </g>
  <ellipse cx="410" cy="424" rx="230" ry="9" fill="#000000" opacity="0.25"/>

  <!-- far leg -->
  <path fill="none" stroke="#5f5f5f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M372,250 L421.8,299.2 L360,350">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1"
      values="M372,250 L421.8,299.2 L360,350;
              M372,250 L432.2,285.9 L365.4,330;
              M372,250 L440.7,263.3 L380,315.4;
              M372,250 L441.5,241.7 L400,310;
              M372,250 L441,238.1 L420,315.4;
              M372,250 L441.9,250.4 L434.6,330;
              M372,250 L439.1,270 L440,350;
              M372,250 L429.3,290.1 L434.6,370;
              M372,250 L415.7,304.7 L420,384.6;
              M372,250 L407.5,310.3 L400,390;
              M372,250 L408.3,309.9 L380,384.6;
              M372,250 L413.7,306.2 L365.4,370;
              M372,250 L421.8,299.2 L360,350"/>
  </path>

  <!-- chain -->
  <g stroke="#333" stroke-width="3" stroke-dasharray="4 2">
    <line x1="400" y1="328" x2="250" y2="331"/>
    <line x1="400" y1="372" x2="250" y2="349"/>
  </g>

  <!-- rear wheel -->
  <g transform="translate(250,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <circle r="78" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="72" fill="none" stroke="#c9c9c9" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-62" r="4" fill="#e0382b"/>
      <circle r="9" fill="#555"/>
      <circle r="4" fill="#ddd"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(570,340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <circle r="78" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="72" fill="none" stroke="#c9c9c9" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle cx="0" cy="-62" r="4" fill="#e0382b"/>
      <circle r="9" fill="#555"/>
      <circle r="4" fill="#ddd"/>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="340" x2="400" y2="350"/>
    <line x1="250" y1="340" x2="360" y2="252"/>
    <line x1="400" y1="350" x2="356" y2="244"/>
    <line x1="360" y1="252" x2="516" y2="240"/>
    <line x1="400" y1="350" x2="524" y2="266"/>
    <line x1="570" y1="340" x2="526" y2="268"/>
  </g>
  <line x1="514" y1="232" x2="526" y2="268" stroke="#8e2a20" stroke-width="10" stroke-linecap="round"/>
  <line x1="514" y1="232" x2="508" y2="212" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <path d="M498,212 L538,208 Q557,208 557,228" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="356" y1="244" x2="356" y2="238" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="354" cy="243" rx="26" ry="6" fill="#2b2b2b"/>
  <circle cx="400" cy="350" r="8" fill="#444"/>

  <!-- crank assembly -->
  <g transform="translate(400,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="22" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="3 2"/>
      <line x1="-40" y1="0" x2="40" y2="0" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <circle r="6" fill="#888"/>
      <g transform="translate(40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-1.5" width="22" height="4.5" rx="1.5" fill="#222"/>
          <path d="M-8,-8 Q4,-12 18,-6 L16,-1 L-8,-1.5 Z" fill="#4a463f"/>
        </g>
      </g>
      <g transform="translate(-40,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2s" repeatCount="indefinite"/>
          <rect x="-11" y="-1.5" width="22" height="4.5" rx="1.5" fill="#222"/>
          <path d="M-8,-8 Q4,-12 18,-6 L16,-1 L-8,-1.5 Z" fill="#3a3732"/>
        </g>
      </g>
    </g>
  </g>

  <!-- pelican tail and body -->
  <path d="M338,208 L285,248 L300,254 L345,236 Z" fill="#4a3a30"/>
  <ellipse cx="385" cy="205" rx="62" ry="36" transform="rotate(-15 385 205)" fill="#8c8077"/>
  <path d="M345,215 Q380,235 420,215" fill="none" stroke="#a89c91" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- neck and head -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="1s" repeatCount="indefinite"/>
    <path d="M415,192 C445,180 425,152 452,132" fill="none" stroke="#4a3426" stroke-width="22" stroke-linecap="round"/>
    <path d="M420,190 C450,178 430,150 457,130" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="462" cy="120" rx="23" ry="17" fill="#ffffff"/>
    <ellipse cx="458" cy="108" rx="16" ry="8" fill="#f3d26b"/>
    <path d="M478,112 L580,148 L577,154 L478,126 Z" fill="#a7a090"/>
    <path d="M478,126 L576,154 Q540,180 480,134 Z" fill="#8f7f66"/>
    <path d="M572,147 L582,148 L580,156 L574,154 Z" fill="#c8512a"/>
    <circle cx="471" cy="116" r="4" fill="#ffffff"/>
    <circle cx="472" cy="116" r="2.6" fill="#111"/>
  </g>

  <!-- wing on handlebar -->
  <path d="M398,172 Q470,184 541,203 L538,216 Q470,222 402,216 Z" fill="#5b4d43"/>
  <path d="M470,196 Q505,204 538,206" fill="none" stroke="#7a6a5c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="540" cy="209" r="7" fill="#4a3d35"/>

  <!-- near leg -->
  <path fill="none" stroke="#3d3d3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M372,250 L439.1,270 L440,350">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1"
      values="M372,250 L439.1,270 L440,350;
              M372,250 L429.3,290.1 L434.6,370;
              M372,250 L415.7,304.7 L420,384.6;
              M372,250 L407.5,310.3 L400,390;
              M372,250 L408.3,309.9 L380,384.6;
              M372,250 L413.7,306.2 L365.4,370;
              M372,250 L421.8,299.2 L360,350;
              M372,250 L432.2,285.9 L365.4,330;
              M372,250 L440.7,263.3 L380,315.4;
              M372,250 L441.5,241.7 L400,310;
              M372,250 L441,238.1 L420,315.4;
              M372,250 L441.9,250.4 L434.6,330;
              M372,250 L439.1,270 L440,350"/>
  </path>
  <ellipse cx="374" cy="244" rx="15" ry="11" fill="#8c8077"/>
</svg>