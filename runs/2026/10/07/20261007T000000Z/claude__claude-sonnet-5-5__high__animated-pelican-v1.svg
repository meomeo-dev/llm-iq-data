<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="California brown pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#e6f5fb"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#fff3b0"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="140" cy="80" rx="50" ry="16"/>
    <ellipse cx="170" cy="68" rx="32" ry="14"/>
    <ellipse cx="560" cy="130" rx="44" ry="13"/>
    <ellipse cx="585" cy="120" rx="28" ry="11"/>
  </g>

  <rect x="0" y="420" width="800" height="60" fill="#ead9a6"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#8a7a58" stroke-width="3"/>
  <line x1="-100" y1="446" x2="900" y2="446" stroke="#b9a676" stroke-width="4" stroke-dasharray="50 50">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- Rear wheel -->
  <g transform="translate(260 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <circle r="79" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#aeb4b8" stroke-width="2"/>
      <g stroke="#8b9296" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="9" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>
      <circle r="5" fill="#555"/>
      <circle cx="68" cy="0" r="4" fill="#d9362b"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g transform="translate(540 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <circle r="79" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="72" fill="none" stroke="#aeb4b8" stroke-width="2"/>
      <g stroke="#8b9296" stroke-width="1.2">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(22.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(45)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(67.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(90)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(112.5)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(135)"/>
        <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="5" fill="#555"/>
      <circle cx="68" cy="0" r="4" fill="#d9362b"/>
    </g>
  </g>

  <!-- Far leg, crank and pedal -->
  <path d="M350,228 L407.8,283.4 L355,350" fill="none" stroke="#3d3d3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M350,228 L407.8,283.4 L355,350;M350,228 L420.6,265.6 L363.8,328.8;M350,228 L427.8,246.6 L385,320;M350,228 L427.8,246.6 L406.2,328.8;M350,228 L420.8,265.2 L415,350;M350,228 L404.9,286.2 L406.2,371.2;M350,228 L393.1,295.4 L385,380;M350,228 L396.8,292.9 L363.8,371.2;M350,228 L407.8,283.4 L355,350"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 385 350" to="540 385 350" dur="2s" repeatCount="indefinite"/>
    <line x1="385" y1="350" x2="415" y2="350" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 415 350" to="-540 415 350" dur="2s" repeatCount="indefinite"/>
      <rect x="405" y="348" width="20" height="6" rx="2" fill="#333"/>
      <polygon points="402,343 431,347 427,353 404,353" fill="#2f2f2f"/>
    </g>
  </g>

  <!-- Frame -->
  <g fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="260" y1="340" x2="385" y2="350"/>
    <line x1="260" y1="340" x2="345" y2="240"/>
    <line x1="385" y1="350" x2="343" y2="236"/>
    <line x1="343" y1="244" x2="502" y2="240"/>
    <line x1="385" y1="350" x2="508" y2="256"/>
    <line x1="496" y1="224" x2="540" y2="340"/>
    <line x1="496" y1="224" x2="508" y2="256" stroke-width="10"/>
  </g>
  <line x1="496" y1="224" x2="492" y2="204" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <path d="M488,204 L515,202 Q529,204 527,219" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="344" y1="242" x2="340" y2="228" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <path d="M320,226 Q340,219 366,226 Q369,233 340,233 Q320,233 320,226 Z" fill="#222"/>

  <!-- Chain -->
  <line x1="260" y1="333" x2="385" y2="334" stroke="#333" stroke-width="2.5" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.14s" repeatCount="indefinite"/>
  </line>
  <line x1="260" y1="347" x2="385" y2="366" stroke="#333" stroke-width="2.5" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="0" to="7" dur="0.14s" repeatCount="indefinite"/>
  </line>

  <!-- Near leg -->
  <path d="M350,228 L420.8,265.2 L415,350" fill="none" stroke="#2b2b2b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M350,228 L420.8,265.2 L415,350;M350,228 L404.9,286.2 L406.2,371.2;M350,228 L393.1,295.4 L385,380;M350,228 L396.8,292.9 L363.8,371.2;M350,228 L407.8,283.4 L355,350;M350,228 L420.6,265.6 L363.8,328.8;M350,228 L427.8,246.6 L385,320;M350,228 L427.8,246.6 L406.2,328.8;M350,228 L420.8,265.2 L415,350"/>
  </path>

  <!-- Pelican tail, body, neck, head -->
  <path d="M282,184 L238,204 L284,214 Z" fill="#5b4a3b"/>
  <ellipse cx="335" cy="188" rx="62" ry="38" transform="rotate(-8 335 188)" fill="#7a6857"/>
  <path d="M290,185 Q320,160 360,176" fill="none" stroke="#5b4a3b" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M380,185 Q410,168 402,140 Q396,118 412,106" fill="none" stroke="#f3eee2" stroke-width="22" stroke-linecap="round"/>
  <path d="M372,180 Q400,166 392,140 Q386,116 402,100" fill="none" stroke="#4e3b2d" stroke-width="7" stroke-linecap="round"/>
  <circle cx="418" cy="100" r="17" fill="#f3eee2"/>
  <path d="M404,96 Q416,76 434,92 Q420,86 404,96 Z" fill="#f2d24a"/>
  <path d="M431,94 L505,118 L503,124 L433,108 Z" fill="#8d8878"/>
  <path d="M433,108 L503,124 Q472,148 437,120 Z" fill="#b9ac8c"/>
  <path d="M498,117 L508,119 L504,126 L501,124 Z" fill="#b5442f"/>
  <circle cx="425" cy="97" r="4" fill="#ffffff"/>
  <circle cx="426" cy="97" r="2.4" fill="#111"/>

  <!-- Wing gripping the handlebar -->
  <path d="M350,180 Q440,200 520,210" fill="none" stroke="#5a4636" stroke-width="13" stroke-linecap="round"/>
  <path d="M505,208 L522,211" fill="none" stroke="#3b2d22" stroke-width="11" stroke-linecap="round"/>

  <!-- Near crank, chainring and pedal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 350" to="360 385 350" dur="2s" repeatCount="indefinite"/>
    <circle cx="385" cy="350" r="16" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="3 2"/>
    <line x1="385" y1="350" x2="415" y2="350" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 415 350" to="-360 415 350" dur="2s" repeatCount="indefinite"/>
      <rect x="405" y="348" width="20" height="6" rx="2" fill="#222"/>
      <polygon points="402,343 431,347 427,353 404,353" fill="#2b2b2b"/>
    </g>
  </g>
  <circle cx="385" cy="350" r="7" fill="#777" stroke="#333" stroke-width="2"/>
</svg>