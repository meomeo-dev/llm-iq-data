<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#1d1d1d" stroke-width="6"/>
      <circle r="64" fill="none" stroke="#b9bec4" stroke-width="2"/>
      <g stroke="#9aa0a6" stroke-width="1">
        <line x1="-64" y1="0" x2="64" y2="0"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(22.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(45)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(67.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(90)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(112.5)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(135)"/>
        <line x1="-64" y1="0" x2="64" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="6" fill="#555"/>
      <circle cx="0" cy="-58" r="3.5" fill="#e74c3c"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe27a"/>
  <rect x="0" y="421" width="800" height="59" fill="#e6d3a3"/>
  <line x1="0" y1="421" x2="800" y2="421" stroke="#b9a273" stroke-width="2"/>
  <line x1="0" y1="445" x2="800" y2="445" stroke="#c9b283" stroke-width="3" stroke-dasharray="30 22">
    <animate attributeName="stroke-dashoffset" from="0" to="52" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="400" cy="424" rx="200" ry="7" fill="#000" opacity="0.15"/>

  <!-- wheels -->
  <g transform="translate(250,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550,350)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <circle cx="250" cy="350" r="8" fill="none" stroke="#666" stroke-width="3"/>
  <line x1="390" y1="346" x2="250" y2="342" stroke="#333" stroke-width="2.5" stroke-dasharray="3 2">
    <animate attributeName="stroke-dashoffset" from="0" to="-5" dur="0.15s" repeatCount="indefinite"/>
  </line>
  <line x1="250" y1="358" x2="390" y2="374" stroke="#333" stroke-width="2.5" stroke-dasharray="3 2">
    <animate attributeName="stroke-dashoffset" from="0" to="-5" dur="0.15s" repeatCount="indefinite"/>
  </line>

  <!-- frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="350" x2="390" y2="360" stroke="#c0392b" stroke-width="5"/>
    <line x1="250" y1="350" x2="355" y2="268" stroke="#c0392b" stroke-width="4"/>
    <line x1="390" y1="360" x2="355" y2="268" stroke="#c0392b" stroke-width="6"/>
    <line x1="355" y1="268" x2="503" y2="256" stroke="#c0392b" stroke-width="6"/>
    <line x1="390" y1="360" x2="505" y2="268" stroke="#c0392b" stroke-width="7"/>
    <line x1="500" y1="240" x2="507" y2="272" stroke="#7b241c" stroke-width="8"/>
    <line x1="506" y1="262" x2="550" y2="350" stroke="#8a8f94" stroke-width="5"/>
    <line x1="500" y1="240" x2="495" y2="222" stroke="#333" stroke-width="5"/>
    <path d="M488,221 L520,214 Q534,214 532,228" stroke="#222" stroke-width="5"/>
    <line x1="355" y1="268" x2="352" y2="254" stroke="#333" stroke-width="5"/>
  </g>
  <path d="M322,252 Q350,245 382,250 Q386,257 370,259 L330,260 Q319,258 322,252 Z" fill="#2b2b2b"/>

  <!-- far leg -->
  <path fill="none" stroke="#4b4038" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M358,250 L411.4,304 L360,360">
    <animate attributeName="d" dur="1.5s" repeatCount="indefinite" values="M358,250 L411.4,304 L360,360;M358,250 L420.2,293.8 L364,345;M358,250 L428,279.5 L375,334;M358,250 L432.1,266.8 L390,330;M358,250 L432.8,263.3 L405,334;M358,250 L431.2,270.5 L416,345;M358,250 L425.9,284.2 L420,360;M358,250 L416.1,299 L416,375;M358,250 L404.6,310 L405,386;M358,250 L398.3,314.4 L390,390;M358,250 L399.1,313.9 L375,386;M358,250 L404.1,310.4 L364,375;M358,250 L411.4,304 L360,360"/>
  </path>

  <!-- crank, chainring, pedals, feet -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 360" to="360 390 360" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="390" cy="360" r="14" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="4 2"/>
    <line x1="390" y1="360" x2="420" y2="360" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <line x1="390" y1="360" x2="360" y2="360" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <circle cx="390" cy="360" r="6" fill="#222"/>
    <g transform="translate(420,360)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.5s" repeatCount="indefinite"/>
        <rect x="-10" y="2" width="20" height="4" rx="1.5" fill="#222"/>
        <path d="M-4,-3 L-4,2 L14,2 Q17,0 12,-1 Q4,-3 -4,-3 Z" fill="#3a3a3a"/>
        <path d="M6,-1 L13,2 M9,-1 L15,1" stroke="#222" stroke-width="1" fill="none"/>
      </g>
    </g>
    <g transform="translate(360,360)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.5s" repeatCount="indefinite"/>
        <rect x="-10" y="2" width="20" height="4" rx="1.5" fill="#222"/>
        <path d="M-4,-3 L-4,2 L14,2 Q17,0 12,-1 Q4,-3 -4,-3 Z" fill="#3a3a3a"/>
        <path d="M6,-1 L13,2 M9,-1 L15,1" stroke="#222" stroke-width="1" fill="none"/>
      </g>
    </g>
  </g>

  <!-- tail and body -->
  <path d="M298,226 L255,246 L262,236 L252,232 L300,212 Z" fill="#4a3d32"/>
  <ellipse cx="345" cy="218" rx="57" ry="37" transform="rotate(-15 345 218)" fill="#8a7a68"/>
  <path d="M310,215 Q345,198 385,212 Q360,240 320,236 Z" fill="#a39482" opacity="0.7"/>
  <path d="M300,205 Q320,195 340,200 M305,222 Q330,212 355,218" stroke="#6e5f50" stroke-width="2" fill="none"/>

  <!-- near leg -->
  <path fill="none" stroke="#4b4038" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M358,250 L425.9,284.2 L420,360">
    <animate attributeName="d" dur="1.5s" repeatCount="indefinite" values="M358,250 L425.9,284.2 L420,360;M358,250 L416.1,299 L416,375;M358,250 L404.6,310 L405,386;M358,250 L398.3,314.4 L390,390;M358,250 L399.1,313.9 L375,386;M358,250 L404.1,310.4 L364,375;M358,250 L411.4,304 L360,360;M358,250 L420.2,293.8 L364,345;M358,250 L428,279.5 L375,334;M358,250 L432.1,266.8 L390,330;M358,250 L432.8,263.3 L405,334;M358,250 L431.2,270.5 L416,345;M358,250 L425.9,284.2 L420,360"/>
  </path>

  <!-- neck -->
  <path d="M385,205 Q415,202 408,172 Q402,146 432,141" fill="none" stroke="#5a4636" stroke-width="18" stroke-linecap="round"/>
  <path d="M390,208 Q421,205 414,172 Q409,152 434,148" fill="none" stroke="#f3efe6" stroke-width="9" stroke-linecap="round"/>

  <!-- head and bill -->
  <circle cx="440" cy="138" r="15" fill="#f6f1e2"/>
  <ellipse cx="437" cy="128" rx="11" ry="6" fill="#efd25a"/>
  <path d="M449,131 L521,148 Q526,152 519,153 L449,148 Z" fill="#b5a589"/>
  <path d="M449,148 L519,153 Q490,181 452,153 Z" fill="#cbb99b"/>
  <path d="M515,147 Q528,149 523,157 Q520,153 516,153 Z" fill="#c0702f"/>
  <circle cx="444" cy="135" r="3" fill="#111"/>
  <circle cx="445" cy="134" r="1" fill="#fff"/>

  <!-- wing gripping handlebar -->
  <path d="M362,196 Q420,190 520,208 L527,221 Q430,226 370,240 Z" fill="#5e5144"/>
  <path d="M400,205 L500,214 M392,216 L505,220 M385,227 L470,226" stroke="#443a30" stroke-width="2" fill="none"/>
  <line x1="518" y1="213" x2="532" y2="226" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <path d="M514,208 L530,214 L528,226 L516,222 Z" fill="#4a3f34"/>
</svg>