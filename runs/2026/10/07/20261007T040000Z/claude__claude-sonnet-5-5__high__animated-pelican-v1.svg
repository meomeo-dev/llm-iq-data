<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>California brown pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecbf0"/>
      <stop offset="1" stop-color="#e6f5fb"/>
    </linearGradient>
    <g id="wheel">
      <circle r="75" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="69" fill="none" stroke="#b5b5b5" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="1.2">
        <line x1="-69" y1="0" x2="69" y2="0"/>
        <line x1="-69" y1="0" x2="69" y2="0" transform="rotate(22.5)"/>
        <line x1="-69" y1="0" x2="69" y2="0" transform="rotate(45)"/>
        <line x1="-69" y1="0" x2="69" y2="0" transform="rotate(67.5)"/>
        <line x1="-69" y1="0" x2="69" y2="0" transform="rotate(90)"/>
        <line x1="-69" y1="0" x2="69" y2="0" transform="rotate(112.5)"/>
        <line x1="-69" y1="0" x2="69" y2="0" transform="rotate(135)"/>
        <line x1="-69" y1="0" x2="69" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="6" fill="#555"/>
      <circle cx="0" cy="-60" r="3.5" fill="#e03a2f"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="40" fill="#fff3b0"/>
  <rect x="0" y="513" width="800" height="87" fill="#dcc9a0"/>
  <line x1="0" y1="513" x2="800" y2="513" stroke="#b9a57a" stroke-width="3"/>

  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-94.2 0" dur="0.2s" repeatCount="indefinite"/>
    <line x1="-200" y1="550" x2="1000" y2="550" stroke="#b9a57a" stroke-width="5" stroke-dasharray="50 44.2"/>
  </g>

  <!-- Wheels -->
  <g transform="translate(245 435)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel"/>
      <circle r="9" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="2 1.5"/>
    </g>
  </g>
  <g transform="translate(555 435)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Far crank, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 395 438" to="540 395 438" dur="2s" repeatCount="indefinite"/>
    <line x1="395" y1="438" x2="423" y2="438" stroke="#4a4a4a" stroke-width="5" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-180 423 438" to="-540 423 438" dur="2s" repeatCount="indefinite"/>
      <rect x="412" y="439" width="22" height="4" rx="1.5" fill="#1d1d1d"/>
      <path d="M416,434 L438,438 L442,441 L434,442 L416,442 Z" fill="#1f1e1d"/>
    </g>
  </g>

  <!-- Far leg -->
  <path fill="none" stroke="#242322" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M345,318 L406.9,368.7 L367,438">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M345,318 L406.9,368.7 L367,438;
              M345,318 L418,350.6 L375.2,418.2;
              M345,318 L423.2,335.1 L395,410;
              M345,318 L422.3,338.5 L414.8,418.2;
              M345,318 L414,358.5 L423,438;
              M345,318 L395.3,380.2 L414.8,457.8;
              M345,318 L386.4,386.5 L395,466;
              M345,318 L395.2,380.3 L375.2,457.8;
              M345,318 L406.9,368.7 L367,438"/>
  </path>

  <!-- Frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#c0392b" stroke-width="6">
      <line x1="245" y1="435" x2="395" y2="438"/>
      <line x1="245" y1="435" x2="352" y2="345"/>
      <line x1="395" y1="438" x2="352" y2="345"/>
      <line x1="352" y1="347" x2="508" y2="343"/>
      <line x1="395" y1="438" x2="516" y2="358"/>
    </g>
    <line x1="506" y1="336" x2="517" y2="362" stroke="#8e2a20" stroke-width="8"/>
    <line x1="516" y1="358" x2="555" y2="435" stroke="#8a8a8a" stroke-width="5"/>
    <line x1="352" y1="345" x2="346" y2="331" stroke="#8a8a8a" stroke-width="5"/>
    <line x1="508" y1="337" x2="504" y2="318" stroke="#8a8a8a" stroke-width="5"/>
    <path d="M504,318 L526,313 Q548,312 546,332" stroke="#2b2b2b" stroke-width="5"/>
    <!-- Chain -->
    <g stroke="#333" stroke-width="1.8" stroke-dasharray="3 2">
      <line x1="395" y1="423" x2="245" y2="427"/>
      <line x1="395" y1="453" x2="245" y2="443"/>
    </g>
  </g>

  <!-- Chainring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 395 438" to="360 395 438" dur="2s" repeatCount="indefinite"/>
    <circle cx="395" cy="438" r="15" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="3 2"/>
    <line x1="381" y1="438" x2="409" y2="438" stroke="#777" stroke-width="2"/>
    <line x1="395" y1="424" x2="395" y2="452" stroke="#777" stroke-width="2"/>
    <circle cx="395" cy="438" r="5" fill="#333"/>
  </g>

  <!-- Saddle -->
  <path d="M320,332 Q345,323 380,330 Q383,337 350,337 Q324,338 320,332 Z" fill="#222"/>

  <!-- Near crank, pedal, foot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 395 438" to="360 395 438" dur="2s" repeatCount="indefinite"/>
    <line x1="395" y1="438" x2="423" y2="438" stroke="#6a6a6a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="395" cy="438" r="5" fill="#444"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 423 438" to="-360 423 438" dur="2s" repeatCount="indefinite"/>
      <rect x="412" y="439" width="22" height="4" rx="1.5" fill="#1d1d1d"/>
      <path d="M416,434 L438,438 L442,441 L434,442 L416,442 Z" fill="#3a3836"/>
    </g>
  </g>

  <!-- Near leg -->
  <path fill="none" stroke="#3a3836" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M345,318 L414,358.5 L423,438">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
      values="M345,318 L414,358.5 L423,438;
              M345,318 L395.3,380.2 L414.8,457.8;
              M345,318 L386.4,386.5 L395,466;
              M345,318 L395.2,380.3 L375.2,457.8;
              M345,318 L406.9,368.7 L367,438;
              M345,318 L418,350.6 L375.2,418.2;
              M345,318 L423.2,335.1 L395,410;
              M345,318 L422.3,338.5 L414.8,418.2;
              M345,318 L414,358.5 L423,438"/>
  </path>

  <!-- Tail -->
  <path d="M302,288 L258,322 L274,332 L314,308 Z" fill="#4a3f35"/>
  <path d="M290,305 L268,326" stroke="#2f2721" stroke-width="2"/>

  <!-- Body -->
  <ellipse cx="350" cy="285" rx="62" ry="38" transform="rotate(-12 350 285)" fill="#8a7762"/>
  <ellipse cx="392" cy="290" rx="30" ry="24" transform="rotate(-12 392 290)" fill="#a39179"/>

  <!-- Neck -->
  <path d="M385,270 C418,262 398,228 424,206" fill="none" stroke="#efe8d4" stroke-width="20" stroke-linecap="round"/>
  <path d="M374,262 C402,250 384,224 411,199" fill="none" stroke="#6b4a30" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Head -->
  <circle cx="432" cy="192" r="15" fill="#f6f0dd"/>
  <path d="M418,188 Q430,171 447,184 Q434,179 418,188 Z" fill="#f0d060"/>
  <path d="M444,199 Q482,236 525,214 L520,210 Q482,210 444,199 Z" fill="#8c7b66"/>
  <path d="M442,185 L522,206 Q530,208 526,214 L442,199 Z" fill="#a8a79f"/>
  <path d="M520,205 Q533,206 528,217 L522,213 Z" fill="#d07a2a"/>
  <circle cx="438" cy="189" r="3.2" fill="#111"/>
  <circle cx="439" cy="188" r="1" fill="#fff"/>

  <!-- Wing reaching the handlebar -->
  <path d="M362,258 Q440,246 505,288 Q530,298 541,314 Q542,324 530,322 Q512,312 495,306 Q430,283 358,292 Z" fill="#5b4b3d"/>
  <g fill="none" stroke="#3c3028" stroke-width="2" stroke-linecap="round">
    <path d="M395,266 Q450,266 495,296"/>
    <path d="M385,276 Q445,278 500,304"/>
    <path d="M375,286 Q430,288 485,304"/>
  </g>
  <circle cx="538" cy="318" r="5" fill="#2b2b2b"/>
</svg>